name: Books Readonly Semantic Game Snapshot

on:
  pull_request:
    branches:
      - 'fix/books-variation-noninteractive-semantics-20261003'
    paths:
      - 'acs/book_board_workflow.py'
      - 'tests/test_v2_book_board_workflow.py'
      - '.github/workflows/books-readonly-semantic-game-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-readonly-semantic-game-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-snapshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='fix/books-variation-noninteractive-semantics-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            live_ref="refs/remotes/origin/$parent_branch"
            git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
            live_parent="$(git rev-parse "$live_ref")"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            git merge-base --is-ancestor "$live_parent" HEAD
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/books-readonly-semantic-game-snapshot.yml' \
              'acs/book_board_workflow.py' \
              'tests/test_v2_book_board_workflow.py' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/book_board_workflow.py)" = "673774dd51610f643b69ddfc8d513d5f0c2bddfe"
          test "$(git rev-parse HEAD:tests/test_v2_book_board_workflow.py)" = "df98fbde263b3ddaa8340b9c16ec61f8f20dde43"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile semantic snapshot boundary
        run: >-
          python -m compileall -q
          acs/book_board_workflow.py
          tests/test_v2_book_board_workflow.py

      - name: Prove read-only semantic snapshot and retained Book flow
        run: >-
          python -m unittest -v
          tests.test_v2_book_board_workflow
          tests.test_version2_book_workspace
