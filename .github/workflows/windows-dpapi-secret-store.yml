name: Windows DPAPI Secret Store

on:
  pull_request:
    paths:
      - "acs/secret_store.py"
      - "tests/test_secret_store.py"
      - ".github/workflows/windows-dpapi-secret-store.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile secret-store contract
        run: python -m py_compile acs/secret_store.py tests/test_secret_store.py
      - name: Run secret-store contract
        run: python -m unittest -v tests.test_secret_store
