name: Local Profile Identity Contract

on:
  push:
    branches:
      - work/local-profile-identity-foundation-20260929
  pull_request:
    paths:
      - "acs/local_profile.py"
      - "tests/test_local_profile.py"
      - ".github/workflows/local-profile-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-profile-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prove current Product merge and exact identity scope
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if test '${{ github.event_name }}' = 'pull_request'; then
            test "$PR_BASE_REF" = "work/full-product-teacher-education-reachability-20260911"
            test -n "$PR_BASE_SHA"
            test -n "$PR_HEAD_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git cat-file -e "$PR_HEAD_SHA^{commit}"

            # GitHub's pull_request checkout is the synthetic merge of the
            # current Product base and this exact identity head. Proving both
            # parents avoids a race against an independently moving base.
            test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"

            mapfile -t changed < <(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")
            printf '%s\n' "${changed[@]}"
            allowed='^(acs/local_profile\.py|tests/test_local_profile\.py|\.github/workflows/local-profile-identity\.yml)$'
            for path in "${changed[@]}"; do
              if [[ ! "$path" =~ $allowed ]]; then
                echo "Unexpected path in local-profile identity scope: $path" >&2
                exit 1
              fi
            done
            test "${#changed[@]}" -eq 3
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
            echo "LOCAL_PROFILE_IDENTITY_BASE=$PR_BASE_SHA"
            echo "LOCAL_PROFILE_IDENTITY_HEAD=$PR_HEAD_SHA"
            echo "LOCAL_PROFILE_IDENTITY_SCOPE=EXACT_THREE_PATHS"
          else
            expected='${{ github.sha }}'
            test "$(git rev-parse HEAD)" = "$expected"
            git diff --check HEAD^ HEAD
            echo "LOCAL_PROFILE_IDENTITY_EXACT_HEAD=$expected"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile identity boundary
        run: python -m py_compile acs/local_profile.py tests/test_local_profile.py

      - name: Run focused local-profile contract
        run: python -m unittest -v tests.test_local_profile
