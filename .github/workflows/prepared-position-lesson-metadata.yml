name: Prepared Position Lesson Metadata

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/education_workspace.py'
      - 'acs/prepared_position_authoring.py'
      - 'tests/test_prepared_position_authoring.py'
      - 'tests/test_prepared_position_lesson_metadata.py'
      - '.github/workflows/prepared-position-lesson-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepared-position-lesson-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepared-position-metadata:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact prepared-position metadata scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          event_base="$PR_BASE_SHA"
          base_ref="$PR_BASE_REF"
          test -n "$event_base"
          test -n "$base_ref"
          git cat-file -e "$event_base^{commit}"
          git fetch --no-tags origin "$base_ref"
          live_base="$(git rev-parse "origin/$base_ref")"
          git merge-base --is-ancestor "$event_base" "$live_base"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base" HEAD
          mapfile -t actual < <(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)
          expected=(
            '.github/workflows/prepared-position-lesson-metadata.yml'
            'acs/education_workspace.py'
            'acs/prepared_position_authoring.py'
            'tests/test_prepared_position_authoring.py'
            'tests/test_prepared_position_lesson_metadata.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected prepared-position metadata PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo "PREPARED_POSITION_METADATA_LIVE_PRODUCT_BASE=$live_base"
          echo 'PREPARED_POSITION_METADATA_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile metadata boundary
        run: >-
          python -m py_compile
          acs/education_workspace.py
          acs/prepared_position_authoring.py
          tests/test_prepared_position_authoring.py
          tests/test_prepared_position_lesson_metadata.py

      - name: Run metadata and adjacent durability contracts
        run: >-
          python -m unittest -v
          tests.test_prepared_position_authoring
          tests.test_prepared_position_lesson_metadata
          tests.test_d10_prepared_position_durability
          tests.test_education_workspace
          tests.test_education_workspace_store
