name: V2 Package Preflight Audit Oracle

on:
  push:
    branches:
      - audit/v2-package-preflight-authority-hygiene-20260828
  pull_request:
    paths:
      - 'tests/test_v2_package_preflight_audit.py'
      - '.github/workflows/v2-package-preflight-audit.yml'
      - 'acs/version2_package_preflight.py'

permissions:
  contents: read

concurrency:
  group: v2-package-preflight-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove evidence-only scope and exact owner ancestry
        shell: bash
        env:
          OWNER_HEAD: 5ea7ca44518cbe9c5789da3f017bde458be7faa8
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$OWNER_HEAD" HEAD
          test "$(git merge-base "$OWNER_HEAD" HEAD)" = "$OWNER_HEAD"
          git diff --check "$OWNER_HEAD" HEAD
          changed="$(git diff --name-only "$OWNER_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-package-preflight-audit.yml' \
            'tests/test_v2_package_preflight_audit.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$OWNER_HEAD" HEAD -- acs/version2_package_preflight.py acs/version2_upgrade.py acs/acsdb.py acs/settings.py

      - name: Compile audit oracle
        run: python -m compileall -q tests/test_v2_package_preflight_audit.py

      - name: Existing owner package-preflight regressions remain green
        run: python -m unittest -v tests.test_version2_package_preflight

      - name: Independent package authority and hygiene oracle
        run: python -m unittest -v tests.test_v2_package_preflight_audit
