name: Books Heading Path Reading Order

on:
  push:
    branches:
      - fix/books-heading-path-reading-order-20261004
  pull_request:
    branches:
      - fix/v2-release-native-event-schema-20261004
    paths:
      - 'web/full_product_books_training.js'
      - 'tests/js/books_training_surface_dom_test.js'
      - '.github/workflows/books-heading-path-reading-order.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-heading-path-reading-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and Book reading-order scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='6c2c23f55c0418d1b3059b55503904aba2148fda'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/v2-release-native-event-schema-20261004'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/books-heading-path-reading-order.yml'             'tests/js/books_training_surface_dom_test.js'             'web/full_product_books_training.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = "7094e8769d225f822bc87bb6853167a7f142125f"
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = "f3db3b970c6cd7f112e80d4a7e7c8d8359fdc182"

          echo 'BOOKS_HEADING_PATH_READING_ORDER_SCOPE=PASS'

      - name: Validate Books Training JavaScript
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - name: Adjacent Book semantic regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_bridge
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
