name: V2 Library Export Release Reachability

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_release_app.py'
      - 'acs/library_export_webview_projection.py'
      - 'acs/version2_application.py'
      - 'web/full_product_library.js'
      - 'web/version2_release_bootstrap.js'
      - 'tests/test_d07_library_export_webview.py'
      - 'tests/test_v2_library_export_release_reachability.py'
      - 'tests/test_v2_native_dialog_language.py'
      - 'tests/test_w3_library_dirty_replace_confirmation.py'
      - '.github/workflows/v2-library-export-release-reachability.yml'
  push:
    branches:
      - work/current-library-export-native-reachability-20260927
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-library-export-release-reachability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact checkout and bounded ownership
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          base="$(git rev-parse refs/remotes/origin/work/full-product-teacher-education-reachability-20260911)"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base...HEAD" | LC_ALL=C sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/v2-library-export-release-reachability.yml' \
            'acs/version2_release_app.py' \
            'acs/library_export_webview_projection.py' \
            'acs/version2_application.py' \
            'web/full_product_library.js' \
            'web/version2_release_bootstrap.js' \
            'tests/test_d07_library_export_webview.py' \
            'tests/test_v2_library_export_release_reachability.py' \
            'tests/test_v2_native_dialog_language.py' \
            'tests/test_w3_library_dirty_replace_confirmation.py' | LC_ALL=C sort)"
          test "$changed" = "$wanted"

          # Preserve the existing D07/D06 export authorities exactly.
          git diff --quiet "$base" HEAD -- \
            acs/library_export_service.py \
            acs/version2_windows_library_export.py \
            acs/pgn_service.py \
            acs/gametree.py \
            acs/acsdb.py

      - name: Compile owned release seam and canonical export owners
        run: >-
          python -m py_compile
          acs/version2_release_app.py
          acs/library_export_webview_projection.py
          acs/version2_application.py
          acs/library_export_service.py
          acs/version2_windows_library_export.py
          tests/test_d07_library_export_webview.py
          tests/test_v2_library_export_release_reachability.py
          tests/test_v2_native_dialog_language.py
          tests/test_w3_library_dirty_replace_confirmation.py

      - name: Validate Library WebView script syntax
        run: >-
          node --check web/full_product_library.js &&
          node --check web/version2_release_bootstrap.js

      - name: Run focused Library export reachability regressions
        run: >-
          python -m unittest -v
          tests.test_v2_library_export_release_reachability
          tests.test_v2_windows_library_export
          tests.test_version2_release_app
          tests.test_d07_library_export_service
          tests.test_d07_library_export_webview
          tests.test_d07_library_export_reachability
          tests.test_v2_windows_host_runtime
          tests.test_v2_library_export_dialog_language
          tests.test_v2_native_dialog_language
          tests.test_w3_library_dirty_replace_confirmation

      - name: Run Library and release integration guards
        run: >-
          python -m unittest -v
          tests.test_library_workspace_ui_integration
          tests.test_dev1_full_product_accessible_shell
          tests.test_dev1_full_product_webview_adapter

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Install pytest for repository pytest gate
        run: python -m pip install pytest==8.4.2

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
