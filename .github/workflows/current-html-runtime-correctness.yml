name: Current HTML Runtime Correctness

on:
  pull_request:
    branches:
      - fix/book-epub-digest-cancellation-20261006-ooxple7108
    paths:
      - '.github/workflows/current-html-runtime-correctness.yml'
      - 'acs/book_html_import.py'
      - 'tests/test_book_active_import_cancellation.py'
      - 'tests/test_book_html_runtime_correctness.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-html-runtime-correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HTML_IMPORT_BLOB: 00add608990e5ed200340c86be7587148140a48a
  ACTIVE_CANCEL_TEST_BLOB: d107470d0c12e940ba741e43dddf936e9a55cda4
  RUNTIME_TEST_BLOB: 7faf3fd0f71bf7627c09ae8483fd4cf548061ff1

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove exact bounded geometry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-html-runtime-correctness.yml' \
            'acs/book_html_import.py' \
            'tests/test_book_active_import_cancellation.py' \
            'tests/test_book_html_runtime_correctness.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = "$HTML_IMPORT_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_active_import_cancellation.py)" = "$ACTIVE_CANCEL_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_html_runtime_correctness.py)" = "$RUNTIME_TEST_BLOB"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python
        run: python -m py_compile acs/book_html_import.py tests/test_book_active_import_cancellation.py tests/test_book_html_runtime_correctness.py
      - name: Run active import and HTML runtime regressions
        run: python -m unittest tests.test_book_active_import_cancellation tests.test_book_html_runtime_correctness
