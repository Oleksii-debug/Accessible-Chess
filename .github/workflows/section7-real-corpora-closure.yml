name: Section 7 Real Corpora Closure

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

env:
  SECTION5_PREDECESSOR_SHA: 59b2810d06a1a6564438262271eb3e73e2282813

jobs:
  corpus-foundation-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact evidence-only geometry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SECTION5_PREDECESSOR_SHA" HEAD)" = "$SECTION5_PREDECESSOR_SHA"
          git diff --check "$SECTION5_PREDECESSOR_SHA"...HEAD
          actual="$(git diff --name-only "$SECTION5_PREDECESSOR_SHA"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/section7-real-corpora-closure.yml' 'docs/automation/SECTION7_CLOSURE_AUDIT.md' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test "$(git hash-object docs/P0F_STARTER_CONTENT_PROVENANCE.md)" = "3298aed00ca000d27f607cd861abbba9483ff358"
          test "$(git hash-object acs/starter_books_training_content.py)" = "04bbc4aaf44bf9421f7e02adeb10c965ef3f1d9d"
      - name: Compile cross-format foundation
        run: >-
          python -m py_compile
          acs/chesscore.py
          acs/pgn_roundtrip.py
          acs/acsdb.py
          acs/bookdocument.py
          acs/book_text_import.py
          acs/book_html_import.py
          acs/book_epub_import.py
          acs/chessbase_adapter.py
      - name: Execute representative corpus and adversarial contracts
        run: >-
          python -m unittest -v
          tests.test_fen_edge_corpus
          tests.test_d06_real_corpus
          tests.test_d07_search_scalar_equivalence
          tests.test_markdown_library_journey
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import
          tests.test_chessbase_adapter
          tests.test_chessbase_integrity
          tests.test_v2_2cbh_cbone_topology
          tests.test_v2_chessbase_chess960_capability_boundary
          tests.test_p0f_lawful_starter_bundle
          tests.test_book_training_large_reading_journey
      - name: Core selftest
        run: python -m acs.selftest
