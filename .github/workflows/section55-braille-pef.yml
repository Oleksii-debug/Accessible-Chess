name: Section 55 Braille PEF foundation
on:
  pull_request:
    paths:
      - "acs/chess_braille_factory.py"
      - "acs/chess_braille_brf.py"
      - "acs/chess_braille_bundle.py"
      - "acs/chess_braille_tables.py"
      - "acs/chess_braille_html.py"
      - "acs/chess_braille_ukaaf2015.py"
      - "tools/section55_braille_pef.py"
      - "tools/section55_verify_bundle.py"
      - "tools/section55_batch.py"
      - "tests/test_section55_chess_braille_factory.py"
      - "tests/test_section55_chess_braille_brf.py"
      - "tests/test_section55_local_cli_package.py"
      - "tests/test_section55_braille_bundle.py"
      - "tests/test_section55_liblouis_tables.py"
      - "tests/test_section55_batch.py"
      - "tests/test_section55_chess_braille_html.py"
      - "tests/test_section55_ukaaf2015_chess.py"
      - ".github/workflows/section55-braille-pef.yml"
  push:
    branches:
      - main
    paths:
      - "acs/chess_braille_factory.py"
      - "acs/chess_braille_brf.py"
      - "acs/chess_braille_bundle.py"
      - "acs/chess_braille_tables.py"
      - "acs/chess_braille_html.py"
      - "acs/chess_braille_ukaaf2015.py"
      - "tools/section55_braille_pef.py"
      - "tools/section55_verify_bundle.py"
      - "tools/section55_batch.py"
      - "tests/test_section55_chess_braille_factory.py"
      - "tests/test_section55_chess_braille_brf.py"
      - "tests/test_section55_local_cli_package.py"
      - "tests/test_section55_braille_bundle.py"
      - "tests/test_section55_liblouis_tables.py"
      - "tests/test_section55_batch.py"
      - "tests/test_section55_chess_braille_html.py"
      - "tests/test_section55_ukaaf2015_chess.py"
      - ".github/workflows/section55-braille-pef.yml"
  workflow_dispatch:
jobs:
  provisional-pef:
    name: Fail-closed synthetic PEF tests (not device qualification)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check syntax
        run: python -m compileall -q acs/chess_braille_factory.py acs/chess_braille_brf.py acs/chess_braille_bundle.py acs/chess_braille_tables.py acs/chess_braille_html.py acs/chess_braille_ukaaf2015.py tools/section55_braille_pef.py tools/section55_verify_bundle.py tools/section55_batch.py tests/test_section55_chess_braille_factory.py tests/test_section55_chess_braille_brf.py tests/test_section55_local_cli_package.py tests/test_section55_braille_bundle.py tests/test_section55_liblouis_tables.py tests/test_section55_batch.py tests/test_section55_chess_braille_html.py tests/test_section55_ukaaf2015_chess.py
      # A single unittest process preserves the exit status on both Bash and
      # Windows PowerShell; multiple commands in one run block hid failures.
      - name: Run synthetic structural and negative-path tests
        run: python -m unittest discover -s tests -p "test_section55_*.py" -v
