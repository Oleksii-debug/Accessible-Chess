name: Local Profile Identity Contract

on:
  push:
    branches:
      - work/local-profile-identity-foundation-20260929
  pull_request:
    paths:
      - "acs/local_profile.py"
      - "tests/test_local_profile.py"
      - "tests/js/version2_library_open_route_refresh_dom_test.js"
      - "tests/js/version2_release_bootstrap_dom_test.js"
      - "tests/test_v2_native_dialog_language.py"
      - "tests/test_version2_composition_publication_boundary.py"
      - "tests/test_version2_composition_startup_cleanup.py"
      - "tests/test_version2_composition_startup_cleanup_current.py"
      - "tests/test_version2_release_accessibility_contract.py"
      - "tests/test_w6_v2_language_owner_current.py"
      - ".github/workflows/local-profile-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-profile-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact candidate and pull-request scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          echo "LOCAL_PROFILE_IDENTITY_EXACT_HEAD=$expected"

          if test '${{ github.event_name }}' = 'pull_request'; then
            event_base='${{ github.event.pull_request.base.sha }}'
            base_ref='${{ github.event.pull_request.base.ref }}'
            test -n "$event_base"
            test -n "$base_ref"
            git cat-file -e "${event_base}^{commit}"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
            git merge-base --is-ancestor "$event_base" "$live_base"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            changed="$(git diff --name-only "$live_base" HEAD | sort)"
            if test "$base_ref" = 'feature/local-profile-first-launch-ui-20260929'; then
              expected_paths="$(printf '%s\n' \
                '.github/workflows/local-profile-first-launch-ui.yml' \
                '.github/workflows/p0-release-critical-triad-convergence.yml' \
                '.github/workflows/local-profile-identity.yml' \
                'acs/local_profile.py' \
                'tests/js/version2_library_open_route_refresh_dom_test.js' \
                'tests/js/version2_release_bootstrap_dom_test.js' \
                'tests/test_local_profile.py' \
                'tests/test_p0_release_critical_triad_convergence.py' \
                'tests/test_v2_native_dialog_language.py' \
                'tests/test_version2_composition_publication_boundary.py' \
                'tests/test_version2_composition_startup_cleanup.py' \
                'tests/test_version2_composition_startup_cleanup_current.py' \
                'tests/test_version2_local_profile_ui_contract.py' \
                'tests/test_version2_release_accessibility_contract.py' \
                'tests/test_w6_v2_language_owner_current.py' | sort)"
              scope='EXACT_MUTATION_SUCCESSOR_FIFTEEN_PATHS'
            elif test "$base_ref" = 'work/local-profile-identity-foundation-20260929'; then
              expected_paths="$(printf '%s\n' \
                '.github/workflows/local-profile-first-launch-ui.yml' \
                '.github/workflows/local-profile-identity.yml' \
                '.github/workflows/p0-release-critical-triad-convergence.yml' \
                'acs/local_profile.py' \
                'acs/version2_local_profile_api.py' \
                'acs/version2_release_app.py' \
                'tests/test_local_profile.py' \
                'tests/test_p0_release_critical_triad_convergence.py' \
                'tests/test_version2_local_profile_api.py' \
                'tests/test_version2_local_profile_ui_contract.py' \
                'web/version2_release_bootstrap.js' | sort)"
              scope='EXACT_ROOT_ELEVEN_PATHS'
            else
              printf 'Unexpected local-profile identity base: %s\n' "$base_ref" >&2
              exit 1
            fi
            test "$changed" = "$expected_paths" || {
              printf 'Unexpected local-profile identity scope:\n%s\n' "$changed" >&2
              exit 1
            }
            git diff --check "$live_base" HEAD
            echo "LOCAL_PROFILE_IDENTITY_EVENT_BASE=$event_base"
            echo "LOCAL_PROFILE_IDENTITY_LIVE_BASE=$live_base"
            echo "LOCAL_PROFILE_IDENTITY_SCOPE=$scope"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile identity boundary
        run: python -m py_compile acs/local_profile.py tests/test_local_profile.py

      - name: Run focused local-profile contract
        run: python -m unittest -v tests.test_local_profile
