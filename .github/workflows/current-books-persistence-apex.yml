name: Current Books Semantic + Persistence Apex Convergence

on:
  push:
    branches:
      - converge/current-books-persistence-apex-20261006-zftrkmo
  pull_request:
    branches:
      - fix/current-local-profile-durable-publication-20261006-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-books-persistence-apex-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PRODUCT_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
  PERSISTENCE_BASE_SHA: 9a11e447de3a745aa3ce26084892b74445b68133
  PRE_NAV_APEX_SHA: df42b54bbffa40731d17ea3242eb49c7d379412d
  NAVIGATION_SOURCE_SHA: cda6b3654514d4792f2cf1d820210e78321777be

jobs:
  converge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove absorbed Books authority and exact scope
        shell: bash
        run: |
          set -euo pipefail
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$head"
          git cat-file -e "$PRODUCT_SHA^{commit}"
          git cat-file -e "$PERSISTENCE_BASE_SHA^{commit}"
          git cat-file -e "$PRE_NAV_APEX_SHA^{commit}"
          git cat-file -e "$NAVIGATION_SOURCE_SHA^{commit}"
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"
          test "$(git merge-base "$PERSISTENCE_BASE_SHA" HEAD)" = "$PERSISTENCE_BASE_SHA"
          git merge-base --is-ancestor "$PRE_NAV_APEX_SHA" "$NAVIGATION_SOURCE_SHA"
          git merge-base --is-ancestor "$NAVIGATION_SOURCE_SHA" HEAD
          git diff --check "$PERSISTENCE_BASE_SHA"...HEAD

          mapfile -t leaf_paths < <(git diff --name-only "$PRE_NAV_APEX_SHA"..."$NAVIGATION_SOURCE_SHA" | sort)
          leaf_expected=(
            ".github/workflows/books-navigation-abort-rollback.yml"
            "acs/book_board_workflow.py"
            "acs/bookreader.py"
            "tests/test_bookreader_revision_barriers_current.py"
            "tests/test_dev1_books_training_webview_bridge.py"
            "tests/test_v2_book_board_workflow.py"
          )
          test "${#leaf_paths[@]}" -eq "${#leaf_expected[@]}"
          for i in "${!leaf_expected[@]}"; do
            test "${leaf_paths[$i]}" = "${leaf_expected[$i]}"
          done

          mapfile -t expected < <(git diff --name-only "$PERSISTENCE_BASE_SHA"..."$NAVIGATION_SOURCE_SHA" | sort)
          mapfile -t actual < <(git diff --name-only "$PERSISTENCE_BASE_SHA"...HEAD | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${actual[$i]}" = "${expected[$i]}"
          done

          mapfile -t integration_delta < <(git diff --name-only "$NAVIGATION_SOURCE_SHA"...HEAD | sort)
          test "${#integration_delta[@]}" -eq 1
          test "${integration_delta[0]}" = ".github/workflows/current-books-persistence-apex.yml"
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.yml' || true)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile semantic, WebView, Board and recovery boundaries
        run: >-
          python -m py_compile
          acs/bookreader.py
          acs/book_board_workflow.py
          acs/version2_book_workspace.py
          acs/book_webview_bridge.py
          acs/book_webview_projection.py
          acs/training_webview_bridge.py
          acs/training_webview_projection.py
          acs/gametree_resume.py
          acs/version2_gametree_resume.py
          acs/local_profile.py
          acs/version2_local_profile_api.py
          tests/test_bookreader.py
          tests/test_bookreader_revision_barriers_current.py
          tests/test_v2_book_board_workflow.py
          tests/test_dev1_books_training_webview_bridge.py
          tests/test_dev1_books_training_webview_projection.py
          tests/test_version2_book_workspace.py

      - name: Execute Books semantic, navigation and abort-atomicity regressions
        run: >-
          python -m unittest -v
          tests.test_bookreader
          tests.test_bookreader_revision_barriers_current
          tests.test_book_engine_authority_passive_ingress
          tests.test_version2_book_workspace
          tests.test_books_semantic_host_bounds
          tests.test_v2_book_board_workflow
          tests.test_book_bidirectional_semantic_navigation
          tests.test_dev1_books_training_webview_bridge
          tests.test_dev1_books_training_webview_projection

      - name: Execute persistence and recovery regressions
        run: >-
          python -m unittest -v
          tests.test_d06_gametree_snapshot_resume
          tests.test_d06_v2_gametree_resume_reachability
          tests.test_local_profile
          tests.test_version2_local_profile_api

      - name: Core selftest
        run: python -m acs.selftest
