name: PGN Stale Browser Command Recovery

on:
  pull_request:
    branches:
      - 'fix/pgn-post-mutation-presentation-20261003'
    paths:
      - '.github/workflows/pgn-stale-browser-command-recovery.yml'
      - 'acs/pgn_workspace_webview_adapter.py'
      - 'tests/test_dev1_pgn_workspace_webview_adapter.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-stale-browser-command-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale-command-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live #1435 parent and exact scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='fix/pgn-post-mutation-presentation-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin             "+refs/heads/$parent_branch:refs/remotes/origin/$parent_branch"
          live_parent="$(git rev-parse "refs/remotes/origin/$parent_branch")"
          git merge-base --is-ancestor "$live_parent" HEAD

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n'               '.github/workflows/pgn-stale-browser-command-recovery.yml'               'acs/pgn_workspace_webview_adapter.py'               'tests/test_dev1_pgn_workspace_webview_adapter.py' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/pgn_workspace_webview_adapter.py)" = "be40f5b66bb881d852decaaf6aa034a73ac4672b"
          test "$(git rev-parse HEAD:tests/test_dev1_pgn_workspace_webview_adapter.py)" = "9f39fa31540638a5fe48ecfad28bf4c92aec09fe"

          # Retain the #1435 fail-closed presentation recovery authority.
          test "$(git rev-parse HEAD:acs/pgn_webview_projection.py)" = "ee0c3a002a6877694c9a92ec09bddb30018951ec"
          test "$(git rev-parse HEAD:acs/pgn_webview_bridge.py)" = "c73225a8f5e177833770f173fa7839ed924003b1"
          test "$(git rev-parse HEAD:web/full_product_pgn.js)" = "1a169994d00314190cec8a90b1c0fe79c77d5c0b"
          test "$(git rev-parse HEAD:tests/js/pgn_tree_keyboard_dom_test.js)" = "5ba41954d0aa3beddc878eb69f290a062a74fd01"

      - name: Validate retained browser recovery semantics
        run: |
          node --check web/full_product_pgn.js
          node --check tests/js/pgn_tree_keyboard_dom_test.js
          node tests/js/pgn_tree_keyboard_dom_test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile stale-command boundary
        run: >-
          python -m py_compile
          acs/pgn_workspace_webview_adapter.py
          tests/test_dev1_pgn_workspace_webview_adapter.py

      - name: Prove canonical stale-command rejection and retained PGN authority
        run: >-
          python -m unittest -v
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_webview_atomicity
          tests.test_version2_pgn_commands
          tests.test_v2_pgn_semantic_fidelity
          tests.test_v2_pgn_nested_comment_recovery

      - name: Verify tracked diff
        shell: bash
        run: git diff --check
