name: W2 FP01 D03 Engine Composition

on:
  workflow_dispatch:
  push:
    branches:
      - autopulse/w2-fp-01-d03-engine-composition-20260825
  pull_request:
    branches:
      - autopulse/d03-uci-output-bounds-20260823
    paths:
      - acs/engine.py
      - tests/test_d03_stockfish_hard_shutdown.py
      - .github/workflows/w2-fp-01-d03-engine-composition.yml

permissions:
  contents: read

concurrency:
  group: w2-fp-01-d03-engine-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      D03_FULL_PRODUCT_PARENT: 61e381b2aa8755590082a6e15a61edc5a6774879
      D03_STAGE1_HARD_SHUTDOWN_SOURCE: d3f3e8e49fa9e9932e9c66d7c85f67cbfc7e7347
      D03_STAGE1_TEST_BLOB: b2b69ce8671317890129f17d18489064716046dd
      D03_COMPOSED_ENGINE_BLOB: 01324ff735908dcc2b6515310eef9cbc8572e7ef
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact Git bytes and prove ancestry scope blobs
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          test "$(git merge-base "$D03_FULL_PRODUCT_PARENT" HEAD)" = "$D03_FULL_PRODUCT_PARENT"
          git diff --check "$D03_FULL_PRODUCT_PARENT" HEAD
          changed="$(git diff --name-only "$D03_FULL_PRODUCT_PARENT" HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(acs/engine.py|tests/test_d03_stockfish_hard_shutdown.py|\.github/workflows/w2-fp-01-d03-engine-composition.yml)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected W2-FP-01 scope:\n%s\n' "$unexpected" >&2; exit 1; }
          test "$(git rev-parse "$D03_STAGE1_HARD_SHUTDOWN_SOURCE:tests/test_d03_stockfish_hard_shutdown.py")" = "$D03_STAGE1_TEST_BLOB"
          test "$(git hash-object tests/test_d03_stockfish_hard_shutdown.py)" = "$D03_STAGE1_TEST_BLOB"
          test "$(git hash-object acs/engine.py)" = "$D03_COMPOSED_ENGINE_BLOB"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest

      - name: Compile Product and tests
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Prove output bounds and hard shutdown together
        run: >-
          python -m unittest -v
          tests.test_d03_uci_output_bounds
          tests.test_dev3_uci_failure_recovery
          tests.test_d03_stockfish_hard_shutdown
          tests.test_stockfish_runtime
          tests.test_analysis_service
          tests.test_engine_play_service
          tests.test_engine_play_service_concurrency

      - name: Acquire official Stockfish 18 Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip' -OutFile stockfish18.zip
          Expand-Archive stockfish18.zip stockfish18 -Force
          $engine=Get-ChildItem stockfish18 -Recurse -Filter '*.exe' | Where-Object {$_.Name -match 'stockfish.*x86-64'} | Select-Object -First 1
          if(-not $engine){throw 'Official Stockfish 18 executable missing'}
          New-Item -ItemType Directory -Force -Path real-engine | Out-Null
          Copy-Item $engine.FullName 'real-engine\stockfish.exe' -Force
          $hash=(Get-FileHash 'real-engine\stockfish.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "W2-FP-01 OFFICIAL STOCKFISH 18 WINDOWS SHA256: $hash"

      - name: Real Stockfish 18 composed lifecycle smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import pathlib
          import re
          from acs.engine import UCIEngine

          exe = (pathlib.Path.cwd() / 'real-engine' / 'stockfish.exe').resolve()
          fen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
          move_re = re.compile(r'^[a-h][1-8][a-h][1-8][qrbn]?$')
          engine = UCIEngine(str(exe))
          engine.start()
          proc = engine.proc
          assert proc is not None and proc.poll() is None
          lines = engine.analyze(fen, multipv=5, depth=8)
          assert len(lines) == 5, lines
          move = engine.best_move(fen, skill_level=10, movetime_ms=100)
          assert move is not None and move_re.fullmatch(move), move
          engine.close()
          assert engine.proc is None
          assert proc.poll() is not None, 'Stockfish process survived adapter close'
          print('W2-FP-01 REAL STOCKFISH COMPOSED ENGINE PASS')
          '@ | Set-Content -Encoding UTF8 w2_fp01_real_stockfish.py
          python w2_fp01_real_stockfish.py
          if($LASTEXITCODE -ne 0){throw 'real Stockfish composed engine smoke failed'}

      - name: Full unittest regression
        run: python -m unittest discover -s tests -v

      - name: Full pytest regression
        run: python -m pytest -q

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
