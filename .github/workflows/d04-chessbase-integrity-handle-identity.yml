name: D04 ChessBase Integrity Current Convergence

on:
  push:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - '.github/workflows/d04-chessbase-integrity-handle-identity.yml'
      - 'acs/chessbase_integrity.py'
      - 'acs/import_contract.py'
      - 'tests/test_d04_chessbase_integrity_handle_identity.py'
      - 'tests/test_dev4_chessbase_integrity_atomicity.py'
      - 'tests/test_dev4_chessbase_integrity_io_observability.py'
      - 'tests/test_d04_chessbase_integrity_current_workflow.py'
  pull_request:
    paths:
      - '.github/workflows/d04-chessbase-integrity-handle-identity.yml'
      - 'acs/chessbase_integrity.py'
      - 'acs/import_contract.py'
      - 'tests/test_d04_chessbase_integrity_handle_identity.py'
      - 'tests/test_dev4_chessbase_integrity_atomicity.py'
      - 'tests/test_dev4_chessbase_integrity_io_observability.py'
      - 'tests/test_d04_chessbase_integrity_current_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d04-chessbase-integrity-current-${{ github.ref }}
  cancel-in-progress: true

env:
  INTEGRITY_BLOB: c08f0869f996d4ec428a90c64e9846374a720562

jobs:
  current-integrity-convergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Bind exact candidate geometry and retained D04 source
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-}"
          if test -z "$base"; then
            base="${PUSH_BASE_SHA:-}"
          fi
          if test -z "$base" || test "$base" = "0000000000000000000000000000000000000000"; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          test "$(git rev-parse HEAD:acs/chessbase_integrity.py)" = "$INTEGRITY_BLOB"
          echo "D04_CURRENT_CANDIDATE_BASE=$base"
          echo "D04_INTEGRITY_SOURCE_BLOB=$INTEGRITY_BLOB"

      - name: Compile integrity boundary and oracles
        run: >-
          python -m py_compile
          acs/chessbase_integrity.py
          acs/import_contract.py
          tests/test_d04_chessbase_integrity_handle_identity.py
          tests/test_dev4_chessbase_integrity_atomicity.py
          tests/test_dev4_chessbase_integrity_io_observability.py
          tests/test_d04_chessbase_integrity_current_workflow.py

      - name: Focused integrity regressions
        run: >-
          python -m unittest -v
          tests.test_d04_chessbase_integrity_handle_identity
          tests.test_dev4_chessbase_integrity_atomicity
          tests.test_dev4_chessbase_integrity_io_observability
          tests.test_d04_chessbase_integrity_current_workflow
          tests.test_chessbase_integrity
          tests.test_import_contract

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_d04_chessbase_integrity_handle_identity.py
          tests/test_dev4_chessbase_integrity_atomicity.py
          tests/test_dev4_chessbase_integrity_io_observability.py
          tests/test_d04_chessbase_integrity_current_workflow.py
          tests/test_chessbase_integrity.py
          tests/test_import_contract.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
