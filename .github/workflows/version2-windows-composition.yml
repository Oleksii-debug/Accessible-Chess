name: Accessible Chess Version 2 Windows Composition

on:
  push:
    branches:
      - work/full-product-teacher-education-reachability-20260911
  pull_request:
    paths:
      - 'run_accessible_chess_v2.py'
      - 'acs/version2_profile.py'
      - 'acs/version2_application.py'
      - 'acs/version2_pgn_commands.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_release_ui.py'
      - 'acs/version2_final_release.py'
      - 'acs/version2_windows_*.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_native_menu.py'
      - 'acs/library_webview_projection.py'
      - 'acs/stage1_release_ui.py'
      - 'web/version2_release_bootstrap.js'
      - 'web/version2_final_product_bootstrap.js'
      - 'tests/test_version2_*.py'
      - 'tests/test_v2_windows_*.py'
      - 'tests/test_v2_board_analysis_hotkey_feedback.py'
      - 'tests/test_p0_semantic_document_copy.py'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - 'tests/js/version2_library_open_route_refresh_dom_test.js'
      - '.github/workflows/version2-windows-composition.yml'

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-windows-composition-${{ github.ref }}
  cancel-in-progress: true

env:
  V2_FORMATS_UPSTREAM: b18ac89bb7f1ef3d4106517fe3521179ab4522a1
  V2_ACCEPTED_STAGE1_BOOTSTRAP_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  V2_ACCEPTED_SOUND_STAGE1_BOOTSTRAP_BLOB: 45a192d93f91f8a564a36b6cfe1b216c2f81a409
  V2_ACCEPTED_STAGE1_UI_BLOB: 16e78af6219c8c36f0c4026942ef1d02875a370a
  V2_ACCEPTED_P0G_STAGE1_UI_BLOB: c8629e690a10fa8e10a2053fdc85284f635d2beb
  V2_ACCEPTED_ENGINE_TIMEOUT_STAGE1_UI_BLOB: 2ac3ca8943e6a4a819e4f273992167f9cf0b47ce
  V2_ACCEPTED_TAKEBACK_STAGE1_CORE_BLOB: b579ca0f59ba20f6b69b3a4b7d89589256d54852
  V2_ACCEPTED_SOUND_STAGE1_CORE_BLOB: cb89d8d2d204545096568134637b39c888cf17b8
  V2_ACCEPTED_SOUND_STAGE1_UI_BLOB: 23e5bcdde11acdb963515bea4bc4a93473dbbd05
  V2_ACCEPTED_SOUND_RELEASE_APP_BLOB: dbbcaabd4f6df0ab615095949d464d1371b0ffef
  V2_ACCEPTED_PGN_WORKSPACE_BLOB: b59e6bfff9806dff2092e5c7f93b68daff6407ef
  V2_ACCEPTED_CURRENT_PGN_WORKSPACE_BLOB: 4c99aca4bb304bdad09c75e745699b57aef769cf
  V2_ACCEPTED_CURRENT_PGN_DOCUMENT_BLOB: 699befd9a98553adb2b4050afd53c0017962be38
  V2_ACCEPTED_CURRENT_PGN_SERVICE_BLOB: f85d605d1eccd6d1246421602ccdd07ba2331ebd
  V2_ACCEPTED_RELEASE_PREFLIGHT_BLOB: 6ec93d183da623c80c15b542fb7095725b91af52

jobs:
  composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove Version 2 ancestry and convergence-safe isolation
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "$V2_FORMATS_UPSTREAM^{commit}"
          git merge-base --is-ancestor "$V2_FORMATS_UPSTREAM" HEAD

          expected_head="${PR_HEAD_SHA:-}"
          if [ -n "$expected_head" ]; then
            test "$(git rev-parse HEAD)" = "$expected_head"
          fi

          event_base="${PR_BASE_SHA:-}"
          base_ref="${PR_BASE_REF:-}"
          if [ -n "$event_base" ]; then
            git cat-file -e "$event_base^{commit}" || git fetch --no-tags origin "$event_base"
            if [ "$base_ref" = "$PRODUCT_BRANCH" ]; then
              git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
              live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")"
              git cat-file -e "$live_product^{commit}"
              git merge-base --is-ancestor "$event_base" "$live_product"
              git merge-base --is-ancestor "$live_product" HEAD
              test "$(git merge-base "$live_product" HEAD)" = "$live_product"
              scope_base="$live_product"
              echo "V2_COMPOSITION_EVENT_BASE=$event_base"
              echo "V2_COMPOSITION_PRODUCT_PARENT=$live_product"
            else
              scope_base="$event_base"
              git merge-base --is-ancestor "$scope_base" HEAD
              test "$(git merge-base "$scope_base" HEAD)" = "$scope_base"
              echo "V2_COMPOSITION_STACKED_PARENT=$scope_base"
            fi
          else
            push_base="${PUSH_BASE_SHA:-}"
            zero_sha='0000000000000000000000000000000000000000'
            if [ -n "$push_base" ] && [ "$push_base" != "$zero_sha" ]; then
              scope_base="$push_base"
            else
              scope_base="$(git rev-parse HEAD^)"
            fi
            git cat-file -e "$scope_base^{commit}" || git fetch --no-tags origin "$scope_base"
            git merge-base --is-ancestor "$scope_base" HEAD
            test "$(git merge-base "$scope_base" HEAD)" = "$scope_base"
          fi
          git diff --check "$scope_base" HEAD

          actual_stage1_bootstrap_blob="$(git rev-parse HEAD:web/stage1_release_bootstrap.js)"
          if [ "$actual_stage1_bootstrap_blob" != "$V2_ACCEPTED_SOUND_STAGE1_BOOTSTRAP_BLOB" ]; then
            if [ "$actual_stage1_bootstrap_blob" != "$V2_ACCEPTED_STAGE1_BOOTSTRAP_BLOB" ]; then
              echo "Unexpected Stage 1 bootstrap blob: $actual_stage1_bootstrap_blob" >&2
              exit 1
            fi
          fi

          actual_pgn_workspace_blob="$(git rev-parse HEAD:acs/pgn_workspace.py)"
          case "$actual_pgn_workspace_blob" in
            "$V2_ACCEPTED_PGN_WORKSPACE_BLOB"|"$V2_ACCEPTED_CURRENT_PGN_WORKSPACE_BLOB")
              ;;
            *)
              echo "Unexpected canonical PGN workspace blob: $actual_pgn_workspace_blob" >&2
              exit 1
              ;;
          esac

          changed="$(git diff --name-only "$scope_base" HEAD | sort)"
          if printf '%s\n' "$changed" | grep -Fxq 'acs/stage1_release_ui_core.py'; then
            actual_stage1_core_blob="$(git rev-parse HEAD:acs/stage1_release_ui_core.py)"
            # The takeback-recovery successor is canonical Product; the sound
            # candidate is accepted only by its exact reviewed blob identity.
            if [ "$actual_stage1_core_blob" != "$V2_ACCEPTED_SOUND_STAGE1_CORE_BLOB" ]; then
              if [ "$actual_stage1_core_blob" != "$V2_ACCEPTED_TAKEBACK_STAGE1_CORE_BLOB" ]; then
                echo "Unexpected Stage 1 core blob: $actual_stage1_core_blob" >&2
                exit 1
              fi
            fi
          fi

          if printf '%s\n' "$changed" | grep -Fxq 'acs/stage1_release_ui.py'; then
            actual_stage1_ui_blob="$(git rev-parse HEAD:acs/stage1_release_ui.py)"
            case "$actual_stage1_ui_blob" in
              "$V2_ACCEPTED_STAGE1_UI_BLOB"|"$V2_ACCEPTED_P0G_STAGE1_UI_BLOB"|"$V2_ACCEPTED_ENGINE_TIMEOUT_STAGE1_UI_BLOB"|"$V2_ACCEPTED_SOUND_STAGE1_UI_BLOB")
                ;;
              *)
                echo "Unexpected Stage 1 release facade blob: $actual_stage1_ui_blob" >&2
                exit 1
                ;;
            esac
          fi

          if printf '%s\n' "$changed" | grep -Fxq 'acs/release_preflight.py'; then
            actual_release_preflight_blob="$(git rev-parse HEAD:acs/release_preflight.py)"
            if [ "$actual_release_preflight_blob" != "$V2_ACCEPTED_RELEASE_PREFLIGHT_BLOB" ]; then
              echo "Unexpected release preflight blob: $actual_release_preflight_blob" >&2
              exit 1
            fi
          fi

          unapproved_changed="$(printf '%s\n' "$changed" | grep -Ev '^(web/stage1_release_bootstrap\.js|acs/stage1_release_ui\.py|acs/stage1_release_ui_core\.py|acs/release_preflight\.py)$' || true)"
          if printf '%s\n' "$unapproved_changed" | grep -E '(^|/)(stage1|tools/qa/|windows-stage1|release_preflight)'; then
            echo 'Stage 1 or strict-release contamination detected' >&2
            exit 1
          fi

          if printf '%s\n' "$changed" | grep -Fxq 'acs/release_app.py'; then
            actual_release_app_blob="$(git rev-parse HEAD:acs/release_app.py)"
            if [ "$actual_release_app_blob" != "$V2_ACCEPTED_SOUND_RELEASE_APP_BLOB" ]; then
              echo "Unexpected release composition blob: $actual_release_app_blob" >&2
              exit 1
            fi
          fi

          for path_blob in \
            "acs/pgn_document.py:$V2_ACCEPTED_CURRENT_PGN_DOCUMENT_BLOB" \
            "acs/pgn_service.py:$V2_ACCEPTED_CURRENT_PGN_SERVICE_BLOB"; do
            path="${path_blob%%:*}"
            accepted="${path_blob#*:}"
            if printf '%s\n' "$changed" | grep -Fxq "$path"; then
              actual="$(git rev-parse "HEAD:$path")"
              test "$actual" = "$accepted" || {
                echo "Unexpected reviewed PGN integration blob: $path $actual" >&2
                exit 1
              }
            fi
          done

          git diff --quiet "$scope_base" HEAD -- \
            run_accessible_chess.py \
            acs/chesscore.py acs/gametree.py \
            web/stage1_board_actions.js \
            tools/qa

      - name: Compile Python package
        run: python -m compileall -q acs tests run_accessible_chess.py run_accessible_chess_v2.py

      - name: Parse and execute retained Version 2 web surfaces
        run: |
          node --check web/full_product_pgn.js
          node --check web/full_product_library.js
          node --check web/full_product_books_training.js
          node --check web/version2_release_bootstrap.js
          node tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/version2_library_open_route_refresh_dom_test.js

      - name: Version 2 release host contracts
        run: >-
          python -m unittest -v
          tests.test_version2_release_app
          tests.test_version2_release_ui
          tests.test_version2_application
          tests.test_version2_shutdown
          tests.test_version2_pgn_commands
          tests.test_version2_import_terminal_ui
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_library_import_observer
          tests.test_w3_windows_file_action_ui_thread_affinity
          tests.test_version2_windows_composition_workflow

      - name: Version 2 composition and accessibility contracts
        run: >-
          python -m unittest -v
          tests.test_version2_windows_composition_profile
          tests.test_version2_release_accessibility_contract
          tests.test_dev1_full_product_accessible_shell
          tests.test_dev1_full_product_webview_adapter
          tests.test_full_product_native_menu
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_library_workspace_ui_integration
          tests.test_books_training_ui_integration
          tests.test_version2_formats_integration
          tests.test_nvda_p0_contract
          tests.test_p0_semantic_document_copy
          tests.test_v2_board_analysis_hotkey_feedback

      - name: Version 2 data migration and atomicity regressions
        run: >-
          python -m unittest -v
          tests.test_whole_product_user_journey
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_import_service
          tests.test_d07_library_search_cancellation
          tests.test_pgn_concurrent_save
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_export_path_security

      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee v2-composition-unittest.log

      - name: Upload unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-composition-unittest-${{ matrix.os }}
          path: v2-composition-unittest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Stage 1 and Version 2 automated diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
