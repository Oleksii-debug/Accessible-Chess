name: QA Stage1 Strict Dispatch Bridge 20260820

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qa-stage1-strict-dispatch-bridge-20260820.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: qa-stage1-strict-dispatch-bridge-20260820
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch at most one strict Stage1 run
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = 'windows-stage1-strict-release-crossprocess.yml';
            const branch = 'qa/windows-current-integration-candidate-20260815';
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              branch,
              per_page: 20
            });
            const active = runs.data.workflow_runs.filter(r =>
              ['queued','in_progress','waiting','pending','requested'].includes(r.status)
            );
            if (active.length > 0) {
              core.info(`STRICT WORKFLOW ALREADY ACTIVE: ${active.map(r => r.id).join(',')}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id,
              ref: branch
            });
            core.info('STRICT WORKFLOW DISPATCHED');
