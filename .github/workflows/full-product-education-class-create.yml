name: Full Product Education Class Create

on:
  pull_request:
    paths:
      - 'acs/education_class_management.py'
      - 'acs/version2_education_mutation_application.py'
      - 'acs/version2_education_mutation_release.py'
      - 'run_accessible_chess_v2.py'
      - 'tests/test_version2_education_class_create.py'
      - '.github/workflows/full-product-education-class-create.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-product-education-class-create-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained Education authority and current PR hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_BASE_REF:-}"
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          education_owner="3df622f6d667b3513222003df159e52188e60bda"
          git cat-file -e "${education_owner}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$education_owner" HEAD
          git diff --check "$base" HEAD
          test "$(git rev-parse HEAD:acs/education_class_management.py)" = "7b5e8c309ac453cb904552b23af658357db377db"
          test "$(git rev-parse HEAD:acs/version2_education_mutation_application.py)" = "f3a2633c400a4f07fffa52d478456c62a8330fc6"
          test "$(git rev-parse HEAD:acs/version2_education_mutation_release.py)" = "3bd742fb0ba81dfb36bd18857d5bace9da5ff311"
          test "$(git rev-parse HEAD:run_accessible_chess_v2.py)" = "125f378e87acbca993acf54bd4012e93539384d3"
          test "$(git rev-parse HEAD:tests/test_version2_education_class_create.py)" = "3a354dbf7c5f472b1bdd72f06f1b969e709c5394"

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/education_class_management.py
          acs/version2_education_mutation_application.py
          acs/version2_education_mutation_release.py
          run_accessible_chess_v2.py
          tests/test_version2_education_class_create.py

      - name: Focused Education mutation and persistence regression
        run: >-
          python -m pytest -q
          tests/test_version2_education_class_create.py
          tests/test_education_workspace.py
          tests/test_education_webview_projection.py
          tests/test_education_webview_bridge.py
          tests/test_version2_final_product_composition.py

      - name: Final-product production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'
