name: P0 Dynamic Semantic Selection Executable

on:
  pull_request:
    paths:
      - 'web/p0_accessibility_runtime.js'
      - 'web/index.html'
      - 'tests/js/p0_dynamic_selection_runtime_test.js'
      - 'tests/test_p0_dynamic_selection_action_delivery.py'
      - 'tests/test_p0_semantic_document_copy.py'
      - '.github/workflows/p0-dynamic-selection-executable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-dynamic-semantic-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove bounded evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${base}^{commit}"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/p0-dynamic-selection-executable.yml'             'tests/js/p0_dynamic_selection_runtime_test.js'             'tests/test_p0_dynamic_selection_action_delivery.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected P0 dynamic-selection scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Compile focused regression
        run: python -m compileall -q tests/test_p0_dynamic_selection_action_delivery.py tests/test_p0_semantic_document_copy.py

      - name: Execute browser selection regressions
        run: |
          node --check web/p0_accessibility_runtime.js
          node --check tests/js/p0_accessibility_runtime_test.js
          node --check tests/js/p0_dynamic_selection_runtime_test.js
          node tests/js/p0_accessibility_runtime_test.js
          node tests/js/p0_dynamic_selection_runtime_test.js

      - name: Focused P0 copy and selection tests
        run: >-
          python -m pytest -q
          tests/test_p0_dynamic_selection_action_delivery.py
          tests/test_p0_semantic_document_copy.py

      - name: Final-product diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest on Windows
        if: matrix.os == 'windows-2025'
        run: python -m pytest -q tests

      - name: Core selftest
        run: python -m acs.selftest
