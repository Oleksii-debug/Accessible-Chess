name: Current Book HTML CSS Inner Checkpoints

on:
  pull_request:
    branches:
      - fix/book-html-parser-control-checkpoints-20261006-hy6ez0h
    paths:
      - '.github/workflows/current-book-html-css-inner-checkpoints.yml'
      - 'acs/book_html_import.py'
      - 'tests/test_book_active_import_cancellation.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-html-css-inner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HTML_IMPORT_BLOB: 79f2563fb402aa8cddb058d439f9d94599e2e5cd
  ACTIVE_CANCEL_TEST_BLOB: ba6f6f382d9b8ba1d3df93c242fb62264321e78f

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove bounded geometry and exact blobs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-book-html-css-inner-checkpoints.yml' \
            'acs/book_html_import.py' \
            'tests/test_book_active_import_cancellation.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = "$HTML_IMPORT_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_active_import_cancellation.py)" = "$ACTIVE_CANCEL_TEST_BLOB"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile changed Python
        run: python -m py_compile acs/book_html_import.py tests/test_book_active_import_cancellation.py

      - name: Run active import cancellation regressions
        run: python -m unittest tests.test_book_active_import_cancellation
