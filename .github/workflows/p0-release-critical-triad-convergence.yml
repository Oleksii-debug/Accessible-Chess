name: P0 Release Critical Triad Convergence

on:
  pull_request:
    paths:
      - 'scripts/p0_packaged_document_copy_probe.ps1'
      - 'tests/test_p0_packaged_document_copy_probe.py'
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'tests/test_verify_p0_packaged_document_copy_evidence.py'
      - 'scripts/p0g_packaged_hotkey_result_probe.ps1'
      - 'tests/test_p0g_packaged_hotkey_result_probe.py'
      - 'tests/test_p0_release_critical_triad_convergence.py'
      - '.github/workflows/p0-release-critical-triad-convergence.yml'
      - 'acs/**'
      - 'web/**'
      - 'run_accessible_chess_v2.py'

concurrency:
  group: p0-release-critical-triad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triad:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout proposed convergence merge
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Prove exact pull-request merge identity
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
          INTEGRATION_PRODUCT_BRANCH: converge/current-product-pgn-graph-safety-20261004-sol60a1
        run: |
          set -euo pipefail
          test -n "$EVENT_BASE_SHA"
          test -n "$EVENT_BASE_REF"
          test -n "$EVENT_HEAD_SHA"
          test -n "$CHECKED_SHA"
          test -n "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git cat-file -e "$EVENT_HEAD_SHA^{commit}"

          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")"
          git cat-file -e "$live_product^{commit}"

          git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
          live_event_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
          git cat-file -e "$live_event_base^{commit}"

          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$live_event_base"
          if [ "$EVENT_BASE_REF" = "$DEFAULT_BRANCH" ]; then
            # Whole-Product integration is intentionally based on the default
            # branch, which predates Product history. Retain the long-lived
            # baseline proof, then bind this release candidate to the live
            # current Product apex branch as well.
            git merge-base --is-ancestor "$live_product" "$EVENT_HEAD_SHA"
            git fetch --no-tags origin "+refs/heads/$INTEGRATION_PRODUCT_BRANCH:refs/remotes/origin/$INTEGRATION_PRODUCT_BRANCH"
            live_integration_product="$(git rev-parse "refs/remotes/origin/$INTEGRATION_PRODUCT_BRANCH")"
            git cat-file -e "$live_integration_product^{commit}"
            git merge-base --is-ancestor "$live_product" "$live_integration_product"
            git merge-base --is-ancestor "$live_integration_product" "$EVENT_HEAD_SHA"
            echo "P0_TRIAD_CURRENT_PRODUCT_ANCESTOR=$live_integration_product"
            echo "P0_TRIAD_MODE=DEFAULT_BRANCH_INTEGRATION"
          else
            # Stacked Product successors must continue to prove that their live
            # base already contains the retained Product authority.
            git merge-base --is-ancestor "$live_product" "$live_event_base"
            echo "P0_TRIAD_MODE=STACKED_PRODUCT"
          fi
          git merge-base --is-ancestor "$live_event_base" "$EVENT_HEAD_SHA"
          git merge-base --is-ancestor "$live_event_base" HEAD
          git merge-base --is-ancestor "$EVENT_HEAD_SHA" HEAD
          parents="$(git show -s --format=%P HEAD)"
          test "$parents" = "$live_event_base $EVENT_HEAD_SHA"
          git diff --check "$live_event_base..HEAD"

          echo "P0_TRIAD_EVENT_BASE=$EVENT_BASE_SHA"
          echo "P0_TRIAD_EVENT_BASE_REF=$EVENT_BASE_REF"
          echo "P0_TRIAD_LIVE_EVENT_BASE=$live_event_base"
          echo "P0_TRIAD_PRODUCT_ANCESTOR=$live_product"
          echo "P0_TRIAD_PR_HEAD=$EVENT_HEAD_SHA"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile convergence contract
        run: python -m py_compile tests/test_p0_release_critical_triad_convergence.py
      - name: Run release-critical triad contract
        run: python -m unittest -v tests.test_p0_release_critical_triad_convergence
      - name: Re-run packaged copy and P0-G static contracts
        run: >-
          python -m unittest -v
          tests.test_p0_packaged_document_copy_probe
          tests.test_p0g_packaged_hotkey_result_probe
          tests.test_verify_p0_packaged_document_copy_evidence
