          FOCUS_PRESERVE_REF: fix/preserve-observed-focus-rollback-20261005-sol56r8k2
          FOCUS_PRESERVE_HEAD: a750e241e14071562b56a0105f089a093bae2d4d
          PRE_FOCUS_PRESERVE_PRODUCT: b3d94ebb5c26ef96a32d0309c761a31d4b032c95
          FOCUS_PRESERVE_MERGE: 19c10db4238a2fb8093c7e3d6b8d75fc2bf9fab4
          BROWSER_PUBLICATION_REF: fix/browser-route-publication-ack-20261005-zftrkmo
