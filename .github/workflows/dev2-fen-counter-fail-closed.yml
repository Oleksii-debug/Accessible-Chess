name: DEV2 Stage1 FEN Counter Fail-Closed Repair

on:
  pull_request:
    branches:
      - release/dev5-stage1-combined-repair-20260823
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fen-counter-repair:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      ORIGINAL_COMBINED_PRODUCT_SHA: 574d8c7344a7490de46ba38498f363395c951019
      LIVE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '574d8c7344a7490de46ba38498f363395c951019' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize checkout and prove exact narrow repair scope
        shell: bash
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          test "$(git merge-base "$ORIGINAL_COMBINED_PRODUCT_SHA" HEAD)" = "$ORIGINAL_COMBINED_PRODUCT_SHA"
          git diff --check "$LIVE_PR_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$LIVE_PR_BASE_SHA" HEAD | sort)
          expected=(
            ".github/workflows/dev2-fen-counter-fail-closed.yml"
            "acs/chesscore.py"
            "tests/test_dev2_fen_counter_fail_closed.py"
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected.txt"
          printf '%s\n' "${changed[@]}" > "$RUNNER_TEMP/changed.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/changed.txt"
          echo "DEV2 LIVE PR BASE + NARROW THREE-PATH REPAIR PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install -q pytest

      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused oversized FEN counter containment
        run: python -m unittest -v tests.test_dev2_fen_counter_fail_closed

      - name: Existing canonical FEN history editor atomicity
        run: >-
          python -m unittest -v
          tests.test_dev2_fen_atomicity
          tests.test_position_editor
          tests.test_stage1_core_full_flow
          tests.test_history
          tests.test_ui_review_adapter
          tests.test_manual5_cross_lane_regression

      - name: Replay unchanged DEV4 QA FEN-counter oracle
        shell: bash
        run: |
          git fetch --no-tags origin qa/dev4-stage1-fen-counter-error-surface-20260823
          git show FETCH_HEAD:tests/test_dev4_stage1_fen_counter_error_surface.py > tests/test_dev4_stage1_fen_counter_error_surface_replay.py
          python -m unittest -v tests.test_dev4_stage1_fen_counter_error_surface_replay
          rm tests/test_dev4_stage1_fen_counter_error_surface_replay.py

      - name: Full unittest regression
        run: python -m unittest discover -v tests

      - name: Full pytest regression
        run: python -m pytest -q tests

      - name: Selftest and complete diagnostic
        run: python run_accessible_chess.py --diagnostic
