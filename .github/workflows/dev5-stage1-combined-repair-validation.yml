name: DEV5 Stage1 Combined Repair Validation

on:
  pull_request:
    branches:
      - manual5/integration-20260821
    paths:
      - 'acs/chesscore.py'
      - 'acs/history.py'
      - 'acs/stockfish_runtime.py'
      - 'acs/release_preflight.py'
      - 'acs/engine.py'
      - 'web/stage1_release_bootstrap.js'
      - 'tests/test_dev2_history_scalar_fail_closed.py'
      - 'tests/test_stage1_stockfish_runtime_path_privacy.py'
      - 'tests/test_d04_release_preflight_hygiene.py'
      - 'tests/test_d03_stockfish_hard_shutdown.py'
      - '.github/workflows/dev5-stage1-combined-repair-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 80720e8125c59a213f278668d599040f2768d553
  DEV4_STOCKFISH_BLOB: 23477698de93e7ecb582e9411a3bfacc0976849c
  DEV2_HISTORY_BLOB: 381be891b3701039a70492f0db688530ed96fe5b
  DEV2_FEN_BLOB: 7001518255575f55d4634c3578c035c526f7d8a4
  D01_FOCUS_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  D04_SHA: 579938cf422445b5c46a08c00cae284e3ae08b9b
  D04_PREFLIGHT_BLOB: e7abe5cc006a48d7a9e554543e50ae40b12ad481
  D04_TEST_BLOB: fbec914612befc1e0e2d92b4ba242d06612ff385
  D03_SHA: d3f3e8e49fa9e9932e9c66d7c85f67cbfc7e7347
  D03_ENGINE_BLOB: 59b46bb914c5aae094cde1ce92b232fdbce17f19
  D03_TEST_BLOB: b2b69ce8671317890129f17d18489064716046dd
  STOCKFISH_QA_SHA: 66d5affbe027a86717a775198ec9fbcf8aba8545
  STOCKFISH_QA_BLOB: f674de79b19a852f29837edab138c20b28f24162
  FEN_QA_SHA: 17e7f2e3a9db821c808a003f12b55da99303067c
  FEN_QA_BLOB: 499538b09f799c43608a6781fe436b0f10f62752
  FOCUS_QA_SHA: 965f8ed95eb2ae4f2e628b77855c0a6dbd0d4321
  FOCUS_QA_BLOB: 2fec761ded7e3af193b6f309f03876141be8ab41

jobs:
  combined-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Preserve exact LF materialization on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git -c core.autocrlf=false checkout HEAD -- .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Prove exact ancestry, provenance, Product blobs and narrow Stage1 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          test "$(git hash-object acs/stockfish_runtime.py)" = "$DEV4_STOCKFISH_BLOB"
          test "$(git hash-object acs/history.py)" = "$DEV2_HISTORY_BLOB"
          test "$(git hash-object acs/chesscore.py)" = "$DEV2_FEN_BLOB"
          test "$(git hash-object web/stage1_release_bootstrap.js)" = "$D01_FOCUS_BLOB"

          git cat-file -e "$D04_SHA^{commit}"
          test "$(git rev-parse "$D04_SHA:acs/release_preflight.py")" = "$D04_PREFLIGHT_BLOB"
          test "$(git rev-parse "$D04_SHA:tests/test_d04_release_preflight_hygiene.py")" = "$D04_TEST_BLOB"
          test "$(git hash-object acs/release_preflight.py)" = "$D04_PREFLIGHT_BLOB"
          test "$(git hash-object tests/test_d04_release_preflight_hygiene.py)" = "$D04_TEST_BLOB"

          git cat-file -e "$D03_SHA^{commit}"
          test "$(git rev-parse "$D03_SHA:acs/engine.py")" = "$D03_ENGINE_BLOB"
          test "$(git rev-parse "$D03_SHA:tests/test_d03_stockfish_hard_shutdown.py")" = "$D03_TEST_BLOB"
          test "$(git hash-object acs/engine.py)" = "$D03_ENGINE_BLOB"
          test "$(git hash-object tests/test_d03_stockfish_hard_shutdown.py)" = "$D03_TEST_BLOB"

          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)(acsdb|chessbase|bookdocument|bookreader|book_index|training|teacher|classroom|remote_lesson)([^/]*)(/|\.|$)' ; then
            echo 'Stage2 contamination detected' >&2; exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict' ; then
            echo 'QA strict harness contamination detected' >&2; exit 1
          fi
      - name: Compile and parse release JavaScript
        run: |
          python -m compileall -q acs tests run_accessible_chess.py
          node --check web/stage1_release_bootstrap.js
          node --check web/stage1_board_actions.js
      - name: Product-owned repair regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_history_scalar_fail_closed
          tests.test_stage1_stockfish_runtime_path_privacy
          tests.test_d04_release_preflight_hygiene
          tests.test_d03_stockfish_hard_shutdown
          tests.test_release_preflight
          tests.test_stockfish_runtime
          tests.test_history
          tests.test_ui_review_adapter
          tests.test_dev2_fen_atomicity
          tests.test_stage1_core_full_flow
      - name: Replay independent PR159 Stockfish oracle byte-identically
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$STOCKFISH_QA_SHA^{commit}"
          test "$(git rev-parse "$STOCKFISH_QA_SHA:tests/test_dev3_stockfish_runtime_path_privacy.py")" = "$STOCKFISH_QA_BLOB"
          rm -rf qa_oracles
          mkdir -p qa_oracles
          : > qa_oracles/__init__.py
          git show "$STOCKFISH_QA_SHA:tests/test_dev3_stockfish_runtime_path_privacy.py" > qa_oracles/test_dev3_stockfish_runtime_path_privacy.py
          test "$(git hash-object qa_oracles/test_dev3_stockfish_runtime_path_privacy.py)" = "$STOCKFISH_QA_BLOB"
          python -m unittest -v qa_oracles.test_dev3_stockfish_runtime_path_privacy
      - name: Replay independent PR193 FEN oracle byte-identically
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FEN_QA_SHA^{commit}"
          test "$(git rev-parse "$FEN_QA_SHA:tests/test_dev4_stage1_fen_counter_error_surface.py")" = "$FEN_QA_BLOB"
          mkdir -p qa_oracles
          : > qa_oracles/__init__.py
          git show "$FEN_QA_SHA:tests/test_dev4_stage1_fen_counter_error_surface.py" > qa_oracles/test_dev4_stage1_fen_counter_error_surface.py
          test "$(git hash-object qa_oracles/test_dev4_stage1_fen_counter_error_surface.py)" = "$FEN_QA_BLOB"
          python -m unittest -v qa_oracles.test_dev4_stage1_fen_counter_error_surface
      - name: Replay independent PR196 submit-focus oracle byte-identically
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FOCUS_QA_SHA^{commit}"
          test "$(git rev-parse "$FOCUS_QA_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py")" = "$FOCUS_QA_BLOB"
          mkdir -p qa_oracles
          : > qa_oracles/__init__.py
          git show "$FOCUS_QA_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py" > qa_oracles/test_dev5_stage1_submit_listener_focus_route.py
          test "$(git hash-object qa_oracles/test_dev5_stage1_submit_listener_focus_route.py)" = "$FOCUS_QA_BLOB"
          python -m unittest -v qa_oracles.test_dev5_stage1_submit_listener_focus_route
      - name: Current Stage1 privacy history FEN focus preflight and lifecycle stress
        run: >-
          python -m pytest -q
          tests/test_stage1_release_path_privacy.py
          tests/test_stage1_stockfish_runtime_path_privacy.py
          tests/test_dev2_history_scalar_fail_closed.py
          tests/test_dev2_fen_atomicity.py
          tests/test_d04_release_preflight_hygiene.py
          tests/test_d03_stockfish_hard_shutdown.py
          tests/test_stage1_saturation_history_stress.py
          tests/test_stage1_core_full_flow.py
          tests/test_stage1_packaged_focus_origin_contract.py
      - name: Focused Stage1 release contracts
        run: >-
          python -m unittest -v
          tests.test_release_preflight
          tests.test_issue22_release_contract
          tests.test_nvda_p0_contract
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_stage1_release_composition_ui
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_webview_safe_server
          tests.test_legacy_release_workflow_safety
          tests.test_core_release_contracts
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q
      - name: Canonical SELFTEST
        run: python -m acs.selftest
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
