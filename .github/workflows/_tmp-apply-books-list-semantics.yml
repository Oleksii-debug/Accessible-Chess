name: Temporary Books list-semantics apply

on:
  push:
    branches:
      - work/v2-books-list-semantics-20260907

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[books-list-applied]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v2-books-list-semantics-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Apply exact transformation
        run: |
          python -m py_compile scripts/_tmp_apply_books_list_semantics.py
          python scripts/_tmp_apply_books_list_semantics.py
      - name: Verify focused semantics before publication
        run: |
          git diff --check
          python -m py_compile acs/book_html_import.py acs/book_text_import.py tests/test_v2_book_text_import.py tests/test_w3_v2_html_list_semantics.py tests/test_w3_v2_markdown_list_semantics.py
          python -m unittest -v tests.test_w3_v2_html_list_semantics tests.test_w3_v2_markdown_list_semantics tests.test_v2_book_html_import tests.test_v2_book_text_import
      - name: Commit Product repair and remove temporary machinery
        run: |
          git config user.name 'accessible-chess-work-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add acs/book_html_import.py acs/book_text_import.py tests/test_v2_book_text_import.py
          git rm scripts/_tmp_apply_books_list_semantics.py .github/workflows/_tmp-apply-books-list-semantics.yml
          git diff --cached --check
          git commit -m 'fix: preserve semantic book lists [books-list-applied]'
          git push origin HEAD:work/v2-books-list-semantics-20260907
