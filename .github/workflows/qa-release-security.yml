name: QA Release Security Gate

on:
  push:
    branches:
      - dev/qa-release-security
    paths:
      - 'acs/security_contracts.py'
      - 'acs/security_redaction.py'
      - 'tests/test_security_contracts.py'
      - 'tests/test_security_redaction.py'
      - 'tests/test_architecture.py'
      - '.github/workflows/qa-release-security.yml'
  pull_request:
    paths:
      - 'acs/security_contracts.py'
      - 'acs/security_redaction.py'
      - 'tests/test_security_contracts.py'
      - 'tests/test_security_redaction.py'
      - 'tests/test_architecture.py'
      - '.github/workflows/qa-release-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contracts:
    name: Security contracts, redaction, and architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile security modules
        run: python -m py_compile acs/security_contracts.py acs/security_redaction.py tests/test_security_contracts.py tests/test_security_redaction.py tests/test_architecture.py

      - name: Run entitlement contract tests
        run: python -m unittest -v tests.test_security_contracts

      - name: Run diagnostic redaction tests
        run: python -m unittest -v tests.test_security_redaction

      - name: Run architecture boundary tests
        run: python -m unittest -v tests.test_architecture
