name: V2 Windows Book Board Accessible Adapter

on:
  push:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'run_accessible_chess_v2.py'
      - 'acs/version2_windows_book_board_adapter.py'
      - 'acs/book_board_workflow.py'
      - 'acs/book_webview_projection.py'
      - 'acs/book_webview_bridge.py'
      - 'acs/full_product_presenters.py'
      - 'acs/full_product_actions.py'
      - 'acs/version2_application.py'
      - 'tests/test_v2_windows_book_board_adapter.py'
      - 'tests/test_v2_book_board_workflow.py'
      - 'tests/test_v2_windows_book_board_adapter_workflow.py'
      - '.github/workflows/v2-windows-book-board-adapter.yml'
  pull_request:
    branches:
      - integration/current-main-windows-apex-reconvergence-20261004-sol
    paths:
      - 'run_accessible_chess_v2.py'
      - 'acs/version2_windows_book_board_adapter.py'
      - 'acs/book_board_workflow.py'
      - 'acs/book_webview_projection.py'
      - 'acs/book_webview_bridge.py'
      - 'acs/full_product_presenters.py'
      - 'acs/full_product_actions.py'
      - 'acs/version2_application.py'
      - 'tests/test_v2_windows_book_board_adapter.py'
      - 'tests/test_v2_book_board_workflow.py'
      - 'tests/test_v2_windows_book_board_adapter_workflow.py'
      - '.github/workflows/v2-windows-book-board-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-book-board-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  book-board-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact live main-reconverged parent geometry
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_BASE_REF"
            test -n "$PR_HEAD_SHA"
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git fetch --no-tags origin "$PR_BASE_REF"
            live_base="$(git rev-parse "origin/$PR_BASE_REF")"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$live_base"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            git diff --check "$live_base" HEAD

            changed="$(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)"
            wanted="$(printf '%s\n' \
              '.github/workflows/v2-native-thread-runtime.yml' \
              '.github/workflows/v2-windows-book-board-adapter.yml' \
              'tests/test_v2_native_thread_runtime_workflow.py' \
              'tests/test_v2_windows_book_board_adapter_workflow.py' | LC_ALL=C sort)"
            if [ "$changed" = "$wanted" ]; then
              git diff --quiet "$live_base" HEAD -- \
                run_accessible_chess.py \
                run_accessible_chess_v2.py \
                acs/version2_windows_book_board_adapter.py \
                acs/book_board_workflow.py \
                acs/book_webview_projection.py \
                acs/book_webview_bridge.py \
                acs/full_product_presenters.py \
                acs/full_product_actions.py \
                acs/version2_application.py \
                acs/version2_windows_file_workflows.py
              echo 'BOOK_BOARD_TOPOLOGY=EXACT_NARROW_SUCCESSOR'
            else
              git diff --quiet "$live_base" HEAD -- \
                run_accessible_chess.py \
                run_accessible_chess_v2.py \
                acs/version2_windows_book_board_adapter.py \
                acs/book_board_workflow.py \
                acs/book_webview_projection.py \
                acs/book_webview_bridge.py \
                acs/full_product_presenters.py \
                acs/full_product_actions.py \
                acs/version2_windows_file_workflows.py
              echo 'BOOK_BOARD_TOPOLOGY=APPLICATION_COMPATIBILITY'
            fi
          else
            parent="$(git rev-parse HEAD^)"
            git cat-file -e "$parent^{commit}"
            git diff --check "$parent" HEAD
          fi

      - name: Compile adapter and inherited application seam
        run: >-
          python -m compileall -q
          acs tests run_accessible_chess.py run_accessible_chess_v2.py

      - name: Focused D01 plus BookBoard application contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_book_board_adapter_workflow
          tests.test_v2_windows_book_board_adapter
          tests.test_v2_book_board_workflow

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_book_board_adapter_workflow.py
          tests/test_v2_windows_book_board_adapter.py
          tests/test_v2_book_board_workflow.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
