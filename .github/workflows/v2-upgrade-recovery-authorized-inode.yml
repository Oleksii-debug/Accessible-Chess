name: V2 Upgrade Recovery Authorized Inode

on:
  push:
    branches:
      - fix/v2-upgrade-recovery-authorized-inode-20261004
  pull_request:
    branches:
      - fix/v2-upgrade-library-prepare-path-identity-20261004
    paths:
      - 'acs/version2_upgrade_base.py'
      - 'tests/test_v2_upgrade_tracked_writer_conflict.py'
      - '.github/workflows/v2-upgrade-recovery-authorized-inode.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-upgrade-recovery-authorized-inode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and authorized-inode scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='5611e56a1f5b5be2f130d2870ad4c5857ba855e2'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/v2-upgrade-library-prepare-path-identity-20261004'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-upgrade-recovery-authorized-inode.yml' \
            'acs/version2_upgrade_base.py' \
            'tests/test_v2_upgrade_tracked_writer_conflict.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/version2_upgrade_base.py)" = "fd4fb721268a8ee3321e3c87e157c6d311dcae7b"
          test "$(git rev-parse HEAD:tests/test_v2_upgrade_tracked_writer_conflict.py)" = "86871372673d5a6d5254dba1b957f8ea1f5068ae"

          echo 'V2_UPGRADE_RECOVERY_AUTHORIZED_INODE_SCOPE=PASS'

      - name: Compile recovery authority surfaces
        run: >-
          python -m compileall -q
          acs/version2_upgrade_base.py
          tests/test_v2_upgrade_tracked_writer_conflict.py

      - name: Recovery authority and publication regressions
        run: >-
          python -m unittest -v
          tests.test_v2_upgrade_tracked_writer_conflict
          tests.test_v2_upgrade_publish_race_audit
          tests.test_v2_upgrade_generated_artifact_authentication
          tests.test_v2_upgrade_root_writer_artifact_grammar

      - name: Upgrade integration regressions
        run: >-
          python -m unittest -v
          tests.test_v2_data_upgrade
          tests.test_v2_data_upgrade_v6

      - name: Core selftest
        run: python -m acs.selftest
