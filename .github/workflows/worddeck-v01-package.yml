name: WordDeck archived accepted V0.1 package

on:
  workflow_dispatch:

# V0.1 is already independently accepted and its exact package/evidence belongs
# to the accepted base commit. Keeping the old packaging workflow live on every
# future WordDeck/** change would relabel later v1 development as V0.1.
# Historical packaging logic remains reproducible from Git history at:
# 588eec6c45def0f746946245149be1e3f57ea4d0
permissions:
  contents: read

jobs:
  archived:
    runs-on: windows-latest
    steps:
      - name: Explain frozen V0.1 status
        shell: pwsh
        run: |
          Write-Host 'Accepted V0.1 is frozen at 588eec6c45def0f746946245149be1e3f57ea4d0.'
          Write-Host 'This archive marker does not rebuild, relabel or republish later WordDeck code as V0.1.'
