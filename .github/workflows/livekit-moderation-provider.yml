name: LiveKit Moderation Provider Admin

on:
  pull_request:
    branches:
      - feature/classroom-moderation-rpc-core-20261002
    paths:
      - 'acs/livekit_moderation_provider.py'
      - 'tests/test_livekit_moderation_provider.py'
      - '.github/workflows/livekit-moderation-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livekit-moderation-provider-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-admin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-moderation-rpc-core-20261002"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          test -n "$base"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current moderation RPC parent $base is not an ancestor of HEAD; synchronize the stacked PR before qualification."
            exit 1
          fi
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/livekit-moderation-provider.yml' \
            'acs/livekit_moderation_provider.py' \
            'tests/test_livekit_moderation_provider.py' | sort)"
          test "$changed" = "$allowed"
          git diff --quiet "$base...HEAD" -- \
            acs/classroom_moderation_rpc.py \
            acs/classroom_realtime_media.py \
            acs/classroom_domain.py \
            acs/chesscore.py

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile moderation provider
        run: >-
          python -m py_compile
          acs/livekit_moderation_provider.py
          tests/test_livekit_moderation_provider.py

      - name: Run dependency-free provider and canonical moderation contracts
        run: >-
          python -m unittest -v
          tests.test_livekit_moderation_provider
          tests.test_classroom_moderation_rpc
          tests.test_classroom_realtime_media

      - name: Verify exact official LiveKit server wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --dest .livekit-sdk livekit-api==1.2.1
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected_name = "livekit_api-1.2.1-py3-none-any.whl"
          expected_sha = "aa15b0a194c9e8167d4261bc61381682df23f98bc6d77760fcded93d2ce4b4ca"
          files = list(Path(".livekit-sdk").glob("*"))
          assert len(files) == 1, files
          assert files[0].name == expected_name, files[0].name
          assert sha256(files[0].read_bytes()).hexdigest() == expected_sha
          PY

      - name: Install exact official LiveKit server SDK
        run: python -m pip install --disable-pip-version-check -q livekit-api==1.2.1

      - name: Verify exact SDK protobuf and error schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib.metadata import version
          from livekit import api

          assert version("livekit-api") == "1.2.1"

          enum = api.TrackInfo.DESCRIPTOR.fields_by_name["source"].enum_type
          expected = {
              "SOURCE_UNKNOWN": 0,
              "SOURCE_CAMERA": 1,
              "SOURCE_MICROPHONE": 2,
              "SOURCE_SCREENSHARE": 3,
              "SOURCE_SCREENSHARE_AUDIO": 4,
          }
          actual = {item.name: item.number for item in enum.values}
          assert actual == expected, actual

          permission = api.ParticipantPermission(
              can_publish=True,
              can_subscribe=True,
              can_publish_data=False,
              can_publish_sources=[1, 2, 3],
          )
          clone = api.ParticipantPermission()
          clone.CopyFrom(permission)
          assert list(clone.can_publish_sources) == [1, 2, 3]

          update = api.UpdateParticipantRequest(
              room="room-1",
              identity="student-1",
              permission=clone,
          )
          mute = api.MuteRoomTrackRequest(
              room="room-1",
              identity="student-1",
              track_sid="TR_test",
              muted=True,
          )
          remove = api.RoomParticipantIdentity(
              room="room-1",
              identity="student-1",
          )
          assert (update.room, mute.track_sid, remove.identity) == (
              "room-1", "TR_test", "student-1"
          )
          assert api.ServerErrorCode.NOT_FOUND == "not_found"
          print("LIVEKIT_MODERATION_SCHEMA=PASS")
          PY

      - name: Prove provider boundary contains no credential ownership
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'LIVEKIT_API_(KEY|SECRET)|api_secret|api_key|AccessToken|VideoGrants' acs/livekit_moderation_provider.py
          grep -Fq 'ParticipantPermission' acs/livekit_moderation_provider.py
          grep -Fq 'MuteRoomTrackRequest' acs/livekit_moderation_provider.py
          grep -Fq 'RoomParticipantIdentity' acs/livekit_moderation_provider.py
          grep -Fq 'ServerErrorCode' acs/livekit_moderation_provider.py

      - name: Core selftest
        run: python -m acs.selftest
