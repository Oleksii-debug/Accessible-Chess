name: V1 Runtime Bridge Monotonic Recovery

on:
  push:
    branches:
      - fix/v1-runtime-bridge-monotonic-recovery-8996-20260911
  pull_request:
    paths:
      - 'acs/v1_runtime_bridge.py'
      - 'tests/test_v1_runtime_bridge_monotonic_recovery.py'
      - '.github/workflows/v1-runtime-bridge-monotonic-recovery.yml'

permissions:
  contents: read

concurrency:
  group: v1-runtime-bridge-monotonic-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current Full Product ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test -n "${GITHUB_BASE_REF:-}"
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v1-runtime-bridge-monotonic-recovery.yml' \
            'acs/v1_runtime_bridge.py' \
            'tests/test_v1_runtime_bridge_monotonic_recovery.py' | sort)"
          test "$changed" = "$expected"
          echo "CURRENT_PRODUCT_BASE=$base"
          echo "REPAIR_HEAD=$(git rev-parse HEAD)"

      - name: Syntax and imports
        run: >-
          python -m compileall -q
          acs/v1_runtime_bridge.py
          tests/test_v1_runtime_bridge_monotonic_recovery.py
          tests/test_v1_runtime_bridge.py
          tests/test_v1_runtime_bridge_publication_atomicity.py
          tests/test_v1_runtime_bridge_backup_path_security.py

      - name: Focused recovery and bridge regressions
        run: >-
          python -m unittest -v
          tests.test_v1_runtime_bridge_monotonic_recovery
          tests.test_v1_runtime_bridge
          tests.test_v1_runtime_bridge_publication_atomicity
          tests.test_v1_runtime_bridge_backup_path_security

      - name: Full unittest regression
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Full pytest regression
        run: python -m pytest -q
