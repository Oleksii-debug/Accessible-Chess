name: Book Variation FEN Equivalence

on:
  pull_request:
    branches:
      - integration/book-html-semantic-reading-apex-20261004-sol6p3
      - converge/current-product-settings-a11y-20261004-sol56-q8t2
      - converge/current-product-settings-launcher-20261004-c2mbezb
      - fix/settings-keymap-refresh-recovery-20261004-c2mbezb
      - fix/current-product-fen-history-atomicity-20261004-c2mbezb
      - fix/current-product-user-facing-engine-status-20261004-sol56f9k2
      - converge/current-product-position-root-atomicity-20261004-hy6ez0h
      - fix/books-nested-copy-hook-20261004-sol56k8m2
      - fix/stage1-review-navigation-atomicity-20261004-hy6ez0h
      - fix/book-import-warning-cap-20261005-sol56
    paths:
      - 'acs/book_game_content.py'
      - 'tests/test_v2_book_game_content.py'
      - 'tests/test_book_lookup_detached_canonicalization.py'
      - '.github/workflows/book-variation-fen-equivalence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-variation-fen-equivalence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Reject superseded pull-request candidate
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/book-provider-live-pr-head"
          live_head="$(git rev-parse refs/remotes/origin/book-provider-live-pr-head)"
          test "$live_head" = "$EVENT_HEAD_SHA" || {
            echo "BOOK_PROVIDER_SUPERSEDED event=$EVENT_HEAD_SHA live=$live_head" >&2
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current Product ancestry and exact ownership
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            event_base="$PR_BASE_SHA"
            base_ref="$PR_BASE_REF"
            test -n "$event_base"
            test -n "$base_ref"
            git cat-file -e "$event_base^{commit}"
            git fetch --no-tags origin "$base_ref"
            live_base="$(git rev-parse "origin/$base_ref")"
            git merge-base --is-ancestor "$event_base" "$live_base"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            upstream="$live_base"
          else
            base_ref="fix/stage1-review-navigation-atomicity-20261004-hy6ez0h"
            git fetch --no-tags origin "$base_ref"
            upstream="$(git rev-parse "origin/$base_ref")"
          fi
          git cat-file -e "$upstream^{commit}"
          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD
          changed="$(git diff --name-only "$upstream" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/book-variation-fen-equivalence.yml'             'acs/book_game_content.py'             'tests/test_book_lookup_detached_canonicalization.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_game_content.py)" = \
            '5d7d76bc97a429abbb0ad5aab308c71f04b6e0ee'
          test "$(git rev-parse HEAD:tests/test_book_lookup_detached_canonicalization.py)" = \
            'b9e436e6ad5c555c55442a00af32e0102adc3490'
          git diff --quiet "$upstream" HEAD --             acs/chesscore.py             acs/gametree.py             acs/pgn_roundtrip.py             acs/bookdocument.py             acs/bookreader.py             acs/book_html_import.py             acs/book_epub_import.py

      - name: Compile focused Book game boundary
        run: >-
          python -m compileall -q
          acs/book_game_content.py
          tests/test_book_lookup_detached_canonicalization.py
          tests/test_v2_book_game_content.py

      - name: Focused Book canonical game regressions
        run: >-
          python -m unittest -v
          tests.test_book_lookup_detached_canonicalization
          tests.test_v2_book_game_content
          tests.test_bookdocument
          tests.test_v2_book_board_workflow

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic