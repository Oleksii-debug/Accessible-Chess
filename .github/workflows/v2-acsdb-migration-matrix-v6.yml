name: V2 ACSDB Migration Matrix V6

on:
  push:
    branches:
      - work/v2-acsdb-migrations-prod-20260831
  pull_request:
    paths:
      - 'acs/acsdb.py'
      - 'tests/test_v2_acsdb_migration_matrix_v6.py'
      - '.github/workflows/v2-acsdb-migration-matrix-v6.yml'

permissions:
  contents: read

concurrency:
  group: v2-acsdb-migration-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  MIGRATION_BASE: c1bd4f0c7610365458689a786ebb56d1c7d073df

jobs:
  migration-correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Normalize worktree to canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Ownership ancestry and migration-only diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$MIGRATION_BASE" HEAD
          test "$(git merge-base "$MIGRATION_BASE" HEAD)" = "$MIGRATION_BASE"
          git diff --check "$MIGRATION_BASE" HEAD
          changed="$(git diff --name-only "$MIGRATION_BASE" HEAD | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/v2-acsdb-migration-matrix-v6.yml' \
            'acs/acsdb.py' \
            'tests/test_v2_acsdb_migration_matrix_v6.py' | sort)"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))"
          test -z "$unexpected"
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/v2-acsdb-migration-matrix-v6.yml'
          printf '%s\n' "$changed" | grep -Fx 'tests/test_v2_acsdb_migration_matrix_v6.py'
          if printf '%s\n' "$changed" | grep -E 'gametree.py|pgn_|chessbase|teacher|classroom|education|stage1'; then
            echo 'Out-of-lane semantic/release contamination detected' >&2
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q acs tests tools run_accessible_chess.py
      - name: ACSDB v1-v6 migration fixture matrix
        run: python -m unittest -v tests.test_v2_acsdb_migration_matrix_v6
      - name: Full D07 migration, integrity, search and import regression
        run: >-
          python -m unittest -v
          tests.test_v2_acsdb_migration_matrix_v6
          tests.test_d07_acsdb_migration_atomicity
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_date_filter_v5
          tests.test_v2_library_integrity_repair
          tests.test_v2_library_search_service_v4
          tests.test_acsdb
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence
          tests.test_windows_data_release_regressions
      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee full-unittest.log
      - name: Upload full unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-acsdb-migrations-full-unittest-${{ matrix.os }}
          path: full-unittest.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
