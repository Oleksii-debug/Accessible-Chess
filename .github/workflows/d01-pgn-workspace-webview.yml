name: D01 PGN Workspace WebView

on:
  pull_request:
    paths:
      - 'acs/pgn_webview_bridge.py'
      - 'acs/pgn_webview_projection.py'
      - 'acs/pgn_workspace_webview_adapter.py'
      - 'tests/js/pgn_surface_dom_test.js'
      - 'tests/test_dev1_pgn_webview_atomicity.py'
      - 'tests/test_dev1_pgn_webview_projection.py'
      - 'tests/test_dev1_pgn_workspace_webview_adapter.py'
      - 'web/full_product_pgn.js'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d01-pgn-workspace-webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      D01_BASE: 37204866a2bb4ee7b0a936842fa70e4eb8cdf16d
      D01_FEATURE: 76d20f9ce3f24120935a8f122ce0c8e0b6e4fb64
      D01_PRE_REPAIR: e8ecf3d707c74955522e62cce449731f0ea87bb5
      D06_HEAD: 1e3ea862bcff2ac13077f879c2ce9af01c4f983f
      D06_WORKSPACE_BLOB: 346f31f828191e76d57b372bb6c84a4a90568594
      D06_WORKSPACE_TEST_BLOB: edce8f6a591ffc09d419e9046e14725c4a07cf54
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact ancestry and isolated D01 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "$D01_PRE_REPAIR"
          test "$(git rev-list --count "$D01_BASE"..HEAD)" = "5"
          git merge-base --is-ancestor "$D01_BASE" HEAD
          git merge-base --is-ancestor "$D01_FEATURE" HEAD
          git diff --check "$D01_BASE" HEAD
          repair_changed="$(git diff --name-only "$D01_PRE_REPAIR" HEAD | sort)"
          test "$repair_changed" = '.github/workflows/d01-pgn-workspace-webview.yml'
          changed="$(git diff --name-only "$D01_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d01-pgn-workspace-webview.yml' \
            'acs/pgn_webview_bridge.py' \
            'acs/pgn_webview_projection.py' \
            'acs/pgn_workspace_webview_adapter.py' \
            'tests/js/pgn_surface_dom_test.js' \
            'tests/test_dev1_pgn_webview_atomicity.py' \
            'tests/test_dev1_pgn_webview_projection.py' \
            'tests/test_dev1_pgn_workspace_webview_adapter.py' \
            'web/full_product_pgn.js' | sort)"
          test "$changed" = "$expected"
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict|release_preflight|pgn_workspace\.py$|pgn_document\.py$'; then
            echo 'Foreign owner or strict-release contamination detected' >&2
            exit 1
          fi

      - name: Lock frozen Stage1 and central D01 routing
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Protected blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/full_product_presenters.py=a752bb6b837d0332ad69047912dffeb537c7bd3f
          acs/full_product_actions.py=f51d716e56ea185f0d4bcdb06927d03dcd64bf59
          acs/full_product_ui_shell.py=f97b3b35dbca7c0527d068ad557ddf3c67c3e491
          acs/keybindings.py=b222f0d625999d8119cb3bb7cebffc961217f610
          acs/ui_native_menu.py=dabed76f2ad60ad0c1032b13ca353e4acc0bf2ad
          acs/stage1_release_ui.py=16e78af6219c8c36f0c4026942ef1d02875a370a
          acs/stage1_release_ui_core.py=b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6
          web/index.html=17803443a815843be3aa1b8c6be1c5abb7e7c888
          run_accessible_chess.py=fb8914d7e63f5c5fa7dfa1669798d571bcf8d1fb
          LOCKS

      - name: Lock exact PGN presentation package
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Feature blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/pgn_webview_projection.py=1e6ba66eca088d65d6585bec1a7cfb31ea762937
          acs/pgn_webview_bridge.py=c8f108c8dcc01c37503833abb5c626d89093145e
          acs/pgn_workspace_webview_adapter.py=8e3981402f4823bbea9d2b0c54aeb8b18dc892d4
          web/full_product_pgn.js=c8da5042c8a9dca73678b54f2f480916d77bfe3c
          tests/test_dev1_pgn_webview_projection.py=2b2c655c82f2427b046eb63d7925e4ceb9c303d4
          tests/test_dev1_pgn_webview_atomicity.py=dd84ea984555921eeed600a4b2f4e419cbb6fe75
          tests/test_dev1_pgn_workspace_webview_adapter.py=03b7c0be4b7728e968a4885d3c3373cf07c1b8ec
          tests/js/pgn_surface_dom_test.js=ae3f7d07bea38883d0e1bffde3778664962ffc2a
          LOCKS

      - name: Compile and parse D01 PGN presentation
        run: |
          python -m compileall -q acs/pgn_webview_projection.py acs/pgn_webview_bridge.py acs/pgn_workspace_webview_adapter.py tests/test_dev1_pgn_webview_projection.py tests/test_dev1_pgn_webview_atomicity.py tests/test_dev1_pgn_workspace_webview_adapter.py
          node --check web/full_product_pgn.js
          node --check tests/js/pgn_surface_dom_test.js
          node tests/js/pgn_surface_dom_test.js

      - name: D01 PGN focused regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_webview_atomicity
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_gametree
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_d06_pgn_roundtrip
          tests.test_pgn_service
          tests.test_pgn_concurrent_save
          tests.test_whole_product_user_journey
          tests.test_keybindings

      - name: Prove exact compatibility with current D06 PgnWorkspace
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$D06_HEAD^{commit}" || git fetch --no-tags origin "$D06_HEAD"
          test "$(git rev-parse "$D06_HEAD:acs/pgn_workspace.py")" = "$D06_WORKSPACE_BLOB"
          test "$(git rev-parse "$D06_HEAD:tests/test_pgn_workspace.py")" = "$D06_WORKSPACE_TEST_BLOB"
          git show "$D06_HEAD:acs/pgn_workspace.py" > acs/pgn_workspace.py
          git show "$D06_HEAD:tests/test_pgn_workspace.py" > tests/test_pgn_workspace.py
          python -m unittest -v tests.test_pgn_workspace
          python - <<'PY'
          from acs.full_product_ui_shell import UILanguage
          from acs.pgn_webview_bridge import PgnWebViewBridge
          from acs.pgn_workspace import PgnWorkspace
          from acs.pgn_workspace_webview_adapter import PgnWorkspaceWebViewProjection

          document = '''[Event "Workspace One"]
          [White "Alpha"]
          [Black "Beta"]
          [Result "1-0"]

          1. e4 e5 (1... c5 {Sicilian} 2. Nf3) 2. Nf3 Nc6 1-0

          [Event "Workspace Two"]
          [White "Gamma"]
          [Black "Delta"]
          [Result "1/2-1/2"]

          1. d4 d5 1/2-1/2
          '''
          workspace = PgnWorkspace.from_text(document)
          calls = []
          def host(action_id, payload):
              calls.append((action_id, dict(payload)))
              return {"path": "C:/Users/private/export.pgn", "token": "SECRET"}

          projection = PgnWorkspaceWebViewProjection(workspace, host, language=UILanguage.EN)
          bridge = PgnWebViewBridge(projection)
          snapshot = projection.snapshot()
          assert snapshot["game"]["count"] == 2
          variation = next(item for item in snapshot["tree"] if item["kind"] == "variation")
          selected = bridge.dispatch("pgn.select", {"node_id": variation["node_id"]})
          assert selected.kind == "selection"
          assert workspace.cursor.line_path
          result = bridge.dispatch("pgn.variation_promote", {})
          assert result.kind == "selection"
          action_id, payload = calls[-1]
          assert action_id == "pgn.variation_promote"
          assert payload["expected_record_digest"] == workspace.view().current_record_digest
          assert payload["content_revision"] == workspace.content_revision
          browser_result = repr(result.payload)
          assert "expected_record_digest" not in browser_result
          assert "line_path" not in browser_result
          assert "SECRET" not in browser_result
          assert "C:/Users/private" not in browser_result
          moved = bridge.dispatch("pgn.next_game", {})
          assert moved.kind == "selection"
          assert workspace.selected_game_index == 1
          assert moved.payload["snapshot"]["game"]["index"] == 1
          print("Exact D06 PgnWorkspace -> D01 WebView compatibility PASS")
          PY
          rm -f acs/pgn_workspace.py tests/test_pgn_workspace.py
          find acs tests -type f -name '*pgn_workspace*.pyc' -delete || true

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
