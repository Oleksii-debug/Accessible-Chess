name: Stage 2 Data Core

on:
  workflow_dispatch:
  push:
    branches:
      - dev/stage2-data-core
      - integration/data-forward-acsdb-v3

permissions:
  contents: read

concurrency:
  group: stage2-data-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Stage 2 data core
        run: >-
          python -m compileall -q
          acs/gametree.py
          acs/gametree_navigation.py
          acs/game_identity.py
          acs/acsdb.py
          acs/duplicate_detection.py
          acs/import_contract.py
          tests
      - name: Run Stage 2 data-core tests
        run: python -m unittest discover -s tests -v
