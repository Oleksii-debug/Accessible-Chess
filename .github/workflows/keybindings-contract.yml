name: Keybinding Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/keybindings.py'
      - 'tests/test_keybindings.py'
      - '.github/workflows/keybindings-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keybindings-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  keybindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove bounded keybinding scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          merge_base="$(git merge-base "$base" HEAD)"
          changed="$(git diff --name-only "$merge_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/keybindings-contract.yml' \
            'acs/keybindings.py' \
            'tests/test_keybindings.py' | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected keybinding contract scope:\n%s\n' "$changed" >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile canonical keybinding contract
        run: python -m py_compile acs/keybindings.py tests/test_keybindings.py
      - name: Run canonical keybinding regressions
        run: python -m unittest -v tests.test_keybindings
