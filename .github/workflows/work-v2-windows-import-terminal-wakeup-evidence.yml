name: V2 Windows Import Terminal Wakeup Recovery

on:
  push:
    branches:
      - work/v2-import-terminal-wakeup-retry-20260907
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907

permissions:
  contents: read

concurrency:
  group: v2-windows-import-terminal-wakeup-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNTIME_BASE: 40e1ef2184177600bcc88911529b718adde65df9

jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove exact current-runtime ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RUNTIME_BASE" HEAD
          git diff --check "$RUNTIME_BASE" HEAD
          changed="$(git diff --name-only "$RUNTIME_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/work-v2-windows-import-terminal-wakeup-evidence.yml' \
            'acs/version2_windows_import_ui_pump.py' \
            'tests/test_work_v2_windows_import_terminal_wakeup_evidence.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected terminal-wakeup repair scope:\n%s\n' "$changed" >&2
            exit 1
          }
      - name: Compile owned boundary
        run: >-
          python -m compileall -q
          acs/version2_windows_import_ui_pump.py
          acs/version2_windows_host_runtime.py
          tests/test_work_v2_windows_import_terminal_wakeup_evidence.py
      - name: Preserve inherited mailbox, UI-pump and exact-host contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_host_runtime
          tests.test_version2_import_terminal_ui
      - name: Prove terminal import event self-recovers after transient UI-post failure
        run: python -m unittest -v tests.test_work_v2_windows_import_terminal_wakeup_evidence
      - name: Full unittest regression
        run: python -m unittest discover -s tests -v
      - name: Full pytest regression
        run: python -m pytest -q
