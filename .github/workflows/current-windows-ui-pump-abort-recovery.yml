name: Current Windows UI Pump Abort Recovery

on:
  push:
    branches:
      - fix/windows-ui-pump-abort-recovery-20261006-hy6ez0h
  pull_request:
    branches:
      - fix/windows-file-event-sink-detached-20261006-hy6ez0h
    paths:
      - acs/version2_windows_import_ui_pump.py
      - tests/test_v2_windows_import_ui_pump.py
      - tests/test_v2_windows_host_runtime.py
      - .github/workflows/current-windows-ui-pump-abort-recovery.yml

permissions:
  contents: read

concurrency:
  group: current-windows-ui-pump-abort-recovery-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: dde4444c77a9c1f92e29749546c6ac053a36c91d
  PARENT_BRANCH: fix/windows-file-event-sink-detached-20261006-hy6ez0h
  EXPECTED_PUMP_SOURCE_BLOB: 9b3b4e5f41a3c1187bc47cb11a37480115ddb2ee
  EXPECTED_PUMP_TEST_BLOB: ba2a194e526b69598c4ef021b9f9e1a505f469e8
  EXPECTED_RUNTIME_TEST_BLOB: c2d32b395b00b6462061de5f3be0f40d2c5e9dc9
  EXPECTED_FILE_SOURCE_BLOB: f9c0450c7add7ff19d975abd71cbe4e5c5cc054a

jobs:
  abort-recovery:
    name: UI pump abort recovery / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact UI-pump child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/ui-pump-parent"
          live_parent="$(git rev-parse refs/remotes/origin/ui-pump-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "UI_PUMP_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-ui-pump-abort-recovery.yml"
            "acs/version2_windows_import_ui_pump.py"
            "tests/test_v2_windows_host_runtime.py"
            "tests/test_v2_windows_import_ui_pump.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_import_ui_pump.py)" = "$EXPECTED_PUMP_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_import_ui_pump.py)" = "$EXPECTED_PUMP_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_host_runtime.py)" = "$EXPECTED_RUNTIME_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_FILE_SOURCE_BLOB"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile UI pump and runtime
        run: >-
          python -m py_compile
          acs/version2_windows_import_ui_pump.py
          acs/version2_windows_host_runtime.py
          acs/version2_windows_import_event_mailbox.py
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_import_ui_pump.py
          tests/test_v2_windows_host_runtime.py
          tests/test_v2_windows_import_event_mailbox.py
          tests/test_v2_windows_file_logging_passive.py

      - name: Run pump, runtime, mailbox and file-boundary regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_file_logging_passive
