name: Classroom Realtime Moderation Composition QA

on:
  pull_request:
    branches:
      - qa/classroom-durable-policy-server-composition-20261002
    paths:
      - '.github/workflows/classroom-realtime-moderation-composition.yml'
      - '.github/workflows/livekit-moderation-rpc-transport.yml'
      - '.github/workflows/livekit-moderation-service-runtime.yml'
      - 'acs/livekit_moderation_rpc_transport.py'
      - 'acs/livekit_moderation_service_runtime.py'
      - 'tests/test_classroom_realtime_moderation_composition.py'
      - 'tests/test_livekit_moderation_rpc_transport.py'
      - 'tests/test_livekit_moderation_service_runtime.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-realtime-moderation-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  realtime-moderation-composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact QA head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact runtime owner and bounded QA scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUNTIME_OWNER_SHA: dc0d725c07a1fcd4688e999b4059cc2c26c01906
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "qa/classroom-durable-policy-server-composition-20261002"
          git cat-file -e "$EVENT_BASE_SHA^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$base"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git merge-base --is-ancestor "$RUNTIME_OWNER_SHA" HEAD

          for path in             .github/workflows/livekit-moderation-rpc-transport.yml             .github/workflows/livekit-moderation-service-runtime.yml             acs/livekit_moderation_rpc_transport.py             acs/livekit_moderation_service_runtime.py             tests/test_livekit_moderation_rpc_transport.py             tests/test_livekit_moderation_service_runtime.py
          do
            test "$(git rev-parse "$RUNTIME_OWNER_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done

          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          expected="$(printf '%s\n'             '.github/workflows/classroom-realtime-moderation-composition.yml'             '.github/workflows/livekit-moderation-rpc-transport.yml'             '.github/workflows/livekit-moderation-service-runtime.yml'             'acs/livekit_moderation_rpc_transport.py'             'acs/livekit_moderation_service_runtime.py'             'tests/test_classroom_realtime_moderation_composition.py'             'tests/test_livekit_moderation_rpc_transport.py'             'tests/test_livekit_moderation_service_runtime.py' | sort)"
          test "$changed" = "$expected"

          git diff --quiet "$base...HEAD" --             acs/chesscore.py             acs/classroom_domain.py             acs/classroom_join_credentials.py             acs/classroom_media_policy_authority.py             acs/classroom_moderation_rpc.py             acs/sqlite_classroom_moderation_ledger.py             acs/livekit_classroom_moderation_admin.py

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile realtime server composition
        run: >-
          python -m py_compile
          acs/livekit_moderation_rpc_transport.py
          acs/livekit_moderation_service_runtime.py
          tests/test_classroom_realtime_moderation_composition.py

      - name: Run realtime-to-durable composition and adjacent regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_realtime_moderation_composition
          tests.test_livekit_moderation_service_runtime
          tests.test_livekit_moderation_rpc_transport
          tests.test_classroom_durable_policy_server_composition
          tests.test_classroom_moderation_server_composition
          tests.test_classroom_media_policy_authority
          tests.test_classroom_moderation_rpc
          tests.test_sqlite_classroom_moderation_ledger
          tests.test_livekit_classroom_moderation_admin

      - name: Prove realtime path converges into durable join policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'LiveKitModerationServiceRuntime' tests/test_classroom_realtime_moderation_composition.py
          grep -Fq 'MODERATION_RPC_METHOD' tests/test_classroom_realtime_moderation_composition.py
          grep -Fq 'ClassroomMediaPolicyProviderAdmin' tests/test_classroom_realtime_moderation_composition.py
          grep -Fq 'SqliteClassroomModerationLedger' tests/test_classroom_realtime_moderation_composition.py
          grep -Fq 'STUDENT_ACCOUNT = "account-student-1"' tests/test_classroom_realtime_moderation_composition.py
          grep -Fq 'issuer.grants[0][0].publish_sources' tests/test_classroom_realtime_moderation_composition.py

      - name: Core selftest
        run: python -m acs.selftest
