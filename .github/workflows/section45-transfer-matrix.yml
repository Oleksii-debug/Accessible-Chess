name: Section 45 Cross-Surface Transfer and Profile Matrix
on:
  push:
    branches:
      - work/section45-transfer-matrix-20261009
  pull_request:
    branches:
      - main
    paths:
      - 'acs/visual_profile_transfer.py'
      - 'acs/webapp.py'
      - 'acs/version2_package_preflight.py'
      - 'web/visual_profile_transfer.js'
      - 'web/index.html'
      - 'tests/test_section45_transfer_matrix.py'
      - 'tests/test_version2_package_assembler.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/js/section45_visual_transfer_matrix.js'
      - '.github/workflows/section45-transfer-matrix.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: section45-transfer-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  canonical-section45-transfer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout exact change SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check HEAD^ HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile strict transfer boundary
        run: >-
          python -m py_compile
          acs/visual_profile_transfer.py acs/webapp.py
          acs/version2_package_preflight.py tests/test_section45_transfer_matrix.py
      - name: Run 300-profile acceptance, persistence and security regression
        run: >-
          python -m unittest -v
          tests.test_section45_transfer_matrix
          tests.test_visual_profiles
          tests.test_section41_design_system
          tests.test_section42_board_themes
          tests.test_settings
          tests.test_settings_corruption_security
          tests.test_version2_package_assembler
          tests.test_version2_package_preflight
      - name: Generate exact Python-to-JavaScript interchange oracle
        run: python tools/section45_transfer_oracle.py section45_python_oracle.json
      - name: Execute Web DOM native and browser-local transfer matrix
        env:
          SECTION45_PYTHON_ORACLE: section45_python_oracle.json
        run: |
          node --check web/visual_profile_transfer.js
          node --check tests/js/section45_visual_transfer_matrix.js
          node tests/js/section45_visual_transfer_matrix.js
