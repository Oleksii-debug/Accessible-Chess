name: Current Board Review Ingress Indexed Training Convergence

on:
  pull_request:
    branches:
      - converge/current-stage1-v2-indexed-book-training-20261004-sol56n7k3
    paths:
      - '.github/workflows/current-stage1-board-clock-projection-passive.yml'
      - '.github/workflows/current-v2-keymap-context-passive.yml'
      - '.github/workflows/current-v2-review-fen-bounds.yml'
      - '.github/workflows/current-board-review-ingress-indexed-training-convergence.yml'
      - 'acs/version2_release_ui.py'
      - 'acs/webapp_keymap.py'
      - 'tests/test_stage1_board_clock_projection_passive.py'
      - 'tests/test_v2_keymap_context_passive.py'
      - 'tests/test_v2_review_fen_bounds.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-board-review-indexed-training-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact first-parent geometry and bounded convergence scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-stage1-v2-indexed-book-training-20261004-sol56n7k3}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-board-review-ingress-indexed-training-convergence.yml' \
            '.github/workflows/current-stage1-board-clock-projection-passive.yml' \
            '.github/workflows/current-v2-keymap-context-passive.yml' \
            '.github/workflows/current-v2-review-fen-bounds.yml' \
            'acs/version2_release_ui.py' \
            'acs/webapp_keymap.py' \
            'tests/test_stage1_board_clock_projection_passive.py' \
            'tests/test_v2_keymap_context_passive.py' \
            'tests/test_v2_review_fen_bounds.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Board/review convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile convergence-owned runtime and regressions
        run: >-
          python -m compileall -q
          acs/version2_release_ui.py
          acs/webapp_keymap.py
          acs/book_training.py
          acs/bookreader.py
          acs/version2_training_workspace.py
          tests/test_stage1_v2_board_command_passive_ingress.py
          tests/test_stage1_board_clock_projection_passive.py
          tests/test_v2_keymap_context_passive.py
          tests/test_v2_review_fen_bounds.py

      - name: Execute Board review keyboard and indexed Training regressions
        run: >-
          python -m unittest -v
          tests.test_stage1_v2_board_command_passive_ingress
          tests.test_stage1_board_clock_projection_passive
          tests.test_v2_keymap_context_passive
          tests.test_v2_review_fen_bounds
          tests.test_version2_external_review_live_state_isolation
          tests.test_stage1_board_action_integration
          tests.test_v2_remapped_keyboard_routing
          tests.test_v2_remapped_keyboard_native_editing
          tests.test_book_training_passive_roots_current
          tests.test_bookreader
          tests.test_version2_training_current_runtime
          tests.test_accessible_webui

      - name: Execute retained NVDA machine contract
        run: >-
          python -m unittest -v
          tests.test_nvda_p0_contract
          tests.test_version2_accessibility_convergence

      - name: Core selftest
        run: python -m acs.selftest
