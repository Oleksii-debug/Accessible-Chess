name: D07 ACSDB Migration Atomicity

on:
  workflow_dispatch:
  push:
    branches:
      - 'd07/**'

permissions:
  contents: read

concurrency:
  group: d07-acsdb-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-and-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install -q pytest

      - name: Exact D07 ancestry and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 9c8a342e7dd98fee52c9776c0cb6a9b970d49296 HEAD)" = "9c8a342e7dd98fee52c9776c0cb6a9b970d49296"
          git diff --check 9c8a342e7dd98fee52c9776c0cb6a9b970d49296 HEAD
          git diff --name-only 9c8a342e7dd98fee52c9776c0cb6a9b970d49296 HEAD

      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused migration and Library/Search correctness
        run: >-
          python -m unittest -v
          tests.test_d07_acsdb_migration_atomicity
          tests.test_acsdb
          tests.test_search_service
          tests.test_dev3_search_resource_bounds
          tests.test_dev3_unicode_library_search
          tests.test_dev3_acsdb_position_provenance
          tests.test_dev3_acsdb_wal_scalars
          tests.test_dev3_acsdb_backup_recovery
          tests.test_dev3_acsdb_publication_race
          tests.test_dev3_acsdb_query_plan

      - name: Full unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
