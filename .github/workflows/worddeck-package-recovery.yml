name: WordDeck packaged state recovery

on:
  pull_request:
    branches: [worddeck-bootstrap]
    paths:
      - 'WordDeck/**'
      - 'WordDeck*Harness/**'
      - '.github/workflows/worddeck-*.yml'
      - '.github/workflows/worddeck-*.yaml'
  push:
    branches: [worddeck-bootstrap]
    paths:
      - 'WordDeck/**'
      - 'WordDeck*Harness/**'
      - '.github/workflows/worddeck-*.yml'
      - '.github/workflows/worddeck-*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-recovery:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact revision and WordDeck-only authority boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-WordDeckAuthorityPath([string]$Path) {
            return (
              $Path -like 'WordDeck/*' -or
              $Path -like 'WordDeck*Harness/*' -or
              $Path -like '.github/workflows/worddeck-*.yml' -or
              $Path -like '.github/workflows/worddeck-*.yaml'
            )
          }

          $allowedRegressionPaths = @(
            'WordDeck/AssessmentRuntime.cs',
            'WordDeckMorphologyHarness/Program.cs',
            'WordDeckCourseContractsHarness/WordDeckCourseContractsHarness.csproj',
            '.github/workflows/worddeck-mass120-110-assessment-runtime.yml',
            '.github/workflows/worddeck-example.yaml'
          )
          foreach ($sample in $allowedRegressionPaths) {
            if (-not (Test-WordDeckAuthorityPath $sample)) {
              throw "Authority-boundary regression: expected allowed path was rejected: $sample"
            }
          }

          $forbiddenRegressionPaths = @(
            'AccessibleChess/App.xaml.cs',
            '.github/workflows/ci.yml',
            'README.md'
          )
          foreach ($sample in $forbiddenRegressionPaths) {
            if (Test-WordDeckAuthorityPath $sample) {
              throw "Authority-boundary regression: expected forbidden path was accepted: $sample"
            }
          }

          $head = (git rev-parse HEAD).Trim()
          $expected = '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          if ($head -ne $expected) { throw "Package recovery checkout mismatch: expected=$expected actual=$head" }
          Write-Host "Exact package recovery checkout PASS: $head"

          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            if ([string]::IsNullOrWhiteSpace($env:GITHUB_BASE_REF)) {
              throw 'Package-recovery authority boundary cannot resolve an empty pull-request base branch.'
            }

            $baseRemote = "refs/remotes/origin/$($env:GITHUB_BASE_REF)"
            & git fetch --no-tags origin "+refs/heads/$($env:GITHUB_BASE_REF):$baseRemote"
            if ($LASTEXITCODE -ne 0) {
              throw "Package-recovery authority boundary failed to fetch base branch: $($env:GITHUB_BASE_REF)"
            }

            $base = (& git merge-base HEAD $baseRemote).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($base)) {
              throw "Package-recovery authority boundary failed to resolve merge-base for HEAD and $baseRemote"
            }

            $changed = @(& git diff --name-only "$base...HEAD")
            if ($LASTEXITCODE -ne 0) {
              throw "Package-recovery authority boundary failed to diff merge-base $base against HEAD."
            }

            Write-Host "Authority merge-base: $base; base branch: $($env:GITHUB_BASE_REF)"
            $forbidden = @($changed | Where-Object { -not (Test-WordDeckAuthorityPath $_) })
            if ($forbidden.Count -ne 0) {
              throw "Package-recovery PR crosses WordDeck authority boundary: $($forbidden -join ', ')"
            }
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and publish self-contained Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build .\WordDeck\WordDeck.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed.' }
          dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\release
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained publish failed.' }
          & .\artifacts\release\WordDeck.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Published EXE self-test failed.' }

      - name: Verify clean published package before state test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $forbidden = @(Get-ChildItem .\artifacts\release -Recurse -File | Where-Object {
            $_.Name -match '^state(\.backup)?\.json$' -or
            $_.Name -match '^spelling-state(\.backup)?\.json$' -or
            $_.Name -match '^sentence-coach-state(\.backup)?\.json$' -or
            $_.Name -like 'WordDeck-profile*.json' -or
            $_.FullName -match '[\\/]Backups[\\/]'
          })
          if ($forbidden.Count -ne 0) { throw "Published tree contains personal state: $($forbidden.FullName -join ', ')" }

      - name: Setup WinApp CLI for real Windows UI Automation
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Prove close reopen and clean package replacement preserve state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\WordDeck\scripts\worddeck-package-recovery-smoke.ps1 -CandidateRoot .\artifacts\release
