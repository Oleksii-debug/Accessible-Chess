name: W6 V2 Package Assembler Current Runtime

on:
  push:
    branches:
      - work/w6-v2-package-assembler-current-preflight-20260910
      - fix/w6-package-retained-gates-20260912
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907
    paths:
      - 'acs/version2_package_assembler.py'
      - 'acs/version2_package_preflight.py'
      - 'tests/test_version2_package_assembler.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/test_version2_package_preflight_hardening.py'
      - 'tests/test_v2_package_required_resources.py'
      - 'tests/test_version2_package_zip_topology_preflight.py'
      - 'tests/test_version2_stockfish_source_archive_preflight.py'
      - '.github/workflows/w6-v2-package-assembler.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w6-v2-package-assembler-current-${{ github.ref }}
  cancel-in-progress: true

env:
  ASSEMBLER_OWNER: 977910b28725ab26ecded690bfb1dcbb7ee25cf9
  ASSEMBLER_BLOB: 0a365844b491cb4e0978a595debac56453ff4240
  ASSEMBLER_TEST_BLOB: 40fc718d65afd8f90fd8bd021c462bfc287d406e
  INTEGRATED_PREFLIGHT_OWNER: 44aa0dbb6340e0d85aa7a2b439a72bb2f450c6d9
  PREFLIGHT_BLOB: c66c41257b82bacce8af4b5d09ffd8db2893a666

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove retained assembler and current preflight authorities
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$ASSEMBLER_OWNER^{commit}"
          git cat-file -e "$INTEGRATED_PREFLIGHT_OWNER^{commit}"
          git merge-base --is-ancestor "$ASSEMBLER_OWNER" HEAD
          git merge-base --is-ancestor "$INTEGRATED_PREFLIGHT_OWNER" HEAD
          git diff --check
          test "$(git rev-parse HEAD:acs/version2_package_assembler.py)" = "$ASSEMBLER_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_package_assembler.py)" = "$ASSEMBLER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_package_preflight.py)" = "$PREFLIGHT_BLOB"
          echo 'RETAINED ASSEMBLER + INTEGRATED #686 PREFLIGHT AUTHORITIES PASS'

      - name: Compile assembler and canonical preflight
        run: >-
          python -m compileall -q
          acs/version2_package_assembler.py
          acs/version2_package_preflight.py
          tests/test_version2_package_assembler.py
          tests/test_version2_package_preflight.py
          tests/test_version2_package_preflight_hardening.py
          tests/test_v2_package_required_resources.py
          tests/test_version2_package_zip_topology_preflight.py
          tests/test_version2_stockfish_source_archive_preflight.py

      - name: Direct fresh temp sibling oracle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from unittest.mock import patch

          from acs.version2_package_assembler import assemble_version2_package_tree
          from tests.test_version2_package_assembler import Version2PackageAssemblerTests, _SHA

          real_mkdtemp = tempfile.mkdtemp
          observed = []

          def record_mkdtemp(*args, **kwargs):
              observed.append((kwargs.get("prefix"), kwargs.get("dir")))
              return real_mkdtemp(*args, **kwargs)

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              product, notices = Version2PackageAssemblerTests()._sources(root)
              output = root / "candidate"
              with patch("acs.version2_package_assembler.tempfile.mkdtemp", side_effect=record_mkdtemp):
                  assemble_version2_package_tree(product, notices, output, integration_sha=_SHA)
              assert observed == [(".candidate.assemble-", root)], observed
              assert output.is_dir()
              assert not any(root.glob(".candidate.assemble-*"))
          print("DIRECT FRESH TEMP SIBLING PASS")
          PY

      - name: Deterministic assembler plus current canonical preflight regressions
        run: >-
          python -m unittest -v
          tests.test_version2_package_assembler
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening
          tests.test_v2_package_required_resources
          tests.test_version2_package_zip_topology_preflight
          tests.test_version2_stockfish_source_archive_preflight
