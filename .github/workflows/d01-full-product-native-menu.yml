name: D01 Full Product Native Menu

on:
  pull_request:
    paths:
      - 'acs/full_product_native_menu.py'
      - 'acs/full_product_webview_adapter.py'
      - 'tests/test_dev1_full_product_webview_adapter.py'
      - 'tests/test_full_product_native_menu.py'
      - '.github/workflows/d01-full-product-native-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d01-full-product-native-menu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      BOOKS_TRAINING_BASE: c50546ac9b406d17e0f4b12488cc246437af2a1c
      FULL_MENU_FEATURE: 974fb0d43ff993aea3f5a1eaf13b978659ebf6a6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact child ancestry and D01 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "$FULL_MENU_FEATURE"
          test "$(git rev-list --count "$BOOKS_TRAINING_BASE"..HEAD)" = "2"
          git merge-base --is-ancestor "$BOOKS_TRAINING_BASE" HEAD
          git diff --check "$BOOKS_TRAINING_BASE" HEAD
          changed="$(git diff --name-only "$BOOKS_TRAINING_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d01-full-product-native-menu.yml' \
            'acs/full_product_native_menu.py' \
            'acs/full_product_webview_adapter.py' \
            'tests/test_dev1_full_product_webview_adapter.py' \
            'tests/test_full_product_native_menu.py' | sort)"
          test "$changed" = "$expected"

      - name: Lock central registry frozen Stage1 menu and release surface
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/full_product_actions.py=f51d716e56ea185f0d4bcdb06927d03dcd64bf59
          acs/full_product_ui_shell.py=f97b3b35dbca7c0527d068ad557ddf3c67c3e491
          acs/keybindings.py=b222f0d625999d8119cb3bb7cebffc961217f610
          acs/ui_native_menu.py=dabed76f2ad60ad0c1032b13ca353e4acc0bf2ad
          acs/stage1_release_ui.py=16e78af6219c8c36f0c4026942ef1d02875a370a
          acs/stage1_release_ui_core.py=b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6
          web/index.html=17803443a815843be3aa1b8c6be1c5abb7e7c888
          run_accessible_chess.py=fb8914d7e63f5c5fa7dfa1669798d571bcf8d1fb
          LOCKS
          git diff --quiet "$BOOKS_TRAINING_BASE" HEAD -- \
            acs/full_product_actions.py \
            acs/full_product_ui_shell.py \
            acs/keybindings.py \
            acs/ui_native_menu.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py \
            web/index.html \
            run_accessible_chess.py

      - name: Lock Full Product native menu blobs
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/full_product_native_menu.py=34c81071e900122085e6569c525500957e5fa979
          acs/full_product_webview_adapter.py=f1b4df93ecf4e20b97a9e9c5bc8c4dbda16efef0
          tests/test_dev1_full_product_webview_adapter.py=a9862695c4cc1c8b3204acc6cdc7d8127df925ed
          tests/test_full_product_native_menu.py=90ed2b6fca648ce35ab55b43a26715222a3cc73c
          LOCKS

      - name: Compile Full Product native menu package
        run: >-
          python -m compileall -q
          acs/full_product_native_menu.py
          acs/full_product_webview_adapter.py
          tests/test_full_product_native_menu.py

      - name: Full Product menu focus privacy and Stage1 menu matrix
        run: >-
          python -m unittest -v
          tests.test_full_product_native_menu
          tests.test_dev1_full_product_webview_adapter
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_full_product_accessible_shell
          tests.test_stage1_native_menu_action_routing
          tests.test_ui_native_menu_recovery
          tests.test_windows_native_menu_smoke_contract

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
