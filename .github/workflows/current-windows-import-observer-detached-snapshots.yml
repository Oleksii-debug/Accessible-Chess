name: Current Windows Import Observer Detached Snapshots

on:
  push:
    branches:
      - fix/windows-import-observer-detached-snapshots-20261006-hy6ez0h
  pull_request:
    branches:
      - fix/windows-import-observer-passive-20261005-sol56z8r0
    paths:
      - acs/version2_windows_library_import_observer.py
      - tests/test_v2_windows_library_import_observer.py
      - .github/workflows/current-windows-import-observer-detached-snapshots.yml

permissions:
  contents: read

concurrency:
  group: current-windows-import-observer-detached-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 753bcc290e26b488e5bb7ea41ddbf39bb551215d
  PARENT_BRANCH: fix/windows-import-observer-passive-20261005-sol56z8r0
  EXPECTED_OBSERVER_SOURCE_BLOB: d9b4885aa964f7a83d28872e5ebc81eeeabb9107
  EXPECTED_OBSERVER_TEST_BLOB: 806ee1c9ffcfceb3248a52ee2703612874137d49
  EXPECTED_CHESSBASE_SOURCE_BLOB: e0dd4f970d2e6f4a7198b2b09079866db2f54b60
  EXPECTED_WINDOWS_FILE_SOURCE_BLOB: 2aee89abd416c2ad169e264c3c7141767aa0b46d

jobs:
  detached-observer:
    name: Detached observer snapshots / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact detached-observer child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/detached-observer-parent"
          live_parent="$(git rev-parse refs/remotes/origin/detached-observer-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "DETACHED_OBSERVER_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-import-observer-detached-snapshots.yml"
            "acs/version2_windows_library_import_observer.py"
            "tests/test_v2_windows_library_import_observer.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_library_import_observer.py)" = "$EXPECTED_OBSERVER_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_library_import_observer.py)" = "$EXPECTED_OBSERVER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/chessbase_library_import.py)" = "$EXPECTED_CHESSBASE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_WINDOWS_FILE_SOURCE_BLOB"

          echo "DETACHED_OBSERVER_PARENT=$EXPECTED_PARENT"
          echo "DETACHED_OBSERVER_HEAD=$expected_head"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile observer and inherited import boundaries
        run: >-
          python -m py_compile
          acs/version2_windows_library_import_observer.py
          acs/chessbase_library_import.py
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_library_import_observer.py
          tests/test_chessbase_library_import_report_passive.py
          tests/test_v2_windows_file_worker_shutdown_fence.py
          tests/test_v2_windows_nvda_file_workflows.py

      - name: Run detached observer and inherited regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_library_import_observer
          tests.test_chessbase_library_import_report_passive
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
