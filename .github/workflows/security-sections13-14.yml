name: Security Sections 13-14 Rollback and Safe Expiry

on:
  pull_request:
    paths:
      - 'acs/entitlements.py'
      - 'acs/entitlement_runtime_security.py'
      - 'acs/ui_entitlement.py'
      - 'tests/test_entitlements.py'
      - 'tests/test_entitlement_runtime_security.py'
      - 'tests/test_ui_entitlement_integration.py'
      - 'docs/automation/SECURITY_SECTIONS_13_14_CLOSURE.md'
      - 'docs/automation/SECURITY_SECTION_CLOSURE_STATE.md'
      - '.github/workflows/security-sections13-14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-13-14:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact checkout and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check HEAD^
      - name: Compile security authority
        run: >-
          python -m py_compile
          acs/entitlements.py
          acs/entitlement_runtime_security.py
          acs/ui_entitlement.py
          tests/test_entitlements.py
          tests/test_entitlement_runtime_security.py
          tests/test_ui_entitlement_integration.py
      - name: Run Security 13-14 contract
        run: >-
          python -m unittest -v
          tests.test_entitlements
          tests.test_entitlement_runtime_security
          tests.test_ui_entitlement_integration
      - name: Prove recovery-only non-destructive boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("acs/entitlement_runtime_security.py").read_text(encoding="utf-8")
          ui = Path("acs/ui_entitlement.py").read_text(encoding="utf-8")
          forbidden = (
              "os.remove(", "os.unlink(", "Path.unlink(", "shutil.rmtree(",
              "rmtree(", "encrypt_user_data", "delete_user_data",
          )
          for token in forbidden:
              assert token not in source
              assert token not in ui
          required = (
              "account.login", "account.recovery", "entitlement.refresh",
              "app.update", "help.open", "data.export", "data.recovery",
              "security.status",
          )
          for token in required:
              assert token in source, token
          print("SECURITY_13_14_NON_DESTRUCTIVE_RECOVERY_BOUNDARY=PASS")
          PY
