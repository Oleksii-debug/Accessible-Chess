name: Classroom collaboration UI contract

on:
  pull_request:
    branches:
      - feature/classroom-collaboration-contract-20260926
    paths:
      - 'acs/classroom_collaboration_webview.py'
      - 'acs/version2_final_product_application.py'
      - 'web/full_product_education.js'
      - 'tests/test_classroom_collaboration_webview.py'
      - 'tests/test_classroom_collaboration_final_product.py'
      - 'tests/js/classroom_collaboration_surface_dom_test.js'
      - '.github/workflows/classroom-collaboration-ui-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-collaboration-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact collaboration UI scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-collaboration-ui-contract.yml'
            'acs/classroom_collaboration_webview.py'
            'acs/version2_final_product_application.py'
            'tests/js/classroom_collaboration_surface_dom_test.js'
            'tests/test_classroom_collaboration_final_product.py'
            'tests/test_classroom_collaboration_webview.py'
            'web/full_product_education.js'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected collaboration UI PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'CLASSROOM_COLLABORATION_UI_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile collaboration UI boundaries
        run: >-
          python -m py_compile
          acs/classroom_collaboration_webview.py
          acs/version2_final_product_application.py
          tests/test_classroom_collaboration_webview.py
          tests/test_classroom_collaboration_final_product.py

      - name: Run collaboration UI and adjacent contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_collaboration_webview
          tests.test_classroom_collaboration_final_product
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
          tests.test_version2_education_class_create

      - name: Run semantic DOM regressions
        run: |
          node tests/js/classroom_collaboration_surface_dom_test.js
          node tests/js/education_surface_dom_test.js
