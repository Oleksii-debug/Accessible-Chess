name: WordDeck Worker 02 R4d Context Gate

on:
  push:
    branches:
      - worddeck-worker-2-context-r4d
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: worddeck-worker2-context-r4d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-r4d-gate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Publish pending exact-tip status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'WordDeck Worker 02 R4d Context Gate',
              description: 'Stage-11 exact-tip Windows + real-corpus measurement gate is running.',
              target_url: targetUrl
            });

      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate SentencePack release validator self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .\WordDeck\tools\validate_sentencepack_release_bundle.py --self-test

      - name: Restore
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Build Release warnings as errors
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror

      - name: Run complete source-build self-test suite
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Publish self-contained Windows x64
        run: dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-worker2-context-r4d

      - name: Run published WordDeck EXE self-test
        shell: pwsh
        run: |
          & .\artifacts\WordDeck-worker2-context-r4d\WordDeck.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no personal state in publish tree
        shell: pwsh
        run: |
          $bad = Get-ChildItem -LiteralPath '.\artifacts\WordDeck-worker2-context-r4d' -Recurse -File | Where-Object {
            $_.Name -match '^(state|spelling-state|sentence-state|sentence-coach-state)(\.backup)?\.json$' -or
            $_.Name -match '^WordDeck-profile.*\.json$' -or
            $_.FullName -match '[\\/]Backups[\\/]'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "Personal state leaked into publish tree: $($_.FullName)" }
            exit 1
          }
          Write-Host 'Publish tree contains no recognized personal state/profile files.'

      - name: Cyrillic and spaces path smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'WordDeck контекст R4d\Published App'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path '.\artifacts\WordDeck-worker2-context-r4d\*' -Destination $target -Recurse -Force
          & (Join-Path $target 'WordDeck.exe') --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download historical attributed R3 SentencePack evidence read-only
        uses: actions/download-artifact@v4
        with:
          name: WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-r3
          path: artifacts/r3-attributed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32573223432

      - name: Verify historical SQLite against its R3 SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sqlite = Get-ChildItem -LiteralPath '.\artifacts\r3-attributed' -Recurse -File -Filter 'WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-v1.sqlite' | Select-Object -First 1
          if (-not $sqlite) { throw 'Historical attributed SQLite was not found in the exact R3 artifact.' }
          $sums = Get-ChildItem -LiteralPath '.\artifacts\r3-attributed' -Recurse -File -Filter 'SHA256SUMS.txt' | Select-Object -First 1
          if (-not $sums) { throw 'Historical R3 SHA256SUMS.txt was not found.' }
          $line = Get-Content -LiteralPath $sums.FullName | Where-Object { $_ -match ([regex]::Escape($sqlite.Name) + '$') } | Select-Object -First 1
          if (-not $line) { throw "Historical R3 SHA256SUMS does not name $($sqlite.Name)." }
          $expected = (($line -split '\s+', 2)[0]).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $sqlite.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Historical attributed SQLite hash mismatch: expected $expected, actual $actual." }
          "R3_ATTRIBUTED_SQLITE=$($sqlite.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "R3_ATTRIBUTED_SQLITE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified exact historical attributed SQLite sha256=$actual bytes=$($sqlite.Length)."

      - name: Remeasure exact real corpus with lexical-form-aware 1 2 3 target algorithm
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.\artifacts\context-r4d-real-evidence' | Out-Null
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-context-coverage `
            "$env:R3_ATTRIBUTED_SQLITE" `
            .\artifacts\context-r4d-real-evidence\context-coverage-r4d.json `
            "$env:R3_ATTRIBUTED_SQLITE_SHA" `
            tatoeba-en-uk-attributed-ccby-v1
          if ($LASTEXITCODE -ne 0) { throw "Lexical-form-aware real-corpus measurement failed with exit code $LASTEXITCODE." }

      - name: Validate and bind real-corpus evidence boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Resolve-Path '.\artifacts\context-r4d-real-evidence\context-coverage-r4d.json'
          $document = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $p = $document.Payload
          if ($p.SchemaId -ne 'worddeck-context-coverage-evidence-v1') { throw 'Unexpected context evidence schema.' }
          if ($p.MeasurementAlgorithm -ne 'worddeck-context-natural-lexical-v1') { throw 'Unexpected context measurement algorithm.' }
          if ($p.DatabaseSha256 -ne $env:R3_ATTRIBUTED_SQLITE_SHA) { throw 'Evidence JSON is not bound to the verified historical SQLite hash.' }
          if ($p.SourceId -ne 'tatoeba-en-uk-attributed-ccby-v1') { throw 'Evidence JSON PackId mismatch.' }
          if ($p.DictionaryEntryCount -ne 5446 -or -not $p.ExactOxford5446Verified) { throw 'Evidence JSON is not bound to the exact Oxford 5446 universe.' }
          if (-not $p.ExactDatabaseIdentityVerified -or -not $p.CanSupportRealCorpusCoverageClaim) { throw 'Exact real-corpus identity was not verified.' }
          if ($p.RedistributionApproved) { throw 'Coverage measurement must never self-approve redistribution.' }
          if ($p.OneTarget.ScopeEntryCount -ne 5446 -or $p.TwoTarget.ScopeEntryCount -ne 5446 -or $p.ThreeTarget.ScopeEntryCount -ne 5446) { throw 'Coverage bands do not all partition the full 5446 universe.' }
          if (($p.OneTarget.CoveredEntryCount + $p.OneTarget.UncoveredEntryCount) -ne 5446) { throw 'One-target partition is incomplete.' }
          if (($p.TwoTarget.CoveredEntryCount + $p.TwoTarget.UncoveredEntryCount) -ne 5446) { throw 'Two-target partition is incomplete.' }
          if (($p.ThreeTarget.CoveredEntryCount + $p.ThreeTarget.UncoveredEntryCount) -ne 5446) { throw 'Three-target partition is incomplete.' }
          $gapPath = [System.IO.Path]::Combine([System.IO.Path]::GetDirectoryName($evidencePath), ([System.IO.Path]::GetFileNameWithoutExtension($evidencePath) + '.gaps.json'))
          if (-not (Test-Path -LiteralPath $gapPath)) { throw 'Prioritized context gap remediation JSON was not produced.' }
          $gapDocument = Get-Content -LiteralPath $gapPath -Raw | ConvertFrom-Json
          $g = $gapDocument.Payload
          if ($g.SchemaId -ne 'worddeck-context-gap-remediation-v1') { throw 'Unexpected context gap remediation schema.' }
          if ($g.EvidenceDigestSha256 -ne $document.EvidenceDigestSha256) { throw 'Gap remediation plan is not bound to the exact coverage evidence digest.' }
          if ($g.DatabaseSha256 -ne $env:R3_ATTRIBUTED_SQLITE_SHA) { throw 'Gap remediation plan is not bound to the verified SQLite hash.' }
          if (($g.MissingOneTargetCount + $g.MissingNaturalPairOnlyCount + $g.MissingNaturalTripleOnlyCount + $g.NaturalTripleCoveredCount) -ne 5446) { throw 'Gap remediation tiers do not partition all 5,446 stable IDs.' }
          if ($g.MissingOneTargetCount -ne $p.OneTarget.UncoveredEntryCount) { throw 'Priority-1 gap count does not match one-target uncovered count.' }
          if (($g.MissingOneTargetCount + $g.MissingNaturalPairOnlyCount) -ne $p.TwoTarget.UncoveredEntryCount) { throw 'Priority-1/2 gaps do not match two-target uncovered count.' }
          if (($g.MissingOneTargetCount + $g.MissingNaturalPairOnlyCount + $g.MissingNaturalTripleOnlyCount) -ne $p.ThreeTarget.UncoveredEntryCount) { throw 'Priority-1/2/3 gaps do not match three-target uncovered count.' }
          $sourceRoot = Resolve-Path '.\artifacts\r3-attributed'
          foreach ($name in @('tatoeba-en-uk-attributed.tsv.manifest.json','SHA256SUMS.txt','TATOEBA_SENTENCEPACK_NOTICE.md','sentencepack-runtime-metrics.json','sentencepack-metrics.json')) {
            $file = Get-ChildItem -LiteralPath $sourceRoot -Recurse -File -Filter $name | Select-Object -First 1
            if ($file) { Copy-Item -LiteralPath $file.FullName -Destination (Join-Path '.\artifacts\context-r4d-real-evidence' $name) -Force }
          }
          @(
            'Historical measurement input only; not a production redistribution approval.',
            'source_run_id=32573223432',
            'source_head=c3beac1156a7cd4060071aa00a1bff5c1ea0cbaa',
            'source_artifact_id=9475904984',
            'source_artifact_name=WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-r3',
            'source_artifact_zip_sha256=882592fb005ae4a1a0bf8431d0ed9cf6995c4218e5827bb25f4d9a3f3806fe44',
            "sqlite_sha256=$env:R3_ATTRIBUTED_SQLITE_SHA",
            "measurement_head=${{ github.sha }}",
            "one_target_covered=$($p.OneTarget.CoveredEntryCount)",
            "two_target_covered=$($p.TwoTarget.CoveredEntryCount)",
            "three_target_covered=$($p.ThreeTarget.CoveredEntryCount)",
            "priority1_missing_any_context=$($g.MissingOneTargetCount)",
            "priority2_missing_pair_only=$($g.MissingNaturalPairOnlyCount)",
            "priority3_missing_triple_only=$($g.MissingNaturalTripleOnlyCount)",
            "evidence_sha256=$($document.EvidenceDigestSha256)",
            "remediation_sha256=$($gapDocument.PlanDigestSha256)"
          ) | Set-Content -LiteralPath '.\artifacts\context-r4d-real-evidence\MEASUREMENT_SOURCE.txt' -Encoding utf8
          Write-Host ("REAL lexical coverage: one={0}/{1} ({2:N2}%); two={3}/{4} ({5:N2}%); three={6}/{7} ({8:N2}%); sentences={9}; evidence_sha256={10}" -f `
            $p.OneTarget.CoveredEntryCount,$p.OneTarget.ScopeEntryCount,$p.OneTarget.CoveragePercent, `
            $p.TwoTarget.CoveredEntryCount,$p.TwoTarget.ScopeEntryCount,$p.TwoTarget.CoveragePercent, `
            $p.ThreeTarget.CoveredEntryCount,$p.ThreeTarget.ScopeEntryCount,$p.ThreeTarget.CoveragePercent, `
            $p.SentenceCount,$document.EvidenceDigestSha256)
          Write-Host ("REAL remediation tiers: priority1={0}; priority2={1}; priority3={2}; triple-covered={3}; remediation_sha256={4}" -f `
            $g.MissingOneTargetCount,$g.MissingNaturalPairOnlyCount,$g.MissingNaturalTripleOnlyCount,$g.NaturalTripleCoveredCount,$gapDocument.PlanDigestSha256)
          foreach ($level in $g.LevelSummaries) {
            Write-Host ("REAL gap level {0}: priority1={1}; priority2={2}; priority3={3}; total={4}" -f `
              $level.Level,$level.MissingOneTarget,$level.MissingNaturalPair,$level.MissingNaturalTriple,$level.TotalPriorityGaps)
          }

      - name: Upload real-corpus lexical coverage evidence only
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-context-real-coverage-r4d-${{ github.sha }}
          path: artifacts/context-r4d-real-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact-tip publish artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-worker2-context-r4d-${{ github.sha }}
          path: artifacts/WordDeck-worker2-context-r4d
          if-no-files-found: error
          retention-days: 7

      - name: Publish final exact-tip status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'WordDeck Worker 02 R4d Context Gate',
              description: succeeded
                ? 'Stage-11 exact-tip Windows + real-corpus lexical measurement gate passed.'
                : 'Stage-11 exact-tip Windows + real-corpus lexical measurement gate failed.',
              target_url: targetUrl
            });
