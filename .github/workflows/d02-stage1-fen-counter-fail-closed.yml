name: D02 Stage1 FEN Counter Fail-Closed Repair

on:
  push:
    branches:
      - repair/d02-stage1-fen-counter-fail-closed-20260823
  pull_request:
    branches:
      - release/dev5-stage1-combined-repair-20260823

permissions:
  contents: read

env:
  EXACT_COMBINED_BASE_SHA: 574d8c7344a7490de46ba38498f363395c951019

jobs:
  fen-counter-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repair head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Exact combined base and narrow diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXACT_COMBINED_BASE_SHA" HEAD)" = "$EXACT_COMBINED_BASE_SHA"
          git diff --check "$EXACT_COMBINED_BASE_SHA" HEAD
          python - <<'PY'
          import os, subprocess
          allowed={
              'acs/chesscore.py',
              'tests/test_d02_fen_counter_fail_closed.py',
              '.github/workflows/d02-stage1-fen-counter-fail-closed.yml',
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['EXACT_COMBINED_BASE_SHA'],'HEAD'], text=True
          ).splitlines())
          assert changed == allowed, (changed, allowed)
          print('D02 FEN COUNTER NARROW DIFF PASS', sorted(changed))
          PY
      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: D02 FEN counter fail-closed regression
        run: python -m unittest -v tests.test_d02_fen_counter_fail_closed
      - name: Existing FEN position history and API regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_fen_atomicity
          tests.test_position_editor
          tests.test_stage1_core_full_flow
          tests.test_stage1_complete_user_flow
          tests.test_history
          tests.test_ui_review_adapter
          tests.test_manual5_cross_lane_regression
      - name: Combined accepted history and Stockfish repair regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_history_scalar_fail_closed
          tests.test_stage1_stockfish_runtime_path_privacy
          tests.test_stockfish_runtime
      - name: Full unittest
        run: python -m unittest discover -v tests
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Canonical selftest
        run: python -m acs.selftest
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic

  fen-counter-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout repair head with LF semantics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact LF source and verify base
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          if((git merge-base $env:EXACT_COMBINED_BASE_SHA HEAD).Trim() -ne $env:EXACT_COMBINED_BASE_SHA){throw 'Exact combined-base ancestry mismatch'}
          git diff --check $env:EXACT_COMBINED_BASE_SHA HEAD
          if($LASTEXITCODE -ne 0){throw 'Diff hygiene failed'}
          $changed=@(git diff --name-only $env:EXACT_COMBINED_BASE_SHA HEAD)
          $allowed=@('.github/workflows/d02-stage1-fen-counter-fail-closed.yml','acs/chesscore.py','tests/test_d02_fen_counter_fail_closed.py')
          $extra=@($changed | Where-Object {$_ -notin $allowed})
          if($extra.Count -ne 0 -or $changed.Count -ne 3){throw "Narrow Product diff mismatch: $($changed -join ', ')"}
          'D02 WINDOWS EXACT COMBINED BASE + NARROW DIFF PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: D02 FEN counter fail-closed regression
        run: python -m unittest -v tests.test_d02_fen_counter_fail_closed
      - name: Existing FEN position history and API regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_fen_atomicity
          tests.test_position_editor
          tests.test_stage1_core_full_flow
          tests.test_stage1_complete_user_flow
          tests.test_history
          tests.test_ui_review_adapter
          tests.test_manual5_cross_lane_regression
      - name: Combined accepted history and Stockfish repair regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_history_scalar_fail_closed
          tests.test_stage1_stockfish_runtime_path_privacy
          tests.test_stockfish_runtime
      - name: Full unittest
        run: python -m unittest discover -v tests
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Canonical selftest
        run: python -m acs.selftest
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
