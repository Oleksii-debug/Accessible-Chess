name: D01 Books Training UI Integration

on:
  pull_request:
    paths:
      - 'acs/book_webview_bridge.py'
      - 'acs/book_webview_projection.py'
      - 'acs/training_webview_bridge.py'
      - 'acs/training_webview_projection.py'
      - 'tests/js/books_training_surface_dom_test.js'
      - 'tests/test_books_training_ui_integration.py'
      - 'tests/test_dev1_books_training_web_asset.py'
      - 'tests/test_dev1_books_training_webview_atomicity.py'
      - 'tests/test_dev1_books_training_webview_bridge.py'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - 'web/full_product_books_training.js'
      - '.github/workflows/d01-books-training-ui-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d01-books-training-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      WHOLE_PRODUCT_BASE: e809ad24b42b36e697163f5f9fc7976589955406
      BOOKS_TRAINING_FEATURE: 387acd9a37b3e0c93dd2445bb777430cd7d3e6b7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact ancestry and presentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "$BOOKS_TRAINING_FEATURE"
          test "$(git rev-list --count "$WHOLE_PRODUCT_BASE"..HEAD)" = "2"
          git merge-base --is-ancestor "$WHOLE_PRODUCT_BASE" HEAD
          git diff --check "$WHOLE_PRODUCT_BASE" HEAD
          changed="$(git diff --name-only "$WHOLE_PRODUCT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d01-books-training-ui-integration.yml' \
            'acs/book_webview_bridge.py' \
            'acs/book_webview_projection.py' \
            'acs/training_webview_bridge.py' \
            'acs/training_webview_projection.py' \
            'tests/js/books_training_surface_dom_test.js' \
            'tests/test_books_training_ui_integration.py' \
            'tests/test_dev1_books_training_web_asset.py' \
            'tests/test_dev1_books_training_webview_atomicity.py' \
            'tests/test_dev1_books_training_webview_bridge.py' \
            'tests/test_dev1_books_training_webview_projection.py' \
            'web/full_product_books_training.js' | sort)"
          test "$changed" = "$expected"

      - name: Lock canonical D08 engine and Stage1 authority
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/analysis_service.py=c5ca651a9ac299d3794278f9cfae8f16fcb938e4
          acs/book_training.py=b8eab7a982a2eef2e22ba89c4fea5dfb3e2dca5f
          acs/bookdocument.py=63e3e52d6078fdb003819ca915f7c2553c8983c7
          acs/bookreader.py=c3220f8969bbb87a60c5ef7e9e51f42bc7c21b52
          acs/engine_assisted_workflows.py=ae9220a4610c9f6a63afeba8f77644e629b39ca2
          acs/full_product_actions.py=f51d716e56ea185f0d4bcdb06927d03dcd64bf59
          acs/full_product_presenters.py=a752bb6b837d0332ad69047912dffeb537c7bd3f
          acs/full_product_ui_shell.py=f97b3b35dbca7c0527d068ad557ddf3c67c3e491
          acs/training.py=28dcb58b11cd1e8dcd3904eee1ebc81d40d0ffcb
          acs/training_progress_store.py=8b02b4c4e411017ca5775a8b36257ba1c48f6796
          acs/chesscore.py=eb9229b5ee107afe06cdf8a916f466e1474dddd4
          acs/engine.py=01324ff735908dcc2b6515310eef9cbc8572e7ef
          acs/gametree.py=03f5a42956f60dfb7928974084053847bdab5ae5
          acs/stage1_release_ui.py=16e78af6219c8c36f0c4026942ef1d02875a370a
          acs/stage1_release_ui_core.py=b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6
          web/index.html=17803443a815843be3aa1b8c6be1c5abb7e7c888
          run_accessible_chess.py=fb8914d7e63f5c5fa7dfa1669798d571bcf8d1fb
          LOCKS
          git diff --quiet "$WHOLE_PRODUCT_BASE" HEAD -- \
            acs/analysis_service.py \
            acs/book_training.py \
            acs/bookdocument.py \
            acs/bookreader.py \
            acs/chesscore.py \
            acs/engine.py \
            acs/engine_assisted_workflows.py \
            acs/full_product_actions.py \
            acs/full_product_presenters.py \
            acs/full_product_ui_shell.py \
            acs/gametree.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py \
            acs/training.py \
            acs/training_progress_store.py \
            web/index.html \
            run_accessible_chess.py

      - name: Lock Books and Training presentation blobs
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/book_webview_bridge.py=c888f8bf1bc32ea39b25bef7088f8c4fb095485e
          acs/book_webview_projection.py=2e5bbc9cdb8a8884b70a295ba853f4bc40d8ea33
          acs/training_webview_bridge.py=7c429f7c92688552e4e59226b70b3ed9dc65daa9
          acs/training_webview_projection.py=92360ad9316964b665ec8886ec20837d971d09be
          tests/js/books_training_surface_dom_test.js=572b3f510b580430fd6d0e0e2ce1413d8627f5e2
          tests/test_books_training_ui_integration.py=95085f62f5e63b2ad39a74f7c9bfc1246bf072f5
          tests/test_dev1_books_training_web_asset.py=42ee8c0bab3ff0b37db285f2fcdc0494572bb817
          tests/test_dev1_books_training_webview_atomicity.py=04bec06d18076f9941d03fca41b74e67cf4e22ab
          tests/test_dev1_books_training_webview_bridge.py=55c9e4831e801ab7c64eb3dbfda8cc6bb1846f17
          tests/test_dev1_books_training_webview_projection.py=902ec327df0739c90c31911fd128c3fdc8987163
          web/full_product_books_training.js=864c7d63b376f5d69c696b99d8e9e96efc1b7d4b
          LOCKS

      - name: Compile Books and Training presentation package
        run: >-
          python -m compileall -q
          acs/book_webview_bridge.py
          acs/book_webview_projection.py
          acs/training_webview_bridge.py
          acs/training_webview_projection.py
          tests/test_books_training_ui_integration.py

      - name: Execute Books and Training DOM contract
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - name: Books Training D08 and engine integration matrix
        run: >-
          python -m unittest -v
          tests.test_books_training_ui_integration
          tests.test_dev1_books_training_web_asset
          tests.test_dev1_books_training_webview_atomicity
          tests.test_dev1_books_training_webview_bridge
          tests.test_dev1_books_training_webview_projection
          tests.test_d08_book_training_contract
          tests.test_d08_training_canonical_resume
          tests.test_dev3_engine_assisted_workflows
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_full_product_accessible_shell

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
