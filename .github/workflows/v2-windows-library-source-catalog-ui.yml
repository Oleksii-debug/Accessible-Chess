name: V2 Windows Library Source Catalog UI

on:
  push:
    branches:
      - work/v2-windows-library-source-catalog-ui-20260901
  pull_request:
    branches:
      - work/v2-library-source-catalog-20260831
    paths:
      - 'acs/version2_windows_library_source_catalog.py'
      - 'tests/test_v2_windows_library_source_catalog.py'
      - '.github/workflows/v2-windows-library-source-catalog-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-library-source-catalog-ui-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_CATALOG_BASE: 8065568d0759c9371e5b4ff5f8a0ac0d813248fe

jobs:
  source-catalog-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact D01 child scope and owner isolation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_CATALOG_BASE" HEAD
          test "$(git merge-base "$SOURCE_CATALOG_BASE" HEAD)" = "$SOURCE_CATALOG_BASE"
          git diff --check "$SOURCE_CATALOG_BASE" HEAD
          changed="$(git diff --name-only "$SOURCE_CATALOG_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-library-source-catalog-ui.yml' \
            'acs/version2_windows_library_source_catalog.py' \
            'tests/test_v2_windows_library_source_catalog.py' | sort)"
          test "$changed" = "$expected"
          for path in \
            acs/library_source_service.py \
            acs/acsdb.py \
            acs/search_service.py \
            acs/library_import_service.py \
            acs/library_webview_projection.py \
            acs/library_webview_bridge.py \
            acs/full_product_actions.py \
            acs/full_product_native_menu.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py \
            run_accessible_chess.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_CATALOG_BASE:$path")"
          done

      - name: Compile D01 source-catalog package
        run: >-
          python -m compileall -q
          acs/version2_windows_library_source_catalog.py
          tests/test_v2_windows_library_source_catalog.py

      - name: Focused source-catalog UI and canonical D07 contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_library_source_catalog
          tests.test_v2_library_source_catalog
          tests.test_search_service
          tests.test_d07_library_import_service
          tests.test_library_import_ui_integration

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_library_source_catalog.py
          tests/test_v2_library_source_catalog.py
          tests/test_search_service.py
          tests/test_d07_library_import_service.py
          tests/test_library_import_ui_integration.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
