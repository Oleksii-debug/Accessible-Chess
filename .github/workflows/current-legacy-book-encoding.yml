name: Current Legacy Book Encoding

on:
  push:
    branches:
      - work/user-corpus-pgn-cp1251-20261003
    paths:
      - 'acs/legacy_text_encoding.py'
      - 'acs/book_text_import.py'
      - 'acs/book_html_import.py'
      - 'tests/test_legacy_text_encoding.py'
      - 'tests/test_legacy_book_utf16_integration.py'
      - 'tests/test_v2_book_text_import.py'
      - 'tests/test_v2_book_html_import.py'
      - '.github/workflows/current-legacy-book-encoding.yml'
  pull_request:
    paths:
      - 'acs/legacy_text_encoding.py'
      - 'acs/book_text_import.py'
      - 'acs/book_html_import.py'
      - 'tests/test_legacy_text_encoding.py'
      - 'tests/test_legacy_book_utf16_integration.py'
      - 'tests/test_v2_book_text_import.py'
      - 'tests/test_v2_book_html_import.py'
      - '.github/workflows/current-legacy-book-encoding.yml'

permissions:
  contents: read

concurrency:
  group: current-legacy-book-encoding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  book-encoding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile deterministic book decoding
        run: >-
          python -m py_compile
          acs/legacy_text_encoding.py
          acs/book_text_import.py
          acs/book_html_import.py
          tests/test_legacy_text_encoding.py
          tests/test_legacy_book_utf16_integration.py
          tests/test_v2_book_text_import.py
          tests/test_v2_book_html_import.py

      - name: Run TXT Markdown HTML semantic regressions
        run: >-
          python -m unittest -v
          tests.test_legacy_text_encoding
          tests.test_legacy_book_utf16_integration
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import

      - name: Exact whitespace check
        shell: bash
        run: git diff --check
