name: P0 Dynamic Semantic Selection Executable

on:
  pull_request:
    paths:
      - 'web/p0_accessibility_runtime.js'
      - 'web/version2_final_product_bootstrap.js'
      - 'web/index.html'
      - 'tests/js/p0_dynamic_selection_runtime_test.js'
      - 'tests/js/p0_accessibility_partial_replacement_test.js'
      - 'tests/js/p0_selection_ambiguity_runtime_test.js'
      - 'tests/js/p0_selection_route_epoch_runtime_test.js'
      - 'tests/test_p0_dynamic_selection_action_delivery.py'
      - 'tests/test_p0_dynamic_selection_partial_replacement.py'
      - 'tests/test_p0_semantic_document_copy.py'
      - 'tests/test_p0_final_product_resource_order.py'
      - '.github/workflows/p0-dynamic-selection-executable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-dynamic-semantic-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained P0 dynamic-selection authority and PR-base hygiene
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          p0_owner="dba6640f6b247609ffe519ea2a32947593d6e9a7"
          git cat-file -e "${p0_owner}^{commit}"

          base="${PR_BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD)"
          fi
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$p0_owner" HEAD
          git diff --check "$base" HEAD

          for path in \
            tests/js/p0_accessibility_partial_replacement_test.js \
            tests/test_p0_dynamic_selection_partial_replacement.py
          do
            actual="$(git rev-parse "HEAD:$path")"
            expected="$(git rev-parse "$p0_owner:$path")"
            test "$actual" = "$expected" || {
              printf 'Retained P0 evidence blob drift: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done

          # The dynamic-selection oracle may be the retained #775 owner or the
          # exact reviewed navigation/Stage1-analysis/duplicate-context retention successors.
          dynamic_selection_actual="$(git rev-parse HEAD:tests/js/p0_dynamic_selection_runtime_test.js)"
          dynamic_selection_owner="$(git rev-parse "$p0_owner:tests/js/p0_dynamic_selection_runtime_test.js")"
          case "$dynamic_selection_actual" in
            "$dynamic_selection_owner"|f8b63e1c2ffefa2077524f8b4da074a656648f1b|8b4ec18800883794e825263faa9bbc17bea0fd0c|aa6b978e6679736119490dedcdb5d93b2e47965b|5a169c76c0a4ee9c49fb99465d045359275a5327|89f512b0b49c8f665eba852ec09ce5c1258d6e1b)
              ;;
            *)
              printf 'Retained P0 evidence blob drift: tests/js/p0_dynamic_selection_runtime_test.js owner=%s actual=%s\n' "$dynamic_selection_owner" "$dynamic_selection_actual" >&2
              exit 1
              ;;
          esac

          # Action-delivery evidence may be the #775 owner blob or the exact
          # P0-G event-identity regression that replaces implementation-string
          # assertions with the same behavioral accessibility contract.
          action_delivery_actual="$(git rev-parse HEAD:tests/test_p0_dynamic_selection_action_delivery.py)"
          action_delivery_owner="$(git rev-parse "$p0_owner:tests/test_p0_dynamic_selection_action_delivery.py")"
          case "$action_delivery_actual" in
            "$action_delivery_owner"|fbe1b0965d6a6bb895cd451a32253066157550a1|f4f2473202b25214ef3dd251ea70d58700e8bf09)
              ;;
            *)
              printf 'Retained P0 evidence blob drift: tests/test_p0_dynamic_selection_action_delivery.py owner=%s actual=%s\n' "$action_delivery_owner" "$action_delivery_actual" >&2
              exit 1
              ;;
          esac

          printf 'P0 retained authority PASS: pr-base=%s owner=%s head=%s\n' "$base" "$p0_owner" "$(git rev-parse HEAD)"

      - name: Compile focused regression
        run: python -m compileall -q tests/test_p0_dynamic_selection_action_delivery.py tests/test_p0_dynamic_selection_partial_replacement.py tests/test_p0_semantic_document_copy.py tests/test_p0_final_product_resource_order.py

      - name: Execute browser selection regressions
        run: |
          node --check web/p0_accessibility_runtime.js
          node --check tests/js/p0_accessibility_runtime_test.js
          node --check tests/js/p0_dynamic_selection_runtime_test.js
          node --check tests/js/p0_accessibility_partial_replacement_test.js
          node --check tests/js/p0_selection_ambiguity_runtime_test.js
          node --check tests/js/p0_selection_route_epoch_runtime_test.js
          node tests/js/p0_accessibility_runtime_test.js
          node tests/js/p0_dynamic_selection_runtime_test.js
          node tests/js/p0_accessibility_partial_replacement_test.js
          node tests/js/p0_selection_ambiguity_runtime_test.js
          node tests/js/p0_selection_route_epoch_runtime_test.js

      - name: Focused P0 copy and selection tests
        run: >-
          python -m pytest -q
          tests/test_p0_dynamic_selection_action_delivery.py
          tests/test_p0_dynamic_selection_partial_replacement.py
          tests/test_p0_semantic_document_copy.py
          tests/test_p0_final_product_resource_order.py

      - name: Final-product diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest on Windows
        if: matrix.os == 'windows-2025'
        run: python -m pytest -q tests

      - name: Core selftest
        run: python -m acs.selftest
