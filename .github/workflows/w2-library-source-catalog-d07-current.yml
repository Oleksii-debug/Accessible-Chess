name: W2 Library Source Catalog Full Product Convergence

on:
  push:
    branches:
      - work/w2-library-source-catalog-d07-current-20260910
  pull_request:
    paths:
      - 'acs/library_import_service.py'
      - 'acs/library_source_service.py'
      - 'tests/test_d07_library_import_exact_source_order.py'
      - 'tests/test_v2_library_source_catalog.py'
      - 'tools/v2_library_source_catalog_real_corpus.py'
      - '.github/workflows/w2-library-source-catalog-d07-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w2-library-source-catalog-full-product-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_BASE: 2fc77d9b17d6cbf1de8a853032b22086bb7b80d0
  SOURCE_HEAD: 93d7b1ff646fc8e4ff5ef2c82b976fab6a23359d
  DEDUPE_OWNER_HEAD: 5b68baf4c1f32a992f46067b8da120e4d1168294
  REPAIRED_IMPORT_BLOB: 60aeb06516689bd81686606da83cf00c79327d96
  IDEMPOTENCY_TEST_BLOB: 076e08f62d921147b49e30656f33aad92435228b
  OWNER_SERVICE_BLOB: bb848b9cfc7eb643630143833be52075fca3e165
  OWNER_TEST_BLOB: 99848ec1771e44e44c95af3f6aa9c66d634080fd
  OWNER_REAL_ORACLE_BLOB: 5f828fbd1ae33572f109b7a99bc58e45951842b1
  CURRENT_ACSDB_BLOB: f5dd56e017c09aa8bf2ba3aa66c0658f8a229e74
  CURRENT_SEARCH_BLOB: 98466d081fb4c77d52029963c2f295e5f022dd07

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Restore frozen Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Exact current-base scope and owner identity
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CURRENT_BASE^{commit}"
          git cat-file -e "$SOURCE_HEAD^{commit}"
          git cat-file -e "$DEDUPE_OWNER_HEAD^{commit}"
          git merge-base --is-ancestor "$CURRENT_BASE" HEAD
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          git merge-base --is-ancestor "$DEDUPE_OWNER_HEAD" HEAD
          git diff --check "$CURRENT_BASE" HEAD
          changed="$(git diff --name-only "$CURRENT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/w2-library-source-catalog-d07-current.yml' \
            'acs/library_import_service.py' \
            'acs/library_source_service.py' \
            'tests/test_d07_library_import_exact_source_order.py' \
            'tests/test_v2_library_source_catalog.py' \
            'tools/v2_library_source_catalog_real_corpus.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/library_import_service.py)" = "$REPAIRED_IMPORT_BLOB"
          test "$(git rev-parse HEAD:acs/library_source_service.py)" = "$OWNER_SERVICE_BLOB"
          test "$(git rev-parse HEAD:tests/test_d07_library_import_exact_source_order.py)" = "$IDEMPOTENCY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_library_source_catalog.py)" = "$OWNER_TEST_BLOB"
          test "$(git rev-parse HEAD:tools/v2_library_source_catalog_real_corpus.py)" = "$OWNER_REAL_ORACLE_BLOB"
          test "$(git rev-parse HEAD:acs/acsdb.py)" = "$CURRENT_ACSDB_BLOB"
          test "$(git rev-parse HEAD:acs/search_service.py)" = "$CURRENT_SEARCH_BLOB"
          test "$(git rev-parse "$CURRENT_BASE:acs/acsdb.py")" = "$CURRENT_ACSDB_BLOB"
          test "$(git rev-parse "$CURRENT_BASE:acs/search_service.py")" = "$CURRENT_SEARCH_BLOB"

      - name: Compile bounded source catalog and repaired importer
        run: python -m py_compile acs/library_import_service.py acs/library_source_service.py tests/test_d07_library_import_exact_source_order.py tests/test_v2_library_source_catalog.py tools/v2_library_source_catalog_real_corpus.py

      - name: Focused source catalog and current D07 regressions
        run: >-
          python -m unittest -v
          tests.test_d07_library_import_exact_source_order
          tests.test_v2_library_source_catalog
          tests.test_v2_library_integrity_repair
          tests.test_v2_library_date_filter_v5
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_search_service_v4
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence
          tests.test_acsdb

      - name: Re-materialize frozen Stage1 blobs before broad byte contracts
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic

  real-lichess-source-catalog-5k:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real-corpus dependency
        run: python -m pip install -q zstandard==0.23.0
      - name: Prove current Product dependency blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/library_import_service.py)" = "$REPAIRED_IMPORT_BLOB"
          test "$(git rev-parse HEAD:acs/library_source_service.py)" = "$OWNER_SERVICE_BLOB"
          test "$(git rev-parse HEAD:acs/acsdb.py)" = "$CURRENT_ACSDB_BLOB"
          test "$(git rev-parse HEAD:acs/search_service.py)" = "$CURRENT_SEARCH_BLOB"
      - name: Bounded canonical real CC0 5k source journey
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/v2_library_source_catalog_real_corpus.py
      - name: Bind evidence summary to current convergence
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('source-catalog-real-evidence.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          payload['source_catalog_source_head'] = os.environ['SOURCE_HEAD']
          payload['dedupe_owner_head'] = os.environ['DEDUPE_OWNER_HEAD']
          payload['convergence_base'] = os.environ['CURRENT_BASE']
          payload['convergence_head'] = os.environ['GITHUB_SHA']
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload evidence summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-library-source-catalog-full-product-real-5k
          path: source-catalog-real-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: No external corpus/backend payload retained
        shell: bash
        run: |
          set -euo pipefail
          test ! -e lichess.pgn.zst
          test ! -e lichess-first-5000.pgn
          test ! -e libcbh-json-bridge
          test ! -e libcbh.so
          test ! -e uncbv
