name: Portable Launcher Report Reparse Safety

on:
  pull_request:
    paths:
      - 'packaging/portable_launcher.c'
      - 'tests/test_portable_launcher_contract.py'
      - 'tests/test_portable_launcher_core_guard.py'
      - 'tests/test_portable_launch_report_reparse_concurrency.py'
      - '.github/workflows/portable-launch-report-reparse-safety.yml'
  push:
    branches:
      - 'fix/portable-launch-report-reparse-20261004-sol56a4'
      - 'converge/books-training-owner-current-20261004-zftrkmo'
      - 'fix/portable-launcher-core-inode-guard-20261004-sol56r9k4'
      - 'converge/current-product-settings-launcher-20261004-c2mbezb'
      - 'converge/current-product-windows-evidence-20261005-zftrkmo'
    paths:
      - 'packaging/portable_launcher.c'
      - 'tests/test_portable_launcher_contract.py'
      - 'tests/test_portable_launcher_core_guard.py'
      - 'tests/test_portable_launch_report_reparse_concurrency.py'
      - '.github/workflows/portable-launch-report-reparse-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_BASE: 59486e2c9eff903e416d59a0e7c349c22ee2111d
  LAUNCHER_BLOB: 6f0ec228a8ae1ef1f4a831f45f3d89eff3713f0f
  CONTRACT_TEST_BLOB: 4e8d23f24794d1167042a83f2983957a537a244f
  CORE_GUARD_TEST_BLOB: 410fddf296caf40e273c9916c078cc22a193876f
  CURRENT_PRODUCT_REF: converge/current-product-books-provider-20261005-ooxple7
  CURRENT_CONVERGENCE_REF: converge/current-product-windows-evidence-20261005-zftrkmo
  INITIAL_PRODUCT_HEAD: 08e7641854a45b1435ea87eb461d10472058dc20
  CAS_PRODUCT_HEAD: ee3fe93aa379284d8af0672ae0cafb9961e88152
  PARENT_PRODUCT_HEAD: a59a46810fd189b1e8bf2c4efadda9dfebcc3af1
  PRESENTATION_PRODUCT_HEAD: b3ccef128ff2f885d9c71cc036ab630533158f62
  LIBRARY_PRODUCT_HEAD: 1ff26020e22008bfd93762b436d4f58bffb0b08f
  ROUTE_PRODUCT_HEAD: b3d94ebb5c26ef96a32d0309c761a31d4b032c95
  CURRENT_PRODUCT_HEAD: 492861b4e3ed2365ac63ddf925b182db7d3342e2
  CURRENT_LAUNCHER_BLOB: 8089546cbc73cb35e3e8e50a4f28e7c9f175d15c
  CURRENT_CONTRACT_TEST_BLOB: a2ddfc7980cd8be2797f978bbbef9cb660b635ce
  CURRENT_CORE_GUARD_TEST_BLOB: 410fddf296caf40e273c9916c078cc22a193876f
  CURRENT_REPORT_PATHS_BLOB: fafc8696a846a1b9c96a8ce89a76ce82593fd582
  ONECLICK_HEAD: 53123231abc76265e52b7d62832c9fb94adc0012
  LAUNCH_REPORT_HEAD: b108580b91a2917543b80379a88aa1d9accb7c38
  INITIAL_CONVERGENCE_MERGE: 5a02ace57c693c893007f4509a93ad15001f0c77
  PRE_PRODUCT_RECONVERGENCE: b5fc484eabcd462efbecb043c117164eb7a23575
  PRODUCT_RECONVERGENCE_MERGE: 8816ce114b07d7ced39b8b661f12d61fce2b0e6a
  PRE_PARENT_RECONVERGENCE: 1728432f216d4f6cdda9d2283bea89c242c89337
  PARENT_RECONVERGENCE_MERGE: 4808f82eaecfea1b0b9689b4beb4facee446d32a
  PRE_PRESENTATION_RECONVERGENCE: 4c8be3939271b60fe242ac187401286140a5d78f
  PRESENTATION_RECONVERGENCE_MERGE: 9195b8b2ebea1ff68285896e4e4a5872eea89623
  PRE_LIBRARY_RECONVERGENCE: 4326c3621fcfa95c32adb9bad2ac4d304f9c52a5
  LIBRARY_RECONVERGENCE_MERGE: 412f61c833042f4ac741f853a03f1eaab000e1cb
  PRE_LATEST_PRODUCT_RECONVERGENCE: 455d48d2e964158041320b5067556a0485ab7728
  LATEST_PRODUCT_RECONVERGENCE_MERGE: 5846c17a32613427b15621d9590fd09e2c529af8
  PRE_FOCUS_PRODUCT_RECONVERGENCE: 0569c17efa3b798fa11edb69549e0f380de02224
  FOCUS_PRODUCT_RECONVERGENCE_MERGE: d14081a181ae204f657123ae08a5aadc36256703

concurrency:
  group: portable-launch-report-reparse-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'PORTABLE_LAUNCH_REPORT_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }
          echo 'PORTABLE_LAUNCH_REPORT_EXACT_HEAD=PASS'
      - name: Prove exact serial candidate and owned scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.base.ref }}" = "$CURRENT_PRODUCT_REF" ]; } || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "$CURRENT_CONVERGENCE_REF" ]; }; then
            git fetch --no-tags origin "refs/heads/$CURRENT_PRODUCT_REF"
            live_product="$(git rev-parse FETCH_HEAD)"
            test "$live_product" = "$CURRENT_PRODUCT_HEAD" || {
              printf 'PORTABLE_LAUNCH_REPORT_PRODUCT_MOVED expected=%s live=%s\n' "$CURRENT_PRODUCT_HEAD" "$live_product" >&2
              exit 1
            }
            test "$(git show -s --format=%P "$INITIAL_CONVERGENCE_MERGE")" = "$INITIAL_PRODUCT_HEAD $ONECLICK_HEAD $LAUNCH_REPORT_HEAD"
            git merge-base --is-ancestor "$INITIAL_CONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$PRODUCT_RECONVERGENCE_MERGE")" = "$PRE_PRODUCT_RECONVERGENCE $CAS_PRODUCT_HEAD"
            git merge-base --is-ancestor "$PRODUCT_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$PARENT_RECONVERGENCE_MERGE")" = "$PRE_PARENT_RECONVERGENCE $PARENT_PRODUCT_HEAD"
            git merge-base --is-ancestor "$PARENT_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$PRESENTATION_RECONVERGENCE_MERGE")" = "$PRE_PRESENTATION_RECONVERGENCE $PRESENTATION_PRODUCT_HEAD"
            git merge-base --is-ancestor "$PRESENTATION_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$LIBRARY_RECONVERGENCE_MERGE")" = "$PRE_LIBRARY_RECONVERGENCE $LIBRARY_PRODUCT_HEAD"
            git merge-base --is-ancestor "$LIBRARY_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$LATEST_PRODUCT_RECONVERGENCE_MERGE")" = "$ROUTE_PRODUCT_HEAD $PRE_LATEST_PRODUCT_RECONVERGENCE"
            git merge-base --is-ancestor "$LATEST_PRODUCT_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$FOCUS_PRODUCT_RECONVERGENCE_MERGE")" = "$PRE_FOCUS_PRODUCT_RECONVERGENCE $CURRENT_PRODUCT_HEAD"
            git merge-base --is-ancestor "$FOCUS_PRODUCT_RECONVERGENCE_MERGE" HEAD
            test "$(git hash-object packaging/portable_launcher.c)" = "$CURRENT_LAUNCHER_BLOB"
            test "$(git hash-object tests/test_portable_launcher_contract.py)" = "$CURRENT_CONTRACT_TEST_BLOB"
            test "$(git hash-object tests/test_portable_launcher_core_guard.py)" = "$CURRENT_CORE_GUARD_TEST_BLOB"
            test "$(git hash-object acs/report_paths.py)" = "$CURRENT_REPORT_PATHS_BLOB"
            actual="$(git diff --name-only "$CURRENT_PRODUCT_HEAD"...HEAD | LC_ALL=C sort)"
            expected="$(printf '%s\n' '.github/workflows/current-product-windows-evidence-convergence.yml' '.github/workflows/p0-user-oneclick-portable-launcher.yml' '.github/workflows/portable-launch-report-reparse-safety.yml' 'tests/test_current_product_windows_evidence_convergence_20261005.py' 'tests/test_p0_oneclick_exact_head_concurrency.py' 'tests/test_portable_launch_report_reparse_concurrency.py' | LC_ALL=C sort)"
            test "$actual" = "$expected"
            git diff --check "$CURRENT_PRODUCT_HEAD"...HEAD
          else
          git merge-base --is-ancestor "$PRODUCT_BASE" HEAD
          test "$(git merge-base "$PRODUCT_BASE" HEAD)" = "$PRODUCT_BASE"
          test "$(git hash-object packaging/portable_launcher.c)" = "$LAUNCHER_BLOB"
          test "$(git hash-object tests/test_portable_launcher_contract.py)" = "$CONTRACT_TEST_BLOB"
          test "$(git hash-object tests/test_portable_launcher_core_guard.py)" = "$CORE_GUARD_TEST_BLOB"
          actual="$(git diff --name-only "$PRODUCT_BASE" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/portable-launch-report-reparse-safety.yml' \
            'tests/test_portable_launch_report_reparse_concurrency.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$PRODUCT_BASE" HEAD
          fi
      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Run canonical launcher contracts
        run: >-
          python -m unittest
          tests.test_portable_launcher_contract
          tests.test_portable_launcher_core_guard
          tests.test_portable_launch_report_reparse_concurrency
          -v

  windows-native-build:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'PORTABLE_LAUNCH_REPORT_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }
          echo 'PORTABLE_LAUNCH_REPORT_EXACT_HEAD=PASS'
      - name: Prove exact serial candidate and owned scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.base.ref }}" = "$CURRENT_PRODUCT_REF" ]; } || { [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "$CURRENT_CONVERGENCE_REF" ]; }; then
            git fetch --no-tags origin "refs/heads/$CURRENT_PRODUCT_REF"
            live_product="$(git rev-parse FETCH_HEAD)"
            test "$live_product" = "$CURRENT_PRODUCT_HEAD" || {
              printf 'PORTABLE_LAUNCH_REPORT_PRODUCT_MOVED expected=%s live=%s\n' "$CURRENT_PRODUCT_HEAD" "$live_product" >&2
              exit 1
            }
            test "$(git show -s --format=%P "$INITIAL_CONVERGENCE_MERGE")" = "$INITIAL_PRODUCT_HEAD $ONECLICK_HEAD $LAUNCH_REPORT_HEAD"
            git merge-base --is-ancestor "$INITIAL_CONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$PRODUCT_RECONVERGENCE_MERGE")" = "$PRE_PRODUCT_RECONVERGENCE $CAS_PRODUCT_HEAD"
            git merge-base --is-ancestor "$PRODUCT_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$PARENT_RECONVERGENCE_MERGE")" = "$PRE_PARENT_RECONVERGENCE $PARENT_PRODUCT_HEAD"
            git merge-base --is-ancestor "$PARENT_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$PRESENTATION_RECONVERGENCE_MERGE")" = "$PRE_PRESENTATION_RECONVERGENCE $PRESENTATION_PRODUCT_HEAD"
            git merge-base --is-ancestor "$PRESENTATION_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$LIBRARY_RECONVERGENCE_MERGE")" = "$PRE_LIBRARY_RECONVERGENCE $LIBRARY_PRODUCT_HEAD"
            git merge-base --is-ancestor "$LIBRARY_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$LATEST_PRODUCT_RECONVERGENCE_MERGE")" = "$ROUTE_PRODUCT_HEAD $PRE_LATEST_PRODUCT_RECONVERGENCE"
            git merge-base --is-ancestor "$LATEST_PRODUCT_RECONVERGENCE_MERGE" HEAD
            test "$(git show -s --format=%P "$FOCUS_PRODUCT_RECONVERGENCE_MERGE")" = "$PRE_FOCUS_PRODUCT_RECONVERGENCE $CURRENT_PRODUCT_HEAD"
            git merge-base --is-ancestor "$FOCUS_PRODUCT_RECONVERGENCE_MERGE" HEAD
            test "$(git hash-object packaging/portable_launcher.c)" = "$CURRENT_LAUNCHER_BLOB"
            test "$(git hash-object tests/test_portable_launcher_contract.py)" = "$CURRENT_CONTRACT_TEST_BLOB"
            test "$(git hash-object tests/test_portable_launcher_core_guard.py)" = "$CURRENT_CORE_GUARD_TEST_BLOB"
            test "$(git hash-object acs/report_paths.py)" = "$CURRENT_REPORT_PATHS_BLOB"
            actual="$(git diff --name-only "$CURRENT_PRODUCT_HEAD"...HEAD | LC_ALL=C sort)"
            expected="$(printf '%s\n' '.github/workflows/current-product-windows-evidence-convergence.yml' '.github/workflows/p0-user-oneclick-portable-launcher.yml' '.github/workflows/portable-launch-report-reparse-safety.yml' 'tests/test_current_product_windows_evidence_convergence_20261005.py' 'tests/test_p0_oneclick_exact_head_concurrency.py' 'tests/test_portable_launch_report_reparse_concurrency.py' | LC_ALL=C sort)"
            test "$actual" = "$expected"
            git diff --check "$CURRENT_PRODUCT_HEAD"...HEAD
          else
          git merge-base --is-ancestor "$PRODUCT_BASE" HEAD
          test "$(git merge-base "$PRODUCT_BASE" HEAD)" = "$PRODUCT_BASE"
          test "$(git hash-object packaging/portable_launcher.c)" = "$LAUNCHER_BLOB"
          test "$(git hash-object tests/test_portable_launcher_contract.py)" = "$CONTRACT_TEST_BLOB"
          test "$(git hash-object tests/test_portable_launcher_core_guard.py)" = "$CORE_GUARD_TEST_BLOB"
          actual="$(git diff --name-only "$PRODUCT_BASE" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/portable-launch-report-reparse-safety.yml' \
            'tests/test_portable_launch_report_reparse_concurrency.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$PRODUCT_BASE" HEAD
          fi
      - name: Build native x64 launcher with warnings as errors
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 20
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 21
          if not exist build mkdir build
          cl /nologo /utf-8 /W4 /WX /O2 /GS- /DUNICODE /D_UNICODE /c packaging\portable_launcher.c /Fo:build\portable_launcher.obj || exit /b 22
          link /nologo /MACHINE:X64 /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /NODEFAULTLIB build\portable_launcher.obj kernel32.lib user32.lib /OUT:build\AccessibleChess.exe || exit /b 23
          dumpbin /dependents build\AccessibleChess.exe > build\dependents.txt || exit /b 24
      - name: Keep launcher dependency closure minimal
        shell: pwsh
        run: |
          $deps = @(
            Get-Content build/dependents.txt |
              ForEach-Object {
                if ($_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') { $Matches[1].ToUpperInvariant() }
              } |
              Where-Object { $_ } |
              Sort-Object -Unique
          )
          $expected = @('KERNEL32.DLL', 'USER32.DLL')
          if (@(Compare-Object $expected $deps).Count -ne 0) {
            throw "Portable launcher dependency drift: $($deps -join ', ')"
          }
      - name: Reject hard-linked core before process creation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'build/hardlink-package'
          $app = Join-Path $package 'App'
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          Copy-Item build/AccessibleChess.exe (Join-Path $package 'AccessibleChess.exe')
          $foreign = Join-Path $package 'foreign-core.bin'
          [IO.File]::WriteAllBytes($foreign, [byte[]](1,2,3,4,5,6,7,8))
          $core = Join-Path $app 'AccessibleChess.exe'
          New-Item -ItemType HardLink -Path $core -Target $foreign | Out-Null
          $launcher = Join-Path $package 'AccessibleChess.exe'
          $report = Join-Path $package 'launch-report.txt'
          $process = Start-Process -FilePath $launcher -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(8)
            $observed = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              if (Test-Path $report) {
                $text = Get-Content -Raw -Encoding UTF8 $report
                if ($text -match 'STAGE: core process creation') {
                  throw 'Hard-linked core reached CreateProcessW instead of failing the authenticated core guard'
                }
                if ($text -match 'STAGE: core executable validation') {
                  $observed = $true
                  break
                }
              }
              Start-Sleep -Milliseconds 100
            }
            if (-not $observed) {
              throw 'Authenticated core guard rejection was not observed in launch-report.txt'
            }
            $links = (Get-Item $core).LinkType
            if ($links -ne 'HardLink') {
              throw "Expected hard-link fixture, got LinkType=$links"
            }
            $foreignBytes = [IO.File]::ReadAllBytes($foreign)
            if ($foreignBytes.Length -ne 8) {
              throw 'Hard-link target bytes were unexpectedly changed'
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
