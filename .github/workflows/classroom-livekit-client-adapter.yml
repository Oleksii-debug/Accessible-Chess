name: Classroom LiveKit Client Adapter

on:
  push:
    branches:
      - feature/livekit-classroom-client-adapter-20261001
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'web/livekit_classroom_media.js'
      - 'tests/js/livekit_classroom_media_adapter_test.js'
      - '.github/workflows/classroom-livekit-client-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-livekit-client-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove bounded provider scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test -n "$PR_BASE_REF"
          git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-livekit-client-adapter.yml'
            'tests/js/livekit_classroom_media_adapter_test.js'
            'web/livekit_classroom_media.js'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected LiveKit client adapter PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          git diff --check "$base...HEAD"
          git diff --quiet "$base...HEAD" -- \
            acs/classroom_realtime_media.py \
            acs/classroom_domain.py \
            acs/chesscore.py \
            acs/teaching_session.py \
            acs/teaching_classroom_adapter.py
          echo "CLASSROOM_LIVEKIT_LIVE_BASE=$base"
          echo 'CLASSROOM_LIVEKIT_BOUNDED_SCOPE=PASS'

      - name: Run provider client contract
        run: node tests/js/livekit_classroom_media_adapter_test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Re-run canonical realtime-media policy authority
        run: python -m unittest -v tests.test_classroom_realtime_media
