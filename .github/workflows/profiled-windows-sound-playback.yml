name: Profiled Windows Sound Playback Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/sound_profile_windows.py'
      - 'tests/test_sound_profile_windows.py'
      - 'tests/test_sound_profile_windows_compatibility.py'
      - 'acs/sound_profile_composition.py'
      - 'acs/sound_pack_store.py'
      - 'acs/sound_windows.py'
      - '.github/workflows/profiled-windows-sound-playback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profiled-windows-sound-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CURRENT_PRODUCT_BASE: 3a00ff766ccec869a2cb761f26739fe1c85dc9ef

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'work/full-product-teacher-education-reachability-20260911'
          fi
          product_ref='work/full-product-teacher-education-reachability-20260911'
          git fetch --no-tags origin "refs/heads/$product_ref"
          live_product="$(git rev-parse FETCH_HEAD)"
          test "$live_product" = "$CURRENT_PRODUCT_BASE" || {
            printf 'Pinned Product is stale: pinned=%s live=%s\n' "$CURRENT_PRODUCT_BASE" "$live_product" >&2
            exit 1
          }
          git cat-file -e "$CURRENT_PRODUCT_BASE^{commit}"
          git merge-base --is-ancestor "$CURRENT_PRODUCT_BASE" HEAD
          test "$(git merge-base "$CURRENT_PRODUCT_BASE" HEAD)" = "$CURRENT_PRODUCT_BASE"
          git diff --check "$CURRENT_PRODUCT_BASE" HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile profile-aware Windows adapter
        run: >-
          python -m py_compile
          acs/sound_profile_windows.py
          tests/test_sound_profile_windows.py
          tests/test_sound_profile_windows_compatibility.py
          acs/sound_profile_composition.py
      - name: Run profile-aware Windows playback contract
        run: >-
          python -m unittest -v
          tests.test_sound_profile_windows
          tests.test_sound_profile_windows_compatibility
          tests.test_sound_profile_runtime
          tests.test_sound_pack_store
