name: Classroom Student Pseudonym Lifecycle

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/classroom_student_pseudonym.py'
      - 'tests/test_classroom_student_pseudonym.py'
      - '.github/workflows/classroom-student-pseudonym.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-student-pseudonym-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pseudonym:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact additive pseudonym scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "work/full-product-teacher-education-reachability-20260911"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          test "$(git merge-base "$EVENT_BASE_SHA" HEAD)" = "$EVENT_BASE_SHA"
          git diff --check "$EVENT_BASE_SHA...HEAD"
          changed="$(git diff --name-only "$EVENT_BASE_SHA...HEAD" | LC_ALL=C sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/classroom-student-pseudonym.yml' \
            'acs/classroom_student_pseudonym.py' \
            'tests/test_classroom_student_pseudonym.py' | LC_ALL=C sort)"
          test "$changed" = "$allowed"
          git diff --quiet "$EVENT_BASE_SHA" HEAD -- \
            acs/classroom_domain.py \
            acs/education_workspace.py \
            acs/education_workspace_store.py \
            acs/education_records.py
          echo "CLASSROOM_STUDENT_PSEUDONYM_SCOPE=PASS"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile pseudonym lifecycle
        run: >-
          python -m py_compile
          acs/classroom_student_pseudonym.py
          tests/test_classroom_student_pseudonym.py

      - name: Run pseudonym and canonical D10 contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_student_pseudonym
          tests.test_classroom_domain
          tests.test_education_workspace

      - name: Prove privacy and identity authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("acs/classroom_student_pseudonym.py")
          source = path.read_text(encoding="utf-8")
          lowered = source.lower()
          for forbidden in (
              "profile_id",
              "local_profile",
              "livekit",
              "jwt",
              "bearer",
              "api_secret",
          ):
              if forbidden in lowered:
                  raise SystemExit(f"pseudonym boundary owns forbidden identity/provider surface: {forbidden}")

          tree = ast.parse(source, filename=str(path))
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module)
          allowed_import_roots = {
              "__future__",
              "dataclasses",
              "classroom_domain",
              "education_workspace",
          }
          for name in imported:
              root = name.rsplit(".", 1)[-1]
              if root not in allowed_import_roots:
                  raise SystemExit(f"unexpected pseudonym authority import: {name}")

          print("CLASSROOM_STUDENT_PSEUDONYM_PRIVACY_BOUNDARY=PASS")
          PY

      - name: Prove stable identity and consent/CAS contract is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'student.consent is not cd.ConsentState.GRANTED' acs/classroom_student_pseudonym.py
          grep -Fq 'student_id == student.student_id' acs/classroom_student_pseudonym.py
          grep -Fq 'revision=student.revision + 1' acs/classroom_student_pseudonym.py
          grep -Fq 'commit_classroom(' acs/classroom_student_pseudonym.py
          grep -Fq 'MAX_STUDENT_PSEUDONYM_CHARS = 80' acs/classroom_student_pseudonym.py
          echo "CLASSROOM_STUDENT_PSEUDONYM_CONTRACT=PASS"

      - name: Core selftest
        run: python -m acs.selftest
