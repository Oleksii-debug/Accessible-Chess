name: DEV5 Stage1 Path Privacy Repair CI

on:
  pull_request:
    branches:
      - manual5/integration-20260821

permissions:
  contents: read

env:
  ACCEPTED_STAGE1_SHA: 0fa442330bc2bb03636ff9297512da4c29e38684

jobs:
  privacy-oracles-and-full-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Exact ancestry and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$ACCEPTED_STAGE1_SHA" HEAD)" = "$ACCEPTED_STAGE1_SHA"
          git diff --check "$ACCEPTED_STAGE1_SHA" HEAD
          python - <<'PY'
          import subprocess
          allowed={
            'acs/engine.py','acs/import_registry.py','acs/pgn_service.py','acs/report_paths.py',
            'tests/test_stage1_release_path_privacy.py',
            '.github/workflows/dev5-stage1-path-privacy-repair.yml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',__import__('os').environ['ACCEPTED_STAGE1_SHA'],'HEAD'],text=True).splitlines())
          extra=changed-allowed
          assert not extra, sorted(extra)
          print('REPAIR DIFF HYGIENE PASS', sorted(changed))
          PY
      - name: Compile repair
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Product-owned Stage1 privacy regressions
        run: python -m pytest -q tests/test_stage1_release_path_privacy.py
      - name: Replay independent QA privacy oracles unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin qa/dev3-stage1-path-privacy-evidence-20260823 qa/dev4-import-registry-path-privacy-20260823 qa/dev4-engine-start-path-privacy-20260823 qa/dev4-pgn-error-path-privacy-20260823
          mkdir -p qa_oracles
          git show ee6a5da7a9f7eda8e8ecd9ce227ef5cbbf0718f5:tests/test_dev3_stage1_path_privacy_evidence.py > qa_oracles/test_stage1_external.py
          git show 57b57df809784fc912ca56bb91ccdd8caa02836a:tests/test_dev4_import_registry_path_privacy.py > qa_oracles/test_import_external.py
          git show c676097b60a3d059b99fce54d9c7881bfc3b8d3a:tests/test_dev4_engine_start_path_privacy.py > qa_oracles/test_engine_external.py
          git show 6f738942b7d9e0262987aa0b56bfdbc8db39a1f9:tests/test_dev4_pgn_error_path_privacy.py > qa_oracles/test_pgn_external.py
          python -m pytest -q qa_oracles/test_stage1_external.py qa_oracles/test_import_external.py qa_oracles/test_engine_external.py
          python -m pytest -q \
            qa_oracles/test_pgn_external.py::Dev4PgnErrorPathPrivacyTests::test_existing_destination_error_does_not_expose_absolute_parent_path \
            qa_oracles/test_pgn_external.py::Dev4PgnErrorPathPrivacyTests::test_expected_hash_mismatch_does_not_expose_absolute_parent_path
      - name: Full unittest
        run: python -m unittest discover -v tests
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic

  windows-release-regression:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact repair head with LF semantics
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Preserve exact LF source semantics
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          if((git merge-base $env:ACCEPTED_STAGE1_SHA HEAD).Trim() -ne $env:ACCEPTED_STAGE1_SHA){throw 'Stage1 ancestry mismatch'}
          git diff --check $env:ACCEPTED_STAGE1_SHA HEAD
          if($LASTEXITCODE -ne 0){throw 'Diff hygiene failed'}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile repair
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Windows path privacy regressions
        run: python -m pytest -q tests/test_stage1_release_path_privacy.py
      - name: Focused Stage1 release contracts
        run: python -m unittest -v tests.test_release_preflight tests.test_issue22_release_contract tests.test_nvda_p0_contract tests.test_stage1_packaged_focus_origin_contract tests.test_stage1_webview2_accessibility_boundary tests.test_webview_safe_server tests.test_legacy_release_workflow_safety tests.test_stage1_saturation_refactor_contract
      - name: Full unittest
        run: python -m unittest discover -v tests
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
