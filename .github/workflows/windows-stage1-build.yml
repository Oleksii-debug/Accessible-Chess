name: Legacy Windows Stage 1 RC3 Build — DISABLED

# SECURITY TOMBSTONE.
# This workflow reconstructed obsolete RC3 source chunks and could create an
# artifact outside the current fail-closed release chain.  It is intentionally
# retained only to reject accidental/manual execution.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-release-disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject legacy release path
        shell: bash
        run: |
          echo "::error::LEGACY_RELEASE_PATH_DISABLED: obsolete RC3 build is forbidden; no artifact was created."
          exit 1
