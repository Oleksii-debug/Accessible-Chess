name: P0 Packaged MenuBar AppConfig

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'packaging/AccessibleChess.exe.config'
      - 'run_accessible_chess_v2.py'
      - 'tests/test_packaged_winforms_appconfig.py'
      - 'scripts/p0_native_menubar_uia_probe.ps1'
      - 'acs/webview2_accessibility.py'
      - '.github/workflows/p0-packaged-menubar-appconfig.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-packaged-menubar-appconfig-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12.10'
  PYWEBVIEW_VERSION: '6.2.1'
  PYTHONNET_VERSION: '3.1.0'
  CLR_LOADER_VERSION: '0.3.1'
  CFFI_VERSION: '2.1.1'
  PYCPARSER_VERSION: '3.0'
  TYPING_EXTENSIONS_VERSION: '4.16.0'
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_VERSION: '4.1.0'
  ZSTANDARD_VERSION: '0.25.0'

jobs:
  prove-standalone-host-policy:
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Prove source app-config contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest -v tests.test_packaged_winforms_appconfig tests.test_webview2_modern_winforms_accessibility
          if($LASTEXITCODE -ne 0){throw 'Packaged WinForms app-config source contract failed'}

      - name: Install exact package compiler stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
          python -m pip install --disable-pip-version-check `
            "pywebview==$env:PYWEBVIEW_VERSION" `
            "pythonnet==$env:PYTHONNET_VERSION" `
            "clr-loader==$env:CLR_LOADER_VERSION" `
            "cffi==$env:CFFI_VERSION" `
            "pycparser==$env:PYCPARSER_VERSION" `
            "typing-extensions==$env:TYPING_EXTENSIONS_VERSION" `
            "Nuitka @ $nuitkaUrl" `
            "ordered-set==$env:ORDERED_SET_VERSION" `
            "zstandard==$env:ZSTANDARD_VERSION"
          if($LASTEXITCODE -ne 0){throw 'Exact package compiler stack installation failed'}

      - name: Build shipping standalone with unchanged qualification command
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --output-filename=AccessibleChess.exe `
            --include-data-dir=web=web `
            run_accessible_chess_v2.py
          if($LASTEXITCODE -ne 0){throw 'Shipping standalone build failed'}
          $dist=(Resolve-Path 'run_accessible_chess_v2.dist').Path
          $config=Join-Path $dist 'AccessibleChess.exe.config'
          if(-not (Test-Path -LiteralPath $config -PathType Leaf)){throw 'Nuitka output is missing AccessibleChess.exe.config'}
          $source=(Resolve-Path 'packaging\AccessibleChess.exe.config').Path
          $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          $distHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $config).Hash.ToLowerInvariant()
          if($sourceHash -ne $distHash){throw "Standalone app-config byte mismatch source=$sourceHash dist=$distHash"}
          Write-Host "STANDALONE_APPCONFIG_SHA256=$distHash"
          Write-Host 'STANDALONE_APPCONFIG_BOUND=PASS'

      - name: Prove compiled shipping MenuBar uses modern Windows UIA provider
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--force-renderer-accessibility'
          $productRoot=(Resolve-Path 'run_accessible_chess_v2.dist').Path
          $exe=(Resolve-Path (Join-Path $productRoot 'AccessibleChess.exe')).Path
          $evidence=(Join-Path $PWD 'p0-packaged-appconfig-menubar-uia.json')
          Remove-Item -LiteralPath $evidence -Force -ErrorAction SilentlyContinue
          $process=Start-Process -FilePath $exe -WorkingDirectory $productRoot -PassThru
          try {
            $canonical=@()
            $last='no UIA evidence'
            $deadline=[DateTime]::UtcNow.AddSeconds(45)
            do {
              $process.Refresh()
              if($process.HasExited){throw "Compiled shipping process exited before MenuBar proof code=$($process.ExitCode); last=$last"}
              & pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                -File scripts/p0_native_menubar_uia_probe.ps1 `
                -TargetProcessId $process.Id `
                -MenuHandle 0 `
                -OutputPath $evidence `
                -TimeoutSeconds 2
              if($LASTEXITCODE -ne 0){throw 'External packaged MenuBar UIA probe failed'}
              $uia=Get-Content -LiteralPath $evidence -Raw | ConvertFrom-Json
              $canonical=@($uia.same_process_menu_bar_details | Where-Object {
                [string]$_.menu.automation_id -eq 'AccessibleChessFullProductMenu'
              })
              $last=(@($uia.same_process_menu_bars | ForEach-Object {
                "id='$([string]$_.automation_id)' name='$([string]$_.name)' type='$([string]$_.control_type)'"
              }) -join ' | ')
              if($canonical.Count -eq 1){break}
              Start-Sleep -Milliseconds 250
            } while([DateTime]::UtcNow -lt $deadline)

            if($canonical.Count -ne 1){throw "Compiled standalone did not expose exactly one canonical MenuBar; last=$last"}
            $detail=$canonical[0]
            $menu=$detail.menu
            if([string]$menu.control_type -ne 'ControlType.MenuBar'){throw 'Canonical standalone menu is not ControlType.MenuBar'}
            if([string]$menu.name -notin @('Application menu','Меню програми')){throw "Unexpected standalone MenuBar name: $([string]$menu.name)"}
            if(-not [bool]$menu.enabled -or [bool]$menu.offscreen){throw 'Canonical standalone MenuBar is disabled/offscreen'}
            $names=@($detail.top_level_names)
            $expectedUa=@('Файл','Гра','Позиція','PGN','Бібліотека','Імпорт','Експорт','Stockfish','Аналіз','Книги','Учитель/Клас','Налаштування','Довідка')
            $expectedEn=@('File','Game','Position','PGN','Library','Import','Export','Engine','Analysis','Books','Teacher/Classroom','Settings','Help')
            $actual=($names -join '|')
            if($names.Count -ne 13 -or ($actual -ne ($expectedUa -join '|') -and $actual -ne ($expectedEn -join '|'))){
              throw "Standalone final-product MenuBar profile mismatch count=$($names.Count) names=$actual"
            }
            $patterns=@($detail.top_level_expand_collapse)
            if($patterns.Count -ne 13 -or @($patterns | Where-Object {-not [bool]$_}).Count -ne 0){
              throw "Standalone top-level ExpandCollapsePattern mismatch values=$($patterns -join '|')"
            }
            Write-Host "PACKAGED_APPCONFIG_CANONICAL_MENUBAR=PASS names=$actual"
            Write-Host 'PACKAGED_APPCONFIG_EXPAND_COLLAPSE=PASS'
          }
          finally {
            $live=Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if($live){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Upload bounded standalone MenuBar evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-packaged-menubar-appconfig-evidence
          path: p0-packaged-appconfig-menubar-uia.json
          if-no-files-found: warn
          retention-days: 14
