name: Books Semantic Toolbar Reconvergence

on:
  pull_request:
    branches:
      - 'fix/books-semantic-scalar-preflight-20261003'
    paths:
      - '.github/workflows/books-semantic-toolbar-reconvergence.yml'
      - '.github/workflows/books-bidirectional-semantic-navigation.yml'
      - 'web/full_product_books_training.js'
      - 'tests/js/books_training_surface_dom_test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-semantic-toolbar-reconvergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconvergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live parent and toolbar ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='fix/books-semantic-scalar-preflight-20261003'
          toolbar_branch='fix/books-training-toolbar-keyboard-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin \
            "+refs/heads/$parent_branch:refs/remotes/origin/$parent_branch" \
            "+refs/heads/$toolbar_branch:refs/remotes/origin/$toolbar_branch"
          live_parent="$(git rev-parse "refs/remotes/origin/$parent_branch")"
          live_toolbar="$(git rev-parse "refs/remotes/origin/$toolbar_branch")"

          git merge-base --is-ancestor "$live_parent" HEAD
          git merge-base --is-ancestor "$live_toolbar" HEAD

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/books-bidirectional-semantic-navigation.yml' \
              '.github/workflows/books-semantic-toolbar-reconvergence.yml' \
              'tests/js/books_training_surface_dom_test.js' \
              'web/full_product_books_training.js' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/version2_book_workspace.py)" = "cccbc04eb4c36da1dd60d149e12e4b87dd29ada5"
          test "$(git rev-parse HEAD:tests/test_version2_book_workspace.py)" = "fe5b7d03fc3d480c5186a0ac12f702086d184327"
          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = "9cfd70324d7e87d07a344d1921cfa955a0c7eee5"
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = "98c53e71629d3f15e9d5de53c683a93f773d6248"
          test "$(git rev-parse HEAD:.github/workflows/books-bidirectional-semantic-navigation.yml)" = "020693b487941a13352ebad8bb5aa076fa5f0f64"

      - name: Validate combined browser semantics
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile retained host projection
        run: >-
          python -m compileall -q
          acs/version2_book_workspace.py
          tests/test_version2_book_workspace.py
          tests/test_books_semantic_host_bounds.py

      - name: Prove retained whole Books flow
        run: >-
          python -m unittest -v
          tests.test_books_semantic_host_bounds
          tests.test_version2_book_workspace
          tests.test_v2_book_board_workflow
          tests.test_book_bidirectional_semantic_navigation
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_books_training_webview_projection
