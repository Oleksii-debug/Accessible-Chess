name: PGN-05 Post-Repair Large Resource

on:
  pull_request:
    paths:
      - 'scripts/pgn05_post_repair_acceptance.py'
      - '.github/workflows/pgn05-post-repair-large-resource.yml'

permissions:
  contents: read

concurrency:
  group: pgn05-post-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  PGN05_REPAIRED_BASE: 357d78f96ba404035c9eae7444c67b9c3b4f4c31

jobs:
  post-repair-real-large:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Restore frozen Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned QA dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact repaired base and evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PGN05_REPAIRED_BASE^{commit}"
          test "$(git merge-base HEAD "$PGN05_REPAIRED_BASE")" = "$PGN05_REPAIRED_BASE"
          git diff --check "$PGN05_REPAIRED_BASE" HEAD
          changed="$(git diff --name-only "$PGN05_REPAIRED_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/pgn05-post-repair-large-resource.yml' \
            'scripts/pgn05_post_repair_acceptance.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$PGN05_REPAIRED_BASE" HEAD -- acs tests web run_accessible_chess.py
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "96d62bf6dd7b2f5c8a75d5f2bd1fde2ad0823d20"
          test "$(git rev-parse HEAD:acs/pgn_service.py)" = "967669297402d91fd3c5651629b4f82c071a03ed"
          test "$(git rev-parse HEAD:acs/pgn_document.py)" = "ae0b7d3815c4d277b68ef3c170c95255cf5c6442"
          echo 'PGN-05 POST-REPAIR EVIDENCE-ONLY SCOPE PASS'

      - name: Compile and self-test oracle
        run: |
          python -m py_compile scripts/pgn05_post_repair_acceptance.py
          python -m scripts.pgn05_post_repair_acceptance --selftest

      - name: Focused repair and D06/D04 regressions
        run: >-
          python -m unittest -v
          tests.test_d06_file_ingress_nag_normalization
          tests.test_d06_pgn_roundtrip
          tests.test_pgn_service
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_dev4_pgn_resource_security
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_truncation_quality
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_postcommit_cleanup_atomicity

      - name: Verify pinned real large PGN after repair
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn05_post_repair_acceptance --games 2000 2>&1 | tee pgn05-post-repair-report.txt
          grep -F '"license": "CC0"' pgn05-post-repair-report.txt
          grep -F '"record_index": 201' pgn05-post-repair-report.txt
          grep -F '"record_sha256": "731e9e823e72aae59a479df8f8840b55b997cbc86b5a4b700b99998d833db096"' pgn05-post-repair-report.txt
          grep -F '"games": 500' pgn05-post-repair-report.txt
          grep -F '"streaming": "BLOCKED_NOT_IMPLEMENTED"' pgn05-post-repair-report.txt
          grep -F '"overall": "PARTIAL_BOUNDED_WHOLE_DOCUMENT"' pgn05-post-repair-report.txt
          grep -F '"file_ingress_fail_closed": true' pgn05-post-repair-report.txt
          grep -F '"product_mutation": "NONE"' pgn05-post-repair-report.txt
          grep -F 'PGN-05 POST-REPAIR LARGE RESOURCE ACCEPTANCE PASS' pgn05-post-repair-report.txt

      - name: Upload post-repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgn05-post-repair-${{ matrix.os }}
          path: pgn05-post-repair-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
