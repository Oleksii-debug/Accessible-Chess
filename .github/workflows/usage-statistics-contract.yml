name: Usage Statistics Privacy Contract

on:
  pull_request:
    branches:
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - 'acs/usage_statistics.py'
      - 'acs/usage_sync.py'
      - 'tests/test_usage_statistics.py'
      - 'tests/test_usage_sync.py'
      - 'tests/test_usage_sync_persisted_json_boundary.py'
      - '.github/workflows/usage-statistics-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-statistics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact usage-statistics scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          event_base='${{ github.event.pull_request.base.sha }}'
          base_ref='${{ github.event.pull_request.base.ref }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test -n "$event_base"
          test -n "$base_ref"
          git cat-file -e "$event_base^{commit}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          git merge-base --is-ancestor "$event_base" "$live_base"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base" HEAD
          mapfile -t actual < <(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)
          expected=(
            '.github/workflows/usage-statistics-contract.yml'
            'acs/usage_statistics.py'
            'acs/usage_sync.py'
            'tests/test_usage_statistics.py'
            'tests/test_usage_sync.py'
            'tests/test_usage_sync_persisted_json_boundary.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected usage-statistics PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'USAGE_STATISTICS_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile aggregate statistics boundary
        run: >-
          python -m py_compile
          acs/usage_statistics.py
          acs/usage_sync.py
          tests/test_usage_statistics.py
          tests/test_usage_sync.py
          tests/test_usage_sync_persisted_json_boundary.py

      - name: Run aggregate statistics privacy and recovery contracts
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: >-
          python -m unittest -v
          tests.test_usage_statistics
          tests.test_usage_sync
          tests.test_usage_sync_persisted_json_boundary
