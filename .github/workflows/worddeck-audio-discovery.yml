name: WordDeck audio run discovery

on:
  push:
    branches: [worddeck-bootstrap]
    paths:
      - .github/workflows/worddeck-audio-discovery.yml
      - .github/workflows/worddeck-audio.yml

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Find and wait for exact full-audio run
        id: find
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          status=''
          conclusion=''
          for _ in $(seq 1 120); do
            row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow worddeck-audio.yml --branch worddeck-bootstrap --limit 50 --json databaseId,headSha,status,conclusion,createdAt | jq -c --arg sha "$TARGET_SHA" '[.[] | select(.headSha==$sha)] | sort_by(.createdAt) | reverse | .[0] // empty')"
            if [ -n "$row" ]; then
              run_id="$(jq -r .databaseId <<<"$row")"
              status="$(jq -r .status <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          while [ "$status" != completed ]; do
            sleep 15
            json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            test "$(jq -r .head_sha <<<"$json")" = "$TARGET_SHA"
            status="$(jq -r .status <<<"$json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$json")"
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "Exact audio run: $run_id $status/$conclusion on $TARGET_SHA"
      - name: Publish discovery status
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ steps.find.outputs.run_id }}
          RUN_STATUS: ${{ steps.find.outputs.status }}
          RUN_CONCLUSION: ${{ steps.find.outputs.conclusion }}
        with:
          github-token: ${{ github.token }}
          script: |
            const id = process.env.RUN_ID || 'none';
            const status = process.env.RUN_STATUS || 'not-found';
            const conclusion = process.env.RUN_CONCLUSION || '';
            let state = 'error';
            if (status === 'completed') state = conclusion === 'success' ? 'success' : 'failure';
            else if (status !== 'not-found') state = 'pending';
            const target = id === 'none'
              ? `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions`
              : `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state,
              context: 'WordDeck audio discovery',
              description: `audio run ${id}: ${status}${conclusion ? '/' + conclusion : ''}`.slice(0, 140),
              target_url: target
            });
