name: Current Windows Import UI Transactional Delivery

on:
  push:
    branches:
      - fix/windows-import-ui-transactional-delivery-20261006-hy6ez0h
  pull_request:
    branches:
      - fix/windows-ui-mailbox-detached-events-20261006-hy6ez0h
    paths:
      - acs/version2_windows_import_event_mailbox.py
      - acs/library_webview_projection.py
      - acs/version2_application.py
      - tests/test_v2_windows_import_event_mailbox.py
      - tests/test_version2_application.py
      - .github/workflows/current-windows-import-ui-transactional-delivery.yml

permissions:
  contents: read

concurrency:
  group: current-windows-import-ui-transaction-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 6357b237857b4d8a00420e5e045f24bf645e9755
  PARENT_BRANCH: fix/windows-ui-mailbox-detached-events-20261006-hy6ez0h
  EXPECTED_MAILBOX_SOURCE_BLOB: 7228b28e3db3c8a9375bd4bafcdafcf190cb87f1
  EXPECTED_PROJECTION_SOURCE_BLOB: 8f83eca8e9ced241cff7c44b184624c66dbd99f0
  EXPECTED_APPLICATION_SOURCE_BLOB: 5cf21bffd77bb5d862531a944ec5b8686f59beaf
  EXPECTED_MAILBOX_TEST_BLOB: 86854cdf0c653a19e684a3f8ebe93e40d86372f2
  EXPECTED_APPLICATION_TEST_BLOB: f5b58ca545cbe998649b9df860bd828f8f1f0fb3

jobs:
  transactional-delivery:
    name: Import UI transaction / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact transactional-delivery child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/transaction-parent"
          live_parent="$(git rev-parse refs/remotes/origin/transaction-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "IMPORT_UI_TRANSACTION_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-import-ui-transactional-delivery.yml"
            "acs/library_webview_projection.py"
            "acs/version2_application.py"
            "acs/version2_windows_import_event_mailbox.py"
            "tests/test_v2_windows_import_event_mailbox.py"
            "tests/test_version2_application.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_import_event_mailbox.py)" = "$EXPECTED_MAILBOX_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/library_webview_projection.py)" = "$EXPECTED_PROJECTION_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/version2_application.py)" = "$EXPECTED_APPLICATION_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_import_event_mailbox.py)" = "$EXPECTED_MAILBOX_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$EXPECTED_APPLICATION_TEST_BLOB"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile transactional import UI stack
        run: >-
          python -m py_compile
          acs/version2_windows_import_event_mailbox.py
          acs/version2_windows_import_ui_pump.py
          acs/library_webview_projection.py
          acs/version2_application.py
          tests/test_v2_windows_import_event_mailbox.py
          tests/test_version2_application.py
          tests/test_v2_windows_import_ui_pump.py

      - name: Run transactional UI and inherited projection regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_ui_pump
          tests.test_version2_application
          tests.test_dev1_library_webview_projection
          tests.test_library_import_ui_integration
