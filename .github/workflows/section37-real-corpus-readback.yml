name: Section 37 real corpus readback

on:
  pull_request:
    paths:
      - 'tools/section37_real_corpus_evidence.py'
      - 'docs/corpus/SECTION37_SOURCE_REGISTRY.json'
      - 'tests/real_corpus/advanced_training/reti_1921_historical_study_bilingual.pgn'
      - 'tests/test_revised_section37_genuine_advanced_study_readback.py'
      - 'docs/corpus/SECTION37_REAL_CORPUS_READBACK.json'
      - '.github/workflows/section37-real-corpus-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section37-real-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696
  UNCBV_COMMIT: 3c18e8a7c6a30c21f945a1ab5462521c306dca57

jobs:
  readback:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned uncbv source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: antoyo/uncbv
          ref: ${{ env.UNCBV_COMMIT }}
          path: upstream/uncbv
          fetch-depth: 1

      - name: Checkout pinned libcbh source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rolandlo/libcbh
          ref: ${{ env.LIBCBH_COMMIT }}
          path: upstream/libcbh
          fetch-depth: 1

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Qualify original Reti study through canonical Library restart
        working-directory: product
        env:
          PYTHONPATH: ${{ github.workspace }}/product
        run: |
          python -m unittest discover -s tests -p 'test_revised_section37_genuine_advanced_study_readback.py' -v

      - name: Download real Section 37 sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p corpus/chessit corpus/twic corpus/pgnmentor corpus/extracted
          curl --fail --location --retry 3 --max-time 120 \
            -o corpus/chessit/cotswold_2023.cbv \
            https://www.chessit.co.uk/Congresses/Cotswold/2023/Cotswold_Open_2023.cbv
          curl --fail --location --retry 3 --max-time 120 \
            -o corpus/chessit/cotswold_2023.pgn \
            https://www.chessit.co.uk/Congresses/Cotswold/2023/Cotswold_Open_2023.pgn
          curl --fail --location --retry 3 --max-time 120 \
            -o corpus/twic/twic1665c6.zip \
            https://theweekinchess.com/zips/twic1665c6.zip
          curl --fail --location --retry 3 --max-time 120 \
            -o corpus/pgnmentor/Alekhine.zip \
            https://www.pgnmentor.com/players/Alekhine.zip
          printf '%s  %s\n' \
            d1fe221cda73ede12acdc23dc0fa4c922962b62d00ba88381f7085c3e0620902 corpus/chessit/cotswold_2023.cbv \
            3053909b99d30e4d430995553b0b9db4f131c5518fa50d62167c1f0fae5bfe34 corpus/chessit/cotswold_2023.pgn \
            1593615903527a70d47d6ee4ef80556eff0fb9d2ce63cadb6e5e1d2fa7276939 corpus/twic/twic1665c6.zip \
            59f4c4e46a8bc2d9b4c7798e75a91b6a1676c30ebbc71ab04959fb86fed35b3f corpus/pgnmentor/Alekhine.zip \
            | sha256sum --check
          unzip -q corpus/twic/twic1665c6.zip -d corpus/extracted/twic1665c6
          unzip -q corpus/pgnmentor/Alekhine.zip -d corpus/extracted/alekhine

      - name: Build pinned uncbv extractor
        working-directory: upstream/uncbv
        run: cargo build --release

      - name: Build pinned libcbh decoder and bridge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT="\"${LIBCBH_COMMIT}\"" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/

      - name: Run bounded canonical readback and independent oracle
        working-directory: product
        env:
          PYTHONPATH: ${{ github.workspace }}/product
        run: |
          python tools/section37_real_corpus_evidence.py \
            --corpus-root "${{ github.workspace }}/corpus" \
            --output docs/corpus/SECTION37_REAL_CORPUS_READBACK_CI.json \
            --uncbv "${{ github.workspace }}/upstream/uncbv/target/release/uncbv" \
            --libcbh-bridge "${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge" \
            --require-external

      - name: Upload bounded evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: section37-real-corpus-readback
          path: product/docs/corpus/SECTION37_REAL_CORPUS_READBACK_CI.json
          if-no-files-found: error
