name: Takeback Recovery Against Clock-Engine Composition (QA only)
on:
  push:
    branches:
      - qa/takeback-restore-clock-engine-serial-20261002

permissions:
  contents: read

concurrency:
  group: takeback-recovery-serial-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Preserve exact source authorities, byte identities and QA-only scope
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
          product=25b6da6eb8bccea95628ecfce5ba81fece1a5666
          clock=77bfa596c7bbb6d2cdb06856584d5bf0ce7de2bf
          engine=da7952b2ee28b322137363981b0f9d07cd490bd5
          combined=be3486a84f7d8975eb15769c650c112e9a1d79c8
          for ancestor in "$product" "$clock" "$engine" "$combined"; do
            git merge-base --is-ancestor "$ancestor" HEAD
          done
          test "$(git merge-base "$combined" HEAD)" = "$combined"
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$combined" HEAD
          actual="$(git diff --name-only "$combined" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/takeback-restore-clock-engine-qa.yml' \
            'tests/test_engine_takeback_restore_failure_qa.py' | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected combined QA scope:\n%s\n' "$actual" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/clock_service.py)" = ced200e24405bbe0f6c1282e99fdc9440b675477
          test "$(git rev-parse HEAD:acs/engine_game_session.py)" = 37d6c11a782c02850efdc646b034abaafee81dc4
          test "$(git rev-parse HEAD:acs/stage1_release_ui.py)" = 2ac3ca8943e6a4a819e4f273992167f9cf0b47ce
          test "$(git rev-parse HEAD:acs/stage1_release_ui_core.py)" = b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6
          test "$(git rev-parse HEAD:tests/test_engine_takeback_restore_failure_qa.py)" = d732c60cf2eb00a27022e0df12050e5b13ce71b8
          git diff --quiet "$combined" HEAD -- acs web scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2
      - name: Compile real combined source and QA tests
        run: python -m compileall -q acs tests/test_engine_takeback_restore_failure_qa.py tests/test_clock_engine_serial_acceptance.py
      - name: Reproduce seven recovery invariants beside real-clock acceptance
        run: >-
          python -m unittest -v
          tests.test_engine_takeback_restore_failure_qa
          tests.test_clock_engine_serial_acceptance
          tests.test_engine_game_session
          tests.test_stage1_engine_play_ui
      - name: Independent pytest with explicit xfail tracebacks
        run: >-
          python -m pytest -q -rx
          tests/test_engine_takeback_restore_failure_qa.py
          tests/test_clock_engine_serial_acceptance.py
          tests/test_engine_game_session.py
          tests/test_stage1_engine_play_ui.py
