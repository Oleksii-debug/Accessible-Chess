name: Current Stage1 V2 Indexed Book Training Convergence

on:
  pull_request:
    branches:
      - converge/current-library-presenter-indexed-book-training-20261004-sol59b1
    paths:
      - 'acs/webapp_keymap.py'
      - 'acs/version2_release_ui.py'
      - 'tests/test_stage1_v2_board_command_passive_ingress.py'
      - '.github/workflows/current-stage1-v2-board-command-passive-ingress.yml'
      - '.github/workflows/current-stage1-v2-indexed-book-training-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-stage1-v2-indexed-book-training-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked geometry and bounded convergence scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-library-presenter-indexed-book-training-20261004-sol59b1}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-stage1-v2-board-command-passive-ingress.yml' \
            '.github/workflows/current-stage1-v2-indexed-book-training-convergence.yml' \
            'acs/version2_release_ui.py' \
            'acs/webapp_keymap.py' \
            'tests/test_stage1_v2_board_command_passive_ingress.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Stage1/V2 + indexed Book Training convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged Board and Book Training surfaces
        run: >-
          python -m compileall -q
          acs/webapp_keymap.py
          acs/version2_release_ui.py
          acs/bookreader.py
          acs/book_training.py
          acs/version2_training_workspace.py
          tests/test_stage1_v2_board_command_passive_ingress.py
          tests/test_bookreader.py
          tests/test_book_training_passive_roots_current.py
          tests/test_version2_training_current_runtime.py

      - name: Execute Stage1 and V2 Board keyboard accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_stage1_v2_board_command_passive_ingress
          tests.test_stage1_board_action_integration
          tests.test_version2_release_ui
          tests.test_v2_remapped_keyboard_routing
          tests.test_v2_remapped_keyboard_native_editing
          tests.test_accessible_webui

      - name: Execute indexed Books and Training provenance regressions
        run: >-
          python -m unittest -v
          tests.test_bookreader
          tests.test_book_training_passive_roots_current
          tests.test_version2_training_current_runtime
          tests.test_v2_book_training_route_rollback
          tests.test_d08_book_training_contract
          tests.test_w2_book_training_canonical_ingress

      - name: Execute retained cross-surface persistence and Board regressions
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_training_progress_passive_ingress
          tests.test_training_presentation_passive_authority
          tests.test_dev1_pgn_webview_projection
          tests.test_v2_book_board_workflow

      - name: Core selftest
        run: python -m acs.selftest
