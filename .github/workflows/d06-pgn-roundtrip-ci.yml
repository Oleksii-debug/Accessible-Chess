name: D06 PGN Round-Trip CI

on:
  push:
    branches:
      - autopulse/d06-pgn-roundtrip-20260823
  pull_request:
    branches:
      - integration/accessible-chess-next
      - autopulse/d06-pgn-roundtrip-base-20260823
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d06-pgn-roundtrip-${{ github.ref }}
  cancel-in-progress: true

env:
  D06_BASE_SHA: 918d4e560d99c12e24e0763dc3a6fc1f1fbd82d4

jobs:
  pgn-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'

      - name: Install verification dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Prove D06 exact ancestry and narrow ownership
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$D06_BASE_SHA^{commit}"
          test "$(git merge-base "$D06_BASE_SHA" HEAD)" = "$D06_BASE_SHA"
          git diff --check "$D06_BASE_SHA" HEAD
          changed="$(git diff --name-only "$D06_BASE_SHA" HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(acs/pgn_roundtrip.py|tests/test_d06_pgn_roundtrip.py|tests/test_d06_gametree_persistence_vertical.py|tests/test_d06_annotation_insertion_persistence_vertical.py|\.github/workflows/d06-pgn-roundtrip-ci.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected cross-lane D06 delta:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Compile Product and tests
        run: python -m compileall -q acs tests

      - name: D06 strict PGN codec and persistence verticals
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_d06_pgn_roundtrip -v
          python -m unittest tests.test_d06_gametree_persistence_vertical -v
          python -m unittest tests.test_d06_annotation_insertion_persistence_vertical -v

      - name: Existing structural PGN and GameTree regression surface
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_gametree -v
          python -m unittest tests.test_gametree_export_validation -v
          python -m unittest tests.test_dev2_pgn_termination_semantics -v
          python -m unittest tests.test_gametree_navigation -v
          python -m unittest tests.test_gametree_editing -v
          python -m unittest tests.test_gametree_annotations -v
          python -m unittest tests.test_gametree_insertion -v
          python -m unittest tests.test_gametree_snapshot -v
          python -m unittest tests.test_pgn_service -v

      - name: Full unittest
        run: python -m unittest discover -s tests -v

      - name: Full pytest with immutable-base failure equivalence
        shell: bash
        run: |
          set -uo pipefail

          set +e
          python -m pytest -q --junitxml="$RUNNER_TEMP/d06-head-pytest.xml"
          head_status=$?
          set -e

          git worktree add --detach "$RUNNER_TEMP/d06-base" "$D06_BASE_SHA"
          set +e
          (
            cd "$RUNNER_TEMP/d06-base"
            python -m pytest -q --junitxml="$RUNNER_TEMP/d06-base-pytest.xml"
          )
          base_status=$?
          set -e

          HEAD_STATUS="$head_status" BASE_STATUS="$base_status" python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          head_status = int(os.environ["HEAD_STATUS"])
          base_status = int(os.environ["BASE_STATUS"])
          if head_status not in {0, 1}:
              raise SystemExit(f"D06 head pytest infrastructure/collection failure: exit={head_status}")
          if base_status not in {0, 1}:
              raise SystemExit(f"Immutable base pytest infrastructure/collection failure: exit={base_status}")

          def failures(path: Path) -> tuple[str, ...]:
              root = ET.parse(path).getroot()
              result = []
              for case in root.iter("testcase"):
                  if case.find("failure") is None and case.find("error") is None:
                      continue
                  classname = case.attrib.get("classname", "")
                  name = case.attrib.get("name", "")
                  result.append(f"{classname}::{name}")
              return tuple(sorted(result))

          temp = Path(os.environ["RUNNER_TEMP"])
          head_failures = failures(temp / "d06-head-pytest.xml")
          base_failures = failures(temp / "d06-base-pytest.xml")
          print("D06_HEAD_FAILURES=", head_failures)
          print("IMMUTABLE_BASE_FAILURES=", base_failures)

          if head_failures != base_failures:
              head_only = sorted(set(head_failures) - set(base_failures))
              base_only = sorted(set(base_failures) - set(head_failures))
              raise SystemExit(
                  "Full pytest failure set changed relative to exact immutable base; "
                  f"head_only={head_only}; base_only={base_only}"
              )

          if head_failures:
              print(
                  "FULL PYTEST D06 REGRESSION GATE PASS: all head failures are "
                  "exactly reproduced on immutable base; no new D06 failure."
              )
          else:
              print("FULL PYTEST D06 REGRESSION GATE PASS: head and base are fully green.")
          PY
