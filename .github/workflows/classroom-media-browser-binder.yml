name: Classroom Media Browser Binder

on:
  push:
    branches:
      - feature/classroom-media-browser-binder-20261003
    paths:
      - 'acs/classroom_media_browser_binder.py'
      - 'acs/classroom_media_host_transactions.py'
      - 'acs/classroom_media_provider_execution.py'
      - 'acs/classroom_media_session_transactions.py'
      - 'tests/test_classroom_media_browser_binder.py'
      - 'tests/test_classroom_media_host_transactions.py'
      - 'tests/test_classroom_media_provider_execution.py'
      - 'tests/test_classroom_media_session_transactions.py'
      - '.github/workflows/classroom-media-browser-binder.yml'
  pull_request:
    paths:
      - 'acs/classroom_media_browser_binder.py'
      - 'acs/classroom_media_host_transactions.py'
      - 'acs/classroom_media_provider_execution.py'
      - 'acs/classroom_media_session_transactions.py'
      - 'tests/test_classroom_media_browser_binder.py'
      - '.github/workflows/classroom-media-browser-binder.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-media-browser-binder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile binder transaction boundaries
        run: >-
          python -m py_compile
          acs/classroom_media_browser_binder.py
          acs/classroom_media_host_transactions.py
          acs/classroom_media_provider_execution.py
          acs/classroom_media_session_transactions.py
          tests/test_classroom_media_browser_binder.py

      - name: Run browser binder and canonical media contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_media_browser_binder
          tests.test_classroom_media_session_transactions
          tests.test_classroom_media_host_transactions
          tests.test_classroom_media_provider_execution
          tests.test_classroom_realtime_media

      - name: Verify stale session handoff authority is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e acs/classroom_media_session_handoff.py
          test ! -e tests/test_classroom_media_session_handoff.py
          grep -Fq 'ClassroomMediaSessionHostTransactions' acs/classroom_media_browser_binder.py
          grep -Fq 'provider_snapshot' acs/classroom_media_browser_binder.py
          echo 'CLASSROOM_MEDIA_BROWSER_BINDER_CONTRACT=PASS'
