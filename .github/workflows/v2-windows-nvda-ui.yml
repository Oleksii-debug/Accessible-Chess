name: Version 2 Windows NVDA QA

on:
  push:
    branches:
      - worker/w4-v2-current-accessibility-qa-r3-20260907
      - codex/v2-runtime-completion-20260907
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907
      - codex/v2-formats-completion-20260907
    paths:
      - 'acs/version2_*.py'
      - 'acs/version2_windows_*.py'
      - 'acs/full_product_*.py'
      - 'acs/release_preflight.py'
      - 'acs/stage1_release_ui.py'
      - 'acs/stage1_release_ui_core.py'
      - 'acs/webapp.py'
      - 'acs/webapp_keymap.py'
      - 'acs/webview2_accessibility.py'
      - 'run_accessible_chess_v2.py'
      - 'web/index.html'
      - 'web/version2_release_bootstrap.js'
      - 'web/full_product_*.js'
      - 'web/stage1_release_bootstrap.js'
      - 'web/stage1_board_actions.js'
      - 'tests/test_nvda_p0_contract.py'
      - 'tests/test_issue22_release_contract.py'
      - 'tests/test_release_preflight.py'
      - 'tests/test_stage1_packaged_focus_origin_contract.py'
      - 'tests/test_v2_windows_*.py'
      - 'tests/test_version2_*.py'
      - '.github/workflows/v2-windows-nvda-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-nvda-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  V2_CONVERGENCE_BASE: f5ce2ac1f2b9ed4b2438a9acb3b638b02a3cc1ea

jobs:
  windows-nvda-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.4.2
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install -q pythonnet==3.0.5
          fi

      - name: Prove current V2 convergence ancestry and reject legacy release contamination
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V2_CONVERGENCE_BASE" HEAD
          git diff --check "$V2_CONVERGENCE_BASE" HEAD
          git diff --quiet "$V2_CONVERGENCE_BASE" HEAD -- \
            .github/workflows/windows-stage1-build.yml \
            .github/workflows/windows-stage1-webview-build.yml \
            .github/workflows/publish-stage1-release.yml \
            build_parts10k \
            build_snapshot_exact \
            build_snapshot_parts \
            source_snapshot_parts
          if git ls-files '*.zip' '*.exe' '*.msi' | grep -q .; then
            echo '::error::Tracked release binary/archive detected; rejected artifacts must not enter source QA.'
            exit 1
          fi

      - name: Compile active Windows accessibility and package QA composition
        run: >-
          python -m compileall -q
          acs/release_preflight.py
          acs/version2_application.py
          acs/version2_pgn_commands.py
          acs/version2_release_app.py
          acs/version2_release_ui.py
          acs/version2_windows_file_workflows.py
          acs/version2_windows_host_runtime.py
          acs/version2_windows_import_event_mailbox.py
          acs/version2_windows_import_ui_pump.py
          acs/version2_windows_library_import_observer.py
          acs/version2_windows_native_dialog_ownership.py
          acs/version2_windows_pgn_export.py
          acs/webview2_accessibility.py
          run_accessible_chess_v2.py
          tests/test_nvda_p0_contract.py
          tests/test_issue22_release_contract.py
          tests/test_release_preflight.py
          tests/test_stage1_packaged_focus_origin_contract.py
          tests/test_version2_release_accessibility_contract.py
          tests/test_version2_release_app.py
          tests/test_version2_release_ui.py

      - name: Keyboard NVDA issue-22 and release-candidate regression contracts
        run: >-
          python -m unittest -v
          tests.test_nvda_p0_contract
          tests.test_issue22_release_contract
          tests.test_release_preflight
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_dev1_release_ui_regressions
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_windows_native_menu_smoke_contract
          tests.test_version2_release_accessibility_contract

      - name: Focused Version 2 Windows journeys
        run: >-
          python -m unittest -v
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_library_import_observer
          tests.test_v2_windows_native_dialog_ownership
          tests.test_v2_windows_pgn_export
          tests.test_version2_application
          tests.test_version2_import_terminal_ui
          tests.test_version2_pgn_commands
          tests.test_version2_release_app
          tests.test_version2_release_ui

      - name: Windows WinForms owner runtime and UI-post composition smoke
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from acs.version2_windows_file_workflows import Version2WindowsFileDialogs
          from acs.version2_windows_host_runtime import Version2WindowsFileWorkflowRuntime
          from acs.version2_windows_import_ui_pump import Version2WinFormsUiPoster
          from acs.version2_windows_native_dialog_ownership import (
              Version2OwnedWindowsFileDialogs,
              Version2OwnedWindowsPgnExportDialogs,
          )
          from acs.version2_windows_pgn_export import Version2WindowsPgnExportDialogs

          DialogResult, OpenFileDialog, SaveFileDialog = Version2WindowsFileDialogs._load_forms()
          from System.Windows.Forms import Control
          export_result, _, ExportSaveFileDialog = Version2WindowsPgnExportDialogs._load_forms()
          opened = OpenFileDialog()
          saved = SaveFileDialog()
          exported = ExportSaveFileDialog()
          owner = Control()
          owned_files = Version2OwnedWindowsFileDialogs(lambda: owner)
          owned_export = Version2OwnedWindowsPgnExportDialogs(lambda: owner)
          runtime = Version2WindowsFileWorkflowRuntime(
              owner_control=owner,
              get_pgn_session=lambda: None,
              set_pgn_session=lambda session: None,
              import_services_factory=lambda: None,
              export_selected=lambda request, destination: None,
              import_ui_ready=lambda mailbox: None,
              pgn_export_event_sink=lambda event: None,
              next_delegate=lambda action_id, payload: None,
          )
          try:
              opened.Multiselect = False
              opened.CheckFileExists = True
              saved.AddExtension = True
              saved.OverwritePrompt = True
              exported.AddExtension = True
              exported.OverwritePrompt = True
              poster = Version2WinFormsUiPoster(owner)
              delegate = poster._system_action(lambda: None)
              assert callable(owner.BeginInvoke)
              assert delegate is not None
              assert owned_files.dialog_owner.resolve() is owner
              assert owned_export.dialog_owner.resolve() is owner
              assert runtime.file_dialogs.dialog_owner.resolve() is owner
              assert runtime.export_dialogs.dialog_owner.resolve() is owner
              assert runtime.shutdown()
              assert runtime.closed
              assert DialogResult.OK is not None
              assert export_result.OK is not None
          finally:
              owner.Dispose()
              opened.Dispose()
              saved.Dispose()
              exported.Dispose()
          print('WINDOWS WINFORMS OWNER RUNTIME + UI POST COMPOSITION PASS')
          PY

      - name: Stage 1 and Version 2 diagnostic smoke
        run: |
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic

      - name: Write exact checkout QA evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          tested_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          evidence = {
              "schema": "accessible-chess-w4-v2-windows-nvda-qa-v1",
              "git_sha": tested_sha,
              "workflow_event_sha": os.environ["GITHUB_SHA"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "runner_os": os.environ["RUNNER_OS"],
              "python": platform.python_version(),
              "automated_windows_accessibility_qa": "PASS",
              "v2_launcher_diagnostic": "PASS",
              "nvda_verified": "NO",
              "human_acceptance_required": True,
              "rejected_legacy_artifacts_reused": False,
          }
          Path("qa-evidence/result.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat qa-evidence/result.json

      - name: Preserve QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: w4-v2-windows-nvda-qa-${{ runner.os }}-${{ github.event.pull_request.merge_commit_sha || github.sha }}
          path: qa-evidence/result.json
          if-no-files-found: error
          retention-days: 14
