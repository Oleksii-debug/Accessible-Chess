name: Current Book Progress Reader Snapshot Dispatch

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'acs/book_progress_store.py'
      - 'tests/test_v2_book_progress_store.py'
      - '.github/workflows/current-book-progress-reader-snapshot-dispatch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-progress-reader-snapshot-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact checkout and live shipping-child geometry
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref }}"
            event_base='${{ github.event.pull_request.base.sha }}'
          else
            base_ref='converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb'
            event_base=''
          fi

          git fetch --no-tags origin "refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "$event_base" ]; then
            git merge-base --is-ancestor "$event_base" "$live_base"
          fi
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base" HEAD

          changed="$(git diff --name-only "$live_base"...HEAD | LC_ALL=C sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/current-book-progress-reader-snapshot-dispatch.yml' \
            'acs/book_progress_store.py' \
            'tests/test_v2_book_progress_store.py' | LC_ALL=C sort)"
          test "$changed" = "$wanted"

          test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "f110939f4cfda4bb24a76d01ea35ffbba7ad2b79"
          test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "1f455848712768454117081514adb3bfa0dc3102"

      - name: Compile progress persistence authority
        run: python -m py_compile acs/book_progress_store.py tests/test_v2_book_progress_store.py

      - name: Run focused progress and reader regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_progress_store
          tests.test_bookreader

      - name: Core selftest
        run: python -m acs.selftest
