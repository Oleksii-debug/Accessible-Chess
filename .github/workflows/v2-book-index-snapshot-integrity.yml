name: V2 Book Index Snapshot Integrity

on:
  pull_request:
    branches:
      - integration/canonical-nullmove-apex-20261004-sol6p3
    paths:
      - 'acs/book_index.py'
      - 'acs/search_policy.py'
      - 'tests/test_book_index.py'
      - '.github/workflows/v2-book-index-snapshot-integrity.yml'
      - '.github/workflows/v2-library-player-identity-search.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-book-index-snapshot-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact live-base ancestry and bounded ownership
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_BASE_SHA"
          test -n "$PR_BASE_REF"
          test -n "$PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git cat-file -e "$PR_BASE_SHA^{commit}"
          git fetch --no-tags origin "$PR_BASE_REF"
          live_base="$(git rev-parse "origin/$PR_BASE_REF")"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$live_base"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base" HEAD
          changed="$(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/v2-book-index-snapshot-integrity.yml' \
            '.github/workflows/v2-library-player-identity-search.yml' \
            'acs/book_index.py' \
            'acs/search_policy.py' \
            'tests/test_book_index.py' | LC_ALL=C sort)"
          test "$changed" = "$wanted"
          git diff --quiet "$live_base" HEAD -- \
            acs/bookdocument.py \
            acs/bookreader.py \
            acs/acsdb.py \
            acs/search_service.py \
            acs/gametree.py \
            acs/chesscore.py \
            acs/version2_application.py

      - name: Compile Book/search authority
        run: >-
          python -m py_compile
          acs/book_index.py
          acs/search_policy.py
          tests/test_book_index.py

      - name: Run focused Book semantic regressions
        run: >-
          python -m unittest -v
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core
          tests.test_v2_book_progress_store
          tests.test_version2_book_workspace

      - name: Run shared search-policy adjacency
        run: >-
          python -m unittest -v
          tests.test_v2_library_player_identity_search
          tests.test_v2_library_search_service_v4
          tests.test_d07_library_search_cancellation

      - name: Core selftest
        run: python -m acs.selftest
