name: Books Persistence Coaching Convergence

on:
  push:
    branches:
      - converge/books-persistence-coaching-current-apex-20261004-hy6ez0h
  pull_request:
    branches:
      - fix/training-progress-target-inode-cas-20261004-c2mbezb
    paths:
      - ".github/workflows/books-persistence-coaching-convergence.yml"
      - ".github/workflows/book-browser-presentation-lease.yml"
      - ".github/workflows/child-coaching-current-apex-20261004.yml"
      - "acs/version2_application.py"
      - "acs/version2_starter_content_application.py"
      - "web/full_product_books_training.js"
      - "tests/js/books_training_surface_dom_test.js"
      - "tests/test_book_browser_presentation_lease_required.py"
      - "acs/child_coaching.py"
      - "acs/child_coaching_application.py"
      - "acs/child_coaching_prepared_positions.py"
      - "acs/child_coaching_projection.py"
      - "acs/child_coaching_rotation.py"
      - "acs/child_coaching_rotation_store.py"
      - "acs/child_coaching_store.py"
      - "tests/test_child_coaching.py"
      - "tests/test_child_coaching_application.py"
      - "tests/test_child_coaching_prepared_positions.py"
      - "tests/test_child_coaching_projection.py"
      - "tests/test_child_coaching_rotation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-persistence-coaching-convergence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXACT_BASE: b6aaaf50e20aec31f908da80249cb285a090fc23
    steps:
      - name: Checkout exact convergence head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Preserve committed Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Prove exact ancestry, scope and authority blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if test -n "${EVENT_BASE_SHA:-}"; then
            test "$EVENT_BASE_SHA" = "$EXACT_BASE"
          fi
          git cat-file -e "$EXACT_BASE^{commit}"
          git merge-base --is-ancestor "$EXACT_BASE" HEAD
          test "$(git merge-base "$EXACT_BASE" HEAD)" = "$EXACT_BASE"
          git diff --check "$EXACT_BASE"...HEAD

          python - <<'PY'
          import os
          import subprocess

          base = os.environ["EXACT_BASE"]
          expected = {
              ".github/workflows/books-persistence-coaching-convergence.yml",
              ".github/workflows/book-browser-presentation-lease.yml",
              ".github/workflows/child-coaching-current-apex-20261004.yml",
              "acs/version2_application.py",
              "acs/version2_starter_content_application.py",
              "web/full_product_books_training.js",
              "tests/js/books_training_surface_dom_test.js",
              "tests/test_book_browser_presentation_lease_required.py",
              "acs/child_coaching.py",
              "acs/child_coaching_application.py",
              "acs/child_coaching_prepared_positions.py",
              "acs/child_coaching_projection.py",
              "acs/child_coaching_rotation.py",
              "acs/child_coaching_rotation_store.py",
              "acs/child_coaching_store.py",
              "tests/test_child_coaching.py",
              "tests/test_child_coaching_application.py",
              "tests/test_child_coaching_prepared_positions.py",
              "tests/test_child_coaching_projection.py",
              "tests/test_child_coaching_rotation.py",
          }
          actual = set(
              filter(
                  None,
                  subprocess.check_output(
                      ["git", "diff", "--name-only", f"{base}...HEAD"],
                      text=True,
                  ).splitlines(),
              )
          )
          if actual != expected:
              raise SystemExit(
                  f"unexpected convergence scope: {sorted(actual ^ expected)!r}"
              )

          canonical = {
              # Inherited persistence apex (#1684).
              "acs/book_progress_store.py": "78616a83f9f8d6c71e8ca9bb43a4ea5b91c986b8",
              "acs/training_progress_store.py": "0ee7a0b873127412c3b60bb996a547f32189670a",
              "tests/test_v2_book_progress_store.py": "e80e9dcfde1a5508fb1d266cd8334e24ab904c59",
              "tests/test_w2_training_progress_crash_recovery.py": "b75bb83cc3cc19774ba19afe6476e4a028c52d8a",
              # Exact Book browser presentation-lease source (#1685).
              ".github/workflows/book-browser-presentation-lease.yml": "68f16d4f8a75a9e0ecc7dcb56c3e55545550a7ef",
              "acs/version2_application.py": "e1020f4d7d2320f3162bc78b9a6221b2afd46876",
              "acs/version2_starter_content_application.py": "a6d3a1be86db6626ce9e54edaacc7cf9e677b7c5",
              "tests/js/books_training_surface_dom_test.js": "a37cdf5f78bf3d43a2b0e36bb46dbe133ccbbbdb",
              "tests/test_book_browser_presentation_lease_required.py": "30e7ca72c928e705c36f8fb1eb55387899e8eff8",
              "web/full_product_books_training.js": "3819377dbeaa4de47b3bafd5ad88b52d1f38da3d",
              # Exact clean child-coaching source (#1682).
              "acs/child_coaching.py": "8330b42d7a6684c9b1bfa6ca5badebe0bb07fcfa",
              "acs/child_coaching_application.py": "d7b1ae384311514f93c64e4d68f98e6d570d51c1",
              "acs/child_coaching_prepared_positions.py": "060fb8cee23c7fe22465208268b4b8fef5760d14",
              "acs/child_coaching_projection.py": "48b71553685e05be435388a31b44b8df2aeb5dc1",
              "acs/child_coaching_rotation.py": "7fe9da7f1d687f4976c3b4a50652c4c4fa830633",
              "acs/child_coaching_rotation_store.py": "ed37f58f74bab1c990990b65ce2443268c576262",
              "acs/child_coaching_store.py": "73e4f981efef1bdabf34acc99cc59c9659650469",
              "tests/test_child_coaching.py": "8b1c4686d94ff8c234123ef905e0e4144a5f2a4e",
              "tests/test_child_coaching_application.py": "a59dfaa0055f156b64ddd9e22704bf3d1814b9c5",
              "tests/test_child_coaching_prepared_positions.py": "6999fca59274c9e1afd7159bab23e544ca6614a7",
              "tests/test_child_coaching_projection.py": "d3de779725cf54c100675098a22fd41330d5d790",
              "tests/test_child_coaching_rotation.py": "8251084341a7a494cabc35a2f72cd743f6a50bff",
          }
          for path, expected_sha in canonical.items():
              actual_sha = subprocess.check_output(
                  ["git", "hash-object", path], text=True
              ).strip()
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f"authority blob drift: {path} {actual_sha} != {expected_sha}"
                  )
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Compile integrated authority boundary
        run: >-
          python -m py_compile
          acs/version2_application.py
          acs/version2_starter_content_application.py
          acs/book_progress_store.py
          acs/training_progress_store.py
          acs/child_coaching.py
          acs/child_coaching_application.py
          acs/child_coaching_prepared_positions.py
          acs/child_coaching_projection.py
          acs/child_coaching_rotation.py
          acs/child_coaching_rotation_store.py
          acs/child_coaching_store.py
          tests/test_book_browser_presentation_lease_required.py
          tests/test_v2_book_progress_store.py
          tests/test_w2_training_progress_crash_recovery.py
          tests/test_child_coaching.py
          tests/test_child_coaching_application.py
          tests/test_child_coaching_prepared_positions.py
          tests/test_child_coaching_projection.py
          tests/test_child_coaching_rotation.py

      - name: Execute exact Books DOM lease contract
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - name: Execute Book semantic, keyboard and NVDA contracts
        run: >-
          python -m unittest -v
          tests.test_book_browser_presentation_lease_required
          tests.test_version2_application
          tests.test_version2_book_workspace
          tests.test_v2_book_board_workflow
          tests.test_full_product_book_command_authority
          tests.test_w3_p0f_starter_books_training_content
          tests.test_bookreader
          tests.test_bookdocument
          tests.test_version2_accessibility_convergence
          tests.test_nvda_p0_contract
          tests.test_v2_remapped_keyboard_routing
          tests.test_v2_windows_book_board_adapter

      - name: Execute persistence and recovery contracts
        run: >-
          python -m unittest -v
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_w2_training_progress_crash_recovery

      - name: Execute child coaching and adjacent teaching authority
        run: >-
          python -m unittest -v
          tests.test_child_coaching
          tests.test_child_coaching_application
          tests.test_child_coaching_projection
          tests.test_child_coaching_rotation
          tests.test_child_coaching_prepared_positions
          tests.test_teaching_session
          tests.test_education_records
          tests.test_education_workspace

      - name: Core selftest and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
