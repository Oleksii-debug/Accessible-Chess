name: DEV1 Stage1 Candidate UI Contract Evidence

on:
  push:
    branches:
      - auto/dev1-stage1-candidate-ui-evidence-20260823-0027
    paths:
      - '.github/workflows/dev1-stage1-candidate-ui-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev1-stage1-candidate-ui-evidence-20260823-0027
  cancel-in-progress: false

env:
  ACCEPTED_STAGE1_SHA: 0fa442330bc2bb03636ff9297512da4c29e38684
  QA_STRICT_BRANCH: qa/windows-current-integration-candidate-20260815

jobs:
  accepted-product-linux:
    name: accepted Stage1 UI/NVDA source contracts — Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.ACCEPTED_STAGE1_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact accepted Product source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACCEPTED_STAGE1_SHA"
          git diff --check "$ACCEPTED_STAGE1_SHA^" "$ACCEPTED_STAGE1_SHA"
          echo "EXACT ACCEPTED STAGE1 SOURCE PASS $ACCEPTED_STAGE1_SHA"
      - name: Prove obsolete release routes fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('.github/workflows/windows-stage1-build.yml'),
              Path('.github/workflows/windows-stage1-webview-build.yml'),
              Path('.github/workflows/publish-stage1-release.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              assert 'DISABLED' in text, path
              assert 'exit 1' in text, path
              assert 'LEGACY_RELEASE_PATH_DISABLED' in text, path
          print('LEGACY RELEASE ROUTES FAIL-CLOSED PASS')
          PY
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Parse browser bridge and compile accepted source
        shell: bash
        run: |
          node --check web/stage1_board_actions.js
          python -m compileall -q acs tests run_accessible_chess.py
      - name: Candidate-facing DEV1 UI accessibility contracts
        run: >-
          python -m unittest -v
          tests.test_accessible_webui
          tests.test_nvda_p0_contract
          tests.test_issue22_release_contract
          tests.test_stage1_complete_user_flow
          tests.test_stage1_release_composition_ui
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_native_menu_action_routing
      - name: Candidate-facing diagnostic
        run: python run_accessible_chess.py --diagnostic

  accepted-product-windows:
    name: accepted Stage1 UI/NVDA source contracts — Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.ACCEPTED_STAGE1_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact accepted Product source
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:ACCEPTED_STAGE1_SHA){throw "Accepted source mismatch: $actual"}
          git diff --check "$env:ACCEPTED_STAGE1_SHA^" "$env:ACCEPTED_STAGE1_SHA"
          if($LASTEXITCODE -ne 0){throw 'git diff --check failed'}
          "EXACT ACCEPTED STAGE1 SOURCE PASS $actual"
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Parse browser bridge and compile accepted source
        shell: pwsh
        run: |
          node --check web/stage1_board_actions.js
          if($LASTEXITCODE -ne 0){throw 'browser JS parse failed'}
          python -m compileall -q acs tests run_accessible_chess.py
          if($LASTEXITCODE -ne 0){throw 'compileall failed'}
      - name: Candidate-facing DEV1 UI accessibility contracts
        shell: pwsh
        run: |
          python -m unittest -v tests.test_accessible_webui tests.test_nvda_p0_contract tests.test_issue22_release_contract tests.test_stage1_complete_user_flow tests.test_stage1_release_composition_ui tests.test_stage1_packaged_focus_origin_contract tests.test_stage1_webview2_accessibility_boundary tests.test_dev1_release_ui_regressions tests.test_webview_keymap_bridge_contract tests.test_stage1_native_menu_action_routing
          if($LASTEXITCODE -ne 0){throw 'candidate-facing UI/NVDA source contracts failed'}
      - name: Candidate-facing diagnostic
        shell: pwsh
        run: |
          python run_accessible_chess.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'candidate-facing diagnostic failed'}

  qa-strict-source-lock:
    name: QA strict release chain source lock — fail closed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read QA-owned strict workflows without modifying them
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$QA_STRICT_BRANCH:refs/remotes/origin/$QA_STRICT_BRANCH"
          git show "origin/$QA_STRICT_BRANCH:.github/workflows/windows-stage1-strict-dispatch.yml" > /tmp/strict-dispatch.yml
          git show "origin/$QA_STRICT_BRANCH:.github/workflows/windows-stage1-strict-release-crossprocess.yml" > /tmp/strict-release.yml
          python - <<'PY'
          import os, re
          from pathlib import Path
          expected = os.environ['ACCEPTED_STAGE1_SHA']
          dispatch = Path('/tmp/strict-dispatch.yml').read_text(encoding='utf-8')
          release = Path('/tmp/strict-release.yml').read_text(encoding='utf-8')
          def extract(text, key):
              m = re.search(rf'^\s*{re.escape(key)}:\s*([0-9a-f]{{40}})\s*$', text, re.M)
              return m.group(1) if m else None
          target = extract(dispatch, 'TARGET_PRODUCT_SHA')
          source = extract(release, 'SOURCE_INTEGRATION_SHA')
          print(f'accepted={expected}')
          print(f'dispatch_TARGET_PRODUCT_SHA={target}')
          print(f'release_SOURCE_INTEGRATION_SHA={source}')
          if target != expected or source != expected:
              raise SystemExit(
                  'QA_STRICT_SOURCE_LOCK_STALE: strict release chain does not target the current accepted Stage1 SHA; '
                  'do not dispatch or publish a fresh candidate until QA/DEV5 retargets and validates the QA-owned chain.'
              )
          print('QA STRICT SOURCE LOCK MATCH PASS')
          PY
