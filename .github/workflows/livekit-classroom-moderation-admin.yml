name: LiveKit Classroom Moderation Admin

on:
  pull_request:
    branches:
      - feature/classroom-moderation-rpc-core-20261002
    paths:
      - 'acs/livekit_classroom_moderation_admin.py'
      - 'tests/test_livekit_classroom_moderation_admin.py'
      - '.github/workflows/livekit-classroom-moderation-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livekit-classroom-moderation-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  moderation-admin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-moderation-rpc-core-20261002"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          test "$(git merge-base "$EVENT_BASE_SHA" HEAD)" = "$EVENT_BASE_SHA"
          git diff --check "$EVENT_BASE_SHA...HEAD"
          changed="$(git diff --name-only "$EVENT_BASE_SHA...HEAD" | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/livekit-classroom-moderation-admin.yml' \
            '.github/workflows/p0-release-critical-triad-convergence.yml' \
            'tests/test_p0_release_critical_triad_convergence.py' \
            'acs/livekit_classroom_moderation_admin.py' \
            'tests/test_livekit_classroom_moderation_admin.py' | sort)"
          test "$changed" = "$allowed"
          git diff --quiet "$EVENT_BASE_SHA" HEAD -- \
            acs/classroom_moderation_rpc.py \
            acs/classroom_realtime_media.py \
            acs/classroom_domain.py \
            acs/chesscore.py

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile concrete moderation boundary
        run: >-
          python -m py_compile
          acs/livekit_classroom_moderation_admin.py
          tests/test_livekit_classroom_moderation_admin.py

      - name: Verify pinned official LiveKit server wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --dest .livekit-sdk livekit-api==1.2.1
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected_name = "livekit_api-1.2.1-py3-none-any.whl"
          expected_sha = "aa15b0a194c9e8167d4261bc61381682df23f98bc6d77760fcded93d2ce4b4ca"
          files = list(Path(".livekit-sdk").glob("*"))
          assert len(files) == 1, files
          assert files[0].name == expected_name, files[0].name
          assert sha256(files[0].read_bytes()).hexdigest() == expected_sha
          print("LIVEKIT_ROOM_ADMIN_WHEEL_PIN=PASS")
          PY

      - name: Install exact LiveKit server SDK
        run: python -m pip install --disable-pip-version-check -q livekit-api==1.2.1

      - name: Run adapter and canonical moderation/media contracts
        run: >-
          python -m unittest -v
          tests.test_livekit_classroom_moderation_admin
          tests.test_classroom_moderation_rpc
          tests.test_classroom_realtime_media

      - name: Prove exact installed room-admin schema surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata
          from livekit import api

          assert importlib.metadata.version("livekit-api") == "1.2.1"
          permission = api.ParticipantPermission(
              can_subscribe=True,
              can_publish=True,
              can_publish_data=True,
              can_publish_sources=[
                  api.TrackSource.MICROPHONE,
                  api.TrackSource.CAMERA,
              ],
          )
          clone = api.ParticipantPermission()
          clone.CopyFrom(permission)
          assert list(clone.can_publish_sources) == [
              api.TrackSource.MICROPHONE,
              api.TrackSource.CAMERA,
          ]
          assert clone.can_publish_data is True
          update = api.UpdateParticipantRequest(
              room="ci-room",
              identity="ci-student",
              permission=clone,
          )
          mute = api.MuteRoomTrackRequest(
              room="ci-room",
              identity="ci-student",
              track_sid="TR_ci",
              muted=True,
          )
          identity = api.RoomParticipantIdentity(
              room="ci-room",
              identity="ci-student",
          )
          assert update.room == mute.room == identity.room == "ci-room"
          assert update.identity == mute.identity == identity.identity == "ci-student"
          assert mute.track_sid == "TR_ci" and mute.muted is True
          assert api.ServerErrorCode.NOT_FOUND == "not_found"
          assert api.TrackSource.SCREEN_SHARE_AUDIO != api.TrackSource.SCREEN_SHARE
          print("LIVEKIT_PINNED_ROOM_ADMIN_SCHEMA=PASS")
          PY

      - name: Prove recovery verifier is read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("acs/livekit_classroom_moderation_admin.py")
          tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          owner = next(
              node
              for node in tree.body
              if isinstance(node, ast.ClassDef)
              and node.name == "LiveKitClassroomModerationAdmin"
          )
          verifier = next(
              node
              for node in owner.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == "moderation_effect_matches"
          )
          attributes = {
              node.attr
              for node in ast.walk(verifier)
              if isinstance(node, ast.Attribute)
          }
          forbidden = {
              "update_participant",
              "mute_published_track",
              "remove_participant",
              "apply_moderation_command",
          }
          overlap = sorted(attributes & forbidden)
          if overlap:
              raise SystemExit(f"provider-state verifier mutates LiveKit: {overlap}")
          if "get_participant" not in attributes and "_participant" not in attributes:
              raise SystemExit("provider-state verifier has no participant read path")
          print("LIVEKIT_MODERATION_STATE_VERIFIER_READ_ONLY=PASS")
          PY

      - name: Prove server-only least-privilege boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          source_path = Path("acs/livekit_classroom_moderation_admin.py")
          test_path = Path("tests/test_livekit_classroom_moderation_admin.py")
          source = source_path.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")

          required_source = (
              'LIVEKIT_API_VERSION = "1.2.1"',
              "can_publish_data",
              "can_publish_sources",
          )
          missing_source = [token for token in required_source if token not in source]
          if missing_source:
              raise SystemExit(f"missing least-privilege source contract: {missing_source}")
          if "SCREEN_SHARE_AUDIO" not in tests:
              raise SystemExit("missing screen-share-audio fail-closed regression")

          forbidden_text = (
              "LIVEKIT_API_SECRET",
              "LIVEKIT_API_KEY",
              "http://",
              "https://",
          )
          leaked = [token for token in forbidden_text if token in source]
          if leaked:
              raise SystemExit(f"ambient credential/network surface detected: {leaked}")

          tree = ast.parse(source, filename=str(source_path))
          imported_roots = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported_roots.update(alias.name.split(".", 1)[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported_roots.add(node.module.split(".", 1)[0])
          forbidden_imports = {"os", "requests", "aiohttp", "urllib", "http", "socket"}
          overlap = sorted(imported_roots & forbidden_imports)
          if overlap:
              raise SystemExit(f"ambient network/secret import detected: {overlap}")

          owner = next(
              node
              for node in tree.body
              if isinstance(node, ast.ClassDef)
              and node.name == "LiveKitClassroomModerationAdmin"
          )

          def has_explicit_false_guard(function_name: str) -> bool:
              function = next(
                  node
                  for node in owner.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == function_name
              )
              for node in ast.walk(function):
                  if not isinstance(node, ast.Compare) or len(node.ops) != 1:
                      continue
                  if not isinstance(node.ops[0], ast.Is) or len(node.comparators) != 1:
                      continue
                  left = node.left
                  right = node.comparators[0]
                  if (
                      isinstance(left, ast.Attribute)
                      and isinstance(left.value, ast.Name)
                      and left.value.id == "command"
                      and left.attr == "value"
                      and isinstance(right, ast.Constant)
                      and right.value is False
                  ):
                      return True
              return False

          for function_name in ("moderation_effect_matches", "_set_soft_mute"):
              if not has_explicit_false_guard(function_name):
                  raise SystemExit(
                      f"{function_name} lacks explicit soft-mute false/release guard"
                  )

          print("LIVEKIT_SERVER_ONLY_LEAST_PRIVILEGE=PASS")
          PY

      - name: Core selftest
        run: python -m acs.selftest
