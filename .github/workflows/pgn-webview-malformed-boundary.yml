name: PGN WebView Malformed Boundary

on:
  push:
    branches:
      - fix/pgn-webview-malformed-boundary-20261004
  pull_request:
    branches:
      - fix/v2-product-render-transaction-20261004
    paths:
      - 'acs/pgn_webview_projection.py'
      - 'acs/pgn_webview_bridge.py'
      - 'web/full_product_pgn.js'
      - 'tests/test_dev1_pgn_webview_projection.py'
      - 'tests/js/pgn_surface_dom_test.js'
      - '.github/workflows/pgn-webview-malformed-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-webview-malformed-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact whole-product parent and PGN scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='a36015a01635bfd17450a237ff5417e1ea224c27'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/v2-product-render-transaction-20261004'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/pgn-webview-malformed-boundary.yml'             'acs/pgn_webview_bridge.py'             'acs/pgn_webview_projection.py'             'tests/js/pgn_surface_dom_test.js'             'tests/test_dev1_pgn_webview_projection.py'             'web/full_product_pgn.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/pgn_webview_projection.py)" = "127037cb6cf264f579516df599bf8c1ad44e8985"
          test "$(git rev-parse HEAD:acs/pgn_webview_bridge.py)" = "25b3d03179f42b4565a4dd6d7a2ccd283607e09c"
          test "$(git rev-parse HEAD:web/full_product_pgn.js)" = "39077a843aefc424801bd96b41bfc81e784ac597"
          test "$(git rev-parse HEAD:tests/test_dev1_pgn_webview_projection.py)" = "c3ffd69e4220d7f40222c0e6f68ab0f8929ac91e"
          test "$(git rev-parse HEAD:tests/js/pgn_surface_dom_test.js)" = "61a148bf2a1282f4eba11104aab462f10e6c263c"

          echo 'PGN_WEBVIEW_MALFORMED_BOUNDARY_SCOPE=PASS'

      - name: Compile PGN Python surfaces
        run: >-
          python -m compileall -q
          acs/pgn_webview_projection.py
          acs/pgn_webview_bridge.py
          tests/test_dev1_pgn_webview_projection.py

      - name: Validate PGN and shell JavaScript
        run: |
          node --check web/full_product_pgn.js
          node --check tests/js/pgn_surface_dom_test.js
          node --check web/version2_release_bootstrap.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: PGN projection and whole-product regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_pgn_webview_projection
          tests.test_version2_application
          tests.test_version2_release_accessibility_contract
          tests.test_version2_book_board_refresh_focus_order_evidence

      - name: Core selftest
        run: python -m acs.selftest
