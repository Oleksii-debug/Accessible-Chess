name: Child coaching current-product contract\n\non:\n  push:\n    branches:\n      - "work/current-child-coaching-*"\n    paths:\n      - "acs/child_coaching.py"\n      - "acs/child_coaching_store.py"\n      - "tests/test_child_coaching.py"\n      - "acs/teaching_session.py"\n      - "acs/interaction_contracts.py"\n      - ".github/workflows/child-coaching-current-product.yml"\n  pull_request:\n    paths:\n      - "acs/child_coaching.py"\n      - "acs/child_coaching_store.py"\n      - "tests/test_child_coaching.py"\n      - "acs/teaching_session.py"\n      - "acs/interaction_contracts.py"\n      - ".github/workflows/child-coaching-current-product.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  contract:\n    strategy:\n      fail-fast: false\n      matrix:\n        os:\n          - ubuntu-24.04\n          - windows-2025\n    runs-on: ${{ matrix.os }}\n    timeout-minutes: 15\n    steps:\n      - name: Checkout exact head\n        uses: actions/checkout@v4\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Compile current child-coaching modules\n        run: python -m py_compile acs/child_coaching.py acs/child_coaching_store.py\n      - name: Run child-coaching contract tests\n        run: python -m unittest -v tests.test_child_coaching\n      - name: Run adjacent canonical teaching-session regressions\n        run: python -m unittest -v tests.test_teaching_session\n      - name: Run final-product teaching composition regressions\n        run: python -m unittest -v tests.test_version2_teacher_session_runtime_binding tests.test_version2_final_product_composition\n