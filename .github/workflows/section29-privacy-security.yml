name: Section 29 Privacy Security Foundation

on:
  pull_request:
    paths:
      - 'acs/network_security.py'
      - 'tests/test_section29_network_security.py'
      - 'docs/automation/SECTION29_PRIVACY_SECURITY_CLOSURE.md'
      - '.github/workflows/section29-privacy-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section29:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact checkout and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check HEAD^
      - name: Compile Section 29
        run: python -m py_compile acs/network_security.py tests/test_section29_network_security.py
      - name: Run Section 29 contract
        run: python -m unittest -v tests.test_section29_network_security
      - name: Requalify protected network/privacy owners
        run: >-
          python -m unittest -v
          tests.test_classroom_lesson_recording
          tests.test_classroom_join_credentials
          tests.test_classroom_realtime_media
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
          tests.test_classroom_collaboration_chat_server
          tests.test_classroom_file_server
          tests.test_d10_review_progress_delete_privacy
          tests.test_v2_shared_presentation_path_privacy
      - name: Prove no duplicate chess/domain authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("acs/network_security.py").read_text(encoding="utf-8")
          forbidden = (
              "from .chesscore", "import chesscore", "from .gametree",
              "from .pgn", "from .position_editor", "legal_moves(",
              "parse_fen", "Board(",
          )
          for token in forbidden:
              assert token not in source, token
          for token in (
              "NetworkSurface.SERVER", "NetworkSurface.CLASSROOM",
              "NetworkSurface.WEB", "NetworkSurface.AGENT",
              "NetworkSurface.MEDIA", "NetworkSurface.FILE_UPLOAD",
          ):
              assert token in source, token
          print("SECTION29_NO_SECOND_DOMAIN_AUTHORITY=PASS")
          PY
