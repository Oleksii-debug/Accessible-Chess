          PRE_SERIALIZED_PRODUCT: 9edc0ab3ad0df9a927792dff2ab0838f614029d4
          SERIALIZED_MERGE: d4857fcaf1202b4cf59e7139a80f14241bf539dc
          FORMAT_REF: feature/formats-commercial-workflows-20261005
          FORMAT_INITIAL_HEAD: b6d1ad20fcda7ccadba40bc39b7506df67d58c86
          FORMAT_HEAD: 748ad707ce2c301a328e5a9858d3c8e0441e3e17
