name: D04 Stage1 Release Preflight Hygiene

on:
  pull_request:
    branches:
      - d04/stage1-preflight-base-74f39ed-20260823
    paths:
      - 'acs/release_preflight.py'
      - 'tests/test_d04_release_preflight_hygiene.py'
      - '.github/workflows/d04-stage1-release-preflight-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d04-stage1-release-preflight-hygiene-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_SHA: 74f39ed61c46ec2f5dc989275f1a095bd12d7f30

jobs:
  release-hygiene:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact D04 head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve LF source semantics on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Exact ancestry and narrow D04 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(acs/release_preflight\.py|tests/test_d04_release_preflight_hygiene\.py|\.github/workflows/d04-stage1-release-preflight-hygiene\.yml)$' ; then
            echo 'D04 scope contamination detected' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict' ; then
            echo 'QA strict harness contamination detected' >&2
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: D04 proving regressions
        run: python -m unittest -v tests.test_d04_release_preflight_hygiene
      - name: Existing release preflight and privacy regressions
        run: >-
          python -m unittest -v
          tests.test_release_preflight
          tests.test_stage1_release_path_privacy
          tests.test_stage1_stockfish_runtime_path_privacy
          tests.test_stage1_resource_error_privacy
          tests.test_issue22_release_contract
          tests.test_nvda_p0_contract
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Canonical SELFTEST
        run: python -m acs.selftest
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
