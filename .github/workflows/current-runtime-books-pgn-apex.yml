name: Current Runtime Books + PGN Convergence

on:
  push:
    branches:
      - converge/current-runtime-books-pgn-apex-20261006-zftrkmo
      - converge/current-shipping-runtime-evidence-apex-20261006-zftrkmo
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-runtime-books-pgn-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PRODUCT_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
  RUNTIME_MERGE_SHA: 5cf3b76e7c16b1633021de2ca069630c7625a294
  PGN_PARENT_SHA: 7acff17b56d1beaf0f0924fa06ab9d00214b4cbe
  BOOKS_PARENT_SHA: b0cb38cad9630cc92dcb848e6bcaf2abfd2ba474

jobs:
  convergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove fixed runtime receipt and descendant-safe scope
        shell: bash
        run: |
          set -euo pipefail
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$head"
          git cat-file -e "$RUNTIME_MERGE_SHA^{commit}"
          git merge-base --is-ancestor "$RUNTIME_MERGE_SHA" HEAD
          receipt="$(git rev-list --parents -n 1 "$RUNTIME_MERGE_SHA")"
          test "$receipt" = "$RUNTIME_MERGE_SHA $PGN_PARENT_SHA $BOOKS_PARENT_SHA"
          test "$(git merge-base "$PRODUCT_SHA" "$RUNTIME_MERGE_SHA")" = "$PRODUCT_SHA"
          git diff --check "$PRODUCT_SHA"...HEAD
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.yml' || true)"

          python - <<'PY'
          import os
          import subprocess

          product = os.environ["PRODUCT_SHA"]
          runtime_merge = os.environ["RUNTIME_MERGE_SHA"]
          pgn = os.environ["PGN_PARENT_SHA"]
          books = os.environ["BOOKS_PARENT_SHA"]

          def triple(a: str, b: str) -> set[str]:
              out = subprocess.check_output(["git", "diff", "--name-only", f"{a}...{b}"], text=True)
              return {line for line in out.splitlines() if line}

          def direct(a: str, b: str) -> set[str]:
              out = subprocess.check_output(["git", "diff", "--name-only", a, b], text=True)
              return {line for line in out.splitlines() if line}

          expected = triple(product, pgn) | triple(product, books) | {
              ".github/workflows/current-runtime-books-pgn-apex.yml"
          }
          receipt_paths = triple(product, runtime_merge)
          if receipt_paths != expected:
              print("receipt missing:", sorted(expected - receipt_paths))
              print("receipt unexpected:", sorted(receipt_paths - expected))
              raise SystemExit("RUNTIME_RECEIPT_SCOPE_MISMATCH")

          drift = direct(runtime_merge, "HEAD") & receipt_paths
          allowed = {".github/workflows/current-runtime-books-pgn-apex.yml"}
          if not drift <= allowed:
              print("runtime drift:", sorted(drift - allowed))
              raise SystemExit("RUNTIME_DESCENDANT_DRIFT")
          print(f"RUNTIME_RECEIPT_PATHS={len(receipt_paths)}")
          PY

          grep -Fq 'if type(row) is not LibraryRowView:' acs/library_webview_projection.py
          grep -Fq 'def _capture_presentation_state(self)' acs/library_webview_projection.py
          grep -Fq 'if type(progress) is not LibraryImportProgress:' acs/library_webview_projection.py
          grep -Fq 'previous_presenter = self._presenter._capture_presentation_state()' acs/library_webview_projection.py
          grep -Fq 'test_provider_page_subclass_is_rejected_before_attribute_hooks' tests/test_dev1_library_webview_projection.py
          grep -Fq 'test_import_projection_rejects_derived_progress_before_field_hooks' tests/test_dev1_library_webview_projection.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2

      - name: Compile integrated semantic, persistence and Windows boundaries
        run: >-
          python -m py_compile
          acs/bookreader.py
          acs/book_board_workflow.py
          acs/book_webview_bridge.py
          acs/book_webview_projection.py
          acs/training_webview_bridge.py
          acs/training_webview_projection.py
          acs/version2_book_workspace.py
          acs/gametree_resume.py
          acs/version2_gametree_resume.py
          acs/local_profile.py
          acs/version2_local_profile_api.py
          acs/library_webview_projection.py
          acs/pgn_document.py
          acs/pgn_save_snapshot.py
          acs/pgn_workspace.py
          acs/version2_application.py
          acs/version2_windows_file_workflows.py
          acs/version2_windows_host_runtime.py
          acs/version2_windows_import_ui_pump.py

      - name: Execute shared Library projection composition
        run: python -m unittest -v tests.test_dev1_library_webview_projection

      - name: Execute Books semantic, navigation and recovery regressions
        run: >-
          python -m unittest -v
          tests.test_bookreader
          tests.test_bookreader_revision_barriers_current
          tests.test_book_engine_authority_passive_ingress
          tests.test_version2_book_workspace
          tests.test_books_semantic_host_bounds
          tests.test_v2_book_board_workflow
          tests.test_book_bidirectional_semantic_navigation
          tests.test_dev1_books_training_webview_bridge
          tests.test_dev1_books_training_webview_projection
          tests.test_d06_gametree_snapshot_resume
          tests.test_d06_v2_gametree_resume_reachability
          tests.test_local_profile
          tests.test_version2_local_profile_api

      - name: Execute PGN persistence and Windows file workflow regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_workspace
          tests.test_pgn_save_snapshot
          tests.test_pgn_document
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_progress_coherence
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_library_import_observer
          tests.test_v2_windows_nvda_file_workflows
          tests.test_version2_application
          tests.test_version2_composition_startup_cleanup_current

      - name: Pytest overlap and bounded save owner suites
        run: >-
          pytest -q
          tests/test_dev1_library_webview_projection.py
          tests/test_pgn_workspace.py
          tests/test_pgn_save_snapshot.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Core selftest
        run: python -m acs.selftest
