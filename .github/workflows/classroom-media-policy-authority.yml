name: Classroom Durable Media Policy Authority

on:
  pull_request:
    branches:
      - feature/classroom-join-credential-rpc-core-20261002
    paths:
      - 'acs/classroom_realtime_media.py'
      - 'acs/classroom_media_policy_authority.py'
      - 'tests/test_classroom_media_policy_authority.py'
      - '.github/workflows/classroom-media-policy-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-media-policy-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact stacked scope against current join core
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-join-credential-rpc-core-20261002"
          git cat-file -e "$EVENT_BASE_SHA^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current join core $base is not an ancestor of HEAD; synchronize the stacked PR."
            exit 1
          fi
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/classroom-media-policy-authority.yml' \
            'acs/classroom_media_policy_authority.py' \
            'acs/classroom_realtime_media.py' \
            'tests/test_classroom_media_policy_authority.py' | sort)"
          test "$changed" = "$allowed"
          git diff --quiet "$base" HEAD -- \
            acs/chesscore.py \
            acs/classroom_domain.py \
            acs/classroom_join_credentials.py \
            web/livekit_classroom_media.js

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile trusted media-policy boundary
        run: >-
          python -m py_compile
          acs/classroom_realtime_media.py
          acs/classroom_media_policy_authority.py
          tests/test_classroom_media_policy_authority.py

      - name: Run durable authority and adjacent canonical contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_media_policy_authority
          tests.test_classroom_realtime_media
          tests.test_classroom_join_credentials

      - name: Prove policy/storage authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PRAGMA journal_mode=WAL' acs/classroom_media_policy_authority.py
          grep -Fq 'PRAGMA synchronous=FULL' acs/classroom_media_policy_authority.py
          grep -Fq 'BEGIN IMMEDIATE' acs/classroom_media_policy_authority.py
          grep -Fq 'ClassroomRosterResolverPort' acs/classroom_media_policy_authority.py
          grep -Fq 'default_source_policies' acs/classroom_media_policy_authority.py
          grep -Fq 'classroom_media_moderation_allowed' acs/classroom_media_policy_authority.py
          grep -Fq 'Soft mute remains a current-session provider effect' acs/classroom_media_policy_authority.py
          ! grep -Eq 'livekit|LIVEKIT_API|os\.(environ|getenv)|http://|https://' acs/classroom_media_policy_authority.py
          ! grep -Fq 'classroom_domain' acs/classroom_media_policy_authority.py
          ! grep -Fq 'chesscore' acs/classroom_media_policy_authority.py

      - name: Core selftest
        run: python -m acs.selftest
