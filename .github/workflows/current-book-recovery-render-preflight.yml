name: Current Book Recovery Render Preflight

on:
  pull_request:
    branches:
      - converge/current-accessibility-bookreader-passive-20261004-c2mbezb
    paths:
      - 'acs/version2_application.py'
      - 'tests/test_version2_application.py'
      - '.github/workflows/current-book-recovery-render-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-recovery-render-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-accessibility-bookreader-passive-20261004-c2mbezb}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-book-recovery-render-preflight.yml' \
            'acs/version2_application.py' \
            'tests/test_version2_application.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Book recovery-render scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Book recovery application surfaces
        run: >-
          python -m compileall -q
          acs/version2_application.py
          tests/test_version2_application.py

      - name: Execute Book recovery owner-atomicity regressions
        run: >-
          python -m unittest -v
          tests.test_version2_application.Version2ApplicationTests.test_book_recovery_render_preflight_preserves_published_owners_on_failure
          tests.test_version2_application.Version2ApplicationTests.test_book_stale_write_rebinds_external_canonical_progress
          tests.test_version2_application.Version2ApplicationTests.test_book_durability_unknown_reloads_visible_canonical_progress
          tests.test_version2_application.Version2ApplicationTests.test_book_durability_rebind_repairs_stale_book_block_focus
          tests.test_version2_application.Version2ApplicationTests.test_book_durability_rebind_preserves_stable_book_control_focus
          tests.test_version2_application.Version2ApplicationTests.test_book_durability_unknown_with_unreadable_primary_fails_surface_closed

      - name: Book progress and projection regressions
        run: >-
          python -m unittest -v
          tests.test_book_progress_passive_ingress_current
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_dev1_books_training_webview_projection

      - name: Core selftest
        run: python -m acs.selftest
