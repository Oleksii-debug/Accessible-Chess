name: V2 Final Formats Windows Export Convergence

on:
  push:
    branches:
      - integration/v2-final-formats-windows-export-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-final-formats-windows-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-convergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      FINAL_FORMATS_SOURCE: da0c12c1438ca0d9a304f4d6a1cd414c9d45bd20
      WINDOWS_EXPORT_SOURCE: 206d3cc7ea7b01bb406b8d4b21e04bc24ae02e23
      COMPOSED_BASE: 294443922a4041687c1249dd017c147980506365
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact Git and Stage 1 bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.4.2 zstandard==0.23.0
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install -q pythonnet==3.0.5
          fi

      - name: Prove exact two-parent composition and CI-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FINAL_FORMATS_SOURCE" HEAD
          git merge-base --is-ancestor "$WINDOWS_EXPORT_SOURCE" HEAD
          git merge-base --is-ancestor "$COMPOSED_BASE" HEAD
          git diff --check "$COMPOSED_BASE" HEAD
          changed="$(git diff --name-only "$COMPOSED_BASE" HEAD | sort)"
          expected='.github/workflows/v2-final-formats-windows-export-convergence-20260903.yml'
          test "$changed" = "$expected"
          git diff --quiet "$COMPOSED_BASE" HEAD -- acs tests scripts tools web docs

      - name: Compile composed format and trusted-host runtime
        run: >-
          python -m compileall -q
          acs/gametree.py
          acs/pgn_roundtrip.py
          acs/pgn_streaming_import.py
          acs/pgn_service.py
          acs/pgn_document.py
          acs/acsdb.py
          acs/search_service.py
          acs/library_import_service.py
          acs/library_export_service.py
          acs/library_export_webview_projection.py
          acs/library_export_workspace.py
          acs/version2_windows_file_workflows.py
          acs/version2_windows_host_runtime.py
          acs/version2_windows_library_export.py
          acs/version2_windows_native_dialog_ownership.py
          acs/version2_windows_pgn_export.py
          acs/chessbase_adapter.py
          acs/chessbase_decoder.py
          acs/chessbase_library_import.py
          acs/cbv_extractor.py
          acs/book_progress_store.py
          scripts/v2_real_lichess_streaming_v6_oracle.py

      - name: Browser accessibility contracts
        run: |
          node tests/js/library_surface_dom_test.js
          node tests/js/library_export_surface_dom_test.js

      - name: Composed semantic format and export journeys
        run: >-
          python -m unittest -v
          tests.test_version2_formats_integration
          tests.test_d06_file_ingress_nag_normalization
          tests.test_pgn_streaming_import
          tests.test_v2_pgn_nested_comment_recovery
          tests.test_v2_pgn_semantic_fidelity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_transaction_ownership
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_integrity_repair
          tests.test_d07_library_export_service
          tests.test_d07_library_export_webview
          tests.test_d07_library_export_reachability
          tests.test_v2_windows_library_export
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_native_dialog_ownership
          tests.test_v2_windows_pgn_export
          tests.test_chessbase_adapter
          tests.test_chessbase_decoder
          tests.test_cbv_extractor
          tests.test_v2_book_progress_store

      - name: Windows native owner-bound format composition
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import clr
          clr.AddReference("System.Windows.Forms")

          from System.Windows.Forms import Control
          from acs.acsdb import AcsDatabase
          from acs.library_export_service import LibraryExportService
          from acs.version2_windows_file_workflows import Version2WindowsFileDialogs
          from acs.version2_windows_library_export import Version2WindowsLibraryExportDelegate
          from acs.version2_windows_native_dialog_ownership import Version2OwnedWindowsPgnExportDialogs

          DialogResult, OpenFileDialog, SaveFileDialog = Version2WindowsFileDialogs._load_forms()
          opened = OpenFileDialog()
          saved = SaveFileDialog()
          owner = Control()
          database = AcsDatabase()
          try:
              dialogs = Version2OwnedWindowsPgnExportDialogs(lambda: owner)
              delegate = Version2WindowsLibraryExportDelegate(
                  dialogs=dialogs,
                  service=LibraryExportService(database),
                  event_sink=lambda event: None,
                  next_delegate=lambda action_id, payload: ('fallback', action_id),
              )
              assert dialogs.dialog_owner.resolve() is owner
              assert delegate.OWNED_ACTIONS == frozenset({'library.export'})
              assert delegate('analysis.restart', {}) == ('fallback', 'analysis.restart')
              print('WINDOWS FINAL FORMAT HOST COMPOSITION PASS')
          finally:
              database.close()
              owner.Dispose()
              opened.Dispose()
              saved.Dispose()
          PY

      - name: Direct lawful 10000 plus Unicode schema-v6 journey
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.v2_real_lichess_streaming_v6_oracle 2>&1 | tee final-windows-export-real.log
          grep -F '"status": "PASS"' final-windows-export-real.log
          grep -F '"standard_games": 10000' final-windows-export-real.log
          grep -F '"schema": 6' final-windows-export-real.log

      - name: Full repository unittest
        if: always()
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        if: always()
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        if: always()
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-final-formats-windows-export-${{ matrix.os }}
          path: |
            real-lichess-acsdb-v6-summary.json
            final-windows-export-real.log
          if-no-files-found: warn
          retention-days: 14

      - name: Prove no Product or corpus residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f real-lichess-acsdb-v6-summary.json final-windows-export-real.log
          if ! git diff --quiet --ignore-cr-at-eol HEAD; then
            git diff --name-status --ignore-cr-at-eol HEAD
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf '%s\n' "$untracked"
            exit 1
          fi
