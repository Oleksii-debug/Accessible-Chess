name: Test-ready UX Ingest Sound Convergence

on:
  push:
    branches:
      - work/test-ready-ux-ingest-hotkeys-design-20261003
  pull_request:
    paths:
      - 'acs/full_product_actions.py'
      - 'acs/pgn_webview_projection.py'
      - 'acs/book_webview_projection.py'
      - 'acs/library_webview_projection.py'
      - 'acs/text_encoding.py'
      - 'acs/book_text_import.py'
      - 'acs/book_docx_import.py'
      - 'acs/pgn_service.py'
      - 'acs/pgn_streaming_import.py'
      - 'acs/user_library_payload.py'
      - 'acs/version2_packaged_starter_application.py'
      - 'acs/version2_windows_file_workflows.py'
      - 'web/index.html'
      - 'web/full_product_pgn.js'
      - 'web/full_product_library.js'
      - 'web/full_product_books_training.js'
      - 'web/vendor/**'
      - 'tests/test_test_ready_ux_contract.py'
      - 'tests/test_user_library_payload.py'
      - 'tests/test_v2_book_text_import.py'
      - 'tests/test_v2_book_docx_import.py'
      - 'tests/test_v2_native_dialog_language.py'
      - 'tests/test_pgn_service.py'
      - 'tests/test_pgn_streaming_import.py'
      - 'tests/test_user_sound_pack_builder.py'
      - 'tests/test_stage1_release_composition_ui.py'
      - '.github/workflows/test-ready-ux-ingest-sound.yml'

permissions:
  contents: read

concurrency:
  group: test-ready-ux-ingest-sound-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile touched Python boundaries
        run: >-
          python -m py_compile
          acs/full_product_actions.py
          acs/pgn_webview_projection.py
          acs/book_webview_projection.py
          acs/library_webview_projection.py
          acs/text_encoding.py
          acs/book_text_import.py
          acs/book_docx_import.py
          acs/pgn_service.py
          acs/pgn_streaming_import.py
          acs/user_library_payload.py
          acs/version2_packaged_starter_application.py
          acs/version2_windows_file_workflows.py
          tests/test_test_ready_ux_contract.py
          tests/test_user_library_payload.py

      - name: Test keyboard NVDA ingest and private Library contracts
        run: >-
          python -m unittest -v
          tests.test_test_ready_ux_contract
          tests.test_user_library_payload
          tests.test_v2_book_text_import
          tests.test_v2_book_docx_import
          tests.test_v2_native_dialog_language
          tests.test_pgn_service
          tests.test_pgn_streaming_import
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_library_webview_projection

      - name: Re-prove inherited 330-WAV and NEWGAME animation contracts
        run: >-
          python -m unittest -v
          tests.test_user_sound_pack_builder
          tests.test_stage1_release_composition_ui

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic

      - name: No semantic residue
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
