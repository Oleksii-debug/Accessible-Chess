name: V2 EPUB Retained Regression

on:
  push:
    branches:
      - fix/v2-epub-retained-gate-20260911
      - converge/books-training-owner-current-20261004-zftrkmo
  pull_request:
    paths:
      - .github/workflows/v2-book-epub-semantic-ingress.yml
      - acs/book_epub_import.py
      - acs/book_html_import.py
      - acs/book_text_import.py
      - acs/bookdocument.py
      - acs/chesscore.py
      - acs/gametree.py
      - acs/pgn_roundtrip.py
      - acs/version2_application.py
      - tests/test_v2_book_epub_import.py
      - tests/test_v2_book_html_import.py
      - tests/test_v2_html_semantic_lists.py
      - tests/test_bookdocument.py
      - tests/test_book_index.py
      - tests/test_bookreader.py
      - tests/test_v2_accessible_book_core.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-epub-retained-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  epub-retained-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EPUB_RUNTIME_BLOB: d69fdac9bc411ea861fd2e6fef31904856aa9288
      EPUB_TEST_BLOB: a6eb03005133b3e5388904317e6ca6daa8e50f1c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove live-base ancestry and retained EPUB authority
        shell: bash
        env:
          EPUB_INTEGRATION_SHA: 0fe5eb7eb2da69f3bf7f8941d573c7b78b463be2
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          integrated="$EPUB_INTEGRATION_SHA"
          git cat-file -e "${integrated}^{commit}" || git fetch --no-tags origin "$integrated"
          git merge-base --is-ancestor "$integrated" HEAD

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            event_base="$PR_BASE_SHA"
            base_ref="$PR_BASE_REF"
            test -n "$event_base"
            test -n "$base_ref"
            git cat-file -e "${event_base}^{commit}"
            git fetch --no-tags origin "$base_ref"
            live_base="$(git rev-parse "origin/$base_ref")"
            git merge-base --is-ancestor "$event_base" "$live_base"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            upstream="$live_base"
          else
            upstream="$integrated"
          fi

          git diff --check "$upstream" HEAD
          test -s acs/book_epub_import.py
          test -s tests/test_v2_book_epub_import.py
          test "$(git hash-object acs/book_epub_import.py)" = "$EPUB_RUNTIME_BLOB"
          test "$(git hash-object tests/test_v2_book_epub_import.py)" = "$EPUB_TEST_BLOB"
          echo "EPUB_RETAINED_UPSTREAM=$upstream"

      - name: Compile EPUB adapter and regressions
        run: python -m py_compile acs/book_epub_import.py tests/test_v2_book_epub_import.py

      - name: EPUB semantic, provenance and adversarial regressions
        run: python -m unittest -v tests.test_v2_book_epub_import

      - name: Inherited current HTML semantic contracts
        run: >-
          python -m unittest -v
          tests.test_v2_book_html_import
          tests.test_v2_html_semantic_lists

      - name: Canonical Book core and reader regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
