name: WordDeck British audio batch

on:
  push:
    branches:
      - worddeck-bootstrap
    paths:
      - WordDeck/Audio/generation-request.json
      - WordDeck/Audio/pronunciation-overrides.tsv
      - WordDeck/tools/generate_british_audio.py
      - WordDeck/tools/validate_pronunciation_overrides.py
      - .github/workflows/worddeck-audio.yml
  workflow_dispatch:

concurrency:
  group: worddeck-audio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Read generation request
        id: request
        shell: bash
        run: |
          echo "source=$(jq -r '.source' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "start=$(jq -r '.start' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "limit=$(jq -r '.limit' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "female=$(jq -r '.femaleVoice' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "male=$(jq -r '.maleVoice' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "speed=$(jq -r '.speed' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "format=$(jq -r '.format' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"

      - name: Restore Oxford 3000 TSV
        if: steps.request.outputs.source == 'oxford3000'
        shell: bash
        run: |
          cat WordDeck/Data/oxford3000_uk.tsv.gz.b64part* > /tmp/oxford3000.b64
          base64 --decode /tmp/oxford3000.b64 > /tmp/oxford3000.tsv.gz
          gzip -dc /tmp/oxford3000.tsv.gz > /tmp/worddeck-audio-source.tsv
          test -s /tmp/worddeck-audio-source.tsv

      - name: Use combined Oxford 5000 TSV
        if: steps.request.outputs.source == 'oxford5000'
        shell: bash
        run: |
          test -f WordDeck/Audio/oxford5000_audio_source.tsv
          cp WordDeck/Audio/oxford5000_audio_source.tsv /tmp/worddeck-audio-source.tsv

      - name: Prepare reviewed-safe pronunciation overrides
        if: steps.request.outputs.source == 'pronunciation-overrides-ready'
        shell: bash
        run: |
          python WordDeck/tools/validate_pronunciation_overrides.py --self-test
          awk -F '\t' 'NR == 1 || $4 == "ready"' WordDeck/Audio/pronunciation-overrides.tsv > /tmp/worddeck-audio-source.tsv
          test -s /tmp/worddeck-audio-source.tsv
          ready_count=$(awk -F '\t' 'NR > 1 && $4 == "ready" { count++ } END { print count+0 }' WordDeck/Audio/pronunciation-overrides.tsv)
          selected_count=$(($(wc -l < /tmp/worddeck-audio-source.tsv) - 1))
          echo "Reviewed-safe overrides: ledger=$ready_count selected=$selected_count"
          test "$ready_count" -gt 0
          test "$selected_count" -eq "$ready_count"

      - name: Install TTS dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro>=0.9.2' soundfile numpy

      - name: Generate requested batch
        shell: bash
        run: |
          mkdir -p /tmp/worddeck-audio
          python WordDeck/tools/generate_british_audio.py \
            --input /tmp/worddeck-audio-source.tsv \
            --output /tmp/worddeck-audio \
            --start '${{ steps.request.outputs.start }}' \
            --limit '${{ steps.request.outputs.limit }}' \
            --female-voice '${{ steps.request.outputs.female }}' \
            --male-voice '${{ steps.request.outputs.male }}' \
            --speed '${{ steps.request.outputs.speed }}' \
            --format '${{ steps.request.outputs.format }}'

      - name: Validate generated audio
        shell: bash
        run: |
          expected='${{ steps.request.outputs.limit }}'
          actual=$(find /tmp/worddeck-audio -maxdepth 1 -type f -name '*.${{ steps.request.outputs.format }}' | wc -l)
          echo "Generated $actual audio files; requested up to $expected"
          test "$actual" -gt 0
          test -s /tmp/worddeck-audio/manifest.jsonl
          if [ '${{ steps.request.outputs.source }}' = 'pronunciation-overrides-ready' ]; then
            ready_count=$(awk -F '\t' 'NR > 1 && $4 == "ready" { count++ } END { print count+0 }' WordDeck/Audio/pronunciation-overrides.tsv)
            if [ "$expected" -le 0 ]; then
              expected="$ready_count"
            fi
            test "$expected" -le "$ready_count"
            test "$actual" -eq "$expected"
            manifest_rows=$(wc -l < /tmp/worddeck-audio/manifest.jsonl)
            test "$manifest_rows" -eq "$expected"
          fi
          find /tmp/worddeck-audio -maxdepth 1 -type f -name '*.${{ steps.request.outputs.format }}' -size -512c -print -quit | grep -q . && {
            echo 'At least one audio file is suspiciously small.' >&2
            exit 1
          } || true
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/worddeck-audio')
          records = [json.loads(line) for line in (root / 'manifest.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          ids = [record.get('id') for record in records]
          files = [record.get('file') for record in records]
          if len(ids) != len(set(ids)):
              raise SystemExit('Audio manifest contains duplicate stable IDs')
          if len(files) != len(set(files)):
              raise SystemExit('Audio manifest contains duplicate file names')
          for record in records:
              path = root / str(record.get('file') or '')
              expected_hash = str(record.get('sha256') or '')
              if len(expected_hash) != 64:
                  raise SystemExit(f"Missing/invalid SHA-256 for {record.get('id')}")
              if not path.is_file():
                  raise SystemExit(f"Manifest file missing: {path.name}")
              actual_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f"SHA-256 mismatch for {record.get('id')}: {actual_hash} != {expected_hash}")
              if path.stat().st_size != int(record.get('bytes') or -1):
                  raise SystemExit(f"Byte-size mismatch for {record.get('id')}")
              if record.get('accent') != 'en-GB' or int(record.get('sample_rate') or 0) != 24000:
                  raise SystemExit(f"Unexpected audio format metadata for {record.get('id')}")
          print(f'Validated {len(records)} manifest rows with unique IDs/files, exact byte sizes and SHA-256.')

          # Targeted override generation needs a stronger proof than file integrity:
          # every manifest row must correspond exactly to the reviewed-safe ledger row,
          # and the effective text/phonemes used by generation must match that row.
          if '${{ steps.request.outputs.source }}' == 'pronunciation-overrides-ready':
              with Path('/tmp/worddeck-audio-source.tsv').open('r', encoding='utf-8-sig', newline='') as handle:
                  source_rows = list(csv.DictReader(handle, delimiter='\t'))
              start = int('${{ steps.request.outputs.start }}')
              limit = int('${{ steps.request.outputs.limit }}')
              selected = source_rows[start:] if limit <= 0 else source_rows[start:start + limit]
              if len(selected) != len(records):
                  raise SystemExit(f'Override source/manifest count mismatch: {len(selected)} != {len(records)}')
              for expected_row, record in zip(selected, records, strict=True):
                  entry_id = (expected_row.get('entry_id') or '').strip()
                  source = (expected_row.get('source') or '').strip()
                  text = (expected_row.get('audio_text') or '').strip()
                  phonemes = (expected_row.get('phonemes') or '').strip()
                  if record.get('id') != entry_id or record.get('source') != source:
                      raise SystemExit(f'Override identity/source mismatch for {entry_id}')
                  manifest_phonemes = record.get('phonemes') or ''
                  if manifest_phonemes != phonemes:
                      raise SystemExit(f'Override phoneme mismatch for {entry_id}: {manifest_phonemes!r} != {phonemes!r}')
                  if not phonemes:
                      if not text:
                          raise SystemExit(f'Reviewed text-mode override lacks explicit audio_text: {entry_id}')
                      if record.get('audio_text') != text:
                          raise SystemExit(f'Override audio_text mismatch for {entry_id}: {record.get("audio_text")!r} != {text!r}')
                  expected_voice = '${{ steps.request.outputs.female }}' if hashlib.sha256(entry_id.encode('utf-8')).digest()[0] < 128 else '${{ steps.request.outputs.male }}'
                  if record.get('voice') != expected_voice:
                      raise SystemExit(f'Deterministic voice mismatch for {entry_id}: {record.get("voice")} != {expected_voice}')
                  if float(record.get('speed') or 0) != float('${{ steps.request.outputs.speed }}'):
                      raise SystemExit(f'Speed mismatch for {entry_id}')
              print(f'Validated reviewed override semantics for all {len(records)} targeted rows.')
          PY

      - name: Pack batch
        shell: bash
        run: |
          start='${{ steps.request.outputs.start }}'
          limit='${{ steps.request.outputs.limit }}'
          source='${{ steps.request.outputs.source }}'
          archive="worddeck-${source}-en-gb-${start}-${limit}.zip"
          cd /tmp/worddeck-audio
          zip -q -9 -r "/tmp/$archive" .
          echo "ARCHIVE=/tmp/$archive" >> "$GITHUB_ENV"
          echo "ARTIFACT=worddeck-${source}-en-gb-${start}-${limit}" >> "$GITHUB_ENV"

      - name: Upload audio batch
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
