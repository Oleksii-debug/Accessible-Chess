name: Current ChessBase Import Report Passive

on:
  push:
    branches:
      - fix/chessbase-import-report-passive-20261005-sol56z8q9
  pull_request:
    branches:
      - fix/windows-file-dialog-passive-results-20261005-sol56z8q8
    paths:
      - acs/chessbase_library_import.py
      - acs/version2_windows_file_workflows.py
      - tests/test_chessbase_library_import_report_passive.py
      - tests/test_v2_windows_file_worker_shutdown_fence.py
      - tests/test_v2_windows_nvda_file_workflows.py
      - .github/workflows/current-chessbase-import-report-passive.yml

permissions:
  contents: read

concurrency:
  group: current-chessbase-import-report-passive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 2c79de13abecf578b88d8f8a02989aea5f1fe1db
  PARENT_BRANCH: fix/windows-file-dialog-passive-results-20261005-sol56z8q8
  EXPECTED_CHESSBASE_SOURCE_BLOB: e0dd4f970d2e6f4a7198b2b09079866db2f54b60
  EXPECTED_WINDOWS_FILE_SOURCE_BLOB: f6b8c30ecd8106c3cbde817ac658e0982d16ccaf
  EXPECTED_LIBRARY_IMPORT_SOURCE_BLOB: 3ff7dfa63e8d587d5688daed21bdbfce30664c1a
  EXPECTED_DECODER_SOURCE_BLOB: 58e4346dfc406d504fd1175a094a86307d95e7a6
  EXPECTED_REPORT_TEST_BLOB: b192788efe4b4c889aaf315408163d8d69ffc1e6
  EXPECTED_SHUTDOWN_TEST_BLOB: 76d8feb06624df3e32a19c4312be48b075cc2b75
  EXPECTED_NVDA_TEST_BLOB: dcd672769ae9fba9a22334a84230056b9677700c

jobs:
  passive-report:
    name: ChessBase passive report / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact stacked scope and canonical report authorities
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/chessbase-report-parent"
          live_parent="$(git rev-parse refs/remotes/origin/chessbase-report-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "CHESSBASE_REPORT_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-chessbase-import-report-passive.yml"
            "acs/chessbase_library_import.py"
            "acs/version2_windows_file_workflows.py"
            "tests/test_chessbase_library_import_report_passive.py"
            "tests/test_v2_windows_file_worker_shutdown_fence.py"
            "tests/test_v2_windows_nvda_file_workflows.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/chessbase_library_import.py)" = "$EXPECTED_CHESSBASE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_WINDOWS_FILE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/library_import_service.py)" = "$EXPECTED_LIBRARY_IMPORT_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/chessbase_decoder.py)" = "$EXPECTED_DECODER_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_chessbase_library_import_report_passive.py)" = "$EXPECTED_REPORT_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_file_worker_shutdown_fence.py)" = "$EXPECTED_SHUTDOWN_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_nvda_file_workflows.py)" = "$EXPECTED_NVDA_TEST_BLOB"

          echo "CHESSBASE_REPORT_PARENT=$EXPECTED_PARENT"
          echo "CHESSBASE_REPORT_HEAD=$expected_head"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile ChessBase report and Windows worker boundary
        run: >-
          python -m py_compile
          acs/chessbase_library_import.py
          acs/chessbase_decoder.py
          acs/library_import_service.py
          acs/version2_windows_file_workflows.py
          tests/test_chessbase_library_import_report_passive.py
          tests/test_chessbase_active_import_cancellation.py
          tests/test_dev4_chessbase_report_path_privacy.py
          tests/test_v2_windows_file_worker_shutdown_fence.py
          tests/test_v2_windows_nvda_file_workflows.py

      - name: Run ChessBase report and host regressions
        run: >-
          python -m unittest -v
          tests.test_chessbase_library_import_report_passive
          tests.test_chessbase_active_import_cancellation
          tests.test_dev4_chessbase_report_path_privacy
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
