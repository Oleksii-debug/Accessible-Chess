name: Accessible Chess V2 Real CBH Promotions Corpus

on:
  pull_request:
    paths:
      - '.github/workflows/v2-real-cbh-promotions-corpus.yml'
      - 'tests/test_v2_real_cbh_promotions_corpus.py'

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-real-cbh-promotions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V2_AUTHORITY_SHA: 958ae19cd91a135fd3f384d02a880c0ed1adfd10
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696

jobs:
  real-cbh-promotions:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact QA head
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact authority ancestry and evidence-only scope
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V2_AUTHORITY_SHA" HEAD
          git diff --check "$V2_AUTHORITY_SHA" HEAD
          changed="$(git diff --name-only "$V2_AUTHORITY_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-real-cbh-promotions-corpus.yml' \
            'tests/test_v2_real_cbh_promotions_corpus.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected QA scope:\n%s\n' "$changed" >&2
            exit 1
          }
          git diff --quiet "$V2_AUTHORITY_SHA" HEAD -- acs web tools/optional
          printf 'V2_REAL_CBH_PROMOTIONS_AUTHORITY=%s\nQA_HEAD=%s\n' "$V2_AUTHORITY_SHA" "$(git rev-parse HEAD)"

      - name: Checkout pinned legal libcbh corpus
        uses: actions/checkout@v4
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned regression dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Build pinned libcbh and existing Accessible Chess bridge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge
          sha256sum upstream/libcbh/gtest/ManyPromotions/ManyPromotions.cbh \
            upstream/libcbh/gtest/ManyPromotions/Promotions.pgn

      - name: Compile QA and Product surfaces
        working-directory: product
        run: python -m compileall -q acs tests/test_v2_real_cbh_promotions_corpus.py

      - name: Run all-game real promotion and underpromotion oracle
        working-directory: product
        shell: bash
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_PROMOTIONS_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/ManyPromotions
        run: |
          set +e
          set -o pipefail
          python -m unittest -v tests.test_v2_real_cbh_promotions_corpus 2>&1 | tee real-cbh-promotions.log
          oracle_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$oracle_status" > real-cbh-promotions.status
          printf 'REAL_CBH_PROMOTIONS_ORACLE_EXIT=%s\n' "$oracle_status"
          exit 0

      - name: Focused ChessBase canonical regressions
        working-directory: product
        run: >-
          python -m unittest -v
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_version2_formats_integration
          tests.test_pgn_document

      - name: Full repository unittest
        working-directory: product
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        working-directory: product
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        working-directory: product
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-real-cbh-promotions-evidence
          path: |
            product/real-cbh-promotions.log
            product/real-cbh-promotions.status
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce real-corpus verdict after regressions
        if: always()
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test -f real-cbh-promotions.status
          status="$(cat real-cbh-promotions.status)"
          test "$status" = "0" || {
            printf 'Real CBH promotion corpus is RED (oracle exit=%s).\n' "$status" >&2
            exit "$status"
          }
