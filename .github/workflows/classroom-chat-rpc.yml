name: Classroom Chat RPC

on:
  pull_request:
    branches:
      - feature/classroom-collaboration-contract-20260926
    paths:
      - 'acs/classroom_chat_rpc.py'
      - 'tests/test_classroom_chat_rpc.py'
      - '.github/workflows/classroom-chat-rpc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-chat-rpc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact chat RPC scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-chat-rpc.yml'
            'acs/classroom_chat_rpc.py'
            'tests/test_classroom_chat_rpc.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected classroom chat RPC scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'CLASSROOM_CHAT_RPC_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile chat RPC boundaries
        run: >-
          python -m py_compile
          acs/classroom_chat_rpc.py
          tests/test_classroom_chat_rpc.py

      - name: Run chat RPC and canonical collaboration regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_chat_rpc
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
