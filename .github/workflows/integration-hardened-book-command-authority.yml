name: Integration Hardened Book Command Authority

on:
  push:
    branches:
      - integration/hardened-book-command-authority-20261004-sol6p3
    paths:
      - 'acs/version2_application.py'
      - 'tests/test_full_product_book_command_authority.py'
      - '.github/workflows/integration-hardened-book-command-authority.yml'
  pull_request:
    branches:
      - integration/hardened-browser-authority-20261004
    paths:
      - 'acs/version2_application.py'
      - 'tests/test_full_product_book_command_authority.py'
      - '.github/workflows/integration-hardened-book-command-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-hardened-book-command-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify exact parent and bounded successor scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          base='d95f4f32631591f05bd86fff5e7067ed7fd6e6ab'
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/integration-hardened-book-command-authority.yml' \
            'acs/version2_application.py' \
            'tests/test_full_product_book_command_authority.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/version2_application.py)" = 'a2e0e00ba0c0274831bb847d8eaa8ba9688f669b'
          test "$(git rev-parse HEAD:tests/test_full_product_book_command_authority.py)" = '953697afb6a458eef9e4eea6136ef92000af8942'
          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = '460d2287d24dc004535af93bb7f8b9a2066cbe7d'
          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = '53574e235524581dc343db0b123df845c15a13f4'
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = 'aebc8630ac6807c753de8ad9fc97baf7fcae7149'
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = '1ac6c9adfe44af442d3b8e5b15ddf49310d8ac1d'
          git diff --check "$base" HEAD

      - name: Compile authority surfaces
        run: >-
          python -m compileall -q
          acs/version2_application.py
          tests/test_full_product_book_command_authority.py

      - name: Run focused Book command authority regression
        run: >-
          python -m unittest -v
          tests.test_full_product_book_command_authority

      - name: Run application and Book authority regressions
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_book_reverse_progress_failure_exact
          tests.test_v2_book_board_workflow
          tests.test_dev1_books_training_webview_bridge
          tests.test_version2_release_accessibility_contract

      - name: Re-run inherited browser authority contracts
        run: |
          node --check web/full_product_books_training.js
          node --check web/version2_release_bootstrap.js
          node tests/js/books_training_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Run core selftest
        run: python -m acs.selftest
