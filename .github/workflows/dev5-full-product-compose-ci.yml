name: DEV5 Full Product Selective Composition CI

on:
  workflow_dispatch:
  push:
    branches:
      - full5/dev5-selective-compose-20260822
  pull_request:
    branches:
      - manual5/integration-20260821

permissions:
  contents: read

jobs:
  selective-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Diff hygiene and compile
        run: |
          git diff --check 0fa442330bc2bb03636ff9297512da4c29e38684 HEAD
          python -m compileall -q acs tests run_accessible_chess.py
      - name: DEV1 presentation and accessibility package
        run: >-
          python -m unittest -v
          tests.test_dev1_full_product_accessible_shell
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_classroom_remote_ui
          tests.test_keybindings
          tests.test_board_rank_file_remapping_ui
          tests.test_dev1_release_ui_regressions
          tests.test_accessible_webui
      - name: Canonical GameTree contract
        run: >-
          python -m unittest -v
          tests.test_gametree
          tests.test_bookdocument
      - name: Full unittest discovery
        run: python -m unittest discover -s tests -v
      - name: Full pytest without weakening
        run: python -m pytest -q
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
