name: Current Book Training Passive Roots

on:
  pull_request:
    branches:
      - fix/book-progress-reader-snapshot-dispatch-20261006-g5s6
    paths:
      - 'acs/book_training.py'
      - 'tests/test_book_training_passive_roots_current.py'
      - '.github/workflows/current-book-training-passive-roots.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BOOK_TRAINING_BLOB: d7e54c4eb77240b76f80da648ad51c414d73efe1
  PASSIVE_ROOT_TEST_BLOB: 29689e316db9f00ba2a73ee1d9c2c7f8b8e207ea

concurrency:
  group: current-book-training-passive-roots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          base_ref="${EVENT_BASE_REF:-fix/book-progress-reader-snapshot-dispatch-20261006-g5s6}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-book-training-passive-roots.yml' \
            'acs/book_training.py' \
            'tests/test_book_training_passive_roots_current.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Book Training passive-root scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/book_training.py)" = "$BOOK_TRAINING_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_training_passive_roots_current.py)" = "$PASSIVE_ROOT_TEST_BLOB"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Book Training provenance boundary
        run: >-
          python -m compileall -q
          acs/book_training.py
          tests/test_book_training_passive_roots_current.py

      - name: Execute Book Training and whole-product regressions
        run: >-
          python -m unittest -v
          tests.test_book_training_passive_roots_current
          tests.test_d08_book_training_contract
          tests.test_w2_book_training_canonical_ingress
          tests.test_training_authority_convergence
          tests.test_training_presentation_passive_authority
          tests.test_version2_training_current_runtime

      - name: Core selftest
        run: python -m acs.selftest
