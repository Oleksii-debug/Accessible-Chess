name: PGN Position New Document Reachability

on:
  pull_request:
    branches:
      - work/books-bidirectional-semantic-navigation-20260927
    paths:
      - 'acs/pgn_document.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_native_menu.py'
      - 'acs/version2_application.py'
      - 'acs/version2_release_app.py'
      - 'tests/test_pgn_document_new_game_position_integrity.py'
      - 'tests/test_pgn_position_new_document_reachability.py'
      - '.github/workflows/pgn-document-new-game-position-integrity.yml'
      - '.github/workflows/pgn-position-new-document-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-position-new-document-reachability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  position-new-document:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked authorities and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          git fetch --no-tags origin             work/books-bidirectional-semantic-navigation-20260927             fix/pgn-new-game-position-tag-integrity-20260929

          books="$(git rev-parse refs/remotes/origin/work/books-bidirectional-semantic-navigation-20260927)"
          position="$(git rev-parse refs/remotes/origin/fix/pgn-new-game-position-tag-integrity-20260929)"

          test "$(git merge-base "$books" HEAD)" = "$books"
          git merge-base --is-ancestor "$position" HEAD
          git diff --check "$books" HEAD

          mapfile -t actual < <(git diff --name-only "$books" HEAD | LC_ALL=C sort)
          expected_paths=(
            '.github/workflows/d01-pgn-workspace-webview.yml'
            '.github/workflows/pgn-document-new-game-position-integrity.yml'
            '.github/workflows/pgn-position-new-document-reachability.yml'
            '.github/workflows/version2-windows-composition.yml'
            'acs/full_product_actions.py'
            'acs/full_product_native_menu.py'
            'acs/pgn_document.py'
            'acs/version2_application.py'
            'acs/version2_release_app.py'
            'tests/test_pgn_document_new_game_position_integrity.py'
            'tests/test_pgn_position_new_document_reachability.py'
            'tests/test_version2_application.py'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)
          test "${actual[*]}" = "${wanted[*]}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile owned Python
        run: >-
          python -m py_compile
          acs/pgn_document.py
          acs/full_product_actions.py
          acs/full_product_native_menu.py
          acs/version2_application.py
          acs/version2_release_app.py
          tests/test_pgn_document_new_game_position_integrity.py
          tests/test_pgn_position_new_document_reachability.py

      - name: Run focused position and application reachability contracts
        run: >-
          python -m unittest -v
          tests.test_pgn_document_new_game_position_integrity
          tests.test_pgn_position_new_document_reachability
          tests.test_version2_release_app
          tests.test_full_product_native_menu
          tests.test_version2_windows_composition_profile

      - name: Run adjacent V2 application contracts
        run: python -m unittest -v tests.test_version2_application

      - name: Run delegated route and focus DOM contract
        run: node tests/js/version2_release_bootstrap_dom_test.js

      - name: Run core selftest
        run: python -m acs.selftest
