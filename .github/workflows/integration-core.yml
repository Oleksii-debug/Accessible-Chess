name: Accessible Chess Integration Core

on:
  workflow_dispatch:
  push:
    branches:
      - integration/accessible-chess-next

permissions:
  contents: read
  issues: write

concurrency:
  group: integration-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-tracked-source-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Product gate test dependency
        run: python -m pip install -q pytest

      - name: Publish exact Integration Core start evidence
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'INTEGRATION CORE START — EXACT SHA',
              '',
              `Integration SHA: \`${context.sha}\``,
              `Workflow run: \`${context.runId}\``,
              `Run URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This is automated integration evidence only. No Windows or NVDA verification is implied.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 14,
              body,
            });

      - name: Prove exact tracked source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"
          for path in \
            acs/chesscore.py \
            acs/webapp.py \
            acs/webapp_keymap.py \
            acs/stage1_release_ui.py \
            acs/ui_native_menu.py \
            acs/analysis_service.py \
            acs/continuous_analysis.py \
            acs/stockfish_runtime.py \
            acs/sound_runtime.py \
            run_accessible_chess.py \
            web/index.html \
            tests/test_issue22_release_contract.py \
            tests/test_stage1_complete_user_flow.py \
            tests/test_stage1_core_full_flow.py
          do
            test -f "$path" || { echo "Missing tracked release source: $path"; exit 1; }
            git ls-files --error-unmatch "$path" >/dev/null
          done

      - name: Verify exact candidate diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            before='${{ github.event.before }}'
            test -n "$before"
            git diff --check "$before" "${GITHUB_SHA}"
          else
            git diff --check HEAD^ "${GITHUB_SHA}"
          fi

      - name: Compile exact tracked tree
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Parse inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/accessible-chess-inline.js').write_text('\n;\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/accessible-chess-inline.js

      - name: Architecture boundary gate
        run: python -m unittest -v tests.test_architecture

      - name: Stage 1 canonical Core full-flow gate
        run: python -m unittest -v tests.test_stage1_core_full_flow tests.test_core_release_contracts

      - name: Data, PGN and history regression gate
        run: python -m unittest -v tests.test_data_integration tests.test_pgn_service tests.test_history

      - name: Import registry and read-only adapter regressions
        run: python -m unittest -v tests.test_import_registry tests.test_chessbase_adapter tests.test_windows_data_release_regressions

      - name: Engine service, continuous analysis and game lifecycle gates
        run: python -m unittest -v tests.test_analysis_service tests.test_continuous_analysis tests.test_engine_play_service tests.test_clock_service tests.test_game_lifecycle tests.test_engine_game_session

      - name: Production Stockfish runtime and semantic analysis integration gate
        run: python -m unittest -v tests.test_stockfish_runtime tests.test_ui_analysis_webapp tests.test_analysis_webview_bridge tests.test_release_stockfish_composition

      - name: Integrated Stage1 Stockfish play and professional analysis gate
        run: >-
          python -m unittest -v
          tests.test_board_rank_file_remapping_ui
          tests.test_stage1_engine_play_ui
          tests.test_engine_play_service_concurrency
          tests.test_engine_game_timeout_ownership
          tests.test_ui_analysis_adapter
          tests.test_ui_analysis_webapp
          tests.test_analysis_webview_bridge
          tests.test_ui_native_menu_recovery
          tests.test_release_stockfish_composition

      - name: Official Stockfish 18 production UCI and MultiPV smoke
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/stockfish-ubuntu-x86-64-avx2.tar"
          extract_dir="$RUNNER_TEMP/stockfish18"
          curl --fail --location --retry 3 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64-avx2.tar \
            --output "$archive"
          echo '536c0c2c0cf06450df0bfb5e876ef0d3119950703a8f143627f990c7b5417964  '"$archive" | sha256sum --check
          mkdir -p "$extract_dir"
          tar -xf "$archive" -C "$extract_dir"
          engine="$(find "$extract_dir" -type f -name 'stockfish-ubuntu-x86-64-avx2' -print -quit)"
          test -n "$engine"
          chmod +x "$engine"
          STOCKFISH18_PATH="$engine" python - <<'PY'
          import os
          import re
          from acs.stockfish_runtime import StockfishRuntime, StockfishRuntimeConfig

          start_fen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
          move_re = re.compile(r'^[a-h][1-8][a-h][1-8][qrbn]?$')
          with StockfishRuntime(
              StockfishRuntimeConfig(configured_path=os.environ['STOCKFISH18_PATH'])
          ) as runtime:
              provider = runtime.provider()
              best = provider.best_move(start_fen, skill_level=20, movetime_ms=100)
              assert best is not None and move_re.fullmatch(best), best
              lines = provider.analyze(start_fen, multipv=5, depth=8)
              assert len(lines) == 5, len(lines)
              assert all(line.pv and all(move_re.fullmatch(move) for move in line.pv) for line in lines)
              assert all(line.depth >= 1 for line in lines)
          print('OFFICIAL STOCKFISH 18 UCI ISREADY BESTMOVE MULTIPV5 PASS')
          PY

      - name: Board, move-entry, editor and history gates
        run: python -m unittest -v tests.test_board_service tests.test_move_entry tests.test_position_editor tests.test_ui_review_adapter tests.test_history_review_ui

      - name: Sound, training, settings and entitlement gates
        run: python -m unittest -v tests.test_sound_events tests.test_training tests.test_settings tests.test_entitlements tests.test_ui_entitlement_integration

      - name: Human NVDA Issue 22 and packaged WebView release regression gate
        run: python -m unittest -v tests.test_issue22_release_contract tests.test_nvda_p0_contract tests.test_stage1_webview2_accessibility_boundary tests.test_webview_safe_server

      - name: Remappable actions, import safety and notation gates
        run: python -m unittest -v tests.test_keybindings tests.test_ui_keymap_editor tests.test_keymap_import_warning_confirmation_integration tests.test_keymap_import_warning_confirmation tests.test_notation tests.test_extension_registries tests.test_webview_keymap_bridge_contract

      - name: Accessible Web UI gate
        run: python -m unittest -v tests.test_accessible_webui

      - name: Complete Stage 1 release user-flow gate
        run: python -m unittest -v tests.test_stage1_complete_user_flow

      - name: Full repository unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest without weakening
        run: python -m pytest -q

      - name: Exact tracked release diagnostic
        run: python run_accessible_chess.py --diagnostic

      - name: Publish exact Integration Core success evidence
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'INTEGRATION CORE SUCCESS — EXACT SHA',
              '',
              `Integration SHA: \`${context.sha}\``,
              `Workflow run: \`${context.runId}\``,
              `Run URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'All Integration Core gates completed successfully. This does not claim Windows or human NVDA verification.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 14,
              body,
            });