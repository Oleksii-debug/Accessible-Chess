name: Agent Canonical Board Move Tools

on:
  pull_request:
    branches:
      - feature/agent-production-execution-host-20261006-sol56ac9
    paths:
      - acs/chess_agent_tools.py
      - tests/test_agent_board_move_tools.py
      - .github/workflows/agent-board-legal-move.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-board-move-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  canonical-board-move:
    name: Canonical board move (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact production-host parent and bounded scope
        shell: bash
        env:
          PINNED_BASE: b6ae4998daa07f9ee961137f022e5623376c99d0
          BASE_BRANCH: feature/agent-production-execution-host-20261006-sol56ac9
        run: |
          set -euo pipefail
          CANDIDATE="$(git rev-parse HEAD)"
          git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/agent-board-move-base"
          test "$(git rev-parse refs/remotes/origin/agent-board-move-base)" = "$PINNED_BASE"
          test "$(git merge-base "$PINNED_BASE" "$CANDIDATE")" = "$PINNED_BASE"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/agent-board-move-live-head"
            test "$(git rev-parse refs/remotes/origin/agent-board-move-live-head)" = "$CANDIDATE"
          fi

          mapfile -t changed < <(git diff --name-only "$PINNED_BASE"..."$CANDIDATE" | LC_ALL=C sort)
          expected=(
            ".github/workflows/agent-board-legal-move.yml"
            "acs/chess_agent_tools.py"
            "tests/test_agent_board_move_tools.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Prove exact semantic authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/chess_agent_tools.py)" = '840725558b7ffe7288f5e17b14cedff112febf8f'
          test "$(git rev-parse HEAD:tests/test_agent_board_move_tools.py)" = '5b666c78945087fb84d4da754680e51a2a7a951a'
          test "$(git rev-parse HEAD:acs/chesscore.py)" = 'eb9229b5ee107afe06cdf8a916f466e1474dddd4'
          test "$(git rev-parse HEAD:acs/board_service.py)" = '5058733f0efe74bd42831b98c8f9cba83278d0cf'
          test "$(git rev-parse HEAD:acs/agent_execution_host.py)" = 'fe0ee060a9de7a45a192e185a50c95628d8b007b'
          test "$(git rev-parse HEAD:acs/stage1_release_ui.py)" = '23e5bcdde11acdb963515bea4bc4a93473dbbd05'
          test "$(git rev-parse HEAD:acs/stage1_release_ui_core.py)" = 'cb89d8d2d204545096568134637b39c888cf17b8'
          test "$(git rev-parse HEAD:tests/test_chess_agent_tools_crossrepo.py)" = '0ab21c0b8529e8ece4b722392a2f907a65672763'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install retained test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Compile board/Agent boundaries
        run: >-
          python -m py_compile
          acs/chess_agent_tools.py
          acs/chesscore.py
          acs/board_service.py
          acs/agent_execution_host.py
          acs/stage1_release_ui.py
          acs/stage1_release_ui_core.py
          tests/test_agent_board_move_tools.py

      - name: Run focused canonical board-move contract
        run: python -m unittest -v tests.test_agent_board_move_tools

      - name: Re-run retained cross-product and production-host contracts
        run: >-
          python -m pytest -q
          tests/test_chess_agent_tools_crossrepo.py
          tests/test_agent_execution_host.py

      - name: Run core semantic selftest
        run: python -m acs.selftest
