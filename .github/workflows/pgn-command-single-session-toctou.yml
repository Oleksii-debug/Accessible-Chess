name: PGN Command Single Session TOCTOU

on:
  pull_request:
    paths:
      - "acs/version2_pgn_commands.py"
      - "tests/test_version2_pgn_commands.py"
      - ".github/workflows/pgn-command-single-session-toctou.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-command-single-session-toctou-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact current-Product ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          base="3c69ac281915418574d84c62d928d26db567cd5a"
          test "$(git merge-base HEAD "$base")" = "$base"
          python - <<'PY'
          import subprocess

          base = "3c69ac281915418574d84c62d928d26db567cd5a"
          expected = {
              ".github/workflows/pgn-command-single-session-toctou.yml",
              "acs/version2_pgn_commands.py",
              "tests/test_version2_pgn_commands.py",
          }
          changed = set(
              filter(
                  None,
                  subprocess.check_output(
                      ["git", "diff", "--name-only", f"{base}...HEAD"],
                      text=True,
                  ).splitlines(),
              )
          )
          if changed != expected:
              raise SystemExit(
                  f"unexpected scope: {sorted(changed)!r}; expected={sorted(expected)!r}"
              )
          PY
          git diff --check "$base"...HEAD

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/version2_pgn_commands.py
          tests/test_version2_pgn_commands.py

      - name: Run PGN command and adjacent application regressions
        run: >-
          python -m unittest -v
          tests.test_version2_pgn_commands
          tests.test_v2_windows_pgn_export
          tests.test_version2_application
