name: P0-G Final Product Runtime Reachability

on:
  pull_request:
    branches:
      - fix/p0g-event-aware-current-product-20260926
      - converge/p0-release-critical-to-full-product-20260926
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'run_accessible_chess_v2.py'
      - 'acs/version2_upgrade_status_release.py'
      - 'acs/version2_education_mutation_release.py'
      - 'web/p0_accessibility_runtime.js'
      - 'tests/test_p0g_final_product_runtime_reachability.py'
      - '.github/workflows/p0g-final-product-runtime-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0g-final-product-runtime-reachability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  P0G_OWNER_BASE: fix/p0g-event-aware-current-product-20260926
  LAUNCHER_BLOB: a564d90a9365ef5f42cd40db6df8e8c29f5d22b8
  SHIPPING_RELEASE_BLOB: 6631d8e8a000ed32f60a95f68d9b02cf0422c4df
  EDUCATION_RELEASE_BLOB: 7a772b33f01709eb5f7ab7db447aa0a48594b3de
  P0_RUNTIME_BLOB: 14565e8b97f0dcd995a764127bd1badc17ff7e30
  P0_RUNTIME_DIRECTION_BLOB: ffd62735480c6b26a01aeeec672c020b9815c40c
  P0_RUNTIME_CONTEXT_BLOB: ffb190c333ee0cf5f211ad2739b329872a81d197
  REACHABILITY_TEST_BLOB: 28ccda2a560e34ea5b014de1b36c6ceb344b71f2

jobs:
  final-product-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove owner scope or retained convergence reachability
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA" HEAD
          authorities="$(printf '%s\n' \
            '.github/workflows/p0g-final-product-runtime-reachability.yml' \
            'run_accessible_chess_v2.py' \
            'acs/version2_upgrade_status_release.py' \
            'acs/version2_education_mutation_release.py' \
            'web/p0_accessibility_runtime.js' \
            'tests/test_p0g_final_product_runtime_reachability.py' | sort)"
          while IFS= read -r path; do
            test -f "$path" || {
              printf 'Shipping P0-G reachability authority missing: %s\n' "$path" >&2
              exit 1
            }
          done <<< "$authorities"
          if test "$EXPECTED_BASE_REF" = "$P0G_OWNER_BASE"; then
            changed="$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort)"
            unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$authorities") || true)"
            test -z "$unexpected" || {
              printf 'Unexpected P0-G reachability owner scope:\n%s\n' "$unexpected" >&2
              exit 1
            }
            echo 'P0_G_REACHABILITY_SCOPE_MODE=OWNER_BOUNDED'
          else
            echo 'P0_G_REACHABILITY_SCOPE_MODE=CONVERGENCE_RETAINED'
          fi
          test "$(git rev-parse HEAD:run_accessible_chess_v2.py)" = "$LAUNCHER_BLOB"
          test "$(git rev-parse HEAD:acs/version2_upgrade_status_release.py)" = "$SHIPPING_RELEASE_BLOB"
          test "$(git rev-parse HEAD:acs/version2_education_mutation_release.py)" = "$EDUCATION_RELEASE_BLOB"
          runtime_blob="$(git rev-parse HEAD:web/p0_accessibility_runtime.js)"
          case "$runtime_blob" in
            "$P0_RUNTIME_BLOB"|"$P0_RUNTIME_DIRECTION_BLOB"|"$P0_RUNTIME_CONTEXT_BLOB")
              ;;
            *)
              printf 'Unexpected P0 runtime blob: %s\n' "$runtime_blob" >&2
              exit 1
              ;;
          esac
          test "$(git rev-parse HEAD:tests/test_p0g_final_product_runtime_reachability.py)" = "$REACHABILITY_TEST_BLOB"
          grep -Fq 'from acs.version2_upgrade_status_release import main' run_accessible_chess_v2.py
          grep -Fq '"AccessibleChessTeacherSurface"' web/p0_accessibility_runtime.js
          grep -Fq 'wrapSurfaceRenderAnnouncement' web/p0_accessibility_runtime.js

      - name: Parse shipping P0 runtime
        run: node --check web/p0_accessibility_runtime.js

      - name: Compile shipping final-product reachability scope
        run: >-
          python -m py_compile
          run_accessible_chess_v2.py
          acs/version2_upgrade_status_release.py
          acs/version2_education_mutation_release.py
          tests/test_p0g_final_product_runtime_reachability.py

      - name: Prove runtime load order through actual shipping composition
        run: python -m unittest -v tests.test_p0g_final_product_runtime_reachability tests.test_version2_final_product_composition

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Core selftest
        run: python -m acs.selftest

      - name: Current V2 production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic
