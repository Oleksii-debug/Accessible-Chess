name: Remappable Board Grid Controls

on:
  pull_request:
    branches:
      - fix/keybinding-nvda-conflict-diagnostics-20260926
    paths:
      - 'acs/keybindings.py'
      - 'acs/ui_keymap_adapter.py'
      - 'web/keybindings.json'
      - 'web/index.html'
      - 'tests/test_stage1_board_action_integration.py'
      - 'tests/test_webview_keymap_bridge_contract.py'
      - 'tests/js/remappable_board_grid_controls_test.js'
      - '.github/workflows/remappable-board-grid-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remappable-board-grid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          merge_base="$(git merge-base "$base" HEAD)"
          changed="$(git diff --name-only "$merge_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/remappable-board-grid-controls.yml' \
            'acs/keybindings.py' \
            'acs/ui_keymap_adapter.py' \
            'tests/js/remappable_board_grid_controls_test.js' \
            'tests/test_stage1_board_action_integration.py' \
            'tests/test_webview_keymap_bridge_contract.py' \
            'web/index.html' \
            'web/keybindings.json' | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected board-grid remap scope:\n%s\n' "$changed" >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile keymap composition
        run: >-
          python -m py_compile
          acs/keybindings.py
          acs/ui_keymap_adapter.py
          tests/test_stage1_board_action_integration.py
          tests/test_webview_keymap_bridge_contract.py

      - name: Run keymap and board integration regressions
        run: >-
          python -m unittest -v
          tests.test_keybindings
          tests.test_stage1_board_action_integration
          tests.test_webview_keymap_bridge_contract

      - name: Run browser event canonicalization regression
        run: node tests/js/remappable_board_grid_controls_test.js
