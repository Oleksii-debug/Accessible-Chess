name: P0 Release Critical Triad Convergence

on:
  pull_request:
    paths:
      - 'scripts/p0_packaged_document_copy_probe.ps1'
      - 'tests/test_p0_packaged_document_copy_probe.py'
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'tests/test_verify_p0_packaged_document_copy_evidence.py'
      - 'scripts/p0g_packaged_hotkey_result_probe.ps1'
      - 'tests/test_p0g_packaged_hotkey_result_probe.py'
      - 'tests/test_p0_release_critical_triad_convergence.py'
      - '.github/workflows/p0-release-critical-triad-convergence.yml'
      - 'acs/**'
      - 'web/**'
      - 'run_accessible_chess_v2.py'

concurrency:
  group: p0-release-critical-triad-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triad:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout proposed convergence merge
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Prove exact pull-request merge identity
        shell: bash
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKED_SHA: ${{ github.sha }}
          PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
        run: |
          set -euo pipefail
          test -n "$EVENT_BASE_REF"
          test -n "$EVENT_BASE_SHA"
          test -n "$EVENT_HEAD_REF"
          test -n "$EVENT_HEAD_SHA"
          test -n "$CHECKED_SHA"
          test "$(git rev-parse HEAD)" = "$CHECKED_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git cat-file -e "$EVENT_HEAD_SHA^{commit}"
          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")"
          git cat-file -e "$live_product^{commit}"
          git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
          live_target="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
          git cat-file -e "$live_target^{commit}"
          # A queued pull_request event may retain the base SHA from enqueue time while
          # GitHub refreshes refs/pull/<n>/merge against a newer target. Accept only a
          # monotonic target advance: rewind/divergence remains fail-closed.
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$live_target"
          test "$(git merge-base "$EVENT_BASE_SHA" "$live_target")" = "$EVENT_BASE_SHA"
          if test "$EVENT_HEAD_REF" = "$PRODUCT_BRANCH"; then
            test "$EVENT_HEAD_SHA" = "$live_product" || {
              printf 'Current Product PR head is stale: live_product=%s event_head=%s\n' \
                "$live_product" "$EVENT_HEAD_SHA" >&2
              exit 1
            }
            diff_base="$(git rev-parse "$EVENT_HEAD_SHA^")"
          else
            # The exact live target branch is the authority for ordinary and stacked PRs.
            # It may itself be a canonical lineage that legitimately diverged from Product.
            diff_base="$live_target"
          fi
          git cat-file -e "$diff_base^{commit}"
          parents="$(git show -s --format=%P HEAD)"
          test "$parents" = "$live_target $EVENT_HEAD_SHA"
          if test "$EVENT_HEAD_REF" = "$PRODUCT_BRANCH"; then
            git merge-base --is-ancestor "$diff_base" "$EVENT_HEAD_SHA"
            git diff --check "$diff_base..$EVENT_HEAD_SHA"
          else
            # Check the exact synthesized merge result relative to the target parent.
            # This remains correct even when the PR head does not yet contain a target
            # advance that GitHub has already folded into refs/pull/<n>/merge.
            git diff --check "$live_target..$CHECKED_SHA"
          fi
          echo "P0_TRIAD_PRODUCT_PARENT=$live_product"
          echo "P0_TRIAD_TARGET_BRANCH=$EVENT_BASE_REF"
          echo "P0_TRIAD_EVENT_BASE=$EVENT_BASE_SHA"
          echo "P0_TRIAD_TARGET_BASE=$live_target"
          echo "P0_TRIAD_PR_HEAD=$EVENT_HEAD_SHA"
          echo "P0_TRIAD_DIFF_BASE=$diff_base"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile convergence contract
        run: python -m py_compile tests/test_p0_release_critical_triad_convergence.py
      - name: Run release-critical triad contract
        run: python -m unittest -v tests.test_p0_release_critical_triad_convergence
      - name: Re-run packaged copy and P0-G static contracts
        run: >-
          python -m unittest -v
          tests.test_p0_packaged_document_copy_probe
          tests.test_p0g_packaged_hotkey_result_probe
          tests.test_verify_p0_packaged_document_copy_evidence
