name: Current Book Bounds Reader Root

on:
  pull_request:
    branches:
      - fix/current-bookdocument-canonical-bounds-20261004-zftrkmo
    paths:
      - 'acs/bookreader.py'
      - 'tests/test_bookreader.py'
      - '.github/workflows/current-book-bounds-reader-root.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-bounds-reader-root-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-fix/current-bookdocument-canonical-bounds-20261004-zftrkmo}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-book-bounds-reader-root.yml' \
            'acs/bookreader.py' \
            'tests/test_bookreader.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Book bounds/reader-root scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile reader surfaces
        run: >-
          python -m compileall -q
          acs/bookreader.py
          tests/test_bookreader.py

      - name: Execute reader and canonical-bound regressions
        run: >-
          python -m unittest -v
          tests.test_bookreader
          tests.test_bookreader_snapshot_bounds
          tests.test_book_index
          tests.test_book_document_ingress_passive_current
          tests.test_bookdocument_deserialize_bounds_current
          tests.test_bookdocument_scalar_bounds_current
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_dev1_books_training_webview_projection
          tests.test_v2_book_board_workflow
          tests.test_version2_application
          tests.test_final_product_announcement_localization_current

      - name: Core selftest
        run: python -m acs.selftest
