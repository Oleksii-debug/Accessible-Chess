name: Integration Hardened Books Training Regressions

on:
  push:
    branches:
      - integration/hardened-books-training-regressions-20261004
  pull_request:
    branches:
      - integration/hardened-pgn-browser-reconcile-20261004
    paths:
      - 'tests/test_dev1_books_training_webview_projection.py'
      - 'tests/test_v2_book_training_route_rollback.py'
      - 'tests/test_version2_release_accessibility_contract.py'
      - '.github/workflows/integration-hardened-books-training-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-hardened-books-training-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact regression identities
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          parent='7c2643f946e697067907bac6617577e0472863cd'
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/integration-hardened-books-training-regressions.yml' \
            'tests/test_dev1_books_training_webview_projection.py' \
            'tests/test_v2_book_training_route_rollback.py' \
            'tests/test_version2_release_accessibility_contract.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_projection.py)" = '2198a9a1e5a6e6e9ee8e93de49db34d7e9b86bad'
          test "$(git rev-parse HEAD:tests/test_v2_book_training_route_rollback.py)" = '1e9b0e03c5c81ef187234a748bbd23c2759ad4cb'
          test "$(git rev-parse HEAD:tests/test_version2_release_accessibility_contract.py)" = 'a9d6d065777156c3fe2327b2183df5d8898dc2cb'

          echo 'HARDENED_BOOKS_TRAINING_REGRESSIONS_SCOPE=PASS'

      - name: Run merged projection regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_bridge
          tests.test_v2_book_training_route_rollback
          tests.test_version2_release_accessibility_contract
          tests.test_training_authority_convergence
          tests.test_version2_application

      - name: Run Books Training DOM contract
        run: node tests/js/books_training_surface_dom_test.js

      - name: Core selftest
        run: python -m acs.selftest
