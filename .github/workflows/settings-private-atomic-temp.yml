name: Settings Private Atomic Temp

on:
  push:
    branches:
      - fix/settings-private-atomic-temp-20261004
  pull_request:
    branches:
      - fix/settings-upgrade-lock-identity-20261004
    paths:
      - 'acs/settings.py'
      - 'tests/test_settings.py'
      - '.github/workflows/settings-private-atomic-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-private-atomic-temp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and Settings-temp scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='29156007148d1eb0fa47c263815c6d551e3d0340'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/settings-upgrade-lock-identity-20261004'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/settings-private-atomic-temp.yml'             'acs/settings.py'             'tests/test_settings.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/settings.py)" = "4b3c8a1e9108fc7e54d0f03a51ddd985837847a8"
          test "$(git rev-parse HEAD:tests/test_settings.py)" = "1c774ee2f91b259be8b927fcea7eeb26ca443b2e"

          echo 'SETTINGS_PRIVATE_ATOMIC_TEMP_SCOPE=PASS'

      - name: Compile Settings writer surfaces
        run: >-
          python -m compileall -q
          acs/settings.py
          tests/test_settings.py

      - name: Settings and writer-grammar regressions
        run: >-
          python -m unittest -v
          tests.test_settings
          tests.test_v2_upgrade_root_writer_artifact_grammar
          tests.test_v2_upgrade_generated_artifact_authentication
          tests.test_v2_upgrade_tracked_writer_conflict

      - name: Core selftest
        run: python -m acs.selftest
