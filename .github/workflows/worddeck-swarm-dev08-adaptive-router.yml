name: WordDeck DEV08 Adaptive Router Gate

on:
  push:
    branches:
      - 'worddeck-swarm-dev08-adaptive-router*'
  pull_request:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/**'
      - '.github/workflows/worddeck-swarm-dev08-adaptive-router.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: worddeck-dev08-adaptive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-router-gate:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Publish pending exact-tip status
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'WordDeck DEV08 Adaptive Router Gate',
              description: 'DEV08 exact-tip deterministic cross-mode router gate is running.',
              target_url: targetUrl
            });

      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Build Release warnings as errors
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror

      - name: Run complete source-build self-test suite
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Publish self-contained Windows x64
        run: dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-dev08-adaptive

      - name: Run published EXE self-test
        shell: pwsh
        run: |
          & .\artifacts\WordDeck-dev08-adaptive\WordDeck.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no personal state in publish tree
        shell: pwsh
        run: |
          $bad = Get-ChildItem -LiteralPath '.\artifacts\WordDeck-dev08-adaptive' -Recurse -File | Where-Object {
            $_.Name -match '^(state|spelling-state|sentence-state|sentence-coach-state|adaptive-state)(\.backup)?\.json$' -or
            $_.Name -match '^WordDeck-profile.*\.json$' -or
            $_.FullName -match '[\\/]Backups[\\/]'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "Personal state leaked into publish tree: $($_.FullName)" }
            exit 1
          }

      - name: Cyrillic and spaces path smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'WordDeck адаптивний DEV08\Published App'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path '.\artifacts\WordDeck-dev08-adaptive\*' -Destination $target -Recurse -Force
          & (Join-Path $target 'WordDeck.exe') --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish final exact-tip status
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'WordDeck DEV08 Adaptive Router Gate',
              description: succeeded ? 'DEV08 deterministic cross-mode router gate passed.' : 'DEV08 deterministic cross-mode router gate failed.',
              target_url: targetUrl
            });
