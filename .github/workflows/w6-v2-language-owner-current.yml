name: W6 V2 Persisted Language Current Runtime

on:
  push:
    branches:
      - work/w6-v2-language-owner-convergence-r3-20260910
  pull_request:
    paths:
      - 'acs/version2_release_app.py'
      - 'acs/version2_release_ui.py'
      - 'tests/test_w6_v2_language_owner_current.py'
      - '.github/workflows/w6-v2-language-owner-current.yml'

permissions:
  contents: read

concurrency:
  group: w6-v2-language-current-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-owner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Bind language owner or prove integrated runtime regression scope
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD

          # Once the language owner has been integrated, later canonical runtime
          # merges must keep running the regression suite instead of pretending
          # every descendant HEAD is the original two-parent owner intake.
          if git cat-file -e "$base:.github/workflows/w6-v2-language-owner-current.yml" 2>/dev/null; then
            git cat-file -e "$base:acs/version2_release_app.py"
            git cat-file -e "$base:acs/version2_release_ui.py"
            git cat-file -e "$base:tests/test_w6_v2_language_owner_current.py"
            echo 'LANGUAGE_GATE_MODE=integrated-regression'
            echo "LANGUAGE_PRODUCT_PARENT=$base"
            exit 0
          fi

          # First integration of this owner remains fail-closed and bounded to
          # the exact four owner paths, preserving the original provenance gate.
          parent_line="$(git rev-list --parents -n 1 HEAD)"
          test "$(wc -w <<<"$parent_line" | tr -d ' ')" = '3'
          predecessor="$(git rev-parse HEAD^2)"
          git cat-file -e "$predecessor:.github/workflows/w6-v2-language-owner-current.yml"
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/w6-v2-language-owner-current.yml' \
            'acs/version2_release_app.py' \
            'acs/version2_release_ui.py' \
            'tests/test_w6_v2_language_owner_current.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$base" HEAD -- \
            acs/version2_application.py \
            acs/settings.py \
            acs/chesscore.py \
            acs/gametree.py \
            acs/pgn_document.py \
            acs/pgn_service.py \
            acs/pgn_workspace.py \
            acs/acsdb.py \
            web \
            tools/qa \
            run_accessible_chess.py \
            run_accessible_chess_v2.py
          echo 'LANGUAGE_GATE_MODE=owner-intake'
          echo "LANGUAGE_PRODUCT_PARENT=$base"
          echo "LANGUAGE_PREDECESSOR=$predecessor"

      - name: Compile current language owner and release composition
        run: python -m compileall -q acs tests/test_w6_v2_language_owner_current.py

      - name: Current persisted-language owner regressions
        run: python -m unittest -v tests.test_w6_v2_language_owner_current

      - name: Existing V2 release and UI-thread contracts
        run: >-
          python -m unittest -v
          tests.test_version2_release_app
          tests.test_version2_release_ui
          tests.test_version2_api_thread_dispatch
          tests.test_version2_application
          tests.test_version2_windows_composition_profile
          tests.test_full_product_native_menu
          tests.test_version2_release_accessibility_contract

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Stage 1 and Version 2 automated diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
