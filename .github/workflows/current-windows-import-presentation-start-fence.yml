name: Current Windows Import Presentation Start Fence

on:
  push:
    branches:
      - fix/windows-import-presentation-start-fence-20261006-hy6ez0h
  pull_request:
    branches:
      - fix/windows-import-ui-transactional-delivery-20261006-hy6ez0h
    paths:
      - acs/version2_application.py
      - tests/test_version2_application.py
      - .github/workflows/current-windows-import-presentation-start-fence.yml

permissions:
  contents: read

concurrency:
  group: current-windows-import-presentation-fence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 5e297d050016dc0e360b28a77fec28f644c2d7d4
  PARENT_BRANCH: fix/windows-import-ui-transactional-delivery-20261006-hy6ez0h
  EXPECTED_APPLICATION_SOURCE_BLOB: 8810992452a24c8951935858da62b64670370185
  EXPECTED_APPLICATION_TEST_BLOB: 9c85b805937a2c8351b2eeec993f4218d8ada360
  EXPECTED_MAILBOX_SOURCE_BLOB: 7228b28e3db3c8a9375bd4bafcdafcf190cb87f1

jobs:
  presentation-start-fence:
    name: Import presentation start fence / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact presentation-fence child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/presentation-fence-parent"
          live_parent="$(git rev-parse refs/remotes/origin/presentation-fence-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "IMPORT_PRESENTATION_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-import-presentation-start-fence.yml"
            "acs/version2_application.py"
            "tests/test_version2_application.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_application.py)" = "$EXPECTED_APPLICATION_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$EXPECTED_APPLICATION_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_import_event_mailbox.py)" = "$EXPECTED_MAILBOX_SOURCE_BLOB"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile presentation fence and inherited UI transaction
        run: >-
          python -m py_compile
          acs/version2_application.py
          acs/version2_windows_import_event_mailbox.py
          acs/version2_windows_file_workflows.py
          tests/test_version2_application.py
          tests/test_v2_windows_import_event_mailbox.py

      - name: Run application, mailbox and native file regressions
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_nvda_file_workflows
