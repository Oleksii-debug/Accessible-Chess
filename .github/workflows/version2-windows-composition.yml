name: Accessible Chess Version 2 Windows Composition

on:
  push:
    branches:
      - work/version2-windows-composition-20260828
  pull_request:
    paths:
      - 'run_accessible_chess_v2.py'
      - 'acs/version2_profile.py'
      - 'acs/version2_application.py'
      - 'acs/version2_pgn_commands.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_release_ui.py'
      - 'acs/version2_windows_*.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_native_menu.py'
      - 'acs/library_webview_projection.py'
      - 'web/version2_release_bootstrap.js'
      - 'tests/test_version2_*.py'
      - 'tests/test_v2_windows_*.py'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - 'tests/js/version2_library_open_route_refresh_dom_test.js'
      - '.github/workflows/version2-windows-composition.yml'

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-windows-composition-${{ github.ref }}
  cancel-in-progress: true

env:
  V2_FORMATS_UPSTREAM: b18ac89bb7f1ef3d4106517fe3521179ab4522a1
  V2_ACCEPTED_STAGE1_BOOTSTRAP_BLOB: bced41192feb068a71ed0789be5629164a37e6c9

jobs:
  composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove Version 2 ancestry and convergence-safe isolation
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git cat-file -e "$V2_FORMATS_UPSTREAM^{commit}"
          git merge-base --is-ancestor "$V2_FORMATS_UPSTREAM" HEAD

          scope_base="$V2_FORMATS_UPSTREAM"
          if [ -n "$PR_BASE_REF" ]; then
            remote_base="refs/remotes/origin/$PR_BASE_REF"
            if ! git show-ref --verify --quiet "$remote_base"; then
              echo "Current pull-request base ref is unavailable: $remote_base" >&2
              exit 1
            fi
            scope_base="$(git rev-parse "$remote_base")"
          fi
          git cat-file -e "$scope_base^{commit}"
          git merge-base --is-ancestor "$scope_base" HEAD
          git diff --check "$scope_base" HEAD

          actual_stage1_bootstrap_blob="$(git rev-parse HEAD:web/stage1_release_bootstrap.js)"
          if [ "$actual_stage1_bootstrap_blob" != "$V2_ACCEPTED_STAGE1_BOOTSTRAP_BLOB" ]; then
            echo "Unexpected Stage 1 bootstrap blob: $actual_stage1_bootstrap_blob" >&2
            exit 1
          fi

          changed="$(git diff --name-only "$scope_base" HEAD | sort)"
          unapproved_changed="$(printf '%s\n' "$changed" | grep -v '^web/stage1_release_bootstrap\.js$' || true)"
          if printf '%s\n' "$unapproved_changed" | grep -E '(^|/)(stage1|tools/qa/|windows-stage1|release_preflight)'; then
            echo 'Stage 1 or strict-release contamination detected' >&2
            exit 1
          fi
          git diff --quiet "$scope_base" HEAD -- \
            run_accessible_chess.py acs/release_app.py \
            acs/stage1_release_ui.py acs/stage1_release_ui_core.py \
            acs/chesscore.py acs/gametree.py acs/pgn_document.py \
            acs/pgn_service.py acs/pgn_workspace.py \
            web/stage1_board_actions.js \
            tools/qa

      - name: Compile Python package
        run: python -m compileall -q acs tests run_accessible_chess.py run_accessible_chess_v2.py

      - name: Parse and execute retained Version 2 web surfaces
        run: |
          node --check web/full_product_pgn.js
          node --check web/full_product_library.js
          node --check web/full_product_books_training.js
          node --check web/version2_release_bootstrap.js
          node tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/version2_library_open_route_refresh_dom_test.js

      - name: Version 2 release host contracts
        run: >-
          python -m unittest -v
          tests.test_version2_release_app
          tests.test_version2_release_ui
          tests.test_version2_application
          tests.test_version2_shutdown
          tests.test_version2_pgn_commands
          tests.test_version2_import_terminal_ui
          tests.test_v2_windows_library_import_observer
          tests.test_w3_windows_file_action_ui_thread_affinity

      - name: Version 2 composition and accessibility contracts
        run: >-
          python -m unittest -v
          tests.test_version2_windows_composition_profile
          tests.test_version2_release_accessibility_contract
          tests.test_dev1_full_product_accessible_shell
          tests.test_dev1_full_product_webview_adapter
          tests.test_full_product_native_menu
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_library_workspace_ui_integration
          tests.test_books_training_ui_integration
          tests.test_version2_formats_integration
          tests.test_nvda_p0_contract

      - name: Version 2 data migration and atomicity regressions
        run: >-
          python -m unittest -v
          tests.test_whole_product_user_journey
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_import_service
          tests.test_d07_library_search_cancellation
          tests.test_pgn_concurrent_save
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_export_path_security

      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee v2-composition-unittest.log

      - name: Upload unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-composition-unittest-${{ matrix.os }}
          path: v2-composition-unittest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Stage 1 and Version 2 automated diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
