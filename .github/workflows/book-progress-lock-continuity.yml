name: Book Progress Lock Continuity

on:
  push:
    branches:
      - fix/book-progress-lock-continuity-20261004
  pull_request:
    branches:
      - fix/book-progress-cleanup-quarantine-20261004
    paths:
      - 'acs/book_progress_store.py'
      - 'tests/test_v2_book_progress_store.py'
      - '.github/workflows/book-progress-lock-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-progress-lock-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and Book-progress lock scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='069c233d1d7703f0755aa17b42482e736c4cea6a'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/book-progress-cleanup-quarantine-20261004'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/book-progress-lock-continuity.yml'             'acs/book_progress_store.py'             'tests/test_v2_book_progress_store.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "ce56aacd3f83346f72a64a03b2be9323b4aa617b"
          test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "05bbe93e8c8d3b855868fb879745ab707f05ce30"

          echo 'BOOK_PROGRESS_LOCK_CONTINUITY_SCOPE=PASS'

      - name: Compile Book-progress surfaces
        run: >-
          python -m compileall -q
          acs/book_progress_store.py
          tests/test_v2_book_progress_store.py

      - name: Book-progress lock and persistence regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
