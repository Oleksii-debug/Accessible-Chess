name: Group Rotation Current Apex

on:
  push:
    branches:
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - acs/child_coaching_rotation.py
      - acs/child_coaching_rotation_store.py
      - acs/classroom_pairing.py
      - acs/version2_final_product_application.py
      - acs/version2_release_app.py
      - tests/test_child_coaching_rotation.py
      - tests/test_version2_group_rotation_binding.py
      - tests/test_child_coaching_final_product_binding.py
      - tests/test_child_coaching_rotation_completed_recovery.py
      - .github/workflows/group-rotation-current-apex.yml
  pull_request:
    paths:
      - acs/child_coaching_rotation.py
      - acs/child_coaching_rotation_store.py
      - acs/classroom_pairing.py
      - acs/version2_final_product_application.py
      - acs/version2_release_app.py
      - tests/test_child_coaching_rotation.py
      - tests/test_version2_group_rotation_binding.py
      - tests/test_child_coaching_final_product_binding.py
      - tests/test_child_coaching_rotation_completed_recovery.py
      - .github/workflows/group-rotation-current-apex.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: group-rotation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  group-rotation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ROTATION_BLOB: 6db594aa3ab21b637588142a9c9e86ff3c9dd63c
      ROTATION_STORE_BLOB: 3b4bae55c8403f0fe4c5f79e677769888a82fb45
      ROTATION_TEST_BLOB: ac547c5c6eec732e5cb1a64ca7f29ed835bfafe1
      ROTATION_RECOVERY_TEST_BLOB: 5a3233b611cca861de497d3e7692560f7d9b449e
      PAIRING_BLOB: fee36f2029759d0c948c58cd3ca37ac20bbb0be4
      FINAL_PRODUCT_APP_BLOB: b692b4c2dde003a45b71feedd7b5a5fa9fcd5cc9
      RELEASE_APP_BLOB: 1681a1e913ae1200b02a63278a60b2e121d42f18
      GROUP_ROTATION_BINDING_TEST_BLOB: 6b5737a615af3a5f70944b9ba8fe492201623f71
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Prove exact rotation and pairing authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            git cat-file -e "${EVENT_BASE_SHA}^{commit}"
            test "$(git rev-parse "${EVENT_BASE_SHA}:acs/classroom_pairing.py")" = "$(git hash-object acs/classroom_pairing.py)"
          else
            test "$(git hash-object acs/classroom_pairing.py)" = "$PAIRING_BLOB"
          fi
          test "$(git hash-object acs/child_coaching_rotation.py)" = "$ROTATION_BLOB"
          test "$(git hash-object acs/child_coaching_rotation_store.py)" = "$ROTATION_STORE_BLOB"
          test "$(git hash-object tests/test_child_coaching_rotation.py)" = "$ROTATION_TEST_BLOB"
          test "$(git hash-object tests/test_child_coaching_rotation_completed_recovery.py)" = "$ROTATION_RECOVERY_TEST_BLOB"
          test "$(git hash-object acs/version2_final_product_application.py)" = "$FINAL_PRODUCT_APP_BLOB"
          test "$(git hash-object acs/version2_release_app.py)" = "$RELEASE_APP_BLOB"
          test "$(git hash-object tests/test_version2_group_rotation_binding.py)" = "$GROUP_ROTATION_BINDING_TEST_BLOB"
          git diff --check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile rotation composition
        run: >-
          python -m py_compile
          acs/child_coaching_rotation.py
          acs/child_coaching_rotation_store.py
          acs/classroom_pairing.py
          acs/version2_final_product_application.py
          acs/version2_release_app.py
          tests/test_child_coaching_rotation.py
          tests/test_version2_group_rotation_binding.py
          tests/test_child_coaching_final_product_binding.py
          tests/test_child_coaching_rotation_completed_recovery.py

      - name: Run rotation, pairing and adjacent contracts
        run: >-
          python -m unittest -v
          tests.test_version2_group_rotation_binding
          tests.test_child_coaching_rotation
          tests.test_child_coaching_rotation_completed_recovery
          tests.test_classroom_pairing
          tests.test_version2_classroom_orchestration_binding
          tests.test_child_coaching_final_product_binding
          tests.test_version2_teacher_session_runtime_binding

      - name: Run core selftest
        run: python -m acs.selftest
