name: Current Product Windows Evidence Convergence

on:
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-windows-evidence-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact live convergence
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCT_REF: converge/current-product-books-provider-20261005-ooxple7
          PRODUCT_HEAD: 08e7641854a45b1435ea87eb461d10472058dc20
          ONECLICK_REF: fix/p0-oneclick-exact-head-concurrency-20261005-sol56r9k2
          ONECLICK_HEAD: 53123231abc76265e52b7d62832c9fb94adc0012
          LAUNCH_REPORT_REF: fix/portable-launch-report-ci-head-20261005-sol56h4q8
          LAUNCH_REPORT_HEAD: b108580b91a2917543b80379a88aa1d9accb7c38
          CONVERGENCE_MERGE: 5a02ace57c693c893007f4509a93ad15001f0c77
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.ref }}" = "$PRODUCT_REF"
            git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
            live_pr="$(git rev-parse FETCH_HEAD)"
            test "$live_pr" = "$EXPECTED_HEAD" || {
              printf 'WINDOWS_EVIDENCE_SUPERSEDED event=%s live=%s\n' "$EXPECTED_HEAD" "$live_pr" >&2
              exit 1
            }
          fi

          fetch_exact() {
            ref="$1"; expected="$2"; label="$3"
            git fetch --no-tags origin "refs/heads/$ref"
            live="$(git rev-parse FETCH_HEAD)"
            test "$live" = "$expected" || {
              printf '%s_MOVED expected=%s live=%s\n' "$label" "$expected" "$live" >&2
              exit 1
            }
          }
          fetch_exact "$PRODUCT_REF" "$PRODUCT_HEAD" WINDOWS_EVIDENCE_PRODUCT
          fetch_exact "$ONECLICK_REF" "$ONECLICK_HEAD" WINDOWS_EVIDENCE_ONECLICK
          fetch_exact "$LAUNCH_REPORT_REF" "$LAUNCH_REPORT_HEAD" WINDOWS_EVIDENCE_LAUNCH_REPORT

          test "$(git show -s --format=%P "$CONVERGENCE_MERGE")" = "$PRODUCT_HEAD $ONECLICK_HEAD $LAUNCH_REPORT_HEAD"
          git merge-base --is-ancestor "$CONVERGENCE_MERGE" HEAD
          for source in "$PRODUCT_HEAD" "$ONECLICK_HEAD" "$LAUNCH_REPORT_HEAD"; do
            git merge-base --is-ancestor "$source" HEAD
          done

          changed="$(git diff --name-only "$PRODUCT_HEAD"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\\n' \
            '.github/workflows/current-product-windows-evidence-convergence.yml' \\
            '.github/workflows/p0-user-oneclick-portable-launcher.yml' \\
            '.github/workflows/portable-launch-report-reparse-safety.yml' \\
            'tests/test_current_product_windows_evidence_convergence_20261005.py' \\
            'tests/test_p0_oneclick_exact_head_concurrency.py' \\
            'tests/test_portable_launch_report_reparse_concurrency.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected Windows-evidence scope:\n%s\n' "$changed" >&2
            exit 1
          }
          git diff --check "$PRODUCT_HEAD"...HEAD
          test "$(git rev-parse HEAD:.github/workflows/p0-user-oneclick-portable-launcher.yml)" = '177807102f539f9159123f259fd0888270f5f389'
          test "$(git rev-parse HEAD:tests/test_p0_oneclick_exact_head_concurrency.py)" = '78a6c86bea7c0c997fc37bc33ddc71062b2862ad'
          test "$(git rev-parse HEAD:tests/test_portable_launch_report_reparse_concurrency.py)" = '9cbdd5e2273a37c3e4ae62f1d80666af4cc53ca7'
          test "$(git rev-parse HEAD:acs/report_paths.py)" = 'fafc8696a846a1b9c96a8ce89a76ce82593fd582'
          echo 'CURRENT_PRODUCT_WINDOWS_EVIDENCE_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile evidence contracts
        run: >-
          python -m compileall -q
          tests/test_p0_oneclick_exact_head_concurrency.py
          tests/test_portable_launch_report_reparse_concurrency.py
          tests/test_current_product_windows_evidence_convergence_20261005.py

      - name: Execute packaging evidence regressions
        run: >-
          python -m unittest -v
          tests.test_current_product_windows_evidence_convergence_20261005
          tests.test_p0_oneclick_exact_head_concurrency
          tests.test_portable_launch_report_reparse_concurrency
          tests.test_report_paths
          tests.test_portable_launcher_contract
          tests.test_portable_launcher_core_guard
          tests.test_portable_launcher_window_readiness
          tests.test_portable_localappdata_persistence_binding
          tests.test_version2_portable_package

      - name: Whole-product smoke
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
