name: V2 Upgrade Atomic Bytes Current

on:
  push:
    branches:
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - 'acs/version2_upgrade_base.py'
      - 'tests/test_v2_upgrade_atomic_bytes_current.py'
      - 'tests/test_v2_upgrade_generated_artifact_authentication.py'
      - '.github/workflows/v2-upgrade-atomic-bytes-current.yml'
  pull_request:
    paths:
      - 'acs/version2_upgrade_base.py'
      - 'tests/test_v2_upgrade_atomic_bytes_current.py'
      - 'tests/test_v2_upgrade_generated_artifact_authentication.py'
      - '.github/workflows/v2-upgrade-atomic-bytes-current.yml'

permissions:
  contents: read

concurrency:
  group: v2-upgrade-atomic-bytes-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atomic-publication:
    name: atomic-publication (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile atomic upgrade surfaces
        run: python -m compileall -q acs/version2_upgrade_base.py tests/test_v2_upgrade_atomic_bytes_current.py tests/test_v2_upgrade_generated_artifact_authentication.py
      - name: Verify atomic journal publication and recovery authentication
        run: python -m unittest -v tests.test_v2_upgrade_atomic_bytes_current tests.test_v2_upgrade_generated_artifact_authentication
