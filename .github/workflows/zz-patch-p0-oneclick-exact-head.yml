name: TEMP Patch P0 One-Click Exact Head

on:
  push:
    branches:
      - fix/p0-oneclick-exact-head-concurrency-20261005-sol56r9k2
    paths:
      - '.github/workflows/zz-patch-p0-oneclick-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/p0-oneclick-exact-head-concurrency-20261005-sol56r9k2
          fetch-depth: 0

      - name: Apply exact fail-closed workflow patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/p0-user-oneclick-portable-launcher.yml')
          text = path.read_text(encoding='utf-8')

          old_group = '  group: p0-user-oneclick-portable-launcher-${{ github.ref }}\n'
          new_group = (
              '  group: p0-user-oneclick-portable-launcher-'
              '${{ github.event.pull_request.number || github.ref }}-'
              '${{ github.event.pull_request.head.sha || github.sha }}\n'
          )
          assert text.count(old_group) == 1, 'unexpected concurrency authority'
          text = text.replace(old_group, new_group, 1)

          watched = "      - 'tests/test_version2_portable_package.py'\n"
          contract = "      - 'tests/test_p0_oneclick_exact_head_concurrency.py'\n"
          assert text.count(watched) == 2, 'unexpected trigger geometry'
          assert contract not in text, 'contract path already present'
          text = text.replace(watched, watched + contract)

          setup = """      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
"""
          guard = """      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $eventSha = '${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve live pull-request head' }
          $liveSha = (git rev-parse FETCH_HEAD).Trim()
          if ($liveSha -ne $eventSha) {
            throw "P0_ONECLICK_SUPERSEDED event=$eventSha live=$liveSha"
          }
          Write-Host 'P0_ONECLICK_EXACT_HEAD=PASS'

"""
          assert text.count(setup) == 1, 'unexpected setup anchor'
          assert 'Reject superseded pull-request candidate' not in text, 'guard already present'
          text = text.replace(setup, guard + setup, 1)

          old_tests = (
              'python -m unittest tests.test_portable_launcher_contract '
              'tests.test_portable_launcher_window_readiness '
              'tests.test_portable_localappdata_persistence_binding '
              'tests.test_webview_safe_server tests.test_version2_portable_package -v'
          )
          new_tests = old_tests.replace(
              ' tests.test_version2_portable_package -v',
              ' tests.test_version2_portable_package tests.test_p0_oneclick_exact_head_concurrency -v',
          )
          assert text.count(old_tests) == 1, 'unexpected focused test command'
          text = text.replace(old_tests, new_tests, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove focused contract locally
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_p0_oneclick_exact_head_concurrency -v
          git diff --check

      - name: Publish clean two-file candidate
        shell: bash
        env:
          BRANCH: fix/p0-oneclick-exact-head-concurrency-20261005-sol56r9k2
        run: |
          set -euo pipefail
          git config user.name 'Accessible Chess autonomous implementer'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/p0-user-oneclick-portable-launcher.yml tests/test_p0_oneclick_exact_head_concurrency.py
          git rm .github/workflows/zz-patch-p0-oneclick-exact-head.yml
          git diff --cached --check
          git commit -m 'ci: bind one-click qualification to exact candidate'
          git push origin "HEAD:${BRANCH}"
