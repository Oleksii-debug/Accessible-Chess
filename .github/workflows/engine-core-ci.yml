name: Engine Core CI

on:
  push:
    branches:
      - dev/stage1-engine-core-0.4.0
    paths:
      - 'acs/**'
      - 'tests/test_history.py'
      - 'tests/test_analysis_service.py'
      - 'tests/test_keybindings.py'
      - 'source_snapshot_parts/**'
      - '.github/workflows/engine-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore direct chess core from committed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f acs/chesscore.py ]; then
            cat source_snapshot_parts/part*.b64 | base64 --decode > "$RUNNER_TEMP/stage1-source.zip"
            mkdir -p "$RUNNER_TEMP/stage1-source"
            unzip -q "$RUNNER_TEMP/stage1-source.zip" -d "$RUNNER_TEMP/stage1-source"
            CHESSCORE="$(find "$RUNNER_TEMP/stage1-source" -type f -path '*/acs/chesscore.py' -print -quit)"
            if [ -z "$CHESSCORE" ]; then
              echo 'Committed source snapshot does not contain acs/chesscore.py' >&2
              exit 1
            fi
            cp "$CHESSCORE" acs/chesscore.py
          fi

      - name: Compile core modules
        run: python -m compileall -q acs

      - name: Keybinding registry tests
        run: python -m unittest -v tests.test_keybindings

      - name: Non-destructive history tests
        run: python -m unittest -v tests.test_history

      - name: Stale-safe analysis service tests
        run: python -m unittest -v tests.test_analysis_service

      - name: Chess legal-move and special-rule diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from acs.chesscore import Board

          board = Board()
          assert len(board.legal_moves()) == 20, 'initial position must have 20 legal moves'
          for san in ('e4', 'e5', 'Nf3', 'Nc6'):
              board.push_text(san)
          assert board.turn == 'w'
          Board(board.fen())

          board = Board()
          board.push_text('e4')
          board.push_text('d5')
          assert board.push_text('exd5') == 'exd5'

          promotion = Board('4k3/P7/8/8/8/8/8/4K3 w - - 0 1')
          assert promotion.push_text('a8=Q+') == 'a8=Q+'
          print('CHESS CORE DIAGNOSTIC PASS')
          PY

      - name: Stage 1 core selftest
        run: python -m acs.selftest
