name: Books Training Exact Payload Dict

on:
  push:
    branches:
      - fix/books-training-exact-payload-dict-20261003
  pull_request:
    branches:
      - fix/books-v2-exact-scalar-boundaries-20261003
    paths:
      - 'acs/book_webview_bridge.py'
      - 'acs/training_webview_bridge.py'
      - 'tests/test_dev1_books_training_webview_bridge.py'
      - '.github/workflows/books-training-exact-payload-dict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-training-exact-payload-dict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact stacked parent and owned payload scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='6edd00dce67b65876a6bf37a5cf7b6415a9d675b'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/books-v2-exact-scalar-boundaries-20261003'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/books-training-exact-payload-dict.yml'             'acs/book_webview_bridge.py'             'acs/training_webview_bridge.py'             'tests/test_dev1_books_training_webview_bridge.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/book_webview_bridge.py)" = "247b7d4bbd2d9e0e7d7fc6a89c5cef45e63e65e7"
          test "$(git rev-parse HEAD:acs/training_webview_bridge.py)" = "c3e6e52873f2ec1e2d5bdbc70d227a402963405b"
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_bridge.py)" = "485147fbcfd3a52705b611df4ad315c46d4e54bf"

          echo 'BOOKS_TRAINING_EXACT_PAYLOAD_SCOPE=PASS'

      - name: Compile bridge surfaces
        run: >-
          python -m compileall -q
          acs/book_webview_bridge.py
          acs/training_webview_bridge.py
          tests/test_dev1_books_training_webview_bridge.py

      - name: Bridge and adjacent projection/application regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_bridge
          tests.test_dev1_books_training_webview_projection
          tests.test_version2_application
          tests.test_v2_book_training_route_rollback

      - name: Core selftest
        run: python -m acs.selftest
