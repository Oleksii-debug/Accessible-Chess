name: Stage1 Core UI Language

on:
  pull_request:
    branches:
      - fix/current-engine-game-dialog-language-20261004-zftrkmo
    paths:
      - 'web/index.html'
      - 'tests/js/stage1_core_language_test.js'
      - '.github/workflows/stage1-core-ui-language.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-core-ui-language-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            base_ref="fix/current-engine-game-dialog-language-20261004-zftrkmo"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/stage1-core-ui-language.yml' \
            'tests/js/stage1_core_language_test.js' \
            'web/index.html' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Stage1 core-language scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Execute shipping core language contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/js/stage1_core_language_test.js
          node tests/js/stage1_core_language_test.js

      - name: Retain adjacent Stage1 language and accessibility contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/js/stage1_engine_game_dialog_language_test.js
          node tests/js/stage1_action_failure_language_test.js
          node tests/js/stage1_terminal_keymap_dom_test.js
          node tests/js/stage1_board_rerender_keymap_integration_test.js

      - name: Execute current WebUI and NVDA machine regressions
        run: >-
          python -m unittest -v
          tests.test_accessible_webui
          tests.test_stage1_engine_play_ui
          tests.test_stage1_board_action_integration
          tests.test_v2_remapped_keyboard_routing
          tests.test_nvda_p0_contract

      - name: Core selftest
        run: python -m acs.selftest
