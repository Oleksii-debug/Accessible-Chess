name: Section 1 PositionState Counter Boundary

on:
  pull_request:
    branches:
      - 'converge/fen-history-section1-20261007-sol56a1'
    paths:
      - '.github/workflows/section1-positionstate-counter-boundary.yml'
      - 'acs/position_editor.py'
      - 'tests/test_section1_positionstate_counter_boundary.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section1-positionstate-counter-boundary-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_BASE_SHA: 5d22793c9908831b144b3c62394424f8231738fe
  POSITION_EDITOR_BLOB: ec28fca72bbe766c4bafc73eefcda719abe75c28
  COUNTER_TEST_BLOB: ad6b0c0dbbe0e5d3cf47bb534a29d4d6a2925061
  INPUT_LIMITS_BLOB: f06a74bc4d6e3e7f7461bb5dac1fd7f25776ec7a

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact child geometry
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "${EVENT_BASE_REF}" = "converge/fen-history-section1-20261007-sol56a1"
          test "${EVENT_BASE_SHA}" = "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/section1-positionstate-counter-boundary.yml' \
            'acs/position_editor.py' \
            'tests/test_section1_positionstate_counter_boundary.py' | sort)"
          test "$changed" = "$expected"

      - name: Bind exact PositionState authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/position_editor.py)" = "$POSITION_EDITOR_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_positionstate_counter_boundary.py)" = "$COUNTER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/input_limits.py)" = "$INPUT_LIMITS_BLOB"

      - name: Compile Section 1.4 slice
        run: >-
          python -m py_compile
          acs/position_editor.py
          tests/test_section1_positionstate_counter_boundary.py

      - name: Execute Position interchange regressions
        run: >-
          python -m unittest -v
          tests.test_section1_positionstate_counter_boundary
          tests.test_position_editor
          tests.test_fen_input_budget_current
          tests.test_fen_position_editor_complete_user_flow
          tests.test_position_text_authority

      - name: Core chess selftest
        run: python -m acs.selftest
