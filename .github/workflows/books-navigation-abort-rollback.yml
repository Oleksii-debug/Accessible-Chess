name: Books Return Invalidation Atomicity

on:
  push:
    branches:
      - fix/books-return-reader-rollback-20261006-ooxple7
  pull_request:
    branches:
      - converge/current-books-persistence-apex-20261006-zftrkmo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-return-invalidation-atomicity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  return-invalidation-atomicity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      BASE_BRANCH: converge/current-books-persistence-apex-20261006-zftrkmo
      BASE_SHA: b0cb38cad9630cc92dcb848e6bcaf2abfd2ba474
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact Books apex and bounded delta
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi
          git fetch --no-tags origin             "+refs/heads/$BASE_BRANCH:refs/remotes/origin/books-apex-parent"
          live_base="$(git rev-parse refs/remotes/origin/books-apex-parent)"
          test "$live_base" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/books-navigation-abort-rollback.yml"
            "acs/book_board_workflow.py"
            "tests/test_v2_book_board_workflow.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

      - name: Compile Books return boundary
        run: >-
          python -m py_compile
          acs/book_board_workflow.py
          tests/test_v2_book_board_workflow.py

      - name: Execute Book Board and route regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_board_workflow
          tests.test_book_board_route_ownership
          tests.test_version2_application
          tests.test_dev1_books_training_webview_bridge
          tests.test_book_engine_authority_passive_ingress

      - name: Pytest focused Return rollback
        run: >-
          pytest -q
          tests/test_v2_book_board_workflow.py
          tests/test_book_board_route_ownership.py

      - name: Core selftest
        run: python -m acs.selftest
