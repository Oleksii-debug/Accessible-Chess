name: Stage1 Settings Persistence Rollback

on:
  pull_request:
    branches:
      - work/final-stage1-source-composition-20260825
    paths:
      - acs/settings.py
      - tests/test_settings.py
      - tests/test_stage1_release_composition_ui.py
      - .github/workflows/stage1-settings-persist-rollback.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-settings-rollback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 040f089e336433c83d64a761656c17065a67f843
  SOUND_WINDOWS_BLOB: 7ec0d7f5b339f74833a5ec4601c714390eb21829
  SOUND_RUNTIME_BLOB: c2b850ef66d19631d1579b815b7ee0aaef64c650
  RELEASE_APP_BLOB: d8aa77d3073c8169395ab5bed0b9f7766c429307
  STAGE1_UI_BLOB: 16e78af6219c8c36f0c4026942ef1d02875a370a
  STAGE1_UI_CORE_BLOB: b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6
  RELEASE_PREFLIGHT_BLOB: 485c876d6476f2b86d3155be3db355084db6094c
  STOCKFISH_RUNTIME_BLOB: 23477698de93e7ecb582e9411a3bfacc0976849c
  STAGE1_BOOTSTRAP_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  INDEX_HTML_BLOB: 17803443a815843be3aa1b8c6be1c5abb7e7c888

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact Product head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve repository LF bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git -c core.autocrlf=false checkout HEAD -- .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest

      - name: Prove exact ancestry, narrow scope, and retained release-critical blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          test "$(git rev-parse HEAD:acs/sound_windows.py)" = "$SOUND_WINDOWS_BLOB"
          test "$(git rev-parse HEAD:acs/sound_runtime.py)" = "$SOUND_RUNTIME_BLOB"
          test "$(git rev-parse HEAD:acs/release_app.py)" = "$RELEASE_APP_BLOB"
          test "$(git rev-parse HEAD:acs/stage1_release_ui.py)" = "$STAGE1_UI_BLOB"
          test "$(git rev-parse HEAD:acs/stage1_release_ui_core.py)" = "$STAGE1_UI_CORE_BLOB"
          test "$(git rev-parse HEAD:acs/release_preflight.py)" = "$RELEASE_PREFLIGHT_BLOB"
          test "$(git rev-parse HEAD:acs/stockfish_runtime.py)" = "$STOCKFISH_RUNTIME_BLOB"
          test "$(git rev-parse HEAD:web/stage1_release_bootstrap.js)" = "$STAGE1_BOOTSTRAP_BLOB"
          test "$(git rev-parse HEAD:web/index.html)" = "$INDEX_HTML_BLOB"
          changed="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/stage1-settings-persist-rollback.yml'             'acs/settings.py'             'tests/test_settings.py'             'tests/test_stage1_release_composition_ui.py' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          if printf '%s\n' "$changed" | grep -E '(^|/)(acsdb|chessbase|bookdocument|bookreader|book_index|training|teacher|classroom|remote_lesson)([^/]*)(/|\.|$)' ; then
            echo 'Stage2 contamination detected' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict' ; then
            echo 'QA strict harness contamination detected' >&2
            exit 1
          fi

      - name: Compile and parse retained release JavaScript
        run: |
          python -m compileall -q acs tests run_accessible_chess.py
          node --check web/stage1_release_bootstrap.js
          node --check web/stage1_board_actions.js

      - name: Focused settings and release-composition regressions
        run: >-
          python -m unittest -v
          tests.test_settings
          tests.test_sound_runtime
          tests.test_stage1_release_composition_ui
          tests.test_issue22_release_contract
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_webview_safe_server

      - name: Stage1 security and runtime regression set
        run: >-
          python -m unittest -v
          tests.test_d01_submit_focus_route_contract
          tests.test_dev2_history_scalar_fail_closed
          tests.test_d03_stockfish_hard_shutdown
          tests.test_d04_release_preflight_hygiene
          tests.test_d04_release_archive_canonicality
          tests.test_d04_stockfish_source_zip_bounds
          tests.test_final_master_release_json_canonicality
          tests.test_stage1_stockfish_runtime_path_privacy
          tests.test_stockfish_runtime
          tests.test_stage1_core_full_flow

      - name: Full repository regression
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q tests

      - name: Canonical SELFTEST
        run: python -m acs.selftest

      - name: Complete Stage1 diagnostic
        run: python run_accessible_chess.py --diagnostic
