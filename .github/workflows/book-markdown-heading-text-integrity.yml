name: Books Markdown Text Integrity

on:
  pull_request:
    branches:
      - integration/nullmove-bookindex-apex-20261004-sol6p3
    paths:
      - 'acs/book_text_import.py'
      - 'tests/test_v2_book_text_import.py'
      - '.github/workflows/book-markdown-heading-text-integrity.yml'
      - '.github/workflows/v2-markdown-semantic-lists-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-markdown-text-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-heading-text-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact checkout and live stacked-parent ownership
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref }}"
            event_base='${{ github.event.pull_request.base.sha }}'
          else
            base_ref='integration/nullmove-bookindex-apex-20261004-sol6p3'
            event_base=''
          fi
          git fetch --no-tags origin \
            "refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "$event_base" ]; then
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_base"
          fi
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git merge-base --is-ancestor '31c11b996c6aa38560d84496275ed61d77a1f766' HEAD
          git diff --check "$live_base" HEAD

          changed="$(git diff --name-only "$live_base"...HEAD | LC_ALL=C sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/book-markdown-heading-text-integrity.yml' \
            '.github/workflows/v2-markdown-semantic-lists-convergence.yml' \
            'acs/book_text_import.py' \
            'tests/test_v2_book_text_import.py' | LC_ALL=C sort)"
          test "$changed" = "$wanted"
          echo 'BOOK_MARKDOWN_HEADING_SCOPE=PASS'

      - name: Compile changed Books surface
        run: python -m py_compile acs/book_text_import.py tests/test_v2_book_text_import.py

      - name: Focused Books and canonical chess regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_text_import
          tests.test_v2_markdown_semantic_lists
          tests.test_v2_book_game_content
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_book_progress_store
          tests.test_gametree
          tests.test_d06_pgn_roundtrip

      - name: Product selftest
        run: python -m acs.selftest
