name: Update Security Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/update_security.py'
      - 'tests/test_update_security.py'
      - '.github/workflows/update-security-contract.yml'
  push:
    paths:
      - 'acs/update_security.py'
      - 'tests/test_update_security.py'
      - '.github/workflows/update-security-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile update-security source
        run: python -m py_compile acs/update_security.py
      - name: Run update-security contract
        run: python -m unittest -v tests.test_update_security
