name: PGN Save Snapshot Transaction

on:
  push:
    branches:
      - work/pgn-save-snapshot-commit-20261005-sol56k4r9
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-snapshot-transaction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BASE_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact Product ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" HEAD)"
          test "$merge_base" = "$BASE_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/pgn-save-snapshot-transaction.yml"
            "acs/pgn_save_snapshot.py"
            "tests/test_pgn_save_snapshot.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

      - name: Compile transaction boundary
        run: python -m py_compile acs/pgn_save_snapshot.py tests/test_pgn_save_snapshot.py

      - name: Execute snapshot transaction regressions
        run: python -m unittest -v tests.test_pgn_save_snapshot

      - name: Retain canonical PGN document regressions
        run: python -m unittest -v tests.test_pgn_document

      - name: Core selftest
        run: python -m acs.selftest
