name: Post-freeze V2 Windows Package Qualification

on:
  push:
    branches:
      - work/post-freeze-v2-windows-package-qualification-20260911
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-freeze-v2-windows-package-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PREVIOUS_CANDIDATE_SHA: 1ff8f58f024ab89c976d73ae93a180fbefbec934
  PYTHON_VERSION: '3.12.10'
  PYWEBVIEW_VERSION: '6.2.1'
  PYTHONNET_VERSION: '3.1.0'
  CLR_LOADER_VERSION: '0.3.1'
  CFFI_VERSION: '2.1.1'
  PYCPARSER_VERSION: '3.0'
  TYPING_EXTENSIONS_VERSION: '4.16.0'
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_VERSION: '4.1.0'
  ZSTANDARD_VERSION: '0.25.0'
  QA_WRAPPER_COMMIT: bf4a4c1c71860c90d1b086ea4f91fa34b665cb81
  QA_BASELINE_COMMIT: 0549391267073f9d006ec8271af148fe17edcdb6
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip
  STOCKFISH_SHA256: 40cc975817e7eee270b03f354810d20956df565420d320f6dd37d454dc81a139

jobs:
  qualify-package:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - name: Checkout exact package qualification child
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Bind package identity to exact current Product and prior package lineage
        shell: bash
        run: |
          set -euo pipefail
          parent_line="$(git rev-list --parents -n 1 HEAD)"
          test "$(wc -w <<<"$parent_line" | tr -d ' ')" = '3'
          product_parent="$(git rev-parse HEAD^1)"
          previous_candidate="$(git rev-parse HEAD^2)"
          test "$previous_candidate" = "$EXPECTED_PREVIOUS_CANDIDATE_SHA"
          short="${product_parent:0:7}"
          echo "PRODUCT_PARENT=$product_parent" >> "$GITHUB_ENV"
          echo "SOURCE_INTEGRATION_SHA=$product_parent" >> "$GITHUB_ENV"
          echo "CANDIDATE_FILE=Accessible-Chess-V2-${short}-post-freeze-package-qualification.zip" >> "$GITHUB_ENV"
          echo "CANDIDATE_PRODUCT_SHA=$product_parent"
          echo "PREVIOUS_PACKAGE_CANDIDATE_SHA=$previous_candidate"
          echo 'PRODUCT_SOURCE_MUTATION=NONE'

      - name: Prove workflow-only delta and package authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PRODUCT_PARENT" HEAD)" = "$PRODUCT_PARENT"
          test "$(git merge-base "$EXPECTED_PREVIOUS_CANDIDATE_SHA" HEAD)" = "$EXPECTED_PREVIOUS_CANDIDATE_SHA"
          changed="$(git diff --name-only "$PRODUCT_PARENT" HEAD)"
          test "$changed" = '.github/workflows/post-freeze-v2-windows-package-qualification.yml'
          git diff --check "$PRODUCT_PARENT" HEAD
          if git cat-file -e "$PRODUCT_PARENT:.github/workflows/post-freeze-v2-windows-package-qualification.yml" 2>/dev/null; then
            echo 'PACKAGE_WORKFLOW_ALREADY_PRESENT_IN_PRODUCT_PARENT' >&2
            exit 1
          fi
          test -f acs/version2_release_payload.py
          test -f acs/version2_package_assembler.py
          test -f acs/version2_package_preflight.py
          test -f run_accessible_chess_v2.py
          echo 'WORKFLOW_ONLY_DELTA=PASS'

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install qualified pinned Windows compiler stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
          python -m pip install --disable-pip-version-check "pywebview==$env:PYWEBVIEW_VERSION" "pythonnet==$env:PYTHONNET_VERSION" "clr-loader==$env:CLR_LOADER_VERSION" "cffi==$env:CFFI_VERSION" "pycparser==$env:PYCPARSER_VERSION" "typing-extensions==$env:TYPING_EXTENSIONS_VERSION" "Nuitka @ $nuitkaUrl" "ordered-set==$env:ORDERED_SET_VERSION" "zstandard==$env:ZSTANDARD_VERSION"
          if($LASTEXITCODE -ne 0){throw 'Pinned Windows runtime/compiler installation failed'}
          @'
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import nuitka

          expected = {
              'pywebview': os.environ['PYWEBVIEW_VERSION'],
              'pythonnet': os.environ['PYTHONNET_VERSION'],
              'clr-loader': os.environ['CLR_LOADER_VERSION'],
              'cffi': os.environ['CFFI_VERSION'],
              'pycparser': os.environ['PYCPARSER_VERSION'],
              'typing_extensions': os.environ['TYPING_EXTENSIONS_VERSION'],
              'ordered-set': os.environ['ORDERED_SET_VERSION'],
              'zstandard': os.environ['ZSTANDARD_VERSION'],
          }
          assert sys.version_info[:3] == (3, 12, 10)
          for distribution, wanted in expected.items():
              resolved = version(distribution)
              print(f'PINNED_RUNTIME_VERSION {distribution}={resolved}')
              assert resolved == wanted, (distribution, resolved, wanted)
          plugin = Path(nuitka.__file__).parent / 'plugins' / 'standard' / 'PyWebViewPlugin.py'
          assert 'webview.platforms.win32' in plugin.read_text(encoding='utf-8')
          print('QUALIFIED_COMPILER_STACK=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Qualified compiler stack verification failed'}

      - name: Materialize immutable strict packaged UIA helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$QA_WRAPPER_COMMIT" "$QA_BASELINE_COMMIT"
          mkdir -p .v2-uia-evidence
          git show "$QA_WRAPPER_COMMIT:tools/qa/stage1_packaged_e2e_crossprocess.ps1" > .v2-uia-evidence/stage1_packaged_e2e_crossprocess.ps1
          git show "$QA_WRAPPER_COMMIT:tools/qa/stage1_uia_topology_v5.ps1" > .v2-uia-evidence/stage1_uia_topology_v5.ps1
          git show "$QA_WRAPPER_COMMIT:tools/qa/stage1_uia_topology_classify.py" > .v2-uia-evidence/stage1_uia_topology_classify.py
          test -s .v2-uia-evidence/stage1_packaged_e2e_crossprocess.ps1
          test -s .v2-uia-evidence/stage1_uia_topology_v5.ps1
          test -s .v2-uia-evidence/stage1_uia_topology_classify.py
          echo 'IMMUTABLE_STRICT_PACKAGED_UIA_HELPER=READY'

      - name: Source release diagnostic and retained rollback oracle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python run_accessible_chess_v2.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'SOURCE_V2_DIAGNOSTIC_PRODUCT_FAILURE'}
          python -m unittest -v tests.test_v2_book_training_route_rollback
          if($LASTEXITCODE -ne 0){throw 'BOOK_ROLLBACK_PYTHON_REGRESSION_FAILURE'}
          node --check tests/js/version2_release_bootstrap_dom_test.js
          if($LASTEXITCODE -ne 0){throw 'BOOK_ROLLBACK_HOST_ORACLE_PARSE_FAILURE'}
          node tests/js/version2_release_bootstrap_dom_test.js
          if($LASTEXITCODE -ne 0){throw 'BOOK_ROLLBACK_HOST_PUBLICATION_ORACLE_FAILURE'}
          Write-Host 'SOURCE_V2_DIAGNOSTIC=PASS'
          Write-Host 'BOOK_ROLLBACK_HOST_PUBLICATION_ORACLE=PASS'

      - name: Build standalone AccessibleChess.exe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $report=Join-Path $env:RUNNER_TEMP 'nuitka-compilation-report.xml'
          python -m nuitka --standalone --assume-yes-for-downloads --windows-console-mode=disable --output-filename=AccessibleChess.exe --include-data-dir=web=web "--report=$report" run_accessible_chess_v2.py
          if($LASTEXITCODE -ne 0){throw 'NUITKA_BUILD_TOOLCHAIN_FAILURE'}
          $dist=(Resolve-Path 'run_accessible_chess_v2.dist').Path
          $exe=Join-Path $dist 'AccessibleChess.exe'
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw 'AccessibleChess.exe missing'}
          $leaks=@(Get-ChildItem -LiteralPath $dist -Recurse -File | Where-Object {$_.Extension -in '.py','.pyc','.pyo'})
          if($leaks.Count -ne 0){throw 'RAW_PYTHON_SOURCE_OR_BYTECODE_LEAK'}
          $reports=@(Get-ChildItem -LiteralPath $dist -Recurse -File | Where-Object {$_.Name -match '(?i)(nuitka.*report|compilation[-_ ]?report)'})
          if($reports.Count -ne 0){throw 'COMPILATION_REPORT_LEAK'}
          Write-Host "STANDALONE_EXE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant())"
          Write-Host 'STANDALONE_BUILD=PASS'

      - name: Build deterministic nine-event sound input with provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib
          import json
          import math
          from pathlib import Path
          import struct
          import wave
          from acs.sound_events import SoundEvent

          root = Path('release-inputs/sounds')
          root.mkdir(parents=True, exist_ok=False)
          frequencies = (330, 220, 660, 440, 550, 140, 392, 196, 880)
          files = {}
          provenance = {}
          for event, frequency in zip(SoundEvent, frequencies, strict=True):
              name = f'{event.value}.wav'
              path = root / name
              sample_rate = 22050
              duration = 0.12 if event.value == 'tick' else 0.18
              frames = []
              count = int(sample_rate * duration)
              for index in range(count):
                  envelope = max(0.0, 1.0 - index / count)
                  value = int(9000 * envelope * math.sin(2 * math.pi * frequency * index / sample_rate))
                  frames.append(struct.pack('<h', value))
              with wave.open(str(path), 'wb') as writer:
                  writer.setnchannels(1)
                  writer.setsampwidth(2)
                  writer.setframerate(sample_rate)
                  writer.writeframes(b''.join(frames))
              files[event.value] = name
              provenance[event.value] = {
                  'file': name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'license_id': 'CC0-1.0',
                  'source': f'urn:accessible-chess:generated-tone:v1:{event.value}',
                  'creator': 'Accessible Chess deterministic tone generator',
              }
          (root / 'manifest.json').write_text(
              json.dumps({'schema_version': 1, 'files': files}, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          (root / 'provenance.json').write_text(
              json.dumps({'schema_version': 1, 'events': provenance}, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          expected = {event.value for event in SoundEvent}
          assert set(files) == expected and set(provenance) == expected and len(expected) == 9
          for event in SoundEvent:
              path = root / files[event.value]
              with wave.open(str(path), 'rb') as reader:
                  assert reader.getcomptype() == 'NONE'
                  assert reader.getsampwidth() == 2
                  assert reader.getnframes() > 0
              assert provenance[event.value]['sha256'] == hashlib.sha256(path.read_bytes()).hexdigest()
          print('DETERMINISTIC_SOUND_INPUT_WITH_PROVENANCE=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Sound input generation/provenance failed'}

      - name: Download exact official Stockfish 18 Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path release-inputs | Out-Null
          Invoke-WebRequest -Uri $env:STOCKFISH_URL -OutFile 'release-inputs\stockfish.zip'
          $digest=(Get-FileHash -Algorithm SHA256 -LiteralPath 'release-inputs\stockfish.zip').Hash.ToLowerInvariant()
          if($digest -ne $env:STOCKFISH_SHA256){throw "STOCKFISH_SHA256_MISMATCH $digest"}
          Write-Host "STOCKFISH_RELEASE_SHA256=$digest"

      - name: Prepare canonical payload assemble package and deterministic ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib
          import os
          from pathlib import Path
          from acs.version2_release_payload import prepare_version2_release_payload
          from acs.version2_package_assembler import assemble_version2_package_tree, write_version2_package_zip

          parent = os.environ['PRODUCT_PARENT']
          candidate = os.environ['CANDIDATE_FILE']
          out = Path('candidate-output')
          prepared = prepare_version2_release_payload(
              Path('run_accessible_chess_v2.dist'),
              Path('release-inputs/stockfish.zip'),
              Path('release-inputs/sounds'),
              out / 'prepared',
          )
          assembled = assemble_version2_package_tree(
              prepared.product_dir,
              prepared.notices_dir,
              out / 'package',
              integration_sha=parent,
          )
          primary = out / candidate
          repro = out / (candidate + '.repro.zip')
          first = write_version2_package_zip(
              assembled.package_root,
              primary,
              expected_integration_sha=parent,
          )
          second = write_version2_package_zip(
              assembled.package_root,
              repro,
              expected_integration_sha=parent,
          )
          one = hashlib.sha256(primary.read_bytes()).hexdigest()
          two = hashlib.sha256(repro.read_bytes()).hexdigest()
          if one != two:
              raise SystemExit(f'DETERMINISTIC_ZIP_MISMATCH {one} {two}')
          repro.unlink()
          print(f'CANDIDATE_ZIP={primary}')
          print(f'CANDIDATE_ZIP_SHA256={one}')
          print(f'CANDIDATE_INTEGRATION_SHA={first.integration_sha}')
          print(f'CANDIDATE_FILE_COUNT={len(first.inventory)}')
          print('CANONICAL_PAYLOAD_ASSEMBLER_PREFLIGHT=PASS')
          print('DETERMINISTIC_ZIP_REPRODUCTION=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Canonical V2 candidate assembly failed'}

      - name: Fresh extraction readback packaged diagnostic and engine smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path 'candidate-output' $env:CANDIDATE_FILE
          New-Item -ItemType Directory -Path fresh-extraction | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath fresh-extraction
          @'
          import os
          from pathlib import Path
          from acs.version2_package_preflight import validate_version2_package_tree
          report = validate_version2_package_tree(
              Path('fresh-extraction'),
              expected_integration_sha=os.environ['PRODUCT_PARENT'],
          )
          print(f'FRESH_EXTRACTION_PREFLIGHT_FILES={len(report.inventory)}')
          print('FRESH_EXTRACTION_PREFLIGHT=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Fresh extraction canonical preflight failed'}
          $exe=(Resolve-Path 'fresh-extraction\AccessibleChess\AccessibleChess.exe').Path
          $stdout=Join-Path $env:RUNNER_TEMP 'packaged-v2-diagnostic.stdout.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'packaged-v2-diagnostic.stderr.txt'
          $proc=Start-Process -FilePath $exe -ArgumentList '--diagnostic' -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if(Test-Path $stdout){Get-Content -LiteralPath $stdout | ForEach-Object {Write-Host $_}}
          if(Test-Path $stderr){Get-Content -LiteralPath $stderr | ForEach-Object {Write-Host "STDERR: $_"}}
          if($proc.ExitCode -ne 0){throw "PACKAGED_EXE_DIAGNOSTIC_FAILURE exit=$($proc.ExitCode)"}
          $diag=(Get-Content -LiteralPath $stdout -Raw)
          if($diag -notmatch 'ACCESSIBLE CHESS V2 FINAL-PRODUCT COMPOSITION DIAGNOSTIC PASS'){throw 'PACKAGED_EXE_DIAGNOSTIC_PASS_MARKER_MISSING'}
          $engine=(Resolve-Path 'fresh-extraction\AccessibleChess\engines\stockfish\stockfish.exe').Path
          $engineOutput=(@('uci','isready','quit') | & $engine 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0 -or $engineOutput -notmatch 'uciok' -or $engineOutput -notmatch 'readyok'){throw 'PACKAGED_STOCKFISH_UCI_SMOKE_FAILURE'}
          Write-Host 'PACKAGED_EXE_DIAGNOSTIC=PASS'
          Write-Host 'PACKAGED_STOCKFISH_UCI_SMOKE=PASS'
          Write-Host 'FRESH_EXTRACTION=PASS'

      - name: Prove fresh-extracted packaged keyboard and UIA semantics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--force-renderer-accessibility'
          $productRoot=(Resolve-Path 'fresh-extraction\AccessibleChess').Path
          $exe=(Resolve-Path (Join-Path $productRoot 'AccessibleChess.exe')).Path
          $process=Start-Process -FilePath $exe -WorkingDirectory $productRoot -PassThru
          try {
            $ready=$false
            $lastTopologyError='not attempted'
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            while($watch.ElapsedMilliseconds -lt 45000){
              if($process.HasExited){throw "Fresh-extracted V2 process exited before UIA proof with code $($process.ExitCode)"}
              try {
                Remove-Item -LiteralPath 'uia-topology-report-v5.json' -Force -ErrorAction SilentlyContinue
                & .\.v2-uia-evidence\stage1_uia_topology_v5.ps1 -AppPid $process.Id *> $null
                if(Test-Path -LiteralPath 'uia-topology-report-v5.json'){
                  $probe=Get-Content -LiteralPath 'uia-topology-report-v5.json' -Raw | ConvertFrom-Json
                  $documents=@($probe.nodes | Where-Object {
                    [string]$_.control_type -eq 'ControlType.Document' -and
                    [bool]$_.source_root_connected -and
                    [string]$_.name -eq 'Accessible Chess'
                  })
                  if($documents.Count -gt 0){$ready=$true;break}
                  $lastTopologyError='topology report exists but Accessible Chess Document is not connected yet'
                } else {
                  $lastTopologyError='topology helper returned without a report'
                }
              } catch {
                $lastTopologyError=$_.Exception.Message
              }
              Start-Sleep -Milliseconds 500
            }
            if(-not $ready){throw "Fresh-extracted V2 UIA topology did not become ready within 45 seconds; last=$lastTopologyError"}
            Write-Host 'FRESH_PACKAGED_UIA_TOPOLOGY_READY=PASS'
            & .\.v2-uia-evidence\stage1_packaged_e2e_crossprocess.ps1 -AppPid $process.Id -ProductRoot $productRoot
            if($LASTEXITCODE -ne 0){throw 'Immutable strict packaged UIA helper failed on fresh-extracted candidate'}
            if(-not (Test-Path packaged-uia-strict-summary.json)){throw 'Packaged UIA summary missing'}
            $summary=Get-Content packaged-uia-strict-summary.json -Raw | ConvertFrom-Json
            if([int]$summary.semantic_square_count -ne 64){throw 'Fresh candidate did not expose exactly 64 semantic squares'}
            if([string]$summary.clipboard -ne 'e9'){throw 'Fresh candidate Ctrl+A/Ctrl+C proof did not pass'}
            if(-not [bool]$summary.invalid_e9_fen_unchanged){throw 'Fresh candidate invalid-input atomicity proof did not pass'}
            if(-not [bool]$summary.board_focus_continuity){throw 'Fresh candidate board focus continuity proof did not pass'}
            Write-Host 'FRESH_PACKAGED_UIA_KEYBOARD_64_SQUARE_FOCUS_PROOF=PASS'
          }
          finally {
            $live=Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if($live){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Prove fresh-extracted native MenuBar profile through UIA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--force-renderer-accessibility'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $productRoot=(Resolve-Path 'fresh-extraction\AccessibleChess').Path
          $exe=(Resolve-Path (Join-Path $productRoot 'AccessibleChess.exe')).Path
          $process=Start-Process -FilePath $exe -WorkingDirectory $productRoot -PassThru
          try {
            $ready=$false
            $lastTopologyError='not attempted'
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            while($watch.ElapsedMilliseconds -lt 45000){
              if($process.HasExited){throw "Fresh-extracted V2 process exited before native-menu proof with code $($process.ExitCode)"}
              try {
                Remove-Item -LiteralPath 'uia-topology-report-v5.json' -Force -ErrorAction SilentlyContinue
                & .\.v2-uia-evidence\stage1_uia_topology_v5.ps1 -AppPid $process.Id *> $null
                if(Test-Path -LiteralPath 'uia-topology-report-v5.json'){
                  $probe=Get-Content -LiteralPath 'uia-topology-report-v5.json' -Raw | ConvertFrom-Json
                  $documents=@($probe.nodes | Where-Object {
                    [string]$_.control_type -eq 'ControlType.Document' -and
                    [bool]$_.source_root_connected -and
                    [string]$_.name -eq 'Accessible Chess'
                  })
                  if($documents.Count -gt 0){$ready=$true;break}
                  $lastTopologyError='topology report exists but Accessible Chess Document is not connected yet'
                } else {
                  $lastTopologyError='topology helper returned without a report'
                }
              } catch {
                $lastTopologyError=$_.Exception.Message
              }
              Start-Sleep -Milliseconds 500
            }
            if(-not $ready){throw "Fresh-extracted V2 UIA topology did not become ready for native-menu proof within 45 seconds; last=$lastTopologyError"}
            Write-Host 'FRESH_PACKAGED_NATIVE_MENU_TOPOLOGY_READY=PASS'

            $desktop=[System.Windows.Automation.AutomationElement]::RootElement
            $processCondition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty,[int]$process.Id)
            $ownerRoots=@($desktop.FindAll([System.Windows.Automation.TreeScope]::Children,$processCondition))
            if($ownerRoots.Count -lt 1){throw 'Could not resolve any fresh-extracted V2 top-level UIA roots for the launched process'}

            $menuCondition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuBar)
            $bars=@()
            $seenRuntimeIds=@{}
            foreach($ownerRoot in $ownerRoots){
              if([int]$ownerRoot.Current.ProcessId -ne $process.Id){continue}
              foreach($candidate in @($ownerRoot.FindAll([System.Windows.Automation.TreeScope]::Descendants,$menuCondition))){
                if([int]$candidate.Current.ProcessId -ne $process.Id){continue}
                $runtimeId=(@($candidate.GetRuntimeId()) -join '.')
                if(-not $seenRuntimeIds.ContainsKey($runtimeId)){
                  $seenRuntimeIds[$runtimeId]=$true
                  $bars += $candidate
                }
              }
            }
            $productBars=@($bars | Where-Object {[string]$_.Current.AutomationId -eq 'AccessibleChessFullProductMenu'})
            if($productBars.Count -ne 1){
              $seen=@($bars | ForEach-Object {"id='$([string]$_.Current.AutomationId)' name='$([string]$_.Current.Name)' pid=$([int]$_.Current.ProcessId)"}) -join ' | '
              throw "Expected exactly one AccessibleChessFullProductMenu across launched-process UIA roots, found $($productBars.Count); ownerRoots=$($ownerRoots.Count); all=$seen"
            }
            $menu=$productBars[0]
            if([string]$menu.Current.AutomationId -ne 'AccessibleChessFullProductMenu'){throw "Unexpected native MenuBar AutomationId: $([string]$menu.Current.AutomationId)"}
            if([string]$menu.Current.Name -notin @('Application menu','Меню програми')){throw "Unexpected native MenuBar accessible name: $([string]$menu.Current.Name)"}
            if([int]$menu.Current.ProcessId -ne $process.Id){throw 'Native MenuBar is not owned by the launched V2 process'}
            if(-not [bool]$menu.Current.IsEnabled -or [bool]$menu.Current.IsOffscreen){throw 'V2 native MenuBar is disabled or offscreen'}

            $itemCondition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuItem)
            $top=@($menu.FindAll([System.Windows.Automation.TreeScope]::Children,$itemCondition))
            $names=@($top | ForEach-Object {([string]$_.Current.Name).Replace('&','').Trim()})
            $expectedUa=@('Файл','Гра','Позиція','PGN','Бібліотека','Імпорт','Експорт','Stockfish','Аналіз','Книги','Учитель/Клас','Налаштування','Довідка')
            $expectedEn=@('File','Game','Position','PGN','Library','Import','Export','Engine','Analysis','Books','Teacher/Classroom','Settings','Help')
            $actual=($names -join '|')
            $ua=($expectedUa -join '|')
            $en=($expectedEn -join '|')
            if($top.Count -ne 13 -or ($actual -ne $ua -and $actual -ne $en)){
              throw "Packaged V2 native menu profile mismatch: count=$($top.Count) names=$actual"
            }
            foreach($entry in $top){
              if([int]$entry.Current.ProcessId -ne $process.Id){throw "Top native menu item belongs to another process: $([string]$entry.Current.Name)"}
              if(-not [bool]$entry.Current.IsEnabled -or [bool]$entry.Current.IsOffscreen){throw "Top native menu item is disabled/offscreen: $([string]$entry.Current.Name)"}
              try {
                $pattern=$entry.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
                if($null -eq $pattern){throw 'null ExpandCollapsePattern'}
              } catch {
                throw "Top native menu item lacks ExpandCollapsePattern: $([string]$entry.Current.Name)"
              }
            }
            if($names -contains 'Тренування' -or $names -contains 'Training'){
              throw 'Deferred Training menu leaked into the Version 2 native release profile'
            }
            $summary=[ordered]@{
              product_sha=$env:PRODUCT_PARENT
              machine_scope='fresh-extracted Windows UIA native menu structure only'
              menu_bar_count=$productBars.Count
              menu_automation_id=[string]$menu.Current.AutomationId
              menu_name=[string]$menu.Current.Name
              menu_owner_process_matches=$true
              menu_descendant_of_launched_process_root=$true
              launched_process_root_count=$ownerRoots.Count
              menu_visible=$true
              menu_enabled=$true
              top_level_count=$top.Count
              top_level_names=$names
              top_level_all_visible_enabled=$true
              top_level_expand_collapse_pattern=$true
              teacher_classroom_present=$true
              deferred_training_absent=$true
              structural_uia='PASS'
              alt_arrows_enter_esc='HUMAN_ONLY_UNPROVEN'
              nvda_menu_usability='HUMAN_ONLY_UNPROVEN'
              nvda_verified=$false
            }
            $summary|ConvertTo-Json -Depth 5|Set-Content -Encoding UTF8 packaged-v2-current-native-menu-summary.json
            Write-Host "FRESH_PACKAGED_NATIVE_MENUBAR_UIA=PASS names=$actual"
          }
          finally {
            $live=Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if($live){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          }
          $bounded=Get-Content -Raw packaged-v2-current-native-menu-summary.json
          if($bounded -match '(?i)[A-Z]:\\\\|/home/|/Users/|/tmp/'){throw 'Local path leaked into bounded native-menu evidence'}

      - name: Upload post-freeze Windows package qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Accessible-Chess-V2-post-freeze-package-qualification
          path: candidate-output/Accessible-Chess-V2-*-post-freeze-package-qualification.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Download uploaded package artifact for exact readback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Accessible-Chess-V2-post-freeze-package-qualification
          path: artifact-readback

      - name: Verify uploaded artifact byte identity and extracted manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $original=(Resolve-Path (Join-Path 'candidate-output' $env:CANDIDATE_FILE)).Path
          $downloaded=@(Get-ChildItem -LiteralPath artifact-readback -File -Filter '*.zip')
          if($downloaded.Count -ne 1){throw "Expected exactly one downloaded package ZIP, found $($downloaded.Count)"}
          if($downloaded[0].Name -ne $env:CANDIDATE_FILE){throw "Downloaded artifact filename mismatch: $($downloaded[0].Name)"}
          $sourceDigest=(Get-FileHash -Algorithm SHA256 -LiteralPath $original).Hash.ToLowerInvariant()
          $readbackDigest=(Get-FileHash -Algorithm SHA256 -LiteralPath $downloaded[0].FullName).Hash.ToLowerInvariant()
          if($sourceDigest -ne $readbackDigest){throw "ARTIFACT_READBACK_SHA256_MISMATCH source=$sourceDigest readback=$readbackDigest"}
          New-Item -ItemType Directory -Path artifact-readback-extracted | Out-Null
          Expand-Archive -LiteralPath $downloaded[0].FullName -DestinationPath artifact-readback-extracted
          @'
          import os
          from pathlib import Path
          from acs.version2_package_preflight import validate_version2_package_tree
          report = validate_version2_package_tree(
              Path('artifact-readback-extracted'),
              expected_integration_sha=os.environ['PRODUCT_PARENT'],
          )
          print(f'ARTIFACT_READBACK_PREFLIGHT_FILES={len(report.inventory)}')
          print('ARTIFACT_READBACK_PREFLIGHT=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Downloaded artifact canonical preflight failed'}
          Write-Host "ARTIFACT_READBACK_SHA256=$readbackDigest"
          Write-Host 'ARTIFACT_UPLOAD_DOWNLOAD_SHA256_READBACK=PASS'

      - name: Package qualification checkpoint
        shell: pwsh
        run: |
          $zip=Join-Path 'candidate-output' $env:CANDIDATE_FILE
          $digest=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Write-Host "CANDIDATE_PRODUCT_SHA=$env:PRODUCT_PARENT"
          Write-Host "CANDIDATE_ZIP_SHA256=$digest"
          Write-Host 'VERSION2_WINDOWS_ZIP=YES'
          Write-Host 'POST_FREEZE_PACKAGE_QUALIFICATION=PASS'
          Write-Host 'FRESH_WINDOWS_PACKAGE=YES'
          Write-Host 'AUTOMATED_UIA_PROOF=PASS'
          Write-Host 'NATIVE_MENUBAR_UIA_PROOF=PASS'
          Write-Host 'ARTIFACT_READBACK=PASS'
          Write-Host 'HUMAN_TESTED=NO'
          Write-Host 'NVDA_VERIFIED=NO'
