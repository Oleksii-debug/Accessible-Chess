name: V2 Library ACSDB Search V4

on:
  push:
    branches:
      - work/v2-library-acsdb-search-v4-20260828
  pull_request:
    paths:
      - 'acs/acsdb.py'
      - 'acs/search_policy.py'
      - 'acs/search_service.py'
      - 'acs/library_import_service.py'
      - 'tests/test_acsdb.py'
      - 'tests/test_d07_acsdb_migration_atomicity.py'
      - 'tests/test_d07_library_import_service.py'
      - 'tests/test_d07_library_import_start_lock.py'
      - 'tests/test_d07_library_import_transaction_ownership.py'
      - 'tests/test_d07_library_search_cancellation.py'
      - 'tests/test_d07_search_semantic_equivalence.py'
      - 'tests/test_d07_search_scalar_equivalence.py'
      - 'tests/test_v2_library_acsdb_search_v4.py'
      - 'tests/test_v2_library_search_service_v4.py'
      - 'tools/v2_library_acsdb_search_v4_benchmark.py'
      - '.github/workflows/v2-library-acsdb-search-v4.yml'

permissions:
  contents: read

concurrency:
  group: v2-library-acsdb-v4-${{ github.ref }}
  cancel-in-progress: true

env:
  STACK_BASE: b18ac89bb7f1ef3d4106517fe3521179ab4522a1

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Ownership ancestry and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STACK_BASE" HEAD
          git diff --check "$STACK_BASE" HEAD
          changed="$(git diff --name-only "$STACK_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-library-acsdb-search-v4.yml' \
            'acs/acsdb.py' \
            'acs/search_service.py' \
            'tests/test_d07_library_import_service.py' \
            'tests/test_v2_library_acsdb_search_v4.py' \
            'tests/test_v2_library_search_service_v4.py' \
            'tools/v2_library_acsdb_search_v4_benchmark.py' | sort)"
          test "$changed" = "$expected"
          if printf '%s\n' "$changed" | grep -E 'teacher|classroom|education|chessbase_decoder|gametree.py|pgn_'; then
            echo 'Out-of-lane or parser/chess-core contamination detected' >&2
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q acs tests tools run_accessible_chess.py
      - name: Focused ACSDB v4 and inherited D07 regressions
        run: >-
          python -m unittest -v
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_search_service_v4
          tests.test_acsdb
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

  performance-100k:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 100k measured Unicode/literal search evidence
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tools/v2_library_acsdb_search_v4_benchmark.py --games 100000 --repeats 5 | tee v2-acsdb-v4-100k.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-acsdb-v4-100k-evidence
          path: v2-acsdb-v4-100k.json
          if-no-files-found: error
          retention-days: 7
