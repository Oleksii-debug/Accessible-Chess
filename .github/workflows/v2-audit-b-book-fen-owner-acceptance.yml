name: V2 Audit-B Book FEN Owner Repair Acceptance

on:
  push:
    branches:
      - audit/v2-book-fen-owner-repair-acceptance-20260831
  pull_request:
    paths:
      - 'tests/test_v2_audit_b_book_fen_owner_acceptance.py'
      - '.github/workflows/v2-audit-b-book-fen-owner-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: v2-audit-b-book-fen-owner-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      OWNER_HEAD: 7407d541fefdb971fce21c3b1f02bdcc0186e970
      BOOKDOCUMENT_BLOB: 42bac4a78bf9148f725cc1f7e638ee0dfc3e4343
      CHESSCORE_BLOB: eb9229b5ee107afe06cdf8a916f466e1474dddd4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact owner head and evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$OWNER_HEAD" HEAD)" = "$OWNER_HEAD"
          git diff --check "$OWNER_HEAD" HEAD
          changed="$(git diff --name-only "$OWNER_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-audit-b-book-fen-owner-acceptance.yml' \
            'tests/test_v2_audit_b_book_fen_owner_acceptance.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/bookdocument.py)" = "$BOOKDOCUMENT_BLOB"
          test "$(git rev-parse HEAD:acs/chesscore.py)" = "$CHESSCORE_BLOB"

      - name: Compile acceptance surface
        run: python -m compileall -q tests/test_v2_audit_b_book_fen_owner_acceptance.py

      - name: Owner and inherited Book/FEN regressions
        run: >-
          python -m unittest -v
          tests.test_v2_accessible_book_core
          tests.test_bookdocument
          tests.test_bookreader
          tests.test_dev2_fen_atomicity
          tests.test_position_editor

      - name: Broad exact-owner Product regressions
        shell: bash
        run: |
          set -euo pipefail
          product_tree="../v2-book-fen-owner-${GITHUB_RUN_ID}-${RUNNER_OS}"
          rm -rf "$product_tree"
          git worktree add --detach "$product_tree" "$OWNER_HEAD"
          cleanup() {
            git worktree remove --force "$product_tree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          (
            cd "$product_tree"
            python -m unittest discover -s tests
            python -m pytest -q tests
            python -m acs.selftest
            python run_accessible_chess.py --diagnostic
          )
          cleanup
          trap - EXIT

      - name: Independent AB-V2-008 closure oracle
        if: ${{ always() }}
        run: python -m unittest -v tests.test_v2_audit_b_book_fen_owner_acceptance
