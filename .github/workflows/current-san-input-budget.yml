name: Current SAN Input Budget

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - "acs/notation.py"
      - "tests/test_notation.py"
      - ".github/workflows/current-san-input-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-san-input-budget-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact bounded child scope
        shell: bash
        env:
          PINNED_PARENT: 167e2e8e4f273277f5b2997ed2b3c70287a16eda
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "${EVENT_BASE_REF:-converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb}" = "converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb"
          git cat-file -e "$PINNED_PARENT^{commit}"
          test "$(git merge-base "$PINNED_PARENT" HEAD)" = "$PINNED_PARENT"
          git diff --check "$PINNED_PARENT"...HEAD
          changed="$(git diff --name-only "$PINNED_PARENT"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-san-input-budget.yml' \
            'acs/notation.py' \
            'tests/test_notation.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected SAN budget scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Bind exact SAN authority bytes
        shell: bash
        env:
          NOTATION_BLOB: 4ce7cca2576d4a20b0fae86aa019719d3609c6e3
          NOTATION_TEST_BLOB: 77c3f12f91d0ca219848bdf263fe33a0c6308ee8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/notation.py)" = "$NOTATION_BLOB"
          test "$(git rev-parse HEAD:tests/test_notation.py)" = "$NOTATION_TEST_BLOB"

      - name: Compile notation slice
        run: python -m py_compile acs/notation.py tests/test_notation.py

      - name: Run SAN regressions and core selftest
        run: |
          python -m unittest -v tests.test_notation
          python -m acs.selftest
