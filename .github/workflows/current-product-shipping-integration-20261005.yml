name: Current Product Shipping Integration 2026-10-05

on:
  pull_request:
    branches:
      - integration/current-product-main-candidate-20261004-c2mbezb
  push:
    branches:
      - integrate/current-product-to-shipping-20261005-sol56f8k2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-shipping-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80

    steps:
      - name: Checkout exact shipping integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact live shipping and Product geometry
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SHIPPING_BRANCH: integration/current-product-main-candidate-20261004-c2mbezb
          PRODUCT_BRANCH: converge/current-product-diagnostic-help-classroom-20261005-sol56m7k2
          PINNED_SHIPPING_SHA: 0a9e0db1663c04cf67fac2d249ba197fa22cde75
          PINNED_PRODUCT_SHA: 59486e2c9eff903e416d59a0e7c349c22ee2111d
          ACCESSIBILITY_GATE: .github/workflows/current-product-accessibility-formats-convergence.yml
          PORTABLE_GATE: .github/workflows/current-product-portable-integration-convergence.yml
          INTEGRATION_WORKFLOW: .github/workflows/current-product-shipping-integration-20261005.yml
          INTEGRATION_TEST: tests/test_current_product_shipping_integration_20261005.py
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          base_ref="${EVENT_BASE_REF:-$SHIPPING_BRANCH}"
          test "$base_ref" = "$SHIPPING_BRANCH"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_shipping="$(git rev-parse "refs/remotes/origin/$base_ref")"
          test "$live_shipping" = "$PINNED_SHIPPING_SHA"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_shipping"
          fi

          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")"
          test "$live_product" = "$PINNED_PRODUCT_SHA"

          git merge-base --is-ancestor "$live_shipping" "$live_product"
          test "$(git merge-base "$live_shipping" "$live_product")" = "$live_shipping"
          git merge-base --is-ancestor "$live_product" HEAD
          test "$(git merge-base "$live_shipping" HEAD)" = "$live_shipping"
          git diff --check "$live_shipping"...HEAD

          product_paths="$(git diff --name-only "$live_shipping"..."$live_product" | sort)"
          test -n "$product_paths"
          product_count="$(printf '%s\n' "$product_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$product_count" -eq 64

          extra_paths="$(git diff --name-only "$live_product"...HEAD | sort)"
          expected_extra="$(printf '%s\n' \
            "$ACCESSIBILITY_GATE" \
            "$PORTABLE_GATE" \
            "$INTEGRATION_WORKFLOW" \
            "$INTEGRATION_TEST" | sort)"
          test "$extra_paths" = "$expected_extra" || {
            printf 'Unexpected integration-only qualification scope.\nExpected:\n%s\nActual:\n%s\n' "$expected_extra" "$extra_paths" >&2
            exit 1
          }

          candidate_paths="$(git diff --name-only "$live_shipping"...HEAD | sort)"
          expected_candidate="$(printf '%s\n%s\n' "$product_paths" "$expected_extra" | sed '/^$/d' | sort -u)"
          test "$candidate_paths" = "$expected_candidate" || {
            printf 'Shipping candidate does not equal Product plus bounded qualification repairs.\nExpected:\n%s\nActual:\n%s\n' "$expected_candidate" "$candidate_paths" >&2
            exit 1
          }
          candidate_count="$(printf '%s\n' "$candidate_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$candidate_count" -eq 66

          echo "CURRENT_PRODUCT_SHIPPING_GEOMETRY=PASS"
          echo "SHIPPING_BASE=$live_shipping"
          echo "PRODUCT_SOURCE=$live_product"
          echo "PRODUCT_PATHS=$product_count"
          echo "QUALIFICATION_DELTA_PATHS=4"
          echo "CANDIDATE_PATHS=$candidate_count"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile current Product integration surfaces
        run: >-
          python -m compileall -q
          acs/bookdocument.py
          acs/bookreader.py
          acs/settings.py
          acs/training_progress_store.py
          acs/version2_package_preflight.py
          acs/version2_portable_package.py
          acs/keybindings.py
          acs/stage1_release_ui.py
          acs/webapp.py
          acs/full_product_actions.py
          acs/book_html_import.py
          acs/book_library_import.py
          acs/book_training.py
          acs/gametree_legality.py
          acs/import_contract.py
          acs/version2_windows_file_workflows.py
          tests/test_current_product_shipping_integration_20261005.py

      - name: Run browser accessibility and keymap contracts
        run: |
          node tests/js/dynamic_keymap_help_test.js
          node tests/js/classroom_surface_dom_test.js
          node tests/js/pgn_remaining_keybindings_test.js

      - name: Run current resource and persistence regressions
        run: >-
          python -m unittest -v
          tests.test_portable_manifest_json_prehash_bounds_current
          tests.test_bookdocument_total_text_budget_current
          tests.test_bookreader_revision_barriers_current
          tests.test_settings_corruption_security
          tests.test_training_progress_json_prehash_bounds_current
          tests.test_version2_package_preflight
          tests.test_version2_portable_package
          tests.test_bookreader
          tests.test_w2_training_progress_crash_recovery
          tests.test_version2_training_current_runtime

      - name: Run current accessibility formats and chess-authority regressions
        run: >-
          python -m unittest -v
          tests.test_keybindings
          tests.test_dynamic_keymap_help_contract
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_unbound_shortcut_capture
          tests.test_pgn_tree_remaining_keybindings
          tests.test_book_html_inline_image_order
          tests.test_book_html_pgn_loss_accounting
          tests.test_book_library_import_journey
          tests.test_book_training_variant_authority
          tests.test_pgn_board_start_authority
          tests.test_full_product_book_command_authority

      - name: Run shipping integration qualification contracts
        run: >-
          python -m unittest -v
          tests.test_current_product_shipping_integration_20261005
          tests.test_current_main_full_product_convergence_workflow
          tests.test_p0_release_critical_triad_convergence
          tests.test_version2_application

      - name: Run current V2 diagnostic and core selftest
        run: |
          python run_accessible_chess_v2.py --diagnostic
          python -m acs.selftest
