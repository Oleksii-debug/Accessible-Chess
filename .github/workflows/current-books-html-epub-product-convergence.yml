name: Current Books HTML EPUB Product Convergence

on:
  pull_request:
    branches:
      - converge/markdown-semantic-reading-20261006-c2mbezb112
    paths:
      - '.github/workflows/current-books-html-epub-product-convergence.yml'
      - 'acs/book_html_import.py'
      - 'acs/book_epub_import.py'
      - 'tests/test_book_active_import_cancellation.py'
      - 'tests/test_book_html_runtime_correctness.py'
      - 'tests/test_book_epub_runtime_correctness.py'
      - 'tests/test_v2_book_html_import.py'
      - 'tests/test_v2_book_epub_import.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-books-html-epub-product-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HTML_IMPORT_BLOB: 00add608990e5ed200340c86be7587148140a48a
  EPUB_IMPORT_BLOB: ed09ce0c61d088de0051834e737acff1b7368a17
  ACTIVE_IMPORT_UNION_BLOB: cdb3ef9d0cfe79793bf88472d9389e9ed6dbbeb4
  HTML_RUNTIME_TEST_BLOB: 7faf3fd0f71bf7627c09ae8483fd4cf548061ff1
  EPUB_RUNTIME_TEST_BLOB: 8fab3e9717e2193f5d6cbbaf8a36c68ed18ac3eb
  V2_HTML_TEST_BLOB: 00bfd09f8201d12104901d17b4078179ba8b6ad3
  V2_EPUB_TEST_BLOB: 851299de1bb5727f8c180128485d8a37e4d3c75c

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact geometry and union authorities
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/markdown-semantic-reading-20261006-c2mbezb112}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-books-html-epub-product-convergence.yml' \
            'acs/book_epub_import.py' \
            'acs/book_html_import.py' \
            'tests/test_book_active_import_cancellation.py' \
            'tests/test_book_epub_runtime_correctness.py' \
            'tests/test_book_html_runtime_correctness.py' \
            'tests/test_v2_book_epub_import.py' \
            'tests/test_v2_book_html_import.py' | sort)"
          test "$changed" = "$expected_paths"
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = "$HTML_IMPORT_BLOB"
          test "$(git rev-parse HEAD:acs/book_epub_import.py)" = "$EPUB_IMPORT_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_active_import_cancellation.py)" = "$ACTIVE_IMPORT_UNION_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_html_runtime_correctness.py)" = "$HTML_RUNTIME_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_epub_runtime_correctness.py)" = "$EPUB_RUNTIME_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_html_import.py)" = "$V2_HTML_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_epub_import.py)" = "$V2_EPUB_TEST_BLOB"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged importer and regression surfaces
        run: >-
          python -m compileall -q
          acs/book_html_import.py
          acs/book_epub_import.py
          tests/test_book_active_import_cancellation.py
          tests/test_book_html_runtime_correctness.py
          tests/test_book_epub_runtime_correctness.py
          tests/test_v2_book_html_import.py
          tests/test_v2_book_epub_import.py

      - name: Execute union and current Books regressions
        run: >-
          python -m unittest -v
          tests.test_book_active_import_cancellation
          tests.test_book_html_runtime_correctness
          tests.test_book_epub_runtime_correctness
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import
          tests.test_bookdocument
          tests.test_bookreader
          tests.test_book_presenter_passive_ingress

      - name: Core selftest
        run: python -m acs.selftest
