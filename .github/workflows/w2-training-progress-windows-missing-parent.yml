name: W2 Training Progress Windows Missing Parent

on:
  push:
    branches:
      - work/w2-training-progress-windows-missing-parent-repair-20260911
  pull_request:
    paths:
      - 'acs/training_progress_store.py'
      - 'acs/version2_training_workspace.py'
      - 'tests/test_w2_training_progress_crash_recovery.py'
      - 'tests/test_training_authority_convergence.py'
      - 'tests/js/v2_remapped_keyboard_native_editing_test.js'
      - '.github/workflows/w2-training-progress-windows-missing-parent.yml'

permissions:
  contents: read

concurrency:
  group: w2-training-progress-windows-missing-parent-${{ github.ref }}
  cancel-in-progress: true

env:
  W2_BASE: 5592f24129573cb85abee0ed7a5261e1ce98a855
  W2_FEATURE: fc6f6e6417b7fe505a309bd040202fd342e4c7c7

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove exact isolated scope or lawful convergence ancestry
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git merge-base "$W2_BASE" HEAD)" = "$W2_BASE"
          changed="$(git diff --name-only "$W2_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/w2-training-progress-windows-missing-parent.yml' \
            'acs/training_progress_store.py' \
            'tests/js/v2_remapped_keyboard_native_editing_test.js' \
            'tests/test_w2_training_progress_crash_recovery.py' | sort)"

          if test "$changed" = "$expected"; then
            git diff --check "$W2_BASE" HEAD
            echo "W2_SCOPE=ISOLATED_EXACT"
          else
            # The historical feature is already integrated into modern product
            # ancestry. A descendant PR must be judged against its exact live PR
            # base, not against the original four-file 2026-09 repair diff.
            test "$EVENT_NAME" = "pull_request"
            test -n "$PR_BASE_SHA"
            git merge-base --is-ancestor "$W2_FEATURE" "$PR_BASE_SHA"
            test "$(git merge-base "$W2_FEATURE" "$PR_BASE_SHA")" = "$W2_FEATURE"
            git merge-base --is-ancestor "$PR_BASE_SHA" HEAD
            test "$(git merge-base "$PR_BASE_SHA" HEAD)" = "$PR_BASE_SHA"
            git diff --check "$PR_BASE_SHA" HEAD
            echo "W2_SCOPE=INTEGRATED_CONVERGENCE"
            echo "W2_PR_BASE=$PR_BASE_SHA"
          fi
      - name: Compile storage repair and reconciliation surface
        run: >-
          python -m compileall -q
          acs/training_progress_store.py
          acs/version2_training_workspace.py
          tests/test_w2_training_progress_crash_recovery.py
          tests/test_training_authority_convergence.py
      - name: Training progress crash/restart and first-run oracle
        run: python -m unittest -v tests.test_w2_training_progress_crash_recovery
      - name: Current Training and Books integration regressions
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_d08_training_canonical_resume
          tests.test_d08_book_training_contract
          tests.test_books_training_ui_integration
          tests.test_version2_training_current_runtime
          tests.test_training_authority_convergence
      - name: Native-editing harness survives platform line endings
        run: node tests/js/v2_remapped_keyboard_native_editing_test.js
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: SELFTEST and complete diagnostic
        shell: bash
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
