name: Runtime Dependency Notices

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/runtime_dependency_notices.py'
      - 'acs/runtime_dependency_sbom.py'
      - 'acs/runtime_dependency_release.py'
      - 'tests/test_runtime_dependency_notices.py'
      - 'tests/test_runtime_dependency_sbom.py'
      - 'tests/test_runtime_dependency_release.py'
      - '.github/workflows/runtime-dependency-notices.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-dependency-notices-${{ github.ref }}
  cancel-in-progress: true

env:
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_SDIST_URL: https://files.pythonhosted.org/packages/4c/ca/bfac8bc689799bcca4157e0e0ced07e70ce125193fc2e166d2e685b7e2fe/ordered-set-4.1.0.tar.gz
  ORDERED_SET_SDIST_SHA256: 694a8e44c87657c59292ede72891eb91d34131f6531463aab3009191c77364a8
  ORDERED_SET_LICENSE_MEMBER: ordered-set-4.1.0/MIT-LICENSE
  PROXY_TOOLS_UPSTREAM_COMMIT: db43f1e35d4f90a65c5a4d56d9e9af88212ec6e6
  PROXY_TOOLS_LICENSE_BLOB_SHA1: 078411c7399fbc0454f36cbe8c8cdbaaba7ebc95
  PROXY_TOOLS_SETUP_BLOB_SHA1: 535151fdbc592b63c999d27de54f16905db09eb3
  PROXY_TOOLS_ARCHIVE_URL: https://github.com/jtushman/proxy_tools/archive/db43f1e35d4f90a65c5a4d56d9e9af88212ec6e6.tar.gz

jobs:
  focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile release-evidence boundary
        run: >-
          python -m compileall -q
          acs/runtime_dependency_notices.py
          acs/runtime_dependency_sbom.py
          acs/runtime_dependency_release.py
          tests/test_runtime_dependency_notices.py
          tests/test_runtime_dependency_sbom.py
          tests/test_runtime_dependency_release.py

      - name: Focused fail-closed notice SPDX and publication tests
        run: >-
          python -m unittest -v
          tests.test_runtime_dependency_notices
          tests.test_runtime_dependency_sbom
          tests.test_runtime_dependency_release

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  real-windows-qualified-stack:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install exact current package build and runtime stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
          python -m pip install --disable-pip-version-check `
            pywebview==6.2.1 `
            pythonnet==3.1.0 `
            clr-loader==0.3.1 `
            cffi==2.1.1 `
            pycparser==3.0 `
            typing-extensions==4.16.0 `
            "Nuitka @ $nuitkaUrl" `
            ordered-set==4.1.0 `
            zstandard==0.25.0
          if($LASTEXITCODE -ne 0){throw 'Qualified Windows dependency installation failed'}

      - name: Download exact source artifacts for omitted wheel licenses
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:ORDERED_SET_SDIST_URL -OutFile ordered-set-4.1.0.tar.gz
          $orderedActual=(Get-FileHash -Algorithm SHA256 ordered-set-4.1.0.tar.gz).Hash.ToLowerInvariant()
          if($orderedActual -ne $env:ORDERED_SET_SDIST_SHA256){
            throw "ordered-set source artifact SHA256 mismatch actual=$orderedActual expected=$env:ORDERED_SET_SDIST_SHA256"
          }

          Invoke-WebRequest -Uri $env:PROXY_TOOLS_ARCHIVE_URL -OutFile proxy_tools-upstream.tar.gz
          $proxyArchiveSha=(Get-FileHash -Algorithm SHA256 proxy_tools-upstream.tar.gz).Hash.ToLowerInvariant()
          @'
          import hashlib, os, tarfile
          archive = 'proxy_tools-upstream.tar.gz'
          commit = os.environ['PROXY_TOOLS_UPSTREAM_COMMIT']
          root = f'proxy_tools-{commit}'
          license_member = f'{root}/LICENSE.txt'
          setup_member = f'{root}/setup.py'
          def git_blob_sha(data: bytes) -> str:
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          with tarfile.open(archive, 'r:gz') as package:
              names = set(package.getnames())
              for member in (license_member, setup_member):
                  if member not in names:
                      raise SystemExit(f'proxy_tools immutable upstream member missing: {member!r}')
              license_bytes = package.extractfile(license_member).read()
              setup_bytes = package.extractfile(setup_member).read()
          license_blob = git_blob_sha(license_bytes)
          setup_blob = git_blob_sha(setup_bytes)
          if license_blob != os.environ['PROXY_TOOLS_LICENSE_BLOB_SHA1']:
              raise SystemExit(f'proxy_tools LICENSE git blob mismatch actual={license_blob}')
          if setup_blob != os.environ['PROXY_TOOLS_SETUP_BLOB_SHA1']:
              raise SystemExit(f'proxy_tools setup.py git blob mismatch actual={setup_blob}')
          setup_text = setup_bytes.decode('utf-8')
          if "version='0.1.0'" not in setup_text:
              raise SystemExit('proxy_tools immutable source is not version 0.1.0')
          if "license='MIT'" not in setup_text:
              raise SystemExit('proxy_tools setup metadata license declaration drifted')
          if not license_bytes.startswith(b'The BSD License (BSD)'):
              raise SystemExit('proxy_tools immutable LICENSE text is not the expected BSD notice')
          print(f'PROXY_TOOLS_LICENSE_MEMBER={license_member}')
          print(f'PROXY_TOOLS_LICENSE_BLOB_SHA1={license_blob}')
          print(f'PROXY_TOOLS_SETUP_BLOB_SHA1={setup_blob}')
          print('PROXY_TOOLS_METADATA_VS_LICENSE_TEXT_DISCREPANCY=PRESERVED')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PROXY_TOOLS_LICENSE_MEMBER={license_member}\n')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'proxy_tools immutable upstream provenance proof failed'}
          "PROXY_TOOLS_ARCHIVE_SHA256=$proxyArchiveSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @'
          import os, tarfile
          archive = 'ordered-set-4.1.0.tar.gz'
          member = os.environ['ORDERED_SET_LICENSE_MEMBER']
          with tarfile.open(archive, 'r:gz') as package:
              names = set(package.getnames())
              if member not in names:
                  candidates = sorted(name for name in names if 'licen' in name.casefold() or 'copying' in name.casefold() or 'notice' in name.casefold())
                  raise SystemExit(f'ordered-set exact license member missing: expected={member!r} candidates={candidates!r}')
          print('ORDERED_SET_EXACT_SOURCE_LICENSE_MEMBER=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'ordered-set exact source license member proof failed'}
          Write-Host "ORDERED_SET_SOURCE_ARTIFACT_SHA256=$orderedActual"
          Write-Host "PROXY_TOOLS_IMMUTABLE_UPSTREAM_ARCHIVE_SHA256=$proxyArchiveSha"

      - name: Prove real installed dependency closure notices SPDX and release publication
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from datetime import datetime, timezone
          import json
          import os
          from importlib.metadata import version
          from pathlib import Path
          import subprocess
          from acs.runtime_dependency_notices import (
              ExternalArchiveNoticeSource,
              build_runtime_dependency_notice_bundle,
          )
          from acs.runtime_dependency_release import publish_runtime_dependency_release_evidence

          expected = {
              'pywebview': '6.2.1',
              'pythonnet': '3.1.0',
              'clr-loader': '0.3.1',
              'cffi': '2.1.1',
              'pycparser': '3.0',
              'typing_extensions': '4.16.0',
              'ordered-set': '4.1.0',
              'zstandard': '0.25.0',
              'proxy_tools': '0.1.0',
              'bottle': '0.13.4',
              'Nuitka': version('Nuitka'),
          }
          for distribution, wanted in expected.items():
              actual = version(distribution)
              print(f'QUALIFIED_NOTICE_DISTRIBUTION {distribution}={actual}')
              if actual != wanted:
                  raise SystemExit(f'QUALIFIED_NOTICE_VERSION_DRIFT {distribution} actual={actual} expected={wanted}')

          external = {
              'ordered-set': ExternalArchiveNoticeSource(
                  archive_path=Path('ordered-set-4.1.0.tar.gz'),
                  source_url=os.environ['ORDERED_SET_SDIST_URL'],
                  source_sha256=os.environ['ORDERED_SET_SDIST_SHA256'],
                  member_path=os.environ['ORDERED_SET_LICENSE_MEMBER'],
              ),
              'proxy_tools': ExternalArchiveNoticeSource(
                  archive_path=Path('proxy_tools-upstream.tar.gz'),
                  source_url=os.environ['PROXY_TOOLS_ARCHIVE_URL'],
                  source_sha256=os.environ['PROXY_TOOLS_ARCHIVE_SHA256'],
                  member_path=os.environ['PROXY_TOOLS_LICENSE_MEMBER'],
              ),
          }
          bundle = build_runtime_dependency_notice_bundle(
              tuple(expected),
              Path('real-runtime-notices'),
              expected_versions=expected,
              python_version='3.12.10',
              external_notice_sources=external,
          )
          manifest = json.loads(bundle.manifest_path.read_text(encoding='utf-8'))
          names = {row['distribution'] for row in manifest['distributions']}
          if names != set(expected):
              raise SystemExit(f'QUALIFIED_NOTICE_MANIFEST_INVENTORY_MISMATCH {sorted(names)}')
          if manifest['python']['version'] != '3.12.10':
              raise SystemExit('QUALIFIED_NOTICE_PYTHON_VERSION_MISMATCH')

          ordered = next(item for item in manifest['distributions'] if item['distribution'] == 'ordered-set')
          ordered_notice = ordered['notice_files'][0]
          if ordered_notice.get('source_kind') != 'verified_source_archive':
              raise SystemExit('ordered-set notice source kind mismatch')
          if ordered_notice.get('source_artifact_sha256') != os.environ['ORDERED_SET_SDIST_SHA256']:
              raise SystemExit('ordered-set notice source sha mismatch')
          if ordered_notice.get('source_path') != os.environ['ORDERED_SET_LICENSE_MEMBER']:
              raise SystemExit('ordered-set notice member mismatch')

          proxy = next(item for item in manifest['distributions'] if item['distribution'] == 'proxy_tools')
          proxy_notice = proxy['notice_files'][0]
          if proxy_notice.get('source_kind') != 'verified_source_archive':
              raise SystemExit('proxy_tools notice source kind mismatch')
          if proxy_notice.get('source_artifact_sha256') != os.environ['PROXY_TOOLS_ARCHIVE_SHA256']:
              raise SystemExit('proxy_tools notice source sha mismatch')
          if proxy_notice.get('source_path') != os.environ['PROXY_TOOLS_LICENSE_MEMBER']:
              raise SystemExit('proxy_tools notice member mismatch')
          proxy_notice_bytes = (bundle.root / proxy_notice['packaged_file']).read_bytes()
          if not proxy_notice_bytes.startswith(b'The BSD License (BSD)'):
              raise SystemExit('proxy_tools packaged notice did not preserve immutable upstream BSD text')
          if str(proxy.get('license_metadata') or '').strip().upper() != 'MIT':
              raise SystemExit(f"proxy_tools installed metadata license drifted: {proxy.get('license_metadata')!r}")

          commit_time = subprocess.check_output(
              ['git', 'show', '-s', '--format=%cI', 'HEAD'], text=True
          ).strip()
          try:
              created = datetime.fromisoformat(commit_time).astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          except ValueError as exc:
              raise SystemExit(f'QUALIFIED_NOTICE_COMMIT_TIME_INVALID {commit_time!r}') from exc
          release_notices = Path('release-third-party-notices')
          release_notices.mkdir()
          published = publish_runtime_dependency_release_evidence(
              bundle.root,
              release_notices,
              document_name='Accessible Chess qualified Windows runtime',
              created_utc=created,
          )
          sbom = json.loads(published.sbom_path.read_text(encoding='utf-8'))
          package_names = {row['name'] for row in sbom['packages']}
          if package_names != {'Python', *expected.keys()}:
              raise SystemExit(f'QUALIFIED_SPDX_INVENTORY_MISMATCH {sorted(package_names)}')
          if sbom.get('spdxVersion') != 'SPDX-2.3' or sbom.get('dataLicense') != 'CC0-1.0':
              raise SystemExit('QUALIFIED_SPDX_DOCUMENT_IDENTITY_MISMATCH')
          if not published.manifest_path.is_file() or not published.sbom_path.is_file():
              raise SystemExit('QUALIFIED_RELEASE_NOTICE_PUBLICATION_MISSING')

          if len(bundle.notice_files) < len(expected) + 2:
              raise SystemExit('QUALIFIED_NOTICE_FILE_COUNT_TOO_SMALL')
          print(f'QUALIFIED_RUNTIME_NOTICE_FILES={len(bundle.notice_files)}')
          print(f'QUALIFIED_RUNTIME_SPDX_PACKAGES={len(package_names)}')
          print('ORDERED_SET_EXACT_SOURCE_LICENSE_FALLBACK=PASS')
          print('PROXY_TOOLS_IMMUTABLE_UPSTREAM_LICENSE_FALLBACK=PASS')
          print('PROXY_TOOLS_LICENSE_METADATA_TEXT_DISCREPANCY=PRESERVED')
          print('QUALIFIED_RUNTIME_DEPENDENCY_NOTICES=PASS')
          print('QUALIFIED_RUNTIME_DEPENDENCY_SPDX=PASS')
          print('QUALIFIED_RUNTIME_RELEASE_NOTICE_PUBLICATION=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Real qualified dependency release-evidence proof failed'}

      - name: Upload bounded real notice and release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-runtime-dependency-notices
          path: |
            real-runtime-notices
            release-third-party-notices
          if-no-files-found: warn
          retention-days: 14
