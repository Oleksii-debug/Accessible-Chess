name: Desktop Update Reuse Qualification

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/application_update.py'
      - 'tests/test_application_update_crossrepo.py'
      - 'docs/CROSS_REPO_DESKTOP_UPDATE_REUSE_2026-10-05.md'
      - '.github/workflows/desktop-update-reuse-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-update-reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile update verifier
        run: >-
          python -m py_compile
          acs/application_update.py
          tests/test_application_update_crossrepo.py

      - name: Run update verifier tests
        run: >-
          python -m unittest -v
          tests.test_application_update_crossrepo
