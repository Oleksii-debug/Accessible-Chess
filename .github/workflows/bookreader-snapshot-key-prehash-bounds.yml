name: BookReader Snapshot Scalar Prehash Bounds

on:
  pull_request:
    branches:
      - 'fix/bookreader-nested-snapshot-bounded-freeze-20261003'
    paths:
      - 'acs/bookreader.py'
      - 'tests/test_bookreader.py'
      - '.github/workflows/bookreader-snapshot-key-prehash-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookreader-snapshot-key-prehash-bounds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scalar-prehash-bounds:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='fix/bookreader-nested-snapshot-bounded-freeze-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            live_ref="refs/remotes/origin/$parent_branch"
            git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
            live_parent="$(git rev-parse "$live_ref")"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            git merge-base --is-ancestor "$live_parent" HEAD
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/bookreader-snapshot-key-prehash-bounds.yml' \
              'acs/bookreader.py' \
              'tests/test_bookreader.py' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/bookreader.py)" = "b9167b0f199440e280d5312f4ff04bf5b8c7f03d"
          test "$(git rev-parse HEAD:tests/test_bookreader.py)" = "0a9b857c8f91baa170fffb234d13ce3c9151b1c2"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile BookReader persistence boundary
        run: >-
          python -m compileall -q
          acs/bookreader.py
          tests/test_bookreader.py

      - name: Prove scalar prehash bounds and retained Books recovery flow
        run: >-
          python -m unittest -v
          tests.test_bookreader
          tests.test_v2_book_progress_store
          tests.test_books_progress_backup_recovery_workflow
          tests.test_book_board_progress_failure_exact
          tests.test_version2_book_workspace
