name: V2 Native Dialog Language Current Runtime

on:
  push:
    branches:
      - work/v2-native-dialog-language-20260907
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907
    paths:
      - 'acs/version2_release_app.py'
      - 'acs/version2_windows_host_runtime.py'
      - 'acs/version2_windows_library_export.py'
      - 'acs/version2_windows_native_dialog_ownership.py'
      - 'tests/test_v2_library_export_dialog_language.py'
      - 'tests/test_v2_native_dialog_language.py'
      - '.github/workflows/v2-native-dialog-language.yml'

permissions:
  contents: read

concurrency:
  group: v2-native-dialog-language-current-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-dialog-language:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current-runtime ancestry and bounded native-dialog scope
        shell: bash
        run: |
          set -euo pipefail
          convergence="$(git rev-list --min-parents=2 --max-count=1 HEAD)"
          test -n "$convergence"
          parent_line="$(git rev-list --parents -n 1 "$convergence")"
          test "$(wc -w <<<"$parent_line" | tr -d ' ')" = '3'
          base="$(git rev-parse "$convergence^1")"
          predecessor="$(git rev-parse "$convergence^2")"
          git cat-file -e "$base^{commit}"
          git cat-file -e "$predecessor^{commit}"
          git merge-base --is-ancestor "$convergence" HEAD
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$predecessor" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-native-dialog-language.yml' \
            'acs/version2_release_app.py' \
            'acs/version2_windows_host_runtime.py' \
            'acs/version2_windows_library_export.py' \
            'acs/version2_windows_native_dialog_ownership.py' \
            'tests/test_v2_library_export_dialog_language.py' \
            'tests/test_v2_native_dialog_language.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected current-runtime native-dialog delta:\n%s\n' "$changed" >&2
            exit 1
          }
          git diff --quiet "$base" HEAD -- \
            acs/version2_application.py \
            acs/version2_release_ui.py \
            acs/settings.py \
            acs/chesscore.py \
            acs/gametree.py \
            acs/pgn_document.py \
            acs/pgn_service.py \
            acs/pgn_workspace.py \
            acs/acsdb.py \
            web \
            tools/qa \
            run_accessible_chess.py \
            run_accessible_chess_v2.py
          echo "NATIVE_DIALOG_CONVERGENCE=$convergence"
          echo "NATIVE_DIALOG_PRODUCT_PARENT=$base"
          echo "NATIVE_DIALOG_PREDECESSOR=$predecessor"

      - name: Compile native dialog language convergence
        run: >-
          python -m compileall -q
          acs/version2_release_app.py
          acs/version2_windows_host_runtime.py
          acs/version2_windows_library_export.py
          acs/version2_windows_native_dialog_ownership.py
          tests/test_v2_native_dialog_language.py
          tests/test_v2_library_export_dialog_language.py

      - name: Focused native dialog and language regressions
        run: >-
          python -m unittest -v
          tests.test_v2_native_dialog_language
          tests.test_v2_library_export_dialog_language
          tests.test_v2_windows_native_dialog_ownership
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_pgn_export
          tests.test_v2_windows_library_export
          tests.test_version2_release_app
          tests.test_w6_v2_language_owner_current

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Stage 1 and Version 2 automated diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
