name: Books Durability Navigation Focus Convergence

on:
  pull_request:
    branches:
      - 'fix/v2-release-navigation-schema-focus-20261003'
    paths:
      - '.github/workflows/books-durability-navigation-focus-convergence.yml'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - '.github/workflows/v2-book-progress-production-repair.yml'
      - 'acs/full_product_ui_shell.py'
      - 'acs/training_webview_projection.py'
      - 'acs/version2_application.py'
      - 'tests/js/books_training_surface_dom_test.js'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - 'tests/test_v2_book_training_route_rollback.py'
      - 'tests/test_version2_application.py'
      - 'tests/test_version2_release_accessibility_contract.py'
      - 'web/full_product_books_training.js'
      - 'web/version2_release_bootstrap.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-durability-navigation-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove dual-parent ancestry and exact scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          latest_parent='eb23bdc5ea0e2914a7f742697b20d32edd78a950'
          durability_parent='f31e1f29e9a8a02ed12b85d7516f42f18fd780c2'
          ingress_focus_parent='948c781d50a84efb62780db2180f64893bbbdf55'
          latest_branch='fix/v2-release-navigation-schema-focus-20261003'

          test "$(git rev-parse HEAD)" = "$expected_head"
          git cat-file -e "$latest_parent^{commit}"
          git cat-file -e "$durability_parent^{commit}"
          git cat-file -e "$ingress_focus_parent^{commit}"
          git merge-base --is-ancestor "$latest_parent" HEAD
          git merge-base --is-ancestor "$durability_parent" HEAD
          git merge-base --is-ancestor "$ingress_focus_parent" HEAD

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$latest_branch"
            test '${{ github.event.pull_request.base.sha }}' = "$latest_parent"
          fi

          git diff --check "$latest_parent" HEAD
          changed="$(git diff --name-only "$latest_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/books-durability-navigation-focus-convergence.yml' \
            '.github/workflows/d01-pgn-workspace-webview.yml' \
            '.github/workflows/v2-book-progress-production-repair.yml' \
            'acs/full_product_ui_shell.py' \
            'acs/training_webview_projection.py' \
            'acs/version2_application.py' \
            'tests/js/books_training_surface_dom_test.js' \
            'tests/js/version2_release_bootstrap_dom_test.js' \
            'tests/test_dev1_books_training_webview_projection.py' \
            'tests/test_v2_book_training_route_rollback.py' \
            'tests/test_version2_application.py' \
            'tests/test_version2_release_accessibility_contract.py' \
            'web/full_product_books_training.js' \
            'web/version2_release_bootstrap.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:.github/workflows/d01-pgn-workspace-webview.yml)" = "e739071cf5d8a40f7622559c0fcd598cf4c7c945"
          test "$(git rev-parse HEAD:.github/workflows/v2-book-progress-production-repair.yml)" = "d6e61a22929d5bd5501011438f8482a0bbf7e357"
          test "$(git rev-parse HEAD:acs/full_product_ui_shell.py)" = "7bb116ea0587de51a191560cd39070aac9ead014"
          test "$(git rev-parse HEAD:acs/version2_application.py)" = "cd6fd9ac50cf9603b6018a917dd76f2872f1cdc9"
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = "66bcf463dea9eb70803462f78dbc5f7a3ef37a22"
          test "$(git rev-parse HEAD:tests/test_v2_book_training_route_rollback.py)" = "1e9b0e03c5c81ef187234a748bbd23c2759ad4cb"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "5fb66f636000f397d8ee3f91c658d02c9eee73da"
          test "$(git rev-parse HEAD:tests/test_version2_release_accessibility_contract.py)" = "e82efbfd6c31c0afa78d54e1ce98e42c79c02fd7"
          # Preserve the exact ingress authorities inherited through #1457/#1460.
          test "$(git rev-parse HEAD:acs/book_webview_projection.py)" = "2e9263f2b21f53e28d483ed38fa961956c0d2622"
          test "$(git rev-parse HEAD:acs/book_webview_bridge.py)" = "247b7d4bbd2d9e0e7d7fc6a89c5cef45e63e65e7"
          test "$(git rev-parse HEAD:acs/training_webview_bridge.py)" = "c3e6e52873f2ec1e2d5bdbc70d227a402963405b"
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_projection.py)" = "f64d3bc4c53c7b126977fa7932c19de10e0206b2"
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_bridge.py)" = "485147fbcfd3a52705b611df4ad315c46d4e54bf"
          test "$(git rev-parse HEAD:acs/training_webview_projection.py)" = "1bb879711d72ec7b91a1da2a6139dba20f787a36"
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = "66ee8f2f4f560070fc320079ab7dfdf93a938693"
          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = "2385b9748995f7dfdc97b10bf42ea916bb8ba46e"
          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = "1b21657a191fa0a76cd5fa5306f75600fed34b58"

          echo 'BOOKS_DURABILITY_NAVIGATION_FOCUS_SCOPE=PASS'

      - name: Validate release JavaScript and DOM focus contract
        run: |
          node --check web/version2_release_bootstrap.js
          node --check web/full_product_books_training.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged host and regressions
        run: >-
          python -m compileall -q
          acs/book_webview_bridge.py
          acs/book_webview_projection.py
          acs/full_product_ui_shell.py
          acs/training_webview_bridge.py
          acs/training_webview_projection.py
          acs/version2_application.py
          tests/test_v2_book_training_route_rollback.py
          tests/test_version2_application.py
          tests/test_version2_release_accessibility_contract.py

      - name: Prove Books durability, semantic reading and release focus
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_v2_book_training_route_rollback
          tests.test_version2_release_accessibility_contract
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_bridge
          tests.test_books_semantic_host_bounds
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_v2_book_transaction_current_runtime
          tests.test_v2_book_board_workflow
          tests.test_version2_training_current_runtime
          tests.test_version2_book_board_refresh_focus_order_evidence

      - name: Core selftest
        run: python -m acs.selftest
