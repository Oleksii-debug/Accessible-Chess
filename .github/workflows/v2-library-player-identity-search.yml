name: V2 Library Player Identity Search

on:
  push:
    branches:
      - work/d07-player-identity-normalization-20260907
  pull_request:
    branches:
      - work/v2-library-search-professional-20260831

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-player-identity-${{ github.ref }}
  cancel-in-progress: true

env:
  PARENT_SHA: dda6f015ef8693cb35a9605119265b568760c877

jobs:
  player-identity-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact parent and narrow ownership scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PARENT_SHA" HEAD
          git diff --check "$PARENT_SHA" HEAD
          changed="$(git diff --name-only "$PARENT_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-library-player-identity-search.yml' \
            'acs/acsdb.py' \
            'acs/search_policy.py' \
            'tests/test_v2_library_player_identity_search.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected player-search scope:\n%s\n' "$changed" >&2
            exit 1
          }
          git diff --quiet "$PARENT_SHA" HEAD -- \
            acs/search_service.py acs/library_import_service.py acs/gametree.py \
            acs/chessbase_decoder.py acs/chessbase_metadata.py web tools/qa

      - name: Compile Python
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused canonical player and Library Search regressions
        run: >-
          python -m unittest -v
          tests.test_v2_library_player_identity_search
          tests.test_v2_library_search_service_v4
          tests.test_v2_library_search_professional
          tests.test_d07_library_search_cancellation

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_library_player_identity_search.py
          tests/test_v2_library_search_service_v4.py
          tests/test_v2_library_search_professional.py
          tests/test_d07_library_search_cancellation.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
