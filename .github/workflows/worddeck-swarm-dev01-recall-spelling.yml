name: WordDeck DEV01 Recall Spelling Gate

on:
  push:
    branches:
      - worddeck-swarm-dev01-recall-spelling
  pull_request:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/**'
      - '.github/workflows/worddeck-swarm-dev01-recall-spelling.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: worddeck-dev01-recall-spelling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recall-spelling-gate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Publish pending exact-tip status
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'WordDeck DEV01 Recall Spelling Gate',
              description: 'DEV01 exact-tip Recall/Spelling Windows gate is running.',
              target_url: targetUrl
            });

      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Build Release warnings as errors
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror

      - name: Run complete source-build self-test suite
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Publish self-contained Windows x64
        run: dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-dev01-recall-spelling

      - name: Run published EXE self-test
        shell: pwsh
        run: |
          & .\artifacts\WordDeck-dev01-recall-spelling\WordDeck.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no personal state in publish tree
        shell: pwsh
        run: |
          $bad = Get-ChildItem -LiteralPath '.\artifacts\WordDeck-dev01-recall-spelling' -Recurse -File | Where-Object {
            $_.Name -match '^(state|spelling-state|sentence-state|sentence-coach-state)(\.backup)?\.json$' -or
            $_.Name -match '^WordDeck-profile.*\.json$' -or
            $_.FullName -match '[\\/]Backups[\\/]'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "Personal state leaked into publish tree: $($_.FullName)" }
            exit 1
          }

      - name: Cyrillic and spaces path smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'WordDeck DEV01 перевірка\Published App'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path '.\artifacts\WordDeck-dev01-recall-spelling\*' -Destination $target -Recurse -Force
          & (Join-Path $target 'WordDeck.exe') --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write exact-tip evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.\artifacts\dev01-evidence' | Out-Null
          @(
            "branch=$env:GITHUB_REF_NAME",
            "sha=$env:GITHUB_SHA",
            "corpus=5446",
            "scopes=All,A1,A2,B1,B2,C1",
            "gate=Recall-Spelling migration/shuffle/restart/evidence self-tests"
          ) | Set-Content '.\artifacts\dev01-evidence\source-identity.txt' -Encoding utf8

      - name: Upload DEV01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-dev01-recall-spelling-evidence-${{ github.sha }}
          path: artifacts/dev01-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish final exact-tip status
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'WordDeck DEV01 Recall Spelling Gate',
              description: succeeded ? 'DEV01 Recall/Spelling exact-tip gate passed.' : 'DEV01 Recall/Spelling exact-tip gate failed.',
              target_url: targetUrl
            });
