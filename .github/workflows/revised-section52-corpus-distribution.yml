name: Revised Section 52 Corpus Distribution Gate

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'acs/section52_distribution_qualification.py'
      - 'tests/test_section52_distribution_qualification.py'
      - 'tools/qualify_section52_corpus.py'
      - '.github/workflows/revised-section52-corpus-distribution.yml'
      - 'docs/automation/SECTION52_RELEASE_QUALIFICATION_MATRIX.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-release-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile source and retained package authorities
        run: >-
          python -m py_compile
          acs/section52_distribution_qualification.py
          tools/qualify_section52_corpus.py
          acs/version2_package_assembler.py
          acs/version2_package_preflight.py
          acs/update_security.py
          acs/spdx_sbom.py
      - name: Negative and release-variant contract tests
        run: >-
          python -m unittest -v
          tests.test_section52_distribution_qualification
          tests.test_version2_package_assembler
          tests.test_update_security
          tests.test_spdx_sbom
      - name: CLI wiring smoke
        run: python -m tools.qualify_section52_corpus --help
      - name: Canonical chess core selftest
        run: python -m acs.selftest
