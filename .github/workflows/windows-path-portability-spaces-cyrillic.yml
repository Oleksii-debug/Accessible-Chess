name: Windows Path Portability Spaces Cyrillic

on:
  push:
    branches:
      - qa/windows-path-portability-spaces-cyrillic-20260929
    paths:
      - "tests/test_windows_path_portability_spaces_cyrillic.py"
      - ".github/workflows/windows-path-portability-spaces-cyrillic.yml"
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - "tests/test_windows_path_portability_spaces_cyrillic.py"
      - ".github/workflows/windows-path-portability-spaces-cyrillic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-path-portability-spaces-cyrillic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact Product parent and evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          base="3c69ac281915418574d84c62d928d26db567cd5a"
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$(git merge-base HEAD "$base")" = "$base"
          python - <<'PY'
          import subprocess

          base = "3c69ac281915418574d84c62d928d26db567cd5a"
          expected = {
              ".github/workflows/windows-path-portability-spaces-cyrillic.yml",
              "tests/test_windows_path_portability_spaces_cyrillic.py",
          }
          changed = {
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...HEAD"],
                  text=True,
              ).splitlines()
              if line
          }
          if changed != expected:
              raise SystemExit(
                  f"unexpected scope: {sorted(changed)!r}; expected={sorted(expected)!r}"
              )
          PY
          git diff --check "$base"...HEAD

      - name: Compile path-portability oracle
        run: >-
          python -m py_compile
          tests/test_windows_path_portability_spaces_cyrillic.py

      - name: Run path-portability and owning focused regressions
        run: >-
          python -m unittest -v
          tests.test_windows_path_portability_spaces_cyrillic
          tests.test_settings
          tests.test_pgn_document
          tests.test_d07_library_import_service
          tests.test_d07_library_export_service
          tests.test_v2_book_text_import
          tests.test_version2_epub_application_reachability
          tests.test_v2_book_progress_store
          tests.test_v2_shared_presentation_path_privacy

      - name: Run product selftest and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
