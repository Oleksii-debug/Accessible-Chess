name: Section 42 CC0 source and raster qualification (shipping main)
on:
  pull_request:
    branches: [main]
    paths:
      - 'web/assets/pieces/rhosgfx/**'
      - 'tools/revised_section42_render_piece_pack.py'
      - 'tests/test_revised_section42_raster_qualification.py'
      - '.github/workflows/section42-original-art-main.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  originals:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact licensed originals and corruption/recovery regressions
        run: python -m unittest -v tests.test_revised_section42_raster_qualification
  raster:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install pinned offline raster build dependencies
        run: python -m pip install --only-binary=:all: 'CairoSVG==2.7.1' 'Pillow==11.3.0'
      - name: Render 48 PNG/WebP assets from original 12 verified SVGs
        run: python -m tools.revised_section42_render_piece_pack --output artifacts/section42-rhosgfx
      - name: Audit all physical raster outputs against receipt
        run: |
          python -c "import json,pathlib,hashlib; p=pathlib.Path('artifacts/section42-rhosgfx'); r=json.loads((p/'RASTER_RECEIPT.json').read_text()); assert r['originals']==12 and r['outputs']==48; assert all((p/a['file']).is_file() and hashlib.sha256((p/a['file']).read_bytes()).hexdigest()==a['sha256'] for a in r['assets'])"
      - uses: actions/upload-artifact@v4
        with:
          name: section42-rhosgfx-pinned-png-webp
          path: artifacts/section42-rhosgfx/
          retention-days: 14
          if-no-files-found: error
