name: WordDeck Windows build

on:
  push:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/**'
      - 'README-WORDDECK.md'
      - '.github/workflows/worddeck-windows.yml'
  workflow_dispatch:

concurrency:
  group: worddeck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate development Tatoeba CC0 pair builder
        run: python .\WordDeck\tools\build_tatoeba_cc0_pairs.py --self-test

      - name: Validate sentence coverage and release-bundle tools
        run: |
          python .\WordDeck\tools\resolve_sentence_coverage_gaps.py --self-test
          python .\WordDeck\tools\resolve_sentence_coverage_gaps.py --output .\artifacts\sentence-coverage-gap-records.tsv
          python .\WordDeck\tools\validate_sentencepack_release_bundle.py --self-test

      - name: Validate Oxford 5000 additions translation QA
        run: |
          python .\WordDeck\tools\validate_oxford5000_additions_qa.py --self-test
          python .\WordDeck\tools\validate_oxford5000_additions_qa.py
          python .\WordDeck\tools\validate_oxford5000_second_pass_slice.py --self-test
          python .\WordDeck\tools\validate_oxford5000_second_pass_slice.py --slice .\WordDeck\QA\oxford5000_additions_second_pass_0121_0140.tsv --first 121 --last 140

      - name: Validate British pronunciation and AudioPack QA tools
        run: |
          python .\WordDeck\tools\validate_pronunciation_overrides.py --self-test --emit-ready .\artifacts\pronunciation-regeneration-request.json
          python .\WordDeck\tools\validate_targeted_audio_artifact.py --self-test
          python .\WordDeck\tools\build_audiopack_manifest.py --self-test

      - name: Restore
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Build
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore

      - name: Validate embedded dictionary
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Publish self-contained EXE
        run: dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-win-x64

      - name: Validate published EXE
        shell: pwsh
        run: |
          $process = Start-Process .\artifacts\WordDeck-win-x64\WordDeck.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Published WordDeck self-test failed with exit code $($process.ExitCode)."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-win-x64
          path: .\artifacts\WordDeck-win-x64\WordDeck.exe
          if-no-files-found: error

      - name: Upload sentence coverage gap records
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-sentence-coverage-gap-records
          path: .\artifacts\sentence-coverage-gap-records.tsv
          if-no-files-found: error

      - name: Upload pronunciation regeneration request
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-pronunciation-regeneration-request
          path: .\artifacts\pronunciation-regeneration-request.json
          if-no-files-found: error
