name: D06 GameTree Snapshot Resume

on:
  pull_request:
    paths:
      - 'acs/gametree_resume.py'
      - 'tests/test_d06_gametree_snapshot_resume.py'
      - '.github/workflows/d06-gametree-snapshot-resume.yml'

permissions:
  contents: read

concurrency:
  group: d06-gametree-snapshot-resume-${{ github.ref }}
  cancel-in-progress: true

env:
  D06_RESUME_BASE: a3e52c621210c2dd5251dea4f97b611c12d56a22
  D06_RESUME_BLOB: e22a406a8f4c1f00c3d36390109d53f3088d332b
  D06_REGRESSION_BLOB: 87e54b3d282ba4c2288737d745d2f29f4ae7076b
  D06_SNAPSHOT_BLOB: ac08a89055372c02d3d15744fd4de5a1fd0059d5
  D06_PGN_ROUNDTRIP_BLOB: 13c0db6d44ea9ec769240e9d0087641eb4e4382a
  D06_NAVIGATION_BLOB: 6209c29382105153ae4b22d4d70f9675a931826d

jobs:
  gametree-resume:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove canonical D06 identities without rejecting later runtime convergence
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$D06_RESUME_BASE^{commit}"
          test "$(git merge-base HEAD "$D06_RESUME_BASE")" = "$D06_RESUME_BASE"
          git diff --check "$D06_RESUME_BASE" HEAD -- \
            .github/workflows/d06-gametree-snapshot-resume.yml \
            acs/gametree_resume.py \
            tests/test_d06_gametree_snapshot_resume.py \
            acs/gametree_snapshot.py \
            acs/pgn_roundtrip.py \
            acs/gametree_navigation.py
          test "$(git rev-parse HEAD:acs/gametree_resume.py)" = "$D06_RESUME_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_gametree_snapshot_resume.py)" = "$D06_REGRESSION_BLOB"
          test "$(git rev-parse HEAD:acs/gametree_snapshot.py)" = "$D06_SNAPSHOT_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "$D06_PGN_ROUNDTRIP_BLOB"
          test "$(git rev-parse HEAD:acs/gametree_navigation.py)" = "$D06_NAVIGATION_BLOB"
          echo 'D06 GAMETREE RESUME CURRENT-RUNTIME IDENTITY PASS'

      - name: Compile RED-first regression and Product module when present
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_d06_gametree_snapshot_resume.py
          if test -f acs/gametree_resume.py; then
            python -m py_compile acs/gametree_resume.py
          fi

      - name: RED-first durable resume regression
        run: python -m unittest -v tests.test_d06_gametree_snapshot_resume

      - name: Focused D06 snapshot persistence regressions
        run: >-
          python -m unittest -v
          tests.test_d06_gametree_snapshot_resume
          tests.test_d06_snapshot_canonical_restore
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_d06_pgn_roundtrip
          tests.test_d06_file_ingress_nag_normalization
          tests.test_d06_real_corpus_recovery
          tests.test_game_identity
          tests.test_gametree
          tests.test_pgn_concurrent_save
          tests.test_version2_formats_integration

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
