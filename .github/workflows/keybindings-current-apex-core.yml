name: Keybindings Current Apex Core

on:
  pull_request:
    branches:
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - 'acs/keybindings.py'
      - 'acs/ui_keymap_adapter.py'
      - 'acs/ui_keymap_editor.py'
      - 'acs/ui_keymap_service.py'
      - 'acs/full_product_actions.py'
      - 'tests/test_keybindings_current_apex_reconvergence.py'
      - '.github/workflows/keybindings-current-apex-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current-apex ancestry and bounded core scope
        shell: bash
        run: |
          set -euo pipefail
          apex=39b30d6c39a96f884dde5898605740e8d3a13fe8
          git cat-file -e "$apex^{commit}"
          git merge-base --is-ancestor "$apex" HEAD
          git diff --check "$apex" HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Compile current keybinding core
        run: >-
          python -m py_compile
          acs/keybindings.py
          acs/ui_keymap_adapter.py
          acs/ui_keymap_editor.py
          acs/ui_keymap_service.py
          acs/full_product_actions.py
          tests/test_keybindings_current_apex_reconvergence.py
      - name: Run keybinding and native integration regressions
        run: >-
          python -m unittest -v
          tests.test_keybindings_current_apex_reconvergence
          tests.test_keybindings
          tests.test_ui_keymap_adapter
          tests.test_full_product_native_menu
          tests.test_stage1_board_action_integration
