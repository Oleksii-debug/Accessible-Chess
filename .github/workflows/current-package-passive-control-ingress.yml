name: Current Package Passive Control Ingress

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - ".github/workflows/current-package-passive-control-ingress.yml"
      - "acs/version2_package_preflight.py"
      - "acs/version2_portable_package.py"
      - "acs/version2_package_assembler.py"
      - "acs/version2_release_payload.py"
      - "tests/test_version2_package_preflight.py"
      - "tests/test_version2_portable_package.py"
      - "tests/test_version2_package_assembler.py"
      - "tests/test_version2_release_payload.py"
      - "tests/test_v2_package_required_resources.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-package-passive-control-ingress-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BASE_REF: converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
  PREFLIGHT_BLOB: b77dc0bf6200ba7725e8d4feef0dac8f1e990573
  PORTABLE_BLOB: a474d9698f0e702e206428cb7ec0b206b641ea0d
  ASSEMBLER_BLOB: 81b3ab5c5840eaa01da5b3263b2ab88495083bdb
  RELEASE_PAYLOAD_BLOB: 52d95cd4c9961f7e12e9acb025432124c8485ffd
  PREFLIGHT_TEST_BLOB: 353d0400c37fe3c01f26546d21f32af0e0a9948b
  PORTABLE_TEST_BLOB: 6f2028f526579ee0ccc0351be6dfabe1c4775cd4
  ASSEMBLER_TEST_BLOB: 484497f90b7411d464297075de6fe83b995b3d48
  RELEASE_PAYLOAD_TEST_BLOB: de456e6d3d08d2e215d05971dbf52cc820b1a20b
  REQUIRED_RESOURCES_TEST_BLOB: 9ce6fcce7921325e9f777bc3430f99baa916070c

jobs:
  qualify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove live base, bounded exact child scope and blobs
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
            test "${{ github.event.pull_request.base.ref }}" = "$BASE_REF"
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
            git fetch --no-tags origin "refs/heads/$BASE_REF"
            base_sha="$(git rev-parse FETCH_HEAD)"
          fi
          test -n "$base_sha"
          git cat-file -e "$base_sha^{commit}"
          git merge-base --is-ancestor "$base_sha" HEAD
          test "$(git merge-base "$base_sha" HEAD)" = "$base_sha"
          git diff --check "$base_sha"...HEAD
          mapfile -t changed < <(git diff --name-only "$base_sha"...HEAD | sort)
          allowed_package_paths=(
            ".github/workflows/current-package-passive-control-ingress.yml"
            ".github/workflows/w6-v2-package-assembler.yml"
            ".github/workflows/w6-v2-package-preflight-current-runtime.yml"
            ".github/workflows/w6-v2-release-payload-current-assembler.yml"
            "acs/version2_package_assembler.py"
            "acs/version2_package_preflight.py"
            "acs/version2_portable_package.py"
            "acs/version2_release_payload.py"
            "tests/test_v2_package_required_resources.py"
            "tests/test_version2_package_assembler.py"
            "tests/test_version2_package_pe_identity.py"
            "tests/test_version2_package_preflight.py"
            "tests/test_version2_portable_package.py"
            "tests/test_version2_release_payload.py"
          )
          for path in "${changed[@]}"; do
            case "$path" in
              acs/version2_package_*|acs/version2_portable_package.py|acs/version2_release_payload.py|tests/test_v2_package_required_resources.py|tests/test_version2_package_*|tests/test_version2_portable_package.py|tests/test_version2_release_payload.py|.github/workflows/*package*|.github/workflows/w6-v2-release-payload-current-assembler.yml)
                found=false
                for allowed in "${allowed_package_paths[@]}"; do
                  if [[ "$path" == "$allowed" ]]; then found=true; break; fi
                done
                test "$found" = true || { echo "UNQUALIFIED_PACKAGE_SCOPE $path" >&2; exit 1; }
                ;;
            esac
          done
          test "$(git rev-parse "HEAD:acs/version2_package_preflight.py")" = "$PREFLIGHT_BLOB"
          test "$(git rev-parse "HEAD:acs/version2_portable_package.py")" = "$PORTABLE_BLOB"
          test "$(git rev-parse "HEAD:acs/version2_package_assembler.py")" = "$ASSEMBLER_BLOB"
          test "$(git rev-parse "HEAD:acs/version2_release_payload.py")" = "$RELEASE_PAYLOAD_BLOB"
          test "$(git rev-parse "HEAD:tests/test_version2_package_preflight.py")" = "$PREFLIGHT_TEST_BLOB"
          test "$(git rev-parse "HEAD:tests/test_version2_portable_package.py")" = "$PORTABLE_TEST_BLOB"
          test "$(git rev-parse "HEAD:tests/test_version2_package_assembler.py")" = "$ASSEMBLER_TEST_BLOB"
          test "$(git rev-parse "HEAD:tests/test_version2_release_payload.py")" = "$RELEASE_PAYLOAD_TEST_BLOB"
          test "$(git rev-parse "HEAD:tests/test_v2_package_required_resources.py")" = "$REQUIRED_RESOURCES_TEST_BLOB"

      - name: Compile package authorities and regressions
        shell: bash
        run: |
          python -m py_compile \
            acs/version2_package_preflight.py \
            acs/version2_portable_package.py \
            acs/version2_package_assembler.py \
            acs/version2_release_payload.py \
            tests/test_version2_package_preflight.py \
            tests/test_version2_portable_package.py \
            tests/test_version2_package_assembler.py \
            tests/test_version2_release_payload.py \
            tests/test_v2_package_required_resources.py

      - name: Run focused and adjacent package contracts
        shell: bash
        run: |
          python -m unittest \
            tests.test_version2_package_preflight \
            tests.test_version2_portable_package \
            tests.test_version2_package_assembler \
            tests.test_v2_package_required_resources \
            tests.test_version2_release_payload
