name: W6 V2 Release Payload Current Assembler

on:
  push:
    branches:
      - work/w6-v2-release-payload-current-assembler-20260910-9f3c
  pull_request:
    paths:
      - '.github/workflows/w6-v2-release-payload-current-assembler.yml'
      - 'acs/version2_release_payload.py'
      - 'acs/version2_package_assembler.py'
      - 'acs/version2_package_preflight.py'
      - 'tests/test_version2_release_payload.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/test_v2_package_required_resources.py'

permissions:
  contents: read

concurrency:
  group: w6-v2-release-payload-current-assembler-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_ASSEMBLER_PARENT: 977910b28725ab26ecded690bfb1dcbb7ee25cf9
  CURRENT_ASSEMBLER_BLOB: 5224ed4516fb1a09d9ac6465b6d72d6ff575a229
  CURRENT_PREFLIGHT_BLOB: 4f51c74d295b8bcc0053af81aebfe735ea76b586
  CURRENT_PREFLIGHT_LIVEKIT_BLOB: 2107875f013424c962af9534f75acb45142d3539
  SOURCE_PAYLOAD_OWNER: acd277cafd5ac6f7d312e26dc79105308c6fac0b
  SOURCE_PAYLOAD_BLOB: 05d659e6036ede602b06511cb4d1f796f77440f2
  SOURCE_TEST_BLOB: fdb7ce3ab838606b95bdf5e17d9afa3fd4c8de57
  SOURCE_PAYLOAD_LIVEKIT_BLOB: 86c96549864209d194aa100308ebd6a78b88c93b
  SOURCE_TEST_LIVEKIT_BLOB: 44f03fc561048ef2d09794c8176de2fc27a77ac1
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exact current assembler ancestry and convergence identity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CURRENT_ASSEMBLER_PARENT" HEAD
          git merge-base --is-ancestor "$SOURCE_PAYLOAD_OWNER" HEAD
          git diff --check "$CURRENT_ASSEMBLER_PARENT" HEAD

          changed="$(git diff --name-only "$CURRENT_ASSEMBLER_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/w6-v2-release-payload-current-assembler.yml' \
            'acs/version2_release_payload.py' \
            'tests/test_version2_release_payload.py' | sort)"

          if [ "$changed" = "$expected" ]; then
            echo 'W6_PAYLOAD_TOPOLOGY=LEGACY_BOUNDED_CONVERGENCE'
          else
            # Once the payload/assembler lineage has been composed into the
            # current runtime, later accepted Books/Training/D06/UI changes are
            # expected descendants. Keep this gate fail-closed on the release
            # components themselves instead of requiring the whole runtime to
            # remain byte-identical to the historical assembler parent.
            test "$(git rev-parse HEAD:acs/version2_package_assembler.py)" = "$CURRENT_ASSEMBLER_BLOB"
            preflight_blob="$(git rev-parse HEAD:acs/version2_package_preflight.py)"
            case "$preflight_blob" in
              "$CURRENT_PREFLIGHT_BLOB"|"$CURRENT_PREFLIGHT_LIVEKIT_BLOB") ;;
              *) echo "Unreviewed V2 package-preflight identity: $preflight_blob" >&2; exit 1 ;;
            esac
            echo 'W6_PAYLOAD_TOPOLOGY=CURRENT_RUNTIME_COMPOSITION'
          fi

          payload_blob="$(git rev-parse HEAD:acs/version2_release_payload.py)"
          test_blob="$(git rev-parse HEAD:tests/test_version2_release_payload.py)"
          case "$payload_blob" in
            "$SOURCE_PAYLOAD_BLOB"|"$SOURCE_PAYLOAD_LIVEKIT_BLOB") ;;
            *) echo "Unreviewed V2 release-payload identity: $payload_blob" >&2; exit 1 ;;
          esac
          case "$test_blob" in
            "$SOURCE_TEST_BLOB"|"$SOURCE_TEST_LIVEKIT_BLOB") ;;
            *) echo "Unreviewed V2 release-payload test identity: $test_blob" >&2; exit 1 ;;
          esac
          preflight_blob="$(git rev-parse HEAD:acs/version2_package_preflight.py)"
          if [ "$payload_blob" = "$SOURCE_PAYLOAD_LIVEKIT_BLOB" ]; then
            test "$test_blob" = "$SOURCE_TEST_LIVEKIT_BLOB"
            test "$preflight_blob" = "$CURRENT_PREFLIGHT_LIVEKIT_BLOB"
            echo 'W6_PAYLOAD_IDENTITY=LIVEKIT_PACKAGE_SUCCESSOR'
          else
            test "$test_blob" = "$SOURCE_TEST_BLOB"
            test "$preflight_blob" = "$CURRENT_PREFLIGHT_BLOB"
            echo 'W6_PAYLOAD_IDENTITY=PRE_LIVEKIT_BASELINE'
          fi

      - name: Compile bounded release payload boundary
        run: >-
          python -m compileall -q
          acs/version2_release_payload.py
          tests/test_version2_release_payload.py

      - name: Payload plus current assembler/preflight regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_payload
          tests.test_sound_runtime
          tests.test_stockfish_runtime
          tests.test_version2_package_assembler
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening
          tests.test_v2_package_required_resources

  official-stockfish-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned official Stockfish 18 Windows x86-64 asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output stockfish.zip "$STOCKFISH_URL"
          echo '40cc975817e7eee270b03f354810d20956df565420d320f6dd37d454dc81a139  stockfish.zip' | sha256sum --check --strict
      - name: Verify official archive through Product payload inspector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from acs.version2_release_payload import _inspect_stockfish_archive
          inspected = _inspect_stockfish_archive(Path('stockfish.zip'))
          assert inspected.executable.filename.lower().endswith('.exe')
          assert inspected.source_members
          print('OFFICIAL STOCKFISH 18 ARCHIVE CONTRACT PASS')
          PY

  broad-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pytest
        run: python -m pip install -q pytest==8.4.2
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q
