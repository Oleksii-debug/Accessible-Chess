name: W1 D06 Apply Preflight Repair

on:
  push:
    branches:
      - w1/d06-nested-comment-preflight-convergence-20260907

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact D06 preflight convergence repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('acs/pgn_roundtrip.py')
          text = path.read_text(encoding='utf-8')
          function_start = text.index('def _preflight_text(')
          start_marker = '    inside_brace = False\n    brace_length = 0\n    token_count = [0]\n'
          start = text.index(start_marker, function_start)
          end_marker = '    return normalized\n\n\ndef decode_pgn_bytes'
          end = text.index(end_marker, start)

          replacement = '''    token_count = [0]
              tags_in_game = 0
              seen_movetext = False
              comment_until = 0
              line_start = 0

              for line in normalized.split("\\n"):
                  line_end = line_start + len(line)
                  starts_inside_comment = comment_until > line_start

                  # Match the same header grammar as gametree while outside a
                  # brace-comment span. A line that starts inside recovered
                  # comment text cannot become a tag boundary after its close.
                  if not starts_inside_comment and line.lstrip().startswith("["):
                      match = TAG_RE.match(line)
                      if match is None:
                          raise PgnRoundTripError(
                              "PGN contains a malformed tag-pair line",
                              code=PgnRoundTripErrorCode.MALFORMED_HEADER,
                          )
                      if seen_movetext:
                          tags_in_game = 0
                          seen_movetext = False
                      tags_in_game += 1
                      if tags_in_game > MAX_PGN_TAGS_PER_GAME:
                          _raise_limit(
                              "PGN game contains too many tag pairs",
                              PgnRoundTripErrorCode.TAG_COUNT_LIMIT,
                          )
                      if len(match.group(2)) > MAX_PGN_TAG_VALUE_CHARS:
                          _raise_limit(
                              "PGN tag value exceeds the field safety limit",
                              PgnRoundTripErrorCode.TAG_SIZE_LIMIT,
                          )
                      _claim_token(token_count, source_budget)
                      line_start = line_end + 1
                      continue

                  if line.strip() and not starts_inside_comment:
                      seen_movetext = True

                  token_length = 0

                  def flush_token() -> None:
                      nonlocal token_length
                      if token_length:
                          _claim_token(token_count, source_budget)
                          token_length = 0

                  index = 0
                  if starts_inside_comment:
                      if comment_until > line_end:
                          line_start = line_end + 1
                          continue
                      index = comment_until - line_start
                      comment_until = 0
                      if line[index:].strip():
                          seen_movetext = True

                  while index < len(line):
                      character = line[index]
                      if character == "{":
                          flush_token()
                          span_end, _nested, _unterminated = _scan_brace_comment_span(
                              normalized,
                              line_start + index,
                          )
                          # The canonical recovery tokenizer publishes one
                          # Comment token for this whole shared span. Count that
                          # same unit here instead of interpreting content after
                          # an inner recovered close as movetext.
                          _claim_token(token_count, source_budget)
                          if span_end > line_end:
                              comment_until = span_end
                              break
                          index = span_end - line_start
                          continue
                      if character == ";":
                          flush_token()
                          semicolon_length = len(line) - index - 1
                          if semicolon_length > MAX_PGN_COMMENT_CHARS:
                              _raise_limit(
                                  "PGN semicolon comment exceeds the field safety limit",
                                  PgnRoundTripErrorCode.COMMENT_SIZE_LIMIT,
                              )
                          _claim_token(token_count, source_budget)
                          break
                      if character.isspace():
                          flush_token()
                          index += 1
                          continue
                      if character in "()":
                          flush_token()
                          _claim_token(token_count, source_budget)
                          index += 1
                          continue
                      if character == "[" and token_length == 0:
                          raise PgnRoundTripError(
                              "PGN tag marker appears inside movetext",
                              code=PgnRoundTripErrorCode.MALFORMED_HEADER,
                          )

                      token_length += 1
                      if token_length > MAX_PGN_TOKEN_CHARS:
                          _raise_limit(
                              "PGN token exceeds the lexical safety limit",
                              PgnRoundTripErrorCode.TOKEN_SIZE_LIMIT,
                          )
                      index += 1

                  flush_token()
                  line_start = line_end + 1

          '''
          replacement = '\n'.join(line[4:] if line.startswith('    ') else line for line in replacement.splitlines()) + '\n'
          new_text = text[:start] + replacement + text[end:]
          if new_text == text:
              raise SystemExit('repair produced no change')
          path.write_text(new_text, encoding='utf-8', newline='\n')
          PY
          python -m py_compile acs/pgn_roundtrip.py
          python -m unittest -v tests.test_w1_d06_nested_comment_preflight_convergence tests.test_v2_pgn_nested_comment_recovery tests.test_d06_pgn_roundtrip tests.test_pgn_streaming_import
      - name: Commit repaired Product file
        shell: bash
        run: |
          git config user.name "accessible-chess-w1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add acs/pgn_roundtrip.py
          git diff --cached --check
          git commit -m "fix: converge nested comment lexical preflight"
          git push origin HEAD:w1/d06-nested-comment-preflight-convergence-20260907
