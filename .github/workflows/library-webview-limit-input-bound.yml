name: Library WebView Limit Input Bound

on:
  pull_request:
    branches:
      - 'feature/library-native-recovery-actions-20261003'
    paths:
      - 'acs/library_webview_bridge.py'
      - 'tests/test_library_webview_limit_input_bound.py'
      - '.github/workflows/library-webview-limit-input-bound.yml'

permissions:
  contents: read

concurrency:
  group: library-webview-limit-input-bound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  limit-bound:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='feature/library-native-recovery-actions-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-webview-limit-input-bound.yml' \
            'acs/library_webview_bridge.py' \
            'tests/test_library_webview_limit_input_bound.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/library_webview_bridge.py)" = "34ef3b4cd56c23de5cd23dafce3d983af3f549bc"
          test "$(git rev-parse HEAD:tests/test_library_webview_limit_input_bound.py)" = "b268e92d39318885e6e1aa4fcf541da6f4bf38cd"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Library browser boundary
        run: >-
          python -m compileall -q
          acs/library_webview_bridge.py
          tests/test_library_webview_limit_input_bound.py

      - name: Prove bounded browser parsing and retained Library bridge behavior
        run: >-
          python -m unittest -v
          tests.test_library_webview_limit_input_bound
          tests.test_dev1_library_webview_projection
          tests.test_library_projection_transaction_atomicity
