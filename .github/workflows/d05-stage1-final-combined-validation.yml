name: D05 Stage1 Final Combined Validation

on:
  push:
    branches:
      - release/d05-stage1-final-compose-staging-20260823
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTED_BASE_SHA: 80720e8125c59a213f278668d599040f2768d553
  PRECOMPOSE_SHA: 5e8ca72f7dd552ee151ebd5b85c52148004ac307
  D01_SHA: cf28971d5bf3c33c3409e069a817fc884f8244fe
  D01_BOOTSTRAP_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  D01_TEST_BLOB: a74fb703997635ca889745cd88332ecc26d4b5f0
  D02_SHA: 81fd4c922d88f8183859d090523e9b17a22b6bde
  D02_CHESSCORE_BLOB: d39948d01ac3af68b8cd07f663f6e7e6f5fef0e3
  D02_TEST_BLOB: a3be8c3d14adb756354af0bb0f3a5b8062d6b658
  STOCKFISH_BLOB: 23477698de93e7ecb582e9411a3bfacc0976849c
  HISTORY_BLOB: 381be891b3701039a70492f0db688530ed96fe5b
  PRIVACY_ORACLE_SHA: 66d5affbe027a86717a775198ec9fbcf8aba8545
  PRIVACY_ORACLE_BLOB: f674de79b19a852f29837edab138c20b28f24162
  FEN_ORACLE_SHA: 17e7f2e3a9db821c808a003f12b55da99303067c
  FEN_ORACLE_BLOB: 499538b09f799c43608a6781fe436b0f10f62752
  FOCUS_ORACLE_SHA: 965f8ed95eb2ae4f2e628b77855c0a6dbd0d4321
  FOCUS_ORACLE_BLOB: 2fec761ded7e3af193b6f309f03876141be8ab41

jobs:
  final-combined:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Preserve repository LF blobs on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Normalize exact LF materialization on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git -c core.autocrlf=false checkout HEAD -- .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Prove lineage, exact authoritative blobs and Stage1-only composition
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$ACCEPTED_BASE_SHA")" = "$ACCEPTED_BASE_SHA"
          test "$(git merge-base HEAD "$PRECOMPOSE_SHA")" = "$PRECOMPOSE_SHA"
          git diff --check "$PRECOMPOSE_SHA"...HEAD

          test "$(git rev-parse "$D01_SHA:web/stage1_release_bootstrap.js")" = "$D01_BOOTSTRAP_BLOB"
          test "$(git rev-parse "$D01_SHA:tests/test_d01_submit_focus_route_contract.py")" = "$D01_TEST_BLOB"
          test "$(git rev-parse "$D02_SHA:acs/chesscore.py")" = "$D02_CHESSCORE_BLOB"
          test "$(git rev-parse "$D02_SHA:tests/test_d02_fen_counter_fail_closed.py")" = "$D02_TEST_BLOB"

          test "$(git hash-object web/stage1_release_bootstrap.js)" = "$D01_BOOTSTRAP_BLOB"
          test "$(git hash-object tests/test_d01_submit_focus_route_contract.py)" = "$D01_TEST_BLOB"
          test "$(git hash-object acs/chesscore.py)" = "$D02_CHESSCORE_BLOB"
          test "$(git hash-object tests/test_d02_fen_counter_fail_closed.py)" = "$D02_TEST_BLOB"
          test "$(git hash-object acs/stockfish_runtime.py)" = "$STOCKFISH_BLOB"
          test "$(git hash-object acs/history.py)" = "$HISTORY_BLOB"

          changed="$(git diff --name-only "$PRECOMPOSE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(acs/chesscore\.py|web/stage1_release_bootstrap\.js|tests/test_d01_submit_focus_route_contract\.py|tests/test_d02_fen_counter_fail_closed\.py|\.github/workflows/d05-stage1-final-combined-validation\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected final-composition paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)(acsdb|chessbase|bookdocument|bookreader|book_index|training|teacher|classroom|remote_lesson)([^/]*)(/|\.|$)' ; then
            echo 'Stage2 contamination detected' >&2; exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict' ; then
            echo 'Strict QA harness contamination detected' >&2; exit 1
          fi
      - name: Compile and parse release JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q acs tests run_accessible_chess.py
          node --check web/stage1_release_bootstrap.js
          node --check web/stage1_board_actions.js
      - name: D01 and D02 authoritative repair regressions
        run: >-
          python -m unittest -v
          tests.test_d01_submit_focus_route_contract
          tests.test_d02_fen_counter_fail_closed
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_issue22_release_contract
          tests.test_stage1_release_composition_ui
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_stage1_native_menu_action_routing
          tests.test_history
          tests.test_ui_review_adapter
          tests.test_stockfish_runtime
      - name: Replay immutable independent Stage1 oracles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf d05_oracles
          mkdir -p d05_oracles
          : > d05_oracles/__init__.py

          test "$(git rev-parse "$PRIVACY_ORACLE_SHA:tests/test_dev3_stockfish_runtime_path_privacy.py")" = "$PRIVACY_ORACLE_BLOB"
          git show "$PRIVACY_ORACLE_SHA:tests/test_dev3_stockfish_runtime_path_privacy.py" > d05_oracles/test_privacy.py
          test "$(git hash-object d05_oracles/test_privacy.py)" = "$PRIVACY_ORACLE_BLOB"

          test "$(git rev-parse "$FEN_ORACLE_SHA:tests/test_dev4_stage1_fen_counter_error_surface.py")" = "$FEN_ORACLE_BLOB"
          git show "$FEN_ORACLE_SHA:tests/test_dev4_stage1_fen_counter_error_surface.py" > d05_oracles/test_fen.py
          test "$(git hash-object d05_oracles/test_fen.py)" = "$FEN_ORACLE_BLOB"

          test "$(git rev-parse "$FOCUS_ORACLE_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py")" = "$FOCUS_ORACLE_BLOB"
          git show "$FOCUS_ORACLE_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py" > d05_oracles/test_focus.py
          test "$(git hash-object d05_oracles/test_focus.py)" = "$FOCUS_ORACLE_BLOB"

          python -m unittest -v d05_oracles.test_privacy d05_oracles.test_fen d05_oracles.test_focus
      - name: Cross-lane Stage1 regression surface
        run: >-
          python -m pytest -q
          tests/test_stage1_release_path_privacy.py
          tests/test_stage1_stockfish_runtime_path_privacy.py
          tests/test_dev2_history_scalar_fail_closed.py
          tests/test_d02_fen_counter_fail_closed.py
          tests/test_stage1_saturation_history_stress.py
          tests/test_stage1_core_full_flow.py
          tests/test_stage1_packaged_focus_origin_contract.py
          tests/test_d01_submit_focus_route_contract.py
      - name: Focused release contracts
        run: >-
          python -m unittest -v
          tests.test_release_preflight
          tests.test_nvda_p0_contract
          tests.test_webview_safe_server
          tests.test_legacy_release_workflow_safety
          tests.test_core_release_contracts
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q
      - name: Canonical SELFTEST
        run: python -m acs.selftest
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
