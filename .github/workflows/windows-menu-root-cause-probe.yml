name: Windows Native Menu Root-Cause Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - qa/windows-current-integration-candidate-20260815
    paths:
      - '.github/workflows/windows-menu-root-cause-probe.yml'

permissions:
  contents: read

concurrency:
  group: accessible-chess-windows-menu-root-cause
  cancel-in-progress: false

env:
  SOURCE_INTEGRATION_SHA: 9e80b385fded1d26fb9cc71a142f4719393c40ea
  PYWEBVIEW_VERSION: '6.2.1'
  PYTHONNET_VERSION: '3.0.5'

jobs:
  menu-matrix:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen product and pinned probe runtime
        shell: pwsh
        run: |
          git cat-file -e "$env:SOURCE_INTEGRATION_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen integration SHA unavailable' }
          $resolved=(git rev-parse "$env:SOURCE_INTEGRATION_SHA^{commit}").Trim()
          if ($resolved -ne $env:SOURCE_INTEGRATION_SHA) { throw "Frozen SHA mismatch: $resolved" }
          git archive --format=zip --output=product.zip $env:SOURCE_INTEGRATION_SHA -- acs
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path product.zip)) { throw 'Could not export frozen product menu code' }
          Expand-Archive product.zip product -Force
          python -m pip install --upgrade pip
          python -m pip install "pywebview==$env:PYWEBVIEW_VERSION" "pythonnet==$env:PYTHONNET_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows probe runtime install failed' }
          python -c "import webview, clr; print('PINNED PROBE RUNTIME PASS')"

      - name: Create A/B/C applications
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe-results,probe_a | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWindowsForms>true</UseWindowsForms>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Encoding UTF8 probe_a/probe_a.csproj
          @'
          using System;
          using System.IO;
          using System.Windows.Forms;
          internal static class Program
          {
              [STAThread]
              static void Main()
              {
                  ApplicationConfiguration.Initialize();
                  var form = new Form { Text = "AC Menu Probe A - Compiled WinForms", Width = 640, Height = 400 };
                  var menu = new MenuStrip { Name = "ProbeAMenu", AccessibleName = "Probe A application menu" };
                  var file = new ToolStripMenuItem("&File") { AccessibleName = "File" };
                  var safe = new ToolStripMenuItem("&Safe Action") { AccessibleName = "Safe Action" };
                  safe.Click += (_, _) => File.WriteAllText(Path.GetFullPath("probe-results/a_action.txt"), "activated");
                  file.DropDownItems.Add(safe);
                  menu.Items.Add(file);
                  form.MainMenuStrip = menu;
                  form.Controls.Add(menu);
                  menu.BringToFront();
                  Application.Run(form);
              }
          }
          '@ | Set-Content -Encoding UTF8 probe_a/Program.cs
          dotnet build probe_a/probe_a.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Compiled WinForms baseline build failed' }

          @'
          import webview
          from pathlib import Path
          from webview.menu import Menu, MenuAction
          signal=Path('probe-results/b_action.txt').resolve()
          def safe_action(): signal.write_text('activated',encoding='utf-8')
          menu=[Menu('&File',[MenuAction('&Safe Action',safe_action)]), Menu('&Help',[MenuAction('Safe Help',lambda: None)])]
          webview.create_window('AC Menu Probe B - pywebview official menu', html='<h1>Probe B</h1>', menu=menu)
          webview.start(gui='edgechromium', private_mode=True)
          '@ | Set-Content -Encoding UTF8 probe_b.py

          @'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('product').resolve()))
          import webview
          from acs.ui_native_menu import install_windows_native_menu
          signal=Path('probe-results/c_action.txt').resolve()
          class DummyApi:
              lang='en'
              def keymap_search(self,*a,**k): return []
              def _hit(self,*a,**k): signal.write_text('activated',encoding='utf-8'); return {'ok':True}
              new_game=_hit; clear_board=_hit; undo=_hit; redo=_hit; review_previous=_hit; review_next=_hit; toggle_engine=_hit
              def keymap_reset_all(self): return {'ok':True}
          api=DummyApi()
          window=webview.create_window('AC Menu Probe C - Accessible Chess custom path', html='<h1>Probe C</h1>', js_api=api)
          def install():
              ok=install_windows_native_menu(window,api)
              Path('probe-results/c_install.txt').write_text('true' if ok else 'false',encoding='utf-8')
              if not ok: raise RuntimeError('Accessible Chess custom native menu installation returned false')
          webview.start(install,gui='edgechromium',private_mode=True)
          '@ | Set-Content -Encoding UTF8 probe_c.py

      - name: Create app-menu-specific UIA keyboard harness
        shell: pwsh
        run: |
          @'
          param(
            [Parameter(Mandatory=$true)][int]$AppPid,
            [Parameter(Mandatory=$true)][string]$Label,
            [Parameter(Mandatory=$true)][string]$SignalPath
          )
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @"
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class ACInput {
            [DllImport("user32.dll", SetLastError=true)] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [StructLayout(LayoutKind.Sequential)] public struct MOUSEINPUT { public int dx; public int dy; public uint mouseData; public uint dwFlags; public uint time; public UIntPtr dwExtraInfo; }
            [StructLayout(LayoutKind.Sequential)] public struct KEYBDINPUT { public ushort wVk; public ushort wScan; public uint dwFlags; public uint time; public UIntPtr dwExtraInfo; }
            [StructLayout(LayoutKind.Sequential)] public struct HARDWAREINPUT { public uint uMsg; public ushort wParamL; public ushort wParamH; }
            [StructLayout(LayoutKind.Explicit)] public struct InputUnion {
              [FieldOffset(0)] public MOUSEINPUT mi;
              [FieldOffset(0)] public KEYBDINPUT ki;
              [FieldOffset(0)] public HARDWAREINPUT hi;
            }
            [StructLayout(LayoutKind.Sequential)] public struct INPUT { public uint type; public InputUnion U; }
            [DllImport("user32.dll", SetLastError=true)] public static extern uint SendInput(uint nInputs, INPUT[] pInputs, int cbSize);
            public const uint INPUT_KEYBOARD=1; public const uint KEYEVENTF_KEYUP=0x0002;
            static INPUT Key(ushort vk,uint flags){ var x=new INPUT(); x.type=INPUT_KEYBOARD; x.U.ki.wVk=vk; x.U.ki.dwFlags=flags; return x; }
            static void Send(INPUT[] a){ int size=Marshal.SizeOf(typeof(INPUT)); uint sent=SendInput((uint)a.Length,a,size); if(sent!=a.Length) throw new Win32Exception(Marshal.GetLastWin32Error(),"SendInput failed: sent="+sent+" expected="+a.Length+" size="+size); }
            public static void Tap(ushort vk){ Send(new[]{Key(vk,0),Key(vk,KEYEVENTF_KEYUP)}); }
            public static void Chord(ushort modifier, ushort vk){ Send(new[]{Key(modifier,0),Key(vk,0),Key(vk,KEYEVENTF_KEYUP),Key(modifier,KEYEVENTF_KEYUP)}); }
          }
          "@
          function Find-NamedMenuItem($element,$pattern) {
            if(-not $element){ return $null }
            $itemCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuItem)
            $items=$element.FindAll([System.Windows.Automation.TreeScope]::Descendants,$itemCond)
            foreach($it in $items){ if($it.Current.Name -match $pattern){ return $it } }
            return $null
          }
          function Describe-Focus($prefix,$out) {
            $f=[System.Windows.Automation.AutomationElement]::FocusedElement
            "$prefix type=[$($f.Current.ControlType.ProgrammaticName)] name=[$($f.Current.Name)] class=[$($f.Current.ClassName)]" | Add-Content -Encoding UTF8 $out
          }
          Start-Sleep -Seconds 5
          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $pidCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty,$AppPid)
          $menuCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuBar)
          $itemCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuItem)
          $allCond=[System.Windows.Automation.Condition]::TrueCondition
          $out=Join-Path 'probe-results' ($Label + '_uia.txt')
          "PID=$AppPid" | Set-Content -Encoding UTF8 $out
          $winner=$null; $appMenu=$null; $fileItem=$null
          for($attempt=0;$attempt -lt 12 -and -not $appMenu;$attempt++){
            $wins=$root.FindAll([System.Windows.Automation.TreeScope]::Children,$pidCond)
            "attempt=$attempt topLevelCount=$($wins.Count)" | Add-Content -Encoding UTF8 $out
            for($i=0;$i -lt $wins.Count;$i++){
              $w=$wins.Item($i)
              "TOP[$i] name=[$($w.Current.Name)] class=[$($w.Current.ClassName)] offscreen=$($w.Current.IsOffscreen) hwnd=$($w.Current.NativeWindowHandle)" | Add-Content -Encoding UTF8 $out
              if($w.Current.IsOffscreen){ continue }
              $bars=$w.FindAll([System.Windows.Automation.TreeScope]::Descendants,$menuCond)
              "TOP[$i] menuBarCount=$($bars.Count)" | Add-Content -Encoding UTF8 $out
              for($j=0;$j -lt $bars.Count;$j++){
                $bar=$bars.Item($j); $names=@()
                $items=$bar.FindAll([System.Windows.Automation.TreeScope]::Descendants,$itemCond)
                foreach($it in $items){ if($it.Current.Name){ $names += $it.Current.Name } }
                "BAR[$j] name=[$($bar.Current.Name)] items=[$($names -join '|')]" | Add-Content -Encoding UTF8 $out
                $candidate=Find-NamedMenuItem $bar '^(File|Файл)$'
                if($candidate){ $winner=$w; $appMenu=$bar; $fileItem=$candidate; break }
              }
              if($appMenu){ break }
              if($attempt -eq 11){
                $nodes=$w.FindAll([System.Windows.Automation.TreeScope]::Descendants,$allCond)
                $limit=[Math]::Min($nodes.Count,100)
                for($n=0;$n -lt $limit;$n++){
                  $node=$nodes.Item($n)
                  "NODE[$n] type=[$($node.Current.ControlType.ProgrammaticName)] name=[$($node.Current.Name)] class=[$($node.Current.ClassName)]" | Add-Content -Encoding UTF8 $out
                }
              }
            }
            if(-not $appMenu){ Start-Sleep -Milliseconds 500 }
          }
          if(-not $appMenu){ Get-Content $out; throw "${Label}: no application MenuBar containing File/Файл was exposed; system menu does not count" }
          'STRUCTURE_APP_MENU_PASS' | Add-Content -Encoding UTF8 $out
          "FILE_ITEM keyboardFocusable=$($fileItem.Current.IsKeyboardFocusable) hasKeyboardFocus=$($fileItem.Current.HasKeyboardFocus) offscreen=$($fileItem.Current.IsOffscreen) accessKey=[$($fileItem.Current.AccessKey)]" | Add-Content -Encoding UTF8 $out
          if(-not [ACInput]::SetForegroundWindow([IntPtr]$winner.Current.NativeWindowHandle)){ throw "${Label}: SetForegroundWindow failed" }
          Start-Sleep -Milliseconds 800

          # Diagnostic only: bare Alt focus observability on hosted runner. Do not use this alone to classify product.
          [ACInput]::Tap(0x12); Start-Sleep -Milliseconds 700
          Describe-Focus 'FOCUS_AFTER_BARE_ALT' $out
          "FILE_AFTER_BARE_ALT hasKeyboardFocus=$($fileItem.Current.HasKeyboardFocus) offscreen=$($fileItem.Current.IsOffscreen)" | Add-Content -Encoding UTF8 $out
          [ACInput]::Tap(0x1B); Start-Sleep -Milliseconds 250

          # Deterministic native access-key path. Alt+F must open the real application File menu; Enter must activate its safe command.
          [ACInput]::Chord(0x12,0x46); Start-Sleep -Milliseconds 900
          Describe-Focus 'FOCUS_AFTER_ALT_F' $out
          $safeItem=Find-NamedMenuItem $winner '^(Safe Action|Нова гра|New game)$'
          if($safeItem){ "SAFE_ITEM offscreen=$($safeItem.Current.IsOffscreen) hasKeyboardFocus=$($safeItem.Current.HasKeyboardFocus)" | Add-Content -Encoding UTF8 $out }
          [ACInput]::Tap(0x0D); Start-Sleep -Milliseconds 1000
          if(-not (Test-Path $SignalPath)){ Get-Content $out; throw "${Label}: Alt+F then Enter did not activate safe application-menu command" }
          [ACInput]::Tap(0x1B); Start-Sleep -Milliseconds 250
          'ACCESSKEY_ALT_F_ENTER_PASS' | Add-Content -Encoding UTF8 $out
          'ok' | Set-Content -Encoding UTF8 (Join-Path 'probe-results' ($Label + '_pass.txt'))
          Get-Content $out
          '@ | Set-Content -Encoding UTF8 uia_probe.ps1

      - name: Matrix A - compiled .NET WinForms MenuStrip
        shell: pwsh
        continue-on-error: true
        run: |
          $exe='probe_a\bin\Release\net8.0-windows\probe_a.exe'
          if(-not (Test-Path $exe)){ throw 'Compiled WinForms baseline exe missing' }
          $p=Start-Process $exe -PassThru
          try { .\uia_probe.ps1 -AppPid $p.Id -Label 'A_compiled_winforms' -SignalPath 'probe-results\a_action.txt' }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Matrix B - official pywebview 6.2.1 menu
        shell: pwsh
        continue-on-error: true
        run: |
          $p=Start-Process python -ArgumentList 'probe_b.py' -PassThru
          try { .\uia_probe.ps1 -AppPid $p.Id -Label 'B_pywebview_official' -SignalPath 'probe-results\b_action.txt' }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Matrix C - Accessible Chess custom menu
        shell: pwsh
        continue-on-error: true
        run: |
          $p=Start-Process python -ArgumentList 'probe_c.py' -PassThru
          try { .\uia_probe.ps1 -AppPid $p.Id -Label 'C_accessible_chess_custom' -SignalPath 'probe-results\c_action.txt' }
          finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Classify root cause fail closed
        shell: pwsh
        run: |
          $a=Test-Path 'probe-results\A_compiled_winforms_pass.txt'
          $b=Test-Path 'probe-results\B_pywebview_official_pass.txt'
          $c=Test-Path 'probe-results\C_accessible_chess_custom_pass.txt'
          "A_COMPILED_WINFORMS=$a B_PYWEBVIEW_OFFICIAL=$b C_CUSTOM=$c" | Tee-Object -FilePath 'probe-results\classification.txt'
          if(-not $a){ throw 'ROOT CAUSE INCONCLUSIVE: compiled native WinForms structure/access-key baseline failed; product conclusion forbidden' }
          if(-not $b){ throw 'ROOT CAUSE: pinned official pywebview menu structure/access-key path fails on runner; migration is not evidence-backed' }
          if(-not $c){
            'ROOT CAUSE: Accessible Chess custom menu fails while compiled WinForms and official pywebview baselines pass. Route exact evidence to UI owner.' | Add-Content 'probe-results\classification.txt'
            throw 'Accessible Chess custom app menu failed evidence-backed A/B comparison'
          }
          'ROOT CAUSE: A/B/C all pass application-menu structure and access-key activation. Prior full-build failure is packaging/window-selection/timing specific; repair full UIA harness before one rerun.' | Add-Content 'probe-results\classification.txt'

      - name: Upload bounded UIA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-menu-root-cause-evidence
          path: probe-results/
          if-no-files-found: error
          retention-days: 14
