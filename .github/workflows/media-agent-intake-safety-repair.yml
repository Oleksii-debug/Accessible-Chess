name: Media Agent Intake Safety Repair

on:
  pull_request:
    branches:
      - work/media-agent-crossrepo-intake-20261005
    paths:
      - .github/workflows/media-agent-intake-convergence.yml
      - .github/workflows/media-agent-intake-safety-repair.yml
      - acs/agent_accessibility.py
      - acs/public_errors.py
      - tests/test_media_agent_intake_convergence_20261005.py
  push:
    branches:
      - fix/media-agent-intake-safety-20261006-sol56x1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-agent-intake-safety-repair-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact parent and bounded safety-repair scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PARENT_REF: work/media-agent-crossrepo-intake-20261005
          PARENT_SHA: 6609c35ff5fa0b1f959806866ff7403e70efdbf3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "+refs/heads/$PARENT_REF:refs/remotes/origin/media-agent-safety-parent"
          live_parent="$(git rev-parse refs/remotes/origin/media-agent-safety-parent)"
          test "$live_parent" = "$PARENT_SHA" || {
            printf 'MEDIA_AGENT_SAFETY_PARENT_MOVED expected=%s live=%s\n' "$PARENT_SHA" "$live_parent" >&2
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.ref }}" = "$PARENT_REF"
          fi
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          git diff --check "$PARENT_SHA"...HEAD
          changed="$(git diff --name-only "$PARENT_SHA"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/media-agent-intake-convergence.yml' \
            '.github/workflows/media-agent-intake-safety-repair.yml' \
            'acs/agent_accessibility.py' \
            'acs/public_errors.py' \
            'tests/test_media_agent_intake_convergence_20261005.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected Media/Agent safety-repair scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/agent_accessibility.py)" = 'ab749959f1ebd55522c3b2a07ef44224d857c526'
          test "$(git rev-parse HEAD:acs/public_errors.py)" = '5218aeda56f60d81875f52c7c07e45e1c192ae2f'
          test "$(git rev-parse HEAD:.github/workflows/media-agent-intake-convergence.yml)" = '39e47d0ec035428512c0875a91e1277ef2d10028'
          test "$(git rev-parse HEAD:tests/test_media_agent_intake_convergence_20261005.py)" = 'd1b110f4e34070551248fb4d6c41cdbeab26cdc6'
          test "$(git rev-parse HEAD:tests/test_media_agent_safety_primitives_20261005.py)" = '5d466ecdb39b49549f2183c4c04263ca427ee1c3'
          test "$(git rev-parse HEAD:acs/chess_agent_tools.py)" = 'cf73c95d3f26c1ad4ae3ec255ef012ba52d35637'
          echo 'MEDIA_AGENT_INTAKE_SAFETY_REPAIR_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile repaired accessibility and public-error boundaries
        run: >-
          python -m compileall -q
          acs/agent_accessibility.py
          acs/public_errors.py
          tests/test_media_agent_intake_convergence_20261005.py
          tests/test_media_agent_safety_primitives_20261005.py

      - name: Execute exact formerly-red safety contracts
        run: >-
          python -m unittest -v
          tests.test_media_agent_intake_convergence_20261005
          tests.test_media_agent_safety_primitives_20261005

      - name: Execute retained Media and Agent boundary regressions
        run: >-
          python -m unittest -v
          tests.test_crossrepo_media_process_files
          tests.test_media_audio_crossrepo
          tests.test_media_foundation_crossrepo
          tests.test_media_timeline_store
          tests.test_chess_agent_tools_crossrepo
