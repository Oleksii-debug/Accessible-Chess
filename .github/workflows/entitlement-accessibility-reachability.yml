name: Entitlement Accessibility Reachability

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/ui_entitlement.py'
      - 'acs/entitlement_accessibility.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_ui_shell.py'
      - 'tests/test_entitlement_accessibility.py'
      - 'tests/test_dev1_full_product_accessible_shell.py'
      - 'tests/test_dev1_full_product_ui_packages.py'
      - '.github/workflows/entitlement-accessibility-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entitlement-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate identity
        if: github.event_name == 'pull_request'
        shell: python
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_SHA"]
          if actual != expected:
              raise SystemExit(f"checked out {actual}, expected pull-request head {expected}")

      - name: Prove entitlement-accessibility-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          merge_base="$(git merge-base "$base" HEAD)"
          changed="$(git diff --name-only "$merge_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/entitlement-accessibility-reachability.yml' \
            'acs/entitlement_accessibility.py' \
            'acs/full_product_actions.py' \
            'acs/full_product_ui_shell.py' \
            'tests/test_dev1_full_product_accessible_shell.py' \
            'tests/test_entitlement_accessibility.py' | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected entitlement-accessibility PR scope:\n%s\n' "$changed" >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2

      - name: Compile accessibility composition
        run: >-
          python -m py_compile
          acs/ui_entitlement.py
          acs/entitlement_accessibility.py
          acs/full_product_actions.py
          acs/full_product_ui_shell.py
          tests/test_entitlement_accessibility.py
          tests/test_dev1_full_product_accessible_shell.py

      - name: Run entitlement and shell regressions
        run: >-
          python -m pytest -q
          tests/test_entitlement_accessibility.py
          tests/test_dev1_full_product_accessible_shell.py
          tests/test_dev1_full_product_ui_packages.py
