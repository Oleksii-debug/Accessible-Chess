name: Private ChessBase Converter Tools

on:
  push:
    branches:
      - work/test-ready-ux-ingest-hotkeys-design-20261003
    paths:
      - 'tools/optional/libcbh_json_bridge.cpp'
      - 'tests/test_chessbase_libcbh_external_fixture.py'
      - '.github/workflows/private-chessbase-converter-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-chessbase-converter-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libcbh:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 1
          path: product

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          fetch-depth: 1
          path: upstream/libcbh

      - name: Build pinned libcbh
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2

      - name: Build Accessible Chess converter bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p converter/libcbh
          c++ -std=c++20 -O2             -DLIBCBH_SOURCE_COMMIT=\"9641c5c3949d8fb210b17dd9aa54455645843696\"             -I upstream/libcbh/include             product/tools/optional/libcbh_json_bridge.cpp             -L upstream/libcbh/build -lcbh             -Wl,-rpath,'$ORIGIN'             -o converter/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* converter/libcbh/
          cp upstream/libcbh/LICENSE converter/libcbh/LICENSE-libcbh-GPL-2.0.txt
          cp product/tools/optional/libcbh_json_bridge.cpp converter/libcbh/libcbh_json_bridge.cpp
          test -x converter/libcbh/libcbh-json-bridge

      - name: Prove real variation and annotation fidelity
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/converter/libcbh/libcbh-json-bridge
          LIBCBH_FIXTURE_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
          LIBCBH_ANNOTATION_FIXTURE_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/Annotation
        run: python -m unittest -v tests.test_chessbase_libcbh_external_fixture

      - name: Record exact converter identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("converter/libcbh")
          rows={}
          for path in sorted(root.iterdir()):
              if path.is_file():
                  rows[path.name]={"bytes":path.stat().st_size,"sha256":hashlib.sha256(path.read_bytes()).hexdigest()}
          (root/"CONVERTER_MANIFEST.json").write_text(json.dumps({
              "purpose":"private-owner-source-conversion-only",
              "libcbh_commit":"9641c5c3949d8fb210b17dd9aa54455645843696",
              "files":rows,
          },sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: accessible-chess-private-libcbh-converter-linux
          path: converter/libcbh
          if-no-files-found: error
          retention-days: 7

  uncbv:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: antoyo/uncbv
          ref: 3c18e8a7c6a30c21f945a1ab5462521c306dca57
          fetch-depth: 1

      - name: Build pinned uncbv
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked
          ./target/release/uncbv --help >/dev/null 2>&1 || true
          mkdir -p converter/uncbv
          cp target/release/uncbv converter/uncbv/
          cp LICENSE converter/uncbv/LICENSE-uncbv-GPL-3.0.txt
          cp Cargo.toml Cargo.lock converter/uncbv/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("converter/uncbv")
          rows={}
          for path in sorted(root.iterdir()):
              if path.is_file():
                  rows[path.name]={"bytes":path.stat().st_size,"sha256":hashlib.sha256(path.read_bytes()).hexdigest()}
          (root/"CONVERTER_MANIFEST.json").write_text(json.dumps({
              "purpose":"private-owner-source-conversion-only",
              "uncbv_commit":"3c18e8a7c6a30c21f945a1ab5462521c306dca57",
              "files":rows,
          },sort_keys=True,indent=2)+"\n",encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: accessible-chess-private-uncbv-converter-linux
          path: converter/uncbv
          if-no-files-found: error
          retention-days: 7
