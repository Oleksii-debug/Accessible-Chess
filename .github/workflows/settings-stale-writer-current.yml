name: Settings Stale Writer Current

on:
  push:
    branches:
      - fix/settings-stale-writer-cas-20261004-sol56x7
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - acs/settings.py
      - tests/test_settings.py
      - tests/test_settings_read_identity_current.py
      - tests/test_settings_stale_writer_current.py
      - .github/workflows/settings-stale-writer-current.yml
  pull_request:
    paths:
      - acs/settings.py
      - tests/test_settings.py
      - tests/test_settings_read_identity_current.py
      - tests/test_settings_stale_writer_current.py
      - .github/workflows/settings-stale-writer-current.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-stale-writer-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  settings-stale-writer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      SETTINGS_BLOB: 81d7d7e2d05b87552aadbda476eb3618ffa4fff1
      TEST_BLOB: d80b10a647d7d57f621c32c06efd52250fb69124
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Prove exact Settings authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object acs/settings.py)" = "$SETTINGS_BLOB"
          test "$(git hash-object tests/test_settings_stale_writer_current.py)" = "$TEST_BLOB"
          git diff --check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Settings authority and focused regression
        run: >-
          python -m py_compile
          acs/settings.py
          tests/test_settings.py
          tests/test_settings_read_identity_current.py
          tests/test_settings_stale_writer_current.py

      - name: Run Settings persistence contracts
        run: >-
          python -m unittest -v
          tests.test_settings
          tests.test_settings_read_identity_current
          tests.test_settings_stale_writer_current

      - name: Run core selftest
        run: python -m acs.selftest
