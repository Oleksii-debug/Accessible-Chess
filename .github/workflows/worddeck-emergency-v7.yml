name: WordDeck emergency Oxford 5000 V7 same-sense completion

on:
  push:
    branches:
      - worddeck-bootstrap
    paths:
      - WordDeck/tools/complete_oxford5000_emergency_v7.py
      - WordDeck/tools/run_oxford5000_v7_completion.py
      - .github/workflows/worddeck-emergency-v7.yml
  workflow_dispatch:

concurrency:
  group: worddeck-emergency-v7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write
  actions: write

jobs:
  complete-tail-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact corrective branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish V7 pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'WordDeck emergency V7 same-sense gate',
              description: 'V7 same-sense Ukrainian evidence and blocked-resolution review is executing.',
              target_url: targetUrl
            });

      - name: Install lexical QA and Ukrainian morphology dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers<5' sentencepiece requests beautifulsoup4 'sentence-transformers<4' pymorphy3 pymorphy3-dicts-uk

      - name: Execute V7 same-sense full-tail review and resolution rounds
        shell: bash
        run: |
          set -euo pipefail
          python WordDeck/tools/complete_oxford5000_emergency_v7.py --self-test
          python WordDeck/tools/run_oxford5000_v7_completion.py

      - name: Publish final V7 status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const remaining = process.env.FINAL_REMAINING || 'unknown';
            const finalSha = process.env.FINAL_SHA || context.sha;
            const complete = remaining === '0' && '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: finalSha,
              state: complete ? 'success' : 'failure',
              context: 'WordDeck emergency V7 same-sense gate',
              description: complete
                ? 'V7 lexical tail complete; British offline audio workflow completed.'
                : `V7 ended fail-closed with ${remaining} unresolved identities or a workflow defect.`,
              target_url: targetUrl
            });

      - name: Upload V7 lexical, checkpoint and audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-oxford5000-emergency-v7-evidence
          path: artifacts/emergency-v7/**
          if-no-files-found: warn
          retention-days: 90
