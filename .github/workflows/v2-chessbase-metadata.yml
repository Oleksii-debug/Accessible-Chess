name: Accessible Chess V2 ChessBase Metadata

on:
  push:
    branches:
      - work/v2-chessbase-metadata-20260831

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-chessbase-metadata-${{ github.ref }}
  cancel-in-progress: true

env:
  V2_METADATA_BASE_SHA: 47750f4a1ad452e6b9b8811afaa3cc699bde4ea8
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696
  UNCBV_COMMIT: 3c18e8a7c6a30c21f945a1ab5462521c306dca57

jobs:
  metadata-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove ownership scope and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V2_METADATA_BASE_SHA" HEAD
          git diff --check "$V2_METADATA_BASE_SHA" HEAD
          changed="$(git diff --name-only "$V2_METADATA_BASE_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-chessbase-metadata.yml' \
            'acs/chessbase_metadata.py' \
            'tests/test_v2_chessbase_metadata.py' \
            'tests/v2_chessbase_metadata_probe.py' \
            'tools/optional/libcbh_json_bridge.cpp' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected DEV16 scope:\n%s\n' "$changed" >&2
            exit 1
          }
          git diff --quiet "$V2_METADATA_BASE_SHA" HEAD -- \
            acs/acsdb.py acs/search_service.py acs/search_policy.py \
            acs/chesscore.py acs/gametree.py acs/chessbase_library_import.py \
            acs/cbv_extractor.py acs/stage1_release_ui.py acs/stage1_release_ui_core.py \
            web tools/qa
          printf 'V2_METADATA_BASE=%s\nMETADATA_HEAD=%s\n' \
            "$V2_METADATA_BASE_SHA" "$(git rev-parse HEAD)"

      - name: Compile Python
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused metadata and Library regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_v2_chessbase_metadata \
            tests.test_chessbase_decoder \
            tests.test_chessbase_adapter \
            tests.test_v2_library_acsdb_search_v4 \
            tests.test_v2_library_search_service_v4 \
            tests.test_v2_library_date_filter_v5 \
            tests.test_v2_library_integrity_repair

      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee full-unittest.log

      - name: Upload full unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-chessbase-metadata-unittest-${{ matrix.os }}
          path: full-unittest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

  real-metadata-oracle:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout Accessible Chess
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0

      - name: Prove exact metadata scope before external work
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V2_METADATA_BASE_SHA" HEAD
          git diff --check "$V2_METADATA_BASE_SHA" HEAD
          git diff --quiet "$V2_METADATA_BASE_SHA" HEAD -- \
            acs/acsdb.py acs/search_service.py acs/search_policy.py \
            acs/chesscore.py acs/gametree.py acs/chessbase_library_import.py \
            acs/cbv_extractor.py acs/stage1_release_ui.py acs/stage1_release_ui_core.py \
            web tools/qa

      - name: Checkout pinned libcbh evidence corpus
        uses: actions/checkout@v4
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1

      - name: Checkout pinned uncbv evidence corpus
        uses: actions/checkout@v4
        with:
          repository: antoyo/uncbv
          ref: 3c18e8a7c6a30c21f945a1ab5462521c306dca57
          path: upstream/uncbv
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build pinned libcbh and metadata bridge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge

      - name: Build pinned uncbv
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path upstream/uncbv/Cargo.toml
          test -x upstream/uncbv/target/release/uncbv
          uncbv_sha256="$(sha256sum upstream/uncbv/target/release/uncbv | cut -d' ' -f1)"
          cbv_sha256="$(sha256sum upstream/uncbv/tests/twic1134.cbv | cut -d' ' -f1)"
          echo "UNCBV_BINARY_SHA256=$uncbv_sha256" >> "$GITHUB_ENV"
          echo "TWIC_CBV_SHA256=$cbv_sha256" >> "$GITHUB_ENV"
          printf 'UNCBV_SHA256=%s\nTWIC1134_CBV_SHA256=%s\n' "$uncbv_sha256" "$cbv_sha256"

      - name: Acquire transient independent TWIC 1134 PGN oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transient-corpus/twic1134
          curl --fail --location --retry 3 --connect-timeout 30 \
            https://theweekinchess.com/zips/twic1134g.zip \
            -o transient-corpus/twic1134g.zip
          zip_sha256="$(sha256sum transient-corpus/twic1134g.zip | cut -d' ' -f1)"
          pgn_member="$(unzip -Z1 transient-corpus/twic1134g.zip | grep -Ei '\.pgn$' | head -n 1)"
          test -n "$pgn_member"
          unzip -q transient-corpus/twic1134g.zip -d transient-corpus/twic1134
          pgn_path="$(realpath "transient-corpus/twic1134/$pgn_member")"
          test -s "$pgn_path"
          echo "TWIC_PGN_ZIP_SHA256=$zip_sha256" >> "$GITHUB_ENV"
          echo "TWIC_PGN_FIXTURE=$pgn_path" >> "$GITHUB_ENV"
          printf 'TWIC1134_PGN_ZIP_SHA256=%s\nTWIC1134_PGN_MEMBER=%s\n' "$zip_sha256" "$pgn_member"

      - name: Prove existing real libcbh semantic fixture
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_FIXTURE_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
        run: python -m unittest -v tests.test_chessbase_libcbh_external_fixture

      - name: Run real 6117-game metadata oracle through Library Search Export Reopen
        working-directory: product
        shell: bash
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          UNCBV_BINARY: ${{ github.workspace }}/upstream/uncbv/target/release/uncbv
          UNCBV_FIXTURE: ${{ github.workspace }}/upstream/uncbv/tests/twic1134.cbv
        run: |
          set -o pipefail
          python -m tests.v2_chessbase_metadata_probe 2>&1 | tee chessbase-metadata.log

      - name: Default package still excludes optional external backends
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test ! -e libcbh-json-bridge
          test ! -e libcbh.so
          test ! -e uncbv
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Remove transient copyrighted corpus before artifact publication
        if: always()
        shell: bash
        run: rm -rf transient-corpus upstream/uncbv/tests/*.cbv upstream/uncbv/tests/*.cbz || true

      - name: Upload metadata evidence summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-chessbase-metadata-evidence
          path: |
            product/chessbase-metadata-summary.json
            product/chessbase-metadata.log
          if-no-files-found: ignore
          retention-days: 7
