          EXPORT_PARENT_MERGE: a93d71be0c341ca848fadf01a45d944d6f580a8a
          PRESENTATION_REF: fix/current-pgn-language-atomicity-20261005-ooxple7
          PRESENTATION_HEAD: e3aaa1dd5fcc73e1ae81cf8a3536e09597e687a8
          PRE_PRESENTATION_PRODUCT: a59a46810fd189b1e8bf2c4efadda9dfebcc3af1
          PRESENTATION_MERGE: e59a9244a5236974560df09b3adec70027737676
          LIBRARY_EXPORT_REF: fix/library-export-destination-cas-20261005-ooxple7
          LIBRARY_EXPORT_HEAD: 381f6ae5c1a2f303d691341de2d5ef2c448b540e
