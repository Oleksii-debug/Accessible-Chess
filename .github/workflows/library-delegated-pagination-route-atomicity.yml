name: Library Delegated Pagination Route Atomicity

on:
  pull_request:
    branches:
      - 'fix/library-delegated-route-atomicity-20261003'
    paths:
      - 'acs/version2_application.py'
      - 'tests/test_version2_application.py'
      - '.github/workflows/library-delegated-pagination-route-atomicity.yml'

permissions:
  contents: read

concurrency:
  group: library-delegated-pagination-route-atomicity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delegated-pagination:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='fix/library-delegated-route-atomicity-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-delegated-pagination-route-atomicity.yml' \
            'acs/version2_application.py' \
            'tests/test_version2_application.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/version2_application.py)" = "98a758a1ba40da37391564ee4c10327396b57233"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "b334162dbd8d225abae722721eb9ff2d76164c95"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile delegated Library boundary
        run: >-
          python -m compileall -q
          acs/version2_application.py
          tests/test_version2_application.py

      - name: Prove pagination route, modal, focus, and malformed-result behavior
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_library_pagination_atomicity
          tests.test_dev1_full_product_webview_adapter
