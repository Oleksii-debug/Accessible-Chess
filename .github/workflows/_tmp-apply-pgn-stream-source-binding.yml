name: Temporary PGN source-binding patch

on:
  push:
    branches:
      - work/v2-pgn-stream-source-binding-20260907

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[source-binding-applied]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v2-pgn-stream-source-binding-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact bounded transformation
        run: python scripts/_tmp_apply_pgn_stream_source_binding.py
      - name: Verify syntax and diff
        run: |
          git diff --check
          python -m py_compile acs/pgn_streaming_import.py
          git diff --exit-code -- . ':!acs/pgn_streaming_import.py'
      - name: Commit transformed Product source
        run: |
          git config user.name 'accessible-chess-work-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add acs/pgn_streaming_import.py
          git diff --cached --check
          git commit -m 'fix: bind streaming PGN read to validated source [source-binding-applied]'
          git push origin HEAD:work/v2-pgn-stream-source-binding-20260907
