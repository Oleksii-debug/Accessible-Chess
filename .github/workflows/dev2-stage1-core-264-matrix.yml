name: DEV2 Stage1 Canonical Core 264 Matrix

on:
  push:
    branches:
      - qa/dev2-stage1-core-264-matrix-20260823
  pull_request:
    branches:
      - release/dev5-stage1-path-privacy-repair-20260823

permissions:
  contents: read

env:
  EXACT_REPAIR_BASE_SHA: 80720e8125c59a213f278668d599040f2768d553

jobs:
  canonical-core-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout evidence head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Exact base and evidence-only diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXACT_REPAIR_BASE_SHA" HEAD)" = "$EXACT_REPAIR_BASE_SHA"
          git diff --check "$EXACT_REPAIR_BASE_SHA" HEAD
          python - <<'PY'
          import os, subprocess
          allowed={
              'tests/test_dev2_stage1_candidate_264_matrix.py',
              '.github/workflows/dev2-stage1-core-264-matrix.yml',
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['EXACT_REPAIR_BASE_SHA'],'HEAD'], text=True
          ).splitlines())
          assert changed == allowed, (changed, allowed)
          print('DEV2 EVIDENCE-ONLY DIFF PASS', sorted(changed))
          PY
      - name: Compile canonical source and matrix
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: DEV2 exact candidate 264-case matrix
        run: python -m unittest -v tests.test_dev2_stage1_candidate_264_matrix
      - name: Existing DEV2 and Stage1 canonical focused regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_fen_atomicity
          tests.test_dev2_board_query_invariants
          tests.test_history
          tests.test_position_editor
          tests.test_squares
          tests.test_stage1_saturation_history_stress
          tests.test_stage1_core_full_flow
          tests.test_core_release_contracts
          tests.test_manual5_cross_lane_regression
      - name: Full unittest
        run: python -m unittest discover -v tests
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic

  canonical-core-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout evidence head with LF semantics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact LF source and verify base
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          if((git merge-base $env:EXACT_REPAIR_BASE_SHA HEAD).Trim() -ne $env:EXACT_REPAIR_BASE_SHA){throw 'Exact repair-base ancestry mismatch'}
          git diff --check $env:EXACT_REPAIR_BASE_SHA HEAD
          if($LASTEXITCODE -ne 0){throw 'Diff hygiene failed'}
          $changed=@(git diff --name-only $env:EXACT_REPAIR_BASE_SHA HEAD)
          $allowed=@('.github/workflows/dev2-stage1-core-264-matrix.yml','tests/test_dev2_stage1_candidate_264_matrix.py')
          $extra=@($changed | Where-Object {$_ -notin $allowed})
          if($extra.Count -ne 0 -or $changed.Count -ne 2){throw "Evidence-only diff mismatch: $($changed -join ', ')"}
          'DEV2 WINDOWS EXACT BASE + EVIDENCE-ONLY DIFF PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile canonical source and matrix
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: DEV2 exact candidate 264-case matrix
        run: python -m unittest -v tests.test_dev2_stage1_candidate_264_matrix
      - name: Existing DEV2 and Stage1 canonical focused regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_fen_atomicity
          tests.test_dev2_board_query_invariants
          tests.test_history
          tests.test_position_editor
          tests.test_squares
          tests.test_stage1_saturation_history_stress
          tests.test_stage1_core_full_flow
          tests.test_core_release_contracts
          tests.test_manual5_cross_lane_regression
      - name: Full unittest
        run: python -m unittest discover -v tests
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
