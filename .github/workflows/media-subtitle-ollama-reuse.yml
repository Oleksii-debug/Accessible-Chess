name: Media subtitle and Ollama reuse

on:
  pull_request:
    branches:
      - work/media-agent-crossrepo-intake-20261005
  push:
    branches:
      - feat/media-local-stt-reuse-20261005
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subtitle-ollama-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact live parent and bounded reuse scope
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PARENT_REF: work/media-agent-crossrepo-intake-20261005
          PARENT_SHA: 6609c35ff5fa0b1f959806866ff7403e70efdbf3
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test "$candidate" = "$CANDIDATE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.ref }}" = "$PARENT_REF"
          fi

          git fetch --no-tags origin "+refs/heads/$PARENT_REF:refs/remotes/origin/media-agent-reuse-parent"
          live_parent="$(git rev-parse refs/remotes/origin/media-agent-reuse-parent)"
          test "$live_parent" = "$PARENT_SHA" || {
            printf 'MEDIA_AGENT_REUSE_PARENT_MOVED expected=%s live=%s\n' "$PARENT_SHA" "$live_parent" >&2
            exit 1
          }
          test "$(git merge-base "$PARENT_SHA" "$candidate")" = "$PARENT_SHA"
          git diff --check "$PARENT_SHA...$candidate"

          changed="$(git diff --name-only "$PARENT_SHA...$candidate" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/media-subtitle-ollama-reuse.yml' \
            'acs/agent_ollama_provider.py' \
            'acs/chess_agent_tools.py' \
            'acs/media_context_cli.py' \
            'acs/media_subtitles.py' \
            'acs/media_timeline_store.py' \
            'acs/media_transcription.py' \
            'acs/public_errors.py' \
            'docs/MEDIA_AGENT_REUSE_20261005_UA.md' \
            'docs/third-party/media-agent/UPSTREAM_ARTIFACTS.json' \
            'docs/third-party/media-agent/httpx-LICENSE.txt' \
            'docs/third-party/media-agent/pysubs2-LICENSE.txt' \
            'requirements-media-agent.txt' \
            'tests/test_agent_ollama_reuse.py' \
            'tests/test_media_agent_safety_primitives_20261005.py' \
            'tests/test_media_context_cli.py' \
            'tests/test_media_subtitles_reuse.py' \
            'tests/test_media_transcriber_reuse_paths.py' \
            'tests/test_universal_chess_agent_crossrepo.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected media/subtitle/Ollama reuse scope:\n%s\n' "$changed" >&2
            exit 1
          }
          echo 'MEDIA_SUBTITLE_OLLAMA_REUSE_GEOMETRY=PASS'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install optional parser and HTTP transport
        run: python -m pip install -r requirements-media-agent.txt pytest==8.4.2
      - name: Compile integration modules
        run: >-
          python -m compileall -q acs/agent_ollama_provider.py
          acs/media_subtitles.py acs/media_context_cli.py
          acs/media_transcription.py acs/media_timeline_store.py
          acs/chess_agent_tools.py acs/public_errors.py
      - name: Verify media and agent reuse
        run: >-
          python -m pytest -q
          tests/test_media_subtitles_reuse.py
          tests/test_agent_ollama_reuse.py
          tests/test_media_context_cli.py
          tests/test_media_transcriber_reuse_paths.py
          tests/test_agent_model_response_authority.py
          tests/test_agent_protocol_json_safety.py
          tests/test_crossrepo_agent_model_numeric.py
          tests/test_agent_checkpoint_crossrepo.py
          tests/test_agent_retry_crossrepo.py
          tests/test_media_agent_safety_primitives_20261005.py
          tests/test_media_audio_crossrepo.py
          tests/test_media_foundation_crossrepo.py
          tests/test_media_timeline_store.py
          tests/test_crossrepo_media_process_files.py
          tests/test_universal_chess_agent_crossrepo.py
          tests/test_chess_agent_tools_crossrepo.py
