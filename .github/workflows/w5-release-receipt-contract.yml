name: Current Release Receipt Adversarial Evidence

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - ".github/workflows/w5-release-receipt-contract.yml"
      - "tests/test_version2_release_receipt.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-release-receipt-adversarial-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BASE_REF: converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
  RECEIPT_SOURCE_BLOB: 00bb1fff72d83b7c27e2f2063a4f974a0b36ada0
  PREFLIGHT_SOURCE_BLOB: ea86b7b0458fe47487a735bdc24d58435c7abaad
  RECEIPT_TEST_BLOB: fa48ff395340799ef66e43a8103dc65213bfcf12

jobs:
  qualify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove live shipping base, two-path evidence scope and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "${{ github.event.pull_request.base.ref }}" = "$BASE_REF"
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            git fetch --no-tags origin "refs/heads/$BASE_REF"
            base_sha="$(git rev-parse FETCH_HEAD)"
          fi
          test -n "$base_sha"
          git merge-base --is-ancestor "$base_sha" HEAD
          test "$(git merge-base "$base_sha" HEAD)" = "$base_sha"
          git diff --check "$base_sha"...HEAD
          mapfile -t actual < <(git diff --name-only "$base_sha"...HEAD | sort)
          expected=(
            ".github/workflows/w5-release-receipt-contract.yml"
            "tests/test_version2_release_receipt.py"
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${actual[$i]}" = "${expected[$i]}"
          done
          test "$(git rev-parse HEAD:acs/version2_release_receipt.py)" = "$RECEIPT_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/version2_package_preflight.py)" = "$PREFLIGHT_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_release_receipt.py)" = "$RECEIPT_TEST_BLOB"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Compile exact receipt boundary
        run: >-
          python -m py_compile
          acs/version2_release_receipt.py
          acs/version2_package_preflight.py
          tests/test_version2_release_receipt.py

      - name: Run receipt, preflight and PE identity regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_receipt
          tests.test_version2_package_preflight
          tests.test_version2_package_pe_identity

      - name: Core selftest
        run: python -m acs.selftest
