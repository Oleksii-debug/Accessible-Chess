name: Library Projection Transaction Atomicity

on:
  pull_request:
    branches:
      - 'fix/library-pagination-delegated-route-atomicity-20261003'
    paths:
      - 'acs/full_product_presenters.py'
      - 'acs/library_webview_projection.py'
      - 'acs/library_export_webview_projection.py'
      - 'tests/test_library_projection_transaction_atomicity.py'
      - '.github/workflows/library-projection-transaction-atomicity.yml'

permissions:
  contents: read

concurrency:
  group: library-projection-transaction-atomicity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projection-transaction:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='fix/library-pagination-delegated-route-atomicity-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-projection-transaction-atomicity.yml' \
            'acs/full_product_presenters.py' \
            'acs/library_export_webview_projection.py' \
            'acs/library_webview_projection.py' \
            'tests/test_library_projection_transaction_atomicity.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/full_product_presenters.py)" = "99c3e861c5932a6cd228d080033501b4553db58a"
          test "$(git rev-parse HEAD:acs/library_webview_projection.py)" = "44b1d2e1130c733c127da6a08699210e4e1f6e2c"
          test "$(git rev-parse HEAD:acs/library_export_webview_projection.py)" = "32898d16107864333780b911b3aa835032715b71"
          test "$(git rev-parse HEAD:tests/test_library_projection_transaction_atomicity.py)" = "5f272dd128587a0a4465cd8903495d60da39ba28"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Library projection transaction boundary
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          acs/library_webview_projection.py
          acs/library_export_webview_projection.py
          tests/test_library_projection_transaction_atomicity.py

      - name: Prove render-failure rollback and retained Library behavior
        run: >-
          python -m unittest -v
          tests.test_library_projection_transaction_atomicity
          tests.test_dev1_library_webview_projection
          tests.test_library_pagination_atomicity
          tests.test_version2_application
