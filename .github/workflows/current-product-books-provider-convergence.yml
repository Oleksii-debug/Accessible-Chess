name: Current Product Safety Accessibility Convergence

on:
  pull_request:
    branches:
      - converge/current-cbf-cbi-manifest-pair-20261005-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-safety-accessibility-convergence-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'CURRENT_PRODUCT_COMPLETE_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }

      - name: Prove source heads ancestry and bounded scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SERIAL_REF: converge/current-cbf-cbi-manifest-pair-20261005-ooxple7
          SERIAL_HEAD: d4e864d0f5c3fcddf902b17e5b91313401a96865
          BOOKS_REF: fix/book-provider-gametree-resource-bounds-20261005-sol56
