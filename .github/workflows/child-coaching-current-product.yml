name: Child coaching current-product contract

on:
  pull_request:
    paths:
      - "acs/child_coaching.py"
      - "acs/child_coaching_store.py"
      - "acs/child_coaching_application.py"
      - "tests/test_child_coaching.py"
      - "tests/test_child_coaching_application.py"
      - "acs/teaching_session.py"
      - "acs/interaction_contracts.py"
      - ".github/workflows/child-coaching-current-product.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: child-coaching-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile current child-coaching modules
        run: python -m py_compile acs/child_coaching.py acs/child_coaching_store.py acs/child_coaching_application.py
      - name: Run child-coaching contract tests
        run: python -m unittest -v tests.test_child_coaching tests.test_child_coaching_application
      - name: Run adjacent canonical teaching-session regressions
        run: python -m unittest -v tests.test_teaching_session
      - name: Run final-product teaching composition regressions
        run: python -m unittest -v tests.test_version2_teacher_session_runtime_binding tests.test_version2_final_product_composition
