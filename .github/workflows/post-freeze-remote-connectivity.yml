name: Post-freeze Remote Connectivity

on:
  pull_request:
    paths:
      - 'acs/remote_connectivity.py'
      - 'acs/remote_provider.py'
      - 'acs/remote_protocol_control.py'
      - 'acs/remote_durability.py'
      - 'acs/remote_controller.py'
      - 'acs/remote_event_delivery.py'
      - 'tests/test_remote_connectivity.py'
      - 'tests/test_remote_provider.py'
      - 'tests/test_remote_durability.py'
      - 'tests/test_remote_controller.py'
      - 'tests/test_remote_event_delivery.py'
      - '.github/workflows/post-freeze-remote-connectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-freeze-remote-connectivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      FROZEN_V2_BASE: 0b8fa275890cd82565eceece71063cb4353ea8c8
      REMOTE_CONTRACT_HEAD: 35acc43c79c7e027c35e9b26e8b349e411401ba3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove post-freeze ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FROZEN_V2_BASE" "$REMOTE_CONTRACT_HEAD"
          git merge-base --is-ancestor "$REMOTE_CONTRACT_HEAD" HEAD
          git diff --check "$REMOTE_CONTRACT_HEAD" HEAD
          changed="$(git diff --name-only "$REMOTE_CONTRACT_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/post-freeze-remote-connectivity.yml' \
            'acs/remote_connectivity.py' \
            'acs/remote_controller.py' \
            'acs/remote_durability.py' \
            'acs/remote_event_delivery.py' \
            'acs/remote_protocol_control.py' \
            'acs/remote_provider.py' \
            'tests/test_remote_connectivity.py' \
            'tests/test_remote_controller.py' \
            'tests/test_remote_durability.py' \
            'tests/test_remote_event_delivery.py' \
            'tests/test_remote_provider.py' | sort)"
          test "$changed" = "$expected"

      - name: Prove canonical Product authorities are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$REMOTE_CONTRACT_HEAD" HEAD -- \
            acs/remote_session.py \
            acs/teaching_session.py \
            acs/teaching_session_adapter.py \
            acs/teaching_classroom_adapter.py \
            acs/classroom_domain.py \
            acs/education_workspace.py \
            acs/education_workspace_store.py \
            acs/education_records.py \
            acs/classroom_presentation.py \
            run_accessible_chess.py \
            web/index.html

      - name: Compile remote connectivity package
        run: >-
          python -m compileall -q
          acs/remote_connectivity.py
          acs/remote_provider.py
          acs/remote_protocol_control.py
          acs/remote_durability.py
          acs/remote_controller.py
          acs/remote_event_delivery.py
          tests/test_remote_connectivity.py
          tests/test_remote_provider.py
          tests/test_remote_durability.py
          tests/test_remote_controller.py
          tests/test_remote_event_delivery.py

      - name: Focused remote connectivity tests
        run: >-
          python -m unittest -v
          tests.test_remote_connectivity
          tests.test_remote_provider
          tests.test_remote_durability
          tests.test_remote_controller
          tests.test_remote_event_delivery

      - name: Canonical remote and teaching regression tests
        run: >-
          python -m unittest -v
          tests.test_remote_session
          tests.test_d10_remote_checkpoint_provenance
          tests.test_teaching_session
          tests.test_teaching_session_adapter
          tests.test_teaching_session_adversarial
          tests.test_teaching_classroom_adapter
          tests.test_teaching_classroom_floor_control

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
