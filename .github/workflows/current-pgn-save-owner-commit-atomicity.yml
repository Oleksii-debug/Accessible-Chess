name: Current PGN Save Owner Commit Atomicity

on:
  push:
    branches:
      - fix/pgn-save-owner-commit-atomicity-20261006-c2m82
  pull_request:
    branches:
      - work/windows-pgn-save-bg-20261005-k7m4q2
    paths:
      - acs/pgn_save_snapshot.py
      - acs/version2_application.py
      - tests/test_pgn_save_snapshot.py
      - tests/test_v2_windows_pgn_save_worker.py
      - tests/test_version2_application.py
      - .github/workflows/current-pgn-save-owner-commit-atomicity.yml

permissions:
  contents: read

concurrency:
  group: current-pgn-save-owner-commit-atomicity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: a4e07a95360958fee7c292df3e4bc6213314e5dc
  PARENT_BRANCH: work/windows-pgn-save-bg-20261005-k7m4q2
  EXPECTED_SOURCE_BLOB: fbd368589bd1579a6fcde25369244dc6cc7b2ab0
  EXPECTED_TEST_BLOB: d33b793386f8bb8ee3e256eaca3b6e26d7c874e1
  EXPECTED_HOST_TEST_BLOB: d30c7b10c35fd166ef85bb51818e43d00b26d8f4
  EXPECTED_APP_BLOB: 42112a6744ac7e5981da22016b34892cc3ec1e46
  EXPECTED_APP_TEST_BLOB: e36ac8803c868258b02ce9cb414c68214e19c9d6

jobs:
  owner-commit-atomicity:
    name: Owner commit atomicity / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact live parent and bounded atomicity delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/pgn-save-owner-parent"
          live_parent="$(git rev-parse refs/remotes/origin/pgn-save-owner-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "PGN_SAVE_OWNER_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-pgn-save-owner-commit-atomicity.yml"
            "acs/pgn_save_snapshot.py"
            "acs/version2_application.py"
            "tests/test_pgn_save_snapshot.py"
            "tests/test_v2_windows_pgn_save_worker.py"
            "tests/test_version2_application.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/pgn_save_snapshot.py)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/version2_application.py)" = "$EXPECTED_APP_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_save_snapshot.py)" = "$EXPECTED_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_save_worker.py)" = "$EXPECTED_HOST_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$EXPECTED_APP_TEST_BLOB"

          echo "PGN_SAVE_OWNER_PARENT=$EXPECTED_PARENT"
          echo "PGN_SAVE_OWNER_HEAD=$expected_head"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile persistence and Windows save boundaries
        run: >-
          python -m py_compile
          acs/pgn_save_snapshot.py
          acs/pgn_document.py
          acs/pgn_workspace.py
          acs/version2_windows_file_workflows.py
          acs/version2_application.py
          tests/test_pgn_save_snapshot.py
          tests/test_pgn_document.py
          tests/test_pgn_workspace.py
          tests/test_v2_windows_pgn_save_worker.py
          tests/test_v2_windows_file_worker_shutdown_fence.py
          tests/test_v2_windows_pgn_save_terminal_truth.py
          tests/test_version2_application.py

      - name: Run focused owner-commit and persistence regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_save_snapshot
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
