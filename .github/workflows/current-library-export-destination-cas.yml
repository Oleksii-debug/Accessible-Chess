name: Current Library Export Destination CAS

on:
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
    paths:
      - 'acs/library_export_service.py'
      - 'acs/version2_windows_library_export.py'
      - 'tests/test_d07_library_export_service.py'
      - 'tests/test_v2_windows_library_export.py'
      - '.github/workflows/current-library-export-destination-cas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-library-export-destination-cas-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove current Product ancestry and exact scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRODUCT_REF: converge/current-product-books-provider-20261005-ooxple7
          PINNED_PRODUCT_SHA: b3ccef128ff2f885d9c71cc036ab630533158f62
          PINNED_PGN_SERVICE_BLOB: aa74b3727d0313b76676b753e32100cf8f6d90b8
          PINNED_PGN_EXPORT_HOST_BLOB: 913a74348f1323887d9d880285814a7680869ae1
          PINNED_PGN_COMMANDS_BLOB: 74a94b45597fbdc1607e7b3452df41b88837b42f
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "${EVENT_BASE_REF:-$PRODUCT_REF}" = "$PRODUCT_REF"

          if [ -n "${{ github.event.pull_request.number }}" ]; then
            git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
            test "$(git rev-parse FETCH_HEAD)" = "$expected_head" || {
              echo "CURRENT_LIBRARY_EXPORT_DESTINATION_CAS_SUPERSEDED" >&2
              exit 1
            }
          fi

          git fetch --no-tags origin "+refs/heads/$PRODUCT_REF:refs/remotes/origin/$PRODUCT_REF"
          live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_REF")"
          test "$live_product" = "$PINNED_PRODUCT_SHA" || {
            echo "CURRENT_LIBRARY_EXPORT_DESTINATION_CAS_PRODUCT_MOVED pinned=$PINNED_PRODUCT_SHA live=$live_product" >&2
            exit 1
          }
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_product"
          fi

          git merge-base --is-ancestor "$live_product" HEAD
          test "$(git merge-base "$live_product" HEAD)" = "$live_product"
          git diff --check "$live_product"...HEAD

          changed="$(git diff --name-only "$live_product"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-library-export-destination-cas.yml' \
            'acs/library_export_service.py' \
            'acs/version2_windows_library_export.py' \
            'tests/test_d07_library_export_service.py' \
            'tests/test_v2_windows_library_export.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected Library export destination-CAS scope:\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/pgn_service.py)" = "$PINNED_PGN_SERVICE_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_pgn_export.py)" = "$PINNED_PGN_EXPORT_HOST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_pgn_commands.py)" = "$PINNED_PGN_COMMANDS_BLOB"

          echo "CURRENT_LIBRARY_EXPORT_DESTINATION_CAS_PRODUCT=$live_product"
          echo "CURRENT_LIBRARY_EXPORT_DESTINATION_CAS_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed boundary
        run: >-
          python -m compileall -q
          acs/library_export_service.py
          acs/version2_windows_library_export.py
          tests/test_d07_library_export_service.py
          tests/test_v2_windows_library_export.py

      - name: Execute Library export and canonical writer regressions
        run: >-
          python -m unittest -v
          tests.test_d07_library_export_service
          tests.test_v2_windows_library_export
          tests.test_pgn_service
          tests.test_pgn_concurrent_save
          tests.test_v2_windows_pgn_export
          tests.test_v2_windows_native_dialog_ownership

      - name: Core selftest
        run: python -m acs.selftest
