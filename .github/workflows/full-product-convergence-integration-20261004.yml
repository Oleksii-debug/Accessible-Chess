permissions:
  contents: read

concurrency:
  group: full-product-convergence-20261004-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove canonical ancestry and clean diff
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CURRENT_PRODUCT_BRANCH: converge/current-pgn-graph-board-review-20261004-c2mbezb
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          canonical='0a92698bbb923ef6d7bc2d672e3fd30554fb0138'
          git cat-file -e "$canonical^{commit}"
          git merge-base --is-ancestor "$canonical" HEAD
          test "$(git merge-base "$canonical" HEAD)" = "$canonical"
          git diff --check "$canonical" HEAD

          event_base="$EVENT_BASE_SHA"
          event_base_ref="$EVENT_BASE_REF"
          if [ -n "$event_base" ]; then
            test -n "$event_base_ref"
            git cat-file -e "$event_base^{commit}"
            git fetch --no-tags origin "+refs/heads/$event_base_ref:refs/remotes/origin/$event_base_ref"
            live_base="$(git rev-parse "origin/$event_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_base"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_EVENT_BASE_ANCESTRY=PASS base=$event_base"
            echo "FULL_PRODUCT_LIVE_BASE_ANCESTRY=PASS base=$live_base"

            if [ "$event_base_ref" = "$DEFAULT_BRANCH" ]; then
              git fetch --no-tags origin "+refs/heads/$CURRENT_PRODUCT_BRANCH:refs/remotes/origin/$CURRENT_PRODUCT_BRANCH"
              live_product="$(git rev-parse "origin/$CURRENT_PRODUCT_BRANCH")"
              git cat-file -e "$live_product^{commit}"
              git merge-base --is-ancestor "$live_product" HEAD
              echo "FULL_PRODUCT_CURRENT_PRODUCT_ANCESTRY=PASS product=$live_product"
            fi
          elif [ "${GITHUB_REF_NAME:-}" = "integration/current-main-windows-apex-reconvergence-20261004-sol" ]; then
            # A direct push/dispatch on the canonical current-main integration
            # branch has no pull_request.base fields. It must still prove that
            # the candidate contains the *live* main head; otherwise an old
            # push run could turn green after main advances and be mistaken for
            # current-main qualification.
            live_base_ref='main'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_MAIN_NON_PR_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "qualification/consolidated-completion-contract-20261004-ooxple7" ]; then
            live_base_ref='fix/portable-package-same-inode-stable-read-20261004-ooxple7'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_QUALIFICATION_PARENT_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "fix/owner-portable-qualification-snapshot-pin-20261004-sol56" ]; then
            live_base_ref='qualification/owner-portable-candidate-20261004-sol6f2'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_OWNER_SNAPSHOT_PARENT_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "fix/w4-sound-byte-readback-20261004-sol56" ]; then
            live_base_ref='converge/owner-equal-apex-run-provenance-20261004-c2mbezb'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_W4_SOUND_READBACK_PARENT_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "integration/owner-release-pgn-terminal-convergence-20261004-c2mbezb" ]; then
            live_base_ref='fix/w4-sound-byte-readback-20261004-sol56'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_OWNER_PGN_CONVERGENCE_PARENT_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "integration/owner-apex-docx-whole-product-20261004-ooxple7" ]; then
            live_base_ref='integration/owner-apex-bootstrap-library-safety-20261004-zftrkmo'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_OWNER_APEX_DOCX_PARENT_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "converge/owner-apex-docx-bootstrap-generic-win32-20261004-c2mbezb" ]; then
            live_base_ref='integration/owner-apex-docx-whole-product-20261004-ooxple7'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_OWNER_APEX_GENERIC_WIN32_PARENT_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "converge/owner-equal-apex-run-provenance-20261004-c2mbezb" ]; then
            live_base_ref='integration/owner-equal-sha-release-convergence-20261004-ooxple7'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_RUN_PROVENANCE_PARENT_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "integration/owner-equal-sha-release-convergence-20261004-ooxple7" ]; then
            live_base_ref='fix/owner-w4-windows-path-ingress-20261004-zftrkmo'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_EQUAL_SHA_RELEASE_PARENT_ANCESTRY=PASS base=$live_base"
          fi
          echo 'FULL_PRODUCT_CANONICAL_ANCESTRY=PASS'

      - name: Compile convergence Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q acs tests
          echo 'FULL_PRODUCT_COMPILE=PASS'

      - name: Verify current-main convergence contract
        run: python -m unittest -v tests.test_current_main_full_product_convergence_workflow

      - name: Validate convergence JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/full_product_books_training.js
          node --check web/version2_release_bootstrap.js
          node --check web/full_product_library.js
          node --check web/full_product_pgn.js
          node --check web/p0_accessibility_runtime.js
          node --check web/version2_final_product_bootstrap.js
          node --check tests/js/p0_accessibility_runtime_test.js
          node --check tests/js/p0_dynamic_selection_runtime_test.js
          node --check tests/js/p0_accessibility_partial_replacement_test.js
          node --check tests/js/p0_selection_ambiguity_runtime_test.js
          node --check tests/js/p0_selection_route_epoch_runtime_test.js
          node --check tests/js/books_training_surface_dom_test.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node --check tests/js/library_surface_dom_test.js
          node --check tests/js/library_event_boundary_test.js
          node --check tests/js/pgn_surface_dom_test.js
          node --check tests/js/pgn_tree_keyboard_dom_test.js
          node tests/js/books_training_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/library_surface_dom_test.js
          node tests/js/library_event_boundary_test.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/pgn_tree_keyboard_dom_test.js
          node tests/js/p0_accessibility_runtime_test.js
          node tests/js/p0_dynamic_selection_runtime_test.js
          node tests/js/p0_accessibility_partial_replacement_test.js
          node tests/js/p0_selection_ambiguity_runtime_test.js
          node tests/js/p0_selection_route_epoch_runtime_test.js
          echo 'FULL_PRODUCT_DOM=PASS'

      - name: P0 semantic selection and native-copy regressions
        run: >-
          python -m unittest -v
