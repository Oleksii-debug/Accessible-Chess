name: W1 D06 Apply Bounded Model Materialization

on:
  push:
    branches:
      - work/w1-d06-bounded-model-materialization-20260907
    paths:
      - .github/workflows/w1-d06-apply-bounded-model-materialization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact bounded-materialization repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roundtrip_path = Path("acs/pgn_roundtrip.py")
          roundtrip = roundtrip_path.read_text(encoding="utf-8")
          old_roundtrip = (
              "def serialize_pgn_text(games: Iterable[PgnGame]) -> str:\n"
              "    \"\"\"Serialize only a bounded model that can be reparsed by the strict codec.\"\"\"\n"
              "\n"
              "    try:\n"
              "        snapshot = tuple(games)\n"
              "    except TypeError as exc:\n"
              "        raise PgnRoundTripError(\n"
              "            \"PGN games must be an iterable of PgnGame values\",\n"
              "            code=PgnRoundTripErrorCode.INVALID_MODEL,\n"
              "        ) from exc\n"
              "    _measure_games(snapshot)\n"
          )
          new_roundtrip = (
              "def materialize_pgn_games_bounded(\n"
              "    games: Iterable[PgnGame],\n"
              ") -> tuple[PgnGame, ...]:\n"
              "    \"\"\"Materialize and validate a PGN iterable without reading past D06 limits.\n"
              "\n"
              "    The count ceiling is enforced while consuming the iterable, before a caller can\n"
              "    allocate an unbounded tuple/deep copy. One-shot iterables remain supported and\n"
              "    an over-limit source is consumed only through the first disallowed item.\n"
              "    \"\"\"\n"
              "\n"
              "    snapshot: list[PgnGame] = []\n"
              "    try:\n"
              "        iterator = iter(games)\n"
              "        for index, game in enumerate(iterator):\n"
              "            if index >= MAX_PGN_GAMES:\n"
              "                _raise_limit(\n"
              "                    \"PGN contains too many games\",\n"
              "                    PgnRoundTripErrorCode.GAME_COUNT_LIMIT,\n"
              "                )\n"
              "            snapshot.append(game)\n"
              "    except TypeError as exc:\n"
              "        raise PgnRoundTripError(\n"
              "            \"PGN games must be an iterable of PgnGame values\",\n"
              "            code=PgnRoundTripErrorCode.INVALID_MODEL,\n"
              "        ) from exc\n"
              "\n"
              "    bounded = tuple(snapshot)\n"
              "    _measure_games(bounded)\n"
              "    return bounded\n"
              "\n"
              "\n"
              "def serialize_pgn_text(games: Iterable[PgnGame]) -> str:\n"
              "    \"\"\"Serialize only a bounded model that can be reparsed by the strict codec.\"\"\"\n"
              "\n"
              "    snapshot = materialize_pgn_games_bounded(games)\n"
          )
          if roundtrip.count(old_roundtrip) != 1:
              raise SystemExit("expected exact serialize_pgn_text materialization block once")
          roundtrip_path.write_text(
              roundtrip.replace(old_roundtrip, new_roundtrip, 1),
              encoding="utf-8",
          )

          workspace_path = Path("acs/pgn_workspace.py")
          workspace = workspace_path.read_text(encoding="utf-8")
          old_import = (
              "from .pgn_roundtrip import (\n"
              "    PgnRoundTripError,\n"
              "    canonical_round_trip_bytes,\n"
              "    canonical_round_trip_text,\n"
              "    parse_pgn_text,\n"
              "    serialize_pgn_bytes,\n"
              "    serialize_pgn_text,\n"
              ")\n"
          )
          new_import = (
              "from .pgn_roundtrip import (\n"
              "    PgnRoundTripError,\n"
              "    canonical_round_trip_bytes,\n"
              "    canonical_round_trip_text,\n"
              "    materialize_pgn_games_bounded,\n"
              "    parse_pgn_text,\n"
              "    serialize_pgn_bytes,\n"
              "    serialize_pgn_text,\n"
              ")\n"
          )
          if workspace.count(old_import) != 1:
              raise SystemExit("expected exact pgn_roundtrip import block once")
          workspace = workspace.replace(old_import, new_import, 1)

          old_validate = (
              "def _validate_document(games: Iterable[PgnGame]) -> list[PgnGame]:\n"
              "    try:\n"
              "        snapshot = tuple(deepcopy(tuple(games)))\n"
              "    except TypeError as exc:\n"
              "        raise _workspace_error(\n"
              "            \"PGN workspace requires an iterable of games\",\n"
              "            PgnWorkspaceErrorCode.INVALID_DOCUMENT,\n"
              "        ) from exc\n"
              "    if not snapshot:\n"
              "        raise _workspace_error(\n"
              "            \"PGN workspace cannot be empty\",\n"
              "            PgnWorkspaceErrorCode.EMPTY_DOCUMENT,\n"
              "        )\n"
          )
          new_validate = (
              "def _validate_document(games: Iterable[PgnGame]) -> list[PgnGame]:\n"
              "    try:\n"
              "        bounded = materialize_pgn_games_bounded(games)\n"
              "    except PgnRoundTripError as exc:\n"
              "        raise _workspace_error(\n"
              "            \"PGN workspace input is not a valid bounded document\",\n"
              "            PgnWorkspaceErrorCode.INVALID_DOCUMENT,\n"
              "        ) from exc\n"
              "    if not bounded:\n"
              "        raise _workspace_error(\n"
              "            \"PGN workspace cannot be empty\",\n"
              "            PgnWorkspaceErrorCode.EMPTY_DOCUMENT,\n"
              "        )\n"
              "    try:\n"
              "        snapshot = tuple(deepcopy(bounded))\n"
              "    except TypeError as exc:\n"
              "        raise _workspace_error(\n"
              "            \"PGN workspace requires an iterable of games\",\n"
              "            PgnWorkspaceErrorCode.INVALID_DOCUMENT,\n"
              "        ) from exc\n"
          )
          if workspace.count(old_validate) != 1:
              raise SystemExit("expected exact _validate_document prefix once")
          workspace_path.write_text(
              workspace.replace(old_validate, new_validate, 1),
              encoding="utf-8",
          )

          Path(".github/workflows/w1-d06-apply-bounded-model-materialization.yml").unlink()
          PY
      - name: Validate repair before commit
        run: |
          python -m compileall -q acs/pgn_roundtrip.py acs/pgn_workspace.py tests/test_w1_d06_bounded_model_materialization.py
          python -m unittest -v tests.test_w1_d06_bounded_model_materialization tests.test_d06_pgn_roundtrip
          git diff --check
      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(d06): bound model materialization before allocation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
