name: Classroom Join Credential Service

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/classroom_join_credentials.py'
      - 'acs/classroom_livekit_server.py'
      - 'tests/test_classroom_join_credentials.py'
      - 'tests/test_classroom_livekit_server.py'
      - '.github/workflows/classroom-join-credential-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-join-credential-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  join-credential-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact bounded current-Product scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "work/full-product-teacher-education-reachability-20260911"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          test -n "$base"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current Product base $base is not an ancestor of HEAD; synchronize the PR before qualification."
            exit 1
          fi
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          allowed="$(printf '%s\\n' \\
            '.github/workflows/classroom-join-credential-service.yml' \\
            'acs/classroom_join_credentials.py' \\
            'acs/classroom_livekit_server.py' \\
            'tests/test_classroom_join_credentials.py' \\
            'tests/test_classroom_livekit_server.py' | sort)"
          test "$changed" = "$allowed"

      - name: Install pinned LiveKit server token dependency
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-livekit
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest .ci-livekit 'livekit-api==1.2.1'
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          wheel = Path(".ci-livekit/livekit_api-1.2.1-py3-none-any.whl")
          expected = "aa15b0a194c9e8167d4261bc61381682df23f98bc6d77760fcded93d2ce4b4ca"
          actual = sha256(wheel.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"LiveKit wheel digest mismatch: {actual}")
          PY
          python -m pip install --disable-pip-version-check .ci-livekit/livekit_api-1.2.1-py3-none-any.whl
          python -c "from importlib.metadata import version; assert version('livekit-api') == '1.2.1'"

      - name: Compile trusted join-credential boundary
        run: python -m py_compile acs/classroom_join_credentials.py acs/classroom_livekit_server.py tests/test_classroom_join_credentials.py tests/test_classroom_livekit_server.py

      - name: Run join, LiveKit token and canonical media contracts
        run: python -m unittest -v tests.test_classroom_join_credentials tests.test_classroom_livekit_server tests.test_classroom_realtime_media

      - name: Prove server boundary contains no provider secret material
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq '(api[_-]?secret|private[_-]?key|roomadmin[_-]?token)[[:space:]]*=' acs/classroom_join_credentials.py
          grep -Fq 'ClassroomJoinAuthorizationPort' acs/classroom_join_credentials.py
          grep -Fq 'ClassroomJoinTokenIssuerPort' acs/classroom_join_credentials.py
          ! grep -Fq 'os.getenv' acs/classroom_livekit_server.py
          ! grep -Fq 'LIVEKIT_API_SECRET' acs/classroom_livekit_server.py
          grep -Fq 'credentials=<redacted>' acs/classroom_livekit_server.py
          grep -Fq 'can_publish_sources=provider_sources' acs/classroom_livekit_server.py
          grep -Fq 'can_publish_data=True' acs/classroom_livekit_server.py

      - name: Core selftest
        run: python -m acs.selftest
