name: WordDeck DEV02 A001 Homograph Gate

on:
  push:
    branches:
      - worddeck-swarm-dev02-context-sentence-a001
  pull_request:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/**'
      - '.github/workflows/worddeck-swarm-dev02-context-sentence-a001.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: worddeck-dev02-a001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homograph-gate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Build Release warnings as errors
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror

      - name: Run complete self-test suite
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Publish self-contained Windows x64
        run: dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-dev02-a001

      - name: Run published EXE self-test
        shell: pwsh
        run: |
          & .\artifacts\WordDeck-dev02-a001\WordDeck.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cyrillic and spaces path smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'WordDeck омоніми DEV02\Published App'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path '.\artifacts\WordDeck-dev02-a001\*' -Destination $target -Recurse -Force
          & (Join-Path $target 'WordDeck.exe') --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no personal state in publish tree
        shell: pwsh
        run: |
          $bad = Get-ChildItem -LiteralPath '.\artifacts\WordDeck-dev02-a001' -Recurse -File | Where-Object {
            $_.Name -match '^(state|spelling-state|sentence-state|sentence-coach-state)(\.backup)?\.json$' -or
            $_.Name -match '^WordDeck-profile.*\.json$' -or
            $_.FullName -match '[\\/]Backups[\\/]'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "Personal state leaked into publish tree: $($_.FullName)" }
            exit 1
          }

      - name: Download historical attributed EN-UA corpus evidence read-only
        uses: actions/download-artifact@v4
        with:
          name: WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-r3
          path: artifacts/r3-attributed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32573223432

      - name: Verify exact historical SQLite identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sqlite = Get-ChildItem -LiteralPath '.\artifacts\r3-attributed' -Recurse -File -Filter 'WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-v1.sqlite' | Select-Object -First 1
          if (-not $sqlite) { throw 'Attributed EN-UA SQLite corpus artifact was not found.' }
          $sums = Get-ChildItem -LiteralPath '.\artifacts\r3-attributed' -Recurse -File -Filter 'SHA256SUMS.txt' | Select-Object -First 1
          if (-not $sums) { throw 'Attributed corpus SHA256SUMS.txt was not found.' }
          $line = Get-Content -LiteralPath $sums.FullName | Where-Object { $_ -match ([regex]::Escape($sqlite.Name) + '$') } | Select-Object -First 1
          if (-not $line) { throw 'SHA256SUMS.txt does not bind the attributed SQLite file.' }
          $expected = (($line -split '\s+', 2)[0]).Trim().ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $sqlite.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Attributed SQLite hash mismatch: expected $expected actual $actual" }
          "CONTEXT_SQLITE=$($sqlite.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CONTEXT_SQLITE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Remeasure physical-form and stable-ID coverage axes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.\artifacts\context-evidence' | Out-Null
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-context-coverage `
            "$env:CONTEXT_SQLITE" `
            .\artifacts\context-evidence\context-coverage.json `
            "$env:CONTEXT_SQLITE_SHA" `
            tatoeba-en-uk-attributed-ccby-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate ambiguity-safe exact evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rawDoc = Get-Content -LiteralPath '.\artifacts\context-evidence\context-coverage.json' -Raw | ConvertFrom-Json
          $physicalDoc = Get-Content -LiteralPath '.\artifacts\context-evidence\context-coverage.physical-forms.json' -Raw | ConvertFrom-Json
          $stableDoc = Get-Content -LiteralPath '.\artifacts\context-evidence\context-coverage.stable-identities.json' -Raw | ConvertFrom-Json
          $raw = $rawDoc.Payload
          $physical = $physicalDoc.Payload
          $stable = $stableDoc.Payload

          if ($raw.SourceId -ne 'tatoeba-en-uk-attributed-ccby-v1' -or $raw.DatabaseSha256 -ne $env:CONTEXT_SQLITE_SHA) { throw 'Historical evidence identity mismatch.' }
          if ($raw.DictionaryEntryCount -ne 5446 -or -not $raw.ExactOxford5446Verified -or -not $raw.ExactDatabaseIdentityVerified) { throw 'Historical evidence is not bound to exact Oxford 5446 and exact SQLite.' }
          if ($raw.SentenceCount -ne 208408) { throw "Unexpected sentence count: $($raw.SentenceCount)" }
          if ($raw.OneTarget.CoveredEntryCount -ne 4492 -or $raw.TwoTarget.CoveredEntryCount -ne 4469 -or $raw.ThreeTarget.CoveredEntryCount -ne 4362) { throw 'Historical stable-tag participation changed unexpectedly.' }

          if (-not $physical.CanSupportPhysicalLexicalFormCoverageClaim -or $physical.RedistributionApproved) { throw 'Physical-form evidence boundary is invalid.' }
          if ($physical.DictionaryEntryCount -ne 5446 -or $physical.UniqueLexicalFormCount -ge 5446) { throw 'Physical-form denominator did not collapse homographic stable IDs.' }
          if ($physical.AmbiguousLexicalFormCount -le 0 -or $physical.StableIdsInAmbiguousLexicalForms -le $physical.AmbiguousLexicalFormCount) { throw 'Ambiguous lexical-form accounting is missing.' }
          if ($physical.StableTagEvidenceSha256 -ne $rawDoc.EvidenceDigestSha256) { throw 'Physical-form evidence is not digest-bound to the exact stable-tag evidence document.' }
          foreach ($depth in @($physical.OneTarget,$physical.TwoTarget,$physical.ThreeTarget)) {
            if ($depth.CoveredLexicalFormCount + $depth.UncoveredLexicalFormCount -ne $depth.LexicalFormCount) { throw 'Physical lexical coverage does not partition its universe.' }
          }

          if (-not $stable.CanSupportConservativeStableIdentityCoverageClaim -or $stable.RedistributionApproved) { throw 'Stable-ID evidence boundary is invalid.' }
          if ($stable.StableTagEvidenceSha256 -ne $rawDoc.EvidenceDigestSha256) { throw 'Stable-ID evidence is not digest-bound to the exact stable-tag evidence document.' }
          if ($stable.PhysicalFormEvidenceSha256 -ne $physicalDoc.EvidenceDigestSha256) { throw 'Stable-ID evidence is not digest-bound to the exact physical-form evidence document.' }
          foreach ($depth in @($stable.OneTarget,$stable.TwoTarget,$stable.ThreeTarget)) {
            if ($depth.ResolvedStableCoveredEntryCount + $depth.UnresolvedAmbiguousEntryCount + $depth.PhysicalFormUncoveredEntryCount -ne 5446) { throw 'Stable-ID coverage does not partition Oxford 5446.' }
            if ($depth.UnresolvedAmbiguousEntryCount -le 0) { throw 'Homographic stable IDs were not left unresolved.' }
            if ($depth.ResolvedStableCoveredEntryCount -ge $depth.PhysicalFormCoveredEntryCount) { throw 'Ambiguous physical matches still inflate resolved stable-ID coverage.' }
          }

          Write-Host ("Physical forms: total={0}, ambiguous_forms={1}; 1/2/3 covered={2}/{3}/{4}" -f $physical.UniqueLexicalFormCount,$physical.AmbiguousLexicalFormCount,$physical.OneTarget.CoveredLexicalFormCount,$physical.TwoTarget.CoveredLexicalFormCount,$physical.ThreeTarget.CoveredLexicalFormCount)
          Write-Host ("Resolved stable IDs: 1/2/3={0}/{1}/{2}; unresolved homograph IDs={3}" -f $stable.OneTarget.ResolvedStableCoveredEntryCount,$stable.TwoTarget.ResolvedStableCoveredEntryCount,$stable.ThreeTarget.ResolvedStableCoveredEntryCount,$stable.OneTarget.UnresolvedAmbiguousEntryCount)
          Write-Host ("Evidence chain: stable-tag={0}; physical-form={1}; stable-identity={2}" -f $rawDoc.EvidenceDigestSha256,$physicalDoc.EvidenceDigestSha256,$stableDoc.EvidenceDigestSha256)

      - name: Preserve attribution without corpus payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = (Resolve-Path '.\artifacts\r3-attributed').Path
          $evidenceRoot = (Resolve-Path '.\artifacts\context-evidence').Path
          foreach ($name in @('SHA256SUMS.txt','TATOEBA_SENTENCEPACK_NOTICE.md','tatoeba-en-uk-attributed.tsv.manifest.json')) {
            $file = Get-ChildItem -LiteralPath $sourceRoot -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $file) { throw "Required attribution/provenance evidence is missing: $name" }
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $evidenceRoot $name) -Force
          }
          $leak = Get-ChildItem -LiteralPath $evidenceRoot -Recurse -File | Where-Object {
            $_.Extension -in @('.sqlite','.db','.zip') -or $_.Name -match '^sentencepack(?:-runtime)?\.(?:json|json\.gz)$'
          }
          if ($leak) {
            $leak | ForEach-Object { Write-Error "Corpus payload leaked into evidence-only artifact: $($_.FullName)" }
            exit 1
          }

      - name: Upload ambiguity-safe coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-dev02-a001-evidence-${{ github.sha }}
          path: artifacts/context-evidence
          if-no-files-found: error
          retention-days: 14
