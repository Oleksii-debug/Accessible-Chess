name: Takeback Restore Failure Reproduction (QA only)
on:
  push:
    branches:
      - qa/takeback-restore-failure-repro-20261002

permissions:
  contents: read

concurrency:
  group: takeback-restore-failure-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Preserve exact source bytes and isolated QA scope
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
          product=25b6da6eb8bccea95628ecfce5ba81fece1a5666
          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD
          actual="$(git diff --name-only "$product" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/takeback-restore-failure-qa.yml' \
            'tests/test_engine_takeback_restore_failure_qa.py' | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected QA mutation:\n%s\n' "$actual" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/engine_game_session.py)" = 9bdc3d2b2f85bff76d29d0d189a3fb1c10930e6b
          test "$(git rev-parse HEAD:acs/stage1_release_ui_core.py)" = b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6
          git diff --quiet "$product" HEAD -- acs web scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pytest
        run: python -m pip install -q pytest==8.4.2
      - name: Syntax and import
        run: python -m compileall -q acs tests/test_engine_takeback_restore_failure_qa.py
      - name: Exact failing-invariant reproductions and success controls
        run: python -m unittest -v tests.test_engine_takeback_restore_failure_qa
      - name: Adjacent coordinator and real Stage1 regressions
        run: python -m unittest -v tests.test_engine_game_session tests.test_stage1_engine_play_ui
      - name: Independent pytest readback
        run: >-
          python -m pytest -q -rx
          tests/test_engine_takeback_restore_failure_qa.py
          tests/test_engine_game_session.py
          tests/test_stage1_engine_play_ui.py
