name: V2 Current Presentation Privacy Convergence

on:
  push:
    branches:
      - work/full-product-teacher-education-reachability-20260911
  pull_request:
    paths:
      - '.github/workflows/v2-shared-presentation-path-privacy.yml'
      - 'acs/presentation_privacy.py'
      - 'acs/book_webview_projection.py'
      - 'acs/training_webview_projection.py'
      - 'acs/library_webview_projection.py'
      - 'acs/pgn_webview_projection.py'
      - 'tests/test_v2_shared_presentation_path_privacy.py'
      - 'tests/test_v2_library_presentation_path_privacy.py'
      - 'tests/test_v2_pgn_webview_path_privacy.py'

permissions:
  contents: read

concurrency:
  group: v2-current-presentation-privacy-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIVACY_INTEGRATION_SHA: dfac3af0811a0e1abab7132149bfbd8377b04fb5

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained privacy integration and required surfaces
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRIVACY_INTEGRATION_SHA" HEAD
          git diff --check "$PRIVACY_INTEGRATION_SHA" HEAD
          for path in \
            acs/book_webview_projection.py \
            acs/library_webview_projection.py \
            acs/pgn_webview_projection.py \
            acs/presentation_privacy.py \
            acs/training_webview_projection.py \
            tests/test_v2_library_presentation_path_privacy.py \
            tests/test_v2_pgn_webview_path_privacy.py \
            tests/test_v2_shared_presentation_path_privacy.py
          do
            test -s "$path" || {
              printf 'Required retained presentation privacy surface missing: %s\n' "$path" >&2
              exit 1
            }
          done
          echo 'RETAINED_PRESENTATION_PRIVACY_ANCESTRY=PASS'
          echo 'RETAINED_PRESENTATION_PRIVACY_SURFACES=PASS'

      - name: Compile presentation privacy surfaces
        run: >-
          python -m compileall -q
          acs/presentation_privacy.py
          acs/book_webview_projection.py
          acs/training_webview_projection.py
          acs/library_webview_projection.py
          acs/pgn_webview_projection.py
          tests/test_v2_shared_presentation_path_privacy.py
          tests/test_v2_library_presentation_path_privacy.py
          tests/test_v2_pgn_webview_path_privacy.py

      - name: Focused presentation privacy regressions
        run: >-
          python -m unittest -v
          tests.test_v2_shared_presentation_path_privacy
          tests.test_v2_library_presentation_path_privacy
          tests.test_v2_pgn_webview_path_privacy
          tests.test_dev1_books_training_webview_projection
          tests.test_books_training_ui_integration
          tests.test_dev1_library_webview_projection
          tests.test_dev1_pgn_workspace_webview_adapter

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_shared_presentation_path_privacy.py
          tests/test_v2_library_presentation_path_privacy.py
          tests/test_v2_pgn_webview_path_privacy.py
          tests/test_dev1_books_training_webview_projection.py
          tests/test_books_training_ui_integration.py
          tests/test_dev1_library_webview_projection.py
          tests/test_dev1_pgn_workspace_webview_adapter.py

  broad-ubuntu:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
