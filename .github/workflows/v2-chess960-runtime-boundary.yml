name: Accessible Chess V2 Chess960 Runtime Boundary

on:
  push:
    branches:
      - 'work/v2-chess960-runtime-boundary-20260831'
  pull_request:
    paths:
      - '.github/workflows/v2-chess960-runtime-boundary.yml'
      - 'tools/optional/libcbh_json_bridge.cpp'
      - 'tests/test_v2_real_cbh_chess960_record_boundary.py'
      - 'tests/test_v2_chess960_cbv_runtime_inheritance.py'

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-chess960-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STACK_BASE: 9d7833d2b4c05c93b37c7cf7139ea63701d7b73b
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696

jobs:
  real-mixed-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact Product head
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove stacked ownership and exact runtime scope
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STACK_BASE" HEAD
          test "$(git merge-base "$STACK_BASE" HEAD)" = "$STACK_BASE"
          git diff --check "$STACK_BASE" HEAD
          changed="$(git diff --name-only "$STACK_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-chess960-runtime-boundary.yml' \
            'tests/test_v2_chess960_cbv_runtime_inheritance.py' \
            'tests/test_v2_real_cbh_chess960_record_boundary.py' \
            'tools/optional/libcbh_json_bridge.cpp' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected runtime-boundary scope:\n%s\n' "$changed" >&2
            exit 1
          }
          git diff --quiet "$STACK_BASE" HEAD -- acs web docs/automation
          printf 'STACK_BASE=%s\nRUNTIME_HEAD=%s\n' "$STACK_BASE" "$(git rev-parse HEAD)"

      - name: Checkout pinned legal libcbh corpus and backend
        uses: actions/checkout@v4
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned regression dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Build pinned libcbh and runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge
          sha256sum \
            upstream/libcbh/gtest/Chess960Biel/Chess960Biel.cbh \
            upstream/libcbh/gtest/Chess960Biel/Chess960.pgn

      - name: Compile Product and strict oracle
        working-directory: product
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Strict real 188-record mixed Standard plus Chess960 oracle
        working-directory: product
        shell: bash
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_CHESS960_BIEL_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/Chess960Biel
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_v2_real_cbh_chess960_record_boundary 2>&1 | tee chess960-runtime-boundary.log

      - name: Focused ChessBase, CBV, Library, and formats regressions
        working-directory: product
        run: >-
          python -m unittest -v
          tests.test_v2_chess960_cbv_runtime_inheritance
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_chessbase_libcbh_external_fixture
          tests.test_cbv_extractor
          tests.test_cbv_uncbv_external_fixture
          tests.test_v2_chessbase_chess960_capability_boundary
          tests.test_version2_formats_integration
          tests.test_library_import_ui_integration

      - name: Full repository unittest
        working-directory: product
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        working-directory: product
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        working-directory: product
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Default source tree remains free of optional GPL backend binaries
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test ! -e libcbh-json-bridge
          test ! -e libcbh.so
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload exact real-corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-chess960-runtime-boundary-evidence
          path: product/chess960-runtime-boundary.log
          if-no-files-found: error
          retention-days: 7

  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Normalize worktree
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Prove stacked ownership and exact runtime scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STACK_BASE" HEAD
          test "$(git merge-base "$STACK_BASE" HEAD)" = "$STACK_BASE"
          git diff --check "$STACK_BASE" HEAD
          changed="$(git diff --name-only "$STACK_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-chess960-runtime-boundary.yml' \
            'tests/test_v2_chess960_cbv_runtime_inheritance.py' \
            'tests/test_v2_real_cbh_chess960_record_boundary.py' \
            'tools/optional/libcbh_json_bridge.cpp' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$STACK_BASE" HEAD -- acs web docs/automation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned regression dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused Windows ChessBase and Library regressions
        run: >-
          python -m unittest -v
          tests.test_v2_chess960_cbv_runtime_inheritance
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_cbv_extractor
          tests.test_v2_chessbase_chess960_capability_boundary
          tests.test_version2_formats_integration
          tests.test_library_import_ui_integration

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
