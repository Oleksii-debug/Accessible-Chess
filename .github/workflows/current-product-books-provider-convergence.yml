name: Current Product Safety Accessibility Convergence

on:
  pull_request:
    branches:
      - converge/current-cbf-cbi-manifest-pair-20261005-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-safety-accessibility-convergence-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'CURRENT_PRODUCT_COMPLETE_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }

      - name: Prove source heads ancestry and bounded scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SERIAL_REF: converge/current-cbf-cbi-manifest-pair-20261005-ooxple7
          SERIAL_HEAD: d4e864d0f5c3fcddf902b17e5b91313401a96865
          BOOKS_REF: fix/book-provider-gametree-resource-bounds-20261005-sol56
          BOOKS_INITIAL_HEAD: a61a9c44572571f8d2364d9329107e1f42fc9b40
          BOOKS_LEXICAL_HEAD: fb82ce49983d4afa3c5c9831ba70e262094c7030
          BOOKS_HEAD: 1c3893b223772955bc96168331f7842f95507b1b
          LOCAL_PROFILE_REF: fix/local-profile-deep-json-20261005-sol56d8q4
          LOCAL_PROFILE_HEAD: e8b8757ec0c648e22c509115684b887ee42d02f6
          KEYMAP_REF: fix/p0g-keymap-event-identity-20261005-7f3a9c
          KEYMAP_HEAD: ad747245b879027ff116c7f6159e2f9b6911333f
          BOOKS_MERGE: 6de0c2baccb0b71a2187497f2f8402bf28f31928
          LOCAL_PROFILE_MERGE: 690c9d14e3aa5b39d9830e3a8861a0365d200c47
          KEYMAP_MERGE: f2221f9345f09457eb77e904af03a1dd2ed2052d
          PRE_LEXICAL_PRODUCT: 0c18ee1baa5bec8c9d75656597723bd94785df25
          LEXICAL_MERGE: 67a933ec647fc1da2bf188acf9bbb89082abea9c
          PRE_SERIALIZED_PRODUCT: 9edc0ab3ad0df9a927792dff2ab0838f614029d4
          SERIALIZED_MERGE: d4857fcaf1202b4cf59e7139a80f14241bf539dc
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$EVENT_BASE_REF" = "$SERIAL_REF"
          fi

          fetch_exact() {
            ref="$1"
            expected="$2"
            label="$3"
            git fetch --no-tags origin "refs/heads/$ref"
            live="$(git rev-parse FETCH_HEAD)"
            test "$live" = "$expected" || {
              printf '%s_MOVED expected=%s live=%s\n' "$label" "$expected" "$live" >&2
              exit 1
            }
          }

          fetch_exact "$SERIAL_REF" "$SERIAL_HEAD" CURRENT_PRODUCT_SERIAL
          fetch_exact "$BOOKS_REF" "$BOOKS_HEAD" CURRENT_PRODUCT_BOOKS
          fetch_exact "$LOCAL_PROFILE_REF" "$LOCAL_PROFILE_HEAD" CURRENT_PRODUCT_LOCAL_PROFILE
          fetch_exact "$KEYMAP_REF" "$KEYMAP_HEAD" CURRENT_PRODUCT_KEYMAP

          test "$(git show -s --format=%P "$BOOKS_MERGE")" = "$SERIAL_HEAD $BOOKS_INITIAL_HEAD"
          test "$(git show -s --format=%P "$LOCAL_PROFILE_MERGE")" = "b8770e46d0b7b0ba5070b8fff78224bb3341ba7a e90d3735912a3a86f33b1175adcc2d76dfe3011d"
          test "$(git show -s --format=%P "$KEYMAP_MERGE")" = "$LOCAL_PROFILE_MERGE $KEYMAP_HEAD"
          test "$(git show -s --format=%P "$LEXICAL_MERGE")" = "$PRE_LEXICAL_PRODUCT $BOOKS_LEXICAL_HEAD"
          test "$(git show -s --format=%P "$SERIALIZED_MERGE")" = "$PRE_SERIALIZED_PRODUCT $BOOKS_HEAD"
          git merge-base --is-ancestor "$LEXICAL_MERGE" HEAD
          git merge-base --is-ancestor "$SERIALIZED_MERGE" HEAD

          for source in "$SERIAL_HEAD" "$BOOKS_HEAD" "$LOCAL_PROFILE_HEAD" "$KEYMAP_HEAD"; do
            git merge-base --is-ancestor "$source" HEAD
          done

          git diff --check "$SERIAL_HEAD"...HEAD
          changed="$(git diff --name-only "$SERIAL_HEAD"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/book-variation-fen-equivalence.yml' \
            '.github/workflows/bookdocument-constructor-semantic-integrity.yml' \
            '.github/workflows/current-product-books-provider-convergence.yml' \
            '.github/workflows/local-profile-current-apex.yml' \
            'acs/book_epub_import.py' \
            'acs/book_game_content.py' \
            'acs/book_html_import.py' \
            'acs/book_text_import.py' \
            'acs/bookdocument.py' \
            'acs/local_profile.py' \
            'tests/js/p0g_event_aware_announcement_test.js' \
            'tests/test_book_lookup_detached_canonicalization.py' \
            'tests/test_bookdocument.py' \
            'tests/test_local_profile_path_identity.py' \
            'tests/test_local_profile_recursion_boundary.py' \
            'tests/test_v2_book_epub_import.py' \
            'tests/test_v2_book_html_import.py' \
            'tests/test_v2_book_text_import.py' \
            'web/index.html' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected current Product convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/book_game_content.py)" = '5d7d76bc97a429abbb0ad5aab308c71f04b6e0ee'
          test "$(git rev-parse HEAD:tests/test_book_lookup_detached_canonicalization.py)" = 'b9e436e6ad5c555c55442a00af32e0102adc3490'
          test "$(git rev-parse HEAD:.github/workflows/book-variation-fen-equivalence.yml)" = '89efa15154339125e7ee895ea5bb7493c80d83fe'
          test "$(git rev-parse HEAD:acs/bookdocument.py)" = '23249894e2e7d9c3b2c0602515188000ea846a41'
          test "$(git rev-parse HEAD:acs/local_profile.py)" = '96d9b523a93a18eb4cc473ef0c87abee49d84512'
          test "$(git rev-parse HEAD:acs/chessbase_manifest.py)" = '7a91103062b76b541d370ec3a3247974d5cd0b80'
          grep -F 'function announceUserAction(message)' web/index.html >/dev/null
          echo 'CURRENT_PRODUCT_COMPLETE_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged product surfaces
        run: >-
          python -m compileall -q
          acs/book_game_content.py
          acs/bookdocument.py
          acs/book_text_import.py
          acs/book_html_import.py
          acs/book_epub_import.py
          acs/full_product_presenters.py
          acs/pgn_presenter_graph_guard.py
          acs/version2_gametree_resume.py
          acs/chessbase_manifest.py
          acs/local_profile.py

      - name: Execute semantic reading malformed-content persistence and accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_notation
          tests.test_pgn_presenter_graph_safety_current
          tests.test_dev1_pgn_webview_projection
          tests.test_d06_v2_gametree_resume_discard_guard
          tests.test_v2_upgrade_sound_artifact_control
          tests.test_book_lookup_detached_canonicalization
          tests.test_bookdocument
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import
          tests.test_chessbase_manifest_legacy_cbf_pair
          tests.test_portable_launcher_contract
          tests.test_local_profile_recursion_boundary
          tests.test_local_profile_path_identity

      - name: Execute P0-G event identity regression
        run: node tests/js/p0g_event_aware_announcement_test.js

      - name: Execute whole-product core smoke
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
