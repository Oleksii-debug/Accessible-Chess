name: Current Product Engine Status User Copy

on:
  pull_request:
    branches:
      - converge/current-product-fen-books-20261004-sol56
    paths:
      - 'acs/webapp.py'
      - 'tests/test_current_product_engine_status_user_copy.py'
      - '.github/workflows/current-product-engine-status-user-copy.yml'
  push:
    branches:
      - fix/current-product-user-facing-engine-status-20261004-sol56f9k2
  workflow_dispatch:

permissions:
  contents: read

env:
  WEBAPP_BLOB: 880731dcb81e304e208514d531226655b56413ad
  USER_COPY_TEST_BLOB: 5d7f570d44fa41a20cac1d17ae779104b5f9592a

concurrency:
  group: current-product-engine-status-user-copy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-status-user-copy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact current-Product lineage and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git hash-object acs/webapp.py)" = "$WEBAPP_BLOB"
          test "$(git hash-object tests/test_current_product_engine_status_user_copy.py)" = "$USER_COPY_TEST_BLOB"

          base_ref="converge/current-product-fen-books-20261004-sol56"
          git fetch --no-tags origin "$base_ref"
          live_base="$(git rev-parse "origin/$base_ref")"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$PR_BASE_REF" = "$base_ref"
            test -n "$PR_BASE_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$live_base"
          fi

          changed="$(git diff --name-only "$live_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-product-engine-status-user-copy.yml' \
            'acs/webapp.py' \
            'tests/test_current_product_engine_status_user_copy.py' | sort)"
          test "$changed" = "$expected"
          git diff --check "$live_base" HEAD
          git diff --quiet "$live_base" HEAD -- \
            acs/chesscore.py \
            acs/history.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py \
            acs/webapp_keymap.py \
            acs/webapp_keymap_core.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile bounded presentation surfaces
        run: >-
          python -m py_compile
          acs/webapp.py
          tests/test_current_product_engine_status_user_copy.py

      - name: Run shipping user-copy and retained Stage1 regressions
        run: >-
          python -m unittest -v
          tests.test_current_product_engine_status_user_copy
          tests.test_accessible_webui
          tests.test_stage1_release_composition_ui
