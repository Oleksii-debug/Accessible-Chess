name: PGN New Game Full State Qualification

on:
  pull_request:
    branches:
      - fix/pgn-new-game-position-tag-integrity-20260929
    paths:
      - "tests/test_pgn_document_new_game_position_full_state.py"
      - ".github/workflows/pgn-new-game-full-state-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-new-game-full-state-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          git merge-base --is-ancestor "$base" HEAD
          python - <<'PY'
          import subprocess

          base = "${{ github.event.pull_request.base.sha }}"
          expected = {
              ".github/workflows/pgn-new-game-full-state-qualification.yml",
              "tests/test_pgn_document_new_game_position_full_state.py",
          }
          changed = {
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...HEAD"],
                  text=True,
              ).splitlines()
              if line
          }
          if changed != expected:
              raise SystemExit(
                  "unexpected scope: "
                  + repr(sorted(changed))
                  + " expected="
                  + repr(sorted(expected))
              )
          PY
          git diff --check "$base"...HEAD

      - name: Compile qualification surface
        run: >-
          python -m py_compile
          acs/pgn_document.py
          acs/chesscore.py
          acs/position_editor.py
          tests/test_pgn_document_new_game_position_full_state.py

      - name: Run full-state and retained new-game regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_document_new_game_position_full_state
          tests.test_pgn_document_new_game_position_integrity
          tests.test_pgn_document_setup_fen_integrity
          tests.test_pgn_document_context_atomicity
