name: Classroom Collaboration Runtime Composition

on:
  pull_request:
    branches:
      - converge/classroom-collaboration-network-ui-20261003
    paths:
      - 'acs/classroom_collaboration_runtime.py'
      - 'acs/version2_final_product_application.py'
      - 'tests/test_classroom_collaboration_runtime.py'
      - '.github/workflows/classroom-collaboration-runtime-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-collaboration-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked runtime scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "converge/classroom-collaboration-network-ui-20261003"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current collaboration convergence base $base is not an ancestor of HEAD."
            exit 1
          fi
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | LC_ALL=C sort)"
          allowed="$(printf '%s\n'             '.github/workflows/classroom-collaboration-runtime-composition.yml'             'acs/classroom_collaboration_runtime.py'             'acs/version2_final_product_application.py'             'tests/test_classroom_collaboration_runtime.py' | LC_ALL=C sort)"
          test "$changed" = "$allowed"
          echo "CLASSROOM_COLLABORATION_RUNTIME_EXACT_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile runtime composition
        run: >-
          python -m py_compile
          acs/classroom_collaboration_runtime.py
          acs/version2_final_product_application.py
          tests/test_classroom_collaboration_runtime.py

      - name: Prove no ambient credential ownership
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'os\.(environ|getenv)|API_SECRET|API_KEY|STORAGE_SECRET|LIVEKIT_SECRET'             acs/classroom_collaboration_runtime.py
          grep -Fq 'chat_bearer_token_provider' acs/classroom_collaboration_runtime.py
          grep -Fq 'file_bearer_token_provider' acs/classroom_collaboration_runtime.py
          grep -Fq 'ClassroomChatHttpRpcCall' acs/classroom_collaboration_runtime.py
          grep -Fq 'ClassroomFileHttpRpcCall' acs/classroom_collaboration_runtime.py
          echo "CLASSROOM_COLLABORATION_RUNTIME_CREDENTIAL_BOUNDARY=PASS"

      - name: Run whole collaboration stack
        run: >-
          python -m unittest -v
          tests.test_classroom_collaboration_runtime
          tests.test_classroom_collaboration_final_product
          tests.test_classroom_collaboration_webview
          tests.test_classroom_chat_http_endpoint
          tests.test_classroom_chat_rpc
          tests.test_classroom_collaboration_chat_server
          tests.test_classroom_file_http_transport
          tests.test_classroom_file_rpc
          tests.test_classroom_file_server
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
          tests.test_version2_education_class_create

      - name: Run accessible collaboration DOM regressions
        run: |
          node tests/js/classroom_collaboration_surface_dom_test.js
          node tests/js/education_surface_dom_test.js

      - name: Core selftest
        run: python -m acs.selftest
