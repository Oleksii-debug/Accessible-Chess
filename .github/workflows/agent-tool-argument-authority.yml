name: Agent Tool Argument Authority

on:
  pull_request:
    branches:
      - fix/media-agent-tool-result-authority-20261005-sol56h7m3
    paths:
      - acs/agent_tools.py
      - tests/test_agent_tool_result_authority.py
      - .github/workflows/agent-tool-argument-authority.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-tool-argument-authority-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact tool-result parent and bounded argument-authority scope
        shell: bash
        env:
          PARENT_REF: fix/media-agent-tool-result-authority-20261005-sol56h7m3
          PARENT_SHA: f6b535262b72cacf74dcc4c7b56e253005ed32cf
          SOURCE_BLOB: ff029facfb23340ffed18fbd4a0b0e55e1f5e719
          TEST_BLOB: 5455b74ddf95930bc410af0a1a3c259d363e0c4a
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git fetch --no-tags origin "+refs/heads/$PARENT_REF:refs/remotes/origin/tool-argument-parent"
          live_parent="$(git rev-parse refs/remotes/origin/tool-argument-parent)"
          test "$live_parent" = "$PARENT_SHA" || {
            printf 'TOOL_ARGUMENT_PARENT_MOVED expected=%s live=%s\n' "$PARENT_SHA" "$live_parent" >&2
            exit 1
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.ref }}" = "$PARENT_REF"
            git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/tool-argument-live-head"
            test "$(git rev-parse refs/remotes/origin/tool-argument-live-head)" = "$candidate"
          fi

          test "$(git merge-base "$PARENT_SHA" "$candidate")" = "$PARENT_SHA"
          git diff --check "$PARENT_SHA"..."$candidate"
          changed="$(git diff --name-only "$PARENT_SHA"..."$candidate" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/agent-tool-argument-authority.yml' \
            'acs/agent_tools.py' \
            'tests/test_agent_tool_result_authority.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected Agent tool-argument scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/agent_tools.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_agent_tool_result_authority.py)" = "$TEST_BLOB"
          echo 'AGENT_TOOL_ARGUMENT_AUTHORITY_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install retained test dependency
        run: python -m pip install pytest==8.4.2

      - name: Compile exact tool boundary
        run: >-
          python -m py_compile
          acs/agent_tools.py
          tests/test_agent_tool_result_authority.py
          tests/test_crossrepo_runtime_integration.py
          tests/test_chess_agent_tools_crossrepo.py
          tests/test_universal_chess_agent_crossrepo.py

      - name: Execute bounded argument authority and retained Agent regressions
        run: >-
          python -m unittest -v
          tests.test_agent_tool_result_authority
          tests.test_crossrepo_runtime_integration
          tests.test_chess_agent_tools_crossrepo
          tests.test_universal_chess_agent_crossrepo
