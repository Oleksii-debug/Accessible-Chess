name: Section 2 PGN GameTree Closure

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section2-pgn-gametree-${{ github.ref }}
  cancel-in-progress: true

env:
