name: Import History Privacy Current

on:
  pull_request:
    paths:
      - 'acs/acsdb.py'
      - 'acs/import_history_service.py'
      - 'tests/test_dev4_import_history_error_privacy.py'
      - '.github/workflows/import-history-privacy-current.yml'
  push:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/acsdb.py'
      - 'acs/import_history_service.py'
      - 'tests/test_dev4_import_history_error_privacy.py'
      - '.github/workflows/import-history-privacy-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-history-privacy-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Syntax and focused privacy gate
        run: |
          python -m compileall -q acs/acsdb.py acs/import_history_service.py tests/test_dev4_import_history_error_privacy.py
          python -m pytest -q tests/test_dev4_import_history_error_privacy.py tests/test_import_history_service.py tests/test_acsdb.py

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic

      - name: Broad repository pytest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pytest -q tests

      - name: Evidence markers
        shell: bash
        run: |
          echo "QUALIFIED_HEAD=$(git rev-parse HEAD)"
          echo "HUMAN_TESTED=NO"
          echo "NVDA_VERIFIED=NO"
