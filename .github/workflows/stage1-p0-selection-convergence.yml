name: Stage1 P0 Selection Convergence

on:
  pull_request:
    branches:
      - work/final-stage1-source-composition-20260825
    paths:
      - acs/stage1_release_ui.py
      - acs/release_preflight.py
      - acs/settings.py
      - acs/keybindings.py
      - acs/ui_keymap_service.py
      - web/p0_accessibility_runtime.js
      - tests/js/stage1_p0_dynamic_selection_runtime_test.js
      - tests/js/p0_accessibility_runtime_test.js
      - tests/test_stage1_p0_semantic_selection_backport.py
      - tests/test_stage1_saturation_refactor_contract.py
      - tests/test_release_preflight.py
      - tests/test_settings.py
      - tests/test_sound_runtime.py
      - tests/test_stage1_release_composition_ui.py
      - tests/test_keybindings.py
      - tests/test_ui_keymap_service.py
      - .github/workflows/stage1-p0-selection-convergence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-p0-selection-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 040f089e336433c83d64a761656c17065a67f843
  P797_RELEASE_UI_BLOB: d30726c28698fbbeeff6f62a79fc43f0e95321ef
  P797_RUNTIME_BLOB: 645dd5d2c9f240f4577fdd2a654cf277d449d71d
  P797_JS_TEST_BLOB: 9baeb9b2a23bfae7359a0b3235f2176707467531
  P797_PY_TEST_BLOB: 917d9b9420b9537051f879d977d61219140cea8c
  P0G_RUNTIME_TEST_BLOB: 5c1cd7c3c8dfa13365d25491d7b5cf3543d7881e
  INTEGRATED_SATURATION_BLOB: 3ad2ec97def951f67237cc788ee3606bc5b404bf
  INTEGRATED_RELEASE_PREFLIGHT_BLOB: 214c0487f65997d59dd6469a7f6424addb066396
  INTEGRATED_RELEASE_PREFLIGHT_TEST_BLOB: 361cb62f8e9b16462dca967beaaa458a3f8cf269
  P795_SETTINGS_BLOB: 3976f061aa2eaf93760d9629236b14ebb2d4a6e1
  P795_SETTINGS_TEST_BLOB: 53ff44b7ecfdc95848fc5ad0a24823d77de343fa
  P795_SOUND_TEST_BLOB: 6c8dfd857a43ea42283998e458c5b290d1dd82d7
  P795_RELEASE_COMPOSITION_TEST_BLOB: 9e11a0dd7e42f2f646e862496b5eade597e03bea
  P798_KEYBINDINGS_BLOB: 0ed020f5cb5e780ed7a9a1a0c1b8d1d248a61213
  P798_UI_KEYMAP_SERVICE_BLOB: 48cda37d1ab1448d3d5c4de7bd2d9e3d95b502f2
  P798_KEYBINDINGS_TEST_BLOB: 728464c720d99f197eeb3858c30fa9ec0e38df5e
  P798_UI_KEYMAP_SERVICE_TEST_BLOB: de0168b686b4bc5f072147be8e8440ffd0d33f9f
  SOUND_RUNTIME_BLOB: c2b850ef66d19631d1579b815b7ee0aaef64c650
  SOUND_WINDOWS_BLOB: 7ec0d7f5b339f74833a5ec4601c714390eb21829
  STOCKFISH_RUNTIME_BLOB: 23477698de93e7ecb582e9411a3bfacc0976849c
  INDEX_HTML_BLOB: 17803443a815843be3aa1b8c6be1c5abb7e7c888
  STAGE1_BOOTSTRAP_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  BOARD_ACTIONS_BLOB: df5d2b74265bfc38081d2606c2d454ef0320b449

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact integration head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact LF semantics on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git -c core.autocrlf=false checkout HEAD -- .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact owner intake and frozen Stage1 boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          test "$(git rev-parse HEAD:acs/stage1_release_ui.py)" = "$P797_RELEASE_UI_BLOB"
          test "$(git rev-parse HEAD:web/p0_accessibility_runtime.js)" = "$P797_RUNTIME_BLOB"
          test "$(git rev-parse HEAD:tests/js/stage1_p0_dynamic_selection_runtime_test.js)" = "$P797_JS_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/js/p0_accessibility_runtime_test.js)" = "$P0G_RUNTIME_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_stage1_p0_semantic_selection_backport.py)" = "$P797_PY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_stage1_saturation_refactor_contract.py)" = "$INTEGRATED_SATURATION_BLOB"
          test "$(git rev-parse HEAD:acs/release_preflight.py)" = "$INTEGRATED_RELEASE_PREFLIGHT_BLOB"
          test "$(git rev-parse HEAD:tests/test_release_preflight.py)" = "$INTEGRATED_RELEASE_PREFLIGHT_TEST_BLOB"

          test "$(git rev-parse HEAD:acs/settings.py)" = "$P795_SETTINGS_BLOB"
          test "$(git rev-parse HEAD:tests/test_settings.py)" = "$P795_SETTINGS_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_sound_runtime.py)" = "$P795_SOUND_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_stage1_release_composition_ui.py)" = "$P795_RELEASE_COMPOSITION_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/keybindings.py)" = "$P798_KEYBINDINGS_BLOB"
          test "$(git rev-parse HEAD:acs/ui_keymap_service.py)" = "$P798_UI_KEYMAP_SERVICE_BLOB"
          test "$(git rev-parse HEAD:tests/test_keybindings.py)" = "$P798_KEYBINDINGS_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_ui_keymap_service.py)" = "$P798_UI_KEYMAP_SERVICE_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/sound_runtime.py)" = "$SOUND_RUNTIME_BLOB"
          test "$(git rev-parse HEAD:acs/sound_windows.py)" = "$SOUND_WINDOWS_BLOB"
          test "$(git rev-parse HEAD:acs/stockfish_runtime.py)" = "$STOCKFISH_RUNTIME_BLOB"
          test "$(git rev-parse HEAD:web/index.html)" = "$INDEX_HTML_BLOB"
          test "$(git rev-parse HEAD:web/stage1_release_bootstrap.js)" = "$STAGE1_BOOTSTRAP_BLOB"
          test "$(git rev-parse HEAD:web/stage1_board_actions.js)" = "$BOARD_ACTIONS_BLOB"

          changed="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/stage1-p0-selection-convergence.yml'             'acs/keybindings.py'             'acs/release_preflight.py'             'acs/settings.py'             'acs/stage1_release_ui.py'             'acs/ui_keymap_service.py'             'tests/js/p0_accessibility_runtime_test.js'             'tests/js/stage1_p0_dynamic_selection_runtime_test.js'             'tests/test_keybindings.py'             'tests/test_release_preflight.py'             'tests/test_settings.py'             'tests/test_sound_runtime.py'             'tests/test_stage1_p0_semantic_selection_backport.py'             'tests/test_stage1_release_composition_ui.py'             'tests/test_stage1_saturation_refactor_contract.py'             'tests/test_ui_keymap_service.py'             'web/p0_accessibility_runtime.js' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"

          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict' ; then
            echo 'QA strict harness contamination detected' >&2
            exit 1
          fi

      - name: Parse exact shipping scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q acs tests run_accessible_chess.py
          node --check web/stage1_release_bootstrap.js
          node --check web/stage1_board_actions.js
          node --check web/p0_accessibility_runtime.js
          node --check tests/js/stage1_p0_dynamic_selection_runtime_test.js
          node --check tests/js/p0_accessibility_runtime_test.js

      - name: Executable P0 dynamic-selection oracle
        shell: bash
        run: |
          set -euo pipefail
          node tests/js/stage1_p0_dynamic_selection_runtime_test.js
          node tests/js/p0_accessibility_runtime_test.js

      - name: Focused P0 and release composition regressions
        run: >-
          python -m pytest -q
          tests/test_stage1_p0_semantic_selection_backport.py
          tests/test_stage1_saturation_refactor_contract.py
          tests/test_release_preflight.py
          tests/test_issue22_release_contract.py
          tests/test_nvda_p0_contract.py
          tests/test_stage1_webview2_accessibility_boundary.py
          tests/test_stage1_native_menu_action_routing.py
          tests/test_stage1_release_composition_ui.py
          tests/test_webview_keymap_bridge_contract.py
          tests/test_keymap_corruption_security.py
          tests/test_sound_runtime.py
          tests/test_settings.py
          tests/test_keybindings.py
          tests/test_ui_keymap_service.py
          tests/test_stockfish_runtime.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Canonical SELFTEST
        run: python -m acs.selftest

      - name: Complete Stage1 diagnostic
        run: python run_accessible_chess.py --diagnostic
