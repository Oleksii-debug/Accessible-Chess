name: WordDeck MASS120 Course Contracts Gate

on:
  push:
    branches:
      - wd-mass120-109-tech-course-contracts
  pull_request:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/CourseArchitectureContracts.cs'
      - 'WordDeck/CourseArchitectureApplication.cs'
      - 'WordDeckCourseContractsHarness/**'
      - '.github/workflows/worddeck-mass120-109-course-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: worddeck-mass120-109-course-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  course-contracts:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Mark exact tip pending
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: 'pending', context: 'WordDeck MASS120 Course Contracts Gate', description: 'Platform-neutral course-contract gate is running.', target_url: targetUrl });

      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build WordDeck warnings as errors
        shell: pwsh
        run: |
          dotnet restore .\WordDeck\WordDeck.csproj
          dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror

      - name: Build neutral course-contract harness warnings as errors
        shell: pwsh
        run: |
          dotnet restore .\WordDeckCourseContractsHarness\WordDeckCourseContractsHarness.csproj
          dotnet build .\WordDeckCourseContractsHarness\WordDeckCourseContractsHarness.csproj -c Release --no-restore -warnaserror

      - name: Run course-contract architecture tests
        run: dotnet run --project .\WordDeckCourseContractsHarness\WordDeckCourseContractsHarness.csproj -c Release --no-build

      - name: Run existing WordDeck regression self-tests
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Mark exact tip result
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({ owner: context.repo.owner, repo: context.repo.repo, sha: context.sha, state: ok ? 'success' : 'failure', context: 'WordDeck MASS120 Course Contracts Gate', description: ok ? 'Course-contract exact-tip gate passed.' : 'Course-contract exact-tip gate failed.', target_url: targetUrl });
