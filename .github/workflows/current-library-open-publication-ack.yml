name: Current Library Open Publication Ack

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - '.github/workflows/current-library-export-destination-cas.yml'
      - '.github/workflows/current-library-open-publication-ack.yml'
      - 'acs/full_product_actions.py'
      - 'acs/library_export_service.py'
      - 'acs/library_export_webview_projection.py'
      - 'acs/library_webview_bridge.py'
      - 'acs/ui_keymap_adapter.py'
      - 'acs/version2_application.py'
      - 'acs/version2_windows_host_runtime.py'
      - 'acs/version2_windows_library_export.py'
      - 'tests/js/library_export_surface_dom_test.js'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - 'tests/test_library_open_game_publication.py'
      - 'tests/test_v2_windows_host_runtime.py'
      - 'tests/test_v2_windows_library_export_background.py'
      - 'web/full_product_library.js'
      - 'web/version2_release_bootstrap.js'

permissions:
  contents: read

concurrency:
  group: current-library-open-publication-ack-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact live shipping successor and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SHIPPING_REF: converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "${EVENT_BASE_REF:-$SHIPPING_REF}" = "$SHIPPING_REF"

          if [ -n "${{ github.event.pull_request.number }}" ]; then
            git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
            test "$(git rev-parse FETCH_HEAD)" = "$expected_head" || {
              echo "LIBRARY_OPEN_PUBLICATION_SUPERSEDED" >&2
              exit 1
            }
          fi

          git fetch --no-tags origin "+refs/heads/$SHIPPING_REF:refs/remotes/origin/$SHIPPING_REF"
          live_shipping="$(git rev-parse "refs/remotes/origin/$SHIPPING_REF")"
          test "$EVENT_BASE_SHA" = "$live_shipping" || {
            echo "LIBRARY_OPEN_PUBLICATION_BASE_MOVED event=$EVENT_BASE_SHA live=$live_shipping" >&2
            exit 1
          }

          git merge-base --is-ancestor "$live_shipping" HEAD
          test "$(git merge-base "$live_shipping" HEAD)" = "$live_shipping"
          git diff --check "$live_shipping"...HEAD

          changed="$(git diff --name-only "$live_shipping"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-library-export-destination-cas.yml' \
            '.github/workflows/current-library-open-publication-ack.yml' \
            'acs/full_product_actions.py' \
            'acs/library_export_service.py' \
            'acs/library_export_webview_projection.py' \
            'acs/library_webview_bridge.py' \
            'acs/ui_keymap_adapter.py' \
            'acs/version2_application.py' \
            'acs/version2_windows_host_runtime.py' \
            'acs/version2_windows_library_export.py' \
            'tests/js/library_export_surface_dom_test.js' \
            'tests/js/version2_release_bootstrap_dom_test.js' \
            'tests/test_library_open_game_publication.py' \
            'tests/test_v2_windows_host_runtime.py' \
            'tests/test_v2_windows_library_export_background.py' \
            'web/full_product_library.js' \
            'web/version2_release_bootstrap.js' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected Library-open publication scope:\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/full_product_actions.py)" = "ef33a8530e43ae78f6a56a6ecf5ba5f5ae9f4b4f"
          test "$(git rev-parse HEAD:acs/version2_application.py)" = "6b930173a3d015a0ec7cf4c9b7dc1e0ccc416166"
          test "$(git rev-parse HEAD:tests/test_library_open_game_publication.py)" = "9b30495a300227f3343ac631a674cf8d9f7c89fb"
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = "3b61778122cb97a6f0cca8febbb3ccc801c0275b"
          test "$(git rev-parse HEAD:web/full_product_library.js)" = "7fd5a97c9781734399f8cecc604c2a6f2540c3fc"
          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = "fd3ceb1185bf07f996427f0967feedc599eec120"

          echo "LIBRARY_OPEN_PUBLICATION_SHIPPING=$live_shipping"
          echo "LIBRARY_OPEN_PUBLICATION_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile publication boundary and regressions
        run: >-
          python -m compileall -q
          acs/version2_application.py
          tests/test_library_open_game_publication.py
          tests/test_v2_book_training_route_rollback.py
          tests/test_w3_library_dirty_replace_confirmation.py

      - name: Execute browser publication oracle
        shell: bash
        run: |
          set -euo pipefail
          node --check web/version2_release_bootstrap.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Execute Library-open and adjacent publication regressions
        run: >-
          python -m unittest -v
          tests.test_library_open_game_publication
          tests.test_w3_library_dirty_replace_confirmation
          tests.test_v2_book_training_route_rollback
          tests.test_version2_application
          tests.test_version2_release_app

      - name: Core selftest
        run: python -m acs.selftest
