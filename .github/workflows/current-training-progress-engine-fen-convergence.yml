name: Current Training Progress Engine FEN Convergence

on:
  pull_request:
    branches:
      - converge/current-analysis-training-roots-20261004-ooxple7
    paths:
      - 'acs/training_progress_store.py'
      - 'acs/engine_ports.py'
      - 'acs/continuous_analysis.py'
      - 'acs/engine_game_session.py'
      - 'acs/engine_play_service.py'
      - 'tests/test_training_progress_passive_ingress.py'
      - 'tests/test_current_remaining_engine_fen_bounds.py'
      - '.github/workflows/current-training-progress-passive-ingress.yml'
      - '.github/workflows/current-remaining-engine-fen-bounds.yml'
      - '.github/workflows/current-training-progress-engine-fen-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-training-progress-engine-fen-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded intake
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-analysis-training-roots-20261004-ooxple7}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-remaining-engine-fen-bounds.yml' \
            '.github/workflows/current-training-progress-engine-fen-convergence.yml' \
            '.github/workflows/current-training-progress-passive-ingress.yml' \
            'acs/continuous_analysis.py' \
            'acs/engine_game_session.py' \
            'acs/engine_play_service.py' \
            'acs/engine_ports.py' \
            'acs/training_progress_store.py' \
            'tests/test_current_remaining_engine_fen_bounds.py' \
            'tests/test_training_progress_passive_ingress.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Training-progress/Engine-FEN convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile convergence surfaces
        run: >-
          python -m compileall -q
          acs/training.py
          acs/training_progress_store.py
          acs/analysis_service.py
          acs/engine_ports.py
          acs/continuous_analysis.py
          acs/engine_game_session.py
          acs/engine_play_service.py
          tests/test_training_progress_passive_ingress.py
          tests/test_current_remaining_engine_fen_bounds.py

      - name: Execute Training durability and recovery regressions
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_training_progress_passive_ingress
          tests.test_training_snapshot_definition_identity_v4
          tests.test_w2_training_progress_crash_recovery
          tests.test_training_authority_convergence
          tests.test_training_progress_ancestor_authority
          tests.test_current_assisted_training_session_root

      - name: Execute Engine lifecycle and Analysis regressions
        run: >-
          python -m unittest -v
          tests.test_current_remaining_engine_fen_bounds
          tests.test_current_engine_fen_passive_bounds
          tests.test_current_analysis_passive_dto_boundary
          tests.test_current_analysis_provider_resource_bounds
          tests.test_analysis_service
          tests.test_engine_play_service
          tests.test_continuous_analysis
          tests.test_engine_game_session
          tests.test_dev3_engine_assisted_workflows

      - name: Execute retained Board Books regressions
        run: >-
          python -m unittest -v
          tests.test_board_service
          tests.test_board_service_passive_boundary
          tests.test_square_passive_boundary
          tests.test_position_editor_passive_boundary
          tests.test_book_engine_authority_passive_ingress
          tests.test_v2_book_board_workflow
          tests.test_v2_windows_book_board_adapter

      - name: Core selftest
        run: python -m acs.selftest
