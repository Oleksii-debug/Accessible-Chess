name: Local Profile Candidate Full Suite Qualification

on:
  pull_request:
    branches:
      - "feature/local-profile-first-launch-ui-20260929"
    paths:
      - ".github/workflows/local-profile-candidate-full-suite.yml"
      - ".github/workflows/p0-release-critical-triad-convergence.yml"
      - "tests/js/version2_library_open_route_refresh_dom_test.js"
      - "tests/js/version2_release_bootstrap_dom_test.js"
      - "tests/test_p0_release_critical_triad_convergence.py"
      - "tests/test_v2_native_dialog_language.py"
      - "tests/test_version2_composition_publication_boundary.py"
      - "tests/test_version2_composition_startup_cleanup.py"
      - "tests/test_version2_composition_startup_cleanup_current.py"
      - "tests/test_version2_release_accessibility_contract.py"
      - "tests/test_w6_v2_language_owner_current.py"

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove exact #994 base and QA-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          expected_base='84cbc839c81c095264467c9c73ea7977ebf2507b'
          actual_head="$(git rev-parse HEAD)"
          event_base='${{ github.event.pull_request.base.sha }}'
          test "$actual_head" = "$expected_head"
          test "$event_base" = "$expected_base" || {
            printf 'Stale qualification base: expected %s, got %s\n' "$expected_base" "$event_base" >&2
            exit 1
          }
          git cat-file -e "${event_base}^{commit}"
          git merge-base --is-ancestor "$event_base" HEAD
          test "$(git merge-base "$event_base" HEAD)" = "$event_base"
          git diff --check "$event_base" HEAD
          changed="$(git diff --name-only "$event_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/local-profile-candidate-full-suite.yml' \
            '.github/workflows/p0-release-critical-triad-convergence.yml' \
            'tests/js/version2_library_open_route_refresh_dom_test.js' \
            'tests/js/version2_release_bootstrap_dom_test.js' \
            'tests/test_p0_release_critical_triad_convergence.py' \
            'tests/test_v2_native_dialog_language.py' \
            'tests/test_version2_composition_publication_boundary.py' \
            'tests/test_version2_composition_startup_cleanup.py' \
            'tests/test_version2_composition_startup_cleanup_current.py' \
            'tests/test_version2_release_accessibility_contract.py' \
            'tests/test_w6_v2_language_owner_current.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected qualification scope:\n%s\n' "$changed" >&2
            exit 1
          }
          echo "LOCAL_PROFILE_QA_BASE=$event_base"
          echo "LOCAL_PROFILE_QA_HEAD=$actual_head"
          echo "LOCAL_PROFILE_QA_SCOPE=EXACT_ELEVEN_PATHS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Known regression cluster
        run: >-
          python -m unittest -v
          tests.test_v2_native_dialog_language
          tests.test_version2_composition_publication_boundary
          tests.test_version2_composition_startup_cleanup
          tests.test_version2_composition_startup_cleanup_current
          tests.test_version2_release_accessibility_contract
          tests.test_w6_v2_language_owner_current
          tests.test_version2_accessibility_convergence
          tests.test_version2_book_board_refresh_focus_order_evidence
          tests.test_p0_release_critical_triad_convergence

      - name: Full unittest suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Install pinned pytest
        run: python -m pip install pytest==8.4.2

      - name: Full pytest suite
        run: python -m pytest -q tests
