name: Library Export Native Reachability

on:
  pull_request:
    branches:
      - fix/book-progress-backup-recovery-20260927
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_release_app.py'
      - 'tests/test_v2_native_dialog_language.py'
      - '.github/workflows/library-export-native-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-export-native-reachability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact integration topology and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          stacked_branch='fix/book-progress-backup-recovery-20260927'
          product_branch='work/full-product-teacher-education-reachability-20260911'
          minimum_recovery_owner='9cd93b773b876b7af4f5820698621d93cb94d594'
          base_ref='${{ github.event.pull_request.base.ref || '' }}'

          case "$base_ref" in
            "$stacked_branch")
              git fetch --no-tags origin "+refs/heads/$stacked_branch:refs/remotes/origin/$stacked_branch"
              upstream="$(git rev-parse "refs/remotes/origin/$stacked_branch")"
              mode='STACKED_RECOVERY_PARENT'
              ;;
            "$product_branch")
              git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
              upstream="$(git rev-parse "refs/remotes/origin/$product_branch")"
              git merge-base --is-ancestor "$minimum_recovery_owner" "$upstream"
              mode='CURRENT_FULL_PRODUCT'
              ;;
            *)
              echo "unsupported Library export base: $base_ref" >&2
              exit 1
              ;;
          esac

          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD
          echo "LIBRARY_EXPORT_TOPOLOGY=$mode"

          mapfile -t actual < <(git diff --name-only "$upstream" HEAD | LC_ALL=C sort)
          expected_paths=(
            '.github/workflows/library-export-native-reachability.yml'
            'acs/version2_release_app.py'
            'tests/test_v2_library_export_production_composition.py'
            'tests/test_v2_native_dialog_language.py'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)
          test "${actual[*]}" = "${wanted[*]}"

          # The current Product must retain the already-qualified canonical
          # service + trusted delegate. This child owns only production wiring.
          git cat-file -e HEAD:acs/library_export_service.py
          git cat-file -e HEAD:acs/version2_windows_library_export.py

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed composition and current export owners
        run: >-
          python -m py_compile
          acs/version2_release_app.py
          acs/library_export_service.py
          acs/version2_windows_library_export.py
          tests/test_v2_library_export_production_composition.py
          tests/test_v2_native_dialog_language.py

      - name: Run Library export whole-product regressions
        run: >-
          python -m unittest -v
          tests.test_d07_library_export_service
          tests.test_d07_library_export_webview
          tests.test_d07_library_export_reachability
          tests.test_v2_windows_library_export
          tests.test_v2_library_export_dialog_language
          tests.test_v2_library_export_production_composition
          tests.test_v2_native_dialog_language
          tests.test_version2_release_app

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
