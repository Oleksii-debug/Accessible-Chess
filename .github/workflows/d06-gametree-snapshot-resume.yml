name: D06 GameTree Snapshot Resume Current

on:
  push:
    branches:
      - work/d06-gametree-snapshot-resume-20260831
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/gametree_resume.py'
      - 'tests/test_d06_gametree_snapshot_resume.py'
      - '.github/workflows/d06-gametree-snapshot-resume.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d06-gametree-snapshot-resume-current-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_PRODUCT_BASE: 966a33c425470aa7c681914ff357be0aa261b70e
  SOURCE_HEAD: b2be9b74848a06787548adefb4d9f5cce02cf534
  SOURCE_PRODUCT_BLOB: de2e05e7558190785edf268f25c277f7d4292625
  SOURCE_TEST_BLOB: 87e54b3d282ba4c2288737d745d2f29f4ae7076b
  CURRENT_SNAPSHOT_BLOB: ac08a89055372c02d3d15744fd4de5a1fd0059d5
  CURRENT_NAVIGATION_BLOB: 6209c29382105153ae4b22d4d70f9675a931826d
  CURRENT_PGN_ROUNDTRIP_BLOB: a9e29beb7566bc38158354ed9fe617d12d757772
  CURRENT_GAMETREE_BLOB: 102895cb7acb7012cde6d0686ea53b99c33700a6

jobs:
  gametree-resume:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current-product reconvergence and owner isolation
        shell: bash
        run: |
          set -euo pipefail
          for commit in "$CURRENT_PRODUCT_BASE" "$SOURCE_HEAD"; do
            git cat-file -e "${commit}^{commit}" || git fetch --no-tags origin "$commit"
          done
          git merge-base --is-ancestor "$CURRENT_PRODUCT_BASE" HEAD
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          test "$(git rev-parse HEAD^)" = "$CURRENT_PRODUCT_BASE"
          git diff --check "$CURRENT_PRODUCT_BASE" HEAD
          changed="$(git diff --name-only "$CURRENT_PRODUCT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d06-gametree-snapshot-resume.yml' \
            'acs/gametree_resume.py' \
            'tests/test_d06_gametree_snapshot_resume.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/gametree_resume.py)" = "$SOURCE_PRODUCT_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_gametree_snapshot_resume.py)" = "$SOURCE_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/gametree_snapshot.py)" = "$CURRENT_SNAPSHOT_BLOB"
          test "$(git rev-parse HEAD:acs/gametree_navigation.py)" = "$CURRENT_NAVIGATION_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "$CURRENT_PGN_ROUNDTRIP_BLOB"
          test "$(git rev-parse HEAD:acs/gametree.py)" = "$CURRENT_GAMETREE_BLOB"
          for path in \
            acs/version2_application.py \
            acs/version2_release_ui.py \
            run_accessible_chess_v2.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$CURRENT_PRODUCT_BASE:$path")"
          done

      - name: Compile resume layer
        run: >-
          python -m compileall -q
          acs/gametree_resume.py
          tests/test_d06_gametree_snapshot_resume.py

      - name: Focused current D06 persistence regressions
        run: >-
          python -m unittest -v
          tests.test_d06_gametree_snapshot_resume
          tests.test_d06_snapshot_canonical_restore
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_d06_pgn_roundtrip
          tests.test_d06_file_ingress_nag_normalization
          tests.test_d06_real_corpus_recovery
          tests.test_game_identity
          tests.test_gametree
          tests.test_pgn_concurrent_save
          tests.test_version2_formats_integration

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_d06_gametree_snapshot_resume.py
          tests/test_d06_snapshot_canonical_restore.py
          tests/test_d06_gametree_persistence_vertical.py
          tests/test_d06_annotation_insertion_persistence_vertical.py
          tests/test_d06_pgn_roundtrip.py
          tests/test_d06_file_ingress_nag_normalization.py
          tests/test_d06_real_corpus_recovery.py
          tests/test_game_identity.py
          tests/test_gametree.py
          tests/test_pgn_concurrent_save.py
          tests/test_version2_formats_integration.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and final-product diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic
