name: Revised Sections 37-42 Corpus and Visual Contracts
on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'acs/lawful_corpus_registry.py'
      - 'acs/book_docx_import.py'
      - 'acs/version2_application.py'
      - 'acs/version2_windows_native_dialog_ownership.py'
      - 'acs/format_capabilities.py'
      - 'acs/visual_board_contract.py'
      - 'docs/corpus/revised_sections37_40_sources.json'
      - 'docs/automation/REVISED_SECTIONS37_42_PROGRESS_AND_ASSET_PROVENANCE.md'
      - 'web/index.html'
      - 'tests/test_revised_sections37_40_corpus.py'
      - 'tools/revised_section37_real_cc0_readback.py'
      - 'tests/test_revised_section37_live_report_safety.py'
      - 'tests/test_revised_section37_real_book_txt.py'
      - 'tests/test_revised_section37_offline_collection_readback.py'
      - 'tests/test_revised_section38_official_openings_library.py'
      - 'tests/test_revised_section38_stockfish_real_library.py'
      - 'tests/test_revised_section38_docx_book_integration.py'
      - 'tools/revised_section38_stockfish_owner_seed.py'
      - 'tests/test_revised_section38_owner_seed.py'
      - 'tests/test_section0_format_capabilities.py'
      - 'tests/test_revised_section37_38_offline_manifest.py'
      - 'tests/test_revised_section38_real_cbh_oracles.py'
      - 'tools/revised_sections37_38_offline_manifest.py'
      - 'tools/revised_section37_external_book_acquisition.py'
      - 'tests/test_revised_section37_external_book_acquisition.py'
      - 'tools/revised_section37_external_position_acquisition.py'
      - 'tests/test_revised_section37_external_position_acquisition.py'
      - 'tools/revised_section37_release_exclusion.py'
      - 'tests/test_revised_section37_release_exclusion.py'
      - 'tools/revised_section37_cbh_original_family_inventory.py'
      - 'tests/test_revised_section37_cbh_original_family_inventory.py'
      - '.gitattributes'
      - 'tests/real_corpus/**'
      - 'tests/test_revised_sections41_42_design.py'
      - 'tests/test_section15_visual_board_contract.py'
      - '.github/workflows/revised-sections37-42-corpus-visual.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  source-and-presentation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile revised source and existing canonical board
        run: >-
          python -m py_compile
          acs/lawful_corpus_registry.py
          acs/book_docx_import.py
          acs/version2_application.py
          acs/format_capabilities.py
          tests/test_revised_section38_docx_book_integration.py
          tools/revised_section38_stockfish_owner_seed.py
          tests/test_revised_section38_owner_seed.py
          acs/visual_board_contract.py
          tests/test_revised_sections37_40_corpus.py
          tools/revised_section37_real_cc0_readback.py
          tests/test_revised_section37_live_report_safety.py
          tests/test_revised_section37_real_book_txt.py
          tests/test_revised_section37_offline_collection_readback.py
          tests/test_revised_section38_official_openings_library.py
          tests/test_revised_section38_stockfish_real_library.py
          tests/test_revised_section37_38_offline_manifest.py
          tools/revised_sections37_38_offline_manifest.py
          tools/revised_section37_external_book_acquisition.py
          tests/test_revised_section37_external_book_acquisition.py
          tools/revised_section37_external_position_acquisition.py
          tests/test_revised_section37_external_position_acquisition.py
          tools/revised_section37_release_exclusion.py
          tests/test_revised_section37_release_exclusion.py
          tools/revised_section37_cbh_original_family_inventory.py
          tests/test_revised_section37_cbh_original_family_inventory.py
          tests/test_revised_sections41_42_design.py
      - name: Test real source catalog authorization and existing visual authority
        run: >-
          python -m unittest -v
          tests.test_revised_sections37_40_corpus
          tests.test_revised_section37_real_book_txt
          tests.test_revised_section37_offline_collection_readback
          tests.test_revised_section38_official_openings_library
          tests.test_revised_section38_stockfish_real_library
          tests.test_revised_section38_docx_book_integration
          tests.test_revised_section38_owner_seed
          tests.test_section0_format_capabilities
          tests.test_revised_section37_38_offline_manifest
          tests.test_revised_section37_external_book_acquisition
          tests.test_revised_section37_external_position_acquisition
          tests.test_revised_section37_release_exclusion
          tests.test_revised_section37_cbh_original_family_inventory
          tests.test_revised_sections41_42_design
          tests.test_section15_visual_board_contract
      - name: Build exact-checkout offline corpus manifest with real semantic results
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.revised_sections37_38_offline_manifest
      - name: Preserve Windows and Linux offline source/readback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section37-38-offline-manifest-${{ matrix.os }}
          path: revised-sections37-38-offline-manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Test current-plan Section 39 actual-format and false-PASS qualification
        run: python -m unittest -v tests.test_section39_real_format_qualification
      - name: Produce exact-checkout real-file qualification receipt (NOT Section DONE)
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.section39_real_format_qualification
      - name: Preserve actual per-format readback and known unsupported coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section39-real-format-qualification-${{ matrix.os }}
          path: section39-real-format-qualification.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Exercise canonical chess core
        run: python -m acs.selftest

  live-lawful-5000:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Pin real-source decompression dependency
        run: python -m pip install 'zstandard==0.25.0'
      - name: Refuse stale PASS reports after failed live source attempts (offline negative regression)
        run: python -m unittest -v tests.test_revised_section37_live_report_safety
      - name: Actually fetch SHA256-verified CC0 Lichess file and import 5000 real games
        run: python -m tools.v2_library_source_catalog_real_corpus
      - name: Acquire four official SHA-pinned CC0 corpora and parse real samples
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.revised_section37_real_cc0_readback
      - name: Preserve non-private exact corpus qualification facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-section38-39-real-corpus-evidence
          path: |
            source-catalog-real-evidence.json
            revised-section37-live-cc0-readback.json
          if-no-files-found: ignore
          retention-days: 14

  real-cbh-gpl-upstream-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Checkout original pinned GPL licensed external decoder and legal CBH fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1
      - name: Assert immutable source identities and genuine complete fixture families
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C upstream/libcbh rev-parse HEAD)" = "$LIBCBH_COMMIT"
          test -s upstream/libcbh/gtest/Annotation/TestBase.cbh
          test -s upstream/libcbh/gtest/Annotation/TestBaseExport.pgn
          test -s upstream/libcbh/gtest/WithVariations/WithVariations.cbh
          test -s upstream/libcbh/gtest/WithVariations/GamesWithVariations.pgn
          test -s upstream/libcbh/gtest/UnusualStart/UnusualStartBytes.cbh
          test -s upstream/libcbh/gtest/UnusualStart/UnusualStart.pgn
          sha256sum upstream/libcbh/gtest/Annotation/TestBase.cbh upstream/libcbh/gtest/Annotation/TestBaseExport.pgn upstream/libcbh/gtest/WithVariations/WithVariations.cbh upstream/libcbh/gtest/WithVariations/GamesWithVariations.pgn upstream/libcbh/gtest/UnusualStart/UnusualStartBytes.cbh upstream/libcbh/gtest/UnusualStart/UnusualStart.pgn
      - name: Python 3.12 for canonical source
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Inspect genuine complete multi-file ChessBase source and independent PGN oracles (source-only Section 37)
        working-directory: product
        env:
          ACS_37_LIBCBH_ORIGINAL_SOURCE_ROOT: ${{ github.workspace }}/upstream/libcbh
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest -v tests.test_revised_section37_cbh_original_family_inventory
          python -m tools.revised_section37_cbh_original_family_inventory
      - name: Preserve safe source-only complete CBH companion and GPL receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-section37-original-cbh-companions
          path: product/revised-section37-original-cbh-companion-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build pinned GPL decoder externally without packaging it
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge
      - name: Execute real CBH annotations, nested RAV, NAG, ACSDB search, export and restart oracles
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_ANNOTATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/Annotation
          LIBCBH_VARIATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
          LIBCBH_UNUSUAL_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/UnusualStart
        run: |
          python -m py_compile tests/test_revised_section38_real_cbh_oracles.py
          python -m unittest -v tests.test_revised_section38_real_cbh_oracles
      - name: Existing canonical ChessBase decoder/integrity regressions
        working-directory: product
        run: >-
          python -m unittest -v
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_chessbase_libcbh_external_fixture

      - name: Erase GPL decoder binaries and source-only CBH fixtures
        if: always()
        shell: bash
        run: |
          rm -rf -- upstream/libcbh product/build/libcbh
          test ! -e upstream/libcbh
          test ! -e product/build/libcbh

  original-books-test-only-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout original Staunton book
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GITenberg/The-Blue-Book-of-Chess--13-Teaching-the-Rudiments-of-the-Game-and-Giving-an-Analysis-of-All-t__16377
          path: upstream/blue
          persist-credentials: false
      - name: Checkout original Bird historical chess book
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GITenberg/Chess-History-and-Reminiscences_4902
          path: upstream/bird
          persist-credentials: false
      - name: Checkout original Fishburne chess positions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GITenberg/Checkmates-for-Three-Pieces_4542
          path: upstream/checkmates
          persist-credentials: false
      - name: Checkout CC0 chess PDF source without publication
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: lordlinks/Chess_Fundamentals
          path: upstream/pdf
          persist-credentials: false
      - name: Checkout author-attributed GPL chess Markdown source at exact historical commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chastitywhiterose/Chastity-Chess-Chapters
          ref: 69f3b151c8c6230ff1ebb252a24eb09a9e015f60
          path: upstream/markdown
          persist-credentials: false
      - name: Assert exact product SHA and pinned original Git object identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C upstream/blue rev-parse HEAD:16377.txt)" = "d946777f0eaee2b5f8f7a73afb9c1dd104eb4142"
          test "$(git -C upstream/bird rev-parse HEAD:4902.txt)" = "fe18ddf36538952c95c62052b5d05464ca64abe7"
          test "$(git -C upstream/checkmates rev-parse HEAD:4542.txt)" = "ab6af427f4de27d8e98c0cc25e025b1984cc60cb"
          test "$(git -C upstream/pdf rev-parse HEAD:chess_fundamentals.pdf)" = "eab7c13bdd5a21a33fa2bef863781e4c40794c2c"
          test "$(git -C upstream/pdf rev-parse HEAD:LICENSE)" = "0e259d42c996742e9e3cba14c677129b2c1b6311"
          test "$(git -C upstream/markdown rev-parse HEAD)" = "69f3b151c8c6230ff1ebb252a24eb09a9e015f60"
          test "$(git -C upstream/markdown rev-parse HEAD:book/ebook/ChastityChessChapters-ebook.md)" = "67839e7768b2df1e54ce7136f010f93883bdf170"
          test "$(git -C upstream/markdown rev-parse HEAD:LICENSE)" = "f288702d2fa16d3cdf0035b15a9fcbc552cd88e7"
          test "$(git -C upstream/markdown rev-parse HEAD:README.md)" = "1b729a364e62d58718b0fa5dde9f07c0ffe49242"
          for directory in blue bird checkmates; do
            test "$(git -C upstream/$directory rev-parse HEAD:LICENSE)" = "8d062dda262bcdc42d45b861bd796117feb6d0fe"
          done
      - name: Stage verified raw original Git objects into ephemeral test root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-originals/blue source-originals/bird source-originals/checkmates source-originals/capablanca_pdf source-originals/chess_markdown
          git -C upstream/blue show HEAD:16377.txt > source-originals/blue/16377.txt
          git -C upstream/blue show HEAD:LICENSE > source-originals/blue/LICENSE
          git -C upstream/bird show HEAD:4902.txt > source-originals/bird/4902.txt
          git -C upstream/bird show HEAD:LICENSE > source-originals/bird/LICENSE
          git -C upstream/checkmates show HEAD:4542.txt > source-originals/checkmates/4542.txt
          git -C upstream/checkmates show HEAD:LICENSE > source-originals/checkmates/LICENSE
          git -C upstream/pdf show HEAD:chess_fundamentals.pdf > source-originals/capablanca_pdf/chess_fundamentals.pdf
          git -C upstream/pdf show HEAD:LICENSE > source-originals/capablanca_pdf/LICENSE
          git -C upstream/markdown show HEAD:book/ebook/ChastityChessChapters-ebook.md > source-originals/chess_markdown/ChastityChessChapters-ebook.md
          git -C upstream/markdown show HEAD:LICENSE > source-originals/chess_markdown/LICENSE
          git -C upstream/markdown show HEAD:README.md > source-originals/chess_markdown/README.md
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify true external book and license bytes without redistribution
        working-directory: product
        env:
          ACS_37_GITENBERG_ROOT: ${{ github.workspace }}/source-originals
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest -v tests.test_revised_section37_external_book_acquisition
          python -m tools.revised_section37_external_book_acquisition
      - name: Preserve path-free source-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-section37-original-book-evidence
          path: product/revised-section37-original-books-readback.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Erase every original book and license test copy
        if: always()
        shell: bash
        run: |
          rm -rf -- source-originals upstream
          test ! -e source-originals
          test ! -e upstream

  original-epd-fen-licensed-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Accessible Chess candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout original GPL-authored EPD/FEN corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: fsmosca/epd2doc
          path: upstream/epd2doc
          persist-credentials: false
      - name: Validate exact candidate and external immutable source object identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C upstream/epd2doc rev-parse HEAD:7men_human.epd)" = "28b416e56d2aadf65681e9a0b81413bf05e19209"
          test "$(git -C upstream/epd2doc rev-parse HEAD:opening.fen)" = "25044ea22bfc28b41ec46c5d23e090602a9ba662"
          test "$(git -C upstream/epd2doc rev-parse HEAD:LICENSE)" = "f288702d2fa16d3cdf0035b15a9fcbc552cd88e7"
      - name: Stage original EPD/FEN files and full GPL attribution only in temporary runner root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-originals/epd2doc
          git -C upstream/epd2doc show HEAD:7men_human.epd > source-originals/epd2doc/7men_human.epd
          git -C upstream/epd2doc show HEAD:opening.fen > source-originals/epd2doc/opening.fen
          git -C upstream/epd2doc show HEAD:LICENSE > source-originals/epd2doc/LICENSE
      - name: Python 3.12 for canonical provenance implementation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify SHA256, exact bytes, 1110 authentic EPD puzzle records and four genuine FEN positions
        working-directory: product
        env:
          ACS_37_EPD2DOC_ROOT: ${{ github.workspace }}/source-originals
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest -v tests.test_revised_section37_external_position_acquisition
          python -m tools.revised_section37_external_position_acquisition
      - name: Preserve source-only nonprivate exact-checkout puzzle provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-section37-authentic-epd-fen-source-evidence
          path: product/revised-section37-original-epd-fen-source-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Always destroy temporary source and external licensed corpus bytes
        if: always()
        shell: bash
        run: |
          rm -rf -- source-originals upstream
          test ! -e source-originals
          test ! -e upstream
