name: D10 Review Progress Peer CAS

on:
  pull_request:
    paths:
      - 'tests/test_d10_review_progress_peer_cas.py'
      - '.github/workflows/d10-review-progress-peer-cas.yml'
  push:
    branches:
      - 'work/d10-review-progress-peer-cas-20260911'
    paths:
      - 'tests/test_d10_review_progress_peer_cas.py'
      - '.github/workflows/d10-review-progress-peer-cas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d10-review-progress-peer-cas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove qualification-only current-runtime scope
        shell: bash
        env:
          CANONICAL_BASE_SHA: 0b8fa275890cd82565eceece71063cb4353ea8c8
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test -n "${GITHUB_BASE_REF:-}"
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          else
            base="$CANONICAL_BASE_SHA"
          fi
          test "$base" = "$CANONICAL_BASE_SHA"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d10-review-progress-peer-cas.yml' \
            'tests/test_d10_review_progress_peer_cas.py' | sort)"
          test "$changed" = "$expected"

      - name: Compile qualification test
        run: python -m py_compile tests/test_d10_review_progress_peer_cas.py

      - name: Real spawned peer-CAS oracle and store regressions
        run: >-
          python -m pytest -q
          tests/test_d10_review_progress_peer_cas.py
          tests/test_dev3_student_progress_store.py
          tests/test_dev3_student_progress.py

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'
