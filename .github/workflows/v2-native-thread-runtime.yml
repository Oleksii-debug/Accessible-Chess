name: V2 Native UI Thread Runtime

on:
  push:
    branches: [work/full-product-teacher-education-reachability-20260911]
    paths:
      - 'acs/version2_release_ui.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_windows_host_runtime.py'
      - 'acs/version2_windows_file_workflows.py'
      - 'acs/version2_windows_import_event_mailbox.py'
      - 'acs/version2_windows_import_ui_pump.py'
      - 'acs/version2_windows_pgn_streaming_host.py'
      - 'tests/test_version2_api_thread_dispatch.py'
      - 'tests/test_version2_release_ui.py'
      - 'tests/test_version2_release_app.py'
      - 'tests/test_version2_shutdown.py'
      - 'tests/test_w3_windows_file_action_ui_thread_affinity.py'
      - 'tests/test_v2_windows_host_runtime.py'
      - 'tests/test_v2_windows_import_event_mailbox.py'
      - 'tests/test_v2_windows_import_ui_pump.py'
      - 'tests/test_v2_native_thread_runtime_workflow.py'
      - 'scripts/v2_native_thread_oracle.py'
      - '.github/workflows/v2-native-thread-runtime.yml'
  pull_request:
    branches: [integration/current-main-windows-apex-reconvergence-20261004-sol]
    paths:
      - 'acs/version2_release_ui.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_windows_host_runtime.py'
      - 'acs/version2_windows_file_workflows.py'
      - 'acs/version2_windows_import_event_mailbox.py'
      - 'acs/version2_windows_import_ui_pump.py'
      - 'acs/version2_windows_pgn_streaming_host.py'
      - 'tests/test_version2_api_thread_dispatch.py'
      - 'tests/test_version2_release_ui.py'
      - 'tests/test_version2_release_app.py'
      - 'tests/test_version2_shutdown.py'
      - 'tests/test_w3_windows_file_action_ui_thread_affinity.py'
      - 'tests/test_v2_windows_host_runtime.py'
      - 'tests/test_v2_windows_import_event_mailbox.py'
      - 'tests/test_v2_windows_import_ui_pump.py'
      - 'tests/test_v2_native_thread_runtime_workflow.py'
      - 'scripts/v2_native_thread_oracle.py'
      - '.github/workflows/v2-native-thread-runtime.yml'

permissions:
  contents: read

concurrency:
  group: v2-native-thread-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-windows-host:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Bind exact live main-reconverged parent geometry
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_BASE_REF"
            test -n "$PR_HEAD_SHA"
            test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git fetch --no-tags origin "$PR_BASE_REF"
            live_base="$(git rev-parse "origin/$PR_BASE_REF")"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$live_base"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            git diff --check "$live_base" HEAD

            changed="$(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)"
            wanted="$(printf '%s\n' \
              '.github/workflows/v2-native-thread-runtime.yml' \
              '.github/workflows/v2-windows-book-board-adapter.yml' \
              'tests/test_v2_native_thread_runtime_workflow.py' \
              'tests/test_v2_windows_book_board_adapter_workflow.py' | LC_ALL=C sort)"
            test "$changed" = "$wanted"

            git diff --quiet "$live_base" HEAD -- \
              acs/version2_release_ui.py \
              acs/version2_release_app.py \
              acs/version2_windows_host_runtime.py \
              acs/version2_windows_file_workflows.py \
              acs/version2_windows_import_event_mailbox.py \
              acs/version2_windows_import_ui_pump.py \
              acs/version2_windows_pgn_streaming_host.py \
              acs/version2_application.py \
              scripts/v2_native_thread_oracle.py
          else
            parent="$(git rev-parse HEAD^)"
            git cat-file -e "$parent^{commit}"
            git diff --check "$parent" HEAD
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned runtime and verification dependencies
        run: python -m pip install pytest==8.4.2 pywebview==6.2.1 zstandard==0.23.0

      - name: Canonical state across native and browser worker threads
        run: >-
          python -m pytest -q
          tests/test_v2_native_thread_runtime_workflow.py
          tests/test_version2_api_thread_dispatch.py
          tests/test_w3_windows_file_action_ui_thread_affinity.py
          tests/test_version2_release_ui.py
          tests/test_version2_release_app.py
          tests/test_version2_shutdown.py
          tests/test_v2_windows_host_runtime.py
          tests/test_v2_windows_import_event_mailbox.py
          tests/test_v2_windows_import_ui_pump.py

      - name: Real WebView2 source runtime and UI-thread SQLite journey
        timeout-minutes: 3
        run: python -m scripts.v2_native_thread_oracle
