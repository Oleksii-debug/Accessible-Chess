name: Security Wave 1 Product Integration

on:
  pull_request:
    paths:
      - 'run_accessible_chess_v2.py'
      - 'acs/protection_boundary.py'
      - 'acs/protection_locked_ui.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_profile.py'
      - 'acs/version2_upgrade_status_release.py'
      - 'web/protection_locked.html'
      - 'web/protection_locked.js'
      - 'tests/test_security_wave1_product_integration.py'
      - '.github/workflows/security-wave1-product-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1-product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact-head and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check HEAD^
      - name: Install test runner
        run: python -m pip install pytest==8.4.2
      - name: Compile public integration boundary
        run: >-
          python -m py_compile
          run_accessible_chess_v2.py
          acs/protection_boundary.py
          acs/protection_locked_ui.py
          acs/version2_release_app.py
          acs/version2_profile.py
          acs/version2_upgrade_status_release.py
          tests/test_security_wave1_product_integration.py
      - name: Parse locked-shell JavaScript
        run: node --check web/protection_locked.js
      - name: Run wave-1 product regression set
        run: >-
          python -m pytest -q
          tests/test_security_wave1_product_integration.py
          tests/test_version2_release_app.py
      - name: Prove public boundary contains no private implementation import
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'continuum-runtime|Oleksii-debug/continuum|PRIVATE KEY|BEGIN PRIVATE KEY'             acs/protection_boundary.py acs/protection_locked_ui.py web/protection_locked.html web/protection_locked.js
