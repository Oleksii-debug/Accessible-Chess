name: W4 V2 P0 Candidate Artifact Readback

on:
  workflow_run:
    workflows: ['W4 V2 P0 Fresh Windows Candidate']
    branches: [work/full-product-teacher-education-reachability-20260911]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: w4-v2-p0-candidate-readback-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  readback:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'work/full-product-teacher-education-reachability-20260911'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      W4_VERIFIER_COMMIT: 70fa4fd75910d659161abcc8bcd192e9a88a7905
      W4_VERIFIER_BLOB_SHA: 74282656f5a38e198640c35e390128448935cde1
    steps:
      - name: Checkout exact canonical workflow authority from completed run
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Re-prove completed run branch and checked-out authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = 'work/full-product-teacher-education-reachability-20260911'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "W4_READBACK_PRODUCT_AUTHORITY=$actual"

      - name: Materialize immutable W4 artifact verifier
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$W4_VERIFIER_COMMIT"
          git cat-file -e "${W4_VERIFIER_COMMIT}^{commit}"
          actual_blob="$(git rev-parse "$W4_VERIFIER_COMMIT:scripts/verify_w4_candidate_artifact.py")"
          test "$actual_blob" = "$W4_VERIFIER_BLOB_SHA" || {
            printf 'Pinned W4 verifier blob mismatch expected=%s actual=%s\n' "$W4_VERIFIER_BLOB_SHA" "$actual_blob" >&2
            exit 1
          }
          mkdir -p .w4-readback
          git show "$W4_VERIFIER_COMMIT:scripts/verify_w4_candidate_artifact.py" > .w4-readback/verify_w4_candidate_artifact.py
          test -s .w4-readback/verify_w4_candidate_artifact.py
          echo "W4_READBACK_VERIFIER_COMMIT=$W4_VERIFIER_COMMIT"
          echo "W4_READBACK_VERIFIER_BLOB=$actual_blob"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Resolve exact candidate artifact from completed W4 run
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPO']
          run=os.environ['RUN_ID']
          token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run}/artifacts?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload=json.load(response)
          matches=[item for item in payload.get('artifacts', []) if item.get('name') == 'Accessible-Chess-V2-NVDA-test-candidate' and not item.get('expired')]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one non-expired candidate artifact, found {len(matches)}')
          item=matches[0]
          digest=item.get('digest')
          if not isinstance(digest, str) or not digest:
              raise SystemExit('candidate artifact API digest missing')
          out=os.environ['GITHUB_OUTPUT']
          with open(out, 'a', encoding='utf-8') as stream:
              stream.write(f"artifact_id={item['id']}\n")
              stream.write(f"artifact_digest={digest}\n")
          print(f"W4_READBACK_ARTIFACT_ID={item['id']}")
          print(f"W4_READBACK_ARTIFACT_DIGEST={digest}")
          PY

      - name: Download raw outer artifact ZIP from exact completed run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          repo=os.environ['REPO']
          artifact=os.environ['ARTIFACT_ID']
          token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact}/zip',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          max_outer_bytes=300 * 1024 * 1024
          opener=urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
          total=0
          with opener.open(req, timeout=60) as response, open('candidate-artifact.zip', 'wb') as output:
              declared=response.headers.get('Content-Length')
              if declared is not None:
                  try:
                      declared_bytes=int(declared)
                  except ValueError:
                      raise SystemExit('candidate artifact Content-Length is invalid')
                  if declared_bytes > max_outer_bytes:
                      raise SystemExit('candidate artifact exceeds 300 MiB download bound')
              while True:
                  block=response.read(1024 * 1024)
                  if not block:
                      break
                  total += len(block)
                  if total > max_outer_bytes:
                      raise SystemExit('candidate artifact exceeds 300 MiB download bound')
                  output.write(block)
          if total <= 0 or os.path.getsize('candidate-artifact.zip') != total:
              raise SystemExit('downloaded candidate artifact is empty or truncated')
          print(f'W4_RAW_ARTIFACT_DOWNLOAD_BYTES={total}')
          print('W4_RAW_ARTIFACT_DOWNLOAD=PASS')
          PY

      - name: Bind expected Product SHA from completed canonical workflow authority
        id: product
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          sha=os.environ['WORKFLOW_SHA'].lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('completed workflow head_sha is not exact 40-hex')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as stream:
              stream.write(f'product_sha={sha}\n')
          print(f'W4_READBACK_EXPECTED_PRODUCT_SHA={sha}')
          PY

      - name: Recheck live Full Product freshness after build and upload
        shell: bash
        env:
          PRODUCT_SHA: ${{ steps.product.outputs.product_sha }}
        run: |
          set -euo pipefail
          canonical='work/full-product-teacher-education-reachability-20260911'
          git fetch --no-tags origin "$canonical"
          live="$(git rev-parse "origin/$canonical")"
          test "$PRODUCT_SHA" = "$live" || {
            printf 'STALE_W4_CANDIDATE product=%s live=%s\n' "$PRODUCT_SHA" "$live" >&2
            exit 1
          }
          echo "W4_POST_BUILD_LIVE_PRODUCT_SHA=$live"
          echo 'W4_POST_BUILD_FRESHNESS=PASS'

      - name: Independently verify outer artifact, inner package, checksums, P0-F and P0 evidence
        shell: bash
        run: |
          set -euo pipefail
          python .w4-readback/verify_w4_candidate_artifact.py \
            --artifact candidate-artifact.zip \
            --product-sha '${{ steps.product.outputs.product_sha }}' \
            --outer-sha256 '${{ steps.artifact.outputs.artifact_digest }}'
          echo 'W4_EXACT_RUN_ARTIFACT_READBACK=PASS'
          echo 'HUMAN_TESTED=NO'
          echo 'NVDA_VERIFIED=NO'
