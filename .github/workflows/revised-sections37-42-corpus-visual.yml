# Keep the latest exact product SHA when many Section37 collaborators share
# the same PR; old queued runs cannot certify a newer product revision.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-and-presentation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile revised source and existing canonical board
        run: >-
          python -m py_compile
          acs/lawful_corpus_registry.py
          acs/book_docx_import.py
          acs/version2_application.py
          acs/format_capabilities.py
          tests/test_revised_section38_docx_book_integration.py
