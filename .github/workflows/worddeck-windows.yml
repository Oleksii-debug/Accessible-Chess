name: WordDeck Windows build

on:
  push:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/**'
      - 'README-WORDDECK.md'
      - '.github/workflows/worddeck-windows.yml'
  workflow_dispatch:

concurrency:
  group: worddeck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending checkpoint status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'WordDeck Windows authoritative gate',
              description: 'Authoritative Oxford and Windows checkpoint is running.',
              target_url: targetUrl
            });

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate development Tatoeba CC0 pair builder
        run: python .\WordDeck\tools\build_tatoeba_cc0_pairs.py --self-test

      - name: Validate sentence coverage and release-bundle tools
        run: |
          python .\WordDeck\tools\resolve_sentence_coverage_gaps.py --self-test
          python .\WordDeck\tools\resolve_sentence_coverage_gaps.py --output .\artifacts\sentence-coverage-gap-records.tsv
          python .\WordDeck\tools\validate_sentencepack_release_bundle.py --self-test

      - name: Validate frozen Oxford 3000 baseline
        run: |
          python .\WordDeck\tools\validate_oxford3000_baseline_files.py --self-test
          python .\WordDeck\tools\validate_oxford3000_baseline_files.py --report .\artifacts\oxford3000-baseline-integrity.tsv

      - name: Fetch official Oxford membership source
        run: |
          python .\WordDeck\tools\fetch_oxford5000_official_html.py --self-test
          python .\WordDeck\tools\fetch_oxford5000_official_html.py --output .\artifacts\oxford3000-5000-official.html

      - name: Validate official Oxford 5000 inventory completeness
        run: |
          python .\WordDeck\tools\validate_oxford5000_official_inventory.py --self-test
          python .\WordDeck\tools\validate_oxford5000_official_inventory.py --official-html .\artifacts\oxford3000-5000-official.html --report .\artifacts\oxford5000-official-inventory.tsv

      - name: Validate Oxford 5000 canonical extraction and corpus reconciliation
        run: |
          python .\WordDeck\tools\extract_oxford5000_official.py --self-test
          python .\WordDeck\tools\canonicalize_oxford5000_reviewed.py --self-test
          python .\WordDeck\tools\validate_oxford5000_runtime_ledger.py --self-test
          python .\WordDeck\tools\validate_oxford5000_runtime_ledger.py --official-html .\artifacts\oxford3000-5000-official.html --ledger .\artifacts\oxford5000-canonical-runtime.tsv --report .\artifacts\oxford5000-runtime-accounting.tsv --unaccounted .\artifacts\oxford5000-unaccounted.tsv
          python .\WordDeck\tools\validate_oxford5000_additions_qa.py --self-test
          python .\WordDeck\tools\validate_oxford5000_additions_qa.py
          python .\WordDeck\tools\validate_oxford5000_second_pass_slice.py --self-test

      - name: Validate British pronunciation and AudioPack QA tools
        run: |
          python .\WordDeck\tools\validate_pronunciation_overrides.py --self-test --emit-ready .\artifacts\pronunciation-regeneration-request.json
          python .\WordDeck\tools\validate_targeted_audio_artifact.py --self-test
          python .\WordDeck\tools\build_audiopack_manifest.py --self-test

      - name: Restore
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Build
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore

      - name: Validate embedded dictionary
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Publish self-contained EXE
        run: dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-win-x64

      - name: Validate published EXE
        shell: pwsh
        run: |
          $process = Start-Process .\artifacts\WordDeck-win-x64\WordDeck.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Published WordDeck self-test failed with exit code $($process.ExitCode)."
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-win-x64
          path: .\artifacts\WordDeck-win-x64\WordDeck.exe
          if-no-files-found: error

      - name: Upload Oxford 3000 baseline integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-oxford3000-baseline-integrity
          path: .\artifacts\oxford3000-baseline-integrity.tsv
          if-no-files-found: error

      - name: Upload official Oxford 5000 inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-oxford5000-official-inventory
          path: .\artifacts\oxford5000-official-inventory.tsv
          if-no-files-found: error

      - name: Upload canonical Oxford runtime ledger
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-oxford5000-canonical-runtime
          path: .\artifacts\oxford5000-canonical-runtime.tsv
          if-no-files-found: error

      - name: Upload Oxford corpus accounting
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-oxford5000-runtime-accounting
          path: .\artifacts\oxford5000-runtime-accounting.tsv
          if-no-files-found: error

      - name: Upload Oxford unaccounted ledger
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-oxford5000-unaccounted
          path: .\artifacts\oxford5000-unaccounted.tsv
          if-no-files-found: error

      - name: Upload sentence coverage gap records
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-sentence-coverage-gap-records
          path: .\artifacts\sentence-coverage-gap-records.tsv
          if-no-files-found: error

      - name: Upload pronunciation regeneration request
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-pronunciation-regeneration-request
          path: .\artifacts\pronunciation-regeneration-request.json
          if-no-files-found: error

      - name: Publish final checkpoint status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'WordDeck Windows authoritative gate',
              description: succeeded
                ? 'Authoritative Oxford and published EXE gates passed.'
                : 'WordDeck authoritative Oxford/Windows gate failed.',
              target_url: targetUrl
            });
