name: P0 Packaged Document Copy Probe Contract

on:
  pull_request:
    paths:
      - 'scripts/p0_packaged_document_copy_probe.ps1'
      - 'tests/test_p0_packaged_document_copy_probe.py'
      - '.github/workflows/p0-packaged-document-copy-probe-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CURRENT_PRODUCT_BASE: 71548195339865cf00243032e4fe128cbfb62001
  OWNER_HEAD: fix/p0-document-copy-match-counter-20260929
  PROBE_BLOB: 08c343f04b6383445b9360f5cee346d7a4a414a5
  TEST_BLOB: 42b99e5fd252ff0db26609552bc602a411d64397

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Prove exact identity and retain owner bounded-scope fence
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected" || {
            printf 'Expected exact candidate %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          }
          base="$CURRENT_PRODUCT_BASE"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          test "$(git rev-parse HEAD:scripts/p0_packaged_document_copy_probe.ps1)" = "$PROBE_BLOB"
          test "$(git rev-parse HEAD:tests/test_p0_packaged_document_copy_probe.py)" = "$TEST_BLOB"

          head_ref='${{ github.event.pull_request.head.ref }}'
          if test "$head_ref" = "$OWNER_HEAD"; then
            changed="$(git diff --name-only "$base" HEAD | sort)"
            expected_paths="$(printf '%s\n' \
              '.github/workflows/p0-packaged-document-copy-probe-contract.yml' \
              'scripts/p0_packaged_document_copy_probe.ps1' \
              'tests/test_p0_packaged_document_copy_probe.py' | sort)"
            test "$changed" = "$expected_paths" || {
              printf 'Unexpected P0 document-copy owner scope:\n%s\n' "$changed" >&2
              exit 1
            }
            echo 'P0_DOCUMENT_COPY_SCOPE_MODE=OWNER_EXACT'
          else
            echo 'P0_DOCUMENT_COPY_SCOPE_MODE=CONVERGENCE_EXACT_BLOBS'
          fi
          echo "P0_DOCUMENT_COPY_CONTRACT_EXACT_HEAD=$actual"
          echo "P0_DOCUMENT_COPY_CONTRACT_EXACT_BASE=$base"
      - name: Parse PowerShell helper
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/p0_packaged_document_copy_probe.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors | ForEach-Object {Write-Error $_}; exit 1}
          Write-Host 'PACKAGED_DOCUMENT_COPY_PROBE_POWERSHELL_PARSE=PASS'
      - name: Resolve UIAutomation TextPattern endpoint enum on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $start=[System.Windows.Automation.Text.TextPatternRangeEndpoint]::Start
          $end=[System.Windows.Automation.Text.TextPatternRangeEndpoint]::End
          if([string]$start -cne 'Start' -or [string]$end -cne 'End'){
            throw "UIAutomation TextPatternRangeEndpoint runtime resolution mismatch: start=$start end=$end"
          }
          Write-Host 'UIAUTOMATION_TEXTPATTERN_RANGE_ENDPOINT_RUNTIME=PASS'
      - name: Guard native document navigation and real static copy ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          probe = Path("scripts/p0_packaged_document_copy_probe.ps1").read_text(encoding="utf-8")
          required = (
              "$navigationDocument.SetFocus()",
              "AssertProviderFocus $roots 'native document Ctrl+Home'",
              "Native document Ctrl+Home focus landed in an edit control",
              "AssertProductForeground $process 'native document Ctrl+Home'",
              "[AccessibleChessCopyKeys]::Ctrl([byte]0x24)",
              "$navigationWatch.ElapsedMilliseconds -lt 3500",
              "Connected document identity changed during native Ctrl+Home navigation",
              "$documents=$currentDocuments",
              "$isOnscreen=-not [bool]$_.Current.IsOffscreen",
              "$probeRange=$candidatePattern.RangeFromChild($namedTargets[0])",
              "$target.Select()",
              "$activeSelection.CompareEndpoints(",
              "WaitClipboard $selected",
          )
          for token in required:
              if token not in probe:
                  raise SystemExit(f"Missing native document-copy invariant: {token}")
          ordered = (
              "$navigationDocument.SetFocus()",
              "[AccessibleChessCopyKeys]::Ctrl([byte]0x24)",
              "$documents=$currentDocuments",
              "$probeRange=$candidatePattern.RangeFromChild($namedTargets[0])",
              "$target.Select()",
              "$activeSelection.CompareEndpoints(",
              "WaitClipboard $selected",
          )
          if [probe.index(token) for token in ordered] != sorted(probe.index(token) for token in ordered):
              raise SystemExit("Native document navigation/copy order changed")
          print("P0_NATIVE_DOCUMENT_NAVIGATION_COPY_ORDER=PASS")
          PY

      - name: Execute focused contract regression
        run: python -m unittest -v tests.test_p0_packaged_document_copy_probe
