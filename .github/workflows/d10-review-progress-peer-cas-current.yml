name: D10 Review Progress Peer CAS Current

on:
  pull_request:
    paths:
      - 'tests/test_d10_review_progress_peer_cas.py'
      - '.github/workflows/d10-review-progress-peer-cas-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d10-review-progress-peer-cas-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained D10 peer-CAS authority and current PR hygiene
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_HEAD_SHA: 273c4616e6eae13602ac49f6eb7f219b3a7db6ec
          SOURCE_TEST_BLOB: 407b2a68b29be6715fc08ff44c2566e30784cb58
          PRODUCT_STORE_BLOB: cdde3943fcf07f70b21da2c28bc0a984b9dfef2b
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}" || git fetch --no-tags origin "$base"
          git cat-file -e "${SOURCE_HEAD_SHA}^{commit}" || git fetch --no-tags origin "$SOURCE_HEAD_SHA"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" HEAD
          git diff --check "$base" HEAD

          test "$(git rev-parse HEAD:tests/test_d10_review_progress_peer_cas.py)" = "$SOURCE_TEST_BLOB"
          test "$(git rev-parse "$SOURCE_HEAD_SHA:tests/test_d10_review_progress_peer_cas.py")" = "$SOURCE_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/student_progress_store.py)" = "$PRODUCT_STORE_BLOB"
          test "$(git rev-parse "$SOURCE_HEAD_SHA:acs/student_progress_store.py")" = "$PRODUCT_STORE_BLOB"

      - name: Compile qualification test
        run: python -m py_compile tests/test_d10_review_progress_peer_cas.py

      - name: Real spawned peer-CAS oracle and store regressions
        run: >-
          python -m pytest -q
          tests/test_d10_review_progress_peer_cas.py
          tests/test_dev3_student_progress_store.py
          tests/test_dev3_student_progress.py

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'
