name: DEV4 Stage1 Stockfish Runtime Privacy Repair

on:
  pull_request:
    branches:
      - manual5/dev4-stage1-stockfish-runtime-privacy-ci-base-20260823

permissions:
  contents: read

jobs:
  exact-privacy-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve LF semantics on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Prove exact Product parent and narrow repair scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=80720e8125c59a213f278668d599040f2768d553
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          git diff --check "$BASE"...HEAD
          git diff --name-only "$BASE"...HEAD | sort > changed.txt
          printf '%s\n' \
            '.github/workflows/dev4-stage1-stockfish-runtime-privacy-repair.yml' \
            'acs/stockfish_runtime.py' \
            'tests/test_dev3_stockfish_runtime_path_privacy.py' | sort > expected.txt
          diff -u expected.txt changed.txt
      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Existing Stockfish runtime regressions
        run: python -m unittest -v tests.test_stockfish_runtime
      - name: Unchanged DEV3 privacy oracle
        run: python -m unittest -v tests.test_dev3_stockfish_runtime_path_privacy
      - name: Current Stage1 privacy regressions
        run: python -m pytest -q tests/test_stage1_release_path_privacy.py
      - name: Full unittest regression
        run: python -m unittest discover -v tests
      - name: Full pytest regression
        run: python -m pytest -q tests
      - name: Selftest and diagnostic
        shell: bash
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
