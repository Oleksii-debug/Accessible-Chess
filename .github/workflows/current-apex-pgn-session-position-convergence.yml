name: Current Apex PGN Session Position Convergence

on:
  pull_request:
    branches:
      - converge/current-apex-windows-nullmove-import-20261004-ooxple7
    paths:
      - 'acs/version2_pgn_commands.py'
      - 'tests/test_version2_pgn_commands.py'
      - 'acs/pgn_document.py'
      - 'tests/test_pgn_document_new_game_position_integrity.py'
      - '.github/workflows/current-apex-pgn-session-position-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-apex-pgn-session-position-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TARGET_BASE_REF: converge/current-apex-windows-nullmove-import-20261004-ooxple7
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove live parent, exact scope, and source authority
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "$TARGET_BASE_REF"
          live_base="$(git rev-parse "origin/$TARGET_BASE_REF")"
          git cat-file -e "$live_base^{commit}"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$EVENT_BASE_REF" = "$TARGET_BASE_REF"
            git cat-file -e "$EVENT_BASE_SHA^{commit}"
            git merge-base --is-ancestor "$EVENT_BASE_SHA" "$live_base"
          fi

          git diff --check "$live_base" HEAD
          changed="$(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)"
          wanted="$(printf '%s\n' '.github/workflows/current-apex-pgn-session-position-convergence.yml' 'acs/pgn_document.py' 'acs/version2_pgn_commands.py' 'tests/test_pgn_document_new_game_position_integrity.py' 'tests/test_version2_pgn_commands.py' | LC_ALL=C sort)"
          test "$changed" = "$wanted"

          test "$(git rev-parse HEAD:acs/version2_pgn_commands.py)" = 'd449d2352644c859774562628505f88d86acdea2'
          test "$(git rev-parse HEAD:tests/test_version2_pgn_commands.py)" = 'c55399f2f9a795a24124d46a0572824b09bd7567'
          test "$(git rev-parse HEAD:acs/pgn_document.py)" = 'c098f028c9e8811a9c40c682ee5abcbb994dbf4c'
          test "$(git rev-parse HEAD:tests/test_pgn_document_new_game_position_integrity.py)" = 'e7b2e9ebca69b5b13c5a633ca32b125004b35ac4'

      - name: Compile PGN convergence seams
        run: >-
          python -m py_compile
          acs/version2_pgn_commands.py
          acs/pgn_document.py
          tests/test_version2_pgn_commands.py
          tests/test_pgn_document_new_game_position_integrity.py

      - name: PGN command session and application regressions
        run: >-
          python -m unittest -v
          tests.test_version2_pgn_commands
          tests.test_v2_windows_pgn_export
          tests.test_version2_application

      - name: PGN document position and FEN integrity regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_document_new_game_position_integrity
          tests.test_pgn_document_setup_fen_integrity
          tests.test_pgn_document_context_atomicity
          tests.test_pgn_document
          tests.test_dev2_fen_atomicity
          tests.test_position_editor

      - name: Broader PGN and GameTree authority regressions
        run: >-
          python -m unittest -v
          tests.test_gametree
          tests.test_d06_pgn_roundtrip
          tests.test_pgn_concurrent_save
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_export_path_security

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and launch diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
