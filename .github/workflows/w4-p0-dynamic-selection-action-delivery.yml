name: W4 P0 Dynamic Selection and Action Delivery

on:
  push:
    branches:
      - fix/p0-dynamic-selection-p0g-event-delivery-20260913

permissions:
  contents: read

concurrency:
  group: w4-p0-dynamic-selection-action-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Diff hygiene and JavaScript parse
        run: |
          git diff --check c7acfe710ad76127ca39bfc2c024b83cc31831b6 HEAD
          node --check web/p0_accessibility_runtime.js
          node tests/js/p0_accessibility_runtime_test.js
      - name: Focused P0 regressions
        run: >-
          python -m unittest -v
          tests.test_p0_dynamic_selection_action_delivery
          tests.test_p0_semantic_document_copy
          tests.test_v2_board_analysis_hotkey_feedback
          tests.test_v2_book_training_route_rollback
      - name: Full unittest discovery
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Final-product diagnostic
        run: python run_accessible_chess_v2.py --diagnostic
