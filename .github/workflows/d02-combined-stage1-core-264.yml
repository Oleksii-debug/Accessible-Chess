name: D02 Combined Stage1 Canonical Core 264 Matrix — 574d8c7

on:
  push:
    branches:
      - qa/d02-combined-stage1-core-264-574d8c7-20260823
  pull_request:
    branches:
      - release/dev5-stage1-combined-repair-20260823

permissions:
  contents: read

env:
  EXACT_COMBINED_BASE_SHA: 574d8c7344a7490de46ba38498f363395c951019

jobs:
  canonical-core-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout evidence head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Exact combined base and evidence-only diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXACT_COMBINED_BASE_SHA" HEAD)" = "$EXACT_COMBINED_BASE_SHA"
          git diff --check "$EXACT_COMBINED_BASE_SHA" HEAD
          python - <<'PY'
          import os, subprocess
          allowed={
              'tests/test_d02_combined_stage1_candidate_264_matrix.py',
              '.github/workflows/d02-combined-stage1-core-264.yml',
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['EXACT_COMBINED_BASE_SHA'],'HEAD'], text=True
          ).splitlines())
          assert changed == allowed, (changed, allowed)
          print('D02 COMBINED EVIDENCE-ONLY DIFF PASS', sorted(changed))
          PY
      - name: Compile canonical source and matrix
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: D02 exact combined 264-case matrix
        run: python -m unittest -v tests.test_d02_combined_stage1_candidate_264_matrix
      - name: History fail-closed repair regression
        run: python -m unittest -v tests.test_dev2_history_scalar_fail_closed
      - name: Existing D02 and Stage1 canonical focused regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_fen_atomicity
          tests.test_dev2_board_query_invariants
          tests.test_history
          tests.test_ui_review_adapter
          tests.test_position_editor
          tests.test_squares
          tests.test_stage1_saturation_history_stress
          tests.test_stage1_core_full_flow
          tests.test_core_release_contracts
          tests.test_manual5_cross_lane_regression
      - name: Combined Stockfish privacy smoke
        run: >-
          python -m unittest -v
          tests.test_stage1_stockfish_runtime_path_privacy
          tests.test_stockfish_runtime
      - name: Full unittest
        run: python -m unittest discover -v tests
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Canonical selftest
        run: python -m acs.selftest
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic

  canonical-core-windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout evidence head with LF semantics
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact LF source and verify base
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          if((git merge-base $env:EXACT_COMBINED_BASE_SHA HEAD).Trim() -ne $env:EXACT_COMBINED_BASE_SHA){throw 'Exact combined-base ancestry mismatch'}
          git diff --check $env:EXACT_COMBINED_BASE_SHA HEAD
          if($LASTEXITCODE -ne 0){throw 'Diff hygiene failed'}
          $changed=@(git diff --name-only $env:EXACT_COMBINED_BASE_SHA HEAD)
          $allowed=@('.github/workflows/d02-combined-stage1-core-264.yml','tests/test_d02_combined_stage1_candidate_264_matrix.py')
          $extra=@($changed | Where-Object {$_ -notin $allowed})
          if($extra.Count -ne 0 -or $changed.Count -ne 2){throw "Evidence-only diff mismatch: $($changed -join ', ')"}
          'D02 WINDOWS EXACT COMBINED BASE + EVIDENCE-ONLY DIFF PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Compile canonical source and matrix
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: D02 exact combined 264-case matrix
        run: python -m unittest -v tests.test_d02_combined_stage1_candidate_264_matrix
      - name: History fail-closed repair regression
        run: python -m unittest -v tests.test_dev2_history_scalar_fail_closed
      - name: Existing D02 and Stage1 canonical focused regressions
        run: >-
          python -m unittest -v
          tests.test_dev2_fen_atomicity
          tests.test_dev2_board_query_invariants
          tests.test_history
          tests.test_ui_review_adapter
          tests.test_position_editor
          tests.test_squares
          tests.test_stage1_saturation_history_stress
          tests.test_stage1_core_full_flow
          tests.test_core_release_contracts
          tests.test_manual5_cross_lane_regression
      - name: Combined Stockfish privacy smoke
        run: >-
          python -m unittest -v
          tests.test_stage1_stockfish_runtime_path_privacy
          tests.test_stockfish_runtime
      - name: Full unittest
        run: python -m unittest discover -v tests
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Canonical selftest
        run: python -m acs.selftest
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
