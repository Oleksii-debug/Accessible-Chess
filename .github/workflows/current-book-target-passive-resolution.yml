name: Current BookTarget Passive Resolution

on:
  pull_request:
    branches:
      - fix/current-book-document-ingress-passive-20261004-zftrkmo
    paths:
      - 'acs/book_index.py'
      - 'tests/test_book_index.py'
      - '.github/workflows/current-book-target-passive-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-target-passive-resolution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            base_ref="fix/current-book-document-ingress-passive-20261004-zftrkmo"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-book-target-passive-resolution.yml' \
            'acs/book_index.py' \
            'tests/test_book_index.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected BookTarget passive-resolution scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Book target resolution
        run: >-
          python -m compileall -q
          acs/book_index.py
          acs/bookreader.py
          tests/test_book_index.py

      - name: Execute semantic target and reader regressions
        run: >-
          python -m unittest -v
          tests.test_book_index
          tests.test_bookreader
          tests.test_bookreader_snapshot_bounds
          tests.test_dev1_books_training_webview_projection
          tests.test_v2_book_board_workflow

      - name: Core selftest
        run: python -m acs.selftest
