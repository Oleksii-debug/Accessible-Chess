  DOCUMENT_CONTEXT_ATOMICITY_TEST_BLOB: 38031b5d3ceb0e50baf6ed7f0d259c2751255cec
  OPEN_SOURCE_BINDING_TEST_BLOB: e829a1b262ce4be8e2d7601381b442505ec4e6ad

  OFFLINE_QUALIFIER_BLOB: b2c387f1f14074bd368035678c03fe78edb9877e
  OFFLINE_REPORT_BLOB: 04421cdedef8c31c72c7d759e398d56e69dffda3

jobs:
  whole-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove accepted predecessor ancestry and bounded Section-2 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SECTION1_PREDECESSOR_SHA" HEAD)" = "$SECTION1_PREDECESSOR_SHA"
          git diff --check "$SECTION1_PREDECESSOR_SHA"...HEAD
          changed="$(git diff --name-only "$SECTION1_PREDECESSOR_SHA"...HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/section2-pgn-gametree-closure.yml'             'acs/pgn_save_snapshot.py'             'acs/pgn_workspace.py'             'docs/automation/SECTION2_CLOSURE_AUDIT.md'             'tests/test_dev1_pgn_webview_projection.py'             'tests/test_pgn_complete_editing_user_flow.py'             'tests/test_pgn_document_new_game_position_integrity.py'             'tests/test_pgn_document_passive_ingress.py'             'tests/test_pgn_save_snapshot.py'             'tests/test_pgn_workspace.py'             'tests/test_version2_pgn_commands.py' | sort)"
          test "$changed" = "$expected"

      - name: Bind exact inherited PGN GameTree authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "$PGN_ROUNDTRIP_BLOB"
          test "$(git rev-parse HEAD:acs/gametree.py)" = "$GAMETREE_BLOB"
          test "$(git rev-parse HEAD:acs/gametree_legality.py)" = "$GAMETREE_LEGALITY_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_workspace.py)" = "$PGN_WORKSPACE_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_document.py)" = "$PGN_DOCUMENT_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_save_snapshot.py)" = "$PGN_SAVE_SNAPSHOT_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_streaming_import.py)" = "$STREAMING_IMPORT_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_pgn_export.py)" = "$STREAMING_EXPORT_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_webview_bridge.py)" = "$WEBVIEW_BRIDGE_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_workspace_webview_adapter.py)" = "$WEBVIEW_ADAPTER_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_webview_projection.py)" = "$PGN_WEBVIEW_PROJECTION_BLOB"
          test "$(git rev-parse HEAD:acs/full_product_presenters.py)" = "$FULL_PRODUCT_PRESENTERS_BLOB"

          test "$(git rev-parse HEAD:tests/test_v2_pgn_semantic_fidelity.py)" = "$SEMANTIC_FIDELITY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_pgn_roundtrip.py)" = "$STRICT_RECOVERY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_real_corpus_recovery.py)" = "$REAL_RECOVERY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_complete_editing_user_flow.py)" = "$EDITING_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_gametree_accessible_completion.py)" = "$ACCESSIBLE_GAMETREE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_streaming_import.py)" = "$STREAMING_IMPORT_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_pgn_streaming_export.py)" = "$STREAMING_EXPORT_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_save_snapshot.py)" = "$SAVE_SNAPSHOT_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_save_snapshot_cancel.py)" = "$SAVE_CANCEL_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_concurrent_save.py)" = "$CONCURRENT_SAVE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev4_pgn_export_failure_recovery.py)" = "$EXPORT_FAILURE_RECOVERY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev4_pgn_postcommit_cleanup_atomicity.py)" = "$POSTCOMMIT_ATOMICITY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_gametree_snapshot_resume.py)" = "$GAMETREE_SNAPSHOT_RESUME_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_gametree_persistence_vertical.py)" = "$GAMETREE_PERSISTENCE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_v2_gametree_resume_reachability.py)" = "$GAMETREE_RESUME_REACHABILITY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_document_setup_fen_integrity.py)" = "$SETUP_FEN_INTEGRITY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_document_new_game_position_integrity.py)" = "$NEW_GAME_POSITION_INTEGRITY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_document_passive_ingress.py)" = "$PASSIVE_INGRESS_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/js/pgn_surface_dom_test.js)" = "$PGN_DOM_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/js/pgn_tree_keyboard_dom_test.js)" = "$PGN_TREE_KEYBOARD_DOM_BLOB"
          test "$(git rev-parse HEAD:tests/js/pgn_tree_boundary_key_ownership_test.js)" = "$PGN_TREE_KEY_OWNERSHIP_BLOB"
          test "$(git rev-parse HEAD:tests/js/pgn_remaining_keybindings_test.js)" = "$PGN_REMAINING_KEYBINDINGS_JS_BLOB"
          test "$(git rev-parse HEAD:tests/test_full_product_pgn_keybindings.py)" = "$PGN_KEYBINDINGS_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_tree_remaining_keybindings.py)" = "$PGN_TREE_KEYBINDINGS_TEST_BLOB"
          test "$(git rev-parse HEAD:web/full_product_pgn.js)" = "$PGN_WEB_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_workspace.py)" = "$PGN_WORKSPACE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_pgn_commands.py)" = "$VERSION2_PGN_COMMANDS_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev1_pgn_webview_projection.py)" = "$PGN_WEBVIEW_PROJECTION_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_presenter_graph_safety_current.py)" = "$PGN_PRESENTER_GRAPH_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev4_pgn_resource_security.py)" = "$RESOURCE_SECURITY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_document.py)" = "$PGN_DOCUMENT_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_document_context_atomicity.py)" = "$DOCUMENT_CONTEXT_ATOMICITY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_open_source_binding.py)" = "$OPEN_SOURCE_BINDING_TEST_BLOB"
          test "$(git rev-parse HEAD:docs/automation/SECTION2_CLOSURE_AUDIT.md)" = "$SECTION2_AUDIT_BLOB"

          test "$(git rev-parse HEAD:scripts/qualify_pgn_conversion_corpus.py)" = "$OFFLINE_QUALIFIER_BLOB"
          test "$(git rev-parse HEAD:docs/PGN_CONVERSION_REAL_CORPUS_20261005.json)" = "$OFFLINE_REPORT_BLOB"

      - name: Compile Section 2 contract surface
        run: >-
          python -m py_compile
          acs/pgn_roundtrip.py
          acs/gametree.py
          acs/gametree_legality.py
          acs/pgn_workspace.py
          acs/pgn_document.py
          acs/pgn_save_snapshot.py
          acs/pgn_streaming_import.py
          acs/version2_windows_pgn_export.py
          acs/pgn_webview_bridge.py
          acs/pgn_workspace_webview_adapter.py
          acs/pgn_webview_projection.py
          acs/full_product_presenters.py
          scripts/qualify_pgn_conversion_corpus.py

      - name: Execute PGN GameTree editing recovery streaming contract
        run: >-
          python -m unittest -v
          tests.test_v2_pgn_semantic_fidelity
          tests.test_d06_pgn_roundtrip
          tests.test_d06_real_corpus_recovery
          tests.test_pgn_complete_editing_user_flow
          tests.test_gametree_accessible_completion
          tests.test_pgn_streaming_import
          tests.test_v2_pgn_streaming_export
          tests.test_pgn_save_snapshot
          tests.test_pgn_save_snapshot_cancel
          tests.test_pgn_concurrent_save
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_postcommit_cleanup_atomicity
          tests.test_d06_gametree_snapshot_resume
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_v2_gametree_resume_reachability
          tests.test_pgn_document_setup_fen_integrity
          tests.test_pgn_document_new_game_position_integrity
          tests.test_pgn_document_passive_ingress
          tests.test_pgn_workspace
          tests.test_pgn_document
          tests.test_version2_pgn_commands
          tests.test_pgn_open_source_binding
          tests.test_pgn_document_context_atomicity
          tests.test_dev1_pgn_webview_projection
          tests.test_pgn_presenter_graph_safety_current
          tests.test_dev4_pgn_resource_security
          tests.test_full_product_pgn_keybindings
          tests.test_pgn_tree_remaining_keybindings

      - name: Execute accessible PGN browser and tree keyboard DOM contracts
        run: >-
          node tests/js/pgn_surface_dom_test.js
          && node tests/js/pgn_tree_keyboard_dom_test.js
          && node tests/js/pgn_tree_boundary_key_ownership_test.js
          && node tests/js/pgn_remaining_keybindings_test.js

      - name: Core chess selftest
        run: python -m acs.selftest

  lawful-multisource-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install qualified corpus decompressor
        run: python -m pip install -q zstandard==0.23.0

      - name: Materialize exact pinned dual-source QA authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HISTORICAL_CORPUS_HEAD"
          test "$(git rev-parse "$HISTORICAL_CORPUS_HEAD:scripts/pgn_real_corpus_oracle.py")" = "$HISTORICAL_CORPUS_ORACLE_BLOB"
          test "$(git rev-parse "$HISTORICAL_CORPUS_HEAD:scripts/pgn_real_corpus_session_oracle.py")" = "$HISTORICAL_SESSION_ORACLE_BLOB"
          git show "$HISTORICAL_CORPUS_HEAD:scripts/pgn_real_corpus_oracle.py" > scripts/pgn_real_corpus_oracle.py
          git show "$HISTORICAL_CORPUS_HEAD:scripts/pgn_real_corpus_session_oracle.py" > scripts/pgn_real_corpus_session_oracle.py
          python -m py_compile scripts/pgn_real_corpus_oracle.py scripts/pgn_real_corpus_session_oracle.py
          python -m scripts.pgn_real_corpus_session_oracle --selftest

      - name: Qualify two pinned lawful sources through canonical PGN and recovery
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn_real_corpus_session_oracle --games-per-corpus 2000 --batch-size 250 2>&1 | tee section2-dual-source.txt
          grep -F '"sampled_records_total": 4000' section2-dual-source.txt
          grep -F 'lichess-standard-rated-2013-01' section2-dual-source.txt
          grep -F 'lichess-broadcast-2026-02' section2-dual-source.txt
          grep -F 'PGN REAL CORPUS SESSION ROUND-TRIP PASS' section2-dual-source.txt

      - name: Build a verified 1000-game CC0 sample from the pinned archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .section2-corpus
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from scripts.pgn_real_corpus_oracle import CORPORA, _download_verified, _open_zstd_text, iter_complete_records

          root = Path(".section2-corpus")
          spec = CORPORA[0]
          archive = root / "source.pgn.zst"
          sample = root / "sample-1000.pgn"
          _download_verified(spec, archive)
          source, reader, text = _open_zstd_text(archive)
          try:
              records = list(iter_complete_records(text, limit=1000))
          finally:
              text.close()
              try:
                  reader.close()
              finally:
                  source.close()
          if len(records) != 1000:
              raise AssertionError(f"expected 1000 records, got {len(records)}")
          payload = ("\n".join(record.rstrip() for record in records) + "\n").encode("utf-8")
          sample.write_bytes(payload)
          digest = hashlib.sha256(payload).hexdigest()
          Path(".section2-corpus/sample.sha256").write_text(digest, encoding="ascii")
          print(f"SECTION2_CC0_SAMPLE_SHA256={digest}")
          PY

      - name: Qualify real Library import restart search export round-trip
        shell: bash
        run: |
          set -euo pipefail
          digest="$(cat .section2-corpus/sample.sha256)"
          python scripts/qualify_pgn_conversion_corpus.py             .section2-corpus/sample-1000.pgn             --expect-source-sha256 "$digest"             --expected-games 1000 2>&1 | tee section2-library-roundtrip.txt
          grep -F '"library_restart_search_export": "PASS"' section2-library-roundtrip.txt
          grep -F '"sqlite_integrity": "ok"' section2-library-roundtrip.txt
          grep -F '"source_unchanged": true' section2-library-roundtrip.txt

      - name: Remove materialized QA-only scripts
        if: always()
        shell: bash
        run: |
          rm -f scripts/pgn_real_corpus_oracle.py scripts/pgn_real_corpus_session_oracle.py

      - name: Core chess selftest after corpus qualification
        run: python -m acs.selftest
