name: Classroom Prepared Position Deployment

on:
  push:
    branches:
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - 'acs/classroom_prepared_position_deployment.py'
      - 'tests/test_classroom_prepared_position_deployment.py'
      - '.github/workflows/classroom-prepared-position-deployment.yml'
  pull_request:
    paths:
      - 'acs/classroom_prepared_position_deployment.py'
      - 'tests/test_classroom_prepared_position_deployment.py'
      - '.github/workflows/classroom-prepared-position-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-prepared-position-deployment-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prepared-position-deployment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
      FOCUSED_BASE_REF: converge/books-training-owner-current-20261004-zftrkmo
      INTEGRATED_HEAD: e84e164bb58033ca2df9a129df30baca091c166a
      SOURCE_BLOB: d760cf1a6c7e900fdc1f607c6bc4524510198948
      TEST_BLOB: 1495f03e4dae89284afc4cb7f72b2ddd4a6741b2
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Prove deployment authority and focused scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "$INTEGRATED_HEAD^{commit}"
          git merge-base --is-ancestor "$INTEGRATED_HEAD" HEAD
          test "$(git hash-object acs/classroom_prepared_position_deployment.py)" = "$SOURCE_BLOB"
          test "$(git hash-object tests/test_classroom_prepared_position_deployment.py)" = "$TEST_BLOB"
          if [ "${EVENT_BASE_REF:-}" = "$FOCUSED_BASE_REF" ]; then
            test -n "${EVENT_BASE_SHA:-}"
            git cat-file -e "$EVENT_BASE_SHA^{commit}"
            git diff --check "$EVENT_BASE_SHA" HEAD
            mapfile -t actual < <(git diff --name-only "$EVENT_BASE_SHA" HEAD | LC_ALL=C sort)
            expected=(
              '.github/workflows/classroom-prepared-position-deployment.yml'
              'acs/classroom_prepared_position_deployment.py'
              'tests/test_classroom_prepared_position_deployment.py'
            )
            if [[ "${actual[*]}" != "${expected[*]}" ]]; then
              printf 'Unexpected prepared-position focused scope.\nExpected:\n'
              printf '  %s\n' "${expected[@]}"
              printf 'Actual:\n'
              printf '  %s\n' "${actual[@]}"
              exit 1
            fi
          fi
          echo 'CLASSROOM_PREPARED_POSITION_AUTHORITY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile deployment boundary
        run: >-
          python -m py_compile
          acs/classroom_prepared_position_deployment.py
          tests/test_classroom_prepared_position_deployment.py

      - name: Run deployment and adjacent authority contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_prepared_position_deployment
          tests.test_teaching_session
          tests.test_d10_prepared_position_durability
          tests.test_education_workspace

      - name: Run core selftest
        run: python -m acs.selftest
