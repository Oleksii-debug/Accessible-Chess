name: Accessible Chess Integration Core

on:
  workflow_dispatch:
  push:
    branches:
      - integration/accessible-chess-next
      - integration/data-sync-*

permissions:
  contents: read

jobs:
  source-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified 0.3.3 functional baseline
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, re, zipfile
          ordered = [
              'build_snapshot_exact/group00.b64',
              'build_snapshot_exact/group01.b64',
              'build_parts10k/part04.b64',
              'build_parts10k/part05.b64',
              'build_parts10k/part06.b64',
              'build_parts10k/part07.b64',
          ]
          chunks = []
          for name in ordered:
              path = pathlib.Path(name)
              if not path.exists():
                  raise SystemExit(f'Missing source chunk: {name}')
              chunks.append(path.read_text(encoding='utf-8'))
          encoded = re.sub(r'[^A-Za-z0-9+/=]', '', ''.join(chunks))
          if len(encoded) != 77128:
              raise SystemExit(f'Unexpected Base64 length: {len(encoded)}')
          payload = base64.b64decode(encoded)
          if len(payload) != 57844:
              raise SystemExit(f'Source ZIP size mismatch: {len(payload)}')
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'cb0a89778b436cdf44c42e3207ef9638160a992b372156bc4d901391717a1e6a'
          if digest != expected:
              raise SystemExit(f'Source ZIP hash mismatch: {digest}')
          pathlib.Path('stage1_source.zip').write_bytes(payload)
          with zipfile.ZipFile('stage1_source.zip') as archive:
              archive.extractall('work')
          PY
      - name: Apply integrated overlays
        run: |
          mkdir -p work/acs work/web work/tests
          for file in \
            webapp.py analysis_service.py history.py keybindings.py notation.py \
            engine_ports.py engine_play_service.py clock_service.py gametree.py \
            acsdb.py import_contract.py import_registry.py bookdocument.py chessbase_adapter.py
          do
            cp "acs/$file" "work/acs/$file"
          done
          cp web/index.html work/web/index.html
          cp web/keybindings.json work/web/keybindings.json
          for file in \
            test_accessible_webui.py test_analysis_service.py test_nvda_p0_contract.py \
            test_data_integration.py test_chessbase_adapter.py test_import_registry.py \
            test_architecture.py test_history.py test_keybindings.py test_notation.py \
            test_engine_play_service.py test_clock_service.py
          do
            cp "tests/$file" "work/tests/$file"
          done
          cp run_accessible_chess.py work/run_accessible_chess.py
      - name: Compile integrated Python modules
        working-directory: work
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Architecture boundary gate
        working-directory: work
        run: python -m unittest -v tests.test_architecture
      - name: Data and history integration gate
        working-directory: work
        run: python -m unittest -v tests.test_data_integration tests.test_history
      - name: Import registry and read-only adapter gates
        working-directory: work
        run: python -m unittest -v tests.test_import_registry tests.test_chessbase_adapter
      - name: Engine service contract gates
        working-directory: work
        run: python -m unittest -v tests.test_analysis_service tests.test_engine_play_service tests.test_clock_service
      - name: Remappable actions and notation gates
        working-directory: work
        run: python -m unittest -v tests.test_keybindings tests.test_notation
      - name: Accessible Web UI gate
        working-directory: work
        run: python -m unittest -v tests.test_accessible_webui
      - name: NVDA P0 semantic contract gate
        working-directory: work
        run: python -m unittest -v tests.test_nvda_p0_contract
      - name: Baseline diagnostic
        working-directory: work
        run: python run_accessible_chess.py --diagnostic
