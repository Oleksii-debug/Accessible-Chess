name: Current Settings BookReader Resource Convergence

on:
  pull_request:
    branches:
      - converge/current-bookreader-training-resource-20261004-sol56n3q8
    paths:
      - '.github/workflows/current-settings-bookreader-resource-convergence.yml'
      - 'acs/settings.py'
      - 'tests/test_settings_corruption_security.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-settings-bookreader-resource-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live two-parent Product geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_BRANCH: converge/current-bookreader-training-resource-20261004-sol56n3q8
          SETTINGS_BRANCH: fix/settings-json-bounds-20261004-sol56r5n2
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          base_ref="${EVENT_BASE_REF:-$BASE_BRANCH}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi

          git fetch --no-tags origin "+refs/heads/$SETTINGS_BRANCH:refs/remotes/origin/$SETTINGS_BRANCH"
          live_settings="$(git rev-parse "refs/remotes/origin/$SETTINGS_BRANCH")"

          git merge-base --is-ancestor "$live_base" HEAD
          git merge-base --is-ancestor "$live_settings" HEAD

          convergence="$(git rev-parse HEAD^)"
          parents="$(git show -s --format=%P "$convergence")"
          test "$parents" = "$live_base $live_settings"

          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-settings-bookreader-resource-convergence.yml' \
            'acs/settings.py' \
            'tests/test_settings_corruption_security.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected Settings/resource convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile convergence surfaces
        run: >-
          python -m compileall -q
          acs/settings.py
          tests/test_settings.py
          tests/test_settings_corruption_security.py
          tests/test_settings_stale_writer_current.py
          tests/test_bookreader_revision_barriers_current.py
          tests/test_training_progress_json_prehash_bounds_current.py

      - name: Execute Settings persistence and hostile JSON regressions
        run: >-
          python -m unittest -v
          tests.test_settings
          tests.test_settings_corruption_security
          tests.test_settings_stale_writer_current
          tests.test_settings_private_temp_identity_current
          tests.test_settings_read_identity_current

      - name: Execute retained Book Training recovery and application regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument_total_text_budget_current
          tests.test_bookreader_revision_barriers_current
          tests.test_bookreader
          tests.test_training_progress_json_prehash_bounds_current
          tests.test_w2_training_progress_crash_recovery
          tests.test_book_training_passive_roots_current
          tests.test_version2_training_current_runtime
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
