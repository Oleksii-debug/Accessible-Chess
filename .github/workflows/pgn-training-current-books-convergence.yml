name: PGN Training Current Books Convergence

on:
  pull_request:
    branches:
      - converge/pgn-position-current-books-20261003
    paths:
      - '.github/workflows/pgn-training-current-books-convergence.yml'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - 'acs/full_product_presenters.py'
      - 'acs/training_webview_projection.py'
      - 'acs/version2_application.py'
      - 'acs/version2_training_workspace.py'
      - 'tests/js/books_training_surface_dom_test.js'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - 'tests/test_dev1_full_product_ui_packages.py'
      - 'tests/test_v2_book_training_route_rollback.py'
      - 'tests/test_v2_book_transaction_current_runtime.py'
      - 'tests/test_w3_p0f_starter_books_training_content.py'
      - 'web/full_product_books_training.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-training-current-books-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PGN_PARENT_SHA: bdee46155a550edf5b9855405fcfa6f0c812711f
      TRAINING_PARENT_SHA: ce53c7b3e2cb1dfc025fabb04b725b45e0bb1c57
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact serial parents and bounded child scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          git fetch --no-tags origin \
            converge/pgn-position-current-books-20261003 \
            fix/training-continue-render-atomicity-20260929

          live_pgn="$(git rev-parse refs/remotes/origin/converge/pgn-position-current-books-20261003)"
          live_training="$(git rev-parse refs/remotes/origin/fix/training-continue-render-atomicity-20260929)"
          test "$live_pgn" = "$PGN_PARENT_SHA"
          test "$live_training" = "$TRAINING_PARENT_SHA"
          git merge-base --is-ancestor "$PGN_PARENT_SHA" HEAD
          git merge-base --is-ancestor "$TRAINING_PARENT_SHA" HEAD
          git diff --check "$PGN_PARENT_SHA" HEAD

          mapfile -t actual < <(git diff --name-only "$PGN_PARENT_SHA" HEAD | LC_ALL=C sort)
          expected_paths=(
            '.github/workflows/d01-pgn-workspace-webview.yml'
            '.github/workflows/pgn-training-current-books-convergence.yml'
            'acs/full_product_presenters.py'
            'acs/training_webview_projection.py'
            'acs/version2_application.py'
            'acs/version2_training_workspace.py'
            'tests/js/books_training_surface_dom_test.js'
            'tests/test_dev1_books_training_webview_projection.py'
            'tests/test_dev1_full_product_ui_packages.py'
            'tests/test_v2_book_training_route_rollback.py'
            'tests/test_v2_book_transaction_current_runtime.py'
            'tests/test_w3_p0f_starter_books_training_content.py'
            'web/full_product_books_training.js'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)
          test "${actual[*]}" = "${wanted[*]}"

      - name: Prove exact non-conflicting owner blobs
        shell: bash
        run: |
          set -euo pipefail

          training_paths=(
            acs/full_product_presenters.py
            acs/training_webview_projection.py
            acs/version2_training_workspace.py
            tests/js/books_training_surface_dom_test.js
            tests/test_dev1_books_training_webview_projection.py
            tests/test_dev1_full_product_ui_packages.py
            tests/test_v2_book_training_route_rollback.py
            tests/test_v2_book_transaction_current_runtime.py
            tests/test_w3_p0f_starter_books_training_content.py
            web/full_product_books_training.js
          )
          for path in "${training_paths[@]}"; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$TRAINING_PARENT_SHA:$path")"
          done

          pgn_paths=(
            acs/full_product_actions.py
            acs/full_product_native_menu.py
            acs/pgn_document.py
            acs/version2_release_app.py
            tests/test_pgn_document_new_game_position_integrity.py
            tests/test_pgn_position_new_document_reachability.py
            tests/test_version2_application.py
            .github/workflows/pgn-document-new-game-position-integrity.yml
            .github/workflows/pgn-position-new-document-reachability.yml
            .github/workflows/version2-windows-composition.yml
          )
          for path in "${pgn_paths[@]}"; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$PGN_PARENT_SHA:$path")"
          done

      - name: Compile shared application and domain surfaces
        run: >-
          python -m py_compile
          acs/version2_application.py
          acs/version2_training_workspace.py
          acs/training_webview_projection.py
          acs/pgn_document.py
          tests/test_pgn_position_new_document_reachability.py
          tests/test_v2_book_training_route_rollback.py
          tests/test_v2_book_transaction_current_runtime.py

      - name: Run PGN and Training integration contracts
        run: >-
          python -m unittest -v
          tests.test_pgn_document_new_game_position_integrity
          tests.test_pgn_position_new_document_reachability
          tests.test_version2_application
          tests.test_dev1_books_training_webview_projection
          tests.test_v2_book_training_route_rollback
          tests.test_v2_book_transaction_current_runtime
          tests.test_w3_p0f_starter_books_training_content

      - name: Run Training DOM contract
        run: node tests/js/books_training_surface_dom_test.js

      - name: Run core selftest
        run: python -m acs.selftest
