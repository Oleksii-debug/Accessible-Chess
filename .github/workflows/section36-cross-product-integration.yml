name: Section 36 Cross Product Integration

on:
  push:
    branches:
      - 'section36/cross-product-integration-20261007-sol56'
    paths:
      - 'acs/section36_integration.py'
      - 'tests/test_section36_cross_product_integration.py'
      - 'docs/automation/SECTION36_CROSS_PRODUCT_INTEGRATION.md'
      - '.github/workflows/section36-cross-product-integration.yml'
  pull_request:
    paths:
      - 'acs/section36_integration.py'
      - 'tests/test_section36_cross_product_integration.py'
      - 'docs/automation/SECTION36_CROSS_PRODUCT_INTEGRATION.md'
      - '.github/workflows/section36-cross-product-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section36-cross-product-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  contract:
    name: cross-product-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact head and no state-owner duplication
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path("acs/section36_integration.py").read_text(encoding="utf-8")
          forbidden = (
              "sqlite3",
              "CREATE TABLE",
              "MediaPositionTimeline(",
              "RemoteSessionLog(",
              "EducationWorkspace(",
              "Board(",
          )
          for token in forbidden:
              if token in text:
                  raise SystemExit(f"duplicate-state authority token present: {token}")
          required = (
              "TactileSyncController",
              "MediaApplicationService",
              "TeachingSessionState",
              "RemoteSessionState",
              "expected_revision",
              "account.read",
              "workspace.read",
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing typed integration token: {token}")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Section 36 boundary
        run: >-
          python -m py_compile
          acs/section36_integration.py
          tests/test_section36_cross_product_integration.py

      - name: Execute Section 36 typed contract
        run: python -m unittest -v tests.test_section36_cross_product_integration

      - name: Execute inherited cross-surface regressions
        run: >-
          python -m unittest -v
          tests.test_agent_classroom_tools
          tests.test_section10_tactile_sync
          tests.test_tactile_input
          tests.test_tactile_input_application
          tests.test_media_application
          tests.test_remote_session
          tests.test_teaching_classroom_adapter
