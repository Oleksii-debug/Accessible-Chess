name: DEV3 apply ACSDB atomic publication patch

on:
  push:
    branches:
      - auto/dev3-acsdb-stable-paging-20260821

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact ACSDB publication patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('acs/acsdb.py')
          text = path.read_text(encoding='utf-8')
          old = '''            if not overwrite and (destination_path.exists() or destination_path.is_symlink()):
              raise FileExistsError(destination_path)
          '''
          # Keep replacement matching indentation exact via explicit longer snippets below.
          backup_old = '''            if not overwrite and (destination_path.exists() or destination_path.is_symlink()):
                raise FileExistsError(destination_path)
            os.replace(temporary, destination_path)
            return destination_path
          '''
          backup_new = '''            if overwrite:
                os.replace(temporary, destination_path)
            else:
                os.link(temporary, destination_path)
            return destination_path
          '''
          count = text.count(backup_old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 publication blocks, found {count}')
          text = text.replace(backup_old, backup_new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- acs/acsdb.py
          git diff -- acs/acsdb.py
      - name: Commit product patch
        shell: bash
        run: |
          if git diff --quiet -- acs/acsdb.py; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- acs/acsdb.py
          git commit -m 'fix(dev3): make ACSDB no-overwrite publication atomic'
          git push origin HEAD:auto/dev3-acsdb-stable-paging-20260821
