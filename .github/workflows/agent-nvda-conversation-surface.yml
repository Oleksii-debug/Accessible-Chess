name: Agent NVDA Conversation Surface

on:
  pull_request:
    branches:
      - work/media-agent-crossrepo-intake-20261005
    paths:
      - acs/agent_webview_bridge.py
      - acs/agent_webview_projection.py
      - acs/full_product_ui_shell.py
      - acs/version2_final_product_application.py
      - acs/version2_final_product_profile.py
      - acs/version2_final_release.py
      - web/full_product_agent.js
      - web/version2_final_product_bootstrap.js
      - tests/test_agent_webview_surface.py
      - tests/test_agent_final_product_reachability.py
      - tests/js/agent_surface_dom_test.js
      - .github/workflows/agent-nvda-conversation-surface.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-nvda-conversation-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  conversation-surface:
    name: Conversation surface (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial parent and bounded scope
        shell: bash
        env:
          PINNED_BASE: 6609c35ff5fa0b1f959806866ff7403e70efdbf3
          BASE_BRANCH: work/media-agent-crossrepo-intake-20261005
        run: |
          set -euo pipefail
          CANDIDATE="$(git rev-parse HEAD)"
          git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/agent-ui-base"
          test "$(git rev-parse refs/remotes/origin/agent-ui-base)" = "$PINNED_BASE"
          test "$(git merge-base "$PINNED_BASE" "$CANDIDATE")" = "$PINNED_BASE"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/agent-ui-live-head"
            test "$(git rev-parse refs/remotes/origin/agent-ui-live-head)" = "$CANDIDATE"
          fi

          mapfile -t changed < <(git diff --name-only "$PINNED_BASE"..."$CANDIDATE" | LC_ALL=C sort)
          expected=(
            ".github/workflows/agent-nvda-conversation-surface.yml"
            "acs/agent_webview_bridge.py"
            "acs/agent_webview_projection.py"
            "acs/full_product_ui_shell.py"
            "acs/version2_final_product_application.py"
            "acs/version2_final_product_profile.py"
            "acs/version2_final_release.py"
            "tests/js/agent_surface_dom_test.js"
            "tests/test_agent_final_product_reachability.py"
            "tests/test_agent_webview_surface.py"
            "web/full_product_agent.js"
            "web/version2_final_product_bootstrap.js"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install retained test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile changed Python boundaries
        run: >-
          python -m py_compile
          acs/agent_webview_projection.py
          acs/agent_webview_bridge.py
          acs/full_product_ui_shell.py
          acs/version2_final_product_application.py
          acs/version2_final_product_profile.py
          acs/version2_final_release.py
          tests/test_agent_webview_surface.py
          tests/test_agent_final_product_reachability.py

      - name: Run focused projection and bridge contracts
        run: python -m unittest discover -s tests -p "test_agent_webview_surface.py" -v

      - name: Run final-product reachability contracts
        run: python -m unittest discover -s tests -p "test_agent_final_product_reachability.py" -v

      - name: Run retained Agent and final-product regressions
        run: >-
          python -m pytest -q
          tests/test_universal_chess_agent_crossrepo.py
          tests/test_chess_agent_tools_crossrepo.py
          tests/test_version2_final_product_composition.py

      - name: Check and run keyboard/NVDA DOM contract
        run: |
          node --check web/full_product_agent.js
          node tests/js/agent_surface_dom_test.js
