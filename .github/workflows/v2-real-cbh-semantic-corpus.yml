name: Accessible Chess V2 Real CBH Semantic Corpus

on:
  pull_request:
    paths:
      - '.github/workflows/v2-real-cbh-semantic-corpus.yml'
      - 'tests/test_v2_real_cbh_semantic_corpus.py'

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-real-cbh-semantic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  V2_AUTHORITY_SHA: 958ae19cd91a135fd3f384d02a880c0ed1adfd10
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696

jobs:
  real-cbh-semantic:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact QA head, never PR merge ref
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove evidence-only scope and exact authority ancestry
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V2_AUTHORITY_SHA" HEAD
          git diff --check "$V2_AUTHORITY_SHA" HEAD
          changed="$(git diff --name-only "$V2_AUTHORITY_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-real-cbh-semantic-corpus.yml' \
            'tests/test_v2_real_cbh_semantic_corpus.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected QA scope:\n%s\n' "$changed" >&2
            exit 1
          }
          git diff --quiet "$V2_AUTHORITY_SHA" HEAD -- acs web tools/optional
          printf 'V2_REAL_CBH_AUTHORITY=%s\nQA_HEAD=%s\n' "$V2_AUTHORITY_SHA" "$(git rev-parse HEAD)"

      - name: Checkout pinned legal libcbh corpus
        uses: actions/checkout@v4
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned broad-regression dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Build pinned libcbh and Accessible Chess bridge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge
          sha256sum upstream/libcbh/gtest/Annotation/TestBase.cbh \
            upstream/libcbh/gtest/Annotation/TestBaseExport.pgn \
            upstream/libcbh/gtest/NonStandard/NonStandardStart.cbh \
            upstream/libcbh/gtest/NonStandard/NonStandardStart.pgn

      - name: Compile QA and Product import surfaces
        working-directory: product
        run: python -m compileall -q acs tests/test_v2_real_cbh_semantic_corpus.py

      - name: Run real annotation NAG comment and SetUp FEN oracles
        working-directory: product
        shell: bash
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_ANNOTATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/Annotation
          LIBCBH_NONSTANDARD_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/NonStandard
        run: |
          set -o pipefail
          python -m unittest -v tests.test_v2_real_cbh_semantic_corpus 2>&1 | tee real-cbh-semantic.log

      - name: Focused existing ChessBase Library and canonical regressions
        working-directory: product
        run: >-
          python -m unittest -v
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_version2_formats_integration
          tests.test_library_import_ui_integration
          tests.test_pgn_document

      - name: Full repository unittest
        working-directory: product
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        working-directory: product
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        working-directory: product
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Upload evidence log only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-real-cbh-semantic-evidence
          path: product/real-cbh-semantic.log
          if-no-files-found: ignore
          retention-days: 7
