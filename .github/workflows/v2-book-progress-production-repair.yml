name: V2 Book Progress Production Repair

on:
  push:
    branches:
      - work/v2-book-progress-production-repair-20260831
  pull_request:
    paths:
      - '.github/workflows/book-progress-orphan-backup-recovery.yml'
      - '.github/workflows/books-progress-backup-recovery.yml'
      - '.github/workflows/v2-book-progress-production-repair.yml'
      - 'acs/book_progress_store.py'
      - 'acs/version2_application.py'
      - 'tests/test_v2_book_progress_store.py'
      - 'tests/test_v2_book_progress_store_production.py'
      - 'tests/test_version2_application.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-book-progress-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      STACK_PARENT_SHA: 5ec896f00615d10157c5ec52a1ef83917779a1b5
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CURRENT_PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
      CURRENT_BOOKS_BRANCH: work/books-bidirectional-semantic-navigation-20260927
      CURRENT_PROGRESS_OWNER: a56abe4e68d58c7600b97c1a410ae64a42697aaa
      CURRENT_STORE_BLOB: dd328b144d61dbb467d0b09bf131d76ca09617ec
      CURRENT_APPLICATION_BLOB: 7c8d36a1547f5a7637ed384a94d8882ad71079c9
      CURRENT_BASE_TEST_BLOB: 99b7dfa5bf959470b1a31c5ff7fcea9e06935347
      CURRENT_APPLICATION_TEST_BLOB: 79c70573829999f37b5558d7158bfc74988ad869
      CURRENT_PRODUCTION_TEST_BLOB: 1a25f83c051405fefd7ec09bc471fb89945bf6e5
      FOCUS_RECOVERY_STORE_BLOB: b7ad9899f614c42589b9f53fddbebe59dee2b9c7
      FOCUS_RECOVERY_BASE_TEST_BLOB: 81d5eb59a0b4b8f292480d2dd4c1f82fa4a36b7a
      FOCUS_RECOVERY_PRODUCTION_TEST_BLOB: 6aa9cddc68a630228e3a2266c5dcf3382b86a674
      FOCUS_RECOVERY_APPLICATION_BLOB: c18e49f72d57a598c7e2c47794ce254ddc788101
      FOCUS_RECOVERY_APPLICATION_TEST_BLOB: 240bb41b0e99c45c0c1ad64ae8b91dbd057f6f69
      SEMANTIC_DURABLE_APPLICATION_BLOB: 9f4722a1898f9f1bc17daa62737606d8cb847a2d
      SEMANTIC_DURABLE_APPLICATION_TEST_BLOB: 043d8efd1be94b425d9ed153ce7f25e8b9057fed
      DURABILITY_NAVIGATION_APPLICATION_BLOB: 9f6fedc62dab8b3154f6e1bec6ad26338e310729
      DURABILITY_NAVIGATION_APPLICATION_TEST_BLOB: 78c0f464c463cad57c11726db07d8357b0537037
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact ownership and current-base scope
        shell: bash
        run: |
          set -euo pipefail

          canonical_product_ref="refs/remotes/origin/$CURRENT_PRODUCT_BRANCH"
          git fetch --no-tags origin "+refs/heads/$CURRENT_PRODUCT_BRANCH:$canonical_product_ref"
          current_product="$(git rev-parse "$canonical_product_ref")"
          git cat-file -e "$current_product^{commit}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            upstream="$PR_BASE_SHA"
          else
            upstream="$STACK_PARENT_SHA"
          fi
          test -n "$upstream"
          git cat-file -e "$upstream^{commit}"
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          changed="$(git diff --name-only "$upstream" HEAD | sort)"

          delegated_focus_successor=false
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "$PR_BASE_REF" = "fix/training-continue-render-atomicity-20260929" ] \
             && [ "${{ github.event.pull_request.head.ref }}" = "fix/delegated-focus-roundtrip-current-20261003" ]; then
            delegated_expected="$(printf '%s\n' \
              '.github/workflows/d01-pgn-workspace-webview.yml' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/full_product_actions.py' \
              'acs/full_product_ui_shell.py' \
              'acs/version2_application.py' \
              'tests/js/version2_release_bootstrap_dom_test.js' \
              'tests/test_dev1_full_product_webview_adapter.py' \
              'tests/test_version2_application.py' \
              'tests/test_version2_book_board_refresh_focus_order_evidence.py' \
              'tests/test_version2_release_accessibility_contract.py' \
              'web/version2_release_bootstrap.js' | sort)"
            if [ "$changed" = "$delegated_expected" ]; then
              test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$CURRENT_STORE_BLOB"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$CURRENT_BASE_TEST_BLOB"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$CURRENT_PRODUCTION_TEST_BLOB"
              test "$(git rev-parse HEAD:acs/version2_application.py)" = "802863c77a470a39dc188cd4365883a70541cb11"
              test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "259e2ac1781fe71511e1e070912c2c25442eacc4"
              delegated_focus_successor=true
            fi
          fi

          focus_recovery_successor=false
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "$PR_BASE_REF" = "fix/delegated-focus-roundtrip-current-20261003" ] \
             && [ "${{ github.event.pull_request.head.ref }}" = "fix/delegated-focus-roundtrip-ci-recovery-20261003" ]; then
            focus_parent_ref="refs/remotes/origin/$PR_BASE_REF"
            git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:$focus_parent_ref"
            focus_parent="$(git rev-parse "$focus_parent_ref")"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$focus_parent"
            git merge-base --is-ancestor "$focus_parent" HEAD
            test "$(git merge-base "$focus_parent" HEAD)" = "$focus_parent"
            git diff --check "$focus_parent" HEAD
            focus_changed="$(git diff --name-only "$focus_parent" HEAD | sort)"
            focus_recovery_expected="$(printf '%s\n' \
              '.github/workflows/d01-pgn-workspace-webview.yml' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'acs/version2_application.py' \
              'tests/test_dev1_books_training_web_asset.py' \
              'tests/test_v2_book_progress_store.py' \
              'tests/test_v2_book_progress_store_production.py' \
              'tests/test_version2_application.py' | sort)"
            test "$focus_changed" = "$focus_recovery_expected"
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$FOCUS_RECOVERY_STORE_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$FOCUS_RECOVERY_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$FOCUS_RECOVERY_PRODUCTION_TEST_BLOB"
            test "$(git rev-parse HEAD:acs/version2_application.py)" = "$FOCUS_RECOVERY_APPLICATION_BLOB"
            test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$FOCUS_RECOVERY_APPLICATION_TEST_BLOB"
            focus_recovery_successor=true
          fi

          semantic_durable_convergence=false
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "$PR_BASE_REF" = "fix/books-semantic-rendered-text-budget-20261003" ] \
             && [ "${{ github.event.pull_request.head.ref }}" = "converge/books-semantic-durable-board-20261003" ]; then
            semantic_ref="refs/remotes/origin/$PR_BASE_REF"
            durable_branch="fix/delegated-focus-roundtrip-ci-recovery-20261003"
            durable_ref="refs/remotes/origin/$durable_branch"
            git fetch --no-tags origin \
              "+refs/heads/$PR_BASE_REF:$semantic_ref" \
              "+refs/heads/$durable_branch:$durable_ref"
            semantic_head="$(git rev-parse "$semantic_ref")"
            durable_head="$(git rev-parse "$durable_ref")"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$semantic_head"
            git merge-base --is-ancestor "$semantic_head" HEAD
            git merge-base --is-ancestor "$durable_head" HEAD
            test "$(git merge-base "$semantic_head" HEAD)" = "$semantic_head"
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$FOCUS_RECOVERY_STORE_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$FOCUS_RECOVERY_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$FOCUS_RECOVERY_PRODUCTION_TEST_BLOB"
            test "$(git rev-parse HEAD:acs/version2_application.py)" = "$SEMANTIC_DURABLE_APPLICATION_BLOB"
            test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$SEMANTIC_DURABLE_APPLICATION_TEST_BLOB"
            semantic_durable_convergence=true
          fi

          durability_navigation_convergence=false
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "$PR_BASE_REF" = "fix/v2-release-navigation-schema-focus-20261003" ] \
             && [ "${{ github.event.pull_request.head.ref }}" = "converge/books-durability-navigation-focus-20261003" ]; then
            latest_parent='eb23bdc5ea0e2914a7f742697b20d32edd78a950'
            focus_parent='f31e1f29e9a8a02ed12b85d7516f42f18fd780c2'
            ingress_focus_parent='5c673511721185d7b6e32e7c42e2709eee90ddf0'
            test "$PR_BASE_SHA" = "$latest_parent"
            git cat-file -e "$focus_parent^{commit}"
            git cat-file -e "$ingress_focus_parent^{commit}"
            git merge-base --is-ancestor "$latest_parent" HEAD
            git merge-base --is-ancestor "$focus_parent" HEAD
            git merge-base --is-ancestor "$ingress_focus_parent" HEAD
            convergence_changed="$(git diff --name-only "$latest_parent" HEAD | sort)"
            convergence_expected="$(printf '%s\n' \
              '.github/workflows/books-durability-navigation-focus-convergence.yml' \
              '.github/workflows/d01-pgn-workspace-webview.yml' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/full_product_ui_shell.py' \
              'acs/training_webview_projection.py' \
              'acs/version2_application.py' \
              'tests/js/books_training_surface_dom_test.js' \
              'tests/js/version2_release_bootstrap_dom_test.js' \
              'tests/test_v2_book_training_route_rollback.py' \
              'tests/test_version2_application.py' \
              'tests/test_version2_release_accessibility_contract.py' \
              'web/full_product_books_training.js' \
              'web/version2_release_bootstrap.js' | sort)"
            test "$convergence_changed" = "$convergence_expected"
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$FOCUS_RECOVERY_STORE_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$FOCUS_RECOVERY_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$FOCUS_RECOVERY_PRODUCTION_TEST_BLOB"
            test "$(git rev-parse HEAD:acs/version2_application.py)" = "$DURABILITY_NAVIGATION_APPLICATION_BLOB"
            test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$DURABILITY_NAVIGATION_APPLICATION_TEST_BLOB"
            durability_navigation_convergence=true
          fi

          bounded_feature=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            allowed="$(printf '%s\n' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'tests/test_v2_book_progress_store.py' \
              'tests/test_v2_book_progress_store_production.py' | sort)"
            unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))"
            if [ -z "$unexpected" ] \
              && printf '%s\n' "$changed" | grep -Fqx 'acs/book_progress_store.py' \
              && printf '%s\n' "$changed" | grep -Fqx 'tests/test_v2_book_progress_store.py'; then
              bounded_feature=true
            fi
          else
            expected="$(printf '%s\n' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'tests/test_v2_book_progress_store_production.py' | sort)"
            if [ "$changed" = "$expected" ]; then
              bounded_feature=true
            fi
          fi

          workflow_repair=false
          if git merge-base --is-ancestor "$current_product" HEAD; then
            current_delta="$(git diff --name-only "$current_product" HEAD | sort)"
            if [ "$current_delta" = '.github/workflows/v2-book-progress-production-repair.yml' ]; then
              workflow_repair=true
            fi
          fi
          recovery_successor=false
          if git merge-base --is-ancestor "$current_product" HEAD; then
            current_delta="$(git diff --name-only "$current_product" HEAD | sort)"
            recovery_expected="$(printf '%s\n' '.github/workflows/books-progress-backup-recovery.yml' '.github/workflows/v2-book-progress-production-repair.yml' '.github/workflows/v2-composition-publication-boundary.yml' 'acs/book_progress_store.py' 'acs/version2_application.py' 'acs/version2_release_app.py' 'acs/version2_windows_native_dialog_ownership.py' 'tests/test_v2_native_dialog_language.py' 'tests/test_version2_application.py' | sort)"
            if [ "$current_delta" = "$recovery_expected" ]; then
              recovery_successor=true
            fi
          fi

          orphan_backup_successor=false
          if git merge-base --is-ancestor "$current_product" HEAD; then
            current_delta="$(git diff --name-only "$current_product" HEAD | sort)"
            orphan_expected="$(printf '%s\n' \
              '.github/workflows/book-progress-orphan-backup-recovery.yml' \
              '.github/workflows/books-progress-backup-recovery.yml' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'acs/version2_application.py' \
              'tests/test_v2_book_progress_store.py' \
              'tests/test_version2_application.py' | sort)"
            if [ "$current_delta" = "$orphan_expected" ]; then
              test "$(git rev-parse "$current_product":acs/book_progress_store.py)" = "3c51f524a1e2702903914a2dd9c37c0ed8ebf87b"
              test "$(git rev-parse "$current_product":tests/test_v2_book_progress_store.py)" = "52cb2948ec6789b60775e1fa38cae44770baff7a"
              test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$CURRENT_STORE_BLOB"
              test "$(git rev-parse HEAD:acs/version2_application.py)" = "$CURRENT_APPLICATION_BLOB"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$CURRENT_BASE_TEST_BLOB"
              test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$CURRENT_APPLICATION_TEST_BLOB"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$CURRENT_PRODUCTION_TEST_BLOB"
              orphan_backup_successor=true
            fi
          fi

          current_books_recovery=false
          current_books=''
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$PR_BASE_REF" = "$CURRENT_BOOKS_BRANCH" ]; then
            test -n "$PR_BASE_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            books_ref="refs/remotes/origin/$CURRENT_BOOKS_BRANCH"
            git fetch --no-tags origin "+refs/heads/$CURRENT_BOOKS_BRANCH:$books_ref"
            current_books="$(git rev-parse "$books_ref")"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$current_books"
            git merge-base --is-ancestor "$current_books" HEAD
            test "$(git merge-base "$current_books" HEAD)" = "$current_books"
            books_delta="$(git diff --name-only "$current_books" HEAD | sort)"
            books_expected="$(printf '%s\n' \
              '.github/workflows/book-progress-orphan-backup-recovery.yml' \
              '.github/workflows/books-progress-backup-recovery.yml' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'acs/version2_application.py' \
              'tests/test_v2_book_progress_store.py' \
              'tests/test_version2_application.py' | sort)"
            if [ "$books_delta" = "$books_expected" ]; then
              test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$CURRENT_STORE_BLOB"
              test "$(git rev-parse HEAD:acs/version2_application.py)" = "$CURRENT_APPLICATION_BLOB"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$CURRENT_BASE_TEST_BLOB"
              test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$CURRENT_APPLICATION_TEST_BLOB"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$CURRENT_PRODUCTION_TEST_BLOB"
              current_books_recovery=true
            fi
          fi

          full_product_composition=false
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.head_ref }}" = "$CURRENT_PRODUCT_BRANCH" ]; then
            test "$(git rev-parse HEAD)" = "$current_product"
            full_product_composition=true
          elif [ "${{ github.event_name }}" != "pull_request" ] \
            && [ "${GITHUB_REF_NAME:-}" = "$CURRENT_PRODUCT_BRANCH" ]; then
            test "$(git rev-parse HEAD)" = "$current_product"
            full_product_composition=true
          fi

          if [ "$durability_navigation_convergence" = true ]; then
            git diff --check "$upstream" HEAD
            echo 'BOOK_PROGRESS_TOPOLOGY=DURABILITY_NAVIGATION_FOCUS_CONVERGENCE'
          elif [ "$semantic_durable_convergence" = true ]; then
            git diff --check "$upstream" HEAD
            echo 'BOOK_PROGRESS_TOPOLOGY=SEMANTIC_DURABLE_CONVERGENCE'
          elif [ "$focus_recovery_successor" = true ]; then
            git diff --check "$upstream" HEAD
            echo 'BOOK_PROGRESS_TOPOLOGY=FOCUS_RECOVERY_SUCCESSOR'
          elif [ "$delegated_focus_successor" = true ]; then
            git diff --check "$upstream" HEAD
            echo 'BOOK_PROGRESS_TOPOLOGY=DELEGATED_FOCUS_SUCCESSOR'
          elif [ "$bounded_feature" = true ]; then
            git diff --check "$upstream" HEAD
            git diff --quiet "$upstream" HEAD -- \
              .github/workflows/v2-book-progress-store.yml \
              acs/bookreader.py \
              acs/book_index.py \
              acs/bookdocument.py \
              acs/book_game_content.py \
              acs/book_library_game_lookup.py \
              acs/book_training.py \
              acs/training.py \
              acs/book_webview_bridge.py \
              acs/book_webview_projection.py \
              acs/full_product_presenters.py \
              acs/gametree.py \
              acs/pgn_roundtrip.py \
              acs/chesscore.py \
              acs/analysis_service.py \
              acs/engine_assisted_workflows.py \
              acs/acsdb.py \
              web/full_product_books_training.js \
              acs/stage1_release_ui.py
            echo 'BOOK_PROGRESS_TOPOLOGY=BOUNDED_FEATURE'
          elif [ "$workflow_repair" = true ]; then
            git diff --check "$current_product" HEAD
            echo 'BOOK_PROGRESS_TOPOLOGY=WORKFLOW_ONLY_REPAIR'
          elif [ "$recovery_successor" = true ]; then
            git diff --check "$current_product" HEAD
            # The recovery successor may change the store implementation but
            # not the canonical BookProgress regression authorities.
            git diff --quiet "$current_product" HEAD -- \
              tests/test_v2_book_progress_store.py \
              tests/test_v2_book_progress_store_production.py
            echo 'BOOK_PROGRESS_TOPOLOGY=RECOVERY_SUCCESSOR'
          elif [ "$orphan_backup_successor" = true ]; then
            git diff --check "$current_product" HEAD
            # This successor changes only the missing-primary recovery authority,
            # its exact qualification gates, and the base regression file.
            git diff --quiet "$current_product" HEAD -- \
              tests/test_v2_book_progress_store_production.py \
              acs/bookreader.py \
              acs/bookdocument.py \
              acs/book_game_content.py \
              acs/book_webview_bridge.py \
              acs/book_webview_projection.py \
              acs/version2_application.py
            echo 'BOOK_PROGRESS_TOPOLOGY=ORPHAN_BACKUP_SUCCESSOR'
          elif [ "$current_books_recovery" = true ]; then
            git diff --check "$current_books" HEAD
            echo 'BOOK_PROGRESS_TOPOLOGY=CURRENT_BOOKS_RECOVERY'
          elif [ "$full_product_composition" = true ]; then
            # The repair is composed into the live Full Product. A broad Product
            # history is legitimate only on that exact canonical branch.
            git merge-base --is-ancestor "$CURRENT_PROGRESS_OWNER" HEAD
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$CURRENT_STORE_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$CURRENT_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$CURRENT_PRODUCTION_TEST_BLOB"
            git diff --check "$CURRENT_PROGRESS_OWNER" HEAD -- \
              acs/book_progress_store.py \
              tests/test_v2_book_progress_store.py \
              tests/test_v2_book_progress_store_production.py
            echo 'BOOK_PROGRESS_TOPOLOGY=CURRENT_FULL_PRODUCT_COMPOSITION'
          else
            echo 'Unsupported Book Progress workflow topology' >&2
            exit 1
          fi

          # Every accepted topology must retain an explicitly reviewed
          # BookProgress authority. Focus recovery composes its reviewed durable
          # store/application blobs on the current delegated-focus parent.
          if [ "$delegated_focus_successor" != true ] \
             && [ "$focus_recovery_successor" != true ] \
             && [ "$semantic_durable_convergence" != true ] \
             && [ "$durability_navigation_convergence" != true ]; then
            git merge-base --is-ancestor "$CURRENT_PROGRESS_OWNER" HEAD
          fi
          if [ "$durability_navigation_convergence" = true ]; then
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$FOCUS_RECOVERY_STORE_BLOB"
            test "$(git rev-parse HEAD:acs/version2_application.py)" = "$DURABILITY_NAVIGATION_APPLICATION_BLOB"
            test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$DURABILITY_NAVIGATION_APPLICATION_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$FOCUS_RECOVERY_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$FOCUS_RECOVERY_PRODUCTION_TEST_BLOB"
          elif [ "$semantic_durable_convergence" = true ]; then
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$FOCUS_RECOVERY_STORE_BLOB"
            test "$(git rev-parse HEAD:acs/version2_application.py)" = "$SEMANTIC_DURABLE_APPLICATION_BLOB"
            test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$SEMANTIC_DURABLE_APPLICATION_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$FOCUS_RECOVERY_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$FOCUS_RECOVERY_PRODUCTION_TEST_BLOB"
          elif [ "$focus_recovery_successor" = true ]; then
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$FOCUS_RECOVERY_STORE_BLOB"
            test "$(git rev-parse HEAD:acs/version2_application.py)" = "$FOCUS_RECOVERY_APPLICATION_BLOB"
            test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$FOCUS_RECOVERY_APPLICATION_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$FOCUS_RECOVERY_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$FOCUS_RECOVERY_PRODUCTION_TEST_BLOB"
          else
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$CURRENT_STORE_BLOB"
            if [ "$current_books_recovery" = true ]; then
              test "$(git rev-parse HEAD:acs/version2_application.py)" = "$CURRENT_APPLICATION_BLOB"
              test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$CURRENT_APPLICATION_TEST_BLOB"
            elif [ "$delegated_focus_successor" = true ]; then
              test "$(git rev-parse HEAD:acs/version2_application.py)" = "802863c77a470a39dc188cd4365883a70541cb11"
              test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "259e2ac1781fe71511e1e070912c2c25442eacc4"
            fi
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$CURRENT_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$CURRENT_PRODUCTION_TEST_BLOB"
          fi
          echo 'BOOK PROGRESS PRODUCTION OWNERSHIP PASS'

      - name: Compile Book progress repair
        run: >-
          python -m compileall -q
          acs/book_progress_store.py
          tests/test_v2_book_progress_store_production.py
          tests/test_v2_book_progress_store.py

      - name: Deterministic production Book progress regressions
        run: python -m unittest -v tests.test_v2_book_progress_store_production

      - name: Existing Book progress and semantic reading regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_progress_store
          tests.test_bookreader
          tests.test_bookdocument

      - name: Book Board persistence transaction regressions
        run: >-
          python -m unittest -v
          tests.test_book_board_progress_failure_exact
          tests.test_book_reverse_progress_failure_exact

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
