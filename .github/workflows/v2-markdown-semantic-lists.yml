name: V2 Markdown Semantic Lists

on:
  push:
    branches:
      - work/v2-markdown-semantic-lists-20260907
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-markdown-lists-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-lists:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve committed Git bytes for cross-platform identity gates
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
      - name: Restore frozen Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove current-runtime convergence and bounded semantic-list scope
        shell: bash
        run: |
          set -euo pipefail
          legacy_base=40e1ef2184177600bcc88911529b718adde65df9
          predecessor_expected=7545572a5b7d23a9e15fb091947fe71a70a3d07a
          convergence="$(git rev-list --min-parents=2 --max-count=1 HEAD)"
          test "$convergence" = "$(git rev-parse HEAD)"
          parent_line="$(git rev-list --parents -n 1 HEAD)"
          test "$(wc -w <<<"$parent_line" | tr -d ' ')" = '3'
          base="$(git rev-parse HEAD^1)"
          predecessor="$(git rev-parse HEAD^2)"
          test "$predecessor" = "$predecessor_expected"
          git merge-base --is-ancestor "$legacy_base" "$predecessor"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$predecessor" HEAD
          test "$(git rev-parse "$base:acs/book_text_import.py")" = "e8828e7289f970ea8cd2eb6fc80a393904daaac5"
          test "$(git rev-parse "$base:tests/test_v2_book_text_import.py")" = "4c0efb4a52832f3422e05b96883b1122dfc0587f"
          if git cat-file -e "$base:tests/test_v2_markdown_semantic_lists.py" 2>/dev/null; then
            echo 'Current runtime already owns a different semantic-list test path' >&2
            exit 1
          fi
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-markdown-semantic-lists.yml' \
            'acs/book_text_import.py' \
            'tests/test_v2_book_text_import.py' \
            'tests/test_v2_markdown_semantic_lists.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected current-runtime Markdown semantic-list delta:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/book_text_import.py)" = "1e2f8360da45ef4ab7b03b6179b0c03bf0ad473c"
          test "$(git rev-parse HEAD:tests/test_v2_book_text_import.py)" = "47a91129a0edf0be8b6ebe554ae2ea64d55534cc"
          test "$(git rev-parse HEAD:tests/test_v2_markdown_semantic_lists.py)" = "aa4271f37dc74d077977b23630966a0708323038"
          echo "MARKDOWN_LISTS_CURRENT_RUNTIME_BASE=$base"
          echo "MARKDOWN_LISTS_PREDECESSOR=$predecessor"
      - name: Compile bounded Books adapter
        run: python -m py_compile acs/book_text_import.py tests/test_v2_book_text_import.py tests/test_v2_markdown_semantic_lists.py
      - name: Existing TXT and Markdown importer contracts
        run: python -m unittest -v tests.test_v2_book_text_import
      - name: Canonical semantic-list regression
        run: python -m unittest -v tests.test_v2_markdown_semantic_lists
      - name: Canonical Book core and reader regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core
      - name: Re-materialize frozen Stage1 blobs before broad byte contracts
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
