name: W1 D06 Apply Resume Lock TOCTOU

on:
  push:
    branches:
      - work/w1-d06-resume-lock-toctou-20260907
    paths:
      - .github/workflows/w1-d06-apply-resume-lock-toctou.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact post-open lock identity repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("acs/gametree_resume.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "    try:\n"
              "        handle = lock_path.open(\"a+b\")\n"
              "    except OSError as exc:\n"
              "        raise GameTreeResumeError(\n"
              "            \"resume store lock could not be opened\",\n"
              "            code=GameTreeResumeCode.IO_FAILURE,\n"
              "        ) from exc\n"
              "    try:\n"
              "        if os.name == \"nt\":\n"
          )
          new = (
              "    try:\n"
              "        handle = lock_path.open(\"a+b\")\n"
              "    except OSError as exc:\n"
              "        raise GameTreeResumeError(\n"
              "            \"resume store lock could not be opened\",\n"
              "            code=GameTreeResumeCode.IO_FAILURE,\n"
              "        ) from exc\n"
              "\n"
              "    # Pre-open lstat is defense-in-depth only: the pathname can change\n"
              "    # between validation and open. Bind the opened handle back to the\n"
              "    # current lock pathname before any write or OS lock operation.\n"
              "    try:\n"
              "        opened = os.fstat(handle.fileno())\n"
              "        current = lock_path.lstat()\n"
              "    except OSError as exc:\n"
              "        handle.close()\n"
              "        raise GameTreeResumeError(\n"
              "            \"resume store lock identity could not be verified\",\n"
              "            code=GameTreeResumeCode.IO_FAILURE,\n"
              "        ) from exc\n"
              "    opened_key = (opened.st_dev, opened.st_ino)\n"
              "    current_key = (current.st_dev, current.st_ino)\n"
              "    if (\n"
              "        stat.S_ISLNK(current.st_mode)\n"
              "        or _is_reparse_point(current)\n"
              "        or not stat.S_ISREG(current.st_mode)\n"
              "        or not stat.S_ISREG(opened.st_mode)\n"
              "        or getattr(current, \"st_nlink\", 1) != 1\n"
              "        or getattr(opened, \"st_nlink\", 1) != 1\n"
              "        or opened_key != current_key\n"
              "    ):\n"
              "        handle.close()\n"
              "        raise GameTreeResumeError(\n"
              "            \"resume store lock changed while being opened\",\n"
              "            code=GameTreeResumeCode.IO_FAILURE,\n"
              "        )\n"
              "    try:\n"
              "        if os.name == \"nt\":\n"
          )
          if text.count(old) != 1:
              raise SystemExit("expected exact resume lock open block once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/w1-d06-apply-resume-lock-toctou.yml").unlink()
          PY
      - name: Validate repair before commit
        run: |
          python -m compileall -q acs/gametree_resume.py tests/test_w1_d06_resume_lock_toctou.py
          python -m unittest -v tests.test_w1_d06_resume_lock_toctou tests.test_d06_gametree_snapshot_resume
          git diff --check
      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(d06): bind resume lock handle to validated path"
          git push origin "HEAD:${GITHUB_REF_NAME}"
