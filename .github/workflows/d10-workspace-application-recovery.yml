name: D10 Workspace Application Durability Recovery

on:
  pull_request:
    branches:
      - fix/d10-workspace-store-crash-recovery-20261003
    paths:
      - 'acs/version2_final_product_application.py'
      - 'tests/test_d10_workspace_application_recovery.py'
      - '.github/workflows/d10-workspace-application-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d10-workspace-application-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked base and bounded scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_BASE_REF" = "fix/d10-workspace-store-crash-recovery-20261003"
          test -n "$EVENT_BASE_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$PR_BASE_REF"
          live_base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
          test -n "$live_base"
          if ! git merge-base --is-ancestor "$live_base" HEAD; then
            echo "Current D10 store base $live_base is not an ancestor of HEAD; synchronize before qualification."
            exit 1
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base...HEAD"
          mapfile -t actual < <(git diff --name-only "$live_base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/d10-workspace-application-recovery.yml'
            'acs/version2_final_product_application.py'
            'tests/test_d10_workspace_application_recovery.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected D10 application-recovery scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo "D10_APPLICATION_RECOVERY_BASE=$live_base"
          echo 'D10_APPLICATION_RECOVERY_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile recovery composition
        run: >-
          python -m py_compile
          acs/version2_final_product_application.py
          tests/test_d10_workspace_application_recovery.py

      - name: Run D10 store and application recovery contracts
        run: >-
          python -m unittest -v
          tests.test_d10_workspace_application_recovery
          tests.test_education_workspace
          tests.test_version2_final_product_composition
