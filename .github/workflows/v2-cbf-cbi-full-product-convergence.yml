name: V2 CBF CBI Full Product Convergence

on:
  pull_request:
    paths:
      - 'acs/cbf_cbi_external.py'
      - 'acs/cbf_cbi_qualification.py'
      - 'tests/test_cbf_cbi_external.py'
      - 'tests/test_cbf_cbi_qualification.py'
      - 'tests/test_v2_cbf_cbi_real_corpus_unblock.py'
      - 'docs/automation/V2_CBF_CBI_REAL_CORPUS_UNBLOCK.json'
      - 'docs/automation/V2_CBF_CBI_REAL_CORPUS_UNBLOCK.md'
      - '.github/workflows/v2-cbf-cbi-full-product-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANONICAL_BASE_SHA: 93f2daaeb54674ae49be679c89b5bb6dc2544813
  SOURCE_HEAD_SHA: 56b870133c111b0748c121ba8af7ff628e900517
  SCIDB_COMMIT: 7c1c9d89f2fabab0c1252cdd14c515fb9bfc1415
  SCID_COMMIT: 5837653efa3975c64cff232006d9f981b36ac56b

concurrency:
  group: v2-cbf-cbi-full-product-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Restore frozen Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact convergence ancestry scope and accepted blobs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_BASE_REF:-}"
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          test "$base" = "$CANONICAL_BASE_SHA"
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git merge-base --is-ancestor "$CANONICAL_BASE_SHA" HEAD
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" HEAD
          for path in \
            acs/cbf_cbi_external.py \
            acs/cbf_cbi_qualification.py \
            docs/automation/V2_CBF_CBI_REAL_CORPUS_UNBLOCK.json \
            docs/automation/V2_CBF_CBI_REAL_CORPUS_UNBLOCK.md \
            tests/test_cbf_cbi_external.py \
            tests/test_cbf_cbi_qualification.py \
            tests/test_v2_cbf_cbi_real_corpus_unblock.py
          do
            if git cat-file -e "$CANONICAL_BASE_SHA:$path" 2>/dev/null; then
              echo "Canonical base already owns $path; convergence must be re-audited" >&2
              exit 1
            fi
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_HEAD_SHA:$path")"
          done
          git diff --check "$CANONICAL_BASE_SHA" HEAD
          changed="$(git diff --name-only "$CANONICAL_BASE_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-cbf-cbi-full-product-convergence.yml' \
            'acs/cbf_cbi_external.py' \
            'acs/cbf_cbi_qualification.py' \
            'docs/automation/V2_CBF_CBI_REAL_CORPUS_UNBLOCK.json' \
            'docs/automation/V2_CBF_CBI_REAL_CORPUS_UNBLOCK.md' \
            'tests/test_cbf_cbi_external.py' \
            'tests/test_cbf_cbi_qualification.py' \
            'tests/test_v2_cbf_cbi_real_corpus_unblock.py' | sort)"
          test "$changed" = "$expected"

      - name: Compile bounded reader and qualification seam
        run: python -m py_compile acs/cbf_cbi_external.py acs/cbf_cbi_qualification.py tests/test_cbf_cbi_external.py tests/test_cbf_cbi_qualification.py tests/test_v2_cbf_cbi_real_corpus_unblock.py

      - name: Bounded reader, oracle and no-overclaim contracts
        run: python -m unittest -v tests.test_cbf_cbi_external tests.test_cbf_cbi_qualification tests.test_v2_cbf_cbi_real_corpus_unblock

      - name: Current ChessBase Library and identity compatibility
        run: >-
          python -m pytest -q
          tests/test_cbf_cbi_external.py
          tests/test_cbf_cbi_qualification.py
          tests/test_v2_cbf_cbi_real_corpus_unblock.py
          tests/test_chessbase_adapter.py
          tests/test_chessbase_integrity.py
          tests/test_d07_library_import_service.py
          tests/test_game_identity.py

      - name: Re-materialize frozen Stage1 blobs before broad byte contracts
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic

  pinned-reader-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Accessible Chess candidate
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout exact Scidb source
        uses: actions/checkout@v4
        with:
          repository: foolnotion/scidb
          ref: 7c1c9d89f2fabab0c1252cdd14c515fb9bfc1415
          path: upstream/scidb
          fetch-depth: 1

      - name: Checkout exact Scid source
        uses: actions/checkout@v4
        with:
          repository: lpt/scid
          ref: 5837653efa3975c64cff232006d9f981b36ac56b
          path: upstream/scid
          fetch-depth: 1

      - name: Verify pinned source identities and read-only contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/scidb rev-parse HEAD)" = "$SCIDB_COMMIT"
          test "$(git -C upstream/scid rev-parse HEAD)" = "$SCID_COMMIT"
          test "$(git -C upstream/scidb hash-object src/cbh2si4.cpp)" = "1830d059b987e3b9d4b97803d92f33936a69ace1"
          test "$(git -C upstream/scidb hash-object src/db/cbf/cbf_codec.cpp)" = "c9608dc93e704070c5ec7f8294d09e6c52374b53"
          test "$(git -C upstream/scid hash-object scripts/scidpgn.tcl)" = "84273490e8ee6b47bc78ca26a274ab559845e7b5"
          grep -F 'permission::ReadOnly' upstream/scidb/src/cbh2si4.cpp
          grep -F 'strcmp(cbhPath.c_str() + cbhPath.size() - 4, ".cbf")' upstream/scidb/src/cbh2si4.cpp
          grep -F 'Usage: cbh2si4 [options ...] <ChessBase database> [destination database]' upstream/scidb/src/cbh2si4.cpp
          grep -F 'sc_base open -fast -readonly' upstream/scid/scripts/scidpgn.tcl
          grep -F 'sc_game pgn -tags 1 -comments 1 -var 1' upstream/scid/scripts/scidpgn.tcl

      - name: Install exact-reader build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential tcl8.6 tcl8.6-dev tk8.6 tk8.6-dev \
            libfreetype6-dev libsm-dev libice-dev libx11-dev libxcursor-dev \
            libfontconfig1-dev libgdbm-dev libexpat1-dev zlib1g-dev libminizip-dev

      - name: Build pinned Scidb cbh2si4
        working-directory: upstream/scidb
        shell: bash
        run: |
          set -euo pipefail
          ./configure --prefix="$PWD/_qualified" --exec-prefix="$PWD/_qualified" --disable-freedesktop > "$GITHUB_WORKSPACE/scidb-configure.log" 2>&1
          make -C src recursive -j2 > "$GITHUB_WORKSPACE/scidb-recursive.log" 2>&1
          make -C src cbh2si4 -j2 > "$GITHUB_WORKSPACE/scidb-cbh2si4.log" 2>&1
          test -x src/cbh2si4
          src/cbh2si4 --help > "$GITHUB_WORKSPACE/cbh2si4-help.log" 2>&1
          grep -F 'ChessBase database' "$GITHUB_WORKSPACE/cbh2si4-help.log"
          sha256sum src/cbh2si4 | tee "$GITHUB_WORKSPACE/cbh2si4.sha256"

      - name: Build and execute pinned Scid PGN exporter on neutral SI4
        working-directory: upstream/scid
        shell: bash
        run: |
          set -euo pipefail
          ./configure LANGUAGES="" TB="" > "$GITHUB_WORKSPACE/scid-configure.log" 2>&1
          make -j2 pgnscid tcscid > "$GITHUB_WORKSPACE/scid-build.log" 2>&1
          test -x pgnscid
          test -x tcscid
          test "$(git hash-object scripts/scidpgn.tcl)" = "84273490e8ee6b47bc78ca26a274ab559845e7b5"
          cat > "$GITHUB_WORKSPACE/neutral.pgn" <<'PGN'
          [Event "Neutral exporter qualification"]
          [Site "CI"]
          [Date "2026.08.31"]
          [Round "1"]
          [White "Alpha"]
          [Black "Beta"]
          [Result "1-0"]

          1. e4 {keep comment} e5 (1... c5 {keep variation}) 2. Nf3 Nc6 1-0
          PGN
          ./pgnscid -f "$GITHUB_WORKSPACE/neutral.pgn" > "$GITHUB_WORKSPACE/pgnscid.log" 2>&1
          ./tcscid scripts/scidpgn.tcl "$GITHUB_WORKSPACE/neutral.si4" > "$GITHUB_WORKSPACE/exported.pgn"
          grep -F 'keep comment' "$GITHUB_WORKSPACE/exported.pgn"
          grep -F 'keep variation' "$GITHUB_WORKSPACE/exported.pgn"
          grep -F 'Nf3' "$GITHUB_WORKSPACE/exported.pgn"
          sha256sum tcscid | tee "$GITHUB_WORKSPACE/tcscid.sha256"

      - name: Upload pinned-reader build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-cbf-cbi-full-product-pinned-reader-build
          path: |
            scidb-configure.log
            scidb-recursive.log
            scidb-cbh2si4.log
            cbh2si4-help.log
            cbh2si4.sha256
            scid-configure.log
            scid-build.log
            pgnscid.log
            exported.pgn
            tcscid.sha256
          if-no-files-found: ignore
          retention-days: 7
