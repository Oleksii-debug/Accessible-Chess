name: Current Product Training Keymap Owner Convergence

on:
  pull_request:
    branches:
      - fix/training-progress-recursion-livebase-20261005-sol56x8n3
    paths:
      - '.github/workflows/current-product-training-keymap-owner-convergence.yml'
      - '.github/workflows/owner-oneclick-from-w4.yml'
      - '.github/workflows/webview-keymap-authority.yml'
      - 'acs/webapp_keymap.py'
      - 'tests/test_user_sound_pack_builder.py'
      - 'tests/test_webview_keymap_bridge_contract.py'
  push:
    branches:
      - converge/current-product-training-keymap-owner-20261005-sol56k9m2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-training-keymap-owner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: fix/training-progress-recursion-livebase-20261005-sol56x8n3
  KEYMAP_BRANCH: fix/current-board-analysis-keymap-authority-20261005-sol56
  OWNER_BRANCH: fix/owner-oneclick-clean-restart-20261005

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live source ancestry and exact successor scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ -n "${EVENT_BASE_REF:-}" ]; then
            test "$EVENT_BASE_REF" = "$PRODUCT_BRANCH"
          fi

          git fetch --no-tags origin \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH" \
            "+refs/heads/$KEYMAP_BRANCH:refs/remotes/origin/$KEYMAP_BRANCH" \
            "+refs/heads/$OWNER_BRANCH:refs/remotes/origin/$OWNER_BRANCH"

          product="$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")"
          keymap="$(git rev-parse "refs/remotes/origin/$KEYMAP_BRANCH")"
          owner="$(git rev-parse "refs/remotes/origin/$OWNER_BRANCH")"

          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$product"
          fi
          test "$(git merge-base "$product" HEAD)" = "$product"
          git merge-base --is-ancestor "$keymap" HEAD
          git merge-base --is-ancestor "$owner" HEAD

          git diff --check "$product"...HEAD
          changed="$(git diff --name-only "$product"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-product-training-keymap-owner-convergence.yml' \
            '.github/workflows/owner-oneclick-from-w4.yml' \
            '.github/workflows/webview-keymap-authority.yml' \
            'acs/webapp_keymap.py' \
            'tests/test_user_sound_pack_builder.py' \
            'tests/test_webview_keymap_bridge_contract.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

          echo "PRODUCT_HEAD=$product"
          echo "KEYMAP_HEAD=$keymap"
          echo "OWNER_HEAD=$owner"
          echo "CONVERGENCE_HEAD=$(git rev-parse HEAD)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged Python boundaries
        run: >-
          python -m compileall -q
          acs/training_progress_store.py
          acs/webapp_keymap.py
          tests/test_training_progress_json_prehash_bounds_current.py
          tests/test_webview_keymap_bridge_contract.py
          tests/test_user_sound_pack_builder.py

      - name: Execute retained Training recursion contract
        run: python -m unittest -v tests.test_training_progress_json_prehash_bounds_current

      - name: Execute Board and Analysis keymap authority contract
        run: python -m unittest -v tests.test_webview_keymap_bridge_contract

      - name: Execute owner sound-pack regression contract
        run: python -m unittest -v tests.test_user_sound_pack_builder

      - name: Core selftest
        run: python -m acs.selftest
