name: Final Stage1 Source Composition Validation

on:
  pull_request:
    branches:
      - manual5/integration-20260821
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-stage1-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 1e9d23b034e6d347fe03c3581469a07e16037c55
  STOCKFISH_RUNTIME_BLOB: 23477698de93e7ecb582e9411a3bfacc0976849c
  D01_FOCUS_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  D02_HISTORY_BLOB: 381be891b3701039a70492f0db688530ed96fe5b
  D02_FEN_BLOB: 7001518255575f55d4634c3578c035c526f7d8a4
  D03_ENGINE_BLOB: 59b46bb914c5aae094cde1ce92b232fdbce17f19
  D04_PREFLIGHT_BLOB: 485c876d6476f2b86d3155be3db355084db6094c
  QA_STOCKFISH_SHA: 66d5affbe027a86717a775198ec9fbcf8aba8545
  QA_STOCKFISH_BLOB: f674de79b19a852f29837edab138c20b28f24162
  QA_FEN_SHA: 17e7f2e3a9db821c808a003f12b55da99303067c
  QA_FEN_BLOB: 499538b09f799c43608a6781fe436b0f10f62752
  QA_FOCUS_SHA: 965f8ed95eb2ae4f2e628b77855c0a6dbd0d4321
  QA_FOCUS_BLOB: 2fec761ded7e3af193b6f309f03876141be8ab41
  QA_JSON_SHA: 811ba1c8bb15aeb1241087822f45136e6ee537e8
  QA_JSON_BLOB: 457d8e50d8a30adc9bd5de592f3eff6eedc862c8

jobs:
  final-stage1-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact Product head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve repository LF bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git -c core.autocrlf=false checkout HEAD -- .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest

      - name: Prove exact ancestry, accepted blobs, and narrow Stage1 scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD
          test "$(git rev-parse HEAD:acs/stockfish_runtime.py)" = "$STOCKFISH_RUNTIME_BLOB"
          test "$(git rev-parse HEAD:web/stage1_release_bootstrap.js)" = "$D01_FOCUS_BLOB"
          test "$(git rev-parse HEAD:acs/history.py)" = "$D02_HISTORY_BLOB"
          test "$(git rev-parse HEAD:acs/chesscore.py)" = "$D02_FEN_BLOB"
          test "$(git rev-parse HEAD:acs/engine.py)" = "$D03_ENGINE_BLOB"
          test "$(git rev-parse HEAD:acs/release_preflight.py)" = "$D04_PREFLIGHT_BLOB"
          changed="$(git diff --name-only "$BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/final-stage1-source-composition.yml' \
            'acs/chesscore.py' \
            'acs/engine.py' \
            'acs/history.py' \
            'acs/release_preflight.py' \
            'tests/test_d01_submit_focus_route_contract.py' \
            'tests/test_d03_stockfish_hard_shutdown.py' \
            'tests/test_d04_release_archive_canonicality.py' \
            'tests/test_d04_release_preflight_hygiene.py' \
            'tests/test_d04_stockfish_source_zip_bounds.py' \
            'tests/test_dev2_history_scalar_fail_closed.py' \
            'tests/test_final_master_release_json_canonicality.py' \
            'tests/test_stage1_stockfish_runtime_path_privacy.py' \
            'web/stage1_release_bootstrap.js' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          if printf '%s\n' "$changed" | grep -E '(^|/)(acsdb|chessbase|bookdocument|bookreader|book_index|training|teacher|classroom|remote_lesson)([^/]*)(/|\.|$)' ; then
            echo 'Stage2 contamination detected' >&2; exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict' ; then
            echo 'QA strict harness contamination detected' >&2; exit 1
          fi

      - name: Compile and parse release JavaScript
        run: |
          python -m compileall -q acs tests run_accessible_chess.py
          node --check web/stage1_release_bootstrap.js
          node --check web/stage1_board_actions.js

      - name: Product-owned Stage1 regressions
        run: >-
          python -m unittest -v
          tests.test_d01_submit_focus_route_contract
          tests.test_dev2_history_scalar_fail_closed
          tests.test_d03_stockfish_hard_shutdown
          tests.test_d04_release_preflight_hygiene
          tests.test_d04_release_archive_canonicality
          tests.test_d04_stockfish_source_zip_bounds
          tests.test_final_master_release_json_canonicality
          tests.test_stage1_stockfish_runtime_path_privacy
          tests.test_stockfish_runtime
          tests.test_history
          tests.test_dev2_fen_atomicity
          tests.test_stage1_core_full_flow

      - name: Replay immutable Stage1 QA oracles byte-identically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa_oracles
          mkdir -p qa_oracles
          : > qa_oracles/__init__.py
          git cat-file -e "$QA_STOCKFISH_SHA^{commit}"
          test "$(git rev-parse "$QA_STOCKFISH_SHA:tests/test_dev3_stockfish_runtime_path_privacy.py")" = "$QA_STOCKFISH_BLOB"
          git show "$QA_STOCKFISH_SHA:tests/test_dev3_stockfish_runtime_path_privacy.py" > qa_oracles/test_dev3_stockfish_runtime_path_privacy.py
          git cat-file -e "$QA_FEN_SHA^{commit}"
          test "$(git rev-parse "$QA_FEN_SHA:tests/test_dev4_stage1_fen_counter_error_surface.py")" = "$QA_FEN_BLOB"
          git show "$QA_FEN_SHA:tests/test_dev4_stage1_fen_counter_error_surface.py" > qa_oracles/test_dev4_stage1_fen_counter_error_surface.py
          git cat-file -e "$QA_FOCUS_SHA^{commit}"
          test "$(git rev-parse "$QA_FOCUS_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py")" = "$QA_FOCUS_BLOB"
          git show "$QA_FOCUS_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py" > qa_oracles/test_dev5_stage1_submit_listener_focus_route.py
          git cat-file -e "$QA_JSON_SHA^{commit}"
          test "$(git rev-parse "$QA_JSON_SHA:tests/test_dev4_release_json_duplicate_keys.py")" = "$QA_JSON_BLOB"
          git show "$QA_JSON_SHA:tests/test_dev4_release_json_duplicate_keys.py" > qa_oracles/test_dev4_release_json_duplicate_keys.py
          test "$(git hash-object qa_oracles/test_dev3_stockfish_runtime_path_privacy.py)" = "$QA_STOCKFISH_BLOB"
          test "$(git hash-object qa_oracles/test_dev4_stage1_fen_counter_error_surface.py)" = "$QA_FEN_BLOB"
          test "$(git hash-object qa_oracles/test_dev5_stage1_submit_listener_focus_route.py)" = "$QA_FOCUS_BLOB"
          test "$(git hash-object qa_oracles/test_dev4_release_json_duplicate_keys.py)" = "$QA_JSON_BLOB"
          python -m unittest -v \
            qa_oracles.test_dev3_stockfish_runtime_path_privacy \
            qa_oracles.test_dev4_stage1_fen_counter_error_surface \
            qa_oracles.test_dev5_stage1_submit_listener_focus_route \
            qa_oracles.test_dev4_release_json_duplicate_keys

      - name: Focused Stage1 release contracts
        run: >-
          python -m unittest -v
          tests.test_release_preflight
          tests.test_issue22_release_contract
          tests.test_nvda_p0_contract
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_stage1_release_composition_ui
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_webview_safe_server
          tests.test_legacy_release_workflow_safety
          tests.test_core_release_contracts
          tests.test_engine

      - name: Stage1 stress and privacy set
        run: >-
          python -m pytest -q
          tests/test_stage1_release_path_privacy.py
          tests/test_stage1_stockfish_runtime_path_privacy.py
          tests/test_dev2_history_scalar_fail_closed.py
          tests/test_dev2_fen_atomicity.py
          tests/test_stage1_saturation_history_stress.py
          tests/test_stage1_core_full_flow.py
          tests/test_stage1_packaged_focus_origin_contract.py
          tests/test_d03_stockfish_hard_shutdown.py
          tests/test_d04_release_preflight_hygiene.py
          tests/test_d04_release_archive_canonicality.py
          tests/test_d04_stockfish_source_zip_bounds.py
          tests/test_final_master_release_json_canonicality.py

      - name: Full Stage1 repository regression
        run: |
          python -m unittest discover -s tests -v
          python -m pytest -q tests

      - name: Canonical SELFTEST
        run: python -m acs.selftest

      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
