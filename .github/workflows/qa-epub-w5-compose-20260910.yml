name: QA EPUB Current W5 Composition

on:
  push:
    branches:
      - qa/epub-w5-compose-20260910

permissions:
  contents: read

concurrency:
  group: qa-epub-w5-compose-20260910
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove frozen W5 plus exact owner blobs
        shell: bash
        run: |
          set -euo pipefail
          base=e358bd1ddfafc21f8798f68e0d390fca804e0203
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = 13124884e242fb6054917e1ef5bb8ab592013528
          test "$(git rev-parse HEAD:tests/test_v2_html_semantic_lists.py)" = 0dffabf7d82c51dcedf4f67f0773172c36ec83ba
          test "$(git rev-parse HEAD:acs/book_epub_import.py)" = f55ed184aad2dd8d6d512329fb2e5a0db3b3f442
          test "$(git rev-parse HEAD:tests/test_v2_book_epub_import.py)" = 46f95785779b480bc21ca27cc17e5c964c5d5662
          test "$(git rev-parse HEAD:acs/bookdocument.py)" = 42bac4a78bf9148f725cc1f7e638ee0dfc3e4343
          test "$(git rev-parse HEAD:acs/bookreader.py)" = c3220f8969bbb87a60c5ef7e9e51f42bc7c21b52
          test "$(git rev-parse HEAD:acs/gametree.py)" = 102895cb7acb7012cde6d0686ea53b99c33700a6
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = 13c0db6d44ea9ec769240e9d0087641eb4e4382a
      - name: Compile composition
        run: python -m py_compile acs/book_epub_import.py acs/book_html_import.py tests/test_v2_book_epub_import.py tests/test_v2_html_semantic_lists.py
      - name: EPUB semantic and adversarial regressions
        run: python -m unittest -v tests.test_v2_book_epub_import
      - name: Current HTML semantic contracts
        run: >-
          python -m unittest -v
          tests.test_v2_book_html_import
          tests.test_v2_html_semantic_lists
      - name: Canonical Book core and BookReader return-point regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
