name: WordDeck British audio batch

on:
  push:
    branches:
      - worddeck-bootstrap
    paths:
      - WordDeck/Audio/generation-request.json
      - WordDeck/Audio/pronunciation-overrides.tsv
      - WordDeck/tools/generate_british_audio.py
      - WordDeck/tools/validate_pronunciation_overrides.py
      - WordDeck/tools/build_audiopack_manifest.py
      - .github/workflows/worddeck-audio.yml
  workflow_dispatch:

concurrency:
  group: worddeck-audio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      source: ${{ steps.request.outputs.source }}
      start: ${{ steps.request.outputs.start }}
      limit: ${{ steps.request.outputs.limit }}
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Read generation request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          echo "source=$(jq -r '.source' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "start=$(jq -r '.start' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "limit=$(jq -r '.limit' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "female=$(jq -r '.femaleVoice' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "male=$(jq -r '.maleVoice' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "speed=$(jq -r '.speed' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"
          echo "format=$(jq -r '.format' WordDeck/Audio/generation-request.json)" >> "$GITHUB_OUTPUT"

      - name: Restore Oxford 3000 TSV
        if: steps.request.outputs.source == 'oxford3000'
        shell: bash
        run: |
          set -euo pipefail
          cat WordDeck/Data/oxford3000_uk.tsv.gz.b64part* > /tmp/oxford3000.b64
          base64 --decode /tmp/oxford3000.b64 > /tmp/oxford3000.tsv.gz
          gzip -dc /tmp/oxford3000.tsv.gz > /tmp/worddeck-audio-source.tsv
          test -s /tmp/worddeck-audio-source.tsv

      - name: Setup .NET 8 for Oxford 5000 export
        if: steps.request.outputs.source == 'oxford5000'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Export verified Oxford 5000 audio source
        if: steps.request.outputs.source == 'oxford5000'
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ./WordDeck/WordDeck.csproj
          dotnet run --project ./WordDeck/WordDeck.csproj -c Release -- --export-oxford5000-audio-source /tmp/worddeck-audio-source.tsv
          test -s /tmp/worddeck-audio-source.tsv
          actual=$(($(wc -l < /tmp/worddeck-audio-source.tsv) - 1))
          expected=$(grep -E 'public const int ExpectedCanonicalRows = [0-9]+;' WordDeck/ReviewedOxford5000Bootstrap.cs | grep -Eo '[0-9]+' | tail -1)
          echo "Verified Oxford 5000 audio source rows: actual=$actual expected=$expected"
          test "$actual" -eq "$expected"

      - name: Prepare reviewed-safe pronunciation overrides
        if: steps.request.outputs.source == 'pronunciation-overrides-ready'
        shell: bash
        run: |
          set -euo pipefail
          python WordDeck/tools/validate_pronunciation_overrides.py --self-test
          awk -F '\t' 'NR == 1 || $4 == "ready"' WordDeck/Audio/pronunciation-overrides.tsv > /tmp/worddeck-audio-source.tsv
          test -s /tmp/worddeck-audio-source.tsv
          ready_count=$(awk -F '\t' 'NR > 1 && $4 == "ready" { count++ } END { print count+0 }' WordDeck/Audio/pronunciation-overrides.tsv)
          selected_count=$(($(wc -l < /tmp/worddeck-audio-source.tsv) - 1))
          test "$ready_count" -gt 0
          test "$selected_count" -eq "$ready_count"

      - name: Install TTS dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro>=0.9.2' soundfile numpy

      - name: Generate requested batch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/worddeck-audio
          mkdir -p /tmp/worddeck-audio
          python WordDeck/tools/generate_british_audio.py \
            --input /tmp/worddeck-audio-source.tsv \
            --output /tmp/worddeck-audio \
            --start '${{ steps.request.outputs.start }}' \
            --limit '${{ steps.request.outputs.limit }}' \
            --female-voice '${{ steps.request.outputs.female }}' \
            --male-voice '${{ steps.request.outputs.male }}' \
            --speed '${{ steps.request.outputs.speed }}' \
            --format '${{ steps.request.outputs.format }}'

      - name: Validate generated audio and complete Oxford 5000 coverage
        shell: bash
        env:
          SOURCE_KIND: ${{ steps.request.outputs.source }}
          START_INDEX: ${{ steps.request.outputs.start }}
          LIMIT_COUNT: ${{ steps.request.outputs.limit }}
        run: |
          set -euo pipefail
          source_kind='${{ steps.request.outputs.source }}'
          start='${{ steps.request.outputs.start }}'
          limit='${{ steps.request.outputs.limit }}'
          actual=$(find /tmp/worddeck-audio -maxdepth 1 -type f -name '*.${{ steps.request.outputs.format }}' | wc -l)
          manifest_rows=$(wc -l < /tmp/worddeck-audio/manifest.jsonl)
          echo "Generated $actual audio files; manifest rows=$manifest_rows"
          test "$actual" -gt 0
          test "$manifest_rows" -eq "$actual"
          test -s /tmp/worddeck-audio/manifest.jsonl
          if [ "$source_kind" = 'oxford5000' ]; then
            total=$(($(wc -l < /tmp/worddeck-audio-source.tsv) - 1))
            if [ "$limit" -le 0 ]; then expected=$((total-start)); else expected="$limit"; fi
            if [ $((start+expected)) -gt "$total" ]; then expected=$((total-start)); fi
            echo "Oxford 5000 requested selected rows: expected=$expected total=$total"
            test "$actual" -eq "$expected"
            if [ "$start" -eq 0 ] && [ "$limit" -le 0 ]; then
              test "$total" -eq 2138
              test "$actual" -eq 2138
            fi
          fi
          if [ "$source_kind" = 'pronunciation-overrides-ready' ]; then
            ready_count=$(awk -F '\t' 'NR > 1 && $4 == "ready" { count++ } END { print count+0 }' WordDeck/Audio/pronunciation-overrides.tsv)
            expected="$limit"; if [ "$expected" -le 0 ]; then expected="$ready_count"; fi
            test "$expected" -le "$ready_count"; test "$actual" -eq "$expected"
          fi
          find /tmp/worddeck-audio -maxdepth 1 -type f -name '*.${{ steps.request.outputs.format }}' -size -512c -print -quit | grep -q . && { echo 'At least one audio file is suspiciously small.' >&2; exit 1; } || true
          python - <<'PY'
          import csv, hashlib, json, os, subprocess
          from pathlib import Path
          root=Path('/tmp/worddeck-audio'); start=int(os.environ.get('START_INDEX','0')); limit=int(os.environ.get('LIMIT_COUNT','0'))
          records=[json.loads(line) for line in (root/'manifest.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          ids=[str(r.get('id') or '') for r in records]; files=[str(r.get('file') or '') for r in records]
          if len(ids)!=len(set(ids)): raise SystemExit('Audio manifest contains duplicate stable IDs')
          if len(files)!=len(set(files)): raise SystemExit('Audio manifest contains duplicate file names')
          for i,record in enumerate(records,1):
              path=root/str(record.get('file') or ''); digest=str(record.get('sha256') or '')
              if not path.is_file() or path.stat().st_size<=512: raise SystemExit(f'Missing/small audio: {record.get("id")}')
              if hashlib.sha256(path.read_bytes()).hexdigest()!=digest: raise SystemExit(f'SHA mismatch: {record.get("id")}')
              if path.stat().st_size!=int(record.get('bytes') or -1): raise SystemExit(f'Byte mismatch: {record.get("id")}')
              if record.get('accent')!='en-GB' or int(record.get('sample_rate') or 0)!=24000 or float(record.get('speed') or 0)!=1.0: raise SystemExit(f'Unexpected British audio metadata: {record.get("id")}')
              probe=subprocess.run(['ffprobe','-v','error','-select_streams','a:0','-show_entries','stream=codec_name,sample_rate,channels:format=duration','-of','json',str(path)],capture_output=True,text=True,check=True)
              data=json.loads(probe.stdout); streams=data.get('streams') or []
              if not streams: raise SystemExit(f'No playable stream: {record.get("id")}')
              st=streams[0]; duration=float((data.get('format') or {}).get('duration') or 0)
              if st.get('codec_name')!='mp3' or int(st.get('sample_rate') or 0)!=24000 or int(st.get('channels') or 0)!=1 or duration<=0.05: raise SystemExit(f'Invalid MP3 stream: {record.get("id")}')
              if i%250==0: print(f'ffprobe integrity {i}/{len(records)}')
          with Path('/tmp/worddeck-audio-source.tsv').open('r',encoding='utf-8-sig',newline='') as h: source_rows=list(csv.DictReader(h,delimiter='\t'))
          selected=source_rows[start:] if limit<=0 else source_rows[start:start+limit]
          if len(selected)!=len(records): raise SystemExit(f'Source/manifest count mismatch {len(selected)} != {len(records)}')
          for expected,record in zip(selected,records,strict=True):
              eid=(expected.get('entry_id') or expected.get('entryId') or expected.get('id') or '').strip(); source=(expected.get('source') or '').strip()
              if record.get('id')!=eid or record.get('source')!=source: raise SystemExit(f'Identity/source mismatch for {eid}')
              expected_voice='bf_emma' if hashlib.sha256(eid.encode()).digest()[0]<128 else 'bm_george'
              if record.get('voice')!=expected_voice: raise SystemExit(f'Voice mismatch for {eid}')
          print(f'Validated {len(records)} playable MP3s, exact stable IDs, hashes, British config and source mapping.')
          PY

      - name: Build deterministic AudioPack manifest and integrity report
        if: steps.request.outputs.source == 'oxford5000' && steps.request.outputs.start == '0' && steps.request.outputs.limit == '0'
        shell: bash
        run: |
          set -euo pipefail
          python WordDeck/tools/build_audiopack_manifest.py --audio-root /tmp/worddeck-audio --output /tmp/worddeck-audio/audiopack-manifest.json --dictionary-id oxford-3000-en-uk
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('/tmp/worddeck-audio'); m=json.loads((root/'audiopack-manifest.json').read_text(encoding='utf-8'))
          records=[json.loads(x) for x in (root/'manifest.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          if m['entry_count']!=2138 or len(records)!=2138: raise SystemExit('Complete Oxford5000 AudioPack must contain 2138 IDs')
          ids={r['id'] for r in records}; mids={r['entry_id'] for r in m['entries']}
          if ids!=mids or len(ids)!=2138: raise SystemExit('Stable-ID manifest sets disagree')
          physical=list(root.glob('*.mp3'))
          if len(physical)!=2138 or {p.stem for p in physical}!=ids: raise SystemExit('Missing/orphan physical MP3 assets')
          lines=['metric\tvalue','expected_ids\t2138','covered_ids\t2138','physical_assets\t2138','missing\t0','orphan\t0','duplicate_id_collisions\t0','corrupt_or_unplayable\t0','accent\ten-GB','speed\t1.0','sample_rate\t24000','qa_result\tPASS']
          lines.append('manifest_sha256\t'+hashlib.sha256((root/'audiopack-manifest.json').read_bytes()).hexdigest())
          (root/'audio-integrity.tsv').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('Complete Oxford5000 AudioPack integrity PASS: 2138/2138, missing=0, orphan=0, corrupt=0.')
          PY

      - name: Pack batch
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          start='${{ steps.request.outputs.start }}'; limit='${{ steps.request.outputs.limit }}'; source='${{ steps.request.outputs.source }}'
          archive="worddeck-${source}-en-gb-${start}-${limit}.zip"; cd /tmp/worddeck-audio; zip -q -9 -r "/tmp/$archive" .
          artifact="worddeck-${source}-en-gb-${start}-${limit}"; echo "ARCHIVE=/tmp/$archive" >> "$GITHUB_ENV"; echo "ARTIFACT=$artifact" >> "$GITHUB_ENV"; echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload audio batch
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  package-windows:
    name: package-windows-offline-audio
    needs: generate
    if: needs.generate.outputs.source == 'oxford5000' && needs.generate.outputs.start == '0' && needs.generate.outputs.limit == '0'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download complete Oxford 5000 AudioPack
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.generate.outputs.artifact }}
          path: .\artifacts\audio-download
      - name: Unpack actual audio assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem .\artifacts\audio-download -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'Audio artifact ZIP missing.' }
          New-Item -ItemType Directory -Force .\artifacts\audio-unpacked | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath .\artifacts\audio-unpacked -Force
          $count = (Get-ChildItem .\artifacts\audio-unpacked -Filter *.mp3 -File).Count
          if ($count -ne 2138) { throw "Expected 2138 audio assets, got $count." }
      - name: Restore, build and publish Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore .\WordDeck\WordDeck.csproj
          dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore
          dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-win-x64-with-audio
      - name: Install AudioPack beside published EXE and prove offline stable-ID resolution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pack = '.\artifacts\WordDeck-win-x64-with-audio\AudioPacks\oxford-3000-en-uk'
          New-Item -ItemType Directory -Force $pack | Out-Null
          Copy-Item .\artifacts\audio-unpacked\*.mp3 $pack
          Copy-Item .\artifacts\audio-unpacked\audiopack-manifest.json "$pack\manifest.json"
          Copy-Item .\artifacts\audio-unpacked\audio-integrity.tsv "$pack\audio-integrity.tsv"
          $self = Start-Process .\artifacts\WordDeck-win-x64-with-audio\WordDeck.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Published WordDeck self-test failed: $($self.ExitCode)" }
          $source = '.\artifacts\published-oxford5000-audio-source.tsv'
          $export = Start-Process .\artifacts\WordDeck-win-x64-with-audio\WordDeck.exe -ArgumentList @('--export-oxford5000-audio-source', $source) -Wait -PassThru
          if ($export.ExitCode -ne 0) { throw "Published audio-source export failed: $($export.ExitCode)" }
          $rows = Import-Csv -Delimiter "`t" $source
          if ($rows.Count -ne 2138) { throw "Published EXE exported $($rows.Count), expected 2138." }
          $missing = @()
          foreach ($row in $rows) {
            $path = Join-Path $pack ($row.entry_id + '.mp3')
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 512) { $missing += $row.entry_id }
          }
          if ($missing.Count -ne 0) { throw "Published offline AudioPack missing $($missing.Count) stable IDs." }
          $manifest = Get-Content "$pack\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.entry_count -ne 2138) { throw 'Published AudioPack manifest count mismatch.' }
          Write-Host 'Published Windows offline AudioPack resolution PASS: 2138/2138 stable IDs resolve beside WordDeck.exe.'
      - name: Upload published Windows package with actual offline Oxford 5000 audio
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-win-x64-with-oxford5000-audio
          path: .\artifacts\WordDeck-win-x64-with-audio\**
          if-no-files-found: error
          retention-days: 90
