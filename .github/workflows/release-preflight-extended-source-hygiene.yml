name: Release Preflight Extended Source Hygiene

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/release_preflight.py'
      - 'tests/test_release_preflight_extended_source_hygiene.py'
      - '.github/workflows/release-preflight-extended-source-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Prove bounded scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/release-preflight-extended-source-hygiene.yml' \
            'acs/release_preflight.py' \
            'tests/test_release_preflight_extended_source_hygiene.py' | sort)"
          test "$changed" = "$expected"
      - name: Compile release preflight
        run: python -m py_compile acs/release_preflight.py tests/test_release_preflight_extended_source_hygiene.py
      - name: Run source hygiene regression
        run: python -m unittest -v tests.test_release_preflight_extended_source_hygiene
      - name: Run retained release preflight regressions
        run: python -m unittest discover -s tests -p 'test_*release_preflight*.py' -v
