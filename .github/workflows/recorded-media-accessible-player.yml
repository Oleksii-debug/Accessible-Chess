name: Recorded Media Accessible Player

on:
  push:
    branches:
      - fix/recorded-media-player-browser-boundary-20261006-ac7m2
    paths:
      - web/recorded_media_accessible_player.js
      - tests/js/recorded_media_accessible_player_dom_test.js
      - .github/workflows/recorded-media-accessible-player.yml
  pull_request:
    branches:
      - feat/recorded-media-accessible-player-20261006-sol56
    paths:
      - acs/recorded_media_accessibility.py
      - web/recorded_media_accessible_player.js
      - tests/test_recorded_media_accessibility.py
      - tests/js/recorded_media_accessible_player_dom_test.js
      - .github/workflows/recorded-media-accessible-player.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorded-media-accessible-player-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact recorded-media parent and bounded scope
        shell: bash
        env:
          EXPECTED_PARENT_BRANCH: feat/recorded-media-accessible-player-20261006-sol56
          EXPECTED_PARENT: 30bc1cc7732fddf8f24720b99c009d6f75744e71
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch --no-tags origin "+refs/heads/$EXPECTED_PARENT_BRANCH:refs/remotes/origin/recorded-media-parent"
          live_parent="$(git rev-parse refs/remotes/origin/recorded-media-parent)"
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$live_parent"
          test "$(git rev-parse "$live_parent:web/recorded_media_accessible_player.js")" = "$(git rev-parse "$EXPECTED_PARENT:web/recorded_media_accessible_player.js")"
          test "$(git rev-parse "$live_parent:tests/js/recorded_media_accessible_player_dom_test.js")" = "$(git rev-parse "$EXPECTED_PARENT:tests/js/recorded_media_accessible_player_dom_test.js")"
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD
          changed="$(git diff --name-only "$EXPECTED_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/recorded-media-accessible-player.yml' \
            'tests/js/recorded_media_accessible_player_dom_test.js' \
            'web/recorded_media_accessible_player.js' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'RECORDED_MEDIA_PLAYER_BROWSER_BOUNDARY_SCOPE_DRIFT\n%s\n' "$changed" >&2
            exit 1
          }
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.js' '*.yml' || true)"

      - name: Check browser boundary syntax
        run: |
          node --check web/recorded_media_accessible_player.js
          node --check tests/js/recorded_media_accessible_player_dom_test.js

      - name: Run browser keyboard and screen-reader DOM contract
        run: node tests/js/recorded_media_accessible_player_dom_test.js
