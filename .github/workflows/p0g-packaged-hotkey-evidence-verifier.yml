name: P0-G Packaged Hotkey Evidence Verifier

on:
  pull_request:
    paths:
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'scripts/verify_p0g_packaged_hotkey_result_evidence.py'
      - 'tests/test_verify_p0g_packaged_hotkey_result_evidence.py'
      - 'tests/test_verify_p0g_packaged_hotkey_result_cli.py'
      - '.github/workflows/p0g-packaged-hotkey-evidence-verifier.yml'
  push:
    paths:
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'scripts/verify_p0g_packaged_hotkey_result_evidence.py'
      - 'tests/test_verify_p0g_packaged_hotkey_result_evidence.py'
      - 'tests/test_verify_p0g_packaged_hotkey_result_cli.py'
      - '.github/workflows/p0g-packaged-hotkey-evidence-verifier.yml'

permissions:
  contents: read

jobs:
  verifier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Compile verifier and tests
        run: >-
          python -m py_compile
          scripts/verify_p0g_packaged_hotkey_result_evidence.py
          tests/test_verify_p0g_packaged_hotkey_result_evidence.py
          tests/test_verify_p0g_packaged_hotkey_result_cli.py
      - name: Run verifier and CLI contracts
        run: >-
          python -m unittest -v
          tests.test_verify_p0g_packaged_hotkey_result_evidence
          tests.test_verify_p0g_packaged_hotkey_result_cli
