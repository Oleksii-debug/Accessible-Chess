name: Library Search State Atomicity

on:
  pull_request:
    branches:
      - fix/library-delegated-route-atomicity-20261003
    paths:
      - 'acs/full_product_presenters.py'
      - 'acs/library_webview_projection.py'
      - 'acs/library_export_webview_projection.py'
      - 'tests/test_d07_library_export_webview.py'
      - 'tests/test_version2_application.py'
      - '.github/workflows/library-search-state-atomicity.yml'

permissions:
  contents: read

concurrency:
  group: library-search-state-atomicity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atomic-state:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, exact scope, and blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          base_branch='fix/library-delegated-route-atomicity-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$base_branch"

          base_ref="refs/remotes/origin/$base_branch"
          git fetch --no-tags origin "+refs/heads/$base_branch:$base_ref"
          live_base="$(git rev-parse "$base_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_base"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"

          changed="$(git diff --name-only "$live_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-search-state-atomicity.yml' \
            'acs/full_product_presenters.py' \
            'acs/library_export_webview_projection.py' \
            'acs/library_webview_projection.py' \
            'tests/test_d07_library_export_webview.py' \
            'tests/test_version2_application.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/full_product_presenters.py)" = "09459c9a3e0e431ca4e547ea6cf56dd23f9b42d0"
          test "$(git rev-parse HEAD:acs/library_webview_projection.py)" = "45aa26db55a90667b11caf0838ec94985e1101ad"
          test "$(git rev-parse HEAD:acs/library_export_webview_projection.py)" = "c4e5ce6bcf846d44f5c30ce0f4e6832584cae3b8"
          test "$(git rev-parse HEAD:tests/test_d07_library_export_webview.py)" = "d7a78a64d65a72cde7dac928999982ae7ac24a90"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "8651a45c6aabf29e094d8fdc14923e13afdeaf16"
          git diff --check "$live_base" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Library state boundary
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          acs/library_webview_projection.py
          acs/library_export_webview_projection.py
          tests/test_d07_library_export_webview.py
          tests/test_version2_application.py

      - name: Prove failed search preserves committed Library state
        run: >-
          python -m unittest -v
          tests.test_d07_library_export_webview
          tests.test_version2_application
          tests.test_dev1_full_product_webview_adapter
