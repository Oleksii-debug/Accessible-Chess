name: Books External Open Transaction

on:
  pull_request:
    branches:
      - 'converge/books-semantic-toolbar-live-20261003'
    paths:
      - '.github/workflows/books-external-open-transaction.yml'
      - 'acs/version2_application.py'
      - 'tests/test_version2_application.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-external-open-transaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-open-transaction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live Books parent and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='converge/books-semantic-toolbar-live-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$parent_branch:refs/remotes/origin/$parent_branch"
          live_parent="$(git rev-parse "refs/remotes/origin/$parent_branch")"
          git merge-base --is-ancestor "$live_parent" HEAD

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/books-external-open-transaction.yml' \
              'acs/version2_application.py' \
              'tests/test_version2_application.py' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/version2_application.py)" = "ea8265980d8ba0bcdf9ccbc5dc3ba6b469ad738b"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "33d9e087eef7afc07fa2a58773eebf4da4cb836c"
          test "$(git rev-parse HEAD:acs/version2_book_workspace.py)" = "cccbc04eb4c36da1dd60d149e12e4b87dd29ada5"
          test "$(git rev-parse HEAD:acs/book_text_import.py)" = "1e2f8360da45ef4ab7b03b6179b0c03bf0ad473c"
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = "51b7d0f1e0b951a8fe501b696c220df2975a4e66"
          test "$(git rev-parse HEAD:acs/book_epub_import.py)" = "f86d1c0881b82520b7bec0a82fe88fc0903be00a"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed application boundary
        run: >-
          python -m compileall -q
          acs/version2_application.py
          tests/test_version2_application.py

      - name: Prove external Book open and retained semantic owners
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_version2_book_workspace
          tests.test_v2_book_board_workflow
          tests.test_book_bidirectional_semantic_navigation
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import
