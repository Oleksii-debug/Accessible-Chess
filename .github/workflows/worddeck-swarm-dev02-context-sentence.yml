name: WordDeck DEV02 Stage 11 Context Gate

on:
  push:
    branches:
      - worddeck-swarm-dev02-context-sentence
  pull_request:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/**'
      - '.github/workflows/worddeck-swarm-dev02-context-sentence.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: worddeck-dev02-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-gate:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Publish pending exact-tip status
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'WordDeck DEV02 Stage 11 Context Gate',
              description: 'DEV02 exact-tip Windows + live attributed corpus gate is running.',
              target_url: targetUrl
            });

      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate SentencePack release and attributed-pair tooling
        shell: pwsh
        run: |
          python .\WordDeck\tools\validate_sentencepack_release_bundle.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\WordDeck\tools\build_tatoeba_ccby_pairs.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Build Release warnings as errors
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror

      - name: Run complete source-build self-test suite
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Publish self-contained Windows x64
        run: dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-dev02-context

      - name: Run published EXE self-test
        shell: pwsh
        run: |
          & .\artifacts\WordDeck-dev02-context\WordDeck.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no personal state in publish tree
        shell: pwsh
        run: |
          $bad = Get-ChildItem -LiteralPath '.\artifacts\WordDeck-dev02-context' -Recurse -File | Where-Object {
            $_.Name -match '^(state|spelling-state|sentence-state|sentence-coach-state)(\.backup)?\.json$' -or
            $_.Name -match '^WordDeck-profile.*\.json$' -or
            $_.FullName -match '[\\/]Backups[\\/]'
          }
          if ($bad) {
            $bad | ForEach-Object { Write-Error "Personal state leaked into publish tree: $($_.FullName)" }
            exit 1
          }

      - name: Cyrillic and spaces path smoke
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'WordDeck контекст DEV02\Published App'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path '.\artifacts\WordDeck-dev02-context\*' -Destination $target -Recurse -Force
          & (Join-Path $target 'WordDeck.exe') --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build current attributed EN-UA pair evidence from official Tatoeba exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.\artifacts\context-corpus' | Out-Null
          python .\WordDeck\tools\build_tatoeba_ccby_pairs.py `
            --download-dir .\artifacts\context-corpus\upstream `
            --output .\artifacts\context-corpus\tatoeba-en-uk-attributed.tsv `
            --manifest .\artifacts\context-corpus\tatoeba-en-uk-attributed.tsv.manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build exact current attributed SentencePack and SQLite evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --build-tatoeba-sentence-pack `
            .\artifacts\context-corpus\tatoeba-en-uk-attributed.tsv `
            .\artifacts\context-corpus\WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-v1.json `
            tatoeba-en-uk-attributed-ccby-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          @'
          from pathlib import Path
          import gzip
          source = Path(r'artifacts/context-corpus/WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-v1.json')
          target = Path(str(source) + '.gz')
          with source.open('rb') as src, target.open('wb') as raw:
              with gzip.GzipFile(filename='', mode='wb', fileobj=raw, compresslevel=9, mtime=0) as out:
                  while True:
                      block = src.read(1024 * 1024)
                      if not block:
                          break
                      out.write(block)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-sentence-pack `
            .\artifacts\context-corpus\WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-v1.json.gz `
            .\artifacts\context-corpus\sentencepack-load-metrics.json `
            --sqlite `
            .\artifacts\context-corpus\WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-v1.sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify live provenance and exact SQLite identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Resolve-Path '.\artifacts\context-corpus'
          $manifestPath = Join-Path $root 'tatoeba-en-uk-attributed.tsv.manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.license -ne 'CC BY 2.0 FR') { throw "Unexpected attributed corpus license: $($manifest.license)" }
          if ($manifest.source -notmatch '^Tatoeba official') { throw 'Attributed corpus manifest is not bound to official Tatoeba exports.' }
          foreach ($name in @('english_detailed','ukrainian_detailed','links')) {
            $hash = [string]$manifest.input_sha256.$name
            if ($hash -notmatch '^[0-9a-f]{64}$') { throw "Missing/invalid upstream SHA256 for $name." }
          }
          $tsv = Join-Path $root 'tatoeba-en-uk-attributed.tsv'
          $actualTsv = (Get-FileHash -LiteralPath $tsv -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualTsv -ne ([string]$manifest.output_sha256).ToLowerInvariant()) { throw 'Attributed pair TSV hash does not match its provenance manifest.' }
          if ([int]$manifest.stats.pairs_emitted -lt 208408) { throw "Live attributed pair evidence regressed below the historical 208408-pair floor: $($manifest.stats.pairs_emitted)" }

          $sqlite = Join-Path $root 'WordDeck-SentencePack-Tatoeba-EN-UA-CCBY-v1.sqlite'
          if (-not (Test-Path -LiteralPath $sqlite)) { throw 'Live attributed EN-UA SQLite corpus was not created.' }
          $actual = (Get-FileHash -LiteralPath $sqlite -Algorithm SHA256).Hash.ToLowerInvariant()
          "CONTEXT_SQLITE=$sqlite" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CONTEXT_SQLITE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Measure exact live lexical-form-aware 1 2 3 target coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.\artifacts\context-evidence' | Out-Null
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-context-coverage `
            "$env:CONTEXT_SQLITE" `
            .\artifacts\context-evidence\context-coverage.json `
            "$env:CONTEXT_SQLITE_SHA" `
            tatoeba-en-uk-attributed-ccby-v1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate live corpus provenance boundary and historical quality floors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $doc = Get-Content -LiteralPath '.\artifacts\context-evidence\context-coverage.json' -Raw | ConvertFrom-Json
          $p = $doc.Payload
          if ($p.SourceId -ne 'tatoeba-en-uk-attributed-ccby-v1') { throw 'Unexpected corpus PackId.' }
          if ($p.DatabaseSha256 -ne $env:CONTEXT_SQLITE_SHA) { throw 'Coverage evidence is not bound to exact live SQLite hash.' }
          if ($p.DictionaryEntryCount -ne 5446 -or -not $p.ExactOxford5446Verified) { throw 'Coverage evidence is not bound to exact Oxford 5446 universe.' }
          if (-not $p.ExactDatabaseIdentityVerified -or -not $p.CanSupportRealCorpusCoverageClaim) { throw 'Exact live real-corpus identity was not verified.' }
          if ($p.RedistributionApproved) { throw 'Coverage tooling must never self-approve redistribution.' }
          if ($p.SentenceCount -lt 208408) { throw "Live corpus regressed below historical sentence floor 208408: $($p.SentenceCount)" }
          if ($p.OneTarget.CoveredEntryCount -lt 4492) { throw "One-target coverage regressed below historical floor 4492: $($p.OneTarget.CoveredEntryCount)" }
          if ($p.TwoTarget.CoveredEntryCount -lt 4469) { throw "Two-target coverage regressed below historical floor 4469: $($p.TwoTarget.CoveredEntryCount)" }
          if ($p.ThreeTarget.CoveredEntryCount -lt 4362) { throw "Three-target coverage regressed below historical floor 4362: $($p.ThreeTarget.CoveredEntryCount)" }

          $physicalDoc = Get-Content -LiteralPath '.\artifacts\context-evidence\context-coverage.physical-forms.json' -Raw | ConvertFrom-Json
          $physical = $physicalDoc.Payload
          if ($physical.DictionaryEntryCount -ne 5446 -or $physical.UniqueLexicalFormCount -ge 5446) { throw 'Physical-form denominator must collapse at least one homographic stable-ID group.' }
          if ($physical.AmbiguousLexicalFormCount -le 0 -or $physical.StableIdsInAmbiguousLexicalForms -le $physical.AmbiguousLexicalFormCount) { throw 'Physical-form ambiguity accounting is missing or inconsistent.' }
          foreach ($depth in @($physical.OneTarget,$physical.TwoTarget,$physical.ThreeTarget)) {
            if ($depth.CoveredLexicalFormCount + $depth.UncoveredLexicalFormCount -ne $physical.UniqueLexicalFormCount) { throw 'Physical-form coverage does not partition its unique lexical-form universe.' }
          }
          if ($physical.RedistributionApproved) { throw 'Physical-form evidence must not approve redistribution.' }

          $stableDoc = Get-Content -LiteralPath '.\artifacts\context-evidence\context-coverage.stable-identities.json' -Raw | ConvertFrom-Json
          $stable = $stableDoc.Payload
          if ($stable.StableTagEvidenceSha256 -ne $doc.EvidenceDigestSha256) { throw 'Stable-ID evidence is not bound to the exact stable-tag evidence document.' }
          if ($stable.PhysicalFormEvidenceSha256 -ne $physicalDoc.EvidenceDigestSha256) { throw 'Stable-ID evidence is not bound to the exact physical-form evidence document.' }
          foreach ($depth in @($stable.OneTarget,$stable.TwoTarget,$stable.ThreeTarget)) {
            if ($depth.ResolvedStableCoveredEntryCount + $depth.UnresolvedAmbiguousEntryCount + $depth.StableTagAbsentEntryCount -ne 5446) { throw 'Stable-ID coverage does not partition the exact Oxford universe.' }
            if ($depth.ResolvedStableCoveredEntryCount -gt $depth.StableTagParticipatingEntryCount) { throw 'Resolved stable-ID coverage cannot exceed stable-tag participation.' }
          }
          if ($stable.OneTarget.UnresolvedAmbiguousEntryCount -le 0) { throw 'Stable-tag-participating homographic stable IDs must remain explicitly unresolved without POS/sense evidence.' }
          if ($stable.RedistributionApproved) { throw 'Stable-ID evidence must not approve redistribution.' }

          $gap = Get-Content -LiteralPath '.\artifacts\context-evidence\context-coverage.gaps.json' -Raw | ConvertFrom-Json
          if ($gap.Payload.MissingOneTargetCount -ne (5446 - $p.OneTarget.CoveredEntryCount)) { throw 'One-target gap accounting does not match live coverage.' }
          if ($gap.Payload.MissingNaturalPairOnlyCount -lt 0 -or $gap.Payload.MissingNaturalTripleOnlyCount -lt 0) { throw 'Live gap accounting contains an invalid negative count.' }
          Write-Host ("Live exact EN-UA evidence: sentences={0}; stable one/two/three={1}/{2}/{3}; historical floors=208408,4492/4469/4362" -f `
            $p.SentenceCount,$p.OneTarget.CoveredEntryCount,$p.TwoTarget.CoveredEntryCount,$p.ThreeTarget.CoveredEntryCount)

      - name: Preserve non-redistributable provenance metadata with coverage evidence
        shell: pwsh
        run: |
          Copy-Item -LiteralPath '.\artifacts\context-corpus\tatoeba-en-uk-attributed.tsv.manifest.json' -Destination '.\artifacts\context-evidence\tatoeba-en-uk-attributed.tsv.manifest.json'
          Copy-Item -LiteralPath '.\artifacts\context-corpus\sentencepack-load-metrics.json' -Destination '.\artifacts\context-evidence\sentencepack-load-metrics.json'

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-dev02-context-evidence-${{ github.sha }}
          path: artifacts/context-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish final exact-tip status
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'WordDeck DEV02 Stage 11 Context Gate',
              description: succeeded ? 'DEV02 Stage-11 exact-tip gate passed.' : 'DEV02 Stage-11 exact-tip gate failed.',
              target_url: targetUrl
            });