name: Current Book Open Background Preparation

on:
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
    paths:
      - 'acs/full_product_actions.py'
      - 'acs/full_product_native_menu.py'
      - 'acs/version2_application.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_windows_book_open_worker.py'
      - 'tests/test_book_open_preparation.py'
      - 'tests/test_full_product_native_menu.py'
      - 'tests/test_version2_windows_book_open_worker.py'
      - '.github/workflows/current-book-open-background-preparation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-open-background-preparation-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact current Product successor and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRODUCT_REF: converge/current-product-books-provider-20261005-ooxple7
          PINNED_PRODUCT_SHA: 858e25841ccfd0e362083b28f6da17dfc5fcabdc
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "${EVENT_BASE_REF:-$PRODUCT_REF}" = "$PRODUCT_REF"

          if [ -n "${{ github.event.pull_request.number }}" ]; then
            git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
            test "$(git rev-parse FETCH_HEAD)" = "$expected_head" || {
              echo "BOOK_OPEN_BACKGROUND_PREPARATION_SUPERSEDED" >&2
              exit 1
            }
          fi

          git fetch --no-tags origin "+refs/heads/$PRODUCT_REF:refs/remotes/origin/$PRODUCT_REF"
          live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_REF")"
          test "$live_product" = "$PINNED_PRODUCT_SHA" || {
            echo "BOOK_OPEN_BACKGROUND_PREPARATION_PRODUCT_MOVED pinned=$PINNED_PRODUCT_SHA live=$live_product" >&2
            exit 1
          }
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_product"
          fi

          git merge-base --is-ancestor "$live_product" HEAD
          test "$(git merge-base "$live_product" HEAD)" = "$live_product"
          git diff --check "$live_product"...HEAD

          changed="$(git diff --name-only "$live_product"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-book-open-background-preparation.yml' \
            'acs/full_product_actions.py' \
            'acs/full_product_native_menu.py' \
            'acs/version2_application.py' \
            'acs/version2_release_app.py' \
            'acs/version2_windows_book_open_worker.py' \
            'tests/test_book_open_preparation.py' \
            'tests/test_full_product_native_menu.py' \
            'tests/test_version2_windows_book_open_worker.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected Book Open worker scope:\n%s\n' "$changed" >&2
            exit 1
          }

          echo "BOOK_OPEN_BACKGROUND_PREPARATION_PRODUCT=$live_product"
          echo "BOOK_OPEN_BACKGROUND_PREPARATION_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Book Open boundary
        run: >-
          python -m compileall -q
          acs/full_product_actions.py
          acs/full_product_native_menu.py
          acs/version2_application.py
          acs/version2_release_app.py
          acs/version2_windows_book_open_worker.py
          tests/test_book_open_preparation.py
          tests/test_full_product_native_menu.py
          tests/test_version2_windows_book_open_worker.py

      - name: Execute Book Open transaction and semantic regressions
        run: >-
          python -m unittest -v
          tests.test_book_open_preparation
          tests.test_version2_windows_book_open_worker
          tests.test_book_open_source_authority
          tests.test_v2_book_transaction_current_runtime
          tests.test_version2_application
          tests.test_full_product_native_menu
          tests.test_w3_p0f_starter_books_training_content
          tests.test_version2_release_app

      - name: Core selftest
        run: python -m acs.selftest
