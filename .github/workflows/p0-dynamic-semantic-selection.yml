name: P0 Dynamic Semantic Selection Qualification

on:
  pull_request:
    paths:
      - 'web/p0_accessibility_runtime.js'
      - 'web/full_product_pgn.js'
      - 'web/full_product_education.js'
      - 'tests/js/p0_accessibility_runtime_test.js'
      - 'tests/js/p0_accessibility_partial_replacement_test.js'
      - 'tests/test_p0_dynamic_selection_action_delivery.py'
      - 'tests/test_p0_dynamic_selection_partial_replacement.py'
      - 'tests/test_p0_semantic_document_copy.py'
      - '.github/workflows/p0-dynamic-semantic-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-selection:
    name: Dynamic semantic selection (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install focused test tooling
        run: python -m pip install --disable-pip-version-check pytest

      - name: Parse accessibility and surface JavaScript
        run: |
          node --check web/p0_accessibility_runtime.js
          node --check web/full_product_pgn.js
          node --check web/full_product_education.js
          node --check tests/js/p0_accessibility_runtime_test.js
          node --check tests/js/p0_accessibility_partial_replacement_test.js

      - name: Execute dynamic selection JavaScript oracles
        run: |
          node tests/js/p0_accessibility_runtime_test.js
          node tests/js/p0_accessibility_partial_replacement_test.js

      - name: Run focused unittest contracts
        run: >-
          python -m unittest
          tests.test_p0_dynamic_selection_action_delivery
          tests.test_p0_dynamic_selection_partial_replacement
          tests.test_p0_semantic_document_copy

      - name: Run focused pytest contracts
        run: >-
          python -m pytest -q
          tests/test_p0_dynamic_selection_action_delivery.py
          tests/test_p0_dynamic_selection_partial_replacement.py
          tests/test_p0_semantic_document_copy.py
