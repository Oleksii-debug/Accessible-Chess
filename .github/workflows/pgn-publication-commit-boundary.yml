name: PGN Publication Commit Boundary

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/pgn_service.py'
      - 'tests/test_pgn_service.py'
      - '.github/workflows/pgn-publication-commit-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-publication-commit-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove current Product ancestry and bounded writer scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_BASE_REF" = "work/full-product-teacher-education-reachability-20260911"
          test -n "$EVENT_BASE_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$PR_BASE_REF"
          live_base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
          test -n "$live_base"
          if ! git merge-base --is-ancestor "$live_base" HEAD; then
            echo "Current Product base $live_base is not an ancestor of PGN publication candidate."
            exit 1
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base...HEAD"
          mapfile -t actual < <(git diff --name-only "$live_base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/pgn-publication-commit-boundary.yml'
            'acs/pgn_service.py'
            'tests/test_pgn_service.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected PGN publication scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          git diff --quiet "$live_base...HEAD" -- \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            acs/pgn_document.py \
            acs/chesscore.py
          echo "PGN_PUBLICATION_LIVE_BASE=$live_base"
          echo 'PGN_PUBLICATION_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile canonical PGN writer
        run: python -m py_compile acs/pgn_service.py tests/test_pgn_service.py

      - name: Run canonical PGN publication and document contracts
        run: >-
          python -m unittest -v
          tests.test_pgn_service
          tests.test_pgn_document
          tests.test_pgn_roundtrip
