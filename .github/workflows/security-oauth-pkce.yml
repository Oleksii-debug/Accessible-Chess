name: Security OAuth PKCE Contract

on:
  pull_request:
    paths:
      - 'acs/oauth_pkce.py'
      - 'tests/test_oauth_pkce.py'
      - '.github/workflows/security-oauth-pkce.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile contract and tests
        run: python -m py_compile acs/oauth_pkce.py tests/test_oauth_pkce.py

      - name: Execute focused OAuth PKCE contract
        run: python -m unittest -v tests.test_oauth_pkce

      - name: Enforce provider-neutral boundary
        shell: python
        run: |
          from pathlib import Path
          source = Path('acs/oauth_pkce.py').read_text(encoding='utf-8')
          forbidden = (
              'requests', 'urllib.request', 'http.client', 'socket.',
              'stripe', 'paypal', 'client_secret', 'refresh_token',
              'acs.entitlements', 'acs.secret_store', 'webbrowser.',
          )
          found = [token for token in forbidden if token in source]
          if found:
              raise SystemExit(f'provider-neutral OAuth boundary violation: {found}')
          print('OAUTH_PKCE_PROVIDER_NEUTRAL_BOUNDARY=PASS')

      - name: Core selftest
        run: python -m acs.selftest
