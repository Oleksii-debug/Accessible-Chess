name: Media Application Restore Position

on:
  pull_request:
    branches:
      - work/accessible-chess-20261005-media-core-sol56n4q8
  push:
    branches:
      - work/media-application-restore-position-20261005-sol56
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-application-restore-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact Media Core parent and bounded scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MEDIA_CORE_PARENT: 50c27fe9ff0f8899438d8aba4ee455119b01fe13
          MEDIA_CORE_BRANCH: work/accessible-chess-20261005-media-core-sol56n4q8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$MEDIA_CORE_PARENT" HEAD)" = "$MEDIA_CORE_PARENT"
          git merge-base --is-ancestor "$MEDIA_CORE_PARENT" HEAD

          git fetch --no-tags origin "+refs/heads/$MEDIA_CORE_BRANCH:refs/remotes/origin/media-core-parent"
          live_parent="$(git rev-parse refs/remotes/origin/media-core-parent)"
          test "$live_parent" = "$MEDIA_CORE_PARENT" || {
            printf 'MEDIA_CORE_PARENT_MOVED expected=%s live=%s\n' "$MEDIA_CORE_PARENT" "$live_parent" >&2
            exit 1
          }

          git diff --check "$MEDIA_CORE_PARENT"...HEAD
          changed="$(git diff --name-only "$MEDIA_CORE_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n'             '.github/workflows/media-application-restore-position.yml'             'acs/media_application.py'             'tests/test_media_application.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'UNEXPECTED_MEDIA_APPLICATION_SCOPE\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/media_application.py)" = 'b603e86e3d7eb7f7256ffeb943abf223d97e2bf5'
          test "$(git rev-parse HEAD:tests/test_media_application.py)" = '44d1ea42a225f89aa922c891098c348439d69e57'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Media application boundary
        run: >-
          python -m compileall -q
          acs/media_core.py
          acs/media_application.py
          tests/test_media_core.py
          tests/test_media_application.py

      - name: Execute Media Core and application regressions
        run: >-
          python -m unittest -v
          tests.test_media_core
          tests.test_media_application
