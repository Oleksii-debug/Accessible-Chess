name: Current Shipping File Runtime Refused Close Recovery

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-shipping-file-runtime-refused-close-recovery-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PARENT_SHA: c2b84654f1aba46970233f2370d71a07dbff4c79
  PUMP_BLOB: 34629258281fcb7e0680e193978fe6300fc75723
  RUNTIME_BLOB: 39b7db1f730fd2ed6e18ff8f21b752a7c5847e21
  PUMP_TEST_BLOB: e61a29469060e28a4f1fc801285e7cdcab67479b
  RUNTIME_TEST_BLOB: 96c5ef8f835c5c9b4a8c3ef5883f7c1cc2469a73

jobs:
  refused-close-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact parent, scope and blobs
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi
          git cat-file -e "$PARENT_SHA^{commit}"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          git diff --check "$PARENT_SHA"...HEAD
          mapfile -t paths < <(git diff --name-only "$PARENT_SHA"...HEAD | sort)
          expected=(
            ".github/workflows/current-shipping-file-runtime-refused-close-recovery.yml"
            "acs/version2_windows_host_runtime.py"
            "acs/version2_windows_import_ui_pump.py"
            "tests/test_v2_windows_host_runtime.py"
            "tests/test_v2_windows_import_ui_pump.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done
          test "$(git rev-parse HEAD:acs/version2_windows_import_ui_pump.py)" = "$PUMP_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_host_runtime.py)" = "$RUNTIME_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_import_ui_pump.py)" = "$PUMP_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_host_runtime.py)" = "$RUNTIME_TEST_BLOB"

      - name: Compile recovery boundaries
        run: >-
          python -m py_compile
          acs/version2_windows_import_ui_pump.py
          acs/version2_windows_host_runtime.py
          tests/test_v2_windows_import_ui_pump.py
          tests/test_v2_windows_host_runtime.py

      - name: Execute file-runtime recovery contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_version2_application
          tests.test_w5_native_formclosing_dirty_pgn
          tests.test_version2_release_ui

      - name: Execute adjacent persistence and whole-product contracts
        run: >-
          python -m unittest -v
          tests.test_work_v2_shutdown_progress_failure_cleanup
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_nvda_file_workflows
          tests.test_whole_product_user_journey
