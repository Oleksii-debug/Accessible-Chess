name: Current Keymap Profile Ingress

on:
  pull_request:
    branches:
      - converge/current-history-recovery-after-keybindings-20261004-sol56h4
    paths:
      - 'acs/ui_keymap_service.py'
      - 'web/stage1_board_actions.js'
      - 'tests/test_keymap_profile_ingress_current.py'
      - 'tests/js/stage1_keymap_import_boundary_test.js'
      - '.github/workflows/keymap-profile-ingress-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keymap-profile-ingress-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            base_ref="converge/current-history-recovery-after-keybindings-20261004-sol56h4"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/keymap-profile-ingress-current.yml' \
            'acs/ui_keymap_service.py' \
            'tests/js/stage1_keymap_import_boundary_test.js' \
            'tests/test_keymap_profile_ingress_current.py' \
            'web/stage1_board_actions.js' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected keymap-profile ingress scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile bounded keymap ingress surfaces
        run: >-
          python -m compileall -q
          acs/ui_keymap_service.py
          acs/keybindings.py
          tests/test_keymap_profile_ingress_current.py
          tests/test_ui_keymap_service.py
          tests/test_keybindings_passive_boundary.py
          tests/test_stage1_unbound_shortcut_capture.py
          tests/test_accessible_webui.py

      - name: Execute browser pre-read keymap boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check web/stage1_board_actions.js
          node --check tests/js/stage1_keymap_import_boundary_test.js
          node tests/js/stage1_keymap_import_boundary_test.js
          node tests/js/stage1_help_focus_test.js
          node tests/js/stage1_terminal_keymap_dom_test.js

      - name: Execute keymap ingress and accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_keymap_profile_ingress_current
          tests.test_ui_keymap_service
          tests.test_keybindings_passive_boundary
          tests.test_stage1_unbound_shortcut_capture
          tests.test_accessible_webui
          tests.test_stage1_release_composition_ui
          tests.test_v2_remapped_keyboard_routing
          tests.test_nvda_p0_contract

      - name: Core selftest
        run: python -m acs.selftest
