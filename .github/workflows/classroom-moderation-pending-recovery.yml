name: Classroom Moderation Pending Recovery

on:
  pull_request:
    branches:
      - feature/classroom-moderation-sqlite-ledger-20261002
    paths:
      - 'acs/classroom_moderation_rpc.py'
      - 'tests/test_classroom_moderation_rpc.py'
      - '.github/workflows/classroom-moderation-pending-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-moderation-pending-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact stacked recovery scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-moderation-sqlite-ledger-20261002"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          test "$(git merge-base "$EVENT_BASE_SHA" HEAD)" = "$EVENT_BASE_SHA"
          git diff --check "$EVENT_BASE_SHA...HEAD"
          changed="$(git diff --name-only "$EVENT_BASE_SHA...HEAD" | LC_ALL=C sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/classroom-moderation-pending-recovery.yml' \
            'acs/classroom_moderation_rpc.py' \
            'tests/test_classroom_moderation_rpc.py' | LC_ALL=C sort)"
          test "$changed" = "$allowed"
          echo "CLASSROOM_MODERATION_PENDING_RECOVERY_SCOPE=PASS"

      - name: Compile recovery composition
        run: >-
          python -m py_compile
          acs/classroom_moderation_rpc.py
          tests/test_classroom_moderation_rpc.py

      - name: Run moderation recovery and durable ledger contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_moderation_rpc
          tests.test_sqlite_classroom_moderation_ledger
          tests.test_classroom_realtime_media

      - name: Prove recovery never reapplies provider effects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("acs/classroom_moderation_rpc.py")
          tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          service = next(
              node
              for node in tree.body
              if isinstance(node, ast.ClassDef)
              and node.name == "ClassroomModerationRpcService"
          )
          recovery_methods = {
              node.name: node
              for node in service.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name in {
                  "reconcile_verified_pending",
                  "_reconcile_verified_pending_locked",
              }
          }
          if set(recovery_methods) != {
              "reconcile_verified_pending",
              "_reconcile_verified_pending_locked",
          }:
              raise SystemExit("moderation recovery methods are incomplete")
          attributes = {
              node.attr
              for method in recovery_methods.values()
              for node in ast.walk(method)
              if isinstance(node, ast.Attribute)
          }
          if "apply_moderation_command" in attributes:
              raise SystemExit("recovery must never reapply provider moderation effects")
          if "moderation_effect_matches" not in attributes:
              raise SystemExit("recovery must require authoritative provider-state verification")
          if "commit" not in attributes:
              raise SystemExit("recovery must converge the durable replay ledger")
          print("CLASSROOM_MODERATION_RECOVERY_NO_PROVIDER_EFFECT=PASS")
          PY

      - name: Prove no ambient provider credential ownership
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'os\.(environ|getenv)|LIVEKIT_(API_)?SECRET|API_KEY|BEARER_TOKEN' \
            acs/classroom_moderation_rpc.py
          echo "CLASSROOM_MODERATION_RECOVERY_CREDENTIAL_BOUNDARY=PASS"

      - name: Core selftest
        run: python -m acs.selftest
