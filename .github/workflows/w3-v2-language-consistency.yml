name: W6 V2 Language Owner Convergence

on:
  push:
    branches:
      - work/w6-v2-language-owner-convergence-20260907

permissions:
  contents: read

concurrency:
  group: w6-v2-language-owner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove exact owner ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          base=c19a76e38e47f4f55bc50635eaed5f42400ecf10
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/w3-v2-language-consistency.yml' \
            'acs/version2_release_app.py' \
            'acs/version2_release_ui.py' \
            'tests/test_w3_v2_language_consistency.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$base" HEAD -- \
            acs/version2_application.py \
            acs/settings.py \
            acs/chesscore.py \
            acs/gametree.py \
            acs/pgn_document.py \
            acs/pgn_service.py \
            acs/pgn_workspace.py \
            acs/acsdb.py \
            web \
            tools/qa \
            run_accessible_chess.py \
            run_accessible_chess_v2.py
      - name: Compile language owner and release composition
        run: python -m compileall -q acs tests/test_w3_v2_language_consistency.py
      - name: Existing V2 release and native-menu contracts
        run: >-
          python -m unittest -v
          tests.test_version2_release_app
          tests.test_version2_release_ui
          tests.test_version2_application
          tests.test_version2_windows_composition_profile
          tests.test_full_product_native_menu
      - name: Persisted-language owner regressions
        run: python -m unittest -v tests.test_w3_v2_language_consistency
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: Stage 1 and Version 2 automated diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
