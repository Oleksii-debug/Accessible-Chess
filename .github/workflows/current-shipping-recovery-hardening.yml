name: Current Shipping Recovery Hardening

on:
  pull_request:
    branches:
      - converge/current-shipping-pgn-open-terminal-truth-20261006-c2mbezb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-shipping-recovery-hardening-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PARENT_BRANCH: fix/current-shipping-owner-cancel-recovery-order-20261006-ooxple7
  PARENT_SHA: 46ce49669c8c16f613c41f256a65c41351ca25c1
  APP_BLOB: ceb2a1784663eaa0a3131ff6e2dd85e6cab77323
  RELEASE_APP_BLOB: 3c04c766bc30e006628335dac9a4963be294c303
  APP_TEST_BLOB: 12498cfcd565208a73bfc69ac43eb9a6f395a48c
  SHUTDOWN_TEST_BLOB: 6794acd56b48adc2ad02d10c2c6eab9dd8fbc8c1
  STARTUP_TEST_BLOB: 2f0db82697d153f5ee3ead0e4484dc9a004d10cf

jobs:
  recovery-hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact parent, scope and blobs
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi
          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/parent"
          test "$(git rev-parse refs/remotes/origin/parent)" = "$PARENT_SHA"
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          git diff --check "$PARENT_SHA"...HEAD
          mapfile -t paths < <(git diff --name-only "$PARENT_SHA"...HEAD | sort)
          expected=(
            ".github/workflows/current-shipping-recovery-hardening.yml"
            "acs/version2_application.py"
            "acs/version2_release_app.py"
            "tests/test_version2_application.py"
            "tests/test_version2_composition_startup_cleanup_current.py"
            "tests/test_work_v2_shutdown_progress_failure_cleanup.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done
          test "$(git rev-parse HEAD:acs/version2_application.py)" = "$APP_BLOB"
          test "$(git rev-parse HEAD:acs/version2_release_app.py)" = "$RELEASE_APP_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "$APP_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_composition_startup_cleanup_current.py)" = "$STARTUP_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_work_v2_shutdown_progress_failure_cleanup.py)" = "$SHUTDOWN_TEST_BLOB"

      - name: Compile changed and integrated boundaries
        run: >-
          python -m py_compile
          acs/version2_application.py
          acs/version2_release_app.py
          acs/version2_windows_file_workflows.py
          acs/version2_windows_host_runtime.py
          tests/test_version2_application.py
          tests/test_work_v2_shutdown_progress_failure_cleanup.py
          tests/test_version2_composition_startup_cleanup_current.py

      - name: Execute recovery, persistence and accessibility contracts
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_work_v2_shutdown_progress_failure_cleanup
          tests.test_version2_composition_startup_cleanup_current
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_library_import_observer
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_file_logging_passive
          tests.test_chessbase_library_import_report_passive
          tests.test_bookreader_revision_barriers_current
          tests.test_book_bidirectional_semantic_navigation
          tests.test_v2_book_board_workflow
          tests.test_whole_product_user_journey

      - name: Execute shipping boundary contracts
        run: >-
          python -m unittest -v
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening
          tests.test_version2_release_payload
          tests.test_version2_portable_package
          tests.test_portable_launcher_contract
          tests.test_portable_localappdata_persistence_binding
          tests.test_version2_release_receipt
          tests.test_finalize_owner_final_receipt
          tests.test_owner_physical_acceptance

      - name: Core selftest
        run: python -m acs.selftest
