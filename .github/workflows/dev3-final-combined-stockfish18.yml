name: DEV3 Final Combined Stockfish 18 Evidence

on:
  pull_request:
    branches:
      - qa/dev3-final-combined-stockfish18-ci-base-20260823
  workflow_dispatch:

permissions:
  contents: read

env:
  FINAL_COMBINED_SHA: 74f39ed61c46ec2f5dc989275f1a095bd12d7f30
  STOCKFISH_BLOB: 23477698de93e7ecb582e9411a3bfacc0976849c
  HISTORY_BLOB: 381be891b3701039a70492f0db688530ed96fe5b
  FEN_BLOB: 7001518255575f55d4634c3578c035c526f7d8a4
  FOCUS_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  DEV3_PRIVACY_ORACLE_SHA: 66d5affbe027a86717a775198ec9fbcf8aba8545
  DEV3_PRIVACY_ORACLE_BLOB: f674de79b19a852f29837edab138c20b28f24162

jobs:
  windows-real-stockfish:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout validation merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact LF bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Prove exact final combined Product and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$FINAL_COMBINED_SHA" HEAD)" = "$FINAL_COMBINED_SHA"
          test "$(git rev-parse 'HEAD:acs/stockfish_runtime.py')" = "$STOCKFISH_BLOB"
          test "$(git rev-parse 'HEAD:acs/history.py')" = "$HISTORY_BLOB"
          test "$(git rev-parse 'HEAD:acs/chesscore.py')" = "$FEN_BLOB"
          test "$(git rev-parse 'HEAD:web/stage1_release_bootstrap.js')" = "$FOCUS_BLOB"
          git diff --check "$FINAL_COMBINED_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$FINAL_COMBINED_SHA" HEAD | sort)
          expected=(
            ".github/workflows/dev3-final-combined-stockfish18.yml"
            "qa/dev3_final_combined_stockfish18_marker.txt"
          )
          printf '%s\n' "${changed[@]}" > changed.txt
          printf '%s\n' "${expected[@]}" | sort > expected.txt
          diff -u expected.txt changed.txt
          test "$(git rev-parse "$DEV3_PRIVACY_ORACLE_SHA:tests/test_dev3_stockfish_runtime_path_privacy.py")" = "$DEV3_PRIVACY_ORACLE_BLOB"
          echo "DEV3 EXACT FINAL COMBINED LOCK PASS: $FINAL_COMBINED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest

      - name: Compile and focused DEV3 runtime regressions
        shell: pwsh
        run: |
          python -m compileall -q acs tests run_accessible_chess.py
          if($LASTEXITCODE -ne 0){throw 'compile failed'}
          python -m unittest -v tests.test_stockfish_runtime tests.test_dev3_uci_failure_recovery tests.test_analysis_service tests.test_continuous_analysis tests.test_engine_play_service tests.test_engine_play_service_concurrency tests.test_engine_game_session tests.test_engine_game_timeout_ownership tests.test_clock_service tests.test_game_lifecycle tests.test_release_stockfish_composition tests.test_core_release_contracts tests.test_manual5_cross_lane_regression
          if($LASTEXITCODE -ne 0){throw 'focused runtime regressions failed'}

      - name: Replay immutable DEV3 PR159 privacy oracle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa_oracles
          mkdir -p qa_oracles
          : > qa_oracles/__init__.py
          git show "$DEV3_PRIVACY_ORACLE_SHA:tests/test_dev3_stockfish_runtime_path_privacy.py" > qa_oracles/test_dev3_stockfish_runtime_path_privacy.py
          test "$(git hash-object qa_oracles/test_dev3_stockfish_runtime_path_privacy.py)" = "$DEV3_PRIVACY_ORACLE_BLOB"
          python -m unittest -v qa_oracles.test_dev3_stockfish_runtime_path_privacy

      - name: Acquire official Stockfish 18 Windows binary
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip' -OutFile stockfish18.zip
          Expand-Archive stockfish18.zip stockfish18 -Force
          $engine=Get-ChildItem stockfish18 -Recurse -Filter '*.exe' | Where-Object {$_.Name -match 'stockfish.*x86-64'} | Select-Object -First 1
          if(-not $engine){throw 'Official Stockfish 18 executable missing'}
          New-Item -ItemType Directory -Force -Path real-engine | Out-Null
          Copy-Item $engine.FullName 'real-engine\stockfish.exe' -Force
          $hash=(Get-FileHash 'real-engine\stockfish.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "DEV3 OFFICIAL STOCKFISH 18 WINDOWS SHA256: $hash"

      - name: Real final-combined runtime shared-provider MultiPV and packaged-path smoke
        shell: pwsh
        run: |
          @'
          import pathlib
          import re
          import shutil
          from acs.analysis_service import AnalysisService
          from acs.engine_play_service import EnginePlayService
          from acs.engine_ports import EngineMoveRequest
          from acs.stockfish_runtime import StockfishRuntime, StockfishRuntimeConfig

          root = pathlib.Path.cwd()
          exe = (root / 'real-engine' / 'stockfish.exe').resolve()
          fen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
          move_re = re.compile(r'^[a-h][1-8][a-h][1-8][qrbn]?$')

          runtime = StockfishRuntime(StockfishRuntimeConfig(configured_path=exe))
          analysis = AnalysisService(runtime.provider, owns_engine=False)
          play = EnginePlayService(runtime.provider, owns_engine=False)
          try:
              provider = runtime.provider()
              first = analysis.analyze(fen, multipv=5, depth=8)
              assert first.error is None and not first.stale, first
              assert len(first.lines) == 5, first
              result = play.choose_move(EngineMoveRequest(fen, level=5, movetime_ms=100))
              assert result.move is not None and move_re.fullmatch(result.move), result
              assert runtime.provider() is provider, 'runtime duplicated provider'
              second = analysis.analyze(fen, multipv=5, depth=8)
              assert second.error is None and not second.stale, second
              assert len(second.lines) == 5, second
              assert runtime.provider() is provider
          finally:
              play.close()
              analysis.close()
              runtime.close()

          packaged = root / 'packaged-root'
          packaged_exe = packaged / 'engines' / 'stockfish' / 'stockfish.exe'
          packaged_exe.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(exe, packaged_exe)
          packaged_runtime = StockfishRuntime(StockfishRuntimeConfig(application_dir=packaged))
          packaged_play = EnginePlayService(packaged_runtime.provider, owns_engine=False)
          try:
              result = packaged_play.choose_move(EngineMoveRequest(fen, level=5, movetime_ms=100))
              assert result.move is not None and move_re.fullmatch(result.move), result
          finally:
              packaged_play.close()
              packaged_runtime.close()

          print('DEV3 FINAL COMBINED OFFICIAL STOCKFISH 18 RUNTIME PASS')
          '@ | Set-Content -Encoding UTF8 dev3_final_combined_stockfish.py
          python dev3_final_combined_stockfish.py
          if($LASTEXITCODE -ne 0){throw 'real final-combined Stockfish runtime smoke failed'}

      - name: Canonical SELFTEST and complete diagnostic
        shell: pwsh
        run: |
          python -m acs.selftest
          if($LASTEXITCODE -ne 0){throw 'SELFTEST failed'}
          python run_accessible_chess.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'diagnostic failed'}
          'DEV3 FINAL COMBINED STOCKFISH 18 EVIDENCE PASS'
