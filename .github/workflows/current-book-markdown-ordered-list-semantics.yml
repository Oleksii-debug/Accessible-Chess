name: Current Book Markdown Ordered List Semantics

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - "acs/book_text_import.py"
      - "tests/test_v2_book_text_import.py"
      - ".github/workflows/current-book-markdown-ordered-list-semantics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-markdown-ordered-list-semantics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BASE_REF: converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
  SOURCE_BLOB: f5c53c619b292a89dccd6968df7a6615a6baf1c7
  TEST_BLOB: 66c74aa4ae93badd92df335f14578495fbfd8e8f

jobs:
  qualify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove live shipping base and exact child scope
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin "refs/heads/$BASE_REF"
          live_base="$(git rev-parse FETCH_HEAD)"
          test -n "$live_base"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
            test "${{ github.event.pull_request.base.ref }}" = "$BASE_REF"
            event_base="${{ github.event.pull_request.base.sha }}"
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_base"
          fi
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          mapfile -t actual < <(git diff --name-only "$live_base"...HEAD | sort)
          expected=(
            ".github/workflows/current-book-markdown-ordered-list-semantics.yml"
            "acs/book_text_import.py"
            "tests/test_v2_book_text_import.py"
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${actual[$i]}" = "${expected[$i]}"
          done
          test "$(git rev-parse HEAD:acs/book_text_import.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_text_import.py)" = "$TEST_BLOB"

      - name: Compile bounded Book Markdown surface
        run: >-
          python -m compileall -q
          acs/book_text_import.py
          tests/test_v2_book_text_import.py

      - name: Run Markdown semantic contracts
        run: >-
          python -m unittest -v
          tests.test_v2_book_text_import

      - name: Core selftest
        run: python -m acs.selftest
