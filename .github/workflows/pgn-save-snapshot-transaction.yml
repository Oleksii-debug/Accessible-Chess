name: PGN Save Snapshot Transaction

on:
  push:
    branches:
      - work/pgn-save-snapshot-commit-20261005-sol56k4r9
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-save-snapshot-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-snapshot-transaction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      BASE_BRANCH: converge/current-product-books-provider-20261005-ooxple7
      BASE_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact current Product ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi

          git fetch --no-tags origin "$BASE_BRANCH"
          live_base="$(git rev-parse FETCH_HEAD)"
          test "$live_base" = "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          merge_base="$(git merge-base "$BASE_SHA" HEAD)"
          test "$merge_base" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/pgn-save-snapshot-transaction.yml"
            "acs/import_contract.py"
            "acs/pgn_save_snapshot.py"
            "tests/test_import_contract.py"
            "tests/test_pgn_save_snapshot.py"
            "tests/test_pgn_save_snapshot_cancel.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

      - name: Compile transaction boundary
        run: >-
          python -m py_compile
          acs/import_contract.py
          acs/pgn_save_snapshot.py
          tests/test_import_contract.py
          tests/test_pgn_save_snapshot.py
          tests/test_pgn_save_snapshot_cancel.py

      - name: Execute snapshot transaction regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_save_snapshot
          tests.test_pgn_save_snapshot_cancel

      - name: Retain canonical PGN and fingerprint regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_document
          tests.test_import_contract
          tests.test_dev4_import_fingerprint_atomicity

      - name: Core selftest
        run: python -m acs.selftest
