name: Full Product Native Menu Keymap Refresh

on:
  pull_request:
    branches:
      - fix/remappable-input-submit-keys-20260926
    paths:
      - 'acs/full_product_native_menu.py'
      - 'tests/test_full_product_native_menu.py'
      - '.github/workflows/full-product-native-menu-keymap-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-product-native-menu-keymap-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          merge_base="$(git merge-base "$base" HEAD)"
          changed="$(git diff --name-only "$merge_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/full-product-native-menu-keymap-refresh.yml' \
            'acs/full_product_native_menu.py' \
            'tests/test_full_product_native_menu.py' | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected native-menu keymap-refresh scope:\n%s\n' "$changed" >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile native menu contract
        run: >-
          python -m py_compile
          acs/full_product_native_menu.py
          tests/test_full_product_native_menu.py

      - name: Prove native menu live binding captions
        run: python -m unittest -v tests.test_full_product_native_menu
