# Diagnostic console is temporary until packaged WebView2 startup is green.
name: Windows Stage 1 0.4 WebView2 Build

on:
  workflow_dispatch:
  push:
    branches:
      - qa/review-history-p0-fix
    paths:
      - '.github/workflows/windows-stage1-webview-build.yml'

permissions:
  contents: read

concurrency:
  group: accessible-chess-current-windows-candidate
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4

      - name: Reconstruct verified 0.3.3 functional baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ordered = @(
            'build_snapshot_exact\group00.b64','build_snapshot_exact\group01.b64',
            'build_parts10k\part04.b64','build_parts10k\part05.b64',
            'build_parts10k\part06.b64','build_parts10k\part07.b64'
          )
          foreach ($f in $ordered) { if (-not (Test-Path $f)) { throw "Missing source chunk: $f" } }
          $b64 = ($ordered | ForEach-Object { Get-Content -LiteralPath $_ -Raw }) -join ''
          $b64 = $b64 -replace '[^A-Za-z0-9+/=]',''
          if ($b64.Length -ne 77128) { throw "Unexpected Base64 length: $($b64.Length)" }
          [IO.File]::WriteAllBytes('stage1_source.zip', [Convert]::FromBase64String($b64))
          if ((Get-Item 'stage1_source.zip').Length -ne 57844) { throw 'Source ZIP size mismatch' }
          $hash = (Get-FileHash 'stage1_source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'cb0a89778b436cdf44c42e3207ef9638160a992b372156bc4d901391717a1e6a') { throw "Source ZIP hash mismatch: $hash" }
          Expand-Archive 'stage1_source.zip' 'work' -Force

      - name: Apply complete current integration overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'work\acs','work\web','work\tests' | Out-Null
          Copy-Item 'acs\*.py' 'work\acs\' -Force
          Copy-Item 'web\*' 'work\web\' -Recurse -Force
          Copy-Item 'tests\*.py' 'work\tests\' -Force
          Copy-Item 'run_accessible_chess.py' 'work\run_accessible_chess.py' -Force
          Copy-Item 'ACCESSIBILITY_0.4_ARCHITECTURE.md' 'work\ACCESSIBILITY_0.4_ARCHITECTURE.md' -Force
          Copy-Item 'VERSION.txt' 'work\VERSION.txt' -Force
          if (Test-Path 'HOTKEYS_UA.txt') { Copy-Item 'HOTKEYS_UA.txt' 'work\HOTKEYS_UA.txt' -Force }
          if (Test-Path 'HOTKEYS_EN.txt') { Copy-Item 'HOTKEYS_EN.txt' 'work\HOTKEYS_EN.txt' -Force }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run exact-head release regression suite
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip pytest
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          python -m compileall -q acs tests run_accessible_chess.py
          if ($LASTEXITCODE -ne 0) { throw 'Compile gate failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression suite failed' }
          python run_accessible_chess.py --diagnostic
          if ($LASTEXITCODE -ne 0) { throw 'Source diagnostic failed' }

      - name: Install WebView2 and standalone build dependencies
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install "pywebview==6.2.1" "nuitka>=2.7,<3" ordered-set zstandard
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed' }
          python -c "import webview; print('PYWEBVIEW IMPORT PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'pywebview import failed' }

      - name: Build autonomous Nuitka standalone WebView2 app
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          python -m nuitka `
            --mode=standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=force `
            --output-filename=AccessibleChess.exe `
            --include-data-dir=web=web `
            run_accessible_chess.py
          if ($LASTEXITCODE -ne 0) { throw 'Nuitka standalone compilation failed' }
          if (-not (Test-Path 'run_accessible_chess.dist\AccessibleChess.exe')) { throw 'Nuitka standalone AccessibleChess.exe missing' }
          $rawPy = Get-ChildItem 'run_accessible_chess.dist' -Recurse -Filter '*.py' -File
          if ($rawPy) { throw "Raw Python source leaked into standalone package: $($rawPy.FullName -join ', ')" }

      - name: Run built standalone diagnostic
        shell: pwsh
        working-directory: work
        run: |
          .\run_accessible_chess.dist\AccessibleChess.exe --diagnostic
          if ($LASTEXITCODE -ne 0) { throw "Standalone EXE diagnostic failed: $LASTEXITCODE" }
          'STANDALONE EXE DIAGNOSTIC PASS'

      - name: WebView2 process startup smoke with captured traceback
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item packaged-ui.out,packaged-ui.err -ErrorAction SilentlyContinue
          $p = Start-Process '.\run_accessible_chess.dist\AccessibleChess.exe' -PassThru -RedirectStandardOutput packaged-ui.out -RedirectStandardError packaged-ui.err
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "PACKAGED_GUI_EXIT_CODE=$($p.ExitCode)"
            Write-Host '--- stdout ---'
            if (Test-Path packaged-ui.out) { Get-Content packaged-ui.out }
            Write-Host '--- stderr ---'
            if (Test-Path packaged-ui.err) { Get-Content packaged-ui.err }
            throw "GUI exited during WebView2 startup smoke with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          'WEBVIEW2 STARTUP SMOKE PASS'

      - name: Add official Stockfish 18 and GPL source material
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'package\WINDOWS_EXE','package\THIRD_PARTY' | Out-Null
          Copy-Item 'run_accessible_chess.dist\*' 'package\WINDOWS_EXE\' -Recurse -Force
          New-Item -ItemType Directory -Force -Path 'package\WINDOWS_EXE\engine' | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip' -OutFile 'stockfish18-windows.zip'
          Expand-Archive 'stockfish18-windows.zip' -DestinationPath 'stockfish18' -Force
          $engine = Get-ChildItem 'stockfish18' -Recurse -Filter '*.exe' | Where-Object { $_.Name -match 'stockfish.*x86-64' } | Select-Object -First 1
          if (-not $engine) { throw 'Official Stockfish 18 generic Windows executable not found' }
          Copy-Item $engine.FullName 'package\WINDOWS_EXE\engine\stockfish.exe' -Force
          Invoke-WebRequest -Uri 'https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_18.zip' -OutFile 'package\THIRD_PARTY\Stockfish-18-source.zip'
          @"
          Stockfish 18 is a separate UCI chess engine licensed under GNU GPL v3.
          Upstream: official-stockfish/Stockfish, release sf_18.
          Corresponding source archive is included as Stockfish-18-source.zip.
          "@ | Set-Content -Encoding UTF8 'package\THIRD_PARTY\STOCKFISH_LICENSE_NOTICE.txt'

      - name: Assemble candidate with provenance and checksums
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'ACCESSIBILITY_0.4_ARCHITECTURE.md' 'package' -Force
          Copy-Item 'VERSION.txt' 'package' -Force
          if (Test-Path 'HOTKEYS_UA.txt') { Copy-Item 'HOTKEYS_UA.txt' 'package' -Force }
          if (Test-Path 'HOTKEYS_EN.txt') { Copy-Item 'HOTKEYS_EN.txt' 'package' -Force }
          $head = $env:GITHUB_SHA
          @"
          ACCESSIBLE CHESS 0.4 — WINDOWS/NVDA TEST CANDIDATE
          Exact Git head: $head
          Current Windows regression suite: PASS
          Non-destructive history review boundary: PASS
          Shared compact accessible SAN spacing: PASS
          Nuitka standalone build: PASS
          Raw proprietary .py files in runtime package: NONE
          Built EXE diagnostic: PASS
          WebView2 process startup smoke: PASS
          Stockfish 18 UCI executable + GPL source material: INCLUDED
          Real NVDA browse/focus verification: REQUIRED — NOT AUTOMATICALLY VERIFIED
          "@ | Set-Content -Encoding UTF8 'package\WINDOWS_BUILD_REPORT.txt'
          Get-ChildItem 'package' -Recurse -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $rel = $_.FullName.Substring((Resolve-Path 'package').Path.Length + 1)
            "$h  $rel"
          } | Set-Content -Encoding UTF8 'package\SHA256SUMS.txt'
          $sourceLeak = Get-ChildItem 'package\WINDOWS_EXE' -Recurse -Filter '*.py' -File
          if ($sourceLeak) { throw 'Runtime package contains raw proprietary Python source' }
          Compress-Archive 'package\*' 'Accessible-Chess-0.4-Windows-NVDA-Test-Candidate.zip' -Force

      - name: Upload exact-head Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Accessible-Chess-0.4-Windows-NVDA-Test-Candidate
          path: work/Accessible-Chess-0.4-Windows-NVDA-Test-Candidate.zip
          if-no-files-found: error
          retention-days: 14
