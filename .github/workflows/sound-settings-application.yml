name: Accessible Sound Settings Application

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/sound_settings_application.py'
      - 'acs/sound_pack_profile.py'
      - 'tests/test_sound_settings_application.py'
      - '.github/workflows/sound-settings-application.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessible-sound-settings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove exact candidate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.sha }}' = '109c31eae3211217ef93c9db33814cbf2756005c'
          git diff --check '${{ github.event.pull_request.base.sha }}' HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile sound settings boundary
        run: >-
          python -m py_compile
          acs/sound_settings_application.py
          acs/sound_pack_profile.py
          tests/test_sound_settings_application.py
      - name: Run sound settings and retained profile contracts
        run: >-
          python -m unittest -v
          tests.test_sound_settings_application
          tests.test_sound_pack_profile
          tests.test_sound_profile_store
          tests.test_sound_profile_runtime
      - name: Core selftest
        run: python -m acs.selftest
