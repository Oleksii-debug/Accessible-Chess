name: WordDeck emergency Oxford 5000 V6 completion

on:
  push:
    branches:
      - worddeck-bootstrap
    paths:
      - WordDeck/tools/complete_oxford5000_emergency_v6.py
      - WordDeck/tools/test_oxford5000_emergency_v6.py
      - WordDeck/tools/run_oxford5000_v6_completion.py
      - WordDeck/ReviewedOxford5000Bootstrap.cs
      - WordDeck/WordDeck.csproj
      - WordDeck/QA/oxford5000_source_after_manual_v5_round01_manual-emergency-work-20260820-second-pa_cp0001_rows_0083.tsv
      - .github/workflows/worddeck-emergency-v6.yml
  workflow_dispatch:

concurrency:
  group: worddeck-emergency-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write
  actions: write

jobs:
  complete-tail-v6:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact corrective branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish V6 pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'WordDeck emergency V6 candidate-evidence gate',
              description: 'V6 candidate-evidence and Unicode-safe full-tail review is executing.',
              target_url: targetUrl
            });

      - name: Install lexical QA and Ukrainian morphology dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers<5' sentencepiece requests beautifulsoup4 'sentence-transformers<4' pymorphy3 pymorphy3-dicts-uk

      - name: Execute V6 candidate-evidence full-tail review and safe checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python WordDeck/tools/test_oxford5000_emergency_v6.py
          python WordDeck/tools/run_oxford5000_v6_completion.py

      - name: Publish final V6 status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const remaining = process.env.FINAL_REMAINING || 'unknown';
            const finalSha = process.env.FINAL_SHA || context.sha;
            const complete = remaining === '0' && '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: finalSha,
              state: complete ? 'success' : 'failure',
              context: 'WordDeck emergency V6 candidate-evidence gate',
              description: complete
                ? 'V6 lexical tail complete and British offline audio validated.'
                : `V6 ended fail-closed with ${remaining} unresolved identities.`,
              target_url: targetUrl
            });

      - name: Upload V6 lexical and CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-oxford5000-emergency-v6-evidence
          path: artifacts/emergency-v6/**
          if-no-files-found: warn
          retention-days: 90
