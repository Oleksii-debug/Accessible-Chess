name: V2 Library Player Identity Search

on:
  push:
    branches:
      - work/d07-player-identity-normalization-20260907
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - .github/workflows/v2-library-player-identity-search.yml
      - acs/acsdb.py
      - acs/search_policy.py
      - tests/test_v2_library_player_identity_search.py

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-player-identity-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_PRODUCT_BASE: 6fe13b4d9fe3ef50f17d4e6f15bff51d1a4cf73b
  PRIOR_SAME_HEAD: 0b06a1338da5ca964328cc692394367d4732dba9
  ACSDB_BLOB: e55b69b2741f4c6bd3e1ededb725aa75bfa357b1
  SEARCH_POLICY_BLOB: 42437b0ee268f25503fbc309a3e35dc0ec6979a9
  TEST_BLOB: c7d1cd0689af6bacfaac4596c62594e2cb556a3c

jobs:
  player-identity-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact current authority provenance and bounded scope
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for commit in "$CURRENT_PRODUCT_BASE" "$PRIOR_SAME_HEAD"; do
            git cat-file -e "${commit}^{commit}" || git fetch --no-tags origin "$commit"
          done
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^1)" = "$CURRENT_PRODUCT_BASE"
          test "$(git rev-parse HEAD^2)" = "$PRIOR_SAME_HEAD"
          test "$(git merge-base HEAD "$CURRENT_PRODUCT_BASE")" = "$CURRENT_PRODUCT_BASE"
          git diff --check "$CURRENT_PRODUCT_BASE" HEAD
          changed="$(git diff --name-only "$CURRENT_PRODUCT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-library-player-identity-search.yml' \
            'acs/acsdb.py' \
            'acs/search_policy.py' \
            'tests/test_v2_library_player_identity_search.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected player-search scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/acsdb.py)" = "$ACSDB_BLOB"
          test "$(git rev-parse HEAD:acs/search_policy.py)" = "$SEARCH_POLICY_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_library_player_identity_search.py)" = "$TEST_BLOB"
          git diff --quiet "$CURRENT_PRODUCT_BASE" HEAD -- \
            acs/search_service.py acs/library_import_service.py acs/gametree.py \
            acs/chessbase_decoder.py acs/chessbase_metadata.py web tools/qa

      - name: Compile current player identity scope
        run: python -m py_compile acs/acsdb.py acs/search_policy.py tests/test_v2_library_player_identity_search.py

      - name: Focused canonical player and Library Search regressions
        run: >-
          python -m unittest -v
          tests.test_v2_library_player_identity_search
          tests.test_v2_library_search_service_v4
          tests.test_d07_library_search_cancellation

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_library_player_identity_search.py
          tests/test_v2_library_search_service_v4.py
          tests/test_d07_library_search_cancellation.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and current V2 diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic

      - name: Emit exact authority
        shell: bash
        run: |
          set -euo pipefail
          echo "CURRENT_PRODUCT_BASE=$CURRENT_PRODUCT_BASE"
          echo "PRIOR_SAME_HEAD=$PRIOR_SAME_HEAD"
          echo "QUALIFIED_HEAD=$(git rev-parse HEAD)"
