name: Books Progress Backup Recovery

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
      - work/books-bidirectional-semantic-navigation-20260927
    paths:
      - 'acs/book_progress_store.py'
      - 'tests/test_v2_book_progress_store.py'
      - 'acs/version2_application.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_windows_native_dialog_ownership.py'
      - 'tests/test_version2_application.py'
      - 'tests/test_v2_native_dialog_language.py'
      - 'tests/test_books_progress_backup_recovery_workflow.py'
      - '.github/workflows/book-progress-orphan-backup-recovery.yml'
      - '.github/workflows/books-progress-backup-recovery.yml'
      - '.github/workflows/v2-book-progress-production-repair.yml'
      - '.github/workflows/v2-composition-publication-boundary.yml'
      - 'tests/test_composition_publication_boundary_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-progress-backup-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
  BOOKS_BRANCH: work/books-bidirectional-semantic-navigation-20260927
  PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove all recovery gates trigger on canonical authority
        shell: bash
        run: |
          set -euo pipefail
          workflows=(
            '.github/workflows/book-progress-orphan-backup-recovery.yml'
            '.github/workflows/books-progress-backup-recovery.yml'
            '.github/workflows/v2-book-progress-production-repair.yml'
          )
          required=(
            '.github/workflows/book-progress-orphan-backup-recovery.yml'
            '.github/workflows/books-progress-backup-recovery.yml'
            '.github/workflows/v2-book-progress-production-repair.yml'
            'acs/book_progress_store.py'
            'acs/version2_application.py'
            'tests/test_v2_book_progress_store.py'
            'tests/test_version2_application.py'
          )
          for workflow in "${workflows[@]}"; do
            trigger="$(sed -n '/^  pull_request:/,/^  workflow_dispatch:/p' "$workflow")"
            for path in "${required[@]}"; do
              grep -Fqx "      - '$path'" <<<"$trigger" || {
                printf 'Recovery gate trigger gap: workflow=%s path=%s\n' "$workflow" "$path" >&2
                exit 1
              }
            done
          done
          echo 'BOOK_PROGRESS_RECOVERY_TRIGGER_COVERAGE=PASS'

      - name: Prove exact descendant and protect recovery authority
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          product_branch="$PRODUCT_BRANCH"
          git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
          product="$(git rev-parse "refs/remotes/origin/$product_branch")"
          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD

          current_books_recovery=false
          books_base=''
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$PR_BASE_REF" = "$BOOKS_BRANCH" ]; then
            test -n "$PR_BASE_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            books_ref="refs/remotes/origin/$BOOKS_BRANCH"
            git fetch --no-tags origin "+refs/heads/$BOOKS_BRANCH:$books_ref"
            books_base="$(git rev-parse "$books_ref")"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$books_base"
            git merge-base --is-ancestor "$books_base" HEAD
            test "$(git merge-base "$books_base" HEAD)" = "$books_base"
            books_delta="$(git diff --name-only "$books_base" HEAD | sort)"
            books_expected="$(printf '%s\n' \
              '.github/workflows/book-progress-orphan-backup-recovery.yml' \
              '.github/workflows/books-progress-backup-recovery.yml' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'acs/version2_application.py' \
              'tests/test_v2_book_progress_store.py' \
              'tests/test_version2_application.py' | sort)"
            if [ "$books_delta" = "$books_expected" ]; then
              test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "a5a5b221b455467c41fafd25393cc34a397e0b82"
              test "$(git rev-parse HEAD:acs/version2_application.py)" = "7c8d36a1547f5a7637ed384a94d8882ad71079c9"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "61ba1beb393b2967755fbd98ee9309309335e040"
              test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "79c70573829999f37b5558d7158bfc74988ad869"
              current_books_recovery=true
            fi
          fi

          # This gate is inherited by Product descendants that legitimately touch
          # shared Books/application composition files. Do not require every
          # descendant to reproduce the historical nine-file #937 owner delta.
          # Instead, keep the recovery-exclusive authorities byte-identical to
          # current Product and re-run the recovery behavior suite against the
          # complete candidate.
          protected_paths=(
            '.github/workflows/v2-book-progress-production-repair.yml'
            'acs/book_progress_store.py'
          )

          orphan_backup_successor=false
          current_delta="$(git diff --name-only "$product" HEAD | sort)"
          orphan_expected="$(printf '%s\n' \
            '.github/workflows/book-progress-orphan-backup-recovery.yml' \
            '.github/workflows/books-progress-backup-recovery.yml' \
            '.github/workflows/v2-book-progress-production-repair.yml' \
            'acs/book_progress_store.py' \
            'acs/version2_application.py' \
            'tests/test_v2_book_progress_store.py' \
            'tests/test_version2_application.py' | sort)"
          if [ "$current_delta" = "$orphan_expected" ]; then
            test "$(git rev-parse "$product":acs/book_progress_store.py)" = "3c51f524a1e2702903914a2dd9c37c0ed8ebf87b"
            test "$(git rev-parse "$product":tests/test_v2_book_progress_store.py)" = "52cb2948ec6789b60775e1fa38cae44770baff7a"
            test "$(git rev-parse HEAD:.github/workflows/book-progress-orphan-backup-recovery.yml)" = "a63fdb0875e5409e19037c9cf7cc41d7bd780f06"
            test "$(git rev-parse HEAD:.github/workflows/v2-book-progress-production-repair.yml)" = "76d18b90ed7d35b6f233ebe98b80ff932094b34f"
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "a5a5b221b455467c41fafd25393cc34a397e0b82"
            test "$(git rev-parse HEAD:acs/version2_application.py)" = "7c8d36a1547f5a7637ed384a94d8882ad71079c9"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "61ba1beb393b2967755fbd98ee9309309335e040"
            test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "79c70573829999f37b5558d7158bfc74988ad869"
            orphan_backup_successor=true
          fi

          for path in "${protected_paths[@]}"; do
            product_blob="$(git rev-parse "$product:$path")"
            candidate_blob="$(git rev-parse "HEAD:$path")"
            if [ "$orphan_backup_successor" = true ] || [ "$current_books_recovery" = true ]; then
              continue
            fi
            test "$candidate_blob" = "$product_blob" || {
              printf 'Recovery authority drift requires a dedicated successor gate: %s product=%s candidate=%s\n' \
                "$path" "$product_blob" "$candidate_blob" >&2
              exit 1
            }
          done

          # Publication qualification is a separate CI authority. Keep its
          # workflow and executable contract atomic: a Books descendant may use
          # the exact Product pair, or the one independently reviewed successor
          # pair, but never an arbitrary mixture or unilateral drift.
          publication_path='.github/workflows/v2-composition-publication-boundary.yml'
          publication_contract='tests/test_composition_publication_boundary_workflow.py'
          missing='__MISSING__'

          blob_or_missing() {
            local spec="$1"
            local object_type
            object_type="$(git cat-file -t "$spec" 2>/dev/null || true)"
            if test -z "$object_type"; then
              printf '%s' "$missing"
            elif test "$object_type" = 'blob'; then
              git rev-parse "$spec"
            else
              printf 'Publication authority path must resolve to a blob: %s type=%s\n' \
                "$spec" "$object_type" >&2
              return 1
            fi
          }

          product_publication="$(git rev-parse "$product:$publication_path")"
          candidate_publication="$(git rev-parse "HEAD:$publication_path")"
          product_contract="$(blob_or_missing "$product:$publication_contract")"
          candidate_contract="$(blob_or_missing "HEAD:$publication_contract")"
          successor_publication='653d4c8a252a258f580900b7f6f470f14e2899ed'
          successor_contract='cee4f2de715b26bee6d3b5a1b511927ee42207fc'

          if test "$candidate_publication" = "$product_publication" && \
             test "$candidate_contract" = "$product_contract"; then
            :
          elif test "$candidate_publication" = "$successor_publication" && \
               test "$candidate_contract" = "$successor_contract"; then
            echo "BOOKS_RECOVERY_PUBLICATION_SUCCESSOR=EXACT"
          else
            printf 'Publication authority pair drift requires an exact reviewed successor: workflow=%s contract=%s\n' \
              "$candidate_publication" "$candidate_contract" >&2
            exit 1
          fi

      - name: Report accepted recovery topology
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$PR_BASE_REF" = "$BOOKS_BRANCH" ]; then
            echo 'BOOKS_PROGRESS_RECOVERY_TOPOLOGY=CURRENT_BOOKS'
          else
            echo 'BOOKS_PROGRESS_RECOVERY_TOPOLOGY=PRODUCT_OR_INHERITED'
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/book_progress_store.py
          acs/version2_application.py
          acs/version2_release_app.py
          acs/version2_windows_native_dialog_ownership.py
          tests/test_version2_application.py
          tests/test_v2_native_dialog_language.py
          tests/test_books_progress_backup_recovery_workflow.py

      - name: Run Book recovery and adjacent persistence regressions
        run: >-
          python -m unittest -v
          tests.test_books_progress_backup_recovery_workflow
          tests.test_version2_application
          tests.test_v2_native_dialog_language
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_book_board_progress_failure_exact

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Install pytest for repository pytest gate
        run: python -m pip install pytest==8.4.2

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
