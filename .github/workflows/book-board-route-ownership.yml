name: Book Board Route Ownership

on:
  push:
    branches:
      - fix/book-board-route-ownership-ooxple7-20261004
  pull_request:
    paths:
      - acs/version2_application.py
      - tests/test_book_board_route_ownership.py
      - .github/workflows/book-board-route-ownership.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-board-route-ownership-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and bounded authority
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          FOCUSED_BASE_REF: converge/books-training-owner-current-20261004-zftrkmo
          INTEGRATED_HEAD: 773a4dcaace5d2d1234f3060ae198724417138e7
        run: |
          set -euo pipefail
          BASE=ece44ad8526b0a2845c993cf0eec0ef31d6cb056
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          if [ "${EVENT_BASE_REF:-}" = "$FOCUSED_BASE_REF" ]; then
            git diff --check "$BASE" HEAD
            git diff --name-only "$BASE" HEAD | sort > /tmp/actual-paths
            cat > /tmp/expected-paths <<'EOF'
          .github/workflows/book-board-route-ownership.yml
          acs/version2_application.py
          tests/test_book_board_route_ownership.py
          EOF
            sort -o /tmp/expected-paths /tmp/expected-paths
            diff -u /tmp/expected-paths /tmp/actual-paths
            echo 'BOOK_BOARD_ROUTE_OWNERSHIP_SCOPE=FOCUSED_PASS'
          else
            git cat-file -e "$INTEGRATED_HEAD^{commit}"
            git merge-base --is-ancestor "$INTEGRATED_HEAD" HEAD
            echo 'BOOK_BOARD_ROUTE_OWNERSHIP_SCOPE=CONVERGED_SUCCESSOR'
          fi

      - name: Compile route ownership seam
        run: >-
          python -m py_compile
          acs/version2_application.py
          tests/test_book_board_route_ownership.py
          tests/test_version2_application.py
          tests/test_v2_book_board_workflow.py
          tests/test_v2_windows_book_board_adapter.py

      - name: Qualify route ownership transactions
        run: >-
          python -m unittest -v
          tests.test_book_board_route_ownership
          tests.test_version2_application
          tests.test_v2_book_board_workflow
          tests.test_v2_windows_book_board_adapter

      - name: Qualify adjacent accessibility contracts
        run: >-
          python -m unittest -v
          tests.test_version2_accessibility_convergence
          tests.test_nvda_p0_contract
          tests.test_full_product_native_menu

      - name: Core selftest
        run: python -m acs.selftest
