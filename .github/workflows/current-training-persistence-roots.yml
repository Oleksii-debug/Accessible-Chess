name: Current Training Persistence Roots

on:
  pull_request:
    branches:
      - converge/current-engine-board-passive-ingress-20261004-ooxple7
    paths:
      - 'acs/training.py'
      - 'tests/test_training.py'
      - '.github/workflows/current-training-persistence-roots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-training-persistence-roots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and Training scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-engine-board-passive-ingress-20261004-ooxple7}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-training-persistence-roots.yml' \
            'acs/training.py' \
            'tests/test_training.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Training persistence-root scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Training roots
        run: >-
          python -m compileall -q
          acs/training.py
          tests/test_training.py

      - name: Execute Training persistence and authority regressions
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_training_snapshot_definition_identity_v4
          tests.test_current_assisted_training_session_root
          tests.test_w2_training_progress_crash_recovery
          tests.test_training_authority_convergence
          tests.test_training_progress_ancestor_authority

      - name: Execute retained engine Board Book regressions
        run: >-
          python -m unittest -v
          tests.test_current_analysis_provider_resource_bounds
          tests.test_current_engine_fen_passive_bounds
          tests.test_book_engine_authority_passive_ingress
          tests.test_board_service_passive_boundary
          tests.test_v2_book_board_workflow

      - name: Core selftest
        run: python -m acs.selftest
