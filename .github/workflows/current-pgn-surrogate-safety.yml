name: Current PGN Surrogate Safety

on:
  pull_request:
    branches:
      - anchor/zftrkmo122-pgn-tag-bounds-3081ac9
    paths:
      - '.github/workflows/current-pgn-surrogate-safety.yml'
      - 'acs/pgn_workspace.py'
      - 'acs/pgn_webview_projection.py'
      - 'acs/pgn_webview_bridge.py'
      - 'acs/pgn_workspace_webview_adapter.py'
      - 'acs/version2_pgn_commands.py'
      - 'tests/test_pgn_complete_editing_user_flow.py'
      - 'tests/test_pgn_workspace.py'
      - 'tests/test_dev1_pgn_workspace_webview_adapter.py'
      - 'tests/test_dev1_pgn_webview_projection.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-pgn-surrogate-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 3081ac91685647f5d246403279168ea01e92c3ab
  WORKSPACE_BLOB: 4c8dfa42a0fe384d934ba063f8e3560833333630
  PROJECTION_BLOB: 3768e5f84ed891c392b1a78dc600055f83ecc195
  BRIDGE_BLOB: eb6436e825e00b941cb28c52c86b79819a60fc66
  ADAPTER_BLOB: 2bf30f552a306a6701aa5241424f83b21acabd01
  COMMANDS_BLOB: 74befdcf6dcf816edcc80519405f7b5e74770010
  FLOW_TEST_BLOB: f6e7b9eae479fcaf09abe6cd9c4131ff5cbbe702
  ADAPTER_TEST_BLOB: a28b3669342172ee4ce4c4a1d324fbeab737e119
  PROJECTION_TEST_BLOB: c58b9096bcccd8b5a09f2e8bdb9c09ebfe5bcc4b
  WORKSPACE_TEST_BLOB: 7e73878af7f310227b9c958c3af4bf5cabbe65be

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact child geometry and blobs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          test "$base" = "$BASE_SHA"
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-pgn-surrogate-safety.yml' \
            'acs/pgn_webview_bridge.py' \
            'acs/pgn_webview_projection.py' \
            'acs/pgn_workspace.py' \
            'acs/pgn_workspace_webview_adapter.py' \
            'acs/version2_pgn_commands.py' \
            'tests/test_dev1_pgn_workspace_webview_adapter.py' \
            'tests/test_dev1_pgn_webview_projection.py' \
            'tests/test_pgn_complete_editing_user_flow.py' \
            'tests/test_pgn_workspace.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/pgn_workspace.py)" = "$WORKSPACE_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_webview_projection.py)" = "$PROJECTION_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_webview_bridge.py)" = "$BRIDGE_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_workspace_webview_adapter.py)" = "$ADAPTER_BLOB"
          test "$(git rev-parse HEAD:acs/version2_pgn_commands.py)" = "$COMMANDS_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_complete_editing_user_flow.py)" = "$FLOW_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev1_pgn_workspace_webview_adapter.py)" = "$ADAPTER_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev1_pgn_webview_projection.py)" = "$PROJECTION_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_workspace.py)" = "$WORKSPACE_TEST_BLOB"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile hardened PGN surfaces
        run: >-
          python -m py_compile
          acs/pgn_workspace.py
          acs/pgn_webview_projection.py
          acs/pgn_webview_bridge.py
          acs/pgn_workspace_webview_adapter.py
          acs/version2_pgn_commands.py
          tests/test_pgn_complete_editing_user_flow.py
          tests/test_dev1_pgn_workspace_webview_adapter.py
          tests/test_dev1_pgn_webview_projection.py
          tests/test_pgn_workspace.py

      - name: PGN malformed-text and atomicity regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_complete_editing_user_flow
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_dev1_pgn_webview_projection
          tests.test_pgn_workspace
          tests.test_version2_pgn_commands

      - name: Core chess selftest
        run: python -m acs.selftest
