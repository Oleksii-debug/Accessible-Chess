name: Integration Accessibility Successors

on:
  push:
    branches:
      - fix/integration-accessibility-successors-20261004
  pull_request:
    branches:
      - fix/integration-book-progress-successors-20261004
    paths:
      - 'web/version2_release_bootstrap.js'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - 'web/full_product_books_training.js'
      - 'tests/js/books_training_surface_dom_test.js'
      - '.github/workflows/integration-accessibility-successors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-accessibility-successors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent, scope and successor blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          parent='51ee3ee3b1e0d75e2a9852b6aa2f07d92a02217f'
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git cat-file -e '6c2c23f55c0418d1b3059b55503904aba2148fda^{commit}'
          git cat-file -e '33a112804212713753f6261e39793cf122475bb6^{commit}'
          git diff --check "$parent" HEAD

          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/integration-accessibility-successors.yml' \
            'tests/js/books_training_surface_dom_test.js' \
            'tests/js/version2_release_bootstrap_dom_test.js' \
            'web/full_product_books_training.js' \
            'web/version2_release_bootstrap.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = 'f17a9a19b1f33260459df8dfa66907aa15998093'
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = '619a8dc59ebc2d39638ff0bcedfb0abd1fb5ba02'
          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = '7094e8769d225f822bc87bb6853167a7f142125f'
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = 'f3db3b970c6cd7f112e80d4a7e7c8d8359fdc182'

          echo 'INTEGRATION_ACCESSIBILITY_SUCCESSORS_SCOPE=PASS'

      - name: Validate browser surfaces
        run: |
          node --check web/version2_release_bootstrap.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - name: Adjacent accessibility and application regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_accessibility_contract
          tests.test_version2_book_board_refresh_focus_order_evidence
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_bridge
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
