name: Books Durability Focus Rebind

on:
  pull_request:
    branches:
      - 'converge/books-semantic-durable-board-20261003'
    paths:
      - 'acs/version2_application.py'
      - 'tests/test_version2_application.py'
      - '.github/workflows/books-durability-focus-rebind.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-durability-focus-rebind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focus-rebind:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Authenticate live successor geometry
        shell: bash
        run: |
          set -euo pipefail
          base_branch='converge/books-semantic-durable-board-20261003'
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin             "+refs/heads/$base_branch:refs/remotes/origin/$base_branch"
          live_base="$(git rev-parse "refs/remotes/origin/$base_branch")"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$base_branch"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            # GitHub can retain the recorded PR base SHA while the live stacked
            # base advances. That historical event base must still be genuine
            # ancestry, but qualification is always against the current branch.
            git merge-base --is-ancestor "$event_base" "$live_base"

            changed="$(git diff --name-only "$live_base" HEAD | sort)"
            expected="$(printf '%s\n'               '.github/workflows/books-durability-focus-rebind.yml'               'acs/version2_application.py'               'tests/test_version2_application.py' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_base" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/version2_application.py)" = "53a209d9c63a3de5528b4708dd561d58415aa6d5"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "4c72d559a08a61e0b6f6976ac3fc94b321226ee0"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile successor runtime
        run: >-
          python -m compileall -q
          acs/version2_application.py
          tests/test_version2_application.py

      - name: Prove durability recovery and whole-product Book flow
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_v2_book_transaction_current_runtime
          tests.test_v2_book_board_workflow
          tests.test_v2_book_training_route_rollback
          tests.test_version2_training_current_runtime
