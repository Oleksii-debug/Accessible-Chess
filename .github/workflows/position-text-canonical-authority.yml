name: Position Text Canonical Authority

on:
  pull_request:
    paths:
      - 'acs/position_editor.py'
      - 'acs/move_entry.py'
      - 'acs/position_text.py'
      - 'acs/webapp.py'
      - 'tests/test_move_entry.py'
      - 'tests/test_position_editor.py'
      - 'tests/test_position_text_authority.py'
      - '.github/workflows/position-text-canonical-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-position-text:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact current-Product scope
        shell: bash
        run: |
          set -euo pipefail
          head='${{ github.event.pull_request.head.sha || github.sha }}'
          base='0c9036f3f3a445d3d518825cd620583b29af755a'
          test "$(git rev-parse HEAD)" = "$head"
          git cat-file -e "$base^{commit}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/position-text-canonical-authority.yml' \
            'acs/move_entry.py' \
            'acs/position_editor.py' \
            'acs/position_text.py' \
            'acs/webapp.py' \
            'tests/test_position_text_authority.py' | sort)"
          test "$changed" = "$expected"
          git diff --check "$base"...HEAD
          git diff --quiet "$base"...HEAD -- acs/chesscore.py acs/gametree.py acs/pgn_document.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed position surfaces
        run: >-
          python -m py_compile
          acs/position_editor.py
          acs/move_entry.py
          acs/position_text.py
          acs/webapp.py
          tests/test_position_text_authority.py

      - name: Run canonical position regression set
        run: >-
          python -m unittest -v
          tests.test_position_editor
          tests.test_move_entry
          tests.test_position_text_authority
          tests.test_stage1_release_composition_ui
