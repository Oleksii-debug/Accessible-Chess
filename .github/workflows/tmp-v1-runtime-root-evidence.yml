name: Temporary RC3 Runtime Root Evidence

on:
  push:
    branches:
      - tmp/v2-data-v1-runtime-path-evidence-20260901
    paths:
      - '.github/workflows/tmp-v1-runtime-root-evidence.yml'

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact shipped RC3 source and record root owner
        shell: bash
        run: |
          set -euo pipefail
          cat \
            build_snapshot_exact/group00.b64 \
            build_snapshot_exact/group01.b64 \
            build_parts10k/part04.b64 \
            build_parts10k/part05.b64 \
            build_parts10k/part06.b64 \
            build_parts10k/part07.b64 \
            | tr -cd 'A-Za-z0-9+/=' > stage1_source.b64
          test "$(wc -c < stage1_source.b64)" -eq 77128
          base64 -d stage1_source.b64 > stage1_source.zip
          test "$(wc -c < stage1_source.zip)" -eq 57844
          test "$(sha256sum stage1_source.zip | awk '{print $1}')" = 'cb0a89778b436cdf44c42e3207ef9638160a992b372156bc4d901391717a1e6a'
          mkdir work
          unzip -q stage1_source.zip -d work
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          shipped = Path('work/acs/logging_setup.py')
          checkout = Path('acs/logging_setup.py')
          main_path = Path('work/acs/main.py')
          shipped_bytes = shipped.read_bytes()
          checkout_bytes = checkout.read_bytes()
          shipped_text = shipped_bytes.decode('utf-8')
          checkout_text = checkout_bytes.decode('utf-8')
          main = main_path.read_text(encoding='utf-8')

          def root_lines(text):
              return [
                  {'line': i, 'text': line}
                  for i, line in enumerate(text.splitlines(), 1)
                  if line.startswith('ROOT =') or line.startswith('REPORTS =')
              ]

          shipped_roots = root_lines(shipped_text)
          checkout_roots = root_lines(checkout_text)
          main_lines = [
              {'line': i, 'text': line}
              for i, line in enumerate(main.splitlines(), 1)
              if "Settings(ROOT/" in line or "Library(ROOT/" in line
          ]
          root_expr = next((x['text'] for x in shipped_roots if x['text'].startswith('ROOT =')), None)
          if root_expr is None:
              raise SystemExit('shipped ROOT expression missing')

          if "Path(sys.executable).resolve().parent if getattr(sys,'frozen',False)" in root_expr:
              derived = '<directory containing sys.executable>/data/{settings.json,library.acsdb}'
          else:
              derived = 'UNRESOLVED_FROM_KNOWN_RC3_PATTERN'

          result = {
              'evidence_kind': 'immutable-shipped-rc3-runtime-root',
              'tag_commit': '1a8934a0f7125262cfdb9854e459ffcd22e55348',
              'source_zip_size': 57844,
              'source_zip_sha256': 'cb0a89778b436cdf44c42e3207ef9638160a992b372156bc4d901391717a1e6a',
              'checkout_matches_shipped': shipped_bytes == checkout_bytes,
              'shipped_logging_setup_sha256': hashlib.sha256(shipped_bytes).hexdigest(),
              'checkout_logging_setup_sha256': hashlib.sha256(checkout_bytes).hexdigest(),
              'shipped_root_lines': shipped_roots,
              'checkout_root_lines': checkout_roots,
              'shipped_main_sha256': hashlib.sha256(main_path.read_bytes()).hexdigest(),
              'main_data_calls': main_lines,
              'derived_windows_frozen_topology_from_shipped_root_only': derived,
          }
          Path('V1_RUNTIME_ROOT_EVIDENCE.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          test -s V1_RUNTIME_ROOT_EVIDENCE.json
      - name: Commit evidence report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'accessible-chess-evidence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add V1_RUNTIME_ROOT_EVIDENCE.json
          git diff --cached --check
          git commit -m 'evidence: prove authoritative shipped RC3 runtime root'
          git push origin HEAD:tmp/v2-data-v1-runtime-path-evidence-20260901
