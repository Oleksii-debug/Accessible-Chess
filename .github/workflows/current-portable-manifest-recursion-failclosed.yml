name: Current Release Boundary and App Launch Fail-Closed Qualification

on:
  pull_request:
    branches:
      - converge/current-product-package-manifest-integration-20261004-3pg7jcgq
    paths:
      - 'acs/version2_portable_package.py'
      - 'tests/test_portable_manifest_json_prehash_bounds_current.py'
      - 'acs/full_product_actions.py'
      - 'acs/version2_application.py'
      - 'acs/version2_book_workspace.py'
      - 'tests/test_full_product_book_command_authority.py'
      - 'acs/webapp_keymap.py'
      - 'tests/test_webview_keymap_bridge_contract.py'
      - 'acs/full_product_webview_adapter.py'
      - '.github/workflows/owner-oneclick-from-w4.yml'
      - '.github/workflows/p0-user-oneclick-portable-launcher.yml'
      - '.github/workflows/current-portable-manifest-recursion-failclosed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-portable-manifest-recursion-failclosed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live base and bounded repair scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test -n "${EVENT_BASE_REF:-}"
          test -n "${EVENT_BASE_SHA:-}"
          git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
          live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
          test "$EVENT_BASE_SHA" = "$live_base"
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected="$(printf '%s\\n' \\
            '.github/workflows/current-portable-manifest-recursion-failclosed.yml' \\
            '.github/workflows/owner-oneclick-from-w4.yml' \\
            '.github/workflows/p0-user-oneclick-portable-launcher.yml' \\
            'acs/full_product_actions.py' \\
            'acs/full_product_webview_adapter.py' \\
            'acs/version2_application.py' \\
            'acs/version2_book_workspace.py' \\
            'acs/version2_portable_package.py' \\
            'acs/webapp_keymap.py' \\
            'tests/test_full_product_book_command_authority.py' \\
            'tests/test_portable_manifest_json_prehash_bounds_current.py' \\
            'tests/test_webview_keymap_bridge_contract.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected portable-manifest recursion repair scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile release and Book launch surfaces
        run: >-
          python -m compileall -q
          acs/version2_portable_package.py
          acs/version2_book_workspace.py
          acs/version2_application.py
          acs/full_product_actions.py
          acs/full_product_webview_adapter.py
          tests/test_portable_manifest_json_prehash_bounds_current.py
          tests/test_full_product_book_command_authority.py
          acs/webapp_keymap.py
          tests/test_webview_keymap_bridge_contract.py

      - name: Execute Book-to-board launch regressions
        run: >-
          python -m unittest -v
          tests.test_book_board_progress_failure_exact
          tests.test_full_product_book_command_authority
          tests.test_webview_keymap_bridge_contract
          tests.test_book_reverse_progress_failure_exact

      - name: Execute focused manifest resource regressions
        run: >-
          python -m unittest -v
          tests.test_portable_manifest_json_prehash_bounds_current

      - name: Execute retained portable package contract
        run: >-
          python -m unittest -v
          tests.test_version2_portable_package

      - name: Core selftest
        run: python -m acs.selftest
