name: W4 Windows Frozen Stage1 Blob Contract

on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'acs/stage1_release_ui_core.py'
      - 'acs/webapp_keymap_core.py'
      - 'tests/test_stage1_saturation_refactor_contract.py'
      - '.github/workflows/w4-windows-frozen-blob.yml'

permissions:
  contents: read

concurrency:
  group: accessible-chess-w4-frozen-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-blob-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Normalize checkout without rewriting frozen blobs
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen Stage1 blob bytes
        run: python -m unittest tests.test_stage1_saturation_refactor_contract.Stage1SaturationRefactorContractTests.test_extracted_core_files_are_byte_identical_to_frozen_git_blobs -v
