name: P0-F Package Staging Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'scripts/stage_p0f_release_content.py'
      - 'tests/test_stage_p0f_release_content.py'
      - 'acs/version2_packaged_starter_application.py'
      - 'tests/test_v2_packaged_starter_application.py'
      - '.github/workflows/p0f-package-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0f-package-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  staging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact candidate identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.ref }}' = 'work/full-product-teacher-education-reachability-20260911'
          git diff --check '${{ github.event.pull_request.base.sha }}' HEAD

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile package staging seam
        run: >-
          python -m py_compile
          scripts/stage_p0f_release_content.py
          tests/test_stage_p0f_release_content.py
          acs/version2_packaged_starter_application.py

      - name: Run atomic P0-F staging regressions
        run: >-
          python -m unittest -v
          tests.test_stage_p0f_release_content
          tests.test_v2_packaged_starter_application

      - name: Core selftest
        run: python -m acs.selftest
