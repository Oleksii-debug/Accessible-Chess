name: Current FEN Input Budget

on:
  pull_request:
    branches:
      - fix/current-history-branch-snapshot-passive-20261004-sol56h5
    paths:
      - 'acs/input_limits.py'
      - 'acs/chesscore.py'
      - 'acs/position_editor.py'
      - 'tests/test_fen_input_budget_current.py'
      - '.github/workflows/current-fen-input-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-fen-input-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            base_ref="fix/current-history-branch-snapshot-passive-20261004-sol56h5"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-fen-input-budget.yml' \
            'acs/chesscore.py' \
            'acs/input_limits.py' \
            'acs/position_editor.py' \
            'tests/test_fen_input_budget_current.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected FEN-budget scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile FEN ingress surfaces
        run: >-
          python -m compileall -q
          acs/input_limits.py
          acs/chesscore.py
          acs/position_editor.py
          tests/test_fen_input_budget_current.py

      - name: Execute FEN and adjacent Stage1 regressions
        run: >-
          python -m unittest -v
          tests.test_fen_input_budget_current
          tests.test_dev2_fen_atomicity
          tests.test_position_editor
          tests.test_position_editor_passive_boundary
          tests.test_stage1_fen_history_atomicity_current
          tests.test_stage1_move_history_atomicity_current
          tests.test_accessible_webui

      - name: Architecture boundaries
        run: >-
          python -m unittest -v
          tests.test_architecture
          tests.test_architecture_dynamic_imports

      - name: Core selftest
        run: python -m acs.selftest
