name: Training Snapshot Definition Identity V4

on:
  push:
    branches:
      - work/training-snapshot-definition-v4-20261004-solr8k
  pull_request:
    paths:
      - 'acs/training.py'
      - 'tests/test_d08_training_canonical_resume.py'
      - 'tests/test_training_snapshot_definition_identity_v4.py'
      - '.github/workflows/training-snapshot-definition-identity-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-snapshot-definition-identity-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact base scope and owned blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          parent='d067245a97316c02d0ff687016c4d84aa77a0fe8'
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git diff --check "$parent" HEAD

          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/training-snapshot-definition-identity-v4.yml' \
            'acs/training.py' \
            'tests/test_d08_training_canonical_resume.py' \
            'tests/test_training_snapshot_definition_identity_v4.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/training.py)" = '840521fe7912d2fe140180dad3fa772a191cd438'
          test "$(git rev-parse HEAD:tests/test_d08_training_canonical_resume.py)" = 'd519f3efeca9af08f266151605a5aa45bb27732c'
          test "$(git rev-parse HEAD:tests/test_training_snapshot_definition_identity_v4.py)" = '157614e5ba74ca8b8a4969f978db8f9fe03687a5'

      - name: Compile Training persistence surfaces
        run: >-
          python -m compileall -q
          acs/training.py
          tests/test_d08_training_canonical_resume.py
          tests/test_training_snapshot_definition_identity_v4.py

      - name: Run canonical resume and definition identity regressions
        run: >-
          python -m unittest -v
          tests.test_d08_training_canonical_resume
          tests.test_training_snapshot_definition_identity_v4

      - name: Run broader Training authority and persistence regressions
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_training_authority_convergence
          tests.test_version2_training_current_runtime
          tests.test_w2_training_progress_crash_recovery

      - name: Core selftest
        run: python -m acs.selftest
