name: Section 11 Tactile Input And Device Profiles

on:
  pull_request:
    branches:
      - 'closure/section8-accepted-ead29d'
    paths:
      - 'acs/tactile_input.py'
      - 'acs/version2_application.py'
      - 'tests/test_tactile_input.py'
      - 'tests/test_tactile_input_application.py'
      - 'docs/automation/SECTION11_TACTILE_INPUT_CLOSURE.md'
      - '.github/workflows/section11-tactile-input-profiles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section11-tactile-input-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    name: tactile-input-\${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact head and bounded Section 11 scope
        shell: bash
        env:
          EXPECTED_HEAD: \${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: \${{ github.event_name }}
          BASE_SHA: \${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$BASE_SHA"
            test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
            git diff --check "$BASE_SHA"...HEAD
            mapfile -t actual < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
            expected=(
              ".github/workflows/section11-tactile-input-profiles.yml"
              "acs/tactile_input.py"
              "acs/version2_application.py"
              "docs/automation/SECTION11_TACTILE_INPUT_CLOSURE.md"
              "tests/test_tactile_input.py"
              "tests/test_tactile_input_application.py"
            )
            test "\${#actual[@]}" -eq "\${#expected[@]}"
            for i in "\${!expected[@]}"; do
              test "\${actual[$i]}" = "\${expected[$i]}"
            done
          fi

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Section 11 and application composition
        run: >-
          python -m py_compile
          acs/tactile_input.py
          acs/version2_application.py
          tests/test_tactile_input.py
          tests/test_tactile_input_application.py

      - name: Run focused tactile input contract
        run: >-
          python -m unittest -v
          tests.test_tactile_input
          tests.test_tactile_input_application

      - name: Re-run canonical Version2 application regression
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_section10_v2_tactile_wiring

      - name: Static mutation-safety oracle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path("acs/tactile_input.py").read_text(encoding="utf-8")
          required = (
              '"board.file_"',
              '"board.rank_"',
              '"board.current"',
              '"board.activate"',
              '"edit.undo"',
              '"move.submit"',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing safety-contract token: {token}")
          PY
