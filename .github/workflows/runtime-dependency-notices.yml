name: Runtime Dependency Notices

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/runtime_dependency_notices.py'
      - 'tests/test_runtime_dependency_notices.py'
      - '.github/workflows/runtime-dependency-notices.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-dependency-notices-${{ github.ref }}
  cancel-in-progress: true

env:
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_SDIST_URL: https://files.pythonhosted.org/packages/4c/ca/bfac8bc689799bcca4157e0e0ced07e70ce125193fc2e166d2e685b7e2fe/ordered-set-4.1.0.tar.gz
  ORDERED_SET_SDIST_SHA256: 694a8e44c87657c59292ede72891eb91d34131f6531463aab3009191c77364a8
  ORDERED_SET_LICENSE_MEMBER: ordered-set-4.1.0/MIT-LICENSE
  PROXY_TOOLS_SDIST_URL: https://files.pythonhosted.org/packages/f2/cf/77d3e19b7fabd03895caca7857ef51e4c409e0ca6b37ee6e9f7daa50b642/proxy_tools-0.1.0.tar.gz
  PROXY_TOOLS_SDIST_SHA256: ccb3751f529c047e2d8a58440d86b205303cf0fe8146f784d1cbcd94f0a28010
  PROXY_TOOLS_LICENSE_MEMBER: proxy_tools-0.1.0/LICENSE.txt

jobs:
  focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile notice boundary
        run: python -m compileall -q acs/runtime_dependency_notices.py tests/test_runtime_dependency_notices.py

      - name: Focused fail-closed notice tests
        run: python -m unittest -v tests.test_runtime_dependency_notices

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  real-windows-qualified-stack:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install exact current package build and runtime stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
          python -m pip install --disable-pip-version-check `
            pywebview==6.2.1 `
            pythonnet==3.1.0 `
            clr-loader==0.3.1 `
            cffi==2.1.1 `
            pycparser==3.0 `
            typing-extensions==4.16.0 `
            "Nuitka @ $nuitkaUrl" `
            ordered-set==4.1.0 `
            zstandard==0.25.0
          if($LASTEXITCODE -ne 0){throw 'Qualified Windows dependency installation failed'}

      - name: Download exact source artifacts for omitted wheel licenses
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest -Uri $env:ORDERED_SET_SDIST_URL -OutFile ordered-set-4.1.0.tar.gz
          $orderedActual=(Get-FileHash -Algorithm SHA256 ordered-set-4.1.0.tar.gz).Hash.ToLowerInvariant()
          if($orderedActual -ne $env:ORDERED_SET_SDIST_SHA256){
            throw "ordered-set source artifact SHA256 mismatch actual=$orderedActual expected=$env:ORDERED_SET_SDIST_SHA256"
          }
          Invoke-WebRequest -Uri $env:PROXY_TOOLS_SDIST_URL -OutFile proxy_tools-0.1.0.tar.gz
          $proxyActual=(Get-FileHash -Algorithm SHA256 proxy_tools-0.1.0.tar.gz).Hash.ToLowerInvariant()
          if($proxyActual -ne $env:PROXY_TOOLS_SDIST_SHA256){
            throw "proxy_tools source artifact SHA256 mismatch actual=$proxyActual expected=$env:PROXY_TOOLS_SDIST_SHA256"
          }
          @'
          import os, tarfile
          for archive, member, label in (
              ('ordered-set-4.1.0.tar.gz', os.environ['ORDERED_SET_LICENSE_MEMBER'], 'ordered-set'),
              ('proxy_tools-0.1.0.tar.gz', os.environ['PROXY_TOOLS_LICENSE_MEMBER'], 'proxy_tools'),
          ):
              with tarfile.open(archive, 'r:gz') as package:
                  names = set(package.getnames())
                  if member not in names:
                      candidates = sorted(name for name in names if 'licen' in name.casefold() or 'copying' in name.casefold() or 'notice' in name.casefold())
                      raise SystemExit(f'{label} exact license member missing: expected={member!r} candidates={candidates!r}')
          print('EXACT_SOURCE_LICENSE_MEMBERS=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Exact source license member proof failed'}
          Write-Host "ORDERED_SET_SOURCE_ARTIFACT_SHA256=$orderedActual"
          Write-Host "PROXY_TOOLS_SOURCE_ARTIFACT_SHA256=$proxyActual"

      - name: Prove real installed dependency closure and notice bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json
          import os
          from importlib.metadata import version
          from pathlib import Path
          from acs.runtime_dependency_notices import (
              ExternalArchiveNoticeSource,
              build_runtime_dependency_notice_bundle,
          )

          expected = {
              'pywebview': '6.2.1',
              'pythonnet': '3.1.0',
              'clr-loader': '0.3.1',
              'cffi': '2.1.1',
              'pycparser': '3.0',
              'typing_extensions': '4.16.0',
              'ordered-set': '4.1.0',
              'zstandard': '0.25.0',
              'proxy_tools': '0.1.0',
              'bottle': '0.13.4',
              'Nuitka': version('Nuitka'),
          }
          for distribution, wanted in expected.items():
              actual = version(distribution)
              print(f'QUALIFIED_NOTICE_DISTRIBUTION {distribution}={actual}')
              if actual != wanted:
                  raise SystemExit(f'QUALIFIED_NOTICE_VERSION_DRIFT {distribution} actual={actual} expected={wanted}')

          external = {
              'ordered-set': ExternalArchiveNoticeSource(
                  archive_path=Path('ordered-set-4.1.0.tar.gz'),
                  source_url=os.environ['ORDERED_SET_SDIST_URL'],
                  source_sha256=os.environ['ORDERED_SET_SDIST_SHA256'],
                  member_path=os.environ['ORDERED_SET_LICENSE_MEMBER'],
              ),
              'proxy_tools': ExternalArchiveNoticeSource(
                  archive_path=Path('proxy_tools-0.1.0.tar.gz'),
                  source_url=os.environ['PROXY_TOOLS_SDIST_URL'],
                  source_sha256=os.environ['PROXY_TOOLS_SDIST_SHA256'],
                  member_path=os.environ['PROXY_TOOLS_LICENSE_MEMBER'],
              ),
          }
          bundle = build_runtime_dependency_notice_bundle(
              tuple(expected),
              Path('real-runtime-notices'),
              expected_versions=expected,
              python_version='3.12.10',
              external_notice_sources=external,
          )
          manifest = json.loads(bundle.manifest_path.read_text(encoding='utf-8'))
          names = {row['distribution'] for row in manifest['distributions']}
          if names != set(expected):
              raise SystemExit(f'QUALIFIED_NOTICE_MANIFEST_INVENTORY_MISMATCH {sorted(names)}')
          if manifest['python']['version'] != '3.12.10':
              raise SystemExit('QUALIFIED_NOTICE_PYTHON_VERSION_MISMATCH')
          for distribution, digest, member in (
              ('ordered-set', os.environ['ORDERED_SET_SDIST_SHA256'], os.environ['ORDERED_SET_LICENSE_MEMBER']),
              ('proxy_tools', os.environ['PROXY_TOOLS_SDIST_SHA256'], os.environ['PROXY_TOOLS_LICENSE_MEMBER']),
          ):
              row = next(item for item in manifest['distributions'] if item['distribution'] == distribution)
              if len(row['notice_files']) != 1:
                  raise SystemExit(f'{distribution} notice count mismatch')
              notice = row['notice_files'][0]
              if notice.get('source_kind') != 'verified_source_archive':
                  raise SystemExit(f'{distribution} notice source kind mismatch')
              if notice.get('source_artifact_sha256') != digest:
                  raise SystemExit(f'{distribution} notice source sha mismatch')
              if notice.get('source_path') != member:
                  raise SystemExit(f'{distribution} notice member mismatch')
          if len(bundle.notice_files) < len(expected) + 2:
              raise SystemExit('QUALIFIED_NOTICE_FILE_COUNT_TOO_SMALL')
          print(f'QUALIFIED_RUNTIME_NOTICE_FILES={len(bundle.notice_files)}')
          print('ORDERED_SET_EXACT_SOURCE_LICENSE_FALLBACK=PASS')
          print('PROXY_TOOLS_EXACT_SOURCE_LICENSE_FALLBACK=PASS')
          print('QUALIFIED_RUNTIME_DEPENDENCY_NOTICES=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Real qualified dependency notice proof failed'}

      - name: Upload bounded real notice evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-runtime-dependency-notices
          path: real-runtime-notices
          if-no-files-found: warn
          retention-days: 14
