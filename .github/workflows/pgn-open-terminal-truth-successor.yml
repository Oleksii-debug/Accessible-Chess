name: PGN Open Terminal Truth Successor

on:
  push:
    branches:
      - fix/current-runtime-pgn-open-terminal-truth-20261006-c2mbezb
  pull_request:
    branches:
      - converge/current-runtime-pgn-cancel-successor-20261006-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-open-terminal-truth-successor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BASE_BRANCH: converge/current-runtime-pgn-cancel-successor-20261006-ooxple7
  BASE_SHA: a604e92e98c8b4ba9636e15b4e1221a18742bc84
  SOURCE_BLOB: 6872059e294ea595a67f4c1734f8353dfb9257de
  OPEN_TEST_BLOB: 59d9861690198bc70631a36fcdff26d61fd18842
  SAVE_TEST_BLOB: a9fb0eb40d8b48b75a900318db72ad62bb825b3e

jobs:
  pgn-open-terminal-truth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact parent and bounded terminal-truth delta
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi

          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/runtime-parent"
          live_base="$(git rev-parse refs/remotes/origin/runtime-parent)"
          test "$live_base" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          expected=(
            ".github/workflows/pgn-open-terminal-truth-successor.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_pgn_open_worker.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_save_worker.py)" = "$SAVE_TEST_BLOB"

      - name: Compile PGN runtime boundary
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_pgn_open_worker.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Execute PGN Open terminal and persistence authority
        run: >-
          python -m unittest -v
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_open_invalid_session
          tests.test_v2_windows_file_worker_preflight
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_pgn_document_passive_ingress
          tests.test_pgn_save_snapshot

      - name: Execute application journey seam
        run: >-
          python -m unittest -v
          tests.test_v2_windows_host_runtime
          tests.test_version2_application
          tests.test_whole_product_user_journey

      - name: Core selftest
        run: python -m acs.selftest
