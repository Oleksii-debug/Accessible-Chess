name: W6 V2 Package Assembler Current Runtime

on:
  push:
    branches:
      - work/w6-v2-package-assembler-current-preflight-20260910
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_package_assembler.py'
      - 'tests/test_version2_package_assembler.py'
      - 'acs/version2_package_preflight.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/test_version2_package_preflight_hardening.py'
      - 'tests/test_v2_package_required_resources.py'
      - 'tests/test_version2_stockfish_source_archive_preflight.py'
      - '.github/workflows/w6-v2-package-assembler.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w6-v2-package-assembler-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove current integrated Product assembler and preflight surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f acs/version2_package_assembler.py
          test -f acs/version2_package_preflight.py
          test -f tests/test_version2_package_assembler.py
          test -f tests/test_version2_package_preflight.py
          test -f tests/test_version2_package_preflight_hardening.py
          test -f tests/test_v2_package_required_resources.py
          test -f tests/test_version2_stockfish_source_archive_preflight.py
          python - <<'PY'
          from pathlib import Path
          validators = sorted(
              p.as_posix()
              for p in Path('acs').glob('*.py')
              if ('version2_package_preflight' in p.name or 'version2_package_validator' in p.name)
          )
          assert validators == ['acs/version2_package_preflight.py'], validators
          print('CURRENT INTEGRATED PRODUCT / SINGLE ASSEMBLER+PREFLIGHT SURFACE PASS')
          PY

      - name: Compile assembler and canonical preflight
        run: >-
          python -m compileall -q
          acs/version2_package_assembler.py
          acs/version2_package_preflight.py
          tests/test_version2_package_assembler.py
          tests/test_version2_package_preflight.py
          tests/test_version2_package_preflight_hardening.py
          tests/test_v2_package_required_resources.py
          tests/test_version2_stockfish_source_archive_preflight.py

      - name: Direct fresh temp sibling oracle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tempfile
          from unittest.mock import patch

          from acs.version2_package_assembler import assemble_version2_package_tree
          from tests.test_version2_package_assembler import Version2PackageAssemblerTests, _SHA

          real_mkdtemp = tempfile.mkdtemp
          observed = []

          def record_mkdtemp(*args, **kwargs):
              observed.append((kwargs.get("prefix"), kwargs.get("dir")))
              return real_mkdtemp(*args, **kwargs)

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              product, notices = Version2PackageAssemblerTests()._sources(root)
              output = root / "candidate"
              with patch("acs.version2_package_assembler.tempfile.mkdtemp", side_effect=record_mkdtemp):
                  assemble_version2_package_tree(product, notices, output, integration_sha=_SHA)
              assert observed == [(".candidate.assemble-", root)], observed
              assert output.is_dir()
              assert not any(root.glob(".candidate.assemble-*"))
          print("DIRECT FRESH TEMP SIBLING PASS")
          PY

      - name: Deterministic assembler plus current canonical preflight regressions
        run: >-
          python -m unittest -v
          tests.test_version2_package_assembler
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening
          tests.test_v2_package_required_resources
          tests.test_version2_stockfish_source_archive_preflight
