name: Current Canonical Null Move Convergence

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/chesscore.py'
      - 'acs/chessbase_decoder.py'
      - 'tests/test_current_canonical_nullmove_convergence.py'
      - '.github/workflows/current-canonical-nullmove-convergence.yml'
  push:
    branches:
      - converge/canonical-nullmove-current-product-20260927
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-canonical-nullmove-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact current-Product ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          product_branch='work/full-product-teacher-education-reachability-20260911'
          git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
          product="$(git rev-parse "refs/remotes/origin/$product_branch")"

          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD

          actual="$(git diff --name-only "$product...HEAD" | LC_ALL=C sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/current-canonical-nullmove-convergence.yml' \
            'acs/chessbase_decoder.py' \
            'acs/chesscore.py' \
            'tests/test_current_canonical_nullmove_convergence.py' | LC_ALL=C sort)"
          test "$actual" = "$wanted"

          # This convergence must not mutate PGN/GameTree/Library/Books/package authorities.
          git diff --quiet "$product" HEAD -- \
            acs/gametree.py \
            acs/pgn_service.py \
            acs/acsdb.py \
            acs/library_import_service.py \
            acs/version2_application.py \
            acs/version2_release_app.py \
            acs/version2_package_preflight.py

      - name: Compile owned current-Product seam
        run: >-
          python -m py_compile
          acs/chesscore.py
          acs/chessbase_decoder.py
          tests/test_current_canonical_nullmove_convergence.py

      - name: Run canonical null-move and adjacent format regressions
        run: >-
          python -m unittest -v
          tests.test_current_canonical_nullmove_convergence
          tests.test_chessbase_decoder
          tests.test_chessbase_adapter
          tests.test_gametree

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
