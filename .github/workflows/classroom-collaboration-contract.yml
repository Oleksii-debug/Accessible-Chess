name: Classroom Collaboration Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
      - feature/classroom-collaboration-contract-20260926
      - feature/classroom-collaboration-file-sync-20261003
    paths:
      - 'acs/classroom_collaboration.py'
      - 'acs/classroom_collaboration_storage.py'
      - 'tests/test_classroom_collaboration.py'
      - 'tests/test_classroom_collaboration_storage.py'
      - '.github/workflows/classroom-collaboration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-collaboration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact current-Product collaboration scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$BASE_REF" in
            work/full-product-teacher-education-reachability-20260911)
              expected=(
                '.github/workflows/classroom-collaboration-contract.yml'
                'acs/classroom_collaboration.py'
                'acs/classroom_collaboration_storage.py'
                'tests/test_classroom_collaboration.py'
                'tests/test_classroom_collaboration_storage.py'
              )
              ;;
            feature/classroom-collaboration-contract-20260926)
              expected=(
                '.github/workflows/classroom-collaboration-contract.yml'
                'acs/classroom_collaboration.py'
                'tests/test_classroom_collaboration.py'
              )
              ;;
            feature/classroom-collaboration-file-sync-20261003)
              expected=(
                '.github/workflows/classroom-collaboration-contract.yml'
                'acs/classroom_collaboration.py'
                'acs/classroom_collaboration_storage.py'
                'tests/test_classroom_collaboration.py'
                'tests/test_classroom_collaboration_storage.py'
              )
              ;;
            *)
              printf 'Unexpected collaboration base: %s\n' "$BASE_REF"
              exit 1
              ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected collaboration PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'CLASSROOM_COLLABORATION_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile collaboration boundaries
        run: >-
          python -m py_compile
          acs/classroom_collaboration.py
          acs/classroom_collaboration_storage.py
          tests/test_classroom_collaboration.py
          tests/test_classroom_collaboration_storage.py

      - name: Run collaboration and current media contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
          tests.test_classroom_realtime_media

      - name: Core selftest
        run: python -m acs.selftest
