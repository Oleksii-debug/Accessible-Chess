name: WordDeck worker 3 Sentence R3 gate

on:
  push:
    branches: [worddeck-worker-3-sentence-r3]
    paths:
      - 'WordDeck/**'
      - 'WordDeck.Round3Tests/**'
      - 'tools/worddeck/**'
      - '.github/workflows/worddeck-worker3-sentence-r3.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: worddeck-worker3-sentence-r3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentence-r3-regression:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated Round-3 worker branch
        uses: actions/checkout@v4

      - name: Publish pending worker checkpoint
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'WordDeck worker 3 Sentence R3 gate',
              description: 'Round-3 Sentence code and real-corpus gates are running.',
              target_url: targetUrl
            });

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore WordDeck
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Restore Round-3 regression harness
        run: dotnet restore .\WordDeck.Round3Tests\WordDeck.Round3Tests.csproj

      - name: Build Release
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore

      - name: Build Round-3 regression harness
        run: dotnet build .\WordDeck.Round3Tests\WordDeck.Round3Tests.csproj -c Release --no-restore

      - name: Run full WordDeck self-test
        run: dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Run deep Round-3 Sentence regression harness
        run: dotnet run --project .\WordDeck.Round3Tests\WordDeck.Round3Tests.csproj -c Release --no-build

      - name: Publish self-contained Windows EXE
        run: dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\WordDeck-win-x64

      - name: Smoke published EXE with full self-test
        shell: pwsh
        run: |
          $process = Start-Process .\artifacts\WordDeck-win-x64\WordDeck.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Published WordDeck self-test failed with exit code $($process.ExitCode)."
          }

      - name: Upload Round-3 worker EXE evidence
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-worker3-r3-win-x64
          path: .\artifacts\WordDeck-win-x64\WordDeck.exe
          if-no-files-found: error
          retention-days: 14

  real-tatoeba-cc0-sentencepack:
    needs: sentence-r3-regression
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated Round-3 worker branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build both-sides-CC0 EN-UA pair evidence from official Tatoeba exports
        run: python .\tools\worddeck\build_tatoeba_cc0_pairs.py --output-dir .\artifacts\tatoeba-cc0

      - name: Restore WordDeck
        run: dotnet restore .\WordDeck\WordDeck.csproj

      - name: Build WordDeck Release
        run: dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore

      - name: Build real Tatoeba CC0 SentencePack
        shell: pwsh
        run: |
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --build-tatoeba-sentence-pack `
            .\artifacts\tatoeba-cc0\tatoeba-en-uk-both-cc0.tsv `
            .\artifacts\tatoeba-cc0\WordDeck-SentencePack-Tatoeba-EN-UA-CC0-v1.json `
            tatoeba-en-uk-both-cc0-v1
          if ($LASTEXITCODE -ne 0) { throw "Real Tatoeba SentencePack build failed." }

      - name: Create deterministic gzip portable candidate
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import gzip
          source = Path(r'artifacts/tatoeba-cc0/WordDeck-SentencePack-Tatoeba-EN-UA-CC0-v1.json')
          target = Path(str(source) + '.gz')
          with source.open('rb') as src, target.open('wb') as raw:
              with gzip.GzipFile(filename='', mode='wb', fileobj=raw, compresslevel=9, mtime=0) as out:
                  while True:
                      block = src.read(1024 * 1024)
                      if not block:
                          break
                      out.write(block)
          print(target)
          '@ | python -

      - name: Validate real portable pack and build SQLite derivative metrics
        shell: pwsh
        run: |
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-sentence-pack `
            .\artifacts\tatoeba-cc0\WordDeck-SentencePack-Tatoeba-EN-UA-CC0-v1.json.gz `
            .\artifacts\tatoeba-cc0\sentencepack-metrics.json `
            --sqlite `
            .\artifacts\tatoeba-cc0\WordDeck-SentencePack-Tatoeba-EN-UA-CC0-v1.sqlite
          if ($LASTEXITCODE -ne 0) { throw "Real SentencePack validation/SQLite build failed." }

      - name: Write distributable evidence hashes
        shell: pwsh
        run: |
          $root = Resolve-Path .\artifacts\tatoeba-cc0
          $files = Get-ChildItem $root -File | Where-Object { $_.Name -notmatch '^upstream$' }
          $lines = @()
          foreach ($file in $files | Sort-Object Name) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding utf8 .\artifacts\tatoeba-cc0\SHA256SUMS.txt
          Copy-Item .\WordDeck\TATOEBA_SENTENCEPACK_NOTICE.md .\artifacts\tatoeba-cc0\TATOEBA_SENTENCEPACK_NOTICE.md

      - name: Upload real SentencePack candidate and provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-SentencePack-Tatoeba-EN-UA-CC0-r3
          path: |
            .\artifacts\tatoeba-cc0\tatoeba-en-uk-both-cc0.tsv
            .\artifacts\tatoeba-cc0\tatoeba-en-uk-both-cc0.tsv.manifest.json
            .\artifacts\tatoeba-cc0\WordDeck-SentencePack-Tatoeba-EN-UA-CC0-v1.json.gz
            .\artifacts\tatoeba-cc0\WordDeck-SentencePack-Tatoeba-EN-UA-CC0-v1.sqlite
            .\artifacts\tatoeba-cc0\sentencepack-metrics.json
            .\artifacts\tatoeba-cc0\SHA256SUMS.txt
            .\artifacts\tatoeba-cc0\TATOEBA_SENTENCEPACK_NOTICE.md
          if-no-files-found: error
          retention-days: 14

  final-r3-status:
    if: always()
    needs: [sentence-r3-regression, real-tatoeba-cc0-sentencepack]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final combined worker checkpoint
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const codeOk = '${{ needs.sentence-r3-regression.result }}' === 'success';
            const corpusOk = '${{ needs.real-tatoeba-cc0-sentencepack.result }}' === 'success';
            const succeeded = codeOk && corpusOk;
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'WordDeck worker 3 Sentence R3 gate',
              description: succeeded
                ? 'R3 code, Windows EXE and real Tatoeba CC0 SentencePack gates passed.'
                : `R3 failed: code=${{ needs.sentence-r3-regression.result }}, corpus=${{ needs.real-tatoeba-cc0-sentencepack.result }}.`,
              target_url: targetUrl
            });
            if (!succeeded) core.setFailed('Round-3 combined Sentence gate failed.');
