name: DEV2 Full Product Core CI

on:
  push:
    branches:
      - auto/dev2-full-product-core-20260822
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev2-full-product-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Diff hygiene
        run: git diff --check 0cf4fe291ff6c349de99978cd2fc68866a218da8...HEAD
      - name: Compile
        run: python -m compileall -q acs tests
      - name: Focused canonical GameTree navigation
        run: python -m unittest tests.test_gametree_navigation -v
      - name: Focused canonical GameTree editing
        run: python -m unittest tests.test_gametree_editing -v
      - name: Focused canonical GameTree legality projection
        run: python -m unittest tests.test_gametree_legality -v
      - name: Existing GameTree and identity regressions
        run: |
          python -m unittest tests.test_gametree -v
          python -m unittest tests.test_gametree_export_validation -v
          python -m unittest tests.test_game_identity -v
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q
