name: Education Classroom Integration CI

on:
  pull_request:
    paths:
      - 'acs/teaching_session_adapter.py'
      - 'acs/teaching_reverse_channel.py'
      - 'acs/teaching_visual_board.py'
      - 'acs/teaching_classroom_adapter.py'
      - 'tests/test_teaching_session_adapter.py'
      - 'tests/test_teaching_reverse_channel.py'
      - 'tests/test_teaching_visual_board.py'
      - 'tests/test_teaching_classroom_adapter.py'
      - 'tests/test_teaching_classroom_floor_control.py'
      - 'tests/test_education_classroom_integration.py'
      - '.github/workflows/education-classroom-integration.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      D10_BASE: 86c67f028faed292cddaad4fd8c58c6ac5467745
      D09_SOURCE: 59fedaa139a26f848f60af345ac429163ea344b7
      DEV2_ACCEPTED_UI_EVIDENCE: 06d610e90731d8b987bd6def02e0d7e39748808e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Preserve exact Git bytes
        shell: bash
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Prove exact addition-only ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$D10_BASE"
          git diff --check "$D10_BASE" HEAD
          changed="$(git diff --name-only "$D10_BASE" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/education-classroom-integration.yml' 'acs/teaching_classroom_adapter.py' 'acs/teaching_reverse_channel.py' 'acs/teaching_session_adapter.py' 'acs/teaching_visual_board.py' 'tests/test_education_classroom_integration.py' 'tests/test_teaching_classroom_adapter.py' 'tests/test_teaching_classroom_floor_control.py' 'tests/test_teaching_reverse_channel.py' 'tests/test_teaching_session_adapter.py' 'tests/test_teaching_visual_board.py' | sort)"
          test "$changed" = "$expected"
          for path in acs/teaching_classroom_adapter.py acs/teaching_reverse_channel.py acs/teaching_session_adapter.py acs/teaching_visual_board.py tests/test_teaching_classroom_adapter.py tests/test_teaching_classroom_floor_control.py tests/test_teaching_reverse_channel.py tests/test_teaching_session_adapter.py tests/test_teaching_visual_board.py; do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse "$D09_SOURCE:$path")"
          done
      - name: Prove byte-identical shared domain dependencies
        shell: bash
        run: |
          set -euo pipefail
          for path in acs/teaching_session.py acs/classroom_domain.py acs/remote_session.py acs/interaction_contracts.py acs/interaction_router.py acs/chesscore.py; do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse "$D09_SOURCE:$path")"
          done
          test "$(git rev-parse HEAD:acs/education_records.py)" = "6f42c311357731e0ecc812973f6cb48339fc8fc5"
          test "$(git rev-parse HEAD:acs/education_workspace.py)" = "873429ef6c155583c7952d376215b644f4e08023"
          test "$(git rev-parse HEAD:acs/education_workspace_store.py)" = "773bb02701288af6b37c07771d67ede6a627dafb"
          test "$(git rev-parse HEAD:tests/test_pgn_concurrent_save.py)" = "bcdad3d41dddbdc7530db2bf472eff0faf5c1132"
      - name: Compile integrated education tree
        run: python -m compileall -q acs tests
      - name: Live Classroom to remote checkpoint to durable reopen
        run: python -m unittest -v tests.test_education_classroom_integration
      - name: D09 live Teacher and Classroom matrix
        run: >-
          python -m unittest -v
          tests.test_teaching_reverse_channel
          tests.test_teaching_visual_board
          tests.test_teaching_classroom_adapter
          tests.test_teaching_classroom_floor_control
          tests.test_teaching_session_adapter
          tests.test_teaching_session
          tests.test_teaching_session_adversarial
          tests.test_interaction_contracts
          tests.test_interaction_router
          tests.test_classroom_domain
          tests.test_classroom_domain_corruption
      - name: D10 provenance and atomic persistence matrix
        run: >-
          python -m unittest -v
          tests.test_d10_remote_checkpoint_provenance
          tests.test_education_records
          tests.test_education_workspace
          tests.test_education_records_store
          tests.test_remote_session
          tests.test_teaching_session
      - name: Full unittest on pure integrated Product tree
        run: python -m unittest discover -s tests -v
      - name: Materialize accepted D01 UI compatibility for full pytest
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$DEV2_ACCEPTED_UI_EVIDENCE" -- acs/keybindings.py tests/test_board_rank_file_remapping_ui.py web/index.html
          test "$(git hash-object acs/keybindings.py)" = "b222f0d625999d8119cb3bb7cebffc961217f610"
          test "$(git hash-object tests/test_board_rank_file_remapping_ui.py)" = "747b6fd4f73ccfb3647f854e832e9c38421f1e3c"
          test "$(git hash-object web/index.html)" = "17803443a815843be3aa1b8c6be1c5abb7e7c888"
      - name: Full pytest with accepted cross-lane compatibility
        run: python -m pytest -q
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
