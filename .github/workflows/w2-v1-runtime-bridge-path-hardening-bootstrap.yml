name: W2 V1 Runtime Bridge Path Hardening Bootstrap

on:
  push:
    branches:
      - work/v2-data-upgrade-legacy-runtime-bridge-20260907

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v2-data-upgrade-legacy-runtime-bridge-20260907
          fetch-depth: 0
      - name: Apply fail-closed backup-name validation and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          product = Path('acs/v1_runtime_bridge.py')
          text = product.read_text(encoding='utf-8')
          old_import = '''    _library_state_sha256,\n    _safe_stat,\n'''
          new_import = '''    _library_state_sha256,\n    _portable_component,\n    _safe_stat,\n'''
          if old_import not in text:
              raise SystemExit('expected Product import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_binding = '''        backup_name = record.get("backup_name")\n        if not isinstance(backup_name, str) or not backup_name:\n            raise V1RuntimeBridgeError(f"{label} is invalid")\n        backup = self.layout.backup_root / backup_name\n'''
          new_binding = '''        bridge_id = record.get("bridge_id")\n        backup_name = record.get("backup_name")\n        if (\n            not isinstance(bridge_id, str)\n            or not bridge_id\n            or not isinstance(backup_name, str)\n            or not backup_name\n        ):\n            raise V1RuntimeBridgeError(f"{label} is invalid")\n        try:\n            _portable_component(backup_name, "V1 runtime bridge backup name")\n        except ValueError as exc:\n            raise V1RuntimeBridgeError(f"{label} is invalid") from exc\n        if backup_name != f"{bridge_id}-legacy-runtime":\n            raise V1RuntimeBridgeError(\n                "V1 runtime bridge backup identity is invalid"\n            )\n        backup = self.layout.backup_root / backup_name\n'''
          if old_binding not in text:
              raise SystemExit('expected Product manifest-binding anchor not found')
          text = text.replace(old_binding, new_binding, 1)
          product.write_text(text, encoding='utf-8')

          tests = Path('tests/test_v1_runtime_bridge.py')
          test_text = tests.read_text(encoding='utf-8')
          old_imports = '''from pathlib import Path\nimport sqlite3\nimport tempfile\n'''
          new_imports = '''from pathlib import Path\nimport shutil\nimport sqlite3\nimport tempfile\n'''
          if old_imports not in test_text:
              raise SystemExit('expected test import anchor not found')
          test_text = test_text.replace(old_imports, new_imports, 1)

          marker = '''    def test_corrupt_duplicate_key_journal_fails_closed(self) -> None:\n'''
          regression = '''    def test_journal_backup_name_cannot_escape_backup_root(self) -> None:\n        with tempfile.TemporaryDirectory() as td:\n            root = Path(td)\n            executable, _legacy, layout = self._fixture(root)\n\n            def crash(phase: str) -> None:\n                if phase == "prepared":\n                    raise RuntimeError("simulated interruption after durable prepare")\n\n            with self.assertRaises(RuntimeError):\n                V1RuntimeBridgeCoordinator(\n                    layout, executable, phase_hook=crash\n                ).run()\n\n            journal_path = layout.backup_root / ".v1-runtime-bridge-state.json"\n            journal = json.loads(journal_path.read_text(encoding="utf-8"))\n            original_backup = layout.backup_root / str(journal["backup_name"])\n            outside_backup = layout.backup_root.parent / "outside-backup-root"\n            shutil.copytree(original_backup, outside_backup)\n\n            tampered_name = "../outside-backup-root"\n            journal["backup_name"] = tampered_name\n            journal_path.write_text(\n                json.dumps(journal, ensure_ascii=False, sort_keys=True) + "\\n",\n                encoding="utf-8",\n            )\n            manifest_path = outside_backup / "manifest.json"\n            manifest = json.loads(manifest_path.read_text(encoding="utf-8"))\n            manifest["backup_name"] = tampered_name\n            manifest_path.write_text(\n                json.dumps(manifest, ensure_ascii=False, sort_keys=True) + "\\n",\n                encoding="utf-8",\n            )\n\n            with self.assertRaises(V1RuntimeBridgeError):\n                V1RuntimeBridgeCoordinator(layout, executable).run()\n\n            self.assertFalse(layout.settings_path.exists())\n            self.assertFalse(layout.library_path.exists())\n\n'''
          if marker not in test_text:
              raise SystemExit('expected test insertion anchor not found')
          if 'test_journal_backup_name_cannot_escape_backup_root' in test_text:
              raise SystemExit('regression already present')
          test_text = test_text.replace(marker, regression + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY

          python -m compileall -q acs/v1_runtime_bridge.py tests/test_v1_runtime_bridge.py
          python -m unittest -v tests.test_v1_runtime_bridge
          rm .github/workflows/w2-v1-runtime-bridge-path-hardening-bootstrap.yml
          git diff --check
          git status --short
          git config user.name "accessible-chess-w2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add acs/v1_runtime_bridge.py tests/test_v1_runtime_bridge.py .github/workflows/w2-v1-runtime-bridge-path-hardening-bootstrap.yml
          git commit -m "fix(w2): constrain V1 bridge backup recovery path"
          git push origin HEAD:work/v2-data-upgrade-legacy-runtime-bridge-20260907
