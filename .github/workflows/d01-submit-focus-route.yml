name: D01 Packaged Submit Focus Repair

on:
  pull_request:
    paths:
      - 'web/stage1_submit_focus_route.js'
      - 'acs/stage1_release_ui.py'
      - 'tests/test_d01_submit_focus_route_contract.py'
      - '.github/workflows/d01-submit-focus-route.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: D01 focus route — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Parse release JavaScript
        run: |
          node --check web/stage1_release_bootstrap.js
          node --check web/stage1_submit_focus_route.js
          node --check web/stage1_board_actions.js
      - name: Focus and release contracts
        run: >-
          python -m unittest -v
          tests.test_d01_submit_focus_route_contract
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_issue22_release_contract
          tests.test_stage1_release_composition_ui
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_native_menu_action_routing
      - name: Full unittest regression
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Full pytest regression
        run: python -m pytest -q
      - name: Canonical SELFTEST
        run: python -m acs.selftest
      - name: Complete WebView2 diagnostic
        run: python run_accessible_chess.py --diagnostic
