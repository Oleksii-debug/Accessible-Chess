name: Runtime Version Authority

on:
  push:
    branches:
      - fix/current-version-authority-20260926
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'VERSION.txt'
      - 'acs/version.py'
      - 'acs/__init__.py'
      - 'acs/webapp.py'
      - 'tests/test_version_metadata.py'
      - '.github/workflows/runtime-version-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-version-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CLAIMED_PRODUCT_SHA: e61b570761207ecd1db0322bfc80c3e302b63e2f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current ancestry and bounded ownership
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            upstream="$PR_BASE_SHA"
          else
            upstream="$CLAIMED_PRODUCT_SHA"
          fi
          test -n "$upstream"
          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD

          changed="$(git diff --name-only "$upstream" HEAD | sort)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/runtime-version-authority.yml|acs/version.py|acs/__init__.py|acs/webapp.py|tests/test_version_metadata.py)
                ;;
              *)
                echo "Unexpected path outside runtime-version ownership: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

          if [ "${{ github.head_ref || github.ref_name }}" = "fix/current-version-authority-20260926" ]; then
            expected="$(printf '%s\n' \
              '.github/workflows/runtime-version-authority.yml' \
              'acs/__init__.py' \
              'acs/version.py' \
              'acs/webapp.py' \
              'tests/test_version_metadata.py' | sort)"
            test "$changed" = "$expected"
          fi

          git diff --quiet "$upstream" HEAD -- \
            VERSION.txt \
            run_accessible_chess.py \
            acs/version2_package_assembler.py \
            acs/version2_package_preflight.py \
            acs/version2_release_payload.py \
            acs/stage1_release_ui.py \
            web/index.html

      - name: Compile version and WebView runtime
        run: >-
          python -m compileall -q
          acs/version.py
          acs/__init__.py
          acs/webapp.py
          tests/test_version_metadata.py

      - name: Version authority and architecture contracts
        run: >-
          python -m unittest -v
          tests.test_version_metadata
          tests.test_architecture
          tests.test_ui_analysis_webapp
          tests.test_core_release_contracts

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
