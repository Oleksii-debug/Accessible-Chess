name: V2 Upgrade Lock Continuity

on:
  push:
    branches:
      - fix/v2-upgrade-lock-continuity-20261004
  pull_request:
    branches:
      - fix/settings-save-lock-and-temp-identity-20261004
    paths:
      - 'acs/version2_upgrade_base.py'
      - 'tests/test_v2_upgrade_tracked_writer_conflict.py'
      - '.github/workflows/v2-upgrade-lock-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-upgrade-lock-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and lock-continuity scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='e71ca27f7fb5333152285c6748ebdba72c8ca211'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/settings-save-lock-and-temp-identity-20261004'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/v2-upgrade-lock-continuity.yml'             'acs/version2_upgrade_base.py'             'tests/test_v2_upgrade_tracked_writer_conflict.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/version2_upgrade_base.py)" = "96af79b1e5e140ee43f9eb679afc0d379efb53be"
          test "$(git rev-parse HEAD:tests/test_v2_upgrade_tracked_writer_conflict.py)" = "863628c1033677631092302ac4b0da818de83dbd"

          echo 'V2_UPGRADE_LOCK_CONTINUITY_SCOPE=PASS'

      - name: Compile lock-continuity surfaces
        run: >-
          python -m compileall -q
          acs/version2_upgrade_base.py
          tests/test_v2_upgrade_tracked_writer_conflict.py

      - name: Lock continuity and tracked-writer regressions
        run: >-
          python -m unittest -v
          tests.test_v2_upgrade_tracked_writer_conflict
          tests.test_settings
          tests.test_v2_upgrade_publish_race_audit
          tests.test_v2_upgrade_generated_artifact_authentication

      - name: Upgrade integration regressions
        run: >-
          python -m unittest -v
          tests.test_v2_data_upgrade
          tests.test_v2_data_upgrade_v6

      - name: Core selftest
        run: python -m acs.selftest
