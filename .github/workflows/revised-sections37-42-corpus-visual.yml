          tests.test_revised_section37_advanced_annotated_game_corpus
          tests.test_revised_section37_bilingual_advanced_formats
          tests.test_revised_section37_bilingual_in_application
          tests.test_revised_section37_owner_readable_only
          tests.test_revised_section38_real_advanced_source_crossroute
          tests.test_revised_section37_uk_en_reference_matrix
          tests.test_revised_section37_genuine_advanced_study_readback
          tests.test_revised_section37_cbh_original_family_inventory
          tests.test_revised_sections41_42_design
          tests.test_section15_visual_board_contract
      - name: Materialize original Stockfish CC0 games into canonical owner-test Library seed
        run: python -m tools.revised_section38_stockfish_owner_seed
      - name: Preserve actual test-only Library seed and real-source checksum receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section38-owner-test-library-seed-${{ matrix.os }}
          path: _section38_owner_seed_ci/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build exact-checkout offline corpus manifest with real semantic results
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.revised_sections37_38_offline_manifest
      - name: Preserve Windows and Linux offline source/readback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section37-38-offline-manifest-${{ matrix.os }}
          path: revised-sections37-38-offline-manifest.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Test current-plan Section 39 actual-format and false-PASS qualification
        run: python -m unittest -v tests.test_section39_real_format_qualification
      - name: Produce exact-checkout real-file qualification receipt (NOT Section DONE)
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.section39_real_format_qualification
      - name: Test newly added Section 37 genuine 2200+ annotated chess games and negative provenance
        run: |
          python -m py_compile tools/section39_new_section37_annotated_pgn_qualification.py tests/test_section39_new_section37_annotated_pgn_qualification.py
          python -m unittest -v tests.test_section39_new_section37_annotated_pgn_qualification
      - name: Generate exact-source four-game NAG/RAV/ACSDB search and restart proof
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.section39_new_section37_annotated_pgn_qualification
      - name: Verify newly acquired Section 37 advanced/endgame CC0 originals and bilingual chessboard
        run: |
          python -m py_compile tools/section39_real_section37_advanced_training_qualification.py tests/test_section39_real_section37_advanced_training_qualification.py
          python -m unittest -v tests.test_section39_real_section37_advanced_training_qualification
      - name: Original 2200+ and 3000-3166 Source37 puzzle semantics into Section 39 evidence
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.section39_real_section37_advanced_training_qualification
      - name: Original source-bound Stockfish Chess960/FRC EPD records and negative provenance
        run: |
          python -m py_compile tools/section39_stockfish_original_chess960_epd_qualification.py tests/test_section39_stockfish_original_chess960_epd_qualification.py
          python -m unittest -v tests.test_section39_stockfish_original_chess960_epd_qualification
      - name: Prove every original Chess960/FRC record against canonical EPD/FEN adapters
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.section39_stockfish_original_chess960_epd_qualification
      - name: Real Réti 1921 authored composed endgame study SAN/UK+EN comments/Library replay
        run: |
          python -m py_compile tools/section39_reti_historical_bilingual_study.py tests/test_section39_reti_historical_bilingual_study.py
          python -m unittest -v tests.test_section39_reti_historical_bilingual_study
      - name: Exact-HEAD receipt for historical Réti original study, not a Lichess puzzle
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.section39_reti_historical_bilingual_study
      - name: Test actual source-bound Capablanca chess prose imported into DOCX Books and restart
        run: |
          python -m py_compile tools/section39_real_chess_docx_interoperability.py tests/test_section39_real_chess_docx_interoperability.py
          python -m unittest -v tests.test_section39_real_chess_docx_interoperability
      - name: Record generated-docx-versus-genuine-original source truth and exact SHA
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.section39_real_chess_docx_interoperability
      - name: Qualify all Section37 authentic-puzzle-derived bilingual books as actual native files
        run: |
          python -m py_compile tools/section39_section37_bilingual_workbook_qualification.py tests/test_section39_section37_bilingual_workbook_qualification.py
          python -m unittest -v tests.test_section39_section37_bilingual_workbook_qualification
      - name: Evidence for ten UK/EN source-derived EPUB3 HTML Markdown DOCX TXT Books imports
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.section39_section37_bilingual_workbook_qualification
      - name: Production Books bilingual source37 native menu keyboard Board Training restart contract
        run: |
          python -m py_compile acs/section40_bilingual_master_workbook_runtime.py tests/test_section40_bilingual_master_workbook_product.py
          python -m unittest -v tests.test_section40_bilingual_master_workbook_product
      - name: Preserve actual per-format readback and known unsupported coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section39-real-format-qualification-${{ matrix.os }}
          path: |
            section39-real-format-qualification.json
            section39-new-section37-annotated-pgn-qualification.json
            section39-new-section37-training-position-semantic-evidence.json
            section39-stockfish-chess960-epd-qualification.json
            section39-historic-reti-study-bilingual-source-readback.json
            section39-original-chess-derived-docx-qualification.json
            section39-section37-bilingual-ten-native-books-qualification.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Exercise canonical chess core
        run: python -m acs.selftest

  live-lawful-5000:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Pin real-source decompression dependency
        run: python -m pip install 'zstandard==0.25.0'
      - name: Refuse stale PASS reports after failed live source attempts (offline negative regression)
        run: python -m unittest -v tests.test_revised_section37_live_report_safety
      - name: Actually fetch SHA256-verified CC0 Lichess file and import 5000 real games
        run: python -m tools.v2_library_source_catalog_real_corpus
      - name: Acquire four official SHA-pinned CC0 corpora and parse real samples
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.revised_section37_real_cc0_readback
      - name: Preserve non-private exact corpus qualification facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-section38-39-real-corpus-evidence
          path: |
            source-catalog-real-evidence.json
            revised-section37-live-cc0-readback.json
          if-no-files-found: ignore
          retention-days: 14

  real-cbh-gpl-upstream-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Checkout original pinned GPL licensed external decoder and legal CBH fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1
      - name: Assert immutable source identities and genuine complete fixture families
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C upstream/libcbh rev-parse HEAD)" = "$LIBCBH_COMMIT"
          test -s upstream/libcbh/gtest/Annotation/TestBase.cbh
          test -s upstream/libcbh/gtest/Annotation/TestBaseExport.pgn
          test -s upstream/libcbh/gtest/WithVariations/WithVariations.cbh
          test -s upstream/libcbh/gtest/WithVariations/GamesWithVariations.pgn
          test -s upstream/libcbh/gtest/UnusualStart/UnusualStartBytes.cbh
          test -s upstream/libcbh/gtest/UnusualStart/UnusualStart.pgn
          sha256sum upstream/libcbh/gtest/Annotation/TestBase.cbh upstream/libcbh/gtest/Annotation/TestBaseExport.pgn upstream/libcbh/gtest/WithVariations/WithVariations.cbh upstream/libcbh/gtest/WithVariations/GamesWithVariations.pgn upstream/libcbh/gtest/UnusualStart/UnusualStartBytes.cbh upstream/libcbh/gtest/UnusualStart/UnusualStart.pgn
      - name: Python 3.12 for canonical source
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Inspect genuine complete multi-file ChessBase source and independent PGN oracles (source-only Section 37)
        working-directory: product
        env:
          ACS_37_LIBCBH_ORIGINAL_SOURCE_ROOT: ${{ github.workspace }}/upstream/libcbh
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest -v tests.test_revised_section37_cbh_original_family_inventory
          python -m tools.revised_section37_cbh_original_family_inventory
      - name: Preserve safe source-only complete CBH companion and GPL receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revised-section37-original-cbh-companions
          path: product/revised-section37-original-cbh-companion-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build pinned GPL decoder externally without packaging it
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge
      - name: Execute real CBH annotations, nested RAV, NAG, ACSDB search, export and restart oracles
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_ANNOTATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/Annotation
          LIBCBH_VARIATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
          LIBCBH_UNUSUAL_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/UnusualStart
        run: |
          python -m py_compile tests/test_revised_section38_real_cbh_oracles.py
          python -m unittest -v tests.test_revised_section38_real_cbh_oracles
      - name: Existing canonical ChessBase decoder/integrity regressions
        working-directory: product
        run: >-
          python -m unittest -v
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_chessbase_libcbh_external_fixture

      - name: Repeat genuine CBH annotation/NAG/RAV/ACSDB restart oracles and preserve SHA receipts
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_ANNOTATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/Annotation
          LIBCBH_VARIATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
          LIBCBH_UNUSUAL_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/UnusualStart
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m py_compile tools/section39_real_cbh_oracle_receipt.py tests/test_section39_real_cbh_oracle_receipt.py
          python -m unittest -v tests.test_section39_real_cbh_oracle_receipt
          python -m tools.section39_real_cbh_oracle_receipt
      - name: Preserve Section 39 genuine original eleven-component CBH family hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section39-genuine-cbh-real-oracle
          path: product/section39-genuine-cbh-annotation-variation-semantic.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Erase GPL decoder binaries and source-only CBH fixtures
        if: always()
        shell: bash
        run: |
          rm -rf -- upstream/libcbh product/build/libcbh
          test ! -e upstream/libcbh
          test ! -e product/build/libcbh

  original-books-test-only-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact product source
