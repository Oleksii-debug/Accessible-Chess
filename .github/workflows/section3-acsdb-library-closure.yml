name: Section 3 ACSDB Library Closure

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section3-acsdb-library-${{ github.ref }}
  cancel-in-progress: true

env:
  SECTION2_PREDECESSOR_SHA: 706e54da9ef157d84b08ea9e1037e0c7a6751db2

jobs:
  whole-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove accepted predecessor and evidence-only Section 3 delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SECTION2_PREDECESSOR_SHA" HEAD)" = "$SECTION2_PREDECESSOR_SHA"
          git diff --check "$SECTION2_PREDECESSOR_SHA"...HEAD
          changed="$(git diff --name-only "$SECTION2_PREDECESSOR_SHA"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/section3-acsdb-library-closure.yml' 'docs/automation/SECTION3_CLOSURE_AUDIT.md' | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Compile Section 3 data contract
        run: >-
          python -m py_compile
          acs/acsdb.py
          acs/search_policy.py
          acs/search_service.py
          acs/duplicate_detection.py
          acs/library_import_service.py
          acs/library_export_service.py
          acs/library_source_service.py
          acs/import_history_service.py
          acs/import_registry.py
          acs/legacy_library_migration.py

      - name: Execute ACSDB Library Search migration import export contract
        run: >-
          python -m unittest -v
          tests.test_acsdb
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_search_service_v4
          tests.test_v2_library_player_identity_search
          tests.test_v2_library_date_filter_v5
          tests.test_library_date_filter_journey
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence
          tests.test_d07_library_search_cancellation
          tests.test_search_service
          tests.test_search_policy_result_filter
          tests.test_search_policy_resource_bounds
          tests.test_dev3_search_resource_bounds
          tests.test_duplicate_detection
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_import_reuse_final_cancel
          tests.test_d07_library_import_exact_source_order
          tests.test_d07_library_export_service
          tests.test_d07_library_export_reachability
          tests.test_v2_windows_library_export
          tests.test_d07_acsdb_migration_atomicity
          tests.test_v2_library_integrity_repair
          tests.test_v2_library_source_catalog
          tests.test_import_history_service
          tests.test_import_registry
          tests.test_v2_pgn_semantic_fidelity

      - name: Core chess selftest
        run: python -m acs.selftest

  large-library-stress:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install qualified corpus decompressor
        run: python -m pip install -q zstandard==0.23.0

      - name: Prove Section 3 product tree is inherited unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SECTION2_PREDECESSOR_SHA" HEAD)" = "$SECTION2_PREDECESSOR_SHA"
          test -z "$(git diff --name-only "$SECTION2_PREDECESSOR_SHA"...HEAD -- acs tests tools web)"

      - name: Indexed ACSDB 100k search performance
        run: python -m tools.v2_library_acsdb_search_v4_benchmark --games 100000

      - name: Lawful real CC0 5k Library source journey
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/v2_library_source_catalog_real_corpus.py

      - name: Core chess selftest after database stress
        run: python -m acs.selftest
