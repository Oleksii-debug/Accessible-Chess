name: V2 Release Native Event Schema

on:
  push:
    branches:
      - fix/v2-release-native-event-schema-20261004
  pull_request:
    branches:
      - fix/v2-release-navigation-schema-focus-20261003
    paths:
      - 'web/version2_release_bootstrap.js'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - '.github/workflows/v2-release-native-event-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-release-native-event-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and native-event scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='eb23bdc5ea0e2914a7f742697b20d32edd78a950'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/v2-release-navigation-schema-focus-20261003'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/v2-release-native-event-schema.yml'             'tests/js/version2_release_bootstrap_dom_test.js'             'web/version2_release_bootstrap.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = "f17a9a19b1f33260459df8dfa66907aa15998093"
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = "619a8dc59ebc2d39638ff0bcedfb0abd1fb5ba02"

          echo 'V2_RELEASE_NATIVE_EVENT_SCHEMA_SCOPE=PASS'

      - name: Validate release bootstrap JavaScript
        run: |
          node --check web/version2_release_bootstrap.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Adjacent release and focus regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_accessibility_contract
          tests.test_version2_book_board_refresh_focus_order_evidence
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
