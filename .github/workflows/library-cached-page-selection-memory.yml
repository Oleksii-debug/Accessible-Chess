name: Library Cached Page Selection Memory

on:
  pull_request:
    branches:
      - 'fix/library-page-sequence-integrity-20261003'
    paths:
      - 'acs/full_product_presenters.py'
      - 'tests/test_library_cached_page_selection_memory.py'
      - '.github/workflows/library-cached-page-selection-memory.yml'

permissions:
  contents: read

concurrency:
  group: library-cached-page-selection-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cached-selection:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='fix/library-page-sequence-integrity-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-cached-page-selection-memory.yml' \
            'acs/full_product_presenters.py' \
            'tests/test_library_cached_page_selection_memory.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/full_product_presenters.py)" = "27edc4ea2588fbb088ec1fbcf98baf8ec1e618fe"
          test "$(git rev-parse HEAD:tests/test_library_cached_page_selection_memory.py)" = "5baec8c81026681226827eb9fd48e00b26b7bcf0"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile cached Library selection boundary
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          tests/test_library_cached_page_selection_memory.py

      - name: Prove cached selection memory and retained Library transactions
        run: >-
          python -m unittest -v
          tests.test_library_cached_page_selection_memory
          tests.test_library_page_sequence_integrity
          tests.test_library_projection_transaction_atomicity
          tests.test_library_pagination_atomicity
          tests.test_dev1_library_webview_projection
