name: V2 Library Legacy Schema0 Migration

on:
  push:
    branches:
      - work/v2-library-legacy-schema0-migration-20260831
  pull_request:
    paths:
      - 'acs/legacy_library_migration.py'
      - 'tests/test_v2_library_legacy_schema0_migration.py'
      - 'tools/v2_library_legacy_schema0_real_corpus.py'
      - '.github/workflows/v2-library-legacy-schema0-migration.yml'

permissions:
  contents: read

concurrency:
  group: v2-library-legacy-schema0-${{ github.ref }}
  cancel-in-progress: true

env:
  CHILD_BASE: 5b68baf4c1f32a992f46067b8da120e4d1168294

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Normalize worktree to canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "$(git rev-parse HEAD:acs/stage1_release_ui_core.py)"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "$(git rev-parse HEAD:acs/webapp_keymap_core.py)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Ownership ancestry and exact child diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CHILD_BASE" HEAD
          test "$(git merge-base "$CHILD_BASE" HEAD)" = "$CHILD_BASE"
          git diff --check "$CHILD_BASE" HEAD
          changed="$(git diff --name-only "$CHILD_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-library-legacy-schema0-migration.yml' \
            'acs/legacy_library_migration.py' \
            'tests/test_v2_library_legacy_schema0_migration.py' \
            'tools/v2_library_legacy_schema0_real_corpus.py' | sort)"
          test "$changed" = "$expected"
          if printf '%s\n' "$changed" | grep -E 'teacher|classroom|education|chessbase_decoder|gametree.py|pgn_document|pgn_service|pgn_workspace|acsdb.py|search_service.py'; then
            echo 'Out-of-lane, parser/core, schema-owner, or sibling-Search contamination detected' >&2
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q acs tests tools run_accessible_chess.py
      - name: Focused legacy migration and inherited D07 regressions
        run: >-
          python -m unittest -v
          tests.test_v2_library_legacy_schema0_migration
          tests.test_v2_library_dedup_provenance
          tests.test_v2_library_integrity_repair
          tests.test_v2_library_date_filter_v5
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_search_service_v4
          tests.test_acsdb
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_search_cancellation
          tests.test_windows_data_release_regressions
      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee full-unittest.log
      - name: Upload full unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-library-legacy-schema0-full-unittest-${{ matrix.os }}
          path: full-unittest.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

  real-lichess-legacy-5k:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real-corpus dependency
        run: python -m pip install -q zstandard==0.23.0
      - name: Pinned CC0 5k -> exact legacy shape -> current ACSDB -> Search -> reopen -> integrity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/v2_library_legacy_schema0_real_corpus.py
      - name: Upload evidence summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-library-legacy-schema0-real-5k-evidence
          path: legacy-schema0-real-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: No external corpus or optional backend payload retained
        shell: bash
        run: |
          set -euo pipefail
          test ! -e lichess.pgn.zst
          test ! -e lichess-first-5000.pgn
          test ! -e legacy-library.db
          test ! -e library.acsdb
          test ! -e libcbh-json-bridge
          test ! -e libcbh.so
          test ! -e uncbv
