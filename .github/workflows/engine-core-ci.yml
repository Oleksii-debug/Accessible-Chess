name: Engine Core CI

on:
  push:
    branches:
      - dev/stage1-engine-core-0.4.0
    paths:
      - 'acs/**'
      - 'tests/test_history.py'
      - 'tests/test_analysis_service.py'
      - 'tests/test_keybindings.py'
      - 'tests/test_notation.py'
      - 'tests/test_engine_play_service.py'
      - 'tests/test_engine_registry.py'
      - 'tests/test_clock_service.py'
      - 'tests/test_game_lifecycle.py'
      - 'tests/test_board_service.py'
      - 'tests/test_entitlements.py'
      - 'tests/test_position_editor.py'
      - 'tests/test_move_entry.py'
      - 'tests/test_sound_events.py'
      - 'tests/test_architecture.py'
      - 'build_snapshot_exact/**'
      - 'build_parts10k/**'
      - '.github/workflows/engine-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct verified Stage 1 functional baseline
        shell: bash
        run: |
          set -euo pipefail
          ordered=(
            build_snapshot_exact/group00.b64
            build_snapshot_exact/group01.b64
            build_parts10k/part04.b64
            build_parts10k/part05.b64
            build_parts10k/part06.b64
            build_parts10k/part07.b64
          )
          for file in "${ordered[@]}"; do
            test -f "$file" || { echo "Missing source chunk: $file" >&2; exit 1; }
          done
          cat "${ordered[@]}" | tr -cd 'A-Za-z0-9+/=\n' | tr -d '\n' > "$RUNNER_TEMP/stage1.b64"
          length="$(wc -c < "$RUNNER_TEMP/stage1.b64")"
          test "$length" -eq 77128 || { echo "Unexpected Base64 length: $length" >&2; exit 1; }
          base64 --decode "$RUNNER_TEMP/stage1.b64" > "$RUNNER_TEMP/stage1_source.zip"
          size="$(wc -c < "$RUNNER_TEMP/stage1_source.zip")"
          test "$size" -eq 57844 || { echo "Unexpected source ZIP size: $size" >&2; exit 1; }
          hash="$(sha256sum "$RUNNER_TEMP/stage1_source.zip" | awk '{print $1}')"
          test "$hash" = 'cb0a89778b436cdf44c42e3207ef9638160a992b372156bc4d901391717a1e6a' || { echo "Source ZIP hash mismatch: $hash" >&2; exit 1; }
          rm -rf work
          mkdir work
          unzip -q "$RUNNER_TEMP/stage1_source.zip" -d work

      - name: Overlay current engine/core modules and tests
        shell: bash
        run: |
          set -euo pipefail
          cp acs/history.py work/acs/history.py
          cp acs/analysis_service.py work/acs/analysis_service.py
          cp acs/keybindings.py work/acs/keybindings.py
          cp acs/notation.py work/acs/notation.py
          cp acs/engine_ports.py work/acs/engine_ports.py
          cp acs/engine_registry.py work/acs/engine_registry.py
          cp acs/engine_play_service.py work/acs/engine_play_service.py
          cp acs/clock_service.py work/acs/clock_service.py
          cp acs/game_lifecycle.py work/acs/game_lifecycle.py
          cp acs/board_service.py work/acs/board_service.py
          cp acs/entitlements.py work/acs/entitlements.py
          cp acs/position_editor.py work/acs/position_editor.py
          cp acs/move_entry.py work/acs/move_entry.py
          cp acs/sound_events.py work/acs/sound_events.py
          cp tests/test_history.py work/tests/test_history.py
          cp tests/test_analysis_service.py work/tests/test_analysis_service.py
          cp tests/test_keybindings.py work/tests/test_keybindings.py
          cp tests/test_notation.py work/tests/test_notation.py
          cp tests/test_engine_play_service.py work/tests/test_engine_play_service.py
          cp tests/test_engine_registry.py work/tests/test_engine_registry.py
          cp tests/test_clock_service.py work/tests/test_clock_service.py
          cp tests/test_game_lifecycle.py work/tests/test_game_lifecycle.py
          cp tests/test_board_service.py work/tests/test_board_service.py
          cp tests/test_entitlements.py work/tests/test_entitlements.py
          cp tests/test_position_editor.py work/tests/test_position_editor.py
          cp tests/test_move_entry.py work/tests/test_move_entry.py
          cp tests/test_sound_events.py work/tests/test_sound_events.py
          cp tests/test_architecture.py work/tests/test_architecture.py

      - name: Compile core modules
        working-directory: work
        run: python -m compileall -q acs tests

      - name: Architecture dependency gate
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_architecture.py' -v

      - name: Keybinding registry tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_keybindings.py' -v

      - name: Move-entry intent routing tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_move_entry.py' -v

      - name: Non-destructive history tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_history.py' -v

      - name: Shared notation formatter tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_notation.py' -v

      - name: Engine provider/play policy tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_engine_play_service.py' -v

      - name: Engine provider registry contract tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_engine_registry.py' -v

      - name: Game clock and increment tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_clock_service.py' -v

      - name: Game lifecycle draw/resign/takeback/result tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_game_lifecycle.py' -v

      - name: Accessible board command service tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_board_service.py' -v

      - name: Entitlement and feature-gate tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_entitlements.py' -v

      - name: FEN position editor contract tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_position_editor.py' -v

      - name: Semantic chess sound event tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_sound_events.py' -v

      - name: Stale-safe analysis service tests
        working-directory: work
        run: python -m unittest discover -s tests -p 'test_analysis_service.py' -v

      - name: Chess legal-move and special-rule diagnostic
        working-directory: work
        shell: bash
        run: |
          python - <<'PY'
          from acs.chesscore import Board

          board = Board()
          assert len(board.legal_moves()) == 20, 'initial position must have 20 legal moves'
          for san in ('e4', 'e5', 'Nf3', 'Nc6'):
              board.push_text(san)
          assert board.turn == 'w'
          Board(board.fen())

          board = Board()
          board.push_text('e4')
          board.push_text('d5')
          assert board.push_text('exd5') == 'exd5'

          promotion = Board('4k3/P7/8/8/8/8/8/4K3 w - - 0 1')
          assert promotion.push_text('a8=Q+') == 'a8=Q+'
          print('CHESS CORE DIAGNOSTIC PASS')
          PY

      - name: Stage 1 core selftest
        working-directory: work
        run: python -m acs.selftest
