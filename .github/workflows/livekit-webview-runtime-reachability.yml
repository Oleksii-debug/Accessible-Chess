name: LiveKit WebView Runtime Reachability

on:
  pull_request:
    branches:
      - feature/livekit-client-sdk-package-20261002
    paths:
      - 'acs/version2_livekit_release.py'
      - 'tests/test_version2_livekit_release.py'
      - '.github/workflows/livekit-webview-runtime-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livekit-webview-runtime-reachability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-reachability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove bounded stacked ownership
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/livekit-client-sdk-package-20261002"
          git cat-file -e "$EVENT_BASE_SHA^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$base"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          expected="$(printf '%s\n'             '.github/workflows/livekit-webview-runtime-reachability.yml'             'acs/version2_livekit_release.py'             'tests/test_version2_livekit_release.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$base...HEAD" --             acs/chesscore.py             acs/classroom_domain.py             acs/classroom_realtime_media.py             acs/version2_education_mutation_release.py             acs/version2_upgrade_status_release.py             web/livekit_classroom_media.js             scripts/stage_livekit_client_sdk.py

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile release seam
        run: >-
          python -m py_compile
          acs/version2_livekit_release.py
          tests/test_version2_livekit_release.py

      - name: Run dependency-free release seam regressions
        run: >-
          python -m unittest -v
          tests.test_version2_livekit_release
          tests.test_stage_livekit_client_sdk
          tests.test_version2_release_payload

      - name: Download and stage exact pinned LiveKit browser SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          url="$(python scripts/stage_livekit_client_sdk.py --print-tarball-url)"
          test -n "$url"
          python - "$url" <<'PY'
          import sys
          import urllib.request

          url = sys.argv[1]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Accessible-Chess-CI/1.0 livekit-runtime-reachability"},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          with open("release-inputs/livekit-client.tgz", "wb") as stream:
              stream.write(data)
          print("LIVEKIT_BROWSER_TARBALL_DOWNLOADED", len(data))
          PY
          python scripts/stage_livekit_client_sdk.py             release-inputs/livekit-client.tgz             web/vendor/livekit

      - name: Prove real final-product resource order and local-only runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from acs.version2_livekit_release import (
              LIVEKIT_ADAPTER_RESOURCE_LABEL,
              LIVEKIT_SDK_RESOURCE_LABEL,
              final_product_resource_sources,
          )

          resources = final_product_resource_sources()
          labels = [label for label, _source in resources]
          assert labels.count(LIVEKIT_SDK_RESOURCE_LABEL) == 1, labels
          assert labels.count(LIVEKIT_ADAPTER_RESOURCE_LABEL) == 1, labels
          sdk_index = labels.index(LIVEKIT_SDK_RESOURCE_LABEL)
          adapter_index = labels.index(LIVEKIT_ADAPTER_RESOURCE_LABEL)
          assert sdk_index < adapter_index, labels
          assert adapter_index == len(labels) - 1, labels
          assert sdk_index == len(labels) - 2, labels
          assert "V2 final-product bootstrap" in labels
          assert "LivekitClient" in resources[sdk_index][1]
          assert "AccessibleChessLiveKitMedia" in resources[adapter_index][1]
          print("LIVEKIT_WEBVIEW_RUNTIME_RESOURCE_ORDER=PASS")
          PY

          ! grep -Eq 'https?://|cdn|unpkg|jsdelivr' acs/version2_livekit_release.py
          grep -Fq 'LIVEKIT_SDK_RESOURCE_LABEL' acs/version2_livekit_release.py
          grep -Fq 'LIVEKIT_ADAPTER_RESOURCE_LABEL' acs/version2_livekit_release.py

      - name: Core selftest
        run: python -m acs.selftest
