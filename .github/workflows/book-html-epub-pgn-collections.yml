name: Books HTML EPUB PGN collections
on:
  pull_request:
    paths:
      - 'acs/book_html_import.py'
      - 'acs/book_epub_import.py'
      - 'acs/book_game_content.py'
      - 'acs/book_board_workflow.py'
      - 'acs/gametree*.py'
      - 'acs/pgn_roundtrip.py'
      - 'acs/bookdocument.py'
      - 'acs/bookreader.py'
      - 'acs/chesscore.py'
      - 'tests/test_book_html_pgn_loss_accounting.py'
      - 'tests/test_book_html_inline_image_order.py'
      - '.github/workflows/book-html-epub-pgn-collections.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-journey:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: HTML and EPUB collections, source preservation and exact Board return
        run: python -m unittest discover -s tests -p test_book_html_pgn_loss_accounting.py -v
      - name: Retained canonical Book Board workflow
        run: python -m unittest discover -s tests -p test_v2_book_board_workflow.py -v
      - name: Retained canonical PGN roundtrip
        run: python -m unittest discover -s tests -p test_d06_pgn_roundtrip.py -v
