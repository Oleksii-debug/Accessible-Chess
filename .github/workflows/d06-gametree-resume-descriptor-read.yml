name: D06 GameTree Resume Descriptor Read

on:
  pull_request:
    paths:
      - 'acs/gametree_resume.py'
      - 'tests/test_d06_gametree_resume_descriptor_read.py'
      - '.github/workflows/d06-gametree-resume-descriptor-read.yml'

permissions:
  contents: read

concurrency:
  group: d06-gametree-resume-descriptor-read-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CURRENT_PRODUCT_BASE: 3a00ff766ccec869a2cb761f26739fe1c85dc9ef
  RESUME_SOURCE_BLOB: fb373a97ca1d8fbcca9b250de59639c577302855
  DESCRIPTOR_TEST_BLOB: c940ad72de2a98d9f8705aca87727f4219c49b95
  SNAPSHOT_RESUME_TEST_BLOB: 87e54b3d282ba4c2288737d745d2f29f4ae7076b
  LOCK_TOCTOU_TEST_BLOB: 7bfd54c53faae2d7e2f2f31f1f5f4179782a6911
  V2_RESUME_COORDINATOR_BLOB: 585574d61de42c3f956e050b0d7acf5e19dc7942
  V2_RESUME_REACHABILITY_TEST_BLOB: 3a52ce7a15ac296b362d25e3ca470bd99497961a

jobs:
  descriptor-read:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current Product ancestry, exact scope and retained D06 authority
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_SHA" = "$CURRENT_PRODUCT_BASE"
          git cat-file -e "$CURRENT_PRODUCT_BASE^{commit}"
          git merge-base --is-ancestor "$CURRENT_PRODUCT_BASE" HEAD
          git diff --check "$CURRENT_PRODUCT_BASE" HEAD
          changed="$(git diff --name-only "$CURRENT_PRODUCT_BASE" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/d06-gametree-resume-descriptor-read.yml'             'acs/gametree_resume.py'             'tests/test_d06_gametree_resume_descriptor_read.py' | sort)"
          test "$changed" = "$expected"

          while IFS='=' read -r path expected_blob; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected_blob" || {
              echo "D06 resume authority drift: $path expected=$expected_blob actual=$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/gametree_resume.py=fb373a97ca1d8fbcca9b250de59639c577302855
          tests/test_d06_gametree_resume_descriptor_read.py=c940ad72de2a98d9f8705aca87727f4219c49b95
          tests/test_d06_gametree_snapshot_resume.py=87e54b3d282ba4c2288737d745d2f29f4ae7076b
          tests/test_w1_d06_resume_lock_toctou.py=7bfd54c53faae2d7e2f2f31f1f5f4179782a6911
          acs/version2_gametree_resume.py=585574d61de42c3f956e050b0d7acf5e19dc7942
          tests/test_d06_v2_gametree_resume_reachability.py=3a52ce7a15ac296b362d25e3ca470bd99497961a
          LOCKS

      - name: Compile persistence surface
        run: >-
          python -m py_compile
          acs/gametree_resume.py
          acs/version2_gametree_resume.py
          tests/test_d06_gametree_resume_descriptor_read.py
          tests/test_d06_gametree_snapshot_resume.py
          tests/test_w1_d06_resume_lock_toctou.py
          tests/test_d06_v2_gametree_resume_reachability.py

      - name: Focused GameTree resume persistence and release reachability
        run: >-
          python -m unittest -v
          tests.test_d06_gametree_resume_descriptor_read
          tests.test_d06_gametree_snapshot_resume
          tests.test_w1_d06_resume_lock_toctou
          tests.test_d06_v2_gametree_resume_reachability
          tests.test_version2_release_app

  broad-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q tests
      - name: SELFTEST and diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          if [ -f run_accessible_chess_v2.py ]; then python run_accessible_chess_v2.py --diagnostic; fi
