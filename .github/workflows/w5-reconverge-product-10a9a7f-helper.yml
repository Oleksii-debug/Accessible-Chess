name: W5 exact Product 10a9a7f reconvergence helper

on:
  push:
    branches:
      - work/w5-product-10a9a7f-anchor-20261003
    paths:
      - '.github/workflows/w5-reconverge-product-10a9a7f-helper.yml'

permissions:
  contents: write

jobs:
  prepare-exact-child:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout helper trigger
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: work/w5-product-10a9a7f-anchor-20261003

      - name: Prove anchor and prepare workflow-only child
        shell: bash
        env:
          ANCHOR_SHA: e80e42b1f486ae8c2fd57c368a58fd56f7abef6a
          PRODUCT_SHA: 10a9a7fcb0891f498a4a20bf4bd5cd8f16ad5017
          PREVIOUS_W5_SHA: a766331db6bce5ec5424ab739fd4a418d0cd9349
          PREVIOUS_WORKFLOW_BLOB: a6969641d41667acc81217327ba664e82b9f0732
          TARGET_BRANCH: work/w5-product-10a9a7f-anchor-20261003
        run: |
          set -euo pipefail
          git cat-file -e "$ANCHOR_SHA^{commit}"
          test "$(git rev-parse "$ANCHOR_SHA^1")" = "$PRODUCT_SHA"
          test "$(git rev-parse "$ANCHOR_SHA^2")" = "$PREVIOUS_W5_SHA"
          test "$(git rev-parse "$ANCHOR_SHA:.github/workflows/post-freeze-v2-windows-package-qualification.yml")" = "$PREVIOUS_WORKFLOW_BLOB"

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/post-freeze-v2-windows-package-qualification.yml')
          text = path.read_text(encoding='utf-8')
          replacements = (
              ('# exact-package-reconvergence: 8b546db / p0g 8b546db / p0-document 8b546db',
               '# exact-package-reconvergence: 10a9a7f / p0g 10a9a7f / p0-document 10a9a7f'),
              ('  LINEAGE_PARENT_SHA: 31fdc741cb50cb2aa255fad9c2f855432176577d',
               '  LINEAGE_PARENT_SHA: e80e42b1f486ae8c2fd57c368a58fd56f7abef6a'),
              ('  LINEAGE_PARENT_WORKFLOW_BLOB_SHA: 1259f379ca3b432f7babf112aee6174c75b3d2a7',
               '  LINEAGE_PARENT_WORKFLOW_BLOB_SHA: a6969641d41667acc81217327ba664e82b9f0732'),
              ('  AUDITED_PARENT_SHA: 5a7e1ad24397a6ef2f12d6f03ad467eca3fb0d19',
               '  AUDITED_PARENT_SHA: a766331db6bce5ec5424ab739fd4a418d0cd9349'),
              ('  PACKAGE_ANCHOR_SHA: 31fdc741cb50cb2aa255fad9c2f855432176577d',
               '  PACKAGE_ANCHOR_SHA: e80e42b1f486ae8c2fd57c368a58fd56f7abef6a'),
              ('  PRODUCT_PARENT_SHA: 8b546db07b3b539a545746e6de2eea4eca1db3b4',
               '  PRODUCT_PARENT_SHA: 10a9a7fcb0891f498a4a20bf4bd5cd8f16ad5017'),
              ('  PREVIOUS_PACKAGE_SHA: bfada5e3f4d530686478e5d19c7dabfadd124366',
               '  PREVIOUS_PACKAGE_SHA: a766331db6bce5ec5424ab739fd4a418d0cd9349'),
              ('  PREVIOUS_WORKFLOW_BLOB_SHA: 1259f379ca3b432f7babf112aee6174c75b3d2a7',
               '  PREVIOUS_WORKFLOW_BLOB_SHA: a6969641d41667acc81217327ba664e82b9f0732'),
              ('  P0G_QA_SHA: 8b546db07b3b539a545746e6de2eea4eca1db3b4',
               '  P0G_QA_SHA: 10a9a7fcb0891f498a4a20bf4bd5cd8f16ad5017'),
              ('  P0_DOCUMENT_QA_SHA: 8b546db07b3b539a545746e6de2eea4eca1db3b4',
               '  P0_DOCUMENT_QA_SHA: 10a9a7fcb0891f498a4a20bf4bd5cd8f16ad5017'),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one provenance token {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          print('W5_PROVENANCE_PATCH=PASS replacements=10')
          PY

          rm -f .github/workflows/w5-reconverge-product-10a9a7f-helper.yml
          test "$(git diff --name-only "$ANCHOR_SHA" -- | sort)" = "$(printf '%s\n' '.github/workflows/post-freeze-v2-windows-package-qualification.yml' '.github/workflows/w5-reconverge-product-10a9a7f-helper.yml' | sort)"
          git add -A
          tree="$(git write-tree)"
          git config user.name 'Accessible Chess W5 Reconvergence'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          final="$(printf '%s\n' 'W5: qualify exact Product 10a9a7f with terminal-green package lineage' | git commit-tree "$tree" -p "$ANCHOR_SHA")"
          test "$(git rev-parse "$final^1")" = "$ANCHOR_SHA"
          test "$(git diff --name-only "$PRODUCT_SHA" "$final")" = '.github/workflows/post-freeze-v2-windows-package-qualification.yml'
          git diff --check "$PRODUCT_SHA" "$final"
          git push origin "$final:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$GITHUB_SHA"
          echo "PREPARED_W5_SHA=$final"