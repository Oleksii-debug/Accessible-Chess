name: Books Training Public Render Boundary

on:
  push:
    branches:
      - fix/books-training-public-render-boundary-20261004
  pull_request:
    branches:
      - fix/v2-release-navigation-schema-focus-20261003
    paths:
      - 'web/full_product_books_training.js'
      - 'tests/js/books_training_surface_dom_test.js'
      - '.github/workflows/books-training-public-render-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-training-public-render-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact Books/NVDA parent and public-render scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='eb23bdc5ea0e2914a7f742697b20d32edd78a950'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/v2-release-navigation-schema-focus-20261003'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/books-training-public-render-boundary.yml'             'tests/js/books_training_surface_dom_test.js'             'web/full_product_books_training.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = "f6a518522bc13497c4bdba72bdb61cd4eca9ea07"
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = "367d153237642500c20a74c532059233fd2506df"

          echo 'BOOKS_TRAINING_PUBLIC_RENDER_SCOPE=PASS'

      - name: Validate Books Training JavaScript
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - name: Adjacent Books Training bridge/projection regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_bridge
          tests.test_dev1_books_training_webview_projection
          tests.test_version2_application
          tests.test_v2_book_training_route_rollback

      - name: Core selftest
        run: python -m acs.selftest
