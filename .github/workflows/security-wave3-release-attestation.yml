name: Security Wave 3 Release Attestation

on:
  workflow_call:
    inputs:
      release-artifact-name:
        required: true
        type: string
      release-artifact-filename:
        required: true
        type: string
      sbom-artifact-name:
        required: true
        type: string
      sbom-filename:
        required: true
        type: string

permissions: {}

jobs:
  attest-release:
    runs-on: ubuntu-24.04
    environment: production-signing
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Require immutable version-tag release context
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v[0-9]*.[0-9]*.[0-9]*|refs/tags/v[0-9]*.[0-9]*.[0-9]*-*) ;;
            *) echo "Release attestations require a version tag ref" >&2; exit 1 ;;
          esac

      - name: Download exact release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.release-artifact-name }}
          path: release-subject

      - name: Download exact SPDX SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.sbom-artifact-name }}
          path: release-sbom

      - name: Require direct regular release and SBOM files
        shell: bash
        run: |
          set -euo pipefail
          subject="release-subject/${{ inputs.release-artifact-filename }}"
          sbom="release-sbom/${{ inputs.sbom-filename }}"
          test -f "$subject" && test ! -L "$subject"
          test -f "$sbom" && test ! -L "$sbom"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("release-sbom")/"${{ inputs.sbom-filename }}"
          value=json.loads(p.read_text(encoding="utf-8"))
          assert value.get("spdxVersion") == "SPDX-2.3"
          PY
          sha256sum "$subject"
          sha256sum "$sbom"

      - name: Generate GitHub/Sigstore build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: release-subject/${{ inputs.release-artifact-filename }}

      - name: Generate GitHub/Sigstore SPDX SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with:
          subject-path: release-subject/${{ inputs.release-artifact-filename }}
          sbom-path: release-sbom/${{ inputs.sbom-filename }}
