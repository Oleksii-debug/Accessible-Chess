name: V2 PGN Save Export Completion

on:
  push:
    branches:
      - work/v2-dev05-pgn-save-export-completion-20260831
  pull_request:
    branches:
      - work/v2-dev05-save-export-base-20260831
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-dev05-save-export-${{ github.ref }}
  cancel-in-progress: true

env:
  DEV05_BASE: 7500e30eebbcc14ae048c7da3c42f3ef92d1c14e
  PR295: 575ec0088982d2f90adb47c040a5714d68186b0e
  PR300: dc7427cb89a0b6a997cae467f82265778ea78168
  PR370: 9f7aa94353bcaed674eabf2e5ecb7776f7062904
  REAL_CORPUS_ORACLE: d194a9c3598cf3beb2f6cc57568a7702ff5c26dd

jobs:
  save-export-completion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.4.2 zstandard==0.23.0
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install -q pythonnet==3.0.5
          fi

      - name: Prove exact dependency lineage and owner atomicity
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PR295" "$DEV05_BASE"
          git merge-base --is-ancestor "$PR300" "$DEV05_BASE"
          git merge-base --is-ancestor "$PR370" "$DEV05_BASE"
          test "$(git rev-parse "$DEV05_BASE^1")" = "$PR300"
          test "$(git rev-parse "$DEV05_BASE^2")" = "$PR370"
          git diff --check "$DEV05_BASE" HEAD

          changed="$(git diff --name-only "$DEV05_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-pgn-save-export-completion.yml' \
            'acs/full_product_actions.py' \
            'acs/library_pgn_export.py' \
            'acs/version2_windows_library_export.py' \
            'acs/version2_windows_save_export_runtime.py' \
            'tests/test_library_pgn_export.py' \
            'tests/test_v2_pgn_save_export_completion.py' \
            'tests/test_v2_windows_library_export.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/pgn_service.py)" = "9079bd16f3783886e10cad9396f08fc5458738cb"
          test "$(git rev-parse HEAD:acs/pgn_document.py)" = "ae0b7d3815c4d277b68ef3c170c95255cf5c6442"
          test "$(git rev-parse HEAD:acs/gametree.py)" = "9d70cb4c8f32fcca732b6880be9eca5cd4a3c069"
          test "$(git rev-parse HEAD:acs/acsdb.py)" = "3d7d31b4421990815a8d2f10367f6ff84e9bcd67"
          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "4caeaad34d50aeffc28f75ba37457284737a6bdd"
          test "$(git rev-parse HEAD:acs/version2_windows_host_runtime.py)" = "1f410c3d7ffeb2eaf5b583ed601c3e9dda50a1dc"
          test "$(git rev-parse HEAD:acs/version2_windows_native_dialog_ownership.py)" = "567096cc1b325ceeb8efed307af9b75556ec0251"
          test "$(git rev-parse HEAD:acs/version2_windows_pgn_export.py)" = "913a74348f1323887d9d880285814a7680869ae1"

          git diff --quiet "$DEV05_BASE" HEAD -- \
            acs/pgn_service.py \
            acs/pgn_document.py \
            acs/gametree.py \
            acs/acsdb.py \
            acs/version2_windows_file_workflows.py \
            acs/version2_windows_host_runtime.py \
            acs/version2_windows_native_dialog_ownership.py \
            acs/version2_windows_pgn_export.py \
            tests/test_v2_pgn_streaming_export.py \
            .github/workflows/d06-pgn-streaming-export.yml

      - name: Compile Product and tests
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused D06 Save Export and Windows host regressions
        run: >-
          python -m unittest -v
          tests.test_v2_pgn_save_export_completion
          tests.test_library_pgn_export
          tests.test_v2_windows_library_export
          tests.test_v2_pgn_streaming_export
          tests.test_gametree
          tests.test_game_identity
          tests.test_d06_pgn_roundtrip
          tests.test_d06_file_ingress_nag_normalization
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_pgn_service
          tests.test_pgn_concurrent_save
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_postcommit_cleanup_atomicity
          tests.test_dev4_pgn_resource_security
          tests.test_dev4_pgn_truncation_quality
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_pgn_export
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_native_dialog_ownership
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_ui_pump
          tests.test_dev1_full_product_accessible_shell
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_full_product_webview_adapter
          tests.test_acsdb
          tests.test_library_workspace_ui_integration
          tests.test_library_import_ui_integration
          tests.test_d07_library_import_service

      - name: Windows native Save dialog owner and composed host smoke
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from System.Windows.Forms import Control
          from acs.version2_windows_library_export import Version2OwnedWindowsLibraryExportDialogs
          from acs.version2_windows_save_export_runtime import Version2WindowsSaveExportRuntime

          owner = Control()
          dialogs = Version2OwnedWindowsLibraryExportDialogs(lambda: owner)
          runtime = Version2WindowsSaveExportRuntime(
              owner_control=owner,
              get_pgn_session=lambda: None,
              set_pgn_session=lambda session: None,
              import_services_factory=lambda: None,
              export_selected=lambda request, destination: None,
              import_ui_ready=lambda mailbox: None,
              pgn_export_event_sink=lambda event: None,
              library_selection_provider=lambda: (1,),
              library_export_subset=lambda ids, destination: None,
              library_export_event_sink=lambda event: None,
              next_delegate=lambda action_id, payload: None,
          )
          try:
              assert dialogs.dialog_owner.resolve() is owner
              assert runtime.library_export_dialogs.dialog_owner.resolve() is owner
              assert runtime.file_runtime.file_dialogs.dialog_owner.resolve() is owner
              assert runtime.file_runtime.export_dialogs.dialog_owner.resolve() is owner
              assert runtime.shutdown()
              assert runtime.closed
          finally:
              owner.Dispose()
          print('WINDOWS DEV05 OWNER-BOUND SAVE/EXPORT HOST PASS')
          PY

      - name: Reuse pinned lawful real-corpus Save As/reopen oracle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dev05-oracle
          git show "$REAL_CORPUS_ORACLE:scripts/pgn05_post_repair_acceptance.py" > .dev05-oracle/pgn05_post_repair_acceptance.py
          python .dev05-oracle/pgn05_post_repair_acceptance.py --selftest
          python .dev05-oracle/pgn05_post_repair_acceptance.py --games 2000
          rm -rf .dev05-oracle

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
