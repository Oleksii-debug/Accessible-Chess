name: Classroom File RPC Contract

on:
  pull_request:
    branches:
      - converge/classroom-file-server-stack-20261003
    paths:
      - ".github/workflows/classroom-file-rpc.yml"
      - "acs/classroom_file_rpc.py"
      - "tests/test_classroom_file_rpc.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-file-rpc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact authenticated RPC successor scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_BASE_REF" = "converge/classroom-file-server-stack-20261003"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}"
          git fetch --no-tags origin "$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
          LIVE_BASE_SHA="$(git rev-parse "origin/$EVENT_BASE_REF")"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$LIVE_BASE_SHA"
          git merge-base --is-ancestor "$LIVE_BASE_SHA" HEAD
          test "$(git merge-base "$LIVE_BASE_SHA" HEAD)" = "$LIVE_BASE_SHA"
          git diff --check "$LIVE_BASE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$LIVE_BASE_SHA" HEAD | LC_ALL=C sort)
          expected=(
            ".github/workflows/classroom-file-rpc.yml"
            "acs/classroom_file_rpc.py"
            "tests/test_classroom_file_rpc.py"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected authenticated file RPC successor scope.\nExpected:\n'
            printf '  %s\n' "${expected_sorted[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi
          echo 'CLASSROOM_FILE_RPC_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Compile authenticated file RPC boundary
        run: >-
          python -m py_compile
          acs/classroom_file_rpc.py
          acs/classroom_file_server.py
          tests/test_classroom_file_rpc.py
          tests/test_classroom_file_server.py
          acs/classroom_collaboration.py
          acs/classroom_collaboration_storage.py

      - name: Run file RPC, server and canonical reconciliation regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_file_rpc
          tests.test_classroom_file_server
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage

      - name: Core selftest
        run: python -m acs.selftest
