name: LiveKit Moderation Service Runtime

on:
  pull_request:
    branches:
      - feature/livekit-moderation-rpc-transport-20261002
    paths:
      - 'acs/livekit_moderation_service_runtime.py'
      - 'tests/test_livekit_moderation_service_runtime.py'
      - '.github/workflows/livekit-moderation-service-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livekit-moderation-service-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  moderation-service-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact stacked scope against current RPC transport
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/livekit-moderation-rpc-transport-20261002"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          test "$(git merge-base "$EVENT_BASE_SHA" HEAD)" = "$EVENT_BASE_SHA"
          git diff --check "$EVENT_BASE_SHA...HEAD"
          changed="$(git diff --name-only "$EVENT_BASE_SHA...HEAD" | sort)"
          allowed="$(printf '%s\n'             '.github/workflows/livekit-moderation-service-runtime.yml'             'acs/livekit_moderation_service_runtime.py'             'tests/test_livekit_moderation_service_runtime.py' | sort)"
          test "$changed" = "$allowed"
          git diff --quiet "$EVENT_BASE_SHA" HEAD --             acs/classroom_moderation_rpc.py             acs/classroom_realtime_media.py             acs/livekit_moderation_rpc_transport.py             web/livekit_classroom_media.js             acs/classroom_domain.py             acs/chesscore.py

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile runtime boundary
        run: >-
          python -m py_compile
          acs/livekit_moderation_service_runtime.py
          tests/test_livekit_moderation_service_runtime.py

      - name: Run dependency-free lifecycle and adjacent contracts
        run: >-
          python -m unittest -v
          tests.test_livekit_moderation_service_runtime
          tests.test_livekit_moderation_rpc_transport
          tests.test_classroom_moderation_rpc
          tests.test_classroom_realtime_media

      - name: Verify current official realtime SDK wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --disable-pip-version-check --no-deps             --only-binary=:all: --dest .livekit-rtc livekit==1.1.19
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          files = list(Path(".livekit-rtc").glob("*"))
          assert len(files) == 1, files
          file = files[0]
          expected = {
              "linux": (
                  "livekit-1.1.19-py3-none-manylinux_2_28_x86_64.whl",
                  "5716a5194ec3ceec19e25285149c62412e227a1fdb8fd9892411e15a1e24b700",
              ),
              "win32": (
                  "livekit-1.1.19-py3-none-win_amd64.whl",
                  "959b40e7210b302101e563bc59c75e9313dfdf7cb9589407f8d60eba9b0382b3",
              ),
          }[sys.platform]
          assert file.name == expected[0], (file.name, expected[0])
          assert sha256(file.read_bytes()).hexdigest() == expected[1]
          print("LIVEKIT_REALTIME_WHEEL_PIN=PASS", sys.platform)
          PY

      - name: Install exact LiveKit realtime SDK
        run: python -m pip install --disable-pip-version-check -q livekit==1.1.19

      - name: Prove real SDK room lifecycle schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata
          import inspect

          from livekit import rtc

          from acs.livekit_moderation_rpc_transport import LIVEKIT_RTC_VERSION
          from acs.livekit_moderation_service_runtime import (
              LiveKitModerationServiceRuntime,
          )
          from tests.test_livekit_moderation_service_runtime import (
              EchoModerationService,
          )

          assert importlib.metadata.version("livekit") == "1.1.19"
          assert LIVEKIT_RTC_VERSION == "1.1.19"
          assert callable(rtc.Room)
          assert callable(rtc.RoomOptions)
          assert callable(rtc.RpcError)
          assert callable(rtc.Room.connect)
          assert callable(rtc.Room.disconnect)
          assert callable(rtc.Room.isconnected)

          connect = inspect.signature(rtc.Room.connect)
          assert "url" in connect.parameters
          assert "token" in connect.parameters
          assert "options" in connect.parameters
          options = rtc.RoomOptions(auto_subscribe=False)
          assert options.auto_subscribe is False

          runtime = LiveKitModerationServiceRuntime(
              provider_url="wss://classroom.example.invalid",
              trusted_room_id="room-1",
              moderation_participant_identity="moderation-service",
              service=EchoModerationService(),
              rtc_module=rtc,
              sdk_version="1.1.19",
          )
          assert runtime.closed is False
          assert runtime.ready is False
          assert "token=<redacted>" in repr(runtime)
          print("LIVEKIT_REALTIME_ROOM_SCHEMA=PASS")
          PY

      - name: Prove secret and authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RoomOptions(auto_subscribe=False)' acs/livekit_moderation_service_runtime.py
          grep -Fq 'actual_room != self._room_id' acs/livekit_moderation_service_runtime.py
          grep -Fq 'actual_identity != self._identity' acs/livekit_moderation_service_runtime.py
          grep -Fq 'LiveKitModerationRpcTransport.bind' acs/livekit_moderation_service_runtime.py
          grep -Fq 'token=<redacted>' acs/livekit_moderation_service_runtime.py
          ! grep -Eq 'LIVEKIT_API_SECRET|LIVEKIT_API_KEY|AccessToken|TokenVerifier|os\.(environ|getenv)'             acs/livekit_moderation_service_runtime.py
          ! grep -Eq 'classroom_domain|chesscore|classroom_media_policy_authority'             acs/livekit_moderation_service_runtime.py

      - name: Core selftest
        run: python -m acs.selftest
