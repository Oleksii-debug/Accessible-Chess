name: V2 Markdown Semantic Lists Convergence

on:
  pull_request:
    paths:
      - 'acs/book_text_import.py'
      - 'tests/test_v2_book_text_import.py'
      - 'tests/test_v2_markdown_semantic_lists.py'
      - '.github/workflows/v2-markdown-semantic-lists-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-markdown-lists-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Restore inherited Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage1_blob="$(git rev-parse HEAD:acs/stage1_release_ui_core.py)"
          keymap_blob="$(git rev-parse HEAD:acs/webapp_keymap_core.py)"
          git cat-file blob "$stage1_blob" > acs/stage1_release_ui_core.py
          git cat-file blob "$keymap_blob" > acs/webapp_keymap_core.py
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "$stage1_blob"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "$keymap_blob"
          echo "STAGE1_WINDOWS_BYTE_REMATERIALIZATION=PASS stage1=$stage1_blob keymap=$keymap_blob"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained Markdown convergence authority and immutable PR-base hygiene
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-}"
          test -n "$base" || {
            printf 'Markdown convergence qualification requires pull_request event base SHA\n' >&2
            exit 1
          }
          git cat-file -e "${base}^{commit}"
          markdown_owner="2954b8e95f678d62bfc8f7c56ef5cf9f826e6247"
          git cat-file -e "${markdown_owner}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$markdown_owner" HEAD
          git diff --check "$base" HEAD
          source_actual="$(git rev-parse HEAD:acs/book_text_import.py)"
          importer_test_actual="$(git rev-parse HEAD:tests/test_v2_book_text_import.py)"
          semantic_list_actual="$(git rev-parse HEAD:tests/test_v2_markdown_semantic_lists.py)"
          source_owner="$(git rev-parse "$markdown_owner:acs/book_text_import.py")"
          importer_test_owner="$(git rev-parse "$markdown_owner:tests/test_v2_book_text_import.py")"
          semantic_list_owner="$(git rev-parse "$markdown_owner:tests/test_v2_markdown_semantic_lists.py")"
          successor="300fa757e447b849bc97582fe0c8a9d6cacc9418"
          successor_source="d3b410e7e2087f29a6f4d381e8a619db11060c18"
          successor_importer_test="84a601ad6a105b6813fcafa0af1ed69459e1e31b"

          test "$semantic_list_actual" = "$semantic_list_owner" || {
            printf 'Markdown semantic-list oracle drift: owner=%s actual=%s\n' "$semantic_list_owner" "$semantic_list_actual" >&2
            exit 1
          }

          if test "$source_actual" = "$source_owner" && test "$importer_test_actual" = "$importer_test_owner"; then
            authority_mode="SETTLED_OWNER"
          elif test "$source_actual" = "$successor_source" && test "$importer_test_actual" = "$successor_importer_test"; then
            git cat-file -e "${successor}^{commit}"
            git merge-base --is-ancestor "$successor" HEAD
            authority_mode="REVIEWED_MARKDOWN_TEXT_INTEGRITY_SUCCESSOR"
          else
            printf 'Markdown authority pair drift: source owner=%s successor=%s actual=%s; test owner=%s successor=%s actual=%s\n' \
              "$source_owner" "$successor_source" "$source_actual" \
              "$importer_test_owner" "$successor_importer_test" "$importer_test_actual" >&2
            exit 1
          fi

          printf 'Markdown retained authority PASS: immutable-pr-base=%s owner=%s mode=%s head=%s\n' \
            "$base" "$markdown_owner" "$authority_mode" "$(git rev-parse HEAD)"

      - name: Compile bounded Books adapter
        run: python -m py_compile acs/book_text_import.py tests/test_v2_book_text_import.py tests/test_v2_markdown_semantic_lists.py

      - name: Existing TXT and Markdown importer contracts
        run: python -m unittest -v tests.test_v2_book_text_import

      - name: Canonical semantic-list regression
        run: python -m unittest -v tests.test_v2_markdown_semantic_lists

      - name: Canonical Book core and reader regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core

      - name: Re-materialize inherited Stage1 blobs before broad byte contracts
        shell: bash
        run: |
          set -euo pipefail
          stage1_blob="$(git rev-parse HEAD:acs/stage1_release_ui_core.py)"
          keymap_blob="$(git rev-parse HEAD:acs/webapp_keymap_core.py)"
          git cat-file blob "$stage1_blob" > acs/stage1_release_ui_core.py
          git cat-file blob "$keymap_blob" > acs/webapp_keymap_core.py
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "$stage1_blob"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "$keymap_blob"

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
