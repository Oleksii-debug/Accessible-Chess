name: Books WebView Navigation Render Atomicity

on:
  pull_request:
    branches:
      - 'test/books-navigation-availability-equivalence-20261003'
    paths:
      - 'acs/full_product_presenters.py'
      - 'acs/book_webview_projection.py'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - '.github/workflows/books-webview-navigation-render-atomicity.yml'

permissions:
  contents: read

concurrency:
  group: books-webview-navigation-render-atomicity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-render-atomicity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='test/books-navigation-availability-equivalence-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/books-webview-navigation-render-atomicity.yml' \
            'acs/book_webview_projection.py' \
            'acs/full_product_presenters.py' \
            'tests/test_dev1_books_training_webview_projection.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/full_product_presenters.py)" = "805a9f52fc8fb52abcb0cbfaa0f03db6300afe98"
          test "$(git rev-parse HEAD:acs/book_webview_projection.py)" = "6b2cde2bc136e51f3a6894e742d813a980f04019"
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_projection.py)" = "ee26bceb72593094a7133381887573ae79a300b9"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Books presentation boundary
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          acs/book_webview_projection.py
          tests/test_dev1_books_training_webview_projection.py

      - name: Prove semantic cursor/render atomicity
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_projection
          tests.test_book_bidirectional_semantic_navigation
          tests.test_version2_book_workspace
