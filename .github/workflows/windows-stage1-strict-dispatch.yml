# MERGE_TRIGGER_E8CD992
name: Windows Stage 1 Strict Release Dispatch

on:
  push:
    branches:
      - qa/windows-current-integration-candidate-20260815
    paths:
      - '.github/workflows/windows-stage1-strict-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: stage1-strict-release-dispatch
  cancel-in-progress: false

env:
  TARGET_PRODUCT_SHA: e8cd992d306975955784118364ce950963133d7e

jobs:
  validate-patch-and-dispatch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/windows-current-integration-candidate-20260815
          fetch-depth: 0

      - name: Retarget strict release and add real-document startup proof
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          strict_path = Path('.github/workflows/windows-stage1-strict-release-crossprocess.yml')
          helper_path = Path('tools/qa/stage1_packaged_e2e_crossprocess.ps1')
          strict = strict_path.read_text(encoding='utf-8')
          helper = helper_path.read_text(encoding='utf-8')

          old_sha = '9684b06e9821d9588944f1182744a1c72623b355'
          new_sha = 'e8cd992d306975955784118364ce950963133d7e'
          if new_sha not in strict:
              if strict.count(old_sha) != 1:
                  raise SystemExit(f'Expected exactly one old strict source SHA, found {strict.count(old_sha)}')
              strict = strict.replace(old_sha, new_sha)

          if 'e8cd992-NVDA-test-candidate' not in strict:
              short_count = strict.count('9684b06-NVDA-test-candidate')
              if short_count < 3:
                  raise SystemExit(f'Expected candidate short SHA in env/artifact/path, found {short_count}')
              strict = strict.replace('9684b06-NVDA-test-candidate', 'e8cd992-NVDA-test-candidate')

          focused_old = 'python -m unittest tests.test_issue22_release_contract tests.test_nvda_p0_contract tests.test_ui_native_menu_recovery tests.test_sound_runtime tests.test_release_stockfish_composition tests.test_stage1_core_full_flow tests.test_stage1_release_composition_ui tests.test_stage1_packaged_focus_origin_contract -v'
          focused_new = 'python -m unittest tests.test_issue22_release_contract tests.test_nvda_p0_contract tests.test_stage1_webview2_accessibility_boundary tests.test_webview_safe_server tests.test_ui_native_menu_recovery tests.test_sound_runtime tests.test_release_stockfish_composition tests.test_stage1_core_full_flow tests.test_stage1_release_composition_ui tests.test_stage1_packaged_focus_origin_contract -v'
          if focused_new not in strict:
              if strict.count(focused_old) != 1:
                  raise SystemExit('Focused Issue22/P0 gate anchor not unique')
              strict = strict.replace(focused_old, focused_new)

          strict = strict.replace(
              '- name: Built EXE diagnostic and real WebView2 startup',
              '- name: Built EXE diagnostic and WebView2 process startup'
          )
          strict = strict.replace(
              '"REAL PACKAGED WEBVIEW2 STARTUP PASS pid=$($p.Id)"',
              '"WEBVIEW2 PROCESS STARTUP PASS pid=$($p.Id); REAL DOCUMENT PROOF FOLLOWS IN STRICT UIA GATE"'
          )

          anchor = """Copy-Item uia-topology-report-v5.json uia-topology-strict-raw.json -Force
          Copy-Item uia-topology-report-v5.json uia-topology-strict.json -Force
          python $classifier uia-topology-strict.json --product-root $ProductRoot
          """
          guarded = """Copy-Item uia-topology-report-v5.json uia-topology-strict-raw.json -Force
          Copy-Item uia-topology-report-v5.json uia-topology-strict.json -Force
          $startupReport=Get-Content uia-topology-strict.json -Raw|ConvertFrom-Json
          $errorNodes=@($startupReport.nodes|Where-Object {
            $startupText=([string]$_.name)+' '+([string]$_.value)+' '+([string]$_.ancestor_path)
            $startupText -match 'ERR_UNSAFE_PORT|Hmmm.*reach this page|Network error|chrome-error://|edge-error://'
          })
          if($errorNodes.Count -gt 0){
            $sample=@($errorNodes|Select-Object -First 5|ForEach-Object {([string]$_.control_type)+': '+([string]$_.name)}) -join ' | '
            throw "Chromium/WebView2 error page detected before Stage 1 interaction: $sample"
          }
          $appDocuments=@($startupReport.nodes|Where-Object {
            [string]$_.control_type -eq 'ControlType.Document' -and [bool]$_.source_root_connected -and [string]$_.name -eq 'Accessible Chess'
          })
          if($appDocuments.Count -eq 0){
            $documentNames=@($startupReport.nodes|Where-Object {[string]$_.control_type -eq 'ControlType.Document'}|ForEach-Object {[string]$_.name}) -join ' | '
            throw "Real Accessible Chess document missing before Stage 1 interaction; documents=$documentNames"
          }
          Write-Output "REAL ACCESSIBLE CHESS DOCUMENT STARTUP PASS documents=$($appDocuments.Count)"
          python $classifier uia-topology-strict.json --product-root $ProductRoot
          """
          marker = 'REAL ACCESSIBLE CHESS DOCUMENT STARTUP PASS'
          if marker not in helper:
              if helper.count(anchor) != 1:
                  raise SystemExit(f'Helper topology/classifier anchor not unique: {helper.count(anchor)}')
              helper = helper.replace(anchor, guarded)

          strict_path.write_text(strict, encoding='utf-8')
          helper_path.write_text(helper, encoding='utf-8')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'QA strict retarget/document-proof patch failed'}

      - name: Validate hardened strict release contract
        shell: pwsh
        run: |
          $helper='tools\qa\stage1_packaged_e2e_crossprocess.ps1'
          $strict='.github\workflows\windows-stage1-strict-release-crossprocess.yml'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $helper),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -gt 0){throw (@($errors|ForEach-Object{$_.Message}) -join ' | ')}
          $text=Get-Content $helper -Raw
          if($text -match 'System\.Collections\.Generic\.List\[object\]'){throw 'Generic List[object] binder ambiguity returned'}
          if($text -notmatch 'STRICT_HELPER_STACK='){throw 'Exact script-stack diagnostics missing'}
          if($text -notmatch 'function AssertFocusedRuntimeEventually'){throw 'Bounded runtime focus convergence helper missing'}
          if($text -notmatch 'function AssertSemanticFocusEventually'){throw 'Bounded semantic focus convergence helper missing'}
          if(-not $text.Contains("AssertFocusedRuntimeEventually `$moveRid 'Legal e4 refocus'")){throw 'Legal e4 refocus is not using bounded convergence'}
          if($text.Contains('if((RuntimeId [System.Windows.Automation.AutomationElement]::FocusedElement) -ne $moveRid)')){throw 'One-shot legal e4 focus assertion returned'}
          if($text -notmatch 'RNBQKBNR b KQkq e3 0 1'){throw 'Canonical e4 FEN expectation missing'}
          if($text -notmatch 'RNBQKBNR w KQkq e6 0 2'){throw 'Canonical black e5 FEN expectation missing'}
          if($text -notmatch 'Prepared e5 before entering board'){throw 'e5 must be prepared before board entry'}
          if($text -notmatch 'REAL ACCESSIBLE CHESS DOCUMENT STARTUP PASS'){throw 'Real-document startup proof missing'}
          if($text -notmatch 'ERR_UNSAFE_PORT'){throw 'Unsafe-port/error-page rejection missing'}
          if($text -match 'Assert-MoveIdentityForBoardBridge'){throw 'Board phase must not touch Move identity'}
          $prep=$text.IndexOf("`$vp.SetValue('e5')")
          $board=$text.IndexOf('Invoke $boardLauncher')
          $origin=$text.IndexOf("AssertSemanticFocusEventually `$target 'Board origin establishment'")
          $submit=$text.IndexOf("Invoke `$submit 'move-submit'")
          $restore=$text.IndexOf("AssertSemanticFocusEventually `$target 'Board focus continuity after pure submit bridge'")
          if($prep -lt 0 -or $board -lt 0 -or $origin -lt 0 -or $submit -lt 0 -or $restore -lt 0 -or -not ($prep -lt $board -and $board -lt $origin -and $origin -lt $submit -and $submit -lt $restore)){
            throw "Focus/pure-bridge ordering invalid: prep=$prep board=$board origin=$origin submit=$submit restore=$restore"
          }
          $bridge=$text.Substring($origin,$submit-$origin)
          if($bridge -match 'SetValue|FindRuntime|AssertMove|\$move|\$vp'){throw 'Move input is touched after board origin before submit Invoke'}

          $strictText=Get-Content $strict -Raw
          if($strictText -notmatch [regex]::Escape($env:TARGET_PRODUCT_SHA)){throw 'Strict workflow does not target exact e8cd992 product SHA'}
          if($strictText -match '9684b06e9821d9588944f1182744a1c72623b355'){throw 'Old strict product SHA remains'}
          if($strictText -notmatch 'e8cd992-NVDA-test-candidate'){throw 'Fresh candidate identity not retargeted'}
          if($strictText -notmatch 'tests\.test_webview_safe_server'){throw 'Windows focused safe-port regression missing'}
          if($strictText -notmatch 'tests\.test_stage1_webview2_accessibility_boundary'){throw 'Windows focused WebView2 boundary regression missing'}
          if($strictText -notmatch 'REAL DOCUMENT PROOF FOLLOWS IN STRICT UIA GATE'){throw 'Process-only startup is still mislabeled as document success'}
          'E8CD992 STRICT SOURCE + ERROR-PAGE FAIL-CLOSED + BOUNDED FOCUS/PURE BOARD REGRESSION PASS'

      - name: Commit coherent QA strict-release changes
        shell: pwsh
        run: |
          $changes=@(git status --short)
          $changes | ForEach-Object {$_}
          if($changes.Count -gt 0){
            $allowed=@(' M .github/workflows/windows-stage1-strict-release-crossprocess.yml',' M tools/qa/stage1_packaged_e2e_crossprocess.ps1')
            foreach($change in $changes){if($change -notin $allowed){throw "Unexpected QA working-tree change: $change"}}
            if($changes.Count -ne 2){throw "Expected exactly two coherent QA changes, got $($changes.Count)"}
            git config user.name 'Oleksii-debug'
            git config user.email 'oleksiy.az.09@gmail.com'
            git add .github/workflows/windows-stage1-strict-release-crossprocess.yml tools/qa/stage1_packaged_e2e_crossprocess.ps1
            git commit -m 'QA: run strict e8cd992 with real-document startup proof'
            if($LASTEXITCODE -ne 0){throw 'QA strict commit failed'}
            git push origin HEAD:qa/windows-current-integration-candidate-20260815
            if($LASTEXITCODE -ne 0){throw 'QA strict push failed'}
          } else {
            'Strict release QA files already hardened; no commit required.'
          }

      - name: Dispatch at most one strict run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs=gh run list --workflow windows-stage1-strict-release-crossprocess.yml --branch qa/windows-current-integration-candidate-20260815 --limit 20 --json databaseId,status,conclusion | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Could not query strict workflow WIP state'}
          $active=@($runs | Where-Object {$_.status -in @('queued','in_progress','waiting','pending','requested')})
          if($active.Count -gt 0){
            "STRICT WORKFLOW ALREADY ACTIVE: $(@($active.databaseId) -join ',')"
            exit 0
          }
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/windows-stage1-strict-release-crossprocess.yml/dispatches" -f ref='qa/windows-current-integration-candidate-20260815'
          if($LASTEXITCODE -ne 0){throw 'Strict workflow dispatch failed'}
          'STRICT WORKFLOW DISPATCHED'
