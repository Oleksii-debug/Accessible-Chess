name: D07 Search Semantic Equivalence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - d07/search-semantic-equivalence-ci-base-20260823

permissions:
  contents: read

concurrency:
  group: d07-search-equivalence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  search-equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install -q pytest

      - name: Exact semantic-equivalence ancestry and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 7bc1bb476064a55259b7046f201ad35fd2318083 HEAD)" = "7bc1bb476064a55259b7046f201ad35fd2318083"
          git diff --check 7bc1bb476064a55259b7046f201ad35fd2318083 HEAD
          git diff --name-only 7bc1bb476064a55259b7046f201ad35fd2318083 HEAD

      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused search semantic-equivalence oracle
        run: >-
          python -m unittest -v
          tests.test_d07_search_semantic_equivalence
          tests.test_search_service
          tests.test_dev3_unicode_library_search
          tests.test_dev3_search_resource_bounds
          tests.test_d07_library_search_cancellation
          tests.test_d07_acsdb_migration_atomicity

      - name: Full unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
