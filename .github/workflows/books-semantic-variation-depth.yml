name: Books Semantic Variation Depth

on:
  pull_request:
    branches:
      - 'converge/books-semantic-toolbar-live-20261003'
    paths:
      - '.github/workflows/books-semantic-variation-depth.yml'
      - 'acs/version2_book_workspace.py'
      - 'web/full_product_books_training.js'
      - 'tests/test_version2_book_workspace.py'
      - 'tests/test_books_semantic_host_bounds.py'
      - 'tests/js/books_training_surface_dom_test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-semantic-variation-depth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-variation-depth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live semantic parent and exact scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='converge/books-semantic-toolbar-live-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin             "+refs/heads/$parent_branch:refs/remotes/origin/$parent_branch"
          live_parent="$(git rev-parse "refs/remotes/origin/$parent_branch")"
          git merge-base --is-ancestor "$live_parent" HEAD

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n'               '.github/workflows/books-semantic-variation-depth.yml'               'acs/version2_book_workspace.py'               'tests/js/books_training_surface_dom_test.js'               'tests/test_books_semantic_host_bounds.py'               'tests/test_version2_book_workspace.py'               'web/full_product_books_training.js' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/version2_book_workspace.py)" = "9bd7bccecc6a57ca27b5dc82e89d19e05f26160c"
          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = "8f77410aa9a84ccd112646896e22f17ee455be86"
          test "$(git rev-parse HEAD:tests/test_version2_book_workspace.py)" = "26bfb36adcaf6737775a27ae2449baebaf34e9af"
          test "$(git rev-parse HEAD:tests/test_books_semantic_host_bounds.py)" = "3912bb84280d757ebbe9b515c2d4c8e99624804f"
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = "fda78ad9dac9446abd0cf7f5256650292cd57705"

      - name: Validate browser depth semantics
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile semantic host projection
        run: >-
          python -m compileall -q
          acs/version2_book_workspace.py
          tests/test_version2_book_workspace.py
          tests/test_books_semantic_host_bounds.py

      - name: Prove retained Books semantics and flow
        run: >-
          python -m unittest -v
          tests.test_books_semantic_host_bounds
          tests.test_version2_book_workspace
          tests.test_book_bidirectional_semantic_navigation
          tests.test_v2_book_board_workflow
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_books_training_webview_projection
