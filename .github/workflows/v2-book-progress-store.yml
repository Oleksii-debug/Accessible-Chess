name: V2 Book Reading Progress Store

on:
  push:
    branches:
      - work/v2-book-reading-persistence-20260828
  pull_request:
    branches:
      - work/version2-integration-formats-20260827
    paths:
      - 'acs/book_progress_store.py'
      - 'tests/test_v2_book_progress_store.py'
      - '.github/workflows/v2-book-progress-store.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-book-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      V2_PACKAGE_PARENT_SHA: b18ac89bb7f1ef3d4106517fe3521179ab4522a1
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes for cross-platform blob identity gates
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove Books persistence ownership and current-base scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            upstream="$PR_BASE_SHA"
            mode="child-pr"
          else
            upstream="$V2_PACKAGE_PARENT_SHA"
            mode="original-package"
          fi
          test -n "$upstream"
          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD
          changed="$(git diff --name-only "$upstream" HEAD | sort)"
          test -n "$changed"

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2-book-progress-store.yml|acs/book_progress_store.py|tests/test_v2_book_progress_store.py)
                ;;
              *)
                echo "Unexpected path outside Book progress ownership: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

          if [ "$mode" = "original-package" ]; then
            expected="$(printf '%s\n' \
              '.github/workflows/v2-book-progress-store.yml' \
              'acs/book_progress_store.py' \
              'tests/test_v2_book_progress_store.py' | sort)"
            test "$changed" = "$expected"
          fi

          git diff --quiet "$upstream" HEAD -- \
            acs/bookreader.py \
            acs/book_index.py \
            acs/bookdocument.py \
            acs/book_training.py \
            acs/training.py \
            acs/book_webview_bridge.py \
            acs/book_webview_projection.py \
            acs/full_product_presenters.py \
            acs/gametree.py \
            acs/chesscore.py \
            acs/analysis_service.py \
            acs/engine_assisted_workflows.py \
            acs/acsdb.py \
            web/full_product_books_training.js \
            acs/stage1_release_ui.py

      - name: Compile Book progress package
        run: >-
          python -m compileall -q
          acs/book_progress_store.py
          tests/test_v2_book_progress_store.py

      - name: Focused Book reading persistence regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_progress_store
          tests.test_bookreader
          tests.test_bookdocument

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
