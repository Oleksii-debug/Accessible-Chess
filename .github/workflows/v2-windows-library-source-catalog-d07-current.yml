name: V2 Windows Library Source Catalog D07 Current

on:
  push:
    branches:
      - work/v2-windows-library-source-catalog-d07-current-20260910
  pull_request:
    branches:
      - work/w2-library-source-catalog-d07-current-20260910
    paths:
      - 'acs/version2_windows_library_source_catalog.py'
      - 'tests/test_v2_windows_library_source_catalog.py'
      - '.github/workflows/v2-windows-library-source-catalog-d07-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-library-source-catalog-d07-current-${{ github.ref }}
  cancel-in-progress: true

env:
  D07_CURRENT_BASE: 93d7b1ff646fc8e4ff5ef2c82b976fab6a23359d
  UI_OWNER_HEAD: 84a5e3f444e22bcf77a30f8437a8be68ce825495
  UI_OWNER_SOURCE_BLOB: e04b754f9a0729a987562d4784ffde0f92b6ed0d
  UI_OWNER_TEST_BLOB: ebb410e4b949a5d6977fe53b03092cd1de722c9b
  D07_SOURCE_SERVICE_BLOB: bb848b9cfc7eb643630143833be52075fca3e165
  D07_ACSDB_BLOB: f5dd56e017c09aa8bf2ba3aa66c0658f8a229e74
  D07_SEARCH_BLOB: 98466d081fb4c77d52029963c2f295e5f022dd07
  D07_IMPORT_BLOB: f9f6959c429c2681e355d11faecb0b1034e0f22b

jobs:
  source-catalog-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Normalize canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact current D07 child and owner bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$D07_CURRENT_BASE" HEAD)" = "$D07_CURRENT_BASE"
          git diff --check "$D07_CURRENT_BASE" HEAD
          changed="$(git diff --name-only "$D07_CURRENT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-library-source-catalog-d07-current.yml' \
            'acs/version2_windows_library_source_catalog.py' \
            'tests/test_v2_windows_library_source_catalog.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/version2_windows_library_source_catalog.py)" = "$UI_OWNER_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_library_source_catalog.py)" = "$UI_OWNER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/library_source_service.py)" = "$D07_SOURCE_SERVICE_BLOB"
          test "$(git rev-parse HEAD:acs/acsdb.py)" = "$D07_ACSDB_BLOB"
          test "$(git rev-parse HEAD:acs/search_service.py)" = "$D07_SEARCH_BLOB"
          test "$(git rev-parse HEAD:acs/library_import_service.py)" = "$D07_IMPORT_BLOB"
          git diff --quiet "$D07_CURRENT_BASE" HEAD -- \
            acs/library_source_service.py \
            acs/acsdb.py \
            acs/search_service.py \
            acs/library_import_service.py \
            acs/library_webview_projection.py \
            acs/library_webview_bridge.py \
            acs/full_product_actions.py \
            acs/full_product_native_menu.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py \
            run_accessible_chess.py

      - name: Compile source-catalog presentation
        run: >-
          python -m compileall -q
          acs/version2_windows_library_source_catalog.py
          tests/test_v2_windows_library_source_catalog.py

      - name: Focused Windows/NVDA source-catalog and canonical D07 contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_library_source_catalog
          tests.test_v2_library_source_catalog
          tests.test_d07_library_import_service
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence
          tests.test_acsdb

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_library_source_catalog.py
          tests/test_v2_library_source_catalog.py
          tests/test_d07_library_import_service.py
          tests/test_d07_library_search_cancellation.py
          tests/test_d07_search_semantic_equivalence.py
          tests/test_d07_search_scalar_equivalence.py
          tests/test_acsdb.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
