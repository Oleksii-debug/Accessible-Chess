name: Current Product Package Manifest Integration Convergence

on:
  pull_request:
    branches:
      - integration/current-product-main-candidate-20261004-c2mbezb
    paths:
      - '.github/workflows/current-product-portable-integration-convergence.yml'
      - '.github/workflows/current-portable-manifest-json-prehash-bounds.yml'
      - '.github/workflows/current-bookdocument-total-text-budget.yml'
      - '.github/workflows/current-bookdocument-training-resource-convergence.yml'
      - '.github/workflows/current-settings-bookreader-resource-convergence.yml'
      - '.github/workflows/current-training-progress-json-prehash-bounds.yml'
      - 'acs/version2_package_preflight.py'
      - 'acs/version2_portable_package.py'
      - 'acs/bookdocument.py'
      - 'acs/bookreader.py'
      - 'acs/settings.py'
      - 'acs/training_progress_store.py'
      - 'tests/test_portable_manifest_json_prehash_bounds_current.py'
      - 'tests/test_bookdocument_total_text_budget_current.py'
      - 'tests/test_bookreader.py'
      - 'tests/test_bookreader_revision_barriers_current.py'
      - 'tests/test_settings_corruption_security.py'
      - 'tests/test_training_progress_json_prehash_bounds_current.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-package-manifest-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - name: Checkout exact combined integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live integration Product and package-manifest geometry
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_BRANCH: integration/current-product-main-candidate-20261004-c2mbezb
          PRIOR_INTEGRATION_BRANCH: converge/current-product-portable-integration-20261004-ooxple7-g12
          PORTABLE_BRANCH: fix/current-portable-manifest-json-prehash-20261004-3pg7jcgq
          PRODUCT_BRANCH: converge/current-settings-bookreader-resource-20261004-ooxple7-g11
          CURRENT_PRODUCT_BRANCH: converge/current-product-books-provider-20261005-ooxple7
          CURRENT_PRODUCT_SHA: 492861b4e3ed2365ac63ddf925b182db7d3342e2
          MANIFEST_SOURCE_GATE: .github/workflows/current-portable-manifest-json-prehash-bounds.yml
          ACCESSIBILITY_GATE: .github/workflows/current-product-accessibility-formats-convergence.yml
          SHIPPING_GATE: .github/workflows/current-product-shipping-integration-20261005.yml
          SHIPPING_TEST: tests/test_current_product_shipping_integration_20261005.py
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          base_ref="${EVENT_BASE_REF:-$BASE_BRANCH}"
          test "$base_ref" = "$BASE_BRANCH"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi

          if git merge-base --is-ancestor "$CURRENT_PRODUCT_SHA" HEAD; then
            git fetch --no-tags origin "+refs/heads/$CURRENT_PRODUCT_BRANCH:refs/remotes/origin/$CURRENT_PRODUCT_BRANCH"
            live_current_product="$(git rev-parse "refs/remotes/origin/$CURRENT_PRODUCT_BRANCH")"
            test "$live_current_product" = "$CURRENT_PRODUCT_SHA"
            test "$(git merge-base "$live_base" "$live_current_product")" = "$live_base"
            git merge-base --is-ancestor "$live_current_product" HEAD
            git diff --check "$live_base"...HEAD

            product_paths="$(git diff --name-only "$live_base"..."$live_current_product" | sort)"
            product_count="$(printf '%s\n' "$product_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
            test "$product_count" -eq 231

            extra="$(git diff --name-only "$live_current_product"...HEAD | sort)"
            expected_extra="$(printf '%s\n' \
              '.github/workflows/current-product-portable-integration-convergence.yml' \
              "$MANIFEST_SOURCE_GATE" \
              "$ACCESSIBILITY_GATE" \
              "$SHIPPING_GATE" \
              "$SHIPPING_TEST" \
              '.github/workflows/current-product-training-durability-convergence.yml' \
              '.github/workflows/current-product-windows-evidence-convergence.yml' \
              '.github/workflows/p0-user-oneclick-portable-launcher.yml' \
              '.github/workflows/portable-launch-report-reparse-safety.yml' \
              '.github/workflows/training-progress-durability.yml' \
              'tests/test_current_product_training_durability_convergence_20261005.py' \
              'tests/test_current_product_windows_evidence_convergence_20261005.py' \
              'tests/test_p0_oneclick_exact_head_concurrency.py' \
              'tests/test_portable_launch_report_reparse_concurrency.py' \
              'tests/test_training_progress_durability_concurrency.py' \
              '.github/workflows/owner-oneclick-from-w4.yml' \
              'docs/USER_SOUND_PACK_CURRENT.md' \
              'scripts/build_owner_portable_candidate.py' \
              'tests/test_owner_oneclick_from_w4_workflow.py' \
              'tests/test_owner_portable_candidate.py' \
              | sort)"
            test "$extra" = "$expected_extra" || {
              printf 'Unexpected current shipping integration qualification delta:\n%s\n' "$extra" >&2
              exit 1
            }

            candidate_paths="$(git diff --name-only "$live_base"...HEAD | sort)"
            expected_candidate="$(printf '%s\n%s\n' "$product_paths" "$expected_extra" | sed '/^$/d' | sort -u)"
            test "$candidate_paths" = "$expected_candidate" || {
              printf 'Unexpected current shipping candidate scope:\n%s\n' "$candidate_paths" >&2
              exit 1
            }
            candidate_count="$(printf '%s\n' "$candidate_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
            test "$candidate_count" -eq 242
            echo 'PACKAGE_MANIFEST_TOPOLOGY=CURRENT_SHIPPING_INTEGRATION'
          else
            git fetch --no-tags origin "+refs/heads/$PRIOR_INTEGRATION_BRANCH:refs/remotes/origin/$PRIOR_INTEGRATION_BRANCH"
            live_prior="$(git rev-parse "refs/remotes/origin/$PRIOR_INTEGRATION_BRANCH")"
            git fetch --no-tags origin "+refs/heads/$PORTABLE_BRANCH:refs/remotes/origin/$PORTABLE_BRANCH"
            live_portable="$(git rev-parse "refs/remotes/origin/$PORTABLE_BRANCH")"
            git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
            live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")"

            test "$(git merge-base "$live_base" "$live_portable")" = "$live_base"
            git merge-base --is-ancestor "$live_prior" HEAD
            git merge-base --is-ancestor "$live_portable" HEAD
            git merge-base --is-ancestor "$live_product" HEAD
            git merge-base --is-ancestor "$live_product" "$live_prior"

            matches=0
            convergence=""
            while IFS= read -r candidate; do
              parents="$(git show -s --format=%P "$candidate")"
              if [ "$parents" = "$live_prior $live_portable" ]; then
                convergence="$candidate"
                matches=$((matches + 1))
              fi
            done < <(git rev-list --merges HEAD)
            test "$matches" -eq 1
            test -n "$convergence"

            git diff --check "$live_base"...HEAD
            changed="$(git diff --name-only "$live_base"...HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/current-bookdocument-total-text-budget.yml' \
              '.github/workflows/current-bookdocument-training-resource-convergence.yml' \
              '.github/workflows/current-bookreader-revision-barriers.yml' \
              '.github/workflows/current-bookreader-training-resource-convergence.yml' \
              '.github/workflows/current-portable-manifest-json-prehash-bounds.yml' \
              '.github/workflows/current-product-portable-integration-convergence.yml' \
              '.github/workflows/current-settings-bookreader-resource-convergence.yml' \
              '.github/workflows/current-training-progress-json-prehash-bounds.yml' \
              'acs/bookdocument.py' \
              'acs/bookreader.py' \
              'acs/settings.py' \
              'acs/training_progress_store.py' \
              'acs/version2_package_preflight.py' \
              'acs/version2_portable_package.py' \
              'tests/test_bookdocument_total_text_budget_current.py' \
              'tests/test_bookreader.py' \
              'tests/test_bookreader_revision_barriers_current.py' \
              'tests/test_portable_manifest_json_prehash_bounds_current.py' \
              'tests/test_settings_corruption_security.py' \
              'tests/test_training_progress_json_prehash_bounds_current.py' | sort)"
            test "$changed" = "$expected" || {
              printf 'Unexpected combined integration scope:\n%s\n' "$changed" >&2
              exit 1
            }
            echo 'PACKAGE_MANIFEST_TOPOLOGY=LEGACY_FOCUSED_INTEGRATION'
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile combined integration surfaces
        run: >-
          python -m compileall -q
          acs/version2_package_preflight.py
          acs/version2_portable_package.py
          acs/bookdocument.py
          acs/bookreader.py
          acs/settings.py
          acs/training_progress_store.py
          tests/test_portable_manifest_json_prehash_bounds_current.py
          tests/test_bookdocument_total_text_budget_current.py
          tests/test_bookreader_revision_barriers_current.py
          tests/test_settings_corruption_security.py
          tests/test_training_progress_json_prehash_bounds_current.py

      - name: Execute focused resource-safety regressions
        run: >-
          python -m unittest -v
          tests.test_portable_manifest_json_prehash_bounds_current
          tests.test_bookdocument_total_text_budget_current
          tests.test_bookreader_revision_barriers_current
          tests.test_settings_corruption_security
          tests.test_training_progress_json_prehash_bounds_current

      - name: Execute retained package persistence and application contracts
        run: >-
          python -m unittest -v
          tests.test_version2_package_preflight
          tests.test_version2_portable_package
          tests.test_bookreader
          tests.test_book_training_passive_roots_current
          tests.test_w2_training_progress_crash_recovery
          tests.test_version2_training_current_runtime
          tests.test_version2_application

      - name: Execute integration qualification contracts
        run: >-
          python -m unittest -v
          tests.test_current_main_full_product_convergence_workflow
          tests.test_p0_release_critical_triad_convergence
          tests.test_current_product_shipping_integration_20261005

      - name: Core selftest
        run: python -m acs.selftest
