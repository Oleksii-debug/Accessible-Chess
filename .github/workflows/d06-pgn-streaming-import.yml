name: D06 Canonical PGN Streaming Import

on:
  pull_request:
    branches:
      - work/v2-pgn-nested-comment-recovery-20260901
    paths:
      - 'acs/gametree.py'
      - 'acs/pgn_roundtrip.py'
      - 'acs/pgn_streaming_import.py'
      - 'tests/test_pgn_streaming_import.py'
      - 'scripts/v2_real_lichess_streaming_v6_oracle.py'
      - '.github/workflows/d06-pgn-streaming-import.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d06-pgn-streaming-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      OWNER_BASE: 180b60774871877f0d71f8d9a685f7cf7084dac0
      DEV01_ORIGINAL: 93e211b678339e77b3751d1eefa992667f1ec73b
      D07_V6_STAGING: 47750f4a1ad452e6b9b8811afaa3cc699bde4ea8
      V2_STREAMING_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact committed bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact convergence ancestry and owner scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$OWNER_BASE" HEAD
          git merge-base --is-ancestor "$DEV01_ORIGINAL" HEAD
          git fetch --no-tags origin \
            refs/heads/integration/v2-library-v6-intake-20260828:refs/remotes/origin/v2-library-v6-intake
          test "$(git rev-parse refs/remotes/origin/v2-library-v6-intake)" = "$D07_V6_STAGING"
          git cat-file -e "$D07_V6_STAGING^{commit}"
          git diff --check "$OWNER_BASE" HEAD
          changed="$(git diff --name-only "$OWNER_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d06-pgn-streaming-import.yml' \
            'acs/gametree.py' \
            'acs/pgn_roundtrip.py' \
            'acs/pgn_streaming_import.py' \
            'scripts/v2_real_lichess_streaming_v6_oracle.py' \
            'tests/test_pgn_streaming_import.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$OWNER_BASE" HEAD -- \
            acs/chesscore.py \
            acs/gametree_legality.py \
            acs/acsdb.py \
            acs/search_policy.py \
            acs/search_service.py \
            acs/library_import_service.py \
            acs/chessbase.py \
            acs/book_html_import.py \
            acs/stage1_release_ui.py \
            web

      - name: Compile canonical streaming package
        run: >-
          python -m py_compile
          acs/gametree.py
          acs/pgn_roundtrip.py
          acs/pgn_streaming_import.py
          tests/test_pgn_streaming_import.py
          scripts/v2_real_lichess_streaming_v6_oracle.py

      - name: Focused shared-framer and global-budget regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_streaming_import
          tests.test_v2_pgn_nested_comment_recovery
          tests.test_v2_pgn_semantic_fidelity
          tests.test_d06_pgn_roundtrip
          tests.test_gametree
          tests.test_d07_library_import_service
          tests.test_d07_library_import_transaction_ownership

      - name: Materialize exact accepted D07 schema-v6 runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$D07_V6_STAGING:acs/acsdb.py")" = "f5dd56e017c09aa8bf2ba3aa66c0658f8a229e74"
          test "$(git rev-parse "$D07_V6_STAGING:acs/search_policy.py")" = "566e635d0af1675ea5e5c4cd4d4bef32550097de"
          test "$(git rev-parse "$D07_V6_STAGING:acs/search_service.py")" = "98466d081fb4c77d52029963c2f295e5f022dd07"
          git cat-file blob "$D07_V6_STAGING:acs/acsdb.py" > acs/acsdb.py
          git cat-file blob "$D07_V6_STAGING:acs/search_policy.py" > acs/search_policy.py
          git cat-file blob "$D07_V6_STAGING:acs/search_service.py" > acs/search_service.py
          test "$(git hash-object acs/acsdb.py)" = "f5dd56e017c09aa8bf2ba3aa66c0658f8a229e74"
          test "$(git hash-object acs/search_policy.py)" = "566e635d0af1675ea5e5c4cd4d4bef32550097de"
          test "$(git hash-object acs/search_service.py)" = "98466d081fb4c77d52029963c2f295e5f022dd07"

      - name: Exact lawful 10000 plus Unicode Library-v6 journey
        id: real_corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.v2_real_lichess_streaming_v6_oracle 2>&1 | tee real-lichess-streaming-v6.log
          grep -F '"status": "PASS"' real-lichess-streaming-v6.log
          grep -F '"standard_games": 10000' real-lichess-streaming-v6.log
          grep -F '"schema": 6' real-lichess-streaming-v6.log

      - name: Restore exact owner Product after evidence composition
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/acsdb.py > acs/acsdb.py
          git cat-file blob HEAD:acs/search_policy.py > acs/search_policy.py
          git cat-file blob HEAD:acs/search_service.py > acs/search_service.py
          git diff --quiet HEAD -- acs/acsdb.py acs/search_policy.py acs/search_service.py

      - name: Full repository unittest
        if: always()
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        if: always()
        run: python -m pytest -q tests

      - name: Selftest and complete diagnostic
        if: always()
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Upload exact real-corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d06-pgn-streaming-v6-${{ matrix.os }}
          path: |
            real-lichess-acsdb-v6-summary.json
            real-lichess-streaming-v6.log
          if-no-files-found: error
          retention-days: 14

      - name: Prove no transient corpus or Product residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f real-lichess-acsdb-v6-summary.json real-lichess-streaming-v6.log
          # This repository contains both LF and historically committed CRLF text.
          # The exact-byte bootstrap therefore makes Git's single autocrlf policy
          # report false modifications in one direction or the other. Ignore only
          # a carriage return at end-of-line while still detecting every semantic
          # tracked-file change and every non-ignored untracked path.
          if ! git diff --quiet --ignore-cr-at-eol HEAD; then
            printf '%s\n' 'Unexpected tracked Product residue after acceptance:'
            git diff --name-status --ignore-cr-at-eol HEAD
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf '%s\n' 'Unexpected untracked residue after acceptance:'
            printf '%s\n' "$untracked"
            exit 1
          fi
