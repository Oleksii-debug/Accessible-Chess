name: Current PGN Writer Passive Overwrite

on:
  push:
    branches:
      - fix/current-pgn-writer-passive-overwrite-20261005-sol56t3k8
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
    paths:
      - 'acs/pgn_service.py'
      - 'tests/test_pgn_service_passive_overwrite.py'
      - '.github/workflows/current-pgn-writer-passive-overwrite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-pgn-writer-passive-overwrite-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact Product geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-product-books-provider-20261005-ooxple7}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-pgn-writer-passive-overwrite.yml' \
            'acs/pgn_service.py' \
            'tests/test_pgn_service_passive_overwrite.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected PGN writer passive-overwrite scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile PGN writer boundary
        run: >-
          python -m compileall -q
          acs/pgn_service.py
          tests/test_pgn_service.py
          tests/test_pgn_service_passive_overwrite.py

      - name: Execute focused and retained PGN writer regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_service_passive_overwrite
          tests.test_pgn_service

      - name: Core selftest
        run: python -m acs.selftest
