name: PGN Open Cancellation Publication Phase

on:
  push:
    branches:
      - fix/pgn-open-cancel-publication-phase-20261006-sol56
  pull_request:
    branches:
      - converge/current-shipping-pgn-cancel-successor-20261006-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-open-cancel-publication-phase-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BASE_BRANCH: converge/current-shipping-pgn-cancel-successor-20261006-ooxple7
  BASE_SHA: aedb6813c15d4ef94410a736c173c4e28dda19d5
  BASE_SOURCE_BLOB: f28b413316c77ff4f6726d0a0a8fe8f5f6d47295
  BASE_OPEN_TEST_BLOB: 79e1c0056b0d62f3d429fef5428f31df1e45b2a2
  SOURCE_BLOB: 610f80c9d566d7639934945d3907e9ef44b5d3fe
  OPEN_TEST_BLOB: e0d513915ce913050cca4ffa7b5bf76b8c7cb196

jobs:
  cancellation-publication-phase:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact successor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Prove serial parent and descendant-safe live base
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi

          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/shipping-parent"
          live_base="$(git rev-parse refs/remotes/origin/shipping-parent)"
          git merge-base --is-ancestor "$BASE_SHA" "$live_base"
          test "$(git rev-parse "$live_base:acs/version2_windows_file_workflows.py")" = "$BASE_SOURCE_BLOB"
          test "$(git rev-parse "$live_base:tests/test_v2_windows_pgn_open_worker.py")" = "$BASE_OPEN_TEST_BLOB"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          expected=(
            ".github/workflows/pgn-open-cancel-publication-phase.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_pgn_open_worker.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.yml' || true)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Compile repaired PGN Open boundary
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_pgn_open_worker.py

      - name: Execute PGN Open cancellation and persistence contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows

      - name: Execute owner runtime/application handoff
        run: >-
          python -m unittest -v
          tests.test_v2_windows_host_runtime
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
