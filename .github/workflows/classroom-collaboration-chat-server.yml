name: Classroom collaboration chat server

on:
  pull_request:
    branches:
      - feature/classroom-collaboration-contract-20260926
    paths:
      - 'acs/classroom_collaboration_chat_server.py'
      - 'tests/test_classroom_collaboration_chat_server.py'
      - '.github/workflows/classroom-collaboration-chat-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-collaboration-chat-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PR_BASE_REF: ${{ github.base_ref }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove current stacked base and exact server scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$PR_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-collaboration-chat-server.yml'
            'acs/classroom_collaboration_chat_server.py'
            'tests/test_classroom_collaboration_chat_server.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected classroom chat server scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'CLASSROOM_CHAT_SERVER_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile server and canonical collaboration boundaries
        run: >-
          python -m py_compile
          acs/classroom_collaboration_chat_server.py
          acs/classroom_collaboration.py
          acs/classroom_collaboration_storage.py
          tests/test_classroom_collaboration_chat_server.py

      - name: Run server authority and canonical collaboration contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_collaboration_chat_server
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
