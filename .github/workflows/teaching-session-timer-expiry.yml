name: Teaching Session Timer Expiry

on:
  pull_request:
    paths:
      - 'acs/teaching_session.py'
      - 'tests/test_teaching_session.py'
      - '.github/workflows/teaching-session-timer-expiry.yml'
  push:
    branches:
      - 'fix/teaching-timer-expiry-20260929'
    paths:
      - 'acs/teaching_session.py'
      - 'tests/test_teaching_session.py'
      - '.github/workflows/teaching-session-timer-expiry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 2
      - name: Require clean patch
        shell: bash
        run: git diff --check HEAD^
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile teaching timer boundary
        run: >-
          python -m py_compile
          acs/teaching_session.py
          tests/test_teaching_session.py
      - name: Run teaching timer and education integration regressions
        run: >-
          python -m unittest -v
          tests.test_teaching_session
          tests.test_education_records
