  PGN_TREE_KEYBOARD_DOM_BLOB: 3ec326e766110eba04228bcda92cc1d3dfea011a
  PGN_TREE_KEY_OWNERSHIP_BLOB: ab47179b52be5744053a842f992902ecf4f978b1
  PGN_REMAINING_KEYBINDINGS_JS_BLOB: f5d1e6082672721d62444539c4cd1bfb6a916f20
  PGN_KEYBINDINGS_TEST_BLOB: e5b969c6c0f1c2c66a21c59432792e9285ab30bf
  PGN_TREE_KEYBINDINGS_TEST_BLOB: 104cd19bab8e361ff301d2d5fb3b5854f92c0f79
