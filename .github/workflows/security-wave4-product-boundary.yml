name: Security Wave 4 Product Boundary

on:
  pull_request:
    paths:
      - '.github/workflows/security-wave4-product-boundary.yml'
      - 'acs/protection_boundary.py'
      - 'acs/protection_hardened_boundary.py'
      - 'acs/version2_release_app.py'
      - 'acs/release_preflight.py'
      - 'tests/test_release_preflight.py'
      - 'tests/test_security_wave4_product_integration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardened-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Exact candidate checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Exact source and whitespace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check HEAD^

      - name: Install test runner
        run: python -m pip install pytest==8.4.2

      - name: Compile modified runtime and test
        run: >-
          python -m py_compile
          acs/protection_boundary.py
          acs/protection_hardened_boundary.py
          acs/version2_release_app.py
          acs/release_preflight.py
          tests/test_release_preflight.py
          tests/test_security_wave4_product_integration.py

      - name: Run Wave 4 plus retained Wave 1–3 contracts
        run: >-
          python -m pytest -q
          tests/test_security_wave4_product_integration.py
          tests/test_release_preflight.py
          tests/test_security_wave1_product_integration.py
          tests/test_security_wave2_product_integration.py
          tests/test_security_wave3_product_integration.py

      - name: Public-client key and private code hygiene
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'BEGIN (RSA |EC |)PRIVATE KEY|client[_-]?secret[[:space:]]*=|private[_-]?key[[:space:]]*=|signing[_-]?secret[[:space:]]*=' acs/protection_hardened_boundary.py acs/protection_boundary.py acs/version2_release_app.py
          ! grep -n 'from continuum_runtime\|import continuum_runtime' acs/protection_hardened_boundary.py

      - name: Product core selftest
        run: python -m acs.selftest
