name: Work V2 Windows Large PGN Streaming Evidence

on:
  push:
    branches:
      - work/v2-windows-large-pgn-streaming-evidence-20260907
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907
    paths:
      - 'tests/test_work_v2_windows_large_pgn_streaming.py'
      - '.github/workflows/work-v2-windows-large-pgn-streaming-evidence.yml'

permissions:
  contents: read

concurrency:
  group: work-v2-windows-large-pgn-streaming-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact runtime parent and evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=40e1ef2184177600bcc88911529b718adde65df9
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --check "$BASE" HEAD
          changed="$(git diff --name-only "$BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/work-v2-windows-large-pgn-streaming-evidence.yml' \
            'tests/test_work_v2_windows_large_pgn_streaming.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$BASE" HEAD -- acs web run_accessible_chess.py run_accessible_chess_v2.py

      - name: Compile evidence
        run: python -m py_compile tests/test_work_v2_windows_large_pgn_streaming.py

      - name: Prove inherited Windows file and canonical streaming contracts are green
        run: >-
          python -m unittest -v
          tests.test_version2_windows_file_workflows
          tests.test_pgn_streaming_import

      - name: Run Windows-host streaming integration oracle
        run: python -m unittest -v tests.test_work_v2_windows_large_pgn_streaming
