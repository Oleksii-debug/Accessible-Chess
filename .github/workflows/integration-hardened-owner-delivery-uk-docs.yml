name: Integration Hardened Owner Delivery Ukrainian Docs

on:
  push:
    branches:
      - integration/hardened-owner-delivery-uk-docs-20261004-sol6p3
    paths:
      - 'web/docs/ACCESSIBLE_CHESS_HOTKEYS_UK.txt'
      - 'web/docs/ACCESSIBLE_CHESS_CAPABILITIES_TESTING_UK.txt'
      - 'tests/test_owner_delivery_uk_docs.py'
      - '.github/workflows/integration-hardened-owner-delivery-uk-docs.yml'
  pull_request:
    branches:
      - integration/hardened-books-training-regressions-20261004
    paths:
      - 'web/docs/ACCESSIBLE_CHESS_HOTKEYS_UK.txt'
      - 'web/docs/ACCESSIBLE_CHESS_CAPABILITIES_TESTING_UK.txt'
      - 'tests/test_owner_delivery_uk_docs.py'
      - '.github/workflows/integration-hardened-owner-delivery-uk-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-hardened-owner-delivery-uk-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent, source blobs and keymap binding
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          parent='93ae470bfe0cbfd106340932b8586e8bee00fef9'
          source='97ecd1f83f27e140a0268dca74a01b26af075d1c'
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"
          git cat-file -e "$source^{commit}"
          git diff --check "$parent" HEAD

          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/integration-hardened-owner-delivery-uk-docs.yml' \
            'tests/test_owner_delivery_uk_docs.py' \
            'web/docs/ACCESSIBLE_CHESS_CAPABILITIES_TESTING_UK.txt' \
            'web/docs/ACCESSIBLE_CHESS_HOTKEYS_UK.txt' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:web/docs/ACCESSIBLE_CHESS_HOTKEYS_UK.txt)" = '19bc974275a7470f1756dd0a3262422e8ca5b7a7'
          test "$(git rev-parse HEAD:web/docs/ACCESSIBLE_CHESS_CAPABILITIES_TESTING_UK.txt)" = 'be8bfc1935c13a440748408157f9a14f076b93d4'
          test "$(git rev-parse HEAD:tests/test_owner_delivery_uk_docs.py)" = 'e0331eb50541e24075205e1cecd5bee5fdf0e3cc'
          test "$(git rev-parse HEAD:web/keybindings.json)" = '012f6eb19cd46998aa5a72945c254a9935028305'

          for path in \
            web/docs/ACCESSIBLE_CHESS_HOTKEYS_UK.txt \
            web/docs/ACCESSIBLE_CHESS_CAPABILITIES_TESTING_UK.txt \
            tests/test_owner_delivery_uk_docs.py
          do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$source:$path")"
          done
          echo 'OWNER_DELIVERY_UK_DOCS_SCOPE=PASS'

      - name: Compile documentation contract
        run: python -m py_compile tests/test_owner_delivery_uk_docs.py

      - name: Run owner delivery and accessibility contracts
        run: >-
          python -m unittest -v
          tests.test_owner_delivery_uk_docs
          tests.test_accessible_webui
          tests.test_v2_board_analysis_hotkey_feedback

      - name: Re-prove canonical package copy path
        run: >-
          python -m unittest -v
          tests.test_version2_release_payload
          tests.test_version2_package_assembler

      - name: Core selftest
        run: python -m acs.selftest

      - name: Whitespace validation
        shell: bash
        run: git diff --check HEAD^
