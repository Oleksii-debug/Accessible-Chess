# DEV1 QA-only trigger: prove or disprove drive-relative private path leakage on exact repair SHA.
name: DEV1 Stage1 Drive-Relative Path Privacy Evidence

on:
  push:
    branches:
      - auto/dev1-stage1-drive-relative-privacy-ci-base-20260823-1114
      - auto/dev1-stage1-drive-relative-privacy-evidence-20260823-1114
    paths:
      - '.github/workflows/dev1-stage1-drive-relative-path-privacy-evidence.yml'
  pull_request:
    branches:
      - auto/dev1-stage1-drive-relative-privacy-ci-base-20260823-1114
    paths:
      - '.github/workflows/dev1-stage1-drive-relative-path-privacy-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REPAIR_SHA: c0169ed276fff893f90f85192416612f3b998b5a

jobs:
  drive-relative-privacy-oracle:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.REPAIR_SHA }}
      - name: Preserve exact LF repair source
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard $env:REPAIR_SHA
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:REPAIR_SHA){throw "Repair SHA mismatch: $actual"}
          'EXACT REPAIR SOURCE PASS'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile sanitizer
        run: python -m compileall -q acs/report_paths.py
      - name: Windows drive-relative path privacy oracle
        shell: pwsh
        run: |
          @'
          from acs.report_paths import report_safe_name

          cases = {
              r"C:Users\PrivateUser\Documents\analysis.pgn": "analysis.pgn",
              r"D:WorkstationOwner\Chess\study.pgn": "study.pgn",
          }
          for raw, expected in cases.items():
              actual = report_safe_name(raw)
              print(f"raw={raw!r} -> {actual!r}")
              assert actual == expected, (
                  "DRIVE_RELATIVE_PRIVATE_PATH_LEAK",
                  raw,
                  actual,
                  expected,
              )
          print('WINDOWS DRIVE-RELATIVE PATH PRIVACY PASS')
          '@ | Set-Content -Encoding UTF8 drive_relative_privacy_oracle.py
          python drive_relative_privacy_oracle.py
          if($LASTEXITCODE -ne 0){throw 'Drive-relative path privacy oracle failed'}
