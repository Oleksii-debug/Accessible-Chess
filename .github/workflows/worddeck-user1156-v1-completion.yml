name: WordDeck archived user-approved 1156 completion

on:
  workflow_dispatch:

# The 1156 user-approved translations are already integrated and accepted.
# Historical transport remains in Git history; this marker cannot rewrite
# canonical source, regenerate the accepted corpus, or republish V0.1.
permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The 1156-row transport is complete and archived. No translation, branch, audio or release mutation is performed.'
