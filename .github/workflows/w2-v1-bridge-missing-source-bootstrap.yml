name: W2 Finish V1 Bridge Source Presence Hardening

on:
  push:
    branches:
      - work/v2-data-upgrade-legacy-runtime-bridge-20260907

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v2-data-upgrade-legacy-runtime-bridge-20260907
          fetch-depth: 0
      - name: Apply missing-source closure and honest gate topology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          product = Path('acs/v1_runtime_bridge.py')
          text = product.read_text(encoding='utf-8')
          old = '''        if bool(marker.get("has_settings")):\n            if not self.layout.settings_path.is_file():\n                raise V1RuntimeBridgeError("completed V2 settings are missing")\n            if "settings" in sources:\n                expected = identities.get("settings_sha256")\n                if not isinstance(expected, str) or _hash(sources["settings"]) != expected:\n                    raise V1RuntimeBridgeError(\n                        "legacy settings changed after the completed V2 migration"\n                    )\n        if bool(marker.get("has_library")):\n            if not self.layout.library_path.is_file():\n                raise V1RuntimeBridgeError("completed V2 library is missing")\n            if "library" in sources:\n                expected = identities.get("library_state_sha256")\n                if (\n                    not isinstance(expected, str)\n                    or _legacy_sqlite_state(sources["library"]) != expected\n                ):\n                    raise V1RuntimeBridgeError(\n                        "legacy library changed after the completed V2 migration"\n                    )\n'''
          new = '''        if bool(marker.get("has_settings")):\n            if not self.layout.settings_path.is_file():\n                raise V1RuntimeBridgeError("completed V2 settings are missing")\n            if "settings" not in sources:\n                raise V1RuntimeBridgeError(\n                    "legacy settings disappeared after the completed V2 migration"\n                )\n            expected = identities.get("settings_sha256")\n            if not isinstance(expected, str) or _hash(sources["settings"]) != expected:\n                raise V1RuntimeBridgeError(\n                    "legacy settings changed after the completed V2 migration"\n                )\n        if bool(marker.get("has_library")):\n            if not self.layout.library_path.is_file():\n                raise V1RuntimeBridgeError("completed V2 library is missing")\n            if "library" not in sources:\n                raise V1RuntimeBridgeError(\n                    "legacy library disappeared after the completed V2 migration"\n                )\n            expected = identities.get("library_state_sha256")\n            if (\n                not isinstance(expected, str)\n                or _legacy_sqlite_state(sources["library"]) != expected\n            ):\n                raise V1RuntimeBridgeError(\n                    "legacy library changed after the completed V2 migration"\n                )\n'''
          if old not in text:
              raise SystemExit('completed-source anchor not found or already changed')
          product.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_v1_runtime_bridge.py')
          text = tests.read_text(encoding='utf-8')
          marker = '''    def test_corrupt_duplicate_key_journal_fails_closed(self) -> None:\n'''
          addition = '''    def test_completed_marker_rejects_missing_legacy_settings(self) -> None:\n        with tempfile.TemporaryDirectory() as td:\n            root = Path(td)\n            executable, legacy, layout = self._fixture(root)\n            report = V1RuntimeBridgeCoordinator(layout, executable).run()\n            settings_before = layout.settings_path.read_bytes()\n            library_before = layout.library_path.read_bytes()\n            backup = layout.backup_root / report.backup_name\n\n            (legacy / "settings.json").unlink()\n\n            with self.assertRaisesRegex(V1RuntimeBridgeError, "settings disappeared"):\n                V1RuntimeBridgeCoordinator(layout, executable).run()\n\n            self.assertEqual(settings_before, layout.settings_path.read_bytes())\n            self.assertEqual(library_before, layout.library_path.read_bytes())\n            self.assertTrue(backup.is_dir())\n\n    def test_completed_marker_rejects_missing_legacy_library(self) -> None:\n        with tempfile.TemporaryDirectory() as td:\n            root = Path(td)\n            executable, legacy, layout = self._fixture(root)\n            report = V1RuntimeBridgeCoordinator(layout, executable).run()\n            settings_before = layout.settings_path.read_bytes()\n            library_before = layout.library_path.read_bytes()\n            backup = layout.backup_root / report.backup_name\n\n            (legacy / "library.acsdb").unlink()\n\n            with self.assertRaisesRegex(V1RuntimeBridgeError, "library disappeared"):\n                V1RuntimeBridgeCoordinator(layout, executable).run()\n\n            self.assertEqual(settings_before, layout.settings_path.read_bytes())\n            self.assertEqual(library_before, layout.library_path.read_bytes())\n            self.assertTrue(backup.is_dir())\n\n'''
          if marker not in text:
              raise SystemExit('test insertion anchor missing')
          if 'test_completed_marker_rejects_missing_legacy_settings' in text:
              raise SystemExit('missing-source tests already present')
          tests.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          workflow = Path('.github/workflows/v2-v1-runtime-bridge.yml')
          text = workflow.read_text(encoding='utf-8')
          replacements = [
              (
                  "      - 'tests/test_v1_runtime_bridge_backup_path_security.py'\n",
                  "      - 'tests/test_v1_runtime_bridge_backup_path_security.py'\n      - 'tests/test_v1_runtime_bridge_publication_atomicity.py'\n",
              ),
              (
                  "            'tests/test_v1_runtime_bridge_backup_path_security.py' \\\n",
                  "            'tests/test_v1_runtime_bridge_backup_path_security.py' \\\n            'tests/test_v1_runtime_bridge_publication_atomicity.py' \\\n",
              ),
              (
                  "          tests/test_v1_runtime_bridge_backup_path_security.py\n          tests/test_v2_library_legacy_schema0_migration.py\n",
                  "          tests/test_v1_runtime_bridge_backup_path_security.py\n          tests/test_v1_runtime_bridge_publication_atomicity.py\n          tests/test_v2_library_legacy_schema0_migration.py\n",
              ),
              (
                  "          tests.test_v1_runtime_bridge_backup_path_security\n          tests.test_v2_library_legacy_schema0_migration\n",
                  "          tests.test_v1_runtime_bridge_backup_path_security\n          tests.test_v1_runtime_bridge_publication_atomicity\n          tests.test_v2_library_legacy_schema0_migration\n",
              ),
              (
                  "          tests/test_v1_runtime_bridge_backup_path_security.py\n          tests/test_v2_library_legacy_schema0_migration.py\n          tests/test_v2_upgrade_publish_race_audit.py\n",
                  "          tests/test_v1_runtime_bridge_backup_path_security.py\n          tests/test_v1_runtime_bridge_publication_atomicity.py\n          tests/test_v2_library_legacy_schema0_migration.py\n          tests/test_v2_upgrade_publish_race_audit.py\n",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('workflow topology anchor missing: ' + repr(old))
              text = text.replace(old, new, 1)
          workflow.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q acs/v1_runtime_bridge.py tests/test_v1_runtime_bridge.py tests/test_v1_runtime_bridge_publication_atomicity.py
          python -m unittest -v tests.test_v1_runtime_bridge tests.test_v1_runtime_bridge_backup_path_security tests.test_v1_runtime_bridge_publication_atomicity
          rm .github/workflows/w2-v1-bridge-missing-source-bootstrap.yml
          git diff --check
          git config user.name "accessible-chess-w2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add acs/v1_runtime_bridge.py tests/test_v1_runtime_bridge.py .github/workflows/v2-v1-runtime-bridge.yml .github/workflows/w2-v1-bridge-missing-source-bootstrap.yml
          git commit -m "fix(w2): reject missing completed V1 sources"
          git push origin HEAD:work/v2-data-upgrade-legacy-runtime-bridge-20260907
