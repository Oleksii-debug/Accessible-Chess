name: PGN Generation + Import UI Apex Convergence

on:
  push:
    branches:
      - converge/current-windows-pgn-generation-import-apex-20261006-zftrkmo
  pull_request:
    branches:
      - converge/current-windows-pgn-import-apex-20261006-c2m82
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-save-generation-atomicity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-composed-generation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      BASE_BRANCH: converge/current-windows-pgn-import-apex-20261006-c2m82
      BASE_SHA: 4608b908142dce4a2b6a22f656d6b531533995c3
      SOURCE_BRANCH: converge/pgn-save-generation-on-atomicity-20261006-ooxple7
      SOURCE_SHA: fab71a2e3e8f4c2ba0522f9dfde5da5dbd2fe269
      SOURCE_WORKFLOW_BLOB: 774f36206e3c85f5fc29755d2270bbcd7f0997c3
      SOURCE_SNAPSHOT_BLOB: c7d592b4fbb2cae00777fd77c2f43c4928b5fe6e
      SOURCE_SNAPSHOT_TEST_BLOB: f49afc2810cae452eac90d86627d68b6dbb62970
      SOURCE_WORKER_TEST_BLOB: 012dd3e6acee8f6ee1d95b915f63d1055d124844
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact Windows apex and #2149 source authority
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi
          git fetch --no-tags origin \
            "+refs/heads/$BASE_BRANCH:refs/remotes/origin/windows-apex-base" \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/pgn-generation-source"
          live_base="$(git rev-parse refs/remotes/origin/windows-apex-base)"
          test "$live_base" = "$BASE_SHA"
          live_source="$(git rev-parse refs/remotes/origin/pgn-generation-source)"
          test "$live_source" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/pgn-save-generation-on-atomicity.yml"
            "acs/pgn_save_snapshot.py"
            "tests/test_pgn_save_snapshot.py"
            "tests/test_v2_windows_pgn_save_worker.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

          test "$(git rev-parse refs/remotes/origin/pgn-generation-source:.github/workflows/pgn-save-generation-on-atomicity.yml)" = "$SOURCE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_save_snapshot.py)" = "$SOURCE_SNAPSHOT_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_save_snapshot.py)" = "$SOURCE_SNAPSHOT_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_save_worker.py)" = "$SOURCE_WORKER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_save_snapshot.py)" = "$(git rev-parse refs/remotes/origin/pgn-generation-source:acs/pgn_save_snapshot.py)"
          test "$(git rev-parse HEAD:tests/test_pgn_save_snapshot.py)" = "$(git rev-parse refs/remotes/origin/pgn-generation-source:tests/test_pgn_save_snapshot.py)"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_save_worker.py)" = "$(git rev-parse refs/remotes/origin/pgn-generation-source:tests/test_v2_windows_pgn_save_worker.py)"

      - name: Compile composed save transaction
        run: >-
          python -m py_compile
          acs/pgn_save_snapshot.py
          tests/test_pgn_save_snapshot.py
          tests/test_v2_windows_pgn_save_worker.py
          tests/test_v2_windows_file_worker_shutdown_fence.py

      - name: Execute transaction and Windows save regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_save_snapshot
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_pgn_streaming_host
          tests.test_v2_windows_pgn_streaming_host_lifecycle
          tests.test_v2_windows_file_logging_passive
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_progress_coherence
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_library_import_observer
          tests.test_dev1_library_webview_projection
          tests.test_v2_windows_nvda_file_workflows
          tests.test_version2_application
          tests.test_version2_composition_startup_cleanup_current
          tests.test_chessbase_library_import_report_passive

      - name: Pytest focused composition
        run: >-
          pytest -q
          tests/test_pgn_save_snapshot.py
          tests/test_v2_windows_pgn_save_worker.py
          tests/test_v2_windows_file_worker_shutdown_fence.py

      - name: Core selftest
        run: python -m acs.selftest
