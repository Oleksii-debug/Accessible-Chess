name: Automation D07 Player Identity Compose

on:
  push:
    branches:
      - automation/d07-player-identity-compose-20260913

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PRODUCT: 9c1369f7b6edd309aadf8a06f8b99db7ca4e97f8
      PRIOR: ed6355b0449987e5a685f45d468a73f18aa7332a
      RESULT_BRANCH: automation/d07-player-identity-result-20260913
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Build and publish workflow-free materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Accessible Chess Automation'
          git config user.email 'actions@users.noreply.github.com'
          git cat-file -e "${PRODUCT}^{commit}" || git fetch --no-tags origin "$PRODUCT"
          git cat-file -e "${PRIOR}^{commit}" || git fetch --no-tags origin "$PRIOR"
          git checkout --detach "$PRODUCT"

          git checkout "$PRIOR" -- \
            acs/search_policy.py \
            tests/test_v2_library_player_identity_search.py \
            .github/workflows/v2-library-player-identity-search.yml

          python - <<'PY'
          from pathlib import Path
          path = Path('acs/acsdb.py')
          text = path.read_text(encoding='utf-8')
          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)
          replace_once(
              'from .search_policy import (\n    SEARCH_DATE_KEY_SQL_FUNCTION,\n',
              'from .search_policy import (\n    PLAYER_COMPONENT_KEY_SQL_FUNCTION,\n    SEARCH_DATE_KEY_SQL_FUNCTION,\n',
              'player SQL function import',
          )
          replace_once(
              '    literal_like_pattern,\n    normalize_search_date_bound,\n',
              '    literal_like_pattern,\n    normalize_player_search_terms,\n    normalize_search_date_bound,\n',
              'player normalizer import',
          )
          replace_once(
              '    normalize_search_term,\n    search_fold,\n',
              '    normalize_search_term,\n    player_component_key,\n    search_fold,\n',
              'player component key import',
          )
          replace_once(
              '        player = normalize_search_term(player, name="player")\n',
              '        player_terms = normalize_player_search_terms(player)\n',
              'player normalization call',
          )
          replace_once(
              '''        if player:\n            clauses.append(\n                "(sf.white_fold LIKE ? ESCAPE '\\\\' OR sf.black_fold LIKE ? ESCAPE '\\\\')"\n            )\n            needle = literal_like_pattern(player)\n            params.extend([needle, needle])\n''',
              '''        if player_terms:\n            if len(player_terms) == 1:\n                clauses.append(\n                    "(sf.white_fold LIKE ? ESCAPE '\\\\' OR sf.black_fold LIKE ? ESCAPE '\\\\')"\n                )\n                needle = literal_like_pattern(player_terms[0])\n                params.extend([needle, needle])\n            else:\n                white_terms = " AND ".join(\n                    f"INSTR({PLAYER_COMPONENT_KEY_SQL_FUNCTION}(sf.white_fold), ?) > 0"\n                    for _ in player_terms\n                )\n                black_terms = " AND ".join(\n                    f"INSTR({PLAYER_COMPONENT_KEY_SQL_FUNCTION}(sf.black_fold), ?) > 0"\n                    for _ in player_terms\n                )\n                clauses.append(f"(({white_terms}) OR ({black_terms}))")\n                needles = [player_component_key(term) for term in player_terms]\n                if any(needle is None for needle in needles):\n                    raise RuntimeError("player component normalization failed")\n                params.extend(needles)\n                params.extend(needles)\n''',
              'player predicate',
          )
          if 'from .pgn_roundtrip import parse_pgn_text' not in text:
              raise SystemExit('canonical parse_pgn_text import was lost')
          if 'from .gametree import PgnGame, parse_games, serialize_game' in text:
              raise SystemExit('lower-level parse_games ingress was reintroduced')
          if 'parse_pgn_text(' not in text:
              raise SystemExit('canonical parse_pgn_text call was lost')
          path.write_text(text, encoding='utf-8')
          PY

          ACSDB_BLOB="$(git hash-object acs/acsdb.py)"
          export ACSDB_BLOB
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path('.github/workflows/v2-library-player-identity-search.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'CURRENT_PRODUCT_BASE: 79f6daf4718c6cbbc7caaca838bb3b5f73c0f5eb':
                  'CURRENT_PRODUCT_BASE: 9c1369f7b6edd309aadf8a06f8b99db7ca4e97f8',
              'PRIOR_SAME_HEAD: 35dfec0d3758add3ebfa9fe4ae8ed2ac895f08c8':
                  'PRIOR_SAME_HEAD: ed6355b0449987e5a685f45d468a73f18aa7332a',
              'ACSDB_BLOB: e55b69b2741f4c6bd3e1ededb725aa75bfa357b1':
                  f"ACSDB_BLOB: {os.environ['ACSDB_BLOB']}",
              '          tests.test_v2_library_player_identity_search\n':
                  '          tests.test_d07_canonical_ingress_current\n          tests.test_v2_library_player_identity_search\n',
              '          tests/test_v2_library_player_identity_search.py\n':
                  '          tests/test_d07_canonical_ingress_current.py\n          tests/test_v2_library_player_identity_search.py\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'workflow rebind expected one match for {old!r}, got {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('automation-v2-library-player-identity-search.yml.txt').write_text(text, encoding='utf-8')
          PY

          python -m py_compile acs/acsdb.py acs/search_policy.py tests/test_v2_library_player_identity_search.py
          python -m unittest -v \
            tests.test_d07_canonical_ingress_current \
            tests.test_v2_library_player_identity_search \
            tests.test_v2_library_search_service_v4 \
            tests.test_d07_library_search_cancellation
          python -m pytest -q \
            tests/test_d07_canonical_ingress_current.py \
            tests/test_v2_library_player_identity_search.py \
            tests/test_v2_library_search_service_v4.py \
            tests/test_d07_library_search_cancellation.py

          # Never push a workflow mutation with the Actions token. The trusted
          # connector will later reuse the materialized .txt blob at the real path.
          git reset "$PRODUCT" -- .github/workflows/v2-library-player-identity-search.yml
          git add \
            acs/acsdb.py \
            acs/search_policy.py \
            tests/test_v2_library_player_identity_search.py \
            automation-v2-library-player-identity-search.yml.txt
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'acs/acsdb.py' \
            'acs/search_policy.py' \
            'automation-v2-library-player-identity-search.yml.txt' \
            'tests/test_v2_library_player_identity_search.py' | sort)"
          test "$changed" = "$expected"

          TREE="$(git write-tree)"
          RESULT="$(printf '%s\n' \
            'automation: materialize player identity after canonical ingress' \
            '' \
            'Temporary workflow-free materialization for trusted connector intake.' | git commit-tree "$TREE" -p "$PRODUCT" -p "$PRIOR")"
          test "$(git rev-parse "$RESULT^1")" = "$PRODUCT"
          test "$(git rev-parse "$RESULT^2")" = "$PRIOR"
          echo "RESULT_COMMIT=$RESULT"
          echo "ACSDB_BLOB=$ACSDB_BLOB"
          git push origin "$RESULT:refs/heads/$RESULT_BRANCH"
