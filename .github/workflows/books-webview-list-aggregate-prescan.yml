name: Books WebView List Aggregate Pre-Scan

on:
  pull_request:
    branches:
      - 'fix/book-webview-bookmark-render-atomicity-20261003'
    paths:
      - 'acs/book_webview_projection.py'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - '.github/workflows/books-webview-list-aggregate-prescan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-webview-list-aggregate-prescan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-aggregate-prescan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='fix/book-webview-bookmark-render-atomicity-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            live_ref="refs/remotes/origin/$parent_branch"
            git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
            live_parent="$(git rev-parse "$live_ref")"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            git merge-base --is-ancestor "$live_parent" HEAD
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"
            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/books-webview-list-aggregate-prescan.yml' \
              'acs/book_webview_projection.py' \
              'tests/test_dev1_books_training_webview_projection.py' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/book_webview_projection.py)" = "4562842d4be8a88cb92f3500068bcb4250d37f57"
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_projection.py)" = "e7193b58dbee0283c65e1901a6419296f2e5b106"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Books projection boundary
        run: >-
          python -m compileall -q
          acs/book_webview_projection.py
          tests/test_dev1_books_training_webview_projection.py

      - name: Prove bounded list materialization and adjacent atomicity
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_projection
          tests.test_book_bidirectional_semantic_navigation
