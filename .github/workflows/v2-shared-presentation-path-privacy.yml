name: V2 Current Presentation Privacy Convergence

on:
  push:
    branches:
      - converge/v2-presentation-privacy-current-20260911
  pull_request:
    paths:
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - '.github/workflows/v2-shared-presentation-path-privacy.yml'
      - '.github/workflows/version2-formats-integration.yml'
      - 'acs/presentation_privacy.py'
      - 'acs/book_webview_projection.py'
      - 'acs/training_webview_projection.py'
      - 'acs/library_webview_projection.py'
      - 'acs/pgn_webview_projection.py'
      - 'tests/test_v2_shared_presentation_path_privacy.py'
      - 'tests/test_v2_library_presentation_path_privacy.py'
      - 'tests/test_v2_pgn_webview_path_privacy.py'

permissions:
  contents: read

concurrency:
  group: v2-current-presentation-privacy-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_BASE: 7580f614a2d422a4af8120a4ee33264d78cf1502

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current-base ancestry and bounded privacy scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CURRENT_BASE" HEAD
          git diff --check "$CURRENT_BASE" HEAD
          changed="$(git diff --name-only "$CURRENT_BASE" HEAD | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/d01-pgn-workspace-webview.yml \
            .github/workflows/v2-shared-presentation-path-privacy.yml \
            .github/workflows/version2-formats-integration.yml \
            acs/book_webview_projection.py \
            acs/library_webview_projection.py \
            acs/pgn_webview_projection.py \
            acs/presentation_privacy.py \
            acs/training_webview_projection.py \
            tests/test_v2_library_presentation_path_privacy.py \
            tests/test_v2_pgn_webview_path_privacy.py \
            tests/test_v2_shared_presentation_path_privacy.py | sort)"
          test "$changed" = "$allowed" || {
            printf 'Unexpected current presentation privacy qualification scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Compile presentation privacy surfaces
        run: >-
          python -m compileall -q
          acs/presentation_privacy.py
          acs/book_webview_projection.py
          acs/training_webview_projection.py
          acs/library_webview_projection.py
          acs/pgn_webview_projection.py
          tests/test_v2_shared_presentation_path_privacy.py
          tests/test_v2_library_presentation_path_privacy.py
          tests/test_v2_pgn_webview_path_privacy.py

      - name: Focused presentation privacy regressions
        run: >-
          python -m unittest -v
          tests.test_v2_shared_presentation_path_privacy
          tests.test_v2_library_presentation_path_privacy
          tests.test_v2_pgn_webview_path_privacy
          tests.test_dev1_books_training_webview_projection
          tests.test_books_training_ui_integration
          tests.test_dev1_library_webview_projection
          tests.test_dev1_pgn_workspace_webview_adapter

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_shared_presentation_path_privacy.py
          tests/test_v2_library_presentation_path_privacy.py
          tests/test_v2_pgn_webview_path_privacy.py
          tests/test_dev1_books_training_webview_projection.py
          tests/test_books_training_ui_integration.py
          tests/test_dev1_library_webview_projection.py
          tests/test_dev1_pgn_workspace_webview_adapter.py

  broad-ubuntu:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
