name: V2 Audit-B Final Formats D07 Regression

on:
  push:
    branches:
      - audit/v2-final-formats-d07-regression-20260831
  pull_request:
    paths:
      - 'tests/test_v2_final_formats_d07_regression_audit.py'
      - '.github/workflows/v2-audit-b-final-formats-d07-regression.yml'

permissions:
  contents: read

concurrency:
  group: v2-audit-b-final-formats-d07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install normal verification dependency
        run: python -m pip install pytest

      - name: Exact final-formats authority and evidence-only scope
        shell: bash
        env:
          FINAL_HEAD: 43b8d22f4c80fa89c2bdd39a2f23d5f4819cc86d
          D07_V6_HEAD: 47750f4a1ad452e6b9b8811afaa3cc699bde4ea8
        run: |
          set -euo pipefail
          test "$(git merge-base "$FINAL_HEAD" HEAD)" = "$FINAL_HEAD"
          git diff --check "$FINAL_HEAD" HEAD
          changed="$(git diff --name-only "$FINAL_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-audit-b-final-formats-d07-regression.yml' \
            'tests/test_v2_final_formats_d07_regression_audit.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$FINAL_HEAD" HEAD -- acs/acsdb.py acs/search_policy.py acs/search_service.py acs/library_import_service.py
          git fetch origin "$D07_V6_HEAD" --depth=1
          if git merge-base --is-ancestor "$D07_V6_HEAD" "$FINAL_HEAD"; then
            echo 'D07_V6_ANCESTRY_PRESENT=1'
          else
            echo 'D07_V6_ANCESTRY_PRESENT=0'
          fi

      - name: Compile audit surface
        run: python -m compileall -q tests/test_v2_final_formats_d07_regression_audit.py

      - name: Exact Product broad baseline remains independently green
        shell: bash
        env:
          FINAL_HEAD: 43b8d22f4c80fa89c2bdd39a2f23d5f4819cc86d
        run: |
          set -euo pipefail
          git worktree add --detach _product "$FINAL_HEAD"
          cd _product
          python -m unittest discover -s tests -v
          python -m pytest -q
          python SELFTEST.py
          python run_accessible_chess.py --diagnostic

      - name: Independent final-formats D07 data-regression oracle
        if: ${{ always() }}
        run: python -m unittest -v tests.test_v2_final_formats_d07_regression_audit
