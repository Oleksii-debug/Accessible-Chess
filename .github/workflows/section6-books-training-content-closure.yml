name: Section 6 Books Training Content Closure

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'docs/automation/SECTION6_CLOSURE_AUDIT.md'
      - '.github/workflows/section6-books-training-content-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessible-chess-section6-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whole-section-6:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE_REF: converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
      ACCEPTED_P0F_MERGE: bcb549e2edb1334b11d85c0af5cd65f866176a49
    steps:
      - name: Checkout exact Section 6 closure candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Prove evidence-only closure geometry
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          git merge-base --is-ancestor "$ACCEPTED_P0F_MERGE" HEAD

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$PR_BASE_REF" = "$EXPECTED_BASE_REF"
            git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
            if [ -n "$PR_BASE_SHA" ]; then
              git merge-base --is-ancestor "$PR_BASE_SHA" "$live_base"
            fi
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            scope_base="$live_base"
          else
            scope_base="$(git rev-parse HEAD^)"
          fi

          git diff --check "$scope_base" HEAD
          changed="$(git diff --name-only "$scope_base"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/section6-books-training-content-closure.yml' \
            'docs/automation/SECTION6_CLOSURE_AUDIT.md' | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Bind inherited Section 6 runtime authority
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Section 6 authority drift: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/bookdocument.py=23249894e2e7d9c3b2c0602515188000ea846a41
          acs/bookreader.py=7afb17856686683c5cce5fd8f80ed00383d255a3
          acs/book_training.py=d7e54c4eb77240b76f80da648ad51c414d73efe1
          acs/book_progress_store.py=f110939f4cfda4bb24a76d01ea35ffbba7ad2b79
          acs/training.py=84d46662a1cbbfe80fe8d336dc7f8b1ad9f0dd20
          acs/training_progress_store.py=ba53f054cf8e00c519aeb008c25653ef2d64371f
          acs/starter_books_training_content.py=04bbc4aaf44bf9421f7e02adeb10c965ef3f1d9d
          acs/starter_books_training_release.py=c43123311921bddda0ea9500aab1fb6ceb1c5242
          acs/starter_books_training_runtime.py=28a054c84d867d51bfb9834e82d2e0ffd8855710
          acs/version2_starter_content_application.py=4603dac7b1ccdc7a408e5102ee10f8fd7a88ce77
          acs/version2_packaged_starter_application.py=67b83f8e605ef7534fc5834064e2c2427a4439b6
          tools/p0f_lawful_starter_bundle.py=8bc6017598eabc4eb4c377952d438f6528f6d0d7
          docs/P0F_STARTER_CONTENT_PROVENANCE.md=3298aed00ca000d27f607cd861abbba9483ff358
          LOCKS

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Compile Section 6 authorities
        run: >-
          python -m py_compile
          acs/bookdocument.py
          acs/bookreader.py
          acs/book_training.py
          acs/book_progress_store.py
          acs/training.py
          acs/training_progress_store.py
          acs/starter_books_training_content.py
          acs/starter_books_training_release.py
          acs/starter_books_training_runtime.py
          acs/version2_starter_content_application.py
          acs/version2_packaged_starter_application.py
          tools/p0f_lawful_starter_bundle.py

      - name: Execute whole Section 6 contract
        run: >-
          python -m pytest -q
          tests/test_bookdocument.py
          tests/test_bookreader.py
          tests/test_d08_book_training_contract.py
          tests/test_d08_training_canonical_resume.py
          tests/test_training.py
          tests/test_training_progress_ancestor_authority.py
          tests/test_training_progress_json_prehash_bounds_current.py
          tests/test_training_progress_passive_ingress.py
          tests/test_w2_training_progress_crash_recovery.py
          tests/test_book_training_large_reading_journey.py
          tests/test_books_training_ui_integration.py
          tests/test_w3_p0f_starter_books_training_content.py
          tests/test_p0f_starter_training_canonical_legality.py
          tests/test_p0f_starter_structured_examples.py
          tests/test_p0f_lawful_starter_bundle.py
          tests/test_p0f_packaged_starter_application.py
          tests/test_p0f_starter_content.py
          tests/test_stage_p0f_release_content.py

      - name: Execute keyboard and screen-reader Books/Training DOM contract
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js
