name: Reviewed PGN Encoding Conversion
on:
  pull_request:
    paths:
      - 'acs/pgn_conversion*.py'
      - 'acs/full_product_native_menu.py'
      - 'acs/pgn_roundtrip.py'
      - 'acs/pgn_service.py'
      - 'acs/import_contract.py'
      - 'tests/test_pgn_conversion*.py'
      - 'tests/test_full_product_native_menu.py'
      - 'scripts/qualify_pgn_conversion_corpus.py'
      - '.github/workflows/pgn-reviewed-encoding-conversion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pgn-reviewed-conversion-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  conversion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Reject superseded pull request evidence
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$EVENT_SHA"
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile conversion service and native dialog
        run: python -m compileall -q acs/pgn_conversion.py acs/pgn_conversion_windows.py acs/full_product_native_menu.py scripts/qualify_pgn_conversion_corpus.py tests/test_pgn_conversion.py tests/test_pgn_conversion_windows.py tests/test_pgn_conversion_native_windows.py
      - name: Reviewed conversion, native lifecycle and retained PGN Library contracts
        run: python -m unittest tests.test_pgn_conversion tests.test_pgn_conversion_windows tests.test_full_product_native_menu tests.test_version2_windows_composition_profile tests.test_v2_windows_pgn_save_action_reachability tests.test_d06_pgn_roundtrip tests.test_pgn_service tests.test_import_contract tests.test_d07_library_import_service tests.test_d07_library_export_service -v
      - name: Install retained Windows native host dependencies
        if: runner.os == 'Windows'
        run: python -m pip install pythonnet==3.1.0 clr-loader==0.3.1 cffi==2.1.1 pycparser==3.0
      - name: Actual WinForms STA dialog smoke (automated, not NVDA acceptance)
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_pgn_conversion_native_windows -v
      - name: Canonical chess selftest
        run: python -m acs.selftest
