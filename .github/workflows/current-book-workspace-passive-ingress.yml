name: Current Book Workspace Passive Ingress

on:
  push:
    branches:
      - fix/book-workflow-state-passive-ingress-20261005-sol56z8q4
  pull_request:
    branches:
      - fix/current-book-workspace-passive-ingress-20261005-sol56
    paths:
      - 'acs/version2_book_workspace.py'
      - 'tests/test_book_engine_authority_passive_ingress.py'
      - 'tests/test_version2_book_workspace.py'
      - '.github/workflows/current-book-workspace-passive-ingress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-workspace-passive-ingress-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact Product ancestry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          base_ref="${EVENT_BASE_REF:-fix/current-book-workspace-passive-ingress-20261005-sol56}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD

          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-book-workspace-passive-ingress.yml' \
            'acs/version2_book_workspace.py' \
            'tests/test_book_engine_authority_passive_ingress.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Book workspace passive-ingress scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile workspace passive boundary
        run: >-
          python -m compileall -q
          acs/version2_book_workspace.py
          tests/test_book_engine_authority_passive_ingress.py
          tests/test_version2_book_workspace.py

      - name: Execute semantic Books and Board regressions
        run: >-
          python -m unittest -v
          tests.test_book_engine_authority_passive_ingress
          tests.test_books_semantic_host_bounds
          tests.test_version2_book_workspace
          tests.test_v2_book_board_workflow
          tests.test_book_bidirectional_semantic_navigation

      - name: Core selftest
        run: python -m acs.selftest
