name: Teaching Classroom Foundation CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/teaching-classroom-foundation
    paths:
      - 'acs/visual_preferences.py'
      - 'acs/visual_pack_presentation.py'
      - 'acs/teaching_controls.py'
      - 'acs/teaching_actions.py'
      - 'acs/teaching_action_presentation.py'
      - 'acs/child_coaching_ui.py'
      - 'acs/sound_profiles.py'
      - 'acs/sound_runtime.py'
      - 'acs/classroom_sound.py'
      - 'acs/sound_profile_store.py'
      - 'acs/sound_pack_catalog.py'
      - 'acs/sound_pack_profile.py'
      - 'acs/classroom.py'
      - 'acs/classroom_presentation.py'
      - 'acs/lesson_plan.py'
      - 'acs/lesson_storage.py'
      - 'acs/lesson_session_storage.py'
      - 'acs/lesson_template_storage.py'
      - 'acs/lesson_application_service.py'
      - 'acs/lesson_template_presentation.py'
      - 'acs/classroom_collaboration_storage.py'
      - 'acs/local_profile.py'
      - 'acs/usage_statistics.py'
      - 'acs/usage_sync.py'
      - 'acs/teaching_ui.py'
      - 'acs/teaching_webapp.py'
      - 'web/teaching.html'
      - 'web/teaching_actions.html'
      - 'web/child_coaching.html'
      - 'web/visual_packs.html'
      - 'tests/test_visual_preferences.py'
      - 'tests/test_visual_pack_presentation.py'
      - 'tests/test_teaching_controls.py'
      - 'tests/test_teaching_action_presentation.py'
      - 'tests/test_child_coaching_ui.py'
      - 'tests/test_sound_profiles.py'
      - 'tests/test_sound_profile_runtime.py'
      - 'tests/test_classroom_sound.py'
      - 'tests/test_sound_profile_store.py'
      - 'tests/test_sound_pack_catalog.py'
      - 'tests/test_sound_pack_profile.py'
      - 'tests/test_sound_runtime.py'
      - 'tests/test_classroom.py'
      - 'tests/test_classroom_presentation.py'
      - 'tests/test_lesson_plan.py'
      - 'tests/test_lesson_storage.py'
      - 'tests/test_lesson_session_storage.py'
      - 'tests/test_lesson_template_storage.py'
      - 'tests/test_lesson_application_service.py'
      - 'tests/test_lesson_template_presentation.py'
      - 'tests/test_classroom_collaboration_storage.py'
      - 'tests/test_local_profile.py'
      - 'tests/test_usage_statistics.py'
      - 'tests/test_usage_sync.py'
      - 'tests/test_teaching_ui.py'
      - '.github/workflows/teaching-classroom-foundation-ci.yml'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile teaching and classroom contracts
        run: >-
          python -m compileall -q
          acs/visual_preferences.py
          acs/visual_pack_presentation.py
          acs/teaching_controls.py
          acs/teaching_actions.py
          acs/teaching_action_presentation.py
          acs/child_coaching_ui.py
          acs/sound_profiles.py
          acs/sound_runtime.py
          acs/classroom_sound.py
          acs/sound_profile_store.py
          acs/sound_pack_catalog.py
          acs/sound_pack_profile.py
          acs/classroom.py
          acs/classroom_presentation.py
          acs/lesson_plan.py
          acs/lesson_storage.py
          acs/lesson_session_storage.py
          acs/lesson_template_storage.py
          acs/lesson_application_service.py
          acs/lesson_template_presentation.py
          acs/classroom_collaboration_storage.py
          acs/local_profile.py
          acs/usage_statistics.py
          acs/usage_sync.py
          acs/teaching_ui.py
          acs/teaching_webapp.py
          tests/test_visual_preferences.py
          tests/test_visual_pack_presentation.py
          tests/test_teaching_controls.py
          tests/test_teaching_action_presentation.py
          tests/test_child_coaching_ui.py
          tests/test_sound_profiles.py
          tests/test_sound_profile_runtime.py
          tests/test_classroom_sound.py
          tests/test_sound_profile_store.py
          tests/test_sound_pack_catalog.py
          tests/test_sound_pack_profile.py
          tests/test_sound_runtime.py
          tests/test_classroom.py
          tests/test_classroom_presentation.py
          tests/test_lesson_plan.py
          tests/test_lesson_storage.py
          tests/test_lesson_session_storage.py
          tests/test_lesson_template_storage.py
          tests/test_lesson_application_service.py
          tests/test_lesson_template_presentation.py
          tests/test_classroom_collaboration_storage.py
          tests/test_local_profile.py
          tests/test_usage_statistics.py
          tests/test_usage_sync.py
          tests/test_teaching_ui.py
      - name: Run feature contract and semantic UI tests
        run: >-
          python -m unittest -v
          tests.test_visual_preferences
          tests.test_visual_pack_presentation
          tests.test_teaching_controls
          tests.test_teaching_action_presentation
          tests.test_child_coaching_ui
          tests.test_sound_profiles
          tests.test_sound_profile_runtime
          tests.test_classroom_sound
          tests.test_sound_profile_store
          tests.test_sound_pack_catalog
          tests.test_sound_pack_profile
          tests.test_sound_runtime
          tests.test_classroom
          tests.test_classroom_presentation
          tests.test_lesson_plan
          tests.test_lesson_storage
          tests.test_lesson_session_storage
          tests.test_lesson_template_storage
          tests.test_lesson_application_service
          tests.test_lesson_template_presentation
          tests.test_classroom_collaboration_storage
          tests.test_local_profile
          tests.test_usage_statistics
          tests.test_usage_sync
          tests.test_teaching_ui
      - name: Run adjacent Data regressions
        run: >-
          python -m unittest -v
          tests.test_data_integration
          tests.test_acsdb
      - name: Run adjacent architecture regressions
        run: >-
          python -m unittest -v
          tests.test_architecture
          tests.test_settings
          tests.test_training
          tests.test_keybindings
