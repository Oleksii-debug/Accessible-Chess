name: P0 Dynamic Semantic Selection

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'web/index.html'
      - 'web/full_product_pgn.js'
      - 'web/p0_accessibility_runtime.js'
      - 'tests/js/p0_accessibility_runtime_test.js'
      - 'tests/js/p0_dynamic_selection_survival_test.js'
      - 'tests/test_p0_semantic_document_copy.py'
      - '.github/workflows/p0-dynamic-semantic-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-dynamic-semantic-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-dynamic-selection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Parse accessibility surfaces
        run: |
          node --check web/p0_accessibility_runtime.js
          node --check web/full_product_pgn.js
          node --check tests/js/p0_accessibility_runtime_test.js
          node --check tests/js/p0_dynamic_selection_survival_test.js

      - name: Execute dynamic semantic selection regressions
        run: |
          node tests/js/p0_accessibility_runtime_test.js
          node tests/js/p0_dynamic_selection_survival_test.js

      - name: Install focused Python verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Selection copy and NVDA source contracts
        run: >-
          python -m pytest -q
          tests/test_p0_semantic_document_copy.py
          tests/test_nvda_p0_contract.py
          tests/test_accessible_webui.py

      - name: Current Stage1 and V2 accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_stage1_complete_user_flow
          tests.test_stage1_release_composition_ui
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_version2_release_accessibility_contract
