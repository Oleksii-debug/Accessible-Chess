name: WordDeck emergency Oxford 5000 completion

on:
  push:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/tools/complete_oxford5000_emergency.py'
      - 'WordDeck/QA/oxford5000_manual_emergency_overrides_20260820.tsv'
      - '.github/workflows/worddeck-emergency-completion.yml'
  workflow_dispatch:

concurrency:
  group: worddeck-emergency-completion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  complete-tail:
    if: github.ref == 'refs/heads/worddeck-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish pending corrective emergency status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'WordDeck emergency corrective semantic gate',
              description: 'Fail-closed Oxford 5000 corrective emergency run is executing.',
              target_url: targetUrl
            });

      - name: Install deterministic translation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'transformers<5' sentencepiece requests beautifulsoup4 'sentence-transformers<4'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build exact authoritative starting ledgers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/worddeck-emergency-input /tmp/worddeck-emergency-run artifacts/emergency
          python WordDeck/tools/fetch_oxford5000_official_html.py --output /tmp/worddeck-emergency-input/official.html
          python WordDeck/tools/validate_oxford5000_runtime_ledger.py \
            --official-html /tmp/worddeck-emergency-input/official.html \
            --ledger /tmp/worddeck-emergency-input/pre-runtime.tsv \
            --report /tmp/worddeck-emergency-input/pre-accounting.tsv \
            --unaccounted /tmp/worddeck-emergency-input/pre-unaccounted.tsv
          test "$(($(wc -l < /tmp/worddeck-emergency-input/pre-runtime.tsv) - 1))" -eq 982
          test "$(($(wc -l < /tmp/worddeck-emergency-input/pre-unaccounted.tsv) - 1))" -eq 1156

      - name: Produce all 1156 MANUAL_EMERGENCY_WORK candidates and separate semantic QA
        shell: bash
        run: |
          set -euo pipefail
          override_args=()
          if [ -f WordDeck/QA/oxford5000_manual_emergency_overrides_20260820.tsv ]; then
            override_args=(--overrides WordDeck/QA/oxford5000_manual_emergency_overrides_20260820.tsv)
          fi
          python WordDeck/tools/complete_oxford5000_emergency.py --self-test
          python WordDeck/tools/complete_oxford5000_emergency.py \
            --unaccounted /tmp/worddeck-emergency-input/pre-unaccounted.tsv \
            --qa-dir artifacts/emergency/generated-qa \
            --bootstrap WordDeck/ReviewedOxford5000Bootstrap.cs \
            --csproj WordDeck/WordDeck.csproj \
            --expected-tail 1156 \
            "${override_args[@]}"
          test "$(($(wc -l < artifacts/emergency/generated-qa/oxford5000_manual_emergency_first_pass_20260820.tsv) - 1))" -eq 1156
          test "$(($(wc -l < artifacts/emergency/generated-qa/oxford5000_manual_emergency_second_pass_20260820.tsv) - 1))" -eq 1156
          pass_count=$(awk -F '\t' 'NR>1 && $7=="PASS" {n++} END{print n+0}' artifacts/emergency/generated-qa/oxford5000_manual_emergency_second_pass_20260820.tsv)
          blocked_count=$(awk -F '\t' 'NR>1 && $7=="BLOCKED" {n++} END{print n+0}' artifacts/emergency/generated-qa/oxford5000_manual_emergency_second_pass_20260820.tsv)
          echo "Corrective semantic preflight: PASS=$pass_count BLOCKED=$blocked_count"
          test "$((pass_count + blocked_count))" -eq 1156
          if [ "$blocked_count" -ne 0 ]; then
            echo "Semantic preflight is fail-closed: $blocked_count identities require source-grounded correction before any checkpoint is committed." >&2
            cp artifacts/emergency/generated-qa/oxford5000_manual_emergency_first_pass_20260820.tsv WordDeck/QA/oxford5000_manual_emergency_v2_first_pass_20260820.tsv
            cp artifacts/emergency/generated-qa/oxford5000_manual_emergency_second_pass_20260820.tsv WordDeck/QA/oxford5000_manual_emergency_v2_second_pass_20260820.tsv
            cp artifacts/emergency/generated-qa/oxford5000_manual_emergency_holds_20260820.tsv WordDeck/QA/oxford5000_manual_emergency_v2_holds_20260820.tsv
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- WordDeck/QA/oxford5000_manual_emergency_v2_first_pass_20260820.tsv WordDeck/QA/oxford5000_manual_emergency_v2_second_pass_20260820.tsv WordDeck/QA/oxford5000_manual_emergency_v2_holds_20260820.tsv
            git diff --cached --check
            git commit -m "WordDeck: record fail-closed emergency semantic holds"
            git push origin HEAD:worddeck-bootstrap
            exit 42
          fi
          test "$pass_count" -eq 1156

      - name: Start real <=120-row orchestration transaction
        shell: bash
        run: |
          set -euo pipefail
          python WordDeck/tools/orchestrate_oxford5000_bulk_run.py start \
            --worddeck-dir WordDeck \
            --run-dir /tmp/worddeck-emergency-run \
            --official-html /tmp/worddeck-emergency-input/official.html \
            --pre-runtime /tmp/worddeck-emergency-input/pre-runtime.tsv \
            --pre-unaccounted /tmp/worddeck-emergency-input/pre-unaccounted.tsv \
            --data-factory artifacts/emergency/generated-qa/oxford5000_manual_emergency_first_pass_20260820.tsv \
            --content-qa artifacts/emergency/generated-qa/oxford5000_manual_emergency_second_pass_20260820.tsv \
            --checkpoint-size 120
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/worddeck-emergency-run')
          op=root/'orchestration.json'; tp=root/'transaction'/'transaction.json'; sp=root/'transaction'/'prepared-slices'
          o=json.loads(op.read_text()); t=json.loads(tp.read_text())
          if [c['rows'] for c in o['checkpoints']] != [120,120,120,120,120,120,120,120,120,76]:
              raise SystemExit('Expected exact emergency checkpoint sizes [120x9,76]')
          by_index={}
          for c in t['checkpoints']:
              old=c['file_name']
              new=old.replace('oxford5000_source_after_auto_', 'oxford5000_source_after_manual_')
              if new==old: raise SystemExit(f'Unexpected prepared filename {old}')
              (sp/old).rename(sp/new); c['file_name']=new; by_index[int(c['index'])]=new
          for c in o['checkpoints']: c['file']=by_index[int(c['index'])]
          tp.write_text(json.dumps(t,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          op.write_text(json.dumps(o,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('MANUAL_EMERGENCY_WORK checkpoint plan:', [c['rows'] for c in o['checkpoints']])
          PY

      - name: Integrate every checkpoint and require exact authoritative CI_GREEN before the next
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wait_windows_ci() {
            local sha="$1"
            local run_id=""
            for attempt in $(seq 1 180); do
              payload=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/worddeck-windows.yml/runs?branch=worddeck-bootstrap&event=push&per_page=50")
              run_id=$(printf '%s' "$payload" | jq -r --arg sha "$sha" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -1)
              if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then break; fi
              sleep 5
            done
            test -n "$run_id" && test "$run_id" != "null"
            for attempt in $(seq 1 240); do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/ci-run.json
              status=$(jq -r '.status' /tmp/ci-run.json)
              if [ "$status" = "completed" ]; then
                conclusion=$(jq -r '.conclusion' /tmp/ci-run.json)
                echo "Windows CI exact HEAD $sha: run=$run_id conclusion=$conclusion"
                test "$conclusion" = "success"
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > /tmp/ci-artifacts.json
                cp /tmp/ci-run.json "artifacts/emergency/windows-run-$sha.json"
                cp /tmp/ci-artifacts.json "artifacts/emergency/windows-artifacts-$sha.json"
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for WordDeck Windows CI at $sha" >&2
            return 1
          }

          total=$(jq '.checkpoints|length' /tmp/worddeck-emergency-run/orchestration.json)
          for index in $(seq 1 "$total"); do
            echo "=== MANUAL_EMERGENCY_WORK checkpoint $index/$total ==="
            python WordDeck/tools/orchestrate_oxford5000_bulk_run.py apply-next \
              --worddeck-dir WordDeck --run-dir /tmp/worddeck-emergency-run
            file=$(jq -r --argjson i "$index" '.checkpoints[]|select(.index==$i)|.file' /tmp/worddeck-emergency-run/orchestration.json)
            test -f "WordDeck/QA/$file"

            git add -- WordDeck/ReviewedOxford5000Bootstrap.cs WordDeck/WordDeck.csproj "WordDeck/QA/$file"
            if [ "$index" -eq 1 ]; then
              cp artifacts/emergency/generated-qa/oxford5000_manual_emergency_first_pass_20260820.tsv WordDeck/QA/
              cp artifacts/emergency/generated-qa/oxford5000_manual_emergency_second_pass_20260820.tsv WordDeck/QA/
              cp artifacts/emergency/generated-qa/oxford5000_manual_emergency_holds_20260820.tsv WordDeck/QA/
              cp artifacts/emergency/generated-qa/oxford5000_manual_emergency_full_verified_tail_20260820.tsv WordDeck/QA/
              git add -- \
                WordDeck/QA/oxford5000_manual_emergency_first_pass_20260820.tsv \
                WordDeck/QA/oxford5000_manual_emergency_second_pass_20260820.tsv \
                WordDeck/QA/oxford5000_manual_emergency_holds_20260820.tsv \
                WordDeck/QA/oxford5000_manual_emergency_full_verified_tail_20260820.tsv
            fi
            if [ "$index" -eq "$total" ]; then
              cat > WordDeck/Audio/generation-request.json <<'JSON'
          {
            "source": "oxford5000",
            "start": 0,
            "limit": 0,
            "accent": "en-GB",
            "femaleVoice": "bf_emma",
            "maleVoice": "bm_george",
            "speed": 1.0,
            "format": "mp3"
          }
          JSON
              git add -- WordDeck/Audio/generation-request.json
            fi

            git diff --cached --check
            git commit -m "WordDeck: integrate emergency Oxford 5000 checkpoint $(printf '%02d' "$index")"
            sha=$(git rev-parse HEAD)
            git push origin HEAD:worddeck-bootstrap
            wait_windows_ci "$sha"
            python WordDeck/tools/orchestrate_oxford5000_bulk_run.py mark-ci-green \
              --worddeck-dir WordDeck --run-dir /tmp/worddeck-emergency-run \
              --run-json /tmp/ci-run.json --artifacts-json /tmp/ci-artifacts.json
          done

          python WordDeck/tools/orchestrate_oxford5000_bulk_run.py finalize \
            --worddeck-dir WordDeck --run-dir /tmp/worddeck-emergency-run
          cp /tmp/worddeck-emergency-run/final-summary.json artifacts/emergency/orchestration-final-summary.json
          final_sha=$(git rev-parse HEAD)
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
          test "$(jq -r '.final_runtime' /tmp/worddeck-emergency-run/final-summary.json)" -eq 2138
          test "$(jq -r '.final_remaining' /tmp/worddeck-emergency-run/final-summary.json)" -eq 0

      - name: Reconcile exact final corpus at final HEAD
        shell: bash
        run: |
          set -euo pipefail
          python WordDeck/tools/validate_oxford5000_runtime_ledger.py \
            --official-html /tmp/worddeck-emergency-input/official.html \
            --ledger artifacts/emergency/final-runtime.tsv \
            --report artifacts/emergency/final-accounting.tsv \
            --unaccounted artifacts/emergency/final-unaccounted.tsv
          test "$(($(wc -l < artifacts/emergency/final-runtime.tsv) - 1))" -eq 2138
          test "$(($(wc -l < artifacts/emergency/final-unaccounted.tsv) - 1))" -eq 0
          python WordDeck/tools/validate_oxford3000_baseline_files.py --report artifacts/emergency/oxford3000-integrity.tsv
          grep -q $'rows\t3308' artifacts/emergency/oxford3000-integrity.tsv

      - name: Wait for full British Oxford 5000 AudioPack and Windows offline package at same final HEAD
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 240); do
            payload=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/worddeck-audio.yml/runs?branch=worddeck-bootstrap&event=push&per_page=50")
            run_id=$(printf '%s' "$payload" | jq -r --arg sha "$FINAL_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -1)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then break; fi
            sleep 5
          done
          test -n "$run_id" && test "$run_id" != "null"
          for attempt in $(seq 1 360); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > artifacts/emergency/final-audio-run.json
            status=$(jq -r '.status' artifacts/emergency/final-audio-run.json)
            if [ "$status" = "completed" ]; then
              conclusion=$(jq -r '.conclusion' artifacts/emergency/final-audio-run.json)
              echo "Final audio workflow exact HEAD $FINAL_SHA: run=$run_id conclusion=$conclusion"
              test "$conclusion" = "success"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > artifacts/emergency/final-audio-artifacts.json
              jq -e '.artifacts[] | select(.name=="worddeck-oxford5000-en-gb-0-0" and .expired==false)' artifacts/emergency/final-audio-artifacts.json >/dev/null
              jq -e '.artifacts[] | select(.name=="WordDeck-win-x64-with-oxford5000-audio" and .expired==false)' artifacts/emergency/final-audio-artifacts.json >/dev/null
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for final British AudioPack workflow.' >&2
          exit 1

      - name: Publish final corrective emergency status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const succeeded = '${{ job.status }}' === 'success';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'WordDeck emergency corrective semantic gate',
              description: succeeded ? 'Corrective lexical/audio emergency run completed.' : 'Corrective emergency run stopped fail-closed; inspect evidence.',
              target_url: targetUrl
            });

      - name: Upload complete emergency lexical/orchestration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-manual-emergency-completion-evidence
          path: |
            artifacts/emergency/
            /tmp/worddeck-emergency-run/orchestration.json
            /tmp/worddeck-emergency-run/final-summary.json
            /tmp/worddeck-emergency-run/checkpoint-evidence/
          if-no-files-found: warn
          retention-days: 90
