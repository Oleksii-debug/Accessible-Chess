name: Current WebView Abort Presentation Rollback

on:
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
    paths:
      - 'acs/full_product_webview_adapter.py'
      - 'tests/test_dev1_full_product_webview_adapter.py'
      - '.github/workflows/current-webview-abort-presentation-rollback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-webview-abort-rollback-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact current Product successor and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRODUCT_REF: converge/current-product-books-provider-20261005-ooxple7
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "${EVENT_BASE_REF:-$PRODUCT_REF}" = "$PRODUCT_REF"

          git fetch --no-tags origin "+refs/heads/$PRODUCT_REF:refs/remotes/origin/$PRODUCT_REF"
          live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_REF")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_product" || {
              echo "WEBVIEW_ABORT_ROLLBACK_PRODUCT_MOVED event=$EVENT_BASE_SHA live=$live_product" >&2
              exit 1
            }
          fi

          test "$(git merge-base "$live_product" HEAD)" = "$live_product"
          git diff --check "$live_product"...HEAD

          changed="$(git diff --name-only "$live_product"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-webview-abort-presentation-rollback.yml' \
            'acs/full_product_webview_adapter.py' \
            'tests/test_dev1_full_product_webview_adapter.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected WebView abort rollback scope:\n%s\n' "$changed" >&2
            exit 1
          }

          echo "WEBVIEW_ABORT_ROLLBACK_PRODUCT=$live_product"
          echo "WEBVIEW_ABORT_ROLLBACK_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed presentation boundary
        run: >-
          python -m py_compile
          acs/full_product_webview_adapter.py
          tests/test_dev1_full_product_webview_adapter.py

      - name: Execute WebView rollback and adjacent focus regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_full_product_webview_adapter
          tests.test_dev1_full_product_accessible_shell
          tests.test_full_product_native_menu
          tests.test_version2_application

      - name: Core selftest and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
