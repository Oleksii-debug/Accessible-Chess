name: Classroom HTTP Server Runtime

on:
  pull_request:
    branches:
      - feature/classroom-http-application-20261003
    paths:
      - 'acs/classroom_http_server_runtime.py'
      - 'tests/test_classroom_http_server_runtime.py'
      - '.github/workflows/classroom-http-server-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-http-server-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked server-runtime scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-http-application-20261003"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | LC_ALL=C sort)"
          allowed="$(printf '%s\n'             '.github/workflows/classroom-http-server-runtime.yml'             'acs/classroom_http_server_runtime.py'             'tests/test_classroom_http_server_runtime.py' | LC_ALL=C sort)"
          test "$changed" = "$allowed"
          echo "CLASSROOM_HTTP_SERVER_RUNTIME_EXACT_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile server-runtime boundary
        run: >-
          python -m py_compile
          acs/classroom_http_server_runtime.py
          tests/test_classroom_http_server_runtime.py

      - name: Prove no ambient deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'os\.(environ|getenv)|API_SECRET|API_KEY|STORAGE_SECRET|LIVEKIT_SECRET|uvicorn|hypercorn|gunicorn'             acs/classroom_http_server_runtime.py
          grep -Fq 'rollback_pending_uploads()' acs/classroom_http_server_runtime.py
          grep -Fq 'drain_pending_deletions()' acs/classroom_http_server_runtime.py
          grep -Fq 'integrity_check()' acs/classroom_http_server_runtime.py
          echo "CLASSROOM_HTTP_SERVER_RUNTIME_BOUNDARY=PASS"

      - name: Run server runtime and canonical network contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_http_server_runtime
          tests.test_classroom_http_application
          tests.test_classroom_chat_http_endpoint
          tests.test_classroom_chat_rpc
          tests.test_classroom_collaboration_chat_server
          tests.test_classroom_file_http_transport
          tests.test_classroom_file_rpc
          tests.test_classroom_file_server
