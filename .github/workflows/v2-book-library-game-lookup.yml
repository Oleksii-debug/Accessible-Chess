name: V2 Book Library Game Lookup

on:
  push:
    branches:
      - work/v2-book-library-game-lookup-20260828
  pull_request:
    branches:
      - work/v2-book-canonical-game-content-20260828
    paths:
      - 'acs/book_library_game_lookup.py'
      - 'tests/test_v2_book_library_game_lookup.py'
      - '.github/workflows/v2-book-library-game-lookup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-book-library-game-lookup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes for cross-platform blob identity gates
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact stacked ancestry and Books-only lookup scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            upstream="$PR_BASE_SHA"
            mode="current-pr"
          elif git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            upstream="$(git rev-parse HEAD^2)"
            mode="merge-sync-push"
          else
            upstream="$(git rev-parse HEAD^)"
            mode="incremental-push"
          fi
          test -n "$upstream"
          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD
          changed="$(git diff --name-only "$upstream" HEAD | sort)"
          test -n "$changed"

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2-book-library-game-lookup.yml|acs/book_library_game_lookup.py|tests/test_v2_book_library_game_lookup.py)
                ;;
              *)
                echo "Unexpected path outside Book Library lookup ownership: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

          if [ "$mode" = "current-pr" ] || [ "$mode" = "merge-sync-push" ]; then
            expected="$(printf '%s\n' \
              '.github/workflows/v2-book-library-game-lookup.yml' \
              'acs/book_library_game_lookup.py' \
              'tests/test_v2_book_library_game_lookup.py' | sort)"
            test "$changed" = "$expected"
          fi

          git diff --quiet "$upstream" HEAD -- \
            acs/acsdb.py \
            acs/search_service.py \
            acs/search_policy.py \
            acs/library_import_service.py \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            acs/book_game_content.py \
            acs/bookdocument.py \
            acs/bookreader.py \
            acs/book_index.py \
            acs/book_training.py \
            acs/training.py \
            acs/book_webview_bridge.py \
            acs/book_webview_projection.py \
            acs/full_product_presenters.py \
            acs/chesscore.py \
            acs/analysis_service.py \
            acs/engine_assisted_workflows.py \
            web/full_product_books_training.js \
            acs/stage1_release_ui.py

      - name: Compile Book Library lookup package
        run: >-
          python -m compileall -q
          acs/book_library_game_lookup.py
          tests/test_v2_book_library_game_lookup.py

      - name: Focused Book Library lookup regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_library_game_lookup
          tests.test_v2_book_game_content
          tests.test_acsdb
          tests.test_d06_pgn_roundtrip
          tests.test_gametree
          tests.test_bookdocument
          tests.test_v2_book_progress_store

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
