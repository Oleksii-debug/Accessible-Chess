name: Shipping Sections 31-35 Integration
on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - "acs/multiplayer_*.py"
      - "acs/player_directory.py"
      - "acs/web_client_*.py"
      - "acs/entitlements.py"
      - "acs/subscription_*.py"
      - "web/accessible_chess_web.*"
      - "web/accessible_chess_subscription.*"
      - "tests/test_section33_online_social_closure.py"
      - "tests/test_section34_web_client.py"
      - "tests/test_section35_subscription_closure.py"
      - ".github/workflows/shipping-sections31-35-integration.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cross-section-source-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Install test dependencies
        run: python -m pip install "pytest==8.4.2" "httpx==0.28.1"
      - name: Test Sections 31 and 32 preserved plus Section 33-35 restored
        run: >-
          python -m pytest -q
          tests/test_account_cloud.py
          tests/test_remote_session.py
          tests/test_classroom_chat_rpc.py
          tests/test_classroom_file_rpc.py
          tests/test_multiplayer_coordination.py
          tests/test_player_directory.py
          tests/test_section33_online_social_closure.py
          tests/test_section34_web_client.py
          tests/test_entitlements.py
          tests/test_section35_subscription_closure.py
      - name: Check browser script syntax
        run: |
          node --check web/accessible_chess_web.js
          node --check web/accessible_chess_subscription.js
      - name: Canonical chess selftest
        run: python -m acs.selftest
