name: V2 Real HTML Chess Book Content

on:
  push:
    branches:
      - work/v2-book-real-html-content-20260831
  pull_request:
    branches:
      - work/v2-book-canonical-game-content-20260828
    paths:
      - 'acs/book_html_import.py'
      - 'tests/test_v2_book_html_import.py'
      - 'scripts/v2_real_html_book_oracle.py'
      - '.github/workflows/v2-book-real-html-content.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-real-html-book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BOOK_URL: https://www.gutenberg.org/files/16377/16377-h/16377-h.htm
      BOOK_SHA256: 397cd3d816b6e685d30d3d7cfb36627cff415c754cc8f4e455c24da652d3c21e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes for cross-platform blob identity gates
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove stacked ancestry and exact HTML-ingestion ownership
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            upstream="$PR_BASE_SHA"
            mode="current-pr"
          else
            upstream="$(git rev-parse HEAD^)"
            mode="incremental-push"
          fi
          test -n "$upstream"
          git merge-base --is-ancestor "$upstream" HEAD
          git diff --check "$upstream" HEAD
          changed="$(git diff --name-only "$upstream" HEAD | sort)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2-book-real-html-content.yml|acs/book_html_import.py|scripts/v2_real_html_book_oracle.py|tests/test_v2_book_html_import.py)
                ;;
              *)
                echo "Unexpected path outside real HTML Book ownership: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"
          if [ "$mode" = "current-pr" ]; then
            expected="$(printf '%s\n' \
              '.github/workflows/v2-book-real-html-content.yml' \
              'acs/book_html_import.py' \
              'scripts/v2_real_html_book_oracle.py' \
              'tests/test_v2_book_html_import.py' | sort)"
            test "$changed" = "$expected"
          fi
          git diff --quiet "$upstream" HEAD -- \
            acs/bookdocument.py \
            acs/bookreader.py \
            acs/book_index.py \
            acs/book_progress_store.py \
            acs/book_game_content.py \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            acs/chesscore.py \
            acs/acsdb.py \
            acs/training.py \
            acs/book_training.py \
            acs/full_product_presenters.py \
            acs/book_webview_bridge.py \
            acs/book_webview_projection.py \
            web/full_product_books_training.js \
            acs/stage1_release_ui.py

      - name: Compile HTML Book package
        run: >-
          python -m compileall -q
          acs/book_html_import.py
          tests/test_v2_book_html_import.py
          scripts/v2_real_html_book_oracle.py

      - name: Focused HTML Book and canonical regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_html_import
          tests.test_v2_book_game_content
          tests.test_bookdocument
          tests.test_v2_book_progress_store
          tests.test_gametree
          tests.test_d06_pgn_roundtrip

      - name: Download lawful real chess-book corpus transiently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ["BOOK_URL"]
          for attempt in range(4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Accessible-Chess-CI/1.0 real-book-verification"},
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read()
                  with open("real-book-16377.html", "wb") as stream:
                      stream.write(data)
                  print(f"downloaded {len(data)} bytes")
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 ** attempt)
          PY

      - name: Real Project Gutenberg HTML book oracle
        run: >-
          python -m scripts.v2_real_html_book_oracle
          real-book-16377.html
          --expected-sha256 ${{ env.BOOK_SHA256 }}

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
