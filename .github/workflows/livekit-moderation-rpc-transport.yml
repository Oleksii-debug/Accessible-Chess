name: LiveKit Moderation RPC Transport

on:
  pull_request:
    branches:
      - feature/classroom-moderation-rpc-core-20261002
    paths:
      - 'acs/livekit_moderation_rpc_transport.py'
      - 'tests/test_livekit_moderation_rpc_transport.py'
      - '.github/workflows/livekit-moderation-rpc-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livekit-moderation-rpc-transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rpc-transport:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove current stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-moderation-rpc-core-20261002"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current moderation RPC owner $base is not an ancestor of HEAD; synchronize the stacked PR."
            exit 1
          fi
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/livekit-moderation-rpc-transport.yml' \
            'acs/livekit_moderation_rpc_transport.py' \
            'tests/test_livekit_moderation_rpc_transport.py' | sort)"
          test "$changed" = "$allowed"
          git diff --quiet "$base" HEAD -- \
            acs/classroom_moderation_rpc.py \
            acs/classroom_realtime_media.py \
            web/livekit_classroom_media.js \
            acs/classroom_domain.py \
            acs/chesscore.py

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile transport boundary
        run: >-
          python -m py_compile
          acs/livekit_moderation_rpc_transport.py
          tests/test_livekit_moderation_rpc_transport.py

      - name: Run dependency-free transport and canonical RPC contracts
        run: >-
          python -m unittest -v
          tests.test_livekit_moderation_rpc_transport
          tests.test_classroom_moderation_rpc
          tests.test_classroom_realtime_media

      - name: Verify current official realtime SDK wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --dest .livekit-rtc livekit==1.1.19
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import sys

          files = list(Path(".livekit-rtc").glob("*"))
          assert len(files) == 1, files
          file = files[0]
          expected = {
              "linux": (
                  "livekit-1.1.19-py3-none-manylinux_2_28_x86_64.whl",
                  "5716a5194ec3ceec19e25285149c62412e227a1fdb8fd9892411e15a1e24b700",
              ),
              "win32": (
                  "livekit-1.1.19-py3-none-win_amd64.whl",
                  "959b40e7210b302101e563bc59c75e9313dfdf7cb9589407f8d60eba9b0382b3",
              ),
          }[sys.platform]
          assert file.name == expected[0], (file.name, expected[0])
          assert sha256(file.read_bytes()).hexdigest() == expected[1]
          print("LIVEKIT_REALTIME_WHEEL_PIN=PASS", sys.platform)
          PY

      - name: Install exact LiveKit realtime SDK
        run: python -m pip install --disable-pip-version-check -q livekit==1.1.19

      - name: Prove real SDK RPC schema and transport mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import importlib.metadata
          import inspect
          import json
          from types import SimpleNamespace

          from livekit import rtc

          from acs.livekit_moderation_rpc_transport import (
              LIVEKIT_RTC_VERSION,
              LiveKitModerationRpcTransport,
              MODERATION_RPC_ERROR_CODE,
              MODERATION_RPC_METHOD,
          )
          from tests.test_livekit_moderation_rpc_transport import (
              CALLER,
              ROOM,
              SERVICE_ID,
              FakeParticipant,
              ParsingService,
              payload,
          )

          assert importlib.metadata.version("livekit") == "1.1.19"
          assert LIVEKIT_RTC_VERSION == "1.1.19"
          assert callable(rtc.LocalParticipant.register_rpc_method)
          assert callable(rtc.LocalParticipant.unregister_rpc_method)
          signature = inspect.signature(rtc.RpcError)
          assert list(signature.parameters)[:2] == ["code", "message"]
          invocation = inspect.signature(rtc.RpcInvocationData)
          assert "caller_identity" in invocation.parameters
          assert "payload" in invocation.parameters

          participant = FakeParticipant(identity=SERVICE_ID)
          service = ParsingService()
          transport = LiveKitModerationRpcTransport.bind(
              local_participant=participant,
              trusted_room_id=ROOM,
              moderation_participant_identity=SERVICE_ID,
              service=service,
              rtc_module=rtc,
              sdk_version="1.1.19",
          )
          assert transport.method == MODERATION_RPC_METHOD
          handler = participant.handlers[MODERATION_RPC_METHOD]

          response = asyncio.run(
              handler(
                  SimpleNamespace(
                      caller_identity=CALLER,
                      payload=payload(),
                  )
              )
          )
          assert json.loads(response)["accepted_operation_ids"] == ["op-1"]
          assert service.calls[-1][0:2] == (ROOM, CALLER)

          try:
              asyncio.run(
                  handler(
                      SimpleNamespace(
                          caller_identity=CALLER,
                          payload=payload(actor_id="spoofed-teacher"),
                      )
                  )
              )
          except rtc.RpcError as error:
              assert error.code == MODERATION_RPC_ERROR_CODE == 2000
              assert error.message == "moderation actor does not match trusted caller"
              assert error.data is None
          else:
              raise AssertionError("spoofed actor unexpectedly crossed transport")

          transport.close()
          assert transport.closed is True
          print("LIVEKIT_REAL_RPC_TRANSPORT_SCHEMA=PASS")
          PY

      - name: Prove canonical browser/server RPC method remains identical
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MODERATION_RPC_METHOD = "accessible-chess.classroom.moderation.v1"' \
            acs/livekit_moderation_rpc_transport.py
          grep -Fq 'DEFAULT_MODERATION_METHOD = "accessible-chess.classroom.moderation.v1"' \
            web/livekit_classroom_media.js
          grep -Fq 'trusted_caller_identity=caller' acs/livekit_moderation_rpc_transport.py
          grep -Fq 'payload=payload' acs/livekit_moderation_rpc_transport.py
          grep -Fq 'unregister_rpc_method' acs/livekit_moderation_rpc_transport.py
          ! grep -Eq 'os\.(environ|getenv)|LIVEKIT_API_SECRET|LIVEKIT_API_KEY|LIVEKIT_URL' \
            acs/livekit_moderation_rpc_transport.py

      - name: Core selftest
        run: python -m acs.selftest
