name: W2 CB Root Pop Repair Bootstrap

on:
  push:
    branches:
      - work/chessbase-root-pop-repair-20260826

permissions:
  contents: write

concurrency:
  group: w2-cb-root-pop-repair-bootstrap
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/chessbase-root-pop-repair-20260826
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact repair authority
        shell: bash
        run: |
          set -euo pipefail
          base=18961246e1caecb2ead2f56338f0f258a4232e69
          test "$(git merge-base "$base" HEAD)" = "$base"
          test "$(git rev-parse "$base:acs/chessbase_decoder.py")" = "75f8a9a2d4985059c038bf090da869d3c6acae73"
          test "$(git rev-parse HEAD:acs/chessbase_decoder.py)" = "75f8a9a2d4985059c038bf090da869d3c6acae73"
          test "$(git rev-parse "$base:tests/test_chessbase_decoder.py")" = "521d0d55c628170e3f71c92b6c8d09067c3900eb"
          test "$(git rev-parse HEAD:tests/test_chessbase_decoder.py)" = "521d0d55c628170e3f71c92b6c8d09067c3900eb"

      - name: Apply narrow Product repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          decoder = Path("acs/chessbase_decoder.py")
          text = decoder.read_text(encoding="utf-8")
          old = "\n".join([
              '        if kind == "pop":',
              '            if not nested:',
              '                raise _decode_error(',
              '                    "ChessBase decoder returned an unmatched variation pop",',
              '                    ChessBaseDecodeCode.INVALID_VARIATION,',
              '                )',
              '            return line, index + 1',
          ])
          new = "\n".join([
              '        if kind == "pop":',
              '            if not nested:',
              '                # Pinned libcbh emits one terminal MovePop when the root decode',
              '                # returns. Accept only that structural terminator: it must end',
              '                # a non-empty root line. Empty/early root pops remain invalid.',
              '                if index == len(tokens) - 1 and line.moves:',
              '                    return line, index + 1',
              '                raise _decode_error(',
              '                    "ChessBase decoder returned an unmatched variation pop",',
              '                    ChessBaseDecodeCode.INVALID_VARIATION,',
              '                )',
              '            return line, index + 1',
          ])
          if text.count(old) != 1:
              raise SystemExit("decoder repair anchor is not unique/exact")
          decoder.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          tests = Path("tests/test_chessbase_decoder.py")
          text = tests.read_text(encoding="utf-8")
          old = "\n".join([
              '    def test_unmatched_pop_and_unterminated_push_fail_closed(self) -> None:',
              '        for tokens in (',
              '            [{"kind": "pop"}],',
              '            [move(12, 28), {"kind": "push"}, move(50, 34)],',
              '        ):',
              '            with self.subTest(tokens=tokens):',
              '                with self.assertRaises(ChessBaseDecodeError) as caught:',
              '                    self.decode(payload([decoded_game(0, tokens)]))',
              '                self.assertEqual(caught.exception.code, ChessBaseDecodeCode.INVALID_VARIATION)',
          ])
          new = "\n".join([
              '    def test_terminal_root_pop_is_consumed_after_nonempty_root_line(self) -> None:',
              '        game = self.decode(',
              '            payload([decoded_game(0, [move(12, 28), {"kind": "pop"}])])',
              '        ).games[0]',
              '        self.assertEqual([node.san for node in game.line.moves], ["e4"])',
              '',
              '    def test_invalid_root_pop_and_unterminated_push_fail_closed(self) -> None:',
              '        for tokens in (',
              '            [{"kind": "pop"}],',
              '            [move(12, 28), {"kind": "pop"}, move(52, 36)],',
              '            [move(12, 28), {"kind": "push"}, move(50, 34)],',
              '        ):',
              '            with self.subTest(tokens=tokens):',
              '                with self.assertRaises(ChessBaseDecodeError) as caught:',
              '                    self.decode(payload([decoded_game(0, tokens)]))',
              '                self.assertEqual(caught.exception.code, ChessBaseDecodeCode.INVALID_VARIATION)',
          ])
          if text.count(old) != 1:
              raise SystemExit("test repair anchor is not unique/exact")
          tests.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY

      - name: Syntax and focused synthetic contracts
        run: |
          python -m py_compile acs/chessbase_decoder.py tests/test_chessbase_decoder.py
          python -m unittest -v tests.test_chessbase_decoder tests.test_chessbase_adapter tests.test_chessbase_integrity

      - name: Publish exact repair checkpoint and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/w2-cb-root-pop-repair-bootstrap.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/w2-cb-root-pop-repair-bootstrap.yml' 'acs/chessbase_decoder.py' 'tests/test_chessbase_decoder.py' | sort)"
          test "$changed" = "$expected"
          git config user.name 'Accessible Chess Product Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'D04: accept terminal libcbh root pop'
          git push origin HEAD:work/chessbase-root-pop-repair-20260826
