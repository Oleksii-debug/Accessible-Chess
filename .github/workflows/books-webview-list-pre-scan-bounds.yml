name: Books WebView List Pre-Scan Bounds

on:
  pull_request:
    branches:
      - 'fix/book-webview-navigation-render-atomicity-20261003'
    paths:
      - 'acs/book_webview_projection.py'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - '.github/workflows/books-webview-list-pre-scan-bounds.yml'

permissions:
  contents: read

concurrency:
  group: books-webview-list-pre-scan-bounds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-pre-scan-bounds:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='fix/book-webview-navigation-render-atomicity-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/books-webview-list-pre-scan-bounds.yml' \
            'acs/book_webview_projection.py' \
            'tests/test_dev1_books_training_webview_projection.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_webview_projection.py)" = "3200f7c037d11f5194b4068667c1b056a2539806"
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_projection.py)" = "b94d879690c6b236efaff6cd1fca8b6342e5b4d0"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Books projection boundary
        run: >-
          python -m compileall -q
          acs/book_webview_projection.py
          tests/test_dev1_books_training_webview_projection.py

      - name: Prove bounded Books WebView list validation
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_projection
