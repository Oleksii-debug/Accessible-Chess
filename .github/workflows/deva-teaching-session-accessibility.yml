name: DEV-A TeachingSession Accessibility Bridge

on:
  push:
    branches:
      - manual/deva-teaching-session-accessibility-20260823
  pull_request:
    branches:
      - auto/dev2-full-product-core-20260822
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deva-teaching-session-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-safe-teaching-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Exact ancestry and non-overlap scope
        shell: bash
        run: |
          set -euo pipefail
          base=b4dcca10136bf014e7fd326e96cd0bcdfe285af1
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base"...HEAD
          changed="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(.github/workflows/deva-teaching-session-accessibility.yml|acs/teaching_session_adapter.py|tests/test_teaching_session_adapter.py|docs/DEV_A_FINISH_RISK_MATRIX_20260823.md)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "Unexpected overlap paths:"; printf '%s\n' "$unexpected"; exit 1; }
      - name: Compile
        run: python -m compileall -q acs tests
      - name: Focused role-safe TeachingSession adapter
        run: python -m unittest tests.test_teaching_session_adapter -v
      - name: Canonical TeachingSession regressions
        run: python -m unittest tests.test_teaching_session tests.test_teaching_session_adversarial -v
      - name: Canonical Classroom privacy/integrity regressions
        run: python -m unittest tests.test_classroom_domain tests.test_classroom_domain_corruption -v
      - name: Canonical interaction contracts
        run: python -m unittest tests.test_interaction_contracts tests.test_interaction_router -v
      - name: Full unittest discovery
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q
      - name: Selftest
        run: python -m acs.selftest
      - name: Complete WebView2 diagnostic
        run: python tools/complete_user_flow_diagnostic.py
