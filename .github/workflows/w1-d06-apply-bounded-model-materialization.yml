name: W1 D06 Apply Bounded Model Materialization

on:
  push:
    branches:
      - work/w1-d06-bounded-model-materialization-20260907
    paths:
      - .github/workflows/w1-d06-apply-bounded-model-materialization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact bounded-materialization repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roundtrip_path = Path("acs/pgn_roundtrip.py")
          roundtrip = roundtrip_path.read_text(encoding="utf-8")
          old_roundtrip = '''def serialize_pgn_text(games: Iterable[PgnGame]) -> str:
              """Serialize only a bounded model that can be reparsed by the strict codec."""

              try:
                  snapshot = tuple(games)
              except TypeError as exc:
                  raise PgnRoundTripError(
                      "PGN games must be an iterable of PgnGame values",
                      code=PgnRoundTripErrorCode.INVALID_MODEL,
                  ) from exc
              _measure_games(snapshot)
          '''.replace("          ", "")
          new_roundtrip = '''def materialize_pgn_games_bounded(
              games: Iterable[PgnGame],
          ) -> tuple[PgnGame, ...]:
              """Materialize and validate a PGN iterable without reading past D06 limits.

              The count ceiling is enforced while consuming the iterable, before a caller can
              allocate an unbounded tuple/deep copy.  One-shot iterables remain supported and
              an over-limit source is consumed only through the first disallowed item.
              """

              snapshot: list[PgnGame] = []
              try:
                  iterator = iter(games)
                  for index, game in enumerate(iterator):
                      if index >= MAX_PGN_GAMES:
                          _raise_limit(
                              "PGN contains too many games",
                              PgnRoundTripErrorCode.GAME_COUNT_LIMIT,
                          )
                      snapshot.append(game)
              except TypeError as exc:
                  raise PgnRoundTripError(
                      "PGN games must be an iterable of PgnGame values",
                      code=PgnRoundTripErrorCode.INVALID_MODEL,
                  ) from exc

              bounded = tuple(snapshot)
              _measure_games(bounded)
              return bounded


          def serialize_pgn_text(games: Iterable[PgnGame]) -> str:
              """Serialize only a bounded model that can be reparsed by the strict codec."""

              snapshot = materialize_pgn_games_bounded(games)
          '''.replace("          ", "")
          if roundtrip.count(old_roundtrip) != 1:
              raise SystemExit("expected exact serialize_pgn_text materialization block once")
          roundtrip_path.write_text(
              roundtrip.replace(old_roundtrip, new_roundtrip, 1),
              encoding="utf-8",
          )

          workspace_path = Path("acs/pgn_workspace.py")
          workspace = workspace_path.read_text(encoding="utf-8")
          old_import = '''from .pgn_roundtrip import (
              PgnRoundTripError,
              canonical_round_trip_bytes,
              canonical_round_trip_text,
              parse_pgn_text,
              serialize_pgn_bytes,
              serialize_pgn_text,
          )
          '''.replace("          ", "")
          new_import = '''from .pgn_roundtrip import (
              PgnRoundTripError,
              canonical_round_trip_bytes,
              canonical_round_trip_text,
              materialize_pgn_games_bounded,
              parse_pgn_text,
              serialize_pgn_bytes,
              serialize_pgn_text,
          )
          '''.replace("          ", "")
          if workspace.count(old_import) != 1:
              raise SystemExit("expected exact pgn_roundtrip import block once")
          workspace = workspace.replace(old_import, new_import, 1)

          old_validate = '''def _validate_document(games: Iterable[PgnGame]) -> list[PgnGame]:
              try:
                  snapshot = tuple(deepcopy(tuple(games)))
              except TypeError as exc:
                  raise _workspace_error(
                      "PGN workspace requires an iterable of games",
                      PgnWorkspaceErrorCode.INVALID_DOCUMENT,
                  ) from exc
              if not snapshot:
                  raise _workspace_error(
                      "PGN workspace cannot be empty",
                      PgnWorkspaceErrorCode.EMPTY_DOCUMENT,
                  )
              try:
                  text = serialize_pgn_text(snapshot)
                  reparsed = parse_pgn_text(text, strict=True)
              except PgnRoundTripError as exc:
                  raise _workspace_error(
                      "PGN document is not strict round-trip safe",
                      PgnWorkspaceErrorCode.INVALID_DOCUMENT,
                  ) from exc
          '''.replace("          ", "")
          new_validate = '''def _validate_document(games: Iterable[PgnGame]) -> list[PgnGame]:
              try:
                  bounded = materialize_pgn_games_bounded(games)
              except PgnRoundTripError as exc:
                  raise _workspace_error(
                      "PGN document exceeds strict model/resource bounds",
                      PgnWorkspaceErrorCode.INVALID_DOCUMENT,
                  ) from exc
              if not bounded:
                  raise _workspace_error(
                      "PGN workspace cannot be empty",
                      PgnWorkspaceErrorCode.EMPTY_DOCUMENT,
                  )
              try:
                  snapshot = tuple(deepcopy(bounded))
              except TypeError as exc:
                  raise _workspace_error(
                      "PGN workspace requires an iterable of games",
                      PgnWorkspaceErrorCode.INVALID_DOCUMENT,
                  ) from exc
              try:
                  text = serialize_pgn_text(snapshot)
                  reparsed = parse_pgn_text(text, strict=True)
              except PgnRoundTripError as exc:
                  raise _workspace_error(
                      "PGN document is not strict round-trip safe",
                      PgnWorkspaceErrorCode.INVALID_DOCUMENT,
                  ) from exc
          '''.replace("          ", "")
          if workspace.count(old_validate) != 1:
              raise SystemExit("expected exact _validate_document prefix once")
          workspace_path.write_text(
              workspace.replace(old_validate, new_validate, 1),
              encoding="utf-8",
          )

          Path(".github/workflows/w1-d06-apply-bounded-model-materialization.yml").unlink()
          PY
      - name: Validate repair before commit
        run: |
          python -m compileall -q acs/pgn_roundtrip.py acs/pgn_workspace.py tests/test_w1_d06_bounded_model_materialization.py
          python -m unittest -v tests.test_w1_d06_bounded_model_materialization tests.test_d06_pgn_roundtrip
          git diff --check
      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(d06): bound model materialization before allocation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
