name: V2 Windows Upgrade Status

on:
  push:
    branches:
      - work/v2-windows-upgrade-status-adapter-20260831
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_windows_upgrade_status.py'
      - 'tests/test_v2_windows_upgrade_status.py'
      - '.github/workflows/v2-windows-upgrade-status.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-upgrade-status-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_PRODUCT_BASE: 7580f614a2d422a4af8120a4ee33264d78cf1502
  SOURCE_HEAD: b6ed6ae4d7e0adead615ece0ef2e7504345028fa
  SOURCE_ADAPTER_BLOB: 9fb7d1521f3387316e399d63ae81504957710b09
  SOURCE_TEST_BLOB: 3c55d1e85724d0473e8e282d65294ae19040b22c

jobs:
  upgrade-status:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current-product reconvergence and owner isolation
        shell: bash
        run: |
          set -euo pipefail
          for commit in "$CURRENT_PRODUCT_BASE" "$SOURCE_HEAD"; do
            git cat-file -e "${commit}^{commit}" || git fetch --no-tags origin "$commit"
          done
          git merge-base --is-ancestor "$CURRENT_PRODUCT_BASE" HEAD
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          test "$(git rev-parse HEAD^)" = "$CURRENT_PRODUCT_BASE"
          git diff --check "$CURRENT_PRODUCT_BASE" HEAD
          changed="$(git diff --name-only "$CURRENT_PRODUCT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-upgrade-status.yml' \
            'acs/version2_windows_upgrade_status.py' \
            'tests/test_v2_windows_upgrade_status.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/version2_windows_upgrade_status.py)" = "$SOURCE_ADAPTER_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_upgrade_status.py)" = "$SOURCE_TEST_BLOB"
          for path in \
            acs/version2_upgrade.py \
            acs/acsdb.py \
            acs/settings.py \
            acs/version2_application.py \
            acs/version2_release_ui.py \
            run_accessible_chess_v2.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$CURRENT_PRODUCT_BASE:$path")"
          done

      - name: Compile adapter package
        run: >-
          python -m compileall -q
          acs/version2_windows_upgrade_status.py
          tests/test_v2_windows_upgrade_status.py

      - name: Focused accessible adapter and current canonical upgrade contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_upgrade_status
          tests.test_v2_upgrade_tracked_writer_conflict
          tests.test_v2_upgrade_current_acsdb_identity_audit
          tests.test_v2_upgrade_v6_successor
          tests.test_version2_upgrade
          tests.test_version2_upgrade_recovery_integrity
          tests.test_version2_upgrade_stale_writer

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_upgrade_status.py
          tests/test_v2_upgrade_tracked_writer_conflict.py
          tests/test_v2_upgrade_current_acsdb_identity_audit.py
          tests/test_v2_upgrade_v6_successor.py
          tests/test_version2_upgrade.py
          tests/test_version2_upgrade_recovery_integrity.py
          tests/test_version2_upgrade_stale_writer.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and final-product diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic
