name: D07 Canonical PGN Ingress Final-Product Convergence

on:
  pull_request:
    paths:
      - 'acs/acsdb.py'
      - 'acs/duplicate_detection.py'
      - 'tests/test_d07_canonical_ingress_successor.py'
      - 'tests/test_dev4_import_history_error_privacy.py'
      - 'tests/test_v2_d07_ingress_convergence_after_dedupe_audit.py'
      - '.github/workflows/d07-canonical-ingress-final-product-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d07-canonical-ingress-final-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact convergence ancestry scope and source blobs
        shell: bash
        env:
          CANONICAL_BASE_SHA: ac3fc9b8c91741188d511f1e87d5ce25043a9ecf
          SOURCE_HEAD_SHA: ee5e53a552837279f043d2390e2fa46a2d01a10a
        run: |
          set -euo pipefail
          test -n "${GITHUB_BASE_REF:-}"
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          test "$base" = "$CANONICAL_BASE_SHA"
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git merge-base --is-ancestor "$CANONICAL_BASE_SHA" HEAD
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" HEAD
          git diff --check "$CANONICAL_BASE_SHA" HEAD
          changed="$(git diff --name-only "$CANONICAL_BASE_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d07-canonical-ingress-final-product-convergence.yml' \
            'acs/acsdb.py' \
            'acs/duplicate_detection.py' \
            'tests/test_d07_canonical_ingress_successor.py' \
            'tests/test_dev4_import_history_error_privacy.py' \
            'tests/test_v2_d07_ingress_convergence_after_dedupe_audit.py' | sort)"
          test "$changed" = "$expected"
          for path in \
            acs/acsdb.py \
            acs/duplicate_detection.py \
            tests/test_d07_canonical_ingress_successor.py \
            tests/test_dev4_import_history_error_privacy.py \
            tests/test_v2_d07_ingress_convergence_after_dedupe_audit.py
          do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_HEAD_SHA:$path")"
          done

      - name: Compile converged D07 surfaces
        run: >-
          python -m compileall -q
          acs/acsdb.py
          acs/duplicate_detection.py
          tests/test_d07_canonical_ingress_successor.py
          tests/test_dev4_import_history_error_privacy.py
          tests/test_v2_d07_ingress_convergence_after_dedupe_audit.py

      - name: Focused canonical D06 and D07 regressions
        run: >-
          python -m unittest -v
          tests.test_d07_canonical_ingress_successor
          tests.test_v2_d07_ingress_convergence_after_dedupe_audit
          tests.test_acsdb
          tests.test_duplicate_detection
          tests.test_game_identity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d06_pgn_roundtrip
          tests.test_d06_file_ingress_nag_normalization
          tests.test_dev4_import_history_error_privacy
          tests.test_version2_formats_integration

      - name: Final-product production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: SELFTEST
        run: python -m acs.selftest

      - name: Broad repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Broad repository pytest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pytest -q
