name: Current Visual Packs UI Contract

on:
  pull_request:
    branches:
      - work/current-visual-packs-20260926
    paths:
      - 'acs/visual_board_webview.py'
      - 'acs/teacher_webview_projection.py'
      - 'acs/teacher_webview_bridge.py'
      - 'acs/version2_final_product_application.py'
      - 'web/full_product_teacher.js'
      - 'tests/test_visual_board_webview.py'
      - 'tests/test_dev1_teacher_webview_projection.py'
      - 'tests/test_teacher_webview_bridge.py'
      - 'tests/test_version2_teacher_session_runtime_binding.py'
      - 'tests/js/teacher_surface_dom_test.js'
      - '.github/workflows/current-visual-packs-ui-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "\${{ github.event.pull_request.head.sha }}"
          base="\${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-visual-packs-ui-contract.yml' \
            'acs/teacher_webview_bridge.py' \
            'acs/teacher_webview_projection.py' \
            'acs/version2_final_product_application.py' \
            'acs/visual_board_webview.py' \
            'tests/js/teacher_surface_dom_test.js' \
            'tests/test_dev1_teacher_webview_projection.py' \
            'tests/test_teacher_webview_bridge.py' \
            'tests/test_version2_teacher_session_runtime_binding.py' \
            'tests/test_visual_board_webview.py' \
            'web/full_product_teacher.js' | sort)"
          test "$changed" = "$expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile visual UI authority
        run: >-
          python -m py_compile
          acs/visual_preferences.py
          acs/visual_pack_store.py
          acs/visual_board_webview.py
          acs/teacher_webview_projection.py
          acs/teacher_webview_bridge.py
          acs/version2_final_product_application.py
          tests/test_current_visual_packs.py
          tests/test_visual_board_webview.py
          tests/test_dev1_teacher_webview_projection.py
          tests/test_teacher_webview_bridge.py
          tests/test_version2_teacher_session_runtime_binding.py
      - name: Execute visual and Teacher Python regressions
        run: >-
          python -m unittest -v
          tests.test_current_visual_packs
          tests.test_visual_board_webview
          tests.test_dev1_teacher_webview_projection
          tests.test_teacher_webview_bridge
          tests.test_version2_teacher_session_runtime_binding
          tests.test_version2_final_product_composition
          tests.test_d09_teacher_canonical_webview_composition
      - name: Execute Teacher DOM accessibility regression
        run: node tests/js/teacher_surface_dom_test.js
