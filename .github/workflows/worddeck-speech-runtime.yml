name: WordDeck speech runtime foundation

on:
  pull_request:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/SpeechPracticeRuntime.cs'
      - 'WordDeck/SpeechPracticeRuntimeSelfTest.cs'
      - 'WordDeck/WindowsMicrophoneCaptureProvider.cs'
      - 'WordDeck/WindowsMicrophoneCaptureProviderSelfTest.cs'
      - 'WordDeckSpeechRuntimeHarness/**'
      - '.github/workflows/worddeck-speech-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speech-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run isolated speech runtime and Windows capture self-tests
        run: dotnet run --project WordDeckSpeechRuntimeHarness/WordDeckSpeechRuntimeHarness.csproj --configuration Release

      - name: Build WordDeck Windows application
        run: dotnet build WordDeck/WordDeck.csproj --configuration Release
