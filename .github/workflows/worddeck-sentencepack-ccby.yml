name: WordDeck attributed SentencePack build

on:
  push:
    branches: [worddeck-bootstrap]
    paths:
      - '.github/workflows/worddeck-sentencepack-ccby.yml'
      - 'WordDeck/tools/build_tatoeba_ccby_pairs.py'
      - 'WordDeck/tools/resolve_sentence_coverage_gaps.py'
      - 'WordDeck/tools/analyze_sentence_gap_occurrence.py'
      - 'WordDeck/QA/sentence_coverage_gaps_20260817.txt'
      - 'WordDeck/TatoebaImportProvenance.cs'
      - 'WordDeck/TatoebaSentencePackBuilder.cs'
      - 'WordDeck/SentencePackDiagnostics.cs'
      - 'WordDeck/SentencePackIo.cs'
      - 'WordDeck/SentencePackSqlitePrototype.cs'
      - 'WordDeck/SentencePackSqliteCorpus.cs'
      - 'WordDeck/DictionaryLoader.cs'
      - 'WordDeck/WordDeck.csproj'
      - 'WordDeck/Program.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-attributed-pack:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout worddeck branch
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate attributed pair builder and gap QA tools
        shell: pwsh
        run: |
          python .\WordDeck\tools\build_tatoeba_ccby_pairs.py --self-test
          python .\WordDeck\tools\resolve_sentence_coverage_gaps.py --self-test
          python .\WordDeck\tools\analyze_sentence_gap_occurrence.py --self-test

      - name: Restore build and regression test
        shell: pwsh
        run: |
          dotnet restore .\WordDeck\WordDeck.csproj
          dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Download detailed exports and build attributed EN-UA pairs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\sentencepack-ccby | Out-Null
          python .\WordDeck\tools\build_tatoeba_ccby_pairs.py `
            --download-dir .\sentencepack-ccby\upstream `
            --output .\sentencepack-ccby\tatoeba-en-uk-ccby.tsv `
            --manifest .\sentencepack-ccby\tatoeba-en-uk-ccby.tsv.manifest.json

      - name: Measure exact corpus occurrence for unresolved Oxford gaps
        shell: pwsh
        run: |
          python .\WordDeck\tools\resolve_sentence_coverage_gaps.py `
            --output .\sentencepack-ccby\resolved-sentence-coverage-gaps.tsv
          python .\WordDeck\tools\analyze_sentence_gap_occurrence.py `
            --resolved .\sentencepack-ccby\resolved-sentence-coverage-gaps.tsv `
            --pairs .\sentencepack-ccby\tatoeba-en-uk-ccby.tsv `
            --output .\sentencepack-ccby\sentence-gap-exact-occurrence.tsv

          $rows = @(Import-Csv .\sentencepack-ccby\sentence-gap-exact-occurrence.tsv -Delimiter "`t")
          if ($rows.Count -ne 188) { throw "Expected 188 gap rows, got $($rows.Count)" }
          $single = @($rows | Where-Object { $_.structural_class -eq 'single_surface_indexable' })
          if ($single.Count -ne 114) { throw "Expected 114 single-surface gaps, got $($single.Count)" }
          $unmeasuredSingle = @($single | Where-Object { $_.exact_sentence_match_count -eq '' })
          if ($unmeasuredSingle.Count -ne 0) { throw "$($unmeasuredSingle.Count) single-surface gaps were not measured" }
          $presentSingle = @($single | Where-Object { [int]$_.exact_sentence_match_count -gt 0 }).Count
          $absentSingle = @($single | Where-Object { [int]$_.exact_sentence_match_count -eq 0 }).Count
          Write-Host "Single-surface exact occurrence: present=$presentSingle absent=$absentSingle total=$($single.Count)"

      - name: Build attributed WordDeck SentencePack
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --build-tatoeba-sentence-pack `
            .\sentencepack-ccby\tatoeba-en-uk-ccby.tsv `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json `
            "tatoeba-en-uk-ccby-$stamp" 2>&1 | Tee-Object -FilePath .\sentencepack-ccby\builder.log

      - name: Validate attribution and write coverage report
        shell: pwsh
        run: |
          $packPath = '.\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json'
          $pack = Get-Content $packPath -Raw | ConvertFrom-Json
          if ($pack.License -ne 'CC BY 2.0 FR') { throw "Unexpected license: $($pack.License)" }
          if ($pack.Sentences.Count -lt 1) { throw 'Attributed pack contains no accepted sentences.' }
          $missingAttribution = @($pack.Sentences | Where-Object { $_.Source -notmatch 'English sentence #[0-9]+ by .+; Ukrainian sentence #[0-9]+ by .+' }).Count
          if ($missingAttribution -ne 0) { throw "$missingAttribution accepted sentences are missing per-side author attribution." }

          $targetRefs = @($pack.Sentences | ForEach-Object { $_.TargetEntryIds } | Where-Object { $_ } | Sort-Object -Unique)
          $twoTargetReady = @($pack.Sentences | Where-Object { @($_.TargetEntryIds | Sort-Object -Unique).Count -ge 2 }).Count
          $threeTargetReady = @($pack.Sentences | Where-Object { @($_.TargetEntryIds | Sort-Object -Unique).Count -ge 3 }).Count
          $qualityFlagged = @($pack.Sentences | Where-Object { @($_.QualityFlags).Count -gt 0 }).Count
          $report = [ordered]@{
            generated_utc = (Get-Date).ToUniversalTime().ToString('o')
            pack_id = $pack.PackId
            license = $pack.License
            sentences = $pack.Sentences.Count
            unique_indexed_oxford_entry_ids = $targetRefs.Count
            sentences_with_at_least_2_target_ids = $twoTargetReady
            sentences_with_at_least_3_target_ids = $threeTargetReady
            quality_flagged_sentences = $qualityFlagged
            sentences_missing_per_side_author_attribution = $missingAttribution
            note = 'Coverage is against the current embedded 3308-entry Oxford package. Every accepted record keeps both Tatoeba usernames and upstream sentence IDs.'
          }
          $report | ConvertTo-Json | Set-Content .\sentencepack-ccby\coverage-report.json -Encoding utf8
          $report | Format-List

      - name: Compress distributable SentencePack with .NET gzip
        shell: pwsh
        run: |
          $source = Resolve-Path '.\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json'
          $destination = '.\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json.gz'
          $input = [System.IO.File]::OpenRead($source)
          try {
            $output = [System.IO.File]::Create($destination)
            try {
              $gzip = [System.IO.Compression.GZipStream]::new($output, [System.IO.Compression.CompressionLevel]::SmallestSize, $false)
              try { $input.CopyTo($gzip) } finally { $gzip.Dispose() }
            } finally { $output.Dispose() }
          } finally { $input.Dispose() }

          $rawBytes = (Get-Item $source).Length
          $gzipBytes = (Get-Item $destination).Length
          if ($gzipBytes -le 0 -or $gzipBytes -ge $rawBytes) { throw "Unexpected gzip size: raw=$rawBytes gzip=$gzipBytes" }
          $compression = [Math]::Round((1 - ($gzipBytes / [double]$rawBytes)) * 100, 2)
          $sizeReport = [ordered]@{
            raw_bytes = $rawBytes
            gzip_bytes = $gzipBytes
            reduction_percent = $compression
            format = 'gzip (System.IO.Compression.GZipStream)'
          }
          $sizeReport | ConvertTo-Json | Set-Content .\sentencepack-ccby\compression-report.json -Encoding utf8
          $sizeReport | Format-List

      - name: Build SQLite prototype and measure eager baseline
        shell: pwsh
        run: |
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-sentence-pack `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json.gz `
            .\sentencepack-ccby\load-diagnostics.json `
            --sqlite `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.sqlite `
            oxford-a1-0711
          $diagnostics = Get-Content .\sentencepack-ccby\load-diagnostics.json -Raw | ConvertFrom-Json
          if ($diagnostics.Sentences -ne 207578) { throw "Unexpected measured sentence count: $($diagnostics.Sentences)" }
          if ($diagnostics.ElapsedMilliseconds -le 0) { throw 'SentencePack load measurement did not produce a positive duration.' }
          if ($null -eq $diagnostics.SqlitePrototype) { throw 'SQLite prototype diagnostics are missing.' }
          if ($diagnostics.SqlitePrototype.DatabaseBytes -le 0) { throw 'SQLite prototype database was not created.' }
          if ($diagnostics.SqlitePrototype.ResultCount -lt 1) { throw 'Representative SQLite target query returned no sentences.' }

      - name: Measure SQLite query in a fresh process
        shell: pwsh
        run: |
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-sentence-pack `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.sqlite `
            .\sentencepack-ccby\sqlite-query-diagnostics.json `
            oxford-a1-0711
          $query = Get-Content .\sentencepack-ccby\sqlite-query-diagnostics.json -Raw | ConvertFrom-Json
          if ($query.DatabaseBytes -le 0) { throw 'SQLite query-only measurement did not see a valid database.' }
          if ($query.QueryMilliseconds -lt 0) { throw 'SQLite query timing is invalid.' }
          if ($query.ManagedBytesDelta -lt 0) { throw 'SQLite query managed-memory measurement is invalid.' }
          if ($query.ResultCount -lt 1) { throw 'Representative fresh-process SQLite query returned no sentences.' }
          $query | Format-List

      - name: Measure actual Sentence Coach coverage and query path
        shell: pwsh
        run: |
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-sentence-pack `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.sqlite `
            .\sentencepack-ccby\sentence-coach-runtime-diagnostics.json `
            --runtime
          $runtime = Get-Content .\sentencepack-ccby\sentence-coach-runtime-diagnostics.json -Raw | ConvertFrom-Json
          if ($runtime.SentenceCount -ne 207578) { throw "Unexpected runtime sentence count: $($runtime.SentenceCount)" }
          if ($runtime.ScopeEntryCount -ne 3308) { throw "Unexpected Oxford scope size: $($runtime.ScopeEntryCount)" }
          if ($runtime.OneTargetCoveredEntries -lt 3120) { throw "One-target coverage regressed below verified baseline 3120: $($runtime.OneTargetCoveredEntries)" }
          if ($runtime.TwoTargetCoveredEntries -lt 3114) { throw "Two-target coverage regressed below verified baseline 3114: $($runtime.TwoTargetCoveredEntries)" }
          if ($runtime.ManagedBytesDelta -lt 0) { throw 'Runtime managed-memory measurement is invalid.' }
          $runtime | Format-List

      - name: Upload attributed SentencePack artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-Tatoeba-EN-UA-Attributed-SentencePack
          path: |
            sentencepack-ccby/tatoeba-en-uk-ccby-sentencepack.json.gz
            sentencepack-ccby/tatoeba-en-uk-ccby.tsv.manifest.json
            sentencepack-ccby/coverage-report.json
            sentencepack-ccby/resolved-sentence-coverage-gaps.tsv
            sentencepack-ccby/sentence-gap-exact-occurrence.tsv
            sentencepack-ccby/compression-report.json
            sentencepack-ccby/load-diagnostics.json
            sentencepack-ccby/sqlite-query-diagnostics.json
            sentencepack-ccby/sentence-coach-runtime-diagnostics.json
            sentencepack-ccby/builder.log
          if-no-files-found: error
          retention-days: 30
