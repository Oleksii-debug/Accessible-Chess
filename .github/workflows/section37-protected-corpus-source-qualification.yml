name: Section 37 protected corpus-source qualification

on:
  pull_request:
    paths:
      - 'acs/lawful_corpus_registry.py'
      - 'docs/corpus/revised_sections37_40_sources.json'
      - 'docs/corpus/SECTION37_GITENBERG_ORIGINAL_TEXT_SHA256_READBACK_20261009.json'
      - 'tools/revised_section37_*.py'
      - 'tests/test_revised_section37_cbh_original_family_inventory.py'
      - 'tests/test_revised_section37_external_book_acquisition.py'
      - 'tests/test_revised_section37_external_position_acquisition.py'
      - 'tests/test_revised_section37_offline_collection_readback.py'
      - 'tests/test_revised_section37_real_book_txt.py'
      - 'tests/test_revised_section37_release_exclusion.py'
      - 'tests/real_corpus/books/gitenberg_capablanca_33870.txt'
      - '.github/workflows/section37-protected-corpus-source-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section37-protected-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  protected-source-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Checkout original Capablanca source into ephemeral test workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GITenberg/Chess-Fundamentals_33870
          ref: 6d533e519e965dfb29df2b5c053cab3b3a5685dd
          path: _section37_source_only
          fetch-depth: 1
      - name: Checkout original Staunton source at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GITenberg/The-Blue-Book-of-Chess--13-Teaching-the-Rudiments-of-the-Game-and-Giving-an-Analysis-of-All-t__16377
          ref: c115db676b0b1badba555d4f8e962cb1e45b1e8d
          path: _section37_external_books/blue
          fetch-depth: 1
      - name: Checkout original Bird source at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GITenberg/Chess-History-and-Reminiscences_4902
          ref: 4366012e90c7ad5d8a182c4b096394beea7b670d
          path: _section37_external_books/bird
          fetch-depth: 1
      - name: Checkout original Fishburne source at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GITenberg/Checkmates-for-Three-Pieces_4542
          ref: 0c76a71377ef42fb7e9446281bf29b1be187c0ab
          path: _section37_external_books/checkmates
          fetch-depth: 1
      - name: Verify source SHA, Git blob, size and stage untracked test-only original
        run: >-
          python -c "import hashlib,pathlib; p=pathlib.Path('_section37_source_only/33870.txt'); b=p.read_bytes(); assert len(b)==262824; assert hashlib.sha256(b).hexdigest()=='dfbd48d5b513ea45f07a3701a9148b7aa2a473080a82f39728dbd62b5019c160'; assert hashlib.sha1(b'blob '+str(len(b)).encode()+bytes([0])+b).hexdigest()=='c9a674d3281ccd8a39de7ca673467b79902a103a'; q=pathlib.Path('tests/real_corpus/books/gitenberg_capablanca_33870.txt'); q.parent.mkdir(parents=True,exist_ok=True); q.write_bytes(b)"
      - name: Compile preserved original Section 37 modules and tests
        run: >-
          python -m py_compile
          acs/lawful_corpus_registry.py
          tools/revised_section37_external_book_acquisition.py
          tools/revised_section37_external_position_acquisition.py
          tools/revised_section37_cbh_original_family_inventory.py
          tools/revised_section37_release_exclusion.py
          tools/revised_section37_real_cc0_readback.py
          tests/test_revised_section37_external_book_acquisition.py
          tests/test_revised_section37_external_position_acquisition.py
          tests/test_revised_section37_cbh_original_family_inventory.py
          tests/test_revised_section37_release_exclusion.py
          tests/test_revised_section37_offline_collection_readback.py
          tests/test_revised_section37_real_book_txt.py
      - name: Run existing source authenticity, denial, rights and recovery unit tests
        env:
          ACS_37_GITENBERG_ROOT: ${{ github.workspace }}/_section37_external_books
        run: >-
          python -m unittest -v
          tests.test_revised_section37_external_book_acquisition
          tests.test_revised_section37_external_position_acquisition
          tests.test_revised_section37_cbh_original_family_inventory
          tests.test_revised_section37_release_exclusion
          tests.test_revised_section37_offline_collection_readback
          tests.test_revised_section37_real_book_txt
