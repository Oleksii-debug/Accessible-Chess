name: Current PGN Accessible Labels and Resource Bounds

on:
  pull_request:
    paths:
      - 'acs/full_product_presenters.py'
      - 'acs/pgn_presenter_graph_guard.py'
      - 'tests/test_pgn_presenter_graph_safety_current.py'
      - 'tests/test_dev1_pgn_webview_projection.py'
      - '.github/workflows/current-pgn-accessible-label-resource-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-pgn-accessible-label-resource-bounds-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'CURRENT_PGN_ACCESSIBLE_LABELS_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }
          echo 'CURRENT_PGN_ACCESSIBLE_LABELS_EXACT_HEAD=PASS'

      - name: Prove exact current Product ancestry and bounded scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_PRODUCT: c1b203dbb0cce877e1f48244e9379bfde6d3a3b0
          CURRENT_PRODUCT_REF: fix/current-san-boundary-20261005-sol56r3k9
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRESENTER_BLOB: 412e37aa089659d8f46a82471d1d92a58ed21115
          GUARD_BLOB: 327446465c048cf418ef2e3fdb206488a7c524c0
          GRAPH_TEST_BLOB: 6ac1bc63650602b820fa9a1bff5f7f2d0086beff
          WEBVIEW_TEST_BLOB: 857346eb082305194fe559f44a27a8a15640bc77
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$EVENT_BASE_REF" = "$CURRENT_PRODUCT_REF" || {
              printf 'CURRENT_PGN_ACCESSIBLE_LABELS_BASE_REF_CHANGED expected=%s event=%s\n' "$CURRENT_PRODUCT_REF" "$EVENT_BASE_REF" >&2
              exit 1
            }
          fi

          git fetch --no-tags origin "refs/heads/$CURRENT_PRODUCT_REF"
          live_product="$(git rev-parse FETCH_HEAD)"
          test "$live_product" = "$CURRENT_PRODUCT" || {
            printf 'CURRENT_PGN_ACCESSIBLE_LABELS_PRODUCT_MOVED expected=%s live=%s\n' "$CURRENT_PRODUCT" "$live_product" >&2
            exit 1
          }

          test "$(git merge-base "$CURRENT_PRODUCT" HEAD)" = "$CURRENT_PRODUCT"
          git diff --check "$CURRENT_PRODUCT"...HEAD

          changed="$(git diff --name-only "$CURRENT_PRODUCT"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-pgn-accessible-label-resource-bounds.yml' \
            'acs/full_product_presenters.py' \
            'acs/pgn_presenter_graph_guard.py' \
            'tests/test_dev1_pgn_webview_projection.py' \
            'tests/test_pgn_presenter_graph_safety_current.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected current PGN accessible-label scope:\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/full_product_presenters.py)" = "$PRESENTER_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_presenter_graph_guard.py)" = "$GUARD_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_presenter_graph_safety_current.py)" = "$GRAPH_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev1_pgn_webview_projection.py)" = "$WEBVIEW_TEST_BLOB"
          echo 'CURRENT_PGN_ACCESSIBLE_LABELS_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile PGN presentation surfaces
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          acs/pgn_presenter_graph_guard.py
          tests/test_pgn_presenter_graph_safety_current.py
          tests/test_dev1_pgn_webview_projection.py

      - name: Execute focused PGN semantic and recovery regressions
        run: >-
          python -m unittest -v
          tests.test_notation
          tests.test_pgn_presenter_graph_safety_current
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_webview_atomicity
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_pgn_browser_presentation_lease_required
          tests.test_pgn_post_commit_presentation_recovery_current
          tests.test_pgn_tree_remaining_keybindings
          tests.test_v2_pgn_webview_path_privacy

      - name: Core selftest
        run: python -m acs.selftest
