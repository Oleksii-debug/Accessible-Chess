name: D04 CBH Backend Immutability

on:
  push:
    branches:
      - work/d04-cbh-backend-immutability-20260907
  pull_request:
    paths:
      - '.github/workflows/d04-cbh-backend-immutability.yml'
      - 'acs/chessbase_library_import.py'
      - 'tests/test_d04_cbh_backend_immutability.py'

permissions:
  contents: read

concurrency:
  group: d04-cbh-backend-immutability-${{ github.ref }}
  cancel-in-progress: true

env:
  D04_BASE: 5cf9f615d3fc2e28a02a1c27e6fd3bb6478ba145

jobs:
  backend-immutability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove ancestry and narrow D04 scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.sha }}" = "$D04_BASE" || {
              echo "D04_BACKEND_IMMUTABILITY_BASE_MOVED expected=$D04_BASE live=${{ github.event.pull_request.base.sha }}" >&2
              exit 1
            }
          fi
          git merge-base --is-ancestor "$D04_BASE" HEAD
          test "$(git merge-base "$D04_BASE" HEAD)" = "$D04_BASE"
          git diff --check "$D04_BASE" HEAD
          changed="$(git diff --name-only "$D04_BASE" HEAD | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/d04-cbh-backend-immutability.yml \
            acs/chessbase_library_import.py \
            tests/test_d04_cbh_backend_immutability.py | sort)"
          test "$changed" = "$allowed" || {
            printf 'Unexpected D04 scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Compile affected Python
        run: >-
          python -m py_compile
          acs/chessbase_library_import.py
          tests/test_d04_cbh_backend_immutability.py
          tests/test_chessbase_decoder.py
          tests/test_chessbase_active_import_cancellation.py
          tests/test_v2_chess960_cbv_runtime_inheritance.py

      - name: Focused backend immutability regressions
        run: >-
          python -m unittest -v
          tests.test_d04_cbh_backend_immutability
          tests.test_chessbase_decoder
          tests.test_chessbase_active_import_cancellation
          tests.test_v2_chess960_cbv_runtime_inheritance
          tests.test_cbv_extractor

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_d04_cbh_backend_immutability.py
          tests/test_chessbase_decoder.py
          tests/test_chessbase_active_import_cancellation.py
          tests/test_v2_chess960_cbv_runtime_inheritance.py
          tests/test_cbv_extractor.py

      - name: Full unittest regression
        run: python -m unittest discover -s tests -v

      - name: Full pytest regression
        run: python -m pytest -q
