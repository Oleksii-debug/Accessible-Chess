name: Accessible Chess V2 DEV09 CBH Annotations Variations

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - '.github/workflows/v2-dev09-cbh-annotations-variations.yml'
      - 'tools/optional/libcbh_json_bridge.cpp'
      - 'tests/test_v2_dev09_cbh_annotations_variations.py'
      - 'tests/test_v2_dev09_cbh_current_product_workflow.py'
      - 'docs/automation/V2_CBH_ANNOTATION_CAPABILITY.json'
  push:
    branches:
      - 'work/v2-dev09-cbh-annotations-variations-20260831'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-dev09-cbh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696

jobs:
  real-cbh-annotations-variations:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact D09 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact current-Product ancestry and D09-only scope
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          product_branch='work/full-product-teacher-education-reachability-20260911'
          git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
          product="$(git rev-parse "refs/remotes/origin/$product_branch")"
          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD

          actual="$(git diff --name-only "$product...HEAD" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/v2-dev09-cbh-annotations-variations.yml' \
            'docs/automation/V2_CBH_ANNOTATION_CAPABILITY.json' \
            'tests/test_v2_dev09_cbh_annotations_variations.py' \
            'tests/test_v2_dev09_cbh_current_product_workflow.py' \
            'tools/optional/libcbh_json_bridge.cpp' | LC_ALL=C sort)"
          test "$actual" = "$expected_paths"

          git diff --quiet "$product" HEAD -- \
            acs/chessbase_decoder.py acs/chesscore.py acs/gametree.py \
            acs/pgn_service.py acs/acsdb.py acs/version2_application.py \
            acs/version2_release_app.py acs/version2_package_preflight.py
          printf 'D09_PRODUCT=%s\nD09_HEAD=%s\n' "$product" "$(git rev-parse HEAD)"

      - name: Checkout pinned lawful libcbh corpus
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Run current-Product D09 workflow contract
        working-directory: product
        run: python -m unittest -v tests.test_v2_dev09_cbh_current_product_workflow

      - name: Build pinned libcbh and D09 bridge
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge
          sha256sum \
            upstream/libcbh/gtest/Annotation/TestBase.cbh \
            upstream/libcbh/gtest/Annotation/TestBaseExport.pgn \
            upstream/libcbh/gtest/WithVariations/WithVariations.cbh \
            upstream/libcbh/gtest/WithVariations/GamesWithVariations.pgn \
            upstream/libcbh/gtest/UnusualStart/UnusualStartBytes.cbh \
            upstream/libcbh/gtest/UnusualStart/UnusualStart.pgn

      - name: Compile Product and D09 tests
        working-directory: product
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Run independent real CBH D09 oracle
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_ANNOTATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/Annotation
          LIBCBH_VARIATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
          LIBCBH_UNUSUAL_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/UnusualStart
        run: python -m unittest -v tests.test_v2_dev09_cbh_annotations_variations

      - name: Existing real WithVariations oracle
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_FIXTURE_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
        run: python -m unittest -v tests.test_chessbase_libcbh_external_fixture

      - name: Focused ChessBase Library PGN regressions
        working-directory: product
        run: >-
          python -m unittest -v
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_version2_formats_integration
          tests.test_library_import_ui_integration
          tests.test_pgn_document

      - name: Full repository unittest
        working-directory: product
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        working-directory: product
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        working-directory: product
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact D09 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve frozen committed bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - name: Prove exact current-Product ancestry and D09-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          product_branch='work/full-product-teacher-education-reachability-20260911'
          git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
          product="$(git rev-parse "refs/remotes/origin/$product_branch")"
          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD

          actual="$(git diff --name-only "$product...HEAD" | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/v2-dev09-cbh-annotations-variations.yml' \
            'docs/automation/V2_CBH_ANNOTATION_CAPABILITY.json' \
            'tests/test_v2_dev09_cbh_annotations_variations.py' \
            'tests/test_v2_dev09_cbh_current_product_workflow.py' \
            'tools/optional/libcbh_json_bridge.cpp' | LC_ALL=C sort)"
          test "$actual" = "$expected_paths"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install regression dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Run current-Product D09 workflow contract on Windows
        run: python -m unittest -v tests.test_v2_dev09_cbh_current_product_workflow

      - name: Focused Product regressions
        run: >-
          python -m unittest -v
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_version2_formats_integration
          tests.test_library_import_ui_integration
          tests.test_pgn_document

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
