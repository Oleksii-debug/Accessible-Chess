name: Books Progress Backup Recovery

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_application.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_windows_native_dialog_ownership.py'
      - 'tests/test_version2_application.py'
      - 'tests/test_v2_native_dialog_language.py'
      - '.github/workflows/books-progress-backup-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-progress-backup-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact candidate and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          product_branch='work/full-product-teacher-education-reachability-20260911'
          git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
          product="$(git rev-parse "refs/remotes/origin/$product_branch")"
          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD

          mapfile -t actual < <(git diff --name-only "$product" HEAD | LC_ALL=C sort)
          expected_paths=(
            '.github/workflows/books-progress-backup-recovery.yml'
            'acs/version2_application.py'
            'acs/version2_release_app.py'
            'acs/version2_windows_native_dialog_ownership.py'
            'tests/test_v2_native_dialog_language.py'
            'tests/test_version2_application.py'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)
          test "${actual[*]}" = "${wanted[*]}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/version2_application.py
          acs/version2_release_app.py
          acs/version2_windows_native_dialog_ownership.py
          tests/test_version2_application.py
          tests/test_v2_native_dialog_language.py

      - name: Run Book recovery and adjacent persistence regressions
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_v2_native_dialog_language
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_book_board_progress_failure_exact

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
