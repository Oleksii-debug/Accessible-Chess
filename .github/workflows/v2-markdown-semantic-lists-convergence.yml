name: V2 Markdown Semantic Lists Convergence

on:
  pull_request:
    branches:
      - integration/nullmove-bookindex-apex-20261004-sol6p3
    paths:
      - 'acs/book_text_import.py'
      - 'tests/test_v2_book_text_import.py'
      - '.github/workflows/book-markdown-heading-text-integrity.yml'
      - '.github/workflows/v2-markdown-semantic-lists-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-markdown-lists-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove reviewed Markdown successor and immutable semantic-list oracle
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.base_ref }}"
            event_base='${{ github.event.pull_request.base.sha }}'
          else
            base_ref='integration/nullmove-bookindex-apex-20261004-sol6p3'
            event_base=''
          fi
          git fetch --no-tags origin \
            "refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "$event_base" ]; then
            git merge-base --is-ancestor "$event_base" "$live_base"
          fi
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git merge-base --is-ancestor '31c11b996c6aa38560d84496275ed61d77a1f766' HEAD
          git diff --check "$live_base" HEAD

          changed="$(git diff --name-only "$live_base"...HEAD | LC_ALL=C sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/book-markdown-heading-text-integrity.yml' \
            '.github/workflows/v2-markdown-semantic-lists-convergence.yml' \
            'acs/book_text_import.py' \
            'tests/test_v2_book_text_import.py' | LC_ALL=C sort)"
          test "$changed" = "$wanted"

          test "$(git rev-parse HEAD:tests/test_v2_markdown_semantic_lists.py)" = \
            "$(git rev-parse "$live_base:tests/test_v2_markdown_semantic_lists.py")"

      - name: Compile bounded Books adapter
        run: >-
          python -m py_compile
          acs/book_text_import.py
          tests/test_v2_book_text_import.py
          tests/test_v2_markdown_semantic_lists.py

      - name: Existing TXT/Markdown and canonical semantic-list contracts
        run: >-
          python -m unittest -v
          tests.test_v2_book_text_import
          tests.test_v2_markdown_semantic_lists
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_book_text_import.py
          tests/test_v2_markdown_semantic_lists.py
          tests/test_book_index.py
          tests/test_bookreader.py

      - name: Product diagnostics
        shell: bash
        run: |
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic
