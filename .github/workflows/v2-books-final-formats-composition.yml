name: V2 Books Current Full Product Composition QA

on:
  push:
    branches:
      - qa/v2-books-final-formats-composition-20260831
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-books-current-full-product-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_HEAD: 25e58b12c6b8f0e4b6969d80e461f9e4bd87963c
  PREVIOUS_QA_HEAD: 1cc1d5683f83333bb686e731c06c3f26ff034173
  FROZEN_V2_RUNTIME: 0b8fa275890cd82565eceece71063cb4353ea8c8
  ORACLE_BLOB: 26640274b7989725b85436d57eee838fc22288cb

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Preserve committed Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned QA dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact current Product and SAME QA lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$PRODUCT_HEAD"
          test "$(git rev-parse HEAD^2)" = "$PREVIOUS_QA_HEAD"
          test "$(git merge-base HEAD "$PRODUCT_HEAD")" = "$PRODUCT_HEAD"
          git merge-base --is-ancestor "$FROZEN_V2_RUNTIME" "$PRODUCT_HEAD"
          git diff --check "$PRODUCT_HEAD" HEAD

          changed="$(git diff --name-only "$PRODUCT_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-books-final-formats-composition.yml' \
            'scripts/v2_books_final_formats_composition_oracle.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$PRODUCT_HEAD" HEAD -- acs tests web run_accessible_chess.py run_accessible_chess_v2.py
          test "$(git rev-parse HEAD:scripts/v2_books_final_formats_composition_oracle.py)" = "$ORACLE_BLOB"
          echo 'CURRENT FULL PRODUCT BOOKS QA-ONLY SCOPE PASS'

      - name: Compile current Product and oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q acs tests scripts/v2_books_final_formats_composition_oracle.py run_accessible_chess.py run_accessible_chess_v2.py

      - name: Focused canonical cross-surface regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_v2_accessible_book_core \
            tests.test_v2_book_game_content \
            tests.test_v2_book_library_game_lookup \
            tests.test_v2_book_board_workflow \
            tests.test_v2_book_progress_store \
            tests.test_v2_book_progress_store_production \
            tests.test_bookdocument \
            tests.test_bookreader \
            tests.test_book_index \
            tests.test_d06_pgn_roundtrip \
            tests.test_gametree \
            tests.test_search_service \
            tests.test_d07_library_import_service

      - name: Real lawful current Full Product Books journey
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.v2_books_final_formats_composition_oracle
          test -s v2-books-final-formats-composition-summary.json
          grep -F '"status": "PASS"' v2-books-final-formats-composition-summary.json
          grep -F '"license": "CC0"' v2-books-final-formats-composition-summary.json
          grep -F '"subset_games": 128' v2-books-final-formats-composition-summary.json
          grep -F '"book_to_board_navigation": "PASS"' v2-books-final-formats-composition-summary.json
          grep -F '"book_progress_close_reopen": "PASS"' v2-books-final-formats-composition-summary.json
          grep -F '"library_close_reopen": "PASS"' v2-books-final-formats-composition-summary.json
          grep -F '"read_only_library": "PASS"' v2-books-final-formats-composition-summary.json
          grep -F '"product_mutation": false' v2-books-final-formats-composition-summary.json
          grep -F '"new_format_support_claimed": false' v2-books-final-formats-composition-summary.json

      - name: Upload current Full Product Books evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-books-current-full-product-${{ matrix.os }}
          path: v2-books-final-formats-composition-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Full repository unittest
        shell: bash
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        shell: bash
        run: python -m pytest -q tests

      - name: SELFTEST and current final-product diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic

      - name: Emit qualification identity
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCT_HEAD=$PRODUCT_HEAD"
          echo "QUALIFIED_HEAD=$(git rev-parse HEAD)"
          echo "PRODUCT_MUTATION=NONE"
          echo "HUMAN_TESTED=NO"
          echo "NVDA_VERIFIED=NO"
