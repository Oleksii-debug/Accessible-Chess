name: Child Coaching Context Current Apex

on:
  push:
    branches:
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - acs/child_coaching_context.py
      - acs/student_progress.py
      - acs/student_progress_store.py
      - acs/version2_final_product_application.py
      - acs/version2_release_app.py
      - tests/test_child_coaching_context.py
      - tests/test_version2_student_progress_context_binding.py
      - tests/test_student_progress_final_product_binding.py
      - tests/test_student_progress_store_safety.py
      - .github/workflows/child-coaching-context-current-apex.yml
  pull_request:
    paths:
      - acs/child_coaching_context.py
      - acs/student_progress.py
      - acs/student_progress_store.py
      - acs/version2_final_product_application.py
      - acs/version2_release_app.py
      - tests/test_child_coaching_context.py
      - tests/test_version2_student_progress_context_binding.py
      - tests/test_student_progress_final_product_binding.py
      - tests/test_student_progress_store_safety.py
      - .github/workflows/child-coaching-context-current-apex.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: child-coaching-context-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  child-coaching-context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CONTEXT_BLOB: 890fcc1d6cd57c1555e02a435d835d1d3fc75c4d
      CONTEXT_TEST_BLOB: 33e575d589761bb162479eea9f5e1ad06153998e
      PROGRESS_DOMAIN_BLOB: a470afdaff99413a1163e52192a0f12ee8b54671
      PROGRESS_STORE_BLOB: c4212f0a9d25a46e4d68dcaa2e0ccbdaf6c3f9de
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Prove exact context and progress authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          assert_inherited() {
            path="$1"
            fallback_blob="$2"
            if [ -n "${EVENT_BASE_SHA:-}" ]; then
              git cat-file -e "${EVENT_BASE_SHA}^{commit}"
              test "$(git rev-parse "${EVENT_BASE_SHA}:${path}")" = "$(git hash-object "${path}")"
            else
              test "$(git hash-object "${path}")" = "$fallback_blob"
            fi
          }
          assert_inherited acs/child_coaching_context.py "$CONTEXT_BLOB"
          assert_inherited tests/test_child_coaching_context.py "$CONTEXT_TEST_BLOB"
          assert_inherited acs/student_progress.py "$PROGRESS_DOMAIN_BLOB"
          assert_inherited acs/student_progress_store.py "$PROGRESS_STORE_BLOB"
          git diff --check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile coaching-context composition
        run: >-
          python -m py_compile
          acs/child_coaching_context.py
          acs/student_progress.py
          acs/student_progress_store.py
          acs/version2_final_product_application.py
          acs/version2_release_app.py
          tests/test_child_coaching_context.py
          tests/test_version2_student_progress_context_binding.py
          tests/test_student_progress_final_product_binding.py
          tests/test_student_progress_store_safety.py

      - name: Run coaching-context and adjacent authority contracts
        run: >-
          python -m unittest -v
          tests.test_child_coaching_context
          tests.test_version2_student_progress_context_binding
          tests.test_student_progress_final_product_binding
          tests.test_dev3_student_progress_store
          tests.test_student_progress_store_safety
          tests.test_version2_teacher_session_runtime_binding
          tests.test_child_coaching_projection
          tests.test_education_classroom_integration

      - name: Run core selftest
        run: python -m acs.selftest
