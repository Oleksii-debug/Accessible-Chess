name: Section 45 Visual Profile Sync Acceptance
on:
  pull_request:
    paths:
      - 'acs/visual_profile_sync.py'
      - 'acs/webapp.py'
      - 'web/index.html'
      - 'tests/test_visual_profile_sync.py'
      - 'tests/test_visual_profiles.py'
      - '.github/workflows/section45-visual-profile-sync.yml'
  push:
    paths:
      - 'acs/visual_profile_sync.py'
      - 'acs/webapp.py'
      - 'web/index.html'
      - 'tests/test_visual_profile_sync.py'
      - 'tests/test_visual_profiles.py'
      - '.github/workflows/section45-visual-profile-sync.yml'
permissions:
  contents: read
concurrency:
  group: section45-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-profile-sync:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Compile import and UI boundary tests
        run: python -m py_compile acs/visual_profile_sync.py acs/webapp.py tests/test_visual_profile_sync.py tests/test_visual_profiles.py
      - name: Run Section 45 sync, recovery, existing profile and design gates
        run: python -m unittest -v tests.test_visual_profile_sync tests.test_visual_profiles tests.test_section41_design_system tests.test_section42_board_themes
