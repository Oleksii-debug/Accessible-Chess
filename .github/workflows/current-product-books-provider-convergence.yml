name: Current Product Books Provider Convergence

on:
  pull_request:
    branches:
      - converge/current-cbf-cbi-manifest-pair-20261005-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-books-provider-convergence-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'CURRENT_PRODUCT_BOOKS_PROVIDER_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }

      - name: Prove exact two-parent convergence and bounded scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SERIAL_REF: converge/current-cbf-cbi-manifest-pair-20261005-ooxple7
          SERIAL_HEAD: d4e864d0f5c3fcddf902b17e5b91313401a96865
          BOOKS_REF: fix/book-provider-gametree-resource-bounds-20261005-sol56
          BOOKS_HEAD: a61a9c44572571f8d2364d9329107e1f42fc9b40
          MERGE_COMMIT: 6de0c2baccb0b71a2187497f2f8402bf28f31928
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$EVENT_BASE_REF" = "$SERIAL_REF"
          fi

          git fetch --no-tags origin "refs/heads/$SERIAL_REF"
          live_serial="$(git rev-parse FETCH_HEAD)"
          test "$live_serial" = "$SERIAL_HEAD" || {
            printf 'CURRENT_PRODUCT_SERIAL_MOVED expected=%s live=%s\n' "$SERIAL_HEAD" "$live_serial" >&2
            exit 1
          }

          git fetch --no-tags origin "refs/heads/$BOOKS_REF"
          live_books="$(git rev-parse FETCH_HEAD)"
          test "$live_books" = "$BOOKS_HEAD" || {
            printf 'CURRENT_PRODUCT_BOOKS_MOVED expected=%s live=%s\n' "$BOOKS_HEAD" "$live_books" >&2
            exit 1
          }

          convergence="$(git rev-parse HEAD^)"
          test "$convergence" = "$MERGE_COMMIT"
          parents="$(git show -s --format=%P "$convergence")"
          test "$parents" = "$SERIAL_HEAD $BOOKS_HEAD" || {
            printf 'Unexpected convergence parents: %s\n' "$parents" >&2
            exit 1
          }

          git merge-base --is-ancestor "$SERIAL_HEAD" HEAD
          git merge-base --is-ancestor "$BOOKS_HEAD" HEAD
          git diff --check "$SERIAL_HEAD"...HEAD

          changed="$(git diff --name-only "$SERIAL_HEAD"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/book-variation-fen-equivalence.yml' \
            '.github/workflows/bookdocument-constructor-semantic-integrity.yml' \
            '.github/workflows/current-product-books-provider-convergence.yml' \
            'acs/book_epub_import.py' \
            'acs/book_game_content.py' \
            'acs/book_html_import.py' \
            'acs/book_text_import.py' \
            'acs/bookdocument.py' \
            'tests/test_book_lookup_detached_canonicalization.py' \
            'tests/test_bookdocument.py' \
            'tests/test_v2_book_epub_import.py' \
            'tests/test_v2_book_html_import.py' \
            'tests/test_v2_book_text_import.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected current Product/Books convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/book_game_content.py)" = '9bc1594f1f5141dfa843f54755e670f392ba926d'
          test "$(git rev-parse HEAD:acs/bookdocument.py)" = '23249894e2e7d9c3b2c0602515188000ea846a41'
          test "$(git rev-parse HEAD:acs/chessbase_manifest.py)" = '7a91103062b76b541d370ec3a3247974d5cd0b80'
          echo 'CURRENT_PRODUCT_BOOKS_PROVIDER_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged product surfaces
        run: >-
          python -m compileall -q
          acs/book_game_content.py
          acs/bookdocument.py
          acs/book_text_import.py
          acs/book_html_import.py
          acs/book_epub_import.py
          acs/full_product_presenters.py
          acs/pgn_presenter_graph_guard.py
          acs/version2_gametree_resume.py
          acs/chessbase_manifest.py

      - name: Execute semantic reading malformed-content and recovery regressions
        run: >-
          python -m unittest -v
          tests.test_notation
          tests.test_pgn_presenter_graph_safety_current
          tests.test_dev1_pgn_webview_projection
          tests.test_d06_v2_gametree_resume_discard_guard
          tests.test_v2_upgrade_sound_artifact_control
          tests.test_book_lookup_detached_canonicalization
          tests.test_bookdocument
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import
          tests.test_chessbase_manifest_legacy_cbf_pair
          tests.test_portable_launcher_contract

      - name: Execute whole-product core smoke
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
