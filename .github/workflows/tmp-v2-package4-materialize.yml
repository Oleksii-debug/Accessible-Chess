name: Temporary V2 Package4 Materializer

on:
  push:
    branches:
      - tmp/v2-data-release-package4-materialize-20260828

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned broad-test dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Apply exact Package4 patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/v2-package4.patch
          git apply --check /tmp/v2-package4.patch
          git apply /tmp/v2-package4.patch
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' acs/version2_upgrade.py tests/test_version2_upgrade_recovery_integrity.py | sort)"
          test "$changed" = "$expected"
      - name: Focused recovery and release-data regressions
        run: >-
          python -m unittest -v
          tests.test_version2_upgrade
          tests.test_version2_upgrade_stale_writer
          tests.test_version2_upgrade_recovery_integrity
          tests.test_version2_package_preflight
          tests.test_settings
          tests.test_d07_acsdb_migration_atomicity
          tests.test_windows_data_release_regressions
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Commit exact validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Oleksii-debug
          git config user.email oleksiy.az.09@gmail.com
          git add acs/version2_upgrade.py tests/test_version2_upgrade_recovery_integrity.py
          git commit -m 'fix: harden V2 recovery metadata and readback [skip ci]'
          git push origin HEAD:tmp/v2-data-release-package4-materialize-20260828
