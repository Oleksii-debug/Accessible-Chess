name: Current EPUB Aggregate Block Limit

on:
  pull_request:
    branches:
      - checkpoint/book-html-parser-control-48d36ce
    paths:
      - '.github/workflows/current-epub-aggregate-block-limit.yml'
      - 'acs/book_epub_import.py'
      - 'tests/test_book_active_import_cancellation.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-epub-aggregate-block-limit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EPUB_IMPORT_BLOB: 7d5022ca7722ea6bf68e103f1a8e6bf24e242844
  ACTIVE_CANCEL_TEST_BLOB: e56460e44988454bac9a2abb4ddefae3a31a6e1f

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove bounded geometry and exact blobs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-epub-aggregate-block-limit.yml' \
            'acs/book_epub_import.py' \
            'tests/test_book_active_import_cancellation.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_epub_import.py)" = "$EPUB_IMPORT_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_active_import_cancellation.py)" = "$ACTIVE_CANCEL_TEST_BLOB"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python
        run: python -m py_compile acs/book_epub_import.py tests/test_book_active_import_cancellation.py
      - name: Run active import cancellation regressions
        run: python -m unittest tests.test_book_active_import_cancellation
