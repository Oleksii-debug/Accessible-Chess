name: D06 Grammar + Strict Safety Convergence

on:
  pull_request:
    branches:
      - fix/pgn-move-number-grammar-20260929
    paths:
      - 'acs/pgn_roundtrip.py'
      - 'tests/test_d06_pgn_roundtrip.py'
      - '.github/workflows/d06-grammar-strict-safety-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d06-grammar-strict-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live grammar parent and exact strict-safety scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_BASE_REF" = "fix/pgn-move-number-grammar-20260929"
          test -n "$EVENT_BASE_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$PR_BASE_REF"
          live_base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
          test -n "$live_base"
          if ! git merge-base --is-ancestor "$live_base" HEAD; then
            echo "Current D06 grammar parent $live_base is not an ancestor of convergence HEAD."
            exit 1
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base...HEAD"
          mapfile -t actual < <(git diff --name-only "$live_base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/d06-grammar-strict-safety-convergence.yml'
            'acs/pgn_roundtrip.py'
            'tests/test_d06_pgn_roundtrip.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected D06 convergence scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          git diff --quiet "$live_base...HEAD" -- \
            acs/gametree.py \
            tests/test_gametree.py \
            acs/chesscore.py \
            acs/gametree_legality.py
          echo "D06_GRAMMAR_PARENT=$live_base"
          echo 'D06_GRAMMAR_STRICT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile D06 authorities
        run: >-
          python -m py_compile
          acs/gametree.py
          acs/pgn_roundtrip.py
          tests/test_gametree.py
          tests/test_d06_pgn_roundtrip.py

      - name: Run converged D06 grammar and strict-safety contracts
        run: >-
          python -m unittest -v
          tests.test_gametree
          tests.test_d06_pgn_roundtrip
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_pgn_service
          tests.test_pgn_concurrent_save
          tests.test_gametree_legality
