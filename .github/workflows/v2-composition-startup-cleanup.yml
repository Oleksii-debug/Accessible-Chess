name: V2 Composition Startup Cleanup Current Product

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
      - converge/p0-release-critical-to-full-product-20260926
    paths:
      - '.github/workflows/v2-composition-startup-cleanup.yml'
      - 'tests/test_version2_composition_startup_cleanup.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-composition-startup-cleanup-current-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OWNER_HEAD: integration/startup-cleanup-regression-clean-20260926
  PRE_PUBLICATION_PRODUCT_BLOB: 4462da8db48737b4f66de7e2f4001d601aaec8a6
  PUBLICATION_PRODUCT_BLOB: fc7ba198d8204c2c21173866ed3c55384cd96fc2
  REGRESSION_BLOB: 0db93784501d50cbefa9d9044a4e62dda6103c03

jobs:
  current-product-startup-cleanup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove owner scope or retained cleanup authority
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA" HEAD
          expected="$(printf '%s\n' \
            '.github/workflows/v2-composition-startup-cleanup.yml' \
            'tests/test_version2_composition_startup_cleanup.py' | sort)"
          if test "$EXPECTED_HEAD_REF" = "$OWNER_HEAD"; then
            changed="$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort)"
            test "$changed" = "$expected" || {
              printf 'Unexpected startup-cleanup owner scope:\n%s\n' "$changed" >&2
              exit 1
            }
            test "$(git rev-parse HEAD:acs/version2_release_app.py)" = "$PRE_PUBLICATION_PRODUCT_BLOB"
            echo 'V2_STARTUP_CLEANUP_SCOPE_MODE=OWNER_EXACT'
          else
            while IFS= read -r path; do
              test -f "$path" || {
                printf 'Retained startup-cleanup authority missing: %s\n' "$path" >&2
                exit 1
              }
            done <<< "$expected"
            app_blob="$(git rev-parse HEAD:acs/version2_release_app.py)"
            case "$app_blob" in
              "$PRE_PUBLICATION_PRODUCT_BLOB"|"$PUBLICATION_PRODUCT_BLOB") ;;
              *)
                printf 'Unqualified version2_release_app.py identity for retained startup cleanup: %s\n' "$app_blob" >&2
                exit 1
                ;;
            esac
            echo 'V2_STARTUP_CLEANUP_SCOPE_MODE=CONVERGENCE_RETAINED'
          fi
          test "$(git rev-parse HEAD:tests/test_version2_composition_startup_cleanup.py)" = "$REGRESSION_BLOB"

      - name: Compile startup cleanup scope
        run: python -m py_compile acs/version2_release_app.py tests/test_version2_composition_startup_cleanup.py

      - name: Replay startup cleanup failure matrix
        run: python -m unittest -v tests.test_version2_composition_startup_cleanup tests.test_version2_release_app

      - name: Install pinned full-suite runner
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pip install -q pytest==8.4.2

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Core selftest
        run: python -m acs.selftest

      - name: Current V2 production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic
