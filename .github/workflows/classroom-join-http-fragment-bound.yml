name: Classroom Join HTTP Fragment Bound

on:
  pull_request:
    branches:
      - feature/classroom-join-http-endpoint-20261003
    paths:
      - 'acs/classroom_join_http_endpoint.py'
      - 'tests/test_classroom_join_http_endpoint.py'
      - '.github/workflows/classroom-join-http-fragment-bound.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-join-http-fragment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fragment-bound:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked fragment scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-join-http-endpoint-20261003"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | LC_ALL=C sort)"
          allowed="$(printf '%s\n'             '.github/workflows/classroom-join-http-fragment-bound.yml'             'acs/classroom_join_http_endpoint.py'             'tests/test_classroom_join_http_endpoint.py' | LC_ALL=C sort)"
          test "$changed" = "$allowed"
          echo "CLASSROOM_JOIN_HTTP_FRAGMENT_EXACT_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile join endpoint
        run: >-
          python -m py_compile
          acs/classroom_join_http_endpoint.py
          tests/test_classroom_join_http_endpoint.py

      - name: Prove independent ASGI event budget
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MAX_REQUEST_BODY_EVENTS = 16 * 1024' acs/classroom_join_http_endpoint.py
          grep -Fq 'request_too_fragmented' acs/classroom_join_http_endpoint.py
          ! grep -Eq 'os\.(environ|getenv)|LIVEKIT_API_SECRET|LIVEKIT_API_KEY'             acs/classroom_join_http_endpoint.py
          echo "CLASSROOM_JOIN_HTTP_FRAGMENT_BOUNDARY=PASS"

      - name: Run join and media regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_join_http_endpoint
          tests.test_classroom_join_credentials
          tests.test_livekit_join_token_issuer
          tests.test_classroom_realtime_media

      - name: Core selftest
        run: python -m acs.selftest
