name: V2 Upgrade SQLite Lock Publication

on:
  push:
    branches:
      - fix/v2-upgrade-sqlite-lock-publication-20261003
  pull_request:
    branches:
      - fix/v2-upgrade-generated-artifact-auth-20261003
    paths:
      - 'acs/version2_upgrade_base.py'
      - 'tests/test_v2_upgrade_generated_artifact_authentication.py'
      - '.github/workflows/v2-upgrade-sqlite-lock-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-upgrade-sqlite-lock-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact recovery parent and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='df2458bfbacd3c8ed4d42a22c737fee1490db430'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/v2-upgrade-generated-artifact-auth-20261003'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/v2-upgrade-sqlite-lock-publication.yml'             'acs/version2_upgrade_base.py'             'tests/test_v2_upgrade_generated_artifact_authentication.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/version2_upgrade_base.py)" = "7faed23f0858cd9104910d08ecdfa652191b76e0"
          test "$(git rev-parse HEAD:tests/test_v2_upgrade_generated_artifact_authentication.py)" = "4fcd3ba402087e67caf32de4abda1f79e4fd27b9"

          echo 'V2_UPGRADE_SQLITE_LOCK_PUBLICATION_SCOPE=PASS'

      - name: Compile upgrade surfaces
        run: >-
          python -m compileall -q
          acs/version2_upgrade_base.py
          tests/test_v2_upgrade_generated_artifact_authentication.py

      - name: Focused SQLite and publication-race regressions
        run: >-
          python -m unittest -v
          tests.test_v2_upgrade_generated_artifact_authentication
          tests.test_v2_upgrade_publish_race_audit
          tests.test_v2_upgrade_book_progress_temp_artifact_control
          tests.test_v2_upgrade_root_writer_artifact_grammar
          tests.test_v2_upgrade_self_coordination_artifact_control
          tests.test_v2_upgrade_education_workspace_artifact_control

      - name: Upgrade integration regressions
        run: >-
          python -m unittest -v
          tests.test_v2_data_upgrade
          tests.test_v2_data_upgrade_v6
          tests.test_v2_upgrade_tracked_writer_conflict

      - name: Core selftest
        run: python -m acs.selftest
