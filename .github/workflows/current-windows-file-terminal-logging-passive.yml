name: Current Windows File Terminal Logging Passive

on:
  push:
    branches:
      - fix/windows-file-terminal-logging-passive-20261006-hy6ez0h
  pull_request:
    branches:
      - fix/windows-import-progress-coherence-20261006-hy6ez0h
    paths:
      - acs/version2_windows_file_workflows.py
      - tests/test_v2_windows_file_logging_passive.py
      - .github/workflows/current-windows-file-terminal-logging-passive.yml

permissions:
  contents: read

concurrency:
  group: current-windows-file-terminal-logging-passive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: b45f65430eab8f9b5474dca8a2e452d8fffdf677
  PARENT_BRANCH: fix/windows-import-progress-coherence-20261006-hy6ez0h
  EXPECTED_WINDOWS_FILE_SOURCE_BLOB: 5823195e361c0ffc5e99e01d3f7f7e2ed5f86b00
  EXPECTED_LOGGING_TEST_BLOB: 7f0a6d01fddc19d1d4e9f4cfd4d80757989a0408
  EXPECTED_PROGRESS_TEST_BLOB: 3df204688c9c73c195f65d5ae12f2e79612f1fed

jobs:
  terminal-logging:
    name: Passive terminal logging / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact terminal-logging child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/terminal-logging-parent"
          live_parent="$(git rev-parse refs/remotes/origin/terminal-logging-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "TERMINAL_LOGGING_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-file-terminal-logging-passive.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_file_logging_passive.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_WINDOWS_FILE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_file_logging_passive.py)" = "$EXPECTED_LOGGING_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_import_progress_coherence.py)" = "$EXPECTED_PROGRESS_TEST_BLOB"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile current Windows file stack
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_file_logging_passive.py
          tests/test_v2_windows_import_progress_coherence.py
          tests/test_v2_windows_file_worker_shutdown_fence.py
          tests/test_v2_windows_nvda_file_workflows.py

      - name: Run logging, trace, shutdown and NVDA regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_file_logging_passive
          tests.test_v2_windows_import_progress_coherence
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
