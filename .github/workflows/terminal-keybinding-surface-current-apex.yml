name: Terminal Keybinding Surface Current Apex

on:
  pull_request:
    branches:
      - reconverge/keybindings-terminal-current-product-20260926
    paths:
      - web/index.html
      - web/full_product_pgn.js
      - web/full_product_library.js
      - web/full_product_education.js
      - acs/full_product_native_menu.py
      - tests/test_full_product_native_menu.py
      - tests/test_terminal_keybinding_surface_wiring.py
      - .github/workflows/terminal-keybinding-surface-current-apex.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-surface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact base ancestry
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if test -n "${EVENT_BASE_SHA:-}"; then
            git cat-file -e "$EVENT_BASE_SHA^{commit}"
            git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
            git diff --check "$EVENT_BASE_SHA"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile focused regressions
        run: >-
          python -m py_compile
          tests/test_terminal_keybinding_surface_wiring.py
          tests/test_keybindings_current_apex_reconvergence.py
          tests/test_full_product_native_menu.py

      - name: Run terminal keybinding authority and native menu contracts
        run: >-
          python -m unittest -v
          tests.test_terminal_keybinding_surface_wiring
          tests.test_keybindings_current_apex_reconvergence
          tests.test_keybindings
          tests.test_ui_keymap_adapter
          tests.test_full_product_native_menu

      - name: Run retained child-surface DOM smoke tests
        shell: bash
        run: |
          node --check web/full_product_pgn.js
          node --check web/full_product_library.js
          node --check web/full_product_education.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/library_surface_dom_test.js
          node tests/js/education_surface_dom_test.js
