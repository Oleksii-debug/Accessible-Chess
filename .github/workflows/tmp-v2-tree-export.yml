name: Temporary V2 Current Tree Export

on:
  push:
    branches:
      - tmp/v2-data-release-current-tree-export-20260828

permissions:
  contents: read

jobs:
  export-tree:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Record exact identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object acs/version2_upgrade.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2-current-tree
          path: |
            .github
            acs
            tests
            web
            run_accessible_chess.py
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
