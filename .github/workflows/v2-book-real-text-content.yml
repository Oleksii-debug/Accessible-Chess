name: V2 Real TXT and Markdown Chess Book Content

on:
  push:
    branches:
      - work/v2-book-text-markdown-content-20260831
  pull_request:
    branches:
      - work/v2-book-canonical-game-content-20260828
    paths:
      - 'acs/book_text_import.py'
      - 'tests/test_v2_book_text_import.py'
      - 'scripts/v2_real_text_book_oracle.py'
      - '.github/workflows/v2-book-real-text-content.yml'

permissions:
  contents: read

concurrency:
  group: v2-book-real-text-content-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_BASE_SHA: 23a5825845370db5dda67be93326fcdf84dffc40
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  BOOK_URL: https://www.gutenberg.org/ebooks/5614.txt.utf-8
  BOOK_SHA256: 2746ab9364067ce9332aeff8242dc9f7c8592eee53836ed73179990478c6cbdb

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes for cross-platform identity gates
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Restore frozen Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact parent and TXT-Markdown ownership
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PACKAGE_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PACKAGE_BASE_SHA" HEAD
          test "$(git merge-base "$PACKAGE_BASE_SHA" HEAD)" = "$PACKAGE_BASE_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$PR_BASE_SHA" = "$PACKAGE_BASE_SHA"
          fi
          git diff --check "$PACKAGE_BASE_SHA" HEAD
          changed="$(git diff --name-only "$PACKAGE_BASE_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-book-real-text-content.yml' \
            'acs/book_text_import.py' \
            'scripts/v2_real_text_book_oracle.py' \
            'tests/test_v2_book_text_import.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$PACKAGE_BASE_SHA" HEAD -- \
            acs/bookdocument.py acs/book_index.py acs/bookreader.py \
            acs/book_progress_store.py acs/book_game_content.py \
            acs/book_library_game_lookup.py acs/book_board_workflow.py \
            acs/chesscore.py acs/gametree.py acs/pgn_roundtrip.py \
            acs/acsdb.py acs/search_service.py acs/training.py acs/book_training.py \
            acs/full_product_presenters.py acs/book_webview_bridge.py \
            acs/book_webview_projection.py web/full_product_books_training.js \
            acs/stage1_release_ui.py acs/stage1_release_ui_core.py \
            acs/webapp_keymap_core.py tools/qa
          echo 'TXT/MARKDOWN BOOK OWNERSHIP PASS'

      - name: Compile TXT-Markdown Book package
        run: python -m compileall -q acs/book_text_import.py tests/test_v2_book_text_import.py scripts/v2_real_text_book_oracle.py

      - name: Focused TXT-Markdown and canonical Book regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_text_import
          tests.test_v2_book_game_content
          tests.test_bookdocument
          tests.test_bookreader
          tests.test_v2_book_progress_store
          tests.test_gametree
          tests.test_d06_pgn_roundtrip

      - name: Download lawful real TXT chess-book corpus transiently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import time
          import urllib.request

          url = os.environ["BOOK_URL"]
          data = None
          for attempt in range(4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Accessible-Chess-CI/1.0 real-text-book-verification"},
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 ** attempt)
          assert data is not None
          if len(data) > 8 * 1024 * 1024:
              raise SystemExit("real TXT corpus exceeds package source bound")
          with open("real-book-5614.txt", "wb") as stream:
              stream.write(data)
          print(f"REAL_TEXT_SOURCE_BYTES={len(data)}")
          print(f"REAL_TEXT_SOURCE_SHA256={hashlib.sha256(data).hexdigest()}")
          PY

      - name: Real Project Gutenberg TXT book oracle
        shell: bash
        run: |
          set -uo pipefail
          python -m scripts.v2_real_text_book_oracle real-book-5614.txt --expected-sha256 "$BOOK_SHA256"
          rc=$?
          echo "REAL_TEXT_CORPUS_RC=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Upload real TXT evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-book-real-text-${{ matrix.os }}
          path: book-real-text-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Re-materialize frozen Stage1 blobs before broad byte contracts
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Enforce real TXT corpus acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "${REAL_TEXT_CORPUS_RC:-2}" = "0"
          echo 'REAL TXT BOOK ACCEPTANCE PASS'
