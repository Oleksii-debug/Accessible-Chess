name: Agent Speech Context Permission Revocation

on:
  pull_request:
    branches:
      - feat/media-local-stt-reuse-20261005
  push:
    branches:
      - fix/agent-speech-context-permission-revocation-20261006-sol56r8k
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-speech-permission-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact parent and permission-only scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PARENT_REF: feat/media-local-stt-reuse-20261005
          PARENT_SHA: d64462e9e537be1268dcc10c14fcb950ec385e55
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "+refs/heads/$PARENT_REF:refs/remotes/origin/speech-permission-parent"
          live_parent="$(git rev-parse refs/remotes/origin/speech-permission-parent)"
          test "$live_parent" = "$PARENT_SHA" || {
            printf 'AGENT_SPEECH_PERMISSION_PARENT_MOVED expected=%s live=%s\n' "$PARENT_SHA" "$live_parent" >&2
            exit 1
          }
          test "$(git merge-base "$PARENT_SHA" HEAD)" = "$PARENT_SHA"
          git diff --check "$PARENT_SHA"...HEAD
          changed="$(git diff --name-only "$PARENT_SHA"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/media-speech-context-permission.yml' \
            'acs/media_context_cli.py' \
            'acs/media_subtitles.py' \
            'tests/test_agent_ollama_reuse.py' \
            'tests/test_media_subtitles_reuse.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected speech-context permission scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/media_subtitles.py)" = '3c2df5f0228cb81a3392a5b7b30f1cba283058e2'
          test "$(git rev-parse HEAD:acs/media_context_cli.py)" = 'bf0eba54adb9cb13efa6c584e7deb49920bbb1f6'
          test "$(git rev-parse HEAD:tests/test_media_subtitles_reuse.py)" = 'c57cedddfc09631846fdf7615bc0c9b74df543ab'
          test "$(git rev-parse HEAD:tests/test_agent_ollama_reuse.py)" = '0c307d5ca51d49f58f81bba8d10afd54ad8752ec'
          test "$(git rev-parse HEAD:acs/agent_tools.py)" = 'e432f97740922b7f64d5307c2ee7ae2eb4fd2c73'
          echo 'AGENT_SPEECH_PERMISSION_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install inherited optional media-agent dependencies
        run: python -m pip install -r requirements-media-agent.txt pytest==8.4.2

      - name: Compile permission-bound media context
        run: >-
          python -m compileall -q
          acs/media_subtitles.py
          acs/media_context_cli.py
          tests/test_media_subtitles_reuse.py
          tests/test_agent_ollama_reuse.py

      - name: Execute speech-context permission and runtime regressions
        run: >-
          python -m pytest -q
          tests/test_media_subtitles_reuse.py
          tests/test_agent_ollama_reuse.py
          tests/test_media_context_cli.py
          tests/test_agent_protocol_json_safety.py
          tests/test_agent_model_response_authority.py
