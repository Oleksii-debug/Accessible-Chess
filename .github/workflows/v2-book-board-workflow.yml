name: V2 Book to Board Workflow

on:
  push:
    branches:
      - work/v2-book-board-workflow-20260831
  pull_request:
    branches:
      - work/v2-book-library-game-lookup-20260828
    paths:
      - 'acs/book_board_workflow.py'
      - 'tests/test_v2_book_board_workflow.py'
      - '.github/workflows/v2-book-board-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-book-board-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes for cross-platform gates
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Restore frozen Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            git cat-file blob "HEAD:$path" > "$path"
            actual="$(git hash-object --no-filters "$path")"
            test "$actual" = "$expected" || {
              printf 'Frozen Stage 1 workspace blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'FROZEN_STAGE1'
          acs/stage1_release_ui_core.py=b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6
          acs/webapp_keymap_core.py=0ba06f548d39dad7372e0339b3e121fd1717cc05
          FROZEN_STAGE1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact stacked ancestry and three-path application ownership
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            upstream="$PR_BASE_SHA"
            mode="current-pr"
          elif git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            upstream="$(git rev-parse HEAD^2)"
            mode="merge-sync-push"
          else
            upstream="$(git rev-parse HEAD^)"
            mode="incremental-push"
          fi
          test -n "$upstream"
          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD
          changed="$(git diff --name-only "$upstream" HEAD | sort)"
          test -n "$changed"

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/v2-book-board-workflow.yml|acs/book_board_workflow.py|tests/test_v2_book_board_workflow.py)
                ;;
              *)
                echo "Unexpected path outside DEV27 Book-to-Board ownership: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

          if [ "$mode" = "current-pr" ] || [ "$mode" = "merge-sync-push" ]; then
            expected="$(printf '%s\n' \
              '.github/workflows/v2-book-board-workflow.yml' \
              'acs/book_board_workflow.py' \
              'tests/test_v2_book_board_workflow.py' | sort)"
            test "$changed" = "$expected"
          fi

          git diff --quiet "$upstream" HEAD -- \
            acs/bookdocument.py \
            acs/book_progress_store.py \
            acs/bookreader.py \
            acs/book_index.py \
            acs/book_game_content.py \
            acs/book_library_game_lookup.py \
            acs/gametree.py \
            acs/gametree_navigation.py \
            acs/gametree_legality.py \
            acs/pgn_roundtrip.py \
            acs/pgn_workspace.py \
            acs/acsdb.py \
            acs/search_service.py \
            acs/chesscore.py \
            acs/analysis_service.py \
            acs/engine_assisted_workflows.py \
            acs/engine.py \
            acs/stockfish_runtime.py \
            acs/full_product_actions.py \
            acs/full_product_presenters.py \
            acs/book_webview_bridge.py \
            acs/book_webview_projection.py \
            web/full_product_books_training.js \
            acs/stage1_release_ui.py

      - name: Compile DEV27 application package
        run: >-
          python -m compileall -q
          acs/book_board_workflow.py
          tests/test_v2_book_board_workflow.py

      - name: Focused Book to Board integration regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_board_workflow
          tests.test_v2_book_game_content
          tests.test_v2_book_library_game_lookup
          tests.test_bookreader
          tests.test_gametree_navigation
          tests.test_dev2_gametree_legality
          tests.test_engine_assisted_workflows
          tests.test_analysis_provider

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
