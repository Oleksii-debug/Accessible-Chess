name: Temporary Harden Owner W4 Extraction

on:
  push:
    branches:
      - qualification/owner-portable-candidate-20261004-sol6f2
    paths:
      - '.github/workflows/temporary-harden-owner-w4-extraction.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout live canonical owner-final branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: qualification/owner-portable-candidate-20261004-sol6f2
          fetch-depth: 0

      - name: Reuse canonical Windows path authority before W4 extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/owner-oneclick-from-w4.yml')
          text = workflow_path.read_text(encoding='utf-8')
          if "token = _relative_token(token, label='W4 ZIP member')" not in text:
              old_import = 'from acs.version2_package_preflight import validate_version2_package_tree\n'
              new_import = '''from acs.version2_package_preflight import (\n    Version2PackagePreflightError,\n    _relative_token,\n    validate_version2_package_tree,\n)\n'''
              if old_import not in text:
                  raise SystemExit('W4_EXTRACTION_IMPORT_ANCHOR_NOT_FOUND')
              text = text.replace(old_import, new_import, 1)

              old_validation = '''              token = name[:-1] if name.endswith('/') else name\n              pure = PurePosixPath(token)\n              if not token or pure.is_absolute() or pure.as_posix() != token or '..' in pure.parts:\n                  raise SystemExit('W4_ZIP_MEMBER_PATH_INVALID')\n              folded = token.casefold()\n'''
              new_validation = '''              token = name[:-1] if name.endswith('/') else name\n              try:\n                  token = _relative_token(token, label='W4 ZIP member')\n              except Version2PackagePreflightError:\n                  raise SystemExit('W4_ZIP_MEMBER_PATH_INVALID')\n              pure = PurePosixPath(token)\n              folded = token.casefold()\n'''
              if old_validation not in text:
                  raise SystemExit('W4_EXTRACTION_VALIDATION_ANCHOR_NOT_FOUND')
              text = text.replace(old_validation, new_validation, 1)
              workflow_path.write_text(text, encoding='utf-8', newline='\n')

          test_path = Path('tests/test_owner_oneclick_from_w4_workflow.py')
          tests = test_path.read_text(encoding='utf-8')
          method = '''    def test_w4_extraction_reuses_canonical_windows_path_authority(self) -> None:\n        self.assertIn("Version2PackagePreflightError", self.text)\n        self.assertIn("_relative_token", self.text)\n        self.assertIn("token = _relative_token(token, label='W4 ZIP member')", self.text)\n        self.assertIn("W4_ZIP_MEMBER_PATH_INVALID", self.text)\n        for unsafe in ("C:evil", "file:stream", "CON", "name.", "name "):\n            with self.subTest(unsafe=unsafe):\n                from acs.version2_package_preflight import Version2PackagePreflightError, _relative_token\n                with self.assertRaises(Version2PackagePreflightError):\n                    _relative_token(unsafe, label="W4 ZIP member")\n\n'''
          if 'test_w4_extraction_reuses_canonical_windows_path_authority' not in tests:
              marker = '    def test_owner_external_inputs_are_explicit_https_and_sha_bound(self) -> None:\n'
              if marker not in tests:
                  raise SystemExit('W4_EXTRACTION_TEST_ANCHOR_NOT_FOUND')
              tests = tests.replace(marker, method + marker, 1)
              test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

      - name: Verify extraction hardening and owner-final contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_owner_oneclick_from_w4_workflow.py
          python -m unittest -v \
            tests.test_owner_oneclick_from_w4_workflow \
            tests.test_version2_package_preflight
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/owner-oneclick-from-w4.yml').read_text(encoding='utf-8')
          required = (
              "_relative_token",
              "Version2PackagePreflightError",
              "token = _relative_token(token, label='W4 ZIP member')",
              "W4_ZIP_MEMBER_PATH_INVALID",
          )
          for token in required:
              assert token in text, token
          print('OWNER_W4_WINDOWS_PATH_INGRESS=PASS')
          PY

      - name: Commit verified canonical fix and remove one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'accessible-chess-reconvergence'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/temporary-harden-owner-w4-extraction.yml
          git add \
            .github/workflows/owner-oneclick-from-w4.yml \
            tests/test_owner_oneclick_from_w4_workflow.py \
            .github/workflows/temporary-harden-owner-w4-extraction.yml
          git commit -m "Harden W4 extraction for Windows path semantics"
          git push origin HEAD:qualification/owner-portable-candidate-20261004-sol6f2
