name: Current Book Canonical PGN Active Cancellation

on:
  pull_request:
    branches:
      - fix/book-html-parser-control-checkpoints-20261006-hy6ez0h
    paths:
      - '.github/workflows/current-book-canonical-pgn-active-cancellation.yml'
      - 'acs/gametree.py'
      - 'acs/pgn_roundtrip.py'
      - 'acs/book_html_import.py'
      - 'tests/test_book_active_import_cancellation.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-canonical-pgn-cancel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAMETREE_BLOB: 25026a11c38996dd1c0631d54c26a4629d315923
  PGN_ROUNDTRIP_BLOB: 1de1c0f542da86b7832e69919a0aeaf0094395fc
  HTML_IMPORT_BLOB: cce803a686ca55dc4138d1d80a5ec59972022f5f
  ACTIVE_CANCEL_TEST_BLOB: 425452a1b65408ecc9d6c3d439d8be082e0e7896

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove bounded geometry and exact blobs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-book-canonical-pgn-active-cancellation.yml' \
            'acs/book_html_import.py' \
            'acs/gametree.py' \
            'acs/pgn_roundtrip.py' \
            'tests/test_book_active_import_cancellation.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/gametree.py)" = "$GAMETREE_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "$PGN_ROUNDTRIP_BLOB"
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = "$HTML_IMPORT_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_active_import_cancellation.py)" = "$ACTIVE_CANCEL_TEST_BLOB"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile changed Python
        run: python -m py_compile acs/gametree.py acs/pgn_roundtrip.py acs/book_html_import.py tests/test_book_active_import_cancellation.py

      - name: Run canonical PGN and book cancellation regressions
        run: python -m unittest tests.test_gametree tests.test_d06_pgn_roundtrip tests.test_book_html_pgn_loss_accounting tests.test_book_active_import_cancellation
