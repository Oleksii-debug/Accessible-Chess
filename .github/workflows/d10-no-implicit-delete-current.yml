name: D10 No Implicit Delete Current Runtime

on:
  pull_request:
    paths:
      - 'acs/education_workspace.py'
      - 'tests/test_d10_no_implicit_delete_current.py'
      - '.github/workflows/d10-no-implicit-delete-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d10-no-implicit-delete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained D10 authority and current PR hygiene
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}" || git fetch --no-tags origin "$base"
          d10_owner="1f07515c07f75b6b2bc7b2c98890088ecb0dee07"
          git cat-file -e "${d10_owner}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$d10_owner" HEAD
          git diff --check "$base" HEAD
          test "$(git rev-parse HEAD:tests/test_d10_no_implicit_delete_current.py)" = "0222977bd13a5d39e67200dae7d21d64cfadc44e"

      - name: Compile changed Python
        run: python -m py_compile acs/education_workspace.py tests/test_d10_no_implicit_delete_current.py

      - name: Focused D10 durability regression
        run: >-
          python -m pytest -q
          tests/test_d10_no_implicit_delete_current.py
          tests/test_education_workspace.py
          tests/test_education_records.py
          tests/test_classroom_domain.py

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'
