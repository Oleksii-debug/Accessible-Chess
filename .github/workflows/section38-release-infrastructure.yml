name: Section 38 Release Infrastructure

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'acs/update_security.py'
      - 'acs/release_update_center.py'
      - 'acs/authenticode.py'
      - 'acs/authenticode_signing.py'
      - 'acs/spdx_sbom.py'
      - 'acs/security_support_policy.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_native_menu.py'
      - 'acs/version2_profile.py'
      - 'acs/version2_application.py'
      - 'tools/generate_spdx_sbom.py'
      - 'tools/generate_security_support_manifest.py'
      - 'tests/test_update_security.py'
      - 'tests/test_release_update_center.py'
      - 'tests/test_release_update_application_boundary.py'
      - 'tests/test_authenticode.py'
      - 'tests/test_authenticode_signing.py'
      - 'tests/test_spdx_sbom.py'
      - 'tests/test_generate_spdx_sbom.py'
      - 'tests/test_security_support_policy.py'
      - 'tests/test_security_support_policy_uri_hardening.py'
      - '.github/workflows/section38-release-infrastructure.yml'
      - 'docs/automation/SECTION38_RELEASE_INFRASTRUCTURE_AUDIT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section38-release-infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Bind exact pull request head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --check "${{ github.event.pull_request.base.sha }}" HEAD

      - name: Compile Section 38 authorities
        run: >-
          python -m py_compile
          acs/update_security.py
          acs/release_update_center.py
          acs/authenticode.py
          acs/authenticode_signing.py
          acs/spdx_sbom.py
          acs/security_support_policy.py
          tools/generate_spdx_sbom.py
          tools/generate_security_support_manifest.py
          acs/full_product_actions.py
          acs/full_product_native_menu.py
          acs/version2_profile.py
          acs/version2_application.py

      - name: Run release security and accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_update_security
          tests.test_release_update_center
          tests.test_release_update_application_boundary
          tests.test_authenticode
          tests.test_authenticode_signing
          tests.test_spdx_sbom
          tests.test_generate_spdx_sbom
          tests.test_security_support_policy
          tests.test_security_support_policy_uri_hardening
          tests.test_slsa_provenance
          tests.test_slsa_provenance_builder_binding

      - name: Re-run canonical package and release preflight regressions
        run: >-
          python -m unittest -v
          tests.test_release_preflight
          tests.test_version2_package_preflight
          tests.test_version2_portable_package

      - name: Core selftest
        run: python -m acs.selftest
