name: Integration Hardened Books PGN Keymap Rollup

on:
  push:
    branches:
      - integration/hardened-books-pgn-keymap-rollup-20261004
  pull_request:
    branches:
      - integration/hardened-books-training-regressions-20261004
    paths:
      - 'web/full_product_pgn.js'
      - 'tests/js/pgn_surface_dom_test.js'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - '.github/workflows/integration-hardened-books-pgn-keymap-rollup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-hardened-books-pgn-keymap-rollup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact rollup parent, scope and authorities
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          base='93ae470bfe0cbfd106340932b8586e8bee00fef9'
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD

          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d01-pgn-workspace-webview.yml' \
            '.github/workflows/integration-hardened-books-pgn-keymap-rollup.yml' \
            'tests/js/pgn_surface_dom_test.js' \
            'web/full_product_pgn.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:web/full_product_pgn.js)" = '1fa71cf6fea78d9d6d3ceb1aedee060c8756355e'
          test "$(git rev-parse HEAD:tests/js/pgn_surface_dom_test.js)" = '7f3368c7523c60e796b8c404fa0d3e4cc5229c7b'
          test "$(git rev-parse HEAD:.github/workflows/d01-pgn-workspace-webview.yml)" = '6f0cf13ea517ddf235f5258b3a8b35d0cddddb37'

          # Preserve the #1554 Books/Training regression reconciliation exactly.
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_projection.py)" = '2198a9a1e5a6e6e9ee8e93de49db34d7e9b86bad'
          test "$(git rev-parse HEAD:tests/test_v2_book_training_route_rollback.py)" = '1e9b0e03c5c81ef187234a748bbd23c2759ad4cb'
          test "$(git rev-parse HEAD:tests/test_version2_release_accessibility_contract.py)" = 'a9d6d065777156c3fe2327b2183df5d8898dc2cb'
          test "$(git rev-parse HEAD:acs/version2_application.py)" = 'c66d2c17865824e481cdf7281026b7805f633cd7'

          echo 'HARDENED_BOOKS_PGN_KEYMAP_ROLLUP_SCOPE=PASS'

      - name: Run Books Training reconciled regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_bridge
          tests.test_v2_book_training_route_rollback
          tests.test_version2_release_accessibility_contract
          tests.test_training_authority_convergence
          tests.test_version2_application

      - name: Run PGN keymap and accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_keybindings
          tests.test_v2_board_analysis_hotkey_feedback
          tests.test_dev1_full_product_webview_adapter
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_workspace_webview_adapter

      - name: Run browser DOM contracts
        run: |
          node --check web/full_product_pgn.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - name: Run core selftest
        run: python -m acs.selftest
