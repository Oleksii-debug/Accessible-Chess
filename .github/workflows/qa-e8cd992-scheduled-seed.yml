name: QA e8cd992 Scheduled Seed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      STRICT_WORKFLOW_ID: '336818249'
      TARGET_BRANCH: qa/windows-current-integration-candidate-20260815
      OLD_QA_SHA: 564ef5b0adb697c8dc0e8ef16f0a493cfc36d5b3
      TARGET_PRODUCT_SHA: e8cd992d306975955784118364ce950963133d7e
    steps:
      - name: Dispatch bridge only until one repaired strict run exists
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "repos/${{ github.repository }}/actions/workflows/$STRICT_WORKFLOW_ID/runs?branch=$TARGET_BRANCH&per_page=50")"
          repaired_count="$(python -c 'import json,sys; d=json.load(sys.stdin); old=sys.argv[1]; print(sum(1 for r in d.get("workflow_runs",[]) if r.get("head_sha") != old))' "$OLD_QA_SHA" <<<"$runs")"
          if [[ "$repaired_count" != "0" ]]; then
            echo "A repaired-QA strict run already exists; scheduled seed is inert."
            exit 0
          fi
          active_count="$(python -c 'import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get("workflow_runs",[]) if r.get("status") in {"queued","in_progress","waiting","pending","requested"}))' <<<"$runs")"
          if [[ "$active_count" != "0" ]]; then
            echo "Legacy strict is still active; wait for next scheduled seed without creating a duplicate."
            exit 0
          fi
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/qa-issue14-strict-bridge.yml/dispatches" \
            -f ref=main
          echo "Dispatched QA bridge for repaired Windows strict."
