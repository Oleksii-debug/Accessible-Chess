name: Current Shipping PGN Open Terminal Truth

on:
  push:
    branches:
      - converge/current-shipping-pgn-open-terminal-truth-20261006-c2mbezb
  pull_request:
    branches:
      - converge/current-shipping-pgn-cancel-successor-20261006-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-shipping-pgn-open-terminal-truth-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  SHIPPING_PARENT_BRANCH: converge/current-shipping-pgn-cancel-successor-20261006-ooxple7
  SHIPPING_PARENT_SHA: aedb6813c15d4ef94410a736c173c4e28dda19d5
  RUNTIME_FIX_BRANCH: fix/current-runtime-pgn-open-terminal-truth-20261006-c2mbezb
  RUNTIME_FIX_SHA: 100dbf31a3ecb436ed03af9858b3e716a81b92e1
  SOURCE_BLOB: 01575e19315e69624d104d9c5d2b23a3f36e469d
  OPEN_TEST_BLOB: 8268832a903d77f0d40e027c5f2cd2a335e47aae
  SAVE_TEST_BLOB: a9fb0eb40d8b48b75a900318db72ad62bb825b3e

jobs:
  shipping-terminal-truth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact shipping parent and runtime overlay
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi

          git fetch --no-tags origin             "+refs/heads/$SHIPPING_PARENT_BRANCH:refs/remotes/origin/shipping-parent"             "+refs/heads/$RUNTIME_FIX_BRANCH:refs/remotes/origin/runtime-fix"
          test "$(git rev-parse refs/remotes/origin/shipping-parent)" = "$SHIPPING_PARENT_SHA"
          test "$(git rev-parse refs/remotes/origin/runtime-fix)" = "$RUNTIME_FIX_SHA"
          test "$(git merge-base "$SHIPPING_PARENT_SHA" HEAD)" = "$SHIPPING_PARENT_SHA"
          git diff --check "$SHIPPING_PARENT_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$SHIPPING_PARENT_SHA"...HEAD | sort)
          expected=(
            ".github/workflows/current-shipping-pgn-open-terminal-truth.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_pgn_open_worker.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_save_worker.py)" = "$SAVE_TEST_BLOB"
          test "$(git rev-parse refs/remotes/origin/runtime-fix:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse refs/remotes/origin/runtime-fix:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"

      - name: Compile runtime, package and receipt boundaries
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          acs/version2_package_preflight.py
          acs/version2_package_assembler.py
          acs/version2_release_receipt.py
          scripts/finalize_owner_final_receipt.py
          tests/test_v2_windows_pgn_open_worker.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Execute PGN terminal, persistence and NVDA-adjacent contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_open_invalid_session
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_file_worker_preflight
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
          tests.test_pgn_document_passive_ingress
          tests.test_pgn_save_snapshot

      - name: Execute whole-product and durable shipping contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_host_runtime
          tests.test_version2_application
          tests.test_whole_product_user_journey
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening
          tests.test_version2_package_assembler
          tests.test_version2_release_receipt
          tests.test_finalize_owner_final_receipt
          tests.test_owner_physical_acceptance
          tests.test_owner_physical_acceptance_json_hardening
          tests.test_portable_launcher_contract

      - name: Core selftest
        run: python -m acs.selftest
