name: Owner Final Receipt Publication Durability

on:
  push:
    branches:
      - fix/owner-final-receipt-durability-20261005-sol56z8q7
  pull_request:
    branches:
      - fix/release-receipt-publication-durability-20261005-sol56z8q6
    paths:
      - scripts/finalize_owner_final_receipt.py
      - tests/test_finalize_owner_final_receipt.py
      - .github/workflows/owner-final-receipt-publication-durability.yml

permissions:
  contents: read

concurrency:
  group: owner-final-receipt-durability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: c3a95f6fc5eff79b08fc877e550a6fcda7d19611
  PARENT_BRANCH: fix/release-receipt-publication-durability-20261005-sol56z8q6
  EXPECTED_FINALIZER_SOURCE_BLOB: 1c316f9e0d7a6b03f300506a504c7f9b73e48afd
  EXPECTED_FINALIZER_TEST_BLOB: 38c08b1fa2f212d251e188ef87639405f238cd83
  EXPECTED_PORTABLE_SOURCE_BLOB: fb52da953d3a13ef8ca0d4568f7b2a9f796057fd
  EXPECTED_PORTABLE_TEST_BLOB: 7aba9bb9b3f79f91d1cea817e9553ccecd186952
  EXPECTED_RELEASE_RECEIPT_SOURCE_BLOB: 080cd37d881c98424b9b1141b19761d0e16beed9
  EXPECTED_RELEASE_RECEIPT_TEST_BLOB: 60cd5753337401092a7c78e48cf42e5d1ad51a56
  EXPECTED_PHYSICAL_SOURCE_BLOB: e19bf4663bee3545220f4fcea86ab5e367ab6c98
  EXPECTED_PHYSICAL_TEST_BLOB: 966c223f884e56ec241d66e73e4829de619f62d2
  EXPECTED_PHYSICAL_JSON_TEST_BLOB: 39d03730f0d21a8b004675e32fadd547dba7074b

jobs:
  durability:
    name: Owner final receipt durability / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact stacked scope and evidence-chain authority
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/owner-final-receipt-parent"
          live_parent="$(git rev-parse refs/remotes/origin/owner-final-receipt-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "OWNER_FINAL_RECEIPT_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/owner-final-receipt-publication-durability.yml"
            "scripts/finalize_owner_final_receipt.py"
            "tests/test_finalize_owner_final_receipt.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:scripts/finalize_owner_final_receipt.py)" = "$EXPECTED_FINALIZER_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_finalize_owner_final_receipt.py)" = "$EXPECTED_FINALIZER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_portable_package.py)" = "$EXPECTED_PORTABLE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_portable_package.py)" = "$EXPECTED_PORTABLE_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_release_receipt.py)" = "$EXPECTED_RELEASE_RECEIPT_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_release_receipt.py)" = "$EXPECTED_RELEASE_RECEIPT_TEST_BLOB"
          test "$(git rev-parse HEAD:scripts/record_owner_physical_acceptance.py)" = "$EXPECTED_PHYSICAL_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_owner_physical_acceptance.py)" = "$EXPECTED_PHYSICAL_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_owner_physical_acceptance_json_hardening.py)" = "$EXPECTED_PHYSICAL_JSON_TEST_BLOB"

          echo "OWNER_FINAL_RECEIPT_PARENT=$EXPECTED_PARENT"
          echo "OWNER_FINAL_RECEIPT_DURABILITY_HEAD=$expected_head"

      - name: Set up canonical package-test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile machine-to-physical evidence chain
        run: >-
          python -m py_compile
          scripts/finalize_owner_final_receipt.py
          acs/version2_portable_package.py
          acs/version2_release_receipt.py
          scripts/record_owner_physical_acceptance.py
          tests/test_finalize_owner_final_receipt.py
          tests/test_version2_portable_package.py
          tests/test_version2_release_receipt.py
          tests/test_owner_physical_acceptance.py
          tests/test_owner_physical_acceptance_json_hardening.py

      - name: Run durability and evidence-chain regressions
        run: >-
          python -m unittest -v
          tests.test_finalize_owner_final_receipt
          tests.test_version2_portable_package
          tests.test_version2_release_receipt
          tests.test_owner_physical_acceptance
          tests.test_owner_physical_acceptance_json_hardening
