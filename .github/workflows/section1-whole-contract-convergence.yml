jobs:
  whole-section:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact predecessor-aware whole-Section geometry
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ -n "${EVENT_BASE_REF:-}" ]; then
            test "$EVENT_BASE_REF" = "section0/import-batch-runtime-isolation-20261007-sol56"
            test "$EVENT_BASE_SHA" = "$SECTION0_PREDECESSOR_SHA"
          fi
          test "$(git merge-base "$SECTION0_PREDECESSOR_SHA" HEAD)" = "$SECTION0_PREDECESSOR_SHA"
          for ancestor in "$SECTION1_SUCCESSOR_SHA" "$SECTION1_SERIALIZATION_SHA" "$SECTION1_EPD_SHA" "$SECTION1_PARENT_SHA" "$SAN_OWNER_SHA" "$RECEIPT_OWNER_SHA" "$EDGE_OWNER_SHA" "$POSITION_OWNER_SHA" "$CONVERGENCE_ANCHOR_SHA" "$FEN_SAN_CASTLING_HEAD"; do
            git merge-base --is-ancestor "$ancestor" HEAD
          done
          git diff --check "$SECTION0_PREDECESSOR_SHA"...HEAD
          changed="$(git diff --name-only "$SECTION0_PREDECESSOR_SHA"...HEAD | sort)"
          expected="$(cat <<'EOF' | sort
          .github/workflows/current-fen-history-section1-convergence.yml
          .github/workflows/section1-epd-serialization-revalidation.yml
          .github/workflows/section1-fen-castling-order.yml
          .github/workflows/section1-fen-corpus-source-snapshot.yml
          .github/workflows/section1-fen-edge-corpus.yml
          .github/workflows/section1-fen-en-passant-fullmove.yml
          .github/workflows/section1-fen-en-passant-halfmove.yml
          .github/workflows/section1-fen-field-count.yml
          .github/workflows/section1-king-capture-boundary.yml
          .github/workflows/section1-positionstate-counter-boundary.yml
          .github/workflows/section1-positionstate-serialization-boundary.yml
          .github/workflows/section1-san-internal-whitespace.yml
          .github/workflows/section1-san-transition-contract.yml
          .github/workflows/section1-whole-contract-convergence.yml
          acs/chesscore.py
          acs/epd.py
          acs/input_limits.py
          acs/notation.py
          acs/position_editor.py
          acs/version2_profile.py
          acs/stage1_release_ui_core.py
          acs/ui_analysis_adapter.py
          acs/webapp.py
          acs/webapp_keymap.py
          acs/webapp_keymap_core.py
          docs/automation/SECTION1_CLOSURE_CANDIDATE.md
          tests/data/fen_edge_corpus_v1.json
          tests/test_dev2_fen_atomicity.py
          tests/test_epd.py
          tests/test_fen_edge_corpus.py
          tests/test_fen_position_editor_complete_user_flow.py
          tests/test_p0f_lawful_starter_bundle.py
          tests/test_qualify_fen_position_corpus.py
          tests/test_section1_fen_castling_order.py
          tests/test_section1_fen_en_passant_fullmove.py
          tests/test_section1_fen_en_passant_halfmove.py
          tests/test_section1_fen_field_count.py
          tests/test_section1_king_capture_boundary.py
          tests/test_section1_positionstate_counter_boundary.py
          tests/test_section1_positionstate_serialization_boundary.py
          tests/test_section1_san_internal_whitespace.py
          tests/test_section1_san_transition_contract.py
          tests/test_stage1_engine_play_ui.py
          tests/test_ui_analysis_adapter.py
          tests/test_ui_analysis_webapp.py
          tools/p0f_lawful_starter_bundle.py
          tools/qualify_fen_position_corpus.py
          web/index.html
          EOF
          )"
          test "$changed" = "$expected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = "48"

      - name: Bind exact current authorities and all consumed residuals
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/input_limits.py)" = "$INPUT_LIMITS_BLOB"
          test "$(git rev-parse HEAD:acs/notation.py)" = "$NOTATION_BLOB"
          test "$(git rev-parse HEAD:acs/chesscore.py)" = "$CHESSCORE_BLOB"
          test "$(git rev-parse HEAD:acs/webapp.py)" = "$WEBAPP_BLOB"
          test "$(git rev-parse HEAD:acs/position_editor.py)" = "$POSITION_EDITOR_BLOB"
          test "$(git rev-parse HEAD:acs/version2_profile.py)" = "$VERSION2_PROFILE_BLOB"
          test "$(git rev-parse HEAD:acs/epd.py)" = "$EPD_BLOB"
          test "$(git rev-parse HEAD:acs/import_contract.py)" = "$IMPORT_CONTRACT_BLOB"
          test "$(git rev-parse HEAD:tools/qualify_fen_position_corpus.py)" = "$QUALIFIER_BLOB"
          test "$(git rev-parse HEAD:tests/test_qualify_fen_position_corpus.py)" = "$QUALIFIER_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_san_transition_contract.py)" = "$SAN_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_fen_castling_order.py)" = "$FEN_CASTLING_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_positionstate_counter_boundary.py)" = "$POSITION_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/data/fen_edge_corpus_v1.json)" = "$EDGE_CORPUS_BLOB"
          test "$(git rev-parse HEAD:tests/test_fen_edge_corpus.py)" = "$EDGE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_fen_field_count.py)" = "$FIELD_COUNT_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev2_fen_atomicity.py)" = "$DEV2_FEN_ATOMICITY_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_king_capture_boundary.py)" = "$KING_CAPTURE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_san_internal_whitespace.py)" = "$SAN_WHITESPACE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_fen_en_passant_halfmove.py)" = "$EP_HALFMOVE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_fen_en_passant_fullmove.py)" = "$EP_FULLMOVE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_positionstate_serialization_boundary.py)" = "$POSITION_SERIALIZATION_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_epd.py)" = "$EPD_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_ui_analysis_webapp.py)" = "$UI_WEBAPP_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_fen_position_editor_complete_user_flow.py)" = "$POSITION_EDITOR_FLOW_TEST_BLOB"
          test "$(git rev-parse HEAD:tools/p0f_lawful_starter_bundle.py)" = "$P0F_BUILDER_BLOB"
          test "$(git rev-parse HEAD:tests/test_p0f_lawful_starter_bundle.py)" = "$P0F_BUILDER_TEST_BLOB"

          test "$(git rev-parse HEAD:.github/workflows/current-fen-history-section1-convergence.yml)" = "$RECEIPT_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-fen-corpus-source-snapshot.yml)" = "$SOURCE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-fen-edge-corpus.yml)" = "$EDGE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-fen-castling-order.yml)" = "$FEN_CASTLING_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-positionstate-counter-boundary.yml)" = "$POSITION_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-fen-field-count.yml)" = "$FIELD_COUNT_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-king-capture-boundary.yml)" = "$KING_CAPTURE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-san-internal-whitespace.yml)" = "$SAN_WHITESPACE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-san-transition-contract.yml)" = "$SAN_TRANSITION_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-fen-en-passant-halfmove.yml)" = "$EP_HALFMOVE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-fen-en-passant-fullmove.yml)" = "$EP_FULLMOVE_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-positionstate-serialization-boundary.yml)" = "$POSITION_SERIALIZATION_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/section1-epd-serialization-revalidation.yml)" = "$EPD_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:docs/automation/SECTION1_CLOSURE_CANDIDATE.md)" = "$CLOSURE_DOC_BLOB"

          python - <<'PY'
          from tools import qualify_fen_position_corpus as qualifier
          from acs.import_contract import read_source_snapshot
          assert qualifier.read_source_snapshot is read_source_snapshot
          print("SECTION1_PREDECESSOR_AWARE_SOURCE_AUTHORITY=PASS")
          PY

      - name: Compile Section 1 contract surface
        run: >-
          python -m py_compile
          acs/input_limits.py
          acs/notation.py
          acs/chesscore.py
          acs/position_editor.py
          acs/version2_profile.py
          acs/epd.py
          acs/import_contract.py
          tools/qualify_fen_position_corpus.py
          tests/test_section1_san_transition_contract.py
          tests/test_section1_fen_castling_order.py
          tests/test_section1_fen_field_count.py
          tests/test_section1_king_capture_boundary.py
          tests/test_section1_san_internal_whitespace.py
          tests/test_section1_fen_en_passant_halfmove.py
          tests/test_section1_fen_en_passant_fullmove.py
          tests/test_section1_positionstate_counter_boundary.py
          tests/test_section1_positionstate_serialization_boundary.py
          tests/test_fen_edge_corpus.py
          tests/test_qualify_fen_position_corpus.py
          tools/p0f_lawful_starter_bundle.py
          tests/test_p0f_lawful_starter_bundle.py

      - name: Execute FEN SAN Position whole contract
        run: >-
          python -m unittest -v
          tests.test_section1_san_transition_contract
          tests.test_section1_fen_castling_order
          tests.test_section1_fen_field_count
          tests.test_section1_king_capture_boundary
          tests.test_section1_san_internal_whitespace
          tests.test_section1_fen_en_passant_halfmove
          tests.test_section1_fen_en_passant_fullmove
          tests.test_d02_canonical_move_scalar_fail_closed
          tests.test_dev2_fen_atomicity
          tests.test_notation
          tests.test_fen_input_budget_current
          tests.test_fen_position_editor_complete_user_flow
          tests.test_version2_release_ui
          tests.test_version2_application
          tests.test_full_product_native_menu
          tests.test_ui_keymap_adapter
          tests.test_position_editor
          tests.test_position_editor_passive_boundary
          tests.test_position_text_authority
          tests.test_section1_positionstate_counter_boundary
          tests.test_section1_positionstate_serialization_boundary
          tests.test_epd
          tests.test_fen_edge_corpus
          tests.test_qualify_fen_position_corpus
          tests.test_import_contract
          tests.test_import_registry
          tests.test_stage1_fen_history_atomicity_current
          tests.test_stage1_move_history_atomicity_current
          tests.test_stage1_engine_play_ui
          tests.test_ui_analysis_adapter
          tests.test_ui_analysis_webapp
          tests.test_release_stockfish_composition

      - name: Execute lawful-corpus canonical-legality regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests.test_p0f_lawful_starter_bundle import (
              test_quality_evidence_rejects_strictly_parsed_but_canonically_illegal_game,
          )
          test_quality_evidence_rejects_strictly_parsed_but_canonically_illegal_game()
          print("SECTION1_LAWFUL_CORPUS_CANONICAL_LEGALITY_REGRESSION=PASS")
          PY

      - name: Execute retained History EPD GameTree PGN adjacency
        run: >-
          python -m unittest -v
          tests.test_history_review_complete_user_flow
          tests.test_epd
          tests.test_gametree
          tests.test_gametree_accessible_completion
          tests.test_pgn_workspace
          tests.test_version2_pgn_commands

      - name: Retained PGN browser DOM
        run: node tests/js/pgn_surface_dom_test.js

      - name: Core chess selftest
        run: python -m acs.selftest

  lawful-fen-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Bind lawful corpus authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:docs/P0F_STARTER_CONTENT_PROVENANCE.md)" = "$P0F_PROVENANCE_BLOB"
          test "$(git rev-parse HEAD:tools/p0f_lawful_starter_bundle.py)" = "$P0F_BUILDER_BLOB"
          test "$(git rev-parse HEAD:tests/test_p0f_lawful_starter_bundle.py)" = "$P0F_BUILDER_TEST_BLOB"
          test "$(git rev-parse HEAD:tools/qualify_fen_position_corpus.py)" = "$QUALIFIER_BLOB"
          test "$(git rev-parse HEAD:tests/test_qualify_fen_position_corpus.py)" = "$QUALIFIER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/import_contract.py)" = "$IMPORT_CONTRACT_BLOB"

      - name: Install qualified corpus decompressor
        run: python -m pip install -q zstandard==0.23.0

      - name: Build pinned CC0 real-game sample
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/p0f_lawful_starter_bundle.py .fen-lawful

      - name: Bind produced sample to CC0 provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(".fen-lawful")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          source = manifest["starter_source"]
          starter = root / "starter_uk.pgn"
          entry = manifest["files"]["starter_uk.pgn"]
          digest = hashlib.sha256(starter.read_bytes()).hexdigest()
          assert source["compressed_sha256"] == os.environ["PINNED_CORPUS_SHA256"]
          assert source["license_id"] == "CC0-1.0"
          assert int(source["selected_games"]) >= 200
          assert entry["license_id"] == "CC0-1.0"
          assert entry["sha256"] == digest
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"LAWFUL_FEN_STARTER_SHA256={digest}\n")
          print("LAWFUL_FEN_CORPUS_PROVENANCE=PASS")
          PY

      - name: Qualify real FEN Position corpus
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/qualify_fen_position_corpus.py             .fen-lawful/starter_uk.pgn             --min-games 200             --min-positions 5000             --require-edge-coverage             --json-out .fen-lawful/fen_position_qualification.json

      - name: Bind report to the same lawful source bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(".fen-lawful")
          starter = root / "starter_uk.pgn"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          report = json.loads((root / "fen_position_qualification.json").read_text(encoding="utf-8"))
          entry = manifest["files"]["starter_uk.pgn"]
          expected = os.environ["LAWFUL_FEN_STARTER_SHA256"]
          current_digest = hashlib.sha256(starter.read_bytes()).hexdigest()
          assert len(expected) == 64
          assert entry["sha256"] == expected
          assert current_digest == expected
          assert report["source_sha256"] == expected
          assert int(report["game_count"]) >= 200
          assert int(report["position_count"]) >= 5000
          for key in (
              "white_to_move_count",
              "black_to_move_count",
              "castling_rights_count",
              "no_castling_rights_count",
              "en_passant_count",
              "halfmove_nonzero_count",
              "fullmove_gt_one_count",
          ):
              assert int(report[key]) >= 1, key
          print("SECTION1_LAWFUL_FEN_REPORT_BINDING=PASS")
          PY
