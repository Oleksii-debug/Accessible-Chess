name: Legacy Stage 1 RC3 Publisher — DISABLED

# SECURITY TOMBSTONE.
# The RC3 publisher predates the fail-closed Windows strict release chain and
# must never publish or reconstruct a human-rejected candidate.  Keep this
# workflow only as an auditable fail-closed marker; current candidates are
# produced exclusively by the QA-owned strict release workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-release-disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject legacy release path
        shell: bash
        run: |
          echo "::error::LEGACY_RELEASE_PATH_DISABLED: use the current Windows strict release chain; no artifact was created."
          exit 1
