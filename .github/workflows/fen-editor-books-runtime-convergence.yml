name: FEN Editor Books Runtime Convergence

on:
  pull_request:
    branches:
      - converge/html-epub-runtime-final-20261006-sol56z9
    paths:
      - '.github/workflows/fen-editor-books-runtime-convergence.yml'
      - 'acs/position_editor.py'
      - 'acs/webapp.py'
      - 'tests/test_fen_position_editor_complete_user_flow.py'
      - 'web/index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fen-editor-books-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POSITION_EDITOR_BLOB: fd48b517c4489fe70e4ecb102e2615027be8f098
  WEBAPP_BLOB: 5aeff44ea3a1ed6ee0f5f29d8b2bfd40a17904a6
  FEN_FLOW_TEST_BLOB: b7ce89cd32915e3daaa1aa0b4368e2e77df2ee11
  WEB_INDEX_BLOB: 4aa2227fa115d79a06e9aba109d472ecc1e23e03

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact geometry and FEN blobs
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/html-epub-runtime-final-20261006-sol56z9}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/fen-editor-books-runtime-convergence.yml' \
            'acs/position_editor.py' \
            'acs/webapp.py' \
            'tests/test_fen_position_editor_complete_user_flow.py' \
            'web/index.html' | sort)"
          test "$changed" = "$expected_paths"
          test "$(git rev-parse HEAD:acs/position_editor.py)" = "$POSITION_EDITOR_BLOB"
          test "$(git rev-parse HEAD:acs/webapp.py)" = "$WEBAPP_BLOB"
          test "$(git rev-parse HEAD:tests/test_fen_position_editor_complete_user_flow.py)" = "$FEN_FLOW_TEST_BLOB"
          test "$(git rev-parse HEAD:web/index.html)" = "$WEB_INDEX_BLOB"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile FEN editor surfaces
        run: >-
          python -m py_compile
          acs/position_editor.py
          acs/webapp.py
          tests/test_fen_position_editor_complete_user_flow.py

      - name: Execute complete FEN editor journey
        run: >-
          python -m unittest -v
          tests.test_fen_position_editor_complete_user_flow
          tests.test_position_editor
          tests.test_position_text_authority
          tests.test_dev2_fen_atomicity
          tests.test_fen_input_budget_current
          tests.test_pgn_document_new_game_position_integrity
          tests.test_pgn_document_new_game_position_workflow

      - name: Preserve current accessible FEN action and composition contracts
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_full_product_native_menu
          tests.test_ui_keymap_adapter
          tests.test_version2_release_ui
          tests.test_dev1_full_product_webview_adapter
          tests.test_version2_final_product_composition

      - name: Re-run converged Books runtime contracts
        run: >-
          python -m unittest -v
          tests.test_book_html_runtime_correctness
          tests.test_book_epub_runtime_correctness
          tests.test_book_active_import_cancellation
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import
          tests.test_book_html_pgn_loss_accounting
          tests.test_bookdocument
          tests.test_bookreader

      - name: Core selftest
        run: python -m acs.selftest
