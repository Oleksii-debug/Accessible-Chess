name: D06 PGN Nested Comment Recovery

on:
  push:
    branches:
      - work/v2-pgn-nested-comment-recovery-20260901
  pull_request:
    branches:
      - work/v2-pgn-semantic-fidelity-20260831
    paths:
      - 'acs/gametree.py'
      - 'acs/pgn_roundtrip.py'
      - 'tests/test_v2_pgn_nested_comment_recovery.py'
      - 'tests/test_pgn_document.py'
      - 'scripts/v2_pgn_nested_comment_real_book_oracle.py'
      - '.github/workflows/d06-current-base-pgn-compatibility.yml'
      - '.github/workflows/d06-pgn-nested-comment-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d06-pgn-nested-comment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      OWNER_BASE: ae457da7ace58303b08493d1c86de4770f5ba30c
      PGN03_EVIDENCE_HEAD: f2993ef7d79369ef5e7161ba1d75273e7c9a24d3
      BOOK_URL: https://www.gutenberg.org/files/16377/16377-h/16377-h.htm
      BOOK_SHA256: 397cd3d816b6e685d30d3d7cfb36627cff415c754cc8f4e455c24da652d3c21e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove owner ancestry and atomic D06 scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$OWNER_BASE" HEAD
          git diff --check "$OWNER_BASE" HEAD
          changed="$(git diff --name-only "$OWNER_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d06-current-base-pgn-compatibility.yml' \
            '.github/workflows/d06-pgn-nested-comment-recovery.yml' \
            'acs/gametree.py' \
            'acs/pgn_roundtrip.py' \
            'scripts/v2_pgn_nested_comment_real_book_oracle.py' \
            'tests/test_pgn_document.py' \
            'tests/test_v2_pgn_nested_comment_recovery.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$OWNER_BASE" HEAD -- \
            acs/chesscore.py \
            acs/gametree_legality.py \
            acs/acsdb.py \
            acs/duplicate_detection.py \
            acs/bookdocument.py \
            acs/book_html_import.py \
            acs/chessbase.py \
            acs/stage1_release_ui.py \
            web

      - name: Compile recovery package
        run: >-
          python -m compileall -q
          acs/gametree.py
          acs/pgn_roundtrip.py
          tests/test_pgn_document.py
          tests/test_v2_pgn_nested_comment_recovery.py
          scripts/v2_pgn_nested_comment_real_book_oracle.py

      - name: Focused canonical PGN regressions
        run: >-
          python -m unittest -v
          tests.test_v2_pgn_nested_comment_recovery
          tests.test_v2_pgn_semantic_fidelity
          tests.test_d06_pgn_roundtrip
          tests.test_gametree
          tests.test_pgn_document

      - name: Materialize exact pinned PGN-03 real-corpus oracles
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/298/head:refs/remotes/origin/pgn03-evidence
          test "$(git rev-parse refs/remotes/origin/pgn03-evidence)" = "$PGN03_EVIDENCE_HEAD"
          git show "$PGN03_EVIDENCE_HEAD:scripts/pgn_real_corpus_oracle.py" > scripts/pgn_real_corpus_oracle.py
          git show "$PGN03_EVIDENCE_HEAD:scripts/pgn_real_corpus_session_oracle.py" > scripts/pgn_real_corpus_session_oracle.py
          git show "$PGN03_EVIDENCE_HEAD:scripts/pgn_real_eval_rav_oracle.py" > scripts/pgn_real_eval_rav_oracle.py
          python -m py_compile \
            scripts/pgn_real_corpus_oracle.py \
            scripts/pgn_real_corpus_session_oracle.py \
            scripts/pgn_real_eval_rav_oracle.py
          python -m scripts.pgn_real_corpus_session_oracle --selftest

      - name: Pinned annotated SetUp FEN nested-RAV oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn_real_eval_rav_oracle 2>&1 | tee pgn-nested-real-rav.txt
          grep -F '"prefix_pinned": true' pgn-nested-real-rav.txt
          grep -F '"nested_path_depth": 2' pgn-nested-real-rav.txt
          grep -F 'PGN REAL EVAL FEN NESTED RAV PASS' pgn-nested-real-rav.txt

      - name: Pinned real 4000-game annotated corpus round-trip
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn_real_corpus_session_oracle --games-per-corpus 2000 --batch-size 250 2>&1 | tee pgn-nested-real-corpus.txt
          grep -F '"sampled_records_total": 4000' pgn-nested-real-corpus.txt
          grep -F 'PGN REAL CORPUS SESSION ROUND-TRIP PASS' pgn-nested-real-corpus.txt

      - name: Download exact lawful Project Gutenberg corpus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ["BOOK_URL"]
          for attempt in range(4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Accessible-Chess-CI/1.0 D06-real-book-verification"},
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read()
                  with open("real-book-16377.html", "wb") as stream:
                      stream.write(data)
                  print(f"downloaded {len(data)} bytes")
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 ** attempt)
          PY

      - name: Prove exact real PGN 73 recovery and strict canonical reopen
        run: >-
          python -m scripts.v2_pgn_nested_comment_real_book_oracle
          real-book-16377.html
          --expected-sha256 ${{ env.BOOK_SHA256 }}

      - name: Remove transient corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- real-book-16377.html
          test ! -e real-book-16377.html

      - name: Remove materialized inherited QA scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- \
            scripts/pgn_real_corpus_oracle.py \
            scripts/pgn_real_corpus_session_oracle.py \
            scripts/pgn_real_eval_rav_oracle.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Selftest and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Prove no corpus or backend residue
        shell: bash
        run: |
          set -euo pipefail
          test ! -e real-book-16377.html
          test ! -d third_party
          test ! -d tools/libcbh
          test ! -d tools/uncbv
