name: Windows Unicode Path Portability

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'tests/test_windows_unicode_path_portability.py'
      - '.github/workflows/windows-unicode-path-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-unicode-path-portability-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BASE: 3c69ac281915418574d84c62d928d26db567cd5a

jobs:
  path-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Prove exact Product ancestry and test-only scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git cat-file -e "$PRODUCT_BASE^{commit}"
          test "$(git merge-base "$PRODUCT_BASE" HEAD)" = "$PRODUCT_BASE"
          git diff --check "$PRODUCT_BASE" HEAD

          changed="$(git diff --name-only "$PRODUCT_BASE" HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/windows-unicode-path-portability.yml' \
            'tests/test_windows_unicode_path_portability.py' | sort)"
          test "$changed" = "$expected_paths"

          git diff --quiet "$PRODUCT_BASE" HEAD -- acs web packaging run_accessible_chess.py
          echo 'WINDOWS_PATH_PORTABILITY_SCOPE=TEST_WORKFLOW_ONLY'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile portability oracle
        run: python -m py_compile tests/test_windows_unicode_path_portability.py

      - name: Run path portability and adjacent owner regressions
        run: >-
          python -m unittest -v
          tests.test_windows_unicode_path_portability
          tests.test_settings
          tests.test_whole_product_user_journey
          tests.test_v2_windows_nvda_file_workflows
          tests.test_d07_library_import_service
          tests.test_d07_library_export_service
          tests.test_v2_windows_library_export
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import
          tests.test_version2_epub_application_reachability
          tests.test_v2_book_progress_store_production
          tests.test_v2_user_error_surface_privacy

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
