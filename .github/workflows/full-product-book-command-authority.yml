name: Current Full Product Book Command Authority

on:
  push:
    branches:
      - qualification/current-apex-book-command-authority-20261004-sol
    paths:
      - 'tests/test_full_product_book_command_authority.py'
      - 'tests/test_current_main_full_product_convergence_workflow.py'
      - '.github/workflows/full-product-book-command-authority.yml'
      - '.github/workflows/full-product-convergence-integration-20261004.yml'
  pull_request:
    branches:
      - converge/current-apex-user-library-seed-safety-20261004-sol
    paths:
      - 'tests/test_full_product_book_command_authority.py'
      - 'tests/test_current_main_full_product_convergence_workflow.py'
      - '.github/workflows/full-product-book-command-authority.yml'
      - '.github/workflows/full-product-convergence-integration-20261004.yml'

permissions:
  contents: read

concurrency:
  group: current-full-product-book-command-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify exact parent and regression-only scope
        shell: bash
        run: |
          set -euo pipefail
          base='4f7485f220f4250cac990aa89f257ebe219e208e'
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/full-product-book-command-authority.yml' \
            '.github/workflows/full-product-convergence-integration-20261004.yml' \
            'tests/test_current_main_full_product_convergence_workflow.py' \
            'tests/test_full_product_book_command_authority.py' | sort)"
          test "$changed" = "$expected"
          git diff --check "$base" HEAD
          echo 'BOOK_COMMAND_AUTHORITY_SCOPE=PASS'

      - name: Compile authority regressions
        run: >-
          python -m compileall -q
          tests/test_full_product_book_command_authority.py
          tests/test_current_main_full_product_convergence_workflow.py

      - name: Run Book command and whole-product authority regressions
        run: >-
          python -m unittest -v
          tests.test_full_product_book_command_authority
          tests.test_current_main_full_product_convergence_workflow
          tests.test_version2_application
          tests.test_v2_book_board_workflow

      - name: Run core selftest
        run: python -m acs.selftest
