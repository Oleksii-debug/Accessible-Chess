name: LiveKit Classroom Join Provider

on:
  push:
    branches:
      - feature/livekit-classroom-join-provider-v2-20261002
  pull_request:
    branches:
      - feature/classroom-join-credential-rpc-core-20261002
    paths:
      - 'acs/livekit_classroom_token_issuer.py'
      - 'tests/test_livekit_classroom_token_issuer.py'
      - '.github/workflows/livekit-classroom-join-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livekit-classroom-join-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prove current-base merge and bounded provider scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_REF" = "feature/classroom-join-credential-rpc-core-20261002"
          test -n "$PR_BASE_SHA"
          test -n "$PR_HEAD_SHA"
          git cat-file -e "$PR_BASE_SHA^{commit}"
          git cat-file -e "$PR_HEAD_SHA^{commit}"

          # pull_request checkout is GitHub's synthetic merge commit. This proves
          # the exact moving base and exact reviewed head compose before tests run.
          test "$(git rev-parse HEAD^1)" = "$PR_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"

          # Three-dot scope remains anchored at the true common ancestor, so base
          # hardening by parallel workers does not masquerade as this PR's delta.
          git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          actual="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/livekit-classroom-join-provider.yml' \
            'acs/livekit_classroom_token_issuer.py' \
            'tests/test_livekit_classroom_token_issuer.py' | sort)"
          test "$actual" = "$expected"
          git diff --quiet "$PR_BASE_SHA...$PR_HEAD_SHA" -- \
            acs/chesscore.py \
            acs/classroom_domain.py \
            acs/classroom_realtime_media.py \
            acs/classroom_join_credentials.py \
            web/livekit_classroom_media.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile provider and canonical join boundary
        run: >-
          python -m compileall -q
          acs/livekit_classroom_token_issuer.py
          acs/classroom_join_credentials.py
          tests/test_livekit_classroom_token_issuer.py
          tests/test_classroom_join_credentials.py

      - name: Install exact reviewed LiveKit server SDK
        run: python -m pip install --disable-pip-version-check --no-input livekit-api==1.2.1

      - name: Run provider, join and media authority regressions
        run: >-
          python -m unittest -v
          tests.test_livekit_classroom_token_issuer
          tests.test_classroom_join_credentials
          tests.test_classroom_realtime_media

      - name: Prove reviewed LiveKit SDK grant surface
        shell: bash
        run: |
          python - <<'PY'
          from livekit import api
          grant = api.VideoGrants(
              room_join=True,
              room="contract-room",
              room_admin=False,
              can_publish=True,
              can_subscribe=True,
              can_publish_data=False,
              can_publish_sources=["microphone", "camera", "screen_share"],
              can_update_own_metadata=False,
              hidden=False,
          )
          assert grant.room_join is True
          assert grant.room == "contract-room"
          assert grant.room_admin is False
          assert grant.can_publish is True
          assert grant.can_subscribe is True
          assert grant.can_publish_data is False
          assert grant.can_publish_sources == [
              "microphone",
              "camera",
              "screen_share",
          ]
          assert grant.can_update_own_metadata is False
          assert grant.hidden is False
          assert callable(api.AccessToken.with_identity)
          assert callable(api.AccessToken.with_ttl)
          assert callable(api.AccessToken.with_grants)
          assert callable(api.AccessToken.to_jwt)
          print("LIVEKIT_REVIEWED_SDK_SURFACE=PASS")
          PY

      - name: Core selftest
        run: python -m acs.selftest
