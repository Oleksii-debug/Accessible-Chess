name: Temporary V2 Current Tree Export

on:
  push:
    branches:
      - tmp/v2-data-release-current-tree-export-20260828

permissions:
  contents: read

jobs:
  export-tree:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Archive complete committed tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git hash-object acs/version2_upgrade.py
          git archive --format=zip --output=/tmp/v2-current-tree-complete.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: v2-current-tree-complete
          path: /tmp/v2-current-tree-complete.zip
          if-no-files-found: error
          retention-days: 1
