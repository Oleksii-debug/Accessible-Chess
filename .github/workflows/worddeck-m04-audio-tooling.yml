name: WordDeck M04 audio tooling

on:
  pull_request:
    branches:
      - worddeck-bootstrap
    paths:
      - WordDeck/tools/produce_m04_audio.py
      - .github/workflows/worddeck-m04-audio-tooling.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-m04-audio-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "M04 audio tooling checkout mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile tooling
        run: python -m py_compile WordDeck/tools/produce_m04_audio.py
      - name: Run deterministic fail-closed self-test
        run: python WordDeck/tools/produce_m04_audio.py --self-test
