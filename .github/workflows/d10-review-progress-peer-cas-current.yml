name: D10 Review Progress Peer CAS Current

on:
  pull_request:
    paths:
      - 'tests/test_d10_review_progress_peer_cas.py'
      - '.github/workflows/d10-review-progress-peer-cas-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d10-review-progress-peer-cas-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      INTEGRATED_AUTHORITY_SHA: 6618292424b1942d2e176a41e15d31dc93adfe70
      RETAINED_PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
      SOURCE_TEST_BLOB: 407b2a68b29be6715fc08ff44c2566e30784cb58
      PRODUCT_STORE_BLOB: cdde3943fcf07f70b21da2c28bc0a984b9dfef2b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove candidate scope or retained Full Product authority
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${INTEGRATED_AUTHORITY_SHA}^{commit}"
          git merge-base --is-ancestor "$INTEGRATED_AUTHORITY_SHA" HEAD

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${GITHUB_HEAD_REF:-}" != "$RETAINED_PRODUCT_BRANCH" ]; then
            test "${GITHUB_BASE_REF:-}" = "$RETAINED_PRODUCT_BRANCH"
            git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
            test "$base" = "$INTEGRATED_AUTHORITY_SHA"
            changed="$(git diff --name-only "$base" HEAD | sort)"
            expected=".github/workflows/d10-review-progress-peer-cas-current.yml"
            test "$changed" = "$expected"
            git diff --check "$base" HEAD -- .github/workflows/d10-review-progress-peer-cas-current.yml
            printf 'peer-CAS gate mode=candidate base=%s head=%s\n' "$base" "$(git rev-parse HEAD)"
          else
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              test "${GITHUB_HEAD_REF:-}" = "$RETAINED_PRODUCT_BRANCH"
            fi
            git diff --check "$INTEGRATED_AUTHORITY_SHA" HEAD -- \
              .github/workflows/d10-review-progress-peer-cas-current.yml \
              tests/test_d10_review_progress_peer_cas.py
            printf 'peer-CAS gate mode=retained integrated-authority=%s head=%s\n' \
              "$INTEGRATED_AUTHORITY_SHA" "$(git rev-parse HEAD)"
          fi

          test "$(git rev-parse HEAD:tests/test_d10_review_progress_peer_cas.py)" = "$SOURCE_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/student_progress_store.py)" = "$PRODUCT_STORE_BLOB"
          test "$(git rev-parse "${INTEGRATED_AUTHORITY_SHA}:tests/test_d10_review_progress_peer_cas.py")" = "$SOURCE_TEST_BLOB"
          test "$(git rev-parse "${INTEGRATED_AUTHORITY_SHA}:acs/student_progress_store.py")" = "$PRODUCT_STORE_BLOB"

      - name: Compile qualification test
        run: python -m py_compile tests/test_d10_review_progress_peer_cas.py

      - name: Real spawned peer-CAS oracle and store regressions
        run: >-
          python -m pytest -q
          tests/test_d10_review_progress_peer_cas.py
          tests/test_dev3_student_progress_store.py
          tests/test_dev3_student_progress.py

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'
