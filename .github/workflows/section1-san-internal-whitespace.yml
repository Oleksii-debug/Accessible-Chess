name: Section 1 SAN Internal Whitespace Boundary

on:
  pull_request:
    branches:
      - 'section1/king-capture-boundary-20261007-sol56'
    paths:
      - '.github/workflows/section1-san-internal-whitespace.yml'
      - 'acs/chesscore.py'
      - 'tests/test_section1_san_internal_whitespace.py'

permissions:
  contents: read

concurrency:
  group: section1-san-internal-whitespace-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT_SHA: 8d72eaf3ad9eb9532fe67e8cf977d71b8a0555c5
  CHESSCORE_BLOB: ad67814942fc3eb8f7dce71c8e99032d94cd0f65
  TEST_BLOB: 3ac34b9d915d047a8e35692bbdf9c941539b5227
  NOTATION_BLOB: eed13c31993fa9979b6a2cbd608cce63c1ce74df
  TRANSITION_TEST_BLOB: 22e493307ac650d14f7fa7300d80cffcd100f36b
  KING_CAPTURE_TEST_BLOB: 4c0facef788c2ace18cbed0fcaeee9195113ec9f
  FEN_FIELD_TEST_BLOB: 9d9917a46fd4cbf99f4d966e8e44b8602caf9222
  DEV2_FEN_ATOMICITY_TEST_BLOB: 1cc88c136b5a9b711b5e495d1752a67be310a7e0

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact descendant geometry
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$EVENT_BASE_REF" = "section1/king-capture-boundary-20261007-sol56"
          if [ "$EVENT_BASE_SHA" != "$EXPECTED_PARENT_SHA" ]; then
            git merge-base --is-ancestor "$EVENT_BASE_SHA" "$EXPECTED_PARENT_SHA"
          fi
          test "$(git merge-base "$EXPECTED_PARENT_SHA" HEAD)" = "$EXPECTED_PARENT_SHA"
          git diff --check "$EXPECTED_PARENT_SHA"...HEAD
          changed="$(git diff --name-only "$EXPECTED_PARENT_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/section1-san-internal-whitespace.yml' \
            'acs/chesscore.py' \
            'tests/test_section1_san_internal_whitespace.py' | sort)"
          test "$changed" = "$expected"

      - name: Bind exact SAN authorities and regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/chesscore.py)" = "$CHESSCORE_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_san_internal_whitespace.py)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:acs/notation.py)" = "$NOTATION_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_san_transition_contract.py)" = "$TRANSITION_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_king_capture_boundary.py)" = "$KING_CAPTURE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_fen_field_count.py)" = "$FEN_FIELD_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev2_fen_atomicity.py)" = "$DEV2_FEN_ATOMICITY_TEST_BLOB"

      - name: Compile focused contract
        run: >-
          python -m py_compile
          acs/chesscore.py
          acs/notation.py
          tests/test_section1_san_internal_whitespace.py
          tests/test_section1_san_transition_contract.py
          tests/test_section1_king_capture_boundary.py
          tests/test_section1_fen_field_count.py
          tests/test_dev2_fen_atomicity.py

      - name: Execute SAN boundary and adjacent Section 1 regressions
        run: >-
          python -m unittest -v
          tests.test_section1_san_internal_whitespace
          tests.test_section1_san_transition_contract
          tests.test_notation
          tests.test_section1_king_capture_boundary
          tests.test_section1_fen_field_count
          tests.test_dev2_fen_atomicity
          tests.test_d02_canonical_move_scalar_fail_closed
          tests.test_section1_fen_castling_order

      - name: Core chess selftest
        run: python -m acs.selftest
