name: Current Shipping PGN Cancellation Successor

on:
  push:
    branches:
      - converge/current-shipping-pgn-cancel-successor-20261006-ooxple7
  pull_request:
    branches:
      - converge/current-shipping-atomicity-evidence-successor-20261006-sol56
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-shipping-pgn-cancel-successor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BASE_BRANCH: converge/current-shipping-atomicity-evidence-successor-20261006-sol56
  BASE_SHA: 83688b768408f582a43d8a4fb1209dc720f925c7
  SOURCE_BLOB: f28b413316c77ff4f6726d0a0a8fe8f5f6d47295
  OPEN_TEST_BLOB: 79e1c0056b0d62f3d429fef5428f31df1e45b2a2
  SAVE_TEST_BLOB: a9fb0eb40d8b48b75a900318db72ad62bb825b3e

jobs:
  shipping-pgn-cancel-successor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50

    steps:
      - name: Checkout exact successor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact shipping parent and bounded PGN successor
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi

          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/shipping-parent"
          live_base="$(git rev-parse refs/remotes/origin/shipping-parent)"
          test "$live_base" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-shipping-pgn-cancel-successor.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_pgn_open_worker.py"
            "tests/test_v2_windows_pgn_save_worker.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_save_worker.py)" = "$SAVE_TEST_BLOB"

      - name: Prove shipping evidence paths are inherited unchanged
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          for path in             acs/version2_release_receipt.py             scripts/finalize_owner_final_receipt.py             .github/workflows/w5-portable-package-contract.yml             .github/workflows/w5-release-receipt-contract.yml             .github/workflows/owner-final-receipt-publication-durability.yml
          do
            if grep -Fxq "$path" <<<"$changed"; then
              echo "shipping evidence path changed unexpectedly: $path" >&2
              exit 1
            fi
          done

      - name: Compile PGN persistence and publication boundary
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_pgn_open_worker.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Execute PGN persistence and malformed-boundary regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_pgn_save_snapshot
          tests.test_pgn_document_passive_ingress
          tests.test_v2_windows_file_worker_preflight
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_pgn_open_invalid_session
          tests.test_v2_windows_nvda_file_workflows

      - name: Execute runtime and application handoff regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_host_runtime
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
