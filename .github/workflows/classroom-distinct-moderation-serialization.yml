name: Classroom Distinct Moderation Serialization

on:
  pull_request:
    branches:
      - fix/classroom-join-identity-mapping-20261002
    paths:
      - 'acs/classroom_media_policy_authority.py'
      - 'tests/test_classroom_media_policy_authority.py'
      - 'tests/test_classroom_effect_lock_cross_process.py'
      - '.github/workflows/classroom-distinct-moderation-serialization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-distinct-moderation-serialization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  distinct-moderation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_BASE_REF" = "fix/classroom-join-identity-mapping-20261002"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          test -n "$base"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current identity-mapping parent $base is not an ancestor of HEAD; synchronize the stacked PR."
            exit 1
          fi
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/classroom-distinct-moderation-serialization.yml' \
            'acs/classroom_media_policy_authority.py' \
            'tests/test_classroom_effect_lock_cross_process.py' \
            'tests/test_classroom_media_policy_authority.py' | sort)"
          test "$changed" = "$allowed"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile serialized policy boundary
        run: >-
          python -m py_compile
          acs/classroom_media_policy_authority.py
          tests/test_classroom_media_policy_authority.py
          tests/test_classroom_effect_lock_cross_process.py

      - name: Run durable policy and join contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_media_policy_authority
          tests.test_classroom_effect_lock_cross_process
          tests.test_classroom_join_credentials
          tests.test_classroom_realtime_media

      - name: Prove cross-process serialization is not process-local
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'provider-effect-lock.sqlite3' acs/classroom_media_policy_authority.py
          grep -Fq 'BEGIN IMMEDIATE' acs/classroom_media_policy_authority.py
          grep -Fq 'asyncio.to_thread' acs/classroom_media_policy_authority.py
          grep -Fq 'async with self._authority.provider_effect_scope' acs/classroom_media_policy_authority.py
          ! grep -Fq 'self._effect_lock = asyncio.Lock' acs/classroom_media_policy_authority.py
          grep -Fq 'op-lock-camera-distinct' tests/test_classroom_media_policy_authority.py
          grep -Fq 'op-lock-microphone-distinct' tests/test_classroom_media_policy_authority.py
          grep -Fq 'self.assertEqual(provider.sources, set())' tests/test_classroom_media_policy_authority.py
          grep -Fq 'CancelledError' tests/test_classroom_media_policy_authority.py
          grep -Fq 'multiprocessing.get_context("spawn")' tests/test_classroom_effect_lock_cross_process.py
          grep -Fq '("blocked", None)' tests/test_classroom_effect_lock_cross_process.py
          grep -Fq '("acquired", None)' tests/test_classroom_effect_lock_cross_process.py
          grep -Fq 'os._exit(23)' tests/test_classroom_effect_lock_cross_process.py
          grep -Fq 'test_crashed_lock_owner_releases_effect_mutex_for_retry' tests/test_classroom_effect_lock_cross_process.py

      - name: Core selftest
        run: python -m acs.selftest
