name: Terminal Keybindings Current Product Convergence

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/keybindings.py'
      - 'acs/ui_keymap_adapter.py'
      - 'acs/ui_keymap_editor.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_native_menu.py'
      - 'web/index.html'
      - 'web/keybindings.json'
      - 'web/full_product_pgn.js'
      - 'web/full_product_library.js'
      - 'web/full_product_education.js'
      - 'tests/test_keybindings.py'
      - 'tests/test_accessible_webui.py'
      - 'tests/test_dev1_library_webview_projection.py'
      - 'tests/test_dev1_release_ui_regressions.py'
      - 'tests/test_issue22_release_contract.py'
      - 'tests/test_stage1_packaged_focus_origin_contract.py'
      - 'tests/test_stage1_board_action_integration.py'
      - 'tests/test_webview_keymap_bridge_contract.py'
      - 'tests/test_full_product_native_menu.py'
      - 'tests/test_full_product_pgn_keybindings.py'
      - 'tests/test_full_product_library_keybindings.py'
      - 'tests/test_full_product_education_keybindings.py'
      - 'tests/js/remappable_board_grid_controls_test.js'
      - 'tests/js/remappable_input_submit_keys_test.js'
      - 'tests/js/pgn_surface_dom_test.js'
      - 'tests/js/library_surface_dom_test.js'
      - 'tests/js/version2_library_open_route_refresh_dom_test.js'
      - 'tests/js/education_surface_dom_test.js'
      - '.github/workflows/d01-education-management-webview.yml'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - '.github/workflows/full-product-education-class-create.yml'
      - '.github/workflows/keybindings-terminal-current-product-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-keybindings-current-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PRODUCT_SHA: 109c31eae3211217ef93c9db33814cbf2756005c

jobs:
  convergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact Product ancestry and terminal scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.base.sha }}' = "$EXPECTED_PRODUCT_SHA"
          test '${{ github.event.pull_request.head.ref }}' = 'reconverge/keybindings-terminal-current-product-20260926'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test "$(git merge-base "$EXPECTED_PRODUCT_SHA" HEAD)" = "$EXPECTED_PRODUCT_SHA"
          git diff --check "$EXPECTED_PRODUCT_SHA" HEAD
          changed="$(git diff --name-only "$EXPECTED_PRODUCT_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d01-education-management-webview.yml' \
            '.github/workflows/d01-pgn-workspace-webview.yml' \
            '.github/workflows/full-product-education-class-create.yml' \
            '.github/workflows/full-product-native-menu-keymap-refresh.yml' \
            '.github/workflows/keybindings-contract.yml' \
            '.github/workflows/keybindings-terminal-current-product-convergence.yml' \
            '.github/workflows/remappable-board-grid-controls.yml' \
            '.github/workflows/remappable-education-list-navigation.yml' \
            '.github/workflows/remappable-input-submit-keys.yml' \
            '.github/workflows/remappable-library-result-navigation.yml' \
            '.github/workflows/remappable-pgn-tree-navigation.yml' \
            'acs/full_product_actions.py' \
            'acs/full_product_native_menu.py' \
            'acs/keybindings.py' \
            'acs/ui_keymap_adapter.py' \
            'acs/ui_keymap_editor.py' \
            'tests/js/education_surface_dom_test.js' \
            'tests/js/library_surface_dom_test.js' \
            'tests/js/version2_library_open_route_refresh_dom_test.js' \
            'tests/js/pgn_surface_dom_test.js' \
            'tests/js/remappable_board_grid_controls_test.js' \
            'tests/js/remappable_input_submit_keys_test.js' \
            'tests/test_full_product_education_keybindings.py' \
            'tests/test_full_product_library_keybindings.py' \
            'tests/test_full_product_native_menu.py' \
            'tests/test_full_product_pgn_keybindings.py' \
            'tests/test_keybindings.py' \
            'tests/test_accessible_webui.py' \
            'tests/test_dev1_library_webview_projection.py' \
            'tests/test_dev1_release_ui_regressions.py' \
            'tests/test_issue22_release_contract.py' \
            'tests/test_stage1_packaged_focus_origin_contract.py' \
            'tests/test_stage1_board_action_integration.py' \
            'tests/test_webview_keymap_bridge_contract.py' \
            'web/full_product_education.js' \
            'web/full_product_library.js' \
            'web/full_product_pgn.js' \
            'web/index.html' \
            'web/keybindings.json' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected terminal keybinding convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile keybinding Product contracts
        run: >-
          python -m py_compile
          acs/keybindings.py
          acs/ui_keymap_adapter.py
          acs/full_product_actions.py
          acs/full_product_native_menu.py
          tests/test_keybindings.py
          tests/test_accessible_webui.py
          tests/test_dev1_library_webview_projection.py
          tests/test_dev1_release_ui_regressions.py
          tests/test_issue22_release_contract.py
          tests/test_stage1_packaged_focus_origin_contract.py
          tests/test_stage1_board_action_integration.py
          tests/test_webview_keymap_bridge_contract.py
          tests/test_full_product_native_menu.py
          tests/test_full_product_pgn_keybindings.py
          tests/test_full_product_library_keybindings.py
          tests/test_full_product_education_keybindings.py

      - name: Parse keybinding browser contracts
        run: |
          node --check web/full_product_pgn.js
          node --check web/full_product_library.js
          node --check web/full_product_education.js
          node --check tests/js/remappable_board_grid_controls_test.js
          node --check tests/js/remappable_input_submit_keys_test.js
          node --check tests/js/pgn_surface_dom_test.js
          node --check tests/js/library_surface_dom_test.js
          node --check tests/js/version2_library_open_route_refresh_dom_test.js
          node --check tests/js/education_surface_dom_test.js

      - name: Run terminal Python keybinding contracts
        run: >-
          python -m unittest -v
          tests.test_keybindings
          tests.test_accessible_webui
          tests.test_dev1_library_webview_projection
          tests.test_dev1_release_ui_regressions
          tests.test_issue22_release_contract
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_stage1_board_action_integration
          tests.test_webview_keymap_bridge_contract
          tests.test_full_product_native_menu
          tests.test_full_product_pgn_keybindings
          tests.test_full_product_library_keybindings
          tests.test_full_product_education_keybindings

      - name: Run terminal DOM keybinding contracts
        run: |
          node tests/js/remappable_board_grid_controls_test.js
          node tests/js/remappable_input_submit_keys_test.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/library_surface_dom_test.js
          node tests/js/version2_library_open_route_refresh_dom_test.js
          node tests/js/education_surface_dom_test.js

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Core selftest
        run: python -m acs.selftest

      - name: Current V2 diagnostic
        run: python run_accessible_chess_v2.py --diagnostic
