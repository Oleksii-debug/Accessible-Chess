name: Book Progress Orphan Backup Recovery

on:
  push:
    branches:
      - fix/book-progress-orphan-backup-recovery-20260929
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/book_progress_store.py'
      - 'tests/test_v2_book_progress_store.py'
      - '.github/workflows/book-progress-orphan-backup-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-progress-orphan-backup-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BASE_SHA: 35d8858de994285ff0fe8911ca68bf80579c93ee

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact Product ancestry and bounded ownership
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          git cat-file -e "$PRODUCT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCT_BASE_SHA" HEAD
          test "$(git merge-base "$PRODUCT_BASE_SHA" HEAD)" = "$PRODUCT_BASE_SHA"
          git diff --check "$PRODUCT_BASE_SHA" HEAD
          changed="$(git diff --name-only "$PRODUCT_BASE_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/book-progress-orphan-backup-recovery.yml' \
            'acs/book_progress_store.py' \
            'tests/test_v2_book_progress_store.py' | sort)"
          test "$changed" = "$expected"
          echo 'BOOK_PROGRESS_ORPHAN_BACKUP_SCOPE=PASS'

      - name: Compile progress persistence surface
        run: >-
          python -m compileall -q
          acs/book_progress_store.py
          tests/test_v2_book_progress_store.py

      - name: Focused Books persistence and importer regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_progress_store
          tests.test_bookreader
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Core selftest
        run: python -m acs.selftest
