name: Section 38-39 MIT cbvault Original CBH Oracle
on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'tools/section38_39_mit_cbvault_oracle.py'
      - 'tests/test_section38_39_mit_cbvault_source_policy.py'
      - 'tools/section38_39_nwc_genuine_cbv_pgn.py'
      - 'tests/test_section38_39_nwc_genuine_cbv_pgn.py'
      - '.github/workflows/revised-section38-39-mit-cbvault-source-oracle.yml'
  workflow_dispatch: {}
permissions:
  contents: read
# One authoritative qualification per latest PR SHA; otherwise frequent
# concurrent source commits leave stale queued runs competing with new evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  independent-clean-room-cbh-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MIT_CBV_COMMIT: 3e56040fd2c38fdc2c8a25b4aff4d7ead2c5154b
      ORIGINAL_LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696
    steps:
      - name: Checkout exact Accessible Chess product candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Fetch exact MIT CBH/CBV clean-room reader (source only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: itshak/cbvault
          ref: 3e56040fd2c38fdc2c8a25b4aff4d7ead2c5154b
          path: external/cbvault
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout original independent GPL fixture families (not product-shipped)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          persist-credentials: false
          fetch-depth: 1
      - name: Verify independent external source commits and MIT attribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C external/cbvault rev-parse HEAD)" = "$MIT_CBV_COMMIT"
          test "$(git -C upstream/libcbh rev-parse HEAD)" = "$ORIGINAL_LIBCBH_COMMIT"
          grep -q 'Permission is hereby granted' external/cbvault/LICENSE
          grep -q '2CBH' external/cbvault/crates/cbvault-cli/README.md
          test -s external/cbvault/Cargo.lock
          test -s upstream/libcbh/gtest/Annotation/TestBase.cbh
          test -s upstream/libcbh/gtest/WithVariations/WithVariations.cbh
          test -s upstream/libcbh/gtest/UnusualStart/UnusualStartBytes.cbh
      - name: Install pinned toolchain for the external MIT test candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustc +1.88.0 --version
      - name: Build exact pinned MIT cbvault CLI only; never bundle in product
        working-directory: external/cbvault
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.88.0 build --locked --release -p cbvault-cli
          test -x target/release/cbvault
          sha256sum target/release/cbvault
      - name: Set up Python for the canonical Accessible Chess PGN/ACSDB oracle
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Test negative ABI and false-PASS security boundaries
        working-directory: product
        run: >-
          python -m unittest -v
          tests.test_section38_39_mit_cbvault_source_policy
          tests.test_section38_39_nwc_genuine_cbv_pgn
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
      - name: Check every original 11-file fixture family and license SHA first
        working-directory: product
        env:
          ACS_37_LIBCBH_ORIGINAL_SOURCE_ROOT: ${{ github.workspace }}/upstream/libcbh
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m unittest -v tests.test_revised_section37_cbh_original_family_inventory
          python -m tools.revised_section37_cbh_original_family_inventory
      - name: Execute actual original CBH game/variation PGN comparison with MIT backend
        working-directory: product
        env:
          ACS_CBVAULT_MIT_BINARY: ${{ github.workspace }}/external/cbvault/target/release/cbvault
          ACS_CBVAULT_MIT_SOURCE_ROOT: ${{ github.workspace }}/external/cbvault
          ACS_CBVAULT_CBH_ORIGINAL_ROOT: ${{ github.workspace }}/upstream/libcbh
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -m py_compile tools/section38_39_mit_cbvault_oracle.py
          python -m tools.section38_39_mit_cbvault_oracle
      - name: Enforce zero silent game/variation loss on original CBH source
        working-directory: product
        shell: python
        run: |
          import json
          from pathlib import Path
          report = json.loads(Path("section38-39-cbvault-mit-external-cbh-qualification.json").read_text())
          if (
              report.get("cbh_actual_fixture_count") != 3
              or report.get("two_cbh_supported_here") is not False
              or report.get("product_decoder_replaced") is not False
              or not all(x.get("qualification") == "PASS" for x in report.get("families", []))
          ):
              raise SystemExit("Independent MIT CBH source conversion is partial or unsupported")
      - name: Acquire actually published Northwest Chess January 2013 annotated original CBV and parallel PGN
        working-directory: product
        env:
          ACS_CBVAULT_MIT_BINARY: ${{ github.workspace }}/external/cbvault/target/release/cbvault
        run: |
          python -m py_compile tools/section38_39_nwc_genuine_cbv_pgn.py
          python -m tools.section38_39_nwc_genuine_cbv_pgn
      - name: Refuse original CBV semantic or SQLite loss even if archive extracts successfully
        working-directory: product
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path("section38-39-nw-chess-real-cbv-source-observation.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if (
              receipt["source_original_sha256_previously_pinned"] is not False
              or receipt["pgn_expected_games"] < 1
              or receipt["full_semantic_game_tree_match"] is not True
              or receipt["acsdb_restart_full_semantic_match"] is not True
              or receipt["acsdb_reimport_reused"] is not True
              or receipt["terminal_cbv_format_pass"] is not False
          ):
              raise SystemExit("Real CBV/PGN/ACSDB source readback partial: no PASS")
      - name: Keep only real CBV publisher hashes and game-tree/SQLite receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section38-39-nwchess-original-cbv-pgn-qa
          path: product/section38-39-nw-chess-real-cbv-source-observation.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain only path-free source qualification, never copyrighted ChessBase bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section38-39-mit-cbvault-original-cbh-oracle
          path: product/section38-39-cbvault-mit-external-cbh-qualification.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Never retain external GPL originals or compiled MIT binaries
        if: always()
        shell: bash
        run: |
          rm -rf -- external/cbvault upstream/libcbh
          test ! -e external/cbvault
          test ! -e upstream/libcbh
