name: Engine Settings Contract CI

on:
  push:
    branches:
      - dev/stage1-engine-core-0.4.0
    paths:
      - 'acs/settings.py'
      - 'tests/test_settings.py'
      - '.github/workflows/engine-settings-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-settings-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile settings contract
        run: python -m py_compile acs/settings.py tests/test_settings.py

      - name: Versioned settings migration and recovery tests
        run: python -m unittest discover -s tests -p 'test_settings.py' -v
