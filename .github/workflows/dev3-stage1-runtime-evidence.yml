name: DEV3 Stage1 Runtime Evidence

on:
  push:
    branches:
      - auto/dev3-stage1-runtime-evidence-20260823
    paths:
      - '.github/workflows/dev3-stage1-runtime-evidence.yml'
  pull_request:
    branches:
      - manual5/integration-20260821
    paths:
      - '.github/workflows/dev3-stage1-runtime-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev3-stage1-runtime-evidence-0fa442-${{ github.event_name }}
  cancel-in-progress: false

env:
  SOURCE_INTEGRATION_SHA: 0fa442330bc2bb03636ff9297512da4c29e38684
  STOCKFISH_VERSION: '18'

jobs:
  windows-engine-runtime:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove evidence-only diff and materialize exact accepted Stage1 source
        shell: pwsh
        run: |
          $resolved=(git rev-parse "$env:SOURCE_INTEGRATION_SHA^{commit}").Trim()
          if($resolved -ne $env:SOURCE_INTEGRATION_SHA){throw "SOURCE LOCK mismatch: $resolved"}
          $changed=@(git diff --name-only $env:SOURCE_INTEGRATION_SHA HEAD)
          if($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/dev3-stage1-runtime-evidence.yml'){
            throw "DEV3 evidence branch contains Product/non-evidence changes: $($changed -join ', ')"
          }
          New-Item -ItemType Directory -Force -Path product | Out-Null
          git archive --format=zip --output=stage1-product.zip $env:SOURCE_INTEGRATION_SHA -- acs tests run_accessible_chess.py VERSION.txt
          if($LASTEXITCODE -ne 0){throw 'Exact Stage1 export failed'}
          Expand-Archive stage1-product.zip product -Force
          "DEV3 EXACT STAGE1 SOURCE LOCK PASS: $resolved"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        shell: pwsh
        working-directory: product
        run: python -m pip install -q pytest

      - name: Compile and focused Stockfish analysis clocks lifecycle regressions
        shell: pwsh
        working-directory: product
        run: |
          python -m compileall -q acs tests run_accessible_chess.py
          if($LASTEXITCODE -ne 0){throw 'compile failed'}
          python -m unittest -v tests.test_stockfish_runtime tests.test_dev3_uci_failure_recovery tests.test_analysis_service tests.test_continuous_analysis tests.test_engine_play_service tests.test_engine_play_service_concurrency tests.test_engine_game_session tests.test_engine_game_timeout_ownership tests.test_clock_service tests.test_game_lifecycle tests.test_release_stockfish_composition tests.test_core_release_contracts tests.test_manual5_cross_lane_regression
          if($LASTEXITCODE -ne 0){throw 'DEV3 Stage1 runtime focused regressions failed'}
          'DEV3 STAGE1 STOCKFISH ANALYSIS CLOCKS LIFECYCLE SOURCE REGRESSIONS PASS'

      - name: Acquire official Stockfish 18 Windows binary
        shell: pwsh
        working-directory: product
        run: |
          Invoke-WebRequest -Uri 'https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip' -OutFile stockfish18.zip
          Expand-Archive stockfish18.zip stockfish18 -Force
          $engine=Get-ChildItem stockfish18 -Recurse -Filter '*.exe' | Where-Object {$_.Name -match 'stockfish.*x86-64'} | Select-Object -First 1
          if(-not $engine){throw 'Official Stockfish 18 executable missing'}
          New-Item -ItemType Directory -Force -Path real-engine | Out-Null
          Copy-Item $engine.FullName 'real-engine\stockfish.exe' -Force
          $hash=(Get-FileHash 'real-engine\stockfish.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "DEV3 OFFICIAL STOCKFISH 18 WINDOWS SHA256: $hash"

      - name: Real production runtime shared-provider and packaged-path smoke
        shell: pwsh
        working-directory: product
        run: |
          @'
          import pathlib
          import re
          import shutil
          from acs.analysis_service import AnalysisService
          from acs.engine_play_service import EnginePlayService
          from acs.engine_ports import EngineMoveRequest
          from acs.stockfish_runtime import StockfishRuntime, StockfishRuntimeConfig

          root = pathlib.Path.cwd()
          exe = (root / 'real-engine' / 'stockfish.exe').resolve()
          fen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
          move_re = re.compile(r'^[a-h][1-8][a-h][1-8][qrbn]?$')

          runtime = StockfishRuntime(StockfishRuntimeConfig(configured_path=exe))
          analysis = AnalysisService(runtime.provider, owns_engine=False)
          play = EnginePlayService(runtime.provider, owns_engine=False)
          try:
              provider_a = runtime.provider()
              first = analysis.analyze(fen, multipv=5, depth=8)
              assert first.error is None and not first.stale, first
              assert len(first.lines) == 5, first
              played = play.choose_move(EngineMoveRequest(fen, level=5, movetime_ms=100))
              assert played.move is not None and move_re.fullmatch(played.move), played
              provider_b = runtime.provider()
              assert provider_a is provider_b, 'runtime created duplicate provider'
              second = analysis.analyze(fen, multipv=5, depth=8)
              assert second.error is None and not second.stale, second
              assert len(second.lines) == 5, second
              assert runtime.provider() is provider_a
          finally:
              play.close()
              analysis.close()
              runtime.close()

          packaged = root / 'packaged-root'
          packaged_exe = packaged / 'engines' / 'stockfish' / 'stockfish.exe'
          packaged_exe.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(exe, packaged_exe)
          packaged_runtime = StockfishRuntime(StockfishRuntimeConfig(application_dir=packaged))
          packaged_play = EnginePlayService(packaged_runtime.provider, owns_engine=False)
          try:
              result = packaged_play.choose_move(EngineMoveRequest(fen, level=5, movetime_ms=100))
              assert result.move is not None and move_re.fullmatch(result.move), result
          finally:
              packaged_play.close()
              packaged_runtime.close()

          print('DEV3 EXACT STAGE1 OFFICIAL STOCKFISH 18 RUNTIME + SHARED PROVIDER + MULTIPV RESTORE + PACKAGED PATH PASS')
          '@ | Set-Content -Encoding UTF8 dev3_stage1_real_stockfish.py
          python dev3_stage1_real_stockfish.py
          if($LASTEXITCODE -ne 0){throw 'Real Stockfish Stage1 production runtime smoke failed'}

      - name: Exact-source diagnostic
        shell: pwsh
        working-directory: product
        run: |
          python run_accessible_chess.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'Exact Stage1 diagnostic failed'}
          'DEV3 STAGE1 RUNTIME RELEASE SUPPORT EVIDENCE PASS'
