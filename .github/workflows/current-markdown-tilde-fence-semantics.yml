name: Current Markdown Nested Quote Projection

on:
  pull_request:
    branches:
      - fix/markdown-tilde-fence-info-semantics-20261006-sol56
    paths:
      - '.github/workflows/current-markdown-tilde-fence-semantics.yml'
      - 'acs/book_text_import.py'
      - 'tests/test_markdown_library_journey.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-markdown-nested-quote-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  SOURCE_BLOB: 18f26a228022f682c0d0948423282dfe29ab4b54
  TEST_BLOB: 64b4eb5b5abab87448e9b8d425bd3b451d8722a3

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact parent and bounded Markdown scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_BASE_REF: fix/markdown-tilde-fence-info-semantics-20261006-sol56
        run: |
          set -euo pipefail
          test "$EVENT_BASE_REF" = "$EXPECTED_BASE_REF"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          test "$(git merge-base "$EVENT_BASE_SHA" HEAD)" = "$EVENT_BASE_SHA"
          git diff --check "$EVENT_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$EVENT_BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-markdown-tilde-fence-semantics.yml' \
            'acs/book_text_import.py' \
            'tests/test_markdown_library_journey.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_text_import.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_markdown_library_journey.py)" = "$TEST_BLOB"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Markdown and reader persistence surfaces
        run: >-
          python -m compileall -q
          acs/book_text_import.py
          acs/bookreader.py
          tests/test_markdown_library_journey.py
          tests/test_v2_book_text_import.py
          tests/test_v2_markdown_semantic_lists.py

      - name: Execute Markdown semantic and persistence regressions
        run: >-
          python -m unittest -v
          tests.test_markdown_library_journey
          tests.test_v2_book_text_import
          tests.test_v2_markdown_semantic_lists
          tests.test_bookdocument
          tests.test_bookreader
          tests.test_v2_book_progress_store
