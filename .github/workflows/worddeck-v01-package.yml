name: WordDeck archived accepted V0.1 package

on:
  workflow_dispatch:

# V0.1 is independently accepted and frozen. Rebuilding future v1 development
# under the V0.1 release name would break source/version identity. Historical
# packaging logic remains reproducible from Git history at the accepted source.
permissions:
  contents: read

jobs:
  archived:
    runs-on: windows-latest
    steps:
      - name: Explain frozen V0.1 status
        shell: pwsh
        run: |
          Write-Host 'Accepted V0.1 remains preserved as a historical release.'
          Write-Host 'This workflow does not rebuild, relabel or republish later WordDeck code as V0.1.'
