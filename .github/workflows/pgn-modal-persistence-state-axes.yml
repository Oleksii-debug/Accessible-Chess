name: Windows PGN Modal Persistence State Axes

on:
  push:
    branches:
      - fix/windows-pgn-modal-generation-state-axes-20261006-ooxple7
  pull_request:
    branches:
      - fix/windows-pgn-modal-generation-current-20261006-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-pgn-modal-persistence-state-axes-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  modal-persistence-state-axes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      BASE_BRANCH: fix/windows-pgn-modal-generation-current-20261006-ooxple7
      BASE_SHA: 9acd0361260874e59ec80ca96bb68b8599751b50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact parent and bounded child delta
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/modal-generation-parent"
          live_base="$(git rev-parse refs/remotes/origin/modal-generation-parent)"
          test "$live_base" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s
' "${paths[@]}"
          expected=(
            ".github/workflows/pgn-modal-persistence-state-axes.yml"
            "tests/test_v2_windows_pgn_open_worker.py"
            "tests/test_v2_windows_pgn_save_worker.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

      - name: Compile focused PGN boundary
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_pgn_open_worker.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Execute exact PGN worker regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker

      - name: Execute adjacent file-workflow regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_save_snapshot
          tests.test_pgn_document_passive_ingress
          tests.test_v2_windows_file_worker_preflight
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_pgn_open_invalid_session
          tests.test_v2_windows_nvda_file_workflows

      - name: Core selftest
        run: python -m acs.selftest
