name: Classroom Pairing Contract

on:
  pull_request:
    branches:
      - converge/current-product-diagnostic-help-classroom-20261005-sol56m7k2
    paths:
      - 'acs/classroom_pairing.py'
      - 'tests/test_classroom_pairing.py'
      - '.github/workflows/classroom-pairing-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-pairing-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pairing-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject a superseded pull-request head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/classroom-pairing-live-head"
          live_head="$(git rev-parse refs/remotes/origin/classroom-pairing-live-head)"
          if [[ "$live_head" != "$EVENT_HEAD_SHA" ]]; then
            echo "Superseded classroom-pairing run: event head $EVENT_HEAD_SHA, live PR head $live_head." >&2
            exit 1
          fi
          echo "CLASSROOM_PAIRING_EXACT_HEAD=PASS:$EVENT_HEAD_SHA"

      - name: Prove live Product ancestry and exact classroom-pairing scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PRODUCT_BRANCH: converge/current-product-diagnostic-help-classroom-20261005-sol56m7k2
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_BASE_REF" != "$PRODUCT_BRANCH" ]]; then
            echo "Classroom-pairing PR base $EVENT_BASE_REF is not the bound Product branch $PRODUCT_BRANCH." >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          product_ref="origin/$PRODUCT_BRANCH"
          git merge-base --is-ancestor "$product_ref" HEAD || {
            echo "Classroom-pairing head is stale relative to current Full Product." >&2
            exit 1
          }
          test "$(git merge-base "$product_ref" HEAD)" = "$(git rev-parse "$product_ref")" || {
            echo "Classroom-pairing merge-base is not exact current Full Product." >&2
            exit 1
          }
          mapfile -t actual < <(git diff --name-only "$product_ref...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-pairing-contract.yml'
            'acs/classroom_pairing.py'
            'tests/test_classroom_pairing.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected classroom-pairing PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'CLASSROOM_PAIRING_LIVE_PRODUCT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile classroom-pairing boundary
        run: >-
          python -m py_compile
          acs/classroom_pairing.py
          tests/test_classroom_pairing.py

      - name: Run pairing and adjacent teaching/education contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_pairing
          tests.test_teaching_session
          tests.test_education_records
          tests.test_education_records_store
