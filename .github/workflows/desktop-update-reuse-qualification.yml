name: Desktop Update Reuse Qualification

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/application_update.py'
      - 'tests/test_application_update_crossrepo.py'
      - 'docs/CROSS_REPO_DESKTOP_UPDATE_REUSE_2026-10-05.md'
      - '.github/workflows/desktop-update-reuse-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-update-reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact Full Product base and bounded verifier scope
        shell: bash
        env:
          BASE_REF: work/full-product-teacher-education-reachability-20260911
          BASE_SHA: 0a92698bbb923ef6d7bc2d672e3fd30554fb0138
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$candidate" = "${{ github.event.pull_request.head.sha }}"
            test "${{ github.event.pull_request.base.ref }}" = "$BASE_REF"
          else
            test "$candidate" = "$GITHUB_SHA"
          fi

          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/update-verifier-base"
          live_base="$(git rev-parse refs/remotes/origin/update-verifier-base)"
          test "$live_base" = "$BASE_SHA" || {
            printf 'DESKTOP_UPDATE_BASE_MOVED expected=%s live=%s\n' "$BASE_SHA" "$live_base" >&2
            exit 1
          }

          test "$(git merge-base "$BASE_SHA" "$candidate")" = "$BASE_SHA"
          git diff --check "$BASE_SHA...$candidate"
          changed="$(git diff --name-only "$BASE_SHA...$candidate" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/desktop-update-reuse-qualification.yml' \
            'acs/application_update.py' \
            'docs/CROSS_REPO_DESKTOP_UPDATE_REUSE_2026-10-05.md' \
            'tests/test_application_update_crossrepo.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected desktop-update verifier scope:\n%s\n' "$changed" >&2
            exit 1
          }
          echo 'DESKTOP_UPDATE_REUSE_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile update verifier
        run: >-
          python -m py_compile
          acs/application_update.py
          tests/test_application_update_crossrepo.py

      - name: Run update verifier tests
        run: >-
          python -m unittest -v
          tests.test_application_update_crossrepo
