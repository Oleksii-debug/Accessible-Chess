name: Full Product Education Class Create

on:
  pull_request:
    paths:
      - 'acs/education_class_management.py'
      - 'acs/version2_education_mutation_application.py'
      - 'acs/version2_education_mutation_release.py'
      - 'acs/version2_final_product_profile.py'
      - 'run_accessible_chess_v2.py'
      - 'tests/test_version2_education_class_create.py'
      - '.github/workflows/full-product-education-class-create.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-product-education-class-create-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained Education owner and current PR hygiene
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}" || git fetch --no-tags origin "$base"
          education_owner="3df622f6d667b3513222003df159e52188e60bda"
          git cat-file -e "${education_owner}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$education_owner" HEAD
          git diff --check "$base" HEAD

          for path in \
            acs/education_class_management.py \
            acs/version2_education_mutation_release.py \
            run_accessible_chess_v2.py
          do
            test "$(git rev-parse "HEAD:${path}")" = "$(git rev-parse "${education_owner}:${path}")" || {
              printf 'Retained class-create owner blob drift: %s\n' "$path" >&2
              exit 1
            }
          done
          printf 'Class-create retained authority PASS: owner=%s base=%s\n' "$education_owner" "$base"

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/education_class_management.py
          acs/version2_education_mutation_application.py
          acs/version2_education_mutation_release.py
          acs/version2_final_product_profile.py
          run_accessible_chess_v2.py
          tests/test_version2_education_class_create.py

      - name: Focused Education mutation open-selected and persistence regression
        run: >-
          python -m pytest -q
          tests/test_version2_education_class_create.py
          tests/test_education_workspace.py
          tests/test_education_webview_projection.py
          tests/test_education_webview_bridge.py
          tests/test_version2_final_product_composition.py

      - name: Final-product production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'
