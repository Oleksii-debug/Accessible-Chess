name: DEV3 Engine Handoff FEN Bounds CI

on:
  pull_request:
    branches:
      - auto/dev3-engine-handoff-fen-bounds-ci-base-20260822

permissions:
  contents: read

concurrency:
  group: dev3-engine-handoff-fen-bounds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handoff-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install -q pytest

      - name: Diff hygiene
        run: git diff --check a73034926fbc660c3a1d908b4dc77d30185f63fd HEAD

      - name: Compile Product and tests
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused handoff and engine-bound regressions
        run: >-
          python -m unittest -v
          tests.test_engine_play_service
          tests.test_dev3_engine_handoff_fen_bounds
          tests.test_dev3_engine_move_resource_bounds
          tests.test_analysis_service
          tests.test_dev3_analysis_request_bounds
          tests.test_dev3_engine_assisted_workflows
          tests.test_dev3_continuous_fen_bounds

      - name: Full unittest regression
        run: python -m unittest discover -s tests -v

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Accessible Chess complete diagnostic
        run: python run_accessible_chess.py --diagnostic complete
