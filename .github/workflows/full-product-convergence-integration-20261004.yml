name: Full Product Convergence 2026-10-04

on:
  push:
    branches:
      - integration/full-product-convergence-20261004
      - integration/full-product-successor-qualification-20261004
      - integration/current-main-windows-apex-reconvergence-20261004-sol
      - qualification/current-apex-completion-lens-20261004-ooxple7
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
      - integration/current-main-windows-apex-reconvergence-20261004-sol
      - main
    paths:
      - 'acs/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/full-product-convergence-integration-20261004.yml'
      - '.github/workflows/training-snapshot-definition-identity-v4.yml'
      - '.github/workflows/pgn-open-source-binding.yml'
      - '.github/workflows/pgn-command-single-session-toctou.yml'
      - '.github/workflows/pgn-document-new-game-position-integrity.yml'
      - '.github/workflows/v2-native-thread-runtime.yml'
      - '.github/workflows/v2-windows-book-board-adapter.yml'
      - '.github/workflows/version2-windows-composition.yml'
      - '.github/workflows/w3-p0f-starter-books-training.yml'
      - '.github/workflows/current-user-library-seed.yml'
      - '.github/workflows/full-product-book-command-authority.yml'
      - '.github/workflows/p0-dynamic-selection-executable.yml'
      - '.github/workflows/integration-owner-delivery-uk-docs-current.yml'
      - '.github/workflows/w6-v2-package-assembler.yml'
      - '.github/workflows/w6-v2-package-preflight-current-runtime.yml'
      - '.github/workflows/w6-v2-release-payload-current-assembler.yml'
      - '.github/workflows/books-semantic-durable-board-convergence.yml'
      - '.github/workflows/v2-accessible-book-core.yml'
      - '.github/workflows/v2-book-epub-semantic-ingress.yml'
      - '.github/workflows/v2-markdown-semantic-lists-convergence.yml'
      - '.github/workflows/d06-pgn-nested-comment-recovery.yml'
      - '.github/workflows/d06-pgn-semantic-fidelity.yml'
      - '.github/workflows/pgn-context-atomicity.yml'
      - '.github/workflows/v2-pgn-stream-source-binding.yml'
      - '.github/workflows/w2-training-progress-windows-missing-parent.yml'
      - '.github/workflows/v2-windows-nvda-ui.yml'
      - '.github/workflows/integration-accessibility-successors.yml'
      - '.github/workflows/d01-books-training-ui-integration.yml'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - '.github/workflows/d06-gametree-snapshot-resume.yml'
      - '.github/workflows/d06-snapshot-canonical-restore.yml'
      - '.github/workflows/d06-pgn-streaming-import.yml'
      - '.github/workflows/d06-pgn-streaming-export.yml'
      - '.github/workflows/v2-library-integrity-repair.yml'
      - '.github/workflows/v2-library-acsdb-search-v4.yml'
      - '.github/workflows/settings-save-lock-and-temp-identity.yml'
      - '.github/workflows/windows-stage1-webview-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-product-convergence-20261004-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove canonical ancestry and clean diff
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          canonical='0a92698bbb923ef6d7bc2d672e3fd30554fb0138'
          git cat-file -e "$canonical^{commit}"
          git merge-base --is-ancestor "$canonical" HEAD
          test "$(git merge-base "$canonical" HEAD)" = "$canonical"
          git diff --check "$canonical" HEAD

          event_base="$EVENT_BASE_SHA"
          event_base_ref="$EVENT_BASE_REF"
          if [ -n "$event_base" ]; then
            test -n "$event_base_ref"
            git cat-file -e "$event_base^{commit}"
            git fetch --no-tags origin "+refs/heads/$event_base_ref:refs/remotes/origin/$event_base_ref"
            live_base="$(git rev-parse "origin/$event_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_base"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_EVENT_BASE_ANCESTRY=PASS base=$event_base"
            echo "FULL_PRODUCT_LIVE_BASE_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "integration/current-main-windows-apex-reconvergence-20261004-sol" ]; then
            # A direct push/dispatch on the canonical current-main integration
            # branch has no pull_request.base fields. It must still prove that
            # the candidate contains the *live* main head; otherwise an old
            # push run could turn green after main advances and be mistaken for
            # current-main qualification.
            live_base_ref='main'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_MAIN_NON_PR_ANCESTRY=PASS base=$live_base"
          elif [ "${GITHUB_REF_NAME:-}" = "qualification/current-apex-completion-lens-20261004-ooxple7" ]; then
            live_base_ref='qualification/current-apex-epub-package-contract-20261004-sol6q8'
            git fetch --no-tags origin "+refs/heads/$live_base_ref:refs/remotes/origin/$live_base_ref"
            live_base="$(git rev-parse "origin/$live_base_ref")"
            git cat-file -e "$live_base^{commit}"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"
            echo "FULL_PRODUCT_LIVE_QUALIFICATION_PARENT_ANCESTRY=PASS base=$live_base"
          fi
          echo 'FULL_PRODUCT_CANONICAL_ANCESTRY=PASS'

      - name: Compile convergence Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q acs tests
          echo 'FULL_PRODUCT_COMPILE=PASS'

      - name: Verify current-main convergence contract
        run: python -m unittest -v tests.test_current_main_full_product_convergence_workflow

      - name: Validate convergence JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check web/full_product_books_training.js
          node --check web/version2_release_bootstrap.js
          node --check web/full_product_library.js
          node --check web/full_product_pgn.js
          node --check web/p0_accessibility_runtime.js
          node --check web/version2_final_product_bootstrap.js
          node --check tests/js/p0_accessibility_runtime_test.js
          node --check tests/js/p0_dynamic_selection_runtime_test.js
          node --check tests/js/p0_accessibility_partial_replacement_test.js
          node --check tests/js/p0_selection_ambiguity_runtime_test.js
          node --check tests/js/p0_selection_route_epoch_runtime_test.js
          node --check tests/js/books_training_surface_dom_test.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node --check tests/js/library_surface_dom_test.js
          node --check tests/js/pgn_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/library_surface_dom_test.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/p0_accessibility_runtime_test.js
          node tests/js/p0_dynamic_selection_runtime_test.js
          node tests/js/p0_accessibility_partial_replacement_test.js
          node tests/js/p0_selection_ambiguity_runtime_test.js
          node tests/js/p0_selection_route_epoch_runtime_test.js
          echo 'FULL_PRODUCT_DOM=PASS'

      - name: P0 semantic selection and native-copy regressions
        run: >-
          python -m unittest -v
          tests.test_p0_dynamic_selection_action_delivery
          tests.test_p0_dynamic_selection_partial_replacement
          tests.test_p0_semantic_document_copy
          tests.test_p0_final_product_resource_order

      - name: Books Training semantic and accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_bridge
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_atomicity
          tests.test_dev1_full_product_webview_adapter
          tests.test_book_bidirectional_semantic_navigation
          tests.test_bookreader_snapshot_bounds
          tests.test_v2_accessible_book_core
          tests.test_v2_book_epub_import
          tests.test_v2_html_semantic_lists
          tests.test_v2_markdown_semantic_lists
          tests.test_books_semantic_host_bounds
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_v2_book_training_route_rollback
          tests.test_v2_book_transaction_current_runtime
          tests.test_version2_application
          tests.test_version2_book_board_refresh_focus_order_evidence
          tests.test_version2_release_accessibility_contract
          tests.test_version2_training_current_runtime
          tests.test_w3_p0f_starter_books_training_content
          tests.test_p0f_starter_training_canonical_legality
          tests.test_full_product_book_command_authority

      - name: Library browser identity, import and privacy regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_library_webview_projection
          tests.test_d07_library_export_webview
          tests.test_d07_library_import_service
          tests.test_d07_library_import_reuse_final_cancel
          tests.test_d07_search_semantic_equivalence
          tests.test_v2_library_integrity_repair
          tests.test_v2_library_presentation_path_privacy
          tests.test_acsdb
          tests.test_user_library_seed
          tests.test_user_library_seed_parent_safety
          tests.test_v2_packaged_starter_application
          tests.test_v2_library_search_service_v4
          tests.test_v2_shared_presentation_path_privacy
          tests.test_version2_package_preflight

      - name: Recovery Settings and writer-race regressions
        run: >-
          python -m unittest -v
          tests.test_settings
          tests.test_settings_corruption_security
          tests.test_d06_gametree_snapshot_resume
          tests.test_d06_snapshot_canonical_restore
          tests.test_settings_private_temp_identity_current
          tests.test_settings_postpublication_cleanup_current_main
          tests.test_v2_upgrade_generated_artifact_authentication
          tests.test_v2_upgrade_publish_race_audit
          tests.test_v2_upgrade_tracked_writer_conflict
          tests.test_v2_upgrade_book_progress_temp_artifact_control
          tests.test_v2_upgrade_education_workspace_artifact_control
          tests.test_v2_upgrade_root_writer_artifact_grammar
          tests.test_v2_upgrade_self_coordination_artifact_control
          tests.test_v2_upgrade_sound_artifact_control
          tests.test_v2_upgrade_training_progress_artifact_control
          tests.test_v2_data_upgrade
          tests.test_v2_data_upgrade_v6
          tests.test_d08_training_canonical_resume
          tests.test_w2_training_progress_crash_recovery
          tests.test_training_snapshot_definition_identity_v4
          tests.test_training

      - name: Chess content, semantic reading and malformed-content regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument
          tests.test_d06_pgn_roundtrip
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_webview_atomicity
          tests.test_v2_pgn_nested_comment_recovery
          tests.test_v2_pgn_semantic_fidelity
          tests.test_pgn_document_context_atomicity
          tests.test_pgn_document_setup_fen_integrity
          tests.test_pgn_stream_source_binding
          tests.test_pgn_concurrent_save
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_postcommit_cleanup_atomicity
          tests.test_pgn_streaming_import
          tests.test_v2_pgn_streaming_export
          tests.test_v2_pgn_webview_path_privacy
          tests.test_chessbase_integrity
          tests.test_dev4_chessbase_symlink_security
          tests.test_gametree
          tests.test_v2_book_html_head_metadata_semantics
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_package_contract
          tests.test_v2_book_game_content
          tests.test_v2_book_library_game_lookup
          tests.test_book_index
          tests.test_v2_book_text_import
          tests.test_d04_chessbase_integrity_handle_identity
          tests.test_dev4_chessbase_integrity_atomicity
          tests.test_dev4_chessbase_integrity_io_observability
          tests.test_dev4_pgn_resource_security
          tests.test_pgn_open_direct_source
          tests.test_pgn_open_identity_fail_closed
          tests.test_pgn_open_source_binding
          tests.test_pgn_open_unlink_source_binding
          tests.test_pgn_open_windows_reparse
          tests.test_version2_pgn_commands
          tests.test_pgn_document_new_game_position_integrity

      - name: Windows terminal authority, NVDA file flow and Book to Board regressions
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_nvda_p0_contract
          tests.test_version2_accessibility_convergence
          tests.test_webview2_modern_winforms_accessibility
          tests.test_ui_native_menu_recovery
          tests.test_accessible_webui
          tests.test_version2_import_terminal_ui
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_native_thread_runtime_workflow
          tests.test_w3_windows_file_action_ui_thread_affinity
          tests.test_v2_windows_book_board_adapter_workflow
          tests.test_v2_windows_book_board_adapter
          tests.test_v2_book_board_workflow

      - name: Owner accessibility and package contracts
        run: >-
          python -m unittest -v
          tests.test_owner_delivery_uk_docs
