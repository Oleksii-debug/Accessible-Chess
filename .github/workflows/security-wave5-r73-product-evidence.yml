name: Security Wave 5 R73 Product Evidence Intake

on:
  pull_request:
    paths:
      - '.github/workflows/security-wave5-r73-product-evidence.yml'
      - 'acs/protection_license_container_boundary.py'
      - 'acs/protection_hardened_boundary.py'
      - 'acs/protection_incident_response_boundary.py'
      - 'acs/protection_paid_server_binding.py'
      - 'acs/protection_high_assurance_server_binding.py'
      - 'acs/protection_enterprise_seat_server_binding.py'
      - 'acs/protection_backend_migration_binding.py'
      - 'acs/server_application_boundary.py'
      - 'acs/version2_release_app.py'
      - 'scripts/security_r51_vendor_poc_gate.py'
      - 'scripts/security_r53_protector_candidate_gate.py'
      - 'scripts/security_r54_diversity_candidate_gate.py'
      - 'scripts/security_r55_whole_binary_gate.py'
      - 'scripts/security_r56_function_candidate_gate.py'
      - 'scripts/security_r61_attribution_gate.py'
      - 'scripts/security_r69_r71_adversarial_evidence_gate.py'
      - 'scripts/security_r72_incident_evidence_gate.py'
      - 'scripts/security_r73_product_evidence_gate.py'
      - 'tests/test_security_r51_vendor_poc_gate.py'
      - 'tests/test_security_r53_protector_candidate_gate.py'
      - 'tests/test_security_r54_diversity_candidate_gate.py'
      - 'tests/test_security_r55_whole_binary_gate.py'
      - 'tests/test_security_r57_r60_product_runtime.py'
      - 'tests/test_security_r61_attribution_gate.py'
      - 'tests/test_security_r69_r71_adversarial_evidence_gate.py'
      - 'tests/test_security_r72_incident_evidence_gate.py'
      - 'tests/test_security_r62_incident_response_boundary.py'
      - 'tests/test_security_r63_r65_paid_server_binding.py'
      - 'tests/test_security_r66_high_assurance_server_binding.py'
      - 'tests/test_security_r67_enterprise_seat_server_binding.py'
      - 'tests/test_security_r68_backend_migration_binding.py'
      - 'tests/test_security_r52_product_integration.py'
      - 'tests/test_security_r65_premium_server_integration.py'
      - 'tests/test_security_r73_product_evidence_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-evidence-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out exact Chess candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check out pinned existing upstream R73 verifier (not a product fork)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Oleksii-debug/continuum-runtime
          ref: 95f46b0dbcace6b3139c01afa50830f803c954e8
          path: upstream/continuum-runtime
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Revalidate exact pinned source and upstream verifier commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git -C upstream/continuum-runtime rev-parse HEAD)" = "95f46b0dbcace6b3139c01afa50830f803c954e8"
          git diff --check HEAD^

      - name: Install immutable test dependencies
        run: python -m pip install pytest==8.4.2 cryptography==50.0.2

      - name: Compile and execute R73 product negative/recovery evidence contracts
        env:
          PYTHONPATH: upstream/continuum-runtime/src
        run: |
          python -m py_compile acs/protection_hardened_boundary.py acs/protection_incident_response_boundary.py acs/protection_paid_server_binding.py acs/protection_high_assurance_server_binding.py acs/protection_enterprise_seat_server_binding.py acs/protection_backend_migration_binding.py acs/protection_license_container_boundary.py acs/server_application_boundary.py acs/version2_release_app.py scripts/security_r51_vendor_poc_gate.py scripts/security_r53_protector_candidate_gate.py scripts/security_r54_diversity_candidate_gate.py scripts/security_r55_whole_binary_gate.py scripts/security_r56_function_candidate_gate.py scripts/security_r61_attribution_gate.py scripts/security_r69_r71_adversarial_evidence_gate.py scripts/security_r72_incident_evidence_gate.py scripts/security_r73_product_evidence_gate.py tests/test_security_r51_vendor_poc_gate.py tests/test_security_r53_protector_candidate_gate.py tests/test_security_r54_diversity_candidate_gate.py tests/test_security_r55_whole_binary_gate.py tests/test_security_r57_r60_product_runtime.py tests/test_security_r61_attribution_gate.py tests/test_security_r69_r71_adversarial_evidence_gate.py tests/test_security_r72_incident_evidence_gate.py tests/test_security_r62_incident_response_boundary.py tests/test_security_r63_r65_paid_server_binding.py tests/test_security_r66_high_assurance_server_binding.py tests/test_security_r67_enterprise_seat_server_binding.py tests/test_security_r68_backend_migration_binding.py tests/test_security_r52_product_integration.py tests/test_security_r65_premium_server_integration.py tests/test_security_r73_product_evidence_gate.py
          python -m pytest -q upstream/continuum-runtime/tests/test_r66_high_assurance.py upstream/continuum-runtime/tests/test_r67_enterprise_seats.py upstream/continuum-runtime/tests/test_r68_backend_migration.py upstream/continuum-runtime/tests/test_r70_online_account_attack_qualification.py upstream/continuum-runtime/tests/test_r70_online_account_attack_qualification.py
          python -m pytest -q tests/test_security_r57_r60_product_runtime.py tests/test_security_r61_attribution_gate.py tests/test_security_r69_r71_adversarial_evidence_gate.py tests/test_security_r72_incident_evidence_gate.py tests/test_security_r62_incident_response_boundary.py tests/test_security_r63_r65_paid_server_binding.py tests/test_security_r66_high_assurance_server_binding.py tests/test_security_r67_enterprise_seat_server_binding.py tests/test_security_r68_backend_migration_binding.py tests/test_security_r51_vendor_poc_gate.py tests/test_security_r53_protector_candidate_gate.py tests/test_security_r54_diversity_candidate_gate.py tests/test_security_r55_whole_binary_gate.py tests/test_security_r52_product_integration.py tests/test_security_r65_premium_server_integration.py tests/test_security_r73_product_evidence_gate.py tests/test_security_wave2_product_integration.py tests/test_security_wave4_product_integration.py

      - name: No client secret, unsigned release override, or runtime licensing duplication
        shell: bash
        run: |
          set -euo pipefail
          ! grep -En 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|release_approved.?[:=].?True|signing[_-]?secret.?=' scripts/security_r51_vendor_poc_gate.py scripts/security_r53_protector_candidate_gate.py scripts/security_r54_diversity_candidate_gate.py scripts/security_r55_whole_binary_gate.py scripts/security_r56_function_candidate_gate.py scripts/security_r61_attribution_gate.py scripts/security_r69_r71_adversarial_evidence_gate.py scripts/security_r72_incident_evidence_gate.py scripts/security_r73_product_evidence_gate.py
