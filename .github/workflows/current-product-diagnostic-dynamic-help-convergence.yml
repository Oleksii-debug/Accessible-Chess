name: Current Product Diagnostic Dynamic Help Convergence

on:
  pull_request:
    paths:
      - '.github/workflows/current-product-diagnostic-dynamic-help-convergence.yml'
      - '.github/workflows/keybindings-current-apex-dom-native.yml'
      - '.github/workflows/webview-keymap-authority.yml'
      - 'acs/keybindings.py'
      - 'acs/stage1_release_ui.py'
      - 'acs/webapp.py'
      - 'tests/js/dynamic_keymap_help_test.js'
      - 'tests/test_dev1_release_ui_regressions.py'
      - 'tests/test_dynamic_keymap_help_contract.py'
      - 'tests/test_keybindings.py'
      - 'web/index.html'
  push:
    branches:
      - 'converge/current-product-diagnostic-dynamic-help-20261005-sol56m7k2'
    paths:
      - '.github/workflows/current-product-diagnostic-dynamic-help-convergence.yml'
      - '.github/workflows/keybindings-current-apex-dom-native.yml'
      - '.github/workflows/webview-keymap-authority.yml'
      - 'acs/keybindings.py'
      - 'acs/stage1_release_ui.py'
      - 'acs/webapp.py'
      - 'tests/js/dynamic_keymap_help_test.js'
      - 'tests/test_dev1_release_ui_regressions.py'
      - 'tests/test_dynamic_keymap_help_contract.py'
      - 'tests/test_keybindings.py'
      - 'web/index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-diagnostic-dynamic-help-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact source convergence and descendant ancestry
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCT_BASE: bf418985e9e20dc3491db7e229a33052a399e1a6
          HELP_SOURCE: 56cc2a98b159d257f1bdddcef587e99876559439
          DIAGNOSTIC_SOURCE: bee6a0d5e2cc675805d4830ed59a402332c28c56
          CONVERGENCE_MERGE: 38b78c8eb6cf7e8b3732df612774364c7c615c7f
          DIAGNOSTIC_HELP_HEAD: 7baaaa5f6b90987b60b08595808b5ab2808141d4
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          for commit in "$PRODUCT_BASE" "$HELP_SOURCE" "$DIAGNOSTIC_SOURCE" "$CONVERGENCE_MERGE" "$DIAGNOSTIC_HELP_HEAD"; do
            git cat-file -e "$commit^{commit}"
          done

          test "$(git rev-parse "$CONVERGENCE_MERGE^1")" = "$HELP_SOURCE"
          test "$(git rev-parse "$CONVERGENCE_MERGE^2")" = "$DIAGNOSTIC_SOURCE"
          git merge-base --is-ancestor "$HELP_SOURCE" "$DIAGNOSTIC_HELP_HEAD"
          git merge-base --is-ancestor "$DIAGNOSTIC_SOURCE" "$DIAGNOSTIC_HELP_HEAD"
          git merge-base --is-ancestor "$CONVERGENCE_MERGE" "$DIAGNOSTIC_HELP_HEAD"
          git merge-base --is-ancestor "$DIAGNOSTIC_HELP_HEAD" HEAD
          test "$(git merge-base "$PRODUCT_BASE" "$DIAGNOSTIC_HELP_HEAD")" = "$PRODUCT_BASE"
          test "$(git merge-base "$PRODUCT_BASE" HEAD)" = "$PRODUCT_BASE"
          git diff --check "$PRODUCT_BASE"...HEAD

          source_changed="$(git diff --name-only "$PRODUCT_BASE"..."$DIAGNOSTIC_HELP_HEAD" | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-product-diagnostic-dynamic-help-convergence.yml' \
            '.github/workflows/keybindings-current-apex-dom-native.yml' \
            '.github/workflows/webview-keymap-authority.yml' \
            'acs/keybindings.py' \
            'acs/stage1_release_ui.py' \
            'acs/webapp.py' \
            'tests/js/dynamic_keymap_help_test.js' \
            'tests/test_dev1_release_ui_regressions.py' \
            'tests/test_dynamic_keymap_help_contract.py' \
            'tests/test_keybindings.py' \
            'web/index.html' | sort)"
          test "$source_changed" = "$expected_paths" || {
            printf 'Frozen diagnostic/Help source scope changed.\nExpected:\n%s\nActual:\n%s\n' "$expected_paths" "$source_changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile convergence boundaries
        run: >-
          python -m py_compile
          acs/keybindings.py
          acs/stage1_release_ui.py
          acs/webapp.py
          tests/test_keybindings.py
          tests/test_dynamic_keymap_help_contract.py
          tests/test_dev1_release_ui_regressions.py
          tests/test_webview_keymap_bridge_contract.py
          tests/test_stage1_unbound_shortcut_capture.py

      - name: Run dynamic Help browser contract
        run: node tests/js/dynamic_keymap_help_test.js

      - name: Run keymap and release regressions
        run: >-
          python -m unittest -v
          tests.test_keybindings
          tests.test_dynamic_keymap_help_contract
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_unbound_shortcut_capture

      - name: Run current V2 diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Core selftest
        run: python -m acs.selftest
