name: Book HTML Semantic Text Boundary Integrity

on:
  pull_request:
    branches:
      - integration/pgn-grammar-structural-integrity-apex-20261004-sol6p3
    paths:
      - 'acs/book_html_import.py'
      - 'tests/test_v2_book_html_head_metadata_semantics.py'
      - '.github/workflows/book-html-br-text-integrity.yml'
      - '.github/workflows/book-html-semantic-marker-integrity.yml'

permissions:
  contents: read

concurrency:
  group: book-html-text-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      BOOK_URL: https://www.gutenberg.org/files/16377/16377-h/16377-h.htm
      BOOK_SHA256: 397cd3d816b6e685d30d3d7cfb36627cff415c754cc8f4e455c24da652d3c21e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact live-base scope
        shell: bash
        run: |
          set -euo pipefail
          head='${{ github.event.pull_request.head.sha }}'
          event_base="$PR_BASE_SHA"
          base_ref="$PR_BASE_REF"
          test -n "$head"
          test -n "$event_base"
          test -n "$base_ref"
          test "$(git rev-parse HEAD)" = "$head"
          git cat-file -e "$event_base^{commit}"
          git fetch --no-tags origin "$base_ref"
          live_base="$(git rev-parse "origin/$base_ref")"
          git merge-base --is-ancestor "$event_base" "$live_base"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          test "$(git rev-parse "$live_base:acs/book_html_import.py")" = '97b8096a29dc546893561f44936f7eccffab7fdb'
          test "$(git rev-parse "$live_base:tests/test_v2_book_html_import.py")" = '2718a0b01c9290c22952b57fb0751a93503782c4'
          actual="$(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/book-html-br-text-integrity.yml' \
            '.github/workflows/book-html-semantic-marker-integrity.yml' \
            'acs/book_html_import.py' \
            'tests/test_v2_book_html_head_metadata_semantics.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git diff --check "$live_base" HEAD
          git diff --quiet "$live_base" HEAD -- \
            tests/test_v2_book_html_import.py \
            acs/bookdocument.py \
            acs/bookreader.py \
            acs/book_index.py \
            acs/book_progress_store.py \
            acs/book_game_content.py \
            acs/book_board_workflow.py \
            acs/pgn_roundtrip.py \
            acs/chesscore.py \
            acs/legacy_text_encoding.py \
            acs/version2_application.py

      - name: Compile HTML semantic boundary
        run: >-
          python -m py_compile
          acs/book_html_import.py
          tests/test_v2_book_html_head_metadata_semantics.py

      - name: Focused HTML EPUB canonical and encoding regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_html_head_metadata_semantics
          tests.test_v2_book_html_import
          tests.test_legacy_text_encoding
          tests.test_v2_book_epub_import
          tests.test_version2_epub_application_reachability
          tests.test_bookdocument
          tests.test_bookreader
          tests.test_v2_book_progress_store
          tests.test_v2_book_game_content
          tests.test_d06_pgn_roundtrip

      - name: Download pinned lawful real HTML chess book transiently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          import urllib.request
          url = os.environ["BOOK_URL"]
          for attempt in range(4):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Accessible-Chess-CI/1.0 semantic-book-verification"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read()
                  with open("real-book-16377.html", "wb") as stream:
                      stream.write(data)
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 ** attempt)
          PY

      - name: Pinned lawful real HTML book oracle
        run: >-
          python -m scripts.v2_real_html_book_oracle
          real-book-16377.html
          --expected-sha256 ${{ env.BOOK_SHA256 }}

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Core selftest
        run: python -m acs.selftest
