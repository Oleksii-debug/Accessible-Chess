name: D06 File Ingress NAG Normalization

on:
  push:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/pgn_service.py'
      - 'tests/test_d06_file_ingress_nag_normalization.py'
      - 'tests/test_d06_file_ingress_nag_normalization_workflow.py'
      - '.github/workflows/d06-file-ingress-nag-normalization.yml'
  pull_request:
    paths:
      - 'acs/pgn_service.py'
      - 'tests/test_d06_file_ingress_nag_normalization.py'
      - 'tests/test_d06_file_ingress_nag_normalization_workflow.py'
      - '.github/workflows/d06-file-ingress-nag-normalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d06-ingress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Restore frozen Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Bind exact candidate geometry
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if test -n "${PR_BASE_REF:-}"; then
            git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
            git merge-base --is-ancestor "$live_base" HEAD || {
              printf 'PR head is stale against live base: ref=%s live_base=%s head=%s\n' \
                "$PR_BASE_REF" "$live_base" "$(git rev-parse HEAD)" >&2
              exit 1
            }
            base="$live_base"
          elif test -n "${PR_BASE_SHA:-}"; then
            base="$PR_BASE_SHA"
          else
            base="${PUSH_BASE_SHA:-}"
          fi
          if test -z "$base" || test "$base" = "0000000000000000000000000000000000000000"; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          git diff --quiet "$base" HEAD -- \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            acs/pgn_document.py \
            web \
            run_accessible_chess.py
          echo "D06_FILE_INGRESS_CANDIDATE_BASE=$base"

      - name: Compile
        run: >-
          python -m compileall -q
          acs
          tests/test_d06_file_ingress_nag_normalization.py
          tests/test_d06_file_ingress_nag_normalization_workflow.py

      - name: Attached NAG ingress and workflow regressions
        run: >-
          python -m unittest -v
          tests.test_d06_file_ingress_nag_normalization
          tests.test_d06_file_ingress_nag_normalization_workflow

      - name: Focused D06 and D04 regressions
        run: >-
          python -m unittest -v
          tests.test_d06_pgn_roundtrip
          tests.test_pgn_service
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_dev4_pgn_resource_security
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_truncation_quality
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_postcommit_cleanup_atomicity

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
