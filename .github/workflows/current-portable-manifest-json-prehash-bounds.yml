name: Current Package Manifest JSON Prehash Bounds

on:
  pull_request:
    branches:
      - integration/current-product-main-candidate-20261004-c2mbezb
    paths:
      - 'acs/version2_package_preflight.py'
      - 'acs/version2_portable_package.py'
      - 'tests/test_portable_manifest_json_prehash_bounds_current.py'
      - '.github/workflows/current-portable-manifest-json-prehash-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-package-manifest-json-prehash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact package source or combined integration scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SOURCE_BRANCH: fix/current-portable-manifest-json-prehash-20261004-3pg7jcgq
          INTEGRATION_BRANCH: converge/current-product-package-manifest-integration-20261004-3pg7jcgq
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          base_ref="${EVENT_BASE_REF:-integration/current-product-main-candidate-20261004-c2mbezb}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"

          git fetch --no-tags origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          live_source="$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")"
          git merge-base --is-ancestor "$live_source" HEAD

          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          if [ "$expected_head" = "$live_source" ]; then
            expected="$(printf '%s\n' \
              '.github/workflows/current-portable-manifest-json-prehash-bounds.yml' \
              'acs/version2_package_preflight.py' \
              'acs/version2_portable_package.py' \
              'tests/test_portable_manifest_json_prehash_bounds_current.py' | sort)"
          else
            git fetch --no-tags origin "+refs/heads/$INTEGRATION_BRANCH:refs/remotes/origin/$INTEGRATION_BRANCH"
            live_integration="$(git rev-parse "refs/remotes/origin/$INTEGRATION_BRANCH")"
            test "$expected_head" = "$live_integration"
            expected="$(printf '%s\n' \
              '.github/workflows/current-bookdocument-total-text-budget.yml' \
              '.github/workflows/current-bookdocument-training-resource-convergence.yml' \
              '.github/workflows/current-bookreader-revision-barriers.yml' \
              '.github/workflows/current-bookreader-training-resource-convergence.yml' \
              '.github/workflows/current-portable-manifest-json-prehash-bounds.yml' \
              '.github/workflows/current-product-portable-integration-convergence.yml' \
              '.github/workflows/current-settings-bookreader-resource-convergence.yml' \
              '.github/workflows/current-training-progress-json-prehash-bounds.yml' \
              'acs/bookdocument.py' \
              'acs/bookreader.py' \
              'acs/settings.py' \
              'acs/training_progress_store.py' \
              'acs/version2_package_preflight.py' \
              'acs/version2_portable_package.py' \
              'tests/test_bookdocument_total_text_budget_current.py' \
              'tests/test_bookreader.py' \
              'tests/test_bookreader_revision_barriers_current.py' \
              'tests/test_portable_manifest_json_prehash_bounds_current.py' \
              'tests/test_settings_corruption_security.py' \
              'tests/test_training_progress_json_prehash_bounds_current.py' | sort)"
          fi
          test "$changed" = "$expected" || {
            printf 'Unexpected package manifest qualification scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile package manifest surfaces
        run: >-
          python -m compileall -q
          acs/version2_package_preflight.py
          acs/version2_portable_package.py
          tests/test_portable_manifest_json_prehash_bounds_current.py

      - name: Execute manifest JSON resource regressions
        run: python -m unittest -v tests.test_portable_manifest_json_prehash_bounds_current

      - name: Execute full canonical package preflight contract
        run: python -m unittest -v tests.test_version2_package_preflight

      - name: Execute full portable package contract
        run: python -m unittest -v tests.test_version2_portable_package

      - name: Core selftest
        run: python -m acs.selftest
