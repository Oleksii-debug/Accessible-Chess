name: Classroom Media Shipping WebView

on:
  push:
    branches:
      - integrate/classroom-media-shipping-webview-20261003
  pull_request:
    branches:
      - integrate/classroom-livekit-presentation-20261003
    paths:
      - '.github/workflows/classroom-media-shipping-webview.yml'
      - 'acs/classroom_media_webview_bridge.py'
      - 'acs/classroom_media_webview_projection.py'
      - 'acs/classroom_media_webview_transactions.py'
      - 'acs/version2_final_product_application.py'
      - 'acs/version2_final_release.py'
      - 'acs/version2_package_preflight.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_release_payload.py'
      - 'tests/js/livekit_classroom_media_runtime_test.js'
      - 'tests/test_classroom_media_shipping_webview.py'
      - 'tests/test_p0g_final_product_runtime_reachability.py'
      - 'tests/test_version2_final_release_binding.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/test_version2_release_payload.py'
      - 'web/livekit_classroom_media_runtime.js'
      - 'web/version2_final_product_bootstrap.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-media-shipping-webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove bounded shipping WebView scope on live presentation parent
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_REF" = "integrate/classroom-livekit-presentation-20261003"
          test -n "$EVENT_BASE_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$PR_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
          test -n "$base"
          git cat-file -e "$base^{commit}"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current classroom presentation parent $base is not an ancestor of HEAD; synchronize before qualification."
            exit 1
          fi
          test "$(git merge-base "$base" HEAD)" = "$base"
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-media-shipping-webview.yml'
            'acs/classroom_media_webview_bridge.py'
            'acs/classroom_media_webview_projection.py'
            'acs/classroom_media_webview_transactions.py'
            'acs/version2_final_product_application.py'
            'acs/version2_final_release.py'
            'acs/version2_package_preflight.py'
            'acs/version2_release_app.py'
            'acs/version2_release_payload.py'
            'tests/js/livekit_classroom_media_runtime_test.js'
            'tests/test_classroom_media_shipping_webview.py'
            'tests/test_p0g_final_product_runtime_reachability.py'
            'tests/test_version2_final_release_binding.py'
            'tests/test_version2_package_preflight.py'
            'tests/test_version2_release_payload.py'
            'web/livekit_classroom_media_runtime.js'
            'web/version2_final_product_bootstrap.js'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected classroom media shipping WebView scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          git diff --check "$base...HEAD"
          git diff --quiet "$base...HEAD" --             acs/chesscore.py             acs/classroom_domain.py             acs/classroom_realtime_media.py             acs/remote_session.py             acs/teaching_classroom_adapter.py             web/livekit_classroom_media.js
          echo "CLASSROOM_MEDIA_SHIPPING_WEBVIEW_LIVE_BASE=$base"
          echo 'CLASSROOM_MEDIA_SHIPPING_WEBVIEW_BOUNDED_SCOPE=PASS'

      - name: Parse browser media runtime and composed presentation
        run: >-
          node --check web/livekit_classroom_media.js &&
          node --check web/livekit_classroom_media_runtime.js &&
          node --check web/full_product_classroom_media.js &&
          node --check web/version2_final_product_bootstrap.js

      - name: Run executable LiveKit and media DOM browser contracts
        run: >-
          node tests/js/livekit_classroom_media_adapter_test.js &&
          node tests/js/livekit_classroom_media_runtime_test.js &&
          node tests/js/full_product_classroom_media_test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile shipping media composition
        run: >-
          python -m compileall -q
          acs/classroom_media_webview_bridge.py
          acs/classroom_media_webview_projection.py
          acs/classroom_media_webview_transactions.py
          acs/version2_final_product_application.py
          acs/version2_final_release.py
          acs/version2_package_preflight.py
          acs/version2_release_app.py
          acs/version2_release_payload.py
          tests/test_classroom_media_shipping_webview.py

      - name: Run transactional media, release and package qualification
        run: >-
          python -m unittest -v
          tests.test_classroom_media_shipping_webview
          tests.test_classroom_media_provider_binder
          tests.test_classroom_media_provider_execution
          tests.test_classroom_media_session_transactions
          tests.test_classroom_media_host_transactions
          tests.test_classroom_media_webview
          tests.test_classroom_realtime_media
          tests.test_version2_final_product_composition
          tests.test_version2_final_release_binding
          tests.test_version2_release_payload
          tests.test_version2_package_preflight
          tests.test_p0g_final_product_runtime_reachability

      - name: Core selftest
        run: python -m acs.selftest
