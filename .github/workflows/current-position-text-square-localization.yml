name: Current Position Text Square Localization

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - "acs/position_editor.py"
      - "acs/position_text.py"
      - "tests/test_position_text_authority.py"
      - ".github/workflows/current-position-text-square-localization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-position-text-square-localization-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact stacked scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$EVENT_BASE_REF" = "converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb"
          git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
          live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
          test "$EVENT_BASE_SHA" = "$live_base"
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-position-text-square-localization.yml' \
            'acs/position_editor.py' \
            'acs/position_text.py' \
            'tests/test_position_text_authority.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected position-text localization scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Bind exact position-text and square authority bytes
        shell: bash
        env:
          POSITION_EDITOR_BLOB: b3b51e71f55f7477bf1b4dc9e35492f82625be7f
          POSITION_TEXT_BLOB: c4eed9078ec8f12b9286235355e7af09bd778355
          POSITION_TEXT_TEST_BLOB: e6676e6b6f8ed0299662e35f4e12ee329abe4bc4
          SQUARES_BLOB: b74cf01767590f057deb805b0793e040bac62044
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/position_editor.py)" = "$POSITION_EDITOR_BLOB"
          test "$(git rev-parse HEAD:acs/position_text.py)" = "$POSITION_TEXT_BLOB"
          test "$(git rev-parse HEAD:tests/test_position_text_authority.py)" = "$POSITION_TEXT_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/squares.py)" = "$SQUARES_BLOB"

      - name: Compile exact localization slice
        run: >-
          python -m py_compile
          acs/position_editor.py
          acs/position_text.py
          tests/test_position_text_authority.py

      - name: Run position-text and passive-boundary regressions
        run: >-
          python -m unittest -v
          tests.test_position_text_authority
          tests.test_position_editor
          tests.test_position_editor_passive_boundary
          tests.test_stage1_localized_validation_current
          tests.test_accessible_webui
