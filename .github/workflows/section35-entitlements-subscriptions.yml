name: Section 35 Entitlements Subscriptions

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/entitlements.py'
      - 'acs/subscription_plans.py'
      - 'acs/subscription_web.py'
      - 'tests/test_entitlements.py'
      - 'tests/test_section35_subscription_closure.py'
      - 'web/accessible_chess_subscription.html'
      - 'web/accessible_chess_subscription.js'
      - '.github/workflows/section35-entitlements-subscriptions.yml'
      - 'docs/automation/SECTION35_CLOSURE_AUDIT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section35:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile Section 35 sources
        run: python -m py_compile acs/entitlements.py acs/subscription_plans.py acs/subscription_web.py tests/test_entitlements.py tests/test_section35_subscription_closure.py
      - name: Run Section 35 contract
        run: python -m unittest -v tests.test_entitlements tests.test_section35_subscription_closure
