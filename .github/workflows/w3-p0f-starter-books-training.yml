name: W3 P0-F Starter Books Training

on:
  push:
    branches:
      - work/w3-p0f-starter-books-training-content-20260911
      - fix/p0f-w3-semantic-post-integration-20260912
      - fix/p0f-starter-structured-diagrams-variations-20260912
      - fix/p0f-starter-material-discovery-20260912
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
      - work/p0f-training-canonical-legality-20261003-k6r9
    paths:
      - acs/training.py
      - acs/starter_books_training_content.py
      - acs/starter_books_training_release.py
      - acs/starter_books_training_runtime.py
      - acs/starter_structured_examples.py
      - acs/version2_starter_content_application.py
      - acs/version2_education_mutation_release.py
      - web/full_product_books_training.js
      - tests/test_training.py
      - tests/test_d08_training_canonical_resume.py
      - tests/test_w3_p0f_starter_books_training_content.py
      - tests/test_p0f_starter_training_canonical_legality.py
      - tests/test_p0f_starter_structured_examples.py
      - tests/js/books_training_surface_dom_test.js
      - docs/V2_STARTER_CONTENT_PROVENANCE.md
      - .github/workflows/w3-p0f-starter-books-training.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessible-chess-w3-p0f-starter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter-books-training:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove exact head, live Product ancestry and bounded P0-F scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            product_branch='work/full-product-teacher-education-reachability-20260911'
            legality_branch='work/p0f-training-canonical-legality-20261003-k6r9'
            base_ref='${{ github.event.pull_request.base.ref }}'
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"

            case "$base_ref" in
              "$product_branch")
                live_ref="refs/remotes/origin/$product_branch"
                git fetch --no-tags origin "+refs/heads/$product_branch:$live_ref"
                scope_base="$(git rev-parse "$live_ref")"
                git merge-base --is-ancestor "$event_base" "$scope_base"
                git merge-base --is-ancestor "$scope_base" HEAD
                test "$(git merge-base "$scope_base" HEAD)" = "$scope_base"

                changed="$(git diff --name-only "$scope_base" HEAD | sort)"
                expected="$(printf '%s\n' \
                  '.github/workflows/w3-p0f-starter-books-training.yml' \
                  'tests/test_p0f_starter_training_canonical_legality.py' | sort)"
                test "$changed" = "$expected"
                test "$(git rev-parse HEAD:tests/test_p0f_starter_training_canonical_legality.py)" = "6ed053719792b7047300bb6ed4b7eec0431bb087"
                echo 'P0F_TRAINING_TOPOLOGY=PRODUCT_CANONICAL_LEGALITY'
                ;;
              "$legality_branch")
                live_ref="refs/remotes/origin/$legality_branch"
                git fetch --no-tags origin "+refs/heads/$legality_branch:$live_ref"
                scope_base="$(git rev-parse "$live_ref")"
                git merge-base --is-ancestor "$event_base" "$scope_base"
                git merge-base --is-ancestor "$scope_base" HEAD
                test "$(git merge-base "$scope_base" HEAD)" = "$scope_base"

                changed="$(git diff --name-only "$scope_base" HEAD | sort)"
                expected="$(printf '%s\n' \
                  '.github/workflows/w3-p0f-starter-books-training.yml' \
                  'acs/training.py' \
                  'tests/test_d08_training_canonical_resume.py' \
                  'tests/test_p0f_starter_training_canonical_legality.py' \
                  'tests/test_training.py' | sort)"
                test "$changed" = "$expected"
                test "$(git rev-parse HEAD:acs/training.py)" = "1b3b454596f6e5d91153c5fbbf3127688e26bb77"
                test "$(git rev-parse HEAD:tests/test_training.py)" = "6e955d5be330fbc4f766260cfcc6148a84990588"
                test "$(git rev-parse HEAD:tests/test_d08_training_canonical_resume.py)" = "f71f3084568b68f1f46c97351f00452036708c73"
                test "$(git rev-parse HEAD:tests/test_p0f_starter_training_canonical_legality.py)" = "20406c9b6be408fa294fa2de9e7de12190501fd0"
                echo 'P0F_TRAINING_TOPOLOGY=SESSION_V4_SUCCESSOR'
                ;;
              *)
                echo "unexpected P0-F Training base: $base_ref" >&2
                exit 1
                ;;
            esac
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2
      - name: Compile bounded W3 source
        run: >-
          python -m py_compile
          acs/training.py
          acs/starter_books_training_content.py
          acs/starter_books_training_release.py
          acs/starter_books_training_runtime.py
          acs/starter_structured_examples.py
          acs/version2_starter_content_application.py
          acs/version2_education_mutation_release.py
          tests/test_training.py
          tests/test_d08_training_canonical_resume.py
          tests/test_d08_book_training_contract.py
          tests/test_w2_book_training_canonical_ingress.py
          tests/test_w2_training_progress_crash_recovery.py
          tests/test_w3_p0f_starter_books_training_content.py
          tests/test_p0f_starter_training_canonical_legality.py
          tests/test_p0f_starter_structured_examples.py
      - name: Prove release starter corpus structured semantics and current Training compatibility
        run: >-
          python -m pytest -q
          tests/test_training.py
          tests/test_d08_training_canonical_resume.py
          tests/test_d08_book_training_contract.py
          tests/test_w2_book_training_canonical_ingress.py
          tests/test_w2_training_progress_crash_recovery.py
          tests/test_w3_p0f_starter_books_training_content.py
          tests/test_p0f_starter_training_canonical_legality.py
          tests/test_p0f_starter_structured_examples.py
          tests/test_version2_training_current_runtime.py
      - name: Prove keyboard and screen-reader starter material discovery DOM
        run: node tests/js/books_training_surface_dom_test.js
