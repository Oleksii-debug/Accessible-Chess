name: Classroom Media Provider Runtime

on:
  push:
    branches:
      - integrate/classroom-media-provider-runtime-20261003
  pull_request:
    paths:
      - 'acs/classroom_media_provider_binder.py'
      - 'acs/classroom_media_webview_transactions.py'
      - 'acs/classroom_media_webview_bridge.py'
      - 'acs/classroom_media_webview_projection.py'
      - 'acs/version2_final_product_application.py'
      - 'acs/version2_final_release.py'
      - 'acs/version2_release_payload.py'
      - 'acs/version2_package_preflight.py'
      - 'web/classroom_media_host_executor.js'
      - 'web/classroom_media_provider_runtime.js'
      - 'web/full_product_classroom_media.js'
      - 'web/version2_final_product_bootstrap.js'
      - 'tests/test_classroom_media_provider_binder.py'
      - 'tests/js/classroom_media_host_executor_test.js'
      - 'tests/js/classroom_media_provider_runtime_test.js'
      - 'tests/js/full_product_classroom_media_test.js'
      - '.github/workflows/classroom-media-provider-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-media-provider-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'

      - name: Compile Python transaction/runtime composition
        run: >-
          python -m py_compile
          acs/classroom_media_provider_binder.py
          acs/classroom_media_webview_transactions.py
          acs/classroom_media_webview_bridge.py
          acs/classroom_media_webview_projection.py
          acs/version2_final_product_application.py
          acs/version2_final_release.py
          acs/version2_release_payload.py
          acs/version2_package_preflight.py
          tests/test_classroom_media_provider_binder.py

      - name: Run Python media and package regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_media_provider_binder
          tests.test_classroom_media_provider_execution
          tests.test_classroom_media_session_transactions
          tests.test_classroom_media_host_transactions
          tests.test_classroom_media_webview
          tests.test_version2_final_release_binding
          tests.test_version2_release_payload
          tests.test_version2_package_preflight
          tests.test_v2_package_required_resources
          tests.test_version2_final_product_composition

      - name: Run browser executor/runtime/accessibility regressions
        run: |
          node tests/js/classroom_media_host_executor_test.js
          node tests/js/classroom_media_provider_runtime_test.js
          node tests/js/full_product_classroom_media_test.js

      - name: Verify runtime authority stays bounded
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^
          grep -Fq 'AccessibleChessClassroomMediaProviderRuntime' web/classroom_media_provider_runtime.js
          grep -Fq 'media.provider_take_credential' web/classroom_media_provider_runtime.js
          grep -Fq 'remote_transport": "not_approved"' acs/version2_final_product_application.py
          ! grep -Eq 'localStorage|sessionStorage|document\.|fetch\(|XMLHttpRequest|WebSocket' web/classroom_media_provider_runtime.js
          echo 'CLASSROOM_MEDIA_PROVIDER_RUNTIME_CONTRACT=PASS'
