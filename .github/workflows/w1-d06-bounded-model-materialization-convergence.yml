name: W1 D06 Bounded Model Materialization Convergence

on:
  pull_request:
    paths:
      - 'acs/pgn_roundtrip.py'
      - 'acs/pgn_workspace.py'
      - 'tests/test_w1_d06_bounded_model_materialization.py'
      - 'tests/test_d06_pgn_roundtrip.py'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - '.github/workflows/w1-d06-bounded-model-materialization-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w1-d06-bounded-model-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained D06 bounded-materialization authority and current PR hygiene
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SOURCE_HEAD_SHA: 1a029e05219c488cb58c369ef89d26c6735c592b
        run: |
          set -euo pipefail
          event_base="${EVENT_BASE_SHA:-}"
          if [ -n "$event_base" ]; then
            git cat-file -e "${event_base}^{commit}" || git fetch --no-tags origin "$event_base"
            git merge-base --is-ancestor "$event_base" HEAD
          fi
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" HEAD
          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
          else
            live_base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${live_base}^{commit}"
          if ! git merge-base --is-ancestor "$live_base" HEAD; then
            echo "Current Product base $live_base is not an ancestor of D06 candidate HEAD"
            exit 1
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base...HEAD"
          for path in \
            acs/pgn_roundtrip.py \
            acs/pgn_workspace.py \
            tests/test_w1_d06_bounded_model_materialization.py \
            tests/test_d06_pgn_roundtrip.py
          do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_HEAD_SHA:$path")"
          done

      - name: Compile converged PGN modules
        run: python -m compileall -q acs/pgn_roundtrip.py acs/pgn_workspace.py tests/test_w1_d06_bounded_model_materialization.py

      - name: Focused bounded-materialization and canonical PGN regression
        run: python -m unittest -v tests.test_w1_d06_bounded_model_materialization tests.test_d06_pgn_roundtrip

      - name: Final-product production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Broad repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Broad repository pytest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pytest -q
