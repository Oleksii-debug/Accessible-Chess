name: Library Delegated Route Atomicity

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_application.py'
      - 'acs/full_product_presenters.py'
      - 'acs/library_webview_projection.py'
      - 'acs/library_export_webview_projection.py'
      - 'tests/test_version2_application.py'
      - 'tests/test_dev1_library_webview_projection.py'
      - 'tests/test_library_pagination_atomicity.py'
      - '.github/workflows/library-delegated-route-atomicity.yml'

permissions:
  contents: read

concurrency:
  group: library-delegated-route-atomicity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atomic-route:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove live Product ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          product_branch='work/full-product-teacher-education-reachability-20260911'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$product_branch"

          live_ref="refs/remotes/origin/$product_branch"
          git fetch --no-tags origin "+refs/heads/$product_branch:$live_ref"
          live_product="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_product"
          git merge-base --is-ancestor "$live_product" HEAD
          test "$(git merge-base "$live_product" HEAD)" = "$live_product"

          changed="$(git diff --name-only "$live_product" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-delegated-route-atomicity.yml' \
            'acs/full_product_presenters.py' \
            'acs/library_export_webview_projection.py' \
            'acs/library_webview_projection.py' \
            'acs/version2_application.py' \
            'tests/test_dev1_library_webview_projection.py' \
            'tests/test_library_pagination_atomicity.py' \
            'tests/test_version2_application.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/version2_application.py)" = "376317c95d5a91fcb812033cd7abf281fbf9f8fb"
          test "$(git rev-parse HEAD:acs/full_product_presenters.py)" = "7c7dd6755a600731b25244d7e233e428a605f556"
          test "$(git rev-parse HEAD:acs/library_webview_projection.py)" = "3f26ed95253f65f79215ac062e7f61d3dd041f2f"
          test "$(git rev-parse HEAD:acs/library_export_webview_projection.py)" = "d730f47510c007b4fec5ccd9086a49b86bd80722"
          test "$(git rev-parse HEAD:tests/test_dev1_library_webview_projection.py)" = "e8b7cbd5b0ed3e209446c29fc3185e271298c4cd"
          test "$(git rev-parse HEAD:tests/test_library_pagination_atomicity.py)" = "9a744d7f4ee1fcba810efd75775a90aa9d82eac1"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "96e0b2007e70ca44d1ba798db9dd3a8d4f854cd8"
          git diff --check "$live_product" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile application boundary
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          acs/library_export_webview_projection.py
          acs/library_webview_projection.py
          acs/version2_application.py
          tests/test_dev1_library_webview_projection.py
          tests/test_library_pagination_atomicity.py
          tests/test_version2_application.py

      - name: Prove delegated Library state, route, pagination, and WebView focus behavior
        run: >-
          python -m unittest -v
          tests.test_dev1_library_webview_projection
          tests.test_library_pagination_atomicity
          tests.test_version2_application
          tests.test_dev1_full_product_webview_adapter
