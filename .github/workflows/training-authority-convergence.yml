name: Training Authority WebView Convergence

on:
  pull_request:
    paths:
      - 'acs/training.py'
      - 'acs/full_product_presenters.py'
      - 'acs/training_webview_projection.py'
      - 'acs/version2_training_workspace.py'
      - 'acs/version2_application.py'
      - 'acs/book_webview_bridge.py'
      - 'acs/training_webview_bridge.py'
      - 'tests/test_training_authority_convergence.py'
      - '.github/workflows/training-authority-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-authority-webview-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EXACT_PARENT: c3c90914685b0fc223daa44a7fca6f5734e00c49
      TRAINING_BLOB: fd02d345bf3b68911124510fd5d826e04735a750
      PRESENTER_BLOB: 9e1b11341359a17c80739e122d3265dd474c0d58
      PROJECTION_BLOB: d048fc83829a86b27f4412d7d183a04235b691d7
      WORKSPACE_BLOB: 00be0f3c2561ce6695c7fe1ffc141a29f201828c
      APPLICATION_BLOB: 8a214b63fab1e0e69dab14ee8a79d04078918f1d
      BOOK_BRIDGE_BLOB: 247b7d4bbd2d9e0e7d7fc6a89c5cef45e63e65e7
      TRAINING_BRIDGE_BLOB: c3e6e52873f2ec1e2d5bdbc70d227a402963405b
      CONVERGENCE_TEST_BLOB: 8fa52d7b861de5860f82d4c042c9e714356ecfda
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact convergence scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          test "$(git rev-parse "HEAD:acs/training.py")" = "$TRAINING_BLOB"
          test "$(git rev-parse "HEAD:acs/full_product_presenters.py")" = "$PRESENTER_BLOB"
          test "$(git rev-parse "HEAD:acs/training_webview_projection.py")" = "$PROJECTION_BLOB"
          test "$(git rev-parse "HEAD:acs/version2_training_workspace.py")" = "$WORKSPACE_BLOB"
          test "$(git rev-parse "HEAD:acs/version2_application.py")" = "$APPLICATION_BLOB"
          test "$(git rev-parse "HEAD:acs/book_webview_bridge.py")" = "$BOOK_BRIDGE_BLOB"
          test "$(git rev-parse "HEAD:acs/training_webview_bridge.py")" = "$TRAINING_BRIDGE_BLOB"
          test "$(git rev-parse "HEAD:tests/test_training_authority_convergence.py")" = "$CONVERGENCE_TEST_BLOB"
          changed="$(git diff --name-only "$EXACT_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/training-authority-convergence.yml' \
            'acs/book_webview_bridge.py' \
            'acs/full_product_presenters.py' \
            'acs/training.py' \
            'acs/training_webview_bridge.py' \
            'acs/training_webview_projection.py' \
            'acs/version2_training_workspace.py' \
            'acs/version2_application.py' \
            'tests/test_training_authority_convergence.py' | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Compile convergence boundary
        run: >-
          python -m compileall -q
          acs/training.py
          acs/full_product_presenters.py
          acs/training_webview_projection.py
          acs/version2_training_workspace.py
          acs/version2_application.py
          acs/book_webview_bridge.py
          acs/training_webview_bridge.py
          tests/test_training_authority_convergence.py

      - name: Execute Training and Books integration regressions
        run: >-
          python -m unittest -v
          tests.test_training_authority_convergence
          tests.test_training
          tests.test_d08_training_canonical_resume
          tests.test_d08_book_training_contract
          tests.test_w2_book_training_canonical_ingress
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_atomicity
          tests.test_dev1_books_training_webview_bridge
          tests.test_books_training_ui_integration
          tests.test_version2_training_current_runtime
          tests.test_v2_book_training_route_rollback
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
