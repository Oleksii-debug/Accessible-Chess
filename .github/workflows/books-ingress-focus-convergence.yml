name: Books Ingress + Focus Recovery Convergence

on:
  pull_request:
    branches:
      - 'fix/books-training-exact-payload-dict-20261003'
    paths:
      - '.github/workflows/books-ingress-focus-convergence.yml'
      - '.github/workflows/v2-book-progress-production-repair.yml'
      - 'acs/book_webview_projection.py'
      - 'acs/full_product_ui_shell.py'
      - 'acs/training_webview_projection.py'
      - 'acs/version2_application.py'
      - 'tests/js/books_training_surface_dom_test.js'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - 'tests/test_v2_book_training_route_rollback.py'
      - 'tests/test_version2_application.py'
      - 'tests/test_version2_release_accessibility_contract.py'
      - 'web/full_product_books_training.js'
      - 'web/version2_release_bootstrap.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-ingress-focus-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Authenticate both live parent authorities
        shell: bash
        run: |
          set -euo pipefail
          exact_scalar_payload='26ae0578e34eadcad1abf9b717fbe2980519ebe0'
          exact_focus_recovery='f31e1f29e9a8a02ed12b85d7516f42f18fd780c2'
          exact_scalar_parent='6edd00dce67b65876a6bf37a5cf7b6415a9d675b'
          exact_navigation_parent='eb23bdc5ea0e2914a7f742697b20d32edd78a950'
          exact_list_bound_parent='20d038214b86d5a4c4205093b862e2e59798dffc'
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'

          test "$(git rev-parse HEAD)" = "$expected_head"
          git cat-file -e "$exact_scalar_payload^{commit}"
          git cat-file -e "$exact_focus_recovery^{commit}"
          git cat-file -e "$exact_scalar_parent^{commit}"
          git cat-file -e "$exact_navigation_parent^{commit}"
          git cat-file -e "$exact_list_bound_parent^{commit}"
          git merge-base --is-ancestor "$exact_scalar_payload" HEAD
          git merge-base --is-ancestor "$exact_focus_recovery" HEAD
          git merge-base --is-ancestor "$exact_scalar_parent" HEAD
          git merge-base --is-ancestor "$exact_navigation_parent" HEAD
          git merge-base --is-ancestor "$exact_list_bound_parent" HEAD
          test "$(git merge-base "$exact_scalar_payload" HEAD)" = "$exact_scalar_payload"
          test "$(git merge-base "$exact_focus_recovery" HEAD)" = "$exact_focus_recovery"
          test "$(git merge-base "$exact_navigation_parent" HEAD)" = "$exact_navigation_parent"
          test "$(git merge-base "$exact_list_bound_parent" HEAD)" = "$exact_list_bound_parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/books-training-exact-payload-dict-20261003'
            test '${{ github.event.pull_request.base.sha }}' = "$exact_scalar_payload"
          fi

          git diff --check "$exact_scalar_payload" HEAD
          changed="$(git diff --name-only "$exact_scalar_payload" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/books-ingress-focus-convergence.yml' \
            '.github/workflows/v2-book-progress-production-repair.yml' \
            'acs/book_webview_projection.py' \
            'acs/full_product_ui_shell.py' \
            'acs/training_webview_projection.py' \
            'acs/version2_application.py' \
            'tests/js/books_training_surface_dom_test.js' \
            'tests/js/version2_release_bootstrap_dom_test.js' \
            'tests/test_dev1_books_training_webview_projection.py' \
            'tests/test_v2_book_training_route_rollback.py' \
            'tests/test_version2_application.py' \
            'tests/test_version2_release_accessibility_contract.py' \
            'web/full_product_books_training.js' \
            'web/version2_release_bootstrap.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/version2_application.py)" = 'd5186d07d0babb253cc50416827896bc203efa19'
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = '5fb66f636000f397d8ee3f91c658d02c9eee73da'
          test "$(git rev-parse HEAD:acs/full_product_ui_shell.py)" = '7bb116ea0587de51a191560cd39070aac9ead014'
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = 'c1881095dc0f8b9efca62690da3deaccdd54790d'
          test "$(git rev-parse HEAD:tests/test_v2_book_training_route_rollback.py)" = '1e9b0e03c5c81ef187234a748bbd23c2759ad4cb'
          test "$(git rev-parse HEAD:tests/test_version2_release_accessibility_contract.py)" = 'd40d13bb50466831e55c3ec9f6d3d7f24bd08d16'
          test "$(git rev-parse HEAD:acs/training_webview_projection.py)" = '1bb879711d72ec7b91a1da2a6139dba20f787a36'
          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = '2385b9748995f7dfdc97b10bf42ea916bb8ba46e'
          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = '807812ab3d98c72f45cdb2cfbfb2973760caaf6a'
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = '66ee8f2f4f560070fc320079ab7dfdf93a938693'
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_projection.py)" = 'aa29188950fcd8270f4d1ac94a9ee10fa3dceec9'

          # Prove the exact-ingress parent content survived the merge byte-for-byte.
          test "$(git rev-parse HEAD:acs/book_webview_projection.py)" = '84f6add4c51aecda5288761420fb0964491ddef6'
          test "$(git rev-parse HEAD:acs/book_webview_bridge.py)" = '247b7d4bbd2d9e0e7d7fc6a89c5cef45e63e65e7'
          test "$(git rev-parse HEAD:acs/training_webview_bridge.py)" = 'c3e6e52873f2ec1e2d5bdbc70d227a402963405b'
          test "$(git rev-parse HEAD:tests/test_dev1_books_training_webview_bridge.py)" = '485147fbcfd3a52705b611df4ad315c46d4e54bf'

          # This dedicated gate is the BookProgress authority for #1460 because
          # the generic historical topology workflow is intentionally skipped.
          test "$(git rev-parse HEAD:acs/book_progress_store.py)" = 'b7ad9899f614c42589b9f53fddbebe59dee2b9c7'
          test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = '81d5eb59a0b4b8f292480d2dd4c1f82fa4a36b7a'
          test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = '6aa9cddc68a630228e3a2266c5dcf3382b86a674'
          test "$(git rev-parse HEAD:acs/version2_book_workspace.py)" = '85e4ef957d587d607c47f3b6c143970fdb5fa9d2'

          echo 'BOOKS_INGRESS_FOCUS_CONVERGENCE_GEOMETRY=PASS'

      - name: Compile converged runtime
        run: >-
          python -m compileall -q
          acs/book_webview_bridge.py
          acs/book_webview_projection.py
          acs/training_webview_bridge.py
          acs/training_webview_projection.py
          acs/version2_application.py
          acs/full_product_ui_shell.py
          tests/test_version2_application.py
          tests/test_v2_book_training_route_rollback.py
          tests/test_version2_release_accessibility_contract.py

      - name: Prove packaged DOM focus contract
        run: |
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Prove ingress, persistence, semantic and focus regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_bridge
          tests.test_dev1_books_training_webview_projection
          tests.test_version2_application
          tests.test_v2_book_training_route_rollback
          tests.test_version2_release_accessibility_contract
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_v2_book_transaction_current_runtime
          tests.test_v2_book_board_workflow
          tests.test_version2_training_current_runtime
          tests.test_books_semantic_host_bounds
          tests.test_version2_book_workspace
          tests.test_dev1_full_product_webview_adapter
          tests.test_version2_book_board_refresh_focus_order_evidence

      - name: Core selftest
        run: python -m acs.selftest
