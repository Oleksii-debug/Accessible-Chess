name: Current Library Presenter Passive Root

on:
  pull_request:
    branches:
      - fix/current-library-browser-passive-ingress-20261004-zftrkmo
      - main
    paths:
      - 'acs/library_webview_projection.py'
      - 'tests/test_dev1_library_webview_projection.py'
      - '.github/workflows/current-library-presenter-passive-root.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-library-presenter-passive-root-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-fix/current-library-browser-passive-ingress-20261004-zftrkmo}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          if [ -n "${EVENT_BASE_REF:-}" ] && [ "$EVENT_BASE_REF" = "$DEFAULT_BRANCH" ]; then
            echo 'NARROW_SCOPE_MODE=DEFAULT_BRANCH_INTEGRATION'
          else
            changed="$(git diff --name-only "$live_base"...HEAD | sort)"
            expected_paths="$(printf '%s\n' \
              '.github/workflows/current-library-presenter-passive-root.yml' \
              'acs/library_webview_projection.py' \
              'tests/test_dev1_library_webview_projection.py' | sort)"
            test "$changed" = "$expected_paths" || {
              printf 'Unexpected Library presenter-passivity scope:\n%s\n' "$changed" >&2
              exit 1
            }
            echo 'NARROW_SCOPE_MODE=STACKED_EXACT'
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Library presentation boundary
        run: >-
          python -m compileall -q
          acs/library_webview_projection.py
          tests/test_dev1_library_webview_projection.py

      - name: Execute Library presentation and whole-product regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_library_webview_projection
          tests.test_d07_library_export_webview
          tests.test_v2_library_presentation_path_privacy
          tests.test_v2_shared_presentation_path_privacy
          tests.test_full_product_library_keybindings

      - name: Core selftest
        run: python -m acs.selftest
