name: PGN Large Resource Performance

on:
  pull_request:
    paths:
      - 'scripts/pgn_large_resource_perf_oracle.py'
      - 'scripts/pgn05_document_ingress_diagnostic.py'
      - '.github/workflows/pgn-large-resource-perf.yml'

permissions:
  contents: read

concurrency:
  group: pgn-large-resource-perf-${{ github.ref }}
  cancel-in-progress: true

env:
  PGN05_BASE: d706eb93b9a4df3c6e99ab1af584a9cfe6b6f5ea

jobs:
  large-resource:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned QA dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact D06 base and evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PGN05_BASE^{commit}"
          test "$(git merge-base HEAD "$PGN05_BASE")" = "$PGN05_BASE"
          git diff --check "$PGN05_BASE" HEAD
          changed="$(git diff --name-only "$PGN05_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/pgn-large-resource-perf.yml' \
            'scripts/pgn05_document_ingress_diagnostic.py' \
            'scripts/pgn_large_resource_perf_oracle.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$PGN05_BASE" HEAD -- acs tests web run_accessible_chess.py
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "96d62bf6dd7b2f5c8a75d5f2bd1fde2ad0823d20"
          test "$(git rev-parse HEAD:acs/pgn_service.py)" = "b86ac90cd8baca6b234e5d332a60ec8915740ac1"
          test "$(git rev-parse HEAD:acs/pgn_document.py)" = "ae0b7d3815c4d277b68ef3c170c95255cf5c6442"
          echo 'PGN-05 EVIDENCE-ONLY SCOPE PASS'

      - name: Compile and self-test oracle
        run: |
          python -m py_compile scripts/pgn_large_resource_perf_oracle.py scripts/pgn05_document_ingress_diagnostic.py
          python -m scripts.pgn_large_resource_perf_oracle --selftest

      - name: Focused PGN resource/document regressions
        run: >-
          python -m unittest -v
          tests.test_d06_pgn_roundtrip
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_pgn_service
          tests.test_dev4_pgn_resource_security
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_truncation_quality
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_postcommit_cleanup_atomicity

      - name: Verify real large PGN and bounded capability edges
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn_large_resource_perf_oracle --games 2000 --e2e-games 500 2>&1 | tee pgn05-large-resource-report.txt
          grep -F '"license": "CC0"' pgn05-large-resource-report.txt
          grep -F '"games": 500' pgn05-large-resource-report.txt
          grep -F '"streaming": "BLOCKED_NOT_IMPLEMENTED"' pgn05-large-resource-report.txt
          grep -F '"overall": "PARTIAL_BOUNDED_WHOLE_DOCUMENT"' pgn05-large-resource-report.txt
          grep -F '"status": "FAIL_CLOSED_BEFORE_PAYLOAD_READ"' pgn05-large-resource-report.txt
          grep -F '"product_mutation": "NONE"' pgn05-large-resource-report.txt
          grep -F 'PGN-05 LARGE RESOURCE PERFORMANCE PASS' pgn05-large-resource-report.txt

      - name: Isolate strict-vs-file document ingress divergence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn05_document_ingress_diagnostic --limit 500 2>&1 | tee pgn05-document-ingress-diagnostic.txt

      - name: Upload large-resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgn05-large-resource-${{ matrix.os }}
          path: |
            pgn05-large-resource-report.txt
            pgn05-document-ingress-diagnostic.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
