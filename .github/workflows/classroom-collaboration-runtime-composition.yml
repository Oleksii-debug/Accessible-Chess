name: Classroom Collaboration Runtime Composition

on:
  pull_request:
    branches:
      - converge/classroom-collaboration-network-ui-20261003
    paths:
      - 'acs/classroom_collaboration_runtime.py'
      - 'acs/version2_final_product_application.py'
      - 'tests/test_classroom_collaboration_runtime.py'
      - '.github/workflows/classroom-collaboration-runtime-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-collaboration-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYWEBVIEW_VERSION: '6.2.1'
  PYTHONNET_VERSION: '3.1.0'
  CLR_LOADER_VERSION: '0.3.1'
  CFFI_VERSION: '2.1.1'
  PYCPARSER_VERSION: '3.0'
  TYPING_EXTENSIONS_VERSION: '4.16.0'
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_VERSION: '4.1.0'
  ZSTANDARD_VERSION: '0.25.0'

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked runtime scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "converge/classroom-collaboration-network-ui-20261003"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current collaboration convergence base $base is not an ancestor of HEAD."
            exit 1
          fi
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | LC_ALL=C sort)"
          allowed="$(printf '%s\n'             '.github/workflows/classroom-collaboration-runtime-composition.yml'             'acs/classroom_collaboration_runtime.py'             'acs/version2_final_product_application.py'             'tests/test_classroom_collaboration_runtime.py' | LC_ALL=C sort)"
          test "$changed" = "$allowed"
          echo "CLASSROOM_COLLABORATION_RUNTIME_EXACT_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile runtime composition
        run: >-
          python -m py_compile
          acs/classroom_collaboration_runtime.py
          acs/version2_final_product_application.py
          tests/test_classroom_collaboration_runtime.py

      - name: Prove no ambient credential ownership
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'os\.(environ|getenv)|API_SECRET|API_KEY|STORAGE_SECRET|LIVEKIT_SECRET'             acs/classroom_collaboration_runtime.py
          grep -Fq 'chat_bearer_token_provider' acs/classroom_collaboration_runtime.py
          grep -Fq 'file_bearer_token_provider' acs/classroom_collaboration_runtime.py
          grep -Fq 'ClassroomChatHttpRpcCall' acs/classroom_collaboration_runtime.py
          grep -Fq 'ClassroomFileHttpRpcCall' acs/classroom_collaboration_runtime.py
          echo "CLASSROOM_COLLABORATION_RUNTIME_CREDENTIAL_BOUNDARY=PASS"

      - name: Run whole collaboration stack
        run: >-
          python -m unittest -v
          tests.test_classroom_collaboration_runtime
          tests.test_classroom_collaboration_final_product
          tests.test_classroom_collaboration_webview
          tests.test_classroom_chat_http_endpoint
          tests.test_classroom_chat_rpc
          tests.test_classroom_collaboration_chat_server
          tests.test_classroom_file_http_transport
          tests.test_classroom_file_rpc
          tests.test_classroom_file_server
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
          tests.test_version2_education_class_create

      - name: Run accessible collaboration DOM regressions
        run: |
          node tests/js/classroom_collaboration_surface_dom_test.js
          node tests/js/education_surface_dom_test.js

      - name: Core selftest
        run: python -m acs.selftest

      - name: Install canonical Windows standalone toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
          python -m pip install --disable-pip-version-check "pywebview==$env:PYWEBVIEW_VERSION" "pythonnet==$env:PYTHONNET_VERSION" "clr-loader==$env:CLR_LOADER_VERSION" "cffi==$env:CFFI_VERSION" "pycparser==$env:PYCPARSER_VERSION" "typing-extensions==$env:TYPING_EXTENSIONS_VERSION" "Nuitka @ $nuitkaUrl" "ordered-set==$env:ORDERED_SET_VERSION" "zstandard==$env:ZSTANDARD_VERSION"
          if($LASTEXITCODE -ne 0){throw 'CLASSROOM_RUNTIME_TOOLCHAIN_INSTALL_FAILURE'}

      - name: Build and execute exact Windows standalone
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python run_accessible_chess_v2.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'CLASSROOM_RUNTIME_SOURCE_DIAGNOSTIC_FAILURE'}
          $report=Join-Path $env:RUNNER_TEMP 'classroom-runtime-nuitka-report.xml'
          python -m nuitka --standalone --assume-yes-for-downloads --windows-console-mode=disable --output-filename=AccessibleChess.exe --include-data-dir=web=web "--report=$report" run_accessible_chess_v2.py
          if($LASTEXITCODE -ne 0){throw 'CLASSROOM_RUNTIME_NUITKA_BUILD_FAILURE'}
          $dist=(Resolve-Path 'run_accessible_chess_v2.dist').Path
          $exe=Join-Path $dist 'AccessibleChess.exe'
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw 'CLASSROOM_RUNTIME_PACKAGED_EXE_MISSING'}
          if(-not (Test-Path -LiteralPath (Join-Path $dist 'web\full_product_education.js') -PathType Leaf)){throw 'CLASSROOM_RUNTIME_PACKAGED_EDUCATION_RESOURCE_MISSING'}
          $leaks=@(Get-ChildItem -LiteralPath $dist -Recurse -File | Where-Object {$_.Extension -in @('.py','.pyc','.pyo')})
          if($leaks.Count -ne 0){throw "CLASSROOM_RUNTIME_PACKAGED_PYTHON_SOURCE_LEAK count=$($leaks.Count)"}
          $stdout=Join-Path $env:RUNNER_TEMP 'classroom-runtime-packaged.stdout.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'classroom-runtime-packaged.stderr.txt'
          $proc=Start-Process -FilePath $exe -WorkingDirectory $dist -ArgumentList '--diagnostic' -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if(Test-Path -LiteralPath $stdout){Get-Content -LiteralPath $stdout}
          if(Test-Path -LiteralPath $stderr){Get-Content -LiteralPath $stderr}
          if($proc.ExitCode -ne 0){throw "CLASSROOM_RUNTIME_PACKAGED_DIAGNOSTIC_FAILURE exit=$($proc.ExitCode)"}
          $diag=Get-Content -LiteralPath $stdout -Raw
          if($diag -notmatch [regex]::Escape('ACCESSIBLE CHESS V2 FINAL-PRODUCT COMPOSITION DIAGNOSTIC PASS')){throw 'CLASSROOM_RUNTIME_PACKAGED_DIAGNOSTIC_MARKER_MISSING'}
          Write-Host "CLASSROOM_RUNTIME_STANDALONE_EXE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant())"
          Write-Host 'CLASSROOM_RUNTIME_WINDOWS_STANDALONE=PASS'
