name: PGN Game Navigation CAS

on:
  pull_request:
    branches:
      - 'fix/pgn-presentation-lease-20261003'
    paths:
      - '.github/workflows/pgn-game-navigation-cas.yml'
      - 'acs/pgn_workspace_webview_adapter.py'
      - 'acs/version2_pgn_commands.py'
      - 'tests/test_dev1_pgn_workspace_webview_adapter.py'
      - 'tests/test_version2_pgn_commands.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-game-navigation-cas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation-cas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live #1443 parent and exact scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='fix/pgn-presentation-lease-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin \
            "+refs/heads/$parent_branch:refs/remotes/origin/$parent_branch"
          live_parent="$(git rev-parse "refs/remotes/origin/$parent_branch")"
          git merge-base --is-ancestor "$live_parent" HEAD

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/pgn-game-navigation-cas.yml' \
              'acs/pgn_workspace_webview_adapter.py' \
              'acs/version2_pgn_commands.py' \
              'tests/test_dev1_pgn_workspace_webview_adapter.py' \
              'tests/test_version2_pgn_commands.py' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:acs/pgn_workspace_webview_adapter.py)" = "3d4fa3d19c3bd185b80fdbbf1113331a22ea73db"
          test "$(git rev-parse HEAD:acs/version2_pgn_commands.py)" = "6612707e091d707b6a62d1e5d21fa194f471aba9"
          test "$(git rev-parse HEAD:tests/test_dev1_pgn_workspace_webview_adapter.py)" = "e42539cf34366046e26b22f4c51318250c1ab432"
          test "$(git rev-parse HEAD:tests/test_version2_pgn_commands.py)" = "7bd2dbe509a54395c5eaf3dc1fa5ddbcadbe44ff"

          # Retain the #1443 rendered-state lease and whole-application proof.
          test "$(git rev-parse HEAD:acs/pgn_webview_projection.py)" = "c7ade6cc8fefdac160235b67291438fa15c689b8"
          test "$(git rev-parse HEAD:acs/pgn_webview_bridge.py)" = "10b604853608b6f1310888d04322dd5740622789"
          test "$(git rev-parse HEAD:web/full_product_pgn.js)" = "51f42d8cf6944d35499f6185f8818fcb5db731a5"
          test "$(git rev-parse HEAD:tests/js/pgn_tree_keyboard_dom_test.js)" = "c954f8764f95b5f520c4c150684eacf6655cb788"
          test "$(git rev-parse HEAD:tests/test_version2_application.py)" = "20ddb93b03ee86073c41e96ad4713df9a41085af"

      - name: Validate retained browser lease semantics
        run: |
          node --check web/full_product_pgn.js
          node --check tests/js/pgn_tree_keyboard_dom_test.js
          node tests/js/pgn_tree_keyboard_dom_test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile canonical navigation boundary
        run: >-
          python -m py_compile
          acs/pgn_workspace_webview_adapter.py
          acs/version2_pgn_commands.py
          tests/test_dev1_pgn_workspace_webview_adapter.py
          tests/test_version2_pgn_commands.py

      - name: Prove CAS and retained whole-product PGN flow
        run: >-
          python -m unittest -v
          tests.test_version2_pgn_commands
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_webview_atomicity
          tests.test_v2_pgn_semantic_fidelity
          tests.test_v2_pgn_nested_comment_recovery
          tests.test_version2_application

      - name: Verify tracked diff
        shell: bash
        run: git diff --check
