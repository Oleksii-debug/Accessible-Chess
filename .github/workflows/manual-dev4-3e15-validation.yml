name: Manual DEV4 3e15 Exact Validation

on:
  pull_request:
    branches:
      - full5/dev4-import-security-repair-20260822

permissions:
  contents: read

env:
  PRODUCT_SHA: 3e15dc2e844cb825e482317fd024795130147011
  DEV4_BASE_SHA: 6298899cb112336ef220caa8d0e52334ddc0c0ae
  QA_ORACLE_SHA: 1670bffa1202bdf49dd7e6479ade6542c94637da
  DEV2_TERMINAL_SHA: 8d9c7c99ef8d1754555adaf286ab15f5da3224af
  PERSISTENT_GREEN_SHA: dd9ebf9414103c805892856fe6a04706fa69039f

jobs:
  exact-product-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Product repair
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Exact identity and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git merge-base --is-ancestor "$DEV4_BASE_SHA" "$PRODUCT_SHA"
          git diff --check "$DEV4_BASE_SHA" "$PRODUCT_SHA"
          printf '%s\n' 'PRODUCT DELTA:'
          git diff --name-only "$DEV4_BASE_SHA" "$PRODUCT_SHA"
      - name: Compile exact Product repair
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Product-owned defect and compatibility regressions
        run: >-
          python -m pytest -q
          tests/test_dev4_chessbase_cross_platform_path_privacy.py
          tests/test_dev4_pgn_postcommit_cleanup_atomicity.py
          tests/test_dev4_pgn_export_concurrency_security.py
          tests/test_chessbase_adapter.py
          tests/test_windows_data_release_regressions.py
      - name: Unchanged independent QA defect oracles
        shell: bash
        run: |
          set -euo pipefail
          git show "$QA_ORACLE_SHA:tests/test_dev4_chessbase_cross_platform_path_privacy.py" > /tmp/test_dev4_chessbase_cross_platform_path_privacy.py
          git show "$QA_ORACLE_SHA:tests/test_dev4_pgn_postcommit_cleanup_atomicity.py" > /tmp/test_dev4_pgn_postcommit_cleanup_atomicity.py
          PYTHONPATH="$PWD" python -m pytest -q \
            /tmp/test_dev4_chessbase_cross_platform_path_privacy.py \
            /tmp/test_dev4_pgn_postcommit_cleanup_atomicity.py
      - name: Existing DEV4 security resource and recovery gates
        run: >-
          python -m pytest -q
          tests/test_dev4_chessbase_integrity_atomicity.py
          tests/test_dev4_chessbase_integrity_io_observability.py
          tests/test_dev4_chessbase_manifest_io_observability.py
          tests/test_dev4_chessbase_probe_observability.py
          tests/test_dev4_chessbase_report_path_privacy.py
          tests/test_dev4_chessbase_symlink_security.py
          tests/test_dev4_engine_error_path_privacy.py
          tests/test_dev4_import_batch_adapter_failure.py
          tests/test_dev4_import_fingerprint_atomicity.py
          tests/test_dev4_import_history_error_privacy.py
          tests/test_dev4_import_special_file_security.py
          tests/test_dev4_pgn_encoding_quality.py
          tests/test_dev4_pgn_export_failure_recovery.py
          tests/test_dev4_pgn_export_path_security.py
          tests/test_dev4_pgn_resource_security.py
          tests/test_pgn_service.py
      - name: Canonical DEV2 GameTree overlay for known old ancestry only
        shell: bash
        run: |
          set -euo pipefail
          git show "$DEV2_TERMINAL_SHA:acs/gametree.py" > acs/gametree.py
          git diff --check
      - name: Cross-lane PGN semantic gates after canonical overlay
        run: >-
          python -m pytest -q
          tests/test_dev4_pgn_truncation_quality.py
          tests/test_dev4_pgn_export_concurrency_security.py
          tests/test_dev4_pgn_postcommit_cleanup_atomicity.py
          tests/test_pgn_service.py

  persistent-green-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout persistent exact-GREEN integration authority
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PERSISTENT_GREEN_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Overlay only repaired DEV4 shared-boundary files and regressions
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            acs/report_paths.py \
            acs/chessbase_adapter.py \
            acs/chessbase_integrity.py \
            acs/chessbase_manifest.py \
            acs/pgn_service.py \
            tests/test_dev4_chessbase_cross_platform_path_privacy.py \
            tests/test_dev4_pgn_postcommit_cleanup_atomicity.py \
            tests/test_dev4_pgn_export_concurrency_security.py; do
            git show "$PRODUCT_SHA:$path" > "$path"
          done
          git diff --check
      - name: Compile selective compatibility tree
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Repair gates on persistent GREEN
        run: >-
          python -m pytest -q
          tests/test_dev4_chessbase_cross_platform_path_privacy.py
          tests/test_dev4_pgn_postcommit_cleanup_atomicity.py
          tests/test_dev4_pgn_export_concurrency_security.py
          tests/test_chessbase_adapter.py
          tests/test_windows_data_release_regressions.py
      - name: Full unittest regression
        run: python -m unittest discover -s tests -v
      - name: Full pytest regression
        run: python -m pytest -q
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
