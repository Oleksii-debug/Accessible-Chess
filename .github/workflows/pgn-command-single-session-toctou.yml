name: PGN Command Single Session TOCTOU

on:
  pull_request:
    branches:
      - integration/pgn-source-object-binding-apex-20261004-sol6p3
    paths:
      - "acs/version2_pgn_commands.py"
      - "tests/test_version2_pgn_commands.py"
      - ".github/workflows/pgn-command-single-session-toctou.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-command-single-session-toctou-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove live stacked-parent ancestry and bounded scope
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          test -n "$EVENT_BASE_SHA"
          test -n "$EVENT_BASE_REF"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git fetch --no-tags origin "$EVENT_BASE_REF"
          live_base="$(git rev-parse "origin/$EVENT_BASE_REF")"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$live_base"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"

          BASE_SHA="$live_base" python - <<'PY'
          import os
          import subprocess

          base = os.environ["BASE_SHA"]
          expected = {
              ".github/workflows/pgn-command-single-session-toctou.yml",
              "acs/version2_pgn_commands.py",
              "tests/test_version2_pgn_commands.py",
          }
          changed = set(
              filter(
                  None,
                  subprocess.check_output(
                      ["git", "diff", "--name-only", f"{base}...HEAD"],
                      text=True,
                  ).splitlines(),
              )
          )
          if changed != expected:
              raise SystemExit(
                  f"unexpected scope: {sorted(changed)!r}; expected={sorted(expected)!r}"
              )
          PY
          git diff --check "$live_base"...HEAD

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/version2_pgn_commands.py
          tests/test_version2_pgn_commands.py

      - name: Run PGN command and adjacent application regressions
        run: >-
          python -m unittest -v
          tests.test_version2_pgn_commands
          tests.test_v2_windows_pgn_export
          tests.test_version2_application
