name: Bootstrap Stage1 Source

on:
  push:
    branches:
      - agent/stage1-final-0.3.1
    paths:
      - '.github/workflows/bootstrap-stage1-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage1-final-0.3.1
          fetch-depth: 0
      - name: Download exact Stage1 0.3.1 baseline from Drive
        shell: bash
        run: |
          set -euxo pipefail
          FILE_ID='1Jl_7ALdkZmuru2TlEixsY446W8IkuHlq'
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 20 \
            -A 'Mozilla/5.0' "$URL" -o baseline.zip
          ls -lh baseline.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('baseline.zip')
          print('downloaded bytes:', p.stat().st_size)
          with p.open('rb') as f:
              print('signature:', f.read(4))
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit(f'Corrupt ZIP member: {bad}')
              names=z.namelist()
              print('ZIP OK, members:', len(names))
              required={'acs/main.py','acs/chesscore.py','VERSION.txt','HOTKEYS_UA.txt'}
              missing=required-set(names)
              if missing:
                  raise SystemExit(f'Missing required baseline files: {sorted(missing)}')
          PY
      - name: Import exact baseline contents
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _baseline
          mkdir _baseline
          unzip -q baseline.zip -d _baseline
          rm -f baseline.zip
          shopt -s dotglob nullglob
          for item in _baseline/*; do
            base=$(basename "$item")
            if [[ "$base" == ".git" || "$base" == ".github" ]]; then
              continue
            fi
            rm -rf "$base"
            cp -a "$item" "$base"
          done
          rm -rf _baseline
      - name: Commit imported baseline
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'accessible-chess-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import exact Stage 1 0.3.1 source baseline from Drive'
          git push origin HEAD:agent/stage1-final-0.3.1
