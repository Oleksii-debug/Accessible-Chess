# NATIVE_SELECTION_PROOF_V3_656E8EC
name: Windows Stage 1 Strict Release Dispatch

on:
  push:
    branches:
      - qa/windows-current-integration-candidate-20260815
    paths:
      - '.github/workflows/windows-stage1-strict-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: stage1-strict-release-dispatch
  cancel-in-progress: false

env:
  TARGET_PRODUCT_SHA: 656e8ec311e364e6e54a30504fd30a4aaff586f9

jobs:
  native-selection-proof-and-dispatch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/windows-current-integration-candidate-20260815
          fetch-depth: 0

      - name: Replace ambiguous clipboard probe with decisive native behavior proof
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          helper_path = Path('tools/qa/stage1_packaged_e2e_crossprocess.ps1')
          helper = helper_path.read_text(encoding='utf-8')
          start_marker = "  Set-Clipboard -Value '__sentinel__'"
          end_marker = "  $vp.SetValue('e5')"
          if helper.count(start_marker) != 1 or helper.count(end_marker) != 1:
              raise SystemExit(f'Clipboard replacement anchors not unique: start={helper.count(start_marker)} end={helper.count(end_marker)}')
          start = helper.index(start_marker)
          end = helper.index(end_marker, start)
          replacement = r'''  Set-Clipboard -Value '__sentinel__'
          $null=$ws.AppActivate($AppPid)
          $move.SetFocus()
          AssertFocusedRuntimeEventually $moveRid 'Native keyboard focus convergence'
          $focused=[System.Windows.Automation.AutomationElement]::FocusedElement
          if((RuntimeId $focused) -ne $moveRid){throw "Native keyboard focus mismatch: $(FocusDescription $focused)"}
          $vp=ValuePattern $move 'Move before native keyboard proof'
          if([string]$vp.Current.Value -ne 'e9'){throw "Native keyboard precondition ValuePattern mismatch: '$([string]$vp.Current.Value)'"}

          if(-not ('AccessibleChessQaNativeKeysV3' -as [type])) {
            Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class AccessibleChessQaNativeKeysV3 {
            [DllImport("user32.dll")]
            private static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);
            private const uint KEYEVENTF_KEYUP = 0x0002;
            public static void Key(byte vk) {
              keybd_event(vk, 0, 0, UIntPtr.Zero);
              keybd_event(vk, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);
            }
            public static void Ctrl(byte vk) {
              keybd_event(0x11, 0, 0, UIntPtr.Zero);
              keybd_event(vk, 0, 0, UIntPtr.Zero);
              keybd_event(vk, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);
              keybd_event(0x11, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);
            }
          }
          "@
          }

          # Control proof: a plain native Backspace must reach the exact focused Move Edit.
          [AccessibleChessQaNativeKeysV3]::Key([byte]0x08)
          Start-Sleep -Milliseconds 250
          AssertFocusedRuntimeEventually $moveRid 'Native Backspace focus convergence'
          $afterBackspace=[string](ValuePattern $move 'Move after native Backspace').Current.Value
          if($afterBackspace -ne 'e'){
            throw "NATIVE_KEY_DELIVERY_INCONCLUSIVE: expected plain Backspace to change e9 -> e, got '$afterBackspace'"
          }
          Write-Output 'NATIVE KEY DELIVERY CONTROL PASS e9->e'

          # Restore without submitting. Then prove Ctrl+A behavior without relying on UIA TextPattern.
          $vp=ValuePattern $move 'Move restore before Ctrl+A selection proof'
          $vp.SetValue('e9')
          if([string]$vp.Current.Value -ne 'e9'){throw 'Could not restore e9 before native Ctrl+A proof'}
          $null=$ws.AppActivate($AppPid)
          $move.SetFocus()
          AssertFocusedRuntimeEventually $moveRid 'Native Ctrl+A focus convergence'
          [AccessibleChessQaNativeKeysV3]::Ctrl([byte]0x41)
          Start-Sleep -Milliseconds 150
          [AccessibleChessQaNativeKeysV3]::Key([byte]0x08)
          Start-Sleep -Milliseconds 250
          AssertFocusedRuntimeEventually $moveRid 'Native Ctrl+A plus Backspace focus convergence'
          $afterSelectDelete=[string](ValuePattern $move 'Move after native Ctrl+A plus Backspace').Current.Value
          if($afterSelectDelete -ne ''){
            throw "NATIVE_CTRL_A_SELECTION_DEFECT_AFTER_PROVEN_KEY_DELIVERY: expected selected e9 to delete to empty, got '$afterSelectDelete'"
          }
          Write-Output 'NATIVE CTRL+A SELECTION BEHAVIOR PASS e9->empty via Backspace'

          # Restore and prove Ctrl+C after selection has already been behaviorally established.
          $vp=ValuePattern $move 'Move restore before native copy proof'
          $vp.SetValue('e9')
          if([string]$vp.Current.Value -ne 'e9'){throw 'Could not restore e9 before native copy proof'}
          Set-Clipboard -Value '__sentinel__'
          $null=$ws.AppActivate($AppPid)
          $move.SetFocus()
          AssertFocusedRuntimeEventually $moveRid 'Native copy focus convergence'
          [AccessibleChessQaNativeKeysV3]::Ctrl([byte]0x41)
          Start-Sleep -Milliseconds 150
          [AccessibleChessQaNativeKeysV3]::Ctrl([byte]0x43)
          Start-Sleep -Milliseconds 400
          AssertFocusedRuntimeEventually $moveRid 'Native copy post-chord focus convergence'
          $clip=([string](Get-Clipboard -Raw)).Trim()
          if($clip -ne 'e9'){
            throw "NATIVE_CTRL_C_COPY_DEFECT_AFTER_PROVEN_SELECTION: clipboard='$clip' expected='e9'"
          }
          $summary.clipboard=$clip
          Write-Output "NATIVE CTRL+A/CTRL+C BEHAVIOR PASS clipboard='$clip'"
          Write-Output 'CLIPBOARD DECISIVE NATIVE KEY/SELECTION/COPY PASS'

'''
          helper = helper[:start] + replacement + helper[end:]
          helper_path.write_text(helper, encoding='utf-8')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'QA native keyboard proof patch failed'}

      - name: Validate decisive helper and exact product lock
        shell: pwsh
        run: |
          $helper='tools\qa\stage1_packaged_e2e_crossprocess.ps1'
          $strict='.github\workflows\windows-stage1-strict-release-crossprocess.yml'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $helper),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -gt 0){throw (@($errors|ForEach-Object{$_.Message}) -join ' | ')}
          $text=Get-Content $helper -Raw
          if($text -notmatch 'NATIVE KEY DELIVERY CONTROL PASS'){throw 'Native key delivery control proof missing'}
          if($text -notmatch 'NATIVE CTRL\+A SELECTION BEHAVIOR PASS'){throw 'Behavioral Ctrl+A proof missing'}
          if($text -notmatch 'NATIVE_CTRL_C_COPY_DEFECT_AFTER_PROVEN_SELECTION'){throw 'Fail-closed post-selection copy classification marker missing'}
          if($text -notmatch 'AccessibleChessQaNativeKeysV3'){throw 'Native user32 key injector missing'}
          if($text -match 'TextPatternRangeEndpoint'){throw 'Ambiguous UIA selection endpoint dependency remains'}
          if($text -notmatch 'RNBQKBNR b KQkq e3 0 1'){throw 'Canonical e4 FEN expectation missing'}
          if($text -notmatch 'RNBQKBNR w KQkq e6 0 2'){throw 'Canonical black e5 FEN expectation missing'}
          $strictText=Get-Content $strict -Raw
          if($strictText -notmatch [regex]::Escape($env:TARGET_PRODUCT_SHA)){throw 'Strict workflow does not target exact 656e8ec product SHA'}
          if($strictText -match 'e8cd992d306975955784118364ce950963133d7e'){throw 'Old strict product SHA remains'}
          'DECISIVE NATIVE KEY/SELECTION/COPY QA CONTRACT PASS'

      - name: Commit only QA helper change
        shell: pwsh
        run: |
          $changes=@(git status --short)
          $changes | ForEach-Object {$_}
          if($changes.Count -ne 1 -or $changes[0] -ne ' M tools/qa/stage1_packaged_e2e_crossprocess.ps1'){
            throw "Expected exactly one QA helper change, got: $($changes -join ' | ')"
          }
          git config user.name 'Oleksii-debug'
          git config user.email 'oleksiy.az.09@gmail.com'
          git add tools/qa/stage1_packaged_e2e_crossprocess.ps1
          git commit -m 'QA: prove native Ctrl+A/C behavior on exact 656e8ec'
          if($LASTEXITCODE -ne 0){throw 'QA helper commit failed'}
          git push origin HEAD:qa/windows-current-integration-candidate-20260815
          if($LASTEXITCODE -ne 0){throw 'QA helper push failed'}

      - name: Dispatch at most one strict run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs=gh run list --workflow windows-stage1-strict-release-crossprocess.yml --branch qa/windows-current-integration-candidate-20260815 --limit 20 --json databaseId,status,conclusion | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Could not query strict workflow WIP state'}
          $active=@($runs | Where-Object {$_.status -in @('queued','in_progress','waiting','pending','requested')})
          if($active.Count -gt 0){
            "STRICT WORKFLOW ALREADY ACTIVE: $(@($active.databaseId) -join ',')"
            exit 0
          }
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/windows-stage1-strict-release-crossprocess.yml/dispatches" -f ref='qa/windows-current-integration-candidate-20260815'
          if($LASTEXITCODE -ne 0){throw 'Strict workflow dispatch failed'}
          'STRICT WORKFLOW DISPATCHED'
