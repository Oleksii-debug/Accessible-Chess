name: PGN Document Integrity

on:
  push:
    branches:
      - 'work/pgn-context-atomic-restore-20260907'
  pull_request:
    paths:
      - 'acs/pgn_document.py'
      - 'tests/test_pgn_document_context_atomicity.py'
      - 'tests/test_pgn_document_setup_fen_integrity.py'
      - '.github/workflows/pgn-context-atomicity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-document-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PARENT: 122b7c35cc59ce8a4c4ae1351ef99805e1954c48
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current-parent ancestry and narrow scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PARENT^{commit}"
          git merge-base --is-ancestor "$PARENT" HEAD
          git diff --check "$PARENT" HEAD
          changed="$(git diff --name-only "$PARENT" HEAD | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(acs/pgn_document\.py|tests/test_pgn_document_context_atomicity\.py|tests/test_pgn_document_setup_fen_integrity\.py|\.github/workflows/pgn-context-atomicity\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected child-scope paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict|release_preflight|^acs/stage1_release_ui(_core)?\.py$'; then
            echo 'Frozen Stage 1 / strict-release contamination detected' >&2
            exit 1
          fi

      - name: Compile focused PGN document surface
        run: >-
          python -m compileall -q
          acs/pgn_document.py
          tests/test_pgn_document.py
          tests/test_pgn_document_context_atomicity.py
          tests/test_pgn_document_setup_fen_integrity.py

      - name: Focused PGN document regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_document_context_atomicity
          tests.test_pgn_document_setup_fen_integrity
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_pgn_service
          tests.test_d06_pgn_roundtrip
          tests.test_gametree_legality

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
