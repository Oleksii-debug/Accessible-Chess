name: V2 Composition Publication Boundary

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_release_app.py'
      - 'tests/test_version2_composition_publication_boundary.py'
      - '.github/workflows/v2-composition-publication-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-composition-publication-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_PRODUCT_BLOB: 4462da8db48737b4f66de7e2f4001d601aaec8a6
  CANDIDATE_PRODUCT_BLOB: 446f9bf691b47ba54c0c165cd592dfc04d54b500
  REGRESSION_BLOB: undefined

jobs:
  publication-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact current authority and bounded Product delta
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA" HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-composition-publication-boundary.yml' \
            'acs/version2_release_app.py' \
            'tests/test_version2_composition_publication_boundary.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse "$EXPECTED_BASE_SHA":acs/version2_release_app.py)" = "$BASE_PRODUCT_BLOB"
          test "$(git rev-parse HEAD:acs/version2_release_app.py)" = "$CANDIDATE_PRODUCT_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_composition_publication_boundary.py)" = "$REGRESSION_BLOB"

      - name: Compile publication-boundary scope
        run: python -m py_compile acs/version2_release_app.py tests/test_version2_composition_publication_boundary.py

      - name: Prove failed composition is never published
        run: python -m unittest -v tests.test_version2_composition_publication_boundary tests.test_version2_release_app

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Core selftest
        run: python -m acs.selftest

      - name: Current V2 production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic
