name: PGN Real Corpus Round-Trip

on:
  pull_request:
    paths:
      - 'scripts/pgn_real_corpus_oracle.py'
      - 'scripts/pgn_real_corpus_session_oracle.py'
      - 'scripts/pgn_real_eval_rav_oracle.py'
      - '.github/workflows/pgn-real-corpus-roundtrip.yml'

permissions:
  contents: read

concurrency:
  group: pgn-real-corpus-roundtrip-${{ github.ref }}
  cancel-in-progress: true

env:
  PGN_BASE: d706eb93b9a4df3c6e99ab1af584a9cfe6b6f5ea

jobs:
  real-corpus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned QA dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove repaired D06 base and evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PGN_BASE^{commit}"
          test "$(git merge-base HEAD "$PGN_BASE")" = "$PGN_BASE"
          git diff --check "$PGN_BASE" HEAD
          changed="$(git diff --name-only "$PGN_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/pgn-real-corpus-roundtrip.yml' \
            'scripts/pgn_real_corpus_oracle.py' \
            'scripts/pgn_real_corpus_session_oracle.py' \
            'scripts/pgn_real_eval_rav_oracle.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$PGN_BASE" HEAD -- acs tests web run_accessible_chess.py
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "96d62bf6dd7b2f5c8a75d5f2bd1fde2ad0823d20"
          test "$(git rev-parse HEAD:acs/pgn_document.py)" = "ae0b7d3815c4d277b68ef3c170c95255cf5c6442"
          echo 'PGN-03 REPAIRED-BASE EVIDENCE-ONLY SCOPE PASS'

      - name: Compile and self-test corpus tools
        run: |
          python -m py_compile scripts/pgn_real_corpus_oracle.py scripts/pgn_real_corpus_session_oracle.py scripts/pgn_real_eval_rav_oracle.py
          python -m scripts.pgn_real_corpus_session_oracle --selftest

      - name: Focused canonical PGN and GameTree regressions
        run: >-
          python -m unittest -v
          tests.test_d06_real_corpus_recovery
          tests.test_gametree
          tests.test_d06_pgn_roundtrip
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_pgn_concurrent_save
          tests.test_pgn_service
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_resource_security
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_postcommit_cleanup_atomicity

      - name: Verify pinned real Lichess SetUp/FEN and recursive RAV
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn_real_eval_rav_oracle 2>&1 | tee pgn-real-eval-rav-report.txt
          grep -F '"prefix_pinned": true' pgn-real-eval-rav-report.txt
          grep -F '"prefix_sha256": "1ab774b1f4ce4558bac6c21f76eef14776b10ad56e07fe45fc02ec867f0ace87"' pgn-real-eval-rav-report.txt
          grep -F '"candidate_line_number": 2' pgn-real-eval-rav-report.txt
          grep -F '"nested_path_depth": 2' pgn-real-eval-rav-report.txt
          grep -F 'PGN REAL EVAL FEN NESTED RAV PASS' pgn-real-eval-rav-report.txt

      - name: Verify 4,000 pinned real records through strict and recovery contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn_real_corpus_session_oracle --games-per-corpus 2000 --batch-size 250 2>&1 | tee pgn-real-corpus-report.txt
          grep -F '"sampled_records_total": 4000' pgn-real-corpus-report.txt
          grep -F '"recovery_records_total":' pgn-real-corpus-report.txt
          grep -F '"strict_roundtrip_games_total":' pgn-real-corpus-report.txt
          grep -F 'PGN REAL CORPUS SESSION ROUND-TRIP PASS' pgn-real-corpus-report.txt

      - name: Upload corpus evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgn-real-corpus-${{ matrix.os }}
          path: |
            pgn-real-eval-rav-report.txt
            pgn-real-corpus-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
