name: V2 Windows Book Board Accessible Adapter

on:
  push:
    branches:
      - work/v2-windows-book-board-adapter-20260831
  pull_request:
    branches:
      - work/v2-book-board-workflow-20260831
    paths:
      - 'acs/version2_windows_book_board_adapter.py'
      - 'tests/test_v2_windows_book_board_adapter.py'
      - '.github/workflows/v2-windows-book-board-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-book-board-adapter-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: f4594e48a7689ca5cc6c5a9ca467adbbc98c95f3

jobs:
  book-board-adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact parent and isolated D01 scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-book-board-adapter.yml' \
            'acs/version2_windows_book_board_adapter.py' \
            'tests/test_v2_windows_book_board_adapter.py' | sort)"
          actual="$(git diff --name-only "$BASE_SHA" HEAD | sort)"
          test "$actual" = "$expected"
          for path in \
            acs/book_board_workflow.py \
            tests/test_v2_book_board_workflow.py \
            acs/book_webview_projection.py \
            acs/book_webview_bridge.py \
            acs/full_product_presenters.py \
            acs/full_product_actions.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$BASE_SHA:$path")"
          done

      - name: Compile adapter and inherited application seam
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused D01 plus BookBoard application contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_book_board_adapter
          tests.test_v2_book_board_workflow

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_book_board_adapter.py
          tests/test_v2_book_board_workflow.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
