name: P0 Packaged MenuBar Identity Delta

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - '.github/workflows/p0-packaged-menubar-identity-delta.yml'
      - 'scripts/p0_native_menubar_uia_probe.ps1'
      - 'packaging/AccessibleChess.exe.config'
      - 'run_accessible_chess_v2.py'
      - 'acs/version2_release_payload.py'
      - 'acs/version2_package_assembler.py'
      - 'acs/version2_package_preflight.py'
      - 'acs/webview2_accessibility.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-packaged-menubar-identity-delta-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12.10'
  PYWEBVIEW_VERSION: '6.2.1'
  PYTHONNET_VERSION: '3.1.0'
  CLR_LOADER_VERSION: '0.3.1'
  CFFI_VERSION: '2.1.1'
  PYCPARSER_VERSION: '3.0'
  TYPING_EXTENSIONS_VERSION: '4.16.0'
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_VERSION: '4.1.0'
  ZSTANDARD_VERSION: '0.25.0'
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip
  STOCKFISH_SHA256: 40cc975817e7eee270b03f354810d20956df565420d320f6dd37d454dc81a139

jobs:
  compare-standalone-and-fresh-package:
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Prove unchanged source app-config and package contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m unittest -v tests.test_packaged_winforms_appconfig tests.test_webview2_modern_winforms_accessibility tests.test_version2_release_payload tests.test_version2_package_assembler tests.test_version2_package_preflight
          if($LASTEXITCODE -ne 0){throw 'Source package/app-config regression failed'}

      - name: Install exact qualification compiler stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
          python -m pip install --disable-pip-version-check `
            "pywebview==$env:PYWEBVIEW_VERSION" `
            "pythonnet==$env:PYTHONNET_VERSION" `
            "clr-loader==$env:CLR_LOADER_VERSION" `
            "cffi==$env:CFFI_VERSION" `
            "pycparser==$env:PYCPARSER_VERSION" `
            "typing-extensions==$env:TYPING_EXTENSIONS_VERSION" `
            "Nuitka @ $nuitkaUrl" `
            "ordered-set==$env:ORDERED_SET_VERSION" `
            "zstandard==$env:ZSTANDARD_VERSION"
          if($LASTEXITCODE -ne 0){throw 'Exact compiler stack installation failed'}

      - name: Build exact shipping standalone
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --output-filename=AccessibleChess.exe `
            --include-data-dir=web=web `
            run_accessible_chess_v2.py
          if($LASTEXITCODE -ne 0){throw 'Shipping standalone build failed'}
          $dist=(Resolve-Path 'run_accessible_chess_v2.dist').Path
          foreach($name in @('AccessibleChess.exe','AccessibleChess.exe.config')){
            $path=Join-Path $dist $name
            if(-not (Test-Path -LiteralPath $path -PathType Leaf)){throw "Standalone missing $name"}
            Write-Host "STANDALONE_$($name.Replace('.','_').ToUpperInvariant())_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant())"
          }
          $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath 'packaging\AccessibleChess.exe.config').Hash.ToLowerInvariant()
          $distHash=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dist 'AccessibleChess.exe.config')).Hash.ToLowerInvariant()
          if($sourceHash -ne $distHash){throw 'Standalone config differs from source config'}
          Write-Host 'STANDALONE_BYTES_READY=PASS'

      - name: Build deterministic sound input and exact Stockfish
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib, json, math, struct, wave
          from pathlib import Path
          from acs.sound_events import SoundEvent
          root = Path('release-inputs/sounds')
          root.mkdir(parents=True, exist_ok=False)
          frequencies = (330, 220, 660, 440, 550, 140, 392, 196, 880)
          files, provenance = {}, {}
          for event, frequency in zip(SoundEvent, frequencies, strict=True):
              name = f'{event.value}.wav'
              path = root / name
              sample_rate = 22050
              duration = 0.12 if event.value == 'tick' else 0.18
              count = int(sample_rate * duration)
              frames = [struct.pack('<h', int(9000 * max(0.0, 1.0 - i / count) * math.sin(2 * math.pi * frequency * i / sample_rate))) for i in range(count)]
              with wave.open(str(path), 'wb') as writer:
                  writer.setnchannels(1); writer.setsampwidth(2); writer.setframerate(sample_rate); writer.writeframes(b''.join(frames))
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files[event.value] = name
              provenance[event.value] = {'file': name, 'sha256': digest, 'license_id': 'CC0-1.0', 'source': f'urn:accessible-chess:generated-tone:v1:{event.value}', 'creator': 'Accessible Chess deterministic tone generator'}
          (root / 'manifest.json').write_text(json.dumps({'schema_version': 1, 'files': files}, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          (root / 'provenance.json').write_text(json.dumps({'schema_version': 1, 'events': provenance}, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          assert len(files) == len(tuple(SoundEvent)) == 9
          print('DETERMINISTIC_SOUND_INPUT=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Sound generation failed'}
          New-Item -ItemType Directory -Force -Path release-inputs | Out-Null
          Invoke-WebRequest -Uri $env:STOCKFISH_URL -OutFile 'release-inputs\stockfish.zip'
          $digest=(Get-FileHash -Algorithm SHA256 -LiteralPath 'release-inputs\stockfish.zip').Hash.ToLowerInvariant()
          if($digest -ne $env:STOCKFISH_SHA256){throw "STOCKFISH_SHA256_MISMATCH $digest"}
          Write-Host "STOCKFISH_RELEASE_SHA256=$digest"

      - name: Canonical payload assemble deterministic ZIP and fresh extract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib, json
          from pathlib import Path
          from acs.version2_release_payload import prepare_version2_release_payload
          from acs.version2_package_assembler import assemble_version2_package_tree, write_version2_package_zip
          out = Path('p0-identity-delta')
          prepared = prepare_version2_release_payload(
              Path('run_accessible_chess_v2.dist'),
              Path('release-inputs/stockfish.zip'),
              Path('release-inputs/sounds'),
              out / 'prepared',
          )
          assembled = assemble_version2_package_tree(
              prepared.product_dir,
              prepared.notices_dir,
              out / 'package',
              integration_sha='bd849204bf0ce0d510815a7525ff2cec59ee16d7',
          )
          archive = out / 'candidate.zip'
          write_version2_package_zip(
              assembled.package_root,
              archive,
              expected_integration_sha='bd849204bf0ce0d510815a7525ff2cec59ee16d7',
          )
          paths = {
              'prepared_product_dir': str(prepared.product_dir.resolve()),
              'package_product_dir': str((assembled.package_root / 'AccessibleChess').resolve()),
              'archive': str(archive.resolve()),
          }
          (out / 'canonical-paths.json').write_text(json.dumps(paths, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print('CANONICAL_PREPARED_PRODUCT_DIR=' + paths['prepared_product_dir'])
          print('CANONICAL_PACKAGE_PRODUCT_DIR=' + paths['package_product_dir'])
          print('CANONICAL_DELTA_ZIP_SHA256=' + hashlib.sha256(archive.read_bytes()).hexdigest())
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Canonical payload/package assembly failed'}
          New-Item -ItemType Directory -Path p0-identity-fresh | Out-Null
          Expand-Archive -LiteralPath 'p0-identity-delta\candidate.zip' -DestinationPath p0-identity-fresh
          Write-Host 'CANONICAL_FRESH_EXTRACTION=PASS'

      - name: Collect byte and bounded UIA evidence then classify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'

          $canonicalPaths=Get-Content -LiteralPath 'p0-identity-delta\canonical-paths.json' -Raw | ConvertFrom-Json
          $roots=[ordered]@{
            standalone=(Resolve-Path 'run_accessible_chess_v2.dist').Path
            prepared=(Resolve-Path ([string]$canonicalPaths.prepared_product_dir)).Path
            packaged=(Resolve-Path ([string]$canonicalPaths.package_product_dir)).Path
            fresh=(Resolve-Path 'p0-identity-fresh\AccessibleChess').Path
          }

          $hashSummary=[ordered]@{}
          foreach($entry in $roots.GetEnumerator()){
            $exe=Join-Path $entry.Value 'AccessibleChess.exe'
            $cfg=Join-Path $entry.Value 'AccessibleChess.exe.config'
            if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw "$($entry.Key) missing AccessibleChess.exe"}
            if(-not (Test-Path -LiteralPath $cfg -PathType Leaf)){throw "$($entry.Key) missing AccessibleChess.exe.config"}
            $hashSummary[$entry.Key]=[ordered]@{
              root=$entry.Value
              exe_sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
              config_sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $cfg).Hash.ToLowerInvariant()
            }
          }
          $exeHashes=@($hashSummary.Values|ForEach-Object {$_.exe_sha256}|Select-Object -Unique)
          $cfgHashes=@($hashSummary.Values|ForEach-Object {$_.config_sha256}|Select-Object -Unique)
          $hashSummary['exe_bytes_identical']=($exeHashes.Count -eq 1)
          $hashSummary['config_bytes_identical']=($cfgHashes.Count -eq 1)
          $hashSummary|ConvertTo-Json -Depth 6|Set-Content -LiteralPath p0-menubar-byte-identity.json -Encoding UTF8
          Write-Host "EXE_BYTE_IDENTITY=$($hashSummary['exe_bytes_identical']) unique=$($exeHashes.Count)"
          Write-Host "CONFIG_BYTE_IDENTITY=$($hashSummary['config_bytes_identical']) unique=$($cfgHashes.Count)"

          function Invoke-BoundedMenuBarProbe {
            param(
              [Parameter(Mandatory=$true)][string]$Label,
              [Parameter(Mandatory=$true)][string]$Root,
              [Parameter(Mandatory=$true)][string]$OutputPath,
              [Parameter(Mandatory=$true)][string]$TracePath
            )
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--force-renderer-accessibility'
            $exe=(Resolve-Path (Join-Path $Root 'AccessibleChess.exe')).Path
            Remove-Item -LiteralPath $OutputPath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $TracePath -Force -ErrorAction SilentlyContinue
            $process=$null
            $observations=@()
            $canonical=@()
            $finalBars=@()
            $infrastructureError=$null
            try {
              $process=Start-Process -FilePath $exe -WorkingDirectory $Root -PassThru
            }
            catch {
              $infrastructureError="$Label process launch failed: $($_.Exception.Message)"
            }
            if($process){
              try {
                $deadline=[DateTime]::UtcNow.AddSeconds(45)
                do {
                  $process.Refresh()
                  if($process.HasExited){
                    $infrastructureError="$Label process exited before bounded MenuBar proof code=$($process.ExitCode)"
                    break
                  }
                  $probeLog=& pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                    -File scripts/p0_native_menubar_uia_probe.ps1 `
                    -TargetProcessId $process.Id `
                    -MenuHandle 0 `
                    -OutputPath $OutputPath `
                    -TimeoutSeconds 2
                  $probeExit=$LASTEXITCODE
                  @($probeLog)|ForEach-Object { Write-Host "$Label probe: $_" }
                  if($probeExit -ne 0){
                    $infrastructureError="$Label external UIA probe failed exit=$probeExit"
                    break
                  }
                  if(-not (Test-Path -LiteralPath $OutputPath -PathType Leaf)){
                    $infrastructureError="$Label external UIA probe produced no evidence file"
                    break
                  }
                  try {
                    $uia=Get-Content -LiteralPath $OutputPath -Raw | ConvertFrom-Json
                  }
                  catch {
                    $infrastructureError="$Label UIA evidence parse failed: $($_.Exception.Message)"
                    break
                  }
                  $bars=@($uia.same_process_menu_bars)
                  $finalBars=$bars
                  $observations += [pscustomobject]@{
                    utc=[DateTime]::UtcNow.ToString('o')
                    menu_bars=$bars
                  }
                  $canonical=@($bars|Where-Object {[string]$_.automation_id -eq 'AccessibleChessFullProductMenu'})
                  $last=(@($bars|ForEach-Object {
                    "id='$([string]$_.automation_id)' name='$([string]$_.name)' type='$([string]$_.control_type)'"
                  }) -join ' | ')
                  Write-Host "$($Label.ToUpperInvariant())_OBSERVATION=$last"
                  if($canonical.Count -eq 1){break}
                  Start-Sleep -Milliseconds 250
                } while([DateTime]::UtcNow -lt $deadline)
              }
              finally {
                $live=Get-Process -Id $process.Id -ErrorAction SilentlyContinue
                if($live){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
              }
            }
            $result=[ordered]@{
              label=$Label
              canonical_count=$canonical.Count
              infrastructure_error=$infrastructureError
              observations=$observations
              final_menu_bars=$finalBars
            }
            $result|ConvertTo-Json -Depth 10|Set-Content -LiteralPath $TracePath -Encoding UTF8
            return [pscustomobject]$result
          }

          $standalone=Invoke-BoundedMenuBarProbe `
            -Label 'standalone' `
            -Root $roots['standalone'] `
            -OutputPath (Join-Path $PWD 'p0-menubar-standalone.json') `
            -TracePath (Join-Path $PWD 'p0-menubar-standalone-observations.json')

          $fresh=Invoke-BoundedMenuBarProbe `
            -Label 'fresh' `
            -Root $roots['fresh'] `
            -OutputPath (Join-Path $PWD 'p0-menubar-fresh.json') `
            -TracePath (Join-Path $PWD 'p0-menubar-fresh-observations.json')

          $exeIdentical=[bool]$hashSummary['exe_bytes_identical']
          $cfgIdentical=[bool]$hashSummary['config_bytes_identical']
          $sCanonical=[int]$standalone.canonical_count
          $fCanonical=[int]$fresh.canonical_count

          if(-not $exeIdentical -and -not $cfgIdentical){
            $classification='EXE_AND_CONFIG_BYTES_DRIFT'
          } elseif(-not $exeIdentical){
            $classification='EXE_BYTES_DRIFT'
          } elseif(-not $cfgIdentical){
            $classification='CONFIG_BYTES_DRIFT'
          } elseif($standalone.infrastructure_error -or $fresh.infrastructure_error){
            $classification='UIA_PROBE_INFRASTRUCTURE_ERROR'
          } elseif($sCanonical -eq 1 -and $fCanonical -eq 1){
            $classification='SEMANTIC_ID_STABLE'
          } elseif($sCanonical -eq 1 -and $fCanonical -eq 0){
            $classification='IDENTICAL_BYTES_LAUNCH_CONTEXT_IDENTITY_DRIFT'
          } elseif($sCanonical -eq 0 -and $fCanonical -eq 1){
            $classification='IDENTICAL_BYTES_STANDALONE_IDENTITY_MISSING'
          } elseif($sCanonical -eq 0 -and $fCanonical -eq 0){
            $classification='IDENTICAL_BYTES_CANONICAL_ID_MISSING_BOTH'
          } else {
            $classification='UNEXPECTED_IDENTITY_STATE'
          }

          $combined=[ordered]@{
            classification=$classification
            byte_identity=$hashSummary
            standalone=$standalone
            fresh=$fresh
            human_tested=$false
            nvda_verified=$false
          }
          $combined|ConvertTo-Json -Depth 12|Set-Content -LiteralPath p0-menubar-identity-delta-summary.json -Encoding UTF8
          Write-Host "P0_MENUBAR_IDENTITY_DELTA_CLASSIFICATION=$classification"
          Write-Host "STANDALONE_CANONICAL_COUNT=$sCanonical"
          Write-Host "FRESH_CANONICAL_COUNT=$fCanonical"
          if($classification -ne 'SEMANTIC_ID_STABLE'){
            throw "Native MenuBar semantic identity diagnostic classified RED: $classification"
          }
          Write-Host 'P0_CANONICAL_PACKAGE_MENUBAR_IDENTITY=PASS'

      - name: Upload bounded A-B identity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p0-packaged-menubar-identity-delta
          path: |
            p0-identity-delta/canonical-paths.json
            p0-menubar-standalone.json
            p0-menubar-standalone-observations.json
            p0-menubar-fresh.json
            p0-menubar-fresh-observations.json
            p0-menubar-byte-identity.json
            p0-menubar-identity-delta-summary.json
          if-no-files-found: warn
          retention-days: 14
