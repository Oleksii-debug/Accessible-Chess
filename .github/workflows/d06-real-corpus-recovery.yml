name: D06 Real Corpus Recovery

on:
  pull_request:
    paths:
      - 'acs/pgn_document.py'
      - 'tests/test_d06_real_corpus_recovery.py'
      - '.github/workflows/d06-real-corpus-recovery.yml'

permissions:
  contents: read

concurrency:
  group: d06-real-corpus-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  RECOVERY_BASE: 6567f3d35ffefaa85ae7e8b87d9fcc0d188e7cac

jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove D06 recovery ancestry and scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RECOVERY_BASE^{commit}"
          test "$(git merge-base HEAD "$RECOVERY_BASE")" = "$RECOVERY_BASE"
          git diff --check "$RECOVERY_BASE" HEAD
          changed="$(git diff --name-only "$RECOVERY_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d06-real-corpus-recovery.yml' \
            'tests/test_d06_real_corpus_recovery.py' | sort)"
          if git diff --name-only "$RECOVERY_BASE" HEAD -- acs/pgn_document.py | grep -q .; then
            expected="$(printf '%s\n' "$expected" 'acs/pgn_document.py' | sort)"
          fi
          test "$changed" = "$expected"

      - name: Compile recovery surface
        run: python -m py_compile acs/pgn_document.py tests/test_d06_real_corpus_recovery.py

      - name: Real-corpus-derived RED regression
        run: python -m unittest -v tests.test_d06_real_corpus_recovery

      - name: Focused PGN document/workspace/recovery regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_pgn_service
          tests.test_d06_pgn_roundtrip
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_resource_security
          tests.test_dev4_pgn_export_failure_recovery

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
