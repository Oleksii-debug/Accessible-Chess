name: D04 Current V2 Release Preflight Security Convergence

on:
  pull_request:
    paths:
      - '.github/workflows/d04-release-preflight-current-convergence.yml'
      - 'acs/release_preflight.py'
      - 'tests/test_d04_release_preflight_hygiene.py'
      - 'tests/test_d04_release_archive_canonicality.py'
      - 'tests/test_d04_stockfish_source_zip_bounds.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d04-current-v2-release-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_FULL_PRODUCT_SHA: 99d11c19314ef3ef9d2558b399fcc5dcedbd13b3
  ACCEPTED_PREFLIGHT_BLOB: 9213efc03e78756ec7d45f5983c91414b614b06f

jobs:
  release-preflight-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current authority and bounded same-lineage delta
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$CURRENT_FULL_PRODUCT_SHA^{commit}" || git fetch --no-tags origin "$CURRENT_FULL_PRODUCT_SHA"
          test "$(git rev-parse HEAD^1)" = "$CURRENT_FULL_PRODUCT_SHA"
          git merge-base --is-ancestor "$CURRENT_FULL_PRODUCT_SHA" HEAD
          test "$(git rev-parse HEAD:acs/release_preflight.py)" = "$ACCEPTED_PREFLIGHT_BLOB"
          test "$(git rev-parse HEAD:tests/test_d04_release_preflight_hygiene.py)" = "fbec914612befc1e0e2d92b4ba242d06612ff385"
          test "$(git rev-parse HEAD:tests/test_d04_release_archive_canonicality.py)" = "18c154a264bb3aefcb80067f643abd4cae8ce18e"
          test "$(git rev-parse HEAD:tests/test_d04_stockfish_source_zip_bounds.py)" = "4dec7df9ae945812d0cffacb168c912a7b8f56fb"
          changed="$(git diff --name-only "$CURRENT_FULL_PRODUCT_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d04-release-preflight-current-convergence.yml' \
            'acs/release_preflight.py' \
            'tests/test_d04_release_archive_canonicality.py' \
            'tests/test_d04_release_preflight_hygiene.py' \
            'tests/test_d04_stockfish_source_zip_bounds.py' | sort)"
          test "$changed" = "$expected"
          git diff --check "$CURRENT_FULL_PRODUCT_SHA" HEAD

      - name: Compile preflight and proving regressions
        run: >-
          python -m py_compile
          acs/release_preflight.py
          tests/test_d04_release_preflight_hygiene.py
          tests/test_d04_release_archive_canonicality.py
          tests/test_d04_stockfish_source_zip_bounds.py

      - name: Current preflight plus unchanged D04 proving regressions
        run: >-
          python -m unittest -v
          tests.test_release_preflight
          tests.test_d04_release_preflight_hygiene
          tests.test_d04_release_archive_canonicality
          tests.test_d04_stockfish_source_zip_bounds

      - name: Focused pytest confirmation
        run: >-
          python -m pytest -q
          tests/test_release_preflight.py
          tests/test_d04_release_preflight_hygiene.py
          tests/test_d04_release_archive_canonicality.py
          tests/test_d04_stockfish_source_zip_bounds.py

      - name: Full repository unittest on Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest on Linux
        if: runner.os == 'Linux'
        run: python -m pytest -q tests

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
