name: Current EPUB Asset Reference Safety

on:
  pull_request:
    branches:
      - fix/book-html-runtime-correctness-20261006-ooxple7109
    paths:
      - '.github/workflows/current-epub-asset-reference-safety.yml'
      - 'acs/book_epub_import.py'
      - 'tests/test_book_epub_runtime_correctness.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-epub-asset-reference-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EPUB_IMPORT_BLOB: ed09ce0c61d088de0051834e737acff1b7368a17
  RUNTIME_TEST_BLOB: 8fab3e9717e2193f5d6cbbaf8a36c68ed18ac3eb

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove exact bounded geometry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-epub-asset-reference-safety.yml' \
            'acs/book_epub_import.py' \
            'tests/test_book_epub_runtime_correctness.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_epub_import.py)" = "$EPUB_IMPORT_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_epub_runtime_correctness.py)" = "$RUNTIME_TEST_BLOB"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python
        run: python -m py_compile acs/book_epub_import.py tests/test_book_epub_runtime_correctness.py
      - name: Run focused EPUB runtime regressions
        run: python -m unittest tests.test_book_epub_runtime_correctness tests.test_book_active_import_cancellation
