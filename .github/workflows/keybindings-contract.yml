name: Keybinding Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/keybindings.py'
      - 'tests/test_keybindings.py'
      - '.github/workflows/keybindings-contract.yml'
      - '.github/workflows/keybindings-terminal-current-product-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keybindings-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PRODUCT_SHA: 8b546db07b3b539a545746e6de2eea4eca1db3b4

jobs:
  keybindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove bounded keybinding scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head_ref='${{ github.event.pull_request.head.ref }}'
          if [ "$head_ref" = 'reconverge/keybindings-terminal-current-product-20260926' ]; then
            git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            product_ref="refs/remotes/origin/${{ github.base_ref }}"
            product_sha="$(git rev-parse "$product_ref")"
            test "$product_sha" = "$EXPECTED_PRODUCT_SHA"
            git merge-base --is-ancestor "$product_sha" HEAD
            changed="$(git diff --name-only "$product_sha" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/d01-education-management-webview.yml' \
              '.github/workflows/d01-pgn-workspace-webview.yml' \
              '.github/workflows/full-product-education-class-create.yml' \
              '.github/workflows/full-product-native-menu-keymap-refresh.yml' \
              '.github/workflows/keybindings-contract.yml' \
              '.github/workflows/keybindings-terminal-current-product-convergence.yml' \
              '.github/workflows/remappable-board-grid-controls.yml' \
              '.github/workflows/remappable-education-list-navigation.yml' \
              '.github/workflows/remappable-input-submit-keys.yml' \
              '.github/workflows/remappable-library-result-navigation.yml' \
              '.github/workflows/remappable-pgn-tree-navigation.yml' \
              'acs/full_product_actions.py' \
              'acs/full_product_native_menu.py' \
              'acs/keybindings.py' \
              'acs/ui_keymap_adapter.py' \
              'acs/ui_keymap_editor.py' \
              'tests/js/education_surface_dom_test.js' \
              'tests/js/library_surface_dom_test.js' \
              'tests/js/p0g_event_aware_announcement_test.js' \
              'tests/js/pgn_surface_dom_test.js' \
              'tests/js/remappable_board_grid_controls_test.js' \
              'tests/js/remappable_input_submit_keys_test.js' \
              'tests/js/version2_library_open_route_refresh_dom_test.js' \
              'tests/test_full_product_education_keybindings.py' \
              'tests/test_full_product_library_keybindings.py' \
              'tests/test_full_product_native_menu.py' \
              'tests/test_full_product_pgn_keybindings.py' \
              'tests/test_keybindings.py' \
              'tests/test_accessible_webui.py' \
              'tests/test_dev1_library_webview_projection.py' \
              'tests/test_dev1_release_ui_regressions.py' \
              'tests/test_issue22_release_contract.py' \
              'tests/test_stage1_packaged_focus_origin_contract.py' \
              'tests/test_stage1_board_action_integration.py' \
              'tests/test_webview_keymap_bridge_contract.py' \
              'web/full_product_education.js' \
              'web/full_product_library.js' \
              'web/full_product_pgn.js' \
              'web/index.html' \
              'web/keybindings.json' | sort)"
          else
            merge_base="$(git merge-base "$base" HEAD)"
            changed="$(git diff --name-only "$merge_base" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/keybindings-contract.yml' \
              'acs/keybindings.py' \
              'tests/test_keybindings.py' | sort)"
          fi
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected keybinding contract scope:\n%s\n' "$changed" >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile canonical keybinding contract
        run: python -m py_compile acs/keybindings.py tests/test_keybindings.py
      - name: Run canonical keybinding regressions
        run: python -m unittest -v tests.test_keybindings
