name: V2 Library Date Filter V5

on:
  push:
    branches:
      - work/v2-library-date-filter-20260828
  pull_request:
    branches:
      - work/v2-library-acsdb-search-v4-20260828
    paths:
      - 'acs/acsdb.py'
      - 'acs/search_policy.py'
      - 'acs/search_service.py'
      - 'tests/test_v2_library_acsdb_search_v4.py'
      - 'tests/test_v2_library_date_filter_v5.py'
      - 'tests/test_v2_library_date_real_cbv.py'
      - 'tools/v2_library_date_filter_v5_benchmark.py'
      - '.github/workflows/v2-library-date-filter-v5.yml'

permissions:
  contents: read

concurrency:
  group: v2-library-date-v5-${{ github.ref }}
  cancel-in-progress: true

env:
  STACK_BASE: c26099870bbdc70a60cfb9aaf6bde59f447e490c
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696
  UNCBV_COMMIT: 3c18e8a7c6a30c21f945a1ab5462521c306dca57

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Normalize worktree to canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "$(git rev-parse HEAD:acs/stage1_release_ui_core.py)"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "$(git rev-parse HEAD:acs/webapp_keymap_core.py)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Ownership ancestry and exact child diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$STACK_BASE" HEAD
          git diff --check "$STACK_BASE" HEAD
          changed="$(git diff --name-only "$STACK_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-library-date-filter-v5.yml' \
            'acs/acsdb.py' \
            'acs/search_policy.py' \
            'acs/search_service.py' \
            'tests/test_v2_library_acsdb_search_v4.py' \
            'tests/test_v2_library_date_filter_v5.py' \
            'tests/test_v2_library_date_real_cbv.py' \
            'tools/v2_library_date_filter_v5_benchmark.py' | sort)"
          test "$changed" = "$expected"
          if printf '%s\n' "$changed" | grep -E 'teacher|classroom|education|chessbase_decoder|gametree.py|pgn_document|pgn_service|pgn_workspace'; then
            echo 'Out-of-lane or parser/chess-core contamination detected' >&2
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q acs tests tools run_accessible_chess.py
      - name: Focused ACSDB v5 date and inherited D07 regressions
        run: >-
          python -m unittest -v
          tests.test_v2_library_date_filter_v5
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_search_service_v4
          tests.test_acsdb
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence
          tests.test_windows_data_release_regressions
      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee full-unittest.log
      - name: Upload full unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-library-date-v5-full-unittest-${{ matrix.os }}
          path: full-unittest.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

  performance-100k:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 100k indexed complete-date range evidence
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python tools/v2_library_date_filter_v5_benchmark.py --games 100000 --repeats 5 | tee v2-library-date-v5-100k.json
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-library-date-v5-100k-evidence
          path: v2-library-date-v5-100k.json
          if-no-files-found: error
          retention-days: 7

  real-pinned-twic-cbv:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Accessible Chess
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout pinned libcbh corpus/backend
        uses: actions/checkout@v4
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1
      - name: Checkout pinned uncbv real TWIC corpus/backend
        uses: actions/checkout@v4
        with:
          repository: antoyo/uncbv
          ref: 3c18e8a7c6a30c21f945a1ab5462521c306dca57
          path: upstream/uncbv
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned libcbh
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2
      - name: Build Accessible Chess libcbh JSON bridge without bundling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge
      - name: Build pinned uncbv and record exact backend hash
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path upstream/uncbv/Cargo.toml
          test -x upstream/uncbv/target/release/uncbv
          uncbv_sha256="$(sha256sum upstream/uncbv/target/release/uncbv | cut -d' ' -f1)"
          echo "UNCBV_BINARY_SHA256=$uncbv_sha256" >> "$GITHUB_ENV"
      - name: Real TWIC CBV source to canonical Library date search and reopen
        shell: bash
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          UNCBV_BINARY: ${{ github.workspace }}/upstream/uncbv/target/release/uncbv
          UNCBV_FIXTURE: ${{ github.workspace }}/upstream/uncbv/tests/twic1134.cbv
        run: |
          set -o pipefail
          python -m unittest -v tests.test_v2_library_date_real_cbv 2>&1 | tee real-twic-date.log
      - name: Upload real-corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-library-date-real-twic-cbv
          path: product/real-twic-date.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Default source tree remains free of optional backend binaries
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test ! -e libcbh-json-bridge
          test ! -e libcbh.so
          test ! -e uncbv
          test -z "$(git status --porcelain --untracked-files=no)"
