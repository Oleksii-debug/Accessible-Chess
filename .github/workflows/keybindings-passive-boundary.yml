name: Keybindings Passive Boundary

on:
  pull_request:
    branches:
      - fix/current-board-moveview-exact-20261004-sol56m2
    paths:
      - 'acs/keybindings.py'
      - 'tests/test_keybindings_passive_boundary.py'
      - '.github/workflows/keybindings-passive-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keybindings-passive-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            base_ref="fix/current-settings-duplicate-json-20261004-sol56z4p7"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/keybindings-passive-boundary.yml' \
            'acs/keybindings.py' \
            'tests/test_keybindings_passive_boundary.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected keybindings passive-boundary scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile bounded keybinding surfaces
        run: >-
          python -m compileall -q
          acs/keybindings.py
          acs/move_entry.py
          tests/test_keybindings.py
          tests/test_keybindings_passive_boundary.py
          tests/test_move_entry.py

      - name: Execute keybinding and move-entry regressions
        run: >-
          python -m unittest -v
          tests.test_keybindings
          tests.test_keybindings_passive_boundary
          tests.test_move_entry

      - name: Core selftest
        run: python -m acs.selftest
