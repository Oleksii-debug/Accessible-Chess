name: Windows Stage 1 Strict Release - Cross Process

on:
  workflow_dispatch:
  push:
    branches:
      - qa/windows-current-integration-candidate-20260815
    paths:
      - '.github/workflows/windows-stage1-strict-release-crossprocess.yml'
      - 'tools/qa/stage1_packaged_e2e_crossprocess.ps1'
      - 'tools/qa/stage1_semantic_document_copy.ps1'
      - 'tools/qa/stage1_uia_topology_v5.ps1'
      - 'tools/qa/stage1_uia_topology_classify.py'
      - 'tools/qa/test_stage1_uia_topology_classify.py'

permissions:
  contents: read
  issues: write

concurrency:
  group: accessible-chess-stage1-webview-current
  cancel-in-progress: false

env:
  SOURCE_INTEGRATION_SHA: 1e8f0fcbe9bb6bbbe64ab960d2b5f11279109a72
  PYWEBVIEW_VERSION: '6.2.1'
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  STOCKFISH_VERSION: '18'
  CANDIDATE_FILE: Accessible-Chess-0.4-1e8f0fc-NVDA-test-candidate.zip

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout QA snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish strict Windows runner start
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'STRICT WINDOWS RELEASE START — CURRENT STAGE1 CROSS-PROCESS UIA',
              '',
              `QA SHA: \`${context.sha}\``,
              `Product SHA: \`${process.env.SOURCE_INTEGRATION_SHA}\``,
              `Workflow run: \`${context.runId}\``,
              `Run URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Fresh machine qualification only. HUMAN_TESTED=NO; NVDA_VERIFIED=NO.'
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 14, body});

      - name: Verify and materialize exact current Product
        shell: pwsh
        run: |
          git cat-file -e "$env:SOURCE_INTEGRATION_SHA^{commit}"
          if($LASTEXITCODE -ne 0){throw 'Exact integration SHA unavailable'}
          $resolved=(git rev-parse "$env:SOURCE_INTEGRATION_SHA^{commit}").Trim()
          if($resolved -ne $env:SOURCE_INTEGRATION_SHA){throw "SOURCE LOCK mismatch: $resolved"}
          git config core.autocrlf false
          git config core.eol lf
          Remove-Item work -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path work | Out-Null
          $paths=@('acs','web','tests','run_accessible_chess.py','ACCESSIBILITY_0.4_ARCHITECTURE.md','VERSION.txt','HOTKEYS_UA.txt','HOTKEYS_EN.txt')
          git archive --format=zip --output=product.zip $env:SOURCE_INTEGRATION_SHA -- $paths
          if($LASTEXITCODE -ne 0){throw 'Exact product export failed'}
          Expand-Archive product.zip work -Force
          $expected=(git ls-tree -r --name-only $env:SOURCE_INTEGRATION_SHA -- $paths)
          foreach($rel in $expected){if(-not (Test-Path (Join-Path work $rel))){throw "Missing frozen file: $rel"}}
          @'
          import os, subprocess
          from pathlib import Path
          sha=os.environ['SOURCE_INTEGRATION_SHA']
          exact_paths=(
              'acs/stage1_release_ui_core.py',
              'acs/webapp_keymap_core.py',
              '.github/workflows/publish-stage1-release.yml',
              '.github/workflows/windows-stage1-build.yml',
              '.github/workflows/windows-stage1-webview-build.yml',
          )
          root=Path('work')
          for rel in exact_paths:
              data=subprocess.check_output(['git','show',f'{sha}:{rel}'])
              target=root/rel
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(data)
          print('EXACT GIT-BLOB TEST FIXTURES MATERIALIZED')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Exact Git-blob fixture materialization failed'}
          "EXACT SOURCE LOCK PASS: $resolved"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse QA helpers and run current Product regressions
        shell: pwsh
        run: |
          foreach($helper in @('tools\qa\stage1_packaged_e2e_crossprocess.ps1','tools\qa\stage1_semantic_document_copy.ps1','tools\qa\stage1_uia_topology_v5.ps1')){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $helper),[ref]$tokens,[ref]$errors)|Out-Null
            if(@($errors).Count -gt 0){throw "$helper parser errors: $((@($errors|ForEach-Object {$_.Message}) -join ' | '))"}
          }
          python -m pip install --upgrade pip pytest
          python tools/qa/test_stage1_uia_topology_classify.py 2>&1 | Tee-Object -FilePath work/uia-topology-classifier-tests-strict.txt
          if($LASTEXITCODE -ne 0){throw 'Fail-closed UIA classifier regressions failed'}
          Push-Location work
          try {
            python -m compileall -q acs tests run_accessible_chess.py
            if($LASTEXITCODE -ne 0){throw 'compileall failed'}
            python -m unittest discover -s tests -v
            if($LASTEXITCODE -ne 0){throw 'full Stage1 unittest failed'}
            python -m pytest -q tests
            if($LASTEXITCODE -ne 0){throw 'full Stage1 pytest failed'}
            python run_accessible_chess.py --diagnostic
            if($LASTEXITCODE -ne 0){throw 'source diagnostic failed'}
          } finally { Pop-Location }

      - name: Build and validate real nine-WAV pack
        shell: pwsh
        working-directory: work
        run: |
          New-Item -ItemType Directory -Force -Path 'release-assets\assets\sounds'|Out-Null
          @'
          import json,math,struct,wave
          from pathlib import Path
          root=Path('release-assets/assets/sounds')
          events=['move','capture','check','castle','promotion','illegal','start','end','tick']
          freqs=[330,220,660,440,550,140,392,196,880]
          for name,f in zip(events,freqs):
              p=root/f'{name}.wav'; sr=22050; dur=0.12 if name=='tick' else 0.18
              frames=[]
              for i in range(int(sr*dur)):
                  env=max(0.0,1.0-i/(sr*dur)); frames.append(struct.pack('<h',int(9000*env*math.sin(2*math.pi*f*i/sr))))
              with wave.open(str(p),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr); w.writeframes(b''.join(frames))
          (root/'manifest.json').write_text(json.dumps({'schema_version':1,'files':{e:f'{e}.wav' for e in events}},ensure_ascii=False,indent=2),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 make_sounds.py
          python make_sounds.py
          python -c "from acs.sound_windows import PackagedSoundAssetResolver; from pathlib import Path; import wave; m=PackagedSoundAssetResolver(Path('release-assets')).load_manifest(); [wave.open(str(p),'rb').close() for p in m.files.values()]; assert len(m.files)==9; print('REAL NINE-WAV PACK PASS')"
          if($LASTEXITCODE -ne 0){throw 'WAV pack validation failed'}

      - name: Acquire official Stockfish 18 and complete corresponding source
        shell: pwsh
        working-directory: work
        run: |
          New-Item -ItemType Directory -Force -Path 'release-assets\engines\stockfish','release-assets\THIRD_PARTY\Stockfish'|Out-Null
          Invoke-WebRequest -Uri 'https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip' -OutFile stockfish18.zip
          Expand-Archive stockfish18.zip stockfish18 -Force
          $engine=Get-ChildItem stockfish18 -Recurse -Filter '*.exe'|Where-Object {$_.Name -match 'stockfish.*x86-64'}|Select-Object -First 1
          if(-not $engine){throw 'Official Stockfish 18 executable missing'}
          Copy-Item $engine.FullName 'release-assets\engines\stockfish\stockfish.exe' -Force
          Invoke-WebRequest -Uri 'https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_18.zip' -OutFile 'release-assets\THIRD_PARTY\Stockfish\Stockfish-18-source.zip'
          @"
          Stockfish 18 — GNU GPL v3. Upstream: official-stockfish/Stockfish tag sf_18.
          Complete corresponding source archive is included.
          "@|Set-Content -Encoding UTF8 'release-assets\THIRD_PARTY\Stockfish\NOTICE.txt'
          @'
          import pathlib,subprocess,time,re
          exe=pathlib.Path('release-assets/engines/stockfish/stockfish.exe').resolve()
          p=subprocess.Popen([str(exe)],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1)
          def send(s): p.stdin.write(s+'\n'); p.stdin.flush()
          def until(tok,limit=30):
              end=time.time()+limit; out=[]
              while time.time()<end:
                  line=p.stdout.readline()
                  if line:
                      out.append(line.strip())
                      if tok in line:return out
              raise RuntimeError((tok,out[-30:]))
          send('uci'); until('uciok'); send('isready'); until('readyok')
          send('setoption name MultiPV value 5'); send('position startpos moves e2e4'); send('go depth 8'); lines=until('bestmove')
          assert len({int(x.split()[x.split().index('multipv')+1]) for x in lines if x.startswith('info ') and 'multipv' in x.split()})>=5
          assert re.fullmatch(r'[a-h][1-8][a-h][1-8][qrbn]?', [x for x in lines if x.startswith('bestmove')][-1].split()[1])
          send('quit'); p.wait(timeout=5)
          print('STOCKFISH18 UCI MULTIPV5 PASS')
          '@|Set-Content -Encoding UTF8 stockfish_direct_smoke.py
          python stockfish_direct_smoke.py
          if($LASTEXITCODE -ne 0){throw 'Stockfish direct gate failed'}

      - name: Install pinned Windows runtime and patched Nuitka
        shell: pwsh
        working-directory: work
        run: |
          $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
          python -m pip install "pywebview==$env:PYWEBVIEW_VERSION" "Nuitka @ $nuitkaUrl" ordered-set zstandard
          if($LASTEXITCODE -ne 0){throw 'Pinned runtime/compiler install failed'}
          python -c "from pathlib import Path; import nuitka; p=Path(nuitka.__file__).parent/'plugins'/'standard'/'PywebViewPlugin.py'; assert 'webview.platforms.win32' in p.read_text(encoding='utf-8'); print('PATCHED PINNED NUITKA PASS')"

      - name: Native Windows menu structural gate
        shell: pwsh
        working-directory: work
        run: |
          @'
          import json,clr
          clr.AddReference('System.Windows.Forms')
          from System.Windows.Forms import Application,Form
          from acs.ui_native_menu import install_windows_native_menu,native_menu_attachment_state
          class API:
              lang='en'
              def keymap_search(self,*a): return []
              def new_game(self): return {'ok':True}
              def clear_board(self): return {'ok':True}
              def undo(self): return {'ok':True}
              def redo(self): return {'ok':True}
              def review_previous(self): return {'ok':True}
              def review_next(self): return {'ok':True}
              def toggle_engine(self): return {'ok':True}
              def keymap_reset_all(self): return {'ok':True}
          class FakeWindow:
              def __init__(self,form): self.native=form
              def evaluate_js(self,*a,**k): return None
              def destroy(self): return None
          Application.EnableVisualStyles(); Application.SetCompatibleTextRenderingDefault(False)
          form=Form(); form.Name='AccessibleChessStructuralHost'; fake=FakeWindow(form); menu=None
          try:
              ok=install_windows_native_menu(fake,API()); menu=getattr(fake,'_accessible_chess_native_menu',None)
              r=dict(native_menu_attachment_state(fake)); r.update(installed=bool(ok),menu_name=str(getattr(menu,'Name','')) if menu is not None else '',accessible_role=str(getattr(menu,'AccessibleRole','')) if menu is not None else '',commands=[str(x.Text).replace('&','') for x in list(menu.Items)] if menu is not None else [])
              open('native-menu-self-diagnostic.json','w',encoding='utf-8').write(json.dumps(r,ensure_ascii=False,indent=2))
              assert r['installed'] and r['host_exists'] and r['menu_exists'] and r['host_top_level'] and r['parent_is_host'] and r['main_menu_strip_is_menu'],r
              assert r['menu_name']=='AccessibleChessMainMenu' and r['accessible_role'].endswith('MenuBar'),r
              assert r['commands']==['File','Game','Board','Analysis','Settings','Help'],r
          finally:
              if menu is not None: menu.Dispose()
              form.Dispose()
          print('NATIVE WINDOWS MENU STRUCTURAL PASS')
          '@|Set-Content -Encoding UTF8 native_menu_self_diag.py
          python native_menu_self_diag.py
          if($LASTEXITCODE -ne 0){throw 'Native menu structural gate failed'}

      - name: Build standalone AccessibleChess.exe
        shell: pwsh
        working-directory: work
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --windows-console-mode=disable --output-filename=AccessibleChess.exe --include-data-dir=web=web --include-data-dir=release-assets\assets=assets --include-data-dir=release-assets\engines=engines --report=nuitka-compilation-report.xml run_accessible_chess.py
          if($LASTEXITCODE -ne 0){throw 'Nuitka standalone compile failed'}
          $exe=Get-ChildItem -Recurse -Filter AccessibleChess.exe|Where-Object {$_.FullName -match 'dist'}|Select-Object -First 1
          if(-not $exe){throw 'AccessibleChess.exe missing'}
          $stockfishTarget=Join-Path $exe.Directory.FullName 'engines\stockfish\stockfish.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $stockfishTarget -Parent)|Out-Null
          Copy-Item 'release-assets\engines\stockfish\stockfish.exe' $stockfishTarget -Force
          $exe.FullName|Set-Content -Encoding UTF8 built_exe_path.txt
          "STANDALONE BUILD PASS: $($exe.FullName)"

      - name: Built EXE diagnostic and WebView2 startup
        shell: pwsh
        working-directory: work
        run: |
          $exe=(Get-Content built_exe_path.txt -Raw).Trim()
          $d=Start-Process $exe -ArgumentList '--diagnostic' -PassThru -Wait
          if($d.ExitCode -ne 0){throw "Built EXE diagnostic failed: $($d.ExitCode)"}
          $p=Start-Process $exe -PassThru
          Start-Sleep -Seconds 18
          if($p.HasExited){throw "GUI exited during WebView2 startup: $($p.ExitCode)"}
          $p.Id|Set-Content gui_pid.txt

      - name: Strict packaged Stage1 interaction and semantic document copy
        shell: pwsh
        working-directory: work
        run: |
          $appPid=[int](Get-Content gui_pid.txt -Raw)
          & ..\tools\qa\stage1_packaged_e2e_crossprocess.ps1 -AppPid $appPid -ProductRoot .
          if($LASTEXITCODE -ne 0){throw 'Packaged cross-process UIA/E2E gate failed'}
          if(-not (Test-Path packaged-uia-strict-summary.json)){throw 'Packaged UIA strict summary missing'}
          & ..\tools\qa\stage1_semantic_document_copy.ps1 -AppPid $appPid -ReportPath uia-topology-strict.json -SummaryPath packaged-uia-strict-summary.json
          if($LASTEXITCODE -ne 0){throw 'Packaged semantic document copy gate failed'}
          $s=Get-Content packaged-uia-strict-summary.json -Raw|ConvertFrom-Json
          if(-not [bool]$s.semantic_document_copy -or -not [bool]$s.semantic_document_copy_outside_edit -or [string]$s.semantic_document_clipboard -ne 'Accessible Chess'){throw 'Semantic document evidence incomplete'}

      - name: Packaged sound and Stockfish lifecycle
        shell: pwsh
        working-directory: work
        run: |
          $dist=Get-ChildItem -Directory -Filter '*.dist'|Select-Object -First 1
          if(-not $dist){throw 'Distribution directory missing'}
          python -c "from acs.sound_windows import PackagedSoundAssetResolver,WindowsSoundPlaybackAdapter; from acs.sound_runtime import SoundRuntime,GameSoundRuntime,SoundRuntimeSettings; from acs.sound_events import MoveSoundFacts; from pathlib import Path; import tempfile; app=Path(r'$($dist.FullName)'); rt=GameSoundRuntime(SoundRuntime(WindowsSoundPlaybackAdapter(PackagedSoundAssetResolver(app),cache_dir=Path(tempfile.gettempdir())/'acs-sound-strict'),settings=SoundRuntimeSettings(volume=100))); assert all(r.ok for r in [rt.start(),rt.move(MoveSoundFacts()),rt.illegal(),rt.tick(),rt.end()]); print('PACKAGED WAV PASS')"
          if($LASTEXITCODE -ne 0){throw 'Packaged sound playback failed'}
          @'
          import pathlib,sys
          from acs.stockfish_runtime import StockfishRuntime,StockfishRuntimeConfig
          app=pathlib.Path(sys.argv[1]).resolve(); rt=StockfishRuntime(StockfishRuntimeConfig(application_dir=app)); e=rt.provider()
          fen='rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1'
          assert len(e.analyze(fen,multipv=5,depth=7))>=5; assert e.best_move(fen,skill_level=8,movetime_ms=150); rt.close(); print('PACKAGED STOCKFISH LIFECYCLE PASS')
          '@|Set-Content -Encoding UTF8 packaged_stockfish_smoke.py
          python packaged_stockfish_smoke.py "$($dist.FullName)"
          if($LASTEXITCODE -ne 0){throw 'Packaged Stockfish lifecycle failed'}
          Start-Sleep -Seconds 1
          if(@(Get-Process stockfish* -ErrorAction SilentlyContinue).Count -gt 0){throw 'Orphan Stockfish remains'}

      - name: Assemble canonical package and run current release preflight
        shell: pwsh
        working-directory: work
        run: |
          $dist=Get-ChildItem -Directory -Filter '*.dist'|Select-Object -First 1
          if(-not $dist){throw 'Distribution directory missing'}
          $raw=Get-ChildItem $dist.FullName -Recurse -File -Filter '*.py'|Where-Object {$_.FullName -match '\\acs\\' -or $_.Name -eq 'run_accessible_chess.py'}
          if($raw){throw "Raw Product source leaked: $($raw.FullName -join ', ')"}
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path 'package\AccessibleChess','package\THIRD_PARTY_NOTICES'|Out-Null
          Copy-Item "$($dist.FullName)\*" 'package\AccessibleChess\' -Recurse -Force
          Copy-Item 'release-assets\THIRD_PARTY\Stockfish\*' 'package\THIRD_PARTY_NOTICES\' -Recurse -Force
          Copy-Item native-menu-self-diagnostic.json package\ -Force
          Copy-Item packaged-uia-strict-summary.json package\ -Force
          @"
          Accessible Chess third-party notices
          pywebview $env:PYWEBVIEW_VERSION — BSD-3-Clause runtime dependency.
          Nuitka commit $env:NUITKA_UPSTREAM_FIX_COMMIT — build compiler.
          Stockfish $env:STOCKFISH_VERSION — GPLv3; complete corresponding source included.
          "@|Set-Content -Encoding UTF8 'package\THIRD_PARTY_NOTICES\README.txt'
          $manifest=[ordered]@{product='Accessible Chess';label='NVDA TEST CANDIDATE — WAITING FOR USER TEST';integration_sha=$env:SOURCE_INTEGRATION_SHA;qa_commit=(git -C .. rev-parse HEAD).Trim();python='3.12';pywebview=$env:PYWEBVIEW_VERSION;nuitka_upstream_fix_commit=$env:NUITKA_UPSTREAM_FIX_COMMIT;stockfish='18';nvda_verified=$false;strict_cross_process_uia='PASS';packaged_e4_e9_clipboard_board_focus='PASS';packaged_semantic_document_copy='PASS';packaged_sound='PASS';stockfish_runtime_lifecycle='PASS';native_menu_automated_self_diagnostic='PASS';native_menu_alt_arrows_enter_esc='HUMAN-ONLY UNPROVEN';nvda_menu_usability='HUMAN-ONLY UNPROVEN'}
          $manifest|ConvertTo-Json -Depth 6|Set-Content -Encoding UTF8 'package\RELEASE_MANIFEST.json'
          $root=(Resolve-Path package).Path
          Get-ChildItem package -Recurse -File|Where-Object {$_.Name -ne 'SHA256SUMS.txt'}|Get-FileHash -Algorithm SHA256|ForEach-Object {"$($_.Hash.ToLowerInvariant())  $($_.Path.Substring($root.Length+1))"}|Set-Content -Encoding UTF8 'package\SHA256SUMS.txt'
          python -m acs.release_preflight package --json | Tee-Object -FilePath release-preflight-assembled.json
          if($LASTEXITCODE -ne 0){throw 'Current Product release_preflight failed on assembled package'}
          $zip=Join-Path (Get-Location) $env:CANDIDATE_FILE
          if(Test-Path $zip){Remove-Item $zip -Force}
          Compress-Archive 'package\*' $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()|Set-Content -Encoding UTF8 candidate-zip.sha256

      - name: Fresh-extract candidate, verify checksums and rerun release preflight
        shell: pwsh
        working-directory: work
        run: |
          $zip=Join-Path (Get-Location) $env:CANDIDATE_FILE
          if(-not (Test-Path $zip)){throw 'Fresh candidate ZIP missing'}
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $declared=(Get-Content candidate-zip.sha256 -Raw).Trim().ToLowerInvariant()
          if($actual -ne $declared){throw 'Candidate ZIP hash mismatch'}
          Remove-Item inspect -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip inspect -Force
          $m=Get-Content inspect\RELEASE_MANIFEST.json -Raw|ConvertFrom-Json
          if([string]$m.integration_sha -ne $env:SOURCE_INTEGRATION_SHA -or [bool]$m.nvda_verified){throw 'Fresh manifest identity/NVDA claim invalid'}
          if([string]$m.packaged_semantic_document_copy -ne 'PASS'){throw 'Fresh manifest semantic copy gate missing'}
          foreach($line in (Get-Content inspect\SHA256SUMS.txt)){
            if($line -notmatch '^([0-9a-fA-F]{64})  (.+)$'){throw "Malformed SHA256SUMS line: $line"}
            $expected=$matches[1].ToLowerInvariant(); $path=Join-Path inspect $matches[2]
            if(-not (Test-Path $path) -or (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected){throw "Checksum mismatch: $($matches[2])"}
          }
          python -m acs.release_preflight inspect --json | Tee-Object -FilePath release-preflight-fresh.json
          if($LASTEXITCODE -ne 0){throw 'Current Product release_preflight failed on fresh extraction'}
          $inspection=[ordered]@{candidate=$env:CANDIDATE_FILE;sha256=$actual;integration_sha=$env:SOURCE_INTEGRATION_SHA;packaged_semantic_document_copy='PASS';release_preflight_assembled='PASS';release_preflight_fresh='PASS';nvda_verified=$false;result='PASS'}
          $inspection|ConvertTo-Json -Depth 5|Set-Content -Encoding UTF8 package-inspection.json
          "FRESH EXACT CANDIDATE PASS SHA256=$actual"

      - name: Upload fresh NVDA test candidate
        uses: actions/upload-artifact@v4
        with:
          name: Accessible-Chess-0.4-1e8f0fc-NVDA-test-candidate
          path: |
            work/Accessible-Chess-0.4-1e8f0fc-NVDA-test-candidate.zip
            work/candidate-zip.sha256
            work/native-menu-self-diagnostic.json
            work/packaged-uia-strict-summary.json
            work/package-inspection.json
            work/release-preflight-assembled.json
            work/release-preflight-fresh.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain strict diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-strict-windows-current-crossprocess-evidence
          path: |
            work/uia-topology-classifier-tests-strict.txt
            work/uia-topology-strict.json
            work/uia-topology-strict-raw.json
            work/packaged-uia-strict-summary.json
            work/native-menu-self-diagnostic.json
            work/package-inspection.json
            work/release-preflight-assembled.json
            work/release-preflight-fresh.json
            work/nuitka-compilation-report.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup packaged processes
        if: always()
        shell: pwsh
        working-directory: work
        run: |
          if(Test-Path gui_pid.txt){$appPid=[int](Get-Content gui_pid.txt -Raw); Stop-Process -Id $appPid -Force -ErrorAction SilentlyContinue}
          Get-Process stockfish* -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
