name: EPUB Application Reachability

on:
  pull_request:
    branches:
      - fix/book-progress-backup-recovery-20260927
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_application.py'
      - 'acs/version2_windows_native_dialog_ownership.py'
      - 'tests/test_v2_native_dialog_language.py'
      - 'tests/test_version2_epub_application_reachability.py'
      - '.github/workflows/epub-application-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epub-application-reachability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact integration topology and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          stacked_branch='fix/book-progress-backup-recovery-20260927'
          product_branch='work/full-product-teacher-education-reachability-20260911'
          minimum_recovery_owner='b7a012bce36d4049779112d122fe40504f35aa46'
          base_ref='${{ github.event.pull_request.base.ref || '' }}'

          case "$base_ref" in
            "$stacked_branch")
              git fetch --no-tags origin "+refs/heads/$stacked_branch:refs/remotes/origin/$stacked_branch"
              upstream="$(git rev-parse "refs/remotes/origin/$stacked_branch")"
              mode='STACKED_RECOVERY_PARENT'
              ;;
            "$product_branch")
              git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
              upstream="$(git rev-parse "refs/remotes/origin/$product_branch")"
              git merge-base --is-ancestor "$minimum_recovery_owner" "$upstream"
              mode='CURRENT_FULL_PRODUCT'
              ;;
            "")
              # workflow_dispatch has no pull_request.base.ref. Select only an
              # explicit current authority that is already in this exact head.
              git fetch --no-tags origin \
                "+refs/heads/$stacked_branch:refs/remotes/origin/$stacked_branch" \
                "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
              stacked="$(git rev-parse "refs/remotes/origin/$stacked_branch")"
              product="$(git rev-parse "refs/remotes/origin/$product_branch")"
              if git merge-base --is-ancestor "$stacked" HEAD; then
                upstream="$stacked"
                mode='STACKED_RECOVERY_PARENT_DISPATCH'
              elif git merge-base --is-ancestor "$product" HEAD \
                   && git merge-base --is-ancestor "$minimum_recovery_owner" "$product"; then
                upstream="$product"
                mode='CURRENT_FULL_PRODUCT_DISPATCH'
              else
                echo "dispatch head is not based on an allowed current EPUB authority" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported EPUB reachability base: $base_ref" >&2
              exit 1
              ;;
          esac

          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD
          echo "EPUB_REACHABILITY_TOPOLOGY=$mode"
          echo "EPUB_REACHABILITY_UPSTREAM=$upstream"

          mapfile -t actual < <(git diff --name-only "$upstream" HEAD | LC_ALL=C sort)
          expected_paths=(
            '.github/workflows/epub-application-reachability.yml'
            'acs/version2_application.py'
            'acs/version2_windows_native_dialog_ownership.py'
            'tests/test_v2_native_dialog_language.py'
            'tests/test_version2_epub_application_reachability.py'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)
          test "${actual[*]}" = "${wanted[*]}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/version2_application.py
          acs/version2_windows_native_dialog_ownership.py
          tests/test_v2_native_dialog_language.py
          tests/test_version2_epub_application_reachability.py

      - name: Run EPUB reachability and adjacent semantic regressions
        run: >-
          python -m unittest -v
          tests.test_version2_epub_application_reachability
          tests.test_v2_book_epub_import
          tests.test_v2_native_dialog_language
          tests.test_version2_application
          tests.test_bookreader
          tests.test_bookdocument
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
