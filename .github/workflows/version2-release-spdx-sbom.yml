name: V2 Release SPDX SBOM

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_release_sbom.py'
      - 'scripts/write_version2_release_sbom.py'
      - 'tests/test_version2_release_sbom.py'
      - '.github/workflows/version2-release-spdx-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-release-spdx-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile SBOM source and release entrypoint
        run: python -m py_compile acs/version2_release_sbom.py scripts/write_version2_release_sbom.py
      - name: Run deterministic SPDX SBOM contract
        run: python -m unittest -v tests.test_version2_release_sbom
