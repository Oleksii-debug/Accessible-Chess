name: Classroom Durable Chat Outbox

on:
  pull_request:
    branches:
      - converge/windows-dpapi-secret-store-collaboration-20261003
    paths:
      - "acs/classroom_collaboration_outbox.py"
      - "acs/classroom_collaboration_runtime.py"
      - "tests/test_classroom_collaboration_outbox.py"
      - ".github/workflows/classroom-durable-chat-outbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-durable-chat-outbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate identity
        if: github.event_name == 'pull_request'
        shell: python
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess

          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_SHA"]
          if actual != expected:
              raise SystemExit(f"checked out {actual}, expected pull-request head {expected}")

      - name: Prove durable-outbox-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          merge_base="$(git merge-base "$base" HEAD)"
          changed="$(git diff --name-only "$merge_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/classroom-durable-chat-outbox.yml' \
            'acs/classroom_collaboration_outbox.py' \
            'acs/classroom_collaboration_runtime.py' \
            'tests/test_classroom_collaboration_outbox.py' | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected durable chat outbox PR scope:\n%s\n' "$changed" >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Compile durable outbox boundary
        run: >-
          python -m py_compile
          acs/classroom_collaboration_outbox.py
          acs/classroom_collaboration_runtime.py
          tests/test_classroom_collaboration_outbox.py

      - name: Run durable outbox and secret-store contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_collaboration_outbox
          tests.test_secret_store

      - name: Run current collaboration runtime regression
        run: python -m unittest -v tests.test_classroom_collaboration_runtime
