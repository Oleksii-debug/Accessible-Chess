name: Section 15 Visual Board Contract

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - '.github/workflows/section15-visual-board-contract.yml'
      - 'acs/visual_board_contract.py'
      - 'acs/webapp.py'
      - 'acs/teacher_webview_projection.py'
      - 'tests/test_section15_visual_board_contract.py'
      - 'web/index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section15-visual-board-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact candidate and bounded Section 15 scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            live_base="$(git rev-parse HEAD^)"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/section15-visual-board-contract.yml' \
            'acs/teacher_webview_projection.py' \
            'acs/visual_board_contract.py' \
            'acs/webapp.py' \
            'tests/test_section15_visual_board_contract.py' \
            'web/index.html' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Section 15 scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Section 15 boundary
        run: >-
          python -m py_compile
          acs/visual_board_contract.py
          acs/webapp.py
          acs/teacher_webview_projection.py
          tests/test_section15_visual_board_contract.py

      - name: Execute Section 15 contract and WebUI integration
        run: >-
          python -m unittest -v
          tests.test_section15_visual_board_contract
          tests.test_accessible_webui

      - name: Execute retained keyboard and accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_stage1_board_action_integration
          tests.test_v2_remapped_keyboard_routing
          tests.test_v2_board_analysis_hotkey_feedback
          tests.test_version2_accessibility_convergence

      - name: Execute retained board DOM contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/js/stage1_board_rerender_keymap_integration_test.js
          node --check tests/js/owner_gameplay_keyboard_test.js
          node --check tests/js/v2_remapped_keyboard_native_editing_test.js
          node tests/js/stage1_board_rerender_keymap_integration_test.js
          node tests/js/owner_gameplay_keyboard_test.js
          node tests/js/v2_remapped_keyboard_native_editing_test.js

      - name: Core selftest
        run: python -m acs.selftest
