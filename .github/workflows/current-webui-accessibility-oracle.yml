name: Current WebUI Accessibility Oracle

on:
  pull_request:
    paths:
      - 'tests/test_accessible_webui.py'
      - '.github/workflows/current-webui-accessibility-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-webui-accessibility-oracle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            git cat-file -e "$EVENT_BASE_SHA^{commit}"
            git merge-base --is-ancestor "$EVENT_BASE_SHA" "$live_base"
            absorbed_base="$(git merge-base "$live_base" HEAD)"
            git merge-base --is-ancestor "$EVENT_BASE_SHA" "$absorbed_base"
          else
            live_base="$(git rev-parse HEAD^)"
            absorbed_base="$live_base"
          fi

          git merge-base --is-ancestor "$absorbed_base" "$live_base"
          git merge-base --is-ancestor "$absorbed_base" HEAD
          git diff --check "$absorbed_base"...HEAD

          if [ -n "${EVENT_BASE_REF:-}" ] && [ "$EVENT_BASE_REF" = "$DEFAULT_BRANCH" ]; then
            # Whole-Product integration intentionally contains the complete
            # accumulated Product delta. Keep exact checkout/ancestry/diff
            # validation, then run the oracle regressions without pretending the
            # full main integration must equal this historical two-path slice.
            echo 'CURRENT_WEBUI_SCOPE_MODE=DEFAULT_BRANCH_INTEGRATION'
          else
            changed="$(git diff --name-only "$absorbed_base"...HEAD | sort)"
            oracle_paths="$(printf '%s\n' \
              '.github/workflows/current-webui-accessibility-oracle.yml' \
              'tests/test_accessible_webui.py' | sort)"
            ui_transaction_paths="$(printf '%s\n' \
              '.github/workflows/current-product-accessibility-formats-convergence.yml' \
              '.github/workflows/current-webui-accessibility-oracle.yml' \
              '.github/workflows/d01-pgn-workspace-webview.yml' \
              '.github/workflows/keybindings-current-apex-dom-native.yml' \
              'tests/js/keymap_recovery_accessibility_test.js' \
              'tests/js/owner_gameplay_keyboard_test.js' \
              'tests/test_accessible_webui.py' \
              'web/index.html' | sort)"
            if [ "$changed" = "$oracle_paths" ]; then
              echo 'CURRENT_WEBUI_SCOPE_MODE=STACKED_ORACLE_EXACT'
            elif [ "$changed" = "$ui_transaction_paths" ]; then
              echo 'CURRENT_WEBUI_SCOPE_MODE=STACKED_UI_TRANSACTION_EXACT'
            else
              printf 'Unexpected WebUI-oracle scope:\n%s\n' "$changed" >&2
              exit 1
            fi
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile oracle and current accessibility boundaries
        run: >-
          python -m py_compile
          tests/test_accessible_webui.py
          tests/test_stage1_board_action_integration.py
          tests/test_v2_remapped_keyboard_routing.py
          tests/test_nvda_p0_contract.py

      - name: Execute current WebUI accessibility oracle
        run: python -m unittest -v tests.test_accessible_webui

      - name: Execute adjacent keyboard and NVDA machine contracts
        run: >-
          python -m unittest -v
          tests.test_stage1_board_action_integration
          tests.test_v2_remapped_keyboard_routing
          tests.test_nvda_p0_contract
          tests.test_version2_accessibility_convergence

      - name: Execute current DOM keymap contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/js/stage1_terminal_keymap_dom_test.js
          node --check tests/js/stage1_board_rerender_keymap_integration_test.js
          node --check tests/js/v2_remapped_keyboard_native_editing_test.js
          node tests/js/stage1_terminal_keymap_dom_test.js
          node tests/js/stage1_board_rerender_keymap_integration_test.js
          node tests/js/v2_remapped_keyboard_native_editing_test.js

      - name: Core selftest
        run: python -m acs.selftest
