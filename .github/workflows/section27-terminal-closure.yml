name: Section 27 Terminal Closure

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'docs/automation/SECTION27_TERMINAL_CLOSURE.md'
      - '.github/workflows/section27-terminal-closure.yml'
      - 'acs/teaching_session.py'
      - 'acs/teaching_reverse_channel.py'
      - 'acs/teaching_classroom_adapter.py'
      - 'tests/test_teaching_session.py'
      - 'tests/test_teaching_reverse_channel.py'
      - 'tests/test_teaching_classroom_adapter.py'
      - 'tests/test_teaching_classroom_floor_control.py'
      - 'tests/test_teaching_visual_board.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section27:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TEACHING_SESSION_BLOB: a0f74111dc5e8c0edc74cfc6b85a677d8dfa3bfc
      REVERSE_CHANNEL_BLOB: f3f66b65f9aad8358832e5cb441842403116f166
      CLASSROOM_ADAPTER_BLOB: 39fd13f6bf9b9537e3a5127b9022f759eea7eb62
      TEACHING_SESSION_TEST_BLOB: 1bf5ad15f80530ca1118b1b040a5889f686aa1a2
      REVERSE_CHANNEL_TEST_BLOB: 41ba6dfb2e9542b4bceaa0dd6e26e21206649354
      CLASSROOM_ADAPTER_TEST_BLOB: 0a7c074601c23c28f7bf241687581dd05d452f99
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove frozen Section 27 authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object acs/teaching_session.py)" = "$TEACHING_SESSION_BLOB"
          test "$(git hash-object acs/teaching_reverse_channel.py)" = "$REVERSE_CHANNEL_BLOB"
          test "$(git hash-object acs/teaching_classroom_adapter.py)" = "$CLASSROOM_ADAPTER_BLOB"
          test "$(git hash-object tests/test_teaching_session.py)" = "$TEACHING_SESSION_TEST_BLOB"
          test "$(git hash-object tests/test_teaching_reverse_channel.py)" = "$REVERSE_CHANNEL_TEST_BLOB"
          test "$(git hash-object tests/test_teaching_classroom_adapter.py)" = "$CLASSROOM_ADAPTER_TEST_BLOB"
          git diff --check

      - name: Compile Section 27 boundary
        run: >-
          python -m py_compile
          acs/teaching_session.py
          acs/teaching_reverse_channel.py
          acs/teaching_classroom_adapter.py
          tests/test_teaching_session.py
          tests/test_teaching_reverse_channel.py
          tests/test_teaching_classroom_adapter.py
          tests/test_teaching_classroom_floor_control.py
          tests/test_teaching_visual_board.py

      - name: Run Section 27 focused regressions
        run: >-
          python -m unittest -v
          tests.test_teaching_session
          tests.test_teaching_reverse_channel
          tests.test_teaching_classroom_adapter
          tests.test_teaching_classroom_floor_control
          tests.test_teaching_visual_board

      - name: Core selftest
        run: python -m acs.selftest
