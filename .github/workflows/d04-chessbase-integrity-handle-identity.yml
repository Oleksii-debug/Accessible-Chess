name: D04 ChessBase Integrity Current Convergence

on:
  push:
    branches:
      - work/d04-classic-chessbase-handle-identity-20260907
  pull_request:
    paths:
      - '.github/workflows/d04-chessbase-integrity-handle-identity.yml'
      - 'acs/chessbase_integrity.py'
      - 'tests/test_d04_chessbase_integrity_handle_identity.py'
      - 'tests/test_dev4_chessbase_integrity_atomicity.py'
      - 'tests/test_dev4_chessbase_integrity_io_observability.py'

permissions:
  contents: read

concurrency:
  group: d04-chessbase-integrity-current-${{ github.ref }}
  cancel-in-progress: true

env:
  D04_CURRENT_BASE: c2a080712ab76bd318dc6a6c3037db464ab67857
  INTEGRITY_BLOB: c08f0869f996d4ec428a90c64e9846374a720562
  IMPORT_CONTRACT_BLOB: a072d0ee5c54c303e2af0112f83225282bcb0e1c

jobs:
  current-integrity-convergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current authority and bounded convergence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$D04_CURRENT_BASE")" = "$D04_CURRENT_BASE"
          git diff --check "$D04_CURRENT_BASE" HEAD
          changed="$(git diff --name-only "$D04_CURRENT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d04-chessbase-integrity-handle-identity.yml' \
            'acs/chessbase_integrity.py' \
            'tests/test_d04_chessbase_integrity_handle_identity.py' \
            'tests/test_dev4_chessbase_integrity_atomicity.py' \
            'tests/test_dev4_chessbase_integrity_io_observability.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/chessbase_integrity.py)" = "$INTEGRITY_BLOB"
          test "$(git rev-parse HEAD:acs/import_contract.py)" = "$IMPORT_CONTRACT_BLOB"

      - name: Compile integrity boundary and oracles
        run: >-
          python -m py_compile
          acs/chessbase_integrity.py
          acs/import_contract.py
          tests/test_d04_chessbase_integrity_handle_identity.py
          tests/test_dev4_chessbase_integrity_atomicity.py
          tests/test_dev4_chessbase_integrity_io_observability.py

      - name: Focused integrity regressions
        run: >-
          python -m unittest -v
          tests.test_d04_chessbase_integrity_handle_identity
          tests.test_dev4_chessbase_integrity_atomicity
          tests.test_dev4_chessbase_integrity_io_observability
          tests.test_chessbase_integrity
          tests.test_import_contract

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_d04_chessbase_integrity_handle_identity.py
          tests/test_dev4_chessbase_integrity_atomicity.py
          tests/test_dev4_chessbase_integrity_io_observability.py
          tests/test_chessbase_integrity.py
          tests/test_import_contract.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
