name: OIDC ID Token Trust Contract

on:
  pull_request:
    paths:
      - 'acs/oidc_id_token.py'
      - 'tests/test_oidc_id_token.py'
      - '.github/workflows/oidc-id-token-trust.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oidc-id-token-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove isolated post-signature trust scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/oidc-id-token-trust.yml' 'acs/oidc_id_token.py' 'tests/test_oidc_id_token.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected OIDC ID-token trust scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Compile trust boundary and tests
        run: python -m compileall -q acs/oidc_id_token.py tests/test_oidc_id_token.py

      - name: Execute OIDC ID-token trust tests
        run: python -m unittest -v tests.test_oidc_id_token

      - name: Core selftest
        run: python -m acs.selftest
