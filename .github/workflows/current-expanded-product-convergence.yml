name: Current Expanded Product Convergence

on:
  pull_request:
    branches:
      - integrate/current-product-to-shipping-20261005-sol56f8k2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-expanded-product-convergence-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'CURRENT_EXPANDED_PRODUCT_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }

      - name: Prove source ancestry and bounded product scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SERIAL_REF: converge/current-cbf-cbi-manifest-pair-20261005-ooxple7
          SERIAL_HEAD: d4e864d0f5c3fcddf902b17e5b91313401a96865
          BOOKS_REF: fix/book-provider-gametree-resource-bounds-20261005-sol56
          BOOKS_HEAD: a61a9c44572571f8d2364d9329107e1f42fc9b40
          PROFILE_REF: fix/local-profile-deep-json-20261005-sol56d8q4
          PROFILE_HEAD: e8b8757ec0c648e22c509115684b887ee42d02f6
          EVENT_REF: fix/p0g-keymap-event-identity-20261005-7f3a9c
          EVENT_HEAD: ad747245b879027ff116c7f6159e2f9b6911333f
          BOOKS_MERGE: 3c3102d810635107f5116926eace15cd055f932f
          PROFILE_MERGE: e90d3735912a3a86f33b1175adcc2d76dfe3011d
          EVENT_MERGE: 211d985c3f0c780516d76ff13e650b521183e2f7
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$EVENT_BASE_REF" = "integrate/current-product-to-shipping-20261005-sol56f8k2"
          fi

          for pair in             "$SERIAL_REF:$SERIAL_HEAD"             "$BOOKS_REF:$BOOKS_HEAD"             "$PROFILE_REF:$PROFILE_HEAD"             "$EVENT_REF:$EVENT_HEAD"
          do
            ref="${pair%%:*}"
            expected="${pair#*:}"
            git fetch --no-tags origin "refs/heads/$ref"
            live="$(git rev-parse FETCH_HEAD)"
            test "$live" = "$expected" || {
              printf 'CURRENT_EXPANDED_SOURCE_MOVED ref=%s expected=%s live=%s\n' "$ref" "$expected" "$live" >&2
              exit 1
            }
            git merge-base --is-ancestor "$expected" HEAD
          done

          test "$(git show -s --format=%P "$BOOKS_MERGE")" = "$SERIAL_HEAD $BOOKS_HEAD"
          test "$(git show -s --format=%P "$PROFILE_MERGE")" = "$BOOKS_MERGE $PROFILE_HEAD"
          test "$(git show -s --format=%P "$EVENT_MERGE")" = "$PROFILE_MERGE $EVENT_HEAD"
          git merge-base --is-ancestor "$EVENT_MERGE" HEAD
          git diff --check "$SERIAL_HEAD"...HEAD

          changed="$(git diff --name-only "$SERIAL_HEAD"...HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/book-variation-fen-equivalence.yml'             '.github/workflows/bookdocument-constructor-semantic-integrity.yml'             '.github/workflows/current-expanded-product-convergence.yml'             '.github/workflows/local-profile-current-apex.yml'             'acs/book_epub_import.py'             'acs/book_game_content.py'             'acs/book_html_import.py'             'acs/book_text_import.py'             'acs/bookdocument.py'             'acs/local_profile.py'             'tests/js/p0g_event_aware_announcement_test.js'             'tests/test_book_lookup_detached_canonicalization.py'             'tests/test_bookdocument.py'             'tests/test_local_profile_path_identity.py'             'tests/test_local_profile_recursion_boundary.py'             'tests/test_v2_book_epub_import.py'             'tests/test_v2_book_html_import.py'             'tests/test_v2_book_text_import.py'             'web/index.html' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected expanded Product scope:\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/book_game_content.py)" = '9bc1594f1f5141dfa843f54755e670f392ba926d'
          test "$(git rev-parse HEAD:acs/chessbase_manifest.py)" = '7a91103062b76b541d370ec3a3247974d5cd0b80'
          test "$(git rev-parse HEAD:acs/local_profile.py)" = '96d9b523a93a18eb4cc473ef0c87abee49d84512'
          test "$(git rev-parse HEAD:web/index.html)" = '04be6318d22acc83520dad17ecba53bac0c6029e'
          test "$(git rev-parse HEAD:tests/js/p0g_event_aware_announcement_test.js)" = '683860d4b321bd6cd9f14043a4d931749ede942f'
          test "$(git rev-parse HEAD:packaging/portable_launcher.c)" = '8089546cbc73cb35e3e8e50a4f28e7c9f175d15c'
          echo 'CURRENT_EXPANDED_PRODUCT_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged product surfaces
        run: >-
          python -m compileall -q
          acs/book_game_content.py
          acs/bookdocument.py
          acs/book_text_import.py
          acs/book_html_import.py
          acs/book_epub_import.py
          acs/full_product_presenters.py
          acs/pgn_presenter_graph_guard.py
          acs/version2_gametree_resume.py
          acs/chessbase_manifest.py
          acs/local_profile.py

      - name: Execute semantic malformed-content recovery and format regressions
        run: >-
          python -m unittest -v
          tests.test_notation
          tests.test_pgn_presenter_graph_safety_current
          tests.test_dev1_pgn_webview_projection
          tests.test_d06_v2_gametree_resume_discard_guard
          tests.test_v2_upgrade_sound_artifact_control
          tests.test_book_lookup_detached_canonicalization
          tests.test_bookdocument
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import
          tests.test_chessbase_manifest_legacy_cbf_pair
          tests.test_portable_launcher_contract
          tests.test_local_profile_path_identity
          tests.test_local_profile_recursion_boundary

      - name: Execute keymap event-identity regression
        run: node tests/js/p0g_event_aware_announcement_test.js

      - name: Execute whole-product core smoke
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
