name: W6 V2 Review Engine Retry Isolation Evidence

on:
  push:
    branches:
      - work/w6-v2-review-engine-retry-isolation-evidence-20260907
  pull_request:
    paths:
      - tests/test_w6_v2_review_engine_retry_isolation.py
      - .github/workflows/w6-v2-review-engine-retry-isolation-evidence.yml
      - acs/version2_release_ui.py
      - acs/version2_application.py
      - acs/stage1_release_ui_core.py
      - web/index.html

permissions:
  contents: read

jobs:
  red-first-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify evidence-only scope from canonical P0 parent
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'tests/test_w6_v2_review_engine_retry_isolation.py',
              '.github/workflows/w6-v2-review-engine-retry-isolation-evidence.yml',
          }
          parent = '9f8c2ed11d50d68cac31ce60becd16c2426e4c6c'
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{parent}...HEAD'], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected evidence scope: {sorted(changed)}')
          print('EVIDENCE_SCOPE_PASS')
          PY
      - name: Diff hygiene
        run: git diff --check 9f8c2ed11d50d68cac31ce60becd16c2426e4c6c...HEAD
      - name: Compile affected Python surface
        run: python -m compileall -q acs tests/test_w6_v2_review_engine_retry_isolation.py
      - name: Canonical P0 review-isolation regression remains green first
        run: python -m unittest -v tests.test_version2_review_presentation_isolation
      - name: RED-first engine retry side-effect oracle
        run: python -m unittest -v tests.test_w6_v2_review_engine_retry_isolation
