name: Library Search Row Product Convergence

on:
  pull_request:
    paths:
      - 'acs/search_service.py'
      - 'tests/test_v2_library_search_service_v4.py'
      - '.github/workflows/library-search-row-product-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-search-row-product-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EXACT_PARENT: d1c27c9939cecccfabe956bcab95fd6811a0784e
      SOURCE_LIBRARY_HEAD: d6fbba61b3dc556bd3d2e1915de9ecc7edee644f
      SERVICE_BLOB: 3f33e23f971acb30849851831aa9a43edf7e3392
      TEST_BLOB: 2bb702390cb5d6869511a0ace2e64e0114e83bc3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact Library successor scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          test "$(git rev-parse "HEAD:acs/search_service.py")" = "$SERVICE_BLOB"
          test "$(git rev-parse "HEAD:tests/test_v2_library_search_service_v4.py")" = "$TEST_BLOB"
          changed="$(git diff --name-only "$EXACT_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-search-row-product-convergence.yml' \
            'acs/search_service.py' \
            'tests/test_v2_library_search_service_v4.py' | sort)"
          test "$changed" = "$expected"
          git diff --check
          echo "SOURCE_LIBRARY_HEAD=$SOURCE_LIBRARY_HEAD"

      - name: Compile Library boundary
        run: >-
          python -m compileall -q
          acs/search_service.py
          tests/test_v2_library_search_service_v4.py

      - name: Validate Library and current application contracts
        run: >-
          python -m unittest -v
          tests.test_v2_library_search_service_v4
          tests.test_acsdb
          tests.test_library_webview_projection
          tests.test_version2_application
          tests.test_training_authority_convergence
          tests.test_dev1_pgn_webview_projection
          tests.test_v2_book_training_route_rollback
          tests.test_version2_release_accessibility_contract

      - name: Validate current browser stack
        run: |
          node --check web/full_product_books_training.js
          node --check web/full_product_pgn.js
          node --check web/version2_release_bootstrap.js
          node tests/js/books_training_surface_dom_test.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Core selftest
        run: python -m acs.selftest
