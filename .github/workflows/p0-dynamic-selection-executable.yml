name: P0 Dynamic Semantic Selection Executable

on:
  pull_request:
    paths:
      - 'web/p0_accessibility_runtime.js'
      - 'web/index.html'
      - 'tests/js/p0_dynamic_selection_runtime_test.js'
      - 'tests/js/p0_accessibility_partial_replacement_test.js'
      - 'tests/test_p0_dynamic_selection_action_delivery.py'
      - 'tests/test_p0_dynamic_selection_partial_replacement.py'
      - 'tests/test_p0_semantic_document_copy.py'
      - '.github/workflows/p0-dynamic-selection-executable.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-dynamic-semantic-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained P0 dynamic-selection authority and PR-base hygiene
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          p0_owner="dba6640f6b247609ffe519ea2a32947593d6e9a7"
          git cat-file -e "${p0_owner}^{commit}"

          base="${PR_BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD)"
          fi
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$p0_owner" HEAD
          git diff --check "$base" HEAD

          for path in \
            tests/js/p0_dynamic_selection_runtime_test.js \
            tests/js/p0_accessibility_partial_replacement_test.js \
            tests/test_p0_dynamic_selection_action_delivery.py \
            tests/test_p0_dynamic_selection_partial_replacement.py
          do
            actual="$(git rev-parse "HEAD:$path")"
            expected="$(git rev-parse "$p0_owner:$path")"
            test "$actual" = "$expected" || {
              printf 'Retained P0 evidence blob drift: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done

          printf 'P0 retained authority PASS: pr-base=%s owner=%s head=%s\n' "$base" "$p0_owner" "$(git rev-parse HEAD)"

      - name: Compile focused regression
        run: python -m compileall -q tests/test_p0_dynamic_selection_action_delivery.py tests/test_p0_dynamic_selection_partial_replacement.py tests/test_p0_semantic_document_copy.py

      - name: Execute browser selection regressions
        run: |
          node --check web/p0_accessibility_runtime.js
          node --check tests/js/p0_accessibility_runtime_test.js
          node --check tests/js/p0_dynamic_selection_runtime_test.js
          node --check tests/js/p0_accessibility_partial_replacement_test.js
          node tests/js/p0_accessibility_runtime_test.js
          node tests/js/p0_dynamic_selection_runtime_test.js
          node tests/js/p0_accessibility_partial_replacement_test.js

      - name: Focused P0 copy and selection tests
        run: >-
          python -m pytest -q
          tests/test_p0_dynamic_selection_action_delivery.py
          tests/test_p0_dynamic_selection_partial_replacement.py
          tests/test_p0_semantic_document_copy.py

      - name: Final-product diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest on Windows
        if: matrix.os == 'windows-2025'
        run: python -m pytest -q tests

      - name: Core selftest
        run: python -m acs.selftest
