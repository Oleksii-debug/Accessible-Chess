name: ACSDB Row Identity Product Convergence

on:
  pull_request:
    paths:
      - 'acs/acsdb.py'
      - 'tests/test_acsdb.py'
      - '.github/workflows/acsdb-row-identity-product-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acsdb-row-identity-product-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      EXACT_PARENT: 14c228b052b33478493bae164d5aa4a493e88e07
      SOURCE_ACSDB_HEAD: 55f0cdd7b0de510b566421551ef7eb990d580c9b
      ACSDB_BLOB: d9a103f0d3e093a487186715b45270180dd2233e
      TEST_BLOB: f75e62bffc44ac3f3a9f20665526564f7b18da2a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact ACSDB successor scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          test "$(git rev-parse "HEAD:acs/acsdb.py")" = "$ACSDB_BLOB"
          test "$(git rev-parse "HEAD:tests/test_acsdb.py")" = "$TEST_BLOB"
          changed="$(git diff --name-only "$EXACT_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/acsdb-row-identity-product-convergence.yml' \
            'acs/acsdb.py' \
            'tests/test_acsdb.py' | sort)"
          test "$changed" = "$expected"
          git diff --check
          echo "SOURCE_ACSDB_HEAD=$SOURCE_ACSDB_HEAD"

      - name: Compile ACSDB boundary
        run: python -m compileall -q acs/acsdb.py tests/test_acsdb.py

      - name: Validate ACSDB and Library contracts
        run: >-
          python -m unittest -v
          tests.test_acsdb
          tests.test_v2_library_search_service_v4
          tests.test_library_webview_projection
          tests.test_d07_library_import_service
          tests.test_version2_application
          tests.test_training_authority_convergence
          tests.test_dev1_pgn_webview_projection
          tests.test_v2_book_training_route_rollback
          tests.test_version2_release_accessibility_contract

      - name: Validate current browser stack
        run: |
          node --check web/full_product_books_training.js
          node --check web/full_product_pgn.js
          node --check web/version2_release_bootstrap.js
          node tests/js/books_training_surface_dom_test.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Core selftest
        run: python -m acs.selftest
