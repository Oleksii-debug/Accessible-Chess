name: Current BookDocument Scalar Bounds

on:
  pull_request:
    branches:
      - converge/current-books-recovery-model-root-20261004-sol57x1
    paths:
      - 'acs/bookdocument.py'
      - 'tests/test_bookdocument_scalar_bounds_current.py'
      - '.github/workflows/current-bookdocument-scalar-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-bookdocument-scalar-bounds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-books-recovery-model-root-20261004-sol57x1}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-bookdocument-scalar-bounds.yml' \
            'acs/bookdocument.py' \
            'tests/test_bookdocument_scalar_bounds_current.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected BookDocument scalar-bound scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile canonical Book model
        run: >-
          python -m compileall -q
          acs/bookdocument.py
          tests/test_bookdocument_scalar_bounds_current.py

      - name: Execute scalar/resource and semantic regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument_scalar_bounds_current
          tests.test_bookdocument_deserialize_bounds_current
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_book_text_import
          tests.test_book_html_import
          tests.test_v2_book_board_workflow

      - name: Core selftest
        run: python -m acs.selftest
