name: D10 Prepared Position Durability Current Runtime

on:
  pull_request:
    paths:
      - 'acs/education_workspace.py'
      - 'tests/test_d10_prepared_position_durability.py'
      - '.github/workflows/d10-prepared-position-durability-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d10-prepared-position-durability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove bounded current-runtime scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_BASE_REF:-}"
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d10-prepared-position-durability-current.yml' \
            'acs/education_workspace.py' \
            'tests/test_d10_prepared_position_durability.py' | sort)"
          test "$changed" = "$expected"

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/education_workspace.py
          tests/test_d10_prepared_position_durability.py

      - name: Focused D10 prepared-position durability regression
        run: >-
          python -m pytest -q
          tests/test_d10_prepared_position_durability.py
          tests/test_education_workspace.py
          tests/test_education_classroom_integration.py
          tests/test_education_records.py
          tests/test_education_records_store.py
          tests/test_classroom_domain.py
          tests/test_classroom_domain_corruption.py
          tests/test_teaching_session.py
          tests/test_teaching_session_adversarial.py
          tests/test_d10_remote_checkpoint_provenance.py

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Broad pytest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pytest -q tests
