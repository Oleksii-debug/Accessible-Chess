name: Current HTML List Identity Cancellation

on:
  pull_request:
    branches:
      - fix/book-html-markup-token-bounds-20261006-ooxple7108
    paths:
      - '.github/workflows/current-html-list-identity-cancellation.yml'
      - 'acs/book_html_import.py'
      - 'tests/test_book_active_import_cancellation.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-html-list-identity-cancellation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HTML_IMPORT_BLOB: 0ead2cede96eb5bb60497e8500d9015da595221d
  ACTIVE_TEST_BLOB: f73dd610b6c7f3f2e7d47d17371e926fad00ae18

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove bounded geometry and exact blobs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-html-list-identity-cancellation.yml' \
            'acs/book_html_import.py' \
            'tests/test_book_active_import_cancellation.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = "$HTML_IMPORT_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_active_import_cancellation.py)" = "$ACTIVE_TEST_BLOB"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed Python
        run: python -m py_compile acs/book_html_import.py tests/test_book_active_import_cancellation.py
      - name: Run active import cancellation regressions
        run: python -m unittest tests.test_book_active_import_cancellation
