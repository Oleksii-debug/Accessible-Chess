name: V2 HTML Current D06 Recovery Acceptance

on:
  push:
    branches:
      - work/v2-html-current-d06-recovery-20260910
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907
    paths:
      - 'acs/book_html_import.py'
      - 'tests/test_v2_html_semantic_lists.py'
      - '.github/workflows/v2-html-current-d06-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-html-current-d06-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CURRENT_PARENT: e358bd1ddfafc21f8798f68e0d390fca804e0203
      HTML_ORIGINAL: cc949235fba8a9c3f7cb36587a52cb23eed5546d
      HTML_LIST_OWNER: 49756d2a6e702619b5ea54f0428fae07402fd1ef
      D06_RECOVERY_ROOT: 23956a6698ca07e65cb616e755fc934ec8842bce
      HTML_ADAPTER_BLOB: 2991e79c82fe50da847efbda3fad4cfe36f2debc
      HTML_LIST_TEST_BLOB: 09ee4049fb115a79bf611f2ac96fae15f0a2deac
      ORIGINAL_HTML_TEST_BLOB: d3a7fa6c920df3d59206aeea831be3c1911ea4d8
      REAL_HTML_ORACLE_BLOB: e6bbbebc204b2ea2e34fff629e841c99aa13ef52
      D06_REAL_BOOK_ORACLE_BLOB: 34fbce8e5e6e5faa1cf76d62d2556e9d4c90e5a1
      BOOK_URL: https://www.gutenberg.org/files/16377/16377-h/16377-h.htm
      BOOK_SHA256: 397cd3d816b6e685d30d3d7cfb36627cff415c754cc8f4e455c24da652d3c21e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove dependency-correct ancestry and bounded HTML scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CURRENT_PARENT" HEAD
          git merge-base --is-ancestor "$HTML_ORIGINAL" HEAD
          git merge-base --is-ancestor "$HTML_LIST_OWNER" HEAD
          git merge-base --is-ancestor "$D06_RECOVERY_ROOT" HEAD
          git diff --check "$CURRENT_PARENT" HEAD
          changed="$(git diff --name-only "$CURRENT_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-html-current-d06-recovery.yml' \
            'acs/book_html_import.py' \
            'tests/test_v2_html_semantic_lists.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected current-base HTML scope:\n%s\n' "$changed" >&2
            exit 1
          }
          git diff --quiet "$CURRENT_PARENT" HEAD -- \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            tests/test_v2_pgn_nested_comment_recovery.py \
            scripts/v2_pgn_nested_comment_real_book_oracle.py \
            scripts/v2_real_html_book_oracle.py \
            tests/test_v2_book_html_import.py \
            acs/bookdocument.py \
            acs/book_index.py \
            acs/bookreader.py \
            acs/chesscore.py \
            acs/book_progress_store.py \
            acs/book_text_import.py \
            acs/training.py \
            acs/training_progress_store.py \
            web \
            tools/qa

      - name: Lock HTML owner and unchanged real-book evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = "$HTML_ADAPTER_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_html_semantic_lists.py)" = "$HTML_LIST_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_html_import.py)" = "$ORIGINAL_HTML_TEST_BLOB"
          test "$(git rev-parse HEAD:scripts/v2_real_html_book_oracle.py)" = "$REAL_HTML_ORACLE_BLOB"
          test "$(git rev-parse HEAD:scripts/v2_pgn_nested_comment_real_book_oracle.py)" = "$D06_REAL_BOOK_ORACLE_BLOB"
          grep -F 'EXPECTED_GAME_COUNT = 85' scripts/v2_real_html_book_oracle.py
          grep -F 'parse_pgn_text(candidate, strict=False)' acs/book_html_import.py

      - name: Compile HTML and canonical D06 evidence package
        run: >-
          python -m compileall -q
          acs/book_html_import.py
          acs/gametree.py
          acs/pgn_roundtrip.py
          tests/test_v2_book_html_import.py
          tests/test_v2_html_semantic_lists.py
          tests/test_v2_pgn_nested_comment_recovery.py
          scripts/v2_real_html_book_oracle.py
          scripts/v2_pgn_nested_comment_real_book_oracle.py

      - name: Focused HTML Books and canonical D06 regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_html_import
          tests.test_v2_html_semantic_lists
          tests.test_v2_pgn_nested_comment_recovery
          tests.test_d06_pgn_roundtrip
          tests.test_gametree
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core

      - name: Download exact lawful Project Gutenberg book transiently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ['BOOK_URL']
          for attempt in range(4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'Accessible-Chess-CI/1.0 current-D06-HTML-verification'},
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read()
                  with open('real-book-16377.html', 'wb') as stream:
                      stream.write(data)
                  print(f'downloaded {len(data)} bytes')
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(2 ** attempt)
          PY

      - name: Canonical D06 PGN 73 recovery on exact source
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.v2_pgn_nested_comment_real_book_oracle \
            real-book-16377.html \
            --expected-sha256 "$BOOK_SHA256" 2>&1 | tee d06-pgn73-current.log

      - name: Unchanged real HTML Books 85-game oracle
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.v2_real_html_book_oracle \
            real-book-16377.html \
            --expected-sha256 "$BOOK_SHA256" 2>&1 | tee html-85-current.log
          grep -F 'REAL_BOOK_PGN_GAMES=85' html-85-current.log
          grep -F 'REAL_HTML_BOOK_ACCEPTANCE=PASS' html-85-current.log
          grep -F 'REAL_HTML_BOOK_DIAGRAM_POLICY=IMAGE_REFERENCES_PRESERVED_NO_POSITION_FABRICATION' html-85-current.log

      - name: Remove transient corpus
        if: always()
        shell: bash
        run: rm -f -- real-book-16377.html

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic

      - name: Prove transient corpus residue absent
        if: always()
        shell: bash
        run: test ! -e real-book-16377.html

      - name: Upload path-free acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-html-current-d06-${{ matrix.os }}
          path: |
            d06-pgn73-current.log
            html-85-current.log
          if-no-files-found: ignore
          retention-days: 14
