name: Current Visual Packs Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/visual_preferences.py'
      - 'acs/visual_pack_store.py'
      - 'tests/test_current_visual_packs.py'
      - '.github/workflows/current-visual-packs-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact candidate identity and scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "\${{ github.event.pull_request.head.sha }}"
          base="\${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-visual-packs-contract.yml' \
            'acs/visual_pack_store.py' \
            'acs/visual_preferences.py' \
            'tests/test_current_visual_packs.py' | sort)"
          test "$changed" = "$expected"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile focused authority
        run: python -m py_compile acs/visual_preferences.py acs/visual_pack_store.py tests/test_current_visual_packs.py
      - name: Execute focused contract regression
        run: python -m unittest -v tests.test_current_visual_packs
