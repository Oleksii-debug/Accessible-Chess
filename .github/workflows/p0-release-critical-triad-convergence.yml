name: P0 Release Critical Triad Convergence

on:
  pull_request:
    paths:
      - 'scripts/p0_packaged_document_copy_probe.ps1'
      - 'tests/test_p0_packaged_document_copy_probe.py'
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'tests/test_verify_p0_packaged_document_copy_evidence.py'
      - 'scripts/p0g_packaged_hotkey_result_probe.ps1'
      - 'tests/test_p0g_packaged_hotkey_result_probe.py'
      - 'tests/test_p0_release_critical_triad_convergence.py'
      - '.github/workflows/p0-release-critical-triad-convergence.yml'
      - 'acs/**'
      - 'web/**'
      - 'run_accessible_chess_v2.py'

permissions:
  contents: read

jobs:
  triad:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout proposed convergence merge
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          # Exact event base/head commits may be older than the shallow merge
          # checkout boundary after Product advances. Full history keeps the
          # event-bound identities and diff tree available on both OSes.
          fetch-depth: 0
      - name: Prove exact pull-request merge identity
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event_name }}' = 'pull_request'
          test '${{ github.event.pull_request.base.repo.full_name }}' = '${{ github.repository }}'

          event_base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          merge_sha='${{ github.sha }}'

          git cat-file -e "$event_base_sha^{commit}"
          git cat-file -e "$head_sha^{commit}"
          test "$(git rev-parse HEAD)" = "$merge_sha"

          read -r actual_merge base_sha merged_head_sha extra < <(git rev-list --parents -n 1 HEAD)
          test "$actual_merge" = "$merge_sha"
          test "$merged_head_sha" = "$head_sha"
          test -z "${extra:-}"

          # GitHub may synthesize the merge after the target branch advanced
          # beyond the pull_request payload's base.sha. Bind qualification to
          # the actual tested merge parent, while requiring the event snapshot
          # to remain in that base lineage.
          git cat-file -e "$base_sha^{commit}"
          git merge-base --is-ancestor "$event_base_sha" "$base_sha"
          git diff --check "$base_sha" "$merge_sha"
          printf 'P0_TRIAD_MERGE_IDENTITY=EXACT base=%s head=%s merge=%s\n' \
            "$base_sha" "$merged_head_sha" "$merge_sha"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile convergence contract
        run: python -m py_compile tests/test_p0_release_critical_triad_convergence.py
      - name: Run release-critical triad contract
        run: python -m unittest -v tests.test_p0_release_critical_triad_convergence
      - name: Re-run packaged copy and P0-G static contracts
        run: >-
          python -m unittest -v
          tests.test_p0_packaged_document_copy_probe
          tests.test_p0g_packaged_hotkey_result_probe
          tests.test_verify_p0_packaged_document_copy_evidence
