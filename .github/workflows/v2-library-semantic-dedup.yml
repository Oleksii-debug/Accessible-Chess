name: V2 Library Semantic Dedupe

on:
  push:
    branches:
      - work/v2-library-semantic-dedup-20260831
  pull_request:
    branches:
      - work/v2-library-dedup-provenance-20260828
    paths:
      - 'acs/game_identity.py'
      - 'acs/duplicate_detection.py'
      - 'tests/test_game_identity.py'
      - 'tests/test_duplicate_detection.py'
      - 'docs/LIBRARY_DEDUPLICATION_POLICY.md'
      - '.github/workflows/v2-library-semantic-dedup.yml'

permissions:
  contents: read

concurrency:
  group: v2-library-semantic-dedup-${{ github.ref }}
  cancel-in-progress: true

env:
  CHILD_BASE: 5b68baf4c1f32a992f46067b8da120e4d1168294

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Normalize worktree to canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Ownership ancestry and exact child diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CHILD_BASE" HEAD
          test "$(git merge-base "$CHILD_BASE" HEAD)" = "$CHILD_BASE"
          git diff --check "$CHILD_BASE" HEAD
          changed="$(git diff --name-only "$CHILD_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-library-semantic-dedup.yml' \
            'acs/duplicate_detection.py' \
            'acs/game_identity.py' \
            'docs/LIBRARY_DEDUPLICATION_POLICY.md' \
            'tests/test_duplicate_detection.py' \
            'tests/test_game_identity.py' | sort)"
          test "$changed" = "$expected"
          if printf '%s\n' "$changed" | grep -E 'library_import_service.py|acsdb.py|gametree.py|pgn_document|pgn_service|pgn_workspace|chessbase_decoder|teacher|classroom|education'; then
            echo 'Parent-owned, schema/parser, ChessBase, or unrelated scope contamination detected' >&2
            exit 1
          fi
      - name: Compile
        run: python -m compileall -q acs tests tools run_accessible_chess.py
      - name: Focused identity, dedupe and inherited D07 regressions
        run: >-
          python -m unittest -v
          tests.test_game_identity
          tests.test_duplicate_detection
          tests.test_v2_library_dedup_provenance
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_v2_library_integrity_repair
          tests.test_v2_library_date_filter_v5
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_search_service_v4
          tests.test_acsdb
          tests.test_d07_acsdb_migration_atomicity
          tests.test_windows_data_release_regressions
      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee full-unittest.log
      - name: Upload full unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-library-semantic-dedup-full-unittest-${{ matrix.os }}
          path: full-unittest.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

  inherited-real-lichess-repeat-5k:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned real-corpus dependency
        run: python -m pip install -q zstandard==0.23.0
      - name: Parent exact-repeat 5k corpus -> Search -> reopen -> integrity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/v2_library_dedup_real_corpus.py
      - name: Upload evidence summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-library-semantic-dedup-real-5k-evidence
          path: dedup-real-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: No external corpus or optional backend payload retained
        shell: bash
        run: |
          set -euo pipefail
          test ! -e lichess.pgn.zst
          test ! -e lichess-first-5000.pgn
          test ! -e libcbh-json-bridge
          test ! -e libcbh.so
          test ! -e uncbv
