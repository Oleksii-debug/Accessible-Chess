name: P0 Packaged Release Probe Convergence

on:
  pull_request:
    paths:
      - 'scripts/p0_packaged_document_copy_probe.ps1'
      - 'tests/test_p0_packaged_document_copy_probe.py'
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'tests/test_verify_p0_packaged_document_copy_evidence.py'
      - 'scripts/p0g_packaged_hotkey_result_probe.ps1'
      - 'tests/test_p0g_packaged_hotkey_result_probe.py'
      - 'tests/test_p0_packaged_release_probe_convergence.py'
      - '.github/workflows/p0-packaged-release-probe-convergence.yml'

permissions:
  contents: read

jobs:
  combined-probe-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout proposed merge of P0 QA lineages
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Prove exact pull-request merge identity
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$EVENT_BASE_SHA"
          test -n "$EVENT_HEAD_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git cat-file -e "$EVENT_HEAD_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git merge-base --is-ancestor "$EVENT_HEAD_SHA" HEAD
          parents="$(git show -s --format=%P HEAD)"
          case " $parents " in
            *" $EVENT_BASE_SHA "*) ;;
            *) echo "checked merge does not contain exact PR base parent" >&2; exit 1 ;;
          esac
          case " $parents " in
            *" $EVENT_HEAD_SHA "*) ;;
            *) echo "checked merge does not contain exact PR head parent" >&2; exit 1 ;;
          esac
          git diff --check "$EVENT_BASE_SHA..HEAD"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile combined contracts
        run: >-
          python -m py_compile
          tests/test_p0_packaged_document_copy_probe.py
          tests/test_p0g_packaged_hotkey_result_probe.py
          tests/test_p0_packaged_release_probe_convergence.py
          scripts/verify_p0_packaged_document_copy_evidence.py
          tests/test_verify_p0_packaged_document_copy_evidence.py
      - name: Run incumbent packaged probe contracts and convergence gate
        run: >-
          python -m unittest -v
          tests.test_p0_packaged_document_copy_probe
          tests.test_p0g_packaged_hotkey_result_probe
          tests.test_p0_packaged_release_probe_convergence
          tests.test_verify_p0_packaged_document_copy_evidence
