name: LiveKit Join Token Issuer

on:
  pull_request:
    branches:
      - feature/classroom-join-credential-rpc-core-20261002
    paths:
      - 'acs/livekit_join_token_issuer.py'
      - 'tests/test_livekit_join_token_issuer.py'
      - '.github/workflows/livekit-join-token-issuer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livekit-join-token-issuer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  token-issuer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-join-credential-rpc-core-20261002"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA" HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/livekit-join-token-issuer.yml' \
            'acs/livekit_join_token_issuer.py' \
            'tests/test_livekit_join_token_issuer.py' | sort)"
          test "$changed" = "$allowed"

      - name: Compile concrete token boundary
        run: >-
          python -m py_compile
          acs/livekit_join_token_issuer.py
          tests/test_livekit_join_token_issuer.py

      - name: Run adapter and canonical join/media contracts
        run: >-
          python -m unittest -v
          tests.test_livekit_join_token_issuer
          tests.test_classroom_join_credentials
          tests.test_classroom_realtime_media

      - name: Install pinned official LiveKit server SDK
        run: python -m pip install --disable-pip-version-check -q livekit-api==1.2.1

      - name: Prove pinned SDK token schema and least privilege
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import base64
          import importlib.metadata
          import json
          from datetime import datetime, timedelta, timezone

          from acs.classroom_join_credentials import ClassroomJoinGrant
          from acs.classroom_realtime_media import MediaSource
          from acs.livekit_join_token_issuer import LiveKitJoinTokenIssuer

          assert importlib.metadata.version("livekit-api") == "1.2.1"
          now = datetime.now(timezone.utc)
          issuer = LiveKitJoinTokenIssuer(
              api_key="ci-provider-key",
              api_secret="ci-provider-secret-material-long-enough-for-hmac",
          )
          token = asyncio.run(
              issuer.issue_join_token(
                  grant=ClassroomJoinGrant(
                      room_id="ci-room",
                      participant_id="ci-student",
                      publish_sources=(MediaSource.MICROPHONE, MediaSource.CAMERA),
                  ),
                  issued_at=now,
                  expires_at=now + timedelta(seconds=60),
              )
          )
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          assert claims["sub"] == "ci-student"
          assert claims["iss"] == "ci-provider-key"
          video = claims["video"]
          assert video["roomJoin"] is True
          assert video["room"] == "ci-room"
          assert video["canPublish"] is True
          assert video["canSubscribe"] is True
          assert video["canPublishData"] is False
          assert video["canPublishSources"] == ["microphone", "camera"]
          assert "roomAdmin" not in video
          assert "roomCreate" not in video
          assert "roomRecord" not in video
          assert 59 <= claims["exp"] - claims["nbf"] <= 61
          print("LIVEKIT_PINNED_TOKEN_CONTRACT=PASS")
          PY

      - name: Prove server-only credential boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'os\.(environ|getenv)|LIVEKIT_API_SECRET|LIVEKIT_API_KEY' acs/livekit_join_token_issuer.py
          grep -Fq 'importlib.import_module("livekit.api")' acs/livekit_join_token_issuer.py
          grep -Fq 'can_publish_data=False' acs/livekit_join_token_issuer.py
          grep -Fq 'can_publish_sources=sources' acs/livekit_join_token_issuer.py
          grep -Fq 'api_key=<redacted>, api_secret=<redacted>' acs/livekit_join_token_issuer.py

      - name: Core selftest
        run: python -m acs.selftest
