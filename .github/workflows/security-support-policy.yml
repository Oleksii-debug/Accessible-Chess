name: Security Support Policy Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/security_support_policy.py'
      - 'tools/generate_security_support_manifest.py'
      - 'tests/test_security_support_policy.py'
      - 'tests/test_security_support_policy_uri_hardening.py'
      - '.github/workflows/security-support-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-support-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact bounded scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/security-support-policy.yml' \
            'acs/security_support_policy.py' \
            'tests/test_security_support_policy.py' \
            'tests/test_security_support_policy_uri_hardening.py' \
            'tools/generate_security_support_manifest.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected security-support scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Compile policy tooling
        run: >-
          python -m py_compile
          acs/security_support_policy.py
          tools/generate_security_support_manifest.py
          tests/test_security_support_policy.py
          tests/test_security_support_policy_uri_hardening.py

      - name: Run policy regressions
        run: >-
          python -m unittest -v
          tests.test_security_support_policy
          tests.test_security_support_policy_uri_hardening

      - name: Prove canonical release manifest generation
        shell: bash
        run: |
          set -euo pipefail
          cat > support-input.json <<'JSON'
          {
            "version": "1.0.0",
            "market_release_date": "2027-01-15",
            "support_end_date": "2032-01-15",
            "vulnerability_contact": "mailto:security@example.invalid",
            "disclosure_policy_url": "https://example.invalid/security",
            "security_update_url": "https://example.invalid/updates"
          }
          JSON
          python tools/generate_security_support_manifest.py \
            --input support-input.json \
            --output support.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("support.json").read_text(encoding="utf-8"))
          assert data["product"] == "Accessible Chess"
          assert data["security_updates_free"] is True
          assert data["separate_security_updates_when_feasible"] is True
          assert data["end_of_support_notice_required"] is True
          assert data["cra_reporting_contract"]["early_warning_hours"] == 24
          assert data["cra_reporting_contract"]["notification_hours"] == 72
          print("SECURITY_SUPPORT_RELEASE_GATE=PASS")
          PY

      - name: Core selftest
        run: python -m acs.selftest
