name: Current Full Product Book Command Authority

on:
  push:
    branches:
      - qualification/current-apex-book-command-authority-20261004-sol
    paths:
      - 'tests/test_full_product_book_command_authority.py'
      - 'tests/test_current_main_full_product_convergence_workflow.py'
      - '.github/workflows/full-product-book-command-authority.yml'
      - '.github/workflows/full-product-convergence-integration-20261004.yml'
  pull_request:
    branches:
      - converge/current-apex-user-library-seed-safety-20261004-sol
    paths:
      - 'tests/test_full_product_book_command_authority.py'
      - 'tests/test_current_main_full_product_convergence_workflow.py'
      - '.github/workflows/full-product-book-command-authority.yml'
      - '.github/workflows/full-product-convergence-integration-20261004.yml'

permissions:
  contents: read

concurrency:
  group: current-full-product-book-command-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Verify reconverged authority lineage and preserved executable scope
        shell: bash
        run: |
          set -euo pipefail
          authority_base='4f7485f220f4250cac990aa89f257ebe219e208e'
          authority_tip='e4daa1719b310aa66e8e6cc48bdba80a84a5d7de'
          whole_product_parent='71cae99b6ee65ff95c29a9ccfd93723bd58d1ec7'
          for commit in "$authority_base" "$authority_tip" "$whole_product_parent"; do
            git cat-file -e "$commit^{commit}"
          done
          git merge-base --is-ancestor "$authority_base" "$authority_tip"
          git merge-base --is-ancestor "$authority_tip" HEAD
          git merge-base --is-ancestor "$whole_product_parent" HEAD
          authority_changed="$(git diff --name-only "$authority_base" "$authority_tip" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/full-product-book-command-authority.yml' \
            '.github/workflows/full-product-convergence-integration-20261004.yml' \
            'tests/test_current_main_full_product_convergence_workflow.py' \
            'tests/test_full_product_book_command_authority.py' | sort)"
          test "$authority_changed" = "$expected"
          git diff --check "$authority_base" "$authority_tip"
          git diff --exit-code "$authority_tip" HEAD -- \
            'tests/test_full_product_book_command_authority.py'
          echo 'BOOK_COMMAND_AUTHORITY_ORIGINAL_SCOPE=PASS'
          echo 'BOOK_COMMAND_AUTHORITY_RECONVERGED_LINEAGE=PASS'
          echo 'BOOK_COMMAND_AUTHORITY_EXECUTABLE_CONTRACT_PRESERVED=PASS'

      - name: Compile authority regressions
        run: >-
          python -m compileall -q
          tests/test_full_product_book_command_authority.py
          tests/test_current_main_full_product_convergence_workflow.py

      - name: Run Book command and whole-product authority regressions
        run: >-
          python -m unittest -v
          tests.test_full_product_book_command_authority
          tests.test_current_main_full_product_convergence_workflow
          tests.test_version2_application
          tests.test_v2_book_board_workflow

      - name: Run core selftest
        run: python -m acs.selftest
