          LANGUAGE_ATOMIC_HEAD: 4e5603de1ba61604d618dcfb1d309d01102eaa21
          PRE_LANGUAGE_ATOMIC_PRODUCT: d10e1a4667b152913a6096b98dfe319d7f95e30b
          LANGUAGE_ATOMIC_MERGE: 8b2ffedb1e58def589fef67ff65668f982b971ee
          BOOK_OPEN_REF: fix/book-open-cancellable-worker-20261005-ooxple7
          BOOK_OPEN_HEAD: f0895d6b90bd59403698cb3869f3767d6e0a6086
