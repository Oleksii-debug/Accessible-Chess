name: Licensing Privacy Boundary

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/entitlements.py'
      - 'acs/licensing_privacy.py'
      - 'tests/test_licensing_privacy.py'
      - '.github/workflows/licensing-privacy-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licensing-privacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact candidate identity
        if: github.event_name == 'pull_request'
        shell: python
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_SHA"]
          if actual != expected:
              raise SystemExit(f"checked out {actual}, expected pull-request head {expected}")

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2

      - name: Compile privacy boundary
        run: >-
          python -m py_compile
          acs/entitlements.py
          acs/licensing_privacy.py
          tests/test_licensing_privacy.py

      - name: Run privacy and canonical entitlement regressions
        run: >-
          python -m pytest -q
          tests/test_licensing_privacy.py
          tests/test_entitlements.py
