name: Book Training Core Ingress Convergence

on:
  pull_request:
    paths:
      - 'acs/book_training.py'
      - 'acs/training.py'
      - 'tests/test_d08_book_training_contract.py'
      - 'tests/test_d08_training_canonical_resume.py'
      - '.github/workflows/book-training-core-ingress-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-training-core-ingress-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      LIVE_BOOK_PARENT: 251ce76e5bc4f1f91336b8f93c5869a8fa6e7eb7
      COMPAT_TRAINING_PARENT: cfb7b352aa4248a3a4f45d7340b6a9a9d1a1d424
      PRIOR_CONVERGENCE_PARENT: 59865d5a4ab5594237ba0ccb701325a0664527b6
      BOOK_TRAINING_BLOB: 421ac6144651eca0a16f6edeee73646ca89f2d94
      TRAINING_BLOB: 345d6ea6e71ca76b83618f1fe845cfc51a62cc95
      BOOK_CONTRACT_BLOB: a1b693a8eecb16a990e140ad0a229ecfaf9643b3
      TRAINING_TEST_BLOB: 2ce307e1c3726b0b7dbfd559f041ca0f16f6828f
      CRASH_TEST_BLOB: a6fc5da0b38b107d956e8286adc2d1228aa05c89
      D01_WORKFLOW_BLOB: 6ca7820c166f735be2814ca0a1368277b38c9626
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove live and carried histories with exact scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$LIVE_BOOK_PARENT" HEAD
          git merge-base --is-ancestor "$COMPAT_TRAINING_PARENT" HEAD
          git merge-base --is-ancestor "$PRIOR_CONVERGENCE_PARENT" HEAD

          test "$(git rev-parse "HEAD:acs/book_training.py")" = "$BOOK_TRAINING_BLOB"
          test "$(git rev-parse "HEAD:acs/training.py")" = "$TRAINING_BLOB"
          test "$(git rev-parse "HEAD:tests/test_d08_book_training_contract.py")" = "$BOOK_CONTRACT_BLOB"
          test "$(git rev-parse "HEAD:tests/test_training.py")" = "$TRAINING_TEST_BLOB"
          test "$(git rev-parse "HEAD:tests/test_w2_training_progress_crash_recovery.py")" = "$CRASH_TEST_BLOB"
          test "$(git rev-parse "HEAD:.github/workflows/d01-books-training-ui-integration.yml")" = "$D01_WORKFLOW_BLOB"

          changed="$(git diff --name-only "$LIVE_BOOK_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/book-training-core-ingress-convergence.yml' \
            'acs/book_training.py' \
            'acs/training.py' \
            'tests/test_d08_book_training_contract.py' \
            'tests/test_d08_training_canonical_resume.py' | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Compile convergence boundary
        run: >-
          python -m compileall -q
          acs/book_training.py
          acs/training.py
          acs/version2_book_workspace.py
          tests/test_d08_book_training_contract.py
          tests/test_d08_training_canonical_resume.py
          tests/test_training.py
          tests/test_w2_training_progress_crash_recovery.py
          tests/test_books_semantic_host_bounds.py
          tests/test_version2_book_workspace.py

      - name: Execute canonical Training and Book ingress matrix
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_w2_training_progress_crash_recovery
          tests.test_d08_training_canonical_resume
          tests.test_d08_book_training_contract
          tests.test_w2_book_training_canonical_ingress
          tests.test_books_training_ui_integration
          tests.test_books_semantic_host_bounds
          tests.test_version2_book_workspace
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_atomicity

      - name: Core selftest and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
