name: Local Learning Mastery Contract

on:
  pull_request:
    paths:
      - 'acs/learning_mastery.py'
      - 'tests/test_learning_mastery.py'
      - 'acs/learning_mastery_store.py'
      - 'acs/learning_mastery_training.py'
      - 'tests/test_learning_mastery_integration.py'
      - '.github/workflows/local-learning-mastery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-learning-mastery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact candidate and isolated mastery scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha }}"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head" || {
            printf 'Mastery candidate mismatch: expected=%s actual=%s\n' "$expected_head" "$actual_head" >&2
            exit 1
          }
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/local-learning-mastery.yml' 'acs/learning_mastery.py' 'acs/learning_mastery_store.py' 'acs/learning_mastery_training.py' 'tests/test_learning_mastery.py' 'tests/test_learning_mastery_integration.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected local-mastery scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Compile mastery contract and tests
        run: python -m compileall -q acs/learning_mastery.py acs/learning_mastery_store.py acs/learning_mastery_training.py tests/test_learning_mastery.py tests/test_learning_mastery_integration.py

      - name: Execute mastery contract tests
        run: python -m unittest -v tests.test_learning_mastery tests.test_learning_mastery_integration

      - name: Core selftest
        run: python -m acs.selftest
