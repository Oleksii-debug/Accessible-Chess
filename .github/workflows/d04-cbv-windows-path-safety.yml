name: D04 CBV Windows Path Safety

on:
  push:
    branches:
      - work/d04-cbv-windows-path-safety-20260907
  pull_request:
    paths:
      - '.github/workflows/d04-cbv-windows-path-safety.yml'
      - 'acs/cbv_extractor.py'
      - 'tests/test_d04_cbv_windows_path_safety.py'

permissions:
  contents: read

concurrency:
  group: d04-cbv-windows-path-safety-${{ github.ref }}
  cancel-in-progress: true

env:
  D04_BASE: 9ac0600bf9d270e02334df1657c1ccc941f909b5

jobs:
  cbv-path-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove ancestry and narrow D04 scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$D04_BASE" HEAD
          git diff --check "$D04_BASE" HEAD
          changed="$(git diff --name-only "$D04_BASE" HEAD | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/d04-cbv-windows-path-safety.yml \
            acs/cbv_extractor.py \
            tests/test_d04_cbv_windows_path_safety.py | sort)"
          test "$changed" = "$allowed" || {
            printf 'Unexpected D04 scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/cbv_extractor.py)" = "8fc4f12e5eae6782ddbb0e2c12d2d038f989b4aa"
          test "$(git rev-parse HEAD:tests/test_d04_cbv_windows_path_safety.py)" = "698893cdabfc85d2aa81e8befa842680fdc6e524"

      - name: Compile affected Python
        run: python -m compileall -q acs/cbv_extractor.py tests/test_cbv_extractor.py tests/test_d04_cbv_windows_path_safety.py

      - name: Focused CBV extraction regressions
        run: python -m unittest -v tests.test_cbv_extractor tests.test_d04_cbv_windows_path_safety

      - name: Focused pytest parity
        run: python -m pytest -q tests/test_cbv_extractor.py tests/test_d04_cbv_windows_path_safety.py

      - name: Full unittest regression
        run: python -m unittest discover -v

      - name: Full pytest regression
        run: python -m pytest -q
