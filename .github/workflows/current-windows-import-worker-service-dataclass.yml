name: Current Windows Import Worker Service Dataclass

on:
  push:
    branches:
      - fix/windows-import-worker-services-dataclass-20261006-c2m82
  pull_request:
    branches:
      - fix/windows-import-terminal-observer-retirement-20261006-hy6ez0h
    paths:
      - acs/version2_windows_file_workflows.py
      - tests/test_v2_windows_file_logging_passive.py
      - .github/workflows/current-windows-import-worker-service-dataclass.yml

permissions:
  contents: read

concurrency:
  group: current-windows-import-service-dataclass-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 06f1a38205a83502b71576fb5b4bf88728d05a58
  PARENT_BRANCH: fix/windows-import-terminal-observer-retirement-20261006-hy6ez0h
  EXPECTED_SOURCE_BLOB: c475d8e7279a84920de70c83839e29618166d764
  EXPECTED_TEST_BLOB: 7e917cd74fd2a3587214c2458d0960d2a8b44c68

jobs:
  worker-service-dataclass:
    name: Worker service dataclass / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact parent and bounded repair
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/import-service-parent"
          live_parent="$(git rev-parse refs/remotes/origin/import-service-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "IMPORT_SERVICE_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          expected=(
            ".github/workflows/current-windows-import-worker-service-dataclass.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_file_logging_passive.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_file_logging_passive.py)" = "$EXPECTED_TEST_BLOB"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile worker service boundary
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_file_logging_passive.py

      - name: Run passive logging and file worker regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_file_logging_passive
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_pgn_save_worker

      - name: Core selftest
        run: python -m acs.selftest
