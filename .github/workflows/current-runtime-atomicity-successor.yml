name: Current Runtime Atomicity Successor

on:
  push:
    branches:
      - converge/current-runtime-atomicity-successor-20261006-sol56
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-runtime-atomicity-successor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PRODUCT_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
  RUNTIME_PARENT_SHA: 5cf3b76e7c16b1633021de2ca069630c7625a294
  BOOKS_PARENT_SHA: b0cb38cad9630cc92dcb848e6bcaf2abfd2ba474
  BOOKS_REPAIR_SHA: 9aa4729ead9539bc264fb4fd99e6b9f1ca8d349f
  PGN_PARENT_SHA: 7acff17b56d1beaf0f0924fa06ab9d00214b4cbe
  PGN_REPAIR_SHA: 9acd0361260874e59ec80ca96bb68b8599751b50
  RUNTIME_MERGE_SHA: 446be708b6210d5d02f242977643ad84318ae520

jobs:
  integrated-atomicity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70

    steps:
      - name: Checkout exact runtime successor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact three-parent receipt and bounded successor scope
        shell: bash
        run: |
          set -euo pipefail
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$head"

          for sha in "$PRODUCT_SHA" "$RUNTIME_PARENT_SHA" "$BOOKS_PARENT_SHA" "$BOOKS_REPAIR_SHA" "$PGN_PARENT_SHA" "$PGN_REPAIR_SHA" "$RUNTIME_MERGE_SHA"; do
            git cat-file -e "$sha^{commit}"
          done

          test "$(git rev-list --parents -n 1 "$RUNTIME_MERGE_SHA")" = "$RUNTIME_MERGE_SHA $RUNTIME_PARENT_SHA $BOOKS_REPAIR_SHA $PGN_REPAIR_SHA"
          git merge-base --is-ancestor "$RUNTIME_MERGE_SHA" HEAD
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          test "$(git merge-base "$BOOKS_PARENT_SHA" "$BOOKS_REPAIR_SHA")" = "$BOOKS_PARENT_SHA"
          test "$(git merge-base "$PGN_PARENT_SHA" "$PGN_REPAIR_SHA")" = "$PGN_PARENT_SHA"

          python - <<'PY'
          import os
          import subprocess

          def paths(base: str, head: str) -> set[str]:
              out = subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...{head}"],
                  text=True,
              )
              return {line for line in out.splitlines() if line}

          books = paths(os.environ["BOOKS_PARENT_SHA"], os.environ["BOOKS_REPAIR_SHA"])
          pgn = paths(os.environ["PGN_PARENT_SHA"], os.environ["PGN_REPAIR_SHA"])
          expected_books = {
              ".github/workflows/books-navigation-abort-rollback.yml",
              "acs/book_board_workflow.py",
              "tests/test_v2_book_board_workflow.py",
          }
          expected_pgn = {
              ".github/workflows/pgn-modal-persistence-generation.yml",
              "acs/version2_windows_file_workflows.py",
              "tests/test_v2_windows_pgn_open_worker.py",
              "tests/test_v2_windows_pgn_save_worker.py",
          }
          if books != expected_books:
              raise SystemExit(f"BOOKS_SUCCESSOR_SCOPE_MISMATCH {sorted(books)}")
          if pgn != expected_pgn:
              raise SystemExit(f"PGN_SUCCESSOR_SCOPE_MISMATCH {sorted(pgn)}")
          if books & pgn:
              raise SystemExit(f"SUCCESSOR_SCOPE_OVERLAP {sorted(books & pgn)}")

          integration = paths(os.environ["RUNTIME_PARENT_SHA"], "HEAD")
          expected = books | pgn | {".github/workflows/current-runtime-atomicity-successor.yml"}
          if integration != expected:
              print("missing:", sorted(expected - integration))
              print("unexpected:", sorted(integration - expected))
              raise SystemExit("RUNTIME_SUCCESSOR_SCOPE_MISMATCH")
          print(f"BOOKS_SUCCESSOR_PATHS={len(books)}")
          print(f"PGN_SUCCESSOR_PATHS={len(pgn)}")
          print(f"RUNTIME_SUCCESSOR_PATHS={len(integration)}")
          PY

          for path in             .github/workflows/books-navigation-abort-rollback.yml             acs/book_board_workflow.py             tests/test_v2_book_board_workflow.py
          do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse "$BOOKS_REPAIR_SHA:$path")"
          done

          for path in             .github/workflows/pgn-modal-persistence-generation.yml             acs/version2_windows_file_workflows.py             tests/test_v2_windows_pgn_open_worker.py             tests/test_v2_windows_pgn_save_worker.py
          do
            test "$(git rev-parse HEAD:$path)" = "$(git rev-parse "$PGN_REPAIR_SHA:$path")"
          done

          git diff --check "$RUNTIME_PARENT_SHA"...HEAD
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.yml' '*.js' || true)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile integrated runtime atomicity boundary
        run: >-
          python -m py_compile
          acs/book_board_workflow.py
          acs/bookreader.py
          acs/pgn_workspace.py
          acs/pgn_save_snapshot.py
          acs/version2_windows_file_workflows.py
          acs/version2_application.py
          tests/test_v2_book_board_workflow.py
          tests/test_v2_windows_pgn_open_worker.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Execute Books semantic and Board recovery contracts
        run: >-
          python -m unittest -v
          tests.test_bookreader_revision_barriers_current
          tests.test_book_bidirectional_semantic_navigation
          tests.test_v2_book_board_workflow
          tests.test_dev1_books_training_webview_bridge

      - name: Execute PGN persistence generation and Windows worker contracts
        run: >-
          python -m unittest -v
          tests.test_pgn_workspace
          tests.test_pgn_save_snapshot
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_nvda_file_workflows

      - name: Execute presentation and whole-product smoke
        run: >-
          python -m unittest -v
          tests.test_dev1_pgn_webview_projection
          tests.test_version2_application
          tests.test_whole_product_user_journey

      - name: Core selftest
        run: python -m acs.selftest
