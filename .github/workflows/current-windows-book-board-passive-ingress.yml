name: Current Windows BookBoard Passive Ingress
# Serial exact-head qualification for the retargeted #1868 successor.

on:
  pull_request:
    branches:
      - converge/current-book-presentation-payload-passive-20261004-zftrkmo
    paths:
      - 'acs/version2_windows_book_board_adapter.py'
      - 'tests/test_v2_windows_book_board_adapter.py'
      - '.github/workflows/current-windows-book-board-passive-ingress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-windows-book-board-passive-ingress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and adapter-only scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          base_ref="${EVENT_BASE_REF:-converge/current-book-presentation-payload-passive-20261004-zftrkmo}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD

          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-windows-book-board-passive-ingress.yml' \
            'acs/version2_windows_book_board_adapter.py' \
            'tests/test_v2_windows_book_board_adapter.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Windows BookBoard ingress scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Windows BookBoard adapter
        run: >-
          python -m compileall -q
          acs/version2_windows_book_board_adapter.py
          tests/test_v2_windows_book_board_adapter.py

      - name: Execute Windows BookBoard regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_book_board_adapter
          tests.test_v2_windows_book_board_adapter_workflow
          tests.test_v2_book_board_workflow
          tests.test_book_board_route_ownership

      - name: Core selftest
        run: python -m acs.selftest
