name: Section 1 SAN Transition Contract

on:
  pull_request:
    branches:
      - 'converge/fen-history-section1-20261007-sol56a1'
    paths:
      - '.github/workflows/section1-san-transition-contract.yml'
      - 'acs/input_limits.py'
      - 'acs/notation.py'
      - 'acs/chesscore.py'
      - 'tests/test_section1_san_transition_contract.py'
      - 'docs/automation/SECTION1_CLOSURE_CANDIDATE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section1-san-transition-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_BASE_SHA: 5d22793c9908831b144b3c62394424f8231738fe
  INPUT_LIMITS_BLOB: 11972e4b4a949b9e6a8075b62656a9fa6d299ea6
  NOTATION_BLOB: eed13c31993fa9979b6a2cbd608cce63c1ce74df
  CHESSCORE_BLOB: a15d8845e3c58f2d8f6defcdfe9f9bcf0e5da674
  CONTRACT_TEST_BLOB: 22e493307ac650d14f7fa7300d80cffcd100f36b
  FEN_CORPUS_QUALIFIER_BLOB: 9334f8d02093895fe7eb65719bd2a5f39a0c6ab9
  FEN_CORPUS_TEST_BLOB: 2502e8b8bfdf9db5b5ebb3ecb8ab62a1a2f23367
  P0F_PROVENANCE_BLOB: 3298aed00ca000d27f607cd861abbba9483ff358
  P0F_BUILDER_BLOB: b7b96a661652a17cb16e8ca4cabba3b8b373e483
  PINNED_CORPUS_SHA256: aa40b3671fa3cf1072eb182892cd90b0e1e003a4a5943492f64b77e7f3fd1635
  CLOSURE_DOC_BLOB: e619d2ae53981a4852d944ce2ec4bb858c654ec8

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact child geometry
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$EXPECTED_BASE_SHA"
          fi
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/section1-san-transition-contract.yml' \
            'acs/chesscore.py' \
            'acs/input_limits.py' \
            'acs/notation.py' \
            'docs/automation/SECTION1_CLOSURE_CANDIDATE.md' \
            'tests/test_section1_san_transition_contract.py' | sort)"
          test "$changed" = "$expected"

      - name: Bind exact SAN authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/input_limits.py)" = "$INPUT_LIMITS_BLOB"
          test "$(git rev-parse HEAD:acs/notation.py)" = "$NOTATION_BLOB"
          test "$(git rev-parse HEAD:acs/chesscore.py)" = "$CHESSCORE_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_san_transition_contract.py)" = "$CONTRACT_TEST_BLOB"
          test "$(git rev-parse HEAD:tools/qualify_fen_position_corpus.py)" = "$FEN_CORPUS_QUALIFIER_BLOB"
          test "$(git rev-parse HEAD:tests/test_qualify_fen_position_corpus.py)" = "$FEN_CORPUS_TEST_BLOB"
          test "$(git rev-parse HEAD:docs/automation/SECTION1_CLOSURE_CANDIDATE.md)" = "$CLOSURE_DOC_BLOB"

      - name: Compile Section 1 SAN slice
        run: >-
          python -m py_compile
          acs/input_limits.py
          acs/notation.py
          acs/chesscore.py
          tests/test_section1_san_transition_contract.py

      - name: Execute SAN and transition contracts
        run: >-
          python -m unittest -v
          tests.test_section1_san_transition_contract
          tests.test_notation
          tests.test_qualify_fen_position_corpus
          tests.test_fen_position_editor_complete_user_flow

      - name: Core chess selftest
        run: python -m acs.selftest

  lawful-fen-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Bind lawful corpus authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:docs/P0F_STARTER_CONTENT_PROVENANCE.md)" = "$P0F_PROVENANCE_BLOB"
          test "$(git rev-parse HEAD:tools/p0f_lawful_starter_bundle.py)" = "$P0F_BUILDER_BLOB"
          test "$(git rev-parse HEAD:tools/qualify_fen_position_corpus.py)" = "$FEN_CORPUS_QUALIFIER_BLOB"
          test "$(git rev-parse HEAD:tests/test_qualify_fen_position_corpus.py)" = "$FEN_CORPUS_TEST_BLOB"

      - name: Install qualified corpus decompressor
        run: python -m pip install -q zstandard==0.23.0

      - name: Build pinned CC0 real-game sample
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/p0f_lawful_starter_bundle.py .fen-lawful

      - name: Bind produced sample to CC0 provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(".fen-lawful")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          source = manifest["starter_source"]
          starter = root / "starter_uk.pgn"
          entry = manifest["files"]["starter_uk.pgn"]
          digest = hashlib.sha256(starter.read_bytes()).hexdigest()

          assert source["compressed_sha256"] == os.environ["PINNED_CORPUS_SHA256"]
          assert source["license_id"] == "CC0-1.0"
          assert int(source["selected_games"]) >= 200
          assert entry["license_id"] == "CC0-1.0"
          assert entry["sha256"] == digest
          print("LAWFUL_FEN_CORPUS_PROVENANCE=PASS")
          PY

      - name: Qualify real FEN Position corpus
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/qualify_fen_position_corpus.py \
            .fen-lawful/starter_uk.pgn \
            --min-games 200 \
            --min-positions 5000 \
            --require-edge-coverage \
            --json-out .fen-lawful/fen_position_qualification.json
