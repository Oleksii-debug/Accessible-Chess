name: Classroom Pairing Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/classroom_pairing.py'
      - 'tests/test_classroom_pairing.py'
      - '.github/workflows/classroom-pairing-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-pairing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pairing-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact classroom-pairing scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-pairing-contract.yml'
            'acs/classroom_pairing.py'
            'tests/test_classroom_pairing.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected classroom-pairing PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'CLASSROOM_PAIRING_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile classroom-pairing boundary
        run: >-
          python -m py_compile
          acs/classroom_pairing.py
          tests/test_classroom_pairing.py

      - name: Run pairing and adjacent teaching/education contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_pairing
          tests.test_teaching_session
          tests.test_education_records
          tests.test_education_records_store
