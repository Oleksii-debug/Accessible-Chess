name: W6 V2 Package Preflight Current-Base Intake

on:
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907
    paths:
      - 'acs/version2_package_preflight.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/test_version2_package_preflight_hardening.py'
      - '.github/workflows/w6-v2-package-preflight-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w6-v2-package-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_V2_PARENT: 40e1ef2184177600bcc88911529b718adde65df9
  OWNER_PREFLIGHT_BLOB: ab038e5aa68600d1388a71604e9ef0e4221df4bc
  OWNER_TEST_BLOB: 88b8d94ffd1268a2126a5ea64744eeb7d03056a8
  OWNER_HARDENING_BLOB: 9547cad72a58fe556b9a3aee004c7a513c1b7bcc

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove current-base ancestry and bounded selective intake
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CURRENT_V2_PARENT" HEAD
          git diff --check "$CURRENT_V2_PARENT" HEAD
          changed="$(git diff --name-only "$CURRENT_V2_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/w6-v2-package-preflight-intake.yml' \
            'acs/version2_package_preflight.py' \
            'tests/test_version2_package_preflight.py' \
            'tests/test_version2_package_preflight_hardening.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/version2_package_preflight.py)" = "$OWNER_PREFLIGHT_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_package_preflight.py)" = "$OWNER_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_package_preflight_hardening.py)" = "$OWNER_HARDENING_BLOB"
          echo 'CURRENT-BASE + BYTE-IDENTICAL OWNER INTAKE PASS'

      - name: Compile package and current release dependencies
        run: >-
          python -m compileall -q
          acs/version2_package_preflight.py
          acs/version2_upgrade.py
          acs/acsdb.py
          acs/settings.py
          tests/test_version2_package_preflight.py
          tests/test_version2_package_preflight_hardening.py

      - name: V2 package tree and ZIP fail-closed regressions
        run: >-
          python -m unittest -v
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening

      - name: Current schema identity smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from acs.acsdb import ACSDB_SCHEMA_VERSION
          from acs.settings import SCHEMA_VERSION
          from acs.version2_package_preflight import V2_PACKAGE_MANIFEST_SCHEMA_VERSION, V2_PACKAGE_PROFILE
          from acs.version2_upgrade import UPGRADE_JOURNAL_SCHEMA_VERSION
          assert type(ACSDB_SCHEMA_VERSION) is int and ACSDB_SCHEMA_VERSION > 0
          assert type(SCHEMA_VERSION) is int and SCHEMA_VERSION > 0
          assert type(UPGRADE_JOURNAL_SCHEMA_VERSION) is int and UPGRADE_JOURNAL_SCHEMA_VERSION > 0
          assert V2_PACKAGE_MANIFEST_SCHEMA_VERSION == 1
          assert V2_PACKAGE_PROFILE == 'version2-default'
          print('CURRENT V2 PACKAGE SCHEMA IDENTITY PASS', ACSDB_SCHEMA_VERSION, SCHEMA_VERSION, UPGRADE_JOURNAL_SCHEMA_VERSION)
          PY

  broad:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q tests
      - name: Exact diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
