name: Classroom Pairing Contract

on:
  push:
    branches:
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - 'acs/classroom_pairing.py'
      - 'tests/test_classroom_pairing.py'
      - '.github/workflows/classroom-pairing-contract.yml'
  pull_request:
    paths:
      - 'acs/classroom_pairing.py'
      - 'tests/test_classroom_pairing.py'
      - '.github/workflows/classroom-pairing-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-pairing-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  pairing-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
      FOCUSED_BASE_REF: converge/books-training-owner-current-20261004-zftrkmo
      INTEGRATED_HEAD: 28751b45ccf57c700f1d37021839a22bed3ae61f
      SOURCE_BLOB: fee36f2029759d0c948c58cd3ca37ac20bbb0be4
      TEST_BLOB: dfe1e5aa3676b9ca966d3d93a60f98b554b8b281
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Prove pairing authority and focused scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git cat-file -e "$INTEGRATED_HEAD^{commit}"
          git merge-base --is-ancestor "$INTEGRATED_HEAD" HEAD
          test "$(git hash-object acs/classroom_pairing.py)" = "$SOURCE_BLOB"
          test "$(git hash-object tests/test_classroom_pairing.py)" = "$TEST_BLOB"
          if [ "${EVENT_BASE_REF:-}" = "$FOCUSED_BASE_REF" ]; then
            test -n "${EVENT_BASE_SHA:-}"
            git cat-file -e "$EVENT_BASE_SHA^{commit}"
            git diff --check "$EVENT_BASE_SHA" HEAD
            mapfile -t actual < <(git diff --name-only "$EVENT_BASE_SHA" HEAD | LC_ALL=C sort)
            expected=(
              '.github/workflows/classroom-pairing-contract.yml'
              'acs/classroom_pairing.py'
              'tests/test_classroom_pairing.py'
            )
            if [[ "${actual[*]}" != "${expected[*]}" ]]; then
              printf 'Unexpected classroom-pairing focused scope.\nExpected:\n'
              printf '  %s\n' "${expected[@]}"
              printf 'Actual:\n'
              printf '  %s\n' "${actual[@]}"
              exit 1
            fi
          fi
          echo 'CLASSROOM_PAIRING_AUTHORITY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile classroom-pairing boundary
        run: >-
          python -m py_compile
          acs/classroom_pairing.py
          tests/test_classroom_pairing.py

      - name: Run pairing and adjacent teaching/education contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_pairing
          tests.test_teaching_session
          tests.test_education_records
          tests.test_education_records_store

      - name: Run core selftest
        run: python -m acs.selftest
