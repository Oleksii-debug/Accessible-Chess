name: Bilingual Localization Contract

on:
  push:
    paths:
      - "web/index.html"
      - "acs/i18n.py"
      - "acs/ui_keymap_adapter.py"
      - "acs/ui_keymap_editor.py"
      - "acs/full_product_actions.py"
      - "acs/version2_profile.py"
      - "acs/version2_final_product_profile.py"
      - "acs/full_product_ui_shell.py"
      - "acs/full_product_native_menu.py"
      - "acs/library_webview_projection.py"
      - "acs/book_webview_projection.py"
      - "acs/training_webview_projection.py"
      - "acs/classroom_webview_projection.py"
      - "acs/education_webview_projection.py"
      - "tests/test_bilingual_localization_contract_current.py"
      - "docs/LOCALIZATION_POLICY.md"
      - ".github/workflows/bilingual-localization-current.yml"
  pull_request:
    paths:
      - "web/index.html"
      - "acs/i18n.py"
      - "acs/ui_keymap_adapter.py"
      - "acs/ui_keymap_editor.py"
      - "acs/full_product_actions.py"
      - "acs/version2_profile.py"
      - "acs/version2_final_product_profile.py"
      - "acs/full_product_ui_shell.py"
      - "acs/full_product_native_menu.py"
      - "acs/library_webview_projection.py"
      - "acs/book_webview_projection.py"
      - "acs/training_webview_projection.py"
      - "acs/classroom_webview_projection.py"
      - "acs/education_webview_projection.py"
      - "tests/test_bilingual_localization_contract_current.py"
      - "docs/LOCALIZATION_POLICY.md"
      - ".github/workflows/bilingual-localization-current.yml"

concurrency:
  group: bilingual-localization-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  localization:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Prove exact candidate identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile localization surfaces
        run: python -m compileall -q acs tests/test_bilingual_localization_contract_current.py
      - name: Run bilingual localization contract
        run: python -m unittest tests.test_bilingual_localization_contract_current -v
      - name: Run current language-owner regressions
        run: python -m unittest tests.test_stage1_localized_validation_current tests.test_w6_v2_language_owner_current tests.test_v2_native_dialog_language tests.test_v2_library_export_dialog_language -v
