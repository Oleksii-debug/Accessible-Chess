name: Current Runtime PGN Cancellation Successor

on:
  push:
    branches:
      - converge/current-runtime-pgn-cancel-successor-20261006-ooxple7
  pull_request:
    branches:
      - converge/current-runtime-atomicity-successor-20261006-sol56
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-runtime-pgn-cancel-successor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  BASE_BRANCH: converge/current-runtime-atomicity-successor-20261006-sol56
  BASE_SHA: e05ece81adf0eb384b4db3c18f225f7fc8b3bfbd
  SOURCE_BLOB: f28b413316c77ff4f6726d0a0a8fe8f5f6d47295
  OPEN_TEST_BLOB: 79e1c0056b0d62f3d429fef5428f31df1e45b2a2
  SAVE_TEST_BLOB: a9fb0eb40d8b48b75a900318db72ad62bb825b3e
  BOOKS_SOURCE_BLOB: 9c3bd18c3285544259e6c01c75661009387c9c87
  BOOKS_TEST_BLOB: 5e8796ed0d282de18121aef797de1285128fd5e4

jobs:
  runtime-pgn-cancel-successor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact runtime parent and bounded successor
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/runtime-parent"
          live_base="$(git rev-parse refs/remotes/origin/runtime-parent)"
          test "$live_base" = "$BASE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          git diff --check "$BASE_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-runtime-pgn-cancel-successor.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_pgn_open_worker.py"
            "tests/test_v2_windows_pgn_save_worker.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_save_worker.py)" = "$SAVE_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/book_board_workflow.py)" = "$BOOKS_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_board_workflow.py)" = "$BOOKS_TEST_BLOB"

      - name: Compile integrated Books and PGN runtime
        run: >-
          python -m py_compile
          acs/book_board_workflow.py
          acs/version2_windows_file_workflows.py
          tests/test_v2_book_board_workflow.py
          tests/test_v2_windows_pgn_open_worker.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Execute Books semantic and rollback authority
        run: >-
          python -m unittest -v
          tests.test_bookreader_revision_barriers_current
          tests.test_book_bidirectional_semantic_navigation
          tests.test_v2_book_board_workflow

      - name: Execute PGN persistence and cancellation authority
        run: >-
          python -m unittest -v
          tests.test_pgn_workspace
          tests.test_pgn_save_snapshot
          tests.test_pgn_document_passive_ingress
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_file_worker_preflight
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_pgn_open_invalid_session
          tests.test_v2_windows_nvda_file_workflows

      - name: Execute integrated Windows/application flow
        run: >-
          python -m unittest -v
          tests.test_v2_windows_host_runtime
          tests.test_version2_application
          tests.test_whole_product_user_journey

      - name: Core selftest
        run: python -m acs.selftest
