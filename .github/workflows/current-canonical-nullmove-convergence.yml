name: Current Canonical Null Move Convergence

on:
  pull_request:
    branches:
      - integration/book-library-warning-provenance-apex-20261004-sol6p3
    paths:
      - 'acs/chesscore.py'
      - 'acs/chessbase_decoder.py'
      - 'acs/webapp_keymap.py'
      - 'tests/test_current_canonical_nullmove_convergence.py'
      - '.github/workflows/current-canonical-nullmove-convergence.yml'

permissions:
  contents: read

concurrency:
  group: current-canonical-nullmove-convergence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact live-base ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          head='${{ github.event.pull_request.head.sha }}'
          event_base="$PR_BASE_SHA"
          base_ref="$PR_BASE_REF"
          test -n "$head"
          test -n "$event_base"
          test -n "$base_ref"
          test "$(git rev-parse HEAD)" = "$head"
          git cat-file -e "$event_base^{commit}"
          git fetch --no-tags origin "$base_ref"
          live_base="$(git rev-parse "origin/$base_ref")"
          git merge-base --is-ancestor "$event_base" "$live_base"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"

          # Fail closed if the three production preimages cease to be the
          # mechanically-proven #941 base blobs before this run executes.
          test "$(git rev-parse "$live_base:acs/chesscore.py")" = 'eb9229b5ee107afe06cdf8a916f466e1474dddd4'
          test "$(git rev-parse "$live_base:acs/chessbase_decoder.py")" = 'eb8ac2fae939d9efdb2330d4a1b01024d39ee101'
          test "$(git rev-parse "$live_base:acs/webapp_keymap.py")" = '39047e132f3347f85f190cd4589345f045b6c827'

          actual="$(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)"
          wanted="$(printf '%s\n' \
            '.github/workflows/current-canonical-nullmove-convergence.yml' \
            'acs/chessbase_decoder.py' \
            'acs/chesscore.py' \
            'acs/webapp_keymap.py' \
            'tests/test_current_canonical_nullmove_convergence.py' | LC_ALL=C sort)"
          test "$actual" = "$wanted"
          git diff --check "$live_base" HEAD

          # Null-move convergence must not mutate PGN/GameTree/Library/Books/package authorities.
          git diff --quiet "$live_base" HEAD -- \
            acs/gametree.py \
            acs/pgn_service.py \
            acs/acsdb.py \
            acs/library_import_service.py \
            acs/version2_application.py \
            acs/version2_release_app.py \
            acs/version2_package_preflight.py

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Compile owned canonical-null seam
        run: >-
          python -m py_compile
          acs/chesscore.py
          acs/chessbase_decoder.py
          acs/webapp_keymap.py
          tests/test_current_canonical_nullmove_convergence.py

      - name: Run canonical null-move and adjacent format regressions
        run: >-
          python -m unittest -v
          tests.test_current_canonical_nullmove_convergence
          tests.test_chessbase_decoder
          tests.test_chessbase_adapter
          tests.test_gametree

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
