name: Multiplayer Coordination Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/multiplayer_coordination.py'
      - 'tests/test_multiplayer_coordination.py'
      - '.github/workflows/multiplayer-coordination-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplayer-coordination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact multiplayer scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/multiplayer-coordination-contract.yml'
            'acs/multiplayer_coordination.py'
            'tests/test_multiplayer_coordination.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected multiplayer PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'MULTIPLAYER_COORDINATION_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile multiplayer contract
        run: >-
          python -m py_compile
          acs/multiplayer_coordination.py
          tests/test_multiplayer_coordination.py

      - name: Run multiplayer and canonical dependency contracts
        run: >-
          python -m unittest -v
          tests.test_multiplayer_coordination
          tests.test_clock_service
          tests.test_game_lifecycle
