name: D01 Library Workspace UI Integration

on:
  pull_request:
    paths:
      - 'acs/full_product_ui_shell.py'
      - 'acs/library_webview_bridge.py'
      - 'acs/library_webview_projection.py'
      - 'tests/test_dev1_full_product_accessible_shell.py'
      - 'tests/test_dev1_full_product_ui_packages.py'
      - 'tests/test_dev1_library_webview_projection.py'
      - 'tests/test_library_workspace_ui_integration.py'
      - 'web/full_product_library.js'
      - '.github/workflows/d01-library-workspace-ui-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d01-library-workspace-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      WHOLE_PRODUCT_BASE: e809ad24b42b36e697163f5f9fc7976589955406
      LIBRARY_UI_FEATURE: 99d85730410e2d4ae18cabc724ee1d313a5231c0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact ancestry and D01 presentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "$LIBRARY_UI_FEATURE"
          test "$(git rev-list --count "$WHOLE_PRODUCT_BASE"..HEAD)" = "3"
          git merge-base --is-ancestor "$WHOLE_PRODUCT_BASE" HEAD
          git diff --check "$WHOLE_PRODUCT_BASE" HEAD
          changed="$(git diff --name-only "$WHOLE_PRODUCT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d01-library-workspace-ui-integration.yml' \
            'acs/full_product_ui_shell.py' \
            'acs/library_webview_bridge.py' \
            'acs/library_webview_projection.py' \
            'tests/test_dev1_full_product_accessible_shell.py' \
            'tests/test_dev1_full_product_ui_packages.py' \
            'tests/test_dev1_library_webview_projection.py' \
            'tests/test_library_workspace_ui_integration.py' \
            'web/full_product_library.js' | sort)"
          test "$changed" = "$expected"

      - name: Lock canonical backend and Stage 1 authority
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/chesscore.py=eb9229b5ee107afe06cdf8a916f466e1474dddd4
          acs/engine.py=01324ff735908dcc2b6515310eef9cbc8572e7ef
          acs/gametree.py=03f5a42956f60dfb7928974084053847bdab5ae5
          acs/acsdb.py=3d7d31b4421990815a8d2f10367f6ff84e9bcd67
          acs/library_import_service.py=66db6d6df17e047a221b2bff06686e5503ca1b8c
          acs/search_policy.py=b5e7c5a569992bb271c72c851775a52b23dfe378
          acs/search_service.py=69d223b375af83e60bc099e1c7c8efe104738644
          web/index.html=17803443a815843be3aa1b8c6be1c5abb7e7c888
          LOCKS
          git diff --quiet "$WHOLE_PRODUCT_BASE" HEAD -- \
            acs/acsdb.py \
            acs/chesscore.py \
            acs/engine.py \
            acs/gametree.py \
            acs/library_import_service.py \
            acs/pgn_service.py \
            acs/search_policy.py \
            acs/search_service.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py \
            web/index.html \
            run_accessible_chess.py

      - name: Lock Library presentation blobs
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/full_product_ui_shell.py=4745468f0939bdf02a4df215eda36f3de4010280
          acs/library_webview_bridge.py=9f54c642f7fa6ce7c7dda6b4a47368770aa37170
          acs/library_webview_projection.py=f9f7b49af141b7485353fd110499ff804d01d974
          tests/test_dev1_full_product_accessible_shell.py=3f3ad76ae99b25a6b2becb83539916186b681cee
          tests/test_dev1_full_product_ui_packages.py=5a8e69981138c8962171232a5338a5ccce94141e
          tests/test_dev1_library_webview_projection.py=26f2138c232358dac837beb253a76121782cde35
          tests/test_library_workspace_ui_integration.py=22c409f83a90ca8540faa1c9c0b3225dd2f5a23b
          web/full_product_library.js=2d732afc80b213693e9ae3cd80781237ff56a41f
          LOCKS

      - name: Compile Python and JavaScript presentation package
        run: >-
          python -m compileall -q
          acs/full_product_ui_shell.py
          acs/library_webview_bridge.py
          acs/library_webview_projection.py
          tests/test_dev1_library_webview_projection.py
          tests/test_library_workspace_ui_integration.py

      - name: Validate Library renderer JavaScript
        run: node --check web/full_product_library.js

      - name: Accessible Library UI and real ACSDB integration
        run: >-
          python -m unittest -v
          tests.test_library_workspace_ui_integration
          tests.test_dev1_library_webview_projection
          tests.test_dev1_full_product_accessible_shell
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_full_product_webview_adapter
          tests.test_search_service
          tests.test_d07_search_scalar_equivalence
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_library_search_cancellation
          tests.test_d07_library_import_service

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
