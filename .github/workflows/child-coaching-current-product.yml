name: Child coaching current-product contract

on:
  pull_request:
    paths:
      - "acs/child_coaching.py"
      - "acs/child_coaching_store.py"
      - "acs/child_coaching_application.py"
      - "acs/child_coaching_projection.py"
      - "acs/child_coaching_prepared_positions.py"
      - "acs/child_coaching_rotation.py"
      - "acs/child_coaching_rotation_store.py"
      - "tests/test_child_coaching.py"
      - "tests/test_child_coaching_application.py"
      - "tests/test_child_coaching_projection.py"
      - "tests/test_child_coaching_prepared_positions.py"
      - "tests/test_child_coaching_rotation.py"
      - "acs/teaching_session.py"
      - "acs/interaction_contracts.py"
      - ".github/workflows/child-coaching-current-product.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: child-coaching-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove current Product ancestry and exact child-coaching scope
        shell: bash
        env:
          PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PRODUCT_BRANCH"
          product_ref="origin/$PRODUCT_BRANCH"
          git merge-base --is-ancestor "$product_ref" HEAD || {
            echo "Child-coaching head is stale relative to current Full Product." >&2
            exit 1
          }
          changed="$(git diff --name-only "$product_ref...HEAD" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/child-coaching-current-product.yml' \
            'acs/child_coaching.py' \
            'acs/child_coaching_application.py' \
            'acs/child_coaching_prepared_positions.py' \
            'acs/child_coaching_projection.py' \
            'acs/child_coaching_rotation.py' \
            'acs/child_coaching_rotation_store.py' \
            'acs/child_coaching_store.py' \
            'tests/test_child_coaching.py' \
            'tests/test_child_coaching_application.py' \
            'tests/test_child_coaching_prepared_positions.py' \
            'tests/test_child_coaching_projection.py' \
            'tests/test_child_coaching_rotation.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected child-coaching scope:\n%s\n' "$changed" >&2
            exit 1
          }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile current child-coaching modules
        run: python -m py_compile acs/child_coaching.py acs/child_coaching_store.py acs/child_coaching_application.py acs/child_coaching_projection.py acs/child_coaching_prepared_positions.py acs/child_coaching_rotation.py acs/child_coaching_rotation_store.py
      - name: Run child-coaching contract tests
        run: python -m unittest -v tests.test_child_coaching tests.test_child_coaching_application tests.test_child_coaching_projection tests.test_child_coaching_prepared_positions tests.test_child_coaching_rotation
      - name: Run adjacent canonical teaching-session regressions
        run: python -m unittest -v tests.test_teaching_session
      - name: Run final-product teaching composition regressions
        run: python -m unittest -v tests.test_version2_teacher_session_runtime_binding tests.test_version2_final_product_composition
