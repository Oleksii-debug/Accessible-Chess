name: Current Final Product Announcement Localization

on:
  pull_request:
    branches:
      - converge/current-book-progress-snapshot-passive-20261004-c2mbezb
    paths:
      - 'web/p0_accessibility_runtime.js'
      - 'tests/js/p0_generic_failure_localization_test.js'
      - 'tests/test_final_product_announcement_localization_current.py'
      - 'tests/test_p0_semantic_document_copy.py'
      - '.github/workflows/current-final-product-announcement-localization.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-final-product-announcement-localization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-book-progress-snapshot-passive-20261004-c2mbezb}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-final-product-announcement-localization.yml' \
            'tests/js/p0_generic_failure_localization_test.js' \
            'tests/test_final_product_announcement_localization_current.py' \
            'web/p0_accessibility_runtime.js' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected announcement-localization scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile focused Python regression
        run: python -m py_compile tests/test_final_product_announcement_localization_current.py

      - name: Check focused JavaScript surfaces
        run: >-
          node --check web/p0_accessibility_runtime.js &&
          node --check web/stage1_board_actions.js &&
          node --check tests/js/p0_generic_failure_localization_test.js

      - name: Execute canonical P0 generic failure localization
        run: node tests/js/p0_generic_failure_localization_test.js

      - name: Run localization and retained accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_final_product_announcement_localization_current
          tests.test_p0_semantic_document_copy
          tests.test_stage1_localized_validation_current
          tests.test_dev1_books_training_webview_projection

      - name: Core selftest
        run: python -m acs.selftest
