name: V2 Product Render Transaction

on:
  push:
    branches:
      - fix/v2-product-render-transaction-20261004
  pull_request:
    branches:
      - fix/books-training-public-render-boundary-20261004
    paths:
      - 'web/version2_release_bootstrap.js'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - '.github/workflows/v2-product-render-transaction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-product-render-transaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and transactional-render scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='b9df4f1d9df28bd67443d359d0ea08d0c28fe076'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/books-training-public-render-boundary-20261004'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/v2-product-render-transaction.yml'             'tests/js/version2_release_bootstrap_dom_test.js'             'web/version2_release_bootstrap.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = "3eb4c563188934a5214be978945c54f901bf1078"
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = "27cdc691a98ab2c7c43a7dbf4a100df3ef12c7a5"

          echo 'V2_PRODUCT_RENDER_TRANSACTION_SCOPE=PASS'

      - name: Validate release JavaScript transactions
        run: |
          node --check web/version2_release_bootstrap.js
          node --check web/full_product_books_training.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Adjacent release and Books/Training regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_accessibility_contract
          tests.test_version2_book_board_refresh_focus_order_evidence
          tests.test_dev1_books_training_webview_bridge
          tests.test_dev1_books_training_webview_projection
          tests.test_version2_application
          tests.test_v2_book_training_route_rollback

      - name: Core selftest
        run: python -m acs.selftest
