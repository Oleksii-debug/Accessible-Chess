name: V2 Release SPDX SBOM

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_release_sbom.py'
      - 'scripts/write_version2_release_sbom.py'
      - 'tests/test_version2_release_sbom.py'
      - '.github/workflows/version2-release-spdx-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-release-spdx-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact candidate identity and bounded SBOM scope
        if: github.event_name == 'pull_request'
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          import os
          from pathlib import Path
          import subprocess

          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          expected = os.environ["EXPECTED_HEAD"]
          if actual != expected:
              raise SystemExit(f"checked out {actual}, expected PR head {expected}")

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{os.environ['BASE_SHA']}...HEAD"],
                  text=True,
              ).splitlines()
          )
          allowed = {
              ".github/workflows/version2-release-spdx-sbom.yml",
              "acs/version2_release_sbom.py",
              "scripts/write_version2_release_sbom.py",
              "tests/test_version2_release_sbom.py",
          }
          foreign = sorted(changed - allowed)
          if foreign:
              raise SystemExit("foreign SBOM PR paths: " + ", ".join(foreign))
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit("missing declared SBOM PR paths: " + ", ".join(missing))
          print("V2_RELEASE_SBOM_EXACT_HEAD_SCOPE=PASS")
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile SBOM source and release entrypoint
        run: python -m py_compile acs/version2_release_sbom.py scripts/write_version2_release_sbom.py
      - name: Run deterministic SPDX SBOM contract
        run: python -m unittest -v tests.test_version2_release_sbom
