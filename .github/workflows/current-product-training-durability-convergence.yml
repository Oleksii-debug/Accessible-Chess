name: Current Product Training Durability Convergence

on:
  pull_request:
    branches:
      - converge/current-product-windows-evidence-20261005-zftrkmo
  push:
    branches:
      - converge/current-product-training-durability-evidence-20261005-zftrkmo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-training-durability-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked convergence
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: converge/current-product-windows-evidence-20261005-zftrkmo
          BASE_HEAD: 7ad12171aeaca62fda0377a103e16a20ed8ec589
          SOURCE_REF: fix/training-progress-ci-head-concurrency-20261005-sol56k7m3
          SOURCE_HEAD: 9b2dceeb2ca6ebcea9cb558dfd2b9495b1e758e5
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.base.ref }}" = "$BASE_REF"
            git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
            live_pr="$(git rev-parse FETCH_HEAD)"
            test "$live_pr" = "$EXPECTED_HEAD" || {
              printf 'TRAINING_DURABILITY_CANDIDATE_SUPERSEDED event=%s live=%s\n' "$EXPECTED_HEAD" "$live_pr" >&2
              exit 1
            }
          fi
          git fetch --no-tags origin "refs/heads/$BASE_REF"
          live_base="$(git rev-parse FETCH_HEAD)"
          test "$live_base" = "$BASE_HEAD" || {
            printf 'TRAINING_DURABILITY_BASE_MOVED expected=%s live=%s\n' "$BASE_HEAD" "$live_base" >&2
            exit 1
          }
          git fetch --no-tags origin "refs/heads/$SOURCE_REF"
          live_source="$(git rev-parse FETCH_HEAD)"
          test "$live_source" = "$SOURCE_HEAD" || {
            printf 'TRAINING_DURABILITY_SOURCE_MOVED expected=%s live=%s\n' "$SOURCE_HEAD" "$live_source" >&2
            exit 1
          }
          test "$(git show -s --format=%P HEAD)" = "$BASE_HEAD $SOURCE_HEAD"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          git merge-base --is-ancestor "$SOURCE_HEAD" HEAD
          changed="$(git diff --name-only "$BASE_HEAD"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/current-product-training-durability-convergence.yml' '.github/workflows/training-progress-durability.yml' 'tests/test_current_product_training_durability_convergence_20261005.py' 'tests/test_training_progress_durability_concurrency.py' | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check "$BASE_HEAD"...HEAD
          test "$(git rev-parse HEAD:tests/test_training_progress_durability_concurrency.py)" = '654ba36fa67a9e5285d331e2b4d777814e54c1bf'
          test "$(git rev-parse HEAD:acs/report_paths.py)" = 'fafc8696a846a1b9c96a8ce89a76ce82593fd582'
          echo 'CURRENT_PRODUCT_TRAINING_DURABILITY_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Training durability integration
        run: >-
          python -m py_compile
          acs/training_progress_store.py
          acs/version2_training_workspace.py
          tests/test_w2_training_progress_crash_recovery.py
          tests/test_training_authority_convergence.py
          tests/test_training_progress_ancestor_authority.py
          tests/test_training_progress_durability_concurrency.py
          tests/test_current_product_training_durability_convergence_20261005.py

      - name: Execute Training durability and retained recovery contracts
        run: >-
          python -m unittest -v
          tests.test_current_product_training_durability_convergence_20261005
          tests.test_training_progress_durability_concurrency
          tests.test_w2_training_progress_crash_recovery
          tests.test_training_authority_convergence
          tests.test_training_progress_ancestor_authority
          tests.test_local_profile_recursion_boundary
          tests.test_d06_v2_gametree_resume_discard_guard

      - name: Whole-product smoke
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
