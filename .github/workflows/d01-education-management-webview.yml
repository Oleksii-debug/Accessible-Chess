name: D01 Education Management WebView

on:
  pull_request:
    paths:
      - 'acs/education_webview_bridge.py'
      - 'acs/education_webview_projection.py'
      - 'acs/version2_education_mutation_application.py'
      - 'acs/version2_final_product_profile.py'
      - 'tests/js/education_surface_dom_test.js'
      - 'tests/test_education_webview_bridge.py'
      - 'tests/test_education_webview_projection.py'
      - 'tests/test_version2_education_class_create.py'
      - 'web/full_product_education.js'
      - '.github/workflows/d01-education-management-webview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d01-education-management-webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained Education authority and current PR hygiene
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}" || git fetch --no-tags origin "$base"
          education_owner="e5ac1982423c87c42c359726c37707f3fccffac5"
          git cat-file -e "${education_owner}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$education_owner" HEAD
          git diff --check "$base" HEAD

          for path in \
            acs/education_webview_bridge.py \
            acs/education_webview_projection.py \
            tests/test_education_webview_bridge.py \
            tests/test_education_webview_projection.py
          do
            test "$(git rev-parse "HEAD:${path}")" = "$(git rev-parse "${education_owner}:${path}")" || {
              printf 'Retained Education owner blob drift: %s\n' "$path" >&2
              exit 1
            }
          done
          printf 'Education retained authority PASS: owner=%s base=%s\n' "$education_owner" "$base"

      - name: Compile Education current composition
        run: >-
          python -m compileall -q
          acs/education_webview_bridge.py
          acs/education_webview_projection.py
          acs/version2_education_mutation_application.py
          acs/version2_final_product_profile.py
          tests/test_education_webview_bridge.py
          tests/test_education_webview_projection.py
          tests/test_version2_education_class_create.py

      - name: Parse browser asset and run executable DOM contract
        run: |
          node --check web/full_product_education.js
          node tests/js/education_surface_dom_test.js

      - name: Education current composition focused tests
        run: >-
          python -m pytest -q
          tests/test_education_webview_projection.py
          tests/test_education_webview_bridge.py
          tests/test_version2_education_class_create.py
          tests/test_version2_final_product_composition.py
          tests/test_education_workspace.py
          tests/test_education_classroom_integration.py

      - name: Final-product production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest on Windows
        if: matrix.os == 'windows-2025'
        run: python -m pytest -q tests

      - name: Core selftest
        run: python -m acs.selftest
