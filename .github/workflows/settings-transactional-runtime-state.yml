name: Settings Transactional Runtime State

on:
  push:
    branches:
      - fix/settings-transactional-memory-state-20261004
  pull_request:
    branches:
      - fix/v2-upgrade-lock-continuity-20261004
    paths:
      - 'acs/settings.py'
      - 'tests/test_settings.py'
      - '.github/workflows/settings-transactional-runtime-state.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-transactional-runtime-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact parent and Settings runtime scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='ccafbccb65db0ae0143ac809f30ab23d4337798e'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/v2-upgrade-lock-continuity-20261004'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/settings-transactional-runtime-state.yml'             'acs/settings.py'             'tests/test_settings.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/settings.py)" = "6a2499739ec2df0483ee58694002392cb6ab8784"
          test "$(git rev-parse HEAD:tests/test_settings.py)" = "de0cd384fd6409038e65b6412067a01cd7c9e6ce"

          echo 'SETTINGS_TRANSACTIONAL_RUNTIME_SCOPE=PASS'

      - name: Compile Settings surfaces
        run: >-
          python -m compileall -q
          acs/settings.py
          tests/test_settings.py

      - name: Settings and upgrade-coordination regressions
        run: >-
          python -m unittest -v
          tests.test_settings
          tests.test_v2_upgrade_tracked_writer_conflict
          tests.test_v2_upgrade_publish_race_audit

      - name: Core selftest
        run: python -m acs.selftest
