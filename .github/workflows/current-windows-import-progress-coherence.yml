name: Current Windows Import Progress Coherence

on:
  push:
    branches:
      - fix/windows-import-progress-coherence-20261006-hy6ez0h
  pull_request:
    branches:
      - fix/windows-import-observer-detached-snapshots-20261006-hy6ez0h
    paths:
      - acs/version2_windows_file_workflows.py
      - tests/test_v2_windows_import_progress_coherence.py
      - tests/test_v2_windows_file_worker_shutdown_fence.py
      - .github/workflows/current-windows-import-progress-coherence.yml

permissions:
  contents: read

concurrency:
  group: current-windows-import-progress-coherence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: cf0c427070f52ac5520e7bea74472d46f317ec8d
  PARENT_BRANCH: fix/windows-import-observer-detached-snapshots-20261006-hy6ez0h
  EXPECTED_WINDOWS_FILE_SOURCE_BLOB: 6d4c7409931ff5448b5dbd834863286c4c4c00cb
  EXPECTED_TRACE_TEST_BLOB: 3df204688c9c73c195f65d5ae12f2e79612f1fed
  EXPECTED_SHUTDOWN_TEST_BLOB: 406ccb754880af5f55e3046e0eadcf759027064b
  EXPECTED_OBSERVER_SOURCE_BLOB: d9b4885aa964f7a83d28872e5ebc81eeeabb9107
  EXPECTED_OBSERVER_TEST_BLOB: 806ee1c9ffcfceb3248a52ee2703612874137d49

jobs:
  progress-coherence:
    name: Import progress coherence / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact progress-coherence child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/progress-coherence-parent"
          live_parent="$(git rev-parse refs/remotes/origin/progress-coherence-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "IMPORT_PROGRESS_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-import-progress-coherence.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_file_worker_shutdown_fence.py"
            "tests/test_v2_windows_import_progress_coherence.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_WINDOWS_FILE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_import_progress_coherence.py)" = "$EXPECTED_TRACE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_file_worker_shutdown_fence.py)" = "$EXPECTED_SHUTDOWN_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_library_import_observer.py)" = "$EXPECTED_OBSERVER_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_library_import_observer.py)" = "$EXPECTED_OBSERVER_TEST_BLOB"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile current import stack
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          acs/version2_windows_library_import_observer.py
          tests/test_v2_windows_import_progress_coherence.py
          tests/test_v2_windows_file_worker_shutdown_fence.py
          tests/test_v2_windows_library_import_observer.py
          tests/test_v2_windows_nvda_file_workflows.py
          tests/test_chessbase_library_import_report_passive.py

      - name: Run trace, observer, ChessBase and NVDA regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_import_progress_coherence
          tests.test_v2_windows_library_import_observer
          tests.test_chessbase_library_import_report_passive
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
