name: V2 Windows Library Source Catalog Current Full Product

on:
  push:
    branches:
      - work/v2-windows-library-source-catalog-d07-current-20260910
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_windows_library_source_catalog.py'
      - 'tests/test_v2_windows_library_source_catalog.py'
      - '.github/workflows/v2-windows-library-source-catalog-d07-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-library-source-catalog-current-full-product-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_CATALOG_LINEAGE_ROOT: 4e80d8d51e230af67fbc7439262362e920d67daa
  UI_OWNER_SOURCE_BLOB: e04b754f9a0729a987562d4784ffde0f92b6ed0d
  UI_OWNER_TEST_BLOB: ebb410e4b949a5d6977fe53b03092cd1de722c9b
  D07_SOURCE_SERVICE_BLOB: bb848b9cfc7eb643630143833be52075fca3e165
  D07_ACSDB_BLOB: f5dd56e017c09aa8bf2ba3aa66c0658f8a229e74
  D07_SEARCH_BLOB: 98466d081fb4c77d52029963c2f295e5f022dd07
  D07_IMPORT_BLOB: 60aeb06516689bd81686606da83cf00c79327d96

jobs:
  source-catalog-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact live Full Product child and Source Catalog provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 3
          PRODUCT_HEAD="$(git rev-parse HEAD^1)"
          PREVIOUS_575_HEAD="$(git rev-parse HEAD^2)"
          LIVE_CANONICAL="$(git ls-remote origin 'refs/heads/work/full-product-teacher-education-reachability-20260911' | awk 'NR == 1 {print $1}')"
          test -n "$LIVE_CANONICAL"
          test "$PRODUCT_HEAD" = "$LIVE_CANONICAL"
          test "$(git merge-base HEAD "$PRODUCT_HEAD")" = "$PRODUCT_HEAD"
          git merge-base --is-ancestor "$SOURCE_CATALOG_LINEAGE_ROOT" "$PREVIOUS_575_HEAD"
          test "$(git rev-parse "$PREVIOUS_575_HEAD:acs/version2_windows_library_source_catalog.py")" = "$UI_OWNER_SOURCE_BLOB"
          test "$(git rev-parse "$PREVIOUS_575_HEAD:tests/test_v2_windows_library_source_catalog.py")" = "$UI_OWNER_TEST_BLOB"
          git diff --check "$PRODUCT_HEAD" HEAD
          changed="$(git diff --name-only "$PRODUCT_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-library-source-catalog-d07-current.yml' \
            'acs/version2_windows_library_source_catalog.py' \
            'tests/test_v2_windows_library_source_catalog.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/version2_windows_library_source_catalog.py)" = "$UI_OWNER_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_library_source_catalog.py)" = "$UI_OWNER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/library_source_service.py)" = "$D07_SOURCE_SERVICE_BLOB"
          test "$(git rev-parse HEAD:acs/acsdb.py)" = "$D07_ACSDB_BLOB"
          test "$(git rev-parse HEAD:acs/search_service.py)" = "$D07_SEARCH_BLOB"
          test "$(git rev-parse HEAD:acs/library_import_service.py)" = "$D07_IMPORT_BLOB"
          git diff --quiet "$PRODUCT_HEAD" HEAD -- \
            acs/library_source_service.py \
            acs/acsdb.py \
            acs/search_service.py \
            acs/library_import_service.py \
            acs/library_webview_projection.py \
            acs/library_webview_bridge.py \
            acs/full_product_actions.py \
            acs/full_product_native_menu.py \
            run_accessible_chess_v2.py
          echo "PRODUCT_HEAD=$PRODUCT_HEAD" >> "$GITHUB_ENV"
          echo "PREVIOUS_575_HEAD=$PREVIOUS_575_HEAD" >> "$GITHUB_ENV"

      - name: Compile source-catalog presentation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            acs/version2_windows_library_source_catalog.py \
            tests/test_v2_windows_library_source_catalog.py

      - name: Focused Windows/NVDA source-catalog and current D07 contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_library_source_catalog
          tests.test_v2_library_source_catalog
          tests.test_d07_library_import_service
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence
          tests.test_acsdb

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_library_source_catalog.py
          tests/test_v2_library_source_catalog.py
          tests/test_d07_library_import_service.py
          tests/test_d07_library_search_cancellation.py
          tests/test_d07_search_semantic_equivalence.py
          tests/test_d07_search_scalar_equivalence.py
          tests/test_acsdb.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and current final-product diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic

      - name: Emit qualification identity
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCT_HEAD=$PRODUCT_HEAD"
          echo "PREVIOUS_575_HEAD=$PREVIOUS_575_HEAD"
          echo "QUALIFIED_HEAD=$(git rev-parse HEAD)"
          echo "PRODUCT_MUTATION=BOUNDED_SOURCE_CATALOG_PRESENTATION_ONLY"
          echo "HUMAN_TESTED=NO"
          echo "NVDA_VERIFIED=NO"
