name: Current Product Accessibility Formats Convergence

on:
  pull_request:
    paths:
      - '.github/workflows/current-product-accessibility-formats-convergence.yml'
      - '.github/workflows/current-books-keymap-semantic-convergence.yml'
      - '.github/workflows/current-product-diagnostic-dynamic-help-convergence.yml'
      - '.github/workflows/keybindings-current-apex-core.yml'
      - '.github/workflows/keybindings-current-apex-dom-native.yml'
      - '.github/workflows/webview-keymap-authority.yml'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - '.github/workflows/d01-teacher-classroom-webview.yml'
      - '.github/workflows/book-html-epub-pgn-collections.yml'
      - 'acs/keybindings.py'
      - 'acs/stage1_release_ui.py'
      - 'acs/webapp.py'
      - 'acs/full_product_actions.py'
      - 'acs/book_html_import.py'
      - 'acs/book_library_import.py'
      - 'acs/book_training.py'
      - 'acs/gametree_legality.py'
      - 'acs/import_contract.py'
      - 'acs/version2_windows_file_workflows.py'
      - 'web/index.html'
      - 'web/full_product_classroom.js'
      - 'web/full_product_pgn.js'
      - 'web/full_product_books_training.js'
      - 'tests/js/dynamic_keymap_help_test.js'
      - 'tests/js/classroom_surface_dom_test.js'
      - 'tests/js/pgn_remaining_keybindings_test.js'
      - 'tests/js/books_training_surface_dom_test.js'
      - 'tests/js/books_training_toolbar_keymap_convergence_test.js'
      - 'tests/test_current_books_keymap_semantic_convergence_workflow.py'
      - 'tests/test_keybindings.py'
      - 'tests/test_dynamic_keymap_help_contract.py'
      - 'tests/test_dev1_release_ui_regressions.py'
      - 'tests/test_pgn_tree_remaining_keybindings.py'
      - 'tests/test_book_html_inline_image_order.py'
      - 'tests/test_book_html_pgn_loss_accounting.py'
      - 'tests/test_book_library_import_journey.py'
      - 'tests/test_book_training_variant_authority.py'
      - 'tests/test_pgn_board_start_authority.py'
  push:
    branches:
      - 'converge/current-product-diagnostic-help-classroom-20261005-sol56m7k2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-accessibility-formats-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'CURRENT_PRODUCT_ACCESSIBILITY_FORMATS_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }
          echo 'CURRENT_PRODUCT_ACCESSIBILITY_FORMATS_EXACT_HEAD=PASS'

      - name: Prove serial source ancestry and exact scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRODUCT_BASE: bf418985e9e20dc3491db7e229a33052a399e1a6
          DIAGNOSTIC_HELP: 7baaaa5f6b90987b60b08595808b5ab2808141d4
          CLASSROOM_SOURCE: d901cb1ba880af2348b5f9ca0b700eb3b1c59b02
          CLASSROOM_MERGE: 0e5b5fbea520d2cc101cff01024d056483c40d98
          PGN_SOURCE: e55d4d2a0a4fe69170b8a80e600423f2a6f49175
          PGN_MERGE: 8e7dcdbeac453c31eb05474e07bbeecdfa6d6ded
          FORMATS_SOURCE: 34348e9be9e2c6286e33474ddfaf2137112ee1a3
          FORMATS_MERGE: c17941f4f58a8fbd9d88e0ad558d95e00d2e0bf3
          CURRENT_PRODUCT: 59486e2c9eff903e416d59a0e7c349c22ee2111d
          KEYMAP_SOURCE: fc4c6c85dbdf4e5d7c3798a6171a696b27f0472b
          BOOKS_SOURCE: 9b9f923639b27d4f4d674ff3e086298f1acb8491
          MERGED_BOOKS_RUNTIME_BLOB: a269a5771c87bb39837b0d78247fbe938da794c9
          SEMANTIC_BOOKS_DOM_BLOB: a1ce64e2ded06518f0e0c9f5e623bf78a8de1855
          TOOLBAR_CONVERGENCE_DOM_BLOB: fb92d3c0920d353faa5ab3641b80555709fdfe4b
          CURRENT_SHIPPING_BASE: integration/current-product-main-candidate-20261004-c2mbezb
          CURRENT_SHIPPING_BASE_SHA: 0a9e0db1663c04cf67fac2d249ba197fa22cde75
          ACTIVE_SHIPPING_BRANCH: integrate/current-product-to-shipping-20261005-sol56f8k2
          CURRENT_PRODUCT_BRANCH: converge/current-product-books-provider-20261005-ooxple7
          CURRENT_PRODUCT_SHA: 0c18ee1baa5bec8c9d75656597723bd94785df25
          PRODUCT_SHIPPING_MERGE: a22b06f4331a786f5df5f8f8182c24a48ac995be
          PRIOR_SHIPPING_HEAD: e77b8f1ee2b2a4e46e990c6117b348f8004880d1
          EXPANDED_PRODUCT_BRANCH: converge/current-product-books-formats-20261005-c2mbezb
          EXPANDED_MARKER: 211d985c3f0c780516d76ff13e650b521183e2f7
          EXPANDED_BOOK_BLOB: 9bc1594f1f5141dfa843f54755e670f392ba926d
          EXPANDED_MANIFEST_BLOB: 7a91103062b76b541d370ec3a3247974d5cd0b80
          EXPANDED_PROFILE_BLOB: 96d9b523a93a18eb4cc473ef0c87abee49d84512
          EXPANDED_WEB_BLOB: 04be6318d22acc83520dad17ecba53bac0c6029e
          MANIFEST_SOURCE_GATE: .github/workflows/current-portable-manifest-json-prehash-bounds.yml
          PORTABLE_GATE: .github/workflows/current-product-portable-integration-convergence.yml
          SHIPPING_GATE: .github/workflows/current-product-shipping-integration-20261005.yml
          SHIPPING_TEST: tests/test_current_product_shipping_integration_20261005.py
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          for commit in "$PRODUCT_BASE" "$DIAGNOSTIC_HELP" "$CLASSROOM_SOURCE" "$CLASSROOM_MERGE" "$PGN_SOURCE" "$PGN_MERGE" "$FORMATS_SOURCE" "$FORMATS_MERGE"; do
            git cat-file -e "$commit^{commit}"
            git merge-base --is-ancestor "$commit" HEAD
          done

          test "$(git rev-parse "$CLASSROOM_MERGE^1")" = "$DIAGNOSTIC_HELP"
          test "$(git rev-parse "$CLASSROOM_MERGE^2")" = "$CLASSROOM_SOURCE"
          test "$(git rev-parse "$PGN_MERGE^1")" = "$CLASSROOM_MERGE"
          test "$(git rev-parse "$PGN_MERGE^2")" = "$PGN_SOURCE"
          test "$(git rev-parse "$FORMATS_MERGE^1")" = "$PGN_MERGE"
          test "$(git rev-parse "$FORMATS_MERGE^2")" = "$FORMATS_SOURCE"
          test "$(git merge-base "$PRODUCT_BASE" HEAD)" = "$PRODUCT_BASE"
          git diff --check "$PRODUCT_BASE"...HEAD

          expected_paths="$(printf '%s\n' \
            '.github/workflows/book-html-epub-pgn-collections.yml' \
            '.github/workflows/current-product-accessibility-formats-convergence.yml' \
            '.github/workflows/current-product-diagnostic-dynamic-help-convergence.yml' \
            '.github/workflows/d01-pgn-workspace-webview.yml' \
            '.github/workflows/d01-teacher-classroom-webview.yml' \
            '.github/workflows/keybindings-current-apex-core.yml' \
            '.github/workflows/keybindings-current-apex-dom-native.yml' \
            '.github/workflows/webview-keymap-authority.yml' \
            'acs/book_html_import.py' \
            'acs/book_library_import.py' \
            'acs/book_training.py' \
            'acs/full_product_actions.py' \
            'acs/gametree_legality.py' \
            'acs/import_contract.py' \
            'acs/keybindings.py' \
            'acs/stage1_release_ui.py' \
            'acs/version2_windows_file_workflows.py' \
            'acs/webapp.py' \
            'tests/js/classroom_surface_dom_test.js' \
            'tests/js/dynamic_keymap_help_test.js' \
            'tests/js/pgn_remaining_keybindings_test.js' \
            'tests/test_book_html_inline_image_order.py' \
            'tests/test_book_html_pgn_loss_accounting.py' \
            'tests/test_book_library_import_journey.py' \
            'tests/test_book_training_variant_authority.py' \
            'tests/test_dev1_release_ui_regressions.py' \
            'tests/test_dynamic_keymap_help_contract.py' \
            'tests/test_keybindings.py' \
            'tests/test_pgn_board_start_authority.py' \
            'tests/test_pgn_tree_remaining_keybindings.py' \
            'web/full_product_classroom.js' \
            'web/full_product_pgn.js' \
            'web/index.html' | sort)"

          if [ "${EVENT_BASE_REF:-}" = "$CURRENT_SHIPPING_BASE" ]; then
            git fetch --no-tags origin "+refs/heads/$CURRENT_SHIPPING_BASE:refs/remotes/origin/$CURRENT_SHIPPING_BASE"
            live_shipping="$(git rev-parse "refs/remotes/origin/$CURRENT_SHIPPING_BASE")"
            test "$live_shipping" = "$CURRENT_SHIPPING_BASE_SHA"
            if [ -n "${EVENT_BASE_SHA:-}" ]; then
              test "$EVENT_BASE_SHA" = "$live_shipping"
            fi

            git fetch --no-tags origin "+refs/heads/$CURRENT_PRODUCT_BRANCH:refs/remotes/origin/$CURRENT_PRODUCT_BRANCH"
            live_current_product="$(git rev-parse "refs/remotes/origin/$CURRENT_PRODUCT_BRANCH")"
            test "$live_current_product" = "$CURRENT_PRODUCT_SHA"
            git merge-base --is-ancestor "$live_current_product" HEAD
            test "$(git merge-base "$live_shipping" "$live_current_product")" = "$live_shipping"
            git merge-base --is-ancestor "$PRODUCT_SHIPPING_MERGE" HEAD
            test "$(git show -s --format=%P "$PRODUCT_SHIPPING_MERGE")" = "$PRIOR_SHIPPING_HEAD $CURRENT_PRODUCT_SHA"
            git diff --check "$live_shipping"...HEAD

            product_paths="$(git diff --name-only "$live_shipping"..."$live_current_product" | sort)"
            product_count="$(printf '%s\n' "$product_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
            test "$product_count" -eq 199

            extra="$(git diff --name-only "$live_current_product"...HEAD | sort)"
            expected_extra="$(printf '%s\n' \
              '.github/workflows/current-product-accessibility-formats-convergence.yml' \
              "$MANIFEST_SOURCE_GATE" \
              "$PORTABLE_GATE" \
              "$SHIPPING_GATE" \
              "$SHIPPING_TEST" | sort)"
            test "$extra" = "$expected_extra" || {
              printf 'Unexpected shipping qualification delta in accessibility/formats gate.\n%s\n' "$extra" >&2
              exit 1
            }

            candidate_paths="$(git diff --name-only "$live_shipping"...HEAD | sort)"
            expected_candidate="$(printf '%s\n%s\n' "$product_paths" "$SHIPPING_GATE" "$SHIPPING_TEST" | sed '/^$/d' | sort -u)"
            test "$candidate_paths" = "$expected_candidate" || {
              printf 'Unexpected current shipping candidate scope in accessibility/formats gate.\n%s\n' "$candidate_paths" >&2
              exit 1
            }
            candidate_count="$(printf '%s\n' "$candidate_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
            test "$candidate_count" -eq 201
            echo 'CURRENT_PRODUCT_ACCESSIBILITY_FORMATS_TOPOLOGY=CURRENT_SHIPPING_INTEGRATION'
          elif git cat-file -e "$EXPANDED_MARKER^{commit}" 2>/dev/null && git merge-base --is-ancestor "$EXPANDED_MARKER" HEAD; then
            git merge-base --is-ancestor "$KEYMAP_SOURCE" HEAD
            git merge-base --is-ancestor "$BOOKS_SOURCE" HEAD
            test "$(git rev-parse HEAD:acs/book_game_content.py)" = "$EXPANDED_BOOK_BLOB"
            test "$(git rev-parse HEAD:acs/chessbase_manifest.py)" = "$EXPANDED_MANIFEST_BLOB"
            test "$(git rev-parse HEAD:acs/local_profile.py)" = "$EXPANDED_PROFILE_BLOB"
            test "$(git rev-parse HEAD:web/index.html)" = "$EXPANDED_WEB_BLOB"

            if [ "${EVENT_BASE_REF:-}" = "$ACTIVE_SHIPPING_BRANCH" ]; then
              git fetch --no-tags origin "+refs/heads/$EXPANDED_PRODUCT_BRANCH:refs/remotes/origin/$EXPANDED_PRODUCT_BRANCH"
              live_expanded="$(git rev-parse "refs/remotes/origin/$EXPANDED_PRODUCT_BRANCH")"
              test "$live_expanded" = "$(git rev-parse HEAD)" || {
                printf 'Expanded Product PR head is stale: live=%s head=%s\n' "$live_expanded" "$(git rev-parse HEAD)" >&2
                exit 1
              }
            fi

            echo 'CURRENT_PRODUCT_ACCESSIBILITY_FORMATS_TOPOLOGY=EXPANDED_PRODUCT'
          else
            changed="$(git diff --name-only "$PRODUCT_BASE"...HEAD | sort)"
            if [ "$changed" = "$expected_paths" ]; then
              echo 'CURRENT_PRODUCT_ACCESSIBILITY_FORMATS_TOPOLOGY=FOCUSED_SCOPE'
            else
              for commit in "$CURRENT_PRODUCT" "$KEYMAP_SOURCE" "$BOOKS_SOURCE"; do
                git cat-file -e "$commit^{commit}"
                git merge-base --is-ancestor "$commit" HEAD
              done
              test "$(git merge-base "$CURRENT_PRODUCT" HEAD)" = "$CURRENT_PRODUCT"

              successor_changed="$(git diff --name-only "$CURRENT_PRODUCT"...HEAD | sort)"
              successor_expected="$(
                {
                  git diff --name-only "$CURRENT_PRODUCT"..."$KEYMAP_SOURCE"
                  git diff --name-only "$CURRENT_PRODUCT"..."$BOOKS_SOURCE"
                  printf '%s\n' \
                    '.github/workflows/current-books-keymap-semantic-convergence.yml' \
                    'tests/js/books_training_toolbar_keymap_convergence_test.js' \
                    'tests/test_current_books_keymap_semantic_convergence_workflow.py'
                } | sort -u
              )"
              test "$successor_changed" = "$successor_expected" || {
                printf 'Unexpected combined Product successor scope.\nExpected:\n%s\nActual:\n%s\n' "$successor_expected" "$successor_changed" >&2
                exit 1
              }

              test "$(git rev-parse HEAD:web/full_product_books_training.js)" = "$MERGED_BOOKS_RUNTIME_BLOB"
              test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = "$SEMANTIC_BOOKS_DOM_BLOB"
              test "$(git rev-parse HEAD:tests/js/books_training_toolbar_keymap_convergence_test.js)" = "$TOOLBAR_CONVERGENCE_DOM_BLOB"
              echo 'CURRENT_PRODUCT_ACCESSIBILITY_FORMATS_TOPOLOGY=BOOKS_KEYMAP_SUCCESSOR'
            fi
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile current convergence boundaries
        run: >-
          python -m py_compile
          acs/keybindings.py
          acs/stage1_release_ui.py
          acs/webapp.py
          acs/full_product_actions.py
          acs/book_html_import.py
          acs/book_library_import.py
          acs/book_training.py
          acs/gametree_legality.py
          acs/import_contract.py
          acs/version2_windows_file_workflows.py
          tests/test_current_books_keymap_semantic_convergence_workflow.py
          tests/test_dynamic_keymap_help_contract.py
          tests/test_pgn_tree_remaining_keybindings.py
          tests/test_book_html_pgn_loss_accounting.py
          tests/test_book_library_import_journey.py
          tests/test_book_training_variant_authority.py
          tests/test_pgn_board_start_authority.py

      - name: Run browser accessibility and keymap contracts
        run: |
          node tests/js/dynamic_keymap_help_test.js
          node tests/js/classroom_surface_dom_test.js
          node tests/js/pgn_remaining_keybindings_test.js

      - name: Run focused Python convergence regressions
        run: >-
          python -m unittest -v
          tests.test_current_books_keymap_semantic_convergence_workflow
          tests.test_keybindings
          tests.test_dynamic_keymap_help_contract
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_unbound_shortcut_capture
          tests.test_pgn_tree_remaining_keybindings
          tests.test_book_html_inline_image_order
          tests.test_book_html_pgn_loss_accounting
          tests.test_book_library_import_journey
          tests.test_book_training_variant_authority
          tests.test_pgn_board_start_authority

      - name: Run current V2 diagnostic and core selftest
        run: |
          python run_accessible_chess_v2.py --diagnostic
          python -m acs.selftest
