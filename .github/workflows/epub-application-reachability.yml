name: EPUB Application Reachability

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/book_epub_import.py'
      - 'acs/version2_application.py'
      - 'acs/version2_windows_native_dialog_ownership.py'
      - 'tests/test_epub_application_reachability_workflow.py'
      - 'tests/test_v2_book_epub_import.py'
      - 'tests/test_v2_native_dialog_language.py'
      - 'tests/test_version2_epub_application_reachability.py'
      - '.github/workflows/epub-application-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epub-application-reachability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove current Product ancestry and protect EPUB authority
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          product_branch='work/full-product-teacher-education-reachability-20260911'
          git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
          product="$(git rev-parse "refs/remotes/origin/$product_branch")"

          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD

          # This workflow is inherited by later Product descendants that may
          # legitimately change shared application/dialog composition. Keep the
          # EPUB-exclusive parser authority byte-identical to current Product,
          # then re-run the semantic reachability suite against the descendant.
          protected_paths=(
            'acs/book_epub_import.py'
          )
          for path in "${protected_paths[@]}"; do
            product_blob="$(git rev-parse "$product:$path")"
            candidate_blob="$(git rev-parse "HEAD:$path")"
            test "$candidate_blob" = "$product_blob" || {
              printf 'EPUB authority drift requires a dedicated successor gate: %s product=%s candidate=%s\n' \
                "$path" "$product_blob" "$candidate_blob" >&2
              exit 1
            }
          done

          echo "EPUB_REACHABILITY_TOPOLOGY=CURRENT_FULL_PRODUCT_DESCENDANT"
          echo "EPUB_REACHABILITY_UPSTREAM=$product"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/book_epub_import.py
          acs/version2_application.py
          acs/version2_windows_native_dialog_ownership.py
          tests/test_epub_application_reachability_workflow.py
          tests/test_v2_book_epub_import.py
          tests/test_v2_native_dialog_language.py
          tests/test_version2_epub_application_reachability.py

      - name: Run EPUB reachability and adjacent semantic regressions
        run: >-
          python -m unittest -v
          tests.test_epub_application_reachability_workflow
          tests.test_version2_epub_application_reachability
          tests.test_v2_book_epub_import
          tests.test_v2_native_dialog_language
          tests.test_version2_application
          tests.test_bookreader
          tests.test_bookdocument
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Install pytest for repository pytest gate
        run: python -m pip install pytest==8.4.2

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
