name: Current PGN FEN Tag Bounds Apex

on:
  pull_request:
    branches:
      - converge/pgn-editing-books-fen-apex-20261006-zftrkmo121
    paths:
      - '.github/workflows/current-pgn-fen-tag-bounds-apex.yml'
      - 'acs/pgn_workspace.py'
      - 'acs/pgn_webview_bridge.py'
      - 'acs/pgn_workspace_webview_adapter.py'
      - 'tests/test_pgn_complete_editing_user_flow.py'
      - 'tests/test_dev1_pgn_workspace_webview_adapter.py'
      - 'tests/test_fen_editor_turn_and_visible_status.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-pgn-fen-tag-bounds-apex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PGN_WORKSPACE_BLOB: 4728e069d1fbc6f76daaed3116cabbe8ce6c0e0a
  PGN_BRIDGE_BLOB: 79a33b2acb88183dc9e76c2a1751e1e1862510d0
  PGN_ADAPTER_BLOB: 1c9a62995cb0da3eeaaca0e76186fc6bbfc7dba1
  PGN_ADAPTER_TEST_BLOB: fd9cf12b0b86a57e71e34ac234fee7d39239a497
  PGN_FLOW_TEST_BLOB: f46f608474bedfa7d8830294e06e21fb3b24ccae
  FEN_TURN_TEST_BLOB: b70774b1bd9fbd333733dd4d0dd0d2a23956b9d7

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact geometry and blobs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-pgn-fen-tag-bounds-apex.yml' \
            'acs/pgn_webview_bridge.py' \
            'acs/pgn_workspace_webview_adapter.py' \
            'acs/pgn_workspace.py' \
            'tests/test_fen_editor_turn_and_visible_status.py' \
            'tests/test_pgn_complete_editing_user_flow.py' \
            'tests/test_dev1_pgn_workspace_webview_adapter.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/pgn_workspace.py)" = "$PGN_WORKSPACE_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_webview_bridge.py)" = "$PGN_BRIDGE_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_workspace_webview_adapter.py)" = "$PGN_ADAPTER_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev1_pgn_workspace_webview_adapter.py)" = "$PGN_ADAPTER_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_pgn_complete_editing_user_flow.py)" = "$PGN_FLOW_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_fen_editor_turn_and_visible_status.py)" = "$FEN_TURN_TEST_BLOB"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile changed Python
        run: python -m py_compile acs/pgn_workspace.py acs/pgn_webview_bridge.py acs/pgn_workspace_webview_adapter.py tests/test_pgn_complete_editing_user_flow.py tests/test_dev1_pgn_workspace_webview_adapter.py tests/test_fen_editor_turn_and_visible_status.py

      - name: PGN complete editing and workspace
        run: >-
          python -m unittest
          tests.test_pgn_complete_editing_user_flow
          tests.test_pgn_workspace
          tests.test_version2_pgn_commands

      - name: PGN WebView adapter and projection
        run: >-
          python -m unittest
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_dev1_pgn_webview_projection

      - name: FEN and keymap turn safety
        run: >-
          python -m unittest
          tests.test_fen_editor_turn_and_visible_status
          tests.test_fen_position_editor_complete_user_flow
          tests.test_ui_analysis_webapp

      - name: EPD and position text composition
        run: >-
          python -m unittest
          tests.test_epd
          tests.test_position_text_authority
