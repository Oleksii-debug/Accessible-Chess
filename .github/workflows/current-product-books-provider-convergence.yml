          test "$(git show -s --format=%P "$EXPORT_PARENT_MERGE")" = "$PRE_EXPORT_PARENT_PRODUCT $EXPORT_PARENT_HEAD"
          git merge-base --is-ancestor "$EXPORT_PARENT_MERGE" HEAD
          test "$(git show -s --format=%P "$PRESENTATION_MERGE")" = "$PRE_PRESENTATION_PRODUCT $PRESENTATION_HEAD"
          git merge-base --is-ancestor "$PRESENTATION_MERGE" HEAD
          test "$(git show -s --format=%P "$LIBRARY_EXPORT_MERGE")" = "$PRE_LIBRARY_EXPORT_PRODUCT $LIBRARY_EXPORT_HEAD"
          git merge-base --is-ancestor "$LIBRARY_EXPORT_MERGE" HEAD
          test "$(git show -s --format=%P "$LANGUAGE_ATOMIC_MERGE")" = "$PRE_LANGUAGE_ATOMIC_PRODUCT $LANGUAGE_ATOMIC_HEAD"
          git merge-base --is-ancestor "$LANGUAGE_ATOMIC_MERGE" HEAD
          test "$(git show -s --format=%P "$BOOK_OPEN_MERGE")" = "$PRE_BOOK_OPEN_PRODUCT $BOOK_OPEN_HEAD"
          git merge-base --is-ancestor "$BOOK_OPEN_MERGE" HEAD
          test "$(git show -s --format=%P "$ROUTE_ATOMIC_MERGE")" = "$PRE_ROUTE_ATOMIC_PRODUCT $ROUTE_ATOMIC_HEAD"
          git merge-base --is-ancestor "$ROUTE_ATOMIC_MERGE" HEAD
          test "$(git show -s --format=%P "$FOCUS_PRESERVE_MERGE")" = "$PRE_FOCUS_PRESERVE_PRODUCT $FOCUS_PRESERVE_HEAD"
          git merge-base --is-ancestor "$FOCUS_PRESERVE_MERGE" HEAD
          test "$(git show -s --format=%P "$BROWSER_PUBLICATION_MERGE")" = "$PRE_BROWSER_PUBLICATION_PRODUCT $BROWSER_PUBLICATION_HEAD"
          git merge-base --is-ancestor "$BROWSER_PUBLICATION_MERGE" HEAD

          for source in "$SERIAL_HEAD" "$BOOKS_HEAD" "$LOCAL_PROFILE_HEAD" "$KEYMAP_HEAD" "$FORMAT_HEAD" "$REPORT_HEAD" "$CONVERSION_INTEGRITY_HEAD" "$CONVERSION_CAS_HEAD" "$EXPORT_PARENT_HEAD" "$PRESENTATION_HEAD" "$LIBRARY_EXPORT_HEAD" "$LANGUAGE_ATOMIC_HEAD" "$BOOK_OPEN_HEAD" "$ROUTE_ATOMIC_HEAD" "$FOCUS_PRESERVE_HEAD" "$BROWSER_PUBLICATION_HEAD"; do
            git merge-base --is-ancestor "$source" HEAD
          done

