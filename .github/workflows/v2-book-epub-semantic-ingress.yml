name: V2 EPUB Semantic Ingress

on:
  push:
    branches:
      - work/v2-book-epub-semantic-ingress-20260907
  pull_request:
    branches:
      - work/v2-html-semantic-lists-20260907

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-epub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  epub-semantic-ingress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove exact parent and disjoint EPUB scope
        shell: bash
        run: |
          set -euo pipefail
          base=756643cfcedd933af41145e200851931b9680a33
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-book-epub-semantic-ingress.yml' \
            'acs/book_epub_import.py' \
            'tests/test_v2_book_epub_import.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$base" HEAD -- \
            acs/book_html_import.py acs/book_text_import.py acs/bookdocument.py \
            acs/chesscore.py acs/gametree.py acs/pgn_roundtrip.py \
            acs/version2_application.py acs/version2_release_app.py \
            web tools/qa
      - name: Compile EPUB adapter and regressions
        run: python -m py_compile acs/book_epub_import.py tests/test_v2_book_epub_import.py
      - name: EPUB semantic and adversarial regressions
        run: python -m unittest -v tests.test_v2_book_epub_import
      - name: Inherited HTML semantic adapter contracts
        run: >-
          python -m unittest -v
          tests.test_v2_book_html_import
          tests.test_v2_html_semantic_lists
      - name: Canonical Book core and reader regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
