name: Deterministic SPDX Release SBOM

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/spdx_sbom.py'
      - 'tools/generate_spdx_sbom.py'
      - 'tests/test_spdx_sbom.py'
      - 'tests/test_generate_spdx_sbom.py'
      - '.github/workflows/deterministic-spdx-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deterministic-spdx-sbom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact bounded scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/deterministic-spdx-sbom.yml'             'acs/spdx_sbom.py'             'tests/test_generate_spdx_sbom.py'             'tests/test_spdx_sbom.py'             'tools/generate_spdx_sbom.py' | sort)"
          test "$changed" = "$expected"

      - name: Compile SBOM tooling
        run: >-
          python -m py_compile
          acs/spdx_sbom.py
          tools/generate_spdx_sbom.py
          tests/test_spdx_sbom.py
          tests/test_generate_spdx_sbom.py

      - name: Run deterministic SBOM regressions
        run: >-
          python -m unittest -v
          tests.test_spdx_sbom
          tests.test_generate_spdx_sbom

      - name: Generate twice and prove byte identity
        shell: bash
        run: |
          set -euo pipefail
          cat > sbom-input.json <<'JSON'
          {
            "schema_version": 1,
            "created_at": "2026-09-26T21:00:00Z",
            "product": {
              "name": "Accessible Chess",
              "version": "0.4.0-dev3",
              "source_sha": "1111111111111111111111111111111111111111",
              "sha256": "2222222222222222222222222222222222222222222222222222222222222222",
              "supplier": "NOASSERTION",
              "license_declared": "NOASSERTION"
            },
            "components": [
              {
                "name": "Alpha",
                "version": "1.0",
                "artifact_sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                "license_declared": "MIT",
                "purl": "pkg:pypi/alpha@1.0"
              }
            ]
          }
          JSON
          python tools/generate_spdx_sbom.py --input sbom-input.json --output first.spdx.json
          python tools/generate_spdx_sbom.py --input sbom-input.json --output second.spdx.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          a = Path("first.spdx.json").read_bytes()
          b = Path("second.spdx.json").read_bytes()
          if a != b:
              raise SystemExit("SPDX output is not deterministic")
          print("SPDX_BYTE_IDENTITY=PASS")
          print("SPDX_SHA256=" + hashlib.sha256(a).hexdigest())
          PY

      - name: Core selftest
        run: python -m acs.selftest
