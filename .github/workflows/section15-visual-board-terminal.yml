name: Section 15 Visual Board Terminal Gate

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/visual_preferences.py'
      - 'acs/visual_pack_store.py'
      - 'acs/visual_board_webview.py'
      - 'acs/visual_board_contract.py'
      - 'acs/version2_release_ui.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_final_product_application.py'
      - 'acs/teacher_webview_projection.py'
      - 'acs/teacher_webview_bridge.py'
      - 'web/index.html'
      - 'web/stage1_release_bootstrap.js'
      - 'web/full_product_teacher.js'
      - 'tests/test_section15_visual_board_closure.py'
      - '.github/workflows/section15-visual-board-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section15-terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact head and clean diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Section 15 authority
        run: >-
          python -m py_compile
          acs/visual_preferences.py
          acs/visual_pack_store.py
          acs/visual_board_webview.py
          acs/visual_board_contract.py
          acs/version2_release_ui.py
          acs/version2_release_app.py
          acs/version2_final_product_application.py
          acs/teacher_webview_projection.py
          acs/teacher_webview_bridge.py
          tests/test_section15_visual_board_closure.py

      - name: Run Section 15 and integration regressions
        run: >-
          python -m unittest -v
          tests.test_section15_visual_board_closure
          tests.test_dev1_teacher_webview_projection
          tests.test_teacher_webview_bridge
          tests.test_version2_teacher_session_runtime_binding
          tests.test_version2_final_product_composition
          tests.test_d09_teacher_canonical_webview_composition
          tests.test_version2_release_ui
          tests.test_version2_release_app
          tests.test_version2_final_release_binding

      - name: Check visual JavaScript syntax
        run: >-
          node --check web/stage1_release_bootstrap.js
          && node --check web/full_product_teacher.js

      - name: Run Teacher DOM accessibility regression
        run: node tests/js/teacher_surface_dom_test.js
