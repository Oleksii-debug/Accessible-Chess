name: P0 Packaged Document Copy Evidence CLI

on:
  pull_request:
    paths:
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'tests/test_verify_p0_packaged_document_copy_cli.py'
      - '.github/workflows/p0-packaged-document-copy-evidence-cli.yml'
  push:
    paths:
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'tests/test_verify_p0_packaged_document_copy_cli.py'
      - '.github/workflows/p0-packaged-document-copy-evidence-cli.yml'

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Exercise verifier CLI
        run: python -m unittest -v tests.test_verify_p0_packaged_document_copy_cli
