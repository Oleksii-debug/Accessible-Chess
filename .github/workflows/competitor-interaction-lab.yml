name: Competitor Interaction Lab

on:
  push:
    branches:
      - research/competitor-interaction-lab-20260820
    paths:
      - '.github/workflows/competitor-interaction-lab.yml'
      - 'tools/competitor_lab/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-robot:
    name: Public web keyboard and semantics probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node -p "require('playwright/package.json').version" > playwright-version.txt
      - name: Run web interaction probe
        shell: bash
        run: |
          set -euxo pipefail
          node tools/competitor_lab/web_interaction_probe.mjs
      - name: Record web job status
        if: always()
        shell: bash
        run: |
          mkdir -p competitor-results/web
          printf '%s\n' "job_status=${{ job.status }}" "run_id=${{ github.run_id }}" "sha=${{ github.sha }}" > competitor-results/web/job-status.txt
      - name: Upload web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-web-evidence
          path: |
            competitor-results/web/**
            playwright-version.txt
          if-no-files-found: error
          retention-days: 14

  chessbase-reader-windows:
    name: ChessBase Reader 2017 install/UIA/keyboard probe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run legal free Reader probe
        shell: powershell
        run: ./tools/competitor_lab/windows_reader_probe.ps1
      - name: Record Reader job status
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force competitor-results/windows | Out-Null
          @('job_status=${{ job.status }}','run_id=${{ github.run_id }}','sha=${{ github.sha }}') | Set-Content -Encoding utf8 competitor-results/windows/job-status.txt
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chessbase-reader-windows-evidence
          path: competitor-results/windows/**
          if-no-files-found: error
          retention-days: 14

  scid-windows:
    name: Scid 5.2 portable/UIA/keyboard probe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run Scid portable probe
        shell: powershell
        run: ./tools/competitor_lab/windows_scid_probe.ps1
      - name: Record Scid job status
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force competitor-results/windows-scid | Out-Null
          @('job_status=${{ job.status }}','run_id=${{ github.run_id }}','sha=${{ github.sha }}') | Set-Content -Encoding utf8 competitor-results/windows-scid/job-status.txt
      - name: Upload Scid Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scid-windows-evidence
          path: competitor-results/windows-scid/**
          if-no-files-found: error
          retention-days: 14

  publish-evidence:
    name: Publish compact robot evidence to research branch
    if: always()
    needs: [web-robot, chessbase-reader-windows, scid-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/competitor-interaction-lab-20260820
          fetch-depth: 0
      - name: Download all evidence
        uses: actions/download-artifact@v4
        with:
          pattern: '*evidence'
          path: _lab_artifacts
          merge-multiple: false
      - name: Stage evidence snapshot
        shell: bash
        run: |
          set -euxo pipefail
          dest="docs/research/competitor_lab_runs/${{ github.run_id }}"
          mkdir -p "$dest"
          cp -R _lab_artifacts/. "$dest/"
          cat > "$dest/RUN_SUMMARY.md" <<EOF
          # Competitor Interaction Lab Run ${{ github.run_id }}

          - Trigger SHA: `${{ github.sha }}`
          - Web robot: `${{ needs.web-robot.result }}`
          - ChessBase Reader Windows robot: `${{ needs.chessbase-reader-windows.result }}`
          - Scid Windows robot: `${{ needs.scid-windows.result }}`
          - Evidence level: robot/UIA/keyboard automation only; never human NVDA verification.
          EOF
      - name: Commit evidence snapshot
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'accessible-chess-competitor-lab'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "docs/research/competitor_lab_runs/${{ github.run_id }}"
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit.'
            exit 0
          fi
          git commit -m "research: capture competitor lab run ${{ github.run_id }}"
          git push origin HEAD:research/competitor-interaction-lab-20260820
