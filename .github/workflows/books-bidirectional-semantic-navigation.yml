name: Books Bidirectional Semantic Navigation

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
      - work/books-bidirectional-semantic-navigation-20260927
    paths:
      - 'acs/bookreader.py'
      - 'acs/book_board_workflow.py'
      - 'acs/full_product_presenters.py'
      - 'acs/book_webview_projection.py'
      - 'acs/book_webview_bridge.py'
      - 'acs/version2_book_workspace.py'
      - 'tests/test_book_bidirectional_semantic_navigation.py'
      - 'tests/test_dev1_books_training_web_asset.py'
      - 'tests/test_bookreader.py'
      - 'tests/test_bookreader_snapshot_bounds.py'
      - 'tests/test_version2_book_workspace.py'
      - 'acs/full_product_actions.py'
      - 'tests/test_full_product_native_menu.py'
      - 'acs/full_product_native_menu.py'
      - 'acs/version2_application.py'
      - 'acs/version2_starter_content_application.py'
      - 'tests/test_book_reverse_progress_failure_exact.py'
      - 'tests/test_v2_book_board_workflow.py'
      - 'tests/test_w3_p0f_starter_books_training_content.py'
      - 'tests/test_version2_application.py'
      - 'tests/test_v2_shared_presentation_path_privacy.py'
      - 'tests/test_dev1_books_training_web_asset.py'
      - 'web/full_product_books_training.js'
      - 'tests/js/books_training_surface_dom_test.js'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
      - '.github/workflows/books-bidirectional-semantic-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-bidirectional-semantic-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-navigation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact candidate and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          product_branch='work/full-product-teacher-education-reachability-20260911'
          books_branch='work/books-bidirectional-semantic-navigation-20260927'
          pr_base_ref='${{ github.event.pull_request.base.ref }}'
          pr_base_sha='${{ github.event.pull_request.base.sha }}'

          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$pr_base_ref" = "$books_branch" ]; then
            books_ref="refs/remotes/origin/$books_branch"
            git fetch --no-tags origin "+refs/heads/$books_branch:$books_ref"
            scope_base="$(git rev-parse "$books_ref")"
            test -n "$pr_base_sha"
            git cat-file -e "$pr_base_sha^{commit}"
            git merge-base --is-ancestor "$pr_base_sha" "$scope_base"
            git merge-base --is-ancestor "$scope_base" HEAD
            test "$(git merge-base "$scope_base" HEAD)" = "$scope_base"
            expected_paths=(
              '.github/workflows/books-bidirectional-semantic-navigation.yml'
              '.github/workflows/p0-release-critical-triad-convergence.yml'
              'tests/test_book_bidirectional_semantic_navigation.py'
              'tests/test_dev1_books_training_web_asset.py'
              'tests/js/books_training_surface_dom_test.js'
              'web/full_product_books_training.js'
            )
            test "$(git rev-parse HEAD:tests/test_book_bidirectional_semantic_navigation.py)" = "9d1e7bcc15eefea3c343ff0761e15db74bb52fa3"
            test "$(git rev-parse HEAD:tests/test_dev1_books_training_web_asset.py)" = "0871861990022473318ec9942e5718f4576e1ef7"
            test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = "94e8319e72d3d03b726530dded9d2dad814ff345"
            test "$(git rev-parse HEAD:web/full_product_books_training.js)" = "31ed98738c6e3735819812cea84b976cdc1c5407"
            test "$(git rev-parse HEAD:.github/workflows/p0-release-critical-triad-convergence.yml)" = "87583407365588a16259b8baee4e7b4dce8b4864"
            echo 'BOOKS_SEMANTIC_NAVIGATION_TOPOLOGY=CURRENT_BOOKS'
          else
            product_ref="refs/remotes/origin/$product_branch"
            git fetch --no-tags origin "+refs/heads/$product_branch:$product_ref"
            scope_base="$(git rev-parse "$product_ref")"
            git merge-base --is-ancestor "$scope_base" HEAD
            test "$(git merge-base "$scope_base" HEAD)" = "$scope_base"
            expected_paths=(
              '.github/workflows/books-bidirectional-semantic-navigation.yml'
              '.github/workflows/d01-pgn-workspace-webview.yml'
              '.github/workflows/w3-p0f-starter-books-training.yml'
              'acs/book_webview_bridge.py'
              'acs/book_webview_projection.py'
              'acs/book_board_workflow.py'
              'acs/bookreader.py'
              'acs/full_product_actions.py'
              'acs/full_product_native_menu.py'
              'acs/full_product_presenters.py'
              'acs/version2_application.py'
              'acs/version2_book_workspace.py'
              'acs/version2_starter_content_application.py'
              'tests/test_book_bidirectional_semantic_navigation.py'
              'tests/test_dev1_books_training_web_asset.py'
              'tests/test_bookreader.py'
              'tests/test_bookreader_snapshot_bounds.py'
              'tests/test_book_reverse_progress_failure_exact.py'
              'tests/test_v2_book_board_workflow.py'
              'tests/test_version2_book_workspace.py'
              'tests/test_w3_p0f_starter_books_training_content.py'
              'tests/test_version2_application.py'
              'tests/test_full_product_native_menu.py'
              'tests/test_v2_shared_presentation_path_privacy.py'
            )
            echo 'BOOKS_SEMANTIC_NAVIGATION_TOPOLOGY=PRODUCT'
          fi

          git diff --check "$scope_base" HEAD
          mapfile -t actual < <(git diff --name-only "$scope_base" HEAD | LC_ALL=C sort)
          mapfile -t wanted < <(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)
          test "${actual[*]}" = "${wanted[*]}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove Books and Training DOM transport semantics
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/book_board_workflow.py
          acs/bookreader.py
          acs/full_product_actions.py
          acs/full_product_native_menu.py
          acs/full_product_presenters.py
          acs/version2_application.py
          acs/version2_book_workspace.py
          acs/version2_starter_content_application.py
          acs/book_webview_projection.py
          acs/book_webview_bridge.py
          tests/test_book_bidirectional_semantic_navigation.py
          tests/test_dev1_books_training_web_asset.py
          tests/test_bookreader.py
          tests/test_bookreader_snapshot_bounds.py
          tests/test_book_reverse_progress_failure_exact.py
          tests/test_v2_book_board_workflow.py
          tests/test_version2_book_workspace.py
          tests/test_w3_p0f_starter_books_training_content.py
          tests/test_version2_application.py
          tests/test_full_product_native_menu.py
          tests/test_v2_shared_presentation_path_privacy.py

      - name: Run focused and adjacent Book semantics
        run: >-
          python -m unittest -v
          tests.test_book_bidirectional_semantic_navigation
          tests.test_dev1_books_training_web_asset
          tests.test_bookreader
          tests.test_bookreader_snapshot_bounds
          tests.test_book_reverse_progress_failure_exact
          tests.test_w3_p0f_starter_books_training_content
          tests.test_version2_application
          tests.test_full_product_native_menu
          tests.test_v2_shared_presentation_path_privacy
          tests.test_book_board_progress_failure_exact
          tests.test_v2_book_board_workflow
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_bridge
          tests.test_version2_book_workspace
