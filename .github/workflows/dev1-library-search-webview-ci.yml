name: DEV1 Library Search WebView CI

on:
  workflow_dispatch:
  push:
    branches:
      - full5/dev1-library-search-webview-20260822-2236
  pull_request:
    branches:
      - full5/dev1-pgn-webview-20260822-1904

permissions:
  contents: read

jobs:
  dev1-library-search-webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Prove exact source head and isolated DEV1 scope
        shell: bash
        run: |
          set -euo pipefail
          base='6336d917319f22e422fc3b541feecf7c40977ac9'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD)"
          printf '%s\n' "$changed"
          allowed='^(.github/workflows/dev1-library-search-webview-ci.yml|.github/workflows/dev1-full-product-ui-ci.yml|acs/library_webview_projection.py|acs/library_webview_bridge.py|web/full_product_library.js|tests/test_dev1_library_webview_projection.py|tests/test_dev1_library_webview_bridge.py|tests/test_dev1_library_web_asset.py|tests/test_dev1_library_webview_atomicity.py)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected path outside isolated DEV1 Library/Search package:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for protected in \
            acs/full_product_presenters.py \
            acs/search_service.py \
            acs/acsdb.py \
            acs/full_product_ui_shell.py \
            acs/full_product_actions.py \
            acs/full_product_webview_adapter.py \
            acs/pgn_webview_projection.py \
            acs/pgn_webview_bridge.py; do
            if printf '%s\n' "$changed" | grep -Fx "$protected"; then
              echo "Accepted/backend path churned without a concrete defect: $protected" >&2
              exit 1
            fi
          done
      - name: Parse browser asset
        run: node --check web/full_product_library.js
      - name: Compile Product presentation and tests
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: DEV1 Library Search focused tests
        run: >-
          python -m unittest -v
          tests.test_dev1_library_webview_projection
          tests.test_dev1_library_webview_bridge
          tests.test_dev1_library_web_asset
          tests.test_dev1_library_webview_atomicity
          tests.test_dev1_full_product_ui_packages
          tests.test_search_service
      - name: Full repository unittest discovery
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest without weakening
        run: python -m pytest -q
      - name: Complete product diagnostic
        run: python run_accessible_chess.py --diagnostic
