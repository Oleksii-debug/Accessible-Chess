name: V2 Audit-B Legacy Schema0 Canonical Ingress

on:
  push:
    branches:
      - audit/v2-legacy-schema0-canonical-ingress-20260831

permissions:
  contents: read

concurrency:
  group: v2-audit-b-legacy-schema0-canonical-ingress-${{ github.ref }}
  cancel-in-progress: true

env:
  OWNER_HEAD: b21b08af7b7b3c44f26c9c9797287529c3e416a9
  LEGACY_MIGRATION_BLOB: 1a0ba4a67b2d6943478707c5838e4727480bb7e1
  PGN_ROUNDTRIP_BLOB: 96d62bf6dd7b2f5c8a75d5f2bd1fde2ad0823d20

jobs:
  audit-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact owner and evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$OWNER_HEAD" HEAD)" = "$OWNER_HEAD"
          git diff --check "$OWNER_HEAD" HEAD
          changed="$(git diff --name-only "$OWNER_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-audit-b-legacy-schema0-canonical-ingress.yml' \
            'tests/test_v2_audit_b_legacy_schema0_canonical_ingress.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/legacy_library_migration.py)" = "$LEGACY_MIGRATION_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "$PGN_ROUNDTRIP_BLOB"

      - name: Compile audit surface
        run: python -m compileall -q tests/test_v2_audit_b_legacy_schema0_canonical_ingress.py

      - name: Existing D06 and D07 focused regressions
        run: >-
          python -m unittest -v
          tests.test_d06_pgn_roundtrip
          tests.test_v2_library_dedup_provenance
          tests.test_v2_library_integrity_repair

      - name: Broad exact-owner Product regressions
        shell: bash
        run: |
          set -euo pipefail
          product_tree="../v2-schema0-owner-${GITHUB_RUN_ID}-${RUNNER_OS}"
          rm -rf "$product_tree"
          git worktree add --detach "$product_tree" "$OWNER_HEAD"
          cleanup() {
            git worktree remove --force "$product_tree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          (
            cd "$product_tree"
            python -m unittest discover -s tests
            python -m pytest -q tests
            python -m acs.selftest
            python run_accessible_chess.py --diagnostic
          )
          cleanup
          trap - EXIT

      - name: Independent canonical-ingress oracle
        if: ${{ always() }}
        run: python -m unittest -v tests.test_v2_audit_b_legacy_schema0_canonical_ingress
