name: Accessible Chess Serial Core Qualification

on:
  pull_request:
    branches:
      - converge/pgn-training-warning-privacy-language-settings-observerqa-p0qa-w6settings-streamingqa-20261003
    paths:
      - '.github/workflows/accessible-chess-serial-core-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessible-chess-serial-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  serial-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      STACK_PARENT_SHA: 4766eef88ac0400919cb551103eb28de4300be9e
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact serial parent and qualification-only delta
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$PR_BASE_SHA" = "$STACK_PARENT_SHA"
          fi
          git cat-file -e "$STACK_PARENT_SHA^{commit}"
          git merge-base --is-ancestor "$STACK_PARENT_SHA" HEAD
          git diff --check "$STACK_PARENT_SHA" HEAD
          changed="$(git diff --name-only "$STACK_PARENT_SHA" HEAD)"
          test "$changed" = '.github/workflows/accessible-chess-serial-core-qualification.yml'

      - name: Compile composed runtime and focused contracts
        run: >-
          python -m py_compile
          acs/version2_application.py
          acs/version2_release_app.py
          acs/version2_release_ui.py
          acs/pgn_document.py
          acs/pgn_document_webview_projection.py
          acs/pgn_webview_projection.py
          acs/presentation_privacy.py
          acs/version2_training_workspace.py
          acs/training_webview_projection.py
          acs/settings.py
          tests/test_pgn_position_new_document_reachability.py
          tests/test_pgn_document_warning_reachability.py
          tests/test_w6_v2_language_owner_current.py
          tests/test_settings.py

      - name: Run canonical PGN and document contracts
        run: >-
          python -m unittest -v
          tests.test_pgn_document_new_game_position_integrity
          tests.test_pgn_position_new_document_reachability
          tests.test_pgn_document_warning_reachability
          tests.test_version2_application

      - name: Run Training transaction and DOM contracts
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_webview_projection
          tests.test_v2_book_training_route_rollback
          tests.test_v2_book_transaction_current_runtime
          tests.test_w3_p0f_starter_books_training_content
      - run: node tests/js/books_training_surface_dom_test.js

      - name: Run privacy, language and persistence contracts
        run: >-
          python -m unittest -v
          tests.test_v2_pgn_webview_path_privacy
          tests.test_v2_shared_presentation_path_privacy
          tests.test_w6_v2_language_owner_current
          tests.test_settings

      - name: Run Windows-host lifecycle contracts on both OS
        run: >-
          python -m unittest -v
          tests.test_v2_windows_library_import_observer
          tests.test_v2_windows_pgn_streaming_host_lifecycle
          tests.test_version2_windows_composition_profile
          tests.test_version2_release_accessibility_contract

      - name: Run P0 merge-identity and release-critical static contracts
        run: >-
          python -m unittest -v
          tests.test_p0_release_critical_triad_convergence
          tests.test_p0_packaged_document_copy_probe
          tests.test_p0g_packaged_hotkey_result_probe
          tests.test_verify_p0_packaged_document_copy_evidence

      - name: Run repository unittest qualification
        run: python -m unittest discover -s tests

      - name: Run core selftest
        run: python -m acs.selftest
