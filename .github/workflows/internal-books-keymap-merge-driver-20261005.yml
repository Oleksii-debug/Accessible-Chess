name: Internal Books Keymap Merge Driver 20261005

on:
  push:
    branches:
      - converge/books-keymap-20261005-sol56r8k4

permissions:
  contents: write

concurrency:
  group: internal-books-keymap-merge-driver-20261005
  cancel-in-progress: false

jobs:
  merge:
    if: contains(github.event.head_commit.message, '[internal-books-keymap-merge-driver]')
    runs-on: ubuntu-22.04
    env:
      TARGET_BRANCH: converge/books-keymap-20261005-sol56r8k4
      KEYMAP_EXPECTED: fc4c6c85dbdf4e5d7c3798a6171a696b27f0472b
      BOOKS_EXPECTED: 9b9f923639b27d4f4d674ff3e086298f1acb8491
      DRIVER_PATH: .github/workflows/internal-books-keymap-merge-driver-20261005.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact isolated convergence inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$KEYMAP_EXPECTED"
          git fetch --no-tags origin "$BOOKS_EXPECTED"
          test "$(git rev-parse FETCH_HEAD)" = "$BOOKS_EXPECTED"

      - name: Merge Books source and resolve only the known shared surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Accessible Chess Integration"
          git config user.email "integration@accessible-chess.invalid"

          set +e
          git merge --no-ff --no-commit "$BOOKS_EXPECTED"
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ] && [ "$merge_status" -ne 1 ]; then
            exit "$merge_status"
          fi

          python - <<'PY'
          from pathlib import Path
          import subprocess

          WEB = Path("web/full_product_books_training.js")
          TEST = Path("tests/js/books_training_surface_dom_test.js")
          allowed = {str(WEB), str(TEST)}
          raw = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=U"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          conflicts = {line.strip() for line in raw if line.strip()}
          unexpected = conflicts - allowed
          if unexpected:
              raise SystemExit(f"unexpected merge conflicts: {sorted(unexpected)}")

          if str(WEB) in conflicts:
              subprocess.run(["git", "checkout", "--theirs", "--", str(WEB)], check=True)
              text = WEB.read_text(encoding="utf-8")
              old = '''      let next = current;\n      if (event.key === "ArrowRight") {\n        next = (current + 1) % controls.length;\n      } else if (event.key === "ArrowLeft") {\n        next = (current - 1 + controls.length) % controls.length;\n      } else if (event.key === "Home") {\n        next = 0;\n      } else if (event.key === "End") {\n        next = controls.length - 1;\n      } else {\n        return;\n      }\n      if (typeof event.preventDefault === "function") event.preventDefault();\n      const target = controls[next];\n'''
              new = '''      const resolve = global.accessibleChessKeymapAction;\n      let actionId = "";\n      let resolverReady = false;\n      if (typeof resolve === "function") {\n        const resolved = resolve(event, "toolbar");\n        if (resolved !== null && resolved !== undefined) {\n          resolverReady = true;\n          actionId = typeof resolved === "string" ? resolved : "";\n        }\n      }\n      if (\n        !resolverReady &&\n        !event.altKey && !event.ctrlKey && !event.shiftKey && !event.metaKey\n      ) {\n        if (event.key === "ArrowRight") actionId = "toolbar.next_control";\n        else if (event.key === "ArrowLeft") actionId = "toolbar.previous_control";\n        else if (event.key === "Home") actionId = "toolbar.first_control";\n        else if (event.key === "End") actionId = "toolbar.last_control";\n      }\n\n      let next = -1;\n      if (actionId === "toolbar.next_control") {\n        next = (current + 1) % controls.length;\n      } else if (actionId === "toolbar.previous_control") {\n        next = (current - 1 + controls.length) % controls.length;\n      } else if (actionId === "toolbar.first_control") {\n        next = 0;\n      } else if (actionId === "toolbar.last_control") {\n        next = controls.length - 1;\n      } else {\n        return;\n      }\n      if (typeof event.preventDefault === "function") event.preventDefault();\n      if (typeof event.stopPropagation === "function") event.stopPropagation();\n      const target = controls[next];\n'''
              if old not in text:
                  raise SystemExit("Books toolbar source anchor drifted; refusing implicit conflict resolution")
              WEB.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          if str(TEST) in conflicts:
              subprocess.run(["git", "checkout", "--ours", "--", str(TEST)], check=True)
              text = TEST.read_text(encoding="utf-8")

              metadata_anchor = '  const extraTreeField = bookSnapshot(44, "Extra semantic tree field");\n'
              metadata_block = '''  const metadataRoot = new FakeElement("div");\n  const metadataSnapshot = bookSnapshot(70, "Game metadata");\n  metadataSnapshot.block.kind = "Game";\n  metadataSnapshot.block.role = "group";\n  metadataSnapshot.block.title = "Game metadata";\n  metadataSnapshot.actions[9].enabled = true;\n  metadataSnapshot.semantic_tree = semanticBookTree("game");\n  metadataSnapshot.semantic_tree.details = [\n    { kind: "event", label: "Подія", value: "Навчання <img>" },\n    { kind: "date", label: "Дата", value: "2026.10.05" }\n  ];\n  window.AccessibleChessBookSurface.render(metadataRoot, metadataSnapshot,\n    () => ({ kind: "error", payload: { message: "unused" } }), announce,\n    "book-block-70", "Metadata render failed");\n  check(find(metadataRoot, "P", "Подія: Навчання <img>") !== null,\n    "semantic game event is missing readable text");\n  check(find(metadataRoot, "P", "Дата: 2026.10.05") !== null,\n    "semantic game date is missing readable text");\n  check(metadataRoot.querySelector("#book-block-70") !== null,\n    "metadata render lost the canonical Book focus group");\n  const invalidMetadata = [\n    [{ kind: "event", label: "Event", value: "Study" }, { kind: "event", label: "Event", value: "Other" }],\n    [{ kind: "unknown", label: "Unknown", value: "Study" }],\n    [{ kind: "event", label: "Event", value: "🙂".repeat(601) }],\n    [{ kind: "event", label: "Event", value: "Study", private_path: "forbidden" }],\n    new Array(1)\n  ];\n  for (let metadataIndex = 0; metadataIndex < invalidMetadata.length; metadataIndex += 1) {\n    const malformedMetadata = JSON.parse(JSON.stringify(metadataSnapshot));\n    malformedMetadata.semantic_tree.details = invalidMetadata[metadataIndex];\n    await expectBookSnapshotRejected(malformedMetadata, 70,\n      "malformed semantic metadata " + metadataIndex, "Metadata validation failed");\n  }\n'''
              if 'const metadataSnapshot = bookSnapshot(70, "Game metadata")' not in text:
                  if metadata_anchor not in text:
                      raise SystemExit("Books metadata test anchor drifted")
                  text = text.replace(metadata_anchor, metadata_anchor + metadata_block, 1)

              replacements = [
                  ('  delegatedSnapshot.block.role = "group";\n', '  delegatedSnapshot.block.role = "group";\n  delegatedSnapshot.block.title = "Position handoff";\n'),
                  ('  malformedDelegatedSnapshot.block.role = "group";\n', '  malformedDelegatedSnapshot.block.role = "group";\n  malformedDelegatedSnapshot.block.title = "Malformed handoff";\n'),
              ]
              for old_line, new_line in replacements:
                  if new_line not in text:
                      if old_line not in text:
                          raise SystemExit(f"Books title anchor drifted: {old_line.strip()}")
                      text = text.replace(old_line, new_line, 1)

              if 'oversizedListSnapshot.block.kind = "List";' not in text:
                  anchor = '  const oversizedListSnapshot = bookSnapshot(32, "Oversized list");\n'
                  if anchor not in text:
                      raise SystemExit("oversized list fixture anchor drifted")
                  text = text.replace(anchor, anchor + '  oversizedListSnapshot.block.kind = "List";\n', 1)

              language_anchor = '  console.log("Books/Training DOM focus, editing, and starter discovery contract PASS");\n'
              language_block = '''  const languageRoot = new FakeElement("div");\n  const languageSnapshot = bookSnapshot(40, "English prose");\n  languageSnapshot.document.lang = "uk";\n  languageSnapshot.block.content_language = "en-GB";\n  languageSnapshot.book_metadata = { title: "English chess book", author: "Book author", language: "en-GB" };\n  window.AccessibleChessBookSurface.render(languageRoot, languageSnapshot,\n    () => null, () => {}, "book-block-40");\n  const sourceBlock = languageRoot.querySelector("#book-block-40");\n  check(sourceBlock.attributes.lang === "en-GB", "source language was not applied to narrative content");\n  check(languageRoot.querySelector("#book-document-title").textContent === "English chess book", "book title was not exposed");\n  check(languageRoot.querySelector("#book-document-author").textContent === "Book author", "book author was not exposed");\n  check(languageRoot.querySelector("#book-document-title").attributes.lang === "en-GB", "book title source language was lost");\n  check(document.activeElement === sourceBlock, "source language changed reading focus");\n  const languageRenders = languageRoot.replaceChildrenCalls;\n  languageSnapshot.block.content_language = 'en\\" onclick=\\"attack';\n  let invalidLanguageRejected = false;\n  try {\n    window.AccessibleChessBookSurface.render(languageRoot, languageSnapshot, () => null, () => {}, "book-block-40");\n  } catch (error) { invalidLanguageRejected = error instanceof TypeError; }\n  check(invalidLanguageRejected && languageRoot.replaceChildrenCalls === languageRenders,\n    "invalid source language mutated the stable reading DOM");\n'''
              if 'const languageSnapshot = bookSnapshot(40, "English prose")' not in text:
                  if language_anchor not in text:
                      raise SystemExit("Books language test anchor drifted")
                  text = text.replace(language_anchor, language_block + language_anchor, 1)

              TEST.write_text(text, encoding="utf-8", newline="\n")

          subprocess.run(["git", "add", "--", str(WEB), str(TEST)], check=True)

          web = WEB.read_text(encoding="utf-8")
          test = TEST.read_text(encoding="utf-8")
          required_web = (
              'accessibleChessKeymapAction', 'toolbar.next_control', 'tree.details',
              'snapshot.book_metadata', 'block.content_language', 'book-document-title',
          )
          required_test = (
              'toolbar_keymap_test_support', 'exerciseToolbarRemaps',
              'metadataSnapshot', 'languageSnapshot', 'oversizedListSnapshot.block.kind = "List";',
          )
          missing = [token for token in required_web if token not in web]
          missing += [token for token in required_test if token not in test]
          if missing:
              raise SystemExit(f"merged Books/keymap surface lost required contracts: {missing}")
          PY

          rm -f "$DRIVER_PATH"
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js
          python -m compileall -q acs tests
          python -m unittest \
            tests.test_book_semantic_game_metadata \
            tests.test_book_training_large_reading_journey \
            tests.test_current_remappable_surfaces_qualification

      - name: Publish clean two-parent merge without retaining the driver commit
        shell: bash
        run: |
          set -euo pipefail
          tree_sha="$(git write-tree)"
          merge_sha="$(printf '%s\n\n%s\n' \
            'Converge live Books journeys with composed keymap authority' \
            'History-preserving internal merge; resolves only the shared Books/Training DOM surface while retaining both semantic-reading and remappable-toolbar contracts.' \
            | git commit-tree "$tree_sha" -p "$KEYMAP_EXPECTED" -p "$BOOKS_EXPECTED")"
          git cat-file -e "${merge_sha}^{commit}"
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${GITHUB_SHA}" \
            origin "${merge_sha}:refs/heads/${TARGET_BRANCH}"
          echo "MERGE_SHA=${merge_sha}" >> "$GITHUB_ENV"

      - name: Verify clean published ancestry and tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH"
          published="$(git rev-parse FETCH_HEAD)"
          test "$published" = "$MERGE_SHA"
          test "$(git rev-parse "${published}^1")" = "$KEYMAP_EXPECTED"
          test "$(git rev-parse "${published}^2")" = "$BOOKS_EXPECTED"
          test "$(git ls-tree -r --name-only "$published" | grep -c '^\.github/workflows/internal-books-keymap-merge-driver-20261005\.yml$')" -eq 0
