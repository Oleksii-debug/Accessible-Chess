name: V2 Windows CBZ Recovery Host

on:
  push:
    branches:
      - work/v2-windows-cbz-recovery-host-20260828
  pull_request:
    branches:
      - work/v2-cbz-crash-residue-recovery-20260828
    paths:
      - acs/version2_windows_cbz_recovery_host.py
      - tests/test_v2_windows_cbz_recovery_host.py
      - .github/workflows/v2-windows-cbz-recovery-host.yml

permissions:
  contents: read

env:
  V2_WINDOWS_CBZ_HOST_BASE: fda16a92bf32a523213c628b4e28a08565cef6e6
  CBZ_RECOVERY_PRODUCT_BLOB: 50fa1758b8e78d4bc8e77976b9d0c6f80aaeeed3

jobs:
  windows-cbz-recovery-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove exact parent, owner scope, and cleaner isolation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V2_WINDOWS_CBZ_HOST_BASE" HEAD
          test "$(git merge-base "$V2_WINDOWS_CBZ_HOST_BASE" HEAD)" = "$V2_WINDOWS_CBZ_HOST_BASE"
          git diff --check "$V2_WINDOWS_CBZ_HOST_BASE" HEAD
          changed="$(git diff --name-only "$V2_WINDOWS_CBZ_HOST_BASE" HEAD)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(acs/version2_windows_cbz_recovery_host\.py|tests/test_v2_windows_cbz_recovery_host\.py|\.github/workflows/v2-windows-cbz-recovery-host\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected paths outside Windows CBZ recovery-host ownership:\n%s\n' "$unexpected"
            exit 1
          fi
          test "$(git rev-parse HEAD:acs/cbz_extractor.py)" = "$CBZ_RECOVERY_PRODUCT_BLOB"
          test "$(git rev-parse "$V2_WINDOWS_CBZ_HOST_BASE:acs/cbz_extractor.py")" = "$CBZ_RECOVERY_PRODUCT_BLOB"
          test -z "$(git diff --name-only "$V2_WINDOWS_CBZ_HOST_BASE" HEAD -- acs/cbz_extractor.py acs/cbv_extractor.py acs/chessbase_adapter.py run_accessible_chess.py web || true)"
      - name: Compile host adapter and inherited recovery code
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Focused Windows host plus canonical recovery contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_cbz_recovery_host
          tests.test_v2_cbz_crash_recovery
          tests.test_cbz_extractor
      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_cbz_recovery_host.py
          tests/test_v2_cbz_crash_recovery.py
          tests/test_cbz_extractor.py
      - name: Full repository unittest
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Full repository pytest
        run: python -m pytest -q
      - name: SELFTEST and complete diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
