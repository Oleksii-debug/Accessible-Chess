name: Current Windows Import Observer Passive

on:
  push:
    branches:
      - fix/windows-import-observer-passive-20261005-sol56z8r0
  pull_request:
    branches:
      - fix/chessbase-import-report-passive-20261005-sol56z8q9
    paths:
      - acs/version2_windows_library_import_observer.py
      - tests/test_v2_windows_library_import_observer.py
      - .github/workflows/current-windows-import-observer-passive.yml

permissions:
  contents: read

concurrency:
  group: current-windows-import-observer-passive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 80a2d50d8a880d67a35c82a373185ec5a481826a
  PARENT_BRANCH: fix/chessbase-import-report-passive-20261005-sol56z8q9
  EXPECTED_OBSERVER_SOURCE_BLOB: f4118a5822ef3f96f6b08e0724b0534ce525ca1d
  EXPECTED_OBSERVER_TEST_BLOB: 34f33d7b3d760f816d828602a4fa0d6a9a24d293
  EXPECTED_CHESSBASE_SOURCE_BLOB: e0dd4f970d2e6f4a7198b2b09079866db2f54b60
  EXPECTED_WINDOWS_FILE_SOURCE_BLOB: 2aee89abd416c2ad169e264c3c7141767aa0b46d
  EXPECTED_REPORT_TEST_BLOB: b192788efe4b4c889aaf315408163d8d69ffc1e6

jobs:
  passive-observer:
    name: Passive import observer / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact observer child and inherited report authority
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/import-observer-parent"
          live_parent="$(git rev-parse refs/remotes/origin/import-observer-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "IMPORT_OBSERVER_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-import-observer-passive.yml"
            "acs/version2_windows_library_import_observer.py"
            "tests/test_v2_windows_library_import_observer.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_library_import_observer.py)" = "$EXPECTED_OBSERVER_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_library_import_observer.py)" = "$EXPECTED_OBSERVER_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/chessbase_library_import.py)" = "$EXPECTED_CHESSBASE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_WINDOWS_FILE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_chessbase_library_import_report_passive.py)" = "$EXPECTED_REPORT_TEST_BLOB"

          echo "IMPORT_OBSERVER_PARENT=$EXPECTED_PARENT"
          echo "IMPORT_OBSERVER_HEAD=$expected_head"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile observer and inherited import boundaries
        run: >-
          python -m py_compile
          acs/version2_windows_library_import_observer.py
          acs/chessbase_library_import.py
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_library_import_observer.py
          tests/test_chessbase_library_import_report_passive.py
          tests/test_v2_windows_file_worker_shutdown_fence.py
          tests/test_v2_windows_nvda_file_workflows.py

      - name: Run observer, ChessBase and Windows file regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_library_import_observer
          tests.test_chessbase_library_import_report_passive
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
