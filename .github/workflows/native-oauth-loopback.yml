name: Native OAuth Loopback Callback

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/native_oauth_loopback.py'
      - 'tests/test_native_oauth_loopback.py'
      - 'tests/test_native_oauth_loopback_hardening.py'
      - '.github/workflows/native-oauth-loopback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-oauth-loopback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact Product base and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          base=603caba648a8452e3db1e514019713bdefd1516f
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t changed < <(git diff --name-only "$base"...HEAD | sort)
          expected_paths=(
            .github/workflows/native-oauth-loopback.yml
            acs/native_oauth_loopback.py
            tests/test_native_oauth_loopback.py
            tests/test_native_oauth_loopback_hardening.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_paths[@]}" | sort)
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          echo "NATIVE_OAUTH_LOOPBACK_EXACT_HEAD=$actual"

      - name: Compile callback transport and tests
        run: >-
          python -m py_compile
          acs/native_oauth_loopback.py
          tests/test_native_oauth_loopback.py
          tests/test_native_oauth_loopback_hardening.py

      - name: Execute native loopback contract
        run: >-
          python -m unittest -v
          tests.test_native_oauth_loopback
          tests.test_native_oauth_loopback_hardening

      - name: Enforce transport-only ownership boundary
        shell: python
        run: |
          from pathlib import Path
          source = Path('acs/native_oauth_loopback.py').read_text(encoding='utf-8')
          forbidden = (
              'code_verifier', 'code_challenge', 'client_secret', 'refresh_token',
              'id_token', 'jwks', 'jwt', 'entitlement', 'requests', 'urllib.request',
              'DPAPI', 'CryptProtectData',
          )
          found = [token for token in forbidden if token.casefold() in source.casefold()]
          if found:
              raise SystemExit(f'native callback ownership violation: {found}')
          print('NATIVE_OAUTH_LOOPBACK_BOUNDARY=PASS')

      - name: Core selftest
        run: python -m acs.selftest
