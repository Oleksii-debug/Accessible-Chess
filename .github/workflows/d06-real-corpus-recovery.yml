name: D06 Real Corpus Recovery

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/pgn_document.py'
      - 'tests/test_d06_real_corpus_recovery.py'
      - 'tests/test_d06_real_corpus_recovery_workflow.py'
      - '.github/workflows/d06-real-corpus-recovery.yml'

permissions:
  contents: read

concurrency:
  group: d06-real-corpus-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current-base recovery authority
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          base='${{ github.event.pull_request.base.sha }}'
          test -n "$expected"
          test -n "$base"
          test "$(git rev-parse HEAD)" = "$expected"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD

          changed="$(git diff --name-only "$base" HEAD | sort)"
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict|release_preflight|^acs/stage1_release_ui(_core)?\.py$'; then
            echo 'Frozen Stage 1 / strict-release contamination detected' >&2
            exit 1
          fi

          oracle='tests/test_d06_real_corpus_recovery.py'
          base_oracle="$(git rev-parse "$base:$oracle")"
          candidate_oracle="$(git rev-parse "HEAD:$oracle")"
          test "$candidate_oracle" = "$base_oracle" || {
            printf 'D06 recovery oracle drift requires a dedicated successor: base=%s candidate=%s\n' \
              "$base_oracle" "$candidate_oracle" >&2
            exit 1
          }

          echo "D06_RECOVERY_BASE=$base"
          echo "D06_RECOVERY_HEAD=$(git rev-parse HEAD)"

      - name: Compile recovery surface
        run: >-
          python -m py_compile
          acs/pgn_document.py
          tests/test_d06_real_corpus_recovery.py
          tests/test_d06_real_corpus_recovery_workflow.py

      - name: Real-corpus-derived RED regression
        run: >-
          python -m unittest -v
          tests.test_d06_real_corpus_recovery_workflow
          tests.test_d06_real_corpus_recovery

      - name: Focused PGN document/workspace/recovery regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_pgn_service
          tests.test_d06_pgn_roundtrip
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_resource_security
          tests.test_dev4_pgn_export_failure_recovery

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
