name: Section 37 User Data Host Exact Contract
on:
  pull_request:
    paths:
      - "acs/user_data_portability.py"
      - "acs/user_data_portability_host.py"
      - "tests/test_section37_user_data_portability.py"
      - "tests/test_section37_user_data_portability_host.py"
      - ".github/workflows/section37-user-data-host.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  owner-bound-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Compile exact Section 37 sources and tests
        run: >-
          python -m py_compile
          acs/user_data_portability.py
          acs/user_data_portability_host.py
          tests/test_section37_user_data_portability.py
          tests/test_section37_user_data_portability_host.py
      - name: Verify actual native owner, bundle bytes and rollback
        run: >-
          python -m unittest -v
          tests.test_section37_user_data_portability
          tests.test_section37_user_data_portability_host
