name: D06 PGN Incremental Export

on:
  push:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/pgn_service.py'
      - 'tests/test_v2_pgn_streaming_export.py'
      - 'tests/test_d06_pgn_streaming_export_workflow.py'
      - '.github/workflows/d06-pgn-streaming-export.yml'
  pull_request:
    paths:
      - 'acs/pgn_service.py'
      - 'tests/test_v2_pgn_streaming_export.py'
      - 'tests/test_d06_pgn_streaming_export_workflow.py'
      - '.github/workflows/d06-pgn-streaming-export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d06-pgn-streaming-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind exact candidate geometry
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-}"
          if test -z "$base"; then
            base="${PUSH_BASE_SHA:-}"
          fi
          if test -z "$base" || test "$base" = "0000000000000000000000000000000000000000"; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          if git diff --name-only "$base" HEAD | grep -E '(^|/)tools/qa/|windows-stage1|release_preflight|stage1_release'; then
            echo "Stage1 or release contamination detected in candidate delta" >&2
            exit 1
          fi
          echo "D06_INCREMENTAL_EXPORT_CANDIDATE_BASE=$base"

      - name: Compile D06 export surface
        run: >-
          python -m py_compile
          acs/pgn_service.py
          tests/test_v2_pgn_streaming_export.py
          tests/test_d06_pgn_streaming_export_workflow.py

      - name: Incremental export and workflow regressions
        run: >-
          python -m unittest -v
          tests.test_v2_pgn_streaming_export
          tests.test_d06_pgn_streaming_export_workflow

      - name: Existing PGN publication and resource regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_service
          tests.test_pgn_concurrent_save
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_postcommit_cleanup_atomicity
          tests.test_dev4_pgn_resource_security
