name: Current BookReader Training Resource Convergence

on:
  pull_request:
    branches:
      - converge/current-bookdocument-training-prehash-20261004-sol56n3q8
    paths:
      - '.github/workflows/current-bookreader-training-resource-convergence.yml'
      - '.github/workflows/current-bookreader-revision-barriers.yml'
      - 'acs/bookreader.py'
      - 'tests/test_bookreader.py'
      - 'tests/test_bookreader_revision_barriers_current.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-bookreader-training-resource-convergence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact convergence candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live two-parent Product geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_BRANCH: converge/current-bookdocument-training-prehash-20261004-sol56n3q8
          READER_BRANCH: perf/current-bookreader-revision-barriers-20261004-zftrkmo
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          base_ref="${EVENT_BASE_REF:-$BASE_BRANCH}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi

          git fetch --no-tags origin "+refs/heads/$READER_BRANCH:refs/remotes/origin/$READER_BRANCH"
          live_reader="$(git rev-parse "refs/remotes/origin/$READER_BRANCH")"

          git merge-base --is-ancestor "$live_base" HEAD
          git merge-base --is-ancestor "$live_reader" HEAD

          convergence="$(git rev-parse HEAD^)"
          parents="$(git show -s --format=%P "$convergence")"
          test "$parents" = "$live_base $live_reader"

          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-bookreader-revision-barriers.yml' \
            '.github/workflows/current-bookreader-training-resource-convergence.yml' \
            'acs/bookreader.py' \
            'tests/test_bookreader.py' \
            'tests/test_bookreader_revision_barriers_current.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected BookReader/resource convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile convergence surfaces
        run: >-
          python -m compileall -q
          acs/bookreader.py
          acs/bookdocument.py
          acs/training_progress_store.py
          tests/test_bookreader.py
          tests/test_bookreader_revision_barriers_current.py
          tests/test_bookdocument_total_text_budget_current.py
          tests/test_training_progress_json_prehash_bounds_current.py

      - name: Execute focused BookReader and resource regressions
        run: >-
          python -m unittest -v
          tests.test_bookreader_revision_barriers_current
          tests.test_bookreader
          tests.test_bookdocument_total_text_budget_current
          tests.test_training_progress_json_prehash_bounds_current

      - name: Execute retained semantic navigation persistence and product regressions
        run: >-
          python -m unittest -v
          tests.test_bookreader_snapshot_bounds
          tests.test_book_progress_passive_ingress_current
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_book_training_passive_roots_current
          tests.test_w2_training_progress_crash_recovery
          tests.test_version2_training_current_runtime
          tests.test_dev1_books_training_webview_projection
          tests.test_v2_book_board_workflow
          tests.test_pgn_presenter_graph_safety_current
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
