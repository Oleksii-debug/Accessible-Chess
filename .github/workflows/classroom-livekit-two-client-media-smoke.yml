name: Classroom LiveKit Two-Client Media Smoke

on:
  pull_request:
    branches:
      - feature/livekit-join-token-issuer-20261002
    paths:
      - 'tests/livekit_two_client_token_fixture.py'
      - 'tests/js/livekit_two_client_media_smoke.js'
      - '.github/workflows/classroom-livekit-two-client-media-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-livekit-two-client-media-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LIVEKIT_SERVER_IMAGE: livekit/livekit-server@sha256:4d1cc81b039b236b2b2580714cb5d89321a7313e604274f7131cf76f7a43ef80
  LIVEKIT_SERVER_VERSION: v1.13.1
  LIVEKIT_SERVER_COMMIT: 46c4309554d37d23ee8da88a8a7e02a68fba09c1
  LIVEKIT_PACKAGE_AUTHORITY_SHA: 5bed16d9bc761131e7a7ce01c3a3a62acf692c5f
  LIVEKIT_PACKAGE_STAGER_BLOB: 8e7fb562723af5fe7079871e7231bbef4f28a7f4
  LIVEKIT_API_WHEEL_SHA256: aa15b0a194c9e8167d4261bc61381682df23f98bc6d77760fcded93d2ce4b4ca
  PLAYWRIGHT_VERSION: 1.55.0

jobs:
  real-provider-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove bounded QA-only scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/livekit-join-token-issuer-20261002"
          git fetch --no-tags origin "+refs/heads/$EXPECTED_BASE_REF:refs/remotes/origin/$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | LC_ALL=C sort)"
          expected="$(printf '%s\n'             '.github/workflows/classroom-livekit-two-client-media-smoke.yml'             'tests/js/livekit_two_client_media_smoke.js'             'tests/livekit_two_client_token_fixture.py' | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --quiet "$base...HEAD" --             acs             web             run_accessible_chess_v2.py
          echo "LIVEKIT_TWO_CLIENT_QA_SCOPE=PASS base=$base"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile smoke fixture and replay canonical contracts
        run: |
          python -m py_compile tests/livekit_two_client_token_fixture.py
          python -m unittest -v             tests.test_livekit_join_token_issuer             tests.test_classroom_join_credentials             tests.test_classroom_realtime_media
          node tests/js/livekit_classroom_media_adapter_test.js

      - name: Verify and install exact LiveKit server SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .livekit-smoke/sdk
          python -m pip download --disable-pip-version-check --no-deps             --only-binary=:all: --dest .livekit-smoke/sdk livekit-api==1.2.1
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os

          files = list(Path(".livekit-smoke/sdk").glob("*"))
          assert len(files) == 1, files
          wheel = files[0]
          assert wheel.name == "livekit_api-1.2.1-py3-none-any.whl", wheel.name
          assert sha256(wheel.read_bytes()).hexdigest() == os.environ["LIVEKIT_API_WHEEL_SHA256"]
          print("LIVEKIT_SERVER_SDK_WHEEL=PASS")
          PY
          python -m pip install --disable-pip-version-check -q .livekit-smoke/sdk/livekit_api-1.2.1-py3-none-any.whl

      - name: Materialize exact browser SDK through package-owner stager
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${LIVEKIT_PACKAGE_AUTHORITY_SHA}^{commit}" ||             git fetch --no-tags origin "$LIVEKIT_PACKAGE_AUTHORITY_SHA"
          git show "$LIVEKIT_PACKAGE_AUTHORITY_SHA:scripts/stage_livekit_client_sdk.py"             > .livekit-smoke/stage_livekit_client_sdk.py
          test "$(git hash-object .livekit-smoke/stage_livekit_client_sdk.py)" = "$LIVEKIT_PACKAGE_STAGER_BLOB"
          url="$(python .livekit-smoke/stage_livekit_client_sdk.py --print-tarball-url)"
          python - "$url" <<'PY'
          import sys
          import urllib.request

          request = urllib.request.Request(
              sys.argv[1],
              headers={"User-Agent": "Accessible-Chess-CI/1.0 two-client-media-smoke"},
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
          with open(".livekit-smoke/livekit-client.tgz", "wb") as stream:
              stream.write(data)
          print("LIVEKIT_CLIENT_TARBALL_DOWNLOADED", len(data))
          PY
          python .livekit-smoke/stage_livekit_client_sdk.py             .livekit-smoke/livekit-client.tgz .livekit-smoke/vendor
          test -s .livekit-smoke/vendor/livekit-client.umd.js
          echo "LIVEKIT_BROWSER_SDK_STAGED=PASS"

      - name: Pull and start exact canonical LiveKit server
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$LIVEKIT_SERVER_IMAGE"
          docker run -d --rm             --name accessible-chess-livekit-smoke             --network host             "$LIVEKIT_SERVER_IMAGE"             --dev --bind 127.0.0.1
          python - <<'PY'
          import socket
          import time

          deadline = time.monotonic() + 30
          while True:
              try:
                  with socket.create_connection(("127.0.0.1", 7880), timeout=1):
                      print("LIVEKIT_SERVER_READY=PASS")
                      break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise SystemExit("LiveKit server did not become ready")
                  time.sleep(0.25)
          PY
          docker logs accessible-chess-livekit-smoke --tail 80

      - name: Install pinned browser test harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium
          node -e 'const p=require("playwright/package.json"); if(p.version!==process.env.PLAYWRIGHT_VERSION) throw new Error("Playwright version drift");'

      - name: Run real two-client microphone and camera publish-subscribe smoke
        shell: bash
        run: |
          set -euo pipefail
          python tests/livekit_two_client_token_fixture.py             --api-key devkey             --api-secret secret             --room accessible-chess-media-smoke             --output .livekit-smoke/credentials.json
          node tests/js/livekit_two_client_media_smoke.js             --credentials .livekit-smoke/credentials.json             --sdk .livekit-smoke/vendor/livekit-client.umd.js             --adapter web/livekit_classroom_media.js
          rm -f .livekit-smoke/credentials.json

      - name: Prove fixture does not embed provider credentials or alternate product authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'devkey|api_secret\s*=|server-secret|LIVEKIT_API_SECRET'             tests/livekit_two_client_token_fixture.py             tests/js/livekit_two_client_media_smoke.js
          ! grep -Eq 'chesscore|Board\(|ClassroomRoster|room_admin|AccessToken'             tests/js/livekit_two_client_media_smoke.js
          grep -Fq 'LiveKitJoinTokenIssuer' tests/livekit_two_client_token_fixture.py
          grep -Fq 'setLocalSource("microphone", true)' tests/js/livekit_two_client_media_smoke.js
          grep -Fq 'setLocalSource("camera", true)' tests/js/livekit_two_client_media_smoke.js
          echo "LIVEKIT_TWO_CLIENT_SMOKE_BOUNDARIES=PASS"

      - name: Show provider diagnostics on failure
        if: failure()
        run: docker logs accessible-chess-livekit-smoke --tail 200 || true

      - name: Stop provider
        if: always()
        run: docker rm -f accessible-chess-livekit-smoke >/dev/null 2>&1 || true
