name: Current Engine Move Passive DTO

on:
  pull_request:
    branches:
      - converge/current-analysis-owner-wav-regression-20261004-ooxple7
    paths:
      - 'acs/engine_ports.py'
      - 'tests/test_current_engine_move_passive_dto.py'
      - '.github/workflows/current-engine-move-passive-dto.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-engine-move-passive-dto-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-analysis-owner-wav-regression-20261004-ooxple7}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-engine-move-passive-dto.yml' \
            'acs/engine_ports.py' \
            'tests/test_current_engine_move_passive_dto.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Engine move DTO scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile move DTO boundary
        run: >-
          python -m compileall -q
          acs/engine_ports.py
          tests/test_current_engine_move_passive_dto.py

      - name: Execute move DTO and retained runtime regressions
        run: >-
          python -m unittest -v
          tests.test_current_engine_move_passive_dto
          tests.test_engine_play_service
          tests.test_current_remaining_engine_fen_bounds
          tests.test_current_engine_fen_passive_bounds
          tests.test_current_analysis_error_boundary
          tests.test_current_analysis_passive_dto_boundary
          tests.test_engine_game_session
          tests.test_continuous_analysis
          tests.test_board_service_passive_boundary
          tests.test_training_progress_passive_ingress
          tests.test_v2_book_board_workflow

      - name: Core selftest
        run: python -m acs.selftest
