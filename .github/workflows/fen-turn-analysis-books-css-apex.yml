name: FEN Turn and Analysis Lock on Books CSS Apex

on:
  pull_request:
    branches:
      - converge/fen-editor-feedback-books-css-apex-20261006-hy6ez0h113
    paths:
      - '.github/workflows/fen-turn-analysis-books-css-apex.yml'
      - 'acs/webapp.py'
      - 'tests/test_fen_editor_turn_and_visible_status.py'
      - 'web/index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fen-turn-analysis-books-css-apex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WEBAPP_BLOB: 51cc882511c3a874f7bce3dfa97eda01df1501c6
  TURN_TEST_BLOB: ccea833f59cbca7639aebb5d4c7c682bd7032cf8
  WEB_INDEX_BLOB: f70aac53dc60ffaacca222ecccd7799741f480cd

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove live parent and bounded child
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/fen-editor-feedback-books-css-apex-20261006-hy6ez0h113}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n'             '.github/workflows/fen-turn-analysis-books-css-apex.yml'             'acs/webapp.py'             'tests/test_fen_editor_turn_and_visible_status.py'             'web/index.html' | sort)"
          test "$changed" = "$expected_paths"
          test "$(git rev-parse HEAD:acs/webapp.py)" = "$WEBAPP_BLOB"
          test "$(git rev-parse HEAD:tests/test_fen_editor_turn_and_visible_status.py)" = "$TURN_TEST_BLOB"
          test "$(git rev-parse HEAD:web/index.html)" = "$WEB_INDEX_BLOB"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/webapp.py
          tests/test_fen_editor_turn_and_visible_status.py

      - name: Validate WebView JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          script = html.split("<script>", 1)[1].rsplit("</script>", 1)[0]
          Path(".fen-turn-analysis-web.js").write_text(script, encoding="utf-8")
          PY
          node --check .fen-turn-analysis-web.js

      - name: Execute FEN editor and analysis safety
        run: >-
          python -m unittest -v
          tests.test_fen_editor_turn_and_visible_status
          tests.test_fen_position_editor_complete_user_flow
          tests.test_ui_analysis_webapp
          tests.test_analysis_webview_bridge
          tests.test_position_editor
          tests.test_position_text_authority
          tests.test_fen_input_budget_current

      - name: Preserve application and accessibility composition
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_dev1_full_product_webview_adapter
          tests.test_version2_final_product_composition
          tests.test_webapp_accessibility
          tests.test_webapp_release_ui

      - name: Preserve current Books runtime adjacency
        run: >-
          python -m unittest -v
          tests.test_book_html_runtime_correctness
          tests.test_book_epub_runtime_correctness
          tests.test_book_reader

      - name: Core selftest
        run: python -m acs.selftest
