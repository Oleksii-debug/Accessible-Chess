  FULL_PRODUCT_PRESENTERS_BLOB: aa9c7c10a03fbe85bfa9a3b542188a5b31fee655
  PGN_WEBVIEW_PROJECTION_TEST_BLOB: 1488fd39957bb412c0e551252a4364629f816481
  PGN_PRESENTER_GRAPH_TEST_BLOB: c66f1473f46f1595add938b27f9e8ea553e91348
  RESOURCE_SECURITY_TEST_BLOB: 6f4d34d2c42a6bd5c5692ae131b1286d23e8d78d
