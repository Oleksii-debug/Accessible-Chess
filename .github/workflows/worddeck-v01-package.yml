name: WordDeck V0.1 user-safe package

on:
  push:
    branches: [worddeck-bootstrap]
    paths:
      - 'WordDeck/**'
      - '.github/workflows/worddeck-v01-package.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  AUDIO_SOURCE_RUN_ID: '32415680535'
  AUDIO_ARTIFACT_ID: '9424683598'
  AUDIO_ARTIFACT_NAME: 'worddeck-oxford5000-en-gb-complete'
  AUDIO_ARTIFACT_DIGEST: 'sha256:017ccdbf79045f0be7564710a70d09fd1267c3d95c21ef8a6a1527abb46b6447'
  RELEASE_NAME: 'WordDeck-v0.1-first-usable-win-x64'

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Publish pending package status
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'WordDeck V0.1 user-safe package',
              description: 'User-state continuity and exact accepted AudioPack package gate is running.',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

      - name: Verify exact accepted AudioPack artifact identity
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = Number(process.env.AUDIO_SOURCE_RUN_ID);
            const artifactId = Number(process.env.AUDIO_ARTIFACT_ID);
            const expectedName = process.env.AUDIO_ARTIFACT_NAME;
            const expectedDigest = process.env.AUDIO_ARTIFACT_DIGEST;
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100
            });
            const artifact = response.data.artifacts.find(a => a.id === artifactId && a.name === expectedName);
            if (!artifact) throw new Error(`Accepted AudioPack artifact ${artifactId}/${expectedName} not found in run ${runId}.`);
            if (artifact.expired) throw new Error('Accepted AudioPack artifact is expired.');
            if (artifact.digest && artifact.digest !== expectedDigest) throw new Error(`AudioPack digest mismatch: ${artifact.digest}`);
            core.info(`Accepted AudioPack identity PASS: run=${runId} id=${artifact.id} name=${artifact.name} digest=${artifact.digest || expectedDigest}`);

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download exact accepted AudioPack
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIO_SOURCE_RUN_ID }}
          name: ${{ env.AUDIO_ARTIFACT_NAME }}
          path: .\artifacts\audio-download

      - name: Build clean self-contained release and install AudioPack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force .\artifacts\audio | Out-Null
          $zip = Get-ChildItem .\artifacts\audio-download -Filter *.zip -File | Select-Object -First 1
          if (-not $zip) { throw 'Accepted AudioPack ZIP missing after exact-run download.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath .\artifacts\audio -Force
          $audioFiles = @(Get-ChildItem .\artifacts\audio -Filter *.mp3 -File)
          if ($audioFiles.Count -ne 2138) { throw "Accepted AudioPack must contain 2138 MP3 files; got $($audioFiles.Count)." }
          dotnet restore .\WordDeck\WordDeck.csproj
          dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore
          dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\release
          Copy-Item .\WordDeck\README_FIRST_USABLE_UK.md .\artifacts\release\README_UK.md
          Copy-Item .\WordDeck\THIRD_PARTY_NOTICES.md .\artifacts\release\THIRD_PARTY_NOTICES.md
          $pack = '.\artifacts\release\AudioPacks\oxford-3000-en-uk'
          New-Item -ItemType Directory -Force $pack | Out-Null
          Copy-Item .\artifacts\audio\*.mp3 $pack
          Copy-Item .\artifacts\audio\audiopack-manifest.json "$pack\manifest.json"
          Copy-Item .\artifacts\audio\audio-integrity.tsv "$pack\audio-integrity.tsv"

      - name: Validate V0.1 executable, profile contract and local 2138-ID audio resolution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $root = '.\artifacts\release'
          $pack = "$root\AudioPacks\oxford-3000-en-uk"
          foreach ($required in @("$root\WordDeck.exe","$root\README_UK.md","$root\THIRD_PARTY_NOTICES.md","$pack\manifest.json","$pack\audio-integrity.tsv")) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Release file missing: $required" }
          }

          & "$root\WordDeck.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged WordDeck self-test failed: $LASTEXITCODE" }

          $source = '.\artifacts\published-audio-source.tsv'
          & "$root\WordDeck.exe" --export-oxford5000-audio-source $source
          if ($LASTEXITCODE -ne 0) { throw "Packaged audio-source export failed: $LASTEXITCODE" }
          $rows = @(Import-Csv -Delimiter "`t" $source)
          if ($rows.Count -ne 2138) { throw "Packaged EXE exported $($rows.Count) Oxford5000 audio rows; expected 2138." }

          $missing = @()
          foreach ($row in $rows) {
            $path = Join-Path $pack ($row.entry_id + '.mp3')
            $exists = Test-Path -LiteralPath $path -PathType Leaf
            if (-not $exists) { $missing += $row.entry_id; continue }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -le 512) { $missing += $row.entry_id }
          }
          if ($missing.Count -ne 0) { throw "Offline stable-ID resolution has $($missing.Count) missing/small entries." }
          if (@(Get-ChildItem $pack -Filter *.mp3 -File).Count -ne 2138) { throw 'Packaged MP3 count mismatch.' }

          $manifest = Get-Content "$pack\manifest.json" -Raw | ConvertFrom-Json
          if ([int]$manifest.entry_count -ne 2138) { throw "Manifest entry_count=$($manifest.entry_count), expected 2138." }
          $integrity = @(Import-Csv -Delimiter "`t" "$pack\audio-integrity.tsv")
          $metrics = @{}
          foreach ($row in $integrity) { $metrics[[string]$row.metric] = [string]$row.value }
          $expectedMetrics = @{
            'covered_ids'='2138'; 'physical_assets'='2138'; 'missing'='0'; 'orphan'='0';
            'duplicate_id_collisions'='0'; 'corrupt_or_unplayable'='0'; 'qa_result'='PASS'
          }
          foreach ($name in $expectedMetrics.Keys) {
            if (-not $metrics.ContainsKey($name)) { throw "Integrity metric missing: $name" }
            if ($metrics[$name] -ne $expectedMetrics[$name]) { throw "Integrity metric failed: $name=$($metrics[$name])" }
          }

          $sampleIds = @($rows[0].entry_id, $rows[[int]($rows.Count / 2)].entry_id, $rows[-1].entry_id)
          foreach ($id in $sampleIds) {
            $sample = Join-Path $pack ($id + '.mp3')
            $bytes = [System.IO.File]::ReadAllBytes($sample)
            if ($bytes.Length -le 512) { throw "Representative MP3 too small: $id" }
            $looksLikeMp3 = ($bytes[0] -eq 0x49 -and $bytes[1] -eq 0x44 -and $bytes[2] -eq 0x33) -or (($bytes[0] -eq 0xFF) -and (($bytes[1] -band 0xE0) -eq 0xE0))
            if (-not $looksLikeMp3) { throw "Representative MP3 header invalid: $id" }
          }
          Write-Host 'Representative packaged MP3 parser/header smoke PASS (first/middle/last); source AudioPack already passed ffprobe on all 2138 files.'

          $proc = Start-Process "$root\WordDeck.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($proc.HasExited) { throw "Packaged WordDeck exited immediately with code $($proc.ExitCode)." }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'V0.1 PACKAGE ACCEPTANCE PASS: self-test, launch smoke, 2138/2138 local audio, manifest/integrity and clean release layout.'

      - name: Prove clean ZIP excludes personal state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $forbidden = @(Get-ChildItem .\artifacts\release -Recurse -File | Where-Object {
            $_.Name -match '^state(\.backup)?\.json$' -or $_.Name -like 'WordDeck-profile*.json' -or $_.Name -match '(token|secret|credential)' 
          })
          if ($forbidden.Count -ne 0) { throw "Release contains forbidden personal/secret files: $($forbidden.FullName -join ', ')" }
          Write-Host 'Clean public release PASS: no LocalAppData state or exported personal profile is packaged.'

      - uses: actions/upload-artifact@v4
        with:
          name: WordDeck-v0.1-first-usable-win-x64
          path: .\artifacts\release\**
          if-no-files-found: error
          retention-days: 90

      - name: Publish final package status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: ok ? 'success' : 'failure', context: 'WordDeck V0.1 user-safe package',
              description: ok ? 'V0.1 user-state and 2138-ID offline package gate passed.' : 'V0.1 package gate failed; inspect exact run.',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
