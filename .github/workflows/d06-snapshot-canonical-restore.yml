name: D06 Snapshot Canonical Restore

on:
  pull_request:
    paths:
      - 'acs/gametree_snapshot.py'
      - 'tests/test_d06_snapshot_canonical_restore.py'
      - '.github/workflows/d06-snapshot-canonical-restore.yml'

permissions:
  contents: read

concurrency:
  group: d06-snapshot-canonical-restore-${{ github.ref }}
  cancel-in-progress: true

env:
  D06_SNAPSHOT_BASE: 575ec0088982d2f90adb47c040a5714d68186b0e

jobs:
  snapshot-restore:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact authority and narrow successor scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$D06_SNAPSHOT_BASE^{commit}"
          test "$(git merge-base HEAD "$D06_SNAPSHOT_BASE")" = "$D06_SNAPSHOT_BASE"
          git diff --check "$D06_SNAPSHOT_BASE" HEAD
          changed="$(git diff --name-only "$D06_SNAPSHOT_BASE" HEAD | sort)"
          printf '%s\n' "$changed"
          test -n "$changed"
          test "$(printf '%s\n' "$changed" | grep -Fxc '.github/workflows/d06-snapshot-canonical-restore.yml')" = 1
          test "$(printf '%s\n' "$changed" | grep -Fxc 'tests/test_d06_snapshot_canonical_restore.py')" = 1
          unexpected="$(printf '%s\n' "$changed" | grep -vFx \
            -e '.github/workflows/d06-snapshot-canonical-restore.yml' \
            -e 'tests/test_d06_snapshot_canonical_restore.py' \
            -e 'acs/gametree_snapshot.py' || true)"
          test -z "$unexpected"
          git diff --quiet "$D06_SNAPSHOT_BASE" HEAD -- acs || test "$changed" != "$(printf '%s\n' "$changed" | grep -vFx 'acs/gametree_snapshot.py')"
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "96d62bf6dd7b2f5c8a75d5f2bd1fde2ad0823d20"
          test "$(git rev-parse HEAD:acs/gametree.py)" = "9d70cb4c8f32fcca732b6880be9eca5cd4a3c069"
          echo 'D06 SNAPSHOT SUCCESSOR SCOPE PASS'

      - name: Compile snapshot module and RED-first regression
        run: |
          python -m py_compile acs/gametree_snapshot.py tests/test_d06_snapshot_canonical_restore.py
          python -m unittest -v tests.test_d06_snapshot_canonical_restore

      - name: Focused D06 snapshot and PGN regressions
        run: >-
          python -m unittest -v
          tests.test_d06_snapshot_canonical_restore
          tests.test_d06_pgn_roundtrip
          tests.test_d06_file_ingress_nag_normalization
          tests.test_d06_real_corpus_recovery
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_game_identity
          tests.test_gametree
          tests.test_version2_formats_integration

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
