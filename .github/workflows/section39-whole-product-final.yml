name: Section 39 Whole Product Final

on:
  push:
    branches:
      - converge/section39-whole-product-final-current-20261008-sol56
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section39-whole-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  whole-product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check

      - name: Persistence owner regression sweep
        run: >-
          python -m unittest -v
          tests.test_settings
          tests.test_settings_corruption_security
          tests.test_v2_book_progress_store
          tests.test_w2_training_progress_crash_recovery
          tests.test_education_workspace
          tests.test_media_timeline_store
          tests.test_local_profile
          tests.test_agent_checkpoint_crossrepo

      - name: Release and package regression sweep
        run: >-
          python -m unittest -v
          tests.test_release_preflight
          tests.test_version2_package_preflight
          tests.test_version2_portable_package

      - name: Core selftest
        run: python -m acs.selftest
