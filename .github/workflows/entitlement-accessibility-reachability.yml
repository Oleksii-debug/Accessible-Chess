name: Entitlement Accessibility Reachability

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/ui_entitlement.py'
      - 'acs/entitlement_accessibility.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_ui_shell.py'
      - 'tests/test_entitlement_accessibility.py'
      - 'tests/test_dev1_full_product_accessible_shell.py'
      - 'tests/test_dev1_full_product_ui_packages.py'
      - '.github/workflows/entitlement-accessibility-reachability.yml'

permissions:
  contents: read

concurrency:
  group: entitlement-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2

      - name: Compile accessibility composition
        run: >-
          python -m py_compile
          acs/ui_entitlement.py
          acs/entitlement_accessibility.py
          acs/full_product_actions.py
          acs/full_product_ui_shell.py
          tests/test_entitlement_accessibility.py
          tests/test_dev1_full_product_accessible_shell.py

      - name: Run entitlement and shell regressions
        run: >-
          python -m pytest -q
          tests/test_entitlement_accessibility.py
          tests/test_dev1_full_product_accessible_shell.py
          tests/test_dev1_full_product_ui_packages.py
