name: D06 File Ingress NAG Normalization

on:
  pull_request:
    paths:
      - 'acs/pgn_service.py'
      - 'tests/test_d06_file_ingress_nag_normalization.py'
      - '.github/workflows/d06-file-ingress-nag-normalization.yml'

permissions:
  contents: read

env:
  D06_INGRESS_BASE: d706eb93b9a4df3c6e99ab1af584a9cfe6b6f5ea

jobs:
  d06-ingress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact base and narrow scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$D06_INGRESS_BASE^{commit}"
          test "$(git merge-base HEAD "$D06_INGRESS_BASE")" = "$D06_INGRESS_BASE"
          git diff --check "$D06_INGRESS_BASE" HEAD
          changed="$(git diff --name-only "$D06_INGRESS_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d06-file-ingress-nag-normalization.yml' \
            'tests/test_d06_file_ingress_nag_normalization.py' | sort)"
          if git diff --name-only "$D06_INGRESS_BASE" HEAD | grep -qx 'acs/pgn_service.py'; then
            expected="$(printf '%s\n%s\n' "$expected" 'acs/pgn_service.py' | sort)"
          fi
          test "$changed" = "$expected"
          git diff --quiet "$D06_INGRESS_BASE" HEAD -- acs/gametree.py acs/pgn_roundtrip.py acs/pgn_document.py web run_accessible_chess.py
          echo 'D06 FILE INGRESS NAG SCOPE PASS'

      - name: Compile
        run: python -m compileall -q acs tests/test_d06_file_ingress_nag_normalization.py

      - name: Attached NAG ingress regression
        run: python -m unittest -v tests.test_d06_file_ingress_nag_normalization

      - name: Focused D06 and D04 regressions
        run: >-
          python -m unittest -v
          tests.test_d06_pgn_roundtrip
          tests.test_pgn_service
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_dev4_pgn_resource_security
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_truncation_quality
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_postcommit_cleanup_atomicity

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
