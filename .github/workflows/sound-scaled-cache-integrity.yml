name: Sound Scaled Cache Integrity

on:
  pull_request:
    paths:
      - 'acs/sound_windows.py'
      - 'tests/test_sound_runtime.py'
      - 'tests/test_sound_events.py'
      - 'tests/test_dev3_sound_failure_isolation.py'
      - '.github/workflows/sound-scaled-cache-integrity.yml'

permissions:
  contents: read

jobs:
  sound-cache-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove bounded current-Product scope
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$BASE_REF" = "work/full-product-teacher-education-reachability-20260911"
          base="refs/remotes/origin/$BASE_REF"
          git show-ref --verify --quiet "$base"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          unexpected="$(git diff --name-only "$base" HEAD | grep -Ev '^(acs/sound_windows\.py|tests/test_sound_runtime\.py|\.github/workflows/sound-scaled-cache-integrity\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected sound-cache scope:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Compile sound authority
        run: python -m py_compile acs/sound_events.py acs/sound_runtime.py acs/sound_windows.py tests/test_sound_runtime.py tests/test_sound_events.py tests/test_dev3_sound_failure_isolation.py

      - name: Run sound regressions
        run: >-
          python -m unittest -v
          tests.test_sound_runtime
          tests.test_sound_events
          tests.test_dev3_sound_failure_isolation
