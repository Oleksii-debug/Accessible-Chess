name: DEV3 D01 LF-Normalized Validation

on:
  pull_request:
    branches:
      - qa/dev3-d01-lf-validation-ci-base-20260823
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: 4fbc8654dbe2796b45c9e72870668d2e7759c65a
  PRODUCT_BOOTSTRAP_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  DEV5_ORACLE_SHA: 965f8ed95eb2ae4f2e628b77855c0a6dbd0d4321
  DEV5_ORACLE_BLOB: 2fec761ded7e3af193b6f309f03876141be8ab41

jobs:
  exact-product-validation:
    name: exact D01 validation — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout validation merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact repository LF bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Prove exact Product and validation-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse "$PRODUCT_SHA:web/stage1_release_bootstrap.js")" = "$PRODUCT_BOOTSTRAP_BLOB"
          test "$(git rev-parse 'HEAD:web/stage1_release_bootstrap.js')" = "$PRODUCT_BOOTSTRAP_BLOB"
          git diff --check "$PRODUCT_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$PRODUCT_SHA" HEAD | sort)
          expected=(
            ".github/workflows/dev3-d01-lf-validation.yml"
            "qa/dev3_d01_lf_validation_marker.txt"
          )
          printf '%s\n' "${changed[@]}" > changed.txt
          printf '%s\n' "${expected[@]}" | sort > expected.txt
          diff -u expected.txt changed.txt
          test "$(git rev-parse "$DEV5_ORACLE_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py")" = "$DEV5_ORACLE_BLOB"
          echo "DEV3 EXACT D01 PRODUCT LOCK PASS: $PRODUCT_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install -q pytest

      - name: Parse release JavaScript
        run: |
          node --check web/stage1_release_bootstrap.js
          node --check web/stage1_board_actions.js

      - name: Replay immutable DEV5 retained-listener oracle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf qa_oracles
          mkdir -p qa_oracles
          : > qa_oracles/__init__.py
          git show "$DEV5_ORACLE_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py" > qa_oracles/test_dev5_stage1_submit_listener_focus_route.py
          test "$(git hash-object qa_oracles/test_dev5_stage1_submit_listener_focus_route.py)" = "$DEV5_ORACLE_BLOB"
          python -m unittest -v qa_oracles.test_dev5_stage1_submit_listener_focus_route

      - name: Focus and release contracts
        run: >-
          python -m unittest -v
          tests.test_d01_submit_focus_route_contract
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_issue22_release_contract
          tests.test_stage1_release_composition_ui
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_native_menu_action_routing

      - name: Full unittest
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Full pytest
        run: python -m pytest -q

      - name: Canonical SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          echo "DEV3 D01 LF-NORMALIZED VALIDATION PASS on $RUNNER_OS"
