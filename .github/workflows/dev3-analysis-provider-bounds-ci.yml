name: DEV3 Analysis Provider Bounds CI

on:
  pull_request:
    branches:
      - auto/dev3-analysis-provider-bounds-ci-base-20260823

permissions:
  contents: read

concurrency:
  group: dev3-analysis-provider-bounds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-provider-bounds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install -q pytest

      - name: Diff hygiene
        run: git diff --check 02241201b0fff72abdacd9157053d12f5c665d05 HEAD

      - name: Compile Product and tests
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused analysis provider regressions
        run: >-
          python -m unittest -v
          tests.test_dev3_analysis_provider_resource_bounds
          tests.test_analysis_service
          tests.test_dev3_analysis_request_bounds
          tests.test_continuous_analysis
          tests.test_dev3_continuous_fen_bounds
          tests.test_ui_analysis_adapter
          tests.test_dev3_engine_assisted_workflows
          tests.test_dev3_assisted_fen_bounds
          tests.test_dev3_game_review_service

      - name: Full unittest regression
        run: python -m unittest discover -s tests -v

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Accessible Chess complete diagnostic
        run: python run_accessible_chess.py --diagnostic complete
