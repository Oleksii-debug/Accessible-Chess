name: Current Windows PGN Import Convergence

on:
  push:
    branches:
      - converge/current-windows-pgn-import-apex-20261006-c2m82
  pull_request:
    branches:
      - fix/pgn-save-owner-commit-atomicity-20261006-c2m82
    paths:
      - acs/**
      - tests/**
      - .github/workflows/current-windows-pgn-import-convergence.yml

permissions:
  contents: read

concurrency:
  group: current-windows-pgn-import-convergence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_MERGE: 2fe0b4c6799d690fbe6beec6442ecffc0a034fb3
  EXPECTED_PGN_PARENT: 890eb81b5ad803549f42ecd98fe0fb3912d2f887
  PGN_BRANCH: fix/pgn-save-owner-commit-atomicity-20261006-c2m82
  EXPECTED_IMPORT_PARENT: 3d409032122e1358294e00b51d8b82747c0476f4
  IMPORT_BRANCH: fix/windows-import-worker-services-dataclass-20261006-c2m82

jobs:
  convergence:
    name: PGN + import convergence / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out exact convergence head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove two-parent merge authority
        shell: bash
        run: |
          set -euo pipefail
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$head"
          git merge-base --is-ancestor "$EXPECTED_MERGE" HEAD

          receipt="$(git rev-list --parents -n 1 "$EXPECTED_MERGE")"
          expected="$EXPECTED_MERGE $EXPECTED_PGN_PARENT $EXPECTED_IMPORT_PARENT"
          test "$receipt" = "$expected" || {
            echo "WINDOWS_CONVERGENCE_RECEIPT_MISMATCH" >&2
            echo "expected=$expected" >&2
            echo "actual=$receipt" >&2
            exit 1
          }

          git fetch --no-tags origin             "+refs/heads/$PGN_BRANCH:refs/remotes/origin/pgn-parent"             "+refs/heads/$IMPORT_BRANCH:refs/remotes/origin/import-parent"
          test "$(git rev-parse refs/remotes/origin/pgn-parent)" = "$EXPECTED_PGN_PARENT" || {
            echo "WINDOWS_CONVERGENCE_PGN_PARENT_MOVED" >&2
            exit 1
          }
          test "$(git rev-parse refs/remotes/origin/import-parent)" = "$EXPECTED_IMPORT_PARENT" || {
            echo "WINDOWS_CONVERGENCE_IMPORT_PARENT_MOVED" >&2
            exit 1
          }

          git diff --check "$EXPECTED_PGN_PARENT"...HEAD
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.yml' || true)"
          echo "WINDOWS_CONVERGENCE_MERGE=$EXPECTED_MERGE"
          echo "WINDOWS_CONVERGENCE_HEAD=$head"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged Windows boundaries
        run: >-
          python -m py_compile
          acs/pgn_document.py
          acs/pgn_save_snapshot.py
          acs/pgn_workspace.py
          acs/chessbase_library_import.py
          acs/library_webview_projection.py
          acs/version2_application.py
          acs/version2_windows_file_workflows.py
          acs/version2_windows_import_event_mailbox.py
          acs/version2_windows_import_ui_pump.py
          acs/version2_windows_library_import_observer.py

      - name: Run converged PGN persistence and Windows UI regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_save_snapshot
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_file_logging_passive
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_progress_coherence
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_library_import_observer
          tests.test_v2_windows_nvda_file_workflows
          tests.test_version2_application
          tests.test_chessbase_library_import_report_passive

      - name: Core selftest
        run: python -m acs.selftest
