name: WordDeck attributed SentencePack build

on:
  push:
    branches:
      - worddeck-bootstrap
      - worddeck-swarm-dev02-context-sentence-r5
    paths:
      - '.github/workflows/worddeck-sentencepack-ccby.yml'
      - 'WordDeck/tools/build_tatoeba_ccby_pairs.py'
      - 'WordDeck/tools/validate_sentencepack_release_bundle.py'
      - 'WordDeck/TatoebaImportProvenance.cs'
      - 'WordDeck/TatoebaSentencePackBuilder.cs'
      - 'WordDeck/SentencePackDiagnostics.cs'
      - 'WordDeck/SentencePackIo.cs'
      - 'WordDeck/SentencePackSqlitePrototype.cs'
      - 'WordDeck/SentencePackSqliteCorpus.cs'
      - 'WordDeck/SentencePackSqliteRuntimeQuery.cs'
      - 'WordDeck/SentencePackLicenseValidator.cs'
      - 'WordDeck/ContextCorpusCoverageEvidence.cs'
      - 'WordDeck/ContextCorpusCoverageEvidenceCommand.cs'
      - 'WordDeck/ContextCorpusGapRemediation.cs'
      - 'WordDeck/ContextPracticeCore.cs'
      - 'WordDeck/ContextPracticeProductFacade.cs'
      - 'WordDeck/ContextSentenceSqliteSource.cs'
      - 'WordDeck/ContextTargetPlanning.cs'
      - 'WordDeck/DictionaryLoader.cs'
      - 'WordDeck/ReviewedOxford5000Bootstrap.cs'
      - 'WordDeck/Data/**'
      - 'WordDeck/WordDeck.csproj'
      - 'WordDeck/Program.cs'
  pull_request:
    branches:
      - worddeck-bootstrap
    paths:
      - '.github/workflows/worddeck-sentencepack-ccby.yml'
      - 'WordDeck/tools/build_tatoeba_ccby_pairs.py'
      - 'WordDeck/tools/validate_sentencepack_release_bundle.py'
      - 'WordDeck/TatoebaImportProvenance.cs'
      - 'WordDeck/TatoebaSentencePackBuilder.cs'
      - 'WordDeck/SentencePackDiagnostics.cs'
      - 'WordDeck/SentencePackSqlitePrototype.cs'
      - 'WordDeck/SentencePackSqliteCorpus.cs'
      - 'WordDeck/SentencePackLicenseValidator.cs'
      - 'WordDeck/ContextCorpusCoverageEvidence.cs'
      - 'WordDeck/ContextCorpusCoverageEvidenceCommand.cs'
      - 'WordDeck/ContextCorpusGapRemediation.cs'
      - 'WordDeck/ContextPracticeProductFacade.cs'
      - 'WordDeck/ContextSentenceTargetSpelling.cs'
      - 'WordDeck/DictionaryLoader.cs'
      - 'WordDeck/ReviewedOxford5000Bootstrap.cs'
      - 'WordDeck/Data/**'
      - 'WordDeck/WordDeck.csproj'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-attributed-pack:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate attributed pair and release-bundle tools
        shell: pwsh
        run: |
          python .\WordDeck\tools\build_tatoeba_ccby_pairs.py --self-test
          python .\WordDeck\tools\validate_sentencepack_release_bundle.py --self-test

      - name: Restore build and regression test
        shell: pwsh
        run: |
          dotnet restore .\WordDeck\WordDeck.csproj
          dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Download detailed exports and build attributed EN-UA pairs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\sentencepack-ccby | Out-Null
          python .\WordDeck\tools\build_tatoeba_ccby_pairs.py `
            --download-dir .\sentencepack-ccby\upstream `
            --output .\sentencepack-ccby\tatoeba-en-uk-ccby.tsv `
            --manifest .\sentencepack-ccby\tatoeba-en-uk-ccby.tsv.manifest.json

      - name: Build attributed WordDeck SentencePack
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --build-tatoeba-sentence-pack `
            .\sentencepack-ccby\tatoeba-en-uk-ccby.tsv `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json `
            "tatoeba-en-uk-ccby-$stamp" 2>&1 | Tee-Object -FilePath .\sentencepack-ccby\builder.log

      - name: Validate attribution and write current 5446-aware inventory report
        shell: pwsh
        run: |
          $packPath = '.\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json'
          $pack = Get-Content $packPath -Raw | ConvertFrom-Json
          if ($pack.License -ne 'CC BY 2.0 FR') { throw "Unexpected license: $($pack.License)" }
          if ($pack.Sentences.Count -lt 1) { throw 'Attributed pack contains no accepted sentences.' }
          $missingAttribution = @($pack.Sentences | Where-Object { $_.Source -notmatch '^Tatoeba; English sentence #[0-9]+ by .+; Ukrainian sentence #[0-9]+ by .+\.$' }).Count
          if ($missingAttribution -ne 0) { throw "$missingAttribution accepted sentences are missing exact per-side author attribution." }
          $missingUpstreamIds = @($pack.Sentences | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.SourceSentenceId) -or
            [string]::IsNullOrWhiteSpace([string]$_.TranslationSentenceId)
          }).Count
          if ($missingUpstreamIds -ne 0) { throw "$missingUpstreamIds accepted sentences are missing upstream sentence IDs." }

          $targetRefs = @($pack.Sentences | ForEach-Object { $_.TargetEntryIds } | Where-Object { $_ } | Sort-Object -Unique)
          $twoTargetReady = @($pack.Sentences | Where-Object { @($_.TargetEntryIds | Sort-Object -Unique).Count -ge 2 }).Count
          $threeTargetReady = @($pack.Sentences | Where-Object { @($_.TargetEntryIds | Sort-Object -Unique).Count -ge 3 }).Count
          $qualityFlagged = @($pack.Sentences | Where-Object { @($_.QualityFlags).Count -gt 0 }).Count
          $report = [ordered]@{
            generated_utc = (Get-Date).ToUniversalTime().ToString('o')
            pack_id = $pack.PackId
            license = $pack.License
            sentences = $pack.Sentences.Count
            unique_indexed_oxford_entry_ids = $targetRefs.Count
            sentences_with_at_least_2_indexed_stable_ids = $twoTargetReady
            sentences_with_at_least_3_indexed_stable_ids = $threeTargetReady
            quality_flagged_sentences = $qualityFlagged
            sentences_missing_per_side_author_attribution = $missingAttribution
            sentences_missing_upstream_ids = $missingUpstreamIds
            oxford_dictionary_entry_count = 5446
            inventory_boundary = 'TargetEntryIds are builder inventory only. Same-written-form Oxford rows require separate lexical-form/stable-ID ambiguity evidence before they may support target-specific learning claims.'
            attribution_boundary = 'Every accepted record keeps both Tatoeba usernames and upstream English/Ukrainian sentence IDs.'
          }
          $report | ConvertTo-Json | Set-Content .\sentencepack-ccby\coverage-report.json -Encoding utf8
          $report | Format-List

      - name: Compress distributable SentencePack with .NET gzip
        shell: pwsh
        run: |
          $source = Resolve-Path '.\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json'
          $destination = '.\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json.gz'
          $input = [System.IO.File]::OpenRead($source)
          try {
            $output = [System.IO.File]::Create($destination)
            try {
              $gzip = [System.IO.Compression.GZipStream]::new($output, [System.IO.Compression.CompressionLevel]::SmallestSize, $false)
              try { $input.CopyTo($gzip) } finally { $gzip.Dispose() }
            } finally { $output.Dispose() }
          } finally { $input.Dispose() }

          $rawBytes = (Get-Item $source).Length
          $gzipBytes = (Get-Item $destination).Length
          if ($gzipBytes -le 0 -or $gzipBytes -ge $rawBytes) { throw "Unexpected gzip size: raw=$rawBytes gzip=$gzipBytes" }
          $compression = [Math]::Round((1 - ($gzipBytes / [double]$rawBytes)) * 100, 2)
          $sizeReport = [ordered]@{
            raw_bytes = $rawBytes
            gzip_bytes = $gzipBytes
            reduction_percent = $compression
            format = 'gzip (System.IO.Compression.GZipStream)'
          }
          $sizeReport | ConvertTo-Json | Set-Content .\sentencepack-ccby\compression-report.json -Encoding utf8
          $sizeReport | Format-List

      - name: Build SQLite runtime corpus and measure eager baseline
        shell: pwsh
        run: |
          $coverage = Get-Content .\sentencepack-ccby\coverage-report.json -Raw | ConvertFrom-Json
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-sentence-pack `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json.gz `
            .\sentencepack-ccby\load-diagnostics.json `
            --sqlite `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.sqlite `
            oxford-a1-0711
          $diagnostics = Get-Content .\sentencepack-ccby\load-diagnostics.json -Raw | ConvertFrom-Json
          if ($diagnostics.Sentences -ne $coverage.sentences) { throw "Measured sentence count $($diagnostics.Sentences) differs from current build inventory $($coverage.sentences)." }
          if ($diagnostics.ElapsedMilliseconds -le 0) { throw 'SentencePack load measurement did not produce a positive duration.' }
          if ($null -eq $diagnostics.SqlitePrototype) { throw 'SQLite runtime corpus diagnostics are missing.' }
          if ($diagnostics.SqlitePrototype.DatabaseBytes -le 0) { throw 'SQLite runtime corpus was not created.' }
          if ($diagnostics.SqlitePrototype.ResultCount -lt 1) { throw 'Representative SQLite target query returned no sentences.' }

      - name: Validate full 5446 exact-artifact 1 2 3 target coverage
        shell: pwsh
        run: |
          $dbPath = Resolve-Path '.\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.sqlite'
          $dbHash = (Get-FileHash -LiteralPath $dbPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $pack = Get-Content .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$pack.PackId)) { throw 'Current SentencePack has no PackId.' }

          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-context-coverage `
            $dbPath `
            .\sentencepack-ccby\context-coverage-evidence.json `
            $dbHash `
            $pack.PackId

          $evidence = Get-Content .\sentencepack-ccby\context-coverage-evidence.json -Raw | ConvertFrom-Json
          if ($evidence.Payload.DictionaryEntryCount -ne 5446) { throw "Context evidence dictionary size is $($evidence.Payload.DictionaryEntryCount), expected 5446." }
          if (-not $evidence.Payload.ExactOxford5446Verified) { throw 'Context evidence did not verify the exact Oxford 5446 universe.' }
          if (-not $evidence.Payload.ExactDatabaseIdentityVerified) { throw 'Context evidence is not bound to the exact SQLite identity.' }
          if (-not $evidence.Payload.CanSupportRealCorpusCoverageClaim) { throw 'Context evidence did not qualify as exact real-corpus coverage evidence.' }
          if ($evidence.Payload.RedistributionApproved) { throw 'Coverage measurement must not self-approve redistribution.' }
          foreach ($depthName in @('OneTarget','TwoTarget','ThreeTarget')) {
            $depth = $evidence.Payload.$depthName
            if ($depth.ScopeEntryCount -ne 5446) { throw "$depthName scope is $($depth.ScopeEntryCount), expected 5446." }
            if (($depth.CoveredEntryCount + $depth.UncoveredEntryCount) -ne 5446) { throw "$depthName does not partition all 5446 stable IDs." }
          }
          $evidence.Payload | Format-List

      - name: Measure SQLite query in a fresh process
        shell: pwsh
        run: |
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-sentence-pack `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.sqlite `
            .\sentencepack-ccby\sqlite-query-diagnostics.json `
            oxford-a1-0711
          $query = Get-Content .\sentencepack-ccby\sqlite-query-diagnostics.json -Raw | ConvertFrom-Json
          if ($query.DatabaseBytes -le 0) { throw 'SQLite query-only measurement did not see a valid database.' }
          if ($query.QueryMilliseconds -lt 0) { throw 'SQLite query timing is invalid.' }
          if ($query.ManagedBytesDelta -lt 0) { throw 'SQLite query managed-memory measurement is invalid.' }
          if ($query.ResultCount -lt 1) { throw 'Representative fresh-process SQLite query returned no sentences.' }
          $query | Format-List

      - name: Measure actual Sentence Coach full-dictionary runtime path
        shell: pwsh
        run: |
          $coverage = Get-Content .\sentencepack-ccby\coverage-report.json -Raw | ConvertFrom-Json
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- `
            --measure-sentence-pack `
            .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.sqlite `
            .\sentencepack-ccby\sentence-coach-runtime-diagnostics.json `
            --runtime
          $runtime = Get-Content .\sentencepack-ccby\sentence-coach-runtime-diagnostics.json -Raw | ConvertFrom-Json
          if ($runtime.SentenceCount -ne $coverage.sentences) { throw "Runtime sentence count $($runtime.SentenceCount) differs from current build inventory $($coverage.sentences)." }
          if ($runtime.ScopeEntryCount -ne 5446) { throw "Unexpected Oxford scope size: $($runtime.ScopeEntryCount); expected 5446." }
          if ($runtime.OneTargetCoveredEntries -lt 1) { throw 'Runtime one-target coverage is empty.' }
          if ($runtime.TwoTargetCoveredEntries -lt 1) { throw 'Runtime two-target coverage is empty.' }
          if ($runtime.ManagedBytesDelta -lt 0) { throw 'Runtime managed-memory measurement is invalid.' }
          $runtime | Format-List

      - name: Validate actual distributable bundle consistency
        shell: pwsh
        run: |
          python .\WordDeck\tools\validate_sentencepack_release_bundle.py `
            --sqlite .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.sqlite `
            --gzip .\sentencepack-ccby\tatoeba-en-uk-ccby-sentencepack.json.gz `
            --manifest .\sentencepack-ccby\tatoeba-en-uk-ccby.tsv.manifest.json `
            --coverage .\sentencepack-ccby\coverage-report.json `
            | Tee-Object -FilePath .\sentencepack-ccby\release-bundle-validation.json

      - name: Upload attributed SentencePack exact-head artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-Tatoeba-EN-UA-Attributed-SentencePack
          path: |
            sentencepack-ccby/tatoeba-en-uk-ccby-sentencepack.sqlite
            sentencepack-ccby/tatoeba-en-uk-ccby-sentencepack.json.gz
            sentencepack-ccby/tatoeba-en-uk-ccby.tsv.manifest.json
            sentencepack-ccby/coverage-report.json
            sentencepack-ccby/context-coverage-evidence.json
            sentencepack-ccby/context-coverage-evidence.gaps.json
            sentencepack-ccby/context-coverage-evidence.gaps.tsv
            sentencepack-ccby/compression-report.json
            sentencepack-ccby/load-diagnostics.json
            sentencepack-ccby/sqlite-query-diagnostics.json
            sentencepack-ccby/sentence-coach-runtime-diagnostics.json
            sentencepack-ccby/release-bundle-validation.json
            sentencepack-ccby/builder.log
          if-no-files-found: error
          retention-days: 30
