name: D07 Library Filtered Export Streaming

on:
  push:
    branches:
      - work/d07-library-filtered-export-streaming-20260907

permissions:
  contents: read

concurrency:
  group: d07-library-filtered-export-streaming-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-and-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/d07-library-filtered-export-streaming-20260907

      - name: Preserve canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current Formats ancestry and narrow ownership
        shell: bash
        run: |
          set -euo pipefail
          base=a5ddee60af2ed423d3f6e51edfb3e8219fa2b57a
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          unexpected="$(git diff --name-only "$base" HEAD | grep -v -E '^(\.github/workflows/d07-library-filtered-export-streaming\.yml|acs/library_export_service\.py|tests/test_d07_library_export_service\.py)$' || true)"
          test -z "$unexpected" || {
            printf 'Unexpected D07 streaming-export scope:\n%s\n' "$unexpected" >&2
            exit 1
          }

      - name: Compile owned package
        run: python -m compileall -q acs/library_export_service.py tests/test_d07_library_export_service.py

      - name: Focused Library export and D06 streaming regressions
        run: >-
          python -m unittest -v
          tests.test_d07_library_export_service
          tests.test_d07_library_export_reachability
          tests.test_d07_library_export_webview
          tests.test_v2_windows_library_export
          tests.test_v2_pgn_streaming_export

      - name: Full unittest regression
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Full pytest regression
        run: python -m pytest -q
