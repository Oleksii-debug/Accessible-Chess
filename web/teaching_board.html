<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessible Chess — Дошка тренера</title>
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;font-size:18px}body{margin:0;padding:1rem 1.3rem 3rem;line-height:1.4;background:Canvas;color:CanvasText}main{max-width:68rem}.panel{border:1px solid GrayText;padding:.8rem;margin:.8rem 0}.board{display:grid;grid-template-columns:repeat(8,minmax(3.6rem,1fr));max-width:46rem;gap:2px}.sq{position:relative;border:1px solid GrayText;min-height:3.6rem;padding:.3rem;background:Canvas;color:CanvasText}.sq:focus{outline:4px solid Highlight;outline-offset:1px}.sq[data-pointer=true]{box-shadow:inset 0 0 0 4px Highlight}.coord{font-size:.75rem}.marker{font-weight:700}.row{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;padding:.4rem}#live{position:absolute;left:-10000px}.help{max-width:54rem}
</style>
</head>
<body>
<header><h1>Дошка тренера</h1></header>
<div id="live" role="status" aria-live="polite" aria-atomic="true"></div>
<main>
<section class="panel" aria-labelledby="board-title">
<h2 id="board-title">64 поля</h2>
<p class="help">Tab входить на дошку. Стрілки переходять між полями. Home переходить на a1, End — на h8. Enter або Пробіл ставить семантичний вказівник тренера на поточне поле. Візуальна тема не змінює назви полів для скрінрідера.</p>
<div id="board" class="board" role="grid" aria-label="Демонстраційна шахова дошка, 64 поля" aria-rowcount="8" aria-colcount="8"></div>
</section>
<section class="panel" aria-labelledby="pointer-title">
<h2 id="pointer-title">Вказівник</h2>
<div class="row"><label for="pointer-input">Перейти на поле</label><input id="pointer-input" type="text" maxlength="2" autocomplete="off" inputmode="text"><button id="pointer-clear" type="button">Прибрати вказівник</button></div>
<div id="pointer-summary" aria-live="off"></div>
</section>
<section class="panel" aria-labelledby="visual-title">
<h2 id="visual-title">Візуальні параметри</h2>
<div class="row"><label>Координати <select id="coordinate-mode"><option value="off">Вимкнено</option><option value="edges">По краях</option><option value="every_square">На кожному полі</option></select></label><label>Масштаб дошки <input id="board-scale" type="number" min="50" max="200" value="100"></label><button id="apply-visual" type="button">Застосувати</button></div>
</section>
</main>
<script>
const el=id=>document.getElementById(id),api=()=>window.pywebview&&window.pywebview.api;
let snapshot=null,focusSquare='a1';
function announce(text){el('live').textContent='';setTimeout(()=>el('live').textContent=text||'',20)}
async function call(name,...args){const a=api();if(!a||typeof a[name]!=='function'){announce('Функція недоступна.');return null}try{return await a[name](...args)}catch(_){announce('Не вдалося виконати дію.');return null}}
function normalizeSquare(value){const s=String(value||'').replace(/\s/g,'').toLowerCase();return /^[a-h][1-8]$/.test(s)?s:null}
function squareName(square){return square[0]+' '+square[1]}
function squareIndex(square){const file=square.charCodeAt(0)-97,rank=Number(square[1])-1;return {file,rank}}
function indexSquare(file,rank){return String.fromCharCode(97+file)+String(rank+1)}
function moveSquare(square,key){let {file,rank}=squareIndex(square);if(key==='ArrowLeft')file=Math.max(0,file-1);else if(key==='ArrowRight')file=Math.min(7,file+1);else if(key==='ArrowUp')rank=Math.min(7,rank+1);else if(key==='ArrowDown')rank=Math.max(0,rank-1);else if(key==='Home')return'a1';else if(key==='End')return'h8';else return square;return indexSquare(file,rank)}
function cellFor(square){return el('board').querySelector(`[data-square="${square}"]`)}
function focusCell(square){const normalized=normalizeSquare(square)||'a1';focusSquare=normalized;el('board').querySelectorAll('[role="gridcell"]').forEach(cell=>cell.tabIndex=cell.dataset.square===normalized?0:-1);const cell=cellFor(normalized);if(cell)cell.focus()}
function renderBoard({restoreFocus=false}={}){const board=el('board'),active=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.square;if(active)focusSquare=active;board.textContent='';const pointer=snapshot&&snapshot.pointer&&snapshot.pointer.square;const annotations=(snapshot&&snapshot.annotations)||[];for(let rank=8;rank>=1;rank--){for(const file of 'abcdefgh'){const square=file+rank,cell=document.createElement('div');cell.className='sq';cell.setAttribute('role','gridcell');cell.setAttribute('aria-label',squareName(square));cell.setAttribute('aria-rowindex',String(9-rank));cell.setAttribute('aria-colindex',String(file.charCodeAt(0)-96));cell.dataset.square=square;cell.dataset.pointer=pointer===square?'true':'false';cell.tabIndex=square===focusSquare?0:-1;if(pointer===square)cell.setAttribute('aria-current','true');const coord=document.createElement('span');coord.className='coord';coord.setAttribute('aria-hidden','true');const mode=snapshot.visual.coordinate_mode,show=mode==='every_square'||(mode==='edges'&&(file==='a'||rank===1));coord.textContent=show?square:'';cell.appendChild(coord);if(pointer===square){const mark=document.createElement('span');mark.className='marker';mark.setAttribute('aria-hidden','true');mark.textContent=' ●';cell.appendChild(mark)}const labels=annotations.filter(a=>a.source===square||a.target===square);if(labels.length)cell.setAttribute('aria-description',labels.map(a=>a.kind==='arrow'?`Стрілка ${a.source}–${a.target}`:`Виділене поле ${a.source}`).join('. '));board.appendChild(cell)}}board.style.transform=`scale(${snapshot.visual.board_scale_percent/100})`;board.style.transformOrigin='top left';if(restoreFocus)focusCell(focusSquare)}
async function commitPointer(square,{returnBoardFocus=false}={}){const normalized=normalizeSquare(square);if(!normalized){announce('Некоректне поле.');return false}const result=await call('teaching_pointer_commit',normalized);if(!result||!result.ok)return false;snapshot=await call('teaching_snapshot');if(snapshot){focusSquare=normalized;render();if(returnBoardFocus)focusCell(normalized)}announce(result.accessibleText);return true}
function render(){el('coordinate-mode').value=snapshot.visual.coordinate_mode;el('board-scale').value=snapshot.visual.board_scale_percent;el('pointer-summary').textContent=snapshot.pointer.square?'Вказівник: '+squareName(snapshot.pointer.square)+'.':'Вказівник вимкнено.';renderBoard()}
async function refresh(){snapshot=await call('teaching_snapshot');if(snapshot)render()}
el('board').addEventListener('keydown',async event=>{const cell=event.target.closest('[role="gridcell"]');if(!cell)return;const key=event.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(key)){event.preventDefault();focusCell(moveSquare(cell.dataset.square,key));return}if(key==='Enter'||key===' '){event.preventDefault();await commitPointer(cell.dataset.square,{returnBoardFocus:true})}});
el('board').addEventListener('focusin',event=>{const cell=event.target.closest('[role="gridcell"]');if(cell){focusSquare=cell.dataset.square;el('board').querySelectorAll('[role="gridcell"]').forEach(item=>item.tabIndex=item===cell?0:-1)}});
el('pointer-input').addEventListener('input',async event=>{const raw=event.target.value.replace(/\s/g,'').toLowerCase();if(raw.length<2)return;if(!normalizeSquare(raw)){announce('Некоректне поле.');return}if(await commitPointer(raw)){event.target.value='';event.target.focus()}});
el('pointer-clear').onclick=async()=>{const result=await call('teaching_pointer_clear');if(result){snapshot=await call('teaching_snapshot');if(snapshot)render();announce('Вказівник прибрано.')}};
el('apply-visual').onclick=async()=>{if(!snapshot)return;const wasBoardFocused=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#board')!==null;const result=await call('teaching_set_visual_preferences',{board_theme_id:snapshot.visual.board_theme_id,piece_theme_id:snapshot.visual.piece_theme_id,coordinate_mode:el('coordinate-mode').value,board_scale_percent:Number(el('board-scale').value),piece_scale_percent:snapshot.visual.piece_scale_percent});if(result){snapshot=result;renderBoard({restoreFocus:wasBoardFocused});announce('Вигляд дошки змінено.')}};
window.addEventListener('pywebviewready',refresh);if(api())refresh();
</script>
</body>
</html>
