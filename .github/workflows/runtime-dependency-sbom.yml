name: Runtime Dependency SPDX SBOM

on:
  push:
    branches:
      - work/runtime-dependency-notices-current-20260924
    paths:
      - 'acs/runtime_dependency_notices.py'
      - 'acs/runtime_dependency_sbom.py'
      - 'acs/runtime_dependency_release.py'
      - 'tests/test_runtime_dependency_notices.py'
      - 'tests/test_runtime_dependency_sbom.py'
      - 'tests/test_runtime_dependency_release.py'
      - '.github/workflows/runtime-dependency-notices.yml'
      - '.github/workflows/runtime-dependency-sbom.yml'
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/runtime_dependency_notices.py'
      - 'acs/runtime_dependency_sbom.py'
      - 'acs/runtime_dependency_release.py'
      - 'tests/test_runtime_dependency_notices.py'
      - 'tests/test_runtime_dependency_sbom.py'
      - 'tests/test_runtime_dependency_release.py'
      - '.github/workflows/runtime-dependency-notices.yml'
      - '.github/workflows/runtime-dependency-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-dependency-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned full-suite test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Compile notice SPDX and release-publication boundaries
        run: >-
          python -m compileall -q
          acs/runtime_dependency_notices.py
          acs/runtime_dependency_sbom.py
          acs/runtime_dependency_release.py
          tests/test_runtime_dependency_notices.py
          tests/test_runtime_dependency_sbom.py
          tests/test_runtime_dependency_release.py

      - name: Focused deterministic fail-closed release evidence tests
        run: >-
          python -m unittest -v
          tests.test_runtime_dependency_notices
          tests.test_runtime_dependency_sbom
          tests.test_runtime_dependency_release

      - name: Product-wide regression safety
        run: python -m unittest discover -s tests -v

      - name: Diff hygiene
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-}"
          head="${PR_HEAD_SHA:-}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD^1)"; fi
          if [ -z "$head" ]; then head="$(git rev-parse HEAD)"; fi
          git diff --check "$base" "$head"
