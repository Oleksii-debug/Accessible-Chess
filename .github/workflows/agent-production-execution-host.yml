name: Agent Production Execution Host

on:
  pull_request:
    branches:
      - feature/agent-nvda-conversation-surface-20261006-ooxple7
    paths:
      - acs/agent_execution_host.py
      - acs/chess_agent_tools.py
      - acs/version2_final_product_application.py
      - acs/version2_final_release.py
      - tests/test_agent_execution_host.py
      - .github/workflows/agent-production-execution-host.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-production-host-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  production-host:
    name: Production host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact Agent UI parent and bounded scope
        shell: bash
        env:
          PINNED_BASE: cf65604a67c58acc85b4b38bf2132141e6112d1e
          BASE_BRANCH: feature/agent-nvda-conversation-surface-20261006-ooxple7
        run: |
          set -euo pipefail
          CANDIDATE="$(git rev-parse HEAD)"
          git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/agent-host-base"
          test "$(git rev-parse refs/remotes/origin/agent-host-base)" = "$PINNED_BASE"
          test "$(git merge-base "$PINNED_BASE" "$CANDIDATE")" = "$PINNED_BASE"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/agent-host-live-head"
            test "$(git rev-parse refs/remotes/origin/agent-host-live-head)" = "$CANDIDATE"
          fi

          mapfile -t changed < <(git diff --name-only "$PINNED_BASE"..."$CANDIDATE" | LC_ALL=C sort)
          expected=(
            ".github/workflows/agent-production-execution-host.yml"
            "acs/agent_execution_host.py"
            "acs/chess_agent_tools.py"
            "acs/version2_final_product_application.py"
            "acs/version2_final_release.py"
            "tests/test_agent_execution_host.py"
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install retained test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Compile execution and composition boundaries
        run: >-
          python -m py_compile
          acs/agent_execution_host.py
          acs/chess_agent_tools.py
          acs/version2_final_product_application.py
          acs/version2_final_release.py
          tests/test_agent_execution_host.py

      - name: Run focused production-host contracts
        run: python -m unittest -v tests.test_agent_execution_host

      - name: Run retained Agent surface and tool contracts
        run: >-
          python -m pytest -q
          tests/test_agent_webview_surface.py
          tests/test_agent_final_product_reachability.py
          tests/test_chess_agent_tools_crossrepo.py
          tests/test_universal_chess_agent_crossrepo.py

      - name: Run final-product composition regressions
        run: python -m pytest -q tests/test_version2_final_product_composition.py
