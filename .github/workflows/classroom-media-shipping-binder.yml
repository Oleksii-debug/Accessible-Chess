name: Classroom Media Shipping Binder

on:
  push:
    branches:
      - feature/classroom-media-shipping-binder-20261003
  pull_request:
    branches:
      - feature/classroom-media-session-host-transaction-20261003
    paths:
      - 'acs/classroom_media_provider_binder.py'
      - 'tests/test_classroom_media_provider_binder.py'
      - '.github/workflows/classroom-media-shipping-binder.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-media-shipping-binder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove bounded binder scope on live parent
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_REF" = "feature/classroom-media-session-host-transaction-20261003"
          test -n "$EVENT_BASE_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$PR_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
          test -n "$base"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current media session parent $base is not an ancestor of HEAD; synchronize before qualification."
            exit 1
          fi
          test "$(git merge-base "$base" HEAD)" = "$base"
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-media-shipping-binder.yml'
            'acs/classroom_media_provider_binder.py'
            'tests/test_classroom_media_provider_binder.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected classroom media shipping-binder scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          git diff --check "$base...HEAD"
          echo "CLASSROOM_MEDIA_BINDER_LIVE_BASE=$base"
          echo 'CLASSROOM_MEDIA_BINDER_BOUNDED_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile shipping binder
        run: python -m compileall -q acs/classroom_media_provider_binder.py tests/test_classroom_media_provider_binder.py

      - name: Run binder and inherited media transaction contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_media_provider_binder
          tests.test_classroom_media_provider_execution
          tests.test_classroom_media_session_transactions
          tests.test_classroom_media_host_transactions
          tests.test_classroom_realtime_media

      - name: Core selftest
        run: python -m acs.selftest
