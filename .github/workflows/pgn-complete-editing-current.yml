name: PGN Complete Editing Current

on:
  pull_request:
    paths:
      - 'acs/full_product_actions.py'
      - 'acs/full_product_presenters.py'
      - 'acs/pgn_workspace.py'
      - 'acs/pgn_webview_projection.py'
      - 'acs/pgn_webview_bridge.py'
      - 'acs/pgn_workspace_webview_adapter.py'
      - 'acs/version2_pgn_commands.py'
      - 'web/full_product_pgn.js'
      - 'tests/test_pgn_complete_editing_user_flow.py'
      - '.github/workflows/pgn-complete-editing-current.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-complete-editing-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact current PGN convergence scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PR_BASE" HEAD
          git diff --check "$PR_BASE"...HEAD
          changed="$(git diff --name-only "$PR_BASE"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d01-pgn-workspace-webview.yml' \
            '.github/workflows/pgn-complete-editing-current.yml' \
            'acs/full_product_actions.py' \
            'acs/full_product_presenters.py' \
            'acs/pgn_webview_bridge.py' \
            'acs/pgn_webview_projection.py' \
            'acs/pgn_workspace.py' \
            'acs/pgn_workspace_webview_adapter.py' \
            'acs/version2_pgn_commands.py' \
            'tests/test_dev1_pgn_webview_projection.py' \
            'tests/test_dev1_pgn_workspace_webview_adapter.py' \
            'tests/test_pgn_complete_editing_user_flow.py' \
            'web/full_product_pgn.js' | sort)"
          test "$changed" = "$expected"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile PGN editing surface
        run: >-
          python -m compileall -q
          acs/full_product_actions.py
          acs/full_product_presenters.py
          acs/pgn_workspace.py
          acs/pgn_webview_projection.py
          acs/pgn_webview_bridge.py
          acs/pgn_workspace_webview_adapter.py
          acs/version2_pgn_commands.py
          tests/test_pgn_complete_editing_user_flow.py
      - name: Parse PGN browser surface
        run: node --check web/full_product_pgn.js
      - name: Complete PGN editing journey
        run: >-
          python -m unittest -v
          tests.test_pgn_complete_editing_user_flow
          tests.test_pgn_workspace
          tests.test_version2_pgn_commands
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_pgn_document
          tests.test_d06_pgn_roundtrip
      - name: Core chess selftest
        run: python -m acs.selftest
