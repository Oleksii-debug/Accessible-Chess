name: Owner Physical Acceptance Record Contract

on:
  push:
    branches:
      - work/owner-physical-acceptance-receipt-20261005-q7m4
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
    paths:
      - scripts/record_owner_physical_acceptance.py
      - tests/test_owner_physical_acceptance.py
      - tests/test_owner_physical_acceptance_json_hardening.py
      - .github/workflows/owner-physical-acceptance-record.yml

permissions:
  contents: read

concurrency:
  group: owner-physical-acceptance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PRODUCT_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
  PRODUCT_BRANCH: converge/current-product-books-provider-20261005-ooxple7

jobs:
  contract:
    name: Physical acceptance record / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact Product base and additive four-path scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/owner-acceptance-base"
          live_base="$(git rev-parse refs/remotes/origin/owner-acceptance-base)"
          test "$live_base" = "$EXPECTED_PRODUCT_SHA" || {
            echo "OWNER_ACCEPTANCE_BASE_MOVED expected=$EXPECTED_PRODUCT_SHA live=$live_base" >&2
            exit 1
          }
          test "$(git merge-base "$EXPECTED_PRODUCT_SHA" HEAD)" = "$EXPECTED_PRODUCT_SHA"
          git diff --check "$EXPECTED_PRODUCT_SHA"...HEAD
          mapfile -t paths < <(git diff --name-only "$EXPECTED_PRODUCT_SHA"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/owner-physical-acceptance-record.yml"
            "scripts/record_owner_physical_acceptance.py"
            "tests/test_owner_physical_acceptance.py"
            "tests/test_owner_physical_acceptance_json_hardening.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

      - name: Set up canonical package-test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile acceptance and incumbent machine receipt boundaries
        run: >-
          python -m py_compile
          scripts/record_owner_physical_acceptance.py
          scripts/finalize_owner_final_receipt.py
          tests/test_owner_physical_acceptance.py
          tests/test_owner_physical_acceptance_json_hardening.py
          tests/test_finalize_owner_final_receipt.py

      - name: Run manual-evidence contract and incumbent machine-receipt regressions
        run: >-
          python -m unittest -v
          tests.test_owner_physical_acceptance
          tests.test_owner_physical_acceptance_json_hardening
          tests.test_finalize_owner_final_receipt

      - name: Prove CI cannot record physical acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts.record_owner_physical_acceptance import (
              OwnerPhysicalAcceptanceError,
              _manual_recording_allowed,
          )

          assert os.environ.get("GITHUB_ACTIONS", "").lower() == "true"
          try:
              _manual_recording_allowed()
          except OwnerPhysicalAcceptanceError as exc:
              assert "disabled in automation" in str(exc)
          else:
              raise SystemExit("CI unexpectedly acquired physical acceptance recording authority")
          print("AUTOMATED_PHYSICAL_ACCEPTANCE_RECORDING=REJECTED")
          PY
