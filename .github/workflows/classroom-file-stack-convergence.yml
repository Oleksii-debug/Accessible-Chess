name: Classroom File Stack Convergence

on:
  pull_request:
    branches:
      - fix/classroom-file-state-watermark-20261003
    paths:
      - 'acs/classroom_collaboration.py'
      - 'tests/test_classroom_collaboration.py'
      - '.github/workflows/classroom-file-stack-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-file-stack-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact convergence scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_REF" = "fix/classroom-file-state-watermark-20261003"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE_TIP="$(git rev-parse "origin/$BASE_REF")"
          STACK_BASE="$(git merge-base "$BASE_TIP" HEAD)"
          git cat-file -e "$STACK_BASE^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$STACK_BASE"
          git merge-base --is-ancestor "$STACK_BASE" HEAD
          git merge-base --is-ancestor "$STACK_BASE" "$BASE_TIP"

          git diff --check "$STACK_BASE" HEAD
          mapfile -t actual < <(git diff --name-only "$STACK_BASE" HEAD | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-file-stack-convergence.yml'
            'acs/classroom_collaboration.py'
            'tests/test_classroom_collaboration.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected classroom file convergence scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'CLASSROOM_FILE_STACK_CONVERGENCE_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile convergence boundary
        run: >-
          python -m py_compile
          acs/classroom_collaboration.py
          acs/classroom_collaboration_storage.py
          tests/test_classroom_collaboration.py
          tests/test_classroom_collaboration_storage.py

      - name: Run collaboration, storage and media regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
          tests.test_classroom_realtime_media

      - name: Core selftest
        run: python -m acs.selftest
