name: W5 Release Receipt Contract

on:
  push:
    branches:
      - work/w5-release-receipt-20261005-a7f3
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
    paths:
      - acs/version2_release_receipt.py
      - tests/test_version2_release_receipt.py
      - .github/workflows/w5-release-receipt-contract.yml

permissions:
  contents: read

concurrency:
  group: w5-release-receipt-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PRODUCT_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
  PRODUCT_BRANCH: converge/current-product-books-provider-20261005-ooxple7

jobs:
  receipt-contract:
    name: Release receipt / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact Product base and three-path scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/release-receipt-base"
          live_base="$(git rev-parse refs/remotes/origin/release-receipt-base)"
          test "$live_base" = "$EXPECTED_PRODUCT_SHA" || {
            echo "RELEASE_RECEIPT_BASE_MOVED expected=$EXPECTED_PRODUCT_SHA live=$live_base" >&2
            exit 1
          }
          test "$(git merge-base "$EXPECTED_PRODUCT_SHA" HEAD)" = "$EXPECTED_PRODUCT_SHA"
          git diff --check "$EXPECTED_PRODUCT_SHA"...HEAD
          mapfile -t paths < <(git diff --name-only "$EXPECTED_PRODUCT_SHA"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/w5-release-receipt-contract.yml"
            "acs/version2_release_receipt.py"
            "tests/test_version2_release_receipt.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done
          echo "RELEASE_RECEIPT_PRODUCT_BASE=$EXPECTED_PRODUCT_SHA"
          echo "RELEASE_RECEIPT_HEAD=$expected_head"

      - name: Set up canonical package-test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile receipt and canonical package preflight
        run: >-
          python -m py_compile
          acs/version2_release_receipt.py
          acs/version2_package_preflight.py
          tests/test_version2_release_receipt.py
          tests/test_version2_package_preflight.py

      - name: Run receipt contract and canonical package preflight regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_receipt
          tests.test_version2_package_preflight
