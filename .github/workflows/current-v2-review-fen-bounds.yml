name: Current V2 Review FEN Bounds

on:
  pull_request:
    branches:
      - fix/current-v2-keymap-context-passive-20261004-ooxple7-g7
    paths:
      - 'acs/version2_release_ui.py'
      - 'tests/test_v2_review_fen_bounds.py'
      - '.github/workflows/current-v2-review-fen-bounds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-v2-review-fen-bounds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-fix/current-v2-keymap-context-passive-20261004-ooxple7-g7}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-v2-review-fen-bounds.yml' \
            'acs/version2_release_ui.py' \
            'tests/test_v2_review_fen_bounds.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected V2 review-FEN scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile V2 review FEN boundary
        run: >-
          python -m compileall -q
          acs/version2_release_ui.py
          tests/test_v2_review_fen_bounds.py

      - name: Execute external-review and Board regressions
        run: >-
          python -m unittest -v
          tests.test_v2_review_fen_bounds
          tests.test_version2_external_review_live_state_isolation
          tests.test_version2_release_ui
          tests.test_stage1_v2_board_command_passive_ingress
          tests.test_stage1_board_action_integration
          tests.test_accessible_webui

      - name: Core selftest
        run: python -m acs.selftest
