name: Full Product Education Class Create

on:
  pull_request:
    paths:
      - 'acs/education_class_management.py'
      - 'acs/version2_education_mutation_application.py'
      - 'acs/version2_education_mutation_release.py'
      - 'acs/version2_starter_content_application.py'
      - 'acs/starter_books_training_runtime.py'
      - 'acs/starter_books_training_content.py'
      - 'run_accessible_chess_v2.py'
      - 'tests/test_version2_education_class_create.py'
      - 'tests/test_w3_p0f_starter_books_training_content.py'
      - '.github/workflows/full-product-education-class-create.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-product-education-class-create-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained Education authority and current W3 composition
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${EVENT_BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}" || git fetch --no-tags origin "$base"
          education_owner="3df622f6d667b3513222003df159e52188e60bda"
          git cat-file -e "${education_owner}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$education_owner" HEAD
          git diff --check "$base" HEAD
          test "$(git rev-parse HEAD:acs/education_class_management.py)" = "7b5e8c309ac453cb904552b23af658357db377db"
          test "$(git rev-parse HEAD:acs/version2_education_mutation_application.py)" = "f3a2633c400a4f07fffa52d478456c62a8330fc6"
          test "$(git rev-parse HEAD:run_accessible_chess_v2.py)" = "125f378e87acbca993acf54bd4012e93539384d3"
          test "$(git rev-parse HEAD:tests/test_version2_education_class_create.py)" = "3a354dbf7c5f472b1bdd72f06f1b969e709c5394"

          release_blob="$(git rev-parse HEAD:acs/version2_education_mutation_release.py)"
          case "$release_blob" in
            3bd742fb0ba81dfb36bd18857d5bace9da5ff311)
              echo 'EDUCATION_RELEASE_PROFILE=PRE_W3_CANONICAL'
              ;;
            334c8210571be8212638e948032e61d1eee4df4d)
              test "$(git rev-parse HEAD:acs/version2_starter_content_application.py)" = "ee32e912f84dff1a5befa1f1034e602f423819a5"
              test "$(git rev-parse HEAD:acs/starter_books_training_runtime.py)" = "1fb85f1282efcd5dedb51dfa2ebfe2adf7c1a310"
              test "$(git rev-parse HEAD:acs/starter_books_training_content.py)" = "04bbc4aaf44bf9421f7e02adeb10c965ef3f1d9d"
              test "$(git rev-parse HEAD:tests/test_w3_p0f_starter_books_training_content.py)" = "23292784b994e237090d9b1bec6de1b470123602"
              echo 'EDUCATION_RELEASE_PROFILE=P0F_W3_STARTER_BOOKS_TRAINING'
              ;;
            *)
              echo "Unexpected Education release composition blob: $release_blob" >&2
              exit 1
              ;;
          esac

      - name: Compile current Education and W3 composition
        run: >-
          python -m py_compile
          acs/education_class_management.py
          acs/version2_education_mutation_application.py
          acs/version2_education_mutation_release.py
          acs/version2_starter_content_application.py
          acs/starter_books_training_runtime.py
          acs/starter_books_training_content.py
          run_accessible_chess_v2.py
          tests/test_version2_education_class_create.py
          tests/test_w3_p0f_starter_books_training_content.py

      - name: Focused Education mutation persistence and starter-content regression
        run: >-
          python -m pytest -q
          tests/test_version2_education_class_create.py
          tests/test_education_workspace.py
          tests/test_education_webview_projection.py
          tests/test_education_webview_bridge.py
          tests/test_version2_final_product_composition.py
          tests/test_w3_p0f_starter_books_training_content.py

      - name: Final-product production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'
