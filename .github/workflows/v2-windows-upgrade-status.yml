name: V2 Windows Upgrade Status

on:
  push:
    branches:
      - work/v2-windows-upgrade-status-adapter-20260831
  pull_request:
    branches:
      - work/v2-data-upgrade-v6-20260831
    paths:
      - 'acs/version2_windows_upgrade_status.py'
      - 'tests/test_v2_windows_upgrade_status.py'
      - '.github/workflows/v2-windows-upgrade-status.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-upgrade-status-${{ github.ref }}
  cancel-in-progress: true

env:
  UPGRADE_BASE: e94bf1d2416af35acfe541840523d874464b6607

jobs:
  upgrade-status:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact stacked scope and owner isolation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$UPGRADE_BASE" HEAD
          test "$(git merge-base "$UPGRADE_BASE" HEAD)" = "$UPGRADE_BASE"
          git diff --check "$UPGRADE_BASE" HEAD
          changed="$(git diff --name-only "$UPGRADE_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-upgrade-status.yml' \
            'acs/version2_windows_upgrade_status.py' \
            'tests/test_v2_windows_upgrade_status.py' | sort)"
          test "$changed" = "$expected"
          for path in \
            acs/version2_upgrade.py \
            acs/acsdb.py \
            acs/settings.py \
            acs/release_app.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py \
            run_accessible_chess.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$UPGRADE_BASE:$path")"
          done
          if git cat-file -e "HEAD:tests/test_v2_upgrade_tracked_writer_conflict.py" 2>/dev/null; then
            echo 'Active #403 successor test leaked into the #378-based D01 branch.'
            exit 1
          fi

      - name: Compile adapter package
        run: >-
          python -m compileall -q
          acs/version2_windows_upgrade_status.py
          tests/test_v2_windows_upgrade_status.py

      - name: Focused accessible adapter and exact #378 upgrade contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_upgrade_status
          tests.test_v2_upgrade_current_acsdb_identity_audit
          tests.test_v2_upgrade_v6_successor
          tests.test_version2_upgrade
          tests.test_version2_upgrade_recovery_integrity
          tests.test_version2_upgrade_stale_writer

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_upgrade_status.py
          tests/test_v2_upgrade_current_acsdb_identity_audit.py
          tests/test_v2_upgrade_v6_successor.py
          tests/test_version2_upgrade.py
          tests/test_version2_upgrade_recovery_integrity.py
          tests/test_version2_upgrade_stale_writer.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
