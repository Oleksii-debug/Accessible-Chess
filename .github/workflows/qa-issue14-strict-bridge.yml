name: QA Issue14 Strict Bridge

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  patch-and-dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 14 &&
       github.event.comment.body == 'QA_DISPATCH_656E8EC_V5_20260821')
    runs-on: windows-latest
    env:
      TARGET_BRANCH: qa/windows-current-integration-candidate-20260815
      TARGET_PRODUCT_SHA: 656e8ec311e364e6e54a30504fd30a4aaff586f9
      STRICT_WORKFLOW_ID: '336818249'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/windows-current-integration-candidate-20260815
          fetch-depth: 0

      - name: Verify exact strict target before QA-only patch
        shell: pwsh
        run: |
          $strict='.github\workflows\windows-stage1-strict-release-crossprocess.yml'
          $text=Get-Content $strict -Raw
          if(-not $text.Contains($env:TARGET_PRODUCT_SHA)){throw 'Strict workflow is not locked to exact Product 656e8ec'}
          if(-not $text.Contains('Accessible-Chess-0.4-656e8ec-NVDA-test-candidate.zip')){throw 'Expected fresh candidate name missing'}
          'EXACT PRODUCT LOCK PASS'

      - name: Patch only QA helper to bounded restore V5
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          helper_path=Path('tools/qa/stage1_packaged_e2e_crossprocess.ps1')
          helper=helper_path.read_text(encoding='utf-8')
          start_marker="  Set-Clipboard -Value '__sentinel__'"
          end_marker="  $vp.SetValue('e5')"
          if helper.count(start_marker)!=1 or helper.count(end_marker)!=1:
              raise SystemExit(f'V5 anchors not unique: start={helper.count(start_marker)} end={helper.count(end_marker)}')
          start=helper.index(start_marker)
          end=helper.index(end_marker,start)
          replacement=r'''  Set-Clipboard -Value '__sentinel__'
          $null=$ws.AppActivate($AppPid)
          $move.SetFocus()
          AssertFocusedRuntimeEventually $moveRid 'Native keyboard focus convergence'
          $focused=[System.Windows.Automation.AutomationElement]::FocusedElement
          if((RuntimeId $focused) -ne $moveRid){throw "Native keyboard focus mismatch: $(FocusDescription $focused)"}
          $vp=ValuePattern $move 'Move before native keyboard proof'
          if([string]$vp.Current.Value -ne 'e9'){throw "Native keyboard precondition ValuePattern mismatch: '$([string]$vp.Current.Value)'"}

          if(-not ('AccessibleChessQaNativeKeysV5' -as [type])) {
            Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class AccessibleChessQaNativeKeysV5 {
            [DllImport("user32.dll")]
            private static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);
            private const uint KEYEVENTF_KEYUP=0x0002;
            public static void Key(byte vk){
              keybd_event(vk,0,0,UIntPtr.Zero);
              keybd_event(vk,0,KEYEVENTF_KEYUP,UIntPtr.Zero);
            }
            public static void Ctrl(byte vk){
              keybd_event(0x11,0,0,UIntPtr.Zero);
              keybd_event(vk,0,0,UIntPtr.Zero);
              keybd_event(vk,0,KEYEVENTF_KEYUP,UIntPtr.Zero);
              keybd_event(0x11,0,KEYEVENTF_KEYUP,UIntPtr.Zero);
            }
          }
          "@
          }

          function RestoreMoveValueEventually([string]$expected,[string]$label,[int]$timeoutMs=5000){
            $sw=[System.Diagnostics.Stopwatch]::StartNew(); $last=''; $lastError=''
            while($sw.ElapsedMilliseconds -lt $timeoutMs){
              try{
                $freshEls=Rewalk $report
                $freshMove=FindRuntime $freshEls $moveRid
                if($null -eq $freshMove){$lastError='runtime not found'; Start-Sleep -Milliseconds 100; continue}
                AssertMoveStrict $freshMove $moveRid
                $freshVp=ValuePattern $freshMove "$label set"
                $freshVp.SetValue($expected)
                Start-Sleep -Milliseconds 150
                $confirmEls=Rewalk $report
                $confirmMove=FindRuntime $confirmEls $moveRid
                if($null -eq $confirmMove){$lastError='runtime disappeared after SetValue'; Start-Sleep -Milliseconds 100; continue}
                AssertMoveStrict $confirmMove $moveRid
                $confirmVp=ValuePattern $confirmMove "$label confirm"
                $last=[string]$confirmVp.Current.Value
                if($last -eq $expected){
                  Write-Output "QA BOUNDED MOVE RESTORE PASS label='$label' value='$last'"
                  return $confirmMove
                }
              }catch{$lastError=$_.Exception.Message}
              Start-Sleep -Milliseconds 100
            }
            throw "QA_STATE_RESTORE_INCONCLUSIVE: label='$label' expected='$expected' got='$last' last_error='$lastError'"
          }

          [AccessibleChessQaNativeKeysV5]::Key([byte]0x23)
          Start-Sleep -Milliseconds 120
          if([string](ValuePattern $move 'Move after native End baseline').Current.Value -ne 'e9'){throw 'QA_BASELINE_INCONCLUSIVE: native End unexpectedly changed Move value'}
          Write-Output 'NATIVE CARET BASELINE NORMALIZED WITH END'
          [AccessibleChessQaNativeKeysV5]::Key([byte]0x08)
          Start-Sleep -Milliseconds 250
          AssertFocusedRuntimeEventually $moveRid 'Native Backspace focus convergence'
          $afterBackspace=[string](ValuePattern $move 'Move after native Backspace').Current.Value
          if($afterBackspace -ne 'e'){throw "NATIVE_KEY_DELIVERY_INCONCLUSIVE: expected e9 -> e, got '$afterBackspace'"}
          Write-Output 'NATIVE KEY DELIVERY CONTROL PASS e9->e'

          $move=RestoreMoveValueEventually 'e9' 'before native Ctrl+A proof'
          $vp=ValuePattern $move 'Move restored before native Ctrl+A proof'
          $null=$ws.AppActivate($AppPid); $move.SetFocus()
          AssertFocusedRuntimeEventually $moveRid 'Native Ctrl+A focus convergence'
          [AccessibleChessQaNativeKeysV5]::Key([byte]0x23)
          Start-Sleep -Milliseconds 120
          if([string](ValuePattern $move 'Move after End before Ctrl+A').Current.Value -ne 'e9'){throw 'QA_BASELINE_INCONCLUSIVE: End before Ctrl+A changed value'}
          [AccessibleChessQaNativeKeysV5]::Ctrl([byte]0x41)
          Start-Sleep -Milliseconds 150
          [AccessibleChessQaNativeKeysV5]::Key([byte]0x08)
          Start-Sleep -Milliseconds 250
          AssertFocusedRuntimeEventually $moveRid 'Native Ctrl+A plus Backspace focus convergence'
          $afterSelectDelete=[string](ValuePattern $move 'Move after native Ctrl+A plus Backspace').Current.Value
          if($afterSelectDelete -ne ''){throw "NATIVE_CTRL_A_SELECTION_DEFECT_AFTER_PROVEN_KEY_DELIVERY: expected empty, got '$afterSelectDelete'"}
          Write-Output 'NATIVE CTRL+A SELECTION BEHAVIOR PASS e9->empty via Backspace'

          $move=RestoreMoveValueEventually 'e9' 'before native copy proof'
          $vp=ValuePattern $move 'Move restored before native copy proof'
          Set-Clipboard -Value '__sentinel__'
          $null=$ws.AppActivate($AppPid); $move.SetFocus()
          AssertFocusedRuntimeEventually $moveRid 'Native copy focus convergence'
          [AccessibleChessQaNativeKeysV5]::Key([byte]0x23)
          Start-Sleep -Milliseconds 120
          if([string](ValuePattern $move 'Move after End before copy').Current.Value -ne 'e9'){throw 'QA_BASELINE_INCONCLUSIVE: End before copy changed value'}
          [AccessibleChessQaNativeKeysV5]::Ctrl([byte]0x41)
          Start-Sleep -Milliseconds 150
          [AccessibleChessQaNativeKeysV5]::Ctrl([byte]0x43)
          Start-Sleep -Milliseconds 400
          AssertFocusedRuntimeEventually $moveRid 'Native copy post-chord focus convergence'
          $clip=([string](Get-Clipboard -Raw)).Trim()
          if($clip -ne 'e9'){throw "NATIVE_CTRL_C_COPY_DEFECT_AFTER_PROVEN_SELECTION: clipboard='$clip' expected='e9'"}
          $summary.clipboard=$clip
          Write-Output "NATIVE CTRL+A/CTRL+C BEHAVIOR PASS clipboard='$clip'"
          Write-Output 'CLIPBOARD DECISIVE NATIVE KEY/SELECTION/COPY PASS'

          $move=RestoreMoveValueEventually 'e5' 'before board entry'
          $vp=ValuePattern $move 'Move restored before board entry'
'''
          helper=helper[:start]+replacement+helper[end+len("  $vp.SetValue('e5')"):]
          helper=helper.replace("; if([string]$vp.Current.Value -ne 'e5'){throw 'Could not prepare e5 before board entry'}","",1)
          helper_path.write_text(helper,encoding='utf-8')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'V5 QA helper patch failed'}

      - name: Validate V5 QA helper
        shell: pwsh
        run: |
          $helper='tools\qa\stage1_packaged_e2e_crossprocess.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $helper),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -gt 0){throw (@($errors|ForEach-Object{$_.Message}) -join ' | ')}
          $text=Get-Content $helper -Raw
          foreach($m in @('AccessibleChessQaNativeKeysV5','QA BOUNDED MOVE RESTORE PASS','NATIVE KEY DELIVERY CONTROL PASS','NATIVE CTRL+A SELECTION BEHAVIOR PASS','NATIVE_CTRL_C_COPY_DEFECT_AFTER_PROVEN_SELECTION')){
            if(-not $text.Contains($m)){throw "V5 marker missing: $m"}
          }
          if($text -match 'TextPatternRangeEndpoint'){throw 'Ambiguous TextPattern endpoint dependency remains'}
          'V5 HELPER VALIDATION PASS'

      - name: Commit only QA helper change
        shell: pwsh
        run: |
          $changes=@(git status --short)
          $changes | ForEach-Object {$_}
          if($changes.Count -ne 1 -or $changes[0] -ne ' M tools/qa/stage1_packaged_e2e_crossprocess.ps1'){
            throw "Expected exactly one QA helper change, got: $($changes -join ' | ')"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/qa/stage1_packaged_e2e_crossprocess.ps1
          git commit -m 'QA: bounded restore before decisive native proof'
          git push origin HEAD:$env:TARGET_BRANCH
          if($LASTEXITCODE -ne 0){throw 'QA helper push failed'}

      - name: Enforce WIP one and dispatch exact strict workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $data=gh api "repos/${{ github.repository }}/actions/workflows/$env:STRICT_WORKFLOW_ID/runs?branch=$env:TARGET_BRANCH&per_page=20" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Could not query strict workflow runs'}
          $active=@($data.workflow_runs|Where-Object {$_.status -in @('queued','in_progress','waiting','pending','requested')})
          if($active.Count -gt 0){
            "STRICT WORKFLOW ALREADY ACTIVE: $(@($active.id) -join ',')"
            exit 0
          }
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/$env:STRICT_WORKFLOW_ID/dispatches" -f ref=$env:TARGET_BRANCH
          if($LASTEXITCODE -ne 0){throw 'Strict workflow dispatch failed'}
          'STRICT 656E8EC V5 WORKFLOW DISPATCHED'
