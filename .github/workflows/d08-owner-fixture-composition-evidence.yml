name: D08 Owner Fixture Composition Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - qa/d08-training-owner-fixture-composition-20260823
  pull_request:
    branches:
      - autopulse/d08-book-training-contract-20260823

permissions:
  contents: read

jobs:
  verify-composed-training-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      EXPECTED_PARENT: 67618387e8bb8055037cf17aca3923d484368cb0
      FULL_PRODUCT_BASE: dd9ebf9414103c805892856fe6a04706fa69039f
      D01_FIXTURE_HEAD: a2b732d81b92c487b0da4edb235c3329ef572862
      D03_FIXTURE_HEAD: bab3652e6a6d018d7f806ed8c0496acdaa860a82
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve LF checkout on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Prove evidence-only branch and exact owner deltas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD)"
          test "$changed" = '.github/workflows/d08-owner-fixture-composition-evidence.yml'
          git diff --check "$EXPECTED_PARENT" HEAD

          d01="$(git diff --name-only "$FULL_PRODUCT_BASE" "$D01_FIXTURE_HEAD" | sort)"
          expected_d01="$(printf '%s\n' '.github/workflows/d01-training-fixture-compat.yml' 'tests/test_dev1_full_product_ui_packages.py' | sort)"
          test "$d01" = "$expected_d01"

          d03="$(git diff --name-only "$FULL_PRODUCT_BASE" "$D03_FIXTURE_HEAD" | sort)"
          expected_d03="$(printf '%s\n' '.github/workflows/d03-training-fixture-compat.yml' 'tests/test_dev3_student_progress.py' | sort)"
          test "$d03" = "$expected_d03"
      - name: Overlay exact owner-approved fixture blobs
        shell: bash
        run: |
          set -euo pipefail
          git show "$D01_FIXTURE_HEAD:tests/test_dev1_full_product_ui_packages.py" > tests/test_dev1_full_product_ui_packages.py
          git show "$D03_FIXTURE_HEAD:tests/test_dev3_student_progress.py" > tests/test_dev3_student_progress.py
          git diff --check
      - name: Compile composed tree
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Focused D08 and owner compatibility regressions
        run: >-
          python -m unittest -v
          tests.test_d08_book_training_contract
          tests.test_training
          tests.test_d08_training_canonical_resume
          tests.test_dev1_full_product_ui_packages.TrainingPresenterTests
          tests.test_dev3_student_progress
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q
      - name: Complete product diagnostic
        run: python run_accessible_chess.py --diagnostic
