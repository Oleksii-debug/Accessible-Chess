name: V2 Release SPDX SBOM

on:
  push:
    branches:
      - hardening/release-spdx-sbom-20260926
      - converge/current-product-launcher-keyboard-persistence-pgn-20261004-sol56-g255
    paths:
      - 'acs/version2_release_sbom.py'
      - 'scripts/write_version2_release_sbom.py'
      - 'tests/test_version2_release_sbom.py'
      - '.github/workflows/version2-release-spdx-sbom.yml'
  pull_request:
    branches:
      - converge/current-product-launcher-keyboard-persistence-pgn-20261004-sol56-g255
    paths:
      - 'acs/version2_release_sbom.py'
      - 'scripts/write_version2_release_sbom.py'
      - 'tests/test_version2_release_sbom.py'
      - '.github/workflows/version2-release-spdx-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-release-spdx-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_PRODUCT_BASE: 6b6e52517f59bb34a057b9e91f2a9c74fd2cded9
      PRODUCT_BASE_REF: converge/current-product-launcher-keyboard-persistence-pgn-20261004-sol56-g255
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact candidate identity and bounded SBOM scope
        shell: python
        run: |
          import os
          import subprocess

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          actual = git('rev-parse', 'HEAD')
          expected = os.environ['EXPECTED_HEAD']
          if actual != expected:
              raise SystemExit(f'checked out {actual}, expected candidate head {expected}')

          expected_product_base = os.environ['EXPECTED_PRODUCT_BASE']
          product_base_ref = os.environ['PRODUCT_BASE_REF']
          subprocess.run(['git', 'cat-file', '-e', f'{expected_product_base}^{{commit}}'], check=True)
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', product_base_ref], check=True)
          live_product_base = git('rev-parse', f'origin/{product_base_ref}')
          if live_product_base != expected_product_base:
              raise SystemExit(
                  'Product base advanced; reconverge #805 before qualification: '
                  f'{live_product_base} != {expected_product_base}'
              )

          if os.environ.get('GITHUB_EVENT_NAME') == 'pull_request':
              event_base = os.environ.get('PR_BASE_SHA', '')
              base_ref = os.environ.get('PR_BASE_REF', '')
              if not event_base or not base_ref:
                  raise SystemExit('missing pull-request Product base identity')
              if base_ref != product_base_ref:
                  raise SystemExit(f'unexpected PR base ref: {base_ref}')
              if event_base != expected_product_base:
                  raise SystemExit(
                      f'PR event base moved: {event_base} != {expected_product_base}'
                  )

          subprocess.run(
              ['git', 'merge-base', '--is-ancestor', expected_product_base, 'HEAD'],
              check=True,
          )
          if git('merge-base', expected_product_base, 'HEAD') != expected_product_base:
              raise SystemExit('Product base is not exact candidate merge-base')
          subprocess.run(['git', 'diff', '--check', expected_product_base, 'HEAD'], check=True)

          changed = set(
              git('diff', '--name-only', expected_product_base, 'HEAD').splitlines()
          )
          allowed = {
              '.github/workflows/version2-release-spdx-sbom.yml',
              'acs/version2_release_sbom.py',
              'scripts/write_version2_release_sbom.py',
              'tests/test_version2_release_sbom.py',
          }
          foreign = sorted(changed - allowed)
          if foreign:
              raise SystemExit('foreign SBOM candidate paths: ' + ', '.join(foreign))
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit('missing declared SBOM candidate paths: ' + ', '.join(missing))
          print(f'V2_RELEASE_SBOM_PRODUCT_BASE={expected_product_base}')
          print('V2_RELEASE_SBOM_EXACT_HEAD_SCOPE=PASS')
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile SBOM source and release entrypoint
        run: python -m py_compile acs/version2_release_sbom.py scripts/write_version2_release_sbom.py
      - name: Run deterministic SPDX SBOM contract
        run: python -m unittest -v tests.test_version2_release_sbom
