name: P0 Copy Package Reconverge Once

on:
  push:
    branches:
      - automation/p0-copy-package-reconverge-20260912
    paths:
      - '.github/workflows/p0-copy-package-reconverge-once.yml'
      - 'tools/automation/reconverge_p0_copy_package.py'

permissions:
  contents: write

jobs:
  reconverge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconverge same package lineage
        env:
          PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
          PACKAGE_BRANCH: work/post-freeze-v2-windows-package-qualification-20260911
          EXPECTED_PACKAGE_HEAD: f92e882bce71cd52806ab2dd390ae959bed5084e
          P0_MERGE_SHA: 35d3f50bfe5b6ef708f59dbbf14ecc585e634903
        run: python tools/automation/reconverge_p0_copy_package.py
