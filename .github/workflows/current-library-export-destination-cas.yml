name: Current Library Export Destination CAS

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - '.github/workflows/current-library-export-destination-cas.yml'
      - '.github/workflows/current-library-open-publication-ack.yml'
      - 'acs/full_product_actions.py'
      - 'acs/library_export_service.py'
      - 'acs/library_export_webview_projection.py'
      - 'acs/library_webview_bridge.py'
      - 'acs/ui_keymap_adapter.py'
      - 'acs/version2_application.py'
      - 'acs/version2_windows_host_runtime.py'
      - 'acs/version2_windows_library_export.py'
      - 'tests/js/library_export_surface_dom_test.js'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - 'tests/test_library_open_game_publication.py'
      - 'tests/test_v2_windows_host_runtime.py'
      - 'tests/test_v2_windows_library_export_background.py'
      - 'web/full_product_library.js'
      - 'web/version2_release_bootstrap.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-library-export-destination-cas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove current shipping ancestry and exact scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SHIPPING_REF: converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "${EVENT_BASE_REF:-$SHIPPING_REF}" = "$SHIPPING_REF"

          if [ -n "${{ github.event.pull_request.number }}" ]; then
            git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
            test "$(git rev-parse FETCH_HEAD)" = "$expected_head" || {
              echo "CURRENT_LIBRARY_EXPORT_DESTINATION_CAS_SUPERSEDED" >&2
              exit 1
            }
          fi

          git fetch --no-tags origin "+refs/heads/$SHIPPING_REF:refs/remotes/origin/$SHIPPING_REF"
          live_shipping="$(git rev-parse "refs/remotes/origin/$SHIPPING_REF")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_shipping" || {
              echo "CURRENT_LIBRARY_EXPORT_DESTINATION_CAS_BASE_MOVED event=$EVENT_BASE_SHA live=$live_shipping" >&2
              exit 1
            }
          fi

          git merge-base --is-ancestor "$live_shipping" HEAD
          test "$(git merge-base "$live_shipping" HEAD)" = "$live_shipping"
          git diff --check "$live_shipping"...HEAD

          changed="$(git diff --name-only "$live_shipping"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-library-export-destination-cas.yml' \
            '.github/workflows/current-library-open-publication-ack.yml' \
            'acs/full_product_actions.py' \
            'acs/library_export_service.py' \
            'acs/library_export_webview_projection.py' \
            'acs/library_webview_bridge.py' \
            'acs/ui_keymap_adapter.py' \
            'acs/version2_application.py' \
            'acs/version2_windows_host_runtime.py' \
            'acs/version2_windows_library_export.py' \
            'tests/js/library_export_surface_dom_test.js' \
            'tests/js/version2_release_bootstrap_dom_test.js' \
            'tests/test_library_open_game_publication.py' \
            'tests/test_v2_windows_host_runtime.py' \
            'tests/test_v2_windows_library_export_background.py' \
            'web/full_product_library.js' \
            'web/version2_release_bootstrap.js' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected Library export background/CAS scope:\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/pgn_service.py)" = "$(git rev-parse "$live_shipping":acs/pgn_service.py)"
          test "$(git rev-parse HEAD:acs/version2_windows_pgn_export.py)" = "$(git rev-parse "$live_shipping":acs/version2_windows_pgn_export.py)"
          test "$(git rev-parse HEAD:acs/version2_pgn_commands.py)" = "$(git rev-parse "$live_shipping":acs/version2_pgn_commands.py)"

          test "$(git rev-parse HEAD:acs/full_product_actions.py)" = "ef33a8530e43ae78f6a56a6ecf5ba5f5ae9f4b4f"
          test "$(git rev-parse HEAD:acs/library_export_service.py)" = "8efa08f714d6f14d2e6a251e442f0fcd47af2570"
          test "$(git rev-parse HEAD:acs/library_export_webview_projection.py)" = "f43f9fd71953035a582a84bd8a64ead0d54ee25a"
          test "$(git rev-parse HEAD:acs/library_webview_bridge.py)" = "b4be6f6fd08d9876acfa86d018a78f9d164e484d"
          test "$(git rev-parse HEAD:acs/ui_keymap_adapter.py)" = "68ee886873ec96bfca9f8a25ec499deb67a5b25a"
          test "$(git rev-parse HEAD:acs/version2_application.py)" = "64ff565255cacca0df2dd4eaab17b3326e4af47a"
          test "$(git rev-parse HEAD:acs/version2_windows_host_runtime.py)" = "afc0aa8ac5dd294a4b850f61c56b65f453c8d60d"
          test "$(git rev-parse HEAD:acs/version2_windows_library_export.py)" = "af7bc379ea76390590c36a2797127e21935bd313"
          test "$(git rev-parse HEAD:tests/js/library_export_surface_dom_test.js)" = "61af02b4fe654c02b76403a100ac73ea4fde479f"
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = "3b61778122cb97a6f0cca8febbb3ccc801c0275b"
          test "$(git rev-parse HEAD:tests/test_library_open_game_publication.py)" = "c232ea738cdf39ff1273d7b819acfc0ddd02bc0b"
          test "$(git rev-parse HEAD:tests/test_v2_windows_host_runtime.py)" = "fa4a63f6893201b105d68fa07a20fce1582a9373"
          test "$(git rev-parse HEAD:tests/test_v2_windows_library_export_background.py)" = "41fd5514a54c749d2d2fc2fcb9f9aba9dbad8b66"
          test "$(git rev-parse HEAD:web/full_product_library.js)" = "7fd5a97c9781734399f8cecc604c2a6f2540c3fc"
          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = "fd3ceb1185bf07f996427f0967feedc599eec120"

          echo "CURRENT_LIBRARY_EXPORT_DESTINATION_CAS_SHIPPING=$live_shipping"
          echo "CURRENT_LIBRARY_EXPORT_DESTINATION_CAS_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed boundary
        run: >-
          python -m compileall -q
          acs/full_product_actions.py
          acs/library_export_service.py
          acs/library_export_webview_projection.py
          acs/library_webview_bridge.py
          acs/ui_keymap_adapter.py
          acs/version2_application.py
          acs/version2_windows_host_runtime.py
          acs/version2_windows_library_export.py
          tests/test_library_open_game_publication.py
          tests/test_v2_windows_library_export_background.py
          tests/test_v2_windows_host_runtime.py

      - name: Execute Library and release focus DOM oracles
        run: |
          node tests/js/library_export_surface_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Execute Library export, publication, host-runtime, and canonical writer regressions
        run: >-
          python -m unittest -v
          tests.test_library_open_game_publication
          tests.test_v2_windows_library_export_background
          tests.test_v2_windows_host_runtime
          tests.test_d07_library_export_reachability
          tests.test_d07_library_export_service
          tests.test_d07_library_export_webview
          tests.test_dev1_library_webview_projection
          tests.test_v2_windows_library_export
          tests.test_full_product_library_keybindings
          tests.test_ui_keymap_adapter
          tests.test_version2_windows_composition_profile
          tests.test_pgn_service
          tests.test_pgn_concurrent_save
          tests.test_v2_windows_pgn_export
          tests.test_v2_windows_native_dialog_ownership

      - name: Core selftest
        run: python -m acs.selftest
