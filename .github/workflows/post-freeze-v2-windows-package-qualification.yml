          path: |
            Accessible-Chess-V2-*-post-freeze-package-qualification.zip
            packaged-uia-strict-summary.json
            packaged-v2-current-native-menu-summary.json
            packaged-v2-document-copy-summary.json
            packaged-p0g-hotkey-result-summary.json
            packaged-final-acceptance-summary.json
            packaged-local-persistence-summary.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Download uploaded package artifact for exact readback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Accessible-Chess-V2-post-freeze-package-qualification
          path: artifact-readback

      - name: Verify packaged P0-G evidence survived artifact readback byte-for-byte
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=(Resolve-Path -LiteralPath 'packaged-p0g-hotkey-result-summary.json').Path
          $readback=(Resolve-Path -LiteralPath 'artifact-readback\packaged-p0g-hotkey-result-summary.json').Path
          $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash
          $readbackHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $readback).Hash
          if($sourceHash -ne $readbackHash){throw 'Packaged P0-G evidence changed across upload/download readback'}
          $summary=Get-Content -LiteralPath $readback -Raw | ConvertFrom-Json
          if([string]$summary.product_sha -ne $env:PRODUCT_PARENT){throw 'Readback P0-G evidence Product SHA mismatch'}
          if(-not [bool]$summary.foreground_product_verified){throw 'Readback P0-G evidence did not preserve foreground Product proof'}
          if(-not [string]$summary.alt_1_precondition_selected_state -or -not [bool]$summary.alt_1_action_occurred -or -not [string]$summary.alt_1_selected_state -or -not [bool]$summary.alt_1_accessible_result_exposed -or -not [string]$summary.alt_2_precondition_selected_state -or -not [bool]$summary.alt_2_action_occurred -or -not [string]$summary.alt_2_selected_state -or -not [bool]$summary.alt_2_accessible_result_exposed){throw 'Readback P0-G causal selected-state acceptance fields incomplete'}
          if([bool]$summary.human_tested -or [bool]$summary.nvda_verified){throw 'Readback evidence fabricated human/NVDA acceptance'}
          Write-Host "PACKAGED_P0G_ARTIFACT_READBACK=PASS sha256=$($sourceHash.ToLowerInvariant())"

      - name: Verify durable Book restart evidence survived artifact readback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=(Resolve-Path -LiteralPath 'packaged-final-acceptance-summary.json').Path
          $readback=(Resolve-Path -LiteralPath 'artifact-readback\packaged-final-acceptance-summary.json').Path
          $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash
          $readbackHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $readback).Hash
          if($sourceHash -ne $readbackHash){throw 'Packaged final acceptance evidence changed across upload/download readback'}
          $evidence=Get-Content -LiteralPath $readback -Raw | ConvertFrom-Json
          if([string]$evidence.product_sha -ne $env:PRODUCT_PARENT){throw 'Book restart evidence Product SHA mismatch'}
          if(-not [bool]$evidence.books_native_keyboard_enter){throw 'Books native keyboard Enter activation was not proven'}
          if(-not [bool]$evidence.book_progress_cursor_persisted_restart){throw 'Book cursor persistence across restart was not proven'}
          if(-not [bool]$evidence.book_bookmark_restore_persisted_restart){throw 'Named Book bookmark persistence across restart was not proven'}
          $saved=[string]$evidence.book_saved_block
          $away=[string]$evidence.book_away_block
          $restart=[string]$evidence.book_restart_block_before_restore
          $restored=[string]$evidence.book_restored_block
          if($saved -notmatch '^book-block-[0-9]+$' -or $away -notmatch '^book-block-[0-9]+$'){throw 'Book persistence evidence block identity is invalid'}
          if($saved -eq $away){throw 'Book persistence evidence did not move away from the saved block'}
          if($restart -ne $away){throw 'Book current cursor did not survive restart in readback evidence'}
          if($restored -ne $saved){throw 'Named Book bookmark did not restore the exact saved block in readback evidence'}
          $trainingOrigin=[string]$evidence.book_training_origin_after_restore
          if($trainingOrigin -ne $away){throw 'Book cursor was not returned to the known Training origin after bookmark verification'}
          if(-not [bool]$evidence.training_native_keyboard_enter){throw 'Training native keyboard Enter activation was not proven'}
          if(-not [bool]$evidence.training_progress_persisted_restart){throw 'Training progress persistence across restart was not proven'}
          $trainingAttempts=[int]$evidence.training_attempts_after_wrong_submit
          $trainingMistakes=[int]$evidence.training_mistakes_after_wrong_submit
          $restartAttempts=[int]$evidence.training_restart_attempts
          $restartMistakes=[int]$evidence.training_restart_mistakes
          if($trainingAttempts -lt 1 -or $trainingMistakes -lt 1){throw 'Training persistence evidence did not record a real wrong-answer mutation'}
          if($restartAttempts -ne $trainingAttempts -or $restartMistakes -ne $trainingMistakes){throw 'Training attempts/mistakes did not survive artifact-bound restart evidence'}
          if([bool]$evidence.human_tested -or [bool]$evidence.nvda_verified){throw 'Machine Book/Training persistence evidence must not claim physical NVDA acceptance'}
          Write-Host "PACKAGED_BOOK_TRAINING_PROGRESS_ARTIFACT_READBACK=PASS sha256=$($sourceHash.ToLowerInvariant()) saved=$saved away=$away training_attempts=$trainingAttempts training_mistakes=$trainingMistakes"

      - name: Verify package-local persistence evidence survived artifact readback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=(Resolve-Path -LiteralPath 'packaged-local-persistence-summary.json').Path
          $readback=(Resolve-Path -LiteralPath 'artifact-readback\packaged-local-persistence-summary.json').Path
          $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash
          $readbackHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $readback).Hash
          if($sourceHash -ne $readbackHash){throw 'Package-local persistence evidence changed across upload/download readback'}
          $evidence=Get-Content -LiteralPath $readback -Raw | ConvertFrom-Json
          if([string]$evidence.schema -ne 'accessible-chess-packaged-local-persistence-v1'){throw 'Package-local persistence evidence schema mismatch'}
          if([string]$evidence.product_sha -ne $env:PRODUCT_PARENT){throw 'Package-local persistence evidence Product SHA mismatch'}
          if([string]$evidence.manifest_package_local_appdata -ne 'data/AccessibleChess'){throw 'Package-local persistence manifest binding mismatch'}
          if(-not [bool]$evidence.launcher_localappdata_redirect_verified){throw 'Launcher LOCALAPPDATA redirect proof missing from readback evidence'}
          if(-not [bool]$evidence.book_progress_package_local){throw 'Book package-local persistence proof missing'}
          if([string]$evidence.book_progress_path -ne 'data/AccessibleChess/book-progress.json'){throw 'Book package-local path mismatch'}
          if([int64]$evidence.book_progress_bytes -le 0 -or [string]$evidence.book_progress_sha256 -notmatch '^[0-9a-f]{64}$'){throw 'Book package-local file identity is invalid'}
          if(-not [bool]$evidence.training_progress_package_local){throw 'Training package-local persistence proof missing'}
          $training=@($evidence.training_progress_files)
          if($training.Count -lt 1){throw 'Training package-local persistence evidence contains no files'}
          foreach($item in $training){
            if(-not ([string]$item.path).StartsWith('data/AccessibleChess/training-progress/',[StringComparison]::Ordinal)){throw "Training package-local path escaped expected root: $($item.path)"}
            if([int64]$item.bytes -le 0 -or [string]$item.sha256 -notmatch '^[0-9a-f]{64}$'){throw "Training package-local file identity is invalid: $($item.path)"}
          }
          if(-not [bool]$evidence.package_data_reparse_free){throw 'Package-local persistence reparse safety proof missing'}
          if([bool]$evidence.human_tested -or [bool]$evidence.nvda_verified){throw 'Machine package-local persistence evidence fabricated human/NVDA acceptance'}
          Write-Host "PACKAGED_LOCAL_PERSISTENCE_ARTIFACT_READBACK=PASS sha256=$($sourceHash.ToLowerInvariant()) training_files=$($training.Count)"

      - name: Execute inherited post-upload readback and final checkpoint
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path -LiteralPath .package-qualification-executor.py -PathType Leaf)){throw 'Inherited qualification executor missing before post-readback'}
          python .package-qualification-executor.py post
          if($LASTEXITCODE -ne 0){throw 'Inherited post-artifact qualification failed'}