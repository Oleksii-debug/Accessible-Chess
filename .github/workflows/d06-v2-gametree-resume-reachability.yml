name: D06 V2 GameTree Resume Reachability

on:
  pull_request:
    paths:
      - 'acs/version2_gametree_resume.py'
      - 'acs/version2_release_app.py'
      - 'tests/test_d06_v2_gametree_resume_reachability.py'
      - '.github/workflows/d06-v2-gametree-resume-reachability.yml'

permissions:
  contents: read

concurrency:
  group: d06-v2-gametree-resume-reachability-${{ github.ref }}
  cancel-in-progress: true

env:
  D06_V2_RESUME_BASE: d1a127e23060dc3fd25157d14f28d9f01716f3b8

jobs:
  v2-resume-reachability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact canonical ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$D06_V2_RESUME_BASE^{commit}"
          test "$(git merge-base HEAD "$D06_V2_RESUME_BASE")" = "$D06_V2_RESUME_BASE"
          git diff --check "$D06_V2_RESUME_BASE" HEAD
          changed="$(git diff --name-only "$D06_V2_RESUME_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d06-v2-gametree-resume-reachability.yml' \
            'acs/version2_gametree_resume.py' \
            'acs/version2_release_app.py' \
            'tests/test_d06_v2_gametree_resume_reachability.py' | sort)"
          test "$changed" = "$expected"

      - name: Compile changed Python surface
        run: >-
          python -m py_compile
          acs/version2_gametree_resume.py
          acs/version2_release_app.py
          tests/test_d06_v2_gametree_resume_reachability.py

      - name: Focused D06 release-resume and close-boundary regressions
        run: >-
          python -m unittest -v
          tests.test_d06_v2_gametree_resume_reachability
          tests.test_d06_gametree_snapshot_resume
          tests.test_version2_release_app
          tests.test_version2_shutdown
          tests.test_w5_native_formclosing_dirty_pgn

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
