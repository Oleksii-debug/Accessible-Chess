name: Accessible Chess Version 2 Formats Integration

on:
  push:
    branches:
      - work/version2-integration-formats-20260827
      - codex/v2-runtime-completion-20260907
      - fix/v2-formats-current-runtime-lock-20260911
  pull_request:
    paths:
      - '.github/workflows/d01-full-product-native-menu.yml'
      - '.github/workflows/d06-file-ingress-nag-normalization.yml'
      - '.github/workflows/d06-real-corpus-recovery.yml'
      - '.github/workflows/d06-pgn-streaming-export.yml'
      - '.github/workflows/d08-owner-fixture-integration.yml'
      - '.github/workflows/v2-book-progress-store.yml'
      - '.github/workflows/v2-book-progress-production-repair.yml'
      - '.github/workflows/v2-cbf-cbi-evidence.yml'
      - '.github/workflows/v2-library-acsdb-search-v4.yml'
      - '.github/workflows/v2-library-date-filter-v5.yml'
      - '.github/workflows/v2-library-integrity-repair.yml'
      - '.github/workflows/version2-formats-integration.yml'
      - '.github/workflows/whole-product-integration-preview.yml'
      - 'acs/acsdb.py'
      - 'acs/book_progress_store.py'
      - 'acs/cbv_extractor.py'
      - 'acs/chessbase_adapter.py'
      - 'acs/chessbase_decoder.py'
      - 'acs/chessbase_integrity.py'
      - 'acs/chessbase_library_import.py'
      - 'acs/full_product_ui_shell.py'
      - 'acs/import_contract.py'
      - 'acs/library_import_service.py'
      - 'acs/library_webview_bridge.py'
      - 'acs/library_webview_projection.py'
      - 'acs/pgn_document.py'
      - 'acs/pgn_service.py'
      - 'acs/search_policy.py'
      - 'acs/search_service.py'
      - 'docs/automation/DEV4_CHESSBASE_CAPABILITY_MATRIX.md'
      - 'docs/automation/V2_CBF_CBI_EVIDENCE.md'
      - 'docs/automation/V2_CHESSBASE_CAPABILITIES.json'
      - 'tests/js/library_surface_dom_test.js'
      - 'tests/test_cbv_extractor.py'
      - 'tests/test_cbv_uncbv_external_fixture.py'
      - 'tests/test_chessbase_adapter.py'
      - 'tests/test_chessbase_decoder.py'
      - 'tests/test_chessbase_libcbh_external_fixture.py'
      - 'tests/test_d06_file_ingress_nag_normalization.py'
      - 'tests/test_d06_real_corpus_recovery.py'
      - 'tests/test_v2_pgn_streaming_export.py'
      - 'tests/test_d07_library_import_service.py'
      - 'tests/test_dev1_full_product_accessible_shell.py'
      - 'tests/test_dev1_full_product_ui_packages.py'
      - 'tests/test_dev1_library_webview_projection.py'
      - 'tests/test_full_product_native_menu.py'
      - 'tests/test_import_contract.py'
      - 'tests/test_library_import_ui_integration.py'
      - 'tests/test_library_workspace_ui_integration.py'
      - 'tests/test_v2_book_progress_store.py'
      - 'tests/test_v2_book_progress_store_production.py'
      - 'tests/test_v2_chessbase_capability_manifest.py'
      - 'tests/test_v2_library_acsdb_search_v4.py'
      - 'tests/test_v2_library_date_filter_v5.py'
      - 'tests/test_v2_library_date_real_cbv.py'
      - 'tests/test_v2_library_integrity_repair.py'
      - 'tests/test_v2_library_search_service_v4.py'
      - 'tests/test_version2_formats_integration.py'
      - 'tools/optional/LIBCBH_BACKEND.md'
      - 'tools/optional/UNCBV_BACKEND.md'
      - 'tools/optional/libcbh_json_bridge.cpp'
      - 'tools/v2_library_acsdb_search_v4_benchmark.py'
      - 'tools/v2_library_date_filter_v5_benchmark.py'
      - 'web/full_product_library.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessible-chess-v2-formats-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696
  UNCBV_COMMIT: 3c18e8a7c6a30c21f945a1ab5462521c306dca57

jobs:
  combined-formats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Resolve live candidate base and prove release-seam isolation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD

          changed="$(git diff --name-only "$BASE_SHA" HEAD | sort)"
          protected="$(printf '%s\n' "$changed" | grep -E '^(acs/chesscore\.py|acs/stage1_release_ui\.py|acs/stage1_release_ui_core\.py|acs/webapp_keymap_core\.py|web/stage1_board_actions\.js|web/stage1_release_bootstrap\.js|tools/qa/|.*windows-stage1.*|.*release_preflight.*)' || true)"
          if [ -n "$protected" ]; then
            printf 'Formats candidate mutates protected release seam relative to live base %s:\n%s\n' "$BASE_SHA" "$protected" >&2
            exit 1
          fi

          for path in \
            acs/chesscore.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py \
            acs/webapp_keymap_core.py \
            web/stage1_board_actions.js \
            web/stage1_release_bootstrap.js; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$BASE_SHA:$path")" || {
              printf 'Protected release seam drift: %s base=%s head=%s\n' \
                "$path" "$(git rev-parse "$BASE_SHA:$path")" "$(git rev-parse "HEAD:$path")" >&2
              exit 1
            }
          done
          printf 'FORMATS_LIVE_BASE=%s\n' "$BASE_SHA" >> "$GITHUB_ENV"

      - name: Compile Version 2 formats package
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Execute accessible Library PGN and Books DOM contracts
        run: |
          node --check web/full_product_library.js
          node --check web/full_product_pgn.js
          node --check web/full_product_books_training.js
          node tests/js/library_surface_dom_test.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - name: Version 2 semantic format journeys
        run: >-
          python -m unittest -v
          tests.test_version2_formats_integration
          tests.test_cbv_extractor
          tests.test_cbv_uncbv_external_fixture
          tests.test_chessbase_decoder
          tests.test_library_import_ui_integration
          tests.test_library_workspace_ui_integration
          tests.test_d06_real_corpus_recovery
          tests.test_d06_file_ingress_nag_normalization
          tests.test_v2_pgn_streaming_export
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_books_training_ui_integration
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_whole_product_user_journey

      - name: Library schema-v6 integrity date and bounded search matrix
        run: >-
          python -m unittest -v
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_search_service_v4
          tests.test_v2_library_date_filter_v5
          tests.test_v2_library_integrity_repair
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence

      - name: Format security migration and cancellation matrix
        run: >-
          python -m unittest -v
          tests.test_chessbase_adapter
          tests.test_chessbase_integrity
          tests.test_v2_chessbase_capability_manifest
          tests.test_dev4_chessbase_integrity_atomicity
          tests.test_dev4_chessbase_symlink_security
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_start_lock
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_search_scalar_equivalence
          tests.test_pgn_concurrent_save
          tests.test_dev4_pgn_export_concurrency_security
          tests.test_dev4_pgn_export_failure_recovery
          tests.test_dev4_pgn_export_path_security
          tests.test_dev4_pgn_resource_security

      - name: Re-materialize release seams before full-suite byte contracts
        shell: bash
        run: |
          set -euo pipefail
          for path in acs/stage1_release_ui_core.py acs/webapp_keymap_core.py; do
            git cat-file blob "HEAD:$path" > "$path"
          done

      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee full-unittest.log

      - name: Upload full unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-full-unittest-${{ matrix.os }}
          path: full-unittest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

  real-pinned-chessbase:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: Checkout Accessible Chess
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned external libcbh evidence corpus
        uses: actions/checkout@v4
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1

      - name: Checkout pinned external uncbv evidence corpus
        uses: actions/checkout@v4
        with:
          repository: antoyo/uncbv
          ref: 3c18e8a7c6a30c21f945a1ab5462521c306dca57
          path: upstream/uncbv
          fetch-depth: 1

      - name: Build pinned libcbh external component
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2

      - name: Build Accessible Chess JSON bridge without bundling it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge

      - name: Build pinned uncbv external component
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path upstream/uncbv/Cargo.toml
          test -x upstream/uncbv/target/release/uncbv
          uncbv_sha256="$(sha256sum upstream/uncbv/target/release/uncbv | cut -d' ' -f1)"
          echo "UNCBV_BINARY_SHA256=$uncbv_sha256" >> "$GITHUB_ENV"

      - name: Real CBH and CBV to canonical GameTree and schema-v6 Library journeys
        shell: bash
        working-directory: product
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_FIXTURE_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
          UNCBV_BINARY: ${{ github.workspace }}/upstream/uncbv/target/release/uncbv
          UNCBV_FIXTURE: ${{ github.workspace }}/upstream/uncbv/tests/twic1134.cbv
          UNCBV_SMALL_FIXTURE: ${{ github.workspace }}/upstream/uncbv/tests/small.cbv
        run: |
          set -o pipefail
          {
            python -m unittest -v tests.test_chessbase_libcbh_external_fixture
            python -m unittest -v tests.test_cbv_uncbv_external_fixture
            python -m unittest -v tests.test_version2_formats_integration
            python -m unittest -v tests.test_v2_library_date_real_cbv
          } 2>&1 | tee real-pinned.log

      - name: Upload real pinned diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-real-pinned-chessbase-library-v6
          path: product/real-pinned.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Default package excludes optional GPL backend
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test ! -e libcbh-json-bridge
          test ! -e libcbh.so
          test ! -e uncbv
          test -z "$(git status --porcelain --untracked-files=no)"
