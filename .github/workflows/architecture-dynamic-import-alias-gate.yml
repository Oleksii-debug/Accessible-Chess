name: Architecture Dynamic Import Alias Boundary

on:
  pull_request:
    paths:
      - 'acs/chesscore.py'
      - 'acs/gametree.py'
      - 'acs/bookdocument.py'
      - 'acs/history.py'
      - 'tests/test_architecture_dynamic_import_aliases.py'
      - 'tests/test_architecture_workflow_concurrency.py'
      - '.github/workflows/architecture-dynamic-import-alias-gate.yml'
  push:
    paths:
      - 'acs/chesscore.py'
      - 'acs/gametree.py'
      - 'acs/bookdocument.py'
      - 'acs/history.py'
      - 'tests/test_architecture_dynamic_import_aliases.py'
      - 'tests/test_architecture_workflow_concurrency.py'
      - '.github/workflows/architecture-dynamic-import-alias-gate.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dynamic-import-alias-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
      - name: Compile regression
        run: python -m py_compile tests/test_architecture_dynamic_import_aliases.py tests/test_architecture_workflow_concurrency.py
      - name: Run alias boundary
        run: python -m unittest -v tests.test_architecture_dynamic_import_aliases tests.test_architecture_workflow_concurrency
