name: Training Message Provenance Convergence

on:
  pull_request:
    paths:
      - 'acs/full_product_presenters.py'
      - 'acs/training_webview_projection.py'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - '.github/workflows/training-exact-ingress-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-message-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      EXACT_PARENT: d7424edb11527268dab10801ae2c190508688e8c
      PRESENTER_BLOB: 5e87ff8c832773a14dc778e2f0e6e02aa9f41d05
      PROJECTION_BLOB: 23077191cd2b1cfbb3722cea12b6a578c47c00c0
      PROJECTION_TEST_BLOB: 4999cb5fc0c86b828956f2ede58439272d8622c2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact stacked scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          test "$(git rev-parse "HEAD:acs/full_product_presenters.py")" = "$PRESENTER_BLOB"
          test "$(git rev-parse "HEAD:acs/training_webview_projection.py")" = "$PROJECTION_BLOB"
          test "$(git rev-parse "HEAD:tests/test_dev1_books_training_webview_projection.py")" = "$PROJECTION_TEST_BLOB"
          changed="$(git diff --name-only "$EXACT_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/training-exact-ingress-snapshot.yml' \
            'acs/full_product_presenters.py' \
            'acs/training_webview_projection.py' \
            'tests/test_dev1_books_training_webview_projection.py' | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Compile Training presentation boundary
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          acs/training_webview_projection.py
          tests/test_dev1_books_training_webview_projection.py

      - name: Execute Training presentation regression matrix
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_d08_training_canonical_resume
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_atomicity
          tests.test_dev1_books_training_webview_bridge
          tests.test_books_training_ui_integration
          tests.test_version2_training_current_runtime

      - name: Core selftest
        run: python -m acs.selftest
