name: Classroom Join Credential Service

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/classroom_join_credentials.py'
      - 'acs/livekit_classroom_token_issuer.py'
      - 'tests/test_classroom_join_credentials.py'
      - 'tests/test_livekit_classroom_token_issuer.py'
      - '.github/workflows/classroom-join-credential-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-join-credential-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  join-credential-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact bounded current-Product scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "work/full-product-teacher-education-reachability-20260911"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA" HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort)"
          allowed="$(printf '%s\n'             '.github/workflows/classroom-join-credential-service.yml'             'acs/classroom_join_credentials.py'             'acs/livekit_classroom_token_issuer.py'             'tests/test_classroom_join_credentials.py'             'tests/test_livekit_classroom_token_issuer.py' | sort)"
          test "$changed" = "$allowed"

      - name: Install exact reviewed LiveKit server SDK
        run: python -m pip install --disable-pip-version-check "livekit-api==1.2.1"

      - name: Compile trusted join/provider boundary
        run: python -m py_compile acs/classroom_join_credentials.py acs/livekit_classroom_token_issuer.py tests/test_classroom_join_credentials.py tests/test_livekit_classroom_token_issuer.py

      - name: Run join, LiveKit issuer, and canonical media contracts
        run: python -m unittest -v tests.test_classroom_join_credentials tests.test_livekit_classroom_token_issuer tests.test_classroom_realtime_media

      - name: Mint with the installed reviewed LiveKit SDK
        run: >-
          python -c "import asyncio; from datetime import datetime,timedelta,timezone; from acs.classroom_join_credentials import ClassroomJoinGrant; from acs.classroom_realtime_media import MediaSource; from acs.livekit_classroom_token_issuer import LiveKitClassroomJoinTokenIssuer; now=datetime.now(timezone.utc); issuer=LiveKitClassroomJoinTokenIssuer(api_key='test-key-123',api_secret='test-secret-456'); token=asyncio.run(issuer.issue_join_token(grant=ClassroomJoinGrant(room_id='room-smoke',participant_id='student-smoke',publish_sources=(MediaSource.MICROPHONE,)),issued_at=now,expires_at=now+timedelta(seconds=60))); assert token.count('.') == 2"

      - name: Prove server boundary contains no provider secret material
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq "(api[_-]?secret|private[_-]?key|roomadmin[_-]?token)[[:space:]]*=[[:space:]]*['\"]" acs/classroom_join_credentials.py
          ! grep -Eiq "(api[_-]?secret|private[_-]?key|roomadmin[_-]?token)[[:space:]]*=[[:space:]]*['\"]" acs/livekit_classroom_token_issuer.py
          grep -Fq 'ClassroomJoinAuthorizationPort' acs/classroom_join_credentials.py
          grep -Fq 'ClassroomJoinTokenIssuerPort' acs/classroom_join_credentials.py

      - name: Core selftest
        run: python -m acs.selftest
