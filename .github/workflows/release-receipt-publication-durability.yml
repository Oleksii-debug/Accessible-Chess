name: Release Receipt Publication Durability

on:
  push:
    branches:
      - fix/release-receipt-publication-durability-20261005-sol56z8q6
  pull_request:
    branches:
      - fix/physical-acceptance-postlink-retry-20261005-sol56z8q3
    paths:
      - acs/version2_release_receipt.py
      - tests/test_version2_release_receipt.py
      - .github/workflows/release-receipt-publication-durability.yml

permissions:
  contents: read

concurrency:
  group: release-receipt-publication-durability-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: 8c48630beab54fe2cbaf7f046539c0592d84f68d
  PARENT_BRANCH: fix/physical-acceptance-postlink-retry-20261005-sol56z8q3
  EXPECTED_RECEIPT_SOURCE_BLOB: 080cd37d881c98424b9b1141b19761d0e16beed9
  EXPECTED_RECEIPT_TEST_BLOB: 60cd5753337401092a7c78e48cf42e5d1ad51a56
  EXPECTED_PORTABLE_SOURCE_BLOB: fb52da953d3a13ef8ca0d4568f7b2a9f796057fd
  EXPECTED_PORTABLE_TEST_BLOB: 7aba9bb9b3f79f91d1cea817e9553ccecd186952

jobs:
  durability:
    name: Release receipt durability / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact stacked scope and pinned durability authority
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/release-receipt-parent"
          live_parent="$(git rev-parse refs/remotes/origin/release-receipt-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "RELEASE_RECEIPT_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/release-receipt-publication-durability.yml"
            "acs/version2_release_receipt.py"
            "tests/test_version2_release_receipt.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_release_receipt.py)" = "$EXPECTED_RECEIPT_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_release_receipt.py)" = "$EXPECTED_RECEIPT_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_portable_package.py)" = "$EXPECTED_PORTABLE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_portable_package.py)" = "$EXPECTED_PORTABLE_TEST_BLOB"

          echo "RELEASE_RECEIPT_PARENT=$EXPECTED_PARENT"
          echo "RELEASE_RECEIPT_DURABILITY_HEAD=$expected_head"

      - name: Set up canonical package-test Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile receipt durability boundary
        run: >-
          python -m py_compile
          acs/version2_release_receipt.py
          acs/version2_portable_package.py
          tests/test_version2_release_receipt.py
          tests/test_version2_portable_package.py

      - name: Run receipt and publication durability regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_receipt
          tests.test_version2_portable_package
