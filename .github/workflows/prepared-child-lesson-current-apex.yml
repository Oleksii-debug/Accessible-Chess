name: Prepared Child Lesson Current Apex

on:
  push:
    branches:
      - converge/books-training-owner-current-20261004-zftrkmo
    paths:
      - acs/child_coaching_application.py
      - acs/child_coaching_prepared_positions.py
      - acs/child_coaching_store.py
      - acs/version2_final_product_application.py
      - acs/version2_release_app.py
      - tests/test_version2_prepared_child_lesson_binding.py
      - tests/test_child_coaching_final_product_binding.py
      - .github/workflows/prepared-child-lesson-current-apex.yml
  pull_request:
    paths:
      - acs/child_coaching_application.py
      - acs/child_coaching_prepared_positions.py
      - acs/child_coaching_store.py
      - acs/version2_final_product_application.py
      - acs/version2_release_app.py
      - tests/test_version2_prepared_child_lesson_binding.py
      - tests/test_child_coaching_final_product_binding.py
      - .github/workflows/prepared-child-lesson-current-apex.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepared-child-lesson-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  prepared-child-lesson:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      APPLICATION_BLOB: d7b1ae384311514f93c64e4d68f98e6d570d51c1
      NAVIGATOR_BLOB: 060fb8cee23c7fe22465208268b4b8fef5760d14
      STORE_BLOB: 73e4f981efef1bdabf34acc99cc59c9659650469
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0

      - name: Prove exact prepared-position authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object acs/child_coaching_application.py)" = "$APPLICATION_BLOB"
          test "$(git hash-object acs/child_coaching_prepared_positions.py)" = "$NAVIGATOR_BLOB"
          test "$(git hash-object acs/child_coaching_store.py)" = "$STORE_BLOB"
          git diff --check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile prepared-lesson binding
        run: >-
          python -m py_compile
          acs/child_coaching_application.py
          acs/child_coaching_prepared_positions.py
          acs/version2_final_product_application.py
          acs/version2_release_app.py
          tests/test_version2_prepared_child_lesson_binding.py
          tests/test_child_coaching_final_product_binding.py

      - name: Run prepared-lesson and adjacent contracts
        run: >-
          python -m unittest -v
          tests.test_version2_prepared_child_lesson_binding
          tests.test_child_coaching_final_product_binding
          tests.test_child_coaching_prepared_positions
          tests.test_child_coaching_application
          tests.test_version2_teacher_session_runtime_binding
          tests.test_education_workspace

      - name: Run core selftest
        run: python -m acs.selftest
