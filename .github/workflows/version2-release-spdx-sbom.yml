name: V2 Release SPDX SBOM

on:
  push:
    branches:
      - converge/completion-launcher-books-20261004-sol56
    paths:
      - 'acs/version2_release_sbom.py'
      - 'scripts/write_version2_release_sbom.py'
      - 'tests/test_version2_release_sbom.py'
      - '.github/workflows/version2-release-spdx-sbom.yml'
  pull_request:
    branches:
      - converge/completion-launcher-books-20261004-sol56
    paths:
      - 'acs/version2_release_sbom.py'
      - 'scripts/write_version2_release_sbom.py'
      - 'tests/test_version2_release_sbom.py'
      - '.github/workflows/version2-release-spdx-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-release-spdx-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove exact candidate identity and bounded SBOM scope
        if: github.event_name == 'pull_request'
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          import os
          import subprocess

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          actual = git('rev-parse', 'HEAD')
          expected = os.environ['EXPECTED_HEAD']
          if actual != expected:
              raise SystemExit(f'checked out {actual}, expected PR head {expected}')

          event_base = os.environ['PR_BASE_SHA']
          base_ref = os.environ['PR_BASE_REF']
          if not event_base or not base_ref:
              raise SystemExit('missing pull-request completion base identity')
          subprocess.run(['git', 'cat-file', '-e', f'{event_base}^{{commit}}'], check=True)
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', base_ref], check=True)
          live_base = git('rev-parse', f'origin/{base_ref}')
          subprocess.run(['git', 'merge-base', '--is-ancestor', event_base, live_base], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', live_base, 'HEAD'], check=True)
          if git('merge-base', live_base, 'HEAD') != live_base:
              raise SystemExit('live completion base is not exact candidate merge-base')
          subprocess.run(['git', 'diff', '--check', live_base, 'HEAD'], check=True)

          changed = set(git('diff', '--name-only', live_base, 'HEAD').splitlines())
          allowed = {
              '.github/workflows/version2-release-spdx-sbom.yml',
              'acs/version2_release_sbom.py',
              'scripts/write_version2_release_sbom.py',
              'tests/test_version2_release_sbom.py',
          }
          foreign = sorted(changed - allowed)
          if foreign:
              raise SystemExit('foreign SBOM PR paths: ' + ', '.join(foreign))
          missing = sorted(allowed - changed)
          if missing:
              raise SystemExit('missing declared SBOM PR paths: ' + ', '.join(missing))
          print(f'V2_RELEASE_SBOM_LIVE_COMPLETION_BASE={live_base}')
          print('V2_RELEASE_SBOM_EXACT_HEAD_SCOPE=PASS')
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile SBOM source and release entrypoint
        run: python -m py_compile acs/version2_release_sbom.py scripts/write_version2_release_sbom.py
      - name: Run deterministic SPDX SBOM contract
        run: python -m unittest -v tests.test_version2_release_sbom
