name: W4 Candidate Artifact Readback Workflow Contract

on:
  pull_request:
    paths:
      - '.github/workflows/w4-v2-p0-candidate-artifact-readback.yml'
      - 'tests/test_w4_candidate_artifact_readback_workflow.py'
      - '.github/workflows/w4-candidate-artifact-readback-workflow-contract.yml'
  push:
    branches:
      - repair/w4-readback-dispatch-product-binding-20260927
    paths:
      - '.github/workflows/w4-v2-p0-candidate-artifact-readback.yml'
      - 'tests/test_w4_candidate_artifact_readback_workflow.py'
      - '.github/workflows/w4-candidate-artifact-readback-workflow-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Parse readback workflow
        run: python -c "from pathlib import Path; import yaml; yaml.safe_load(Path('.github/workflows/w4-v2-p0-candidate-artifact-readback.yml').read_text(encoding='utf-8')); print('W4_READBACK_WORKFLOW_YAML=PASS')"
      - name: Run dispatch/readback trust-boundary contract
        run: python -m unittest -v tests.test_w4_candidate_artifact_readback_workflow
