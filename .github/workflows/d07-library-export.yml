name: D07 Library Export

on:
  push:
    branches:
      - work/v2-d07-library-export-20260831
  pull_request:
    branches:
      - work/v2-windows-nvda-ui-20260828
    paths:
      - 'acs/library_export_service.py'
      - 'acs/library_export_webview_projection.py'
      - 'acs/library_export_workspace.py'
      - 'acs/library_webview_bridge.py'
      - 'acs/version2_windows_library_export.py'
      - 'web/full_product_library.js'
      - 'tests/test_d07_library_export_service.py'
      - 'tests/test_d07_library_export_webview.py'
      - 'tests/test_d07_library_export_reachability.py'
      - 'tests/test_v2_windows_library_export.py'
      - 'tests/js/library_export_surface_dom_test.js'
      - '.github/workflows/d07-library-export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d07-library-export-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUSTED_HOST_BASE: dc7427cb89a0b6a997cae467f82265778ea78168

jobs:
  library-export:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.4.2
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install -q pythonnet==3.0.5
          fi

      - name: Prove ownership ancestry exact scope and untouched canonical owners
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TRUSTED_HOST_BASE" HEAD
          test "$(git merge-base "$TRUSTED_HOST_BASE" HEAD)" = "$TRUSTED_HOST_BASE"
          git diff --check "$TRUSTED_HOST_BASE" HEAD
          changed="$(git diff --name-only "$TRUSTED_HOST_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/d07-library-export.yml' \
            'acs/library_export_service.py' \
            'acs/library_export_webview_projection.py' \
            'acs/library_export_workspace.py' \
            'acs/library_webview_bridge.py' \
            'acs/version2_windows_library_export.py' \
            'tests/js/library_export_surface_dom_test.js' \
            'tests/test_d07_library_export_reachability.py' \
            'tests/test_d07_library_export_service.py' \
            'tests/test_d07_library_export_webview.py' \
            'tests/test_v2_windows_library_export.py' \
            'web/full_product_library.js' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$TRUSTED_HOST_BASE" HEAD -- \
            acs/acsdb.py \
            acs/search_service.py \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            acs/pgn_service.py \
            acs/full_product_actions.py \
            acs/version2_windows_file_workflows.py \
            acs/version2_windows_host_runtime.py \
            acs/version2_windows_native_dialog_ownership.py \
            acs/version2_windows_pgn_export.py \
            tools/qa \
            .github/workflows/windows-stage1-strict.yml

      - name: Compile Python and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            acs/library_export_service.py \
            acs/library_export_webview_projection.py \
            acs/library_export_workspace.py \
            acs/library_webview_bridge.py \
            acs/version2_windows_library_export.py \
            tests/test_d07_library_export_service.py \
            tests/test_d07_library_export_webview.py \
            tests/test_d07_library_export_reachability.py \
            tests/test_v2_windows_library_export.py
          node --check web/full_product_library.js
          node --check tests/js/library_export_surface_dom_test.js

      - name: Library export browser DOM contracts
        run: |
          node tests/js/library_surface_dom_test.js
          node tests/js/library_export_surface_dom_test.js

      - name: Focused D07 Library export and owner regressions
        run: >-
          python -m unittest -v
          tests.test_d07_library_export_service
          tests.test_d07_library_export_webview
          tests.test_d07_library_export_reachability
          tests.test_v2_windows_library_export
          tests.test_dev1_library_webview_projection
          tests.test_search_service
          tests.test_pgn_service
          tests.test_v2_windows_pgn_export
          tests.test_v2_windows_host_runtime

      - name: Windows owner-bound Library export composition smoke
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import clr

          clr.AddReference("System.Windows.Forms")

          from acs.acsdb import AcsDatabase
          from acs.library_export_service import LibraryExportService
          from acs.version2_windows_library_export import Version2WindowsLibraryExportDelegate
          from acs.version2_windows_native_dialog_ownership import Version2OwnedWindowsPgnExportDialogs
          from System.Windows.Forms import Control

          owner = Control()
          database = AcsDatabase()
          try:
              service = LibraryExportService(database)
              dialogs = Version2OwnedWindowsPgnExportDialogs(lambda: owner)
              events = []
              delegate = Version2WindowsLibraryExportDelegate(
                  dialogs=dialogs,
                  service=service,
                  event_sink=events.append,
                  next_delegate=lambda action_id, payload: ('fallback', action_id),
              )
              assert dialogs.dialog_owner.resolve() is owner
              assert delegate.OWNED_ACTIONS == frozenset({'library.export'})
              assert delegate('analysis.restart', {}) == ('fallback', 'analysis.restart')
              print('WINDOWS OWNER-BOUND LIBRARY EXPORT COMPOSITION PASS')
          finally:
              database.close()
              owner.Dispose()
          PY

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
