name: Current Training Progress Recursion Fail-Closed

on:
  pull_request:
    branches:
      - fix/current-portable-manifest-recursion-20261005-sol56
    paths:
      - 'acs/training_progress_store.py'
      - 'tests/test_training_progress_json_prehash_bounds_current.py'
      - '.github/workflows/current-training-progress-recursion-failclosed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-training-progress-recursion-failclosed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live base and exact bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          base_ref="${EVENT_BASE_REF:-fix/current-portable-manifest-recursion-20261005-sol56}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-training-progress-recursion-failclosed.yml' \
            'acs/training_progress_store.py' \
            'tests/test_training_progress_json_prehash_bounds_current.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected TrainingProgress recursion repair scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile persistence boundary and regression
        run: >-
          python -m compileall -q
          acs/training_progress_store.py
          tests/test_training_progress_json_prehash_bounds_current.py

      - name: Execute exact persisted JSON resource regressions
        run: python -m unittest -v tests.test_training_progress_json_prehash_bounds_current

      - name: Execute retained Training crash and runtime contracts
        run: >-
          python -m unittest -v
          tests.test_w2_training_progress_crash_recovery
          tests.test_version2_training_current_runtime
          tests.test_book_training_passive_roots_current

      - name: Core selftest
        run: python -m acs.selftest
