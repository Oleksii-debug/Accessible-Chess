name: User Corpus PGN Windows-1251

on:
  push:
    branches:
      - work/user-corpus-pgn-cp1251-20261003
    paths:
      - 'acs/pgn_streaming_import.py'
      - 'acs/pgn_service.py'
      - 'tests/test_pgn_streaming_import.py'
      - 'tests/test_pgn_service.py'
      - 'tests/test_pgn_document.py'
      - 'tests/test_dev4_pgn_encoding_quality.py'
      - '.github/workflows/user-corpus-pgn-cp1251.yml'
  pull_request:
    paths:
      - 'acs/pgn_streaming_import.py'
      - 'acs/pgn_service.py'
      - 'tests/test_pgn_streaming_import.py'
      - 'tests/test_pgn_service.py'
      - 'tests/test_pgn_document.py'
      - 'tests/test_dev4_pgn_encoding_quality.py'
      - '.github/workflows/user-corpus-pgn-cp1251.yml'

permissions:
  contents: read

concurrency:
  group: user-corpus-pgn-cp1251-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed streaming boundary
        run: >-
          python -m py_compile
          acs/pgn_streaming_import.py
          acs/pgn_service.py
          tests/test_pgn_streaming_import.py
          tests/test_pgn_service.py
          tests/test_pgn_document.py

      - name: Run streaming and semantic regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_streaming_import
          tests.test_pgn_service
          tests.test_pgn_document
          tests.test_dev4_pgn_encoding_quality
          tests.test_v2_pgn_semantic_fidelity
          tests.test_v2_pgn_nested_comment_recovery

      - name: Verify clean tracked tree
        shell: bash
        run: git diff --check
