name: PGN Open Source Object Binding

on:
  pull_request:
    branches:
      - integration/import-terminal-application-race-apex-20261004-sol6p3
    paths:
      - 'acs/import_contract.py'
      - 'acs/pgn_service.py'
      - 'tests/test_dev4_pgn_resource_security.py'
      - 'tests/test_d04_chessbase_integrity_handle_identity.py'
      - 'tests/test_dev4_chessbase_integrity_atomicity.py'
      - 'tests/test_dev4_chessbase_integrity_io_observability.py'
      - 'tests/test_pgn_open_direct_source.py'
      - 'tests/test_pgn_open_identity_fail_closed.py'
      - 'tests/test_pgn_open_source_binding.py'
      - 'tests/test_pgn_open_unlink_source_binding.py'
      - 'tests/test_pgn_open_windows_reparse.py'
      - '.github/workflows/pgn-open-source-binding.yml'

permissions:
  contents: read

concurrency:
  group: pgn-open-source-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-binding:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact PR scope and protected semantic authorities
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          event_base="$PR_BASE_SHA"
          base_ref="$PR_BASE_REF"
          test -n "$event_base"
          test -n "$base_ref"
          git cat-file -e "$event_base^{commit}"
          git fetch --no-tags origin "$base_ref"
          live_base="$(git rev-parse "origin/$base_ref")"
          git merge-base --is-ancestor "$event_base" "$live_base"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base" HEAD
          changed="$(git diff --name-only "$live_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/pgn-open-source-binding.yml' \
            'acs/import_contract.py' \
            'acs/pgn_service.py' \
            'tests/test_dev4_pgn_resource_security.py' \
            'tests/test_d04_chessbase_integrity_handle_identity.py' \
            'tests/test_dev4_chessbase_integrity_atomicity.py' \
            'tests/test_dev4_chessbase_integrity_io_observability.py' \
            'tests/test_pgn_open_direct_source.py' \
            'tests/test_pgn_open_identity_fail_closed.py' \
            'tests/test_pgn_open_source_binding.py' \
            'tests/test_pgn_open_unlink_source_binding.py' \
            'tests/test_pgn_open_windows_reparse.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$live_base" HEAD -- \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            acs/pgn_document.py \
            acs/pgn_workspace.py \
            acs/library_import_service.py \
            acs/acsdb.py \
            acs/chesscore.py \
            web

      - name: Compile source-object boundary
        run: >-
          python -m py_compile
          acs/import_contract.py
          acs/pgn_service.py
          tests/test_dev4_pgn_resource_security.py
          tests/test_d04_chessbase_integrity_handle_identity.py
          tests/test_dev4_chessbase_integrity_atomicity.py
          tests/test_dev4_chessbase_integrity_io_observability.py
          tests/test_pgn_open_direct_source.py
          tests/test_pgn_open_identity_fail_closed.py
          tests/test_pgn_open_source_binding.py
          tests/test_pgn_open_unlink_source_binding.py
          tests/test_pgn_open_windows_reparse.py

      - name: Focused source-object and PGN regressions
        run: >-
          python -m unittest -v
          tests.test_import_contract
          tests.test_dev4_pgn_resource_security
          tests.test_d04_chessbase_integrity_handle_identity
          tests.test_dev4_chessbase_integrity_atomicity
          tests.test_dev4_chessbase_integrity_io_observability
          tests.test_pgn_open_direct_source
          tests.test_pgn_open_identity_fail_closed
          tests.test_pgn_open_source_binding
          tests.test_pgn_open_unlink_source_binding
          tests.test_pgn_open_windows_reparse
          tests.test_pgn_service
          tests.test_dev4_pgn_encoding_quality
          tests.test_dev4_pgn_resource_security

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Selftest and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
