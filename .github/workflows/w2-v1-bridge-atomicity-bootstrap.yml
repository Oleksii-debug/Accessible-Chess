name: W2 Repair V1 Bridge Publication Atomicity

on:
  push:
    branches:
      - work/v2-data-upgrade-legacy-runtime-bridge-20260907

permissions:
  contents: write

concurrency:
  group: w2-v1-bridge-atomicity-bootstrap
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v2-data-upgrade-legacy-runtime-bridge-20260907
          fetch-depth: 0
      - name: Apply owner-bounded hard-link rollback repair
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin work/v2-data-upgrade-legacy-runtime-bridge-20260907
          python - <<'PY'
          from pathlib import Path

          product = Path('acs/v1_runtime_bridge.py')
          text = product.read_text(encoding='utf-8')

          helper_anchor = '''def _publish_no_clobber(source: Path, destination: Path, label: str) -> None:\n    if destination.exists() or destination.is_symlink():\n        raise V1RuntimeBridgeError(f"{label} destination already exists")\n    try:\n        os.link(source, destination)\n    except FileExistsError as exc:\n        raise V1RuntimeBridgeError(f"{label} destination was created concurrently") from exc\n    except OSError as exc:\n        raise V1RuntimeBridgeError(\n            f"{label} cannot be published atomically on this filesystem"\n        ) from exc\n    _fsync_dir(destination.parent)\n\n\n'''
          helper_replacement = helper_anchor + '''def _rollback_published_hardlink(source: Path, destination: Path, label: str) -> None:\n    """Remove only the exact hard-link created by this bridge after failed verification."""\n\n    try:\n        if not destination.exists() and not destination.is_symlink():\n            return\n        # Refuse to unlink a pathname that a concurrent actor replaced after our\n        # no-clobber publication.  A bridge rollback owns only its own hard-link.\n        if not os.path.samefile(source, destination):\n            raise V1RuntimeBridgeError(\n                f"{label} publication changed before rollback"\n            )\n        destination.unlink()\n        _fsync_dir(destination.parent)\n    except V1RuntimeBridgeError:\n        raise\n    except OSError as exc:\n        raise V1RuntimeBridgeError(f"{label} publication rollback failed") from exc\n\n\n'''
          if '_rollback_published_hardlink' not in text:
              if helper_anchor not in text:
                  raise SystemExit('publish helper anchor missing')
              text = text.replace(helper_anchor, helper_replacement, 1)

          settings_old = '''                _publish_no_clobber(\n                    settings_candidate, self.layout.settings_path, "Version 2 settings"\n                )\n                if _hash(self.layout.settings_path) != expected:\n                    raise V1RuntimeBridgeError("published V2 settings verification failed")\n'''
          settings_new = '''                _publish_no_clobber(\n                    settings_candidate, self.layout.settings_path, "Version 2 settings"\n                )\n                try:\n                    published_settings_ok = _hash(self.layout.settings_path) == expected\n                except Exception as exc:\n                    _rollback_published_hardlink(\n                        settings_candidate, self.layout.settings_path, "Version 2 settings"\n                    )\n                    raise V1RuntimeBridgeError(\n                        "published V2 settings verification failed"\n                    ) from exc\n                if not published_settings_ok:\n                    _rollback_published_hardlink(\n                        settings_candidate, self.layout.settings_path, "Version 2 settings"\n                    )\n                    raise V1RuntimeBridgeError("published V2 settings verification failed")\n'''
          if settings_old in text:
              text = text.replace(settings_old, settings_new, 1)
          elif 'published_settings_ok' not in text:
              raise SystemExit('settings publication anchor missing')

          library_old = '''                _publish_no_clobber(\n                    library_candidate, self.layout.library_path, "Version 2 library"\n                )\n                if _library_state_sha256(self.layout.library_path) != expected:\n                    raise V1RuntimeBridgeError("published V2 library verification failed")\n'''
          library_new = '''                _publish_no_clobber(\n                    library_candidate, self.layout.library_path, "Version 2 library"\n                )\n                try:\n                    published_library_ok = (\n                        _library_state_sha256(self.layout.library_path) == expected\n                    )\n                except Exception as exc:\n                    _rollback_published_hardlink(\n                        library_candidate, self.layout.library_path, "Version 2 library"\n                    )\n                    raise V1RuntimeBridgeError(\n                        "published V2 library verification failed"\n                    ) from exc\n                if not published_library_ok:\n                    _rollback_published_hardlink(\n                        library_candidate, self.layout.library_path, "Version 2 library"\n                    )\n                    raise V1RuntimeBridgeError("published V2 library verification failed")\n'''
          if library_old in text:
              text = text.replace(library_old, library_new, 1)
          elif 'published_library_ok' not in text:
              raise SystemExit('library publication anchor missing')

          product.write_text(text, encoding='utf-8')
          PY

          python -m compileall -q acs/v1_runtime_bridge.py tests/test_v1_runtime_bridge_publication_atomicity.py
          python -m unittest -v tests.test_v1_runtime_bridge_publication_atomicity tests.test_v1_runtime_bridge tests.test_v1_runtime_bridge_backup_path_security
          git diff --check

          git config user.name "accessible-chess-w2-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/w2-v1-bridge-atomicity-bootstrap.yml
          git add acs/v1_runtime_bridge.py
          if git diff --cached --quiet; then
            echo 'No atomicity repair delta remains.'
            exit 0
          fi
          git commit -m "fix(w2): roll back failed V1 bridge publication"
          git push origin HEAD:work/v2-data-upgrade-legacy-runtime-bridge-20260907
