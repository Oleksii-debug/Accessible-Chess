name: WordDeck V0.1 staging bootstrap

on:
  push:
    branches: [worddeck-v01-user-safe-staging]
    paths:
      - '.github/workflows/worddeck-v01-bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: worddeck-v01-staging-bootstrap
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  patch-build-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worddeck-v01-user-safe-staging
          fetch-depth: 0

      - name: Publish pending staging status
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'WordDeck V0.1 staging gate',
              description: 'Applying and testing consolidated user-safe V0.1 patch.',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Apply exact V0.1 user-safe UI patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python .\WordDeck\tools\apply_v01_user_safe_patch.py
          $userDataPath = (Resolve-Path .\WordDeck\UserData.cs).Path
          $userData = [System.IO.File]::ReadAllText($userDataPath)
          $old = 'else if (i == _index) _index = Math.Min(_index, _entryIds.Count - 1);'
          $new = 'else if (i == _index) _index = i - 1;'
          if (-not $userData.Contains($old)) { throw 'Expected RecallNavigationHistory removal line was not found exactly.' }
          [System.IO.File]::WriteAllText($userDataPath, $userData.Replace($old, $new), [System.Text.UTF8Encoding]::new($false))
          Remove-Item .\WordDeck\tools\apply_v01_user_safe_patch.py -Force
          Remove-Item .\.github\workflows\worddeck-v01-bootstrap.yml -Force
          git diff --check

      - name: Restore build and run complete self-test before push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore .\WordDeck\WordDeck.csproj
          dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Commit validated patch to staging only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .\WordDeck\MainForm.cs .\WordDeck\Program.cs .\WordDeck\SelfTest.cs .\WordDeck\UserData.cs .\WordDeck\tools\apply_v01_user_safe_patch.py .\.github\workflows\worddeck-v01-bootstrap.yml
          git diff --cached --check
          git commit -m 'WordDeck: integrate user-safe first-use Recall UX'
          git push origin HEAD:worddeck-v01-user-safe-staging

      - name: Publish final staging status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: ok ? 'success' : 'failure', context: 'WordDeck V0.1 staging gate',
              description: ok ? 'Consolidated V0.1 patch built and self-tested before branch handoff.' : 'Staging patch/build/self-test failed; inspect exact run.',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
