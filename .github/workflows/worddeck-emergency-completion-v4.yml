name: WordDeck emergency Oxford 5000 completion V4

on:
  push:
    branches:
      - worddeck-bootstrap
    paths:
      - 'WordDeck/tools/complete_oxford5000_emergency_v4.py'
      - '.github/workflows/worddeck-emergency-completion-v4.yml'
  workflow_dispatch:

concurrency:
  group: worddeck-emergency-completion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  complete-tail-v4:
    if: github.ref == 'refs/heads/worddeck-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact corrective branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish V4 pending status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'WordDeck emergency V4 semantic gate',
              description: 'Strict concise lexical Oxford 5000 V4 review is executing.',
              target_url: targetUrl
            });

      - name: Install lexical QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'transformers<5' sentencepiece requests beautifulsoup4 'sentence-transformers<4'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Re-establish exact trusted 982 baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/worddeck-v4 artifacts/emergency-v4
          python WordDeck/tools/fetch_oxford5000_official_html.py --output /tmp/worddeck-v4/official.html
          python WordDeck/tools/validate_oxford5000_runtime_ledger.py \
            --official-html /tmp/worddeck-v4/official.html \
            --ledger /tmp/worddeck-v4/start-runtime.tsv \
            --report /tmp/worddeck-v4/start-accounting.tsv \
            --unaccounted /tmp/worddeck-v4/start-unaccounted.tsv
          test "$(($(wc -l < /tmp/worddeck-v4/start-runtime.tsv) - 1))" -eq 982
          test "$(($(wc -l < /tmp/worddeck-v4/start-unaccounted.tsv) - 1))" -eq 1156
          python WordDeck/tools/validate_oxford3000_baseline_files.py --report /tmp/worddeck-v4/oxford3000-start.tsv
          grep -q $'rows\t3308' /tmp/worddeck-v4/oxford3000-start.tsv
          python WordDeck/tools/complete_oxford5000_emergency_v4.py --self-test

      - name: Re-review full tail and integrate every genuinely safe PASS
        id: lexical
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wait_windows_ci() {
            local sha="$1"
            local run_id=""
            for attempt in $(seq 1 180); do
              payload=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/worddeck-windows.yml/runs?branch=worddeck-bootstrap&event=push&per_page=50")
              run_id=$(printf '%s' "$payload" | jq -r --arg sha "$sha" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -1)
              if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then break; fi
              sleep 5
            done
            test -n "$run_id" && test "$run_id" != "null"
            for attempt in $(seq 1 240); do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/ci-run.json
              status=$(jq -r '.status' /tmp/ci-run.json)
              if [ "$status" = "completed" ]; then
                conclusion=$(jq -r '.conclusion' /tmp/ci-run.json)
                echo "Windows CI exact HEAD $sha: run=$run_id conclusion=$conclusion"
                test "$conclusion" = "success"
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > /tmp/ci-artifacts.json
                cp /tmp/ci-run.json "artifacts/emergency-v4/windows-run-$sha.json"
                cp /tmp/ci-artifacts.json "artifacts/emergency-v4/windows-artifacts-$sha.json"
                echo "$run_id" >> artifacts/emergency-v4/windows-run-ids.txt
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for authoritative Windows CI at $sha" >&2
            return 1
          }

          integrate_round() {
            local round="$1"
            local qadir="$2"
            local unaccounted="$3"
            local txdir="/tmp/worddeck-v4/tx-${round}"
            local blocked_count="$4"

            python WordDeck/tools/orchestrate_oxford5000_bulk_run.py start \
              --worddeck-dir WordDeck \
              --run-dir "$txdir" \
              --official-html /tmp/worddeck-v4/official.html \
              --pre-runtime "/tmp/worddeck-v4/${round}-pre-runtime.tsv" \
              --pre-unaccounted "$unaccounted" \
              --data-factory "$qadir/first-pass.tsv" \
              --content-qa "$qadir/second-pass.tsv" \
              --checkpoint-size 120

            python - "$txdir" "$round" <<'PY'
import json, sys
from pathlib import Path
root=Path(sys.argv[1]); token=sys.argv[2]
op=root/'orchestration.json'; tp=root/'transaction'/'transaction.json'; sp=root/'transaction'/'prepared-slices'
o=json.loads(op.read_text(encoding='utf-8')); t=json.loads(tp.read_text(encoding='utf-8'))
by_index={}
for c in t['checkpoints']:
    old=c['file_name']; new=old.replace('oxford5000_source_after_auto_', f'oxford5000_source_after_manual_v4_{token}_')
    if new==old: raise SystemExit(f'Unexpected prepared filename {old}')
    (sp/old).rename(sp/new); c['file_name']=new; by_index[int(c['index'])]=new
for c in o['checkpoints']: c['file']=by_index[int(c['index'])]
tp.write_text(json.dumps(t,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
op.write_text(json.dumps(o,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
print('V4 checkpoint plan:', [c['rows'] for c in o['checkpoints']])
PY

            local total
            total=$(jq '.checkpoints|length' "$txdir/orchestration.json")
            test "$total" -gt 0
            for index in $(seq 1 "$total"); do
              echo "=== V4 $round checkpoint $index/$total ==="
              python WordDeck/tools/orchestrate_oxford5000_bulk_run.py apply-next \
                --worddeck-dir WordDeck --run-dir "$txdir"
              file=$(jq -r --argjson i "$index" '.checkpoints[]|select(.index==$i)|.file' "$txdir/orchestration.json")
              test -f "WordDeck/QA/$file"
              git add -- WordDeck/ReviewedOxford5000Bootstrap.cs WordDeck/WordDeck.csproj "WordDeck/QA/$file"
              if [ "$index" -eq 1 ]; then
                cp "$qadir/first-pass.tsv" "WordDeck/QA/oxford5000_manual_emergency_v4_${round}_first_pass.tsv"
                cp "$qadir/second-pass.tsv" "WordDeck/QA/oxford5000_manual_emergency_v4_${round}_second_pass.tsv"
                cp "$qadir/holds.tsv" "WordDeck/QA/oxford5000_manual_emergency_v4_${round}_holds.tsv"
                cp "$qadir/summary.json" "WordDeck/QA/oxford5000_manual_emergency_v4_${round}_summary.json"
                git add -- "WordDeck/QA/oxford5000_manual_emergency_v4_${round}_first_pass.tsv" "WordDeck/QA/oxford5000_manual_emergency_v4_${round}_second_pass.tsv" "WordDeck/QA/oxford5000_manual_emergency_v4_${round}_holds.tsv" "WordDeck/QA/oxford5000_manual_emergency_v4_${round}_summary.json"
              fi
              if [ "$blocked_count" -eq 0 ] && [ "$index" -eq "$total" ]; then
                cat > WordDeck/Audio/generation-request.json <<'JSON'
{
  "source": "oxford5000",
  "start": 0,
  "limit": 0,
  "accent": "en-GB",
  "femaleVoice": "bf_emma",
  "maleVoice": "bm_george",
  "speed": 1.0,
  "format": "mp3"
}
JSON
                git add -- WordDeck/Audio/generation-request.json
              fi
              git diff --cached --check
              git commit -m "WordDeck: integrate V4 Oxford 5000 ${round} checkpoint $(printf '%02d' "$index")"
              sha=$(git rev-parse HEAD)
              git push origin HEAD:worddeck-bootstrap
              wait_windows_ci "$sha"
              python WordDeck/tools/orchestrate_oxford5000_bulk_run.py mark-ci-green \
                --worddeck-dir WordDeck --run-dir "$txdir" \
                --run-json /tmp/ci-run.json --artifacts-json /tmp/ci-artifacts.json
            done
            python WordDeck/tools/orchestrate_oxford5000_bulk_run.py finalize --worddeck-dir WordDeck --run-dir "$txdir"
            cp "$txdir/final-summary.json" "artifacts/emergency-v4/${round}-orchestration-final-summary.json"
          }

          total_integrated=0
          last_blocked=1156
          last_pass=0
          for round_number in 1 2; do
            round=$(printf 'round%02d' "$round_number")
            qadir="/tmp/worddeck-v4/$round"
            mkdir -p "$qadir"
            python WordDeck/tools/validate_oxford5000_runtime_ledger.py \
              --official-html /tmp/worddeck-v4/official.html \
              --ledger "/tmp/worddeck-v4/${round}-pre-runtime.tsv" \
              --report "/tmp/worddeck-v4/${round}-pre-accounting.tsv" \
              --unaccounted "/tmp/worddeck-v4/${round}-pre-unaccounted.tsv"
            remaining=$(($(wc -l < "/tmp/worddeck-v4/${round}-pre-unaccounted.tsv") - 1))
            if [ "$remaining" -eq 0 ]; then break; fi
            override_args=()
            if [ -f WordDeck/QA/oxford5000_manual_emergency_overrides_20260820.tsv ]; then override_args=(--overrides WordDeck/QA/oxford5000_manual_emergency_overrides_20260820.tsv); fi
            python WordDeck/tools/complete_oxford5000_emergency_v4.py \
              --unaccounted "/tmp/worddeck-v4/${round}-pre-unaccounted.tsv" \
              --qa-dir "$qadir" \
              --expected-tail "$remaining" \
              --round-id "$round" \
              "${override_args[@]}"
            pass_count=$(jq -r '.pass' "$qadir/summary.json")
            blocked_count=$(jq -r '.blocked' "$qadir/summary.json")
            total=$(jq -r '.total' "$qadir/summary.json")
            test "$total" -eq "$remaining"
            test "$((pass_count + blocked_count))" -eq "$remaining"
            cp "$qadir/summary.json" "artifacts/emergency-v4/${round}-semantic-summary.json"
            cp "$qadir/holds.tsv" "artifacts/emergency-v4/${round}-holds.tsv"
            cp "$qadir/second-pass.tsv" "artifacts/emergency-v4/${round}-second-pass.tsv"
            echo "V4 $round decision: PASS=$pass_count BLOCKED=$blocked_count"
            last_pass="$pass_count"; last_blocked="$blocked_count"
            if [ "$pass_count" -eq 0 ]; then break; fi
            integrate_round "$round" "$qadir" "/tmp/worddeck-v4/${round}-pre-unaccounted.tsv" "$blocked_count"
            total_integrated=$((total_integrated + pass_count))
            python WordDeck/tools/validate_oxford5000_runtime_ledger.py \
              --official-html /tmp/worddeck-v4/official.html \
              --ledger "/tmp/worddeck-v4/${round}-post-runtime.tsv" \
              --report "/tmp/worddeck-v4/${round}-post-accounting.tsv" \
              --unaccounted "/tmp/worddeck-v4/${round}-post-unaccounted.tsv"
            after=$(($(wc -l < "/tmp/worddeck-v4/${round}-post-unaccounted.tsv") - 1))
            test "$((remaining - after))" -eq "$pass_count"
            if [ "$after" -ge "$remaining" ]; then exit 1; fi
            if [ "$after" -eq 0 ]; then break; fi
          done

          python WordDeck/tools/validate_oxford5000_runtime_ledger.py \
            --official-html /tmp/worddeck-v4/official.html \
            --ledger artifacts/emergency-v4/final-runtime.tsv \
            --report artifacts/emergency-v4/final-accounting.tsv \
            --unaccounted artifacts/emergency-v4/final-unaccounted.tsv
          python WordDeck/tools/validate_oxford3000_baseline_files.py --report artifacts/emergency-v4/oxford3000-final.tsv
          grep -q $'rows\t3308' artifacts/emergency-v4/oxford3000-final.tsv
          final_runtime=$(($(wc -l < artifacts/emergency-v4/final-runtime.tsv) - 1))
          final_remaining=$(($(wc -l < artifacts/emergency-v4/final-unaccounted.tsv) - 1))
          test "$((final_runtime + final_remaining))" -eq 2138
          final_sha=$(git rev-parse HEAD)
          echo "FINAL_RUNTIME=$final_runtime" >> "$GITHUB_ENV"
          echo "FINAL_REMAINING=$final_remaining" >> "$GITHUB_ENV"
          echo "FINAL_SHA=$final_sha" >> "$GITHUB_ENV"
          echo "TOTAL_INTEGRATED=$total_integrated" >> "$GITHUB_ENV"
          echo "LAST_PASS=$last_pass" >> "$GITHUB_ENV"
          echo "LAST_BLOCKED=$last_blocked" >> "$GITHUB_ENV"
          printf 'final_runtime\t%s\nfinal_remaining\t%s\ntotal_integrated\t%s\nfinal_sha\t%s\n' "$final_runtime" "$final_remaining" "$total_integrated" "$final_sha" > artifacts/emergency-v4/final-summary.tsv

      - name: Wait for complete British offline audio when lexical tail is zero
        if: env.FINAL_REMAINING == '0'
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 240); do
            payload=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/worddeck-audio.yml/runs?branch=worddeck-bootstrap&event=push&per_page=50")
            run_id=$(printf '%s' "$payload" | jq -r --arg sha "$FINAL_SHA" '.workflow_runs[] | select(.head_sha==$sha) | .id' | head -1)
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then break; fi
            sleep 5
          done
          test -n "$run_id" && test "$run_id" != "null"
          for attempt in $(seq 1 360); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > artifacts/emergency-v4/final-audio-run.json
            status=$(jq -r '.status' artifacts/emergency-v4/final-audio-run.json)
            if [ "$status" = "completed" ]; then
              conclusion=$(jq -r '.conclusion' artifacts/emergency-v4/final-audio-run.json)
              test "$conclusion" = "success"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > artifacts/emergency-v4/final-audio-artifacts.json
              jq -e '.artifacts[] | select(.name=="worddeck-oxford5000-en-gb-0-0" and .expired==false)' artifacts/emergency-v4/final-audio-artifacts.json >/dev/null
              jq -e '.artifacts[] | select(.name=="WordDeck-win-x64-with-oxford5000-audio" and .expired==false)' artifacts/emergency-v4/final-audio-artifacts.json >/dev/null
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Publish final V4 status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const remaining = process.env.FINAL_REMAINING || 'unknown';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const complete = remaining === '0' && '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.FINAL_SHA || context.sha,
              state: complete ? 'success' : 'failure',
              context: 'WordDeck emergency V4 semantic gate',
              description: complete ? 'V4 lexical tail complete; full British offline audio gate passed.' : `V4 fail-closed completion ended with ${remaining} unresolved identities.`,
              target_url: targetUrl
            });

      - name: Upload V4 lexical and CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-oxford5000-emergency-v4-evidence
          path: artifacts/emergency-v4/**
          if-no-files-found: warn
          retention-days: 90
