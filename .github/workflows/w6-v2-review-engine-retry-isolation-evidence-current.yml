name: W6 V2 Review Engine Retry Isolation Evidence Current

on:
  push:
    branches:
      - work/w6-v2-review-engine-retry-isolation-evidence-current-20260907
  pull_request:
    paths:
      - tests/test_w6_v2_review_engine_retry_isolation.py
      - .github/workflows/w6-v2-review-engine-retry-isolation-evidence-current.yml

permissions:
  contents: read

env:
  PRODUCT_SHA: 2c981d33189870e7f1e2bbbf5b1835d0953fd525
  EVIDENCE_PARENT: 215ccc0bf34f1aa8aed7a52ea71467d49ec82200

jobs:
  exact-product-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Verify evidence-only PR scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              'tests/test_w6_v2_review_engine_retry_isolation.py',
              '.github/workflows/w6-v2-review-engine-retry-isolation-evidence-current.yml',
          }
          parent = '215ccc0bf34f1aa8aed7a52ea71467d49ec82200'
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{parent}...HEAD'], text=True
          ).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected evidence scope: {sorted(changed)}')
          print('PRODUCT_MUTATION=NONE')
          print('EVIDENCE_SCOPE_PASS')
          PY
          git diff --check "$EVIDENCE_PARENT"...HEAD

      - name: Preserve oracle outside Product checkout
        shell: bash
        run: |
          set -euo pipefail
          cp tests/test_w6_v2_review_engine_retry_isolation.py "$RUNNER_TEMP/w6_oracle.py"
          python -m py_compile "$RUNNER_TEMP/w6_oracle.py"

      - name: Checkout exact current Product owner SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain)"
          echo "EXACT_PRODUCT_SHA=$PRODUCT_SHA"

      - name: Canonical current owner regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_version2_external_review_live_state_isolation

      - name: Deterministic PGN and Book recovery side-effect oracle
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python "$RUNNER_TEMP/w6_oracle.py"
