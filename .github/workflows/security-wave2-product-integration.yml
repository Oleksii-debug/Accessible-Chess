name: Security Wave 2 Product Integration

on:
  pull_request:
    paths:
      - 'acs/protection_boundary.py'
      - 'acs/protection_online_boundary.py'
      - 'acs/protection_locked_ui.py'
      - 'web/protection_locked.html'
      - 'web/protection_locked.js'
      - 'tests/test_security_wave1_product_integration.py'
      - 'tests/test_security_wave2_product_integration.py'
      - '.github/workflows/security-wave2-product-integration.yml'
      - 'docs/automation/SECURITY_WAVE2_R15_R27_PRODUCT_INTEGRATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave2-product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Exact-head and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check HEAD^

      - name: Install test runner
        run: python -m pip install pytest==8.4.2

      - name: Compile public wave-2 boundary
        run: >-
          python -m py_compile
          acs/protection_boundary.py
          acs/protection_online_boundary.py
          acs/protection_locked_ui.py
          tests/test_security_wave1_product_integration.py
          tests/test_security_wave2_product_integration.py

      - name: Parse locked-shell JavaScript
        run: node --check web/protection_locked.js

      - name: Run wave-1 plus wave-2 regressions
        run: >-
          python -m pytest -q
          tests/test_security_wave1_product_integration.py
          tests/test_security_wave2_product_integration.py
          tests/test_version2_release_app.py

      - name: Prove public boundary has no identity or secret injection surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'BEGIN PRIVATE KEY|client[_-]?secret[[:space:]]*=|refresh[_-]?token[[:space:]]*=|password[[:space:]]*='             acs/protection_boundary.py             acs/protection_online_boundary.py             acs/protection_locked_ui.py             web/protection_locked.html             web/protection_locked.js
