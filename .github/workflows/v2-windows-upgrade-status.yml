name: V2 Windows Upgrade Status

on:
  push:
    branches:
      - work/v2-windows-upgrade-status-adapter-20260831
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/version2_windows_upgrade_status.py'
      - 'acs/version2_upgrade_status_release.py'
      - 'run_accessible_chess_v2.py'
      - 'tests/test_v2_windows_upgrade_status.py'
      - 'tests/test_v2_windows_upgrade_status_shipping.py'
      - '.github/workflows/v2-windows-upgrade-status.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-upgrade-status-${{ github.ref }}
  cancel-in-progress: true

env:
  CURRENT_PRODUCT_BASE: 3f6aedbbf48cdc3e7542452268766430b8c0bbc6
  PROVENANCE_HEAD: f618375ea7784c47070b60edcb0171879ab3f8fb
  SOURCE_ADAPTER_BLOB: 9fb7d1521f3387316e399d63ae81504957710b09
  SOURCE_TEST_BLOB: 3c55d1e85724d0473e8e282d65294ae19040b22c
  SHIPPING_BINDING_BLOB: 6631d8e8a000ed32f60a95f68d9b02cf0422c4df
  SHIPPING_TEST_BLOB: 7cf695af6b7c0975b075d0cee332dbd815af9a6d
  LAUNCHER_BLOB: 4903519834ed266bfb867ba55ccdf67bdf2e10d1
  CURRENT_RELEASE_APP_BLOB: 4462da8db48737b4f66de7e2f4001d601aaec8a6
  CURRENT_EDUCATION_RELEASE_BLOB: 334c8210571be8212638e948032e61d1eee4df4d

jobs:
  upgrade-status:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current-product convergence and owned shipping scope
        shell: bash
        run: |
          set -euo pipefail
          for commit in "$CURRENT_PRODUCT_BASE" "$PROVENANCE_HEAD"; do
            git cat-file -e "${commit}^{commit}" || git fetch --no-tags origin "$commit"
          done
          git merge-base --is-ancestor "$CURRENT_PRODUCT_BASE" HEAD
          git merge-base --is-ancestor "$PROVENANCE_HEAD" HEAD
          test "$(git merge-base "$CURRENT_PRODUCT_BASE" HEAD)" = "$CURRENT_PRODUCT_BASE"
          git diff --check "$CURRENT_PRODUCT_BASE" HEAD
          changed="$(git diff --name-only "$CURRENT_PRODUCT_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-upgrade-status.yml' \
            'acs/version2_upgrade_status_release.py' \
            'acs/version2_windows_upgrade_status.py' \
            'run_accessible_chess_v2.py' \
            'tests/test_v2_windows_upgrade_status.py' \
            'tests/test_v2_windows_upgrade_status_shipping.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/version2_windows_upgrade_status.py)" = "$SOURCE_ADAPTER_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_upgrade_status.py)" = "$SOURCE_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_upgrade_status_release.py)" = "$SHIPPING_BINDING_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_upgrade_status_shipping.py)" = "$SHIPPING_TEST_BLOB"
          test "$(git rev-parse HEAD:run_accessible_chess_v2.py)" = "$LAUNCHER_BLOB"
          test "$(git rev-parse HEAD:acs/version2_release_app.py)" = "$CURRENT_RELEASE_APP_BLOB"
          test "$(git rev-parse HEAD:acs/version2_education_mutation_release.py)" = "$CURRENT_EDUCATION_RELEASE_BLOB"
          test "$(git rev-parse "$CURRENT_PRODUCT_BASE:acs/version2_release_app.py")" = "$CURRENT_RELEASE_APP_BLOB"
          test "$(git rev-parse "$CURRENT_PRODUCT_BASE:acs/version2_education_mutation_release.py")" = "$CURRENT_EDUCATION_RELEASE_BLOB"

      - name: Prove production launcher uses the shipping status binding
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'from acs.version2_upgrade_status_release import (' run_accessible_chess_v2.py
          grep -q 'from acs.version2_upgrade_status_release import main' run_accessible_chess_v2.py
          ! grep -q 'from acs.version2_education_mutation_release import main' run_accessible_chess_v2.py

      - name: Compile upgrade status package and shipping binding
        run: >-
          python -m compileall -q
          acs/version2_windows_upgrade_status.py
          acs/version2_upgrade_status_release.py
          run_accessible_chess_v2.py
          tests/test_v2_windows_upgrade_status.py
          tests/test_v2_windows_upgrade_status_shipping.py

      - name: Focused shipping status and canonical upgrade contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_upgrade_status_shipping
          tests.test_v2_windows_upgrade_status
          tests.test_version2_release_app
          tests.test_v2_upgrade_tracked_writer_conflict
          tests.test_v2_upgrade_current_acsdb_identity_audit
          tests.test_v2_upgrade_v6_successor
          tests.test_version2_upgrade
          tests.test_version2_upgrade_recovery_integrity
          tests.test_version2_upgrade_stale_writer

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_upgrade_status_shipping.py
          tests/test_v2_windows_upgrade_status.py
          tests/test_version2_release_app.py
          tests/test_v2_upgrade_tracked_writer_conflict.py
          tests/test_v2_upgrade_current_acsdb_identity_audit.py
          tests/test_v2_upgrade_v6_successor.py
          tests/test_version2_upgrade.py
          tests/test_version2_upgrade_recovery_integrity.py
          tests/test_version2_upgrade_stale_writer.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and exact production-composition diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess_v2.py --diagnostic
