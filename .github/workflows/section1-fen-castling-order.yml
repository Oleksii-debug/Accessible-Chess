name: Section 1 FEN SAN Castling Contract

on:
  pull_request:
    branches:
      - 'converge/section1-whole-contract-20261007-sol56'
    paths:
      - '.github/workflows/section1-fen-castling-order.yml'
      - 'acs/chesscore.py'
      - 'acs/position_editor.py'
      - 'tests/test_section1_fen_castling_order.py'

permissions:
  contents: read

concurrency:
  group: section1-fen-castling-order-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  EXPECTED_BASE_SHA: 6fae40621aa1b73d812ebbf29041c08dfc26e831
  CHESSCORE_BLOB: 45dff7e39e7696042278bdc69d7b18d43fe52faa
  POSITION_EDITOR_BLOB: e9d9dd50306cb1b5ddb023cd3aac2a45667f860e
  TEST_BLOB: 157f20cf4eedcf03eda3db218b7b7c226b7db416

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact current-parent child geometry
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test "$EVENT_BASE_REF" = "converge/section1-whole-contract-20261007-sol56"
          test "$EVENT_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/section1-fen-castling-order.yml' \
            'acs/chesscore.py' \
            'acs/position_editor.py' \
            'tests/test_section1_fen_castling_order.py' | sort)"
          test "$changed" = "$expected"

      - name: Bind exact FEN authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:acs/chesscore.py)" = "$CHESSCORE_BLOB"
          test "$(git rev-parse HEAD:acs/position_editor.py)" = "$POSITION_EDITOR_BLOB"
          test "$(git rev-parse HEAD:tests/test_section1_fen_castling_order.py)" = "$TEST_BLOB"

      - name: Compile focused contract
        run: >-
          python -m py_compile
          acs/chesscore.py
          acs/position_editor.py
          tests/test_section1_fen_castling_order.py

      - name: Execute FEN SAN castling and adjacent regressions
        run: >-
          python -m unittest -v
          tests.test_section1_fen_castling_order
          tests.test_section1_san_transition_contract
          tests.test_notation
          tests.test_fen_edge_corpus
          tests.test_dev2_fen_atomicity
          tests.test_position_editor
          tests.test_position_editor_passive_boundary

      - name: Core chess selftest
        run: python -m acs.selftest
