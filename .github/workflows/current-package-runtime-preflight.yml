name: Current Package Runtime Preflight

on:
  push:
    branches:
      - fix/current-package-runtime-preflight-20261005-k7m4
  pull_request:
    branches:
      - converge/current-product-books-provider-20261005-ooxple7
    paths:
      - '.github/workflows/current-package-runtime-preflight.yml'
      - 'acs/version2_package_preflight.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/test_v2_package_required_resources.py'
      - 'tests/test_version2_package_assembler.py'
      - 'tests/test_version2_release_payload.py'

permissions:
  contents: read

concurrency:
  group: current-package-runtime-preflight-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact Product successor and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PRODUCT_REF: converge/current-product-books-provider-20261005-ooxple7
          PINNED_PRODUCT_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ -n "${EVENT_BASE_REF:-}" ]; then
            test "$EVENT_BASE_REF" = "$PRODUCT_REF"
          fi
          git fetch --no-tags origin "+refs/heads/$PRODUCT_REF:refs/remotes/origin/$PRODUCT_REF"
          live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_REF")"
          test "$live_product" = "$PINNED_PRODUCT_SHA" || {
            echo "PACKAGE_RUNTIME_PREFLIGHT_PRODUCT_MOVED pinned=$PINNED_PRODUCT_SHA live=$live_product" >&2
            exit 1
          }
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_product"
          fi
          git merge-base --is-ancestor "$live_product" HEAD
          test "$(git merge-base "$live_product" HEAD)" = "$live_product"
          git diff --check "$live_product"...HEAD

          changed="$(git diff --name-only "$live_product"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-package-runtime-preflight.yml' \
            'acs/version2_package_preflight.py' \
            'tests/test_v2_package_required_resources.py' \
            'tests/test_version2_package_assembler.py' \
            'tests/test_version2_package_preflight.py' \
            'tests/test_version2_release_payload.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected package runtime preflight scope:\n%s\n' "$changed" >&2
            exit 1
          }
          echo "PACKAGE_RUNTIME_PREFLIGHT_PRODUCT=$live_product"
          echo "PACKAGE_RUNTIME_PREFLIGHT_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile package runtime boundary
        run: >-
          python -m compileall -q
          acs/version2_package_preflight.py
          tests/test_version2_package_preflight.py
          tests/test_v2_package_required_resources.py
          tests/test_version2_package_assembler.py
          tests/test_version2_release_payload.py

      - name: Execute package runtime and retained package regressions
        run: >-
          python -m unittest -v
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening
          tests.test_v2_package_required_resources
          tests.test_version2_package_assembler
          tests.test_version2_release_payload

      - name: Core selftest
        run: python -m acs.selftest
