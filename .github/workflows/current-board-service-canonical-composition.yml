name: Current Board Service Canonical Composition

on:
  pull_request:
    branches:
      - converge/current-history-engine-training-20261004-zftrkmo
    paths:
      - 'acs/board_service.py'
      - 'tests/test_board_service.py'
      - 'tests/test_board_service_passive_boundary.py'
      - '.github/workflows/current-board-service-canonical-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-board-service-canonical-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/current-history-engine-training-20261004-zftrkmo}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-board-service-canonical-composition.yml' \
            'acs/board_service.py' \
            'tests/test_board_service.py' \
            'tests/test_board_service_passive_boundary.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Board-service composition scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Board service boundary
        run: >-
          python -m compileall -q
          acs/board_service.py
          tests/test_board_service.py
          tests/test_board_service_passive_boundary.py

      - name: Execute Board/NVDA and retained integration regressions
        run: >-
          python -m unittest -v
          tests.test_board_service
          tests.test_board_service_passive_boundary
          tests.test_ui_review_adapter
          tests.test_stage1_move_history_atomicity_current
          tests.test_stage1_review_navigation_atomicity_current
          tests.test_v2_windows_book_board_adapter
          tests.test_history_tree_passive_boundary

      - name: Core selftest
        run: python -m acs.selftest
