name: Current Apex Windows Nullmove Import Convergence

on:
  pull_request:
    branches:
      - converge/full-product-final-20261004
    paths:
      - 'acs/chessbase_decoder.py'
      - 'acs/chesscore.py'
      - 'acs/webapp_keymap.py'
      - 'acs/version2_application.py'
      - 'acs/version2_windows_file_workflows.py'
      - 'tests/test_current_canonical_nullmove_convergence.py'
      - 'tests/test_v2_windows_nvda_file_workflows.py'
      - 'tests/test_version2_application.py'
      - 'tests/test_version2_import_terminal_ui.py'
      - '.github/workflows/version2-windows-composition.yml'
      - '.github/workflows/current-apex-windows-nullmove-import-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-apex-windows-nullmove-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TARGET_BASE_REF: converge/full-product-final-20261004
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove live apex ancestry and bounded convergence scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          base_ref="$TARGET_BASE_REF"
          git fetch --no-tags origin "$base_ref"
          live_base="$(git rev-parse "origin/$base_ref")"
          git cat-file -e "$live_base^{commit}"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test -n "$PR_BASE_REF"
            test "$PR_BASE_REF" = "$TARGET_BASE_REF"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$live_base"
          fi

          git diff --check "$live_base" HEAD
          changed="$(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)"
          wanted="$(printf '%s\n' '.github/workflows/current-apex-windows-nullmove-import-convergence.yml' '.github/workflows/version2-windows-composition.yml' 'acs/chessbase_decoder.py' 'acs/chesscore.py' 'acs/version2_application.py' 'acs/version2_windows_file_workflows.py' 'acs/webapp_keymap.py' 'tests/test_current_canonical_nullmove_convergence.py' 'tests/test_v2_windows_nvda_file_workflows.py' 'tests/test_version2_application.py' 'tests/test_version2_import_terminal_ui.py' | LC_ALL=C sort)"
          test "$changed" = "$wanted"

      - name: Compile converged production and regression seams
        run: >-
          python -m compileall -q
          acs/chessbase_decoder.py
          acs/chesscore.py
          acs/webapp_keymap.py
          acs/version2_application.py
          acs/version2_windows_file_workflows.py
          tests/test_current_canonical_nullmove_convergence.py
          tests/test_v2_windows_nvda_file_workflows.py
          tests/test_version2_application.py
          tests/test_version2_import_terminal_ui.py

      - name: Canonical null move and adjacent format regressions
        run: >-
          python -m unittest -v
          tests.test_current_canonical_nullmove_convergence
          tests.test_chessbase_decoder
          tests.test_chessbase_adapter
          tests.test_gametree

      - name: Windows file atomicity and terminal import regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_nvda_file_workflows
          tests.test_version2_application
          tests.test_version2_import_terminal_ui
          tests.test_version2_windows_composition_workflow
          tests.test_v2_windows_book_board_adapter
          tests.test_v2_book_board_workflow

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Install native Windows oracle dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -q pywebview==6.2.1 zstandard==0.23.0

      - name: Native Windows UI-thread runtime oracle
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python -m scripts.v2_native_thread_oracle

      - name: SELFTEST and launcher diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
