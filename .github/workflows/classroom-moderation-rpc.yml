name: Classroom Moderation RPC

on:
  push:
    branches:
      - feature/classroom-moderation-rpc-core-20261002
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/classroom_moderation_rpc.py'
      - 'tests/test_classroom_moderation_rpc.py'
      - '.github/workflows/classroom-moderation-rpc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-moderation-rpc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove bounded moderation service scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$PR_BASE_REF" = "work/full-product-teacher-education-reachability-20260911"
          test -n "$PR_BASE_SHA"
          base="$PR_BASE_SHA"
          git cat-file -e "$base^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-moderation-rpc.yml'
            'acs/classroom_moderation_rpc.py'
            'tests/test_classroom_moderation_rpc.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected classroom moderation RPC scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          git diff --check "$base...HEAD"
          git diff --quiet "$base...HEAD" -- \
            acs/chesscore.py \
            acs/classroom_domain.py \
            acs/classroom_realtime_media.py \
            acs/remote_session.py \
            acs/teaching_classroom_adapter.py \
            web/livekit_classroom_media.js \
            web/version2_final_product_bootstrap.js
          echo "CLASSROOM_MODERATION_RPC_BASE=$base"
          echo 'CLASSROOM_MODERATION_RPC_BOUNDED_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile moderation RPC core
        run: python -m compileall -q acs/classroom_moderation_rpc.py tests/test_classroom_moderation_rpc.py

      - name: Run canonical media and moderation RPC contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_realtime_media
          tests.test_classroom_moderation_rpc

      - name: Re-run LiveKit client wire contract
        run: node tests/js/livekit_classroom_media_adapter_test.js
