name: D08 Owner Fixture Integration CI

on:
  pull_request:
    paths:
      - 'tests/test_dev1_full_product_ui_packages.py'
      - 'tests/test_dev3_student_progress.py'
      - '.github/workflows/d08-owner-fixture-integration.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      EXPECTED_PARENT: 67618387e8bb8055037cf17aca3923d484368cb0
      FULL_PRODUCT_BASE: dd9ebf9414103c805892856fe6a04706fa69039f
      D01_FIXTURE_HEAD: a2b732d81b92c487b0da4edb235c3329ef572862
      D03_FIXTURE_HEAD: bab3652e6a6d018d7f806ed8c0496acdaa860a82
      D01_FIXTURE_BLOB: 7aecdec41e84ec867532c31587293c266d2696ae
      D03_FIXTURE_BLOB: 41efaa9a52a871aad405238a327fdda86b70d67a
      TRAINING_BLOB: 28dcb58b11cd1e8dcd3904eee1ebc81d40d0ffcb
      BOOK_TRAINING_BLOB: b8eab7a982a2eef2e22ba89c4fea5dfb3e2dca5f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact Git bytes
        shell: bash
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Prove exact ancestry, integration scope, and Product lock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT" HEAD
          changed="$(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' +            '.github/workflows/d08-owner-fixture-integration.yml' +            'tests/test_dev1_full_product_ui_packages.py' +            'tests/test_dev3_student_progress.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$EXPECTED_PARENT" HEAD -- acs
          test "$(git rev-parse HEAD:acs/training.py)" = "$TRAINING_BLOB"
          test "$(git rev-parse HEAD:acs/book_training.py)" = "$BOOK_TRAINING_BLOB"
      - name: Prove exact owner-maintained fixture provenance
        shell: bash
        run: |
          set -euo pipefail
          d01="$(git diff --name-only "$FULL_PRODUCT_BASE" "$D01_FIXTURE_HEAD" | sort)"
          expected_d01="$(printf '%s\n' +            '.github/workflows/d01-training-fixture-compat.yml' +            'tests/test_dev1_full_product_ui_packages.py' | sort)"
          test "$d01" = "$expected_d01"

          d03="$(git diff --name-only "$FULL_PRODUCT_BASE" "$D03_FIXTURE_HEAD" | sort)"
          expected_d03="$(printf '%s\n' +            '.github/workflows/d03-training-fixture-compat.yml' +            'tests/test_dev3_student_progress.py' | sort)"
          test "$d03" = "$expected_d03"

          test "$(git rev-parse HEAD:tests/test_dev1_full_product_ui_packages.py)" = "$D01_FIXTURE_BLOB"
          test "$(git rev-parse "$D01_FIXTURE_HEAD:tests/test_dev1_full_product_ui_packages.py")" = "$D01_FIXTURE_BLOB"
          test "$(git rev-parse HEAD:tests/test_dev3_student_progress.py)" = "$D03_FIXTURE_BLOB"
          test "$(git rev-parse "$D03_FIXTURE_HEAD:tests/test_dev3_student_progress.py")" = "$D03_FIXTURE_BLOB"
      - name: Compile composed Training tree
        run: >-
          python -m compileall -q
          acs/training.py
          acs/book_training.py
          tests/test_d08_book_training_contract.py
          tests/test_training.py
          tests/test_d08_training_canonical_resume.py
          tests/test_dev1_full_product_ui_packages.py
          tests/test_dev3_student_progress.py
      - name: Focused D08 and owner compatibility regressions
        run: >-
          python -m unittest -v
          tests.test_d08_book_training_contract
          tests.test_training
          tests.test_d08_training_canonical_resume
          tests.test_dev1_full_product_ui_packages.TrainingPresenterTests
          tests.test_dev3_student_progress
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
