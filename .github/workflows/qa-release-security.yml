name: QA Release Security Gate

on:
  push:
    branches:
      - dev/qa-release-security
    paths:
      - 'acs/security_contracts.py'
      - 'acs/security_redaction.py'
      - 'acs/release_manifest.py'
      - 'acs/release_archive.py'
      - 'acs/logging_setup.py'
      - 'tests/test_security_contracts.py'
      - 'tests/test_security_redaction.py'
      - 'tests/test_release_manifest.py'
      - 'tests/test_release_archive.py'
      - 'tests/test_logging_redaction.py'
      - 'tests/test_architecture.py'
      - 'tests/test_nuitka_release_workflow.py'
      - '.github/workflows/windows-nuitka-standalone.yml'
      - '.github/workflows/qa-release-security.yml'
  pull_request:
    paths:
      - 'acs/security_contracts.py'
      - 'acs/security_redaction.py'
      - 'acs/release_manifest.py'
      - 'acs/release_archive.py'
      - 'acs/logging_setup.py'
      - 'tests/test_security_contracts.py'
      - 'tests/test_security_redaction.py'
      - 'tests/test_release_manifest.py'
      - 'tests/test_release_archive.py'
      - 'tests/test_logging_redaction.py'
      - 'tests/test_architecture.py'
      - 'tests/test_nuitka_release_workflow.py'
      - '.github/workflows/windows-nuitka-standalone.yml'
      - '.github/workflows/qa-release-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contracts:
    name: Security, release integrity, redaction, architecture, and packaging boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile QA and security modules
        run: python -m py_compile acs/security_contracts.py acs/security_redaction.py acs/release_manifest.py acs/release_archive.py acs/logging_setup.py tests/test_security_contracts.py tests/test_security_redaction.py tests/test_release_manifest.py tests/test_release_archive.py tests/test_logging_redaction.py tests/test_architecture.py tests/test_nuitka_release_workflow.py

      - name: Run entitlement contract tests
        run: python -m unittest -v tests.test_security_contracts

      - name: Run release manifest and packaged-distribution tests
        run: python -m unittest -v tests.test_release_manifest

      - name: Run final release archive integrity tests
        run: python -m unittest -v tests.test_release_archive

      - name: Run standalone-first Nuitka workflow contract tests
        run: python -m unittest -v tests.test_nuitka_release_workflow

      - name: Run diagnostic redaction tests
        run: python -m unittest -v tests.test_security_redaction

      - name: Run persisted logging and crash redaction tests
        run: python -m unittest -v tests.test_logging_redaction

      - name: Run architecture boundary tests
        run: python -m unittest -v tests.test_architecture
