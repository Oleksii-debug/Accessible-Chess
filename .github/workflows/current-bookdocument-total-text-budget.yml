name: Current BookDocument Total Text Budget

on:
  pull_request:
    branches:
      - converge/current-product-pgn-graph-safety-20261004-sol60a1
    paths:
      - 'acs/bookdocument.py'
      - 'tests/test_bookdocument_total_text_budget_current.py'
      - '.github/workflows/current-bookdocument-total-text-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-bookdocument-total-text-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            base_ref="converge/current-product-pgn-graph-safety-20261004-sol60a1"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-bookdocument-total-text-budget.yml' \
            'acs/bookdocument.py' \
            'tests/test_bookdocument_total_text_budget_current.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected BookDocument-total-budget scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile canonical Book resource surfaces
        run: >-
          python -m compileall -q
          acs/bookdocument.py
          tests/test_bookdocument_total_text_budget_current.py

      - name: Execute total-budget and retained Book regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument_total_text_budget_current
          tests.test_bookdocument_scalar_bounds_current
          tests.test_bookdocument_deserialize_bounds_current
          tests.test_bookdocument
          tests.test_book_document_ingress_passive_current
          tests.test_book_index
          tests.test_bookreader
          tests.test_book_training_passive_roots_current
          tests.test_dev1_books_training_webview_projection
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import
          tests.test_v2_book_board_workflow
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
