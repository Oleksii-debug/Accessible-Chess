name: Full Product Education Class Create

on:
  pull_request:
    paths:
      - 'acs/education_class_management.py'
      - 'acs/version2_education_mutation_application.py'
      - 'acs/version2_education_mutation_release.py'
      - 'acs/version2_upgrade_status_release.py'
      - 'acs/version2_final_product_profile.py'
      - 'run_accessible_chess_v2.py'
      - 'tests/test_version2_education_class_create.py'
      - 'tests/test_version2_education_open_selected.py'
      - 'tests/js/education_surface_dom_test.js'
      - 'web/full_product_education.js'
      - '.github/workflows/d01-education-management-webview.yml'
      - '.github/workflows/full-product-education-class-create.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-product-education-class-create-${{ github.ref }}
  cancel-in-progress: true

env:
  INTEGRATED_EDUCATION_OWNER: 7580f614a2d422a4af8120a4ee33264d78cf1502
  MUTATION_APP_BLOB: f9429f3c9e9a6fdc32708716cacfa669c7cb4184
  FINAL_PROFILE_BLOB: 7f5a2a6b2be9ed68c41a6e6dae7ad4ceb6330f87
  OPEN_SELECTED_TEST_BLOB: 23a426d61a9b466b9bdb33d5158bcd9cf78ae37f
  CURRENT_SHARED_EDUCATION_TEST_BLOB: 92ef5d96eda599bdb4db66e8ebe263a693532227
  CURRENT_EDUCATION_RELEASE_BLOB: 334c8210571be8212638e948032e61d1eee4df4d
  BASE_LAUNCHER_BLOB: 125f378e87acbca993acf54bd4012e93539384d3
  UPGRADE_STATUS_LAUNCHER_BLOB: 4903519834ed266bfb867ba55ccdf67bdf2e10d1
  UPGRADE_STATUS_RELEASE_BLOB: 6631d8e8a000ed32f60a95f68d9b02cf0422c4df
  DOM_TEST_BLOB: 6a2de84769c7d47b50008ff78dfbc8644c6e8481
  WEB_SURFACE_BLOB: 58c857cd498de72eb49dac9923cf66eea6732efb

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained Education class-create authority on current Product
        shell: bash
        run: |
          set -euo pipefail
          product_base="$(git rev-parse HEAD^1)"

          git cat-file -e "${product_base}^{commit}"
          test "$(git merge-base HEAD "$product_base")" = "$product_base"
          git merge-base --is-ancestor "$INTEGRATED_EDUCATION_OWNER" "$product_base"
          git merge-base --is-ancestor "$INTEGRATED_EDUCATION_OWNER" HEAD
          git diff --check "$product_base" HEAD

          education_owner="3df622f6d667b3513222003df159e52188e60bda"
          git cat-file -e "${education_owner}^{commit}"
          git merge-base --is-ancestor "$education_owner" HEAD
          test "$(git rev-parse HEAD:acs/education_class_management.py)" = "7b5e8c309ac453cb904552b23af658357db377db"
          test "$(git rev-parse HEAD:acs/version2_education_mutation_release.py)" = "$CURRENT_EDUCATION_RELEASE_BLOB"

          launcher_blob="$(git rev-parse HEAD:run_accessible_chess_v2.py)"
          case "$launcher_blob" in
            "$BASE_LAUNCHER_BLOB")
              grep -q 'from acs.version2_education_mutation_release import (' run_accessible_chess_v2.py
              grep -q 'from acs.version2_education_mutation_release import main' run_accessible_chess_v2.py
              ;;
            "$UPGRADE_STATUS_LAUNCHER_BLOB")
              test "$(git rev-parse HEAD:acs/version2_upgrade_status_release.py)" = "$UPGRADE_STATUS_RELEASE_BLOB"
              grep -q 'from acs.version2_upgrade_status_release import (' run_accessible_chess_v2.py
              grep -q 'from acs.version2_upgrade_status_release import main' run_accessible_chess_v2.py
              grep -q 'version2_education_mutation_release as _education_release' acs/version2_upgrade_status_release.py
              grep -q '_education_release.create_version2_release_application' acs/version2_upgrade_status_release.py
              ;;
            *)
              printf 'Unqualified V2 launcher blob: %s\n' "$launcher_blob" >&2
              exit 1
              ;;
          esac

          test "$(git rev-parse HEAD:tests/test_version2_education_class_create.py)" = "$CURRENT_SHARED_EDUCATION_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/version2_education_mutation_application.py)" = "$MUTATION_APP_BLOB"
          test "$(git rev-parse HEAD:acs/version2_final_product_profile.py)" = "$FINAL_PROFILE_BLOB"
          test "$(git rev-parse HEAD:tests/test_version2_education_open_selected.py)" = "$OPEN_SELECTED_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/js/education_surface_dom_test.js)" = "$DOM_TEST_BLOB"
          test "$(git rev-parse HEAD:web/full_product_education.js)" = "$WEB_SURFACE_BLOB"

      - name: Compile Education composition
        run: >-
          python -m py_compile
          acs/education_class_management.py
          acs/version2_education_mutation_application.py
          acs/version2_education_mutation_release.py
          acs/version2_final_product_profile.py
          run_accessible_chess_v2.py
          tests/test_version2_education_class_create.py
          tests/test_version2_education_open_selected.py

      - name: Browser open-selected DOM contract
        run: |
          node --check web/full_product_education.js
          node tests/js/education_surface_dom_test.js

      - name: Focused Education mutation, open-selected, and persistence regression
        run: >-
          python -m pytest -q
          tests/test_version2_education_class_create.py
          tests/test_version2_education_open_selected.py
          tests/test_education_workspace.py
          tests/test_education_webview_projection.py
          tests/test_education_webview_bridge.py
          tests/test_version2_final_product_composition.py

      - name: Final-product production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Broad unittest regression on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'
