name: V2 Audit-B D06 Snapshot Owner Replay

on:
  pull_request:
    paths:
      - 'tests/test_v2_audit_b_d06_snapshot_owner_replay.py'
      - '.github/workflows/v2-audit-b-d06-snapshot-owner-replay.yml'
      - 'acs/gametree_snapshot.py'

permissions:
  contents: read

concurrency:
  group: v2-audit-b-d06-snapshot-owner-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove exact owner and audit-only scope
        shell: bash
        run: |
          set -euo pipefail
          owner=a3e52c621210c2dd5251dea4f97b611c12d56a22
          test "$(git merge-base "$owner" HEAD)" = "$owner"
          git diff --check "$owner" HEAD
          changed="$(git diff --name-only "$owner" HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/v2-audit-b-d06-snapshot-owner-replay.yml' 'tests/test_v2_audit_b_d06_snapshot_owner_replay.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/gametree_snapshot.py)" = ac08a89055372c02d3d15744fd4de5a1fd0059d5
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = 96d62bf6dd7b2f5c8a75d5f2bd1fde2ad0823d20
          test "$(git rev-parse 5d5c0a28288fb05356a39d293ca375fe7d8ec14a:scripts/d06_pgn_ingress_consumer_oracle.py)" = 1972272ddfd84e9827c15f8b675cdc8a2870c697
      - name: Compile audit surface
        run: python -m py_compile tests/test_v2_audit_b_d06_snapshot_owner_replay.py
      - name: Focused owner and canonical D06 regressions
        run: >-
          python -m unittest -v
          tests.test_v2_audit_b_d06_snapshot_owner_replay
          tests.test_d06_snapshot_canonical_restore
          tests.test_d06_pgn_roundtrip
          tests.test_d06_file_ingress_nag_normalization
          tests.test_d06_gametree_persistence_vertical
          tests.test_game_identity
          tests.test_gametree
          tests.test_version2_formats_integration
      - name: Full repository unittest
        run: python -m unittest discover -s tests
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
