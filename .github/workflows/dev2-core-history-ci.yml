name: DEV2 Core History Position CI

on:
  push:
    branches:
      - manual5/dev2-core-history-position-20260821
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV2_BASE: 498989b4fda33e6529e29c9704fb4c724d0d3455

jobs:
  dev2-core-history-position:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install -q pytest

      - name: Prove DEV2 ancestry scope and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$DEV2_BASE" HEAD)" = "$DEV2_BASE"
          git diff --check "$DEV2_BASE" HEAD
          changed="$(git diff --name-only "$DEV2_BASE" HEAD)"
          printf '%s\n' "$changed"
          offenders="$(printf '%s\n' "$changed" | grep -Ev '^(\.github/workflows/dev2-core-history-ci\.yml|acs/(board_service|chesscore|position_editor)\.py|tests/(test_board_service|test_position_editor|test_dev2_board_query_invariants|test_dev2_fen_atomicity)\.py)$' || true)"
          if [ -n "$offenders" ]; then
            echo 'DEV2 lane scope contamination detected:' >&2
            printf '%s\n' "$offenders" >&2
            exit 1
          fi

      - name: Compile Product and tests
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused DEV2 core history position stress
        run: >-
          python -m unittest -v
          tests.test_squares
          tests.test_board_service
          tests.test_dev2_board_query_invariants
          tests.test_dev2_fen_atomicity
          tests.test_position_editor
          tests.test_core_release_contracts
          tests.test_history
          tests.test_history_review_ui
          tests.test_stage1_saturation_history_stress
          tests.test_stage1_core_full_flow

      - name: Full repository unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest without weakening
        run: python -m pytest -q

      - name: Complete Stage1 diagnostic
        run: python run_accessible_chess.py --diagnostic
