name: Classroom Moderation SQLite Ledger

on:
  pull_request:
    branches:
      - feature/classroom-moderation-rpc-core-20261002
    paths:
      - 'acs/sqlite_classroom_moderation_ledger.py'
      - 'tests/test_sqlite_classroom_moderation_ledger.py'
      - '.github/workflows/classroom-moderation-sqlite-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-moderation-sqlite-ledger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-ledger:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove retained ledger authority on QA composition
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LEDGER_OWNER_SHA: 86b3e5f18d2c153beef7eabd5d89c99a1278ffcc
          LEDGER_BLOB: 786862744f2c81e4cf9949d895858623d9fc7d44
          LEDGER_TEST_BLOB: 82a9b93c9a3bd09d5a27252a728a744325a16a96
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-moderation-rpc-core-20261002"
          test "$HEAD_REF" = "qa/classroom-moderation-server-composition-20261002"
          git cat-file -e "$LEDGER_OWNER_SHA^{commit}" || git fetch --no-tags origin "$LEDGER_OWNER_SHA"
          git merge-base --is-ancestor "$LEDGER_OWNER_SHA" HEAD
          test "$(git rev-parse HEAD:acs/sqlite_classroom_moderation_ledger.py)" = "$LEDGER_BLOB"
          test "$(git rev-parse HEAD:tests/test_sqlite_classroom_moderation_ledger.py)" = "$LEDGER_TEST_BLOB"
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
      - name: Compile durable moderation ledger
        run: >-
          python -m py_compile
          acs/sqlite_classroom_moderation_ledger.py
          tests/test_sqlite_classroom_moderation_ledger.py

      - name: Run durable ledger and canonical moderation contracts
        run: >-
          python -m unittest -v
          tests.test_sqlite_classroom_moderation_ledger
          tests.test_classroom_moderation_rpc
          tests.test_classroom_realtime_media

      - name: Prove storage authority is atomic and server-local
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'BEGIN IMMEDIATE' acs/sqlite_classroom_moderation_ledger.py
          grep -Fq 'INSERT OR IGNORE' acs/sqlite_classroom_moderation_ledger.py
          grep -Fq 'PRIMARY KEY (room_id, operation_id)' acs/sqlite_classroom_moderation_ledger.py
          grep -Fq 'PRAGMA journal_mode=WAL' acs/sqlite_classroom_moderation_ledger.py
          grep -Fq 'PRAGMA synchronous=FULL' acs/sqlite_classroom_moderation_ledger.py
          ! grep -Eq 'requests|aiohttp|http://|https://' acs/sqlite_classroom_moderation_ledger.py

      - name: Core selftest
        run: python -m acs.selftest
