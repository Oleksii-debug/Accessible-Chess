name: V2 2CBH Backend Contract

on:
  push:
    branches:
      - work/v2-2cbh-backend-contract-20260831
  pull_request:
    branches:
      - work/v2-2cbh-real-backend-corpus-unblock-20260828
    paths:
      - acs/chessbase_2cbh_backend.py
      - docs/automation/V2_2CBH_BACKEND_CONTRACT_20260831.json
      - docs/automation/V2_2CBH_BACKEND_CONTRACT_20260831.md
      - tests/test_v2_2cbh_backend_contract.py
      - tests/test_v2_2cbh_backend_evidence.py
      - .github/workflows/v2-2cbh-backend-contract.yml

permissions:
  contents: read

env:
  V2_2CBH_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || '5ebdf9f9b6051fd25178b58aec29d0459f454daa' }}

jobs:
  backend-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Exact ownership, ancestry, text-only and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V2_2CBH_CONTRACT_BASE" HEAD
          git diff --check "$V2_2CBH_CONTRACT_BASE" HEAD
          unexpected="$(git diff --name-only "$V2_2CBH_CONTRACT_BASE" HEAD | grep -Ev '^(acs/chessbase_2cbh_backend\.py|docs/automation/V2_2CBH_BACKEND_CONTRACT_20260831\.json|docs/automation/V2_2CBH_BACKEND_CONTRACT_20260831\.md|tests/test_v2_2cbh_backend_contract\.py|tests/test_v2_2cbh_backend_evidence\.py|\.github/workflows/v2-2cbh-backend-contract\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected files outside One-Time Developer 13 ownership scope:\n%s\n' "$unexpected"
            exit 1
          fi
          binary="$(git diff --numstat "$V2_2CBH_CONTRACT_BASE" HEAD | awk '$1 == "-" || $2 == "-" {print $3}')"
          if [[ -n "$binary" ]]; then
            printf 'Binary/backend payload is forbidden in this Product contract PR:\n%s\n' "$binary"
            exit 1
          fi
          python -m compileall -q acs tests run_accessible_chess.py
      - name: No guessed 2CBH companion map in Product module
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq '\.(2cba|2cbg|2lcd|2lgd|2lid)([^[:alnum:]_]|$)' acs/chessbase_2cbh_backend.py; then
            echo 'Unqualified 2CBH companion suffix was hard-coded into Product backend contract.'
            exit 1
          fi
          grep -q 'PRIMARY_EXTENSION = ".2cbh"' acs/chessbase_2cbh_backend.py
      - name: Focused fail-closed backend and inherited 2CBH contracts
        run: >-
          python -m unittest -v
          tests.test_v2_2cbh_backend_contract
          tests.test_v2_2cbh_backend_evidence
          tests.test_v2_2cbh_real_backend_corpus_unblock
          tests.test_v2_2cbh_cbone_topology
          tests.test_chessbase_adapter
          tests.test_chessbase_integrity
      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_2cbh_backend_contract.py
          tests/test_v2_2cbh_backend_evidence.py
          tests/test_v2_2cbh_real_backend_corpus_unblock.py
          tests/test_v2_2cbh_cbone_topology.py
          tests/test_chessbase_adapter.py
          tests/test_chessbase_integrity.py

  pinned-open-source-probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Recheck pinned open-source candidates for a 2CBH surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir upstream && cd upstream
          git clone -q https://github.com/rolandlo/libcbh.git libcbh
          git -C libcbh checkout -q 9641c5c3949d8fb210b17dd9aa54455645843696
          git clone -q https://github.com/foolnotion/scidb.git scidb
          git -C scidb checkout -q 7c1c9d89f2fabab0c1252cdd14c515fb9bfc1415
          git clone -q https://github.com/Isarhamster/chessx.git chessx
          git -C chessx checkout -q e734a075346ca2ad7e3f3e35b42140169637c5ca

          : > ../upstream-probe.txt
          for repo in libcbh scidb chessx; do
            printf '=== %s ===\n' "$repo" >> ../upstream-probe.txt
            git -C "$repo" rev-parse HEAD >> ../upstream-probe.txt
            find "$repo" -type f \( \
              -iname '*.2cbh' -o -iname '*.2cba' -o -iname '*.2cbg' -o \
              -iname '*.2lcd' -o -iname '*.2lgd' -o -iname '*.2lid' \
            \) -print > ../fixture-hits.txt
            if [[ -s ../fixture-hits.txt ]]; then
              cat ../fixture-hits.txt | tee -a ../upstream-probe.txt
              echo "Pinned candidate unexpectedly contains a 2CBH-family fixture surface."
              exit 1
            fi
            if git -C "$repo" grep -ni -E '\.(2cbh|2cba|2cbg|2lcd|2lgd|2lid)([^[:alnum:]_]|$)' -- \
              '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.py' '*.tcl' \
              '*.md' '*.txt' '*.pro' '*.cmake' 'CMakeLists.txt' > ../hits.txt; then
              cat ../hits.txt | tee -a ../upstream-probe.txt
              echo "Pinned candidate unexpectedly contains a 2CBH-family source/text surface."
              exit 1
            fi
            echo 'no 2CBH extension or fixture surface in selected exact-tree source/text files' >> ../upstream-probe.txt
          done
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-2cbh-backend-contract-upstream-probe
          path: upstream-probe.txt
          if-no-files-found: warn
          retention-days: 3

  full-regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Exact ancestry and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$V2_2CBH_CONTRACT_BASE" HEAD
          git diff --check "$V2_2CBH_CONTRACT_BASE" HEAD
      - name: Full unittest
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: Full pytest
        run: python -m pytest -q
