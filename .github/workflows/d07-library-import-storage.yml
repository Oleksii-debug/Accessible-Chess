name: D07 Library Import Storage

on:
  workflow_dispatch:
  pull_request:
    branches:
      - d07/library-import-storage-ci-base-20260823

permissions:
  contents: read

concurrency:
  group: d07-library-import-storage-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  library-import-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install -q pytest

      - name: Exact D07 ancestry and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 9503f98c20f5ebd496d47a8e23fa31178c450db0 HEAD)" = "9503f98c20f5ebd496d47a8e23fa31178c450db0"
          git diff --check 9503f98c20f5ebd496d47a8e23fa31178c450db0 HEAD
          git diff --name-only 9503f98c20f5ebd496d47a8e23fa31178c450db0 HEAD

      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused D07 Library import/storage contracts
        run: >-
          python -m unittest -v
          tests.test_d07_library_import_service
          tests.test_acsdb
          tests.test_import_history_service
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_search_cancellation
          tests.test_d07_search_semantic_equivalence

      - name: Full unittest discovery
        run: python -m unittest discover -s tests -v

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
