name: Runtime Dependency SPDX SBOM

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/runtime_dependency_notices.py'
      - 'acs/runtime_dependency_sbom.py'
      - 'tests/test_runtime_dependency_notices.py'
      - 'tests/test_runtime_dependency_sbom.py'
      - '.github/workflows/runtime-dependency-notices.yml'
      - '.github/workflows/runtime-dependency-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-dependency-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile notice and SPDX boundaries
        run: >-
          python -m compileall -q
          acs/runtime_dependency_notices.py
          acs/runtime_dependency_sbom.py
          tests/test_runtime_dependency_notices.py
          tests/test_runtime_dependency_sbom.py

      - name: Focused deterministic fail-closed release evidence tests
        run: >-
          python -m unittest -v
          tests.test_runtime_dependency_notices
          tests.test_runtime_dependency_sbom

      - name: Product-wide regression safety
        run: python -m unittest discover -s tests -v

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
