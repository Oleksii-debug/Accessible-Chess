        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$EVENT_BASE_REF" = "$SERIAL_REF"
          fi

          fetch_exact() {
            ref="$1"
            expected="$2"
            label="$3"
            git fetch --no-tags origin "refs/heads/$ref"
            live="$(git rev-parse FETCH_HEAD)"
            test "$live" = "$expected" || {
              printf '%s_MOVED expected=%s live=%s\n' "$label" "$expected" "$live" >&2
              exit 1
            }
          }

          fetch_exact "$SERIAL_REF" "$SERIAL_HEAD" CURRENT_PRODUCT_SERIAL
          fetch_exact "$BOOKS_REF" "$BOOKS_HEAD" CURRENT_PRODUCT_BOOKS
          fetch_exact "$LOCAL_PROFILE_REF" "$LOCAL_PROFILE_HEAD" CURRENT_PRODUCT_LOCAL_PROFILE
          fetch_exact "$KEYMAP_REF" "$KEYMAP_HEAD" CURRENT_PRODUCT_KEYMAP
          fetch_exact "$FORMAT_REF" "$FORMAT_HEAD" CURRENT_PRODUCT_FORMAT_CONVERSION
          fetch_exact "$REPORT_REF" "$REPORT_HEAD" CURRENT_PRODUCT_REPORT_PRIVACY
          fetch_exact "$CONVERSION_INTEGRITY_REF" "$CONVERSION_INTEGRITY_HEAD" CURRENT_PRODUCT_CONVERSION_INTEGRITY
          fetch_exact "$CONVERSION_CAS_REF" "$CONVERSION_CAS_HEAD" CURRENT_PRODUCT_CONVERSION_CAS
          fetch_exact "$EXPORT_PARENT_REF" "$EXPORT_PARENT_HEAD" CURRENT_PRODUCT_EXPORT_PARENT
          fetch_exact "$PRESENTATION_REF" "$PRESENTATION_HEAD" CURRENT_PRODUCT_PGN_PRESENTATION
          fetch_exact "$LIBRARY_EXPORT_REF" "$LIBRARY_EXPORT_HEAD" CURRENT_PRODUCT_LIBRARY_EXPORT
          fetch_exact "$LANGUAGE_ATOMIC_REF" "$LANGUAGE_ATOMIC_HEAD" CURRENT_PRODUCT_LANGUAGE_ATOMICITY
          fetch_exact "$BOOK_OPEN_REF" "$BOOK_OPEN_HEAD" CURRENT_PRODUCT_BOOK_OPEN
          fetch_exact "$ROUTE_ATOMIC_REF" "$ROUTE_ATOMIC_HEAD" CURRENT_PRODUCT_ROUTE_ATOMICITY
          fetch_exact "$FOCUS_PRESERVE_REF" "$FOCUS_PRESERVE_HEAD" CURRENT_PRODUCT_FOCUS_PRESERVATION
          fetch_exact "$BROWSER_PUBLICATION_REF" "$BROWSER_PUBLICATION_HEAD" CURRENT_PRODUCT_BROWSER_PUBLICATION

          test "$(git show -s --format=%P "$BOOKS_MERGE")" = "$SERIAL_HEAD $BOOKS_INITIAL_HEAD"
          test "$(git show -s --format=%P "$LOCAL_PROFILE_MERGE")" = "b8770e46d0b7b0ba5070b8fff78224bb3341ba7a e90d3735912a3a86f33b1175adcc2d76dfe3011d"
          test "$(git show -s --format=%P "$KEYMAP_MERGE")" = "$LOCAL_PROFILE_MERGE $KEYMAP_HEAD"
          test "$(git show -s --format=%P "$LEXICAL_MERGE")" = "$PRE_LEXICAL_PRODUCT $BOOKS_LEXICAL_HEAD"
          test "$(git show -s --format=%P "$SERIALIZED_MERGE")" = "$PRE_SERIALIZED_PRODUCT $BOOKS_HEAD"
          git merge-base --is-ancestor "$LEXICAL_MERGE" HEAD
          git merge-base --is-ancestor "$SERIALIZED_MERGE" HEAD
          test "$(git show -s --format=%P "$FORMAT_MERGE")" = "$PRE_FORMAT_PRODUCT $FORMAT_INITIAL_HEAD"
          git merge-base --is-ancestor "$FORMAT_MERGE" HEAD
          test "$(git show -s --format=%P "$FORMAT_ACCESSIBILITY_MERGE")" = "$PRE_FORMAT_ACCESSIBILITY_PRODUCT $FORMAT_HEAD"
          git merge-base --is-ancestor "$FORMAT_ACCESSIBILITY_MERGE" HEAD
          test "$(git show -s --format=%P "$REPORT_MERGE")" = "$PRE_REPORT_PRODUCT $REPORT_HEAD"
          git merge-base --is-ancestor "$REPORT_MERGE" HEAD
