name: Current Launcher Report and Data Identity

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'packaging/portable_launcher.c'
      - 'tests/test_portable_launcher_contract.py'
      - 'tests/test_portable_launcher_window_readiness.py'
      - 'tests/test_portable_launcher_core_guard.py'
      - '.github/workflows/p0-user-oneclick-portable-launcher.yml'
      - '.github/workflows/current-launcher-report-data-identity.yml'
      - '.github/workflows/portable-launch-report-reparse-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-launcher-report-data-identity-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CURRENT_PRODUCT_REF: converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
  LAUNCHER_BLOB: 1a1365c7c5bab6f6463414c9ff9c2aa2f1037e06
  CONTRACT_TEST_BLOB: 3cdd10f060e2713639210ce246524c0c2b448a19
  P0_LAUNCHER_WORKFLOW_BLOB: 00b8dfb79dcd5e9457bef6934303a2a8e145600f
  WINDOW_READINESS_TEST_BLOB: ee81983f4a94f6bec5e246c2ebac638b4eff5d10
  CORE_GUARD_TEST_BLOB: 410fddf296caf40e273c9916c078cc22a193876f

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject superseded pull-request candidate
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          event_sha="${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "refs/pull/${{ github.event.pull_request.number }}/head"
          live_sha="$(git rev-parse FETCH_HEAD)"
          test "$live_sha" = "$event_sha" || {
            printf 'CURRENT_LAUNCHER_IDENTITY_SUPERSEDED event=%s live=%s\n' "$event_sha" "$live_sha" >&2
            exit 1
          }

      - name: Prove current Product ancestry, exact blobs and scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "refs/heads/$CURRENT_PRODUCT_REF"
          live_product_base="$(git rev-parse FETCH_HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$EVENT_BASE_REF" = "$CURRENT_PRODUCT_REF"
            test "$EVENT_BASE_SHA" = "$live_product_base" || {
              printf 'LAUNCHER_PARENT_MOVED event=%s live=%s\n' "$EVENT_BASE_SHA" "$live_product_base" >&2
              exit 1
            }
          fi
          product_base="$live_product_base"
          test -n "$product_base"
          git merge-base --is-ancestor "$product_base" HEAD
          test "$(git merge-base "$product_base" HEAD)" = "$product_base"
          git diff --check "$product_base"...HEAD
          changed="$(git diff --name-only "$product_base"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-launcher-report-data-identity.yml' \
            '.github/workflows/p0-user-oneclick-portable-launcher.yml' \
            '.github/workflows/portable-launch-report-reparse-safety.yml' \
            'packaging/portable_launcher.c' \
            'tests/test_portable_launcher_contract.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected launcher convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:packaging/portable_launcher.c)" = "$LAUNCHER_BLOB"
          test "$(git rev-parse HEAD:tests/test_portable_launcher_contract.py)" = "$CONTRACT_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/p0-user-oneclick-portable-launcher.yml)" = "$P0_LAUNCHER_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:tests/test_portable_launcher_window_readiness.py)" = "$WINDOW_READINESS_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_portable_launcher_core_guard.py)" = "$CORE_GUARD_TEST_BLOB"
          echo 'CURRENT_LAUNCHER_IDENTITY_GEOMETRY=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Execute current portable launcher contracts
        run: >-
          python -m unittest -v
          tests.test_portable_launcher_contract
          tests.test_portable_launcher_core_guard
          tests.test_portable_launcher_window_readiness
          tests.test_portable_localappdata_persistence_binding
          tests.test_webview_safe_server
          tests.test_version2_portable_package

  windows-native-build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact live Product parent
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "refs/heads/$CURRENT_PRODUCT_REF"
          live_product_base="$(git rev-parse FETCH_HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$EVENT_BASE_REF" = "$CURRENT_PRODUCT_REF"
            test "$EVENT_BASE_SHA" = "$live_product_base" || {
              printf 'LAUNCHER_PARENT_MOVED event=%s live=%s\n' "$EVENT_BASE_SHA" "$live_product_base" >&2
              exit 1
            }
          fi
          product_base="$live_product_base"
          test -n "$product_base"
          git merge-base --is-ancestor "$product_base" HEAD
          test "$(git merge-base "$product_base" HEAD)" = "$product_base"
          test "$(git rev-parse HEAD:packaging/portable_launcher.c)" = "$LAUNCHER_BLOB"
          test "$(git rev-parse HEAD:tests/test_portable_launcher_contract.py)" = "$CONTRACT_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/p0-user-oneclick-portable-launcher.yml)" = "$P0_LAUNCHER_WORKFLOW_BLOB"
          test "$(git rev-parse HEAD:tests/test_portable_launcher_window_readiness.py)" = "$WINDOW_READINESS_TEST_BLOB"

      - name: Build native x64 launcher without CRT
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 20
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 21
          if not exist build mkdir build
          cl /nologo /utf-8 /W4 /WX /O2 /GS- /DUNICODE /D_UNICODE /c packaging\portable_launcher.c /Fo:build\portable_launcher.obj || exit /b 22
          link /nologo /MACHINE:X64 /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /NODEFAULTLIB build\portable_launcher.obj kernel32.lib user32.lib /OUT:build\AccessibleChess.exe || exit /b 23
          dumpbin /headers build\AccessibleChess.exe > build\headers.txt || exit /b 24
          dumpbin /dependents build\AccessibleChess.exe > build\dependents.txt || exit /b 25

      - name: Verify architecture and dependency closure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = Get-Content -Raw build/headers.txt
          if ($headers -notmatch 'machine \(x64\)') { throw 'Portable launcher is not x64' }
          $deps = @(
            Get-Content build/dependents.txt |
              ForEach-Object {
                if ($_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') { $Matches[1].ToUpperInvariant() }
              } |
              Where-Object { $_ } |
              Sort-Object -Unique
          )
          $expected = @('KERNEL32.DLL', 'USER32.DLL')
          if (@(Compare-Object $expected $deps).Count -ne 0) {
            throw "Portable launcher dependency drift: $($deps -join ', ')"
          }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path build/AccessibleChess.exe))
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'Portable launcher PE identity failed'
          }
