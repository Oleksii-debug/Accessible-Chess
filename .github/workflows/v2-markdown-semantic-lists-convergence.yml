name: V2 Markdown Semantic Lists Convergence

on:
  pull_request:
    paths:
      - 'acs/book_text_import.py'
      - 'tests/test_v2_book_text_import.py'
      - 'tests/test_v2_markdown_semantic_lists.py'
      - '.github/workflows/v2-markdown-semantic-lists-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-markdown-lists-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - name: Restore frozen Stage1 blobs byte-exact on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object --no-filters acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object --no-filters acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact convergence ancestry scope and source blobs
        shell: bash
        env:
          CANONICAL_BASE_SHA: 05d9cb289a5d81dd483b18197e5f76c46aff3012
          SOURCE_HEAD_SHA: 2954b8e95f678d62bfc8f7c56ef5cf9f826e6247
        run: |
          set -euo pipefail
          test -n "${GITHUB_BASE_REF:-}"
          git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          base="$(git rev-parse "origin/${GITHUB_BASE_REF}")"
          test "$base" = "$CANONICAL_BASE_SHA"
          git cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git merge-base --is-ancestor "$CANONICAL_BASE_SHA" HEAD
          git merge-base --is-ancestor "$SOURCE_HEAD_SHA" HEAD
          test "$(git rev-parse "$CANONICAL_BASE_SHA:acs/book_text_import.py")" = "e8828e7289f970ea8cd2eb6fc80a393904daaac5"
          test "$(git rev-parse "$CANONICAL_BASE_SHA:tests/test_v2_book_text_import.py")" = "4c0efb4a52832f3422e05b96883b1122dfc0587f"
          if git cat-file -e "$CANONICAL_BASE_SHA:tests/test_v2_markdown_semantic_lists.py" 2>/dev/null; then
            echo 'Canonical base already owns a semantic-list test path; convergence must be re-audited' >&2
            exit 1
          fi
          git diff --check "$CANONICAL_BASE_SHA" HEAD
          changed="$(git diff --name-only "$CANONICAL_BASE_SHA" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-markdown-semantic-lists-convergence.yml' \
            'acs/book_text_import.py' \
            'tests/test_v2_book_text_import.py' \
            'tests/test_v2_markdown_semantic_lists.py' | sort)"
          test "$changed" = "$expected"
          for path in \
            acs/book_text_import.py \
            tests/test_v2_book_text_import.py \
            tests/test_v2_markdown_semantic_lists.py
          do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_HEAD_SHA:$path")"
          done

      - name: Compile bounded Books adapter
        run: python -m py_compile acs/book_text_import.py tests/test_v2_book_text_import.py tests/test_v2_markdown_semantic_lists.py

      - name: Existing TXT and Markdown importer contracts
        run: python -m unittest -v tests.test_v2_book_text_import

      - name: Canonical semantic-list regression
        run: python -m unittest -v tests.test_v2_markdown_semantic_lists

      - name: Canonical Book core and reader regressions
        run: >-
          python -m unittest -v
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_accessible_book_core

      - name: Re-materialize frozen Stage1 blobs before broad byte contracts
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Product diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
