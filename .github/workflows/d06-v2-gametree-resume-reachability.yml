name: D06 V2 GameTree Resume Reachability

on:
  pull_request:
    paths:
      - 'acs/version2_gametree_resume.py'
      - 'acs/version2_release_app.py'
      - 'tests/test_d06_v2_gametree_resume_reachability.py'
      - '.github/workflows/d06-v2-gametree-resume-reachability.yml'

permissions:
  contents: read

concurrency:
  group: d06-v2-gametree-resume-reachability-${{ github.ref }}
  cancel-in-progress: true

env:
  D06_V2_RESUME_OWNER: c2a080712ab76bd318dc6a6c3037db464ab67857
  D06_RESUME_BLOB: 585574d61de42c3f956e050b0d7acf5e19dc7942
  D06_RELEASE_APP_BLOB: 4462da8db48737b4f66de7e2f4001d601aaec8a6
  D06_TEST_BLOB: 3a52ce7a15ac296b362d25e3ca470bd99497961a

jobs:
  v2-resume-reachability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove retained D06 authority and current Product compatibility
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${PR_BASE_SHA:-$D06_V2_RESUME_OWNER}"
          git cat-file -e "${base}^{commit}"
          git cat-file -e "${D06_V2_RESUME_OWNER}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$D06_V2_RESUME_OWNER" HEAD
          git diff --check "$base" HEAD
          test "$(git rev-parse HEAD:acs/version2_gametree_resume.py)" = "$D06_RESUME_BLOB"
          test "$(git rev-parse HEAD:acs/version2_release_app.py)" = "$D06_RELEASE_APP_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_v2_gametree_resume_reachability.py)" = "$D06_TEST_BLOB"
          printf 'Retained D06 authority PASS: base=%s owner=%s head=%s\n' "$base" "$D06_V2_RESUME_OWNER" "$(git rev-parse HEAD)"

      - name: Compile changed Python surface
        run: >-
          python -m py_compile
          acs/version2_gametree_resume.py
          acs/version2_release_app.py
          tests/test_d06_v2_gametree_resume_reachability.py

      - name: Focused D06 release-resume and close-boundary regressions
        run: >-
          python -m unittest -v
          tests.test_d06_v2_gametree_resume_reachability
          tests.test_d06_gametree_snapshot_resume
          tests.test_version2_release_app
          tests.test_version2_shutdown
          tests.test_w5_native_formclosing_dirty_pgn

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
