name: DEV4 Stage1 Privacy Repair Gap Evidence

on:
  pull_request:
    branches:
      - release/dev5-stage1-path-privacy-repair-20260823

permissions:
  contents: read

jobs:
  qa-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Exact base/head hygiene
        shell: bash
        run: |
          set -euo pipefail
          echo "QA_HEAD=$(git rev-parse HEAD)"
          git diff --check origin/release/dev5-stage1-path-privacy-repair-20260823...HEAD
      - name: Compile Product and oracle
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Focused batch OSError privacy gap
        run: python -m pytest -q tests/test_dev4_stage1_privacy_repair_gap.py
