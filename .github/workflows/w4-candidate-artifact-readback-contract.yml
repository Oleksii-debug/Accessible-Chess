name: W4 Candidate Artifact Readback Contract

on:
  pull_request:
    paths:
      - 'scripts/verify_w4_candidate_artifact.py'
      - 'tests/test_verify_w4_candidate_artifact.py'
      - '.github/workflows/w4-candidate-artifact-readback-contract.yml'
  push:
    branches:
      - release/w4-v2-current-p0-candidate-20260926
    paths:
      - 'scripts/verify_w4_candidate_artifact.py'
      - 'tests/test_verify_w4_candidate_artifact.py'
      - '.github/workflows/w4-candidate-artifact-readback-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Compile verifier
        run: python -m py_compile scripts/verify_w4_candidate_artifact.py tests/test_verify_w4_candidate_artifact.py
      - name: Run adversarial readback contract
        run: python -m unittest -v tests.test_verify_w4_candidate_artifact
