name: Section 54 bounded factory qualification
on:
  push:
    branches:
      - 'work/section54-*'
    paths:
      - 'acs/format_factory_intake.py'
      - 'acs/format_factory_tokens.py'
      - 'acs/format_factory_policy.py'
      - 'acs/format_factory_queue.py'
      - 'tests/test_section54_source_intake.py'
      - 'tests/test_section54_factory_tokens.py'
      - 'tests/test_section54_factory_policy.py'
      - 'tests/test_section54_factory_queue.py'
      - '.github/workflows/section54-source-intake.yml'
  pull_request:
    paths:
      - 'acs/format_factory_intake.py'
      - 'acs/format_factory_tokens.py'
      - 'acs/format_factory_policy.py'
      - 'acs/format_factory_queue.py'
      - 'tests/test_section54_source_intake.py'
      - 'tests/test_section54_factory_tokens.py'
      - 'tests/test_section54_factory_policy.py'
      - 'tests/test_section54_factory_queue.py'
      - '.github/workflows/section54-source-intake.yml'
  workflow_dispatch:
jobs:
  factory:
    name: Format intake and token envelopes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exact Python sources
        run: python -m py_compile acs/format_factory_intake.py acs/format_factory_tokens.py acs/format_factory_policy.py acs/format_factory_queue.py tests/test_section54_source_intake.py tests/test_section54_factory_tokens.py tests/test_section54_factory_policy.py tests/test_section54_factory_queue.py
      - name: Execute Section 54 unit and negative tests
        run: python -m unittest discover -s tests -p 'test_section54_*.py' -v
