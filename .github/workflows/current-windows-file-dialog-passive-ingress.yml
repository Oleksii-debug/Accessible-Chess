name: Current Windows File Dialog Passive Ingress

on:
  push:
    branches:
      - fix/windows-file-dialog-passive-results-20261005-sol56z8q8
  pull_request:
    branches:
      - work/windows-pgn-save-bg-20261005-k7m4q2
    paths:
      - acs/version2_windows_file_workflows.py
      - tests/test_v2_windows_file_worker_shutdown_fence.py
      - .github/workflows/current-windows-file-dialog-passive-ingress.yml

permissions:
  contents: read

concurrency:
  group: current-windows-file-dialog-passive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: a4e07a95360958fee7c292df3e4bc6213314e5dc
  PARENT_BRANCH: work/windows-pgn-save-bg-20261005-k7m4q2
  EXPECTED_SOURCE_BLOB: d75779541b96ce720a4787f4758f6288cacf4a10
  EXPECTED_TEST_BLOB: 8d872914bf69c4114932c8dcc6f0b06f55d244a6

jobs:
  passive-dialog-results:
    name: Passive file-dialog results / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact live parent and bounded passive-ingress delta
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/file-dialog-parent"
          live_parent="$(git rev-parse refs/remotes/origin/file-dialog-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "FILE_DIALOG_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-file-dialog-passive-ingress.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_file_worker_shutdown_fence.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_file_worker_shutdown_fence.py)" = "$EXPECTED_TEST_BLOB"

          echo "FILE_DIALOG_PARENT=$EXPECTED_PARENT"
          echo "FILE_DIALOG_PASSIVE_HEAD=$expected_head"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Windows file workflow passive boundary
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_file_worker_shutdown_fence.py
          tests/test_v2_windows_file_worker_preflight.py
          tests/test_v2_windows_pgn_open_worker.py
          tests/test_v2_windows_pgn_save_worker.py
          tests/test_v2_windows_nvda_file_workflows.py
          tests/test_v2_windows_native_dialog_ownership.py

      - name: Run focused modal and file-worker regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_file_worker_preflight
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_native_dialog_ownership
