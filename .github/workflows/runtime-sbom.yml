name: Runtime SBOM Evidence

on:
  pull_request:
    branches:
      - work/runtime-dependency-notices-current-20260924
    paths:
      - 'acs/runtime_sbom.py'
      - 'tests/test_runtime_sbom.py'
      - '.github/workflows/runtime-sbom.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove stacked scope and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${base}^{commit}"
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/runtime-sbom.yml'             'acs/runtime_sbom.py'             'tests/test_runtime_sbom.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected runtime SBOM scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test -f acs/runtime_dependency_notices.py
          test -f tests/test_runtime_dependency_notices.py

      - name: Compile bounded compliance modules
        run: python -m compileall -q acs/runtime_dependency_notices.py acs/runtime_sbom.py tests/test_runtime_dependency_notices.py tests/test_runtime_sbom.py

      - name: Focused dependency-notice and SBOM regressions
        run: >-
          python -m pytest -q
          tests/test_runtime_dependency_notices.py
          tests/test_runtime_sbom.py

      - name: Full unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -v

      - name: Full pytest on Windows
        if: matrix.os == 'windows-2025'
        run: python -m pytest -q tests

      - name: Core selftest
        run: python -m acs.selftest

      - name: Final-product diagnostic
        run: python run_accessible_chess_v2.py --diagnostic
