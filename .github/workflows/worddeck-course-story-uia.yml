name: WordDeck packaged Course Story UIA

on:
  pull_request:
    branches: [worddeck-bootstrap]
    paths:
      - 'WordDeck/**'
      - '.github/workflows/worddeck-course-story-uia.yml'
  push:
    branches: [worddeck-bootstrap]
    paths:
      - 'WordDeck/**'
      - '.github/workflows/worddeck-course-story-uia.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORDDECK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: worddeck-course-story-uia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-course-story-uia:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORDDECK_SOURCE_SHA }}

      - name: Record exact source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:WORDDECK_SOURCE_SHA) {
            throw "Checkout/source mismatch: HEAD=$actual expected_source=$env:WORDDECK_SOURCE_SHA event_sha=$env:GITHUB_SHA"
          }
          New-Item -ItemType Directory -Force .\artifacts\release | Out-Null
          @(
            "source_sha=$actual",
            "event_sha=$env:GITHUB_SHA",
            "ref=$env:GITHUB_REF",
            "workflow_run=$env:GITHUB_RUN_ID"
          ) | Set-Content .\artifacts\course-story-uia-source.txt -Encoding utf8
          Write-Host "Exact source checkout PASS: source_sha=$actual event_sha=$env:GITHUB_SHA"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build exact source head
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore .\WordDeck\WordDeck.csproj
          dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror

      - name: Run exact-source integrated self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test

      - name: Publish exact-source packaged EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\release
          $exe = (Resolve-Path .\artifacts\release\WordDeck.exe).Path
          $self = Start-Process $exe -ArgumentList '--self-test' -WorkingDirectory (Split-Path -Parent $exe) -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Packaged exact-source self-test failed: $($self.ExitCode)" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "worddeck_exe_sha256=$hash" | Add-Content .\artifacts\course-story-uia-source.txt -Encoding utf8
          Write-Host "Exact-source packaged EXE SHA-256: $hash"

      - name: Setup WinApp CLI for Windows UI Automation
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Run packaged Course Story keyboard and restart UIA
        shell: pwsh
        env:
          WORDDECK_ALLOW_MUTATING_UIA_STATE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & .\WordDeck\scripts\worddeck-course-story-uia-smoke.ps1 -CandidateExePath .\artifacts\release\WordDeck.exe
          "uia_result=PASS" | Add-Content .\artifacts\course-story-uia-source.txt -Encoding utf8

      - name: Upload exact-source Course Story UIA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WordDeck-course-story-uia-${{ env.WORDDECK_SOURCE_SHA }}
          path: .\artifacts\course-story-uia-source.txt
          if-no-files-found: error
          retention-days: 30
