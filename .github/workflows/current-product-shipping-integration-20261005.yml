name: Current Product Shipping Integration 2026-10-05

on:
  pull_request:
    branches:
      - integration/current-product-main-candidate-20261004-c2mbezb
  push:
    branches:
      - integrate/current-product-to-shipping-refresh-20261005-sol56r6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-product-shipping-integration-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80

    steps:
      - name: Checkout exact shipping integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact live shipping and Product geometry
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SHIPPING_BRANCH: integration/current-product-main-candidate-20261004-c2mbezb
          PRODUCT_BRANCH: converge/current-product-books-provider-20261005-ooxple7
          PINNED_SHIPPING_SHA: 0a9e0db1663c04cf67fac2d249ba197fa22cde75
          PINNED_PRODUCT_SHA: 492861b4e3ed2365ac63ddf925b182db7d3342e2
          WINDOWS_EVIDENCE_REF: converge/current-product-windows-evidence-20261005-zftrkmo
          WINDOWS_EVIDENCE_SHA: 298a3d982f79caf126560a7017a7a1b65e25816a
          TRAINING_DURABILITY_REF: converge/current-product-training-durability-evidence-20261005-zftrkmo
          TRAINING_DURABILITY_SHA: b6444f6fb17238c24a193a03461e9dc8cf1bd235
          PRE_FOCUS_SHIPPING_HEAD: 42145bb7684249e07946c02dda5b28223f1e0caa
          TRAINING_RECONVERGENCE_MERGE: c65f0641a866744c583ea21f7b2baa7ec8c5d53e
          OWNER_FINAL_HOLD_REF: fix/shipping-owner-final-sound-hold-20261005-zftrkmo
          OWNER_FINAL_HOLD_SHA: aa706a6e8d525611b57514e62b3c203c9d41ce61
          PRE_OWNER_FINAL_HOLD_SHIPPING: ccc0f937658b2035cc45c48bce5ab20fabd8db3d
          OWNER_FINAL_HOLD_MERGE: f7b231f195399c38e53d5749f9aa9f771485f76c
          MANIFEST_SOURCE_GATE: .github/workflows/current-portable-manifest-json-prehash-bounds.yml
          ACCESSIBILITY_GATE: .github/workflows/current-product-accessibility-formats-convergence.yml
          PORTABLE_GATE: .github/workflows/current-product-portable-integration-convergence.yml
          INTEGRATION_WORKFLOW: .github/workflows/current-product-shipping-integration-20261005.yml
          INTEGRATION_TEST: tests/test_current_product_shipping_integration_20261005.py
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          base_ref="${EVENT_BASE_REF:-$SHIPPING_BRANCH}"
          test "$base_ref" = "$SHIPPING_BRANCH"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_shipping="$(git rev-parse "refs/remotes/origin/$base_ref")"
          test "$live_shipping" = "$PINNED_SHIPPING_SHA"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_shipping"
          fi

          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:refs/remotes/origin/$PRODUCT_BRANCH"
          live_product="$(git rev-parse "refs/remotes/origin/$PRODUCT_BRANCH")"
          test "$live_product" = "$PINNED_PRODUCT_SHA"

          fetch_evidence_exact() {
            ref="$1"; expected="$2"; label="$3"
            git fetch --no-tags origin "+refs/heads/$ref:refs/remotes/origin/$ref"
            live="$(git rev-parse "refs/remotes/origin/$ref")"
            test "$live" = "$expected" || {
              printf '%s_MOVED expected=%s live=%s\n' "$label" "$expected" "$live" >&2
              exit 1
            }
            git merge-base --is-ancestor "$expected" HEAD
          }
          fetch_evidence_exact "$WINDOWS_EVIDENCE_REF" "$WINDOWS_EVIDENCE_SHA" SHIPPING_WINDOWS_EVIDENCE
          fetch_evidence_exact "$TRAINING_DURABILITY_REF" "$TRAINING_DURABILITY_SHA" SHIPPING_TRAINING_DURABILITY
          fetch_evidence_exact "$OWNER_FINAL_HOLD_REF" "$OWNER_FINAL_HOLD_SHA" SHIPPING_OWNER_FINAL_HOLD
          git merge-base --is-ancestor "$live_product" "$WINDOWS_EVIDENCE_SHA"
          git merge-base --is-ancestor "$WINDOWS_EVIDENCE_SHA" "$TRAINING_DURABILITY_SHA"
          test "$(git merge-base "$live_product" "$TRAINING_DURABILITY_SHA")" = "$live_product"
          test "$(git show -s --format=%P "$TRAINING_RECONVERGENCE_MERGE")" = "$PRE_FOCUS_SHIPPING_HEAD $TRAINING_DURABILITY_SHA"
          git merge-base --is-ancestor "$TRAINING_RECONVERGENCE_MERGE" HEAD
          test "$(git show -s --format=%P "$OWNER_FINAL_HOLD_MERGE")" = "$PRE_OWNER_FINAL_HOLD_SHIPPING $OWNER_FINAL_HOLD_SHA"
          git merge-base --is-ancestor "$OWNER_FINAL_HOLD_MERGE" HEAD

          git merge-base --is-ancestor "$live_shipping" "$live_product"
          test "$(git merge-base "$live_shipping" "$live_product")" = "$live_shipping"
          git merge-base --is-ancestor "$live_product" HEAD
          test "$(git merge-base "$live_shipping" HEAD)" = "$live_shipping"
          git diff --check "$live_shipping"...HEAD

          product_paths="$(git diff --name-only "$live_shipping"..."$live_product" | sort)"
          test -n "$product_paths"
          product_count="$(printf '%s\n' "$product_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$product_count" -eq 231

          extra_paths="$(git diff --name-only "$live_product"...HEAD | sort)"
          expected_extra="$(printf '%s\n' \
            "$MANIFEST_SOURCE_GATE" \
            "$ACCESSIBILITY_GATE" \
            "$PORTABLE_GATE" \
            "$INTEGRATION_WORKFLOW" \
            "$INTEGRATION_TEST" \
            '.github/workflows/current-product-training-durability-convergence.yml' \
            '.github/workflows/current-product-windows-evidence-convergence.yml' \
            '.github/workflows/p0-user-oneclick-portable-launcher.yml' \
            '.github/workflows/portable-launch-report-reparse-safety.yml' \
            '.github/workflows/training-progress-durability.yml' \
            'tests/test_current_product_training_durability_convergence_20261005.py' \
            'tests/test_current_product_windows_evidence_convergence_20261005.py' \
            'tests/test_p0_oneclick_exact_head_concurrency.py' \
            'tests/test_portable_launch_report_reparse_concurrency.py' \
            'tests/test_training_progress_durability_concurrency.py' \
            '.github/workflows/owner-oneclick-from-w4.yml' \
            'docs/USER_SOUND_PACK_CURRENT.md' \
            'scripts/build_owner_portable_candidate.py' \
            'tests/test_owner_oneclick_from_w4_workflow.py' \
            'tests/test_owner_portable_candidate.py' \
            | sort)"
          test "$extra_paths" = "$expected_extra" || {
            printf 'Unexpected integration-only qualification scope.\nExpected:\n%s\nActual:\n%s\n' "$expected_extra" "$extra_paths" >&2
            exit 1
          }

          evidence_paths="$(printf '%s\n' \
            '.github/workflows/current-product-training-durability-convergence.yml' \
            '.github/workflows/current-product-windows-evidence-convergence.yml' \
            '.github/workflows/p0-user-oneclick-portable-launcher.yml' \
            '.github/workflows/portable-launch-report-reparse-safety.yml' \
            '.github/workflows/training-progress-durability.yml' \
            'tests/test_current_product_training_durability_convergence_20261005.py' \
            'tests/test_current_product_windows_evidence_convergence_20261005.py' \
            'tests/test_p0_oneclick_exact_head_concurrency.py' \
            'tests/test_portable_launch_report_reparse_concurrency.py' \
            'tests/test_training_progress_durability_concurrency.py')"
          while IFS= read -r evidence_path; do
            test -n "$evidence_path"
            test "$(git rev-parse "HEAD:$evidence_path")" = "$(git rev-parse "$TRAINING_DURABILITY_SHA:$evidence_path")" || {
              printf 'Evidence path mutated after convergence: %s\n' "$evidence_path" >&2
              exit 1
            }
          done <<< "$evidence_paths"
          owner_hold_paths="$(printf '%s\n' \
            '.github/workflows/owner-oneclick-from-w4.yml' \
            'docs/USER_SOUND_PACK_CURRENT.md' \
            'scripts/build_owner_portable_candidate.py' \
            'tests/test_owner_oneclick_from_w4_workflow.py' \
            'tests/test_owner_portable_candidate.py')"
          while IFS= read -r owner_path; do
            test -n "$owner_path"
            test "$(git rev-parse "HEAD:$owner_path")" = "$(git rev-parse "$OWNER_FINAL_HOLD_SHA:$owner_path")" || {
              printf 'Owner-final hold path mutated after convergence: %s\n' "$owner_path" >&2
              exit 1
            }
          done <<< "$owner_hold_paths"

          candidate_paths="$(git diff --name-only "$live_shipping"...HEAD | sort)"
          expected_candidate="$(printf '%s\n%s\n' "$product_paths" "$expected_extra" | sed '/^$/d' | sort -u)"
          test "$candidate_paths" = "$expected_candidate" || {
            printf 'Shipping candidate does not equal Product plus bounded qualification repairs.\nExpected:\n%s\nActual:\n%s\n' "$expected_candidate" "$candidate_paths" >&2
            exit 1
          }
          candidate_count="$(printf '%s\n' "$candidate_paths" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "$candidate_count" -eq 242

          echo "CURRENT_PRODUCT_SHIPPING_GEOMETRY=PASS"
          echo "SHIPPING_BASE=$live_shipping"
          echo "PRODUCT_SOURCE=$live_product"
          echo "PRODUCT_PATHS=$product_count"
          echo "QUALIFICATION_DELTA_PATHS=15"
          echo "EVIDENCE_STACK_LIVE_HEADS=PASS"
          echo "EVIDENCE_STACK_PATHS_UNMODIFIED=PASS"
          echo "CANDIDATE_PATHS=$candidate_count"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile current Product integration surfaces
        run: >-
          python -m compileall -q
          acs/bookdocument.py
          acs/bookreader.py
          acs/settings.py
          acs/training_progress_store.py
          acs/version2_package_preflight.py
          acs/version2_portable_package.py
          acs/keybindings.py
          acs/stage1_release_ui.py
          acs/webapp.py
          acs/full_product_actions.py
          acs/book_html_import.py
          acs/book_library_import.py
          acs/book_training.py
          acs/gametree_legality.py
          acs/import_contract.py
          acs/pgn_conversion.py
          acs/pgn_conversion_windows.py
          acs/pgn_service.py
          acs/full_product_presenters.py
          acs/pgn_webview_projection.py
          acs/version2_windows_file_workflows.py
          tests/test_current_product_shipping_integration_20261005.py
          tests/test_current_product_windows_evidence_convergence_20261005.py
          tests/test_current_product_training_durability_convergence_20261005.py
          tests/test_p0_oneclick_exact_head_concurrency.py
          tests/test_portable_launch_report_reparse_concurrency.py
          tests/test_training_progress_durability_concurrency.py

      - name: Run browser accessibility and keymap contracts
        run: |
          node tests/js/dynamic_keymap_help_test.js
          node tests/js/classroom_surface_dom_test.js
          node tests/js/pgn_remaining_keybindings_test.js

      - name: Run current resource and persistence regressions
        run: >-
          python -m unittest -v
          tests.test_portable_manifest_json_prehash_bounds_current
          tests.test_bookdocument_total_text_budget_current
          tests.test_bookreader_revision_barriers_current
          tests.test_settings_corruption_security
          tests.test_training_progress_json_prehash_bounds_current
          tests.test_version2_package_preflight
          tests.test_version2_portable_package
          tests.test_bookreader
          tests.test_w2_training_progress_crash_recovery
          tests.test_version2_training_current_runtime

      - name: Run current accessibility formats and chess-authority regressions
        run: >-
          python -m unittest -v
          tests.test_keybindings
          tests.test_dynamic_keymap_help_contract
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_unbound_shortcut_capture
          tests.test_pgn_tree_remaining_keybindings
          tests.test_book_html_inline_image_order
          tests.test_book_html_pgn_loss_accounting
          tests.test_book_library_import_journey
          tests.test_book_training_variant_authority
          tests.test_pgn_board_start_authority
          tests.test_full_product_book_command_authority

      - name: Run shipping integration qualification contracts
        run: >-
          python -m unittest -v
          tests.test_current_product_shipping_integration_20261005
          tests.test_current_product_windows_evidence_convergence_20261005
          tests.test_current_product_training_durability_convergence_20261005
          tests.test_p0_oneclick_exact_head_concurrency
          tests.test_portable_launch_report_reparse_concurrency
          tests.test_training_progress_durability_concurrency
          tests.test_current_main_full_product_convergence_workflow
          tests.test_p0_release_critical_triad_convergence
          tests.test_version2_application

      - name: Run current Books PGN recovery launcher and formats regressions
        run: >-
          python -m unittest -v
          tests.test_book_lookup_detached_canonicalization
          tests.test_v2_book_game_content
          tests.test_bookdocument
          tests.test_v2_book_epub_import
          tests.test_v2_book_html_import
          tests.test_v2_book_text_import
          tests.test_notation
          tests.test_pgn_presenter_graph_safety_current
          tests.test_dev1_pgn_webview_projection
          tests.test_d06_v2_gametree_resume_discard_guard
          tests.test_portable_launcher_contract
          tests.test_chessbase_manifest_legacy_cbf_pair
          tests.test_pgn_conversion
          tests.test_pgn_conversion_windows
          tests.test_pgn_conversion_native_windows
          tests.test_pgn_service
          tests.test_dev1_full_product_webview_adapter
          tests.test_full_product_native_menu
          tests.test_report_paths
      - name: Run current V2 diagnostic and core selftest
        run: |
          python run_accessible_chess_v2.py --diagnostic
          python -m acs.selftest
