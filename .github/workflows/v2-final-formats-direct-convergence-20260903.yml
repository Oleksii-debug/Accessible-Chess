name: V2 Final Formats Direct Convergence

on:
  push:
    branches:
      - integration/v2-final-formats-d07-convergence-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-final-formats-direct-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-final-formats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      FINAL_FORMATS_SOURCE: 43b8d22f4c80fa89c2bdd39a2f23d5f4819cc86d
      D06_D07_SOURCE: 857a740ca484011048ebb567d79e759624cdc085
      COMPOSED_BASE: 8b90b2098fb72a5b371182ce12e09dc7f3ffb877
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact Stage 1 bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact two-parent composition and CI-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$FINAL_FORMATS_SOURCE" HEAD
          git merge-base --is-ancestor "$D06_D07_SOURCE" HEAD
          git merge-base --is-ancestor "$COMPOSED_BASE" HEAD
          git diff --check "$COMPOSED_BASE" HEAD
          changed="$(git diff --name-only "$COMPOSED_BASE" HEAD | sort)"
          expected='.github/workflows/v2-final-formats-direct-convergence-20260903.yml'
          test "$changed" = "$expected"
          git diff --quiet "$COMPOSED_BASE" HEAD -- acs tests scripts tools web docs

      - name: Compile composed formats runtime
        run: >-
          python -m py_compile
          acs/gametree.py
          acs/pgn_roundtrip.py
          acs/pgn_streaming_import.py
          acs/pgn_service.py
          acs/pgn_document.py
          acs/acsdb.py
          acs/search_policy.py
          acs/search_service.py
          acs/library_import_service.py
          acs/chessbase_adapter.py
          acs/chessbase_decoder.py
          acs/chessbase_integrity.py
          acs/chessbase_library_import.py
          acs/cbv_extractor.py
          acs/book_progress_store.py
          scripts/v2_real_lichess_streaming_v6_oracle.py

      - name: Library accessibility DOM contract
        run: node tests/js/library_surface_dom_test.js

      - name: Version 2 semantic format journeys
        run: >-
          python -m unittest -v
          tests.test_version2_formats_integration
          tests.test_d06_file_ingress_nag_normalization
          tests.test_d06_real_corpus_recovery
          tests.test_pgn_streaming_import
          tests.test_v2_pgn_nested_comment_recovery
          tests.test_v2_pgn_semantic_fidelity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_transaction_ownership
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_date_filter_v5
          tests.test_v2_library_integrity_repair
          tests.test_v2_library_search_service_v4
          tests.test_chessbase_adapter
          tests.test_chessbase_decoder
          tests.test_cbv_extractor
          tests.test_v2_chessbase_capability_manifest
          tests.test_v2_book_progress_store

      - name: Direct lawful 10000 plus Unicode schema-v6 journey
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.v2_real_lichess_streaming_v6_oracle 2>&1 | tee final-formats-real.log
          grep -F '"status": "PASS"' final-formats-real.log
          grep -F '"standard_games": 10000' final-formats-real.log
          grep -F '"schema": 6' final-formats-real.log

      - name: Full repository unittest
        if: always()
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        if: always()
        run: python -m pytest -q tests

      - name: Selftest and complete diagnostic
        if: always()
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Upload direct final-formats evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-final-formats-direct-${{ matrix.os }}
          path: |
            real-lichess-acsdb-v6-summary.json
            final-formats-real.log
          if-no-files-found: warn
          retention-days: 14

      - name: Prove no Product or corpus residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f real-lichess-acsdb-v6-summary.json final-formats-real.log
          if ! git diff --quiet --ignore-cr-at-eol HEAD; then
            git diff --name-status --ignore-cr-at-eol HEAD
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf '%s\n' "$untracked"
            exit 1
          fi
