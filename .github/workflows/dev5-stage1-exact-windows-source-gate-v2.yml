name: DEV5 Stage1 Exact Windows Source Gate V2

on:
  pull_request:
    branches:
      - qa/windows-current-integration-candidate-20260815
    paths:
      - '.github/workflows/dev5-stage1-exact-windows-source-gate-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev5-stage1-exact-windows-source-v2
  cancel-in-progress: false

env:
  SOURCE_INTEGRATION_SHA: 0fa442330bc2bb03636ff9297512da4c29e38684

jobs:
  exact-source-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout QA harness repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize exact accepted source as LF-preserving detached worktree
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git cat-file -e "$env:SOURCE_INTEGRATION_SHA^{commit}"
          if($LASTEXITCODE -ne 0){throw 'Accepted Stage1 SHA unavailable'}
          if(Test-Path work){Remove-Item work -Recurse -Force}
          git worktree add --detach work $env:SOURCE_INTEGRATION_SHA
          if($LASTEXITCODE -ne 0){throw 'Exact detached worktree creation failed'}
          git -C work config core.autocrlf false
          git -C work config core.eol lf
          $resolved=(git -C work rev-parse HEAD).Trim()
          if($resolved -ne $env:SOURCE_INTEGRATION_SHA){throw "SOURCE LOCK mismatch: $resolved"}
          $dirty=(git -C work status --porcelain --untracked-files=no)
          if($dirty){throw "Exact worktree unexpectedly dirty: $dirty"}
          if(-not (Test-Path 'work\.github\workflows\publish-stage1-release.yml')){throw 'Exact .github workflow context missing'}
          @'
          import hashlib,pathlib
          root=pathlib.Path('work')
          def blob(path):
              data=path.read_bytes(); head=f'blob {len(data)}\0'.encode('ascii'); return hashlib.sha1(head+data).hexdigest()
          checks={
              'acs/stage1_release_ui_core.py':'b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6',
              'acs/webapp_keymap_core.py':'0ba06f548d39dad7372e0339b3e121fd1717cc05',
          }
          for rel,expected in checks.items():
              actual=blob(root/rel); assert actual==expected,(rel,actual,expected)
          print('WINDOWS LF-PRESERVING FROZEN BLOB IDENTITY PASS')
          '@ | Set-Content -Encoding UTF8 verify_exact_blobs.py
          python verify_exact_blobs.py
          if($LASTEXITCODE -ne 0){throw 'Frozen blob identity failed after Windows checkout'}
          "EXACT WINDOWS WORKTREE LOCK PASS: $resolved"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        shell: pwsh
        working-directory: work
        run: python -m pip install -q pytest

      - name: Compile and full unittest discovery
        shell: pwsh
        working-directory: work
        run: |
          python -m compileall -q acs tests run_accessible_chess.py
          if($LASTEXITCODE -ne 0){throw 'compileall failed'}
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath exact-windows-unittest.log
          if($LASTEXITCODE -ne 0){throw 'full unittest discovery failed'}

      - name: Full pytest without weakening
        shell: pwsh
        working-directory: work
        run: |
          python -m pytest -q 2>&1 | Tee-Object -FilePath exact-windows-pytest.log
          if($LASTEXITCODE -ne 0){throw 'full pytest failed'}

      - name: Stage1 release focused contracts and diagnostic
        shell: pwsh
        working-directory: work
        run: |
          python -m unittest -v tests.test_issue22_release_contract tests.test_nvda_p0_contract tests.test_stage1_webview2_accessibility_boundary tests.test_webview_safe_server tests.test_ui_native_menu_recovery tests.test_sound_runtime tests.test_release_stockfish_composition tests.test_stage1_core_full_flow tests.test_stage1_release_composition_ui tests.test_stage1_packaged_focus_origin_contract tests.test_release_preflight tests.test_legacy_release_workflow_safety tests.test_stage1_saturation_refactor_contract
          if($LASTEXITCODE -ne 0){throw 'Stage1 focused release gate failed'}
          python run_accessible_chess.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'exact Windows source diagnostic failed'}
          'EXACT WINDOWS SOURCE GATE V2 PASS'

      - name: Upload source-gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev5-stage1-exact-windows-source-v2-logs
          path: |
            work/exact-windows-unittest.log
            work/exact-windows-pytest.log
          if-no-files-found: warn
          retention-days: 7
