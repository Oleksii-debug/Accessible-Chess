name: V2 Native Dialog Language Successor

on:
  push:
    branches:
      - work/v2-native-dialog-language-20260907
  pull_request:

permissions:
  contents: read

concurrency:
  group: v2-native-dialog-language-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-dialog-language:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Prove exact language-owner ancestry and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          base=1c7c96572eb73b15514ed3a92e03d268c7fe8e7c
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-native-dialog-language.yml' \
            'acs/version2_release_app.py' \
            'acs/version2_windows_host_runtime.py' \
            'acs/version2_windows_native_dialog_ownership.py' \
            'tests/test_v2_native_dialog_language.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$base" HEAD -- \
            acs/version2_application.py \
            acs/settings.py \
            acs/chesscore.py \
            acs/gametree.py \
            acs/pgn_document.py \
            acs/pgn_service.py \
            acs/pgn_workspace.py \
            acs/acsdb.py \
            web \
            tools/qa \
            run_accessible_chess.py \
            run_accessible_chess_v2.py
      - name: Compile V2 native dialog language composition
        run: python -m compileall -q acs tests/test_v2_native_dialog_language.py
      - name: Focused native dialog and persisted-language regressions
        run: >-
          python -m unittest -v
          tests.test_v2_native_dialog_language
          tests.test_v2_windows_native_dialog_ownership
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_pgn_export
          tests.test_version2_release_app
          tests.test_w3_v2_language_consistency
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: Stage 1 and Version 2 automated diagnostics
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
          python run_accessible_chess_v2.py --diagnostic
