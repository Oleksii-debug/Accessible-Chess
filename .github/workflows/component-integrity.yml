name: Protected Component Integrity Contract

on:
  pull_request:
    paths:
      - 'acs/component_integrity.py'
      - 'tests/test_component_integrity.py'
      - '.github/workflows/component-integrity.yml'
  push:
    branches:
      - 'work/component-integrity-20260926'
    paths:
      - 'acs/component_integrity.py'
      - 'tests/test_component_integrity.py'
      - '.github/workflows/component-integrity.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Prove exact candidate and bounded branch scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          base=603caba648a8452e3db1e514019713bdefd1516f
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base" HEAD
          git diff --name-only "$base" HEAD | sort > changed.txt
          cat > expected.txt <<'EOF'
          .github/workflows/component-integrity.yml
          acs/component_integrity.py
          tests/test_component_integrity.py
          EOF
          sort -o expected.txt expected.txt
          diff -u expected.txt changed.txt
      - name: Compile bounded integrity surface
        run: python -m py_compile acs/component_integrity.py tests/test_component_integrity.py
      - name: Run component integrity contract
        run: python -m unittest -v tests.test_component_integrity
