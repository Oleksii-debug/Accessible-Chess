name: D07 Search Scalar Equivalence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - d07/search-scalar-equivalence-ci-base-20260823

permissions:
  contents: read

concurrency:
  group: d07-search-scalar-equivalence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  search-scalar-equivalence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -q pytest
      - name: Exact ancestry and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base 5281c029692e9a06536b1faadd95080b545641b7 HEAD)" = "5281c029692e9a06536b1faadd95080b545641b7"
          git diff --check 5281c029692e9a06536b1faadd95080b545641b7 HEAD
          git diff --name-only 5281c029692e9a06536b1faadd95080b545641b7 HEAD
      - name: Compile
        run: python -m compileall -q acs tests run_accessible_chess.py
      - name: Focused D07 scalar-equivalence oracle
        run: >-
          python -m unittest -v
          tests.test_d07_search_scalar_equivalence
          tests.test_d07_search_semantic_equivalence
          tests.test_d07_library_search_cancellation
          tests.test_search_service
          tests.test_dev3_search_resource_bounds
          tests.test_dev3_acsdb_wal_scalars
          tests.test_d07_acsdb_migration_atomicity
          tests.test_d07_library_import_service
          tests.test_d07_library_import_transaction_ownership
          tests.test_d07_library_import_start_lock
      - name: Full unittest discovery
        run: python -m unittest discover -s tests -v
      - name: Full pytest regression
        run: python -m pytest -q
      - name: Complete diagnostic
        run: python run_accessible_chess.py --diagnostic
