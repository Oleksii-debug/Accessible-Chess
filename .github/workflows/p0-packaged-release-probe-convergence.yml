name: P0 Packaged Release Probe Convergence

on:
  pull_request:
    paths:
      - 'scripts/p0_packaged_document_copy_probe.ps1'
      - 'tests/test_p0_packaged_document_copy_probe.py'
      - 'scripts/verify_p0_packaged_document_copy_evidence.py'
      - 'tests/test_verify_p0_packaged_document_copy_evidence.py'
      - 'scripts/p0g_packaged_hotkey_result_probe.ps1'
      - 'tests/test_p0g_packaged_hotkey_result_probe.py'
      - 'tests/test_p0_packaged_release_probe_convergence.py'
      - '.github/workflows/p0-packaged-release-probe-convergence.yml'

permissions:
  contents: read

jobs:
  combined-probe-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout proposed merge of P0 QA lineages
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 2
      - name: Require supported convergence base
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.ref }}'
          case "$base" in
            codex/v2-runtime-completion-20260907|qa/p0g-packaged-hotkey-result-20260926|fix/p0f-packaged-starter-diagnostic-20260926|work/full-product-teacher-education-reachability-20260911|converge/p0-release-critical-to-full-product-20260926|release/w4-v2-current-p0-candidate-20260926)
              ;;
            *)
              echo "unexpected packaged-probe convergence base: $base" >&2
              exit 1
              ;;
          esac
          git diff --check HEAD^
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile combined contracts
        run: >-
          python -m py_compile
          tests/test_p0_packaged_document_copy_probe.py
          tests/test_p0g_packaged_hotkey_result_probe.py
          tests/test_p0_packaged_release_probe_convergence.py
          scripts/verify_p0_packaged_document_copy_evidence.py
          tests/test_verify_p0_packaged_document_copy_evidence.py
      - name: Run incumbent packaged probe contracts and convergence gate
        run: >-
          python -m unittest -v
          tests.test_p0_packaged_document_copy_probe
          tests.test_p0g_packaged_hotkey_result_probe
          tests.test_p0_packaged_release_probe_convergence
          tests.test_verify_p0_packaged_document_copy_evidence
