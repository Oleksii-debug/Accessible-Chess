name: Runtime Dependency Notices

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/runtime_dependency_notices.py'
      - 'tests/test_runtime_dependency_notices.py'
      - '.github/workflows/runtime-dependency-notices.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-dependency-notices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile notice boundary
        run: python -m compileall -q acs/runtime_dependency_notices.py tests/test_runtime_dependency_notices.py

      - name: Focused fail-closed notice tests
        run: python -m unittest -v tests.test_runtime_dependency_notices

      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
