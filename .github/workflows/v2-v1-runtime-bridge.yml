name: V2 V1 Runtime Bridge

on:
  push:
    branches:
      - work/v2-data-upgrade-legacy-runtime-bridge-20260907
  pull_request:
    paths:
      - 'acs/v1_runtime_bridge.py'
      - 'tests/test_v1_runtime_bridge.py'
      - 'tests/test_v1_runtime_bridge_backup_path_security.py'
      - 'tests/test_v1_runtime_bridge_publication_atomicity.py'
      - 'acs/legacy_library_migration.py'
      - 'tests/test_v2_library_legacy_schema0_migration.py'
      - '.github/workflows/v2-v1-runtime-bridge.yml'

permissions:
  contents: read

concurrency:
  group: v2-v1-runtime-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  UPGRADE_BASE: 9828010f7b0c08776684a176352ad1914eeb6409
  D07_SCHEMA0_HEAD: 9a58ff2cfc3e08bb8c9b86a447709b40dac89f04
  D07_CONVERTER_BLOB: cbb6a5e84608bdcd00c7cac58994433d34e8c3d6
  D07_TEST_BLOB: abceb9136b724c57a3eb0da44f0067bb03ff836e
  ACSDB_BLOB: f5dd56e017c09aa8bf2ba3aa66c0658f8a229e74
  PGN_BLOB: 96d62bf6dd7b2f5c8a75d5f2bd1fde2ad0823d20
  UPGRADE_BLOB: b92a2c75e23ffb5944b1a3a758e20c56da34315f
  SETTINGS_BLOB: 3d0dfe1b6765128a970543ff57e533620a80e5fc

jobs:
  bridge-correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve canonical Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Exact dependency ancestry, scope, and blob locks
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$UPGRADE_BASE" HEAD
          git merge-base --is-ancestor "$D07_SCHEMA0_HEAD" HEAD
          git diff --check "$UPGRADE_BASE" HEAD
          changed="$(git diff --name-only "$UPGRADE_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-v1-runtime-bridge.yml' \
            'acs/legacy_library_migration.py' \
            'acs/v1_runtime_bridge.py' \
            'tests/test_v1_runtime_bridge.py' \
            'tests/test_v1_runtime_bridge_backup_path_security.py' \
            'tests/test_v1_runtime_bridge_publication_atomicity.py' \
            'tests/test_v2_library_legacy_schema0_migration.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/legacy_library_migration.py)" = "$D07_CONVERTER_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_library_legacy_schema0_migration.py)" = "$D07_TEST_BLOB"
          test "$(git rev-parse HEAD:acs/acsdb.py)" = "$ACSDB_BLOB"
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "$PGN_BLOB"
          test "$(git rev-parse HEAD:acs/version2_upgrade.py)" = "$UPGRADE_BLOB"
          test "$(git rev-parse HEAD:acs/settings.py)" = "$SETTINGS_BLOB"
          if printf '%s\n' "$changed" | grep -E 'gametree.py|chesscore.py|teacher|classroom|education|chessbase|stage1_release_ui|version2_windows'; then
            echo 'Out-of-lane Product change detected' >&2
            exit 1
          fi
      - name: Compile bridge and dependencies
        run: >-
          python -m compileall -q
          acs/v1_runtime_bridge.py
          acs/legacy_library_migration.py
          tests/test_v1_runtime_bridge.py
          tests/test_v1_runtime_bridge_backup_path_security.py
          tests/test_v1_runtime_bridge_publication_atomicity.py
          tests/test_v2_library_legacy_schema0_migration.py
      - name: Focused bridge, converter, and upgrade regressions
        run: >-
          python -m unittest -v
          tests.test_v1_runtime_bridge
          tests.test_v1_runtime_bridge_backup_path_security
          tests.test_v1_runtime_bridge_publication_atomicity
          tests.test_v2_library_legacy_schema0_migration
          tests.test_v2_upgrade_publish_race_audit
          tests.test_v2_upgrade_tracked_writer_conflict
          tests.test_v2_upgrade_v6_successor
          tests.test_version2_upgrade
          tests.test_version2_upgrade_recovery_integrity
          tests.test_version2_upgrade_stale_writer
          tests.test_acsdb
      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v1_runtime_bridge.py
          tests/test_v1_runtime_bridge_backup_path_security.py
          tests/test_v1_runtime_bridge_publication_atomicity.py
          tests/test_v2_library_legacy_schema0_migration.py
          tests/test_v2_upgrade_publish_race_audit.py
          tests/test_v2_upgrade_tracked_writer_conflict.py

  broad-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
