name: Owner DOCX Win32 Portability

on:
  pull_request:
    paths:
      - 'scripts/build_owner_portable_candidate.py'
      - 'acs/version2_package_preflight.py'
      - 'acs/version2_portable_package.py'
      - 'tests/test_owner_docx_win32_portability.py'
      - 'tests/test_owner_portable_candidate_docx_binding.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/test_version2_portable_package.py'
      - '.github/workflows/owner-docx-win32-portability.yml'
  push:
    branches:
      - fix/owner-docx-win32-portability-20261004-j6vzuy
      - integration/owner-apex-docx-whole-product-20261004-ooxple7
      - converge/owner-apex-docx-bootstrap-generic-win32-20261004-c2mbezb
    paths:
      - 'scripts/build_owner_portable_candidate.py'
      - 'acs/version2_package_preflight.py'
      - 'acs/version2_portable_package.py'
      - 'tests/test_owner_docx_win32_portability.py'
      - 'tests/test_owner_portable_candidate_docx_binding.py'
      - 'tests/test_version2_package_preflight.py'
      - 'tests/test_version2_portable_package.py'
      - '.github/workflows/owner-docx-win32-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-docx-win32-portability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile owner DOCX portability surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_owner_portable_candidate.py \
            acs/version2_package_preflight.py \
            acs/version2_portable_package.py \
            tests/test_owner_docx_win32_portability.py \
            tests/test_owner_portable_candidate_docx_binding.py \
            tests/test_version2_package_preflight.py \
            tests/test_version2_portable_package.py
          echo 'OWNER_DOCX_WIN32_COMPILE=PASS'

      - name: Run focused owner DOCX portability regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_owner_docx_win32_portability \
            tests.test_owner_portable_candidate_docx_binding \
            tests.test_owner_portable_candidate \
            tests.test_version2_package_preflight.Version2PackagePreflightTests.test_relative_token_enforces_exact_win32_utf16_component_boundary \
            tests.test_version2_package_preflight.Version2PackagePreflightTests.test_relative_token_rejects_malformed_win32_unicode \
            tests.test_version2_package_preflight.Version2PackagePreflightTests.test_relative_token_rejects_extended_and_trimmed_win32_device_aliases \
            tests.test_version2_package_preflight.Version2PackagePreflightTests.test_zip_rejects_overlong_win32_component_before_readback \
            tests.test_version2_portable_package
          echo 'OWNER_DOCX_WIN32_PORTABILITY=PASS'

      - name: Guard release-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/build_owner_portable_candidate.py').read_text(encoding='utf-8')
          preflight = Path('acs/version2_package_preflight.py').read_text(encoding='utf-8')
          portable = Path('acs/version2_portable_package.py').read_text(encoding='utf-8')
          required = (
              '_owner_docx_filename',
              '_owner_docx_name',
              '_portable_docx_filename',
              'require_user_seed=True',
              'EXPECTED_SOURCE_WAV_COUNT',
          )
          for token in required:
              assert token in source, token
          for token in (
              '_portable_docx_filename',
              '_portable_docx_name',
              '_relative_token',
              'portable Word document filename',
          ):
              assert token in portable, token
          for forbidden in (
              '_WIN32_FORBIDDEN_FILENAME_CHARS',
              '_WIN32_RESERVED_DEVICE_NAMES',
          ):
              assert forbidden not in portable, forbidden
          for token in (
              'utf-16-le',
              '255 UTF-16 code-unit component limit',
              'CONIN$',
              'CONOUT$',
              'rstrip(" .")',
          ):
              assert token in preflight, token
          for forbidden in ('parse_pgn_text', 'chess.Board', 'python-chess'):
              assert forbidden not in source, forbidden
              assert forbidden not in preflight, forbidden
              assert forbidden not in portable, forbidden
          print('OWNER_DOCX_WIN32_AUTHORITY_BOUNDARY=PASS')
          PY
