name: Books Markdown Text Integrity

on:
  push:
    branches:
      - fix/books-markdown-heading-text-integrity-20260929
  pull_request:
    paths:
      - 'acs/book_text_import.py'
      - 'tests/test_v2_book_text_import.py'
      - '.github/workflows/book-markdown-heading-text-integrity.yml'

permissions:
  contents: read

env:
  CURRENT_PRODUCT_BASE: 9b8aaca12f4f33eb1c0e15ac057fbdd80039597d

jobs:
  markdown-heading-text-integrity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact checkout and bounded ownership
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin \
              "refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            upstream="$(git rev-parse "refs/remotes/origin/${{ github.base_ref }}")"
            event_base='${{ github.event.pull_request.base.sha }}'
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$upstream"
          else
            upstream="$CURRENT_PRODUCT_BASE"
          fi
          git cat-file -e "$upstream^{commit}"
          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD
          changed="$(git diff --name-only "$upstream" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/book-markdown-heading-text-integrity.yml' \
            '.github/workflows/v2-markdown-semantic-lists-convergence.yml' \
            'acs/book_text_import.py' \
            'tests/test_v2_book_text_import.py' | sort)"
          test "$changed" = "$expected"
          echo 'BOOK_MARKDOWN_HEADING_SCOPE=PASS'

      - name: Compile changed Books surface
        run: python -m compileall -q acs/book_text_import.py tests/test_v2_book_text_import.py

      - name: Focused Books and canonical chess regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_text_import
          tests.test_v2_book_game_content
          tests.test_bookdocument
          tests.test_bookreader
          tests.test_v2_book_progress_store
          tests.test_gametree
          tests.test_d06_pgn_roundtrip

      - name: Product selftest
        run: python -m acs.selftest
