name: PGN Concurrent Save Portable Oracle

on:
  pull_request:
    paths:
      - 'tests/test_pgn_concurrent_save.py'
      - '.github/workflows/pgn-concurrent-save-portable-oracle.yml'

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact Git bytes
        shell: bash
        run: git config core.autocrlf false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Prove exact QA-only ancestry, scope, and Product lock
        shell: bash
        env:
          D06_BASE: 3b98248107aa67929c9d608995d7da99969ac83a
          PGN_SERVICE_BLOB: 68f1029eddd462463ba244e193d2380f685ddb34
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$D06_BASE"
          git diff --check "$D06_BASE" HEAD
          changed="$(git diff --name-only "$D06_BASE" HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/pgn-concurrent-save-portable-oracle.yml\ntests/test_pgn_concurrent_save.py'
          git diff --quiet "$D06_BASE" HEAD -- acs
          test "$(git rev-parse HEAD:acs/pgn_service.py)" = "$PGN_SERVICE_BLOB"
          ! grep -En '/proc/self/fd|os\.readlink' tests/test_pgn_concurrent_save.py
      - name: Compile portable oracle
        run: python -m compileall -q tests/test_pgn_concurrent_save.py
      - name: Deterministic preflight-to-commit lost-update oracle
        run: python -m unittest -v tests.test_pgn_concurrent_save
      - name: D06 PGN and GameTree regression matrix
        run: >-
          python -m unittest -v
          tests.test_d06_pgn_roundtrip
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_gametree
          tests.test_gametree_export_validation
          tests.test_dev2_pgn_termination_semantics
          tests.test_gametree_navigation
          tests.test_gametree_editing
          tests.test_gametree_annotations
          tests.test_gametree_insertion
          tests.test_gametree_snapshot
          tests.test_pgn_service
      - name: Full unittest regression
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Full pytest except immutable inherited UI pair
        run: >-
          python -m pytest -q -k
          "not test_board_dispatch_uses_action_ids_instead_of_hardcoded_digit_shortcuts
          and not test_help_is_generated_from_live_rank_and_file_bindings"
      - name: Prove inherited UI pair is unchanged baseline evidence
        shell: bash
        env:
          D06_BASE: 3b98248107aa67929c9d608995d7da99969ac83a
        run: |
          set -euo pipefail
          git diff --quiet "$D06_BASE" HEAD -- web/index.html tests/test_board_rank_file_remapping_ui.py
          one='tests/test_board_rank_file_remapping_ui.py::test_board_dispatch_uses_action_ids_instead_of_hardcoded_digit_shortcuts'
          two='tests/test_board_rank_file_remapping_ui.py::test_help_is_generated_from_live_rank_and_file_bindings'
          set +e
          python -m pytest -q "$one" "$two" > "$RUNNER_TEMP/pgn-known-ui.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/pgn-known-ui.txt"
          test "$status" -eq 1
          grep -q '2 failed' "$RUNNER_TEMP/pgn-known-ui.txt"
      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
