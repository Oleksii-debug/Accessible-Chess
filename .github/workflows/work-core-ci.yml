name: Work Core CI

on:
  push:
    branches:
      - dev/canonical-interaction-contracts-20260819
  pull_request:
    branches:
      - integration/accessible-chess-next
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WORK_PYTHON_VERSION: '3.11.15'

jobs:
  core-verification:
    name: Raw head core verification
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout raw Work head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.WORK_PYTHON_VERSION }}

      - name: Install pinned verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/work-ci.txt

      - name: Record verification toolchain
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m pip check
          python -m pip freeze --all

      - name: Verify Work diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin integration/accessible-chess-next
          git diff --check FETCH_HEAD...HEAD

      - name: Compile reusable source and tests
        run: python -m compileall -q acs tests

      - name: Audit PositionState scalar boundary
        run: python -m unittest discover -s tests -p 'test_position_editor.py' -v

      - name: Architecture dependency gate
        run: python -m unittest discover -s tests -p 'test_architecture.py' -v

      - name: Interaction schema and routing contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_interaction_contracts.py' -v
          python -m unittest discover -s tests -p 'test_interaction_router.py' -v
          python -m unittest discover -s tests -p 'test_interaction_schema_contract.py' -v

      - name: Full unittest discovery
        run: python -m unittest discover -s tests -v

  repository-pytest:
    name: Raw head full pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout raw Work head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.WORK_PYTHON_VERSION }}

      - name: Install pinned verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/work-ci.txt

      - name: Record verification toolchain
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m pip check
          python -m pip freeze --all

      - name: Full pytest without test weakening
        run: python -m pytest -q

  integration-merge-ref:
    name: PR merge-ref integration smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout GitHub PR merge ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.WORK_PYTHON_VERSION }}

      - name: Install pinned verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/work-ci.txt

      - name: Record verification toolchain
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          python -m pip check
          python -m pip freeze --all

      - name: Compile merge-ref source and tests
        run: python -m compileall -q acs tests

      - name: Merge-ref full unittest discovery
        run: python -m unittest discover -s tests -v
