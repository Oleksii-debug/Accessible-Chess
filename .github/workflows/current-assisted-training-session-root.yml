name: Current Assisted Training Session Root

on:
  pull_request:
    branches:
      - fix/current-book-engine-block-after-fen-bounds-20261004-sol58c1
    paths:
      - 'acs/engine_assisted_workflows.py'
      - 'tests/test_current_assisted_training_session_root.py'
      - '.github/workflows/current-assisted-training-session-root.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-assisted-training-session-root-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and Training-root scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          base_ref="${EVENT_BASE_REF:-fix/current-book-engine-block-after-fen-bounds-20261004-sol58c1}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD

          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-assisted-training-session-root.yml' \
            'acs/engine_assisted_workflows.py' \
            'tests/test_current_assisted_training_session_root.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected assisted Training-root scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Training authority boundary
        run: >-
          python -m compileall -q
          acs/engine_assisted_workflows.py
          tests/test_current_assisted_training_session_root.py

      - name: Execute Training and retained engine regressions
        run: >-
          python -m unittest -v
          tests.test_current_assisted_training_session_root
          tests.test_book_engine_authority_passive_ingress
          tests.test_current_engine_fen_passive_bounds
          tests.test_dev3_engine_assisted_workflows
          tests.test_analysis_service
          tests.test_v2_book_board_workflow

      - name: Core selftest
        run: python -m acs.selftest
