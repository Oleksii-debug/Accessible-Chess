name: V2 PGN Streaming Source Binding

on:
  push:
    branches:
      - work/v2-pgn-stream-source-binding-20260907
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/pgn_streaming_import.py'
      - 'tests/test_pgn_stream_source_binding.py'
      - '.github/workflows/v2-pgn-stream-source-binding.yml'

permissions:
  contents: read

concurrency:
  group: v2-pgn-stream-source-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact current base ancestry and narrow scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=169136979b141aa3844ffe7ed10d96290a6b7726
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE" HEAD
          changed="$(git diff --name-only "$BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-pgn-stream-source-binding.yml' \
            'acs/pgn_streaming_import.py' \
            'tests/test_pgn_stream_source_binding.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$BASE" HEAD -- \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            acs/library_import_service.py \
            acs/acsdb.py \
            acs/chesscore.py \
            acs/version2_windows_file_workflows.py \
            acs/version2_application.py \
            web

      - name: Compile source-binding package
        run: >-
          python -m py_compile
          acs/pgn_streaming_import.py
          tests/test_pgn_stream_source_binding.py

      - name: Focused D06 and D07 regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_stream_source_binding
          tests.test_pgn_streaming_import
          tests.test_d06_pgn_roundtrip
          tests.test_d07_library_import_service
          tests.test_d07_library_import_transaction_ownership

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: Selftest and diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
