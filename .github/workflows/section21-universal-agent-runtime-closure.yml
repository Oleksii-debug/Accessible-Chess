name: Section 21 Universal Agent Runtime Closure

on:
  pull_request:
    branches:
      - work/media-agent-crossrepo-intake-20261005
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section21-universal-agent-runtime-closure-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Section 21 whole contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact repair candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove immutable Agent ancestry and bounded repair scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SECTION21_ACCEPTED: 95554150c8a7920021053a0f66c57a7bcb8a836f
          SECTION21_MERGE: 12b9094faad983db5d242d6ec485a4883f71cd6a
          SECTION22_MERGE: 92b9b6af16977c301e1a5c69b908bc7aa478262a
          CURRENT_AGENT: 59eedf4e33de0565d0ad47d11206b6743dd3bff8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          for sha in "$SECTION21_ACCEPTED" "$SECTION21_MERGE" "$SECTION22_MERGE" "$CURRENT_AGENT"; do
            git cat-file -e "$sha^{commit}"
          done
          git merge-base --is-ancestor "$SECTION21_MERGE" HEAD
          git merge-base --is-ancestor "$SECTION22_MERGE" HEAD
          git merge-base --is-ancestor "$CURRENT_AGENT" HEAD
          test "$(git merge-base "$CURRENT_AGENT" HEAD)" = "$CURRENT_AGENT"
          git diff --quiet "$SECTION21_ACCEPTED" "$SECTION21_MERGE"
          git diff --check "$CURRENT_AGENT"...HEAD
          changed="$(git diff --name-only "$CURRENT_AGENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n'             '.github/workflows/section21-universal-agent-runtime-closure.yml'             '.github/workflows/section22-agent-domain-tools-closure.yml'             '.github/workflows/sections23-24-agent-closure.yml' 'tests/test_agent_format_capabilities.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'UNEXPECTED_AGENT_CLOSURE_REPAIR_SCOPE\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install exact test dependencies
        run: python -m pip install pytest==8.4.2 httpx==0.28.1

      - name: Compile Section 21 authority and focused tests
        run: >-
          python -m compileall -q
          acs/universal_chess_agent.py
          acs/agent_tools.py
          acs/agent_model_gateway.py
          acs/agent_model_contracts.py
          acs/agent_checkpoint.py
          acs/agent_retry.py
          acs/agent_task_state.py
          acs/agent_verification.py
          acs/agent_budget.py
          acs/agent_resource_budget.py
          acs/agent_ollama_provider.py
          acs/chess_agent_tools.py
          tests/test_agent_model_response_authority.py
          tests/test_agent_protocol_json_safety.py
          tests/test_crossrepo_runtime_integration.py
          tests/test_universal_chess_agent_crossrepo.py
          tests/test_agent_checkpoint_crossrepo.py
          tests/test_agent_retry_crossrepo.py
          tests/test_chess_agent_tools_crossrepo.py
          tests/test_agent_tool_result_authority.py
          tests/test_agent_model_cost_effect_accounting.py
          tests/test_section21_ollama_provider.py
          tests/test_section21_architecture.py
          tests/test_media_agent_intake_convergence_20261005.py
          tests/test_media_agent_safety_primitives_20261005.py

      - name: Execute Section 21 whole contract
        run: >-
          python -m pytest -q
          tests/test_agent_model_response_authority.py
          tests/test_agent_protocol_json_safety.py
          tests/test_crossrepo_runtime_integration.py
          tests/test_universal_chess_agent_crossrepo.py
          tests/test_agent_checkpoint_crossrepo.py
          tests/test_agent_retry_crossrepo.py
          tests/test_chess_agent_tools_crossrepo.py
          tests/test_agent_tool_result_authority.py
          tests/test_agent_model_cost_effect_accounting.py
          tests/test_section21_ollama_provider.py
          tests/test_section21_architecture.py
          tests/test_media_agent_intake_convergence_20261005.py
          tests/test_media_agent_safety_primitives_20261005.py

      - name: Core selftest
        run: python -m acs.selftest
