name: Section 28 Terminal Closure

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'docs/automation/SECTION28_TERMINAL_CLOSURE.md'
      - '.github/workflows/section28-terminal-closure.yml'
      - 'acs/classroom_domain.py'
      - 'acs/child_coaching*.py'
      - 'acs/classroom_pairing.py'
      - 'acs/classroom_prepared_position_deployment.py'
      - 'acs/education_*.py'
      - 'acs/student_progress.py'
      - 'tests/test_child_coaching*.py'
      - 'tests/test_classroom_pairing.py'
      - 'tests/test_classroom_prepared_position_deployment.py'
      - 'tests/test_education_*.py'
      - 'tests/test_dev3_student_progress.py'
      - 'tests/test_version2_prepared_child_lesson_binding.py'
      - 'tests/test_student_progress_final_product_binding.py'
      - 'tests/test_version2_group_rotation_binding.py'
      - 'tests/test_full_product_education_keybindings.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section28:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CLASSROOM_BLOB: 99f4683e3a0dc272e6e88bb5fccec8bd4a157a5c
      CHILD_BLOB: 0d9bc76db6ddb0bc943a4569361859ba8ba0ac6a
      CHILD_PROJECTION_BLOB: 48b71553685e05be435388a31b44b8df2aeb5dc1
      CHILD_CONTEXT_BLOB: 890fcc1d6cd57c1555e02a435d835d1d3fc75c4d
      CHILD_POSITIONS_BLOB: 060fb8cee23c7fe22465208268b4b8fef5760d14
      PAIRING_BLOB: fee36f2029759d0c948c58cd3ca37ac20bbb0be4
      DEPLOYMENT_BLOB: d760cf1a6c7e900fdc1f607c6bc4524510198948
      EDUCATION_WORKSPACE_BLOB: 0288d1895472b9e4ead9389e910ffcdf872019e0
      EDUCATION_RECORDS_BLOB: 6f42c311357731e0ecc812973f6cb48339fc8fc5
      EDUCATION_PROGRESS_TX_BLOB: 5d3f3b86684ab02bfa578af9c8a6ccac084fa66e
      EDUCATION_PROGRESS_LIFECYCLE_BLOB: 7bb318f40ad58aab23f696abd0012e62544e072e
      STUDENT_PROGRESS_BLOB: a470afdaff99413a1163e52192a0f12ee8b54671
      CHILD_TEST_BLOB: 8b1c4686d94ff8c234123ef905e0e4144a5f2a4e
      CHILD_PROJECTION_TEST_BLOB: d3de779725cf54c100675098a22fd41330d5d790
      PAIRING_TEST_BLOB: dfe1e5aa3676b9ca966d3d93a60f98b554b8b281
      EDUCATION_RECORDS_TEST_BLOB: d850eb75104e5710075202341f85da4524b729d8
      EDUCATION_WORKSPACE_TEST_BLOB: 2c24f9d43744a37b6ee8df15442a79e329653968
      STUDENT_PROGRESS_TEST_BLOB: 41efaa9a52a871aad405238a327fdda86b70d67a
      CHILD_KEYBOARD_TEST_BLOB: 0e208bd15c0ba51d450718af9e53690d605a1e07
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove frozen Section 28 authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object acs/classroom_domain.py)" = "$CLASSROOM_BLOB"
          test "$(git hash-object acs/child_coaching.py)" = "$CHILD_BLOB"
          test "$(git hash-object acs/child_coaching_projection.py)" = "$CHILD_PROJECTION_BLOB"
          test "$(git hash-object acs/child_coaching_context.py)" = "$CHILD_CONTEXT_BLOB"
          test "$(git hash-object acs/child_coaching_prepared_positions.py)" = "$CHILD_POSITIONS_BLOB"
          test "$(git hash-object acs/classroom_pairing.py)" = "$PAIRING_BLOB"
          test "$(git hash-object acs/classroom_prepared_position_deployment.py)" = "$DEPLOYMENT_BLOB"
          test "$(git hash-object acs/education_workspace.py)" = "$EDUCATION_WORKSPACE_BLOB"
          test "$(git hash-object acs/education_records.py)" = "$EDUCATION_RECORDS_BLOB"
          test "$(git hash-object acs/education_progress_transaction.py)" = "$EDUCATION_PROGRESS_TX_BLOB"
          test "$(git hash-object acs/education_progress_lifecycle.py)" = "$EDUCATION_PROGRESS_LIFECYCLE_BLOB"
          test "$(git hash-object acs/student_progress.py)" = "$STUDENT_PROGRESS_BLOB"
          test "$(git hash-object tests/test_child_coaching.py)" = "$CHILD_TEST_BLOB"
          test "$(git hash-object tests/test_child_coaching_projection.py)" = "$CHILD_PROJECTION_TEST_BLOB"
          test "$(git hash-object tests/test_classroom_pairing.py)" = "$PAIRING_TEST_BLOB"
          test "$(git hash-object tests/test_education_records.py)" = "$EDUCATION_RECORDS_TEST_BLOB"
          test "$(git hash-object tests/test_education_workspace.py)" = "$EDUCATION_WORKSPACE_TEST_BLOB"
          test "$(git hash-object tests/test_dev3_student_progress.py)" = "$STUDENT_PROGRESS_TEST_BLOB"
          test "$(git hash-object tests/test_child_coaching_keyboard_actions.py)" = "$CHILD_KEYBOARD_TEST_BLOB"
          git diff --check

      - name: Compile Section 28 boundary
        run: >-
          python -m py_compile
          acs/classroom_domain.py
          acs/child_coaching.py
          acs/child_coaching_projection.py
          acs/child_coaching_context.py
          acs/child_coaching_prepared_positions.py
          acs/classroom_pairing.py
          acs/classroom_prepared_position_deployment.py
          acs/education_workspace.py
          acs/education_records.py
          acs/education_progress_transaction.py
          acs/education_progress_lifecycle.py
          acs/student_progress.py

      - name: Run Section 28 focused regressions
        run: >-
          python -m unittest -v
          tests.test_child_coaching
          tests.test_child_coaching_projection
          tests.test_child_coaching_context
          tests.test_child_coaching_prepared_positions
          tests.test_classroom_pairing
          tests.test_classroom_prepared_position_deployment
          tests.test_education_records
          tests.test_education_workspace
          tests.test_dev3_student_progress
          tests.test_education_create_resume_journey
          tests.test_version2_prepared_child_lesson_binding
          tests.test_student_progress_final_product_binding
          tests.test_version2_group_rotation_binding
          tests.test_child_coaching_keyboard_actions
          tests.test_full_product_education_keybindings

      - name: Core selftest
        run: python -m acs.selftest
