name: Child Coaching Current Apex

on:
  push:
    branches:
      - converge/child-coaching-current-apex-20261004-sol56
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: child-coaching-current-apex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  child-coaching-current-apex:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Prove exact parent, scope and canonical child-coaching blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^)" = "39b30d6c39a96f884dde5898605740e8d3a13fe8"
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/child-coaching-current-apex-20261004.yml",
              "acs/child_coaching.py",
              "acs/child_coaching_store.py",
              "acs/child_coaching_application.py",
              "acs/child_coaching_projection.py",
              "acs/child_coaching_rotation.py",
              "acs/child_coaching_rotation_store.py",
              "acs/child_coaching_prepared_positions.py",
              "tests/test_child_coaching.py",
              "tests/test_child_coaching_application.py",
              "tests/test_child_coaching_projection.py",
              "tests/test_child_coaching_rotation.py",
              "tests/test_child_coaching_prepared_positions.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "39b30d6c39a96f884dde5898605740e8d3a13fe8", "HEAD"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected child-coaching scope: {sorted(actual ^ expected)}")

          canonical = {
              "acs/child_coaching.py": "8330b42d7a6684c9b1bfa6ca5badebe0bb07fcfa",
              "acs/child_coaching_store.py": "73e4f981efef1bdabf34acc99cc59c9659650469",
              "acs/child_coaching_application.py": "d7b1ae384311514f93c64e4d68f98e6d570d51c1",
              "acs/child_coaching_projection.py": "48b71553685e05be435388a31b44b8df2aeb5dc1",
              "acs/child_coaching_rotation.py": "7fe9da7f1d687f4976c3b4a50652c4c4fa830633",
              "acs/child_coaching_rotation_store.py": "ed37f58f74bab1c990990b65ce2443268c576262",
              "acs/child_coaching_prepared_positions.py": "060fb8cee23c7fe22465208268b4b8fef5760d14",
              "tests/test_child_coaching.py": "8b1c4686d94ff8c234123ef905e0e4144a5f2a4e",
              "tests/test_child_coaching_application.py": "a59dfaa0055f156b64ddd9e22704bf3d1814b9c5",
              "tests/test_child_coaching_projection.py": "d3de779725cf54c100675098a22fd41330d5d790",
              "tests/test_child_coaching_rotation.py": "8251084341a7a494cabc35a2f72cd743f6a50bff",
              "tests/test_child_coaching_prepared_positions.py": "6999fca59274c9e1afd7159bab23e544ca6614a7",
          }
          for path, expected_sha in canonical.items():
              actual_sha = subprocess.check_output(
                  ["git", "hash-object", path], text=True
              ).strip()
              if actual_sha != expected_sha:
                  raise SystemExit(f"canonical child-coaching blob drift: {path} {actual_sha}")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile child-coaching boundary
        run: >-
          python -m py_compile
          acs/child_coaching.py
          acs/child_coaching_store.py
          acs/child_coaching_application.py
          acs/child_coaching_projection.py
          acs/child_coaching_rotation.py
          acs/child_coaching_rotation_store.py
          acs/child_coaching_prepared_positions.py
          tests/test_child_coaching.py
          tests/test_child_coaching_application.py
          tests/test_child_coaching_projection.py
          tests/test_child_coaching_rotation.py
          tests/test_child_coaching_prepared_positions.py

      - name: Run child-coaching contracts
        run: >-
          python -m unittest -v
          tests.test_child_coaching
          tests.test_child_coaching_application
          tests.test_child_coaching_projection
          tests.test_child_coaching_rotation
          tests.test_child_coaching_prepared_positions

      - name: Run adjacent teaching and D10 authority contracts
        run: >-
          python -m unittest -v
          tests.test_teaching_session
          tests.test_education_records
          tests.test_education_workspace
