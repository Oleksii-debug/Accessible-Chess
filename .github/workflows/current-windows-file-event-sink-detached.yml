name: Current Windows File Event Sink Detached

on:
  push:
    branches:
      - fix/windows-file-event-sink-detached-20261006-hy6ez0h
  pull_request:
    branches:
      - fix/windows-file-terminal-logging-passive-20261006-hy6ez0h
    paths:
      - acs/version2_windows_file_workflows.py
      - tests/test_v2_windows_file_logging_passive.py
      - .github/workflows/current-windows-file-event-sink-detached.yml

permissions:
  contents: read

concurrency:
  group: current-windows-file-event-sink-detached-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_PARENT: a516e2db018e537c128c73106e094ee324eb2bce
  PARENT_BRANCH: fix/windows-file-terminal-logging-passive-20261006-hy6ez0h
  EXPECTED_WINDOWS_FILE_SOURCE_BLOB: 2414b31007559dd79a0ee5c535887ba09efe5536
  EXPECTED_LOGGING_TEST_BLOB: 4e29312ce67c1c7b782227903776e8aef6d28a0e
  EXPECTED_PROGRESS_TEST_BLOB: 3df204688c9c73c195f65d5ae12f2e79612f1fed

jobs:
  detached-event-sink:
    name: Detached file event sink / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact event-sink child
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_head"

          git fetch --no-tags origin "+refs/heads/$PARENT_BRANCH:refs/remotes/origin/event-sink-parent"
          live_parent="$(git rev-parse refs/remotes/origin/event-sink-parent)"
          test "$live_parent" = "$EXPECTED_PARENT" || {
            echo "EVENT_SINK_PARENT_MOVED expected=$EXPECTED_PARENT live=$live_parent" >&2
            exit 1
          }

          git merge-base --is-ancestor "$EXPECTED_PARENT" HEAD
          test "$(git merge-base "$EXPECTED_PARENT" HEAD)" = "$EXPECTED_PARENT"
          git diff --check "$EXPECTED_PARENT"...HEAD

          mapfile -t paths < <(git diff --name-only "$EXPECTED_PARENT"...HEAD | sort)
          printf '%s\n' "${paths[@]}"
          expected=(
            ".github/workflows/current-windows-file-event-sink-detached.yml"
            "acs/version2_windows_file_workflows.py"
            "tests/test_v2_windows_file_logging_passive.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${paths[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$EXPECTED_WINDOWS_FILE_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_file_logging_passive.py)" = "$EXPECTED_LOGGING_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_import_progress_coherence.py)" = "$EXPECTED_PROGRESS_TEST_BLOB"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile current Windows file stack
        run: >-
          python -m py_compile
          acs/version2_windows_file_workflows.py
          tests/test_v2_windows_file_logging_passive.py
          tests/test_v2_windows_import_progress_coherence.py
          tests/test_v2_windows_file_worker_shutdown_fence.py
          tests/test_v2_windows_nvda_file_workflows.py

      - name: Run event-sink, trace, shutdown and NVDA regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_file_logging_passive
          tests.test_v2_windows_import_progress_coherence
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
