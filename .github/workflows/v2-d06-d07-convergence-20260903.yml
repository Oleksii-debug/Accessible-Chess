name: V2 D06-D07 Direct Convergence

on:
  push:
    branches:
      - integration/v2-d06-d07-convergence-20260903
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-d06-d07-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-convergence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      D07_SOURCE: 47750f4a1ad452e6b9b8811afaa3cc699bde4ea8
      D06_SOURCE: 23956a6698ca07e65cb616e755fc934ec8842bce
      COMPOSED_BASE: bf81ced6239a1d1aa93e68dcdfcea6c6ac9b5e83
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact committed bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py
          test "$(git hash-object acs/stage1_release_ui_core.py)" = "b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6"
          test "$(git hash-object acs/webapp_keymap_core.py)" = "0ba06f548d39dad7372e0339b3e121fd1717cc05"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2 zstandard==0.23.0

      - name: Prove exact two-parent convergence and CI-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$D07_SOURCE" HEAD
          git merge-base --is-ancestor "$D06_SOURCE" HEAD
          git merge-base --is-ancestor "$COMPOSED_BASE" HEAD
          git diff --check "$COMPOSED_BASE" HEAD
          changed="$(git diff --name-only "$COMPOSED_BASE" HEAD | sort)"
          expected='.github/workflows/v2-d06-d07-convergence-20260903.yml'
          test "$changed" = "$expected"
          git diff --quiet "$COMPOSED_BASE" HEAD -- acs tests scripts tools web

      - name: Compile direct composed runtime
        run: >-
          python -m py_compile
          acs/gametree.py
          acs/pgn_roundtrip.py
          acs/pgn_streaming_import.py
          acs/acsdb.py
          acs/search_policy.py
          acs/search_service.py
          scripts/v2_real_lichess_streaming_v6_oracle.py

      - name: Focused D06 plus D07 regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_streaming_import
          tests.test_v2_pgn_nested_comment_recovery
          tests.test_v2_pgn_semantic_fidelity
          tests.test_d06_pgn_roundtrip
          tests.test_gametree
          tests.test_d07_library_import_service
          tests.test_d07_library_import_transaction_ownership
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_date_filter_v5
          tests.test_v2_library_integrity_repair
          tests.test_v2_library_search_service_v4

      - name: Direct lawful 10000 plus Unicode Library-v6 journey
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.v2_real_lichess_streaming_v6_oracle 2>&1 | tee direct-d06-d07-real.log
          grep -F '"status": "PASS"' direct-d06-d07-real.log
          grep -F '"standard_games": 10000' direct-d06-d07-real.log
          grep -F '"schema": 6' direct-d06-d07-real.log

      - name: Full repository unittest
        if: always()
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        if: always()
        run: python -m pytest -q tests

      - name: Selftest and complete diagnostic
        if: always()
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Upload direct convergence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-d06-d07-direct-${{ matrix.os }}
          path: |
            real-lichess-acsdb-v6-summary.json
            direct-d06-d07-real.log
          if-no-files-found: warn
          retention-days: 14

      - name: Prove no Product or corpus residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f real-lichess-acsdb-v6-summary.json direct-d06-d07-real.log
          if ! git diff --quiet --ignore-cr-at-eol HEAD; then
            git diff --name-status --ignore-cr-at-eol HEAD
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf '%s\n' "$untracked"
            exit 1
          fi
