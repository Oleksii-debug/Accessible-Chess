name: PGN GameTree Structural Fuzz

on:
  pull_request:
    paths:
      - 'scripts/pgn_gametree_structural_fuzz.py'
      - '.github/workflows/pgn-gametree-structural-fuzz.yml'

permissions:
  contents: read

concurrency:
  group: pgn-gametree-structural-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  PGN04_BASE: d706eb93b9a4df3c6e99ab1af584a9cfe6b6f5ea

jobs:
  structural-fuzz:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned QA dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact D06 base and evidence-only scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PGN04_BASE^{commit}"
          test "$(git merge-base HEAD "$PGN04_BASE")" = "$PGN04_BASE"
          git diff --check "$PGN04_BASE" HEAD
          changed="$(git diff --name-only "$PGN04_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/pgn-gametree-structural-fuzz.yml' \
            'scripts/pgn_gametree_structural_fuzz.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$PGN04_BASE" HEAD -- acs tests web run_accessible_chess.py
          test "$(git rev-parse HEAD:acs/gametree_editing.py)" = "74e4ed4f7178277c2c8ede1c2027d96d79fa26ed"
          test "$(git rev-parse HEAD:acs/gametree_insertion.py)" = "81d27cb0aa580198c80f4883e263b507aab5316d"
          test "$(git rev-parse HEAD:acs/gametree_navigation.py)" = "6209c29382105153ae4b22d4d70f9675a931826d"
          test "$(git rev-parse HEAD:acs/pgn_workspace.py)" = "346f31f828191e76d57b372bb6c84a4a90568594"
          echo 'PGN-04 EVIDENCE-ONLY SCOPE PASS'

      - name: Compile and self-test oracle
        run: |
          python -m py_compile scripts/pgn_gametree_structural_fuzz.py
          python -m scripts.pgn_gametree_structural_fuzz --selftest

      - name: Focused GameTree editing/navigation regressions
        run: >-
          python -m unittest -v
          tests.test_gametree
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_pgn_workspace
          tests.test_d06_pgn_roundtrip

      - name: Deterministic structural fuzz and complete cursor-remap oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.pgn_gametree_structural_fuzz --seeds 24 --steps 24 2>&1 | tee pgn04-structural-fuzz-report.txt
          grep -F '"operations_total": 576' pgn04-structural-fuzz-report.txt
          grep -F '"product_mutation": "NONE"' pgn04-structural-fuzz-report.txt
          grep -F 'PGN-04 GAMETREE STRUCTURAL FUZZ PASS' pgn04-structural-fuzz-report.txt

      - name: Upload structural fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgn04-structural-fuzz-${{ matrix.os }}
          path: pgn04-structural-fuzz-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Full repository unittest
        run: python -m unittest discover -s tests

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
