name: D01 PGN Workspace WebView

on:
  pull_request:
    paths:
      - 'acs/full_product_actions.py'
      - 'acs/pgn_webview_bridge.py'
      - 'acs/pgn_webview_projection.py'
      - 'acs/pgn_workspace_webview_adapter.py'
      - 'acs/pgn_workspace.py'
      - 'tests/js/pgn_surface_dom_test.js'
      - 'tests/test_dev1_pgn_webview_atomicity.py'
      - 'tests/test_dev1_pgn_webview_projection.py'
      - 'tests/test_dev1_pgn_workspace_webview_adapter.py'
      - 'web/full_product_pgn.js'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d01-pgn-workspace-webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      D01_FEATURE: 76d20f9ce3f24120935a8f122ce0c8e0b6e4fb64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove D01 ancestry and integration-safe scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$D01_FEATURE^{commit}"
          git merge-base --is-ancestor "$D01_FEATURE" HEAD
          git diff --check "$D01_FEATURE" HEAD
          changed="$(git diff --name-only "$D01_FEATURE" HEAD | sort)"
          if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict|release_preflight|^acs/stage1_release_ui(_core)?\.py$'; then
            echo 'Frozen Stage 1 / strict-release contamination detected' >&2
            exit 1
          fi

      - name: Compile and parse current PGN presentation
        run: |
          python -m compileall -q acs/full_product_actions.py acs/pgn_webview_projection.py acs/pgn_webview_bridge.py acs/pgn_workspace.py acs/pgn_workspace_webview_adapter.py tests/test_dev1_pgn_webview_projection.py tests/test_dev1_pgn_webview_atomicity.py tests/test_dev1_pgn_workspace_webview_adapter.py
          node --check web/full_product_pgn.js
          node --check tests/js/pgn_surface_dom_test.js
          node tests/js/pgn_surface_dom_test.js

      - name: Current integrated PGN focused regressions
        run: >-
          python -m unittest -v
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_webview_atomicity
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_full_product_webview_adapter
          tests.test_pgn_workspace
          tests.test_gametree
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_d06_pgn_roundtrip
          tests.test_pgn_service
          tests.test_pgn_concurrent_save
          tests.test_whole_product_user_journey
          tests.test_keybindings

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
