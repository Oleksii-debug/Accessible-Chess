name: Owner Gameplay Feedback
on:
  push:
    branches: [fix/owner-keyboard-gameplay-20261005]
  pull_request:
    paths:
      - 'acs/webapp.py'
      - 'acs/stage1_release_ui.py'
      - 'acs/settings.py'
      - 'acs/library_webview_projection.py'
      - 'acs/version2_upgrade_status_release.py'
      - 'web/index.html'
      - 'web/stage1_release_bootstrap.js'
      - 'web/version2*bootstrap.js'
      - 'web/full_product_library.js'
      - 'tests/test_owner_gameplay*.py'
      - 'tests/js/owner*test.js'
      - '.github/workflows/owner-gameplay-feedback.yml'
permissions:
  contents: read
concurrency:
  group: owner-gameplay-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  gameplay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Gameplay, persistence and actual WAV delivery
        run: >-
          python -m unittest -v
          tests.test_owner_gameplay_feedback
          tests.test_owner_gameplay_wav_delivery
          tests.test_v2_windows_upgrade_status_shipping
          tests.test_settings tests.test_move_entry tests.test_notation
          tests.test_sound_runtime tests.test_sound_events
          tests.test_dev3_sound_failure_isolation
          tests.test_dev1_release_ui_regressions
          tests.test_dev1_library_webview_projection
          tests.test_whole_product_user_journey
          tests.test_version2_release_ui
          tests.test_v2_board_analysis_hotkey_feedback
      - name: Keyboard, late bridge and Library DOM behavior
        run: |
          node tests/js/owner_gameplay_keyboard_test.js
          node tests/js/owner_sound_bridge_ready_test.js
          node tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/library_surface_dom_test.js
          node tests/js/stage1_core_language_test.js
          node tests/js/remappable_input_submit_keys_current_test.js
      - name: Production composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic
      - name: Syntax
        run: |
          python -m compileall -q acs
          node --check web/stage1_release_bootstrap.js
          node --check web/version2_release_bootstrap.js
          node --check web/version2_final_product_bootstrap.js
          node --check web/full_product_library.js
