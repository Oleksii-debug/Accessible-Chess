name: V2 Library ACSDB Search V4

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-library-search-v4:
    name: Validate library/search v4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      CURRENT_PRODUCT_BASE: 4b74943e6f322f7f6e02a8b92cc7daba2add26a3

    steps:
      - name: Checkout PR head exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout immutable current-product ACSDB fixture
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${CURRENT_PRODUCT_BASE}"
          git checkout "${CURRENT_PRODUCT_BASE}" -- acs/acsdb.py
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if ! git diff --quiet -- acs/acsdb.py; then
            git diff --exit-code "${CURRENT_PRODUCT_BASE}" -- acs/acsdb.py
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test tooling
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate current-product identity + deterministic 100k responsiveness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --exit-code "${CURRENT_PRODUCT_BASE}" -- acs/acsdb.py
          python -m py_compile acs/acsdb.py tools/v2_library_acsdb_search_v4_benchmark.py
          python -m tools.v2_library_acsdb_search_v4_benchmark --rows 100000
