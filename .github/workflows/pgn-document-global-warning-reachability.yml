name: PGN Document Global Warning Reachability

on:
  pull_request:
    branches:
      - converge/pgn-position-current-books-20261003
    paths:
      - 'acs/pgn_document_webview_projection.py'
      - 'acs/version2_application.py'
      - 'tests/test_pgn_document_warning_reachability.py'
      - '.github/workflows/pgn-document-global-warning-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-document-global-warning-reachability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-warning-reachability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      STACK_PARENT_SHA: bdee46155a550edf5b9855405fcfa6f0c812711f
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked parent and bounded child scope
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            test "$PR_BASE_SHA" = "$STACK_PARENT_SHA"
          fi

          git fetch --no-tags origin converge/pgn-position-current-books-20261003
          live_parent="$(git rev-parse refs/remotes/origin/converge/pgn-position-current-books-20261003)"
          test "$live_parent" = "$STACK_PARENT_SHA"
          git merge-base --is-ancestor "$STACK_PARENT_SHA" HEAD
          git diff --check "$STACK_PARENT_SHA" HEAD

          mapfile -t actual < <(git diff --name-only "$STACK_PARENT_SHA" HEAD | LC_ALL=C sort)
          expected_paths=(
            '.github/workflows/pgn-document-global-warning-reachability.yml'
            'acs/pgn_document_webview_projection.py'
            'acs/version2_application.py'
            'tests/test_pgn_document_warning_reachability.py'
          )
          mapfile -t wanted < <(printf '%s\n' "${expected_paths[@]}" | LC_ALL=C sort)
          test "${actual[*]}" = "${wanted[*]}"

      - name: Lock canonical PGN parser, workspace and presentation authorities
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Protected blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/pgn_document.py=e967712503a2b96d5878f74b257da6fc4a852ad4
          acs/pgn_webview_projection.py=e054f12da2bbaa580669ec5854d3acf725f91bf3
          acs/pgn_workspace_webview_adapter.py=4343fa698f7503cf257218868aa927b099ddf21b
          acs/pgn_webview_bridge.py=c8f108c8dcc01c37503833abb5c626d89093145e
          acs/version2_pgn_commands.py=ad2cb1879868c73729d4895f229b3bd63245b288
          acs/version2_release_ui.py=e7ada401a4ef9c19ae78605c8bd8d75dcbc3039d
          web/full_product_pgn.js=947319b17b4dda179bb2393a6194e2d2a8960220
          LOCKS

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile child composition
        run: >-
          python -m py_compile
          acs/pgn_document_webview_projection.py
          acs/version2_application.py
          tests/test_pgn_document_warning_reachability.py

      - name: Run focused warning and PGN presentation contracts
        run: >-
          python -m unittest -v
          tests.test_pgn_document_warning_reachability
          tests.test_pgn_document
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_dev1_pgn_webview_projection
          tests.test_pgn_position_new_document_reachability
          tests.test_w6_v2_language_owner_current

      - name: Run adjacent V2 application contract
        run: python -m unittest -v tests.test_version2_application

      - name: Run core selftest
        run: python -m acs.selftest
