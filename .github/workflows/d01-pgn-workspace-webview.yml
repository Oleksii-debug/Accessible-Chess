name: D01 PGN Workspace WebView

on:
  pull_request:
    paths:
      - 'acs/full_product_presenters.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_ui_shell.py'
      - 'acs/keybindings.py'
      - 'acs/ui_native_menu.py'
      - 'acs/stage1_release_ui.py'
      - 'acs/stage1_release_ui_core.py'
      - 'acs/pgn_workspace.py'
      - 'tests/test_pgn_workspace.py'
      - 'acs/pgn_webview_bridge.py'
      - 'acs/pgn_webview_projection.py'
      - 'acs/pgn_workspace_webview_adapter.py'
      - 'acs/version2_application.py'
      - 'acs/version2_pgn_commands.py'
      - 'tests/js/pgn_surface_dom_test.js'
      - 'tests/js/toolbar_keymap_test_support.js'
      - 'tests/js/pgn_tree_keyboard_dom_test.js'
      - 'tests/js/pgn_remaining_keybindings_test.js'
      - 'tests/test_pgn_tree_remaining_keybindings.py'
      - 'tests/test_pgn_browser_presentation_lease_required.py'
      - 'tests/test_version2_pgn_commands.py'
      - 'tests/test_dev1_pgn_webview_atomicity.py'
      - 'tests/test_dev1_pgn_webview_projection.py'
      - 'tests/test_dev1_pgn_workspace_webview_adapter.py'
      - 'tests/test_v2_board_analysis_hotkey_feedback.py'
      - 'tests/test_d01_current_stage1_core_gate.py'
      - 'web/full_product_pgn.js'
      - 'web/index.html'
      - 'run_accessible_chess.py'
      - '.github/workflows/d01-pgn-workspace-webview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d01-pgn-workspace-webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      D01_BASE: 37204866a2bb4ee7b0a936842fa70e4eb8cdf16d
      D01_FEATURE: 76d20f9ce3f24120935a8f122ce0c8e0b6e4fb64
      P1_PARENT: fe249c24cad049f77a998ff305fbad0ace77c6ac
      P1_REPAIR: 48b0aeabd485d9f9e26e335f232209e86debeb7a
      D06_WORKSPACE_BLOB: 346f31f828191e76d57b372bb6c84a4a90568594
      D06_BOUNDED_WORKSPACE_BLOB: b59e6bfff9806dff2092e5c7f93b68daff6407ef
      D06_WORKSPACE_TEST_BLOB: edce8f6a591ffc09d419e9046e14725c4a07cf54
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          # actions/checkout populates the Windows worktree before repository-local
          # EOL settings exist. Force a byte rewrite before blob identity gates.
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove isolated owner or convergence topology
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$D01_BASE" HEAD
          git merge-base --is-ancestor "$D01_FEATURE" HEAD

          legacy_isolated=false
          if [ "$(git rev-list --count "$D01_BASE"..HEAD)" = "7" ] \
             && [ "$(git rev-parse HEAD~2)" = "$P1_PARENT" ] \
             && [ "$(git rev-parse HEAD~1)" = "$P1_REPAIR" ]; then
            legacy_isolated=true
          fi

          if [ "$legacy_isolated" = true ]; then
            git diff --check "$D01_BASE" HEAD
            repair_changed="$(git diff --name-only "$P1_PARENT" HEAD | sort)"
            repair_expected="$(printf '%s\n' \
              '.github/workflows/d01-pgn-workspace-webview.yml' \
              'acs/full_product_actions.py' \
              'acs/pgn_webview_projection.py' \
              'acs/pgn_workspace_webview_adapter.py' \
              'tests/js/pgn_surface_dom_test.js' \
              'tests/test_dev1_pgn_workspace_webview_adapter.py' \
              'web/full_product_pgn.js' | sort)"
            test "$repair_changed" = "$repair_expected"
            test "$(git diff --name-only "$P1_REPAIR" HEAD)" = '.github/workflows/d01-pgn-workspace-webview.yml'
            changed="$(git diff --name-only "$D01_BASE" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/d01-pgn-workspace-webview.yml' \
              'acs/full_product_actions.py' \
              'acs/pgn_webview_bridge.py' \
              'acs/pgn_webview_projection.py' \
              'acs/pgn_workspace_webview_adapter.py' \
              'tests/js/pgn_surface_dom_test.js' \
              'tests/test_dev1_pgn_webview_atomicity.py' \
              'tests/test_dev1_pgn_webview_projection.py' \
              'tests/test_dev1_pgn_workspace_webview_adapter.py' \
              'web/full_product_pgn.js' | sort)"
            test "$changed" = "$expected"
            if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict|release_preflight|pgn_workspace\.py$|pgn_document\.py$'; then
              echo 'Foreign owner or strict-release contamination detected' >&2
              exit 1
            fi
            echo 'D01_TOPOLOGY=LEGACY_ISOLATED'
          else
            if [ -n "${PR_BASE:-}" ]; then
              git cat-file -e "$PR_BASE^{commit}"
              git merge-base --is-ancestor "$PR_BASE" HEAD
              git diff --check "$PR_BASE" HEAD
              changed="$(git diff --name-only "$PR_BASE" HEAD | sort)"
            else
              # Manual dispatch has no pull-request base. Exact feature/shared blob
              # locks and the complete semantic suites below remain authoritative.
              git diff --check HEAD^ HEAD
              changed="$(git diff --name-only HEAD^ HEAD | sort)"
            fi
            if printf '%s\n' "$changed" | grep -E '(^|/)tools/qa/|windows-stage1-strict'; then
              echo 'Strict QA ownership contamination detected' >&2
              exit 1
            fi
            echo 'D01_TOPOLOGY=CONVERGENCE'
          fi

      - name: Lock frozen Stage1 and current shared D01 routing
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Protected blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          run_accessible_chess.py=fb8914d7e63f5c5fa7dfa1669798d571bcf8d1fb
          LOCKS

          # Books reverse semantic navigation is an independently-reviewed
          # successor of the shared presenter/action registry. Keep exact
          # identities branch-independent so convergence descendants inherit
          # qualified bytes without depending on a historical ref name.
          presenter_actual="$(git rev-parse HEAD:acs/full_product_presenters.py)"
          case "$presenter_actual" in
            a752bb6b837d0332ad69047912dffeb537c7bd3f|678812ff028522c36b5c76df743dd2e0bac240c0|b279f68e907038acfaa1754f3e7de76ef541793c|48a9f697120654bd029903b554b969eb768984b6|d8d69b595da990576b4240e16ea120cd6fb71c21|2c5c92f6229be97ffe8241f98eb636959e27f92c)
              ;;
            *)
              printf 'Protected blob mismatch: acs/full_product_presenters.py actual=%s\n' "$presenter_actual" >&2
              exit 1
              ;;
          esac

          actions_actual="$(git rev-parse HEAD:acs/full_product_actions.py)"
          case "$actions_actual" in
            b6be4376cbe0695136210c3b5b850cdf562f85a4|c30874e661e958db15856a250e414520467c095c|8f331bbf722e5e859a153ebd1582ed0711bc490b|1de880e5e03e9a838ea4c2c69b47111091982e81|52d9bc817359f3e281af8b8845a104b7f8e48a2c)
              ;;
            *)
              printf 'Protected blob mismatch: acs/full_product_actions.py actual=%s\n' "$actions_actual" >&2
              exit 1
              ;;
          esac

          keybindings_actual="$(git rev-parse HEAD:acs/keybindings.py)"
          native_menu_actual="$(git rev-parse HEAD:acs/ui_native_menu.py)"
          keymap_pair="$keybindings_actual:$native_menu_actual"
          case "$keymap_pair" in
            b222f0d625999d8119cb3bb7cebffc961217f610:dabed76f2ad60ad0c1032b13ca353e4acc0bf2ad|e3c398484cce2e191243528831319f30a36b8681:d1b456af0018499ff74c73b46f74b0ecc5913745|6a5564236a6ede60deafb199a4a7f3b39e870106:d1b456af0018499ff74c73b46f74b0ecc5913745|4726ec30d607487195056a9eb25ffc124f3db05e:d1b456af0018499ff74c73b46f74b0ecc5913745|267c7eb2914ba29f1cc7403536f1777896e00b27:d1b456af0018499ff74c73b46f74b0ecc5913745)
              ;;
            *)
              printf 'Protected blob mismatch: keybindings/native-menu pair=%s\n' "$keymap_pair" >&2
              exit 1
              ;;
          esac

          # Stage1 core accepts only exact independently-qualified identities.
          # Branch names are deliberately irrelevant: convergence descendants
          # inherit the reviewed bytes without being rejected for a new ref name.
          stage1_core_actual="$(git rev-parse HEAD:acs/stage1_release_ui_core.py)"
          case "$stage1_core_actual" in
            b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6|b579ca0f59ba20f6b69b3a4b7d89589256d54852|cb89d8d2d204545096568134637b39c888cf17b8)
              ;;
            *)
              printf 'Protected blob mismatch: acs/stage1_release_ui_core.py actual=%s\n' "$stage1_core_actual" >&2
              exit 1
              ;;
          esac

          # The shared semantic document may be the pre-P0-G Product blob,
          # either reviewed event-aware P0-G predecessor, the exact current
          # convergence blob, the reviewed P0 document-copy polling repair, or
          # the reviewed dynamic live-keymap Help successor. Every other
          # identity remains fail-closed.
          web_index_actual="$(git rev-parse HEAD:web/index.html)"
          case "$web_index_actual" in
            17803443a815843be3aa1b8c6be1c5abb7e7c888|15d2c07665777151ec6d57326444d632c0f73eb3|6e3187583aaa40de5eb431174dada8c6b16e4142|b95570b20b0ec6fc0a947a29479800764e74d3bd|9bbf9eb537de9d572e91d482494b0da7ec52928f|a148d4414c378c3952ff273071e4ebfb0648721a|0b7cbf84cfe7b038084d2de9014594d6a45da548|75d8365df092de52d8ea48df76ab68fb7199faa6|477c0f155a5f3777da71c6e110429a024309dfa6)
              ;;
            *)
              printf 'Protected blob mismatch: web/index.html actual=%s\n' "$web_index_actual" >&2
              exit 1
              ;;
          esac

          # The Stage1 release facade is a shared keyboard-routing boundary.
          # Accept only reviewed exact successor blobs while preserving the
          # frozen core; every other identity remains fail-closed.
          stage1_facade_actual="$(git rev-parse HEAD:acs/stage1_release_ui.py)"
          case "$stage1_facade_actual" in
            16e78af6219c8c36f0c4026942ef1d02875a370a|c8629e690a10fa8e10a2053fdc85284f635d2beb|2ac3ca8943e6a4a819e4f273992167f9cf0b47ce|23e5bcdde11acdb963515bea4bc4a93473dbbd05|af12ff28f83f118e81860c593bcf891d0937d566)
              ;;
            *)
              printf 'Protected blob mismatch: acs/stage1_release_ui.py actual=%s\n' "$stage1_facade_actual" >&2
              exit 1
              ;;
          esac

          # The shell is a shared D01 presentation boundary. Accept only the
          # exact pre-sanitizer blob or the canonical #456/#609 sanitizer blob
          # during current-runtime convergence; any third identity fails closed.
          shell_actual="$(git rev-parse HEAD:acs/full_product_ui_shell.py)"
          case "$shell_actual" in
            4745468f0939bdf02a4df215eda36f3de4010280|ffb173c4c07e56b4d2204589dceac8e0e6ee8040|4607b6621146a6d4c75627c4dc753d62557f88e9)
              ;;
            *)
              printf 'Protected blob mismatch: acs/full_product_ui_shell.py actual=%s\n' "$shell_actual" >&2
              exit 1
              ;;
          esac

      - name: Lock exact PGN presentation and canonical workspace
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'Feature blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          tests/test_pgn_workspace.py=edce8f6a591ffc09d419e9046e14725c4a07cf54
          tests/test_dev1_pgn_webview_atomicity.py=dd84ea984555921eeed600a4b2f4e419cbb6fe75
          tests/test_dev1_pgn_workspace_webview_adapter.py=ef3be2ed1297e1b81bdecfaed233b948a08774ef
          LOCKS

          # Browser-contract hardening is an intentional successor of the
          # reviewed D01 bridge/projection/DOM suite. Accept only exact prior or
          # reviewed successor identities; every third identity remains fail-closed.
          adapter_actual="$(git rev-parse HEAD:acs/pgn_workspace_webview_adapter.py)"
          case "$adapter_actual" in
            4343fa698f7503cf257218868aa927b099ddf21b|6100c761953e101c60220bfe3af6d2751be2d403)
              ;;
            *)
              printf 'Feature blob mismatch: acs/pgn_workspace_webview_adapter.py actual=%s\n' "$adapter_actual" >&2
              exit 1
              ;;
          esac

          bridge_actual="$(git rev-parse HEAD:acs/pgn_webview_bridge.py)"
          case "$bridge_actual" in
            c8f108c8dcc01c37503833abb5c626d89093145e|25b3d03179f42b4565a4dd6d7a2ccd283607e09c|5532f1fc7bbb29acd3b1716d826b66b355f34480)
              ;;
            *)
              printf 'Feature blob mismatch: acs/pgn_webview_bridge.py actual=%s\n' "$bridge_actual" >&2
              exit 1
              ;;
          esac

          projection_test_actual="$(git rev-parse HEAD:tests/test_dev1_pgn_webview_projection.py)"
          case "$projection_test_actual" in
            2b2c655c82f2427b046eb63d7925e4ceb9c303d4|c3ffd69e4220d7f40222c0e6f68ab0f8929ac91e|98a567716c2764c0b077e55101cad4111cd1e16a)
              ;;
            *)
              printf 'Feature blob mismatch: tests/test_dev1_pgn_webview_projection.py actual=%s\n' "$projection_test_actual" >&2
              exit 1
              ;;
          esac

          dom_test_actual="$(git rev-parse HEAD:tests/js/pgn_surface_dom_test.js)"
          case "$dom_test_actual" in
            d2539b0674e68aa5ff1f040161be4f34943b5cf6|61a148bf2a1282f4eba11104aab462f10e6c263c|7f3368c7523c60e796b8c404fa0d3e4cc5229c7b|d258506e4fccf58f275829d39de9c8120ff9b65d|f58dbfe206bb2033db2eb5f2419128f49a846140|831ca1a6f3c685967c9e9f1c93cc622d6f864d4b)
              ;;
            *)
              printf 'Feature blob mismatch: tests/js/pgn_surface_dom_test.js actual=%s\n' "$dom_test_actual" >&2
              exit 1
              ;;
          esac

          # Presentation privacy is an intentional successor of the exact D01
          # projection. Accept only the prior projection or the reviewed privacy
          # successor; every third identity remains fail-closed.
          projection_actual="$(git rev-parse HEAD:acs/pgn_webview_projection.py)"
          case "$projection_actual" in
            45049519527cda3d9c9f3c4de8e4244afc9fc614|e054f12da2bbaa580669ec5854d3acf725f91bf3|127037cb6cf264f579516df599bf8c1ad44e8985|11d8817f7c02dc1795b93a1a9c1faff20f4370ae|9a273c6676aed1ff094b8429f7706df009278738)
              ;;
            *)
              printf 'Feature blob mismatch: acs/pgn_webview_projection.py actual=%s\n' "$projection_actual" >&2
              exit 1
              ;;
          esac

          command_actual="$(git rev-parse HEAD:acs/version2_pgn_commands.py)"
          case "$command_actual" in
            d449d2352644c859774562628505f88d86acdea2|74a94b45597fbdc1607e7b3452df41b88837b42f)
              ;;
            *)
              printf 'Feature blob mismatch: acs/version2_pgn_commands.py actual=%s\n' "$command_actual" >&2
              exit 1
              ;;
          esac

          tree_keyboard_test_actual="$(git rev-parse HEAD:tests/js/pgn_tree_keyboard_dom_test.js)"
          test "$tree_keyboard_test_actual" = "3ec326e766110eba04228bcda92cc1d3dfea011a" || {
            printf 'Feature blob mismatch: tests/js/pgn_tree_keyboard_dom_test.js actual=%s\n' "$tree_keyboard_test_actual" >&2
            exit 1
          }

          workspace_actual="$(git rev-parse HEAD:acs/pgn_workspace.py)"
          case "$workspace_actual" in
            "$D06_WORKSPACE_BLOB"|"$D06_BOUNDED_WORKSPACE_BLOB")
              ;;
            *)
              printf 'Feature blob mismatch: acs/pgn_workspace.py actual=%s\n' "$workspace_actual" >&2
              exit 1
              ;;
          esac
          pgn_surface_actual="$(git rev-parse HEAD:web/full_product_pgn.js)"
          case "$pgn_surface_actual" in
            947319b17b4dda179bb2393a6194e2d2a8960220|c80c2c7177b01ab6bee8acb2945f6f56d67a097e|39077a843aefc424801bd96b41bfc81e784ac597|1fa71cf6fea78d9d6d3ceb1aedee060c8756355e|f239a8ec490ef1f5eb3f45af9c384ae5fa7320a9|c5e51b80b6c097a72e1795c78ea93c6f7275e128|9b266d037d16e5264ba3897fd00606e3a3b861d7)
              ;;
            *)
              printf 'Feature blob mismatch: web/full_product_pgn.js actual=%s\n' "$pgn_surface_actual" >&2
              exit 1
              ;;
          esac

          if [ "$pgn_surface_actual" = '9b266d037d16e5264ba3897fd00606e3a3b861d7' ]; then
            test "$dom_test_actual" = '831ca1a6f3c685967c9e9f1c93cc622d6f864d4b'
            test "$(git rev-parse HEAD:tests/js/toolbar_keymap_test_support.js)" = '17a0590cafb11e664bd88540d34e76594d5b0a5f'
          fi

          test "$(git rev-parse HEAD:tests/test_pgn_workspace.py)" = "$D06_WORKSPACE_TEST_BLOB"

      - name: Compile and parse D01 PGN presentation
        run: |
          python -m compileall -q acs/full_product_actions.py acs/pgn_workspace.py acs/pgn_webview_projection.py acs/pgn_webview_bridge.py acs/pgn_workspace_webview_adapter.py acs/version2_application.py acs/version2_pgn_commands.py tests/test_pgn_workspace.py tests/test_dev1_pgn_webview_projection.py tests/test_dev1_pgn_webview_atomicity.py tests/test_dev1_pgn_workspace_webview_adapter.py tests/test_pgn_browser_presentation_lease_required.py tests/test_version2_pgn_commands.py tests/test_v2_board_analysis_hotkey_feedback.py tests/test_pgn_tree_remaining_keybindings.py
          node --check web/full_product_pgn.js
          node --check tests/js/pgn_surface_dom_test.js
          node --check tests/js/pgn_tree_keyboard_dom_test.js
          node --check tests/js/pgn_remaining_keybindings_test.js
          node tests/js/pgn_surface_dom_test.js
          node tests/js/pgn_tree_keyboard_dom_test.js
          node tests/js/pgn_remaining_keybindings_test.js

      - name: D01 PGN focused regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_workspace
          tests.test_dev1_pgn_webview_projection
          tests.test_dev1_pgn_webview_atomicity
          tests.test_dev1_pgn_workspace_webview_adapter
          tests.test_dev1_full_product_ui_packages
          tests.test_dev1_full_product_webview_adapter
          tests.test_gametree
          tests.test_d06_gametree_persistence_vertical
          tests.test_d06_annotation_insertion_persistence_vertical
          tests.test_d06_pgn_roundtrip
          tests.test_pgn_service
          tests.test_pgn_concurrent_save
          tests.test_pgn_browser_presentation_lease_required
          tests.test_version2_pgn_commands
          tests.test_whole_product_user_journey
          tests.test_keybindings
          tests.test_pgn_tree_remaining_keybindings
          tests.test_v2_board_analysis_hotkey_feedback
          tests.test_d01_current_stage1_core_gate

      - name: Prove exact current PgnWorkspace to one D01 action path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from acs.full_product_actions import FullProductActionRouter
          from acs.full_product_ui_shell import AccessibleShellState, UILanguage
          from acs.gametree_navigation import GameTreeCursor, VariationStep
          from acs.pgn_webview_bridge import PgnWebViewBridge
          from acs.pgn_workspace import PgnWorkspace
          from acs.pgn_workspace_webview_adapter import PgnWorkspaceWebViewProjection

          document = '''[Event "Workspace One"]
          [White "Alpha"]
          [Black "Beta"]
          [Result "1-0"]

          1. e4 e5 (1... c5 {Sicilian} 2. Nf3) 2. Nf3 Nc6 1-0

          [Event "Workspace Two"]
          [White "Gamma"]
          [Black "Delta"]
          [Result "1/2-1/2"]

          1. d4 d5 1/2-1/2
          '''
          owner = PgnWorkspace.from_text(document)

          class AuditedWorkspacePort:
              def __init__(self, exact_workspace):
                  self.owner = exact_workspace
                  self.inside_delegate = False
                  self.mutations = []

              def games(self):
                  return self.owner.games()

              def view(self):
                  return self.owner.view()

              def set_cursor(self, cursor):
                  self.mutations.append(("set_cursor", self.inside_delegate))
                  return self.owner.set_cursor(cursor)

              def previous_game(self):
                  self.mutations.append(("previous_game", self.inside_delegate))
                  return self.owner.previous_game()

              def next_game(self):
                  self.mutations.append(("next_game", self.inside_delegate))
                  return self.owner.next_game()

          workspace = AuditedWorkspacePort(owner)
          calls = []

          def cursor_from_payload(payload):
              path = tuple(VariationStep(*item) for item in payload["line_path"])
              move_index = payload["move_index"]
              return GameTreeCursor(path, 0 if move_index is None else move_index + 1)

          def host(action_id, payload):
              workspace.inside_delegate = True
              try:
                  calls.append((action_id, dict(payload)))
                  if action_id in {
                      "pgn.select_item",
                      "pgn.previous_item",
                      "pgn.next_item",
                      "pgn.parent_variation",
                  }:
                      workspace.set_cursor(cursor_from_payload(payload))
                  elif action_id == "pgn.previous_game":
                      workspace.previous_game()
                  elif action_id == "pgn.next_game":
                      workspace.next_game()
                  return {"path": "C:/Users/private/export.pgn", "token": "SECRET"}
              finally:
                  workspace.inside_delegate = False

          router = FullProductActionRouter(
              AccessibleShellState(language=UILanguage.EN),
              host,
          )
          projection = PgnWorkspaceWebViewProjection(workspace, router, language=UILanguage.EN)
          bridge = PgnWebViewBridge(projection)

          def expect(command, payload, canonical_action):
              before = len(calls)
              result = bridge.dispatch(command, payload)
              assert result.kind == "selection", (command, result)
              assert len(calls) == before + 1, (command, calls[before:])
              assert calls[-1][0] == canonical_action, (command, calls[-1][0])
              return result

          snapshot = projection.snapshot()
          assert snapshot["game"]["count"] == 2
          assert "content_revision" not in repr(snapshot)
          assert "content_digest" not in repr(snapshot)
          assert "current_record_digest" not in repr(snapshot)

          expect("pgn.move", {"delta": 1}, "pgn.next_item")
          expect("pgn.move", {"delta": -1}, "pgn.previous_item")
          variation = next(item for item in snapshot["tree"] if item["kind"] == "variation")
          expect("pgn.select", {"node_id": variation["node_id"]}, "pgn.select_item")
          assert owner.cursor.line_path
          expect("pgn.parent", {}, "pgn.parent_variation")
          expect("pgn.select", {"node_id": variation["node_id"]}, "pgn.select_item")
          result = expect("pgn.variation_promote", {}, "pgn.variation_promote")
          _, payload = calls[-1]
          assert payload["expected_record_digest"] == owner.view().current_record_digest
          assert payload["content_revision"] == owner.content_revision
          browser_result = repr(result.payload)
          assert "expected_record_digest" not in browser_result
          assert "line_path" not in browser_result
          assert "SECRET" not in browser_result
          assert "C:/Users/private" not in browser_result

          expect("pgn.variation_delete", {}, "pgn.variation_delete")
          comment_node = next(item for item in projection.snapshot()["tree"] if item["comments"])
          expect("pgn.select", {"node_id": comment_node["node_id"]}, "pgn.select_item")
          expect("pgn.comment_edit", {"text": "Accessible note"}, "pgn.comment_edit")
          expect("pgn.comment_delete", {}, "pgn.comment_delete")
          expect("pgn.copy_selection", {}, "pgn.copy_selection")
          expect("pgn.export_selection", {}, "pgn.export_selection")

          moved = expect("pgn.next_game", {}, "pgn.next_game")
          assert owner.selected_game_index == 1
          assert moved.payload["snapshot"]["game"]["index"] == 1
          back = expect("pgn.previous_game", {}, "pgn.previous_game")
          assert owner.selected_game_index == 0
          assert back.payload["snapshot"]["game"]["index"] == 0
          assert workspace.mutations
          assert all(inside_delegate for _, inside_delegate in workspace.mutations)
          print("Current exact D06 PgnWorkspace -> one registered D01 WebView action path PASS")
          PY

