name: Current Sound Profiles Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/sound_pack_download.py'
      - 'acs/sound_pack_store.py'
      - 'acs/sound_profiles.py'
      - 'acs/sound_runtime.py'
      - 'acs/sound_windows.py'
      - 'acs/stage1_release_ui_core.py'
      - 'acs/version2_release_app.py'
      - 'acs/version2_release_ui.py'
      - 'tests/test_sound_pack_download.py'
      - 'tests/test_sound_pack_store.py'
      - 'tests/test_sound_profile_api.py'
      - 'tests/test_sound_profiles.py'
      - 'tests/test_sound_runtime.py'
      - 'web/stage1_release_bootstrap.js'
      - '.github/workflows/current-sound-profiles-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-sound-profiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact candidate identity and bounded scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          base="${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/current-sound-profiles-contract.yml' \
            'acs/sound_pack_download.py' \
            'acs/sound_pack_store.py' \
            'acs/sound_profiles.py' \
            'acs/sound_runtime.py' \
            'acs/sound_windows.py' \
            'acs/stage1_release_ui_core.py' \
            'acs/version2_release_app.py' \
            'acs/version2_release_ui.py' \
            'tests/test_sound_pack_download.py' \
            'tests/test_sound_pack_store.py' \
            'tests/test_sound_profile_api.py' \
            'tests/test_sound_profiles.py' \
            'tests/test_sound_runtime.py' \
            'web/stage1_release_bootstrap.js' | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile sound profile authority
        run: >-
          python -m py_compile
          acs/sound_pack_download.py
          acs/sound_pack_store.py
          acs/sound_profiles.py
          acs/sound_runtime.py
          acs/sound_windows.py
          acs/stage1_release_ui_core.py
          acs/version2_release_app.py
          acs/version2_release_ui.py
          tests/test_sound_pack_download.py
          tests/test_sound_pack_store.py
          tests/test_sound_profile_api.py
          tests/test_sound_profiles.py
          tests/test_sound_runtime.py

      - name: Check WebView sound settings JavaScript syntax
        run: node --check web/stage1_release_bootstrap.js

      - name: Run sound profile and adjacent runtime regressions
        run: >-
          python -m unittest -v
          tests.test_sound_profiles
          tests.test_sound_pack_download
          tests.test_sound_pack_store
          tests.test_sound_runtime
          tests.test_sound_profile_api
