# DEV1 evidence only: candidate-facing UI/NVDA readback on exact Stockfish runtime privacy repair.
name: DEV1 Stage1 Stockfish Runtime UI/NVDA Evidence

on:
  push:
    branches:
      - auto/dev1-stage1-stockfish-runtime-ui-evidence-20260823-1354
    paths:
      - '.github/workflows/dev1-stage1-stockfish-runtime-ui-evidence.yml'
  pull_request:
    branches:
      - auto/dev1-stage1-stockfish-runtime-ui-ci-base-20260823-1354
    paths:
      - '.github/workflows/dev1-stage1-stockfish-runtime-ui-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev1-stage1-stockfish-runtime-ui-${{ github.event_name }}
  cancel-in-progress: false

env:
  BASE_ACCEPTED_STAGE1_SHA: 80720e8125c59a213f278668d599040f2768d553
  REPAIR_SHA: 1e9d23b034e6d347fe03c3581469a07e16037c55

jobs:
  ui-linux:
    name: Runtime repair UI/NVDA contracts — Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.REPAIR_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact repair source and DEV1-neutral scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIR_SHA"
          test "$(git merge-base "$BASE_ACCEPTED_STAGE1_SHA" "$REPAIR_SHA")" = "$BASE_ACCEPTED_STAGE1_SHA"
          git diff --check "$BASE_ACCEPTED_STAGE1_SHA" "$REPAIR_SHA"
          python - <<'PY'
          import os, subprocess
          changed=set(subprocess.check_output([
              'git','diff','--name-only',os.environ['BASE_ACCEPTED_STAGE1_SHA'],os.environ['REPAIR_SHA']
          ], text=True).splitlines())
          expected={'acs/stockfish_runtime.py'}
          assert changed == expected, (sorted(changed), sorted(expected))
          forbidden=[p for p in changed if p.startswith('web/') or p.startswith('acs/webapp') or p.startswith('acs/stage1_release_ui') or p.startswith('acs/keybindings') or p.startswith('tools/qa/')]
          assert not forbidden, forbidden
          print('EXACT STOCKFISH RUNTIME REPAIR + DEV1-NEUTRAL SCOPE PASS')
          PY
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Parse browser bridge and compile
        run: |
          node --check web/stage1_board_actions.js
          python -m compileall -q acs tests run_accessible_chess.py
      - name: Candidate-facing DEV1 UI accessibility contracts
        run: >-
          python -m unittest -v
          tests.test_accessible_webui
          tests.test_nvda_p0_contract
          tests.test_issue22_release_contract
          tests.test_stage1_complete_user_flow
          tests.test_stage1_release_composition_ui
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_native_menu_action_routing
      - name: Current Stage1 privacy and Stockfish runtime regressions
        run: >-
          python -m unittest -v
          tests.test_stage1_release_path_privacy
          tests.test_stockfish_runtime
      - name: Candidate-facing diagnostic
        run: python run_accessible_chess.py --diagnostic

  ui-windows:
    name: Runtime repair UI/NVDA contracts — Windows
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.REPAIR_SHA }}
      - name: Preserve exact LF source semantics
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard $env:REPAIR_SHA
          if((git rev-parse HEAD).Trim() -ne $env:REPAIR_SHA){throw 'Repair source mismatch'}
          if((git merge-base $env:BASE_ACCEPTED_STAGE1_SHA $env:REPAIR_SHA).Trim() -ne $env:BASE_ACCEPTED_STAGE1_SHA){throw 'Repair ancestry mismatch'}
          git diff --check $env:BASE_ACCEPTED_STAGE1_SHA $env:REPAIR_SHA
          if($LASTEXITCODE -ne 0){throw 'repair diff hygiene failed'}
          $changed = @(git diff --name-only $env:BASE_ACCEPTED_STAGE1_SHA $env:REPAIR_SHA)
          if($changed.Count -ne 1 -or $changed[0] -ne 'acs/stockfish_runtime.py'){throw "Unexpected repair scope: $($changed -join ', ')"}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Parse browser bridge and compile
        shell: pwsh
        run: |
          node --check web/stage1_board_actions.js
          if($LASTEXITCODE -ne 0){throw 'browser JS parse failed'}
          python -m compileall -q acs tests run_accessible_chess.py
          if($LASTEXITCODE -ne 0){throw 'compileall failed'}
      - name: Candidate-facing DEV1 UI accessibility contracts
        shell: pwsh
        run: |
          python -m unittest -v tests.test_accessible_webui tests.test_nvda_p0_contract tests.test_issue22_release_contract tests.test_stage1_complete_user_flow tests.test_stage1_release_composition_ui tests.test_stage1_packaged_focus_origin_contract tests.test_stage1_webview2_accessibility_boundary tests.test_dev1_release_ui_regressions tests.test_webview_keymap_bridge_contract tests.test_stage1_native_menu_action_routing
          if($LASTEXITCODE -ne 0){throw 'candidate-facing UI/NVDA contracts failed'}
      - name: Current Stage1 privacy and Stockfish runtime regressions
        shell: pwsh
        run: |
          python -m unittest -v tests.test_stage1_release_path_privacy tests.test_stockfish_runtime
          if($LASTEXITCODE -ne 0){throw 'Stage1 privacy/Stockfish runtime regressions failed'}
      - name: Candidate-facing diagnostic
        shell: pwsh
        run: |
          python run_accessible_chess.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'candidate-facing diagnostic failed'}
