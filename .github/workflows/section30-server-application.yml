name: Section 30 Server Application Boundary

on:
  pull_request:
    paths:
      - 'acs/server_application_boundary.py'
      - 'tests/test_section30_server_application_boundary.py'
      - 'docs/automation/SECTION30_SERVER_APPLICATION_CLOSURE.md'
      - '.github/workflows/section30-server-application.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  section30:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Exact checkout and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --check HEAD^
      - name: Compile Section 29 and 30
        run: >-
          python -m py_compile
          acs/network_security.py
          acs/server_application_boundary.py
          tests/test_section29_network_security.py
          tests/test_section30_server_application_boundary.py
      - name: Run focused Section 29 and 30 contracts
        run: >-
          python -m unittest -v
          tests.test_section29_network_security
          tests.test_section30_server_application_boundary
      - name: Requalify canonical application/server adjacency
        run: >-
          python -m unittest -v
          tests.test_version2_application
          tests.test_version2_classroom_orchestration_binding
          tests.test_classroom_join_credentials
          tests.test_classroom_chat_rpc
          tests.test_classroom_file_rpc
      - name: Prove server layer has no chess/domain authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("acs/server_application_boundary.py").read_text(encoding="utf-8")
          forbidden = (
              "from .chesscore", "import chesscore", "from .gametree",
              "from .notation", "from .pgn", "from .position_editor",
              "legal_moves(", "parse_fen", "Board(",
          )
          for token in forbidden:
              assert token not in source, token
          assert "build_application_operations" in source
          assert "ProductionSecurityPolicy" in source
          assert "SqliteJobStore" in source
          print("SECTION30_NO_SECOND_DOMAIN_AUTHORITY=PASS")
          PY
