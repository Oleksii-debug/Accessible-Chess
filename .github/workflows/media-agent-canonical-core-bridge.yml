name: Media Agent Canonical Core Bridge

on:
  pull_request:
    branches:
      - work/media-agent-crossrepo-intake-20261005
  push:
    branches:
      - work/media-agent-canonical-core-bridge-20261005-sol56-r2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-agent-canonical-core-bridge-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove canonical parents and bounded bridge scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          AGENT_PARENT: 6609c35ff5fa0b1f959806866ff7403e70efdbf3
          MEDIA_CORE_PARENT: 2fab0518976ad3938f56b9c9cf129f3a368e1f04
          MEDIA_APPLICATION_SOURCE: 4bfd31932e5e855764bb2ed86248028646dc9c09
          AGENT_BRANCH: work/media-agent-crossrepo-intake-20261005
          MEDIA_CORE_BRANCH: work/accessible-chess-20261005-media-core-sol56n4q8
          MEDIA_APPLICATION_BRANCH: work/media-application-restore-position-20261005-sol56
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$AGENT_PARENT" HEAD
          test "$(git merge-base "$AGENT_PARENT" HEAD)" = "$AGENT_PARENT"

          git fetch --no-tags origin "+refs/heads/$AGENT_BRANCH:refs/remotes/origin/media-agent-parent"
          git fetch --no-tags origin "+refs/heads/$MEDIA_CORE_BRANCH:refs/remotes/origin/media-core-parent"
          git fetch --no-tags origin "+refs/heads/$MEDIA_APPLICATION_BRANCH:refs/remotes/origin/media-application-source"
          live_agent="$(git rev-parse refs/remotes/origin/media-agent-parent)"
          live_media="$(git rev-parse refs/remotes/origin/media-core-parent)"
          live_application="$(git rev-parse refs/remotes/origin/media-application-source)"
          test "$live_agent" = "$AGENT_PARENT" || {
            printf 'MEDIA_AGENT_PARENT_MOVED expected=%s live=%s\n' "$AGENT_PARENT" "$live_agent" >&2
            exit 1
          }
          test "$live_media" = "$MEDIA_CORE_PARENT" || {
            printf 'MEDIA_CORE_PARENT_MOVED expected=%s live=%s\n' "$MEDIA_CORE_PARENT" "$live_media" >&2
            exit 1
          }
          test "$live_application" = "$MEDIA_APPLICATION_SOURCE" || {
            printf 'MEDIA_APPLICATION_SOURCE_MOVED expected=%s live=%s\n' "$MEDIA_APPLICATION_SOURCE" "$live_application" >&2
            exit 1
          }

          git diff --check "$AGENT_PARENT"...HEAD
          changed="$(git diff --name-only "$AGENT_PARENT"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n'             '.github/workflows/media-agent-canonical-core-bridge.yml'             'acs/chess_agent_tools.py'             'acs/media_application.py'             'acs/media_core.py'             'tests/test_chess_agent_tools_crossrepo.py'             'tests/test_media_agent_canonical_core_bridge.py'             'tests/test_media_application.py'             'tests/test_media_core.py' | LC_ALL=C sort)"
          test "$changed" = "$expected" || {
            printf 'UNEXPECTED_CANONICAL_MEDIA_BRIDGE_SCOPE\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git rev-parse HEAD:acs/chess_agent_tools.py)" = '89a27bf7783d48d8f9e80c79f9d841a43f2b16e6'
          test "$(git rev-parse HEAD:tests/test_chess_agent_tools_crossrepo.py)" = 'e1752b02334d8b5a8f0491701ec2e4f25e8dd669'
          test "$(git rev-parse "$MEDIA_CORE_PARENT":acs/media_core.py)" = '498b44304503edb5244778eda061c109c9bf112e'
          test "$(git rev-parse HEAD:acs/media_core.py)" = '498b44304503edb5244778eda061c109c9bf112e'
          test "$(git rev-parse "$MEDIA_CORE_PARENT":tests/test_media_core.py)" = '0cf124d6694796470d9efc730bea76621fbd6014'
          test "$(git rev-parse HEAD:tests/test_media_core.py)" = '0cf124d6694796470d9efc730bea76621fbd6014'
          test "$(git rev-parse "$MEDIA_APPLICATION_SOURCE":acs/media_application.py)" = 'b603e86e3d7eb7f7256ffeb943abf223d97e2bf5'
          test "$(git rev-parse HEAD:acs/media_application.py)" = 'b603e86e3d7eb7f7256ffeb943abf223d97e2bf5'
          test "$(git rev-parse "$MEDIA_APPLICATION_SOURCE":tests/test_media_application.py)" = '44d1ea42a225f89aa922c891098c348439d69e57'
          test "$(git rev-parse HEAD:tests/test_media_application.py)" = '44d1ea42a225f89aa922c891098c348439d69e57'
          test "$(git rev-parse HEAD:tests/test_media_agent_canonical_core_bridge.py)" = 'e1c9e3775d7bc3f2afbd08dcc75f8ed35cd8b556'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install retained test dependency
        run: python -m pip install pytest==8.4.2

      - name: Compile canonical Media Core and Agent bridge
        run: >-
          python -m compileall -q
          acs/media_core.py
          acs/media_application.py
          acs/chess_agent_tools.py
          tests/test_media_core.py
          tests/test_media_application.py
          tests/test_chess_agent_tools_crossrepo.py
          tests/test_media_agent_canonical_core_bridge.py

      - name: Execute canonical Media Core and Agent bridge regressions
        run: >-
          python -m unittest -v
          tests.test_media_core
          tests.test_media_application
          tests.test_chess_agent_tools_crossrepo
          tests.test_media_agent_canonical_core_bridge
          tests.test_universal_chess_agent_crossrepo
