name: EPUB Application Reachability

on:
  push:
    branches:
      - integration/hardened-epub-package-identity-20261004-sol6p3
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
      - integration/full-product-apex-books-training-regressions-20261004
    paths:
      - 'acs/book_epub_import.py'
      - 'acs/version2_application.py'
      - 'acs/version2_windows_native_dialog_ownership.py'
      - 'tests/test_epub_application_reachability_workflow.py'
      - 'tests/test_v2_book_epub_import.py'
      - 'tests/test_v2_book_epub_package_contract.py'
      - 'tests/test_v2_native_dialog_language.py'
      - 'tests/test_version2_epub_application_reachability.py'
      - '.github/workflows/epub-application-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epub-application-reachability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove current Product ancestry and protect EPUB authority
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"

          product_branch='work/full-product-teacher-education-reachability-20260911'
          git fetch --no-tags origin "+refs/heads/$product_branch:refs/remotes/origin/$product_branch"
          product="$(git rev-parse "refs/remotes/origin/$product_branch")"

          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD

          # Parser changes require an atomic, exact reviewed hardening set.
          # Once that set is integrated into Product, ordinary descendants take
          # the first branch and remain byte-locked to then-current Product.
          parser_path='acs/book_epub_import.py'
          parser_test_path='tests/test_v2_book_epub_import.py'
          package_contract_test_path='tests/test_v2_book_epub_package_contract.py'
          product_parser="$(git rev-parse "$product:$parser_path")"
          product_parser_test="$(git rev-parse "$product:$parser_test_path")"
          candidate_parser="$(git rev-parse "HEAD:$parser_path")"
          candidate_parser_test="$(git rev-parse "HEAD:$parser_test_path")"
          candidate_package_contract_test="$(git rev-parse "HEAD:$package_contract_test_path")"
          package_identity_successor_parser='1e3bf95ee4754287fc5628d0853de3270ef563a2'
          package_identity_successor_parser_test='de189065192ca1c0bd30ce1ecec559e8f61cc1bc'
          package_identity_successor_contract_test='d76dfa5233865d6611f7c74f6bc431be44c07aec'

          if test "$candidate_parser" = "$product_parser" && \
             test "$candidate_parser_test" = "$product_parser_test"; then
            :
          elif test "$candidate_parser" = "$package_identity_successor_parser" && \
               test "$candidate_parser_test" = "$package_identity_successor_parser_test" && \
               test "$candidate_package_contract_test" = "$package_identity_successor_contract_test"; then
            echo "EPUB_PACKAGE_IDENTITY_SUCCESSOR=EXACT"
          else
            printf 'EPUB parser/test drift requires an exact reviewed hardening set: parser=%s test=%s contract=%s\n' \
              "$candidate_parser" "$candidate_parser_test" "$candidate_package_contract_test" >&2
            exit 1
          fi

          # Shared application/dialog composition remains evolvable, but the
          # independent whole-application EPUB reachability oracle stays immutable.
          protected_paths=(
            'tests/test_version2_epub_application_reachability.py'
          )
          for path in "${protected_paths[@]}"; do
            product_blob="$(git rev-parse "$product:$path")"
            candidate_blob="$(git rev-parse "HEAD:$path")"
            test "$candidate_blob" = "$product_blob" || {
              printf 'EPUB application oracle drift requires a dedicated successor: %s product=%s candidate=%s\n' \
                "$path" "$product_blob" "$candidate_blob" >&2
              exit 1
            }
          done

          echo "EPUB_REACHABILITY_TOPOLOGY=CURRENT_FULL_PRODUCT_DESCENDANT"
          echo "EPUB_REACHABILITY_UPSTREAM=$product"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed Python
        run: >-
          python -m py_compile
          acs/book_epub_import.py
          acs/version2_application.py
          acs/version2_windows_native_dialog_ownership.py
          tests/test_epub_application_reachability_workflow.py
          tests/test_v2_book_epub_import.py
          tests/test_v2_book_epub_package_contract.py
          tests/test_v2_native_dialog_language.py
          tests/test_version2_epub_application_reachability.py

      - name: Run EPUB reachability and adjacent semantic regressions
        run: >-
          python -m unittest -v
          tests.test_epub_application_reachability_workflow
          tests.test_version2_epub_application_reachability
          tests.test_v2_book_epub_import
          tests.test_v2_book_epub_package_contract
          tests.test_v2_native_dialog_language
          tests.test_version2_application
          tests.test_bookreader
          tests.test_bookdocument
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Install pytest for repository pytest gate
        run: python -m pip install pytest==8.4.2

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
