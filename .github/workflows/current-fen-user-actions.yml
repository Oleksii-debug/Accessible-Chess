name: Current FEN User Actions

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'acs/keybindings.py'
      - 'acs/ui_keymap_adapter.py'
      - 'acs/webapp_keymap.py'
      - 'acs/full_product_actions.py'
      - 'acs/full_product_native_menu.py'
      - 'acs/version2_application.py'
      - 'tests/test_version2_release_ui.py'
      - 'tests/test_version2_application.py'
      - 'tests/test_full_product_native_menu.py'
      - 'tests/test_ui_keymap_adapter.py'
      - '.github/workflows/current-fen-user-actions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-fen-user-actions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact shipping-relative scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            base_ref="converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-fen-user-actions.yml' \
            'acs/full_product_actions.py' \
            'acs/full_product_native_menu.py' \
            'acs/keybindings.py' \
            'acs/ui_keymap_adapter.py' \
            'acs/version2_application.py' \
            'acs/webapp_keymap.py' \
            'tests/test_full_product_native_menu.py' \
            'tests/test_ui_keymap_adapter.py' \
            'tests/test_version2_application.py' \
            'tests/test_version2_release_ui.py' | sort)"
          test "$changed" = "$expected_paths"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile changed FEN surfaces
        run: >-
          python -m compileall -q
          acs/keybindings.py
          acs/ui_keymap_adapter.py
          acs/webapp_keymap.py
          acs/full_product_actions.py
          acs/full_product_native_menu.py
          acs/version2_application.py
          tests/test_version2_release_ui.py
          tests/test_version2_application.py
          tests/test_full_product_native_menu.py
          tests/test_ui_keymap_adapter.py

      - name: Execute focused FEN user journeys
        run: >-
          python -m unittest -v
          tests.test_version2_release_ui
          tests.test_version2_application
          tests.test_full_product_native_menu
          tests.test_ui_keymap_adapter
          tests.test_dev2_fen_atomicity
          tests.test_fen_input_budget_current
          tests.test_position_editor
          tests.test_position_text_authority
          tests.test_pgn_document_new_game_position_integrity
          tests.test_pgn_document_new_game_position_workflow

      - name: Execute adjacent product composition
        run: >-
          python -m unittest -v
          tests.test_dev1_full_product_webview_adapter
          tests.test_version2_final_product_composition

      - name: Core selftest
        run: python -m acs.selftest
