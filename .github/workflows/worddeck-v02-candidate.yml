name: WordDeck V0.2 full-v1 candidate

on:
  push:
    branches: [worddeck-bootstrap]
    paths:
      - 'WordDeck/**'
      - '.github/workflows/worddeck-v02-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  AUDIO_SOURCE_RUN_ID: '32415680535'
  AUDIO_ARTIFACT_ID: '9424683598'
  AUDIO_ARTIFACT_NAME: 'worddeck-oxford5000-en-gb-complete'
  AUDIO_ARTIFACT_DIGEST: 'sha256:017ccdbf79045f0be7564710a70d09fd1267c3d95c21ef8a6a1527abb46b6447'
  RELEASE_NAME: 'WordDeck-v0.2-full-v1-candidate-win-x64'

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact canonical checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout/source mismatch: HEAD=$actual GITHUB_SHA=$env:GITHUB_SHA" }
          if ($env:GITHUB_REF_NAME -ne 'worddeck-bootstrap') { throw "Candidate must run from worddeck-bootstrap, got $env:GITHUB_REF_NAME" }
          New-Item -ItemType Directory -Force .\artifacts | Out-Null
          @(
            "branch=$env:GITHUB_REF_NAME",
            "sha=$actual",
            "workflow_run=$env:GITHUB_RUN_ID"
          ) | Set-Content .\artifacts\source-identity.txt -Encoding utf8
          Write-Host "Exact canonical checkout PASS: $actual"

      - name: Publish pending candidate status
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: 'pending', context: 'WordDeck V0.2 full-v1 candidate',
              description: 'Integrated full-v1 engineering candidate gate is running.',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });

      - name: Verify repository safety and no-admin contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git ls-files)
          $badNames = @($tracked | Where-Object {
            $_ -match '(?i)(^|/)(token\.json|credentials\.json|cookies?\.txt|[^/]+\.session|\.env)$'
          })
          if ($badNames.Count -ne 0) { throw "Tracked private-state/credential filenames: $($badNames -join ', ')" }

          $sourceFiles = @(Get-ChildItem .\WordDeck -Recurse -File | Where-Object {
            $_.Extension -in '.cs','.csproj','.json','.xml','.ps1','.yml','.yaml'
          })
          $personalPathHits = @($sourceFiles | Select-String -SimpleMatch 'C:\Users\')
          if ($personalPathHits.Count -ne 0) { throw "Hard-coded personal Windows path found: $($personalPathHits.Path -join ', ')" }

          $secretRegex = '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)'
          $secretHits = @($sourceFiles | Select-String -Pattern $secretRegex)
          if ($secretHits.Count -ne 0) { throw "Potential credential material found in product/release sources: $($secretHits.Path -join ', ')" }

          $manifestText = Get-Content .\WordDeck\app.manifest -Raw
          if ($manifestText -notmatch 'requestedExecutionLevel\s+level="asInvoker"') { throw 'Application manifest is not asInvoker/no-admin.' }
          Write-Host 'Repository safety/no-admin contract PASS.'

      - name: Verify exact accepted AudioPack identity
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = Number(process.env.AUDIO_SOURCE_RUN_ID);
            const artifactId = Number(process.env.AUDIO_ARTIFACT_ID);
            const response = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100
            });
            const artifact = response.data.artifacts.find(a => a.id === artifactId && a.name === process.env.AUDIO_ARTIFACT_NAME);
            if (!artifact) throw new Error('Accepted AudioPack artifact is missing.');
            if (artifact.expired) throw new Error('Accepted AudioPack artifact is expired.');
            if (artifact.digest && artifact.digest !== process.env.AUDIO_ARTIFACT_DIGEST) throw new Error(`AudioPack digest mismatch: ${artifact.digest}`);
            core.info(`Accepted AudioPack PASS: run=${runId} id=${artifact.id} digest=${artifact.digest || process.env.AUDIO_ARTIFACT_DIGEST}`);

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download accepted AudioPack
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.AUDIO_SOURCE_RUN_ID }}
          name: ${{ env.AUDIO_ARTIFACT_NAME }}
          path: .\artifacts\audio-download

      - name: Build candidate and install accepted offline audio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force .\artifacts\audio | Out-Null
          $zip = Get-ChildItem .\artifacts\audio-download -Filter *.zip -File | Select-Object -First 1
          if (-not $zip) { throw 'Accepted AudioPack ZIP missing after download.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath .\artifacts\audio -Force
          if (@(Get-ChildItem .\artifacts\audio -Filter *.mp3 -File).Count -ne 2138) { throw 'Accepted AudioPack must contain exactly 2138 MP3 files.' }
          dotnet restore .\WordDeck\WordDeck.csproj
          dotnet build .\WordDeck\WordDeck.csproj -c Release --no-restore -warnaserror
          dotnet publish .\WordDeck\WordDeck.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o .\artifacts\release
          Copy-Item .\WordDeck\README_FIRST_USABLE_UK.md .\artifacts\release\README_UK.md
          Copy-Item .\WordDeck\THIRD_PARTY_NOTICES.md .\artifacts\release\THIRD_PARTY_NOTICES.md
          Copy-Item .\WordDeck\CANDIDATE_STATUS_V02_UK.txt .\artifacts\release\CANDIDATE_STATUS_UK.txt
          Copy-Item .\artifacts\source-identity.txt .\artifacts\release\SOURCE_IDENTITY.txt
          $pack = '.\artifacts\release\AudioPacks\oxford-3000-en-uk'
          New-Item -ItemType Directory -Force $pack | Out-Null
          Copy-Item .\artifacts\audio\*.mp3 $pack
          Copy-Item .\artifacts\audio\audiopack-manifest.json "$pack\manifest.json"
          Copy-Item .\artifacts\audio\audio-integrity.tsv "$pack\audio-integrity.tsv"

      - name: Run integrated source and packaged regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project .\WordDeck\WordDeck.csproj -c Release --no-build -- --self-test
          $exe = (Resolve-Path .\artifacts\release\WordDeck.exe).Path
          $self = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Packaged self-test failed: $($self.ExitCode)" }
          $pack = '.\artifacts\release\AudioPacks\oxford-3000-en-uk'
          if (@(Get-ChildItem $pack -Filter *.mp3 -File).Count -ne 2138) { throw 'Candidate MP3 count mismatch.' }
          $manifest = Get-Content "$pack\manifest.json" -Raw | ConvertFrom-Json
          if ([int]$manifest.entry_count -ne 2138) { throw 'Candidate manifest entry_count mismatch.' }
          $status = Get-Content .\artifacts\release\CANDIDATE_STATUS_UK.txt -Raw
          if ($status -notmatch 'НЕ заявляє, що містить фінальний production SentencePack' -or $status -notmatch 'Ручний NVDA PASS не заявляється') { throw 'Candidate bounded-status disclosure is missing.' }

      - name: Prove complete package from Cyrillic and spaces path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pathRoot = Join-Path (Resolve-Path .\artifacts).Path 'Тест шляху WordDeck'
          if (Test-Path $pathRoot) { Remove-Item $pathRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $pathRoot | Out-Null
          Copy-Item .\artifacts\release\* $pathRoot -Recurse -Force
          $exe = Join-Path $pathRoot 'WordDeck.exe'
          if (-not (Test-Path $exe)) { throw 'Cyrillic/spaces package copy is missing WordDeck.exe.' }
          $proc = Start-Process $exe -ArgumentList '--self-test' -WorkingDirectory $pathRoot -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Cyrillic/spaces full-package self-test failed: $($proc.ExitCode)" }
          Write-Host 'Cyrillic/spaces full-package self-test PASS.'

      - name: Prove clean public candidate and create versioned ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $forbidden = @(Get-ChildItem .\artifacts\release -Recurse -File | Where-Object {
            $_.Name -match '^state(\.backup)?\.json$' -or
            $_.Name -match '^spelling-state(\.backup)?\.json$' -or
            $_.Name -match '^sentence-coach-state(\.backup)?\.json$' -or
            $_.Name -like 'WordDeck-profile*.json' -or
            $_.FullName -match '[\\/]Backups[\\/]' -or
            $_.Name -match '(token|secret|credential|session)'
          })
          if ($forbidden.Count -ne 0) { throw "Candidate contains forbidden personal/secret-looking files: $($forbidden.FullName -join ', ')" }
          foreach ($required in @('WordDeck.exe','README_UK.md','THIRD_PARTY_NOTICES.md','CANDIDATE_STATUS_UK.txt','SOURCE_IDENTITY.txt')) {
            if (-not (Test-Path (Join-Path .\artifacts\release $required))) { throw "Candidate required file missing: $required" }
          }

          $releaseRoot = (Resolve-Path .\artifacts\release).Path
          $manifestLines = foreach ($file in Get-ChildItem $releaseRoot -Recurse -File | Sort-Object FullName) {
            $relative = $file.FullName.Substring($releaseRoot.Length).TrimStart('\')
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash`t$($file.Length)`t$relative"
          }
          $manifestLines | Set-Content .\artifacts\release\PACKAGE_SHA256.tsv -Encoding utf8

          $candidateZip = ".\artifacts\$env:RELEASE_NAME.zip"
          Compress-Archive -Path .\artifacts\release\* -DestinationPath $candidateZip -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash -LiteralPath $candidateZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $env:RELEASE_NAME.zip" | Set-Content ".\artifacts\$env:RELEASE_NAME.sha256" -Encoding ascii
          Write-Host "Clean versioned candidate PASS. ZIP SHA-256: $zipHash"

      # Upload both the unpacked engineering tree and explicit versioned ZIP before
      # hosted UIA. A strict UIA failure still makes the final status fail, but the
      # independent auditor keeps already-proven package evidence for diagnosis.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: .\artifacts\release\**
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}-zip
          path: |
            .\artifacts\${{ env.RELEASE_NAME }}.zip
            .\artifacts\${{ env.RELEASE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Setup WinApp CLI for Windows UI Automation
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Run actual integrated Windows UI Automation regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\WordDeck\scripts\worddeck-r3-uia-smoke.ps1 -ProjectPath .\WordDeck\WordDeck.csproj

      - name: Publish final candidate status
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: context.sha,
              state: ok ? 'success' : 'failure', context: 'WordDeck V0.2 full-v1 candidate',
              description: ok ? 'Exact candidate ZIP, regressions, security/portability and integrated UIA passed.' : 'Candidate evidence is available where reached, but at least one strict acceptance gate failed.',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
            });
