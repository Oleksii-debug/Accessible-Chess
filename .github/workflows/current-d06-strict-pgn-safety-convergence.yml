name: Current D06 Strict PGN Safety Convergence

on:
  pull_request:
    branches:
      - converge/chessbase-canonical-publication-20261006-c2mbezb112
    paths:
      - '.github/workflows/current-d06-strict-pgn-safety-convergence.yml'
      - 'acs/pgn_roundtrip.py'
      - 'tests/test_d06_pgn_roundtrip.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-d06-strict-pgn-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  D06_SOURCE_BLOB: 76e10f5035e55cc413632dcb3829f698a70b41ca
  D06_TEST_BLOB: 06e184390eb8b3957063ab8480ce707aec4da4fe

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact geometry and D06 blobs
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/chessbase-canonical-publication-20261006-c2mbezb112}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-d06-strict-pgn-safety-convergence.yml' \
            'acs/pgn_roundtrip.py' \
            'tests/test_d06_pgn_roundtrip.py' | sort)"
          test "$changed" = "$expected_paths"
          test "$(git rev-parse HEAD:acs/pgn_roundtrip.py)" = "$D06_SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_d06_pgn_roundtrip.py)" = "$D06_TEST_BLOB"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile strict PGN boundary
        run: python -m py_compile acs/pgn_roundtrip.py tests/test_d06_pgn_roundtrip.py

      - name: Run strict PGN and retained canonical regressions
        run: >-
          python -m unittest -v
          tests.test_d06_pgn_roundtrip
          tests.test_book_active_import_cancellation
          tests.test_gametree
          tests.test_book_html_pgn_loss_accounting
          tests.test_chessbase_decoder
          tests.test_version2_formats_integration

      - name: Core selftest
        run: python -m acs.selftest
