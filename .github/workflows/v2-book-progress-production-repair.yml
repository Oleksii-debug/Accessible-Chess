name: V2 Book Progress Production Repair

on:
  push:
    branches:
      - work/v2-book-progress-production-repair-20260831
  pull_request:
    paths:
      - 'acs/book_progress_store.py'
      - 'tests/test_v2_book_progress_store.py'
      - 'tests/test_v2_book_progress_store_production.py'
      - '.github/workflows/v2-book-progress-production-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-book-progress-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      STACK_PARENT_SHA: 5ec896f00615d10157c5ec52a1ef83917779a1b5
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CURRENT_PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
      CURRENT_PROGRESS_OWNER: a56abe4e68d58c7600b97c1a410ae64a42697aaa
      CURRENT_STORE_BLOB: ae880d0eb9ec99028f2b7e2dddff57f162211618
      CURRENT_BASE_TEST_BLOB: ae85ba96da66f339a530e2ddbbf311161fb9832e
      CURRENT_PRODUCTION_TEST_BLOB: c2855823860059941a61c13109a9b686c26330e5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact ownership and current-base scope
        shell: bash
        run: |
          set -euo pipefail

          canonical_product_ref="refs/remotes/origin/$CURRENT_PRODUCT_BRANCH"
          git fetch --no-tags origin "+refs/heads/$CURRENT_PRODUCT_BRANCH:$canonical_product_ref"
          current_product="$(git rev-parse "$canonical_product_ref")"
          git cat-file -e "$current_product^{commit}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            upstream="$PR_BASE_SHA"
          else
            upstream="$STACK_PARENT_SHA"
          fi
          test -n "$upstream"
          git cat-file -e "$upstream^{commit}"
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          changed="$(git diff --name-only "$upstream" HEAD | sort)"

          bounded_feature=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            allowed="$(printf '%s\n' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'tests/test_v2_book_progress_store.py' \
              'tests/test_v2_book_progress_store_production.py' | sort)"
            unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))"
            if [ -z "$unexpected" ] \
              && printf '%s\n' "$changed" | grep -Fqx 'acs/book_progress_store.py' \
              && printf '%s\n' "$changed" | grep -Fqx 'tests/test_v2_book_progress_store.py'; then
              bounded_feature=true
            fi
          else
            expected="$(printf '%s\n' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'tests/test_v2_book_progress_store_production.py' | sort)"
            if [ "$changed" = "$expected" ]; then
              bounded_feature=true
            fi
          fi

          workflow_repair=false
          if git merge-base --is-ancestor "$current_product" HEAD; then
            current_delta="$(git diff --name-only "$current_product" HEAD | sort)"
            if [ "$current_delta" = '.github/workflows/v2-book-progress-production-repair.yml' ]; then
              workflow_repair=true
            fi
          fi
          recovery_successor=false
          if git merge-base --is-ancestor "$current_product" HEAD; then
            current_delta="$(git diff --name-only "$current_product" HEAD | sort)"
            recovery_expected="$(printf '%s\n' '.github/workflows/books-progress-backup-recovery.yml' '.github/workflows/v2-book-progress-production-repair.yml' '.github/workflows/v2-composition-publication-boundary.yml' 'acs/book_progress_store.py' 'acs/version2_application.py' 'acs/version2_release_app.py' 'acs/version2_windows_native_dialog_ownership.py' 'tests/test_v2_native_dialog_language.py' 'tests/test_version2_application.py' | sort)"
            if [ "$current_delta" = "$recovery_expected" ]; then
              recovery_successor=true
            fi
          fi

          orphan_backup_successor=false
          if git merge-base --is-ancestor "$current_product" HEAD; then
            current_delta="$(git diff --name-only "$current_product" HEAD | sort)"
            orphan_expected="$(printf '%s\n' \
              '.github/workflows/book-progress-orphan-backup-recovery.yml' \
              '.github/workflows/books-progress-backup-recovery.yml' \
              '.github/workflows/v2-book-progress-production-repair.yml' \
              'acs/book_progress_store.py' \
              'tests/test_v2_book_progress_store.py' \
              'tests/test_version2_application.py' | sort)"
            if [ "$current_delta" = "$orphan_expected" ]; then
              test "$(git rev-parse "$current_product":acs/book_progress_store.py)" = "3c51f524a1e2702903914a2dd9c37c0ed8ebf87b"
              test "$(git rev-parse "$current_product":tests/test_v2_book_progress_store.py)" = "52cb2948ec6789b60775e1fa38cae44770baff7a"
              test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$CURRENT_STORE_BLOB"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$CURRENT_BASE_TEST_BLOB"
              test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$CURRENT_PRODUCTION_TEST_BLOB"
              orphan_backup_successor=true
            fi
          fi

          full_product_composition=false
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && [ "${{ github.head_ref }}" = "$CURRENT_PRODUCT_BRANCH" ]; then
            test "$(git rev-parse HEAD)" = "$current_product"
            full_product_composition=true
          elif [ "${{ github.event_name }}" != "pull_request" ] \
            && [ "${GITHUB_REF_NAME:-}" = "$CURRENT_PRODUCT_BRANCH" ]; then
            test "$(git rev-parse HEAD)" = "$current_product"
            full_product_composition=true
          fi

          if [ "$bounded_feature" = true ]; then
            git diff --check "$upstream" HEAD
            git diff --quiet "$upstream" HEAD -- \
              .github/workflows/v2-book-progress-store.yml \
              acs/bookreader.py \
              acs/book_index.py \
              acs/bookdocument.py \
              acs/book_game_content.py \
              acs/book_library_game_lookup.py \
              acs/book_training.py \
              acs/training.py \
              acs/book_webview_bridge.py \
              acs/book_webview_projection.py \
              acs/full_product_presenters.py \
              acs/gametree.py \
              acs/pgn_roundtrip.py \
              acs/chesscore.py \
              acs/analysis_service.py \
              acs/engine_assisted_workflows.py \
              acs/acsdb.py \
              web/full_product_books_training.js \
              acs/stage1_release_ui.py
            echo 'BOOK_PROGRESS_TOPOLOGY=BOUNDED_FEATURE'
          elif [ "$workflow_repair" = true ]; then
            git diff --check "$current_product" HEAD
            echo 'BOOK_PROGRESS_TOPOLOGY=WORKFLOW_ONLY_REPAIR'
          elif [ "$recovery_successor" = true ]; then
            git diff --check "$current_product" HEAD
            # The recovery successor may change the store implementation but
            # not the canonical BookProgress regression authorities.
            git diff --quiet "$current_product" HEAD -- \
              tests/test_v2_book_progress_store.py \
              tests/test_v2_book_progress_store_production.py
            echo 'BOOK_PROGRESS_TOPOLOGY=RECOVERY_SUCCESSOR'
          elif [ "$orphan_backup_successor" = true ]; then
            git diff --check "$current_product" HEAD
            # This successor changes only the missing-primary recovery authority,
            # its exact qualification gates, and the base regression file.
            git diff --quiet "$current_product" HEAD -- \
              tests/test_v2_book_progress_store_production.py \
              acs/bookreader.py \
              acs/bookdocument.py \
              acs/book_game_content.py \
              acs/book_webview_bridge.py \
              acs/book_webview_projection.py \
              acs/version2_application.py
            echo 'BOOK_PROGRESS_TOPOLOGY=ORPHAN_BACKUP_SUCCESSOR'
          elif [ "$full_product_composition" = true ]; then
            # The repair is composed into the live Full Product. A broad Product
            # history is legitimate only on that exact canonical branch.
            git merge-base --is-ancestor "$CURRENT_PROGRESS_OWNER" HEAD
            test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$CURRENT_STORE_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$CURRENT_BASE_TEST_BLOB"
            test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$CURRENT_PRODUCTION_TEST_BLOB"
            git diff --check "$CURRENT_PROGRESS_OWNER" HEAD -- \
              acs/book_progress_store.py \
              tests/test_v2_book_progress_store.py \
              tests/test_v2_book_progress_store_production.py
            echo 'BOOK_PROGRESS_TOPOLOGY=CURRENT_FULL_PRODUCT_COMPOSITION'
          else
            echo 'Unsupported Book Progress workflow topology' >&2
            exit 1
          fi

          # Every accepted topology must retain the current BookProgress owner
          # and exact current owned blobs.
          git merge-base --is-ancestor "$CURRENT_PROGRESS_OWNER" HEAD
          test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$CURRENT_STORE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$CURRENT_BASE_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_progress_store_production.py)" = "$CURRENT_PRODUCTION_TEST_BLOB"
          echo 'BOOK PROGRESS PRODUCTION OWNERSHIP PASS'

      - name: Compile Book progress repair
        run: >-
          python -m compileall -q
          acs/book_progress_store.py
          tests/test_v2_book_progress_store_production.py
          tests/test_v2_book_progress_store.py

      - name: Deterministic production Book progress regressions
        run: python -m unittest -v tests.test_v2_book_progress_store_production

      - name: Existing Book progress and semantic reading regressions
        run: >-
          python -m unittest -v
          tests.test_v2_book_progress_store
          tests.test_bookreader
          tests.test_bookdocument

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
