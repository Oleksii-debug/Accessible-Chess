name: WordDeck archived user-approved 1156 completion

on:
  workflow_dispatch:

# The 1156 user-approved translations are already integrated and independently
# accepted. The original transport workflow could write directly to the
# canonical branch; it is retained only as a historical marker and cannot
# perform that mutation anymore.
permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Explain archived status
        run: echo 'The 1156-row transport is complete and archived. No translation, branch, audio or release mutation is performed.'
