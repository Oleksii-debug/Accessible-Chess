name: V2 Release Navigation Schema Focus

on:
  push:
    branches:
      - fix/v2-release-navigation-schema-focus-20261003
  pull_request:
    branches:
      - fix/books-training-exact-payload-dict-20261003
    paths:
      - 'web/version2_release_bootstrap.js'
      - 'tests/js/version2_release_bootstrap_dom_test.js'
      - '.github/workflows/v2-release-navigation-schema-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-release-navigation-schema-focus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact stacked parent and bounded release scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"

          parent='26ae0578e34eadcad1abf9b717fbe2980519ebe0'
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          test "$(git merge-base "$parent" HEAD)" = "$parent"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test '${{ github.event.pull_request.base.ref }}' = 'fix/books-training-exact-payload-dict-20261003'
            test '${{ github.event.pull_request.base.sha }}' = "$parent"
          fi

          git diff --check "$parent" HEAD
          changed="$(git diff --name-only "$parent" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/v2-release-navigation-schema-focus.yml'             'tests/js/version2_release_bootstrap_dom_test.js'             'web/version2_release_bootstrap.js' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:web/version2_release_bootstrap.js)" = "e11644b5a8c102d8cb172b313d7bb8550eaaada1"
          test "$(git rev-parse HEAD:tests/js/version2_release_bootstrap_dom_test.js)" = "0a5a1828bf8a1ae1ff0e4b9af3f7b28385e02c5f"

          echo 'V2_RELEASE_NAVIGATION_SCHEMA_FOCUS_SCOPE=PASS'

      - name: Validate release bootstrap JavaScript
        run: |
          node --check web/version2_release_bootstrap.js
          node --check tests/js/version2_release_bootstrap_dom_test.js
          node tests/js/version2_release_bootstrap_dom_test.js

      - name: Adjacent Python release and focus regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_accessibility_contract
          tests.test_version2_book_board_refresh_focus_order_evidence
          tests.test_dev1_full_product_webview_adapter
          tests.test_version2_application

      - name: Core selftest
        run: python -m acs.selftest
