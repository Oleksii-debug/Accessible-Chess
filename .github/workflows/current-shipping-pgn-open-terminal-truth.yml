name: Current Shipping PGN Save Terminal Truth

on:
  push:
    branches:
      - fix/current-shipping-pgn-save-terminal-truth-20261006-hy6ez0h
  pull_request:
    branches:
      - converge/current-shipping-pgn-open-terminal-truth-20261006-c2mbezb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-shipping-pgn-save-terminal-truth-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  SHIPPING_PARENT_BRANCH: converge/current-shipping-pgn-open-terminal-truth-20261006-c2mbezb
  SHIPPING_PARENT_SHA: eace8b671934c1acf6e12a4a59a95bc6274a8f1d
  RUNTIME_FIX_BRANCH: fix/current-runtime-pgn-open-terminal-truth-20261006-c2mbezb
  RUNTIME_FIX_SHA: a7a30a63bed70ae5c5d3a7298c0dd14755897f78
  SOURCE_BLOB: e1a56840490acccedc6d59d1d5e1d9d378e02528
  OPEN_TEST_BLOB: ff53746aea9054823b9a8cbf9619cbc8848d246f
  PARENT_SAVE_TEST_BLOB: a9fb0eb40d8b48b75a900318db72ad62bb825b3e
  SAVE_TEST_BLOB: 458b093db5f87b072b0e816c6d8309228fd5cf43

jobs:
  shipping-terminal-truth:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Prove exact shipping apex and late-save terminal correction
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "$head_sha" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$head_sha" = "${{ github.sha }}"
          fi

          git fetch --no-tags origin             "+refs/heads/$SHIPPING_PARENT_BRANCH:refs/remotes/origin/shipping-parent"             "+refs/heads/$RUNTIME_FIX_BRANCH:refs/remotes/origin/runtime-fix"
          test "$(git rev-parse refs/remotes/origin/shipping-parent)" = "$SHIPPING_PARENT_SHA"
          test "$(git rev-parse refs/remotes/origin/runtime-fix)" = "$RUNTIME_FIX_SHA"
          test "$(git merge-base "$SHIPPING_PARENT_SHA" HEAD)" = "$SHIPPING_PARENT_SHA"
          git diff --check "$SHIPPING_PARENT_SHA"...HEAD

          mapfile -t paths < <(git diff --name-only "$SHIPPING_PARENT_SHA"...HEAD | sort)
          expected=(
            ".github/workflows/current-shipping-pgn-open-terminal-truth.yml"
            "tests/test_v2_windows_pgn_save_worker.py"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${paths[$i]}" = "${expected[$i]}"
          done

          test "$(git rev-parse HEAD:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_windows_pgn_save_worker.py)" = "$SAVE_TEST_BLOB"
          test "$(git rev-parse refs/remotes/origin/shipping-parent:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse refs/remotes/origin/shipping-parent:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"
          test "$(git rev-parse refs/remotes/origin/shipping-parent:tests/test_v2_windows_pgn_save_worker.py)" = "$PARENT_SAVE_TEST_BLOB"
          test "$(git rev-parse refs/remotes/origin/runtime-fix:acs/version2_windows_file_workflows.py)" = "$SOURCE_BLOB"
          test "$(git rev-parse refs/remotes/origin/runtime-fix:tests/test_v2_windows_pgn_open_worker.py)" = "$OPEN_TEST_BLOB"

      - name: Compile runtime, semantic, package and receipt boundaries
        run: >-
          python -m py_compile
          run_accessible_chess.py
          acs/bookreader.py
          acs/book_board_workflow.py
          acs/library_webview_projection.py
          acs/pgn_document.py
          acs/pgn_save_snapshot.py
          acs/pgn_workspace.py
          acs/version2_application.py
          acs/version2_windows_file_workflows.py
          acs/version2_package_assembler.py
          acs/version2_package_preflight.py
          acs/version2_portable_package.py
          acs/version2_release_app.py
          acs/version2_release_receipt.py
          scripts/finalize_owner_final_receipt.py
          scripts/record_owner_physical_acceptance.py
          tests/test_v2_windows_pgn_open_worker.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Execute Books semantic navigation and recovery contracts
        run: >-
          python -m unittest -v
          tests.test_dev1_library_webview_projection
          tests.test_bookreader_revision_barriers_current
          tests.test_book_bidirectional_semantic_navigation
          tests.test_v2_book_board_workflow
          tests.test_version2_book_workspace

      - name: Execute PGN terminal, persistence and NVDA-adjacent contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_open_invalid_session
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_file_worker_preflight
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_nvda_file_workflows
          tests.test_pgn_document_passive_ingress
          tests.test_pgn_save_snapshot

      - name: Execute whole-product and durable shipping contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_host_runtime
          tests.test_version2_application
          tests.test_whole_product_user_journey
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening
          tests.test_v2_package_required_resources
          tests.test_version2_package_pe_identity
          tests.test_version2_package_assembler
          tests.test_version2_release_payload
          tests.test_version2_portable_package
          tests.test_portable_launcher_contract
          tests.test_portable_launcher_window_readiness
          tests.test_portable_localappdata_persistence_binding
          tests.test_version2_release_receipt
          tests.test_finalize_owner_final_receipt
          tests.test_owner_physical_acceptance
          tests.test_owner_physical_acceptance_json_hardening
          tests.test_version2_package_zip_topology_preflight

      - name: Core selftest
        run: python -m acs.selftest

  semantic-copy-oracle:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
      - name: Execute semantic document-copy oracle
        run: >-
          node --check tests/p0_semantic_document_copy_executable.js
          node tests/p0_semantic_document_copy_executable.js
          python -m unittest -v tests.test_p0_semantic_document_copy
