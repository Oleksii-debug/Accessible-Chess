name: Portable Launcher Report Reparse Safety

on:
  pull_request:
    paths:
      - 'packaging/portable_launcher.c'
      - 'tests/test_portable_launcher_report_reparse.py'
      - '.github/workflows/portable-launch-report-reparse-safety.yml'
  push:
    branches:
      - 'fix/portable-launch-report-reparse-20261004-sol56a4'
    paths:
      - 'packaging/portable_launcher.c'
      - 'tests/test_portable_launcher_report_reparse.py'
      - '.github/workflows/portable-launch-report-reparse-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-launch-report-reparse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Run focused report safety contract
        run: python -m unittest tests.test_portable_launcher_report_reparse -v

  windows-native-build:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build native x64 launcher with warnings as errors
        shell: cmd
        run: |
          @echo off
          setlocal EnableExtensions
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 20
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 21
          if not exist build mkdir build
          cl /nologo /utf-8 /W4 /WX /O2 /GS- /DUNICODE /D_UNICODE /c packaging\portable_launcher.c /Fo:build\portable_launcher.obj || exit /b 22
          link /nologo /MACHINE:X64 /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /NODEFAULTLIB build\portable_launcher.obj kernel32.lib user32.lib /OUT:build\AccessibleChess.exe || exit /b 23
          dumpbin /dependents build\AccessibleChess.exe > build\dependents.txt || exit /b 24
      - name: Keep launcher dependency closure minimal
        shell: pwsh
        run: |
          $deps = @(
            Get-Content build/dependents.txt |
              ForEach-Object {
                if ($_ -match '^\s+([A-Za-z0-9_.-]+\.dll)\s*$') { $Matches[1].ToUpperInvariant() }
              } |
              Where-Object { $_ } |
              Sort-Object -Unique
          )
          $expected = @('KERNEL32.DLL', 'USER32.DLL')
          if (@(Compare-Object $expected $deps).Count -ne 0) {
            throw "Portable launcher dependency drift: $($deps -join ', ')"
          }
