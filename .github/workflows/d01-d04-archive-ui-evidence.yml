name: D01 D04 Archive Repair UI/NVDA Evidence

on:
  pull_request:
    branches:
      - d04/stage1-release-archive-canonicality-20260823
    paths:
      - '.github/workflows/d01-d04-archive-ui-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_SHA: 0dae9b62fd4f152a5f362674e11039ad34b481c3
  D01_FOCUS_BLOB: bced41192feb068a71ed0789be5629164a37e6c9
  D04_PREFLIGHT_BLOB: f8fc86f2f9814ca97821ef8199ba4a2dc7ab81dd
  DEV5_FOCUS_ORACLE_SHA: 965f8ed95eb2ae4f2e628b77855c0a6dbd0d4321
  DEV5_FOCUS_ORACLE_BLOB: 2fec761ded7e3af193b6f309f03876141be8ab41

jobs:
  verify:
    name: D01 UI/NVDA evidence — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve LF semantics on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install -q pytest

      - name: Prove exact Product ancestry and D01/D04 blob identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse "$PRODUCT_SHA:web/stage1_release_bootstrap.js")" = "$D01_FOCUS_BLOB"
          test "$(git rev-parse "$PRODUCT_SHA:acs/release_preflight.py")" = "$D04_PREFLIGHT_BLOB"
          test "$(git rev-parse HEAD:web/stage1_release_bootstrap.js)" = "$D01_FOCUS_BLOB"
          test "$(git rev-parse HEAD:acs/release_preflight.py)" = "$D04_PREFLIGHT_BLOB"
          git diff --check "$PRODUCT_SHA" HEAD
          changed="$(git diff --name-only "$PRODUCT_SHA" HEAD)"
          test "$changed" = '.github/workflows/d01-d04-archive-ui-evidence.yml'

      - name: Parse and compile
        run: |
          node --check web/stage1_release_bootstrap.js
          node --check web/stage1_board_actions.js
          python -m compileall -q acs tests run_accessible_chess.py

      - name: Candidate-facing D01 UI/NVDA/focus contracts
        run: >-
          python -m unittest -v
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_issue22_release_contract
          tests.test_stage1_release_composition_ui
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_native_menu_action_routing
          tests.test_board_rank_file_remapping_ui

      - name: Replay immutable DEV5 submit-focus oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$DEV5_FOCUS_ORACLE_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py")" = "$DEV5_FOCUS_ORACLE_BLOB"
          rm -rf qa_oracles
          mkdir -p qa_oracles
          : > qa_oracles/__init__.py
          git show "$DEV5_FOCUS_ORACLE_SHA:tests/test_dev5_stage1_submit_listener_focus_route.py" > qa_oracles/test_dev5_stage1_submit_listener_focus_route.py
          test "$(git hash-object qa_oracles/test_dev5_stage1_submit_listener_focus_route.py)" = "$DEV5_FOCUS_ORACLE_BLOB"
          python -m unittest -v qa_oracles.test_dev5_stage1_submit_listener_focus_route

      - name: D04 archive canonicality regressions
        run: >-
          python -m unittest -v
          tests.test_d04_release_archive_canonicality
          tests.test_d04_release_preflight_hygiene
          tests.test_release_preflight

      - name: Full unittest regression
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Full pytest regression
        run: python -m pytest -q

      - name: Canonical SELFTEST
        run: python -m acs.selftest

      - name: Complete WebView2 diagnostic
        run: python run_accessible_chess.py --diagnostic
