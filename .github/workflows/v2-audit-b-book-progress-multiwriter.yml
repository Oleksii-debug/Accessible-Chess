name: V2 Audit-B Book Progress Multiwriter Oracle

on:
  push:
    branches:
      - audit/v2-book-progress-multiwriter-20260828
  pull_request:
    paths:
      - 'tests/test_v2_audit_b_book_progress_multiwriter.py'
      - '.github/workflows/v2-audit-b-book-progress-multiwriter.yml'
      - 'acs/book_progress_store.py'

permissions:
  contents: read

concurrency:
  group: v2-audit-b-book-progress-multiwriter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2
      - name: Exact authority and evidence-only scope
        shell: bash
        env:
          PRODUCT_HEAD: 575ec0088982d2f90adb47c040a5714d68186b0e
          STORE_BLOB: 665e2f4d09460f69850e4f71d739eca8e71f932e
        run: |
          set -euo pipefail
          test "$(git merge-base "$PRODUCT_HEAD" HEAD)" = "$PRODUCT_HEAD"
          git diff --check "$PRODUCT_HEAD" HEAD
          changed="$(git diff --name-only "$PRODUCT_HEAD" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-audit-b-book-progress-multiwriter.yml' \
            'tests/test_v2_audit_b_book_progress_multiwriter.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$STORE_BLOB"
      - name: Compile audit surface
        run: python -m compileall -q tests/test_v2_audit_b_book_progress_multiwriter.py
      - name: Existing Book progress regressions remain green
        run: >-
          python -m unittest -v
          tests.test_v2_book_progress_store
          tests.test_bookreader
          tests.test_bookdocument
      - name: Broad exact-product regressions remain green
        shell: bash
        env:
          PRODUCT_HEAD: 575ec0088982d2f90adb47c040a5714d68186b0e
        run: |
          set -euo pipefail
          product_tree="../v2-book-progress-product-${GITHUB_RUN_ID}-${RUNNER_OS}"
          rm -rf "$product_tree"
          git worktree add --detach "$product_tree" "$PRODUCT_HEAD"
          cleanup() {
            git worktree remove --force "$product_tree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          (
            cd "$product_tree"
            python -m unittest discover -s tests
            python -m pytest -q tests
          )
          cleanup
          trap - EXIT
      - name: Independent multi-writer lost-update oracle
        if: ${{ always() }}
        run: python -m unittest -v tests.test_v2_audit_b_book_progress_multiwriter
