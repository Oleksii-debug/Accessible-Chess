name: D10 Education Records CI

on:
  pull_request:
    paths:
      - 'acs/education_records.py'
      - 'acs/classroom_domain.py'
      - 'acs/remote_session.py'
      - 'tests/test_education_records.py'
      - 'tests/test_classroom_domain.py'
      - 'tests/test_classroom_domain_corruption.py'
      - 'tests/test_remote_session.py'
      - '.github/workflows/d10-education-records-ci.yml'

permissions:
  contents: read

jobs:
  d10-education-records:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/work-ci.txt ]; then python -m pip install -r requirements/work-ci.txt; fi
          python -m pip install pytest
      - name: Diff hygiene
        run: git diff --check HEAD^1 HEAD
      - name: Compile D10 domain
        run: python -m compileall -q acs/education_records.py acs/classroom_domain.py acs/remote_session.py tests/test_education_records.py
      - name: Focused D10 education records
        run: python -m unittest tests.test_education_records -v
      - name: Existing classroom domain regressions
        run: python -m unittest tests.test_classroom_domain tests.test_classroom_domain_corruption -v
      - name: Existing remote session regressions
        run: python -m unittest tests.test_remote_session -v
      - name: Full unittest regression
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Full pytest regression, unweakened evidence
        id: full_pytest
        continue-on-error: true
        run: python -m pytest -q
      - name: Fail-closed inherited pytest baseline proof
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.full_pytest.outcome }}" = "success" ]; then
            echo "Full pytest is green; no baseline exception needed."
            exit 0
          fi

          # D10 must not touch the static UI source or the two known baseline tests.
          git diff --quiet HEAD^1 HEAD -- web/index.html tests/test_board_rank_file_remapping_ui.py

          # Every pytest except the two exact inherited failures must pass on D10 head.
          python -m pytest -q -k "not test_board_dispatch_uses_action_ids_instead_of_hardcoded_digit_shortcuts and not test_help_is_generated_from_live_rank_and_file_bindings"

          head_one='tests/test_board_rank_file_remapping_ui.py::test_board_dispatch_uses_action_ids_instead_of_hardcoded_digit_shortcuts'
          head_two='tests/test_board_rank_file_remapping_ui.py::test_help_is_generated_from_live_rank_and_file_bindings'

          set +e
          python -m pytest -q "$head_one" "$head_two" > /tmp/d10-head-known.txt 2>&1
          head_status=$?
          set -e
          cat /tmp/d10-head-known.txt
          test "$head_status" -eq 1
          grep -q '2 failed' /tmp/d10-head-known.txt

          # Prove the exact PR base has the same two failures, rather than declaring them unrelated.
          git worktree add --detach /tmp/d10-base HEAD^1
          set +e
          (cd /tmp/d10-base && python -m pytest -q "$head_one" "$head_two") > /tmp/d10-base-known.txt 2>&1
          base_status=$?
          set -e
          cat /tmp/d10-base-known.txt
          test "$base_status" -eq 1
          grep -q '2 failed' /tmp/d10-base-known.txt

          echo "D10 BASELINE PROOF PASS: only the two exact unchanged base UI tests remain red."
