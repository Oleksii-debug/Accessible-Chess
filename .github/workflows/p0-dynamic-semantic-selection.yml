name: P0 Dynamic Semantic Selection Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'web/p0_accessibility_runtime.js'
      - 'tests/test_p0_semantic_document_copy.py'
      - 'tests/test_p0_dynamic_selection_action_delivery.py'
      - 'tests/js/p0_accessibility_runtime_test.js'
      - 'tests/js/p0_dynamic_selection_preservation_test.js'
      - '.github/workflows/p0-dynamic-semantic-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-dynamic-semantic-selection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove bounded P0 qualification scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/p0-dynamic-semantic-selection.yml|tests/js/p0_dynamic_selection_preservation_test.js|tests/test_p0_dynamic_selection_action_delivery.py)
                ;;
              *)
                printf 'Unexpected path in P0 dynamic-selection qualification: %s\n' "$path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$base" HEAD)

      - name: Compile and parse P0 accessibility qualification
        run: |
          python -m compileall -q tests/test_p0_dynamic_selection_action_delivery.py tests/test_p0_semantic_document_copy.py
          node --check web/p0_accessibility_runtime.js
          node --check tests/js/p0_accessibility_runtime_test.js
          node --check tests/js/p0_dynamic_selection_preservation_test.js

      - name: Execute native-selection source contracts
        run: >-
          python -m unittest -v
          tests.test_p0_semantic_document_copy
          tests.test_p0_dynamic_selection_action_delivery

      - name: Execute focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_p0_semantic_document_copy.py
          tests/test_p0_dynamic_selection_action_delivery.py

      - name: Full repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest on Windows
        if: matrix.os == 'windows-2025'
        run: python -m pytest -q tests
