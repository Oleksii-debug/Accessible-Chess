name: Section 1 FEN Corpus Source Snapshot

on:
  pull_request:
    branches:
      - 'section1/san-transition-boundary-20261007-sol56'
    paths:
      - '.github/workflows/section1-fen-corpus-source-snapshot.yml'
      - 'tools/qualify_fen_position_corpus.py'
      - 'tests/test_qualify_fen_position_corpus.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section1-fen-corpus-source-snapshot-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_BASE_SHA: ff7798bdec33393cdd6ad79c1e30e0dba12d7b94
  TOOL_BLOB: 6a230daff4c511339669c330fb4aabc988c7f86f
  TEST_BLOB: ff9b303ab9db4f61a707a6f3d53aa3b21596857d
  IMPORT_CONTRACT_BLOB: b302b1666511289a70b5b3569ed5360b5cb66a95
  P0F_PROVENANCE_BLOB: 3298aed00ca000d27f607cd861abbba9483ff358
  P0F_BUILDER_BLOB: b7b96a661652a17cb16e8ca4cabba3b8b373e483
  PINNED_CORPUS_SHA256: aa40b3671fa3cf1072eb182892cd90b0e1e003a4a5943492f64b77e7f3fd1635

jobs:
  source-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact child geometry
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected_head="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected_head"
          test "$EVENT_BASE_REF" = "section1/san-transition-boundary-20261007-sol56"
          test "$EVENT_BASE_SHA" = "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git diff --check "$EXPECTED_BASE_SHA"...HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE_SHA"...HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/section1-fen-corpus-source-snapshot.yml' \
            'tools/qualify_fen_position_corpus.py' \
            'tests/test_qualify_fen_position_corpus.py' | sort)"
          test "$changed" = "$expected"

      - name: Bind canonical source authority and repaired bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/qualify_fen_position_corpus.py)" = "$TOOL_BLOB"
          test "$(git rev-parse HEAD:tests/test_qualify_fen_position_corpus.py)" = "$TEST_BLOB"
          test "$(git rev-parse HEAD:acs/import_contract.py)" = "$IMPORT_CONTRACT_BLOB"
          python - <<'PY'
          from tools import qualify_fen_position_corpus as q
          from acs.import_contract import read_source_snapshot
          assert q.read_source_snapshot is read_source_snapshot
          print("FEN_CORPUS_CANONICAL_SOURCE_IMPORT=PASS")
          PY

      - name: Compile repaired qualifier
        run: >-
          python -m py_compile
          tools/qualify_fen_position_corpus.py
          tests/test_qualify_fen_position_corpus.py

      - name: Run focused source and FEN regressions
        run: >-
          python -m unittest -v
          tests.test_qualify_fen_position_corpus
          tests.test_import_contract
          tests.test_pgn_open_source_binding
          tests.test_pgn_open_direct_source
          tests.test_fen_position_editor_complete_user_flow
          tests.test_position_text_authority

      - name: Core chess selftest
        run: python -m acs.selftest

  lawful-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Bind lawful corpus authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:docs/P0F_STARTER_CONTENT_PROVENANCE.md)" = "$P0F_PROVENANCE_BLOB"
          test "$(git rev-parse HEAD:tools/p0f_lawful_starter_bundle.py)" = "$P0F_BUILDER_BLOB"
          test "$(git rev-parse HEAD:tools/qualify_fen_position_corpus.py)" = "$TOOL_BLOB"
          test "$(git rev-parse HEAD:tests/test_qualify_fen_position_corpus.py)" = "$TEST_BLOB"

      - name: Install qualified corpus decompressor
        run: python -m pip install -q zstandard==0.23.0

      - name: Build pinned CC0 real-game sample
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD" python tools/p0f_lawful_starter_bundle.py .fen-lawful

      - name: Verify source provenance and qualify positions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path(".fen-lawful")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          source = manifest["starter_source"]
          starter = root / "starter_uk.pgn"
          entry = manifest["files"]["starter_uk.pgn"]
          digest = hashlib.sha256(starter.read_bytes()).hexdigest()
          assert source["compressed_sha256"] == os.environ["PINNED_CORPUS_SHA256"]
          assert source["license_id"] == "CC0-1.0"
          assert int(source["selected_games"]) >= 200
          assert entry["license_id"] == "CC0-1.0"
          assert entry["sha256"] == digest
          print("LAWFUL_FEN_CORPUS_PROVENANCE=PASS")
          PY
          PYTHONPATH="$PWD" python tools/qualify_fen_position_corpus.py \
            .fen-lawful/starter_uk.pgn \
            --min-games 200 \
            --min-positions 5000 \
            --require-edge-coverage \
            --json-out .fen-lawful/fen_position_qualification.json
