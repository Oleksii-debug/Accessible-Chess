# exact-package-reconvergence: 6be0afe / p0g 6be0afe / p0-document 6be0afe / merge 4dd14b4
# qualification-request: ACCESSIBLE-CHESS-20261006-W5-CURRENT-SHIPPING-EXACT
name: Post-freeze V2 Windows Package Qualification

on:
  push:
    branches:
      - work/post-freeze-v2-windows-package-qualification-20260911
  pull_request:
    branches:
      - work/post-freeze-v2-windows-package-qualification-20260911
    paths:
      - .github/workflows/post-freeze-v2-windows-package-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-freeze-v2-windows-package-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_PARENT_SHA: 6be0afe67366b62757baae53ab0eaae6b8bfafdf
  PREVIOUS_PACKAGE_SHA: c53a3c12c8e6c21fb53529f2aa7174c3450b66a9
  PREVIOUS_PUBLICATION_SHA: c53a3c12c8e6c21fb53529f2aa7174c3450b66a9
  RECONVERGENCE_MERGE_SHA: 4dd14b48bc59a14744bc3a23f1bc04ab9fc14d41
  PUBLICATION_PARENT_SHA: 4dd14b48bc59a14744bc3a23f1bc04ab9fc14d41
  PREVIOUS_WORKFLOW_BLOB_SHA: 182a84ca1e552c8cc93473d179a324ae723ab6e7
  EXECUTOR_TEMPLATE_SHA: c5cb1b53c73bea68a34df6123ea51a9bba0d7e02
  EXECUTOR_TEMPLATE_WORKFLOW_BLOB_SHA: ed8d3ff3fa88bf530c92ef8b1fc7a40085305599
  QUALIFICATION_AUTHORITY_SHA: 679393e2d4f490d47923c607e75b5555e0ba869c
  PRIOR_WORKFLOW_BLOB_SHA: 9fa2373462bb43378a06681740b22f3f7f465b63
  QUALIFICATION_SOURCE_PATH: .github/workflows/post-freeze-v2-windows-package-qualification.yml
  WINFORMS_ACCESSIBILITY_CONFIG_BLOB: 8cfd9b64f1a019cda4ae914017f8077f5aba3013
  P0G_QA_SHA: 6be0afe67366b62757baae53ab0eaae6b8bfafdf
  P0G_PROBE_BLOB_SHA: 8fdd8dfb1f6b7b9118980f7fdea09d336035ac72
  P0G_PROBE_PATH: scripts/p0g_packaged_hotkey_result_probe.ps1
  P0_DOCUMENT_QA_SHA: 6be0afe67366b62757baae53ab0eaae6b8bfafdf
  P0_DOCUMENT_PROBE_BLOB_SHA: 08c343f04b6383445b9360f5cee346d7a4a414a5
  P0_DOCUMENT_PROBE_PATH: scripts/p0_packaged_document_copy_probe.ps1
  PYTHON_VERSION: '3.12.10'
  PYWEBVIEW_VERSION: '6.2.1'
  PYTHONNET_VERSION: '3.1.0'
  CLR_LOADER_VERSION: '0.3.1'
  CFFI_VERSION: '2.1.1'
  PYCPARSER_VERSION: '3.0'
  TYPING_EXTENSIONS_VERSION: '4.16.0'
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_VERSION: '4.1.0'
  ZSTANDARD_VERSION: '0.25.0'
  STARTER_ZSTANDARD_VERSION: '0.23.0'
  QA_WRAPPER_COMMIT: bf4a4c1c71860c90d1b086ea4f91fa34b665cb81
  QA_BASELINE_COMMIT: 0549391267073f9d006ec8271af148fe17edcdb6
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip
  STOCKFISH_SHA256: 40cc975817e7eee270b03f354810d20956df565420d320f6dd37d454dc81a139

jobs:
  qualify-package:
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - name: Checkout exact package qualification child
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact W5 qualification child
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"

      - name: Bind exact current Product and preserved W5 lineage
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PRODUCT_PARENT_SHA^{commit}"
          git cat-file -e "$PREVIOUS_PACKAGE_SHA^{commit}"
          git cat-file -e "$EXECUTOR_TEMPLATE_SHA^{commit}"
          git cat-file -e "$P0G_QA_SHA^{commit}"
          git cat-file -e "$P0_DOCUMENT_QA_SHA^{commit}"
          git cat-file -e "$PREVIOUS_PUBLICATION_SHA^{commit}"
          git cat-file -e "$RECONVERGENCE_MERGE_SHA^{commit}"
          git cat-file -e "$PUBLICATION_PARENT_SHA^{commit}"
          test "$(git merge-base "$PUBLICATION_PARENT_SHA" HEAD)" = "$PUBLICATION_PARENT_SHA"
          test "$(git show -s --format=%P "$RECONVERGENCE_MERGE_SHA")" = "$PREVIOUS_PUBLICATION_SHA $PRODUCT_PARENT_SHA"
          test "$(git merge-base "$RECONVERGENCE_MERGE_SHA" "$PUBLICATION_PARENT_SHA")" = "$RECONVERGENCE_MERGE_SHA"
          test "$(git merge-base "$PRODUCT_PARENT_SHA" "$RECONVERGENCE_MERGE_SHA")" = "$PRODUCT_PARENT_SHA"
          test "$(git merge-base "$PREVIOUS_PACKAGE_SHA" "$RECONVERGENCE_MERGE_SHA")" = "$PREVIOUS_PACKAGE_SHA"
          test "$(git merge-base "$RECONVERGENCE_MERGE_SHA" HEAD)" = "$RECONVERGENCE_MERGE_SHA"
          test "$(git merge-base "$PRODUCT_PARENT_SHA" HEAD)" = "$PRODUCT_PARENT_SHA"
          test "$(git merge-base "$PREVIOUS_PACKAGE_SHA" HEAD)" = "$PREVIOUS_PACKAGE_SHA"
          test "$(git merge-base "$PRODUCT_PARENT_SHA" "$P0G_QA_SHA")" = "$PRODUCT_PARENT_SHA"
          test "$(git merge-base "$PRODUCT_PARENT_SHA" "$P0_DOCUMENT_QA_SHA")" = "$PRODUCT_PARENT_SHA"
          changed="$(git diff --name-only "$PRODUCT_PARENT_SHA" HEAD)"
          test "$changed" = "$QUALIFICATION_SOURCE_PATH"
          git diff --check "$PRODUCT_PARENT_SHA" HEAD
          if git cat-file -e "$PRODUCT_PARENT_SHA:$QUALIFICATION_SOURCE_PATH" 2>/dev/null; then
            echo 'PACKAGE_WORKFLOW_ALREADY_PRESENT_IN_PRODUCT_PARENT' >&2
            exit 1
          fi
          config_blob="$(git rev-parse "$PRODUCT_PARENT_SHA:packaging/AccessibleChess.exe.config")"
          test "$config_blob" = "$WINFORMS_ACCESSIBILITY_CONFIG_BLOB"
          previous_blob="$(git rev-parse "$PREVIOUS_PACKAGE_SHA:$QUALIFICATION_SOURCE_PATH")"
          test "$previous_blob" = "$PREVIOUS_WORKFLOW_BLOB_SHA"
          executor_template_blob="$(git rev-parse "$EXECUTOR_TEMPLATE_SHA:$QUALIFICATION_SOURCE_PATH")"
          test "$executor_template_blob" = "$EXECUTOR_TEMPLATE_WORKFLOW_BLOB_SHA"
          authority_blob="$(git rev-parse "$QUALIFICATION_AUTHORITY_SHA:$QUALIFICATION_SOURCE_PATH")"
          test "$authority_blob" = "$PRIOR_WORKFLOW_BLOB_SHA"
          p0g_probe_blob="$(git rev-parse "$P0G_QA_SHA:$P0G_PROBE_PATH")"
          test "$p0g_probe_blob" = "$P0G_PROBE_BLOB_SHA"
          document_probe_blob="$(git rev-parse "$P0_DOCUMENT_QA_SHA:$P0_DOCUMENT_PROBE_PATH")"
          test "$document_probe_blob" = "$P0_DOCUMENT_PROBE_BLOB_SHA"
          git show "$PREVIOUS_PACKAGE_SHA:$QUALIFICATION_SOURCE_PATH" > .previous-package-qualification.yml
          git show "$EXECUTOR_TEMPLATE_SHA:$QUALIFICATION_SOURCE_PATH" > .executor-template-package.yml
          git show "$QUALIFICATION_AUTHORITY_SHA:$QUALIFICATION_SOURCE_PATH" > .package-qualification-source.yml
          git show "$P0G_QA_SHA:$P0G_PROBE_PATH" > .p0g-packaged-hotkey-result-probe.ps1
          git show "$P0_DOCUMENT_QA_SHA:$P0_DOCUMENT_PROBE_PATH" > .p0-packaged-document-copy-probe.ps1
          test -s .previous-package-qualification.yml
          test -s .executor-template-package.yml
          test -s .package-qualification-source.yml
          test -s .p0g-packaged-hotkey-result-probe.ps1
          test -s .p0-packaged-document-copy-probe.ps1
          test "$(grep -Fc '      - name: Materialize exact inherited qualification executor' .executor-template-package.yml)" = '1'
          grep -Fq "DOCUMENT_STEP = 'Prove packaged semantic document selection and native Ctrl+C'" .executor-template-package.yml
          grep -Fq "connected provider roots from strict stage1_uia_topology_v5" .executor-template-package.yml
          grep -Fq 'Prove fresh-extracted native MenuBar profile through process-scoped UIA' .package-qualification-source.yml
          grep -Fq '$top.Count -ne 13' .package-qualification-source.yml
          grep -Fq 'training_top_menu_expected=$false' .package-qualification-source.yml
          grep -Fq 'function EnsureEngineEnabled($EngineToggle)' .p0g-packaged-hotkey-result-probe.ps1
          grep -Fq 'function FindVariationButton($Roots,[int]$Index)' .p0g-packaged-hotkey-result-probe.ps1
          grep -Fq 'function SelectedVariation($Roots,[int]$Index)' .p0g-packaged-hotkey-result-probe.ps1
          grep -Fq 'Could not establish opposite variation $opposite before Alt+$index' .p0g-packaged-hotkey-result-probe.ps1
          grep -Fq 'AccessibleChessP0GKeys]::Alt' .p0g-packaged-hotkey-result-probe.ps1
          grep -Fq 'function AssertProductForeground($Process)' .p0g-packaged-hotkey-result-probe.ps1
          grep -Fq 'foreground_product_verified=$true' .p0g-packaged-hotkey-result-probe.ps1
          grep -Fq 'function AssertProviderFocus' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'function ActivateProduct($Shell,$Process,[string]$Phase)' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'function AssertProductForeground($Process,[string]$Phase)' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'function AssertExactPackageBinding([string]$ProductRootPath,[string]$ExpectedSha,[string]$ExePath)' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'AssertExactPackageBinding $root $ProductSha $exe' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'manifest_product_sha_verified=$true' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'executable_checksum_verified=$true' .p0-packaged-document-copy-probe.ps1
          grep -Fq "document_provider_cardinality='exactly one selectable Accessible Chess document containing one exact visible static UIA child target'" .p0-packaged-document-copy-probe.ps1
          grep -Fq "static_document_range_source='TextPattern.RangeFromChild exact named visible static UIA child'" .p0-packaged-document-copy-probe.ps1
          grep -Fq '$navigationDocument.SetFocus()' .p0-packaged-document-copy-probe.ps1
          grep -Fq "AssertProviderFocus \$roots 'native document Ctrl+Home'" .p0-packaged-document-copy-probe.ps1
          grep -Fq '[AccessibleChessCopyKeys]::Ctrl([byte]0x24)' .p0-packaged-document-copy-probe.ps1
          grep -Fq '$documents=$currentDocuments' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'P0_NATIVE_DOCUMENT_HOME_NAVIGATION=PASS' .p0-packaged-document-copy-probe.ps1
          grep -Fq '$probeRange=$candidatePattern.RangeFromChild($namedTargets[0])' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'native_copy_focus_verified=$true' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'foreground_product_verified=$true' .p0-packaged-document-copy-probe.ps1
          grep -Fq "AssertProviderFocus \$roots 'move input copy dispatch after Ctrl+A' 'move-input'" .p0-packaged-document-copy-probe.ps1
          grep -Fq '$selected=[string]$target.GetText(-1)' .p0-packaged-document-copy-probe.ps1
          if grep -Fq '$selected=([string]$target.GetText(-1)).Trim()' .p0-packaged-document-copy-probe.ps1; then
            echo 'STALE_TRIMMED_EXACT_RANGE_EXPECTATION_SURVIVED' >&2
            exit 1
          fi
          grep -Fq 'if($last -ceq $Expected){return $last}' .p0-packaged-document-copy-probe.ps1
          grep -Fq 'first_mismatch_index=$mismatch' .p0-packaged-document-copy-probe.ps1
          grep -Fq "expected_code_units='\$expectedUnits'" .p0-packaged-document-copy-probe.ps1
          grep -Fq "actual_code_units='\$actualUnits'" .p0-packaged-document-copy-probe.ps1
          short="${PRODUCT_PARENT_SHA:0:7}"
          echo "PRODUCT_PARENT=$PRODUCT_PARENT_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_INTEGRATION_SHA=$PRODUCT_PARENT_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_FILE=Accessible-Chess-V2-${short}-post-freeze-package-qualification.zip" >> "$GITHUB_ENV"
          echo "CANDIDATE_PRODUCT_SHA=$PRODUCT_PARENT_SHA"
          echo "PREVIOUS_PACKAGE_CANDIDATE_SHA=$PREVIOUS_PACKAGE_SHA"
          echo "RECONVERGENCE_MERGE_SHA=$RECONVERGENCE_MERGE_SHA"
          echo "PUBLICATION_PARENT_SHA=$PUBLICATION_PARENT_SHA"
          echo "PREVIOUS_PACKAGE_WORKFLOW_BLOB=$previous_blob"
          echo "EXECUTOR_TEMPLATE_SHA=$EXECUTOR_TEMPLATE_SHA"
          echo "EXECUTOR_TEMPLATE_WORKFLOW_BLOB=$executor_template_blob"
          echo "WINFORMS_ACCESSIBILITY_CONFIG_BLOB=$config_blob"
          echo "P0G_QA_SHA=$P0G_QA_SHA"
          echo "P0G_PROBE_BLOB=$p0g_probe_blob"
          echo "P0_DOCUMENT_QA_SHA=$P0_DOCUMENT_QA_SHA"
          echo "P0_DOCUMENT_PROBE_BLOB=$document_probe_blob"
          echo 'CURRENT_PRODUCT_ANCESTRY=PASS'
          echo 'RECONVERGENCE_MERGE_ANCESTRY=PASS'
          echo 'PREVIOUS_W5_ANCESTRY=PASS'
          echo 'PINNED_ENV_RESTORED=PASS'
          echo 'WINFORMS_ACCESSIBILITY_CONFIG_LOCK=PASS'
          echo 'P0G_PROBE_AUTHORITY_LOCK=PASS'
          echo 'P0_DOCUMENT_PROBE_AUTHORITY_LOCK=PASS'
          echo 'WORKFLOW_ONLY_DELTA=PASS'
          echo 'PRODUCT_SOURCE_MUTATION=NONE'

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bind canonical WinForms config into inherited standalone build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.package-qualification-source.yml')
          text = path.read_text(encoding='utf-8')
          needle = "          Write-Host 'STANDALONE_BUILD=PASS'"
          if text.count(needle) != 1:
              raise SystemExit(f'Inherited standalone build marker drifted: count={text.count(needle)}')
          lines = [
              "          $config=(Resolve-Path 'packaging\\AccessibleChess.exe.config').Path",
              "          $target=Join-Path $dist 'AccessibleChess.exe.config'",
              "          Copy-Item -LiteralPath $config -Destination $target -Force",
              "          if(-not (Test-Path -LiteralPath $target -PathType Leaf)){throw 'STANDALONE_WINFORMS_ACCESSIBILITY_CONFIG_MISSING'}",
              "          if((Get-Item -LiteralPath $target).Length -le 0){throw 'STANDALONE_WINFORMS_ACCESSIBILITY_CONFIG_EMPTY'}",
              "          $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $config).Hash",
              "          $targetHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash",
              "          if($sourceHash -ne $targetHash){throw 'STANDALONE_WINFORMS_ACCESSIBILITY_CONFIG_BYTE_MISMATCH'}",
              "          Write-Host \"STANDALONE_WINFORMS_ACCESSIBILITY_CONFIG=PASS sha256=$($targetHash.ToLowerInvariant())\"",
          ]
          replacement = '\n'.join(lines + [needle])
          patched = text.replace(needle, replacement, 1)
          path.write_text(patched, encoding='utf-8', newline='\n')
          if 'STANDALONE_WINFORMS_ACCESSIBILITY_CONFIG=PASS' not in path.read_text(encoding='utf-8'):
              raise SystemExit('Inherited standalone build app-config patch missing after write')
          print('INHERITED_STANDALONE_APPCONFIG_BIND=PASS')
          PY

      - name: Extend inherited package proof with durable Book and Training restart state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.package-qualification-source.yml')
          text = path.read_text(encoding='utf-8')

          def once(needle: str, replacement: str, label: str) -> None:
              global text
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f'{label} drifted: count={count}')
              text = text.replace(needle, replacement, 1)

          helper_needle = """          function CloseByKeyboard($process,[int]$timeoutMs=10000) {"""
          helper_replacement = """          function CurrentBookBlock($report) {
            $ids=@()
            foreach($e in @(Rewalk $report)){
              try {
                $id=[string]$e.Current.AutomationId
                if($id -match '^book-block-[0-9]+$'){$ids += $id}
              } catch {}
            }
            $ids=@($ids | Sort-Object -Unique)
            if($ids.Count -ne 1){throw "Expected one current Book block, found $($ids.Count): $($ids -join ',')"}
            return [string]$ids[0]
          }
          function WaitBookBlock($report,[string]$differentFrom='',[string]$exactId='',[int]$timeoutMs=10000) {
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            $last=''
            while($watch.ElapsedMilliseconds -lt $timeoutMs){
              try {
                $last=CurrentBookBlock $report
                if($exactId){
                  if($last -eq $exactId){return $last}
                } elseif(-not $differentFrom -or $last -ne $differentFrom){
                  return $last
                }
              } catch {$last=$_.Exception.Message}
              Start-Sleep -Milliseconds 150
            }
            throw "Book block did not converge; differentFrom='$differentFrom' exactId='$exactId' last='$last'"
          }
          function SetControlValue($e,[string]$value,[string]$label) {
            try {
              $pattern=$e.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
              if($null -eq $pattern -or [bool]$pattern.Current.IsReadOnly){throw 'writable ValuePattern unavailable'}
              $pattern.SetValue($value)
              if([string]$pattern.Current.Value -cne $value){throw 'ValuePattern readback mismatch'}
            } catch {throw "$label value update failed: $($_.Exception.Message)"}
          }
          function ControlEnabled($e) {
            if($null -eq $e){return $false}
            try{return [bool]$e.Current.IsEnabled}catch{return $false}
          }
          function ActivateByNativeEnter($process,$target,[string]$label) {
            if($null -eq $target){throw "$label target is missing"}
            if(-not [bool]$target.Current.IsEnabled){throw "$label target is disabled"}
            if(-not [bool]$target.Current.IsKeyboardFocusable){throw "$label target is not keyboard focusable"}
            $ws=New-Object -ComObject WScript.Shell
            if(-not $ws.AppActivate($process.Id)){throw "$label could not activate packaged AccessibleChess.exe"}
            $target.SetFocus()
            AssertSemanticFocus $target
            [AccessibleChessPackageKeys]::Key([byte]0x0D)
          }
          function CloseByKeyboard($process,[int]$timeoutMs=10000) {"""
          once(helper_needle, helper_replacement, 'Book persistence helper insertion')

          key_helper_needle = "            public static void Alt(byte vk) {\n"
          key_helper_replacement = """            public static void Alt(byte vk) {
              keybd_event(0x12, 0, 0, UIntPtr.Zero);
              keybd_event(vk, 0, 0, UIntPtr.Zero);
              keybd_event(vk, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);
              keybd_event(0x12, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);
            }
            public static void Key(byte vk) {
              keybd_event(vk, 0, 0, UIntPtr.Zero);
              keybd_event(vk, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);
            }"""
          once(key_helper_needle, key_helper_replacement, 'Native Enter key helper insertion')

          training_helper_needle = """          function CloseByKeyboard($process,[int]$timeoutMs=10000) {"""
          training_helper_replacement = """          function TrainingCounters($report) {
            $documents=@()
            foreach($e in @(Rewalk $report)){
              try {
                if([string]$e.Current.ControlType.ProgrammaticName -eq 'ControlType.Document' -and [string]$e.Current.Name -eq 'Accessible Chess'){
                  $documents += ,$e
                }
              } catch {}
            }
            if($documents.Count -lt 1){throw 'Accessible Chess document unavailable for Training counter proof'}
            foreach($document in $documents){
              try {
                $pattern=$document.GetCurrentPattern([System.Windows.Automation.TextPattern]::Pattern)
                if($null -eq $pattern){continue}
                $text=[string]$pattern.DocumentRange.GetText(-1)
                $attempt=[regex]::Match($text,'(?is)(?:Спроби|Attempts)\\s*([0-9]+)')
                $mistake=[regex]::Match($text,'(?is)(?:Помилки|Mistakes)\\s*([0-9]+)')
                if($attempt.Success -and $mistake.Success){
                  return [pscustomobject]@{
                    attempts=[int]$attempt.Groups[1].Value
                    mistakes=[int]$mistake.Groups[1].Value
                  }
                }
              } catch {}
            }
            throw 'Training attempts/mistakes were not exposed through the Accessible Chess TextPattern'
          }
          function WaitTrainingCounters($report,[int]$attempts,[int]$mistakes,[int]$timeoutMs=10000) {
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            $last=''
            while($watch.ElapsedMilliseconds -lt $timeoutMs){
              try {
                $value=TrainingCounters $report
                $last="attempts=$($value.attempts) mistakes=$($value.mistakes)"
                if([int]$value.attempts -eq $attempts -and [int]$value.mistakes -eq $mistakes){return $value}
              } catch {$last=$_.Exception.Message}
              Start-Sleep -Milliseconds 150
            }
            throw "Training counters did not converge to attempts=$attempts mistakes=$mistakes; last=$last"
          }
          function CloseByKeyboard($process,[int]$timeoutMs=10000) {"""
          once(training_helper_needle, training_helper_replacement, 'Training persistence helper insertion')

          pre_needle = """            $course=WaitControl $report '' '(?i)(стартовий офлайн-курс|starter offline course)' ''
            if(-not (AccessibleText $course)){throw 'Packaged starter course heading is empty'}
            Write-Host 'PACKAGED_W3_BOOKS_DISCOVER_OPEN_READ_OFFLINE=PASS'"""
          pre_replacement = """            $course=WaitControl $report '' '(?i)(стартовий офлайн-курс|starter offline course)' ''
            if(-not (AccessibleText $course)){throw 'Packaged starter course heading is empty'}

            $initialBookBlock=CurrentBookBlock $report
            $moveButton=FindControl (Rewalk $report) '' '^(Наступний блок|Next block)$' 'ControlType.Button'
            $reverseRx='^(Попередній блок|Previous block)$'
            if(-not (ControlEnabled $moveButton)){
              $moveButton=FindControl (Rewalk $report) '' '^(Попередній блок|Previous block)$' 'ControlType.Button'
              $reverseRx='^(Наступний блок|Next block)$'
            }
            if(-not (ControlEnabled $moveButton)){throw 'No enabled adjacent Book block exists for persistence proof'}
            ActivateByNativeEnter $first $moveButton 'Book adjacent-block native Enter'
            $savedBookBlock=WaitBookBlock $report $initialBookBlock ''
            Write-Host "PACKAGED_BOOKS_NATIVE_KEYBOARD_ENTER=PASS from=$initialBookBlock to=$savedBookBlock"

            $bookmarkToken='w5-restart-'+([string]$env:PRODUCT_PARENT).Substring(0,12)
            $bookEdit=WaitControl $report 'book-bookmark-name' '' 'ControlType.Edit'
            SetControlValue $bookEdit $bookmarkToken 'Book bookmark name'
            $saveBookmark=WaitControl $report '' '^(Зберегти закладку|Save bookmark)$' 'ControlType.Button'
            $beforeSave=AccessibleText (FindControl (Rewalk $report) 'live' '' '')
            InvokeControl $saveBookmark 'Save Book bookmark'
            $saveText=WaitLiveChange $report $beforeSave
            if($saveText -notmatch '(?i)(збереж|saved)'){throw "Book bookmark save confirmation missing: $saveText"}

            $reverseButton=WaitControl $report '' $reverseRx 'ControlType.Button'
            if(-not (ControlEnabled $reverseButton)){throw 'Reverse Book navigation is disabled after bookmark save'}
            InvokeControl $reverseButton 'Move away from saved Book bookmark'
            $awayBookBlock=WaitBookBlock $report $savedBookBlock ''
            if($awayBookBlock -eq $savedBookBlock){throw 'Book cursor did not move away from saved bookmark'}
            Write-Host "PACKAGED_BOOK_PROGRESS_PRE_RESTART_STATE=PASS saved=$savedBookBlock away=$awayBookBlock"
            Write-Host 'PACKAGED_W3_BOOKS_DISCOVER_OPEN_READ_OFFLINE=PASS'"""
          once(pre_needle, pre_replacement, 'Book pre-restart persistence insertion')

          training_pre_needle = """            $hint=WaitControl $report '' '^(Підказка|Hint)$' 'ControlType.Button'
            $beforeHint=AccessibleText (FindControl (Rewalk $report) 'live' '' '')
