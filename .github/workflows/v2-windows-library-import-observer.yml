name: V2 Windows Library Import Observer

on:
  push:
    branches:
      - work/v2-windows-library-canonical-observer-20260831
  pull_request:
    branches:
      - work/v2-windows-nvda-ui-20260828
    paths:
      - 'acs/version2_windows_library_import_observer.py'
      - 'tests/test_v2_windows_library_import_observer.py'
      - '.github/workflows/v2-windows-library-import-observer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-library-import-observer-${{ github.ref }}
  cancel-in-progress: true

env:
  HOST_BASE: dc7427cb89a0b6a997cae467f82265778ea78168

jobs:
  canonical-import-observer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        run: python -m pip install -q pytest==8.4.2

      - name: Prove exact stacked scope and owner isolation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$HOST_BASE" HEAD
          test "$(git merge-base "$HOST_BASE" HEAD)" = "$HOST_BASE"
          git diff --check "$HOST_BASE" HEAD
          changed="$(git diff --name-only "$HOST_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-library-import-observer.yml' \
            'acs/version2_windows_library_import_observer.py' \
            'tests/test_v2_windows_library_import_observer.py' | sort)"
          test "$changed" = "$expected"
          for path in \
            acs/version2_windows_file_workflows.py \
            acs/version2_windows_host_runtime.py \
            acs/version2_windows_import_event_mailbox.py \
            acs/version2_windows_import_ui_pump.py \
            acs/library_import_service.py \
            acs/library_webview_projection.py \
            acs/acsdb.py \
            acs/pgn_service.py \
            acs/chessbase_library_import.py \
            acs/full_product_actions.py \
            acs/full_product_native_menu.py \
            acs/stage1_release_ui.py \
            acs/stage1_release_ui_core.py; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$HOST_BASE:$path")"
          done

      - name: Compile observer package
        run: >-
          python -m compileall -q
          acs/version2_windows_library_import_observer.py
          tests/test_v2_windows_library_import_observer.py

      - name: Focused exact DTO observer and inherited host contracts
        run: >-
          python -m unittest -v
          tests.test_v2_windows_library_import_observer
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_ui_pump
          tests.test_library_import_ui_integration
          tests.test_dev1_library_import_webview_projection
          tests.test_d07_library_import_service

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_v2_windows_library_import_observer.py
          tests/test_v2_windows_nvda_file_workflows.py
          tests/test_v2_windows_host_runtime.py
          tests/test_v2_windows_import_event_mailbox.py
          tests/test_v2_windows_import_ui_pump.py
          tests/test_library_import_ui_integration.py
          tests/test_dev1_library_import_webview_projection.py
          tests/test_d07_library_import_service.py

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
