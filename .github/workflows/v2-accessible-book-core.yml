name: V2 Accessible Book Core

on:
  push:
    branches:
      - fix/current-book-semantic-pgn-gate-20260926
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/bookdocument.py'
      - 'tests/test_v2_accessible_book_core.py'
      - '.github/workflows/v2-accessible-book-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-accessible-book-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CLAIMED_PRODUCT_SHA: e61b570761207ecd1db0322bfc80c3e302b63e2f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve committed Git bytes for cross-platform gates
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --force --all

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current authority and exact Accessible Book Core ownership
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            upstream="$PR_BASE_SHA"
          else
            upstream="$CLAIMED_PRODUCT_SHA"
          fi
          test -n "$upstream"
          git merge-base --is-ancestor "$upstream" HEAD
          test "$(git merge-base "$upstream" HEAD)" = "$upstream"
          git diff --check "$upstream" HEAD
          changed="$(git diff --name-only "$upstream" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-accessible-book-core.yml' \
            'acs/bookdocument.py' \
            'tests/test_v2_accessible_book_core.py' | sort)"
          test "$changed" = "$expected"

          git diff --quiet "$upstream" HEAD -- \
            acs/chesscore.py \
            acs/gametree.py \
            acs/pgn_roundtrip.py \
            acs/book_index.py \
            acs/bookreader.py \
            acs/book_training.py \
            acs/book_progress_store.py \
            acs/book_webview_bridge.py \
            acs/book_webview_projection.py \
            acs/full_product_presenters.py \
            acs/acsdb.py \
            acs/search_service.py \
            web/full_product_books_training.js \
            acs/stage1_release_ui.py

      - name: Compile Accessible Book Core
        run: >-
          python -m compileall -q
          acs/bookdocument.py
          tests/test_v2_accessible_book_core.py

      - name: Focused semantic Book regressions
        run: >-
          python -m unittest -v
          tests.test_v2_accessible_book_core
          tests.test_bookdocument
          tests.test_book_index
          tests.test_bookreader
          tests.test_v2_book_game_content
          tests.test_v2_book_text_import
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
