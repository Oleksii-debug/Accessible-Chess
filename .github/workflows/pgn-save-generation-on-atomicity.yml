name: PGN Generation + Import UI Apex Convergence

on:
  push:
    branches:
      - converge/current-windows-pgn-generation-import-apex-20261006-zftrkmo
  pull_request:
    branches:
      - converge/current-windows-pgn-import-apex-20261006-c2m82
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pgn-generation-import-apex-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PRODUCT_SHA: d0e14b998bb57b5c3b53609ecef41ab646b213a3
  PRE_OWNER_APEX_SHA: 0a15bf52a7f5cab98edae8d04e12eca93c6701d6
  OWNER_SOURCE_SHA: 06de5d9d4913af5ffb7d223c38605487c72e0c0f

jobs:
  exact-composed-generation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2

      - name: Prove absorbed bounded owner commit and exact authority
        shell: bash
        run: |
          set -euo pipefail
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$head"
          git cat-file -e "$PRODUCT_SHA^{commit}"
          git cat-file -e "$PRE_OWNER_APEX_SHA^{commit}"
          git cat-file -e "$OWNER_SOURCE_SHA^{commit}"
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"
          test "$(git merge-base "$PRE_OWNER_APEX_SHA" HEAD)" = "$PRE_OWNER_APEX_SHA"
          git merge-base --is-ancestor "$OWNER_SOURCE_SHA" HEAD
          git diff --check "$PRE_OWNER_APEX_SHA"...HEAD

          mapfile -t leaf_paths < <(git diff --name-only "$PRE_OWNER_APEX_SHA"..."$OWNER_SOURCE_SHA" | sort)
          leaf_expected=(
            ".github/workflows/pgn-owner-commit-bounded-checkpoint.yml"
            "acs/pgn_save_snapshot.py"
            "acs/pgn_workspace.py"
            "tests/test_pgn_save_snapshot.py"
            "tests/test_pgn_workspace.py"
            "tests/test_v2_windows_pgn_save_worker.py"
          )
          test "${#leaf_paths[@]}" -eq "${#leaf_expected[@]}"
          for i in "${!leaf_expected[@]}"; do
            test "${leaf_paths[$i]}" = "${leaf_expected[$i]}"
          done

          mapfile -t expected < <(
            {
              git diff --name-only "$PRE_OWNER_APEX_SHA"..."$OWNER_SOURCE_SHA"
              printf '%s\n' ".github/workflows/pgn-save-generation-on-atomicity.yml"
            } | sort -u
          )
          mapfile -t actual < <(git diff --name-only "$PRE_OWNER_APEX_SHA"...HEAD | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${actual[$i]}" = "${expected[$i]}"
          done

          mapfile -t integration_delta < <(git diff --name-only "$OWNER_SOURCE_SHA"...HEAD | sort)
          test "${#integration_delta[@]}" -eq 1
          test "${integration_delta[0]}" = ".github/workflows/pgn-save-generation-on-atomicity.yml"
          test -z "$(git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.yml' || true)"

      - name: Compile converged PGN and Windows boundaries
        run: >-
          python -m py_compile
          acs/pgn_document.py
          acs/pgn_save_snapshot.py
          acs/pgn_workspace.py
          acs/chessbase_library_import.py
          acs/library_webview_projection.py
          acs/version2_application.py
          acs/version2_release_app.py
          acs/version2_windows_file_workflows.py
          acs/version2_windows_pgn_streaming_host.py
          acs/version2_windows_host_runtime.py
          acs/version2_windows_import_event_mailbox.py
          acs/version2_windows_import_ui_pump.py
          acs/version2_windows_library_import_observer.py

      - name: Execute PGN persistence and Windows UI regressions
        run: >-
          python -m unittest -v
          tests.test_pgn_save_snapshot
          tests.test_pgn_document
          tests.test_pgn_workspace
          tests.test_v2_windows_pgn_open_worker
          tests.test_v2_windows_pgn_save_worker
          tests.test_v2_windows_file_worker_shutdown_fence
          tests.test_v2_windows_pgn_save_terminal_truth
          tests.test_v2_windows_pgn_streaming_host
          tests.test_v2_windows_pgn_streaming_host_lifecycle
          tests.test_v2_windows_file_logging_passive
          tests.test_v2_windows_host_runtime
          tests.test_v2_windows_import_event_mailbox
          tests.test_v2_windows_import_progress_coherence
          tests.test_v2_windows_import_ui_pump
          tests.test_v2_windows_library_import_observer
          tests.test_dev1_library_webview_projection
          tests.test_v2_windows_nvda_file_workflows
          tests.test_version2_application
          tests.test_version2_composition_startup_cleanup_current
          tests.test_chessbase_library_import_report_passive

      - name: Pytest focused owner-commit suite
        run: >-
          pytest -q
          tests/test_pgn_workspace.py
          tests/test_pgn_save_snapshot.py
          tests/test_v2_windows_pgn_save_worker.py

      - name: Core selftest
        run: python -m acs.selftest
