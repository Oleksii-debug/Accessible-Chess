name: W6 V2 Release Payload Preparer

on:
  push:
    branches:
      - work/v2-release-payload-preparer-20260907
  pull_request:
    paths:
      - '.github/workflows/w6-v2-release-payload-preparer.yml'
      - 'acs/version2_release_payload.py'
      - 'tests/test_version2_release_payload.py'

permissions:
  contents: read

concurrency:
  group: w6-v2-release-payload-preparer-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_ASSEMBLER_PARENT: 39b8b7969162e96dfef855cf343177dab7cd1299
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Exact parent and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PACKAGE_ASSEMBLER_PARENT" HEAD)" = "$PACKAGE_ASSEMBLER_PARENT"
          git diff --check "$PACKAGE_ASSEMBLER_PARENT" HEAD
          changed="$(git diff --name-only "$PACKAGE_ASSEMBLER_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/w6-v2-release-payload-preparer.yml' \
            'acs/version2_release_payload.py' \
            'tests/test_version2_release_payload.py' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected payload-preparer scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Compile owned boundary
        run: >-
          python -m compileall -q
          acs/version2_release_payload.py
          tests/test_version2_release_payload.py

      - name: Payload and inherited runtime/package regressions
        run: >-
          python -m unittest -v
          tests.test_version2_release_payload
          tests.test_sound_windows
          tests.test_stockfish_runtime
          tests.test_version2_package_assembler
          tests.test_version2_package_preflight
          tests.test_version2_package_preflight_hardening

  official-stockfish-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact upstream Stockfish 18 generic Windows asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output stockfish.zip "$STOCKFISH_URL"
          echo '40cc975817e7eee270b03f354810d20956df565420d320f6dd37d454dc81a139  stockfish.zip' | sha256sum --check --strict
      - name: Verify the real upstream archive matches the staging contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from acs.version2_release_payload import _inspect_stockfish_archive
          executable, license_info = _inspect_stockfish_archive(Path('stockfish.zip'))
          print('OFFICIAL STOCKFISH 18 ARCHIVE CONTRACT PASS')
          print('engine_member=' + executable.filename)
          print('license_member=' + license_info.filename)
          PY

  full-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned pytest
        run: python -m pip install -q pytest==8.4.2
      - name: Full unittest
        run: python -m unittest discover -s tests -v
      - name: Full pytest
        run: python -m pytest -q
