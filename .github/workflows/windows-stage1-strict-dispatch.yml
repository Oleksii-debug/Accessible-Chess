name: Windows Stage 1 Strict Release Dispatch

on:
  push:
    branches:
      - qa/windows-current-integration-candidate-20260815
    paths:
      - '.github/workflows/windows-stage1-strict-dispatch.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: stage1-strict-release-dispatch
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded focus-convergence packaged E2E contract
        shell: pwsh
        run: |
          $path='tools\qa\stage1_packaged_e2e_crossprocess.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count -gt 0){throw (@($errors|ForEach-Object{$_.Message}) -join ' | ')}
          $text=Get-Content $path -Raw
          if($text -match 'System\.Collections\.Generic\.List\[object\]'){throw 'Generic List[object] binder ambiguity returned'}
          if($text -notmatch 'STRICT_HELPER_STACK='){throw 'Exact script-stack diagnostics missing'}
          if($text -notmatch 'function AssertFocusedRuntimeEventually'){throw 'Bounded runtime focus convergence helper missing'}
          if($text -notmatch 'function AssertSemanticFocusEventually'){throw 'Bounded semantic focus convergence helper missing'}
          if(-not $text.Contains("AssertFocusedRuntimeEventually `$moveRid 'Legal e4 refocus'")){throw 'Legal e4 refocus is not using bounded convergence'}
          if($text.Contains('if((RuntimeId [System.Windows.Automation.AutomationElement]::FocusedElement) -ne $moveRid)')){throw 'One-shot legal e4 focus assertion returned'}
          if($text -notmatch 'RNBQKBNR b KQkq e3 0 1'){throw 'Canonical e4 FEN expectation missing'}
          if($text -notmatch 'RNBQKBNR w KQkq e6 0 2'){throw 'Canonical black e5 FEN expectation missing'}
          if($text -notmatch 'Prepared e5 before entering board'){throw 'e5 must be prepared before board entry'}
          if($text -match 'Assert-MoveIdentityForBoardBridge'){throw 'Board phase must not touch Move identity'}
          $prep=$text.IndexOf("`$vp.SetValue('e5')")
          $board=$text.IndexOf('Invoke $boardLauncher')
          $origin=$text.IndexOf("AssertSemanticFocusEventually `$target 'Board origin establishment'")
          $submit=$text.IndexOf("Invoke `$submit 'move-submit'")
          $restore=$text.IndexOf("AssertSemanticFocusEventually `$target 'Board focus continuity after pure submit bridge'")
          if($prep -lt 0 -or $board -lt 0 -or $origin -lt 0 -or $submit -lt 0 -or $restore -lt 0 -or -not ($prep -lt $board -and $board -lt $origin -and $origin -lt $submit -and $submit -lt $restore)){
            throw "Focus/pure-bridge ordering invalid: prep=$prep board=$board origin=$origin submit=$submit restore=$restore"
          }
          $bridge=$text.Substring($origin,$submit-$origin)
          if($bridge -match 'SetValue|FindRuntime|AssertMove|\$move|\$vp'){
            throw 'Move input is touched after board origin before submit Invoke'
          }
          'BOUNDED FOCUS-CONVERGENCE + PURE BOARD-SUBMIT REGRESSION PASS'
      - name: Dispatch at most one corrected strict run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs=gh run list --workflow windows-stage1-strict-release-crossprocess.yml --branch qa/windows-current-integration-candidate-20260815 --limit 20 --json databaseId,status,conclusion | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Could not query strict workflow WIP state'}
          $active=@($runs | Where-Object {$_.status -in @('queued','in_progress','waiting','pending','requested')})
          if($active.Count -gt 0){
            "STRICT WORKFLOW ALREADY ACTIVE: $(@($active.databaseId) -join ',')"
            exit 0
          }
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/windows-stage1-strict-release-crossprocess.yml/dispatches" -f ref='qa/windows-current-integration-candidate-20260815'
          if($LASTEXITCODE -ne 0){throw 'Strict workflow dispatch failed'}
          'STRICT WORKFLOW DISPATCHED'
