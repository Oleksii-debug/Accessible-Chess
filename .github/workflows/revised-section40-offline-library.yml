name: Revised Section 40 Offline Library QA

on:
  pull_request:
    branches:
      - main
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'tools/revised_section40_offline_test_library.py'
      - 'tools/revised_section40_user_library_seed_bridge.py'
      - 'tools/revised_section40_windows_qa_assembler.py'
      - 'tools/revised_section40_advanced_training.py'
      - 'acs/section40_advanced_licensed_dataset.py'
      - 'acs/section40_extreme_licensed_dataset.py'
      - 'acs/section40_historical_reti_dataset.py'
      - 'acs/section40_historical_reti_runtime.py'
      - 'acs/section40_advanced_training_runtime.py'
      - 'acs/version2_starter_content_application.py'
      - 'tests/test_revised_section40_offline_test_library.py'
      - 'tests/test_revised_section40_user_library_seed_bridge.py'
      - 'tests/test_revised_section40_windows_qa_assembler.py'
      - 'tools/section39_section40_delivery_qualification.py'
      - 'tests/test_section39_section40_delivery_qualification.py'
      - 'acs/section40_bilingual_master_workbook_runtime.py'
      - 'tests/test_section40_bilingual_master_workbook_product.py'
      - 'tools/section39_section37_bilingual_workbook_qualification.py'
      - 'tests/test_section39_section37_bilingual_workbook_qualification.py'
      - 'tools/revised_section37_bilingual_workbook_pack.py'
      - 'tests/real_corpus/advanced_training/section37_master_workbook_bilingual.json'
      - 'tools/section39_new_section37_annotated_pgn_qualification.py'
      - 'tests/test_section39_new_section37_annotated_pgn_qualification.py'
      - 'tests/test_revised_section40_advanced_training.py'
      - 'tests/test_revised_section40_reti_runtime.py'
      - 'tests/test_revised_section40_product_books_advanced_integration.py'
      - 'acs/book_docx_import.py'
      - 'acs/user_library_seed.py'
      - 'tests/test_user_library_seed_parent_safety.py'
      - 'tests/test_section40_docx_book_ingress.py'
      - 'tests/test_w3_p0f_starter_books_training_content.py'
      - '.github/workflows/revised-section40-offline-library.yml'
      - 'acs/starter_books_training_release.py'
      - 'acs/starter_books_training_runtime.py'
      - 'acs/lawful_corpus_registry.py'
      - 'docs/corpus/revised_sections37_40_sources.json'
      - 'tests/real_corpus/**'
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  # An obsolete queued run was holding the PR concurrency slot while the
  # current exact-head candidate waited with zero jobs. Only newest HEAD can
  # qualify Section40; superseded-SHA jobs are not acceptance evidence.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify-separate-collections:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile Section 40 builder and regression suite
        run: python -m py_compile acs/section40_advanced_licensed_dataset.py acs/section40_extreme_licensed_dataset.py acs/section40_historical_reti_dataset.py acs/section40_historical_reti_runtime.py acs/section40_advanced_training_runtime.py acs/version2_starter_content_application.py tools/revised_section40_offline_test_library.py tools/revised_section40_user_library_seed_bridge.py tools/revised_section40_windows_qa_assembler.py tools/revised_section40_advanced_training.py tests/test_revised_section40_product_books_advanced_integration.py tests/test_revised_section40_advanced_training.py tests/test_revised_section40_offline_test_library.py tests/test_revised_section40_user_library_seed_bridge.py
      - name: Section 40 DOCX source safety, cancellation and BookDocument semantics
        run: python -m unittest -v tests.test_section40_docx_book_ingress
      - name: Guard private Library seed pathname/handle identity and race safety
        run: python -m unittest -v tests.test_user_library_seed_parent_safety tests.test_user_library_seed
      - name: Real source, persistent Library, bilingual book and rights regression
        run: python -m unittest -v tests.test_revised_section40_offline_test_library tests.test_revised_section40_user_library_seed_bridge tests.test_revised_section40_windows_qa_assembler tests.test_revised_section40_advanced_training tests.test_revised_section40_reti_runtime tests.test_revised_section40_product_books_advanced_integration tests.test_w3_p0f_starter_books_training_content tests.test_revised_section37_offline_collection_readback tests.test_revised_section38_stockfish_real_library
      - name: Source37 bilingual 12-lesson ten-original-derived-books source and negative tests
        run: |
          python -m py_compile tools/section39_section37_bilingual_workbook_qualification.py tests/test_section39_section37_bilingual_workbook_qualification.py
          python -m unittest -v tests.test_section39_section37_bilingual_workbook_qualification
      - name: Qualify original Section37 twelve-lesson UK/EN workbook in actual program Books menu
        run: |
          python -m py_compile acs/section40_bilingual_master_workbook_runtime.py tests/test_section40_bilingual_master_workbook_product.py
          python -m unittest -v tests.test_section40_bilingual_master_workbook_product
      - name: Build TEST_BUILD archive with real chess games and canonical course
        run: python -m tools.revised_section40_offline_test_library TEST_BUILD artifacts/section40-test-build.zip
      - name: Materialize owner TEST_BUILD runtime Library seed through existing ACSDB ingress
        run: python -m tools.revised_section40_user_library_seed_bridge artifacts/section40-test-build.zip artifacts/section40-owner-runtime-seed.zip
      - name: Build PUBLIC_RELEASE archive with conservative rights filtering
        run: python -m tools.revised_section40_offline_test_library PUBLIC_RELEASE artifacts/section40-public-release.zip
      - name: Execute Section 39/40 three-archive actual source-bound integration and negative tests
        run: |
          python -m py_compile tools/section39_section40_delivery_qualification.py tests/test_section39_section40_delivery_qualification.py
          python -m unittest -v tests.test_section39_section40_delivery_qualification
      - name: Preserve separate real TEST_BUILD / PUBLIC_RELEASE / owner-seed roundtrip receipt
        env:
          ACCESSIBLE_CHESS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -m tools.section39_section40_delivery_qualification
          --test artifacts/section40-test-build.zip
          --public artifacts/section40-public-release.zip
          --seed artifacts/section40-owner-runtime-seed.zip
      - name: Include Section 39/40 exact-SHA qualification in owner test artifacts
        shell: bash
        run: cp section39-section40-real-packaged-integration.json artifacts/section39-section40-real-packaged-integration.json
      - name: Upload separate test and public fixture bundles (not EXE / not final release)
        uses: actions/upload-artifact@v4
        with:
          name: section40-offline-corpus-${{ matrix.os }}
          path: |
            artifacts/*.zip
            artifacts/section39-section40-real-packaged-integration.json
          if-no-files-found: error
          retention-days: 14
