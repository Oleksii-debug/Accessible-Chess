name: Classroom Moderation Server Composition QA

on:
  pull_request:
    branches:
      - feature/classroom-moderation-rpc-core-20261002
    paths:
      - 'acs/sqlite_classroom_moderation_ledger.py'
      - 'tests/test_sqlite_classroom_moderation_ledger.py'
      - '.github/workflows/classroom-moderation-sqlite-ledger.yml'
      - 'acs/livekit_classroom_moderation_admin.py'
      - 'tests/test_livekit_classroom_moderation_admin.py'
      - '.github/workflows/livekit-classroom-moderation-admin.yml'
      - 'tests/test_classroom_moderation_server_composition.py'
      - '.github/workflows/classroom-moderation-server-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-moderation-server-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact QA head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove source-owner ancestry, blobs, and bounded QA scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          LEDGER_OWNER_SHA: f716219966b30ad8c1c844e033a47ad63ec18e9d
          ADMIN_OWNER_SHA: 65c33891fc370005dc00ada8a8a3f395296ba6dd
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-moderation-rpc-core-20261002"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          test "$(git merge-base "$EXPECTED_BASE_SHA" HEAD)" = "$EXPECTED_BASE_SHA"
          git merge-base --is-ancestor "$LEDGER_OWNER_SHA" HEAD
          git merge-base --is-ancestor "$ADMIN_OWNER_SHA" HEAD

          for path in             acs/sqlite_classroom_moderation_ledger.py             tests/test_sqlite_classroom_moderation_ledger.py             .github/workflows/classroom-moderation-sqlite-ledger.yml
          do
            test "$(git rev-parse "$LEDGER_OWNER_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done

          for path in             acs/livekit_classroom_moderation_admin.py             tests/test_livekit_classroom_moderation_admin.py             .github/workflows/livekit-classroom-moderation-admin.yml
          do
            test "$(git rev-parse "$ADMIN_OWNER_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done

          git diff --check "$EXPECTED_BASE_SHA" HEAD
          changed="$(git diff --name-only "$EXPECTED_BASE_SHA" HEAD | sort)"
          allowed="$(printf '%s\n'             '.github/workflows/classroom-moderation-server-composition.yml'             '.github/workflows/classroom-moderation-sqlite-ledger.yml'             '.github/workflows/livekit-classroom-moderation-admin.yml'             'acs/livekit_classroom_moderation_admin.py'             'acs/sqlite_classroom_moderation_ledger.py'             'tests/test_classroom_moderation_server_composition.py'             'tests/test_livekit_classroom_moderation_admin.py'             'tests/test_sqlite_classroom_moderation_ledger.py' | sort)"
          test "$changed" = "$allowed"

          git diff --quiet "$EXPECTED_BASE_SHA" HEAD --             acs/classroom_moderation_rpc.py             acs/classroom_realtime_media.py             acs/classroom_domain.py             acs/chesscore.py

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile combined server path
        run: >-
          python -m py_compile
          acs/classroom_moderation_rpc.py
          acs/sqlite_classroom_moderation_ledger.py
          acs/livekit_classroom_moderation_admin.py
          tests/test_classroom_moderation_server_composition.py

      - name: Run exact combined moderation contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_moderation_server_composition
          tests.test_sqlite_classroom_moderation_ledger
          tests.test_livekit_classroom_moderation_admin
          tests.test_classroom_moderation_rpc
          tests.test_classroom_realtime_media

      - name: Run full repository unittest
        run: python -m unittest discover -v

      - name: Run full repository pytest
        run: python -m pytest -q

      - name: Core selftest
        run: python -m acs.selftest
