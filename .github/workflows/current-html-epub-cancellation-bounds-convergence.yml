name: Current HTML EPUB Cancellation And Bounds Convergence

on:
  pull_request:
    branches:
      - converge/fen-direct-read-latest-20261006-c2mbezb112
    paths:
      - '.github/workflows/current-html-epub-cancellation-bounds-convergence.yml'
      - 'acs/book_html_import.py'
      - 'acs/book_epub_import.py'
      - 'tests/test_book_active_import_cancellation.py'
      - 'tests/test_v2_book_html_import.py'
      - 'tests/test_v2_book_epub_import.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-html-epub-cancellation-bounds-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HTML_IMPORT_BLOB: 07d80d2cdc628f447428a85c9a5480331f1b5d9f
  EPUB_IMPORT_BLOB: 3b6e8ddd184cd3676371b7b99a7b8704baf81105
  ACTIVE_CANCEL_TEST_BLOB: 851170e435ca73bb0f1cd96eb6ffd362d0ae6290
  HTML_IMPORT_TEST_BLOB: 00bfd09f8201d12104901d17b4078179ba8b6ad3
  EPUB_IMPORT_TEST_BLOB: 851299de1bb5727f8c180128485d8a37e4d3c75c

jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact geometry and converged blobs
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-converge/fen-direct-read-latest-20261006-c2mbezb112}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-html-epub-cancellation-bounds-convergence.yml' \
            'acs/book_epub_import.py' \
            'acs/book_html_import.py' \
            'tests/test_book_active_import_cancellation.py' \
            'tests/test_v2_book_epub_import.py' \
            'tests/test_v2_book_html_import.py' | sort)"
          test "$changed" = "$expected_paths"
          test "$(git rev-parse HEAD:acs/book_html_import.py)" = "$HTML_IMPORT_BLOB"
          test "$(git rev-parse HEAD:acs/book_epub_import.py)" = "$EPUB_IMPORT_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_active_import_cancellation.py)" = "$ACTIVE_CANCEL_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_html_import.py)" = "$HTML_IMPORT_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_epub_import.py)" = "$EPUB_IMPORT_TEST_BLOB"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged import surfaces
        run: >-
          python -m py_compile
          acs/book_html_import.py
          acs/book_epub_import.py
          tests/test_book_active_import_cancellation.py
          tests/test_v2_book_html_import.py
          tests/test_v2_book_epub_import.py

      - name: Run HTML EPUB cancellation and resource regressions
        run: >-
          python -m unittest -v
          tests.test_book_active_import_cancellation
          tests.test_v2_book_html_import
          tests.test_v2_book_epub_import

      - name: Run canonical chess-content and reader adjacency
        run: >-
          python -m unittest -v
          tests.test_book_html_pgn_loss_accounting
          tests.test_gametree
          tests.test_d06_pgn_roundtrip
          tests.test_bookdocument
          tests.test_bookreader
          tests.test_book_index
          tests.test_v2_book_library_game_lookup
          tests.test_book_presenter_passive_ingress

      - name: Core selftest
        run: python -m acs.selftest
