name: Library Native Recovery Actions

on:
  pull_request:
    branches:
      - 'fix/library-page-scalar-range-integrity-20261003'
    paths:
      - 'acs/full_product_native_menu.py'
      - 'tests/test_library_native_recovery_actions.py'
      - '.github/workflows/library-native-recovery-actions.yml'

permissions:
  contents: read

concurrency:
  group: library-native-recovery-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-recovery:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='fix/library-page-scalar-range-integrity-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-native-recovery-actions.yml' \
            'acs/full_product_native_menu.py' \
            'tests/test_library_native_recovery_actions.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/full_product_native_menu.py)" = "08ad9be71f5e97c8b3a3c1a790537c351527281e"
          test "$(git rev-parse HEAD:tests/test_library_native_recovery_actions.py)" = "cc92dcd70476109d05a60fbab601248934ed9e5c"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile native Library recovery boundary
        run: >-
          python -m compileall -q
          acs/full_product_native_menu.py
          tests/test_library_native_recovery_actions.py

      - name: Prove full-product and V2 native reachability
        run: >-
          python -m unittest -v
          tests.test_library_native_recovery_actions
          tests.test_full_product_native_menu
          tests.test_version2_windows_composition_profile
