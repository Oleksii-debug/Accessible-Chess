name: Local Profile First Launch UI

on:
  pull_request:
    paths:
      - "acs/version2_local_profile_api.py"
      - "acs/version2_release_app.py"
      - "web/version2_release_bootstrap.js"
      - "tests/test_version2_local_profile_api.py"
      - "tests/test_version2_local_profile_ui_contract.py"
      - "tests/js/version2_library_open_route_refresh_dom_test.js"
      - "tests/js/version2_release_bootstrap_dom_test.js"
      - "tests/test_v2_native_dialog_language.py"
      - "tests/test_version2_composition_publication_boundary.py"
      - "tests/test_version2_composition_startup_cleanup.py"
      - "tests/test_version2_composition_startup_cleanup_current.py"
      - "tests/test_version2_release_accessibility_contract.py"
      - "tests/test_w6_v2_language_owner_current.py"
      - ".github/workflows/local-profile-first-launch-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-profile-first-launch-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove live parent ancestry and exact UI scope
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expected="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "LOCAL_PROFILE_UI_EXACT_HEAD=$expected"

          if test '${{ github.event_name }}' = 'pull_request'; then
            test "$PR_BASE_REF" = 'work/local-profile-identity-foundation-20260929'
            test -n "$PR_BASE_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$live_base"
            git merge-base --is-ancestor "$live_base" HEAD
            test "$(git merge-base "$live_base" HEAD)" = "$live_base"

            changed="$(git diff --name-only "$live_base" HEAD | LC_ALL=C sort)"
            expected_paths="$(printf '%s\n' \
              '.github/workflows/local-profile-first-launch-ui.yml' \
              'acs/version2_local_profile_api.py' \
              'acs/version2_release_app.py' \
              'tests/js/version2_library_open_route_refresh_dom_test.js' \
              'tests/js/version2_release_bootstrap_dom_test.js' \
              'tests/test_v2_native_dialog_language.py' \
              'tests/test_version2_composition_publication_boundary.py' \
              'tests/test_version2_composition_startup_cleanup.py' \
              'tests/test_version2_composition_startup_cleanup_current.py' \
              'tests/test_version2_local_profile_api.py' \
              'tests/test_version2_local_profile_ui_contract.py' \
              'tests/test_version2_release_accessibility_contract.py' \
              'tests/test_w6_v2_language_owner_current.py' \
              'web/version2_release_bootstrap.js' | LC_ALL=C sort)"
            test "$changed" = "$expected_paths" || {
              printf 'Unexpected local-profile UI scope:\n%s\n' "$changed" >&2
              exit 1
            }
            git diff --check "$live_base" HEAD
            echo "LOCAL_PROFILE_UI_EVENT_BASE=$PR_BASE_SHA"
            echo "LOCAL_PROFILE_UI_LIVE_BASE=$live_base"
            echo "LOCAL_PROFILE_UI_SCOPE=EXACT_FOURTEEN_PATHS"
          else
            git diff --check HEAD^ HEAD
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Compile profile and release composition
        run: python -m py_compile acs/local_profile.py acs/version2_local_profile_api.py acs/version2_release_app.py

      - name: Focused persistence and UI bridge regressions
        run: python -m unittest -v tests.test_local_profile tests.test_version2_local_profile_api tests.test_version2_local_profile_ui_contract tests.test_version2_release_ui tests.test_version2_release_app

      - name: Full unittest suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Install pinned pytest
        run: python -m pip install pytest==8.4.2

      - name: Full pytest suite
        run: python -m pytest -q tests
