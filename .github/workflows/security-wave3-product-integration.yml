name: Security Wave 3 Product Integration

on:
  pull_request:
    paths:
      - 'acs/protection_boundary.py'
      - 'acs/protection_advanced_boundary.py'
      - 'acs/version2_release_app.py'
      - 'acs/update_security.py'
      - 'acs/release_update_center.py'
      - 'acs/authenticode.py'
      - 'acs/authenticode_signing.py'
      - 'acs/spdx_sbom.py'
      - 'acs/slsa_provenance.py'
      - 'tests/test_security_wave1_product_integration.py'
      - 'tests/test_security_wave2_product_integration.py'
      - 'tests/test_security_wave3_product_integration.py'
      - '.github/workflows/security-wave3-product-integration.yml'
      - 'docs/automation/SECURITY_WAVE3_R28_R40_PRODUCT_INTEGRATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave3-product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Exact-head and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --check HEAD^

      - name: Install test runner
        run: python -m pip install pytest==8.4.2

      - name: Compile wave-3 and retained release authorities
        run: >-
          python -m py_compile
          acs/protection_boundary.py
          acs/protection_advanced_boundary.py
          acs/version2_release_app.py
          acs/update_security.py
          acs/release_update_center.py
          acs/authenticode.py
          acs/authenticode_signing.py
          acs/spdx_sbom.py
          acs/slsa_provenance.py
          tests/test_security_wave3_product_integration.py

      - name: Run wave-1 through wave-3 security regressions
        run: >-
          python -m pytest -q
          tests/test_security_wave1_product_integration.py
          tests/test_security_wave2_product_integration.py
          tests/test_security_wave3_product_integration.py
          tests/test_update_security.py
          tests/test_release_update_center.py
          tests/test_release_update_application_boundary.py
          tests/test_authenticode.py
          tests/test_authenticode_signing.py
          tests/test_spdx_sbom.py
          tests/test_slsa_provenance.py
          tests/test_slsa_provenance_builder_binding.py

      - name: Prove no public secret or raw signing-key injection surface
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'BEGIN (RSA |EC |)PRIVATE KEY|client[_-]?secret[[:space:]]*=|private[_-]?key[[:space:]]*=|signing[_-]?secret[[:space:]]*='             acs/protection_boundary.py             acs/protection_advanced_boundary.py             acs/version2_release_app.py

      - name: Core selftest
        run: python -m acs.selftest
