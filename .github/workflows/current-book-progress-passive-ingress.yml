name: Current Book Progress Passive Ingress

on:
  pull_request:
    branches:
      - fix/current-book-target-passive-resolution-20261004-sol57b1
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'acs/book_progress_store.py'
      - 'tests/test_book_progress_passive_ingress_current.py'
      - 'tests/test_v2_book_progress_store.py'
      - '.github/workflows/current-book-progress-passive-ingress.yml'
      - '.github/workflows/v2-book-progress-production-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  STORE_BLOB: f110939f4cfda4bb24a76d01ea35ffbba7ad2b79
  INGRESS_TEST_BLOB: fdc34f0637c2b26c2e5e70bab63c973204bb6481
  PROGRESS_TEST_BLOB: 1f455848712768454117081514adb3bfa0dc3102

concurrency:
  group: current-book-progress-passive-ingress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact current-shipping geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          if [ -n "${EVENT_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/$EVENT_BASE_REF:refs/remotes/origin/$EVENT_BASE_REF"
            live_base="$(git rev-parse "refs/remotes/origin/$EVENT_BASE_REF")"
            test -n "$EVENT_BASE_SHA"
            test "$EVENT_BASE_SHA" = "$live_base"
          else
            base_ref="converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb"
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-book-progress-passive-ingress.yml' \
            '.github/workflows/v2-book-progress-production-repair.yml' \
            '.github/workflows/v2-data-upgrade-tracked-writer.yml' \
            '.github/workflows/v2-data-upgrade-v6.yml' \
            'acs/book_progress_store.py' \
            'tests/test_v2_book_progress_store.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Book progress canonical-snapshot scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/book_progress_store.py)" = "$STORE_BLOB"
          test "$(git rev-parse HEAD:tests/test_book_progress_passive_ingress_current.py)" = "$INGRESS_TEST_BLOB"
          test "$(git rev-parse HEAD:tests/test_v2_book_progress_store.py)" = "$PROGRESS_TEST_BLOB"
          test "$(git rev-parse HEAD:.github/workflows/v2-book-progress-production-repair.yml)" = "3759f1c06046141a73870d4f7c9f80316c7ac966"
          test "$(git rev-parse HEAD:.github/workflows/v2-data-upgrade-tracked-writer.yml)" = "cbe74c8897a20153495c5a04847704e72f5176a4"
          test "$(git rev-parse HEAD:.github/workflows/v2-data-upgrade-v6.yml)" = "eeb1f12749e55f0ee8041f5d35bfb2cd6cacd5d2"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Book progress ingress
        run: >-
          python -m compileall -q
          acs/book_progress_store.py
          tests/test_book_progress_passive_ingress_current.py
          tests/test_v2_book_progress_store.py
          tests/test_v2_book_progress_store_production.py

      - name: Execute Book progress and recovery regressions
        run: >-
          python -m unittest -v
          tests.test_book_progress_passive_ingress_current
          tests.test_v2_book_progress_store
          tests.test_v2_book_progress_store_production
          tests.test_bookreader
          tests.test_bookreader_snapshot_bounds

      - name: Core selftest
        run: python -m acs.selftest
