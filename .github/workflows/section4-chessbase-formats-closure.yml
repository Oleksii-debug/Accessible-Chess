name: Section 4 ChessBase Formats Closure

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: section4-chessbase-formats-${{ github.ref }}
  cancel-in-progress: true

env:
  SECTION3_PREDECESSOR_SHA: ca543281040b9030d47abbbb244fb592ae63110d

jobs:
  focused-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove predecessor and exact bounded Section 4 delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$SECTION3_PREDECESSOR_SHA" HEAD)" = "$SECTION3_PREDECESSOR_SHA"
          git diff --check "$SECTION3_PREDECESSOR_SHA"...HEAD
          actual="$(git diff --name-only "$SECTION3_PREDECESSOR_SHA"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/section4-chessbase-formats-closure.yml' \
            'acs/chessbase_adapter.py' \
            'acs/chessbase_integrity.py' \
            'docs/automation/DEV4_CHESSBASE_CAPABILITY_MATRIX.md' \
            'docs/automation/SECTION4_CLOSURE_AUDIT.md' \
            'tests/test_v2_2cbh_cbone_topology.py' | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Compile Section 4 owned Python surface
        run: >-
          python -m py_compile
          acs/chessbase_adapter.py
          acs/chessbase_integrity.py
          acs/chessbase_decoder.py
          acs/cbv_extractor.py
          acs/chessbase_manifest.py
          acs/chessbase_library_import.py
          tests/test_v2_2cbh_cbone_topology.py

      - name: Execute ChessBase capability integrity and security contract
        run: >-
          python -m unittest -v
          tests.test_chessbase_adapter
          tests.test_chessbase_integrity
          tests.test_v2_2cbh_cbone_topology
          tests.test_chessbase_decoder
          tests.test_chessbase_manifest_legacy_cbf_pair
          tests.test_chessbase_active_import_cancellation
          tests.test_chessbase_library_import_report_passive
          tests.test_d04_cbh_backend_immutability
          tests.test_d04_cbv_windows_path_safety
          tests.test_d04_chessbase_integrity_handle_identity
          tests.test_dev4_chessbase_cross_platform_path_privacy
          tests.test_dev4_chessbase_integrity_atomicity
          tests.test_dev4_chessbase_integrity_io_observability
          tests.test_dev4_chessbase_manifest_io_observability
          tests.test_dev4_chessbase_probe_observability
          tests.test_dev4_chessbase_report_path_privacy
          tests.test_dev4_chessbase_symlink_security
          tests.test_v2_chessbase_capability_manifest
          tests.test_v2_chessbase_chess960_capability_boundary
          tests.test_v2_chess960_cbv_runtime_inheritance
          tests.test_v2_real_cbh_chess960_record_boundary

      - name: Core chess selftest
        run: python -m acs.selftest
