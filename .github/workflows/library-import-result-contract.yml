name: Library Import Result Contract

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/library_import_service.py'
      - 'tests/test_d07_library_import_service.py'
      - 'tests/test_d07_library_import_reuse_final_cancel.py'
      - '.github/workflows/library-import-result-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: library-import-result-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove live Product ancestry and exact scope
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          product_ref="refs/remotes/origin/$PRODUCT_BRANCH"
          git fetch --no-tags origin "+refs/heads/$PRODUCT_BRANCH:$product_ref"
          product="$(git rev-parse "$product_ref")"
          git cat-file -e "$product^{commit}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -n "$PR_BASE_SHA"
            git cat-file -e "$PR_BASE_SHA^{commit}"
            git merge-base --is-ancestor "$PR_BASE_SHA" "$product"
          fi
          git merge-base --is-ancestor "$product" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD
          changed="$(git diff --name-only "$product" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-import-result-contract.yml' \
            'acs/library_import_service.py' \
            'tests/test_d07_library_import_reuse_final_cancel.py' \
            'tests/test_d07_library_import_service.py' | sort)"
          test "$changed" = "$expected"
          echo 'LIBRARY_IMPORT_RESULT_SCOPE=PASS'

      - name: Compile exact import surface
        run: >-
          python -m compileall -q
          acs/library_import_service.py
          tests/test_d07_library_import_service.py
          tests/test_d07_library_import_reuse_final_cancel.py

      - name: Focused D07 import regressions
        run: >-
          python -m unittest -v
          tests.test_d07_library_import_service
          tests.test_d07_library_import_reuse_final_cancel
          tests.test_acsdb
          tests.test_v2_library_acsdb_search_v4
          tests.test_v2_library_search_service_v4

      - name: Core selftest
        run: python -m acs.selftest
