name: Books Training Toolbar Keyboard

on:
  pull_request:
    branches:
      - 'fix/book-index-generated-target-bounds-20261003'
    paths:
      - 'web/full_product_books_training.js'
      - 'tests/js/books_training_surface_dom_test.js'
      - '.github/workflows/books-training-toolbar-keyboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: books-training-toolbar-keyboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolbar-keyboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          parent_branch='fix/book-index-generated-target-bounds-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"

          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"
            live_ref="refs/remotes/origin/$parent_branch"
            git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
            live_parent="$(git rev-parse "$live_ref")"
            event_base='${{ github.event.pull_request.base.sha }}'
            test -n "$event_base"
            git cat-file -e "$event_base^{commit}"
            git merge-base --is-ancestor "$event_base" "$live_parent"
            git merge-base --is-ancestor "$live_parent" HEAD
            test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

            changed="$(git diff --name-only "$live_parent" HEAD | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/books-training-toolbar-keyboard.yml' \
              'tests/js/books_training_surface_dom_test.js' \
              'web/full_product_books_training.js' | sort)"
            test "$changed" = "$expected"
            git diff --check "$live_parent" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

          test "$(git rev-parse HEAD:web/full_product_books_training.js)" = "5fc6b7bff0e709075175cde3e8b507b9637fbce4"
          test "$(git rev-parse HEAD:tests/js/books_training_surface_dom_test.js)" = "623b99aecfefda60116e849b2d5079da7e2403ad"

      - name: Validate and execute DOM keyboard contract
        run: |
          node --check web/full_product_books_training.js
          node --check tests/js/books_training_surface_dom_test.js
          node tests/js/books_training_surface_dom_test.js

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Retain Books/Training host integration
        run: >-
          python -m unittest -v
          tests.test_dev1_books_training_web_asset
          tests.test_version2_book_workspace
