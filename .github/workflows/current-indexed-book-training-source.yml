name: Current Indexed Book Training Source

on:
  pull_request:
    branches:
      - fix/current-library-presenter-passive-root-20261004-zftrkmo
      - main
    paths:
      - 'acs/bookreader.py'
      - 'acs/book_training.py'
      - 'acs/version2_training_workspace.py'
      - 'tests/test_bookreader.py'
      - 'tests/test_book_training_passive_roots_current.py'
      - 'tests/test_version2_training_current_runtime.py'
      - '.github/workflows/current-indexed-book-training-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-indexed-book-training-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"
          base_ref="${EVENT_BASE_REF:-fix/current-library-presenter-passive-root-20261004-zftrkmo}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD
          if [ -n "${EVENT_BASE_REF:-}" ] && [ "$EVENT_BASE_REF" = "$DEFAULT_BRANCH" ]; then
            echo 'NARROW_SCOPE_MODE=DEFAULT_BRANCH_INTEGRATION'
          else
            changed="$(git diff --name-only "$live_base"...HEAD | sort)"
            expected_paths="$(printf '%s\n' \
              '.github/workflows/current-indexed-book-training-source.yml' \
              'acs/book_training.py' \
              'acs/bookreader.py' \
              'acs/version2_training_workspace.py' \
              'tests/test_book_training_passive_roots_current.py' \
              'tests/test_bookreader.py' \
              'tests/test_version2_training_current_runtime.py' | sort)"
            test "$changed" = "$expected_paths" || {
              printf 'Unexpected indexed Book Training scope:\n%s\n' "$changed" >&2
              exit 1
            }
            echo 'NARROW_SCOPE_MODE=STACKED_EXACT'
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Book Training surfaces
        run: >-
          python -m compileall -q
          acs/bookreader.py
          acs/book_training.py
          acs/version2_training_workspace.py
          tests/test_bookreader.py
          tests/test_book_training_passive_roots_current.py
          tests/test_version2_training_current_runtime.py

      - name: Execute indexed provenance and Training runtime regressions
        run: >-
          python -m unittest -v
          tests.test_bookreader
          tests.test_book_training_passive_roots_current
          tests.test_version2_training_current_runtime
          tests.test_v2_book_training_route_rollback
          tests.test_d08_book_training_contract
          tests.test_w2_book_training_canonical_ingress

      - name: Execute retained persistence presentation and PGN regressions
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_training_snapshot_definition_identity_v4
          tests.test_training_progress_passive_ingress
          tests.test_training_presentation_passive_authority
          tests.test_dev1_pgn_webview_projection
          tests.test_v2_book_board_workflow

      - name: Core selftest
        run: python -m acs.selftest
