name: Library Result Metadata Canonicality

on:
  pull_request:
    branches:
      - 'fix/library-webview-action-serialization-20261003'
    paths:
      - 'acs/full_product_presenters.py'
      - 'tests/test_library_result_metadata_canonicality.py'
      - '.github/workflows/library-result-metadata-canonicality.yml'

permissions:
  contents: read

concurrency:
  group: library-result-metadata-canonicality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  result-metadata:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='fix/library-webview-action-serialization-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/library-result-metadata-canonicality.yml' \
            'acs/full_product_presenters.py' \
            'tests/test_library_result_metadata_canonicality.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/full_product_presenters.py)" = "3bfb58fe513ea9f852a49c955ab12fb18e28ca70"
          test "$(git rev-parse HEAD:tests/test_library_result_metadata_canonicality.py)" = "c3e8a83a573e795bc0d8410ec34d4249fb3cc16e"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Library result metadata boundary
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          tests/test_library_result_metadata_canonicality.py

      - name: Prove result metadata and retained Library integrity
        run: >-
          python -m unittest -v
          tests.test_library_result_metadata_canonicality
          tests.test_library_page_scalar_range_integrity
          tests.test_library_cached_page_selection_memory
          tests.test_library_page_sequence_integrity
          tests.test_library_projection_transaction_atomicity
