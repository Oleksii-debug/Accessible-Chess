name: W1 D06 Apply Resume Lock TOCTOU

on:
  push:
    branches:
      - work/w1-d06-resume-lock-toctou-20260907
    paths:
      - .github/workflows/w1-d06-apply-resume-lock-toctou.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact post-open lock identity repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("acs/gametree_resume.py")
          text = path.read_text(encoding="utf-8")
          old = '''    try:
              handle = lock_path.open("a+b")
          except OSError as exc:
              raise GameTreeResumeError(
                  "resume store lock could not be opened",
                  code=GameTreeResumeCode.IO_FAILURE,
              ) from exc
          try:
              if os.name == "nt":
          '''.replace("          ", "")
          new = '''    try:
              handle = lock_path.open("a+b")
          except OSError as exc:
              raise GameTreeResumeError(
                  "resume store lock could not be opened",
                  code=GameTreeResumeCode.IO_FAILURE,
              ) from exc

          # Pre-open lstat is defense-in-depth only: the pathname can change
          # between validation and open.  Bind the opened handle back to the
          # current lock pathname before any write or OS lock operation.
          try:
              opened = os.fstat(handle.fileno())
              current = lock_path.lstat()
          except OSError as exc:
              handle.close()
              raise GameTreeResumeError(
                  "resume store lock identity could not be verified",
                  code=GameTreeResumeCode.IO_FAILURE,
              ) from exc
          opened_key = (opened.st_dev, opened.st_ino)
          current_key = (current.st_dev, current.st_ino)
          if (
              stat.S_ISLNK(current.st_mode)
              or _is_reparse_point(current)
              or not stat.S_ISREG(current.st_mode)
              or not stat.S_ISREG(opened.st_mode)
              or getattr(current, "st_nlink", 1) != 1
              or getattr(opened, "st_nlink", 1) != 1
              or opened_key != current_key
          ):
              handle.close()
              raise GameTreeResumeError(
                  "resume store lock changed while being opened",
                  code=GameTreeResumeCode.IO_FAILURE,
              )
          try:
              if os.name == "nt":
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("expected exact resume lock open block once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/w1-d06-apply-resume-lock-toctou.yml").unlink()
          PY
      - name: Validate repair before commit
        run: |
          python -m compileall -q acs/gametree_resume.py tests/test_w1_d06_resume_lock_toctou.py
          python -m unittest -v tests.test_w1_d06_resume_lock_toctou tests.test_d06_gametree_snapshot_resume
          git diff --check
      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(d06): bind resume lock handle to validated path"
          git push origin "HEAD:${GITHUB_REF_NAME}"
