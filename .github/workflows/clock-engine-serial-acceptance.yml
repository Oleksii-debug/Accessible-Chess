name: Clock + Engine Serial Acceptance (QA only)
on:
  push:
    branches:
      - qa/clock-engine-serial-acceptance-20261002

permissions:
  contents: read

concurrency:
  group: clock-engine-serial-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Preserve exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
      - name: Verify both source authorities and isolated combined scope
        shell: bash
        run: |
          set -euo pipefail
          product=25b6da6eb8bccea95628ecfce5ba81fece1a5666
          clock=77bfa596c7bbb6d2cdb06856584d5bf0ce7de2bf
          engine=d0638f08ef205dd989a9044184096aac060d415d
          git merge-base --is-ancestor "$product" HEAD
          git merge-base --is-ancestor "$clock" HEAD
          git merge-base --is-ancestor "$engine" HEAD
          test "$(git merge-base "$product" HEAD)" = "$product"
          git diff --check "$product" HEAD
          actual="$(git diff --name-only "$product" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/chess-clock-switch-boundary.yml' \
            '.github/workflows/clock-engine-serial-acceptance.yml' \
            '.github/workflows/d01-pgn-workspace-webview.yml' \
            '.github/workflows/version2-windows-composition.yml' \
            'acs/clock_service.py' \
            'acs/engine_game_session.py' \
            'acs/stage1_release_ui.py' \
            'tests/test_clock_service.py' \
            'tests/test_engine_game_session.py' \
            'tests/test_engine_game_timeout_ownership.py' \
            'tests/test_stage1_engine_play_ui.py' | sort)"
          test "$actual" = "$expected" || {
            printf 'Unexpected QA composition scope:\n%s\n' "$actual" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/clock_service.py)" = ced200e24405bbe0f6c1282e99fdc9440b675477
          test "$(git rev-parse HEAD:tests/test_clock_service.py)" = 2b0029b6da4dc88494c0e3cd4e891b886df45eda
          test "$(git rev-parse HEAD:.github/workflows/chess-clock-switch-boundary.yml)" = 1a859e0eb47326810e11a8dd1bde92521b3a4f68
          test "$(git rev-parse HEAD:acs/engine_game_session.py)" = 4dc62f6b92a739e5f68a888c292c34b642bbcb88
          test "$(git rev-parse HEAD:acs/stage1_release_ui.py)" = 2ac3ca8943e6a4a819e4f273992167f9cf0b47ce
          test "$(git rev-parse HEAD:tests/test_engine_game_session.py)" = 692f27d36711c3906ab74ecf2a0c073faa3d03e6
          test "$(git rev-parse HEAD:tests/test_engine_game_timeout_ownership.py)" = e57d6e53b60c2c4206729be25f59eef8f2821bae
          test "$(git rev-parse HEAD:tests/test_stage1_engine_play_ui.py)" = 9baf99e7a912fe5b3fdc1eab99277e90ac9d9974
          git diff --quiet "$product" HEAD -- acs/stage1_release_ui_core.py acs/chesscore.py acs/gametree.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runner
        run: python -m pip install -q pytest==8.4.2
      - name: Compile combined source and tests
        run: python -m compileall -q acs tests run_accessible_chess_v2.py
      - name: Focused real-clock engine acceptance and Stage1 rollback
        run: >-
          python -m unittest -v
          tests.test_clock_service
          tests.test_engine_game_session
          tests.test_engine_game_timeout_ownership
          tests.test_stage1_engine_play_ui
      - name: Full repository unittest
        run: python -m unittest discover -s tests -v
      - name: Full repository pytest
        run: python -m pytest -q tests
