name: WORK V2 Release Diagnostic Composition Evidence

on:
  push:
    branches:
      - work/w3-v2-release-diagnostic-composition-evidence-20260907
  pull_request:
    branches:
      - codex/v2-runtime-completion-20260907

permissions:
  contents: read

concurrency:
  group: work-v2-release-diagnostic-composition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove evidence-only exact-head scope
        shell: bash
        run: |
          set -euo pipefail
          base=40e1ef2184177600bcc88911529b718adde65df9
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort | tr '\n' ' ')"
          test "$changed" = ".github/workflows/work-v2-release-diagnostic-composition-evidence.yml tests/test_work_v2_release_diagnostic_composition.py "
      - name: Compile evidence test
        run: python -m py_compile tests/test_work_v2_release_diagnostic_composition.py
      - name: Preserve inherited V2 release composition contracts
        run: >-
          python -m unittest -v
          tests.test_version2_release_app
          tests.test_version2_release_ui
      - name: Prove diagnostic uses real V2 composition
        run: python -m unittest -v tests.test_work_v2_release_diagnostic_composition
