name: V2 Windows PGN Save Action Reachability

on:
  push:
    branches:
      - work/v2-windows-format-ui-dev29-20260831
  pull_request:
    branches:
      - work/v2-windows-nvda-ui-20260828
    paths:
      - 'acs/full_product_actions.py'
      - 'acs/full_product_native_menu.py'
      - 'tests/test_v2_windows_pgn_save_action_reachability.py'
      - '.github/workflows/v2-windows-pgn-save-action-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-windows-pgn-save-reachability-${{ github.ref }}
  cancel-in-progress: true

env:
  D01_SAVE_BASE: dc7427cb89a0b6a997cae467f82265778ea78168

jobs:
  pgn-save-accessibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.4.2
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install -q pythonnet==3.0.5
          fi

      - name: Prove exact D01 ancestry and ownership scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$D01_SAVE_BASE^{commit}"
          test "$(git merge-base "$D01_SAVE_BASE" HEAD)" = "$D01_SAVE_BASE"
          git diff --check "$D01_SAVE_BASE" HEAD
          changed="$(git diff --name-only "$D01_SAVE_BASE" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/v2-windows-pgn-save-action-reachability.yml' \
            'acs/full_product_actions.py' \
            'acs/full_product_native_menu.py' \
            'tests/test_v2_windows_pgn_save_action_reachability.py' | sort)"
          test "$changed" = "$expected"
          git diff --quiet "$D01_SAVE_BASE" HEAD -- \
            acs/chesscore.py \
            acs/gametree.py \
            acs/pgn_document.py \
            acs/pgn_service.py \
            acs/pgn_workspace.py \
            acs/acsdb.py \
            acs/search_service.py \
            acs/library_import_service.py \
            acs/library_webview_bridge.py \
            acs/library_webview_projection.py \
            acs/chessbase_decoder.py \
            acs/chessbase_library_import.py \
            acs/cbv_extractor.py \
            acs/bookdocument.py \
            acs/bookreader.py \
            acs/book_webview_bridge.py \
            acs/book_webview_projection.py \
            acs/version2_windows_file_workflows.py \
            acs/version2_windows_host_runtime.py \
            tools/qa
          echo 'D01 PGN SAVE OWNERSHIP SCOPE PASS'

      - name: Compile D01 action/menu reachability package
        run: >-
          python -m compileall -q
          acs/full_product_actions.py
          acs/full_product_native_menu.py
          tests/test_v2_windows_pgn_save_action_reachability.py

      - name: Focused canonical action to trusted Windows host regressions
        run: >-
          python -m unittest -v
          tests.test_v2_windows_pgn_save_action_reachability
          tests.test_full_product_native_menu
          tests.test_dev1_full_product_webview_adapter
          tests.test_dev1_full_product_accessible_shell
          tests.test_dev1_full_product_ui_packages
          tests.test_v2_windows_nvda_file_workflows
          tests.test_v2_windows_host_runtime
          tests.test_pgn_document
          tests.test_pgn_service

      - name: Windows native menu and WinForms host smoke
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import clr
          clr.AddReference('System.Windows.Forms')
          from System.Windows.Forms import Control, MenuStrip
          from acs.full_product_actions import build_full_product_action_registry
          from acs.full_product_native_menu import build_full_product_menu_spec
          from acs.full_product_ui_shell import UILanguage
          from acs.version2_windows_file_workflows import Version2WindowsFileDialogs

          owner = Control()
          menu = MenuStrip()
          registry = build_full_product_action_registry()
          spec = build_full_product_menu_spec(registry, language=UILanguage.EN)
          file_actions = [item.action_id for item in spec[0].items if item.action_id]
          assert 'pgn.open' in file_actions
          assert 'pgn.save' in file_actions
          assert 'pgn.save_as' in file_actions
          _, OpenFileDialog, SaveFileDialog = Version2WindowsFileDialogs._load_forms()
          opened = OpenFileDialog()
          saved = SaveFileDialog()
          try:
              assert owner is not None
              assert menu is not None
              assert opened is not None
              assert saved is not None
          finally:
              owner.Dispose()
              menu.Dispose()
              opened.Dispose()
              saved.Dispose()
          print('WINDOWS NATIVE PGN SAVE MENU/HOST SMOKE PASS')
          PY

      - name: Full repository unittest
        run: python -m unittest discover -s tests -v

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic
