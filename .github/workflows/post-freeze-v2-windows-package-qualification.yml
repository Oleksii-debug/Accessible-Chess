name: Post-freeze V2 Windows Package Qualification

on:
  push:
    branches:
      - work/post-freeze-v2-windows-package-qualification-20260911
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-freeze-v2-windows-package-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_PREVIOUS_CANDIDATE_SHA: 1cf434b6b68f1d0aba9b58312730c98a82c818d5
  PYTHON_VERSION: '3.12.10'
  PYWEBVIEW_VERSION: '6.2.1'
  PYTHONNET_VERSION: '3.1.0'
  CLR_LOADER_VERSION: '0.3.1'
  CFFI_VERSION: '2.1.1'
  PYCPARSER_VERSION: '3.0'
  TYPING_EXTENSIONS_VERSION: '4.16.0'
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_VERSION: '4.1.0'
  ZSTANDARD_VERSION: '0.25.0'
  STARTER_ZSTANDARD_VERSION: '0.23.0'
  QA_WRAPPER_COMMIT: bf4a4c1c71860c90d1b086ea4f91fa34b665cb81
  QA_BASELINE_COMMIT: 0549391267073f9d006ec8271af148fe17edcdb6
  STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-windows-x86-64.zip
  STOCKFISH_SHA256: 40cc975817e7eee270b03f354810d20956df565420d320f6dd37d454dc81a139

jobs:
  qualify-package:
    runs-on: windows-2025
    timeout-minutes: 85
    steps:
      - name: Checkout exact package qualification child
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Bind package identity to exact current Product and prior package lineage
        shell: bash
        run: |
          set -euo pipefail
          parent_line="$(git rev-list --parents -n 1 HEAD)"
          test "$(wc -w <<<"$parent_line" | tr -d ' ')" = '3'
          product_parent="$(git rev-parse HEAD^1)"
          previous_candidate="$(git rev-parse HEAD^2)"
          test "$previous_candidate" = "$EXPECTED_PREVIOUS_CANDIDATE_SHA"
          short="${product_parent:0:7}"
          echo "PRODUCT_PARENT=$product_parent" >> "$GITHUB_ENV"
          echo "SOURCE_INTEGRATION_SHA=$product_parent" >> "$GITHUB_ENV"
          echo "CANDIDATE_FILE=Accessible-Chess-V2-${short}-post-freeze-package-qualification.zip" >> "$GITHUB_ENV"
          echo "CANDIDATE_PRODUCT_SHA=$product_parent"
          echo "PREVIOUS_PACKAGE_CANDIDATE_SHA=$previous_candidate"
          echo 'PRODUCT_SOURCE_MUTATION=NONE'

      - name: Prove workflow-only delta and package authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$PRODUCT_PARENT" HEAD)" = "$PRODUCT_PARENT"
          test "$(git merge-base "$EXPECTED_PREVIOUS_CANDIDATE_SHA" HEAD)" = "$EXPECTED_PREVIOUS_CANDIDATE_SHA"
          changed="$(git diff --name-only "$PRODUCT_PARENT" HEAD)"
          test "$changed" = '.github/workflows/post-freeze-v2-windows-package-qualification.yml'
          git diff --check "$PRODUCT_PARENT" HEAD
          if git cat-file -e "$PRODUCT_PARENT:.github/workflows/post-freeze-v2-windows-package-qualification.yml" 2>/dev/null; then
            echo 'PACKAGE_WORKFLOW_ALREADY_PRESENT_IN_PRODUCT_PARENT' >&2
            exit 1
          fi
          test -f acs/version2_release_payload.py
          test -f acs/version2_package_assembler.py
          test -f acs/version2_package_preflight.py
          test -f tools/p0f_lawful_starter_bundle.py
          test -f acs/starter_books_training_release.py
          test -f acs/version2_starter_content_application.py
          test -f run_accessible_chess_v2.py
          echo 'WORKFLOW_ONLY_DELTA=PASS'

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build exact lawful W2 release corpus
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check "zstandard==$env:STARTER_ZSTANDARD_VERSION"
          if($LASTEXITCODE -ne 0){throw 'Pinned W2 starter build dependency installation failed'}
          python tools/p0f_lawful_starter_bundle.py release-inputs/w2-starter
          if($LASTEXITCODE -ne 0){throw 'Pinned lawful W2 release corpus build failed'}
          @'
          import hashlib
          import json
          from pathlib import Path
          from acs.acsdb import ACSDB_SCHEMA_VERSION, AcsDatabase

          root = Path('release-inputs/w2-starter')
          expected = {'starter_uk.pgn', 'stress_uk.pgn', 'sample_library.acsdb', 'manifest.json'}
          actual = {path.name for path in root.iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 3
          assert manifest['runtime_network_required'] is False
          assert manifest['starter_source']['license_id'] == 'CC0-1.0'
          assert manifest['starter_source']['selected_games'] >= 200
          assert manifest['counts']['starter_games'] >= 200
          for name in ('starter_uk.pgn', 'stress_uk.pgn', 'sample_library.acsdb'):
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert digest == manifest['files'][name]['sha256'], name
          with AcsDatabase(root / 'sample_library.acsdb') as database:
              assert database.verify_integrity() == ACSDB_SCHEMA_VERSION
              rows = database.search_games(limit=1000)
              assert len(rows) == manifest['counts']['starter_games']
              first = database.get_game(int(rows[0]['id']))
              assert first and first['pgn_text']
              if first.get('event'):
                  filtered = database.search_games(event=str(first['event']), limit=1000)
                  assert any(int(row['id']) == int(first['id']) for row in filtered)
          print('W2_BUILD_EXACT_FOUR_FILES=PASS')
          print('W2_BUILD_ACSDB_DISCOVER_OPEN_SEARCH=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Built W2 release corpus qualification failed'}

      - name: Install qualified pinned Windows compiler stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
          python -m pip install --disable-pip-version-check "pywebview==$env:PYWEBVIEW_VERSION" "pythonnet==$env:PYTHONNET_VERSION" "clr-loader==$env:CLR_LOADER_VERSION" "cffi==$env:CFFI_VERSION" "pycparser==$env:PYCPARSER_VERSION" "typing-extensions==$env:TYPING_EXTENSIONS_VERSION" "Nuitka @ $nuitkaUrl" "ordered-set==$env:ORDERED_SET_VERSION" "zstandard==$env:ZSTANDARD_VERSION"
          if($LASTEXITCODE -ne 0){throw 'Pinned Windows runtime/compiler installation failed'}
          @'
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path
          import nuitka

          expected = {
              'pywebview': os.environ['PYWEBVIEW_VERSION'],
              'pythonnet': os.environ['PYTHONNET_VERSION'],
              'clr-loader': os.environ['CLR_LOADER_VERSION'],
              'cffi': os.environ['CFFI_VERSION'],
              'pycparser': os.environ['PYCPARSER_VERSION'],
              'typing_extensions': os.environ['TYPING_EXTENSIONS_VERSION'],
              'ordered-set': os.environ['ORDERED_SET_VERSION'],
              'zstandard': os.environ['ZSTANDARD_VERSION'],
          }
          assert sys.version_info[:3] == (3, 12, 10)
          for distribution, wanted in expected.items():
              resolved = version(distribution)
              print(f'PINNED_RUNTIME_VERSION {distribution}={resolved}')
              assert resolved == wanted, (distribution, resolved, wanted)
          plugin = Path(nuitka.__file__).parent / 'plugins' / 'standard' / 'PyWebViewPlugin.py'
          assert 'webview.platforms.win32' in plugin.read_text(encoding='utf-8')
          print('QUALIFIED_COMPILER_STACK=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Qualified compiler stack verification failed'}

      - name: Materialize immutable strict packaged UIA helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$QA_WRAPPER_COMMIT" "$QA_BASELINE_COMMIT"
          mkdir -p .v2-uia-evidence
          git show "$QA_WRAPPER_COMMIT:tools/qa/stage1_packaged_e2e_crossprocess.ps1" > .v2-uia-evidence/stage1_packaged_e2e_crossprocess.ps1
          git show "$QA_WRAPPER_COMMIT:tools/qa/stage1_uia_topology_v5.ps1" > .v2-uia-evidence/stage1_uia_topology_v5.ps1
          git show "$QA_WRAPPER_COMMIT:tools/qa/stage1_uia_topology_classify.py" > .v2-uia-evidence/stage1_uia_topology_classify.py
          test -s .v2-uia-evidence/stage1_packaged_e2e_crossprocess.ps1
          test -s .v2-uia-evidence/stage1_uia_topology_v5.ps1
          test -s .v2-uia-evidence/stage1_uia_topology_classify.py
          echo 'IMMUTABLE_STRICT_PACKAGED_UIA_HELPER=READY'

      - name: Source release diagnostic P0-G and W3 retained oracles
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python run_accessible_chess_v2.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'SOURCE_V2_DIAGNOSTIC_PRODUCT_FAILURE'}
          python -m unittest -v tests.test_v2_book_training_route_rollback tests.test_v2_board_analysis_hotkey_feedback tests.test_w3_p0f_starter_books_training_content
          if($LASTEXITCODE -ne 0){throw 'SOURCE_P0G_W3_REGRESSION_FAILURE'}
          node --check tests/js/version2_release_bootstrap_dom_test.js
          if($LASTEXITCODE -ne 0){throw 'BOOK_ROLLBACK_HOST_ORACLE_PARSE_FAILURE'}
          node tests/js/version2_release_bootstrap_dom_test.js
          if($LASTEXITCODE -ne 0){throw 'BOOK_ROLLBACK_HOST_PUBLICATION_ORACLE_FAILURE'}
          $html=Get-Content -LiteralPath 'web\index.html' -Raw
          if($html -notmatch '<div id="live" role="status" aria-live="polite" aria-atomic="true"'){throw 'P0G_GLOBAL_ROLE_STATUS_SOURCE_CONTRACT_MISSING'}
          Write-Host 'SOURCE_V2_DIAGNOSTIC=PASS'
          Write-Host 'SOURCE_P0G_BOARD_ALT1_ACCESSIBLE_FEEDBACK=PASS'
          Write-Host 'SOURCE_W3_24_BOOKS_144_TRAINING=PASS'
          Write-Host 'GLOBAL_ROLE_STATUS_SOURCE_CONTRACT=PASS'

      - name: Build standalone AccessibleChess.exe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $report=Join-Path $env:RUNNER_TEMP 'nuitka-compilation-report.xml'
          python -m nuitka --standalone --assume-yes-for-downloads --windows-console-mode=disable --output-filename=AccessibleChess.exe --include-data-dir=web=web "--report=$report" run_accessible_chess_v2.py
          if($LASTEXITCODE -ne 0){throw 'NUITKA_BUILD_TOOLCHAIN_FAILURE'}
          $dist=(Resolve-Path 'run_accessible_chess_v2.dist').Path
          $exe=Join-Path $dist 'AccessibleChess.exe'
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw 'AccessibleChess.exe missing'}
          $leaks=@(Get-ChildItem -LiteralPath $dist -Recurse -File | Where-Object {$_.Extension -in '.py','.pyc','.pyo'})
          if($leaks.Count -ne 0){throw 'RAW_PYTHON_SOURCE_OR_BYTECODE_LEAK'}
          $reports=@(Get-ChildItem -LiteralPath $dist -Recurse -File | Where-Object {$_.Name -match '(?i)(nuitka.*report|compilation[-_ ]?report)'})
          if($reports.Count -ne 0){throw 'COMPILATION_REPORT_LEAK'}
          Write-Host "STANDALONE_EXE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant())"
          Write-Host 'STANDALONE_BUILD=PASS'

      - name: Build deterministic nine-event sound input with provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib
          import json
          import math
          from pathlib import Path
          import struct
          import wave
          from acs.sound_events import SoundEvent

          root = Path('release-inputs/sounds')
          root.mkdir(parents=True, exist_ok=False)
          frequencies = (330, 220, 660, 440, 550, 140, 392, 196, 880)
          files = {}
          provenance = {}
          for event, frequency in zip(SoundEvent, frequencies, strict=True):
              name = f'{event.value}.wav'
              path = root / name
              sample_rate = 22050
              duration = 0.12 if event.value == 'tick' else 0.18
              frames = []
              count = int(sample_rate * duration)
              for index in range(count):
                  envelope = max(0.0, 1.0 - index / count)
                  value = int(9000 * envelope * math.sin(2 * math.pi * frequency * index / sample_rate))
                  frames.append(struct.pack('<h', value))
              with wave.open(str(path), 'wb') as writer:
                  writer.setnchannels(1)
                  writer.setsampwidth(2)
                  writer.setframerate(sample_rate)
                  writer.writeframes(b''.join(frames))
              files[event.value] = name
              provenance[event.value] = {
                  'file': name,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'license_id': 'CC0-1.0',
                  'source': f'urn:accessible-chess:generated-tone:v1:{event.value}',
                  'creator': 'Accessible Chess deterministic tone generator',
              }
          (root / 'manifest.json').write_text(
              json.dumps({'schema_version': 1, 'files': files}, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          (root / 'provenance.json').write_text(
              json.dumps({'schema_version': 1, 'events': provenance}, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          expected = {event.value for event in SoundEvent}
          assert set(files) == expected and set(provenance) == expected and len(expected) == 9
          for event in SoundEvent:
              path = root / files[event.value]
              with wave.open(str(path), 'rb') as reader:
                  assert reader.getcomptype() == 'NONE'
                  assert reader.getsampwidth() == 2
                  assert reader.getnframes() > 0
              assert provenance[event.value]['sha256'] == hashlib.sha256(path.read_bytes()).hexdigest()
          print('DETERMINISTIC_SOUND_INPUT_WITH_PROVENANCE=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Sound input generation/provenance failed'}

      - name: Download exact official Stockfish 18 Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path release-inputs | Out-Null
          Invoke-WebRequest -Uri $env:STOCKFISH_URL -OutFile 'release-inputs\stockfish.zip'
          $digest=(Get-FileHash -Algorithm SHA256 -LiteralPath 'release-inputs\stockfish.zip').Hash.ToLowerInvariant()
          if($digest -ne $env:STOCKFISH_SHA256){throw "STOCKFISH_SHA256_MISMATCH $digest"}
          Write-Host "STOCKFISH_RELEASE_SHA256=$digest"

      - name: Prepare canonical payload bind W2 W3 assemble package and deterministic ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          from acs.starter_books_training_release import (
              STARTER_RELEASE_LICENSE_ID,
              starter_release_manifest,
          )
          from acs.version2_release_payload import prepare_version2_release_payload
          from acs.version2_package_assembler import assemble_version2_package_tree, write_version2_package_zip

          parent = os.environ['PRODUCT_PARENT']
          candidate = os.environ['CANDIDATE_FILE']
          out = Path('candidate-output')
          prepared = prepare_version2_release_payload(
              Path('run_accessible_chess_v2.dist'),
              Path('release-inputs/stockfish.zip'),
              Path('release-inputs/sounds'),
              out / 'prepared',
          )

          w2_source = Path('release-inputs/w2-starter')
          w2_target = prepared.product_dir / 'release-content' / 'w2-starter'
          expected_w2 = {'starter_uk.pgn', 'stress_uk.pgn', 'sample_library.acsdb', 'manifest.json'}
          actual_w2 = {path.name for path in w2_source.iterdir() if path.is_file()}
          if actual_w2 != expected_w2:
              raise SystemExit(f'W2_BUILD_FILE_SET_MISMATCH actual={sorted(actual_w2)}')
          w2_target.mkdir(parents=True, exist_ok=False)
          for name in sorted(expected_w2):
              shutil.copy2(w2_source / name, w2_target / name)
              source_digest = hashlib.sha256((w2_source / name).read_bytes()).hexdigest()
              target_digest = hashlib.sha256((w2_target / name).read_bytes()).hexdigest()
              if source_digest != target_digest:
                  raise SystemExit(f'W2_PACKAGE_COPY_SHA256_MISMATCH {name}')

          w3_target = prepared.product_dir / 'release-content' / 'w3-starter-books-training'
          w3_target.mkdir(parents=True, exist_ok=False)
          w3_manifest = dict(starter_release_manifest())
          if w3_manifest['material_count'] != 24:
              raise SystemExit('W3_MATERIAL_COUNT_MISMATCH')
          if w3_manifest['training_exercise_count'] != 144:
              raise SystemExit('W3_TRAINING_COUNT_MISMATCH')
          if w3_manifest['license']['id'] != STARTER_RELEASE_LICENSE_ID:
              raise SystemExit('W3_LICENSE_ID_MISMATCH')
          w3_manifest['runtime_network_required'] = False
          w3_manifest['packaged_runtime'] = 'Version2StarterContentApplication'
          (w3_target / 'manifest.json').write_text(
              json.dumps(w3_manifest, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          shutil.copy2(
              Path('docs/V2_STARTER_CONTENT_PROVENANCE.md'),
              w3_target / 'PROVENANCE.md',
          )

          assembled = assemble_version2_package_tree(
              prepared.product_dir,
              prepared.notices_dir,
              out / 'package',
              integration_sha=parent,
          )
          primary = out / candidate
          repro = out / (candidate + '.repro.zip')
          first = write_version2_package_zip(
              assembled.package_root,
              primary,
              expected_integration_sha=parent,
          )
          second = write_version2_package_zip(
              assembled.package_root,
              repro,
              expected_integration_sha=parent,
          )
          one = hashlib.sha256(primary.read_bytes()).hexdigest()
          two = hashlib.sha256(repro.read_bytes()).hexdigest()
          if one != two:
              raise SystemExit(f'DETERMINISTIC_ZIP_MISMATCH {one} {two}')
          repro.unlink()
          print('W2_RELEASE_CONTENT_BOUND_TO_PACKAGE=PASS')
          print('W3_BOOKS_TRAINING_MANIFEST_BOUND_TO_PACKAGE=PASS')
          print(f'CANDIDATE_ZIP={primary}')
          print(f'CANDIDATE_ZIP_SHA256={one}')
          print(f'CANDIDATE_INTEGRATION_SHA={first.integration_sha}')
          print(f'CANDIDATE_FILE_COUNT={len(first.inventory)}')
          print('CANONICAL_PAYLOAD_ASSEMBLER_PREFLIGHT=PASS')
          print('DETERMINISTIC_ZIP_REPRODUCTION=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Canonical V2 candidate assembly failed'}

      - name: Fresh extraction W2 W3 readback packaged diagnostic and engine smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path 'candidate-output' $env:CANDIDATE_FILE
          New-Item -ItemType Directory -Path fresh-extraction | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath fresh-extraction
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          from acs.acsdb import ACSDB_SCHEMA_VERSION, AcsDatabase
          from acs.starter_books_training_release import STARTER_RELEASE_LICENSE_ID
          from acs.version2_package_preflight import validate_version2_package_tree

          root = Path('fresh-extraction')
          report = validate_version2_package_tree(
              root,
              expected_integration_sha=os.environ['PRODUCT_PARENT'],
          )
          product = root / 'AccessibleChess'

          w2 = product / 'release-content' / 'w2-starter'
          expected = {'starter_uk.pgn', 'stress_uk.pgn', 'sample_library.acsdb', 'manifest.json'}
          actual = {path.name for path in w2.iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)
          manifest = json.loads((w2 / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 3
          assert manifest['runtime_network_required'] is False
          assert manifest['starter_source']['license_id'] == 'CC0-1.0'
          assert manifest['starter_source']['selected_games'] >= 200
          assert (w2 / 'starter_uk.pgn').read_text(encoding='utf-8').count('[Event "') >= 200
          for name in ('starter_uk.pgn', 'stress_uk.pgn', 'sample_library.acsdb'):
              digest = hashlib.sha256((w2 / name).read_bytes()).hexdigest()
              assert digest == manifest['files'][name]['sha256'], name
          with AcsDatabase(w2 / 'sample_library.acsdb') as database:
              assert database.verify_integrity() == ACSDB_SCHEMA_VERSION
              rows = database.search_games(limit=1000)
              assert len(rows) == manifest['counts']['starter_games']
              first = database.get_game(int(rows[0]['id']))
              assert first and first['pgn_text']
              if first.get('event'):
                  filtered = database.search_games(event=str(first['event']), limit=1000)
                  assert any(int(row['id']) == int(first['id']) for row in filtered)

          w3 = product / 'release-content' / 'w3-starter-books-training'
          assert {path.name for path in w3.iterdir() if path.is_file()} == {'manifest.json', 'PROVENANCE.md'}
          w3_manifest = json.loads((w3 / 'manifest.json').read_text(encoding='utf-8'))
          assert w3_manifest['material_count'] == 24
          assert w3_manifest['training_exercise_count'] == 144
          assert w3_manifest['training_unique_fen_count'] >= 64
          assert w3_manifest['license']['id'] == STARTER_RELEASE_LICENSE_ID
          assert w3_manifest['runtime_network_required'] is False
          assert w3_manifest['packaged_runtime'] == 'Version2StarterContentApplication'
          assert '24 distinct' in (w3 / 'PROVENANCE.md').read_text(encoding='utf-8')

          print(f'FRESH_EXTRACTION_PREFLIGHT_FILES={len(report.inventory)}')
          print('FRESH_EXTRACTION_PREFLIGHT=PASS')
          print('W2_FRESH_EXTRACT_EXACT_FOUR_FILES=PASS')
          print('W2_FRESH_EXTRACT_OFFLINE_DISCOVER_OPEN_SEARCH=PASS')
          print('W3_FRESH_EXTRACT_MANIFEST_PROVENANCE=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Fresh extraction canonical/W2/W3 preflight failed'}
          $exe=(Resolve-Path 'fresh-extraction\AccessibleChess\AccessibleChess.exe').Path
          $stdout=Join-Path $env:RUNNER_TEMP 'packaged-v2-diagnostic.stdout.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'packaged-v2-diagnostic.stderr.txt'
          $proc=Start-Process -FilePath $exe -ArgumentList '--diagnostic' -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if(Test-Path $stdout){Get-Content -LiteralPath $stdout | ForEach-Object {Write-Host $_}}
          if(Test-Path $stderr){Get-Content -LiteralPath $stderr | ForEach-Object {Write-Host "STDERR: $_"}}
          if($proc.ExitCode -ne 0){throw "PACKAGED_EXE_DIAGNOSTIC_FAILURE exit=$($proc.ExitCode)"}
          $diag=(Get-Content -LiteralPath $stdout -Raw)
          if($diag -notmatch 'ACCESSIBLE CHESS V2 FINAL-PRODUCT COMPOSITION DIAGNOSTIC PASS'){throw 'PACKAGED_EXE_DIAGNOSTIC_PASS_MARKER_MISSING'}
          $engine=(Resolve-Path 'fresh-extraction\AccessibleChess\engines\stockfish\stockfish.exe').Path
          $engineOutput=(@('uci','isready','quit') | & $engine 2>&1 | Out-String)
          if($LASTEXITCODE -ne 0 -or $engineOutput -notmatch 'uciok' -or $engineOutput -notmatch 'readyok'){throw 'PACKAGED_STOCKFISH_UCI_SMOKE_FAILURE'}
          Write-Host 'PACKAGED_EXE_DIAGNOSTIC=PASS'
          Write-Host 'PACKAGED_STOCKFISH_UCI_SMOKE=PASS'
          Write-Host 'FRESH_EXTRACTION=PASS'

      - name: Prove fresh-extracted packaged keyboard and UIA semantics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--force-renderer-accessibility'
          $productRoot=(Resolve-Path 'fresh-extraction\AccessibleChess').Path
          $exe=(Resolve-Path (Join-Path $productRoot 'AccessibleChess.exe')).Path
          $process=Start-Process -FilePath $exe -WorkingDirectory $productRoot -PassThru
          try {
            $ready=$false
            $lastTopologyError='not attempted'
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            while($watch.ElapsedMilliseconds -lt 45000){
              if($process.HasExited){throw "Fresh-extracted V2 process exited before UIA proof with code $($process.ExitCode)"}
              try {
                Remove-Item -LiteralPath 'uia-topology-report-v5.json' -Force -ErrorAction SilentlyContinue
                & .\.v2-uia-evidence\stage1_uia_topology_v5.ps1 -AppPid $process.Id *> $null
                if(Test-Path -LiteralPath 'uia-topology-report-v5.json'){
                  $probe=Get-Content -LiteralPath 'uia-topology-report-v5.json' -Raw | ConvertFrom-Json
                  $documents=@($probe.nodes | Where-Object {
                    [string]$_.control_type -eq 'ControlType.Document' -and
                    [bool]$_.source_root_connected -and
                    [string]$_.name -eq 'Accessible Chess'
                  })
                  if($documents.Count -gt 0){$ready=$true;break}
                  $lastTopologyError='topology report exists but Accessible Chess Document is not connected yet'
                } else {
                  $lastTopologyError='topology helper returned without a report'
                }
              } catch {
                $lastTopologyError=$_.Exception.Message
              }
              Start-Sleep -Milliseconds 500
            }
            if(-not $ready){throw "Fresh-extracted V2 UIA topology did not become ready within 45 seconds; last=$lastTopologyError"}
            Write-Host 'FRESH_PACKAGED_UIA_TOPOLOGY_READY=PASS'
            & .\.v2-uia-evidence\stage1_packaged_e2e_crossprocess.ps1 -AppPid $process.Id -ProductRoot $productRoot
            if($LASTEXITCODE -ne 0){throw 'Immutable strict packaged UIA helper failed on fresh-extracted candidate'}
            if(-not (Test-Path packaged-uia-strict-summary.json)){throw 'Packaged UIA summary missing'}
            $summary=Get-Content packaged-uia-strict-summary.json -Raw | ConvertFrom-Json
            if([int]$summary.semantic_square_count -ne 64){throw 'Fresh candidate did not expose exactly 64 semantic squares'}
            if([string]$summary.clipboard -ne 'e9'){throw 'Fresh candidate Ctrl+A/Ctrl+C proof did not pass'}
            if(-not [bool]$summary.invalid_e9_fen_unchanged){throw 'Fresh candidate invalid-input atomicity proof did not pass'}
            if(-not [bool]$summary.board_focus_continuity){throw 'Fresh candidate board focus continuity proof did not pass'}
            Write-Host 'FRESH_PACKAGED_UIA_KEYBOARD_64_SQUARE_FOCUS_PROOF=PASS'
          }
          finally {
            $live=Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if($live){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Prove fresh-extracted native MenuBar profile through process-scoped UIA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--force-renderer-accessibility'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $productRoot=(Resolve-Path 'fresh-extraction\AccessibleChess').Path
          $exe=(Resolve-Path (Join-Path $productRoot 'AccessibleChess.exe')).Path
          $process=Start-Process -FilePath $exe -WorkingDirectory $productRoot -PassThru
          try {
            $desktop=[System.Windows.Automation.AutomationElement]::RootElement
            if($null -eq $desktop){throw 'UIA desktop root is unavailable'}
            $pidCondition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ProcessIdProperty,$process.Id)
            $menuTypeCondition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuBar)
            $menuSearch=[System.Windows.Automation.AndCondition]::new([System.Windows.Automation.Condition[]]@($pidCondition,$menuTypeCondition))
            $bars=@()
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            while($watch.ElapsedMilliseconds -lt 45000){
              if($process.HasExited){throw "Fresh-extracted V2 process exited before native-menu proof with code $($process.ExitCode)"}
              $bars=@($desktop.FindAll([System.Windows.Automation.TreeScope]::Descendants,$menuSearch) | Where-Object {[string]$_.Current.AutomationId -eq 'AccessibleChessFullProductMenu'})
              if($bars.Count -ge 1){break}
              Start-Sleep -Milliseconds 250
            }
            if($bars.Count -ne 1){
              $allProcessMenus=@($desktop.FindAll([System.Windows.Automation.TreeScope]::Descendants,$menuSearch) | ForEach-Object {"id='$([string]$_.Current.AutomationId)' name='$([string]$_.Current.Name)' pid=$([int]$_.Current.ProcessId)"}) -join ' | '
              throw "Expected exactly one canonical native MenuBar for launched V2 process, found $($bars.Count); same-process-bars=$allProcessMenus"
            }
            $menu=$bars[0]
            if([string]$menu.Current.Name -notin @('Application menu','Меню програми')){throw "Unexpected native MenuBar accessible name: $([string]$menu.Current.Name)"}
            if([int]$menu.Current.ProcessId -ne $process.Id){throw 'Native MenuBar is not owned by the launched V2 process'}
            if(-not [bool]$menu.Current.IsEnabled -or [bool]$menu.Current.IsOffscreen){throw 'V2 native MenuBar is disabled or offscreen'}

            $itemCondition=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::MenuItem)
            $top=@($menu.FindAll([System.Windows.Automation.TreeScope]::Children,$itemCondition))
            $names=@($top | ForEach-Object {([string]$_.Current.Name).Replace('&','').Trim()})
            $expectedUa=@('Файл','Гра','Позиція','PGN','Бібліотека','Імпорт','Експорт','Stockfish','Аналіз','Книги','Тренування','Учитель/Клас','Налаштування','Довідка')
            $expectedEn=@('File','Game','Position','PGN','Library','Import','Export','Engine','Analysis','Books','Training','Teacher/Classroom','Settings','Help')
            $actual=($names -join '|')
            $ua=($expectedUa -join '|')
            $en=($expectedEn -join '|')
            if($top.Count -ne 14 -or ($actual -ne $ua -and $actual -ne $en)){
              throw "Packaged V2 native menu profile mismatch: count=$($top.Count) names=$actual"
            }
            foreach($entry in $top){
              if([int]$entry.Current.ProcessId -ne $process.Id){throw "Top native menu item belongs to another process: $([string]$entry.Current.Name)"}
              if(-not [bool]$entry.Current.IsEnabled -or [bool]$entry.Current.IsOffscreen){throw "Top native menu item is disabled/offscreen: $([string]$entry.Current.Name)"}
              try {
                $pattern=$entry.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
                if($null -eq $pattern){throw 'null ExpandCollapsePattern'}
              } catch {
                throw "Top native menu item lacks ExpandCollapsePattern: $([string]$entry.Current.Name)"
              }
            }
            $trainingTeacherPresent=(($names -contains 'Тренування' -or $names -contains 'Training') -and ($names -contains 'Учитель/Клас' -or $names -contains 'Teacher/Classroom'))
            if(-not $trainingTeacherPresent){throw 'Current Full Product Training/Teacher native menus are missing'}
            $summary=[ordered]@{
              product_sha=$env:PRODUCT_PARENT
              machine_scope='fresh-extracted Windows UIA native menu structure only'
              menu_discovered_by='process-scoped desktop UIA search'
              menu_bar_count=$bars.Count
              menu_automation_id=[string]$menu.Current.AutomationId
              menu_name=[string]$menu.Current.Name
              menu_owner_process_matches=$true
              menu_visible=$true
              menu_enabled=$true
              top_level_count=$top.Count
              top_level_names=$names
              top_level_all_visible_enabled=$true
              top_level_expand_collapse_pattern=$true
              training_teacher_present=$true
              structural_uia='PASS'
              alt_arrows_enter_esc='HUMAN_ONLY_UNPROVEN'
              nvda_menu_usability='HUMAN_ONLY_UNPROVEN'
              nvda_verified=$false
            }
            $summary|ConvertTo-Json -Depth 5|Set-Content -Encoding UTF8 packaged-v2-current-native-menu-summary.json
            Write-Host "FRESH_PACKAGED_NATIVE_MENUBAR_UIA=PASS names=$actual"
          }
          finally {
            $live=Get-Process -Id $process.Id -ErrorAction SilentlyContinue
            if($live){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
          }
          $bounded=Get-Content -Raw packaged-v2-current-native-menu-summary.json
          if($bounded -match '(?i)[A-Z]:\\\\|/home/|/Users/|/tmp/'){throw 'Local path leaked into bounded native-menu evidence'}

      - name: Prove packaged P0-G Books Training keyboard close and restart
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--force-renderer-accessibility'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $productRoot=(Resolve-Path 'fresh-extraction\AccessibleChess').Path
          $exe=(Resolve-Path (Join-Path $productRoot 'AccessibleChess.exe')).Path
          $topology=(Resolve-Path '.v2-uia-evidence\stage1_uia_topology_v5.ps1').Path

          function Hwnd([string]$v) {
            $t=$v.Trim()
            if($t.StartsWith('0x',[StringComparison]::OrdinalIgnoreCase)){return [IntPtr]([Convert]::ToInt64($t.Substring(2),16))}
            return [IntPtr]([int64]$t)
          }
          function RuntimeId($e) {
            try { (($e.GetRuntimeId() | ForEach-Object {[string]$_}) -join '.') } catch { '' }
          }
          function ElementKey($e) {
            $r=RuntimeId $e
            if($r){return 'rid:'+$r}
            try{return 'obj:'+([string]$e.GetHashCode())}catch{return ''}
          }
          function ProviderRoots($report) {
            $out=@()
            foreach($row in @($report.root_attempts)){
              if(-not $row.connected_to_app -or -not $row.from_handle_success -or -not $row.provider_subtree_seen){continue}
              $e=[System.Windows.Automation.AutomationElement]::FromHandle((Hwnd ([string]$row.hwnd)))
              if($null -eq $e){throw "FromHandle returned null for retained provider root $($row.hwnd)"}
              $out += ,$e
            }
            if($out.Count -eq 0){throw 'No connected provider-bearing roots available'}
            return $out
          }
          function ControlElements($roots) {
            $walker=[System.Windows.Automation.TreeWalker]::ControlViewWalker
            $stack=New-Object System.Collections.Stack
            foreach($r in $roots){$stack.Push($r)}
            $seen=New-Object 'System.Collections.Generic.HashSet[string]'
            $out=@()
            while($stack.Count -gt 0){
              if($out.Count -ge 20000){throw 'P0-G/W3 traversal cap reached'}
              $e=$stack.Pop()
              $key=ElementKey $e
              if($key -and -not $seen.Add($key)){continue}
              $out += ,$e
              $kids=@()
              try {
                $c=$walker.GetFirstChild($e)
                while($null -ne $c){$kids += ,$c; $c=$walker.GetNextSibling($c)}
              } catch {
                throw "P0-G/W3 ControlView traversal failed: $($_.Exception.Message)"
              }
              for($i=$kids.Count-1;$i -ge 0;$i--){$stack.Push($kids[$i])}
            }
            return $out
          }
          function Rewalk($report) { ControlElements (ProviderRoots $report) }
          function FindControl($els,[string]$id,[string]$nameRx,[string]$ct='') {
            foreach($e in @($els)){
              try {
                if($ct -and [string]$e.Current.ControlType.ProgrammaticName -ne $ct){continue}
                if(($id -and [string]$e.Current.AutomationId -eq $id) -or ($nameRx -and [string]$e.Current.Name -match $nameRx)){return $e}
              } catch {}
            }
            return $null
          }
          function InvokeControl($e,[string]$label) {
            try {
              $p=$e.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
              if($null -eq $p){throw 'null InvokePattern'}
              $p.Invoke()
            } catch {
              throw "$label has no usable InvokePattern: $($_.Exception.Message)"
            }
          }
          function SquareToken($e) {
            try {
              $id=[string]$e.Current.AutomationId
              if($id -match '^sq-([a-h][1-8])$'){return $matches[1]}
              $n=[string]$e.Current.Name
              if($n -match '(?<![A-Za-z0-9])([a-h][1-8])(?![A-Za-z0-9])'){return $matches[1]}
            } catch {}
            return ''
          }
          function Squares($els) {
            $h=@{}
            foreach($e in @($els)){
              $s=SquareToken $e
              if($s -and -not $h.ContainsKey($s)){$h[$s]=$e}
            }
            return $h
          }
          function AccessibleText($e) {
            if($null -eq $e){return ''}
            $parts=New-Object 'System.Collections.Generic.List[string]'
            try {
              $n=([string]$e.Current.Name).Trim()
              if($n){$parts.Add($n)}
            } catch {}
            try {
              $vp=$e.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
              if($null -ne $vp){
                $v=([string]$vp.Current.Value).Trim()
                if($v -and -not $parts.Contains($v)){$parts.Add($v)}
              }
            } catch {}
            try {
              $walker=[System.Windows.Automation.TreeWalker]::ControlViewWalker
              $c=$walker.GetFirstChild($e)
              $cap=0
              while($null -ne $c -and $cap -lt 16){
                $n=([string]$c.Current.Name).Trim()
                if($n -and -not $parts.Contains($n)){$parts.Add($n)}
                $c=$walker.GetNextSibling($c)
                $cap++
              }
            } catch {}
            return ($parts -join ' ').Trim()
          }
          function ReadTopology($process,[int]$timeoutMs=45000) {
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            $last='not attempted'
            while($watch.ElapsedMilliseconds -lt $timeoutMs){
              if($process.HasExited){throw "Packaged process exited before topology readiness with code $($process.ExitCode)"}
              try {
                Remove-Item -LiteralPath 'uia-topology-report-v5.json' -Force -ErrorAction SilentlyContinue
                & $topology -AppPid $process.Id *> $null
                if(Test-Path -LiteralPath 'uia-topology-report-v5.json'){
                  $report=Get-Content -LiteralPath 'uia-topology-report-v5.json' -Raw|ConvertFrom-Json
                  $docs=@($report.nodes|Where-Object {
                    [string]$_.control_type -eq 'ControlType.Document' -and
                    [bool]$_.source_root_connected -and
                    [string]$_.name -eq 'Accessible Chess'
                  })
                  if($docs.Count -gt 0){return $report}
                  $last='Accessible Chess Document not connected yet'
                }
              } catch {
                $last=$_.Exception.Message
              }
              Start-Sleep -Milliseconds 400
            }
            throw "Packaged UIA topology timeout: $last"
          }
          function WaitControl($report,[string]$id,[string]$nameRx,[string]$ct='',[int]$timeoutMs=10000) {
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            while($watch.ElapsedMilliseconds -lt $timeoutMs){
              $e=FindControl (Rewalk $report) $id $nameRx $ct
              if($null -ne $e){return $e}
              Start-Sleep -Milliseconds 150
            }
            throw "UIA control not found id='$id' name='$nameRx' type='$ct'"
          }
          function WaitSquares($report,[int]$timeoutMs=10000) {
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            $count=0
            while($watch.ElapsedMilliseconds -lt $timeoutMs){
              $sq=Squares (Rewalk $report)
              $count=$sq.Count
              if($count -eq 64){return $sq}
              Start-Sleep -Milliseconds 150
            }
            throw "Expected 64 semantic squares, got $count"
          }
          function AssertSemanticFocus($target,[int]$timeoutMs=4000) {
            $wantedId=[string]$target.Current.AutomationId
            $wantedName=[string]$target.Current.Name
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            while($watch.ElapsedMilliseconds -lt $timeoutMs){
              try {
                $f=[System.Windows.Automation.AutomationElement]::FocusedElement
                if(([string]$f.Current.AutomationId -eq $wantedId) -or ($wantedName -and [string]$f.Current.Name -eq $wantedName)){return}
              } catch {}
              Start-Sleep -Milliseconds 100
            }
            throw "Semantic focus did not converge to '$wantedId' '$wantedName'"
          }
          function WaitLiveChange($report,[string]$before,[int]$timeoutMs=10000) {
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            $last=''
            while($watch.ElapsedMilliseconds -lt $timeoutMs){
              $live=FindControl (Rewalk $report) 'live' '' ''
              if($null -ne $live){
                $last=AccessibleText $live
                if($last -and $last -ne $before){return $last}
              }
              Start-Sleep -Milliseconds 150
            }
            throw "Accessible role=status live region did not expose changed text; last='$last'"
          }
          function CloseByKeyboard($process,[int]$timeoutMs=10000) {
            $ws=New-Object -ComObject WScript.Shell
            $null=$ws.AppActivate($process.Id)
            [AccessibleChessPackageKeys]::Alt([byte]0x73)
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            while($watch.ElapsedMilliseconds -lt $timeoutMs){
              if($process.HasExited){return}
              Start-Sleep -Milliseconds 100
            }
            throw 'Alt+F4 did not close packaged AccessibleChess.exe'
          }

          if(-not ('AccessibleChessPackageKeys' -as [type])){
            Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class AccessibleChessPackageKeys {
            [DllImport("user32.dll")]
            private static extern void keybd_event(byte bVk, byte bScan, uint dwFlags, UIntPtr dwExtraInfo);
            private const uint KEYEVENTF_KEYUP = 0x0002;
            public static void Alt(byte vk) {
              keybd_event(0x12, 0, 0, UIntPtr.Zero);
              keybd_event(vk, 0, 0, UIntPtr.Zero);
              keybd_event(vk, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);
              keybd_event(0x12, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);
            }
          }
          "@
          }

          $first=$null
          $second=$null
          $p0gText=''
          $p0gMode=''
          try {
            $first=Start-Process -FilePath $exe -WorkingDirectory $productRoot -PassThru
            $report=ReadTopology $first

            $launcher=WaitControl $report 'board-launcher' '^(Увійти на дошку|Enter board)$' 'ControlType.Button'
            InvokeControl $launcher 'Board launcher'
            $squares=WaitSquares $report
            if(-not $squares.ContainsKey('a3')){throw 'Semantic square a3 missing for P0-G proof'}
            $target=$squares['a3']
            $target.SetFocus()
            AssertSemanticFocus $target
            $live=FindControl (Rewalk $report) 'live' '' ''
            $before=AccessibleText $live
            $ws=New-Object -ComObject WScript.Shell
            $null=$ws.AppActivate($first.Id)
            $target.SetFocus()
            AssertSemanticFocus $target
            [AccessibleChessPackageKeys]::Alt([byte]0x31)
            $p0gText=WaitLiveChange $report $before
            if($p0gText -match '(?i)\buciok\b|\bbestmove\b|info\s+depth|traceback|\bdebug\b'){
              throw "P0-G leaked raw engine/debug transport: $p0gText"
            }
            $strong=(($p0gText -match '(?i)(Варіант|Variation)\s*1') -and ($p0gText -match '(?i)(глибин|depth)') -and ($p0gText -match '(?i)(оцін|evaluation|score)'))
            $disabled=($p0gText -match '(?i)(вимкнен|disabled|недоступ|unavailable)')
            if(-not $strong -and -not $disabled){
              throw "P0-G result is neither full PV feedback nor explicit non-silent disabled feedback: $p0gText"
            }
            $p0gMode=if($strong){'full-analysis-result'}else{'explicit-disabled-feedback'}
            Write-Host "PACKAGED_P0G_ACTION_OCCURRED=PASS mode=$p0gMode"
            Write-Host "PACKAGED_P0G_ACCESSIBLE_RESULT_EXPOSED=PASS text=$p0gText"

            $booksNav=WaitControl $report 'v2-nav-books' '^(Книги|Books)$' 'ControlType.Button'
            InvokeControl $booksNav 'Books navigation'
            $bookEdit=WaitControl $report 'book-bookmark-name' '' 'ControlType.Edit'
            if(-not [bool]$bookEdit.Current.IsEnabled){throw 'Packaged Books bookmark edit is disabled'}
            $emptyBooks=FindControl (Rewalk $report) 'v2-books-empty-status' '' ''
            if($null -ne $emptyBooks){throw 'Packaged Books route rendered empty placeholder instead of starter course'}
            $course=WaitControl $report '' '(?i)(стартовий офлайн-курс|starter offline course)' ''
            if(-not (AccessibleText $course)){throw 'Packaged starter course heading is empty'}
            Write-Host 'PACKAGED_W3_BOOKS_DISCOVER_OPEN_READ_OFFLINE=PASS'

            $trainingNav=WaitControl $report 'v2-nav-training' '^(Тренування|Training)$' 'ControlType.Button'
            InvokeControl $trainingNav 'Training navigation'
            $answer=WaitControl $report 'training-answer' '' 'ControlType.Edit'
            if(-not [bool]$answer.Current.IsEnabled -or -not [bool]$answer.Current.IsKeyboardFocusable){throw 'Packaged Training answer edit is not enabled/focusable'}
            $emptyTraining=FindControl (Rewalk $report) 'v2-training-empty-status' '' ''
            if($null -ne $emptyTraining){throw 'Packaged Training route rendered empty placeholder instead of canonical exercise'}
            $hint=WaitControl $report '' '^(Підказка|Hint)$' 'ControlType.Button'
            $beforeHint=AccessibleText (FindControl (Rewalk $report) 'live' '' '')
            InvokeControl $hint 'Training hint'
            $hintText=WaitLiveChange $report $beforeHint
            if(-not $hintText){throw 'Packaged Training hint did not expose accessible feedback'}
            Write-Host 'PACKAGED_W3_TRAINING_ENTER_USE_OFFLINE=PASS'

            CloseByKeyboard $first
            Write-Host 'PACKAGED_KEYBOARD_CLOSE_ALT_F4=PASS'

            $second=Start-Process -FilePath $exe -WorkingDirectory $productRoot -PassThru
            $restartReport=ReadTopology $second
            $restartLauncher=WaitControl $restartReport 'board-launcher' '^(Увійти на дошку|Enter board)$' 'ControlType.Button'
            InvokeControl $restartLauncher 'Restart board launcher'
            $restartSquares=WaitSquares $restartReport
            if($restartSquares.Count -ne 64){throw 'Restarted packaged app does not expose 64 semantic squares'}
            $restartBooks=WaitControl $restartReport 'v2-nav-books' '^(Книги|Books)$' 'ControlType.Button'
            InvokeControl $restartBooks 'Restart Books navigation'
            $null=WaitControl $restartReport 'book-bookmark-name' '' 'ControlType.Edit'
            $restartTraining=WaitControl $restartReport 'v2-nav-training' '^(Тренування|Training)$' 'ControlType.Button'
            InvokeControl $restartTraining 'Restart Training navigation'
            $null=WaitControl $restartReport 'training-answer' '' 'ControlType.Edit'
            Write-Host 'PACKAGED_RESTART_REOPEN_UIA_64_BOOKS_TRAINING=PASS'

            $evidence=[ordered]@{
              product_sha=$env:PRODUCT_PARENT
              p0g_action_occurred=$true
              p0g_accessible_result_exposed=$true
              p0g_mode=$p0gMode
              p0g_result=$p0gText
              books_discover_open_read_offline=$true
              training_enter_use_offline=$true
              keyboard_close_alt_f4=$true
              restart_reopen=$true
              restart_semantic_square_count=64
              human_tested=$false
              nvda_verified=$false
            }
            $evidence|ConvertTo-Json -Depth 5|Set-Content -Encoding UTF8 packaged-final-acceptance-summary.json
            CloseByKeyboard $second
            $second=$null
          }
          finally {
            if($null -ne $first){
              $live=Get-Process -Id $first.Id -ErrorAction SilentlyContinue
              if($live){Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue}
            }
            if($null -ne $second){
              $live=Get-Process -Id $second.Id -ErrorAction SilentlyContinue
              if($live){Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue}
            }
          }
          if(-not (Test-Path packaged-final-acceptance-summary.json)){throw 'Final packaged acceptance summary missing'}
          $bounded=Get-Content -Raw packaged-final-acceptance-summary.json
          if($bounded -match '(?i)[A-Z]:\\\\|/home/|/Users/|/tmp/'){throw 'Local path leaked into final packaged evidence'}

      - name: Upload post-freeze Windows package qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Accessible-Chess-V2-post-freeze-package-qualification
          path: |
            candidate-output/Accessible-Chess-V2-*-post-freeze-package-qualification.zip
            packaged-uia-strict-summary.json
            packaged-v2-current-native-menu-summary.json
            packaged-final-acceptance-summary.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Download uploaded package artifact for exact readback
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Accessible-Chess-V2-post-freeze-package-qualification
          path: artifact-readback

      - name: Verify uploaded artifact byte identity W2 W3 and final evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $original=(Resolve-Path (Join-Path 'candidate-output' $env:CANDIDATE_FILE)).Path
          $downloaded=@(Get-ChildItem -LiteralPath artifact-readback -File -Filter '*.zip')
          if($downloaded.Count -ne 1){throw "Expected exactly one downloaded package ZIP, found $($downloaded.Count)"}
          if($downloaded[0].Name -ne $env:CANDIDATE_FILE){throw "Downloaded artifact filename mismatch: $($downloaded[0].Name)"}
          $sourceDigest=(Get-FileHash -Algorithm SHA256 -LiteralPath $original).Hash.ToLowerInvariant()
          $readbackDigest=(Get-FileHash -Algorithm SHA256 -LiteralPath $downloaded[0].FullName).Hash.ToLowerInvariant()
          if($sourceDigest -ne $readbackDigest){throw "ARTIFACT_READBACK_SHA256_MISMATCH source=$sourceDigest readback=$readbackDigest"}
          $evidencePath=Join-Path 'artifact-readback' 'packaged-final-acceptance-summary.json'
          if(-not (Test-Path -LiteralPath $evidencePath)){throw 'Downloaded final acceptance evidence missing'}
          $evidence=Get-Content -LiteralPath $evidencePath -Raw|ConvertFrom-Json
          if([string]$evidence.product_sha -ne $env:PRODUCT_PARENT){throw 'Downloaded final evidence Product SHA mismatch'}
          if(-not [bool]$evidence.p0g_action_occurred -or -not [bool]$evidence.p0g_accessible_result_exposed){throw 'Downloaded P0-G evidence incomplete'}
          if(-not [bool]$evidence.books_discover_open_read_offline -or -not [bool]$evidence.training_enter_use_offline){throw 'Downloaded W3 evidence incomplete'}
          if(-not [bool]$evidence.keyboard_close_alt_f4 -or -not [bool]$evidence.restart_reopen -or [int]$evidence.restart_semantic_square_count -ne 64){throw 'Downloaded restart evidence incomplete'}
          if([bool]$evidence.human_tested -or [bool]$evidence.nvda_verified){throw 'Automated artifact illegally claims human/NVDA verification'}

          New-Item -ItemType Directory -Path artifact-readback-extracted | Out-Null
          Expand-Archive -LiteralPath $downloaded[0].FullName -DestinationPath artifact-readback-extracted
          @'
          import hashlib
          import json
          import os
          from pathlib import Path
          from acs.acsdb import ACSDB_SCHEMA_VERSION, AcsDatabase
          from acs.version2_package_preflight import validate_version2_package_tree

          root = Path('artifact-readback-extracted')
          report = validate_version2_package_tree(
              root,
              expected_integration_sha=os.environ['PRODUCT_PARENT'],
          )
          product = root / 'AccessibleChess'
          w2 = product / 'release-content' / 'w2-starter'
          expected = {'starter_uk.pgn', 'stress_uk.pgn', 'sample_library.acsdb', 'manifest.json'}
          actual = {path.name for path in w2.iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)
          manifest = json.loads((w2 / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['runtime_network_required'] is False
          assert manifest['starter_source']['selected_games'] >= 200
          for name in ('starter_uk.pgn', 'stress_uk.pgn', 'sample_library.acsdb'):
              digest = hashlib.sha256((w2 / name).read_bytes()).hexdigest()
              assert digest == manifest['files'][name]['sha256'], name
          with AcsDatabase(w2 / 'sample_library.acsdb') as database:
              assert database.verify_integrity() == ACSDB_SCHEMA_VERSION
              rows = database.search_games(limit=1000)
              assert len(rows) == manifest['counts']['starter_games']
              first = database.get_game(int(rows[0]['id']))
              assert first and first['pgn_text']

          w3 = product / 'release-content' / 'w3-starter-books-training'
          w3_manifest = json.loads((w3 / 'manifest.json').read_text(encoding='utf-8'))
          assert w3_manifest['material_count'] == 24
          assert w3_manifest['training_exercise_count'] == 144
          assert w3_manifest['training_unique_fen_count'] >= 64
          assert w3_manifest['runtime_network_required'] is False
          assert (w3 / 'PROVENANCE.md').is_file()
          print(f'ARTIFACT_READBACK_PREFLIGHT_FILES={len(report.inventory)}')
          print('ARTIFACT_READBACK_PREFLIGHT=PASS')
          print('ARTIFACT_W2_EXACT_FOUR_FILES=PASS')
          print('ARTIFACT_W2_OFFLINE_DISCOVER_OPEN_SEARCH=PASS')
          print('ARTIFACT_W3_MANIFEST_PROVENANCE=PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Downloaded artifact canonical/W2/W3 preflight failed'}
          Write-Host "ARTIFACT_READBACK_SHA256=$readbackDigest"
          Write-Host 'ARTIFACT_UPLOAD_DOWNLOAD_SHA256_READBACK=PASS'
          Write-Host 'ARTIFACT_FINAL_ACCEPTANCE_EVIDENCE_READBACK=PASS'

      - name: Package qualification checkpoint
        shell: pwsh
        run: |
          $zip=Join-Path 'candidate-output' $env:CANDIDATE_FILE
          $digest=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Write-Host "CANDIDATE_PRODUCT_SHA=$env:PRODUCT_PARENT"
          Write-Host "CANDIDATE_ZIP_SHA256=$digest"
          Write-Host 'VERSION2_WINDOWS_ZIP=YES'
          Write-Host 'POST_FREEZE_PACKAGE_QUALIFICATION=PASS'
          Write-Host 'FRESH_WINDOWS_PACKAGE=YES'
          Write-Host 'W2_RELEASE_CONTENT=PASS'
          Write-Host 'W2_OFFLINE_DISCOVER_OPEN_SEARCH=PASS'
          Write-Host 'W3_RELEASE_CONTENT_MANIFEST=PASS'
          Write-Host 'W3_BOOKS_TRAINING_PACKAGED_REACHABILITY=PASS'
          Write-Host 'P0G_PACKAGED_ACTION_RESULT_ACCESSIBILITY=PASS'
          Write-Host 'AUTOMATED_UIA_PROOF=PASS'
          Write-Host 'NATIVE_MENUBAR_UIA_PROOF=PASS'
          Write-Host 'PACKAGED_KEYBOARD_CLOSE_RESTART=PASS'
          Write-Host 'ARTIFACT_READBACK=PASS'
          Write-Host 'HUMAN_TESTED=NO'
          Write-Host 'NVDA_VERIFIED=NO'
