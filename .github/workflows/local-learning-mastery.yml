name: Local Learning Mastery Contract

on:
  pull_request:
    paths:
      - 'acs/learning_mastery.py'
      - 'acs/learning_mastery_store.py'
      - 'acs/learning_mastery_training.py'
      - 'acs/training_webview_projection.py'
      - 'acs/version2_training_workspace.py'
      - 'tests/test_learning_mastery.py'
      - 'tests/test_learning_mastery_integration.py'
      - 'tests/test_learning_mastery_v2_reachability.py'
      - 'tests/js/books_training_surface_dom_test.js'
      - 'web/full_product_books_training.js'
      - '.github/workflows/local-learning-mastery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-learning-mastery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact candidate and isolated mastery scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha }}"
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$expected_head" || {
            printf 'Mastery candidate mismatch: expected=%s actual=%s\n' "$expected_head" "$actual_head" >&2
            exit 1
          }
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/local-learning-mastery.yml'             'acs/learning_mastery.py'             'acs/learning_mastery_store.py'             'acs/learning_mastery_training.py'             'acs/training_webview_projection.py'             'acs/version2_training_workspace.py'             'tests/js/books_training_surface_dom_test.js'             'tests/test_learning_mastery.py'             'tests/test_learning_mastery_integration.py'             'tests/test_learning_mastery_v2_reachability.py'             'web/full_product_books_training.js' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected local-mastery scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Compile mastery and current Training reachability
        run: >-
          python -m compileall -q
          acs/learning_mastery.py
          acs/learning_mastery_store.py
          acs/learning_mastery_training.py
          acs/training_webview_projection.py
          acs/version2_training_workspace.py
          tests/test_learning_mastery.py
          tests/test_learning_mastery_integration.py
          tests/test_learning_mastery_v2_reachability.py

      - name: Execute mastery and V2 Training regressions
        run: >-
          python -m unittest -v
          tests.test_learning_mastery
          tests.test_learning_mastery_integration
          tests.test_learning_mastery_v2_reachability
          tests.test_version2_training_current_runtime
          tests.test_books_training_ui_integration

      - name: Execute Training DOM semantic regression
        run: node tests/js/books_training_surface_dom_test.js

      - name: Core selftest
        run: python -m acs.selftest
