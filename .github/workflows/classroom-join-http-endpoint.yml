name: Classroom Join HTTP Endpoint

on:
  pull_request:
    branches:
      - feature/livekit-join-token-issuer-20261002
    paths:
      - 'acs/classroom_join_http_endpoint.py'
      - 'tests/test_classroom_join_http_endpoint.py'
      - '.github/workflows/classroom-join-http-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-join-http-endpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  endpoint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/livekit-join-token-issuer-20261002"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current LiveKit token-issuer base $base is not an ancestor of HEAD; synchronize the stack."
            exit 1
          fi
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/classroom-join-http-endpoint.yml' \
            'acs/classroom_join_http_endpoint.py' \
            'tests/test_classroom_join_http_endpoint.py' | sort)"
          test "$changed" = "$allowed"
          git diff --quiet "$base" HEAD -- \
            acs/classroom_join_credentials.py \
            acs/livekit_join_token_issuer.py \
            acs/classroom_realtime_media.py \
            acs/classroom_domain.py \
            acs/chesscore.py
          echo "CLASSROOM_JOIN_HTTP_EXACT_SCOPE=PASS"

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile endpoint and stacked authorities
        run: >-
          python -m py_compile
          acs/classroom_join_http_endpoint.py
          acs/classroom_join_credentials.py
          acs/livekit_join_token_issuer.py
          tests/test_classroom_join_http_endpoint.py

      - name: Run endpoint and canonical join/media regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_join_http_endpoint
          tests.test_classroom_join_credentials
          tests.test_livekit_join_token_issuer
          tests.test_classroom_realtime_media

      - name: Verify pinned official LiveKit server wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --dest .livekit-sdk livekit-api==1.2.1
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          expected_name = "livekit_api-1.2.1-py3-none-any.whl"
          expected_sha = "aa15b0a194c9e8167d4261bc61381682df23f98bc6d77760fcded93d2ce4b4ca"
          files = list(Path(".livekit-sdk").glob("*"))
          assert len(files) == 1, files
          assert files[0].name == expected_name, files[0].name
          assert sha256(files[0].read_bytes()).hexdigest() == expected_sha
          print("LIVEKIT_API_WHEEL_IDENTITY=PASS")
          PY

      - name: Install exact LiveKit token SDK and prove full HTTP to signed JWT stack
        run: |
          python -m pip install --disable-pip-version-check -q livekit-api==1.2.1
          python -m unittest -v \
            tests.test_livekit_join_token_issuer.LiveKitJoinTokenIssuerTests.test_real_pinned_sdk_emits_verified_source_scoped_jwt_when_installed \
            tests.test_classroom_join_http_endpoint.ClassroomJoinHttpEndpointTests.test_secure_post_authenticates_then_uses_canonical_join_service

      - name: Prove transport security boundary stays server-only
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'os\.(environ|getenv)|LIVEKIT_API_SECRET|LIVEKIT_API_KEY' acs/classroom_join_http_endpoint.py
          ! grep -Eq 'query_string.*token|token.*query_string' acs/classroom_join_http_endpoint.py
          grep -Fq 'JOIN_CREDENTIAL_PATH = "/v1/classroom/join-credential"' acs/classroom_join_http_endpoint.py
          grep -Fq 'scheme == "https"' acs/classroom_join_http_endpoint.py
          grep -Fq 'cache-control", b"no-store"' acs/classroom_join_http_endpoint.py
          grep -Fq 'www-authenticate' acs/classroom_join_http_endpoint.py
          grep -Fq 'MAX_JOIN_REQUEST_BYTES' acs/classroom_join_http_endpoint.py
          grep -Fq 'authenticate_bearer' acs/classroom_join_http_endpoint.py
          echo "CLASSROOM_JOIN_HTTP_SECURITY_BOUNDARY=PASS"

      - name: Existing browser moderation wire contract
        run: node tests/js/livekit_classroom_media_adapter_test.js

      - name: Core selftest
        run: python -m acs.selftest
