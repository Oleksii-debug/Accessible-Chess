name: Classroom File Retention Cleanup

on:
  pull_request:
    branches:
      - feature/classroom-file-server-20261003
    paths:
      - 'acs/classroom_file_server.py'
      - 'tests/test_classroom_file_retention_cleanup.py'
      - '.github/workflows/classroom-file-retention-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-file-retention-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retention:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked retention scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-file-server-20261003"
          git cat-file -e "${EVENT_BASE_SHA}^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | LC_ALL=C sort)"
          allowed="$(printf '%s\n'             '.github/workflows/classroom-file-retention-cleanup.yml'             'acs/classroom_file_server.py'             'tests/test_classroom_file_retention_cleanup.py' | LC_ALL=C sort)"
          test "$changed" = "$allowed"
          echo "CLASSROOM_FILE_RETENTION_EXACT_SCOPE=PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile retention authority
        run: >-
          python -m py_compile
          acs/classroom_file_server.py
          tests/test_classroom_file_retention_cleanup.py

      - name: Prove no persistent lifecycle sweep
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"transient", "session"' acs/classroom_file_server.py
          grep -Fq 'retention cleanup cannot delete persistent files' acs/classroom_file_server.py
          ! grep -Eq 'os\.(environ|getenv)|API_SECRET|API_KEY|STORAGE_SECRET'             acs/classroom_file_server.py
          echo "CLASSROOM_FILE_RETENTION_PRIVACY_BOUNDARY=PASS"

      - name: Run retention and canonical file-server regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_file_retention_cleanup
          tests.test_classroom_file_server
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
