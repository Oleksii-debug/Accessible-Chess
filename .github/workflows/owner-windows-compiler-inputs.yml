name: Owner Windows Compiler Inputs
'on':
  push:
    branches:
    - build/owner-windows-20261006-6be0afe
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: owner-windows-compiler-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHON_VERSION: 3.12.10
  PYWEBVIEW_VERSION: 6.2.1
  PYTHONNET_VERSION: 3.1.0
  CLR_LOADER_VERSION: 0.3.1
  CFFI_VERSION: 2.1.1
  PYCPARSER_VERSION: '3.0'
  TYPING_EXTENSIONS_VERSION: 4.16.0
  NUITKA_UPSTREAM_FIX_COMMIT: b7ea05bf570e0b6950de6db7c4c8e579e1b77d29
  ORDERED_SET_VERSION: 4.1.0
  ZSTANDARD_VERSION: 0.25.0
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: f411837e9c81ca4800456be0cd62b83e51dec86f
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Prove source app-config contract
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        python -m unittest -v tests.test_packaged_winforms_appconfig tests.test_webview2_modern_winforms_accessibility
        if($LASTEXITCODE -ne 0){throw 'Packaged WinForms app-config source contract failed'}
    - name: Install exact package compiler stack
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $nuitkaUrl="https://github.com/Nuitka/Nuitka/archive/$env:NUITKA_UPSTREAM_FIX_COMMIT.zip"
        python -m pip install --disable-pip-version-check `
          "pywebview==$env:PYWEBVIEW_VERSION" `
          "pythonnet==$env:PYTHONNET_VERSION" `
          "clr-loader==$env:CLR_LOADER_VERSION" `
          "cffi==$env:CFFI_VERSION" `
          "pycparser==$env:PYCPARSER_VERSION" `
          "typing-extensions==$env:TYPING_EXTENSIONS_VERSION" `
          "Nuitka @ $nuitkaUrl" `
          "ordered-set==$env:ORDERED_SET_VERSION" `
          "zstandard==$env:ZSTANDARD_VERSION"
        if($LASTEXITCODE -ne 0){throw 'Exact package compiler stack installation failed'}
    - name: Qualify owner gameplay and deterministic audio delivery
      shell: pwsh
      run: |-
        python -m unittest -v tests.test_owner_gameplay_feedback tests.test_sound_events tests.test_sound_runtime
        if ($LASTEXITCODE -ne 0) { throw 'Owner gameplay/audio regression failed' }
        python run_accessible_chess_v2.py --diagnostic
        if ($LASTEXITCODE -ne 0) { throw 'Composition diagnostic failed' }
    - name: Qualify package journeys and current Library keyboard semantics
      shell: pwsh
      run: |
        python -m unittest tests.test_whole_product_user_journey tests.test_version2_release_ui tests.test_version2_epub_application_reachability tests.test_v2_book_progress_store_production tests.test_v2_native_dialog_language tests.test_v2_board_analysis_hotkey_feedback tests.test_version2_portable_package
        if ($LASTEXITCODE -ne 0) { throw 'Package functional gate failed' }
        node tests/js/library_surface_dom_test.js
        if ($LASTEXITCODE -ne 0) { throw 'Library keyboard gate failed' }
        node tests/js/owner_gameplay_keyboard_test.js
        if ($LASTEXITCODE -ne 0) { throw 'Owner keyboard gate failed' }
        node tests/js/owner_sound_bridge_ready_test.js
        if ($LASTEXITCODE -ne 0) { throw 'Late sound bridge gate failed' }
    - name: Build shipping standalone with unchanged qualification command
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        python -m nuitka `
          --standalone `
          --assume-yes-for-downloads `
          --windows-console-mode=disable `
          --output-filename=AccessibleChess.exe `
          --include-data-dir=web=web `
          run_accessible_chess_v2.py
        if($LASTEXITCODE -ne 0){throw 'Shipping standalone build failed'}
        $dist=(Resolve-Path 'run_accessible_chess_v2.dist').Path
        $config=Join-Path $dist 'AccessibleChess.exe.config'
        if(-not (Test-Path -LiteralPath $config -PathType Leaf)){throw 'Nuitka output is missing AccessibleChess.exe.config'}
        $source=(Resolve-Path 'packaging\AccessibleChess.exe.config').Path
        $sourceHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
        $distHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $config).Hash.ToLowerInvariant()
        if($sourceHash -ne $distHash){throw "Standalone app-config byte mismatch source=$sourceHash dist=$distHash"}
        Write-Host "STANDALONE_APPCONFIG_SHA256=$distHash"
        Write-Host 'STANDALONE_APPCONFIG_BOUND=PASS'
    - name: Execute freshly compiled application diagnostic
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $root=(Resolve-Path 'run_accessible_chess_v2.dist').Path
        $exe=Join-Path $root 'AccessibleChess.exe'
        $out=Join-Path $env:RUNNER_TEMP 'owner-compiled.stdout.txt'
        $err=Join-Path $env:RUNNER_TEMP 'owner-compiled.stderr.txt'
        $p=Start-Process -FilePath $exe -WorkingDirectory $root -ArgumentList '--diagnostic' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
        if(-not $p.WaitForExit(60000)){ $p.Kill(); throw 'Compiled application diagnostic timed out' }
        $p.Refresh()
        Get-Content $out
        Get-Content $err
        if($p.ExitCode -ne 0){throw "Compiled diagnostic failed: $($p.ExitCode)"}
        if((Get-Content $out -Raw) -notmatch 'ACCESSIBLE CHESS V2 FINAL-PRODUCT COMPOSITION DIAGNOSTIC PASS'){throw 'Compiled diagnostic success marker missing'}
    - name: Compile current native launcher
      shell: cmd
      run: |
        @echo off
        setlocal EnableExtensions
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
        if not defined VSROOT exit /b 20
        call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 21
        if not exist build mkdir build
        cl /nologo /utf-8 /W4 /WX /O2 /GS- /DUNICODE /D_UNICODE /c packaging\portable_launcher.c /Fo:build\portable_launcher.obj || exit /b 22
        link /nologo /MACHINE:X64 /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /NODEFAULTLIB build\portable_launcher.obj kernel32.lib user32.lib /OUT:build\AccessibleChess.exe || exit /b 23
    - name: Bind intermediate inputs to exact source
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $sha='f411837e9c81ca4800456be0cd62b83e51dec86f'
        if((git rev-parse HEAD).Trim() -ne $sha){throw 'Checked-out source differs from exact compiler input'}
        $exe=Get-Item run_accessible_chess_v2.dist/AccessibleChess.exe
        $launcher=Get-Item build/AccessibleChess.exe
        @{schema_version=1;source_sha=$sha;kind='intermediate-build-inputs';human_tested=$false;nvda_verified=$false;exe_sha256=(Get-FileHash $exe).Hash.ToLowerInvariant();launcher_sha256=(Get-FileHash $launcher).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content build/build-inputs.json -Encoding utf8
        $leaks=@(Get-ChildItem run_accessible_chess_v2.dist -Recurse -File | Where-Object {$_.Extension -in '.py','.pyc','.pyo'})
        if($leaks.Count -ne 0){throw 'Raw Python source or bytecode in standalone'}
    - name: Upload intermediate compiler outputs (not a release)
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: owner-windows-build-inputs-f411837e9c81ca4800456be0cd62b83e51dec86f
        path: |-
          run_accessible_chess_v2.dist/
          build/AccessibleChess.exe
          build/build-inputs.json
        if-no-files-found: error
        retention-days: 7
        compression-level: 1
