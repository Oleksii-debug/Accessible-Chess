name: Current Combined Hotkey Accessibility

on:
  push:
    branches:
      - work/user-corpus-pgn-cp1251-20261003
    paths:
      - 'web/index.html'
      - 'web/stage1_release_bootstrap.js'
      - 'web/keybindings.json'
      - 'acs/keybindings.py'
      - 'acs/version2_release_ui.py'
      - 'acs/webapp_keymap_core.py'
      - 'tests/test_accessible_webui.py'
      - 'tests/test_v2_board_analysis_hotkey_feedback.py'
      - 'tests/test_ui_analysis_webapp.py'
      - 'tests/js/p0g_event_aware_announcement_test.js'
      - '.github/workflows/current-combined-hotkey-accessibility.yml'
  pull_request:
    paths:
      - 'web/index.html'
      - 'web/stage1_release_bootstrap.js'
      - 'web/keybindings.json'
      - 'acs/keybindings.py'
      - 'acs/version2_release_ui.py'
      - 'acs/webapp_keymap_core.py'
      - 'tests/test_accessible_webui.py'
      - 'tests/test_v2_board_analysis_hotkey_feedback.py'
      - 'tests/test_ui_analysis_webapp.py'
      - 'tests/js/p0g_event_aware_announcement_test.js'
      - '.github/workflows/current-combined-hotkey-accessibility.yml'

permissions:
  contents: read

concurrency:
  group: current-combined-hotkey-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hotkeys:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile keyboard and analysis seams
        run: >-
          python -m py_compile
          acs/keybindings.py
          acs/version2_release_ui.py
          acs/webapp_keymap_core.py
          tests/test_accessible_webui.py
          tests/test_v2_board_analysis_hotkey_feedback.py
          tests/test_ui_analysis_webapp.py

      - name: Focused Python accessibility regressions
        run: >-
          python -m unittest -v
          tests.test_accessible_webui
          tests.test_v2_board_analysis_hotkey_feedback
          tests.test_ui_analysis_webapp

      - name: Event-aware live-region regression
        run: node tests/js/p0g_event_aware_announcement_test.js

      - name: Exact whitespace check
        shell: bash
        run: git diff --check HEAD^ HEAD
