name: Revised Sections 38-39 Bilingual Advanced Chess QA
on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'acs/section40_advanced_training_runtime.py'
      - 'acs/version2_starter_content_application.py'
      - 'acs/section40_advanced_licensed_dataset.py'
      - 'acs/section40_extreme_licensed_dataset.py'
      - 'docs/corpus/SECTION38_39_ADVANCED_BILINGUAL_QA_CATALOG.json'
      - 'tests/test_section38_39_advanced_bilingual_qa_catalog.py'
      - 'tests/test_section38_39_advanced_bilingual_product_books.py'
      - 'tools/revised_section38_39_advanced_puzzle_pgn.py'
      - 'tests/test_section38_39_advanced_puzzle_pgn.py'
      - '.github/workflows/revised-sections38-39-bilingual-advanced-qa.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  bilingual-real-master-corpus:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile production material and source-bound tests
        run: >-
          python -m py_compile
          acs/section40_advanced_training_runtime.py
          acs/version2_starter_content_application.py
          tests/test_section38_39_advanced_bilingual_qa_catalog.py
          tests/test_section38_39_advanced_bilingual_product_books.py
          tools/revised_section38_39_advanced_puzzle_pgn.py
          tests/test_section38_39_advanced_puzzle_pgn.py
      - name: Verify 16 format boundaries, UK/EN bibliographic truth and 20 real puzzles through Books and Board
        run: >-
          python -m unittest -v
          tests.test_section38_39_advanced_bilingual_qa_catalog
          tests.test_section38_39_advanced_bilingual_product_books
          tests.test_section38_39_advanced_puzzle_pgn
          tests.test_revised_section40_product_books_advanced_integration
          tests.test_revised_section40_advanced_training
      - name: Generate language-independent PGN of 20 real advanced puzzles for Windows testing
        run: python -m tools.revised_section38_39_advanced_puzzle_pgn
      - name: Preserve legal advanced FEN/SAN PGN test download with provenance
        uses: actions/upload-artifact@v4
        with:
          name: section38-39-real-cc0-advanced-pgn-${{ matrix.os }}
          path: _section38_39_advanced_pgn_qa/
          retention-days: 14
      - name: Preserve exact run metadata without declaring Section DONE
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          Path("section38-39-bilingual-readback.json").write_text(json.dumps({
            "head": os.environ.get("GITHUB_SHA"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
            "section38_terminal_done": False,
            "section39_terminal_done": False,
            "human_nvda_verified": False
          }, indent=2) + "\n", encoding="utf-8")
      - name: Store bounded machine readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: section38-39-bilingual-evidence-${{ matrix.os }}
          path: section38-39-bilingual-readback.json
          retention-days: 14
