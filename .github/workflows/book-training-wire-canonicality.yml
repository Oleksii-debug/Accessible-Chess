name: Book Training Wire Canonicality

on:
  pull_request:
    branches:
      - work/full-product-teacher-education-reachability-20260911
    paths:
      - 'acs/book_training.py'
      - 'tests/test_d08_book_training_contract.py'
      - '.github/workflows/book-training-wire-canonicality.yml'

permissions:
  contents: read

concurrency:
  group: book-training-wire-canonicality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove exact Product ancestry, bounded scope, and authority blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          product_branch='work/full-product-teacher-education-reachability-20260911'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$product_branch"

          live_ref="refs/remotes/origin/$product_branch"
          git fetch --no-tags origin "+refs/heads/$product_branch:$live_ref"
          live_product="$(git rev-parse "$live_ref")"
          test "$live_product" = '${{ github.event.pull_request.base.sha }}'
          git merge-base --is-ancestor "$live_product" HEAD
          test "$(git merge-base "$live_product" HEAD)" = "$live_product"

          changed="$(git diff --name-only "$live_product" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/book-training-wire-canonicality.yml' \
            'acs/book_training.py' \
            'tests/test_d08_book_training_contract.py' | sort)"
          test "$changed" = "$expected"

          test "$(git rev-parse HEAD:acs/book_training.py)" = "e6420d5649d43822aa81412aee994440f5acdb9f"
          test "$(git rev-parse HEAD:tests/test_d08_book_training_contract.py)" = "1b5dad2a2b6908c8f95117c331b80fb54ced554a"
          git diff --check "$live_product" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile canonical Book Training boundary
        run: python -m compileall -q acs/book_training.py tests/test_d08_book_training_contract.py

      - name: Prove wire canonicality and canonical chess ingress
        run: >-
          python -m unittest -v
          tests.test_d08_book_training_contract
          tests.test_training
          tests.test_w2_book_training_canonical_ingress
