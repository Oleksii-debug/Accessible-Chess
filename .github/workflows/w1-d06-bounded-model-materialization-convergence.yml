name: W1 D06 Bounded Model Materialization Convergence

on:
  pull_request:
    paths:
      - 'acs/pgn_roundtrip.py'
      - 'tests/test_d06_pgn_roundtrip.py'
      - '.github/workflows/w1-d06-bounded-model-materialization-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w1-d06-bounded-model-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove bounded D06 authority against immutable event base
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MANUAL_BASE_SHA: 4270d6bde3b65308643c648efda1ba42182471bc
          D06_SOURCE_BLOB: 7dfcb123653389ff506c5a48b2004d04a8ab453e
          D06_TEST_BLOB: 5798fdc2afddc12d6394beeb057ccbbc47e01289
        run: |
          set -euo pipefail
          event_base="${EVENT_BASE_SHA:-$MANUAL_BASE_SHA}"
          git cat-file -e "${event_base}^{commit}" || git fetch --no-tags origin "$event_base"
          git merge-base --is-ancestor "$event_base" HEAD
          test "$(git merge-base "$event_base" HEAD)" = "$event_base"
          git diff --check "$event_base...HEAD"

          mapfile -t actual < <(git diff --name-only "$event_base...HEAD" | LC_ALL=C sort)
          expected=(
            ".github/workflows/w1-d06-bounded-model-materialization-convergence.yml"
            "acs/pgn_roundtrip.py"
            "tests/test_d06_pgn_roundtrip.py"
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${actual[$index]}" = "${expected[$index]}"
          done

          test "$(git rev-parse "HEAD:acs/pgn_roundtrip.py")" = "$D06_SOURCE_BLOB"
          test "$(git rev-parse "HEAD:tests/test_d06_pgn_roundtrip.py")" = "$D06_TEST_BLOB"

      - name: Compile D06 and inherited workspace contracts
        run: python -m compileall -q acs/pgn_roundtrip.py acs/pgn_workspace.py tests/test_w1_d06_bounded_model_materialization.py tests/test_d06_pgn_roundtrip.py

      - name: Focused bounded-materialization and canonical PGN regression
        run: python -m unittest -v tests.test_w1_d06_bounded_model_materialization tests.test_d06_pgn_roundtrip

      - name: Final-product production-composition diagnostic
        run: python run_accessible_chess_v2.py --diagnostic

      - name: Broad repository unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Broad repository pytest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m pytest -q
