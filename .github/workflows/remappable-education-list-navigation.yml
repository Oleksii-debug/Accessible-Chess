name: Remappable Education List Navigation

on:
  pull_request:
    branches:
      - fix/remappable-library-result-navigation-20260926
    paths:
      - 'acs/keybindings.py'
      - 'acs/full_product_actions.py'
      - 'web/full_product_education.js'
      - 'tests/test_full_product_education_keybindings.py'
      - 'tests/js/education_surface_dom_test.js'
      - '.github/workflows/remappable-education-list-navigation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remappable-education-list-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          merge_base="$(git merge-base "$base" HEAD)"
          changed="$(git diff --name-only "$merge_base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/remappable-education-list-navigation.yml' \
            'acs/full_product_actions.py' \
            'acs/keybindings.py' \
            'tests/js/education_surface_dom_test.js' \
            'tests/test_full_product_education_keybindings.py' \
            'web/full_product_education.js' | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected Education keymap scope:\n%s\n' "$changed" >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile registry regression
        run: >-
          python -m py_compile
          acs/keybindings.py
          acs/full_product_actions.py
          tests/test_full_product_education_keybindings.py

      - name: Prove Education registry defaults and persisted remap
        run: python -m unittest -v tests.test_full_product_education_keybindings

      - name: Prove Education DOM keyboard/privacy contract
        run: node tests/js/education_surface_dom_test.js

      - name: Reject literal Education-list key ownership
        shell: bash
        run: |
          set -euo pipefail
          if grep -E 'event\.key[[:space:]]*===?[[:space:]]*"(ArrowUp|ArrowDown|Enter)"' web/full_product_education.js; then
            echo 'Education surface still owns literal list navigation keys' >&2
            exit 1
          fi
