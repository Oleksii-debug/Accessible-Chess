# DEV1 evidence only: exact repaired Stage1 UI/NVDA readback; no Product mutation.
name: DEV1 Repaired Stage1 UI/NVDA Evidence

on:
  push:
    branches:
      - auto/dev1-stage1-80720-ui-evidence-20260823-1356
    paths:
      - '.github/workflows/dev1-stage1-80720-ui-evidence.yml'
  pull_request:
    branches:
      - manual5/integration-20260821
    paths:
      - '.github/workflows/dev1-stage1-80720-ui-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev1-repaired-stage1-ui-${{ github.event_name }}
  cancel-in-progress: false

env:
  PRIOR_STAGE1_SHA: 0fa442330bc2bb03636ff9297512da4c29e38684
  REPAIRED_STAGE1_SHA: 80720e8125c59a213f278668d599040f2768d553

jobs:
  repaired-ui-linux:
    name: Repaired Stage1 UI/NVDA contracts — Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.REPAIRED_STAGE1_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact repaired source and DEV1-neutral scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIRED_STAGE1_SHA"
          test "$(git merge-base "$PRIOR_STAGE1_SHA" "$REPAIRED_STAGE1_SHA")" = "$PRIOR_STAGE1_SHA"
          git diff --check "$PRIOR_STAGE1_SHA" "$REPAIRED_STAGE1_SHA"
          python - <<'PY'
          import os, subprocess
          allowed={'.github/workflows/dev5-stage1-path-privacy-repair.yml','acs/engine.py','acs/import_registry.py','acs/pgn_service.py','acs/report_paths.py','tests/test_stage1_release_path_privacy.py'}
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['PRIOR_STAGE1_SHA'],os.environ['REPAIRED_STAGE1_SHA']],text=True).splitlines())
          assert changed == allowed, (sorted(changed), sorted(allowed))
          forbidden=[p for p in changed if p.startswith('web/') or p.startswith('acs/webapp') or p.startswith('acs/stage1_release_ui') or p.startswith('acs/keybindings')]
          assert not forbidden, forbidden
          print('EXACT REPAIRED STAGE1 + DEV1-NEUTRAL SCOPE PASS')
          PY
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Parse browser bridge and compile
        run: |
          node --check web/stage1_board_actions.js
          python -m compileall -q acs tests run_accessible_chess.py
      - name: Candidate-facing DEV1 UI accessibility contracts
        run: >-
          python -m unittest -v
          tests.test_accessible_webui
          tests.test_nvda_p0_contract
          tests.test_issue22_release_contract
          tests.test_stage1_complete_user_flow
          tests.test_stage1_release_composition_ui
          tests.test_stage1_packaged_focus_origin_contract
          tests.test_stage1_webview2_accessibility_boundary
          tests.test_dev1_release_ui_regressions
          tests.test_webview_keymap_bridge_contract
          tests.test_stage1_native_menu_action_routing
      - name: Current repaired Stage1 privacy regressions
        run: python -m pytest -q tests/test_stage1_release_path_privacy.py
      - name: Candidate-facing SELFTEST
        run: python run_accessible_chess.py --selftest
      - name: Candidate-facing diagnostic
        run: python run_accessible_chess.py --diagnostic

  repaired-ui-windows:
    name: Repaired Stage1 UI/NVDA contracts — Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.REPAIRED_STAGE1_SHA }}
      - name: Preserve exact LF source semantics
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard $env:REPAIRED_STAGE1_SHA
          if((git rev-parse HEAD).Trim() -ne $env:REPAIRED_STAGE1_SHA){throw 'Repaired Stage1 source mismatch'}
          if((git merge-base $env:PRIOR_STAGE1_SHA $env:REPAIRED_STAGE1_SHA).Trim() -ne $env:PRIOR_STAGE1_SHA){throw 'Repaired Stage1 ancestry mismatch'}
          git diff --check $env:PRIOR_STAGE1_SHA $env:REPAIRED_STAGE1_SHA
          if($LASTEXITCODE -ne 0){throw 'repaired Stage1 diff hygiene failed'}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install -q pytest
      - name: Parse browser bridge and compile
        shell: pwsh
        run: |
          node --check web/stage1_board_actions.js
          if($LASTEXITCODE -ne 0){throw 'browser JS parse failed'}
          python -m compileall -q acs tests run_accessible_chess.py
          if($LASTEXITCODE -ne 0){throw 'compileall failed'}
      - name: Candidate-facing DEV1 UI accessibility contracts
        shell: pwsh
        run: |
          python -m unittest -v tests.test_accessible_webui tests.test_nvda_p0_contract tests.test_issue22_release_contract tests.test_stage1_complete_user_flow tests.test_stage1_release_composition_ui tests.test_stage1_packaged_focus_origin_contract tests.test_stage1_webview2_accessibility_boundary tests.test_dev1_release_ui_regressions tests.test_webview_keymap_bridge_contract tests.test_stage1_native_menu_action_routing
          if($LASTEXITCODE -ne 0){throw 'candidate-facing UI/NVDA contracts failed'}
      - name: Current repaired Stage1 privacy regressions
        run: python -m pytest -q tests/test_stage1_release_path_privacy.py
      - name: Candidate-facing SELFTEST
        shell: pwsh
        run: |
          python run_accessible_chess.py --selftest
          if($LASTEXITCODE -ne 0){throw 'SELFTEST failed'}
      - name: Candidate-facing diagnostic
        shell: pwsh
        run: |
          python run_accessible_chess.py --diagnostic
          if($LASTEXITCODE -ne 0){throw 'candidate-facing diagnostic failed'}
