name: V2 Library ACSDB Search V4

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: v2-library-acsdb-search-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911

jobs:
  validate-library-search-v4:
    name: Validate library/search v4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout candidate exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact candidate and live Product ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

          git fetch --no-tags origin "$PRODUCT_BRANCH"
          live_product="$(git rev-parse "origin/$PRODUCT_BRANCH")"
          git cat-file -e "$live_product^{commit}"
          git merge-base --is-ancestor "$live_product" HEAD
          test "$(git merge-base "$live_product" HEAD)" = "$live_product"
          git diff --check "$live_product" HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate workflow authority contract
        run: >-
          python -m unittest -v
          tests.test_v2_library_acsdb_search_v4_workflow

      - name: Validate candidate ACSDB + deterministic 100k responsiveness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m py_compile \
            acs/acsdb.py \
            tools/v2_library_acsdb_search_v4_benchmark.py \
            tests/test_v2_library_acsdb_search_v4_workflow.py
          python -m tools.v2_library_acsdb_search_v4_benchmark --games 100000
