name: Training Snapshot Accepted Path Bounds

on:
  pull_request:
    branches:
      - 'fix/training-session-definition-identity-v4-20261003'
    paths:
      - 'acs/training.py'
      - 'tests/test_training.py'
      - '.github/workflows/training-snapshot-accepted-path-bounds.yml'

permissions:
  contents: read

concurrency:
  group: training-snapshot-accepted-path-bounds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accepted-path-bounds:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Prove stacked ancestry, bounded scope, and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha }}'
          parent_branch='fix/training-session-definition-identity-v4-20261003'
          test "$(git rev-parse HEAD)" = "$expected_head"
          test '${{ github.event.pull_request.base.ref }}' = "$parent_branch"

          live_ref="refs/remotes/origin/$parent_branch"
          git fetch --no-tags origin "+refs/heads/$parent_branch:$live_ref"
          live_parent="$(git rev-parse "$live_ref")"
          event_base='${{ github.event.pull_request.base.sha }}'
          test -n "$event_base"
          git cat-file -e "$event_base^{commit}"
          git merge-base --is-ancestor "$event_base" "$live_parent"
          git merge-base --is-ancestor "$live_parent" HEAD
          test "$(git merge-base "$live_parent" HEAD)" = "$live_parent"

          changed="$(git diff --name-only "$live_parent" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/training-snapshot-accepted-path-bounds.yml' \
            'acs/training.py' \
            'tests/test_training.py' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:acs/training.py)" = "f46afaef5a0214898394216fb9fa27eb5dc827fb"
          test "$(git rev-parse HEAD:tests/test_training.py)" = "5bfe070dd826cfa8e2b838977f8ed2fac35f17ec"
          git diff --check "$live_parent" HEAD

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile Training persistence boundary
        run: >-
          python -m compileall -q
          acs/training.py
          tests/test_training.py

      - name: Prove bounded restore and retained canonical Training behavior
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_d08_training_canonical_resume
          tests.test_p0f_starter_training_canonical_legality
