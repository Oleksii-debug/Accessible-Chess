name: D04 Current Formats Convergence

on:
  push:
    branches:
      - work/d04-current-formats-convergence-20260907
  pull_request:
    paths:
      - '.github/workflows/d04-current-formats-convergence.yml'
      - 'acs/cbv_extractor.py'
      - 'acs/chessbase_decoder.py'
      - 'acs/chessbase_integrity.py'
      - 'acs/chessbase_library_import.py'
      - 'acs/chesscore.py'
      - 'acs/report_paths.py'
      - 'docs/automation/V2_CBH_ANNOTATION_CAPABILITY.json'
      - 'tests/test_cbv_extractor.py'
      - 'tests/test_cbv_uncbv_external_fixture.py'
      - 'tests/test_d04_cbh_backend_immutability.py'
      - 'tests/test_d04_chessbase_integrity_handle_identity.py'
      - 'tests/test_d04_drive_relative_report_privacy.py'
      - 'tests/test_v2_a4_canonical_nullmove.py'
      - 'tests/test_v2_dev07_cbh_canonical_adapter.py'
      - 'tests/test_v2_dev07_cbh_real_corpora.py'
      - 'tests/test_v2_dev09_cbh_annotations_variations.py'
      - 'tests/test_version2_formats_integration.py'
      - 'tools/optional/libcbh_json_bridge.cpp'

permissions:
  contents: read

concurrency:
  group: d04-current-formats-convergence-${{ github.ref }}
  cancel-in-progress: true

env:
  D04_BASE: 9ac0600bf9d270e02334df1657c1ccc941f909b5
  LIBCBH_COMMIT: 9641c5c3949d8fb210b17dd9aa54455645843696
  UNCBV_COMMIT: 3c18e8a7c6a30c21f945a1ab5462521c306dca57

jobs:
  current-base-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve exact Git bytes
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD
          git checkout-index --force --all
          while IFS='=' read -r path expected; do
            git cat-file blob "HEAD:$path" > "$path"
            actual="$(git hash-object --no-filters "$path")"
            test "$actual" = "$expected"
          done <<'FROZEN'
          acs/stage1_release_ui_core.py=b8586a26b9ab20c3d3ec0b0a3dbbbd53e38e94e6
          acs/webapp_keymap_core.py=0ba06f548d39dad7372e0339b3e121fd1717cc05
          FROZEN

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove current-base ancestry and exact D04 scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$D04_BASE" HEAD
          git diff --check "$D04_BASE" HEAD
          changed="$(git diff --name-only "$D04_BASE" HEAD | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/d04-current-formats-convergence.yml \
            acs/cbv_extractor.py \
            acs/chessbase_decoder.py \
            acs/chessbase_integrity.py \
            acs/chessbase_library_import.py \
            acs/chesscore.py \
            acs/report_paths.py \
            docs/automation/V2_CBH_ANNOTATION_CAPABILITY.json \
            tests/test_cbv_extractor.py \
            tests/test_cbv_uncbv_external_fixture.py \
            tests/test_d04_cbh_backend_immutability.py \
            tests/test_d04_chessbase_integrity_handle_identity.py \
            tests/test_d04_drive_relative_report_privacy.py \
            tests/test_v2_a4_canonical_nullmove.py \
            tests/test_v2_dev07_cbh_canonical_adapter.py \
            tests/test_v2_dev07_cbh_real_corpora.py \
            tests/test_v2_dev09_cbh_annotations_variations.py \
            tests/test_version2_formats_integration.py \
            tools/optional/libcbh_json_bridge.cpp | sort)"
          test "$changed" = "$allowed" || {
            printf 'Unexpected convergence scope:\n%s\n' "$changed" >&2
            exit 1
          }
          if printf '%s\n' "$changed" | grep -E '(^|/)(stage1|tools/qa/|release_preflight)'; then
            echo 'Stage1/strict QA contamination detected' >&2
            exit 1
          fi

      - name: Lock selected owner and D04 blobs
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r path expected; do
            actual="$(git rev-parse "HEAD:$path")"
            test "$actual" = "$expected" || {
              printf 'D04 blob mismatch: %s expected=%s actual=%s\n' "$path" "$expected" "$actual" >&2
              exit 1
            }
          done <<'LOCKS'
          acs/cbv_extractor.py=3203c8b6abf98ba95871108dbac5db1c666b2238
          acs/chessbase_decoder.py=25073fa9f06d195ad0dbb06c40599cd99359a188
          acs/chessbase_integrity.py=44d63f9c97251ad17e8f71af196b39ed7854b9f7
          acs/chessbase_library_import.py=964b66f4778c8706f9aef6e4e828efcbad769113
          acs/chesscore.py=bac342635e2723b970425c7bf5cc17850bcef59f
          acs/report_paths.py=217185ea53d04584103200698df2568af093af46
          docs/automation/V2_CBH_ANNOTATION_CAPABILITY.json=21625a8b72e14f11c911cb14d14cd6276e9e06b5
          tests/test_cbv_extractor.py=1ae29c6151724789fc342f2e97c22649ce3539b5
          tests/test_cbv_uncbv_external_fixture.py=6476070e952188d94e27eafedaf1b3613fcdb316
          tests/test_d04_cbh_backend_immutability.py=79f4deb44369e02774d04073cec413e6a52d02b0
          tests/test_d04_chessbase_integrity_handle_identity.py=374d233142ae98bd2c76ca3a10e0f4b80d45bc3d
          tests/test_d04_drive_relative_report_privacy.py=593c86558fb173f454cecbe5ee399355662b8e59
          tests/test_v2_a4_canonical_nullmove.py=836a40a5c5892b5addc65a7e63ce6dffbe29b220
          tests/test_v2_dev07_cbh_canonical_adapter.py=722555c1d917a10efc7370bd0e59d61bc70bb7f2
          tests/test_v2_dev07_cbh_real_corpora.py=7482e10d36341e178637e24caa1031d0761c821b
          tests/test_v2_dev09_cbh_annotations_variations.py=6f4c2e7b5eb89cba10144bc86c872bc9789a492c
          tests/test_version2_formats_integration.py=31e21a1384596278d39a50146c6b6f92167c7ace
          tools/optional/libcbh_json_bridge.cpp=109b4fd63d2fbb1f74c98d7570ba4d9f13ae1366
          LOCKS

      - name: Compile D04 composition
        run: python -m compileall -q acs tests run_accessible_chess.py

      - name: Focused D04 composition regressions
        run: >-
          python -m unittest -v
          tests.test_cbv_extractor
          tests.test_chessbase_decoder
          tests.test_chessbase_integrity
          tests.test_d04_cbh_backend_immutability
          tests.test_d04_chessbase_integrity_handle_identity
          tests.test_d04_drive_relative_report_privacy
          tests.test_dev4_chessbase_cross_platform_path_privacy
          tests.test_dev4_chessbase_report_path_privacy
          tests.test_import_contract
          tests.test_v2_a4_canonical_nullmove
          tests.test_v2_dev07_cbh_canonical_adapter
          tests.test_version2_formats_integration

      - name: Focused pytest parity
        run: >-
          python -m pytest -q
          tests/test_cbv_extractor.py
          tests/test_chessbase_decoder.py
          tests/test_chessbase_integrity.py
          tests/test_d04_cbh_backend_immutability.py
          tests/test_d04_chessbase_integrity_handle_identity.py
          tests/test_d04_drive_relative_report_privacy.py
          tests/test_v2_a4_canonical_nullmove.py
          tests/test_v2_dev07_cbh_canonical_adapter.py
          tests/test_version2_formats_integration.py

      - name: Re-materialize frozen Stage1 blobs
        shell: bash
        run: |
          set -euo pipefail
          git cat-file blob HEAD:acs/stage1_release_ui_core.py > acs/stage1_release_ui_core.py
          git cat-file blob HEAD:acs/webapp_keymap_core.py > acs/webapp_keymap_core.py

      - name: Full repository unittest
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee full-unittest.log

      - name: Full repository pytest
        run: python -m pytest -q tests

      - name: SELFTEST and complete diagnostic
        run: |
          python -m acs.selftest
          python run_accessible_chess.py --diagnostic

      - name: Upload regression diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d04-convergence-${{ matrix.os }}
          path: full-unittest.log
          if-no-files-found: ignore
          retention-days: 3

  real-pinned-chessbase:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout convergence head
        uses: actions/checkout@v4
        with:
          path: product
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned libcbh corpus
        uses: actions/checkout@v4
        with:
          repository: rolandlo/libcbh
          ref: 9641c5c3949d8fb210b17dd9aa54455645843696
          path: upstream/libcbh
          fetch-depth: 1

      - name: Checkout pinned uncbv corpus
        uses: actions/checkout@v4
        with:
          repository: antoyo/uncbv
          ref: 3c18e8a7c6a30c21f945a1ab5462521c306dca57
          path: upstream/uncbv
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build pinned libcbh
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/libcbh -B upstream/libcbh/build -DCMAKE_BUILD_TYPE=Release -DGTEST=OFF
          cmake --build upstream/libcbh/build --config Release --parallel 2

      - name: Build current D04 libcbh bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product/build/libcbh
          c++ -std=c++20 -O2 \
            -DLIBCBH_SOURCE_COMMIT=\"$LIBCBH_COMMIT\" \
            -I upstream/libcbh/include \
            product/tools/optional/libcbh_json_bridge.cpp \
            -L upstream/libcbh/build -lcbh \
            -Wl,-rpath,'$ORIGIN' \
            -o product/build/libcbh/libcbh-json-bridge
          cp -a upstream/libcbh/build/libcbh.so* product/build/libcbh/
          test -x product/build/libcbh/libcbh-json-bridge

      - name: Build pinned uncbv
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path upstream/uncbv/Cargo.toml
          test -x upstream/uncbv/target/release/uncbv
          echo "UNCBV_BINARY_SHA256=$(sha256sum upstream/uncbv/target/release/uncbv | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Real CBH canonical null annotations variations and 6117-game CBV journeys
        working-directory: product
        shell: bash
        env:
          LIBCBH_BRIDGE: ${{ github.workspace }}/product/build/libcbh/libcbh-json-bridge
          LIBCBH_ROOT: ${{ github.workspace }}/upstream/libcbh
          LIBCBH_FIXTURE_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
          LIBCBH_ANNOTATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/Annotation
          LIBCBH_VARIATION_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/WithVariations
          LIBCBH_UNUSUAL_DIR: ${{ github.workspace }}/upstream/libcbh/gtest/UnusualStart
          UNCBV_BINARY: ${{ github.workspace }}/upstream/uncbv/target/release/uncbv
          UNCBV_FIXTURE: ${{ github.workspace }}/upstream/uncbv/tests/twic1134.cbv
          UNCBV_SMALL_FIXTURE: ${{ github.workspace }}/upstream/uncbv/tests/small.cbv
        run: |
          set -o pipefail
          {
            python -m unittest -v tests.test_chessbase_libcbh_external_fixture
            python -m unittest -v tests.test_v2_dev07_cbh_real_corpora
            python -m unittest -v tests.test_v2_dev09_cbh_annotations_variations
            python -m unittest -v tests.test_cbv_uncbv_external_fixture
            python -m unittest -v tests.test_version2_formats_integration
          } 2>&1 | tee real-pinned.log

      - name: Default product tree excludes optional GPL binaries
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test ! -e libcbh-json-bridge
          test ! -e libcbh.so
          test ! -e uncbv
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload real pinned diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d04-current-real-pinned-chessbase
          path: product/real-pinned.log
          if-no-files-found: ignore
          retention-days: 3
