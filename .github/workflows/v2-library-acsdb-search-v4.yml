name: V2 Library ACSDB Search V4

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: v2-library-acsdb-search-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRODUCT_BRANCH: work/full-product-teacher-education-reachability-20260911

jobs:
  validate-library-search-v4:
    name: Validate library/search v4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout candidate exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact candidate and live base ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

          base_branch='${{ github.event.pull_request.base.ref }}'
          if [ -z "$base_branch" ]; then
            base_branch="$PRODUCT_BRANCH"
          fi
          git fetch --no-tags origin "$base_branch"
          live_base="$(git rev-parse "origin/$base_branch")"
          git cat-file -e "$live_base^{commit}"
          git merge-base --is-ancestor "$live_base" HEAD
          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base" HEAD

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate workflow authority contract
        run: >-
          python -m unittest -v
          tests.test_v2_library_acsdb_search_v4_workflow

      - name: Validate candidate ACSDB + deterministic 100k responsiveness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m py_compile \
            acs/acsdb.py \
            tools/v2_library_acsdb_search_v4_benchmark.py \
            tests/test_v2_library_acsdb_search_v4_workflow.py
          python -m tools.v2_library_acsdb_search_v4_benchmark --games 100000
