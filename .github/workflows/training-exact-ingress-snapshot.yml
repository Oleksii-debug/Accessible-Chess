name: Training WebView Transaction Rollback

on:
  pull_request:
    paths:
      - 'acs/training.py'
      - 'acs/full_product_presenters.py'
      - 'acs/training_webview_projection.py'
      - 'tests/test_d08_training_canonical_resume.py'
      - 'tests/test_dev1_books_training_webview_projection.py'
      - '.github/workflows/training-exact-ingress-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-webview-transaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    env:
      EXACT_PARENT: cf69f13cf4f7fa774ece00a25112146bc8adb71d
      TRAINING_BLOB: 362778d8679c5c98636e9c6f0259d991cb0571f6
      PRESENTER_BLOB: a8cf2dd078ddbb71be4c12b4ec76b821292ee6f0
      PROJECTION_BLOB: 1dcbdf3d4f0b80a08ade93cb2d3bacc6c139e6a5
      RESUME_TEST_BLOB: a07947fea8ab2e8e6778ba7d6f95f8cdc123030f
      PROJECTION_TEST_BLOB: 4d0d364bd86d32def129d0e6f877aeb3129b5373
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove exact stacked scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXACT_PARENT" HEAD
          test "$(git merge-base "$EXACT_PARENT" HEAD)" = "$EXACT_PARENT"
          test "$(git rev-parse "HEAD:acs/training.py")" = "$TRAINING_BLOB"
          test "$(git rev-parse "HEAD:acs/full_product_presenters.py")" = "$PRESENTER_BLOB"
          test "$(git rev-parse "HEAD:acs/training_webview_projection.py")" = "$PROJECTION_BLOB"
          test "$(git rev-parse "HEAD:tests/test_d08_training_canonical_resume.py")" = "$RESUME_TEST_BLOB"
          test "$(git rev-parse "HEAD:tests/test_dev1_books_training_webview_projection.py")" = "$PROJECTION_TEST_BLOB"
          changed="$(git diff --name-only "$EXACT_PARENT" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/training-exact-ingress-snapshot.yml' \
            'acs/full_product_presenters.py' \
            'acs/training.py' \
            'acs/training_webview_projection.py' \
            'tests/test_d08_training_canonical_resume.py' \
            'tests/test_dev1_books_training_webview_projection.py' | sort)"
          test "$changed" = "$expected"
          git diff --check

      - name: Compile Training transaction boundary
        run: >-
          python -m compileall -q
          acs/training.py
          acs/full_product_presenters.py
          acs/training_webview_projection.py
          tests/test_d08_training_canonical_resume.py
          tests/test_dev1_books_training_webview_projection.py

      - name: Execute Training transaction regression matrix
        run: >-
          python -m unittest -v
          tests.test_training
          tests.test_d08_training_canonical_resume
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_books_training_webview_atomicity
          tests.test_dev1_books_training_webview_bridge
          tests.test_books_training_ui_integration

      - name: Core selftest
        run: python -m acs.selftest
