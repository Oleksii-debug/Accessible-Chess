name: Classroom Media Session Host Transaction

on:
  push:
    branches:
      - feature/classroom-media-session-host-transaction-20261003
  pull_request:
    branches:
      - feature/classroom-media-host-transaction-20261003
    paths:
      - 'acs/classroom_media_host_transactions.py'
      - 'acs/classroom_media_session_transactions.py'
      - 'tests/test_classroom_media_session_transactions.py'
      - '.github/workflows/classroom-media-session-host-transaction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-media-session-host-transaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact stacked session-transaction scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "feature/classroom-media-host-transaction-20261003"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          if ! git merge-base --is-ancestor "$base" HEAD; then
            echo "Current host-transaction owner $base is not an ancestor of HEAD."
            exit 1
          fi
          git diff --check "$base...HEAD"
          mapfile -t actual < <(git diff --name-only "$base...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-media-session-host-transaction.yml'
            'acs/classroom_media_host_transactions.py'
            'acs/classroom_media_session_transactions.py'
            'tests/test_classroom_media_session_transactions.py'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected session-host PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          git diff --quiet "$base...HEAD" --             acs/classroom_realtime_media.py             acs/classroom_media_webview_bridge.py             acs/classroom_media_webview_projection.py             web/livekit_classroom_media.js             web/full_product_classroom_media.js
          echo "CLASSROOM_MEDIA_SESSION_BASE=$base"
          echo 'CLASSROOM_MEDIA_SESSION_BOUNDED_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile transaction boundaries
        run: >-
          python -m py_compile
          acs/classroom_media_host_transactions.py
          acs/classroom_media_session_transactions.py
          tests/test_classroom_media_session_transactions.py

      - name: Run secret-safe session and parent host contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_media_session_transactions
          tests.test_classroom_media_host_transactions
          tests.test_classroom_realtime_media

      - name: Prove token is absent from public transaction wire shapes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq '"token"[[:space:]]*:' acs/classroom_media_host_transactions.py
          grep -Fq '"token": credential.token' acs/classroom_media_session_transactions.py
          grep -Fq 'credential=<redacted>' acs/classroom_media_session_transactions.py
          grep -Fq 'credential_handed_off' acs/classroom_media_session_transactions.py
          grep -Fq 'another classroom media provider transaction is already active'             acs/classroom_media_host_transactions.py
          echo 'CLASSROOM_MEDIA_SESSION_SECRET_BOUNDARY=PASS'
