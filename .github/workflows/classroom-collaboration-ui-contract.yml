name: Classroom collaboration UI contract

on:
  pull_request:
    branches:
      - feature/classroom-file-http-transport-20261003
    paths:
      - 'acs/classroom_collaboration_webview.py'
      - 'acs/version2_final_product_application.py'
      - 'web/full_product_education.js'
      - 'tests/test_classroom_collaboration_webview.py'
      - 'tests/test_classroom_collaboration_final_product.py'
      - 'tests/js/classroom_collaboration_surface_dom_test.js'
      - '.github/workflows/classroom-collaboration-ui-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-collaboration-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact collaboration UI scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_REF" = "feature/classroom-file-http-transport-20261003"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e "$EVENT_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" HEAD
          git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          LIVE_BASE="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          if ! git merge-base --is-ancestor "$LIVE_BASE" HEAD; then
            echo "Current file HTTP base $LIVE_BASE is not an ancestor of HEAD; synchronize the convergence stack."
            exit 1
          fi
          test "$(git merge-base "$LIVE_BASE" HEAD)" = "$LIVE_BASE"
          git diff --check "$LIVE_BASE...HEAD"
          mapfile -t actual < <(git diff --name-only "$LIVE_BASE...HEAD" | LC_ALL=C sort)
          expected=(
            '.github/workflows/classroom-collaboration-ui-contract.yml'
            'acs/classroom_collaboration_webview.py'
            'acs/version2_final_product_application.py'
            'tests/js/classroom_collaboration_surface_dom_test.js'
            'tests/test_classroom_collaboration_final_product.py'
            'tests/test_classroom_collaboration_webview.py'
            'web/full_product_education.js'
          )
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected collaboration UI PR scope.\nExpected:\n'
            printf '  %s\n' "${expected[@]}"
            printf 'Actual:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          echo 'CLASSROOM_COLLABORATION_UI_EXACT_SCOPE=PASS'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile converged collaboration boundaries
        run: >-
          python -m py_compile
          acs/classroom_file_http_transport.py
          acs/classroom_file_rpc.py
          acs/classroom_file_server.py
          acs/classroom_collaboration.py
          acs/classroom_collaboration_storage.py
          acs/classroom_collaboration_webview.py
          acs/version2_final_product_application.py
          tests/test_classroom_file_http_transport.py
          tests/test_classroom_file_rpc.py
          tests/test_classroom_file_server.py
          tests/test_classroom_collaboration_webview.py
          tests/test_classroom_collaboration_final_product.py

      - name: Run converged HTTP, RPC, server and accessible UI contracts
        run: >-
          python -m unittest -v
          tests.test_classroom_file_http_transport
          tests.test_classroom_file_rpc
          tests.test_classroom_file_server
          tests.test_classroom_collaboration
          tests.test_classroom_collaboration_storage
          tests.test_classroom_collaboration_webview
          tests.test_classroom_collaboration_final_product
          tests.test_version2_education_class_create

      - name: Run semantic DOM regressions
        run: |
          node tests/js/classroom_collaboration_surface_dom_test.js
          node tests/js/education_surface_dom_test.js
