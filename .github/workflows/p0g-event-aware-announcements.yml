name: P0-G Event-Aware Accessible Results

on:
  push:
    branches:
      - work/p0g-event-aware-announcements-20260924
  pull_request:
    paths:
      - 'web/index.html'
      - 'web/p0_accessibility_runtime.js'
      - 'tests/js/p0g_event_aware_announcement_test.js'
      - 'tests/js/p0_accessibility_runtime_test.js'
      - '.github/workflows/p0g-event-aware-announcements.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0g-event-aware-announcements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Install pinned verification dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove bounded P0-G scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          git diff --check "$base" HEAD
          changed="$(git diff --name-only "$base" HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/p0g-event-aware-announcements.yml' \
            'tests/js/p0_accessibility_runtime_test.js' \
            'tests/js/p0g_event_aware_announcement_test.js' \
            'web/index.html' \
            'web/p0_accessibility_runtime.js' | sort)"
          test "$changed" = "$expected" || {
            printf 'Unexpected P0-G scope:\n%s\n' "$changed" >&2
            exit 1
          }

      - name: Parse complete shipping inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('web/index.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script>\s*([\s\S]*?)</script>', html)
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one inline script, found {len(matches)}')
          Path('.p0g-shipping-inline.js').write_text(matches[0], encoding='utf-8')
          PY
          node --check .p0g-shipping-inline.js
          node --check web/p0_accessibility_runtime.js

      - name: Execute shipping announcement event contract
        run: |
          node tests/js/p0g_event_aware_announcement_test.js
          node tests/js/p0_accessibility_runtime_test.js

      - name: Backend hotkey result regressions
        run: python -m unittest -v tests.test_v2_board_analysis_hotkey_feedback

      - name: Compile Python product boundary
        run: python -m compileall -q acs tests run_accessible_chess_v2.py

      - name: Full unittest on Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        run: python -m unittest discover -s tests -v

      - name: Focused pytest on Windows
        if: matrix.os == 'windows-2025'
        run: python -m pytest -q tests/test_v2_board_analysis_hotkey_feedback.py