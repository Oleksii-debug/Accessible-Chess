name: Classroom Durable Policy Server Composition QA

on:
  pull_request:
    branches:
      - qa/classroom-moderation-server-composition-20261002
    paths:
      - '.github/workflows/classroom-durable-policy-server-composition.yml'
      - '.github/workflows/classroom-join-credential-service.yml'
      - '.github/workflows/classroom-join-identity-mapping.yml'
      - '.github/workflows/classroom-media-policy-authority.yml'
      - 'acs/classroom_join_credentials.py'
      - 'acs/classroom_media_policy_authority.py'
      - 'acs/classroom_realtime_media.py'
      - 'tests/test_classroom_durable_policy_server_composition.py'
      - 'tests/test_classroom_join_credentials.py'
      - 'tests/test_classroom_media_policy_authority.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classroom-durable-policy-server-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-policy-composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout exact QA head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove current owners and bounded composition scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          IDENTITY_OWNER_SHA: a16b5208891e21de8003f365530862fb1a5b1e6f
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_REF" = "qa/classroom-moderation-server-composition-20261002"
          git cat-file -e "$EVENT_BASE_SHA^{commit}" || git fetch --no-tags origin "$EVENT_BASE_SHA"
          git fetch --no-tags origin "$EXPECTED_BASE_REF"
          base="$(git rev-parse "refs/remotes/origin/$EXPECTED_BASE_REF")"
          git merge-base --is-ancestor "$EVENT_BASE_SHA" "$base"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git merge-base "$base" HEAD)" = "$base"
          git merge-base --is-ancestor "$IDENTITY_OWNER_SHA" HEAD

          for path in             .github/workflows/classroom-join-credential-service.yml             .github/workflows/classroom-join-identity-mapping.yml             .github/workflows/classroom-media-policy-authority.yml             acs/classroom_join_credentials.py             acs/classroom_media_policy_authority.py             acs/classroom_realtime_media.py             tests/test_classroom_join_credentials.py             tests/test_classroom_media_policy_authority.py
          do
            test "$(git rev-parse "$IDENTITY_OWNER_SHA:$path")" = "$(git rev-parse "HEAD:$path")"
          done

          git diff --check "$base...HEAD"
          changed="$(git diff --name-only "$base...HEAD" | sort)"
          expected="$(printf '%s\n'             '.github/workflows/classroom-durable-policy-server-composition.yml'             '.github/workflows/classroom-join-credential-service.yml'             '.github/workflows/classroom-join-identity-mapping.yml'             '.github/workflows/classroom-media-policy-authority.yml'             'acs/classroom_join_credentials.py'             'acs/classroom_media_policy_authority.py'             'acs/classroom_realtime_media.py'             'tests/test_classroom_durable_policy_server_composition.py'             'tests/test_classroom_join_credentials.py'             'tests/test_classroom_media_policy_authority.py' | sort)"
          test "$changed" = "$expected"

          git diff --quiet "$base...HEAD" --             acs/chesscore.py             acs/classroom_domain.py             acs/classroom_moderation_rpc.py             acs/sqlite_classroom_moderation_ledger.py             acs/livekit_classroom_moderation_admin.py

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile combined server path
        run: >-
          python -m py_compile
          acs/classroom_join_credentials.py
          acs/classroom_media_policy_authority.py
          acs/classroom_moderation_rpc.py
          acs/sqlite_classroom_moderation_ledger.py
          acs/livekit_classroom_moderation_admin.py
          tests/test_classroom_durable_policy_server_composition.py

      - name: Run durable policy composition and owner regressions
        run: >-
          python -m unittest -v
          tests.test_classroom_durable_policy_server_composition
          tests.test_classroom_media_policy_authority
          tests.test_classroom_join_credentials
          tests.test_classroom_moderation_server_composition
          tests.test_classroom_moderation_rpc
          tests.test_sqlite_classroom_moderation_ledger
          tests.test_livekit_classroom_moderation_admin
          tests.test_classroom_realtime_media

      - name: Prove one durable authority owns join and moderation policy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'authorization=authority' tests/test_classroom_durable_policy_server_composition.py
          grep -Fq 'STUDENT_ACCOUNT = "account-student-1"' tests/test_classroom_durable_policy_server_composition.py
          grep -Fq 'join_identity_resolver=self.resolver' tests/test_classroom_durable_policy_server_composition.py
          grep -Fq 'trusted_caller_identity=STUDENT_ACCOUNT' tests/test_classroom_durable_policy_server_composition.py
          grep -Fq 'ClassroomMediaPolicyProviderAdmin' tests/test_classroom_durable_policy_server_composition.py
          grep -Fq 'grant.publish_sources, (MediaSource.MICROPHONE,)' tests/test_classroom_durable_policy_server_composition.py
          grep -Fq 'self.assertFalse(pending.committed)' tests/test_classroom_durable_policy_server_composition.py
          grep -Fq 'self.assertTrue(committed.committed)' tests/test_classroom_durable_policy_server_composition.py

      - name: Core selftest
        run: python -m acs.selftest
