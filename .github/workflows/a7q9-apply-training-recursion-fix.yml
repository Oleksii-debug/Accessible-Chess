name: A7Q9 Apply Training Recursion Fix

on:
  push:
    branches:
      - fix/training-progress-recursion-failclosed-20261005-a7q9

permissions:
  contents: write

concurrency:
  group: a7q9-training-recursion-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/training-progress-recursion-failclosed-20261005-a7q9
          fetch-depth: 0

      - name: Apply exact fail-closed decoder repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("acs/training_progress_store.py")
          source = path.read_text(encoding="utf-8")
          old = '''        except (UnicodeDecodeError, json.JSONDecodeError) as exc:\n            raise ValueError("invalid training progress file") from exc\n'''
          new = '''        except RecursionError as exc:\n            raise TrainingProgressResourceError(\n                "training progress JSON nesting depth exceeds the resource limit"\n            ) from exc\n        except (UnicodeDecodeError, json.JSONDecodeError) as exc:\n            raise ValueError("invalid training progress file") from exc\n'''
          count = source.count(old)
          if count == 0 and new in source:
              print("Repair already present; nothing to apply.")
          elif count == 1:
              path.write_text(source.replace(old, new, 1), encoding="utf-8", newline="\n")
          else:
              raise SystemExit(f"expected exactly one decoder marker, found {count}")

      - name: Focused Training progress recursion regression
        run: python -m unittest -v tests.test_training_progress_json_prehash_bounds_current

      - name: Compile persistence boundary
        run: python -m py_compile acs/training_progress_store.py tests/test_training_progress_json_prehash_bounds_current.py

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- acs/training_progress_store.py; then
            echo 'Runtime repair already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acs/training_progress_store.py
          git commit -m 'fix: fail closed on Training progress JSON recursion'
          git push origin HEAD:fix/training-progress-recursion-failclosed-20261005-a7q9
