name: D04 ChessBase Integrity Handle Identity

on:
  push:
    branches:
      - work/d04-classic-chessbase-handle-identity-20260907
  pull_request:
    paths:
      - '.github/workflows/d04-chessbase-integrity-handle-identity.yml'
      - 'acs/chessbase_integrity.py'
      - 'tests/test_d04_chessbase_integrity_handle_identity.py'

permissions:
  contents: read

concurrency:
  group: d04-chessbase-integrity-handle-identity-${{ github.ref }}
  cancel-in-progress: true

env:
  D04_BASE: 9ac0600bf9d270e02334df1657c1ccc941f909b5

jobs:
  handle-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned test dependency
        run: python -m pip install -q pytest==8.4.2

      - name: Prove ancestry and narrow D04 scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$D04_BASE" HEAD
          git diff --check "$D04_BASE" HEAD
          changed="$(git diff --name-only "$D04_BASE" HEAD | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/d04-chessbase-integrity-handle-identity.yml \
            acs/chessbase_integrity.py \
            tests/test_d04_chessbase_integrity_handle_identity.py | sort)"
          test "$changed" = "$allowed" || {
            printf 'Unexpected D04 scope:\n%s\n' "$changed" >&2
            exit 1
          }
          test "$(git rev-parse HEAD:acs/chessbase_integrity.py)" = "21c7b1a6bbc7a0f8d64c5d2e3d739ec23dc922cc"
          test "$(git rev-parse HEAD:tests/test_d04_chessbase_integrity_handle_identity.py)" = "374d233142ae98bd2c76ca3a10e0f4b80d45bc3d"

      - name: Compile affected Python
        run: python -m compileall -q acs/chessbase_integrity.py tests/test_chessbase_integrity.py tests/test_import_contract.py tests/test_d04_chessbase_integrity_handle_identity.py

      - name: Focused identity and integrity regressions
        run: python -m unittest -v tests.test_d04_chessbase_integrity_handle_identity tests.test_chessbase_integrity tests.test_import_contract

      - name: Focused pytest parity
        run: python -m pytest -q tests/test_d04_chessbase_integrity_handle_identity.py tests/test_chessbase_integrity.py tests/test_import_contract.py

      - name: Full unittest regression
        run: python -m unittest discover -s tests -v

      - name: Full pytest regression
        run: python -m pytest -q
