name: Current Book Presenter Passive Ingress

on:
  pull_request:
    branches:
      - converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb
    paths:
      - 'acs/full_product_presenters.py'
      - 'acs/book_webview_projection.py'
      - 'acs/book_webview_bridge.py'
      - 'tests/test_book_presenter_passive_ingress.py'
      - '.github/workflows/current-book-presenter-passive-ingress.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-book-presenter-passive-ingress-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove exact serial geometry and bounded scope
        shell: bash
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          expected="${EVENT_HEAD_SHA:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$expected"

          base_ref="${EVENT_BASE_REF:-converge/current-shipping-recovery-hardening-v2-20261006-c2mbezb}"
          git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
          live_base="$(git rev-parse "refs/remotes/origin/$base_ref")"
          if [ -n "${EVENT_BASE_SHA:-}" ]; then
            test "$EVENT_BASE_SHA" = "$live_base"
          fi

          test "$(git merge-base "$live_base" HEAD)" = "$live_base"
          git diff --check "$live_base"...HEAD

          changed="$(git diff --name-only "$live_base"...HEAD | sort)"
          expected_paths="$(printf '%s\n' \
            '.github/workflows/current-book-presenter-passive-ingress.yml' \
            'acs/book_webview_bridge.py' \
            'acs/book_webview_projection.py' \
            'acs/full_product_presenters.py' \
            'tests/test_book_presenter_passive_ingress.py' | sort)"
          test "$changed" = "$expected_paths" || {
            printf 'Unexpected Book presenter ingress scope:\n%s\n' "$changed" >&2
            exit 1
          }

          test "$(git hash-object acs/full_product_presenters.py)" = "846ff4ce87953c65d21c2471eeefc580c25ea32b"
          test "$(git hash-object acs/book_webview_projection.py)" = "3422067d3d6ddebdc8f691779e6bd5a01aea5c30"
          test "$(git hash-object acs/book_webview_bridge.py)" = "6b2c17bbc898b014080b5ae32028e8ca99ed1de1"
          test "$(git hash-object tests/test_book_presenter_passive_ingress.py)" = "22b72a5fb2200f3ac7714ee05c2c79f4ef2072a4"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Compile presentation boundary
        run: >-
          python -m compileall -q
          acs/full_product_presenters.py
          acs/book_webview_projection.py
          acs/book_webview_bridge.py
          tests/test_book_presenter_passive_ingress.py

      - name: Execute Books presentation and workflow regressions
        run: >-
          python -m unittest -v
          tests.test_book_presenter_passive_ingress
          tests.test_dev1_books_training_webview_projection
          tests.test_dev1_full_product_ui_packages
          tests.test_v2_book_board_workflow
          tests.test_full_product_book_command_authority

      - name: Core selftest
        run: python -m acs.selftest
