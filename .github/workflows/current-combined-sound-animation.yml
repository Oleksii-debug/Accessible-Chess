name: Current Combined Sound Animation

on:
  push:
    branches:
      - work/user-corpus-pgn-cp1251-20261003
  pull_request:

permissions:
  contents: read

concurrency:
  group: current-combined-sound-animation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sound-animation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'

      - name: Prove exact sound lineage is inherited
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/work/user-sound-pack-integration-20261003:refs/remotes/origin/current-sound
          sound_head="$(git rev-parse refs/remotes/origin/current-sound)"
          git merge-base --is-ancestor "$sound_head" HEAD
          test "$(git merge-base "$sound_head" HEAD)" = "$sound_head"

      - name: Compile current sound and visual sequence
        run: >-
          python -m py_compile
          acs/sound.py
          acs/sound_events.py
          acs/sound_runtime.py
          acs/sound_windows.py
          acs/release_app.py
          acs/stage1_release_ui_core.py
          acs/version2_release_payload.py
          acs/version2_package_preflight.py
          scripts/build_user_sound_pack.py
          tests/test_user_sound_pack_builder.py
          tests/test_sound_runtime.py
          tests/test_stage1_release_composition_ui.py
          tests/test_version2_release_payload.py
          tests/test_version2_package_preflight.py

      - name: Validate visual animation script
        run: node --check web/stage1_release_bootstrap.js

      - name: Sound pack, 32-impact animation and package regressions
        run: >-
          python -m unittest -v
          tests.test_user_sound_pack_builder
          tests.test_sound_runtime
          tests.test_sound_events
          tests.test_settings
          tests.test_stage1_release_composition_ui
          tests.test_stage1_engine_play_ui
          tests.test_version2_release_payload
          tests.test_version2_package_preflight

      - name: Exact whitespace check
        shell: bash
        run: git diff --check
